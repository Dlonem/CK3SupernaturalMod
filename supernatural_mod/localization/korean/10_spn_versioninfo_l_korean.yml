 spn_versioninfo.1000.t:0 "Supernatural: Version 2.31b Info"

 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.31b#!\nA compatibility and bug-hunting pass. To support the mod,\nsearch #high \"Dlonem\"#! on YouTube and subscribe.\n\n#high 2.31b – Fixes:#!\n$BULLET_WITH_TAB$Dragons can no longer be turned, compelled or cursed.\n$BULLET_WITH_TAB$Wights, Others and the Night King are excluded too.\n$BULLET_WITH_TAB$Spymasters can uncover every secret type again, not 4.\n$BULLET_WITH_TAB$Perk point alerts work for the four creature focuses.\n$BULLET_WITH_TAB$The Magic Council's host arrives at full strength.\n$BULLET_WITH_TAB$Dark temples no longer error for landless casters.\n$BULLET_WITH_TAB$130 spell tooltips showed a raw key. They read now.\n$BULLET_WITH_TAB$The eight Originals use AGOT's current portrait genes.\n$BULLET_WITH_TAB$Supernaturals keep modern hair, and never go bald.\n\n#high 2.31b – Changes:#!\n$BULLET_WITH_TAB$Yearly NPC sweeps no longer walk everyone at once.\n$BULLET_WITH_TAB$A duplicate on_action warning at load is gone.\n\n#high 2.31a – Fixes:#!\n$BULLET_WITH_TAB$Master of Shadows and Vampire Nest can be clicked.\n$BULLET_WITH_TAB$Two hunter perks had the same fault and are fixed too.\n$BULLET_WITH_TAB$A quarter of NPC werewolves were spawning as vampires.\n$BULLET_WITH_TAB$Scholarly education returns its 2 lost domain slots.\n$BULLET_WITH_TAB$Pregnancy no longer drops to 5% after one child.\n$BULLET_WITH_TAB$Demon-blooded children grow into demons in their 20s.\n$BULLET_WITH_TAB$All ten vanilla secret descriptions load again.\n$BULLET_WITH_TAB$Set Visual Age no longer resets on your next birthday.\n$BULLET_WITH_TAB$Werewolves in glabro form are detected properly again.\n$BULLET_WITH_TAB$Vampires, werewolves and hybrids resist disease again.\n$BULLET_WITH_TAB$Consumption is cured on turning, like every illness.\n\n#high 2.31a – Changes:#!\n$BULLET_WITH_TAB$A werewolf bite festers one to three years first.\n$BULLET_WITH_TAB$Survive a Lycan and a Hunter may spare you.\n$BULLET_WITH_TAB$The peddler's elixir no longer says what you become.\n$BULLET_WITH_TAB$Feeding invites only reach those who could know.\n$BULLET_WITH_TAB$Map-wide character sweeps replaced with cheap ones.\n\n#high Reported by:#!\nCleverPolarBear, Lord Zymeth, Noa3, ТоЬЬыэЯ, Omni,\nAngel DeStaar, Explode_Toad, manic_Mage, AZTRAGOS,\nvaldijan72, Dr. Baphomet.\n\n#high Load order with AGOT:#!\nAGOT, AGOT submods, The Long Night & Azor Ahai (optional),\nSupernatural, then the Compatibility Patch – always last.\n\n#high Thanks for the support,#!\nDlonem"

 spn_versioninfo.1000.a:0 "Begin"
 spn_versioninfo.1000.a.tt:0 "Close this prompt and begin the game."
