 spn_became_hunter_memory:0 "was trained as a hunter"
 spn_became_hunter_memory_desc:0 "[trainer.GetTitledFirstName] showed me what walks among us at night, and how to put it down. I have not slept easily since"
 spn_became_hunter_memory_desc_second_perspective:0 "[trainer.GetTitledFirstName] showed you what walks among us at night, and how to put it down. You have not slept easily since"
 spn_became_hunter_memory_desc_third_perspective:0 "[trainer.GetTitledFirstName] showed [owner.GetName] what walks among us at night, and how to put it down. [owner.GetSheHe|U] has not slept easily since"
 spn_woke_a_hunter_memory:0 "took up the hunt"
 spn_woke_a_hunter_memory_desc_1:0 "I saw something that night that should not exist, and I decided that it would not exist for long. I taught myself the rest"
 spn_woke_a_hunter_memory_desc_2:0 "nobody trained me. I learned what the monsters were the hard way, and I learned how to kill them the same way"
 spn_woke_a_hunter_memory_desc_3:0 "I took up the hunt on my own. Silver, fire, a sharpened stake, and the patience to wait for dark"
 spn_woke_a_hunter_memory_desc_1_second_perspective:0 "you saw something that night that should not exist, and you decided that it would not exist for long. You taught yourself the rest"
