 spn_woke_a_hybrid_memory:0 "woke with two bloods"
 spn_woke_a_hybrid_memory_desc_1:0 "I died with the wolf in me and something else besides, and I woke with both. I never learned whose blood it was"
 spn_woke_a_hybrid_memory_desc_2:0 "the wolf should have died with me. It did not, and neither did I, and there was a new thirst beside it"
 spn_woke_a_hybrid_memory_desc_3:0 "I woke with my heart stopped and the wolf still pacing inside me. Whoever gave me the blood did not stay to explain"
 spn_woke_a_hybrid_memory_desc_1_second_perspective:0 "you died with the wolf in you and something else besides, and you woke with both. You never learned whose blood it was"
