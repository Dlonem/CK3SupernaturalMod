 spn_killed_the_hunter_memory:0 "killed a hunter"
 spn_killed_the_hunter_memory_desc:0 "someone came for me with a stake and a steady hand. I killed them before they could use either. The first of them, I expect, and not the last"
 spn_killed_the_hunter_memory_desc_second_perspective:0 "someone came for you with a stake and a steady hand. You killed them before they could use either. The first of them, you expect, and not the last"
 spn_killed_the_hunter_memory_desc_third_perspective:0 "someone came for [owner.GetName] with a stake and a steady hand. [owner.GetSheHe|U] killed them before they could use either"
 spn_escaped_the_hunter_memory:0 "outran a hunter"
 spn_escaped_the_hunter_memory_desc:0 "someone came for me with a stake and a steady hand. I ran, and I did not stay to learn their name. Somebody knows what I am"
