 spn_became_hybrid_memory:0 "was made a hybrid"
 spn_became_hybrid_memory_desc:0 "[maker.GetTitledFirstName] gave me [maker.GetHerHis] blood while the wolf was still in me. I died with both, and I rose with both"
 spn_became_hybrid_memory_desc_second_perspective:0 "[maker.GetTitledFirstName] gave you [maker.GetHerHis] blood while the wolf was still in you. You died with both, and you rose with both"
 spn_became_hybrid_memory_desc_third_perspective:0 "[maker.GetTitledFirstName] gave [owner.GetName] blood while the wolf was still in [owner.GetHerHim]. [owner.GetSheHe|U] died with both, and rose with both"
