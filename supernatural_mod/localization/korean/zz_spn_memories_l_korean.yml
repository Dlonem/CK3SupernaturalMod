l_korean:
 spn_became_vampire_memory:0 "was made a vampire"
 spn_became_vampire_memory_desc:0 "[maker.GetTitledFirstName] gave me [maker.GetHerHis] blood, and I died with it in me. I did not stay dead"
 spn_became_vampire_memory_desc_second_perspective:0 "[maker.GetTitledFirstName] gave you [maker.GetHerHis] blood, and you died with it in you. You did not stay dead"
 spn_became_vampire_memory_desc_third_perspective:0 "[maker.GetTitledFirstName] gave [owner.GetName] blood, and [owner.GetSheHe] died with it in [owner.GetHerHim]. [owner.GetSheHe|U] did not stay dead"
 spn_became_vampire_memory_desc_forced:0 "[maker.GetTitledFirstName] held something over me, and I drank because I had no choice. Then I died, and I did not stay dead"
 spn_became_vampire_memory_desc_forced_second_perspective:0 "[maker.GetTitledFirstName] held something over you, and you drank because you had no choice. Then you died, and you did not stay dead"
 spn_became_vampire_memory_desc_forced_third_perspective:0 "[maker.GetTitledFirstName] held something over [owner.GetName], and [owner.GetSheHe] drank because [owner.GetSheHe] had no choice. Then [owner.GetSheHe] died, and did not stay dead"
 spn_woke_a_vampire_memory:0 "woke a vampire"
 spn_woke_a_vampire_memory_desc_1:0 "I died, and I woke, and the thirst was already waiting. I never learned whose blood it was"
 spn_woke_a_vampire_memory_desc_2:0 "the last thing I remember is the dark. The first thing after it is the hunger. Nobody ever told me how"
 spn_woke_a_vampire_memory_desc_3:0 "I woke cold, with my heart stopped and my senses on fire. Whoever did this to me did not stay to explain"
 spn_woke_a_vampire_memory_desc_1_second_perspective:0 "you died, and you woke, and the thirst was already waiting. You never learned whose blood it was"
 spn_woke_a_vampire_memory_desc_2_second_perspective:0 "the last thing you remember is the dark. The first thing after it is the hunger. Nobody ever told you how"
 spn_woke_a_vampire_memory_desc_3_second_perspective:0 "you woke cold, with your heart stopped and your senses on fire. Whoever did this to you did not stay to explain"
 spn_woke_a_vampire_memory_desc_1_third_perspective:0 "[owner.GetName] died, and woke, and the thirst was already waiting. [owner.GetSheHe|U] never learned whose blood it was"
 spn_woke_a_vampire_memory_desc_2_third_perspective:0 "the last thing [owner.GetName] remembers is the dark. The first thing after it is the hunger. Nobody ever told [owner.GetHerHim] how"
 spn_woke_a_vampire_memory_desc_3_third_perspective:0 "[owner.GetName] woke cold, with [owner.GetHerHis] heart stopped and [owner.GetHerHis] senses on fire. Whoever did it did not stay to explain"
 spn_rose_in_battle_memory:0 "died in battle and rose"
 spn_rose_in_battle_memory_desc:0 "I fell on the field with vampire blood in me. They carried me off as a corpse. Three days later I opened my eyes"
 spn_rose_in_battle_memory_desc_second_perspective:0 "you fell on the field with vampire blood in you. They carried you off as a corpse. Three days later you opened your eyes"
 spn_rose_in_battle_memory_desc_third_perspective:0 "[owner.GetName] fell on the field with vampire blood in [owner.GetHerHim]. They carried [owner.GetHerHim] off as a corpse. Three days later [owner.GetSheHe] opened [owner.GetHerHis] eyes"
 spn_became_werewolf_memory:0 "was clawed and turned"
 spn_became_werewolf_memory_desc:0 "[clawer.GetTitledFirstName] opened my arm with [clawer.GetHerHis] claws, and I let [clawer.GetHerHim]. The wound closed. The wolf did not"
 spn_became_werewolf_memory_desc_second_perspective:0 "[clawer.GetTitledFirstName] opened your arm with [clawer.GetHerHis] claws, and you let [clawer.GetHerHim]. The wound closed. The wolf did not"
 spn_became_werewolf_memory_desc_third_perspective:0 "[clawer.GetTitledFirstName] opened [owner.GetNamePossessive] arm with [clawer.GetHerHis] claws, and [owner.GetSheHe] let [clawer.GetHerHim]. The wound closed. The wolf did not"
 spn_became_werewolf_memory_desc_forced:0 "[clawer.GetTitledFirstName] pinned me and opened my arm with [clawer.GetHerHis] claws. I fought. It did not matter. The wound closed. The wolf did not"
 spn_became_werewolf_memory_desc_forced_second_perspective:0 "[clawer.GetTitledFirstName] pinned you and opened your arm with [clawer.GetHerHis] claws. You fought. It did not matter. The wound closed. The wolf did not"
 spn_became_werewolf_memory_desc_forced_third_perspective:0 "[clawer.GetTitledFirstName] pinned [owner.GetName] and opened [owner.GetHerHis] arm with [clawer.GetHerHis] claws. [owner.GetSheHe|U] fought. It did not matter. The wound closed. The wolf did not"
 spn_woke_a_werewolf_memory:0 "the wolf woke"
 spn_woke_a_werewolf_memory_desc_born:0 "I was born with the wolf already in my blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_born_second_perspective:0 "you were born with the wolf already in your blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_born_third_perspective:0 "[owner.GetName] was born with the wolf already in [owner.GetHerHis] blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_1:0 "the wolf woke in me one night, and I never learned who put it there"
 spn_woke_a_werewolf_memory_desc_2:0 "I came round on the floor with my clothes torn and my mouth full of blood that was not mine. Nobody had to tell me what I was"
 spn_woke_a_werewolf_memory_desc_3:0 "it came on with the fever and it never left. I could not say who gave it to me"
 spn_woke_a_werewolf_memory_desc_1_second_perspective:0 "the wolf woke in you one night, and you never learned who put it there"
