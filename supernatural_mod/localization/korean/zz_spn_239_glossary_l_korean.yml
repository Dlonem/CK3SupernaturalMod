l_korean:
 spn_gloss_vade_maecum:0 "#bold Vade Maecum Infernal#! - Latin, #EMP go with me#!, #EMP from below#!: a handbook carried everywhere. This one was a demon's. See [spn_vade_maecum|E]."
 spn_gloss_fors_factorum:0 "#bold Fors Factorum#! - Latin, #EMP the fortune of deeds#!. Magic that costs nothing when it is cast. See [spn_order_fors_factorum|E]."
 spn_gloss_respondeo:0 "#bold Respondeo#! - Latin, #EMP I answer#!. See [spn_respondeo|E]."
 spn_gloss_invocare:0 "#bold Invocare#! - Latin, #EMP to call upon#!."
 spn_gloss_imperium:0 "#bold Imperium#! - Latin, #EMP command#!: the power to act without asking, which Rome gave its highest officers."
 spn_gloss_hermetic:0 "#bold Hermetic#! - after #EMP Hermes Trismegistus#!, thrice-great Hermes, the legendary teacher of the hidden arts. Later the word also came to mean #EMP sealed tight#!."
 spn_gloss_collegium:0 "#bold Collegium#! - Latin, #EMP a fellowship#!: a body of colleagues, and the old word for a college of learning."
 spn_gloss_ex_tenebris_lux:0 "#bold Ex tenebris lux#! - Latin, #EMP out of the darkness, light#!."
 spn_gloss_neophyte:0 "#bold Neophyte#! - from the Greek, #EMP newly planted#!: one who has answered the note and is being tested. See [spn_order_ranks|E]."
 spn_gloss_medicum:0 "#bold Medicum#! - from the Latin #EMP medicus#!, a healer: in the Order, the rank of those who teach the acolytes. See [spn_order_ranks|E]."
 spn_gloss_magistratus:0 "#bold Magistratus#! - Latin, #EMP an office, and the one who holds it#!: a magistrate. See [spn_order_ranks|E]."
