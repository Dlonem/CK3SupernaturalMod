l_korean:
 spn_debug_events.0400.t:0 "Debug: Join a Chapter"
 spn_debug_events.0400.desc:0 "Makes you a Mage if you are not one, and a Medicum of a chapter in your reach (any chapter if none is)."
 spn_debug_events.0400.a:0 "Do it"
 spn_debug_events.0401.t:0 "Debug: Found a Chapter Here"
 spn_debug_events.0401.desc:0 "Makes you a Mage if you are not one, and the Temple Magus of a new chapter at your seat. The Mask of the Temple follows."
 spn_debug_events.0401.a:0 "Do it"
 spn_debug_events.0402.t:0 "Debug: Give Me a Relic"
 spn_debug_events.0402.desc:0 "Makes a relic in your inventory. The Seal of Solomon is moved to you if it exists, else made."
 spn_debug_events.0403.t:0 "Debug: Give Me Pages"
 spn_debug_events.0403.desc:0 "Moves a page of the Vade Maecum to you, or makes it if it is not in the world. A page that is bound, burned or in a hide is skipped."
 spn_debug_events.0404.t:0 "Debug: Set My Standing"
 spn_debug_events.0404.desc:0 "Sets your standing in the Order."
 spn_debug_events.0405.t:0 "Debug: Run the Selection"
 spn_debug_events.0405.desc:0 "Runs this year's Selection now, and the Bargain's walk with it."
 spn_debug_events.0405.a:0 "Run it"
 spn_debug_events.0406.t:0 "Debug: Summon Zecchia"
 spn_debug_events.0406.desc:0 "Teaches you Zecchia's name, frees her if she is busy, and calls her."
 spn_debug_events.0406.a:0 "Call her"
 spn_debug_events.0407.t:0 "Debug: Make My House a Coven"
 spn_debug_events.0407.desc:0 "Makes you and two adult members of your house witches, and your house a coven."
 spn_debug_events.0407.a:0 "Do it"
 spn_debug_events.0408.t:0 "Debug: Move the Contract On a Year"
 spn_debug_events.0408.desc:0 "Takes a year off your running Contract with the book."
 spn_debug_events.0408.a:0 "Do it"
 spn_debug_events.0409.t:0 "Debug: List the Chapters"
 spn_debug_events.0409.desc:0 "Writes every chapter head and chapter to game.log."
 spn_debug_events.0409.a:0 "Write it"
 spn_debug_events.0410.t:0 "Debug: End My Loans"
 spn_debug_events.0410.desc:0 "Ends every loan you made or took, as if three years had passed."
 spn_debug_events.0410.a:0 "Do it"
 spn_debug_events.0411.t:0 "Debug: Run the Vade's Year"
 spn_debug_events.0411.desc:0 "Runs the book's yearly pass now."
 spn_debug_events.0411.a:0 "Run it"
 spn_debug_events.0412.t:0 "Debug: Run My Chapter's Year"
 spn_debug_events.0412.desc:0 "Runs your chapter's year now."
 spn_debug_events.0412.a:0 "Run it"
 spn_debug_events.0413.t:0 "Debug: Cancer and Five Volunteers"
 spn_debug_events.0413.desc:0 "Gives you cancer, and adds five AI members of your chapter to your court who will volunteer."
 spn_debug_events.0413.a:0 "Do it"
 spn_debug_events.0414.t:0 "Debug: Kill One of My Carriers"
 spn_debug_events.0414.desc:0 "Kills one of the five who carry your illness. The killer is a wolf at your court if there is one, else you."
 spn_debug_events.0414.a:0 "Do it"
 spn_debug_events.0415.t:0 "Debug: Make Me the Master"
 spn_debug_events.0415.desc:0 "Makes you the master of the Order and opens The Order's Prerogative."
 spn_debug_events.0415.a:0 "Do it"
 spn_debug_events.0416.t:0 "Debug: Make Me a Demon"
 spn_debug_events.0416.desc:0 "Runs Witchcraft's own demon transformation on you."
 spn_debug_events.0416.a:0 "Do it"
 spn_debug_events.0417.t:0 "Debug: Call My Favor"
 spn_debug_events.0417.desc:0 "Calls the favor you owe the Order now."
 spn_debug_events.0417.a:0 "Do it"
 spn_debug_events.0418.t:0 "Debug: Kill the Grand Magus"
 spn_debug_events.0418.desc:0 "The Grand Magus dies."
 spn_debug_events.0418.a:0 "Do it"
 spn_debug_events.0419.t:0 "Debug: The Fors Factorum"
 spn_debug_events.0419.desc:0 "Teaches you the Fors Factorum and brings its price now."
 spn_debug_events.0419.a:0 "Do it"
 spn_debug_events.0402.glove:0 "The Glove"
 spn_debug_events.0402.necrophone:0 "The Necrophone"
 spn_debug_events.0402.blade:0 "The Enchanted Blade"
 spn_debug_events.0402.pendant:0 "The Echo Pendant"
 spn_debug_events.0402.powder:0 "Obfuscation Powder"
 spn_debug_events.0402.mirror:0 "The Mirror Shard"
 spn_debug_events.0402.bell:0 "The Bell of the Dead Hour"
 spn_debug_events.0402.seal:0 "The Seal of Solomon"
 spn_debug_events.0403.one:0 "Page one"
 spn_debug_events.0403.all:0 "All four"
 spn_debug_events.0404.a:0 "25"
 spn_debug_events.0404.b:0 "50"
 spn_debug_events.0404.c:0 "75"
 spn_debug_events.0404.d:0 "100"
 spn_zecchia_name:0 "Zecchia"
