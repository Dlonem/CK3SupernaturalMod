l_korean:
 spn_hide.2100.t:0 "Across the Field"
 spn_hide.2100.desc:0 "Through the smoke and the press of men you catch it: another hide, worn by [spn_hduel_other.GetShortUIName]. It has caught you too. "
 spn_hide.2100.a:0 "Go for the throat."
 spn_hide.2100.b:0 "Wear it down."
 spn_hide.2100.c:0 "Slip away into the fighting."
 spn_hide.2101.t:0 "It Comes for You"
 spn_hide.2101.desc:0 "[spn_hduel_other.GetShortUIName|U] is coming across the field toward you, and the men in between are getting out of the way. "
 spn_hide.2101.throat:0 "It is going for your throat. "
 spn_hide.2101.a:0 "Meet it head on."
 spn_hide.2101.b:0 "Hold your ground."
 spn_hide.2101.c:0 "Break away."
 spn_hide.2102.t:0 "It Is Running"
 spn_hide.2102.desc:0 "The other hide has turned away from you and is losing itself in the battle. [spn_hduel_other.GetShortUIName|U] is trying to get clear before you can reach [spn_hduel_other.GetHerHim]."
 spn_hide.2102.hurt:0 " [spn_hduel_other.GetSheHe|U] is already hurt."
 spn_hide.2102.a:0 "Run it down."
 spn_hide.2102.b:0 "Let it go."
 spn_hide.2103.t:0 "Your Wolf Has Seen Another"
 spn_hide.2103.desc:0 "A rider comes back from the line. [spn_hduel_a.GetShortUIName|U] has seen another hide on the field, worn by [spn_hduel_b.GetShortUIName], and is holding the wolf back until you give the word. "
 spn_hide.2103.a:0 "Let [spn_hduel_a.GetHerHim] go."
 spn_hide.2103.a.tt:0 "[spn_hduel_a.GetShortUIName|U] goes after the other hide. If [spn_hduel_a.GetSheHe] loses, [spn_hduel_a.GetSheHe] may not come back."
 spn_hide.2103.b:0 "Call [spn_hduel_a.GetHerHim] back."
 spn_hide.2103.b.tt:0 "[spn_hduel_a.GetShortUIName|U] does not go after it."
 spn_hide_duel_sees_silverback:0 "It is Silverback, grey as smoke and bigger than any wolf has a right to be."
 spn_hide_duel_sees_timber:0 "It is Timber, brown as bark. You only see it because it let you."
 spn_hide_duel_sees_tundra:0 "It is Tundra, white as snow, and it is watching you, not the battle."
 spn_hide_duel_sees_graybeard:0 "It is Graybeard, ash-grey and scarred, and it has not taken a step back all day."
 spn_hide_duel_sees_midnight:0 "It is Midnight, black, and it is coming through the line as if the line were not there."
 spn_hide_duel_sees_alpha:0 "It is Alpha, red-brown and huge, and the men around it fight harder for it."
 spn_hide_duel_lean_strong:0 "\n\nYou are the stronger. Your hide knows it, and so does the other."
 spn_hide_duel_lean_even:0 "\n\nNeither of you has the better of it."
 spn_hide_duel_lean_weak:0 "\n\nIt is the stronger, and your hide knows it."
 spn_hide_duel_knight_lean_strong:0 "\n\nYour [spn_champion|E] is the stronger of the two."
 spn_hide_duel_knight_lean_even:0 "\n\nThe two are evenly matched."
 spn_hide_duel_knight_lean_weak:0 "\n\nThe other is the stronger."
 spn_hide_duel_wanted:0 "\n\nYou know that hide. By rights it should be in your family's keeping."
 spn_hide_duel_throat_tt:0 "If you win, it may not get up again. If you lose, neither may you. Unless you are much the stronger, you will not come out of it unhurt."
 spn_hide_duel_wear_tt:0 "You mean to put it on the ground, not to kill it. If neither of you goes for the throat, only a wolf who is already badly hurt dies of it."
 spn_hide_duel_wear_vs_throat_tt:0 "It is going for your throat. Whatever you do now, this fight can kill either of you."
 spn_hide_duel_slip_tt:0 "You try to lose yourself among the men. It may see you go and come after you."
 spn_hide_duel_break_tt:0 "You turn and run. It may catch you, and a wolf caught turning fights at a disadvantage."
 spn_hide_duel_chase_tt:0 "It may still get away from you."
 spn_hide_duel_let_go_tt:0 "It goes, and you go back to the battle."
 spn_hide_duel_runner_wounded_tt:0 "It is already hurt."
 spn_hide_duel_timber_tt:0 "Timber knows how to disappear."
 spn_hide_duel_midnight_tt:0 "Midnight does not let go of a scent."
 spn_hide_duel_slipped_t:0 "Lost in the Fighting"
 spn_hide_duel_slipped_tt:0 "You lost it in the fighting."
 spn_hide_duel_leave_won_t:0 "Your Wolf Came Back"
 spn_hide_duel_leave_won_tt:0 "[spn_hduel_a.GetShortUIName|U] beat [spn_hduel_b.GetShortUIName] on the field."
 spn_hide_duel_leave_won_kill_tt:0 "[spn_hduel_a.GetShortUIName|U] killed [spn_hduel_b.GetShortUIName] on the field."
 spn_hide_duel_leave_lost_t:0 "Your Wolf Came Back Hurt"
 spn_hide_duel_leave_lost_tt:0 "[spn_hduel_b.GetShortUIName|U] had the better of [spn_hduel_a.GetShortUIName]."
 spn_hide_duel_leave_dead_t:0 "Your Wolf Did Not Come Back"
 spn_hide_duel_leave_dead_tt:0 "[spn_hduel_a.GetShortUIName|U] was killed by [spn_hduel_b.GetShortUIName] on the field."
 spn_hide_duel_leave_broke_t:0 "Lost in the Fighting"
 spn_hide_duel_leave_broke_tt:0 "[spn_hduel_a.GetShortUIName|U] and [spn_hduel_b.GetShortUIName] lost each other in the battle."
 spn_hide.0202.you_escaped:0 "\n\nYou got clear of it. The battle closed behind you, and when you looked back it was gone."
 spn_hide.0202.they_escaped:0 "\n\nIt got clear of you. The battle closed behind it, and the scent went with it."
 spn_hide.0202.won_kill:0 "\n\nIt is over quickly. [spn_hduel_other.GetShortUIName|U] does not get up, and the hide [spn_hduel_other.GetSheHe] wore is yours now."
 spn_hide.0202.won:0 "\n\nYou put [spn_hduel_other.GetHerHim] on the ground and kept [spn_hduel_other.GetHerHim] there until the fight went out of [spn_hduel_other.GetHerHim]."
 spn_hide.0202.lost:0 "\n\n[spn_hduel_other.GetSheHe|U] had the better of you. You came back to your own lines bleeding, and the hide is quiet in a way you do not like."
 spn_hide.0202.b:0 "Let [spn_hduel_other.GetHerHim] crawl back to [spn_hduel_other.GetHerHis] own."
 spn_hide.0202.b.tt:0 "The hide thinks better of you for it. Your [spn_hide_bond|E] grows a little."
 spn_hide.2110.t:0 "The Hide Speaks"
 spn_hide.2110.desc_silverback:0 "Before the first blow, the hide speaks, low and steady. It will fight if it must. It wants you to remember who is in your care, and that [spn_hs_other.GetShortUIName] may be one of them."
 spn_hide.2110.desc_timber:0 "Before the first blow, the hide speaks, and it is in no hurry. It does not care who leads. It cares that you come out of this on your own feet."
 spn_hide.2110.desc_tundra:0 "Before the first blow, the hide speaks, cold and quiet. It has already measured [spn_hs_other.GetShortUIName], and it tells you where [spn_hs_other.GetSheHe] will be slow."
 spn_hide.2110.desc_graybeard:0 "Before the first blow, the hide speaks. It does not ask whether you will win. It asks only that you do not step back."
 spn_hide.2110.desc_midnight:0 "Before the first blow, the hide is already moving under your skin. It wants this fight. It wants it fair, and it wants to win it."
 spn_hide.2110.desc_alpha:0 "Before the first blow, the hide speaks. The pack is watching, it says. Whatever happens here, they will remember how you did it."
 spn_hide.2110.weaker:0 "\n\nThen it says one thing more. [spn_hs_other.GetShortUIName|U] runs with your own pack, and is the weaker of you. It will not fight a weaker wolf of its own pack."
 spn_hide.2110.a:0 "Let it fight."
 spn_hide.2110.a.tt:0 "The hide fights with you."
 spn_hide.2110.b:0 "Hold it back."
 spn_hide.2110.b.tt:0 "You fight as a wolf, not as its [spn_champion|E]: the hide's strength stays out of this fight."
 spn_hide.2110.c:0 "Stand down."
 spn_hide.2110.c.tt:0 "There is no fight. Walking away costs you 10 [spn_pack_standing|E], and the hide thinks better of you for it."
 spn_hide_speaks_stood_t:0 "The Challenge Is Off"
 spn_hide_speaks_stood_tt:0 "[spn_hs_stood.GetShortUIName|U] stood down."
 spn_hide.0010.kin:0 "\n\nIt has been in your family before. It knew the blood before it knew you."
 spn_hide.0010.a.strength_tt:0 "The wolves who wore it before you left their strength in it. Your lycanthropy grows."
 spn_hide.0010.a.strength_perk_tt:0 "There were three or more of them. You gain a free perk point in your wolf tree."
