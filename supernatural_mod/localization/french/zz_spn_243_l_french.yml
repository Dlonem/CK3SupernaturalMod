l_french:
 spn_moment.0026.t:0 "The Hounds"
 spn_moment.0026.desc:0 "The kennel is loud until you walk in. Then every hound goes quiet and lies down, belly to the straw.\n\n[spn_wm_servant.GetFirstName] looks at the dogs, and then at you."
 spn_moment.0026.a:0 "Good dogs."
 spn_moment.0026.b:0 "They know who feeds them. Say that."
 spn_moment.0026.c:0 "I stay away from the kennels after this."
 spn_moment.0027.t:0 "The Day Before"
 spn_moment.0027.desc:0 "The moon is full tomorrow. Today the meat tastes of nothing, the hall is too loud, and your own skin sits wrong on you.\n\n[Glossary('#spn_wolf Brátt.#!','spn_gloss_wolf_bratt')]"
 spn_moment.0027.a:0 "I bar my door early."
 spn_moment.0027.b:0 "I ride out while I still can."
 spn_moment.0027.c:0 "I sit through supper. Barely."
 spn_moment.0028.t:0 "Venison"
 spn_moment.0028.desc:0 "The venison comes to the table almost raw, by some mistake in the kitchen. You have cleared the plate before anyone else has lifted a knife.\n\nThe table has noticed."
 spn_moment.0028.a:0 "I put the bone down. Slowly."
 spn_moment.0028.b:0 "I was hungry. Let them look."
 spn_moment.0028.c:0 "Bring the other haunch."
 spn_moment.0029.t:0 "Mud on the Stairs"
 spn_moment.0029.desc:0 "[spn_wm_servant.GetFirstName] is kneeling on the stair, scrubbing. The prints come in from the yard as bare feet. Halfway up they are something else.\n\n[spn_wm_servant.GetSheHe|U] has not looked up at you yet."
 spn_moment.0029.a:0 "A dog got in. That is all it was."
 spn_moment.0029.b:0 "I take the brush and finish it."
 spn_moment.0029.c:0 "You saw a dog. Say it back to me."
 spn_moment.0030.t:0 "Rain Coming"
 spn_moment.0030.desc:0 "The sky is clear, and you can smell the rain all the same. It is an hour away, perhaps less, coming in from the west.\n\nNobody else in the yard has so much as looked up."
 spn_moment.0030.a:0 "Get the hay in. Now."
 spn_moment.0030.b:0 "I say nothing and watch them run."
 spn_moment.0031.t:0 "Another Voice"
 spn_moment.0031.desc:0 "A howl comes down from the hills after dark. It is not a wolf. You know exactly what a wolf sounds like.\n\n[Glossary('#spn_wolf Eigi einn.#!','spn_gloss_wolf_einn')]"
 spn_moment.0031.a:0 "I answer it."
 spn_moment.0031.b:0 "I listen until it stops."
 spn_moment.0031.c:0 "I double the watch."
 spn_moment.0032.t:0 "The Dog's Favourite"
 spn_moment.0032.desc:0 "[spn_wm_child.GetFirstName] wants to know why the old hound follows you from room to room and will not go to anyone else.\n\n\"He growls at the priest,\" [spn_wm_child.GetSheHe] says. \"He never growls at you.\""
 spn_moment.0032.a:0 "He knows I would never hurt him."
 spn_moment.0032.b:0 "Ask him. He might tell you."
 spn_moment.0032.c:0 "Dogs know who is in charge."
 spn_moment.0033.t:0 "A Silver Cup"
 spn_moment.0033.desc:0 "A guest has brought you a gift: a drinking cup, solid silver, held out in both hands in front of the whole hall.\n\nEveryone is waiting for you to take it.\n\n[Glossary('#spn_wolf Eigi þat.#!','spn_gloss_wolf_that')]"
 spn_moment.0033.a:0 "I take it. And I smile."
 spn_moment.0033.b:0 "I am wearing gloves. I take it."
 spn_moment.0033.c:0 "Have it melted down for the poor."
