l_french:
 spn_compel_puppet:0 "Compelled"
 spn_compel_puppet_desc:0 "A mortal whose will you have bent with Compel Mortal. They will carry out one command for you: act as them to give it. The compulsion ends with that command, and fades by itself after a month if you give none."
 spn_compel_puppet_concept_desc:0 "When your Compel Mortal takes hold, the mortal becomes your Compelled [puppet|E] for a single command. It costs 25 [Concept('vampire','Vampirism')|E], or 15 if you are a True Vampire.\n\nRight-click yourself and act as them to have them join your war, join your court, become your lover, give you a strong [hook|E] on them, tell you every secret they know, become your patron or send you their [gold|E]. Right-click someone else to have them release one of their prisoners, seize, strike or frighten that person, keep them company, seduce or romance them, plot their murder or hand them something. End Your Life and Let Them Go are on this card.\n\nUnused, the compulsion fades after a month. Some days after it ends, they realise they have not been themselves, usually because someone close to them says so, and they cannot be compelled again for three years. They learn it was you only if they already know what you are."
 spn_compel_take_hold_tt:0 "[recipient.GetShortUIName|U] becomes your Compelled [puppet|E] for one command. Act as [recipient.GetHerHim] to give it. Unused, the compulsion fades after a month."
 spn_compel_cost_tt:0 "You need 25 [Concept('vampire','Vampirism')|E], or 15 as a True Vampire"
 spn_compel_holding_one_tt:0 "You already hold someone compelled: give them their command, or let them go from your Puppets list"
 spn_compel_player_tt:0 "[recipient.GetShortUIName|U] is played by another person, and their will is their own"
 spn_compel_wary_tt:0 "[recipient.GetShortUIName|U] is Wary: [recipient.GetSheHe] knows [recipient.GetSheHe] was not [recipient.GetHerHim]self for a time, and [recipient.GetHerHis] mind is on its guard"
 spn_compel_recent_tt:0 "[recipient.GetShortUIName|U] was compelled not long ago, and a mind cannot be bent again so soon"
 spn_compel_spent_tt:0 "The compulsion ends with this command."
 spn_compel_join_war_interaction:0 "Join My War"
 spn_compel_join_war_interaction_desc:0 "Have your Compelled [puppet|E] join every war you lead, on your side."
 puppet_action_description_puppet_action_spn_compel_join_war:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_join_war_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] join your wars"
 spn_compel_needs_your_war_tt:0 "You must be leading a war"
 spn_compel_own_war_tt:0 "[puppet_or_actor.GetShortUIName|U] is already fighting a war"
 spn_compel_war_ties_tt:0 "[puppet_or_actor.GetShortUIName|U] has a liege or vassal at war with you"
 spn_compel_join_court_interaction:0 "Join My Court"
 spn_compel_join_court_interaction_desc:0 "Have your Compelled [puppet|E] leave where [puppet_or_actor.GetSheHe] lives and join your court, with the family who travels with [puppet_or_actor.GetHerHim]."
 puppet_action_description_puppet_action_spn_compel_join_court:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_join_court_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] join your court"
 spn_compel_lover_interaction:0 "Become My Lover"
 spn_compel_lover_interaction_desc:0 "Have your Compelled [puppet|E] become your lover. It is not a romance, and nothing that cares for romance will count it as one."
 puppet_action_description_puppet_action_spn_compel_lover:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_lover_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] become your lover"
 spn_compel_not_family_tt:0 "[puppet_or_actor.GetShortUIName|U] is your close family"
 spn_compel_obey_interaction:0 "Do What I Say"
 spn_compel_obey_interaction_desc:0 "Bend your Compelled [puppet|E] for good: you gain a strong [hook|E] on [puppet_or_actor.GetHerHim]. Costs 10 more [Concept('vampire','Vampirism')|E]."
 puppet_action_description_puppet_action_spn_compel_obey:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_obey_interaction')]#! [interaction|E] on yourself to gain a strong [hook|E] on your Compelled [puppet|E]"
 spn_compel_extra_10_tt:0 "You need 10 more [Concept('vampire','Vampirism')|E]"
 spn_compel_has_hook_tt:0 "You already hold a strong [hook|E] on [puppet_or_actor.GetShortUIName]"
 spn_compel_secrets_interaction:0 "Tell Me Your Secrets"
 spn_compel_secrets_interaction_desc:0 "Have your Compelled [puppet|E] tell you every [secret|E] [puppet_or_actor.GetSheHe] keeps, and every secret [puppet_or_actor.GetSheHe] knows about others."
 puppet_action_description_puppet_action_spn_compel_secrets:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_secrets_interaction')]#! [interaction|E] on yourself to learn every [secret|E] your Compelled [puppet|E] knows"
 spn_compel_secrets_tt:0 "They tell you every [secret|E] they keep and every secret they know about others."
 spn_compel_secrets_told_tt:0 "They told you everything they knew, and some of it was new to you."
 spn_compel_secrets_none_tt:0 "They told you everything they knew. None of it was new to you."
 spn_compel_patron_interaction:0 "Become My Patron"
 spn_compel_patron_interaction_desc:0 "Have your Compelled [puppet|E] become one of your contacts, someone your camp can call on."
 puppet_action_description_puppet_action_spn_compel_patron:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_patron_interaction')]#! [interaction|E] on yourself to make your Compelled [puppet|E] your contact"
 spn_compel_already_contact_tt:0 "[puppet_or_actor.GetShortUIName|U] is already your contact"
 spn_compel_release_interaction:0 "Release Them"
 spn_compel_release_interaction_desc:0 "Have your Compelled [puppet|E] open the cell and let [recipient.GetShortUIName] go."
 puppet_action_description_puppet_action_spn_compel_release:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_release_interaction')]#! [interaction|E] on one of your Compelled [puppet|E]'s prisoners to set them free"
 spn_compel_end_life_decision:0 "End Your Life"
 spn_compel_end_life_decision_desc:0 "Tell [ROOT.Char.GetShortUIName] to end [ROOT.Char.GetHerHis] own life. There will be a body, and you will decide in the morning what the county makes of it."
 spn_compel_end_life_decision_tooltip:0 "Your Compelled [puppet|E] ends [ROOT.Char.GetHerHis] own life. Costs 60 more [Concept('vampire','Vampirism')|E]."
 spn_compel_end_life_decision_confirm:0 "Tell Them"
 spn_compel_extra_60_tt:0 "You need 60 more [Concept('vampire','Vampirism')|E]"
 spn_compel_end_life_mp_tt:0 "The game rules forbid a death in another player's family"
 spn_compel_end_life_tt:0 "[ROOT.Char.GetShortUIName|U] ends [ROOT.Char.GetHerHis] own life."
 spn_compel_end_life_toast_tt:0 "[spn_compel_victim.GetShortUIName|U] did as you said."
 spn_compel_let_go_decision:0 "Let Them Go"
 spn_compel_let_go_decision_desc:0 "Release [ROOT.Char.GetShortUIName] from your compulsion without a command. The Vampirism you spent is not returned."
 spn_compel_let_go_decision_tooltip:0 "The compulsion on [ROOT.Char.GetShortUIName] ends."
 spn_compel_let_go_decision_confirm:0 "Let Them Go"
 spn_compel_let_go_toast_tt:0 "[spn_compel_victim.GetShortUIName|U] is no longer compelled."
 spn_compel.0001.t:0 "Not Yourself"
 spn_compel.0001.desc_told:0 "[spn_compel_teller.GetShortUIName|U] waits until we are alone, and then asks what has been the matter with me.\n\n[spn_compel_teller.GetSheHe|U] has been watching me these last weeks: the things I said, the way I looked straight through people. I have not been myself.\n\nWhen I try to remember, there is only a gap, smooth and blank, where my own reasons should be."
 spn_compel.0001.desc_alone:0 "I find a gap in my memory, smooth and blank, where my own reasons should be.\n\nSomething in these last weeks was not my own doing, and I cannot say why. I have not been myself."
 spn_compel.0001.desc_named:0 "\n\nBut I remember one thing: [spn_compel_master.GetShortUIName] looking into my eyes. And I know what [spn_compel_master.GetSheHe] is."
 spn_compel.0001.desc_unnamed:0 "\n\nSomeone did this to me. I will not let it happen again."
 spn_compel.0001.a:0 "I will be on my guard."
 spn_compel.0002.t:0 "The Compulsion Fades"
 spn_compel.0002.tt:0 "You gave [ROOT.Char.GetShortUIName] no command, and your hold on [ROOT.Char.GetHerHim] has faded."
 spn_compel_wary_modifier:0 "Wary"
 spn_compel_wary_modifier_desc:0 "This character knows they were not themselves for a time. Their mind is on its guard: they cannot be compelled while this lasts, and plots against them go a little worse."
 spn_compel_used_me_opinion:0 "Compelled Me"
