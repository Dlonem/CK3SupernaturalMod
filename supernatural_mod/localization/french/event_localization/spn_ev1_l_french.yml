l_french:
# Invitation to Satiate Thirst Activity - Ev1.01
 supernatural_ev1.01:0 "A Sealed Letter"
 supernatural_ev1.01.desc:0 "A courier has arrived with a sealed letter, with explicit instructions that the letter be delivered into your hands, and your hands only, and to destroy the letter upon the finishing of your reading.\n\nYou recognize the courier as someone who is under the employ of [host.GetName], someone who also shares your particular... appetite.\n\nUpon reading the letter, you discover that [host.GetName] is inviting you to join them during their next outing to feed on a human and believes that your participation can help things go smoothly.\n\nThis could be a great opportunity to satiate your thirst and increase your strength in the process."
 supernatural_ev1.01.a:0 "I will think about it."
 supernatural_ev1.01.a.tt:0 "You are able to join them in their feeding activity."

# No Other Vampires Arrived - Ev1.02
 supernatural_ev1.02.t:0 "A Quiet Night"
 supernatural_ev1.02.desc:0 "As the appointed night descends, no other vampires appear at the gathering. You don't interpret this as rejection but rather an affirmation of your own caution—trust among your kind is earned sparingly, and tonight, your hunger will go unnoticed by prying eyes.\n\nWith the absence of others, you savor the solitude and the freedom to indulge without interference. There are no whispers of rivalries or alliances, just the silent satisfaction of a carefully chosen prey."
 supernatural_ev1.02.a:0 "It is better this way."
 
# Host Event - Ev1.03
 supernatural_ev1.03.t:0 "The Gathering Begins"
 supernatural_ev1.03.desc:0 "The attending vampires quietly arrive at the secluded tavern, their movements silent and deliberate. The air is heavy with anticipation as each guest acknowledges the host with a subtle nod before settling into the shadows. This night promises opportunity and sustenance, though not without its risks."
 supernatural_ev1.03.a:0 "Greet the guests with warmth and camaraderie."
 supernatural_ev1.03.b:0 "Exude an air of quiet authority."
 supernatural_ev1.03.c:0 "Assess the room for any potential threats."
 supernatural_ev1.03.c_ct:0 "Unexpected developments may unfold."
 
# Monster Hunter Appears At Activity - Ev1.04
 supernatural_ev1.04.t:0 "An Unwelcome Intrusion"
 supernatural_ev1.04.desc:0 "As the gathering begins, the tavern door opens, and a lone figure enters. The atmosphere tenses as it becomes clear—a skilled monster hunter has infiltrated the meeting. Such audacity is both dangerous and insulting, demanding swift and silent action to maintain the secrecy of the night."
 supernatural_ev1.04.a:0 "Capture the hunter and deal with him discreetly."
 supernatural_ev1.04.b:0 "Quietly drain the hunter’s life and dispose of the body."
 
# Guest's Reaction to Hunter's Death - Ev1.05
 supernatural_ev1.05.t:0 "The Hunter's End"
 supernatural_ev1.05.desc:0 "The hunter’s life is ended with quiet precision, his blood drained by the host as the other vampires observe. There is no pity for one who dared to infiltrate such a gathering. Instead, the room is filled with a cold respect for the host’s efficiency, tempered with disdain for the hunter’s brazen foolishness."
 supernatural_ev1.05.a:0 "An appropriate end for such insolence."
 supernatural_ev1.05.b:0 "A necessary act to ensure the safety of all."
 supernatural_ev1.05.c:0 "Let this serve as a lesson to others."

#Mikaelson Attending Activity - Ev1.06, Ev1.07
 supernatural_ev1.06.title:0 "A Name Whispers Through Shadows"
 supernatural_ev1.06.desc:0 "The gathering is well underway, a mix of anticipation and hunger filling the air. As the host prepares to open the night, a figure enters the room with an aura of ancient power. Whispers begin to ripple among the guests. \n\nIt is said that this figure is a Mikaelson—a name shrouded in mystery and fear, rumored to be the origin of all vampirism. Whether this is truth or merely legend, the presence of a Mikaelson is undeniable, and their reputation for swift vengeance and insatiable hunger precedes them."
 supernatural_ev1.06.a:0 "Welcome them cautiously."
 supernatural_ev1.07.title:0 "The First of Their Kind"
 supernatural_ev1.07.desc:0 "As the gathering continues, the Mikaelson vampire begins to speak, their voice commanding yet oddly measured. They recount fragments of a tale, each detail delivered with precision that hints at both pride and caution. \n\n'You may not know my family, but the blood you drink carries whispers of our legacy. Long before kings and empires, we were hunters who became something more. We do not seek glory or recognition, only what is owed to us—the respect of our peers and the thrill of the hunt.' \n\nThe room falls silent, each guest absorbing the weight of their words. Is this story a warning, a declaration, or simply a moment of indulgence? The Mikaelson’s intent remains as elusive as the truth of their origins."
 supernatural_ev1.07.a:0 "Respect their presence."
 supernatural_ev1.07.b:0 "Observe their demeanor silently."
 supernatural_ev1.07.b.tt:0 "You choose to stay in the shadows, observing the Mikaelson vampire and their story with cautious interest. Perhaps their motives will reveal themselves in time."
 
# An Unexpected Dinner Guest Activity - Ev1.08
 supernatural_ev1.08.title:0 "An Unexpected Dinner Guest"
 supernatural_ev1.08.desc:0 "As the group gathers in the dimly lit tavern, the door creaks open to reveal an injured man stumbling inside. One of the attendees instinctively helps him, much to the concern of the tavern owner. With extra gold to ensure discretion, the group secures the wine cellar to 'tend' to the man — though his true fate lies in the hands of his enigmatic hosts."
 supernatural_ev1.08.a:0 "Feed on him, his life shall sustain us."
 supernatural_ev1.08.b:0 "Heal him — this night must remain free of complications."
 supernatural_ev1.08.c:0 "Control your hunger — feed and heal him, ensuring no trace is left behind."
 
# Tavern Game of Wits - Ev1.09
 supernatural_ev1.09.title:0 "A Game of Wits"
 supernatural_ev1.09.desc:0 "After a long night of searching the darkened streets, you retreat to the solace of a dimly lit tavern. The air is thick with pipe smoke and stale ale.\n\nIn the corner, a group of rowdy patrons are engaged in a game of riddles and wit. One of them, eyes gleaming with mischief, calls out to you. 'Care to test your mind, stranger?' The grin on their face betrays a challenge... or perhaps an opportunity.\n\nYou feel the pull of the moment — a chance to indulge in clever games or demonstrate the subtle power that only a predator can wield."
 supernatural_ev1.09.a:0 "Accept the Challenge."
 supernatural_ev1.09.a_tt:0 "You test your wits in the game of riddles and intellect."
 supernatural_ev1.09.a_win_tt:0 "Your keen mind and sharp wit allow you to dominate the game."
 supernatural_ev1.09.a_draw_tt:0 "You hold your own, but the challenge ends in a draw."
 supernatural_ev1.09.a_lose_tt:0 "Your wit falters, and the crowd laughs at your expense."
 supernatural_ev1.09.b:0 "Compel the Challenger."
 supernatural_ev1.09.b_tt:0 "You use your vampiric abilities to subtly influence the challenger, earning a measure of strength and confidence."
 supernatural_ev1.09.c:0 "Decline Politely."
 supernatural_ev1.09.c_tt:0 "You lose face among the patrons, your reluctance seen as weakness."
 
# The Catacombs Below - Ev1.10
 supernatural_ev1.10.title:0 "The Catacombs Below"
 supernatural_ev1.10.desc:0 "As the night deepens, the tavern owner leans in with a sly grin, his eyes glinting with mischief. \n\n“Ever hear the voices from below?” he whispers, glancing towards a door in the corner. “There’s an old entrance to the catacombs down there. Folk say if you listen closely, you can hear the whispers of those who got lost and never returned.” He chuckles, clearly enjoying the shiver that runs through the crowd. \n\nBut to you, the thought of a dark, forgotten passage beneath the city holds a different kind of allure—one where the shadows offer secrecy and prey wanders unguarded."
 supernatural_ev1.10.a:0 "Explore the Catacombs"
 supernatural_ev1.10.a_tt:0 "Darkness and silence... the perfect hunting grounds."
 supernatural_ev1.10.ab_tt:0 "Something could happen."
 supernatural_ev1.10.b:0 "Pay for a Guide"
 supernatural_ev1.10.b_tt:0 "A little gold can keep you from becoming one of those whispers."
 supernatural_ev1.10.c:0 "Stay in the Tavern"
 supernatural_ev1.10.c_tt:0 "No need to go chasing ghost stories."
 supernatural_ev1.10.d:0 "Accept a 'Willing' Volunteer"
 supernatural_ev1.10.d_tt:0 "This seems too easy — humans rarely help vampires out of kindness."

# Ambush in the Catacombs - Ev1.11
 supernatural_ev1.11.title:0 "Ambush in the Catacombs"
 supernatural_ev1.11.desc:0 "As you explore the catacombs, you sense danger too late. A seasoned hunter emerges from the shadows, weapon ready. You must act quickly."
 supernatural_ev1.11.a:0 "Fight the Hunter"
 supernatural_ev1.11.a_tt:0 "You prepare to fight for your life."
 supernatural_ev1.11.a_win_tt:0 "You defeat the hunter and drain their life."
 supernatural_ev1.11.a_lose_tt:0 "The hunter's weapon finds its mark, and darkness claims you."
 supernatural_ev1.11.b:0 "Subdue the Hunter"
 supernatural_ev1.11.b_tt:0 "You prepare to fight the Hunter and attempt to subdue them."
 supernatural_ev1.11.b_success_tt:0 "You manage to subdue and imprison the hunter."
 supernatural_ev1.11.b_fail_tt:0 "The hunter escapes your grasp, disappearing into the shadows."
 supernatural_ev1.11.c:0 "Retreat and Flee"
 supernatural_ev1.11.c_tt:0 "You escape, but your pride is wounded."
 
# A Moment of Desire - Ev1.12
 supernatural_ev1.12.title:0 "A Moment of Desire"
 supernatural_ev1.12.desc:0 "[lover_participant.GetTitledFirstName] leans close, eyes glimmering with mischief. \"This hunt, the thrill... it makes me crave you, my [ROOT.Char.Custom('LoverPetName')]!\" [lover_participant.GetSheHe|U] gently pulls your hand, hinting at the quiet rooms above the tavern."
 supernatural_ev1.12.a:0 "Rent a room and indulge."
 supernatural_ev1.12.a_tt:0 "The hunt can wait; some desires cannot."
 supernatural_ev1.12.b:0 "Focus on the hunt."
 supernatural_ev1.12.b_tt:0 "Stay focused; there's prey to find."
 
# Additional Entries - Ev1.12
 supernatural_lovers_sneak_key:0 "[ROOT.Char.GetFirstName|U] and [lover_participant.GetFirstName] disappeared for a while..."
 supernatural_lovers_focus_key:0 "[ROOT.Char.GetFirstName|U] stayed focused on the hunt, resisting [lover_participant.GetFirstName]'s temptation."
 supernatural_fresh_air_and_exercise_modifier:0 "Fresh Air and Exercise"
 supernatural_focused_attention_modifier:0 "Focused Attention"
 
# Prepared for the Night - Ev1.13
 supernatural_ev1.13.title:0 "Prepared for the Night"
 supernatural_ev1.13.desc:0 "Before tonight's hunt, the host took the time to lurk in the shadows, listening to the townsfolk’s whispers and noting any suspicious activity. Nothing was heard that suggested a hunter’s presence. The trust your in preparations, and confidence fills the air as you prepare to venture out."
 supernatural_ev1.13.a:0 "There shouldn't be any trouble tonight."
 supernatural_ev1.13.a_tt:0 "Scouting the area reduces the chance of encountering hunters."
 
# The Trap - Ev1.14
 supernatural_ev1.14.title:0 "The Trap"
 supernatural_ev1.14.desc:0 "The preparations have been meticulous. The trap is in place, hidden in the shadows of the alley. Every step has been accounted for, every risk mitigated. Now, all that remains is to wait for the right human to wander into our snare."
 supernatural_ev1.14.a:0 "The plan is flawless."
 supernatural_ev1.14.a_tt:0 "With the trap set, there's no chance of unwanted interruptions during the feeding."

# Tavern Gossip - Ev1.15
 supernatural_ev1.15.title:0 "Tavern Gossip"
 supernatural_ev1.15.desc:0 "A drunken patron loudly recounts tales of mysterious disappearances in other cities. The tavern crowd listens with a mix of fear and fascination. The patron blames these vanishings on creatures lurking in the night, though others scoff at the idea. You can't help but feel a subtle power in shaping how this tale unfolds."
 supernatural_ev1.15.a:0 "I fought the creatures off myself."
 supernatural_ev1.15.a_tt:0 "You speak to the truth of your secret battles, hinting at your unseen strength."
 supernatural_ev1.15.b:0 "It's just murder and thievery, not legends."
 supernatural_ev1.15.b_tt:0 "You uphold a rational explanation, gaining piety for your conviction."
 supernatural_ev1.15.c:0 "I may know the cause of these disappearances..."
 supernatural_ev1.15.c_tt:0 "A sly grin spreads across your face. The irony of your words is not lost on you."

# Hidden Passageway - Ev1.16
 supernatural_ev1.16.title:0 "Hidden Passage in the Cellar"
 supernatural_ev1.16.desc:0 "While exploring the wine cellar beneath the tavern, you stumble upon a concealed passageway cleverly hidden behind a stack of dusty barrels. The faint smell of damp earth and the chill of stagnant air waft through the narrow opening, hinting at a long-forgotten route to the outside world.\n\nThe passageway appears to snake its way beyond the tavern's walls, its shadows offering the promise of secrecy and safety. Should the night's feeding take a turn for the worse, this escape route could mean the difference between life and death. You can almost hear the echoes of desperate footsteps from past souls who might have used this very path to vanish into the night.\n\nA backup plan is always wise — especially for a creature of the night."
 supernatural_ev1.16.a:0 "Keep it to myself."
 supernatural_ev1.16.a_tt:0 "Any vampire knows the importance of having an escape plan."
 supernatural_ev1.16.b:0 "Share it with the others"
 supernatural_ev1.16.b_tt:0 "I should let the guests know about this escape route, just in case things go awry."

# A Moment of Solace - Ev1.17
 supernatural_ev1.17.title:0 "A Moment of Solace"
 supernatural_ev1.17.desc:0 "As you slip into the narrow alley behind the tavern, the cool night air wraps around you. The muffled sounds of revelry fade into the background, leaving only the quiet rustle of shadows.\n\nYou take a deep breath, feeling your stress ease as you focus on what lies ahead — the promise of the hunt, the satisfaction of the feeding soon to come."
 supernatural_ev1.17.a:0 "Savor the anticipation of the hunt."
 supernatural_ev1.17.a_tt:0 "You let the thrill of the impending feeding wash over you, shedding your burdens."
 supernatural_ev1.17.b:0 "Steady your resolve for the night ahead."
 supernatural_ev1.17.b_tt:0 "You steel yourself with measured control, ready for whatever the night may bring."
 
# A Test of Restraint - Ev1.18
 supernatural_ev1.18.title:0 "A Test of Restraint"
 supernatural_ev1.18.desc:0 "A sudden shout pierces the tavern's hum of conversation. A man clutches his face as blood pours from his nose, the scent sharp and overwhelming.\n\nThe temptation strikes like a lightning bolt. Your instincts flare, but a deeper resolve anchors you. This is a test – a chance to prove your strength lies not in indulgence, but in control."
 supernatural_ev1.18.a:0 "Resist the urge."
 supernatural_ev1.18.a_tt:0 "You feel your blood's potency deepen as you master the hunger."
 supernatural_ev1.18.b:0 "Steady your resolve."
 supernatural_ev1.18.b_tt:0 "Your dual nature strengthens as you resist the temptation of the blood."

# A Moment of Respect - Ev1.19
 supernatural_ev1.19.title:0 "A Moment of Respect"
 supernatural_ev1.19.desc:0 "As you search the shadowed alleys, you stumble upon a lifeless body slumped against a wall. The scent of blood is still fresh, and a glint of gold peeks out from the folds of their clothing.\n\nTonight is about feeding, but a feeling of solemnity washes over you. This soul has met their end – perhaps it is best to leave them in peace."
 supernatural_ev1.19.a:0 "Show respect and move on."
 supernatural_ev1.19.a_tt:0 "You resist the temptation to loot the dead, feeling a sense of solemn dignity."
 
# Whispers In The Dark - Ev1.20
 supernatural_ev1.20.title:0 "Whispers in the Dark"
 supernatural_ev1.20.desc:0 "The last ray of the setting sun fades away as you slip into a shadowy alley. The noise of the bustling city surrounds you — carts creaking, merchants shouting, and footsteps echoing on cobblestones.\n\nAmid the clamor, you catch the muffled voices of two figures. They huddle close, speaking urgently about men who change into beasts when the moon rises. Their words are nearly lost in the din, but perhaps you can filter out the noise and learn more."
 supernatural_ev1.20.a:0 "Focus and listen carefully."
 supernatural_ev1.20.a_tt:0 "You try to isolate their conversation from the background noise."
 supernatural_ev1.20.a_success_tt:0 "You manage to hear their whispers, gaining valuable insights about potential threats."
 supernatural_ev1.20.a_fail_tt:0 "You fail to make out their conversation, your efforts drawing unwanted attention."
 supernatural_ev1.20.b:0 "Ignore them and move on."
 supernatural_ev1.20.b_tt:0 "You decide not to waste time and continue your search."
 
# Wary Citizens - Ev1.21
 supernatural_ev1.21.title:0 "Wary Citizens"
 supernatural_ev1.21.desc:0 "As the last ray of the setting sun vanishes, the shadows stretch long in the narrow alleyway. The usual sounds of the bustling city fade into an eerie quiet, interrupted only by the scuttling of rats and the distant clamor of merrymaking.\n\nA figure catches your attention—a wary citizen walking briskly, glancing over their shoulder. Something about them seems different, almost as if they *know* something is out there tonight."
 supernatural_ev1.21.a:0 "Use your instincts and follow quietly."
 supernatural_ev1.21.a_tt:0 "You rely on your supernatural senses to stay hidden in the shadows."
 supernatural_ev1.21.b:0 "Use your knowledge of the surroundings."
 supernatural_ev1.21.b_tt:0 "Thanks to the host's earlier scouting, you know the blind corners and hidden paths in this area. You carefully analyze your target, prepared to exploit any vulnerabilities."
 supernatural_ev1.21.c:0 "Good thing your trap is setup ahead."
 supernatural_ev1.21.c_tt:0 "You prepare an ambush, making it harder for your prey to escape."
 supernatural_ev1.21.d:0 "No creatures out here tonight friend, just rats."
 supernatural_ev1.21.d_tt:0 "You stride confidently, dismissing any suspicion with your confidence."

# Whispers of Danger - Ev1.22
supernatural_ev1.22.title:0 "Whispers of Danger"
supernatural_ev1.22.desc:0 "The target stiffens as if they had a cold chill warning them of impending danger. The alley’s poorly lit corners seem to grow even darker, and an uneasy silence seems to blanket the area. The human's eyes dart around, muscles tensing, ready to bolt at the slightest sound of danger."
supernatural_ev1.22.a:0 "Close the distance with a burst of vampiric speed."
supernatural_ev1.22.a_tt:0 "Your level of skill sharpens your reflexes."
supernatural_ev1.22.b:0 "Exploit the weakness you identified."
supernatural_ev1.22.b_tt:0 "You know exactly how to corner them."
supernatural_ev1.22.c:0 "Spring the trap, leaving them no escape."
supernatural_ev1.22.c_tt:0 "The trap closes in, sealing their fate."
supernatural_ev1.22.d:0 "Advance boldly, their fear palpable."
supernatural_ev1.22.d_tt:0 "You relish the confrontation, confident in your power."

# The Crimson Decision - Ev1.23
supernatural_ev1.23.title:0 "The Crimson Decision"
supernatural_ev1.23.desc:0 "The human trembles before you, their heartbeat a frantic drumbeat in your ears. The fear in their veins is almost palpable, each thud of their heart is like an intense beacon to you. \n\nThe moment of truth arrives: how will you satisfy your hunger tonight?"
supernatural_ev1.23.a:0 "Drain them completely, savoring every drop."
supernatural_ev1.23.a_tt:0 "You indulge fully, consequences be damned."
supernatural_ev1.23.b:0 "Take just enough to satiate your hunger."
supernatural_ev1.23.b_tt:0 "You leave them alive, barely remembering the encounter."
supernatural_ev1.23.c:0 "Take a small taste and step back."
supernatural_ev1.23.c_tt:0 "You practice discipline, feeding with care."
supernatural_ev1.23.d:0 "Use the hidden escape route."
supernatural_ev1.23.d_tt:0 "You vanish into the night, leaving no trace."
supernatural_ev1.23.e:0 "Feed and then loot them."
supernatural_ev1.23.e_tt:0 "You find some coins in their pockets."
supernatural_ev1.23.f:0 "A wealthy target yields more than just blood."
supernatural_ev1.23.f_tt:0 "You relieve them of a significant sum."


