 trait_track_alchemy:0 "Alchemy"
 trait_track_alchemy_desc:0 "Nature holds many secrets, including ways to transmute matter and achieve longevity."
 mage_alchemy_terrain_advantage:0 "$create_potion_decision$ [decision|E] cost reduction"
 mage_alchemy2_terrain_advantage:0 "$create_potion_decision$ [decision|E] cooldown (in years)"
