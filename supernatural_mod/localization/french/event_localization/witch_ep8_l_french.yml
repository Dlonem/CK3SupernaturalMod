 mage_alchemy4_terrain_cancel_negative_supply:0 "You can create advanced concoctions of your choice"
 ev9.66.0.a:0 "I will prepare an advanced potion."
 ev9.67.desc:0 "Your mastery of alchemy enables you to make any concoction you want."
 ev9.67.0.a:0 "Maybe something else..."
 ev9.68.0.a:0 "However, I will do something ordinary."
 monthly_income:0 "Additional income"
 witchcraft_legacy_1_ct3:0 "Dynasty members are better [aptitude|e] as court mages"
 ev6.71.desc2:0 "You do not currently own land, so building a mage tower is not possible. This has to be solved in another way."
 ev6.71.0.f:0 "Actually, I don't need anything like that."
 me_golem2_project_ct:0 "You unlock #italic Golem Army#! [magic_special_project|E]"
 me_golem2_option:0 "Golem Army"
 ev7.117.g:0 "A new power is rising."
 ev7.117.g_ct:0 "You unlock regiment of $golems_army$!"
 ev7.118.c:0 "I will create it to my own image."
 ev9.69.title:0 "Another Golems?"
 ev9.69.desc:0 "If you simplified the process of making a golem and didn't pay so much attention to detail, you could theoretically create a whole army of such constructs. Such soldiers would not tire, would not draw their pay and would probably be invincible."
 ev9.69.0.a:0 "I will think about it at my leisure."
 ev9.70.title:0 "Adjusting the Golem"
 ev9.70.desc:0 "Your golem continues to provide you with new inspiration. You think about adapting its human behavior..."
 ev9.70.0.a:0 "I turn up the behavioral functions."
 ev9.70.0.b:0 "[golem.GetHerHis|U] intelligence will be enhanced."
 ev9.70.0.c:0 "How about this way..."
 ev9.70.0.d:0 "It would be better if [golem.GetSheHe] were less human."
 golems_army:0 "Battle Golems"
 golems_army_flavor:0 "#F The greatest achievement of magical engineering - an army of constructs specialised in breaking down all resistance.#!"
 fire_storm_spell_ct3:0 "Armies in the province will be damaged."
 game_rule_category_witchcraft:0 "Witchcraft"
 setting_yep2_magic_witches:0 "Yes, with a source!"
 setting_yep2_magic_witches_desc:0 "You start the game as a Witch with the Source trait."
 decision_group_type_magic_decisions:0 "Spells & Rituals"
 trait_demon0:0 "Demonic Heritage"
 trait_demon0_desc:0 "In the future, this person's true nature may be revealed..."
 demon0_terrain_cancel_negative_supply:0 "May become a Demon in the future"
 ev2.38.b:0 "I reject my... heritage."
 ev8.2.desc.puppet:0 "[recipient.GetSheHe|U] is #N dominated#! by [my_mmaster.GetTitledFirstName]."
 ev9.0.e:0 "The artifact must be mine."
 ev9.0.f:0 "My minion will hand over the artifact to me."
 ev9.0.g:0 "I will try to buy this artifact."
 ev9.1.g:0 "The deal goes through."
 ev9.2.g:0 "The target declines your offer."
 ev9.71.desc:0 "Unfortunately, [second_mage.GetTitledFirstName] rejected your generous offer."
 ev9.71.0.a:0 "[second_mage.GetSheHe|U] will regret it."
 alchemy_archmage_terrain_advantage:0 "Alchemy XP gain for mages"
 ev9.72.title:0 "Gourmet"
 ev9.72.desc:0 "Lately, you have been experiencing increasing dissatisfaction, the cause of which is probably a poor diet. It would be nice to snack on something really good - after all, being a witch is also about pleasures. [victim.GetTitledFirstName] seems a suitable candidate for a lavish dinner. It will be delicious..."
 ev9.72.0.a:0 "Meat needs to go back on the menu."
 ev9.72.0.b:0 "I don't have the time for that at the moment."
 ev9.73.title:0 "Respect and Recognition"
 ev9.73.desc:0 "One of the sorcerers approached to congratulate you on your victorious mage duel with [defeated.GetTitledFirstName]. It seems that more and more people respect your skills and the power you wield."
 ev9.73.0.a:0 "That's nice..."
 ev9.73.0.b:0 "Reputation is important."
 ev9.73.0.c:0 "I don't care."
 ev9.73.0.d:0 "They shouldn't congratulate me, they should fear me."
 ev9.74.desc:0 "Circumstances are favourable for a special ritual - you can extract power directly from your realm and your lands. Your subjects will become a little less productive, but also calmer."
 power_extraction_modifier:0 "Power Extraction"
 ev9.74.desc2:0 "Circumstances are favorable for a special ritual - you can siphon power directly from this area."
 ev9.74.0.a:0 "I'll do it."
 ev9.74.0.b:0 "I will sacrifice my heir."
 ev9.74.0.c:0 "I will use my own vitality."
 ev2.56.c:0 "I need to understand the process better."
 ev2.56.c_ct:0 "You will receive some extra Alchemy XP when you become a Mage."
 mage_duel_terrain_cancel_negative_supply:0 "Unlock Mage Duel [interaction|E]"
 search_artifacts_terrain_cancel_negative_supply:0 "Unlocks Search for Magical Artifacts [activity|E] for landed witch"
 ev9.75.desc:0 "You found some very disturbing chapters in the Blackgrimoire. If at least some of this is true, the universe is filled with beings with incomprehensible powers and a morality completely different from what humans accept. Some of them may even be hiding on Earth."
 ev9.75.0.a:0 "This is unbelievable."
 ev6.5.0.b:0 "I haven't trounced Moloch for a long time."
 ev9.76.desc:0 "Moloch appeared in the summoning circle. When he saw you he became even more furious - he remembers you! In a frenzy he attacks the summoning circle, sparks fly into the air."
 ev9.76.0.a:0 "Ready for another round?"
 ev9.76.0.b:0 "You are boring, disappear."
 ev9.77.desc:0 "'Welcome, [this0.GetTitledFirstName]' - demoness looks pleased to see you - 'It's fortunate that you summoned me, we can have a little exchange. I need to take one of your courtiers to hell - [rcourtier.GetTitledFirstName].'"
 ev9.77.0.a:0 "Why do you want to take [rcourtier.GetHerHim]?"
 ev9.78.desc:0 "'You won't understand anyway, hellish stuff. Let's just say it's needed for my experiment. In return, I can tell you some magical secrets.'"
 ev9.78.0.a:0 "I would prefer more power."
