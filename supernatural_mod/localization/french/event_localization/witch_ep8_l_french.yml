 agent_spellweaver: "Spellweaver"
 agent_spellweaver_i: "[success_chance_max_i]"
 agent_spellweaver_desc: "#WEAK Experienced mages are the key element in casting group spells. They must possess unquestionable skills but also unwavering loyalty — any one of them could easily sabotage the spell or exploit its effects for their own benefit.#!\n$EFFECT_LIST_BULLET$ Provides [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Mages with a high level of secret knowledge will do best in this role"
 agent_magic_source: "Reservoir" 
 agent_magic_source_i: "[success_chance_max_i]"
 agent_magic_source_desc: "#WEAK A backup source of magical energy can come in handy to stabilize the process. Any power saturated person can fulfil this role.#!\n$EFFECT_LIST_BULLET$ Provides [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requires source trait and/or power saturation"
 agent_magic_assistant: "Assistant"
 agent_magic_assistant_i: "[scheme_speed_i]"
 agent_magic_assistant_desc: "#WEAK The assistant ensures that the ritual runs smoothly and all important components are always at hand. He or she does not need to have magical abilities.#!\n$EFFECT_LIST_BULLET$ Provides [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ A proficient witch or person with high learning will be the best choice"
 ultimate_spell_cast:0 "$grand_spell_decision_title$"
 ultimate_spell_cast_action:0 "$grand_spell_decision_title$ led by"
 ultimate_spell_cast_desc:0 "Powerful magic sometimes requires the combined efforts of several mages. If the ritual is successful, you will be able to produce an effect on a global scale. However, failure could mean the death of the participants in the ritual, including yours."
 ultimate_spell_cast_desc_general:0 "$ultimate_spell_cast_desc$"
 ultimate_spell_cast_start_ct:0 "You start the ritual"
 ultimate_spell_blackgrimoire_modifier:0 "$blackgrimoire$"
 ultimate_spell_catalyst_modifier:0 "$magic_catalyst$"
 ultimate_spell_master_modifier:0 "$master_magic_modifier$"
 ultimate_spell_chosen_modifier:0 "$trait_source3$"
 ultimate_spell_bonus_terrain_advantage:0 "[GetScheme('ultimate_spell_cast').GetTypeName] [success_chance_max_i] [scheme_potential|E]"
 CHANCE_IS_TOO_LOW_CUSTOM:0 "The chances of success are too low"
 ADVANTAGES_ARE_TOO_LOW_CUSTOM:0 "You need at least five advantages"
 ev9.91.desc:0 "Your preparations for the ritual of casting the Ultimate Spell are moving forward. Soon the immense power will be in your hands, ready to be shaped to your will!"
 ev9.91.0.a:0 "Let's cast the spell!"
 ev9.91.0.b:0 "We will wait a little longer."
 ev9.91.1.a_ct:0 "#P You successfully cast the Ultimate Spell.#!"
 ev9.91.2.a_ct:0 "#N The spell failed.#!"
 ev9.91.3.a_ct:0 "#N A catastrophe could occur.#!"
 ev9.91.4.a_ct:0 "#N Participants in the ritual may die.#!"
 ev9.92.desc:0 "You are ready to perform the ritual that will enable you to cast the Ultimate Spell. This is probably one of the most powerful spells a sorcerer can cast - you will likely need the help of other mages, as well as huge amounts of magical energy."
 ev9.92.0.a:0 "I will start preparations."
 ev9.92.0.b:0 "$ev2.2.d$"
 ev9.92.0.c:0 "I can cast the spell just like that."
 ev9.92.0.c_ct:0 "The Ultimate Spell will be cast immediately."
 ev9.92.0.a_ct:0 "You will start [GetScheme('ultimate_spell_cast').GetTypeName] [scheme|E]"
 ev9.93.title:0 "The Ultimate Spell - Critical Failure"
 ev9.93.desc:0 "As you attempted to cast the spell, the power you had accumulated burst out of control. A huge eruption of energy caused an explosion that was heard even in the neighbouring kingdoms."
 ev9.94.title:0 "The Ultimate Spell - Failure"
 ev9.94.desc:0 "As you attempted to cast the spell, the power you had accumulated burst out of control. If you don't do something, you will all die!"
 ev9.94.0.a:0 "I will suppress the spell!"
 ev9.94.0.b:0 "I will sacrifice [p1.GetTitledFirstName]."
 grand_spell_decision_desc2:0 "The Ultimate Spell is very powerful and has many uses, but it is complicated and risky - the slightest mistake in the process of casting it can have disastrous results."
 ev9.95.title:0 "The Ultimate Spell - Stabilization"
 ev9.95.desc:0 "The ritual focuses a power that is increasingly difficult to control. You have to figure out a way to keep you and your spellweavers safe."
 ev9.95.0.a:0 "I will recalculate the spell parameters."
 ev9.95.0.b:0 "Nothing to worry about..."
 ultimate_spell_unstable_modifier:0 "Unstable spell"
 ultimate_spell_stable_modifier:0 "Stable spell"
 ev9.96.title:0 "The Ultimate Spell - Concentration of Power"
 ev9.96.desc:0 "The ritual needs additional power to sustain its effect - otherwise the spell may weaken or become unstable."
 ev9.96.0.a:0 "We will charge the spell."
 ev9.96.0.b:0 "I don't think there is any need for that."
 ev9.96.0.b_ct:0 "#N The spell may have weaker effects.#!"
 ev9.97.title:0 "The Ultimate Spell - Experiment"
 ev9.97.desc:0 "Dealing with such powerful magic provides opportunities for many interesting observations. It seems to you that you could already use some of the spell's power at this stage."
 ev9.97.0.a:0 "I will try to absorb some power."
 ev7.105.j:0 "I demand the council's support."
 ev7.105.j_ct:0 "Participants in the Mage Summit can join to [GetScheme('ultimate_spell_cast').GetTypeName] [scheme|E]"
 mage_council_support_modifier:0 "Mage Council support"
 ultimate_spell_council_modifier:0 "$mage_council_support_modifier$"
 ev9.98.title:0 "Dark Gifts"
 ev9.98.desc:0 "You fall into a restless sleep. In this dream, you see a being of shadow and light watching you. You hear it say: 'I have something for you, mortal. Do you feel it? These are my gifts.'"
 ev9.98.0.a:0 "My hands... what is happening to me!"
 ev9.98.0.b:0 "I see... somehow different."
 ev9.98.0.c:0 "I don't want your gifts, I reject them!"
 ev9.99.desc:0 "The dream is over, you wake up, you get up wobbly. You feel different somehow, something has changed."
 ev9.99.0.a:0 "It was not a dream!"
 ev9.99.0.b:0 "My eyes!"
 ev9.99.0.c:0 "It was inspiring."
 magic_claws_modifier:0 "Claws"
 magic_eyes_modifier:0 "New Eyes"
 trait_source3_character_desc:0 "Once every few centuries an exceptionally gifted individual comes into the world, a miracle worker who intuitively understands the nuances of magic better than anyone else. With proper training, [ROOT.GetCharacter.GetSheHe] has the potential to achieve power that could match demonic princes or even minor gods."
 trait_necromancer_character_desc:0 "This [ROOT.GetCharacter.Custom('GetProperWitchDesc')] found a way to cheat death, although [ROOT.GetCharacter.GetSheHe] paid a high price for it..."
 abdicate_decision_ct:0 "Abdication is free because you are [GetTrait('incapable').GetName( GetNullCharacter )]"
 ultimate_spell_hecate_modifier:0 "$hecate_support_modifier$"