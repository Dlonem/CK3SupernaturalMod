 laamp_magic_1010_contract:0 "Haunted Manor"
 laamp_magic_1010_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and solving a problem using the [learning|E] skill."
 laamp_magic_1010_desc_title:0 "$laamp_magic_1010_contract$"
 laamp_magic_1010_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName]'s castle is said to be haunted by ghosts. [TaskContract.GetEmployer.GetTitledFirstName] is looking for a specialist who can rid the castle of these unwanted guests."
 ev9.80.desc:0 "'I'm glad you've arrived. I believe you can help me. At night, strange noises can be heard in the castle, lights flicker, walls move and change colors. People here don't sleep well, and I have strange dreams too. Some hear voices in their heads... is it possible that it's ghosts?'"
 ev9.80.0.a:0 "I don't believe in ghosts."
 ev9.80.0.b:0 "Everything is possible."
 ev9.81.desc:0 "'Whatever it is, I want you to solve this problem. The current situation is damaging my reputation, my courtiers are getting anxious, and my enemies will surely try to exploit it. Stay the night at the castle, and you can assess the situation yourself.'"
 ev9.81.0.a:0 "I have no time for foolishness, farewell."
 ev9.81.0.b_ct:0 "You'll stay at the castle for a while."
 ev9.82.desc:0 "You spend a few days at the castle, but nothing suspicious happens. Until the next night you are woken up by strange sounds... You lift yourself out of bed and feel dizzy. You've never felt this way before. You have the impression that you hear whispers from the corridor."
 ev9.82.0.a:0 "I need to check it out."
 ev9.83.desc:0 "The corridor is calm and silent. For a moment, you thought you saw movement in the darkness, but when you got closer, you found no one. Could it have been the ghosts? And there's that strange feeling that still lingers..."
 ev9.83.desc2:0 "You find no signs of magic in the area. Perhaps it's something unfamiliar, something unknown to you Or perhaps ghosts don't leave magical traces?"
 ev9.83.0.a:0 "I need to think about this."
 ev9.83.1.a:0 "You get an idea."
 ev9.83.2.a:0 "You have no idea what's going on here"
 ev9.83.0.b:0 "I will look for traces of magic."
 ev9.83.0.b_ct:0 "You will investigate the area for signs of magic."
 ev9.84.desc:0 "You did some experiments, looked at the walls and floors, but found nothing interesting. You have no idea what is going on here."
 ev9.84.0.a:0 "I will stay here for a while longer."
 ev9.84.0.b:0 "I'm getting out of here."
 ev9.85.desc:0 "On the next night, you had a nightmare. You woke up abruptly and it took a long moment before you remembered where you were. Again, you seem to hear whispers, either from the corridor or the walls. When you got up to look around, you found that you could barely stand. Maybe you're sick?"
 ev9.85.0.a:0 "I'm going back to bed..."
 ev9.85.0.b:0 "My illness is not a coincidence."
 ev9.85.0.b_ct:0 "You decide to conduct an experiment."
 ev9.86.desc:0 "The next day, you don't feel well. Maybe it's not ghosts at all, but some disease—other castle inhabitants don't look great either. You come to the conclusion that the best thing would be to leave this castle as soon as possible."
 ev9.86.0.a:0 "Back to the camp."
 ev9.87.desc:0 "Using some herbs and tools you had on hand, you managed to conduct an experiment. The result is clear—the air is contaminated. It seems that staying in the castle for a few days can cause illness, hallucinations, or nightmares. This explains the issue of these 'ghosts'."
 ev9.87.0.a:0 "But what could be the cause?"
 ev9.88.desc:0 "The next day, you decided to look around other parts of the castle and talk to the staff. Now you know what to look for and what to ask. This way, you managed to reach the dungeons, partially flooded with water. On the walls, you see the cause of the problem — an exotic type of fungus whose spores were causing all the issues. Drying or sealing the dungeons will eliminate the 'ghosts.'"
 ev9.88.0.a:0 "[employer.GetTitledFirstName] will be pleased with my findings."
 laamp_magic_1011_ct1:0 "You will learn the location of the magical artifact"
 laamp_magic_1011_ct2:0 "You will earn claims on the magical artifact"
 laamp_magic_1011_contract:0 "$ev2.55.title$"
 laamp_magic_1011_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and use gold or [intrigue|E] to obtain information."
 laamp_magic_1011_desc_title:0 "$laamp_magic_1011_contract$"
 laamp_magic_1011_desc:0 "According to rumours, [TaskContract.GetEmployer.GetTitledFirstName] may know something about one of the magical artifacts. Perhaps a little cleverness or gold will make [TaskContract.GetEmployer.GetHerHim] share this information with you."
 ev9.89.desc:0 "You have managed to confirm that [employer.GetTitledFirstName] may indeed know something about magical artifacts. Gold or persuasion might encourage [employer.GetHerHim] to speak up."
 ev9.89.0.a:0 "I will offer gold."
 ev9.89.0.b:0 "I will get the information by deception."
 ev9.89.0.c:0 "I think we will come to an agreement."
 ev9.89.0.e:0 "I scan [employer.GetHerHis] mind."
 ev9.89.0.d:0 "Waste of time, [employer.GetSheHe] knows nothing."
 ev9.89.0.d_ct:0 "You give up on getting information."
 ev9.90.desc:0 "From the information you have gleaned, it appears that the magical artifact is in the possession of [maowner.GetTitledFirstName]. You will have to take this into account in your plans."
 ev9.90.0.a:0 "$ev4.23.0.a$"
 ev9.90.0.b:0 "This should be mine."
 ev9.90.0.c:0 "This is the next target for my master thief."
