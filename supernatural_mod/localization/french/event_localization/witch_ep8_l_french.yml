l_french:
 convert_to_witchcraft_scheme_phase_duration_add:0 "[GetScheme('convert_to_witchcraft').GetTypeName] [scheme_speed_single|E]"
 convert_to_witchcraft_scheme_chance_advantage:0 "[GetScheme('convert_to_witchcraft').GetTypeName] [scheme_success_chance|E]"
 camp_purpose_seekers:0 "Secret Seekers"
 camp_purpose_seekers_effects:0 "$EFFECT_LIST_BULLET$Finds more [learning|E] and [intrigue|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$May find special witch [task_contracts|E]\n$EFFECT_LIST_BULLET$Enables the [GetTravelOption('adventurers_search_for_secrets_option').GetName] [travel_option|E]\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('fortune_tellers_tent_01').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('cult_caravan_01').GetName]#!\n$EFFECT_LIST_BULLET$Can access certain special [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('cult_priest_camp_officer').GetName()] #weak (Unlocked via $cult_caravan_01_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Unlocked via $supply_tent_subdued_gear_domicile_building$)#!\n\n#WEAK Whether you are a power-seeking witch, a priest of a forbidden cult or a mere opportunist, secret knowledge and forgotten mysteries are the path to power and understanding of the universe.#!"
 camp_requirement_unlocked_by_purpose_seekers:0 "Your $camp_purpose$ must be [GetLaw('camp_purpose_seekers').GetName]"
 fortune_tellers_tent_01_domicile_building:0 "Fortune Teller's Tent"
 fortune_tellers_tent_01_domicile_building_desc:0 "These might be mere gimmicks, or perhaps they hold a touch of real magic. Either way, the fortune teller is happy to share his earnings."
 fortune_tellers_components_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ [decision|E] has #P no cost#!"
 cult_caravan_01_domicile_building:0 "Cult Caravan"
 cult_caravan_01_domicile_building_desc:0 "Cultists of [GetPlayer.GetFaith.WitchGodName] travel in this carriage; only a few know the secrets it holds.
 cult_caravan_02_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_02_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
 cult_caravan_03_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_03_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
 cult_caravan_04_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_04_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
 cult_caravan_05_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_05_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
 cult_caravan_06_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_06_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
 domicile_building_parameter_camp_may_host_grand_rites: "Unlocks #high $activity_witch_ritual$#! [activity|E]"
 domicile_building_parameter_camp_cult_priest_more_effective:0 "Priest of the Cult has increased aptitude"
 cult_caravan_chapel_domicile_building:0 "Portable Chapel"
 cult_caravan_chapel_domicile_building_desc:0 "A convenient place for cult priests to perform their dark rites."
 domicile_building_parameter_camp_unlocks_cult_priest: "Unlocks the [GetCourtPositionType('cult_priest_camp_officer').GetName()] [officer|E]"
 domicile_building_parameter_camp_unlocks_spread_cult: "Unlocks $spread_the_cult_decision_title$ [decision|E]"
 cult_priest_camp_officer:0 "Priest of the Cult"
 cult_priest_camp_officer_desc:0 "The priest praises the name of the dark gods and collects gifts from the converted peasants."
 spread_the_cult_decision_title:0 "Spread the Cult"
 spread_the_cult_decision_desc:0 "Time to let the cultists have a little chat with the locals."
 spread_the_cult_decision_ct1:0 "You can establish a branch of cult or convert the locals."
 spread_the_cult_decision_ct2:0 "This action may benefit you in the future, but it may also arouse the reluctance of local authorities."
 ev2.1.g_ct3:0 "$spread_the_cult_decision_title$ [decision|E] will be more effective"
 NOT_IS_A_WITCH:0 "You must be a witch."
 cult_caravan_arms_domicile_building:0 "Combat Equipment"
 cult_caravan_arms_domicile_building_desc:0 "Armed cultists with fanatical devotion will move on any enemy you point out to them."
 domicile_building_parameter_camp_unlocks_cultists_maa: "$culture_parameter_coven_rule2$"
 cult_caravan_convertion_domicile_building:0 "Dark Missionaries"
 cult_caravan_convertion_domicile_building_desc:0 "Among cultists are both charismatic speakers and sharp observers. We will grant them additional resources to act."
 domicile_building_parameter_camp_unlocks_witch_convertion: "Converts one follower a year into a witch"
 cult_caravan_archive_domicile_building:0 "Cult Archives"
 cult_caravan_archive_domicile_building_desc:0 "Only a few have access to the cult's archives."
 witch_dark_cult_modifier:0 "Activities of a dark cult"
 witch_dark_cult_custom_tooltip:0 "You have established a branch of the cult."
 DARK_CULT_ALREADY_EXISTS_CUSTOM:0 "There is already a branch of the cult in this province."
 trait_track_cultist:0 "Cultist"
 trait_track_cultist_desc: "Mysticism and religion have always been a great way to manipulate and control other people."
 ev9.2.desc:0 "Your cultists have converted a few locals, but this has not escaped the attention of the authorities. It may be worth stopping your activities if you don't want to draw attention to yourself."
 ev9.2.0.a:0 "Only [ROOT.Char.GetFaith.WitchGodName]'s will matters."
 ev9.2.0.b:0 "[cpriest.GetTitledFirstName] will take the blame."
 ev9.2.0.c:0 "In that case, we will wait for a better moment."
 ev9.3.desc:0 "The locals are not interested in your cult, but their ruler, [lruler.GetTitledFirstName], seems to be an open-minded person. You might be able to pass on some secrets to [lruler.GetHerHim] in return for [lruler.GetHerHis] support."
 ev9.3.0.a:0 "I will talk to [lruler.GetHerHim]."
 ev9.3.0.b:0 "This is an unnecessary risk."
 ev9.4.desc:0 "The conversion of the locals has gone smoothly, thanks largely to the cult priest, [cpriest.GetTitledFirstName] - true, peasants and poor merchants are not worthy of experiencing true wisdom, but even such puppets can be useful in [ROOT.Char.GetFaith.WitchGodName]'s grand plan."
 ev9.4.0.a:0 "I appoint [cpriest.GetTitledFirstName] as high priest."
 ev9.4.0.b:0 "[cpriest.GetSheHe|U] does a good job, but I am the cult leader."
 ev9.5.title:0 "Dark Connections"
 ev9.5.desc:0 "The [cbranch.GetName] branch of the cult sends you gifts - that's nice of them..."
 ev9.6.desc:0 "It seems that the cult you have established in [cbranch.GetName] is thriving. Time to ask them for tribute."
 ev9.6.0.a:0 "Let them send supplies."
 ev9.6.0.b:0 "Let them share the gold."
 ev9.6.0.c:0 "A few extra people would be useful."
 ev9.7.desc:0 "A young acolyte has arrived from your Cult branch in [cbranch.GetName] who wishes to join your team. It is possible that [created_witch.GetSheHe] has the potential to be a suitable cultist."
 ev9.7.0.a:0 "Excellent, let [created_witch.GetHerHim] join us."
 ev9.7.0.b:0 "[created_witch.GetSheHe|U] had better continue to help in [cbranch.GetName]."
 ev9.7.0.b_ct:0 "This branch of cult will exist for 10 years longer."
 ev9.8.desc:0 "News has reached you that your branch of cult in [cbranch.GetName] no longer exists - it was destroyed in a witch-hunter raid."
 ev9.8.0.a:0 "I hope no traces lead to us."
 ev9.9.desc:0 "Cultist agents from [cbranch.GetName] have come into possession of information that may be useful to you. They have decided to share them with you."
 ev9.9.0.a:0 "This is exactly what I needed."
 ev9.9.0.b:0 "I will add it to my list of secrets."
 ev9.10.desc:0 "Your cult in [cbranch.GetName] has exceeded your expectations. The cultists have recruited both the local lord's servants, several clerics and many townspeople. They all worship the [ROOT.Char.GetFaith.WitchGodName] in secret and consider you a saint."
 ev9.10.0.a:0 "I am not a saint, I am a prophet."
 darkprophet_nickname:0 "the Dark Prophet"
 ev9.10.0.b:0 "Praise the [ROOT.Char.GetFaith.WitchGodName]!"
 ev9.10.0.c:0 "They deserve credit, but let them remain vigilant."
 ev9.11.desc:0 "[cbranch.GetName] cultists report that they are recruiting new believers among the townspeople, the cult is slowly growing. They have sent a messenger to you asking for further instructions."
 ev9.11.0.a:0 "Let them spread the word to everyone that the Prophet is coming."
 ev9.11.0.b:0 "They should increase their efforts."
 ev9.11.0.c:0 "This is the time for them to send a tribute."
 ev9.11.0.d:0 "Let them set the locals against their liege."
 command_minion_interaction_unlocked_ct:0 "Unlocks $command_minion_interaction$ [interaction|E] with the target."
 COMMAND_MINION_O9:0 "Become my patron"
 laamp_magic_1001_contract:0 "Inconvenient Witch"
 laamp_magic_1001_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and deal with the witch using [intrigue|E], [martial|E] or [diplomacy|E]."
 laamp_magic_1001_desc_title:0 "$laamp_magic_1001_contract$"
 laamp_magic_1001_desc:0 "The local ruler has a conflict with a witch - it wouldn't be particularly interesting if it weren't for the fact that the witch might possess useful information. Perhaps it will be possible to kill two birds with one stone."
 ev9.12.desc:0 "Apparently there is a witch living in the area who incites the peasants. [employer.GetTitledFirstName] wants the witch to disappear - by any means, as long as it's quick."
 ev9.12.0.a:0 "I will convince the witch to leave."
 ev9.12.0.a_ct:0 "The witch was chased away"
 ev9.12.0.a_ct2:0 "The witch refuses"
 ev9.12.0.b:0 "I will convince the locals to get on with it."
 ev9.12.0.c:0 "This is a job for my hatchet men."
 ev9.12.0.c_ct2:0 "The witch managed to hide"
 ev9.12.0.d:0 "This witch would be useful as a new acquisition for the cult."
 ev9.13.desc:0 "Despite your efforts, the witch is still here. Time for a plan B..."
 ev9.13.0.a:0 "Maybe bribery will help."
 ev9.13.0.a_ct:0 "The Witch accepts the offer"
 ev9.14.desc:0 "The Witch's case has been closed and [employer.GetTitledFirstName] is happy, but that is only one side of the coin. You now have access to the Witch's notes and materials, which contain a lot of useful information."
 laamp_magic_1002_contract:0 "Searching for Ingredients"
 laamp_magic_1002_request:0 "This [task_contract|E] requires the delivery of alchemical ingredients - [learning|E] or appropriate traits may be needed."
 laamp_magic_1002_desc_title:0 "$laamp_magic_1002_contract$"
 laamp_magic_1002_desc:0 "[TaskContract.GetEmployer.GetTitledFirstNamePossessive] needs a particular ingredient to prepare a concoction. Obtaining or buying this ingredient should not be difficult."
 ev9.15.desc:0 "Your employer needs a special plant to make a concoction. Perhaps it grows somewhere in the area or can be bought from local merchants."
 ev9.15.0.a:0 "Well, let's go shopping."
 ev9.15.0.b:0 "I know where to find this plant."
 ev9.15.0.c:0 "I think I have the right ingredient in my supplies."
 ev9.15.0.d:0 "The local witches certainly know where to look for it."
 ev9.15.0.e:0 "I think this contract does not interest me."
 laamp_magic_1003_contract:0 "Demonic Possession"
 laamp_magic_1003_request:0 "This [task_contract|E] requires the skills of a true witch."
 laamp_magic_1003_desc_title:0 "$laamp_magic_1003_contract$"
 laamp_magic_1003_desc:0 "One of [TaskContract.GetEmployer.GetTitledFirstNamePossessive] courtiers give the impression of being possessed. Prayers and priests have failed - [TaskContract.GetEmployer.GetTitledFirstName] is ready to enlist the help of a witch to solve the problem. This could be an enlightening case..."
 ev9.16.desc:0 "It appears that [cpossessed.GetTitledFirstName] is indeed possessed or at least ill. The only thing you have been able to determine is that the case is serious and not a hoax of any kind. However, you lack the skills to solve this mystery."
 ev9.17.desc:0 "As soon as you arrived at [employer.GetTitledFirstNamePossessive] castle you immediately went to [cpossessed.GetTitledFirstName]'s chambers. [cpossessed.GetSheHe|U] is definitely dangerous to be around, but even worse, you can sense magic from [cpossessed.GetHerHim]. Supernatural powers are definitely involved."
 ev9.17.0.a:0 "I need to examine [cpossessed.GetHerHim], hold [cpossessed.GetHerHim]."
 ev9.17.0.b:0 "I will make an infusion to calm [cpossessed.GetHerHim] down."
 ev9.17.0.c:0 "Let me start with a simple prayer."
 ev9.17.0.d:0 "I have some ideas, but I need to think for a while."
 ev9.18.desc:0 "You conclude that [cpossessed.GetTitledFirstName] is not really possessed, certainly not by a demon. However, there is no doubt that [cpossessed.GetHerHis] condition has magical causes."
 ev9.18.0.a:0 "Interesting... I'll watch [cpossessed.GetHerHim] for a few days."
 ev9.18.0.b:0 "An aura reading spell will solve this riddle."
 ev9.19.desc:0 "You managed to discover that someone had cast a spell on [cpossessed.GetTitledFirstName]. You think it was probably meant to be a spell that controls [cpossessed.GetHerHim], but the witch who cast it didn't have the right knowledge or power, and the spell didn't work as intended."
 ev9.19.0.a:0 "I will prepare a ritual to neutralise the spell."
 ev9.19.0.a_ct:0 "The spell will be broken."
 ev9.19.0.b:0 "I will simply cast a counter-spell."
 ev9.19.0.c:0 "I will try to use an exorcism."
 ev9.19.0.d:0 "Breaking this spell is beyond my capabilities."
 ev9.20.desc:0 "Your efforts have paid off - it looks like [cpossessed.GetTitledFirstName] is fully recovered, the spell is gone. Your employer is pleased with the results, but there is still one more issue - who cast the spell? And why?"
 ev9.20.0.a:0 "That's not my thing - I've done my part."
 ev9.20.0.b:0 "I can look for a perpetrator for an additional fee."
 ev9.20.0.b_ct:0 "The contract will continue - you must find the witch."
 ev9.21.title:0 "Searching for the Witch"
 ev9.21.desc:0 "The spellcaster is not exceptionally powerful but demonstrates a fair degree of skill. You have to figure out how to find that person."
 ev9.21.desc2:0 "It appears to be a dead end. You need to try something else."
 ev9.21.0.a:0 "I will talk to the service."
 ev9.21.0.a_ct1:0 "You find the Witch's hideout"
 ev9.21.0.a_ct2:0 "No sign of the witch."
 ev9.21.0.b:0 "Perhaps the local peasants know something?"
 ev9.21.0.c:0 "I will ask the local informants."
 ev9.21.0.d:0 "I will use magic triangulation."
 ev9.22.title:0 "$ev9.21.title$ - $board_games.0001.tt.failure$"
 ev9.22.desc:0 "You have not been able to find the witch - probably whoever cast the spell has left the area. But still, you managed to fulfil the basic part of the contract."
 ev9.22.0.a:0 "I did my best."
 ev9.23.desc:0 "You have managed to find the witch's hut - you immediately decide to go there. The witch is surprised to see you."
 ev9.23.0.a:0 "I know it was you who cast the spell on [cpossessed.GetTitledFirstName]!"
 ev9.24.desc:0 "Instead of an answer, you hear some unintelligible words coming from the witch's mouth. It's a spell!"
 ev9.24.0.a:0 "I will simply kill [created_witch.GetHerHim] with my sword."
 ev9.24.0.b:0 "How dare you? Power Strike!"
 ev9.24.0.a_ct:0 "The witch managed to complete the spell."
 ev9.25.desc:0 "The witch finished the spell before you reached [created_witch.GetHerHim] - the spell wasn't strong, but it clouded you for a moment. That was enough for the witch to escape - you probably won't meet [created_witch.GetHerHim] again. However, that doesn't change the fact that you fulfilled the basic part of the contract."
 ev9.26.desc:0 "You killed the witch before [created_witch.GetSheHe] could complete the spell."
 ev9.26.desc2:0 "Your spell tore the witch to pieces, only a black stain and pieces of burnt flesh remained."
 ev9.26.desc3:0 "\n[created_witch.GetHerHis|U] motives are unclear, but you can see from the notes you found that the witch was close to discovering the secret of true magic - you can already see that you will be able to use this knowledge. Your employer will be pleased that the problem has been solved as well."
 ev9.26.0.a:0 "Yes, I need to study these notes."
 laamp_magic_1004_contract:0 "Ruthless Rivalry"
 laamp_magic_1004_request:0 "This [task_contract|E] magical skills or deception ([intrigue|E])."
 laamp_magic_1004_desc_title:0 "$laamp_magic_1004_contract$"
 laamp_magic_1004_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] is willing to use any means available to harm [TaskContract.GetEmployer.GetHerHis] rival - including magical ones."
 ev9.27.desc:0 "'Sit down and listen. There is one person who is a pain in the ass to me, whom I honestly can't stand. I would like to see their death and suffering... I've heard rumors that you have some special abilities. If you can harm [nrival.GetTitledFirstName], I will pay in gold.'"
 ev9.27.0.a:0 "Sure, yes, I'll cast... er... curse."
 ev9.27.0.a_ct:0 "You're bluffing"
 ev9.27.0.b:0 "I'll do it."
 ev9.27.0.c:0 "I don't deal with such matters."
 ev9.27.0.c_ct:0 "You resign from the contract"
 ev9.28.desc:0 "Your target is [nrival.GetTitledFirstName]. [employer.GetTitledFirstName|U] apparently expects you to cast a spell that will injure or kill [employer.GetHerHis] rival."
 ev9.28.0.a:0 "I will prepare a curse."
 ev9.28.0.b:0 "A powerful curse will produce spectacular results."
 ev9.28.0.c:0 "I pretend to cast a spell."
 ev9.27.0.c1:0 "The employer thinks you have cast a spell"
 ev9.27.0.c2:0 "The employer has discovered your fraud"
 ev9.28.0.d:0 "I'm giving up this job."
 laamp_magic_1005_contract:0 "Task For The Healer"
 laamp_magic_1005_request:0 "This [task_contract|E] magical skills or special traits."
 laamp_magic_1005_desc_title:0 "$laamp_magic_1005_contract$"
 laamp_magic_1005_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] suffers from a serious illness against which his court physician is helpless. Perhaps magic will be able to help here?"
 ev9.29.desc:0 "[employer.GetTitledFirstName|U] is seriously ill and it is not known how many days [employer.GetSheHe] has left. [employer.GetSheHe|U] is willing to pay for any treatment, even an unconventional one, as long as it proves effective."
 ev9.29.0.a:0 "I will try to help [employer.GetHerHim]."
 ev9.29.0.a1:0 "The treatment is effective"
 ev9.29.0.a2:0 "The treatment is not effective"
 ev9.29.0.b:0 "I can enhance [employer.GetHerHis] aura."
 ev9.29.0.c:0 "A healing spell will solve the problem."
 ev9.29.0.d:0 "I don't think there is anything I can do."
 laamp_magic_1006_contract:0 "Magic Anomaly"
 laamp_magic_1006_request:0 "This [task_contract|E] magical skills and high [learning|E]."
 laamp_magic_1006_desc_title:0 "$laamp_magic_1006_contract$"
 laamp_magic_1006_desc:0 "You sense that there is a source of magical emanations in the [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands. It is worth going there and investigating."
 laamp_magic_1006_ct:0 "You will receive an unknown reward"
 ev9.30.desc:0 "You can sense relatively strong magic in the area. Magical triangulation indicated an ordinary hillock that does not stand out at first glance."
 ev9.30.0.a:0 "What is so special about this place?"
 ev9.30.0.a_ct:0 "You decide to take a closer look"
 ev9.31.desc:0 "You managed to do some magical experiments, but you didn't get any clear answers except that the magical traces are very old. Something happened here a long time ago..."
 ev9.31.0.a:0 "I will carry out additional research."
 ev9.31.0.a1:0 "You are closer to understanding this phenomenon"
 ev9.31.0.a2:0 "The mystery will not be solved"
 ev9.31.0.b:0 "It may be worth looking at it from a different perspective."
 ev9.31.0.c:0 "I think I once read about something similar..."
 ev9.31.0.d:0 "I have a hypothesis."
 ev9.32.title:0 "$laamp_magic_1006_contract$ - $board_games.0001.tt.failure$"
 ev9.32.desc:0 "You have tried various ways, but have not been able to discover the nature of this strange phenomenon. All you know is that it originated a long time ago and is probably harmless to its surroundings. Perhaps one day you will be able to solve this mystery."
 ev9.32.0.a:0 "It was informative anyway."
 ev9.33.desc:0 "It seems that a powerful spell was cast in this place long ago. You've managed to deduce that it was a teleportation spell, although today it's hard to tell if the point you're at was the beginning or end of someone's journey. Whoever was here wielded immense power, and remnants of it still exist in the aura of this place."
 ev9.33.0.a:0 "I think I can absorb some of the magic here."
 ev9.33.0.b:0 "It was an interesting experiment."
 ev9.33.0.c:0 "I need to take this into account in future research."
 ev9.33.0.a_ct:0 "Investigation of the anomaly is completed"
 ev9.34.desc:0 "Recently, one of the hikers I met brought up an interesting rumour - apparently [rumors_target.GetTitledFirstName] is in possession of an unusual item. It is possible that a magical artefact is being referred to."
 laamp_magic_1007_contract:0 "The Secret Scroll"
 laamp_magic_1007_request:0 "This [task_contract|E] requires payment of a lot of gold... or stealing ([intrigue|E])."
 laamp_magic_1007_desc_title:0 "$laamp_magic_1007_contract$"
 laamp_magic_1007_desc:0 "It seems that [TaskContract.GetEmployer.GetTitledFirstName] has a special scroll that could be invaluable to someone like you. Perhaps you can convince [TaskContract.GetEmployer.GetTitledFirstName] to sell the scroll... and if not, you can use less legal ways to get it."
 laamp_magic_1007_desc_ct:0 "#P You will become the owner of the artifact.#!"
 msscroll:0 "Ancient Scroll"
 msscroll_desc:0 "This scroll contains the instructions for operating the so-called Singularity. It is completely incomprehensible to someone who is not an advanced adept in magic."
 msscrol_additional_desc_cancel_negative_supply:0 "Unlocks Activation of the Singularity [magic_special_project|E] for the owner of the Ancient Singularity"
 ev9.35.desc:0 "[employer.GetTitledFirstName] was pleased that you were interested in the scroll - he would love to sell it, he clearly needs the gold. However, the price he quoted seems high."
 ev9.35.0.a:0 "1000 coins? Is this some kind of joke?"
 ev9.35.0.b:0 "Well, let it be."
 ev9.35.0.a1:0 "You will negotiate a better price"
 ev9.35.0.a_ct:0 "You get a discount"
 ev9.35.0.a2:0 "[employer.GetTitledFirstName] will be pissed"
 ev9.36.desc:0 "[employer.GetTitledFirstName] has not been convinced - [employer.GetSheHe] sees that you care about the scroll, so [employer.GetSheHe] wants to squeeze as much gold out of you as possible."
 ev9.36.desc2:0 "You managed to persuade [employer.GetTitledFirstName] to lower [employer.GetHerHis] ridiculous price a little - but it's still a lot of gold."
 ev9.36.0.a:0 "Fine, I'll take it."
 ev9.36.0.b:0 "I will look for another way..."
 ev9.36.0.b_ct:0 "You will use criminal methods to obtain the scroll"
 ev9.36.0.c:0 "In fact, I don't need this scroll."
 ev9.36.0.c_ct:0 "You completely give up trying to get the scroll"
 ev9.37.desc:0 "Since purchasing is not an option, it remains to plan a theft. [employer.GetTitledFirstNamePossessive] property doesn't look well protected, it could work."
 ev9.37.0.a:0 "Let's come up with a plan."
 ev9.37.0.b:0 "My man will deal with it."
 ev9.37.0.b_ct:0 "You send your master thief."
 ev9.37.0.c:0 "Fine, I give up."
 ev9.37.0.d:0 "I will simply use a domination spell."
 ev2.73C.desc:0 "\nHowever, you still don't know how you can make it work."
 ev2.73.c:0 "Someone must know something."
 ev2.73.c_ct:0 "You will send your men in search of information."
 ev2.73.c1_ct:0 "You find a useful lead."
 ev2.73.c2_ct:0 "The search leads you nowhere."
 ev2.73.d:0 "I will solve this problem in time."
 as_special_project:0 "Activation of the Ancient Singularity"
 me_as_project_ct:0 "You unlock #italic Activation of the Ancient Singularity#! [magic_special_project|E]"
 me_as_project_ct2:0 "$as_special_project$ [magic_special_project|E] may be randomly unlocked in the future."
 me_as_project_done_ct:0 "Ancient Singularity is active"
 ev9.38.desc:0 "Despite your efforts, you have not been able to obtain any additional leads on the Ancient Singularity. If such information exists, it is beyond your reach for now."
 ev9.39.desc:0 "One of your agents heard an interesting rumour - apparently [aowner.GetTitledFirstName] is in possession of some scroll that mentions the Ancient Singularity. This could be exactly what you're looking for!"
 ev9.39.0.a:0 "I will find a way to get the scroll."
 use_ac_inter_mod_cancel_negative_supply:0 "$ev2.73.a_ct$"
 use_singularity_agains_army_ct:0 "Armies in this province will be #N devastated#!."
 laamp_magic_1008_contract:0 "Secret Mission"
 laamp_magic_1008_request:0 "You have no idea what to expect from this [task_contract|E]."
 laamp_magic_1008_desc_title:0 "$laamp_magic_1008_contract$"
 laamp_magic_1008_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] is looking for a discreet witch to undertake a special mission. For now, all you know is that this is a very important task that only an experienced witch can handle."
 ev9.40.desc:0 "You and your men have reached [employer.GetTitledFirstNamePossessive] castle. The servant has told you to wait in the courtyard, [employer.GetTitledFirstName] will come to you shortly. You notice that there are a lot of guards around, you see tension in their movements. They are at the gate, at the windows, on the walls, it seems that they are getting more and more numerous every moment. 'Something is not right here.' - you hear [rcourt.GetFirstName] whisper. \nFinally [employer.GetTitledFirstName] appears, assisted by more guards. '[this0.GetTitledFirstName], we meet at last!' - [employer.GetSheHe] said. The castle gate slammed shut, cutting off your escape route."
 ev9.40.0.a:0 "What the heck is that supposed to mean!?"
 ev9.41.title:0 "The Trap"
 ev9.41.desc:0 "'I've been hunting you for some time, witch. It turns out that sometimes the simplest ways are the best, right? Kill them, kill all the witches!' \nThe guards move to attack and a rain of arrows falls on you from the walls."
 ev9.41.0.a:0 "To arms!"
 ev9.41.0.a_ct1:0 "You repel the first attack"
 ev9.41.0.a_ct2:0 "You are crushed"
 mass_followers_dying:0 "#N Your followers are slaughtered#!"
 ev9.41.0.b:0 "Defensive formation!"
 ev9.41.0.c:0 "Wait! I'm an undercover hunter too."
 ev9.41.0.c_ct1:0 "Your bluff has worked"
 ev9.41.0.c_ct1A:0 "You avoid bloodshed"
 ev9.41.0.d:0 "It will be easier when I use Power Strike."
 ev2.48.d_ct1:0 "Many enemies die"
 ev9.41.0.e:0 "Fools get a taste of Fire Storm."
 ev9.41.0.e_ct:0 "Enemies will be destroyed"
 ev9.41.0.f:0 "This is the right time to use the Singularity."
 ev9.41.0.g:0 "I will escape with the help of Shadow Step."
 ev9.41.0.g_ct:0 "#N You will escape, but your followers will be doomed#!"
 ev9.41.0.h:0 "If I am to die, they will die with me!"
 ev9.41.0.h_ct:0 "You are summoning a tornado!"
 ev9.41.0.h_ct2:0 "Most people in the castle will die"
 ev9.41.0.i:0 "I will murder them one by one!"
 ev9.41.0.j:0 "[demon.GetTitledFirstName], kill them!"
 ev9.41.0.j_ct:0 "Your Demon will do the slaughter and you will have the opportunity to retreat"
 ev9.41.0.k:0 "My power will smash them."
 ev9.42.desc:0 "'What a surprise, even I was fooled! I guess you're the clever one, huh? Sorry for my intrigue, everyone ploughs on as best they can. Let me know if I can help you with anything one day.'"
 ev9.42.0.a:0 "It was close..."
 ev9.43.title:0 "Destructive Force"
 ev9.43.desc:0 "The landscape changed in one moment - there is smoke and fire everywhere. The bodies of the attackers have been burned, and with them the hunter has probably died. Your power is immense."
 ev9.43.0.a:0 "I squashed them like bugs."
 ev9.43.0.b:0 "They left me no choice."
 ev9.44.desc0:0 "With great difficulty, you managed to fend off the first attack and make it to the nearby tower."
 ev9.44.desc1:0 "Your spell burned a few enemies, but their place was quickly taken by others. Fortunately, this gave you time to break through to a nearby tower."
 ev9.44.desc2:0 "\nYou've barricaded yourselves inside, and for a moment, you have some peace; the enemy is likely regrouping. The tower connects to the walls, which lead to the gate, but enemy archers are probably guarding that route. The good news is that the place you're in is favorable for defense."
 ev9.44.0.a:0 "Quick, to the gate before they regroup!"
 ev9.44.0.a_ct:0 "Your escape is #P progressing#!"
 ev9.44.1.a:0 "You managed to get to the gate"
 ev9.44.2.a:0 "Enemy archers shot you down like sitting ducks"
 ev9.44.0.b:0 "I need time to think."
 ev9.44.0.b_ct:0 "You are trying to put together a plan"
 suffering_casualties:0 "You are suffering casualties!"
 ev9.45.desc:0 "Enemies, however, do not give you time to act. You hear that they are preparing an assault on the tower. Some of your men are wounded, but most are able to fight."
 ev9.45.0.a:0 "Let them come here, we are ready!"
 ev9.45.0.a_ct:0 "You are repelling a second attack"
 ev9.45.0.b:0 "I can spray herbs that blind attackers."
 ev9.45.0.c:0 "I will burn anyone who tries to enter with a spell."
 ev9.46.desc:0 "The assault has been repulsed and a pile of attackers' bodies lies at the tower's entrance. You have a moment to devise a plan and treat your wounds. Meanwhile, you hear [employer.GetTitledFirstNamePossessive] voice from outside.\n"
 ev9.46.desc2:0 "'Impressive, witch. But we can still starve you out or simply set the tower on fire. I have a proposal—surrender, and I'll spare your companions, they will leave freely. And you will get a quick death.'"
 ev9.46.0.a:0 "We have to give up."
 ev9.46.0.a_ct:0 "Your followers will be spared"
 ev9.46.0.b:0 "I will negotiate better terms of surrender."
 ev9.46.0.b_ct:0 "You will be spared (for now...)"
 ev9.46.0.c:0 "We will continue to defend ourselves."
 ev9.47.desc:0 "Time passes, evening approaches. The opponents seem to be preparing for another assault, but they are in no hurry. You, on the other hand, are wondering how to break out of this trap. Something comes to mind..."
 ev9.47.desc2:0 "'Hey, you there! - it's [employer.GetTitledFirstName] again - 'We captured your man. Do you think I'm a fool? No one will come to help you, give up!'\nApparently you need a new plan..."
 ev9.47.0.a:0 "We have a lot of arrows and oil here. Well..."
 ev9.47.0.a_fl:0 "Has anyone mentioned anything about arson?"
 ev9.47.0.a_ct:0 "Shooting other parts of the castle with flaming arrows could cause chaos — making escape easier."
 ev9.47.0.a_ct2:0 "You will use distraction to run along the walls to the gate."
 ev9.47.0.b:0 "We need to send a message to the camp."
 ev9.47.0.b_fl:0 "A single man has the chance to escape unnoticed - and call in our troops."
 ev9.47.0.b_ct:0 "You must hold out until reinforcements arrive"
 ev9.47.1.b:0 "The message will be delivered"
 ev9.47.2.b:0 "Courier will be captured"
 ev9.47.0.c:0 "I will summon a Demon."
 ev9.47.0.c_fl:0 "The Demon will certainly cause confusion in the enemy ranks, as long as it doesn't turn against you."
 ev9.47.0.c_ct:0 "The result will be unpredictable"
 ev9.47.0.d:0 "I will disintegrate the wall so we can escape."
 ev9.47.0.d_fl:0 "$master_alteration_modifier$ will effortlessly turn solid rock into air."
 ev9.47.0.e:0 "I will prepare a spell of Mass Domination."
 ev9.47.0.e_fl:0 "$master_psionic_modifier$ can turn some enemies against each other if circumstances are favourable."
 ev9.47.0.e_ct:0 "This will create an opportunity to escape!"
 ev9.47.0.f:0 "I think a tornado spell will distract enemies."
 ev9.47.0.f_fl:0 "The tornado spell is unpredictable, but unless the storm directly hits the tower, you should be safe."
 ev9.47.0.f_ct:0 "This will create an opportunity to escape!"
 ev9.47.0.g_fl:0 "Surrender is sometimes the only option."
 ev9.48.desc:0 "You managed to reach the gate, which was guarded, but you quickly dealt with the guards. You damaged the gate's grate so it couldn't be lifted — making pursuit more difficult — and then you lowered yourselves down the other side using ropes. You are free."
 ev9.48.0.a:0 "Let's disappear before they get organized."
 ev9.48.0.b:0 "One day I will get revenge for that."
 ev9.49.desc:0 "A demon appeared in the chamber, and with it the intense stench of sulphur. The demon does not look happy.\n'You interrupted my meal, mortal. Why are you bothering me?'"
 ev9.49.0.a:0 "I have better food for you. Outside."
 ev9.50.desc:0 "'What are you talking about? Is there a catch here?' - demon looks interested."
 ev9.50.0.a:0 "I can release you if you kill some soldiers for me."
 ev9.51.desc:0 "'Mortal, you had my curiosity but now you have my attention.'\nYou explained your situation to the demon and it seems you reached an understanding. Although such a number of soldiers could overwhelm even a demon, his attack will certainly cause enough chaos for you to break out of the encirclement. After a moment, you released the demon from the makeshift summoning circle and it left the tower. Outside, you hear screams of terror and pain, as if you unleashed all of hell, not just one demon!"
 ev9.51.0.a:0 "Quick! To the gate!"
 MAGIC_HEALING_SCARS:0 "Remove scars."
 rol_special1_terrain_cancel_negative_supply:0 "Enables Healing spell for mages"
 rol_special2_terrain_cancel_negative_supply:0 "Healing removes genetic defects"
 visited_place_of_power:0 "You have visited a place of power!"
 laamp_magic_1009_contract:0 "Monster Hunt"
 laamp_magic_1009_request:0 "This [task_contract|E] requires magical skills and high power saturation."
 laamp_magic_1009_desc_title:0 "$laamp_magic_1009_contract$"
 laamp_magic_1009_desc:0 "There is a monster prowling the kingdom of [TaskContract.GetEmployer.GetTitledFirstName], or at least that's what the rumour says. Whatever it is, it is killing people and no one can stop it. [TaskContract.GetEmployer.GetTitledFirstName] is willing to pay in gold to solve the problem."
 ev9.52.desc:0 "You had a conversation with [employer.GetTitledFirstName] to gather basic information about your task. For some time, local peasants had been disappearing without a trace, but no one cared because they were just peasants. However, recently, the body of one of the courtiers, [dead_courtier.GetTitledFirstName], was found at the edge of the forest. It looked like [dead_courtier.GetSheHe] had been mauled by some wild animal, but when hunters went to track it down, none of them returned. A military patrol was also sent out, the soldiers disappeared without a trace as well. [employer.GetTitledFirstName] then decided to call in a professional — someone like you. "
 ev9.52.0.a:0 "I want to see the body."
 ev9.53.desc:0 "[dead_courtier.GetTitledFirstName] was found a few days ago, so the body is already in a state of decay, but you still notice the claw marks on [dead_courtier.GetHerHis] body. These are not shallow scratches, rather something has gutted [dead_courtier.GetHerHim]. It must have been a painful death."
 ev9.53.0.a:0 "I want to see where [dead_courtier.GetSheHe] was found."
 ev9.53.0.b:0 "I will do a dissection."
 ev9.53.0.c:0 "I will look for signs of magic."
 ev9.53.0.d:0 "I will look at the claw marks."
 ev9.53.0.e:0 "I will try to read the aura."
 ev9.53.0.f:0 "I have a bad feeling about it - I give up."
 ev9.53.desc1:0 "The courtier suffered severe injuries and a prolonged, agonizing death. In fact, the layout and size of the wounds suggest that the pain lasted a very long time, as if whatever killed [dead_courtier.GetHerHim] wanted to keep [dead_courtier.GetHerHis] alive for as long as possible. Animals don't work that way. You also notice that the liver and heart are gone."
 ev9.53.desc2:0 "You seem to sense faint traces of a magical aura on the corpse, but are unable to say anything more. Perhaps it's a coincidence or some kind of magical echo?"
 ev9.53.desc3:0 "You have looked at the wounds, but all you can say about them is that you have not heard of an animal that inflicts wounds of this type."
 ev9.53.desc4:0 "The aura is too faint for you to read it clearly, but you were able to determine that [dead_courtier.GetTitledFirstName] was certainly not a mage or even the target of a spell. But the thing that killed [dead_courtier.GetHerHim] might have had some magic in it."
 ev9.54.desc:0 "You have reached the place where the body was found. There are no marks here, except that the ground is a little darker in one place - soaked in the blood of the deceased. You probably won't find anything of interest here."
 ev9.54.0.a:0 "I think I'll have a look around the area."
 ev9.54.0.a_ct:0 "You take the road that hunters and soldiers may have taken before."
 ev9.55.desc:0 "The area becomes swampy, there is a strange smell in the air. You also get the unpleasant feeling that someone or something is watching you. Perhaps this solo expedition was not a good idea."
 ev9.55.0.a:0 "I go on, the answer must be close at hand."
 ev9.55.0.a1:0 "You find the trail."
 ev9.55.0.a1_ct:0 "You are getting closer to solving the puzzle"
 ev9.55.0.a2:0 "You've gone astray."
 ev9.55.0.a2_ct:0 "You have no idea where you are"
 ev9.55.0.b:0 "I will look for traces."
 ev9.55.0.c:0 "I'm going back to the castle, it's about to get dark."
 ev9.55.0.c_ct:0 "You decide to return to the castle and your companions"
 ev9.56.desc1:0 "As you turned to walk back to the castle you discovered that someone was behind you...\n"
 ev9.56.desc0:0 "You have managed to find the right path, clearly a lot of people have passed this way recently. You were so focused on the trail that you didn't notice that you weren't alone here.\n"
 ev9.56.desc:0 "'Have you gone astray, [this0.Custom('GetProperWitchDesc')]?'\nA being has stepped out of the shadows. At first glance it resembles a human, but you can smell the sulphur and magic, and the sheer wickedness in the creature's gaze. It is a Demon."
 ev9.56.0.a:0 "$ev53.0.a$"
 ev9.56.0.b:0 "So it's probably you I'm looking for."
 behemoth_name:0 "Behemoth"
 mage_small_letter:0 "mage"
 witch_small_letter:0 "witch"
 ev9.57.desc:0 "'Well said. I guess the local overlord has a bit of a problem with me killing his subjects one by one. And he sends me another tasty morsel. Yum.'"
 ev9.57.0.a:0 "You will die, Demon!"
 ev9.57.0.b:0 "I am not looking for trouble..."
 ev9.58.desc:0 "'But trouble has found you!' - the Demon moves to attack."
 ev9.58.0.a:0 "You will regret this."
 ev9.57.1.a:0 "You defeat the Demon"
 ev9.57.2.a:0 "The Demon is tearing you to pieces"
 ev9.59.desc:0 "You struggled to defeat the Demon, having never fought such a fast and strong opponent before. Such a trophy will certainly impress your employer."
 ev9.59.0.a:0 "Case closed."
 ev9.60.desc:0 "'So the local ruler sent a mage to deal with the problem? Impressive determination.'"
 ev9.60.0.a:0 "Who summoned you?"
 ev9.61.desc:0 "'Some under-educated wizard. I snapped out of his control and started exploring your beautiful world. It is full of tasty morsels... and surprises.'"
 ev9.61.0.a:0 "I will send you to the abyss."
 ev9.62.desc:0 "'I don't want to go back there. But I don't want to fight you either, I can sense that you are strong. How about some kind of compromise? I will join you as your servant.'"
 ev9.62.0.a:0 "Trust a Demon? Never."
 ev9.62.0.b:0 "Let it be. Let's go back to camp."
 ev9.63.desc:0 "'Good approach, but you will still die' - the demon pounced on you."
 ev9.63.0.a:0 "I will burn [demon2.GetHerHim] with my power."
 ev9.63.0.b:0 "I will cut [demon2.GetHerHim] into slices."
 ev9.64.desc:0 "You and the Demon wander towards the camp. You are pondering what to say to [employer.GetTitledFirstName] when suddenly a powerful blow knocks you to the ground. You realize that you are lying dazed in a pool of your own blood, unable to do anything.\n'So humans are fools after all. At least you are tasty. I am curious to know what a Mage's liver tastes like. I see you are literally dying of curiosity too...'"
 ev9.64.0.a:0 "No...!"
 ev3.29.n:0 "Destruction."
 ev3.34.i:0 "This will make wars much easier."
 ev3.34.i_ct:0 "You get access to #italic the Tornado spell#! [interaction|E]"
 tornado_spell:0 "Tornado"
 tornado_spell_desc:0 "It is a spell designed to destroy enemy armies, although its effects can sometimes get out of hand."
 tornado_spell_ct:0 "The tornado will strike the target's army or its realm."
 ev9.65.desc:0 "The Tornado spell is ready! Now you just need to choose the exact target of the strike..."
 ev9.65.0.a:0 "I will send a tornado to where [recipient.GetTitledFirstName] is."
 ev9.65.0.b:0 "A tornado will hit the capital of [recipient.GetTitledFirstName]."
 ev9.65.0.c:0 "[army1.GetName] will be destroyed."
 ev9.65.0.d:0 "A tornado will wipe out [army2.GetName]."
 ev9.65.0.e:0 "However, I'll wait for a better moment."
 ev9.65.0.e_ct:0 "The spell will not be cast."
 use_tornado_spell_army_ct:0 "The army will be #N devastated#!."
 use_tornado_spell_army_ct2:0 "All armies in the same province will be #N devastated#!."
 use_tornado_spell_army_ct3:0 "Characters in the area may be #N injured#!."
 use_tornado_spell_destruction_ct:0 "A tornado wreaks havoc!"
 tornado_notification_ct:0 "A tornado #N devastates#! your army!"
 tornado_spell_modifier:0 "Tornado Effects"
 ev7.129.g:0 "A meteor shower will fall on my enemies."
 ev7.129.g_ct:0 "Some enemy armies will be #N devastated#!."
 ev7.129.g_ct2:0 "One of your armies has been devastated."
 ancient_archmage_modifier:0 "Ancient Archmage"
 md_power_clash2_terrain_advantage:0 "Progress of the opponent's [power_clash|E]"
 YOUR_SMP_IS_HIGHER:0 "The target must have a higher potential than you"
