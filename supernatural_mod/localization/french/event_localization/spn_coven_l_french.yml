l_french:
 spn_coven.0001.t:0 "Your Coven"
 spn_coven.0001.desc:0 "Your house is a coven now. The witches of your blood know each other, and they will stand together.\n\nYou can see who belongs to it, and what they have pledged, in your Situations."
 spn_coven.0001.desc_owner:0 "Your house is a coven now, and you lead it. The witches of your blood answer to you.\n\nYou can see who belongs to it, and what they have pledged, in your Situations."
 spn_coven.0001.a:0 "We are stronger together"
 spn_coven.0010.t:0 "The Sisters Ask What You Are"
 spn_coven.0010.desc:0 "[spn_sa_owner.GetTitledFirstName] has noticed the nights you are not at home. [spn_sa_owner.GetSheHe|U] asks you, in front of the others, where you go.\n\nThe coven keeps no secrets from itself. The [spn_order|E] keeps nothing but secrets."
 spn_coven.0010.a:0 "Tell them about the Order"
 spn_coven.0010.b:0 "Lie to my own"
 spn_coven_lie_tt:0 "The better your [intrigue|E], the likelier they believe you. If they do not, they find out anyway, and they will not forget that you lied."
