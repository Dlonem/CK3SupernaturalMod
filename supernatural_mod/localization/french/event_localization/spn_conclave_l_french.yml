l_french:
 spn_conclave:0 "Conclave"
 spn_conclave_name:0 "Conclave"
 spn_conclave_desc:0 "Call the masks together. The temples meet, settle their business and, when the chair is empty, choose who sits in it."
 spn_conclave_host_desc:0 "$BULLET_WITH_TAB$Every member gains [spn_order_standing|E]\n$BULLET_WITH_TAB$Rule-breakers are judged and new members take their oath\n$BULLET_WITH_TAB$With the chair empty, the Temple Magi elect the Grand Magus"
 spn_conclave_guest_desc:0 "$BULLET_WITH_TAB$Every member gains [spn_order_standing|E]\n$BULLET_WITH_TAB$Temple Magi and seat holders vote for the chair"
 spn_conclave_selection_tooltip:0 "Gather the temples of the Order in masks."
 spn_conclave_destination_selection:0 ""
 spn_conclave_province_desc:0 "A quiet place the masks can reach."
 spn_conclave_predicted_cost:0 "Discretion costs money."
 spn_conclave_guest_help_text:0 "Members who come are seen, and those of rank can vote."
 spn_conclave_conclusion_desc:0 "The [GetActivityType( 'spn_conclave' ).GetName] has ended. The masks go home by different roads."
 spn_conclave_host_an_a:0 "a Temple Magus"
 spn_conclave_cost_desc:0 "Rooms, silence and wine"
 spn_conclave_prov_base:0 "A seat the masks can reach.\n"
 spn_conclave_location_tt:0 "A county seat you hold"
 spn_conclave_one_at_a_time_tt:0 "No other Conclave is under way"
 spn_conclave_cooldown_tt:0 "There has been no Conclave in the last five years"
 TRAVEL_NAME_FOR_spn_conclave:0 "[Character.GetFirstNamePossessiveNoTooltip] journey to see old friends"
 spn_conclave_masks_phase:0 "The Masks"
 spn_conclave_masks_phase_desc:0 "The temples arrive, and nobody uses a name."
 spn_conclave_reckoning_phase:0 "The Reckoning"
 spn_conclave_reckoning_phase_desc:0 "Deeds are counted and rule-breakers are judged."
 spn_conclave_anointing_phase:0 "The Anointing"
 spn_conclave_anointing_phase_desc:0 "New members take their oath in front of every temple."
 spn_conclave_vote_phase:0 "The Vote"
 spn_conclave_vote_phase_desc:0 "When the chair is empty, the Temple Magi choose who sits in it. Then the seats are filled."
 activity_invite_rule_spn_order:0 "The Temples"
 activity_invite_rule_spn_order_desc:0 "Every member of the Order within your reach."
 spn_conclave_join_temple_magus:0 "A Temple Magus does not miss a Conclave"
 spn_conclave_join_council:0 "Sits on the council"
 spn_conclave_join_oath:0 "Waiting to take the oath"
 spn_conclave_join_devoted:0 "Devoted to the Order"
 spn_conclave_join_shy:0 "Dislikes a crowd"
 spn_conclave_preside_intent:0 "Preside"
 spn_conclave_preside_intent_desc:0 "Run the Conclave as it should be run. You gain [spn_order_standing|E] and prestige."
 spn_conclave_attend_intent:0 "Watch and Learn"
 spn_conclave_attend_intent_desc:0 "Keep your mask on and your eyes open. You gain a little [spn_order_standing|E]."
 spn_seek_the_chair_intent:0 "Seek the Chair"
 spn_seek_the_chair_intent_desc:0 "Stand for Grand Magus when the vote comes. The Temple Magi weigh who came for it."
 spn_seek_a_seat_intent:0 "Seek a Seat"
 spn_seek_a_seat_intent_desc:0 "Let it be known you want a seat on the [spn_gnostic_council|E]. You are named first when one is filled."
 spn_speak_for_my_temple_intent:0 "Speak for My Temple"
 spn_speak_for_my_temple_intent_desc:0 "Make sure the other temples hear what yours has done. You gain more [spn_order_standing|E]."
 spn_find_a_teacher_intent:0 "Find a Teacher"
 spn_find_a_teacher_intent_desc:0 "Leave the Conclave with a tutor."
 spn_borrow_from_another_temple_intent:0 "Borrow from Another Temple"
 spn_borrow_from_another_temple_intent_desc:0 "Leave with something from another temple's [spn_reliquary|E], on loan for three years."
 spn_ask_for_the_working_intent:0 "Ask for the Transference"
 spn_ask_for_the_working_intent_desc:0 "Ask a Magistratus to perform the [spn_order_transference|E] for you, with volunteers already in the room."
 spn_make_an_entrance_intent:0 "Make an Entrance"
 spn_make_an_entrance_intent_desc:0 "Bring proof of what you have done: a golem or a demon destroyed, or a magical item of note laid on the table. An acolyte who does this is raised to Medicum."
 spn_conclave_chair_empty_tt:0 "The chair of the Grand Magus is empty"
 spn_conclave_no_tutor_tt:0 "You have no tutor"
 spn_conclave_log_chair_title:0 "A New Grand Magus"
 spn_conclave_log_chair:0 "The Temple Magi chose [CHARACTER.GetTitledFirstName] to sit in the chair."
 spn_conclave_log_seat_title:0 "A Seat Is Filled"
 spn_conclave_log_seat:0 "[CHARACTER.GetTitledFirstName] takes a seat on the Gnostic Council."
 spn_conclave_toast_entrance:0 "An Entrance"
 spn_conclave_toast_entrance_desc:0 "Someone has laid proof of their deeds before the whole Conclave."
 spn_conclave_call_decision:0 "Call a Conclave"
 spn_conclave_call_decision_desc:0 "Summon the temples of the Order to meet in masks."
 spn_conclave_call_decision_tooltip:0 "Gather the temples."
 spn_conclave_call_decision_confirm:0 "Send the summons"
 spn_conclave_call_decision_effect_tt:0 "You can plan a [spn_conclave|E] at a county seat you hold."
 spn_conclave.0001.t:0 "The Masks Must Meet"
 spn_conclave.0001.desc_chair:0 "The chair of the Grand Magus is empty, and the temples will not wait for ever. Yours is the oldest temple, so it falls to you to call them together.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_prerogative:0 "Ten years have passed since the [spn_order|E] last decided what it works toward. The temples expect to be called.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_will:0 "You have decided the temples should meet. The notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_second:0 "\n\n[spn_cv_second.GetTitledFirstName] brings the paper and the wax, and waits to hear where."
 spn_conclave.0001.a:0 "Choose where they will meet"
 spn_conclave.0001.b:0 "Not yet"
 spn_conclave.0001.b.tt:0 "You can still plan the Conclave from the activity list for two years."
 spn_conclave.0002.t:0 "The Conclave Begins"
 spn_conclave.0002.desc:0 "They arrive after dark, one at a time, by different doors. Nobody says a name. Nobody needs to.\n\nWhen the last of them is inside, the doors are barred and the masks turn to you."
 spn_conclave.0002.a:0 "Let us begin"
 spn_conclave.0100.t:0 "A Familiar Mask"
 spn_conclave.0100.desc:0 "One of the masks from another temple keeps glancing your way. When the wine comes round, [spn_cv_stranger.GetSheHe] stands beside you and says quietly that you have the look of someone who studies too late at night.\n\nYou know that voice. You have heard it somewhere outside these walls."
 spn_conclave.0100.a:0 "Lift my mask a little"
 spn_conclave.0100.a.tt:0 "You each learn who the other is. A friendship may start here."
 spn_conclave.0100.b:0 "Say nothing"
 spn_conclave.0100.b.tt:0 "Silence is the first of the three words."
 spn_conclave.0110.t:0 "The Old Story"
 spn_conclave.0110.desc:0 "An old Magistratus tells the newer members how it began: a handful of scholars who found that some of the old books were true, and swore to keep that knowledge from kings.\n\nHe tells them about the two sisters who nearly ended the Order, and why the dead are never raised by its members. He tells them why the masks: so that a member taken by hunters cannot name more than a face."
 spn_conclave.0110.a:0 "Ask about the books"
 spn_conclave.0110.a.tt:0 "You learn something about magic."
 spn_conclave.0110.b:0 "Ask about the hunters"
 spn_conclave.0110.b.tt:0 "You learn something about staying hidden."
 spn_conclave.0120.t:0 "A Mask Knows Too Much"
 spn_conclave.0120.desc:0 "Someone in a plain grey mask passes behind you and murmurs a detail of your life that nobody here should know.\n\nWhen you turn round, the grey mask is already across the room, talking to someone else."
 spn_conclave.0120.a:0 "Find out who it was"
 spn_conclave.0120.a.success:0 "You Found Them"
 spn_conclave.0120.a.success_desc:0 "You caught the grey mask alone. They meant it as a test, and you passed."
 spn_conclave.0120.a.failure:0 "Gone"
 spn_conclave.0120.a.failure_desc:0 "The grey mask was nowhere to be found. It bothers you for days."
 spn_conclave.0120.b:0 "Let it go"
 spn_conclave.0120.b.tt:0 "Observance: you will learn who it was in time."
 spn_conclave.0200.t:0 "The Accused"
 spn_conclave.0200.desc:0 "[spn_cv_accused_one.GetTitledFirstName] stands in the middle of the circle with [spn_cv_accused_one.GetHerHis] mask in [spn_cv_accused_one.GetHerHis] hands. [spn_cv_accused_one.GetSheHe|U] broke the rules of the [spn_order|E], and every temple knows it.\n\nThe masks wait for you to speak."
 spn_conclave.0200.a:0 "Forgiven"
 spn_conclave.0200.a.tt:0 "The matter is closed. [spn_cv_accused_one.GetFirstName] will remember who closed it."
 spn_conclave.0200.b:0 "A penance"
 spn_conclave.0200.b.tt:0 "[spn_cv_accused_one.GetFirstName] loses [spn_order_standing|E], and the matter is closed."
 spn_conclave.0200.c:0 "Cast out"
 spn_conclave.0200.c.tt:0 "[spn_cv_accused_one.GetFirstName] is cast out of the Order."
 spn_conclave.0300.t:0 "An Entrance"
 spn_conclave.0300.desc_item:0 "The oaths are halfway done when you walk in late, unmasked, and lay [spn_cv_proof_art.GetName] on the table in front of everyone.\n\nThe room goes very quiet."
 spn_conclave.0300.desc_kill:0 "The oaths are halfway done when you walk in late and roll what is left of your kill across the floor. It comes to rest at the feet of the Temple Magi.\n\nThe room goes very quiet."
 spn_conclave.0300.desc_raised:0 "\n\nWhen the talking starts again, it is about you. Before the night is over you are named Medicum, and the Grand Magus tells you, in front of everyone, that the Order will expect great things of you."
 spn_conclave.0300.a:0 "I will not disappoint you"
 spn_conclave.0400.t:0 "The Vote"
 spn_conclave.0400.desc:0 "The chair of the Grand Magus stands empty at the head of the room. One by one, the Temple Magi who want it stand beside it.\n\nWhen your turn comes, you write a name on a slip of paper and drop it in the bowl."
 spn_conclave.0400.c1:0 "[spn_cv_c1.GetTitledFirstName]"
 spn_conclave.0400.c2:0 "[spn_cv_c2.GetTitledFirstName]"
 spn_conclave.0400.c3:0 "[spn_cv_c3.GetTitledFirstName]"
 spn_conclave.0400.c4:0 "[spn_cv_c4.GetTitledFirstName]"
 spn_conclave.0400.abstain:0 "Leave the slip blank"
 spn_conclave.0410.t:0 "Fill the Seats"
 spn_conclave.0410.desc:0 "A seat on the [spn_gnostic_council|E] is empty. As Grand Magus, you name who fills it, and the temples confirm your choice."
 spn_conclave.0410.n1:0 "[spn_cv_n1.GetTitledFirstName]"
 spn_conclave.0410.n2:0 "[spn_cv_n2.GetTitledFirstName]"
 spn_conclave.0410.n3:0 "[spn_cv_n3.GetTitledFirstName]"
 spn_conclave.0410.none:0 "Leave it empty for now"
 spn_conclave.0410.none.tt:0 "You can invite someone to the council later."
