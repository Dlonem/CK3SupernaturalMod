 #####################

 ### Main Concepts ###

 #####################

 

 game_concept_vampire:0 "Vampire"

 game_concept_vampires:0 "Vampires"

 game_concept_vampire_desc:0 "Vampires are immortal supernatural beings cursed with a thirst for blood. They walk among humans, hiding their true nature. Their strength is unmatched by any mortal, and they possess enhanced speed and the ability to control the actions of others. Despite their immense power, they face eternal struggles between their predatory instincts and remnants of their humanity."



 game_concept_werewolf:0 "Werewolf"

 game_concept_werewolves:0 "Werewolves"

 game_concept_werewolf_desc:0 "Werewolves are supernatural beings endowed with immense strength, agility, and heightened senses. Their curse compels them to embrace their dual nature, transforming into powerful beasts. Despite their primal instincts, werewolves often form strong packs and live among humans, balancing their humanity with the call of the wild."



 game_concept_hybrid:0 "Hybrid"

 game_concept_hybrids:0 "Hybrids"

 game_concept_hybrid_desc:0 "Hybrids are near-mythical beings born from the fusion of vampire and werewolf bloodlines. Their existence defies natural law, granting them the combined strengths of both: immortality, unmatched power, and the ability to walk between worlds without many of the limitations that burden their kin. Hybrids stand as living legends, their presence both awe-inspiring and feared."



 game_concept_spn_hunter:0 "Hunter"

 game_concept_spn_hunters:0 "Hunters"

 game_concept_spn_hunter_desc:0 "Hunters are skilled and dedicated warriors tasked with protecting the world from supernatural threats. They specialize in two disciplines: Monster Hunting, which targets vampires, werewolves, and other creatures, and Witch Hunting, which focuses on rogue magic users. Their resolve and training make them humanity's first line of defense against the unknown."



 ###################

 ### Men At Arms ###

 ###################

 game_concept_supernatural_animals:0 "Animals"

 game_concept_supernatural_animal:0 "Animal"

 game_concept_animal:0 "Animal"

 game_concept_supernatural_animal_desc:0 "Animals are [men_at_arms|E] who are commanded by Supernatural Monsters, skilled in harassing the enemy.\n\nWhile their quality may be low, they make up in quantity, they generally [counter|E] [archers|E]." 

 

 game_concept_supernatural_monsters:0 "Monsters"

 game_concept_supernatural_monster:0 "Monster"

 game_concept_monster:0 "Monster"

 game_concept_supernatural_monster_desc:0 "Monsters are [men_at_arms|E] who are commanded by other, more powerful Supernatural Monsters, skilled in decimating an untrained enemy.\n\nWhile their quantity may be low, their high quality shines through. They generally [counter|E] [archers|E]."

  

 #game_concept_werewolf:0 "Werewolf"

 game_concept_were-wolves:0 "Werewolves"

 game_concept_werewolves_desc:0 "Werewolves are [men_at_arms|E] who are commanded by other, more powerful Supernatural Monsters, skilled in decimating an untrained enemy.\n\nWhile their quantity may be low, their high quality shines through."

 

 game_concept_feeding_success_chance_no_prefix:0 "Feeding Success Chance"

 game_concept_feeding_success_chance:0 "Feeding Success Chance"

 game_concept_feeding_success_chance_desc:0 "When engaging in [GetActivityType('vampire_feeding').GetName], success is not guaranteed. The main factors that influence your feeding success are:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] or [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] of the targeted area\n$BULLET_WITH_TAB$Chosen preparation and [intent|E] during the activity\n\n$game_concept_feeding_success_chance$ can never be higher than #V 95#!.\n\n#weak Successful feedings enhance your vampiric strength. Discretion is key; failure may expose your nature to the world.#!"

 game_concept_feeding_success_chance_no_prefix_desc:0 "When engaging in [GetActivityType('vampire_feeding').GetName], success is not guaranteed. The main factors that influence your feeding success are:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] or [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] of the targeted area\n$BULLET_WITH_TAB$Chosen preparation and [intent|E] during the activity\n\n$game_concept_feeding_success_chance$ can never be higher than #V 95#!.\n\n#weak Successful feedings enhance your vampiric strength. Discretion is key; failure may expose your nature to the world.#!"


### added by sync_localizations.py -- untranslated, 14 keys
 game_concept_mmaker:0 "Sire"
 game_concept_mmaker_plural:0 "Sires"
 game_concept_mmaker_desc:0 "A [Concept('vampire','Vampire')|E] who has created another vampire. A Sire shares a supernatural tie with their [Concept('pprogeny','Progeny')|E] that can grant insight, loyalty, and—at times—outright influence. Some powers and interactions reference this bond, allowing a Sire to assert their will when conditions are met."
 game_concept_pprogeny:0 "Progeny"
 game_concept_pprogeny_plural:0 "Progeny"
 game_concept_pprogeny_desc:0 "A vampire created by a [Concept('mmaker','Sire')|E]. Progeny often feel the pull of their maker’s blood, a lingering tie that may sway emotions or decisions. Certain events and interactions can exploit this connection—though strength of will, distance, and circumstance can blunt it."
 game_concept_sire_bond:0 "Sire Bond"
 game_concept_sire_bond_desc:0 "The occult tether between a [Concept('mmaker','Sire')|E] and their [Concept('pprogeny','Progeny')|E]. In practice it manifests as deference, shared instincts, and occasional compulsion. Mods and mechanics may leverage this to unlock unique options (e.g., #bold Invoke the Bond#!) or modify acceptance chances."
 game_concept_vampire_feeding:0 "Vampire Feeding"
 game_concept_feeding:0 "feeding"
 game_concept_feedings:0 "feedings"
 game_concept_feeding_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_feedings_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_vampire_feeding_desc:0 "Vampire Feeding is an [activity|E] in which a [Concept('vampire','Vampire')|E] or [Concept('hybrid','Hybrid')|E] hunts a mortal for blood, usually in one of your towns.\n\nA clean, undiscovered feeding quietly bleeds the host county—both its [development|E] and its Control fall. Poorer, less-controlled lands are the easiest prey, so vampires hunt your weakest holdings first.\n\nYou will rarely catch a feeder in the act. When a county's development or control slips for no clear reason, a vampire may be hunting there—but you will only think to look if you know one walks your realm."
