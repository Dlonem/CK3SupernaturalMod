 l_russian:
 immortality_ring:0 "Кольцо Вечности"
 immortality_ring_desc:0 "Неизвестное происхождение, известно немного, кроме неприятного удлинения жизни и защиты от враждебной магии."
 magic_catalyst:0 "Магический Катализатор"
 magic_catalyst_desc:0 "Ходят слухи, что этот камень упал с неба много веков назад. Позволяет обладателю нарушать защитные руны и защиту демонов."
 magic_catalyst_tooltip:0 "Вы можете колдовать даже если цель имеет магическую защиту (кроме защиты Кольца Жизни)"
