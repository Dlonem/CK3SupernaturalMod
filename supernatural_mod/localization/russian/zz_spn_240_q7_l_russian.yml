 spn_puppet.0011.desc_wound:0 "[spn_golem.GetShortUIName] нашёл [spn_golem_target.GetShortUIName] и жестоко избил [spn_golem_target.GetHerHim]. [spn_golem_target.GetSheHe|U] знает, кто послал [spn_golem.GetHerHim]."
 spn_puppet.0011.desc_wound_unknown:0 "[spn_golem.GetShortUIName] нашёл [spn_golem_target.GetShortUIName] и жестоко избил [spn_golem_target.GetHerHim], а затем исчез прежде, чем кто-либо успел спросить, кто послал [spn_golem.GetHerHim]. Твоё имя не прозвучало."
 spn_puppet.0011.desc_death:0 "[spn_golem.GetShortUIName] нашёл [spn_golem_target.GetShortUIName] и сразил [spn_golem_target.GetHerHim]. [spn_golem_target.GetSheHe|U] больше не поднялся. Все знают, кто отдал приказ."
 spn_puppet.0011.desc_death_unknown:0 "[spn_golem.GetShortUIName] нашёл [spn_golem_target.GetShortUIName] и сразил [spn_golem_target.GetHerHim]. [spn_golem_target.GetSheHe|U] больше не поднялся. Винят [spn_golem.GetShortUIName]; твоего имени никто не назвал."
 spn_puppet.0011.desc_failure:0 "[spn_golem.GetShortUIName] возвращается, не нанеся ни одного удара. [spn_golem_target.GetShortUIName] сбежал и теперь знает, кто послал [spn_golem.GetHerHim]."
 spn_puppet.0011.desc_failure_unknown:0 "[spn_golem.GetShortUIName] возвращается, не нанеся ни одного удара. [spn_golem_target.GetShortUIName] сбежал, но так и не узнал, кто послал [spn_golem.GetHerHim]."
