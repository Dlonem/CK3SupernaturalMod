l_russian:
 spn_golem_puppet:0 "Голем"
 spn_golem_puppet_desc:0 "Твой голем действует за тебя. Щёлкни правой кнопкой по персонажу и действуй как голем, чтобы он схватил его для твоей [prison|E], избил, навис над ним, охранял его, замыслил его убийство, соблазнил, завёл с ним роман или подружился, выучил его язык или отдал ему то, что несёт. Если голем владеет землёй, он может также заключать в темницу, освобождать и миловать, как правитель. Щёлкни правой кнопкой по себе, чтобы он охранял тебя или прислал тебе своё золото. Его собственные приказы — на этой карточке."
 spn_golem_puppet_concept_desc:0 "Привязанный к тебе голем может быть твоей [puppet|E]. Он сделан из глины и магии, намного сильнее человека и подчиняется только своему хозяину.\n\nЧерез него ты можешь схватить кого-то и унести в свою [prison|E], избить кого-то, запугать кого-то, чтобы он уступил тебе, или поставить голема охранять кого-то в течение года, в том числе тебя. Тот, кто от него ушёл или был им избит, не всегда узнаёт, кто его послал; тот, кого он запугал, узнаёт всегда. Он может также замыслить собственное убийство, соблазнять, заводить романы и дружбу, выучить язык, передать то, что несёт, прислать тебе своё золото и делиться увиденными тайнами или раскрывать их. Голем, владеющий землёй, может заключать в темницу, освобождать и миловать, как правитель.\n\nТы также можешь приказать ему передать то, что он несёт, вернуться домой, рассказать, что он видел, охранять тебя или вернуться в глину, а когда в игре [spn_vade_maecum|E] — искать её страницы.\n\nНовый голем становится твоей марионеткой, когда его создают. Голем, который у тебя уже был, становится ею через «Сделать голема марионеткой». У тебя может быть только одна марионетка-голем одновременно. Голем, чей хозяин ушёл, никому не подчиняется; любой Маг может взять его себе через «Привязать голема без хозяина»."
 spn_bind_golem_interaction:0 "Сделать голема марионеткой"
 spn_bind_golem_interaction_desc:0 "Сделай [recipient.GetFirstName] своей [puppet|E]-големом. Затем ты сможешь действовать через него и отдавать ему приказы из списка своих марионеток."
 spn_bind_golem_interaction_tt:0 "[recipient.GetFirstName] становится твоей [puppet|E]-големом."
 spn_bind_golem_replaces_tt:0 "Твоя нынешняя [puppet|E]-голем откладывается. Она остаётся привязанной к тебе и всё ещё подчиняется «Приказать прислужнику»."
 spn_golem_return_to_clay_decision:0 "Вернуться в глину"
 spn_golem_return_to_clay_decision_desc:0 "Прикажи голему развоплотить себя."
 spn_golem_return_to_clay_decision_tooltip:0 "Всё, что несёт голем, переходит к тебе. Затем он становится просто глиной."
 spn_golem_return_to_clay_decision_confirm:0 "Развоплотить"
 spn_golem_return_to_clay_tt:0 "Всё, что несёт голем, — его золото и имущество — переходит к тебе. Затем он становится просто глиной."
 spn_golem_return_to_clay_toast_tt:0 "Голем отдал тебе то, что нёс. Затем он стал просто глиной."
 spn_golem_hand_over_decision:0 "Отдать то, что несёшь"
 spn_golem_hand_over_decision_desc:0 "Прикажи голему отдать тебе всё, что он несёт."
 spn_golem_hand_over_decision_tooltip:0 "Голем отдаёт тебе своё золото и имущество."
 spn_golem_hand_over_decision_confirm:0 "Отдай мне"
 spn_golem_hand_over_tt:0 "Голем отдаёт тебе всё своё золото и всё имущество, которое может отдать."
 spn_golem_carries_nothing_tt:0 "Голем несёт золото или имущество, которое может отдать"
 spn_golem_come_home_decision:0 "Вернуться домой"
 spn_golem_come_home_decision_desc:0 "Отзови голема обратно ко двору."
 spn_golem_come_home_decision_tooltip:0 "Голем возвращается к твоему двору. Если он на поисках, поиски прекращаются."
 spn_golem_come_home_decision_confirm:0 "Возвращайся"
 spn_golem_already_home_tt:0 "Голем находится вне твоего двора или на поисках"
 spn_golem_come_home_search_tt:0 "Поиски прекращаются. Голем ничего не приносит."
 spn_golem_what_you_saw_decision:0 "Что ты видел?"
 spn_golem_what_you_saw_decision_desc:0 "Спроси голема, что он видел и слышал."
 spn_golem_what_you_saw_decision_tooltip:0 "Голем рассказывает тебе все известные ему тайны, которых не знаешь ты."
 spn_golem_what_you_saw_decision_confirm:0 "Расскажи мне"
 spn_golem_what_you_saw_tt:0 "Голем рассказывает тебе все известные ему тайны, которых не знаешь ты."
 spn_golem_saw_nothing_tt:0 "Он не видел ничего, чего бы ты уже не знал."
 spn_golem_search_decision:0 "Отправить голема на поиски"
 spn_golem_search_decision_desc:0 "Отправь голема искать страницы [spn_vade_maecum|E]."
 spn_golem_search_decision_tooltip:0 "Голем отправляется искать страницы. Его не будет от двух до пяти лет."
 spn_golem_search_decision_confirm:0 "Go"
 spn_death_golem_unmade:0 "был возвращён в глину"
 spn_golem_cracked_modifier:0 "Треснувший"
 spn_golem_cracked_modifier_desc:0 "Что-то его надломило. Он починится, медленно."
 spn_golem.0001.t:0 "Последние указания"
 spn_golem.0001.desc:0 "Перед концом [spn_golem_old_master.GetFirstName] дал [spn_golem.GetFirstName] последний приказ: служи моему наследнику, как служил мне.\n\nГолем ждёт, когда ты возьмёшь его себе."
 spn_golem.0001.a:0 "Тогда служи мне"
 spn_golem.0001.a.tt:0 "[spn_golem.GetFirstName] привязан к тебе, как был привязан к [spn_golem_old_master.GetFirstName]."
 spn_golem.0001.b:0 "Он мне не нужен"
 spn_golem.0001.b.tt:0 "[spn_golem.GetFirstName] остаётся на месте, но никому не подчиняется."
 spn_golem.0002.t:0 "Принять указания голема"
 spn_golem.0002.desc:0 "Никто больше не держит узы [spn_golem.GetFirstName]. Его создатель ушёл, а он всё ещё ждёт, когда ему скажут, что делать. Он смотрит на тебя."
 spn_golem.0002.a:0 "Принять его указания"
 spn_golem.0002.a.tt:0 "[spn_golem.GetFirstName] привязан к тебе."
 spn_golem.0002.b:0 "Оставить его"
 spn_golem_rebound_toast:0 "Голем подчиняется тебе"
 spn_golem_rebound_toast_tt:0 "[spn_golem.GetFirstName] остался без хозяина. Теперь он привязан к тебе."
 spn_order.2300.t:0 "Облик голема"
 spn_order.2300.desc:0 "Прежде чем соберутся Магистраты, нужно решить одно. Голема можно сделать мужчиной или женщиной, а можно сделать по твоему образу и подобию."
 spn_order.2300.a.tt:0 "Голем будет мужчиной, и красивым."
 spn_order.2300.b.tt:0 "Голем будет женщиной, и прекрасной."
 spn_order.2300.c.tt:0 "Голем будет похож на тебя."
 spn_order.2301.t:0 "Завершение голема"
 spn_order.2301.desc:0 "Голем стоит в подвале и ждёт. Ему нужно имя, и ещё есть время улучшить его, прежде чем работа будет закончена."
 puppet_action_description_puppet_action_spn_puppet_seize:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_golem_seize_interaction')]#!, чтобы ваша марионетка унесла кого-то в вашу [prison|E]"
 puppet_action_description_puppet_action_spn_puppet_strike:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_golem_strike_interaction')]#!, чтобы ваша марионетка избила кого-то"
 puppet_action_description_puppet_action_spn_puppet_loom:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_golem_loom_interaction')]#!, чтобы ваша марионетка запугала кого-то"
 puppet_action_description_puppet_action_spn_golem_guard:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_golem_guard_interaction')]#!, чтобы ваш голем охранял кого-то в течение года"
 spn_golem_busy_tt:0 "Голем не на поисках и не выполняет другое поручение"
 spn_golem_reach_tt:0 "Голем может до них добраться: они там же, где он, или живут в твоём [realm|E]"
 spn_golem_hostile_pause_tt:0 "Ты не посылал марионетку против кого-либо в последние месяцы"
 spn_golem_needs_prison_tt:0 "У тебя есть земли или административная резиденция, а значит, [prison|E], чтобы их держать"
 spn_golem_errand_toast:0 "[spn_golem.GetShortUIName] отправляется в путь"
 spn_golem_seize_interaction:0 "Схватить и заточить"
 spn_golem_seize_interaction_desc:0 "Пошли [puppet_or_actor.GetShortUIName] схватить [recipient.GetShortUIName] и унести [recipient.GetHerHim] в твою [prison|E]. Если [recipient.GetSheHe] сбежит, [recipient.GetSheHe] может узнать, а может и не узнать, кто послал [puppet_or_actor.GetHerHim]."
 spn_golem_seize_interaction_tt:0 "[puppet_or_actor.GetShortUIName] отправляется за [recipient.GetShortUIName]. Через несколько недель ты узнаешь, чем всё кончилось."
 spn_golem_strike_interaction:0 "Избить"
 spn_golem_strike_interaction_desc:0 "Пошли [puppet_or_actor.GetShortUIName] избить [recipient.GetShortUIName]. Такие удары могут убить. [recipient.GetSheHe|U] может узнать, а может и не узнать, кто послал [puppet_or_actor.GetHerHim]."
 spn_golem_strike_interaction_tt:0 "[puppet_or_actor.GetShortUIName] отправляется за [recipient.GetShortUIName]. Через несколько недель ты узнаешь, чем всё кончилось."
 spn_golem_loom_interaction:0 "Нависнуть над ними"
 spn_golem_loom_interaction_desc:0 "Пусть [puppet_or_actor.GetShortUIName] встанет над [recipient.GetShortUIName] и ничего не скажет. [recipient.GetSheHe|U] узнает, кто послал [puppet_or_actor.GetHerHim]; в этом-то и смысл."
 spn_golem_loom_interaction_tt:0 "[recipient.GetShortUIName] напуган и может уступить тебе."
 spn_golem_loom_gave_in_tt:0 "[spn_golem_target.GetShortUIName] уступил. У тебя есть [hook|E] на [spn_golem_target.GetHerHim]."
 spn_golem_loom_held_tt:0 "[spn_golem_target.GetShortUIName] испугался, но не уступил."
 spn_golem_loom_msg:0 "Голем у двери"
 spn_golem_loom_msg_tt:0 "[spn_golem.GetShortUIName] стоял над тобой и ничего не говорил. Он принадлежит [spn_golem_master.GetShortUIName]."
 spn_golem_guard_interaction:0 "Охранять их"
 spn_golem_guard_interaction_desc:0 "Поставь голема охранять [recipient.GetShortUIName] в течение года. Он охраняет одного человека за раз."
 spn_golem_guard_toast_tt:0 "[spn_golem.GetShortUIName] охраняет [spn_golem_target.GetShortUIName] в течение года."
 spn_golem_guards_already_tt:0 "Голем ещё не охраняет этого персонажа"
 spn_golem_guards_you_already_tt:0 "Голем ещё не охраняет тебя"
 spn_golem_guard_ends_tt:0 "Голем перестаёт охранять того, кого охраняет сейчас."
 spn_golem_guarded_modifier:0 "Под охраной голема"
 spn_golem_guarded_modifier_desc:0 "Голем несёт стражу. Интриги против этого персонажа идут хуже, а другому голему трудно подобраться к нему."
 spn_golem_guard_me_decision:0 "Охраняй меня"
 spn_golem_guard_me_decision_desc:0 "Прикажи голему охранять тебя в течение года."
 spn_golem_guard_me_decision_tooltip:0 "Голем охраняет тебя в течение года. Интриги против тебя идут хуже."
 spn_golem_guard_me_decision_confirm:0 "Держись рядом"
 spn_golem_come_home_errand_tt:0 "Его поручение отменяется."
 spn_golem_seized_msg:0 "Схвачен и заточён"
 spn_golem_seized_msg_tt:0 "[spn_golem.GetShortUIName] схватил тебя и унёс в [prison|E] [spn_golem_master.GetShortUIName]."
 spn_golem_seize_failed_msg:0 "За тобой приходили"
 spn_golem_seize_failed_msg_tt:0 "[spn_golem.GetShortUIName] пытался тебя унести, но ты вырвался. [spn_golem.GetHerHim] послал [spn_golem_master.GetShortUIName]."
 spn_golem_struck_msg:0 "Избит големом"
 spn_golem_struck_msg_tt:0 "[spn_golem.GetShortUIName] нашёл тебя и избил. Он принадлежит [spn_golem_master.GetShortUIName]."
 spn_golem_strike_failed_msg:0 "За тобой приходили"
 spn_golem_strike_failed_msg_tt:0 "[spn_golem.GetShortUIName] пришёл за тобой, но ты сбежал. [spn_golem.GetHerHim] послал [spn_golem_master.GetShortUIName]."
 spn_golem_attacked_me_opinion:0 "Натравил на меня голема"
 spn_death_golem_struck:0 "был сражён големом [TARGET_CHARACTER.GetShortUINamePossessive]"
 spn_golem.0010.t:0 "Голем возвращается"
 spn_golem.0010.desc_success:0 "[spn_golem.GetFirstName] возвращается так же, как ушёл, без единого слова, с [spn_golem_target.GetShortUIName] на плече. Он опускает [spn_golem_target.GetHerHim] в твою [prison|E] и ждёт следующего приказа."
 spn_golem.0010.desc_failure:0 "[spn_golem.GetFirstName] возвращается один. [spn_golem_target.GetShortUIName] заметил его приближение, ушёл и теперь знает, кто его послал."
 spn_golem.0010.a:0 "Хорошо. Заприте дверь."
 spn_golem.0010.b:0 "Тогда в следующий раз."
 spn_golem.0011.t:0 "Голем возвращается"
 spn_golem.0011.desc_wound:0 "[spn_golem.GetFirstName] нашёл [spn_golem_target.GetShortUIName] и жестоко избил [spn_golem_target.GetHerHim]. Он не спешил и не скрывал, чей он голем."
 spn_golem.0011.desc_death:0 "[spn_golem.GetFirstName] нашёл [spn_golem_target.GetShortUIName] и сразил [spn_golem_target.GetHerHim]. [spn_golem_target.GetSheHe|U] больше не поднялся. Все знают, чей это был голем."
 spn_golem.0011.desc_failure:0 "[spn_golem.GetFirstName] возвращается, не нанеся ни одного удара. [spn_golem_target.GetShortUIName] ушёл от него и теперь знает, кто его послал."
 spn_golem.0011.a:0 "Это [spn_golem_target.GetHerHim] проучит."
 spn_golem.0011.b:0 "So be it."
 spn_golem.0011.c:0 "Тогда в следующий раз."
 spn_bind_masterless_golem_interaction:0 "Привязать голема без хозяина"
 spn_bind_masterless_golem_interaction_desc:0 "[recipient.GetFirstName] никому не подчиняется. Привяжи его к себе своей магией: он будет служить тебе, как служил своему создателю, и станет твоей [puppet|E]-големом, если у тебя её нет.\n\nЭто стоит силы одного заклинания."
 spn_bind_masterless_golem_tt:0 "[recipient.GetFirstName] привязан к тебе."
 spn_bind_masterless_golem_reach_tt:0 "[recipient.GetFirstName] находится там же, где ты, или при твоём дворе, у тебя в гостях или в твоём королевстве"
 spn_puppet_deed_unknown_tt:0 "[spn_golem_target.GetShortUIName] так и не узнал, кто послал [spn_golem.GetShortUIName]"
 spn_puppet_seize_failed_unknown_msg_tt:0 "[spn_golem.GetShortUIName] пытался тебя унести, но ты вырвался. [spn_golem.GetSheHe|U] не носил знака хозяина, и ты не смог узнать, кто послал [spn_golem.GetHerHim]."
 spn_puppet_struck_msg:0 "Избит"
 spn_puppet_struck_msg_tt:0 "[spn_golem.GetShortUIName] нашёл тебя и избил по приказу [spn_golem_master.GetShortUIName]."
 spn_puppet_struck_unknown_msg_tt:0 "[spn_golem.GetShortUIName] нашёл тебя и избил. [spn_golem.GetSheHe|U] не носил знака хозяина, и ты не смог узнать, кто послал [spn_golem.GetHerHim]."
 spn_puppet_strike_failed_unknown_msg_tt:0 "[spn_golem.GetShortUIName] пришёл за тобой, но ты сбежал. [spn_golem.GetSheHe|U] не носил знака хозяина, и ты не смог узнать, кто послал [spn_golem.GetHerHim]."
 spn_puppet_seize_failed_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] пытался тебя унести, но ты вырвался. [spn_golem.GetSheHe|U] так и не сказал, кто послал [spn_golem.GetHerHim], и ты не смог этого узнать."
 spn_puppet_struck_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] нашёл тебя и избил. [spn_golem.GetSheHe|U] так и не сказал, кто послал [spn_golem.GetHerHim], и ты не смог этого узнать."
 spn_puppet_strike_failed_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] пришёл за тобой, но ты сбежал. [spn_golem.GetSheHe|U] так и не сказал, кто послал [spn_golem.GetHerHim], и ты не смог этого узнать."
 spn_puppet.0010.t:0 "[spn_golem.GetFirstName] возвращается"
 spn_puppet.0011.t:0 "[spn_golem.GetFirstName] возвращается"
 spn_puppet_loom_msg:0 "Запуган"
 spn_puppet_loom_msg_tt:0 "[spn_golem.GetShortUIName] стоял над тобой и ничего не говорил. [spn_golem.GetHerHim] послал [spn_golem_master.GetShortUIName]."
 spn_puppet_sent_against_me_opinion:0 "Подослал кого-то против меня"
 spn_puppet_struck_me_opinion:0 "Напал на меня"
 spn_death_puppet_struck_ordered:0 "был забит до смерти по приказу [TARGET_CHARACTER.GetShortUINamePossessive]"
 spn_death_puppet_struck:0 "был забит до смерти [TARGET_CHARACTER.GetShortUIName]"
 spn_puppet.0010.desc_success:0 "[spn_golem.GetShortUIName] возвращается с крепко схваченным [spn_golem_target.GetShortUIName] и передаёт [spn_golem_target.GetHerHim] твоему тюремщику. [spn_golem_target.GetSheHe|U] в твоей [prison|E]."
 spn_puppet.0010.desc_failure:0 "[spn_golem.GetShortUIName] возвращается один. [spn_golem_target.GetShortUIName] заметил [spn_golem.GetHerHim], ушёл и теперь знает, кто послал [spn_golem.GetHerHim]."
