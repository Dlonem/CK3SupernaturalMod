#Events for Becoming A Vampire
 spn_miscellaneous_events.0004.t:0 "Становление Вампиром: Потеря куска времени"
 spn_miscellaneous_events.0004.desc:0 "Воздух неподвижен, единственный звук — это тихий шелест листвы, когда фигура, окутанная тенями, приближается. Ты узнаешь эту фигуру, хотя её лицо остаётся скрытым под тёмным капюшоном. Того, кого ты искал, вампира, чья кровь когда-то текла в твоих венах, теперь стоит перед тобой. \n \n «Прости меня» говорит фигура, её голос гладок, но насыщен странным отстранением. «Время ускользает от нас так легко. Я был... занят. Но я здесь сейчас, и мы должны действовать быстро. Риск, что кровь покинет твою систему, минимален.» \n \n Прежде чем ты сможешь произнести слово, её рука на твоей шее, холодная и непреклонная. Паника охватывает тебя, когда приходит осознание — вся надежда, что у тебя была, быстро уходит, ускользая так же, как крепче сжимается хватка вампира."
 spn_miscellaneous_events.0004.a:0 "Нет, подожди!"
 spn_miscellaneous_events.0004.a.tt:0 "Слишком поздно. Ты начал искать бессмертие, и это окончится твоей смертью."
 
 spn_miscellaneous_events.0005.t:0 "Вампир: Превращён"
 spn_miscellaneous_events.0005.desc:0 "Мир исчезает в черноте, когда клыки вампира вонзаются в твою шею. Ты чувствуешь, как жизнь покидает твоё тело, и вместе с ней, твою человечность. Когда ты просыпаешься, ночь становится ярче, твои чувства острее, и новая сила течёт по твоим венам. \n \n Но с этой силой приходит гложущая жажда — жажда, которую может утолить только кровь. Превращение завершено; теперь ты один из них."
 spn_miscellaneous_events.0005.a:0 "Моя новая жизнь начинается."
 spn_miscellaneous_events.0005.a.tt:0 "Ты стал вампиром, и от этого исцелился от любых исцелимых недугов, которые у тебя могли быть ранее."

