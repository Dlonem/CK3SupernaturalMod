 spn_offer_gift:0 "Offer Gift"
 spn_offer_gift_interaction_desc:0 "Offer the gift of the curse - a deliberate wound from your claws - and begin their turning. Surviving the change is far from certain - a long, gruelling ordeal with no certain end - but those who endure it emerge as a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )]."
 spn_msg_tooltip_offer_gift_desc:0 "[THIS.GetCharacter.GetFirstName] accepts the gift and begins the long, dangerous turning into a [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."
 SPN_OFFER_GIFT_INTERACTION_NOTIFICATION:0 "I offer you my gift, and the change it brings."
 spn_force_gift:0 "Force Gift"
 spn_force_gift_interaction_desc:0 "Rake your claws across them against their will. A werewolf's claws carry a deadly curse - many never survive the wound - yet it is also how the curse spreads, willing or not. Forced upon them, the change takes hold deep in the sickness, so their odds are grim and the ordeal drags on with no certain end. Should they survive, they emerge a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] - and they will not soon forgive the one who did this to them."
 spn_msg_tooltip_force_gift_desc:0 "[THIS.GetCharacter.GetFirstName] is clawed by force, and a violent, uncertain turning into a [GetTrait('supernatural_werewolf').GetName( THIS.Char )] takes hold."
