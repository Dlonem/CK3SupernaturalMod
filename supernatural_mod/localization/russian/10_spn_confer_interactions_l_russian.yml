#Feed your blood to a non-Vampire
 spn_offer_vampire_blood:0 "Предложите свою кровь"
 spn_offer_vampire_blood_interaction_desc:0 "Попытайтесь предложить свою кровь. Если человек выпьет вашу кровь, он испытает некоторые из её множества целебных свойств. Это первый шаг к созданию нового вампира."
 spn_msg_tooltip_confer_blood_vampirism_desc:0 "[THIS.GetCharacter.GetFirstName] выпьет немного вашей крови, но если они умрут с вашей кровью в системе... они станут [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 spn_offer_vampire_blood_hybrid_interaction_desc:0 "Попытайтесь предложить свою кровь. Те, кто потребляет кровь вампира, немедленно ощутят её целебные свойства. Однако нелюди могут реагировать иначе, и результат будет зависеть от их природы."

#Turn Another Into a Vampire
 spn_turn_into_vampire:0 "Превратиться в вампира"
 spn_turn_into_vampire_interaction_desc:0 "Попытайтесь превратить этого человека в вампира. Последний шаг в создании нового вампира — это окончить их жизнь с вашей кровью в их системе."
 spn_msg_tooltip_confer_vampirism_desc:0 "Человеческая жизнь [THIS.GetCharacter.GetFirstName] закончится, и они станут [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 SPN_OFFER_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Я предлагаю свою кровь тебе."

#Ask to be turned into Vampire
 SPN_ASK_FOR_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Я смиренно прошу, чтобы вы превратили меня в вампира."
 spn_ask_to_turn_into_vampire:0 "Попросить о превращении"
 spn_ask_to_turn_into_vampire_interaction_desc:0 "Попросить [recipient.GetShortUIName] превратить вас в [GetTrait('supernatural_vampire').GetName( recipient )]."
 spn_msg_tooltip_ask_vampirism_desc:0 "[recipient.GetShortUIName] даст [THIS.GetCharacter.GetFirstName] свою кровь, в первом шаге к становлению [GetTrait('supernatural_vampire').GetName( THIS.Char )]. На следующем шаге [THIS.GetCharacter.GetFirstName] будет убит [recipient.GetShortUIName] и станет [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 
#Ask to Not Be Turned Into Vampire
 SPN_ASK_FOR_NOT_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Пожалуйста, я передумал и не хочу становиться Вампиром."
 spn_ask_to_not_turn_into_vampire:0 "Попросить, чтобы не превращали"
 spn_msg_tooltip_ask_not_vampirism_desc:0 "[recipient.GetShortUIName] не превратит вас в [GetTrait('supernatural_vampire').GetName( THIS.Char )]. Однако их кровь все еще в вашем теле..."
 spn_ask_to_not_turn_into_vampire_interaction_desc:0 "Вы передумали по поводу всего этого предложения 'умереть и вернуться'. Может, вы можете попросить, чтобы вас не убивали?"

