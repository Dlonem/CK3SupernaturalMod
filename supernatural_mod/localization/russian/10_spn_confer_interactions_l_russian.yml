 # Supernatural 2.38 -- the gift of the curse
 spn_offer_gift:0 "Предложить дар"
 spn_offer_gift_interaction_desc:0 "Предложить дар проклятия — намеренную рану от твоих когтей — и начать их обращение. Пережить перемену удаётся далеко не всем: это долгое, мучительное испытание без верного конца, — но тот, кто это выдержит, — уже [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )]."
 spn_msg_tooltip_offer_gift_desc:0 "[THIS.GetCharacter.GetFirstName] принимает дар и начинает долгое, опасное обращение. Конец этого пути — [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."
 SPN_OFFER_GIFT_INTERACTION_NOTIFICATION:0 "Я предлагаю тебе мой дар — и перемену, что он несёт."
 spn_force_gift:0 "Навязать дар"
 spn_force_gift_interaction_desc:0 "Провести когтями по ним против их воли. Когти оборотня несут смертельное проклятие — многие не переживают такую рану, — но именно так проклятие и расходится: по воле или против неё. Навязанная перемена укореняется глубоко в болезни, и потому шансы их мрачны, а испытание тянется без верного конца. Если они выживут, каждый из них — [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], и они не скоро простят того, кто это с ними сделал."
 spn_msg_tooltip_force_gift_desc:0 "[THIS.GetCharacter.GetFirstName] получает удар когтями против своей воли, и начинается буйное, неверное обращение. Конец этого пути — [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."
