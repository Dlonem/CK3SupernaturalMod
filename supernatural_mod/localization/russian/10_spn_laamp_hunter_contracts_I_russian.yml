 laamp_hunter_contracts_title:0 "Охота на ведьм"
 laamp_hunter_contracts_desc:0 "Местный лорд объявил контракт на поимку или устранение предполагаемой ведьмы, скрывающейся в окрестностях. По слухам, цель обладает тёмными силами, но в остальном является простолюдином без дворянской крови или связей."