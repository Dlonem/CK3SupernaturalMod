l_russian:
 # Supernatural 2.43 -- the voice in the blood. The thirst speaks Latin and the wolf Old Norse, each in its own colour
 # (gui/preload/zz_spn_textformatting.gui), with the meaning on hover as the Order's Latin has it (zz_spn_239_glossary).
 # Thomas, 23 Nov: real old tongues, nothing invented.
 spn_gloss_thirst_paulum:0 "#bold Tam paulum. Nemo desiderabit.#! - с латыни, #EMP Так мало. Никто не хватится.#!"
 spn_gloss_thirst_bibe:0 "#bold Bibe.#! - с латыни, #EMP Пей.#!"
 spn_gloss_wolf_hlaup:0 "#bold Hlaup.#! - с древнескандинавского, #EMP Беги.#!"
 spn_gloss_thirst_omnes:0 "#bold Omnes. Quemlibet.#! - с латыни, #EMP Все. Любой.#!"
 spn_gloss_thirst_haustus:0 "#bold Haustus unus. Ne expergisceretur quidem.#! - с латыни, #EMP Один глоток. Даже не проснётся.#!"
 spn_gloss_thirst_gustum:0 "#bold Gustum modo.#! - с латыни, #EMP Только попробовать.#!"
 spn_gloss_thirst_nunc:0 "#bold Nunc.#! - с латыни, #EMP Сейчас.#!"
 spn_gloss_thirst_noster:0 "#bold Noster.#! - с латыни, #EMP Наш.#!"
 spn_gloss_thirst_nusquam:0 "#bold Nusquam.#! - с латыни, #EMP Нигде.#!"
 spn_gloss_wolf_bratt:0 "#bold Brátt.#! - с древнескандинавского, #EMP Скоро.#!"
 spn_gloss_wolf_einn:0 "#bold Eigi einn.#! - с древнескандинавского, #EMP Не один.#!"
 spn_gloss_wolf_that:0 "#bold Eigi þat.#! - с древнескандинавского, #EMP Не это.#!"
