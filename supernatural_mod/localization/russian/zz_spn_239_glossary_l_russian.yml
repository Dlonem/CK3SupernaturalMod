l_russian:
 spn_gloss_vade_maecum:0 "#bold Vade Maecum Infernal#! - с латыни, #EMP иди со мной#!, #EMP из преисподней#!: справочник, который всегда носят при себе. Этот принадлежал демону. Смотри [spn_vade_maecum|E]."
 spn_gloss_fors_factorum:0 "#bold Fors Factorum#! - с латыни, #EMP удача деяний#!. Магия, которая ничего не стоит в момент сотворения. Смотри [spn_order_fors_factorum|E]."
 spn_gloss_respondeo:0 "#bold Respondeo#! - с латыни, #EMP я отвечаю#!. Смотри [spn_respondeo|E]."
 spn_gloss_invocare:0 "#bold Invocare#! - с латыни, #EMP призывать#!."
 spn_gloss_imperium:0 "#bold Imperium#! - с латыни, #EMP власть#!: право действовать, не спрашивая, которое Рим давал своим высшим должностным лицам."
 spn_gloss_hermetic:0 "#bold Герметический#! - от имени #EMP Гермеса Трисмегиста#!, трижды величайшего Гермеса, легендарного учителя тайных искусств. Позже это слово стало означать и #EMP плотно запечатанный#!."
 spn_gloss_collegium:0 "#bold Collegium#! - с латыни, #EMP товарищество#!: собрание коллег и старое слово для учёной коллегии."
 spn_gloss_ex_tenebris_lux:0 "#bold Ex tenebris lux#! - с латыни, #EMP из тьмы — свет#!."
 spn_gloss_neophyte:0 "#bold Неофит#! - с греческого, #EMP новонасаждённый#!: тот, кто ответил на записку и проходит испытание. Смотри [spn_order_ranks|E]."
 spn_gloss_medicum:0 "#bold Медикум#! - от латинского #EMP medicus#!, целитель: в Ордене так называют ранг тех, кто учит послушников. Смотри [spn_order_ranks|E]."
 spn_gloss_magistratus:0 "#bold Магистрат#! - с латыни, #EMP должность и тот, кто её занимает#!: магистрат. Смотри [spn_order_ranks|E]."
