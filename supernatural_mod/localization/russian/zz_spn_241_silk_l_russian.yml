l_russian:
 # Supernatural 2.41 -- Silk & Silver (CK3 1.21).

 # Fear (zz_spn_241_fear_modifiers.txt)
 spn_menace_fear_1_modifier:0 "Тревожные ночи"
 spn_menace_fear_1_modifier_desc:0 "Здесь что-то кого-то забрало. После темноты люди сидят по домам и меньше слушают своего господина. Проходит через год после последнего раза или раньше, если с этим покончит охотник."
 spn_menace_fear_2_modifier:0 "Страх темноты"
 spn_menace_fear_2_modifier_desc:0 "Это случилось уже не раз. На закате двери запирают на засов, а стража находит отговорки. Проходит через год после последнего раза или раньше, если с этим покончит охотник."
 spn_menace_fear_3_modifier:0 "Город, живущий в страхе"
 spn_menace_fear_3_modifier_desc:0 "То, что здесь охотится, возвращается снова и снова, и графство перестало верить, что господин может это остановить. Проходит через год после последнего раза или раньше, если с этим покончит охотник."

 # The menace in the market (zz_spn_241_silk_modifiers.txt)
 spn_menace_market_vampire_modifier:0 "Пустые улицы после темноты"
 spn_menace_market_vampire_modifier_desc:0 "Никто не задерживается допоздна в городе, где по ночам пропадают люди. Первыми это чувствуют таверны и лавки получше."
 spn_menace_market_werewolf_modifier:0 "Волки на дорогах"
 spn_menace_market_werewolf_modifier_desc:0 "На дорогах вокруг этого рынка находят возчиков по частям. Их приезжает всё меньше, а те, кто приезжает, берут дороже."
 spn_menace_market_demon_modifier:0 "Испорченные запасы"
 spn_menace_market_demon_modifier_desc:0 "Зерно гниёт в закрытых закромах, а молоко скисает в подойнике. То, что разгуливает здесь, портит то, чем живут люди."
 spn_menace_market_witch_modifier:0 "Неурожай"
 spn_menace_market_witch_modifier_desc:0 "Поля вокруг этого рынка взошли скудными и поражёнными гнилью, и крестьяне говорят, что знают почему."
 spn_menace_road_modifier:0 "Опасная дорога"
 spn_menace_road_modifier_desc:0 "Этот путь проходит через края, где что-то убивает путников. Караванов, отправляющихся в дорогу, всё меньше."
 spn_doge_rumours_modifier:0 "Правитель, который не стареет"
 spn_doge_rumours_modifier_desc:0 "Город судачит о правителе, который выглядит не старше, чем в тот день, когда пришёл к власти."

 # A trader feeds on the road (zz_spn_241_silk_effects.txt)
 spn_silk_trader_fed_toast:0 "Кормление в дороге"
 spn_silk_trader_fed_toast_tt:0 "Вдали от дома и от тех, кто знает тебя в лицо, ты нашёл кого-то в торговом городе."

 # Collect in Blood (zz_spn_241_silk_interactions.txt)
 spn_collect_in_blood_interaction:0 "Взыскать кровью"
 spn_collect_in_blood_interaction_desc:0 "[recipient.GetShortUIName] уже отказался платить то, что [recipient.GetSheHe] тебе должен. Есть и другие способы расплатиться по долгу."
 spn_collect_in_blood_refused_tt:0 "[recipient.GetShortUIName] должен был хотя бы раз отказаться вернуть тебе долг"
 spn_collect_in_blood_interaction_tt:0 "Ты решишь, как будет погашен долг"

 # Compelled commands (zz_spn_241_silk_interactions.txt)
 spn_compel_charter_interaction:0 "Дай мне грамоту"
 spn_compel_charter_interaction_desc:0 "Пусть твоя подчинённая [puppet|E], которая является твоим покровителем, выдаст твоей компании грамоту."
 spn_compel_charter_already_tt:0 "У тебя уже есть грамота от твоего покровителя"
 puppet_action_description_puppet_action_spn_compel_charter:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_charter_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] выдала вам грамоту"
 spn_compel_vote_interaction:0 "Голосуй, как я"
 spn_compel_vote_interaction_desc:0 "Твоя подчинённая [puppet|E] будет голосовать так же, как ты, весь следующий год."
 spn_compel_vote_already_tt:0 "Кто-то другой уже решает, как он голосует"
 puppet_action_description_puppet_action_spn_compel_vote:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_vote_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] голосовала так же, как вы"

 # The vault (zz_spn_241_vault_buildings.txt)
 spn_merchant_vault_01_domicile_building:0 "Старое хранилище"
 spn_merchant_vault_01_domicile_building_desc:0 "Кладовая под домом, старше самого дома. Кое-что здесь куплено за монету, которую уже давно никто не чеканит."
 spn_merchant_vault_02_domicile_building:0 "Глубокое хранилище"
 spn_merchant_vault_02_domicile_building_desc:0 "Вторая комната за первой и лестница, о которой знают немногие в доме."
 spn_merchant_vault_03_domicile_building:0 "Сокровищница веков"
 spn_merchant_vault_03_domicile_building_desc:0 "То, что одна терпеливая семья может отложить за очень долгое время."
 spn_merchant_vault_age_70_tt:0 "Должно быть не менее 70 лет"
 spn_merchant_vault_age_120_tt:0 "Должно быть не менее 120 лет"

 # The hunt's silver (supernatural_hunt.txt)
 spn_hunt_prep_silver_plentiful:0 "На местном рынке серебра много"
 spn_hunt_prep_silver_scarce:0 "На местном рынке серебра мало"

 # Events (zz_spn_241_silk_events.txt)
 spn_silk.0001.t:0 "Дож, который не стареет"
 spn_silk.0001.desc:0 "Писарь, служащий дому тридцать лет, сегодня при всех заметил, что я выгляжу точно так же, как в тот день, когда его наняли. Кто-то рассмеялся. Потом уже никто не смеялся.\n\nЛюди начали считать."
 spn_silk.0001.a:0 "Я поговорю с каждым из них сам."
 spn_silk.0001.b:0 "Заказать портрет моего покойного отца. Сходство всё объяснит."
 spn_silk.0001.c:0 "Пусть говорят. Разговоры ничего не стоят."
 spn_silk.0030.t:0 "За маской вольто"
 spn_silk.0030.desc:0 "Все лица на площади раскрашены, позолочены или скрыты. Этой ночью никто не знает, кто есть кто, и никто не хочет знать.\n\nГуляка в белой маске уже час не отходит от меня. Теперь [spn_cv_meal.GetSheHe] берёт меня за руку и кивает в темноту переулка."
 spn_silk.0030.a:0 "Пойти за [spn_cv_meal.GetHerHim]."
 spn_silk.0030.b:0 "Не сегодня. Я пришёл танцевать."
 spn_wolf_pelt_curio_name:0 "Шкура волка [spn_pelt_wolf.GetFirstName]"
 spn_wolf_pelt_curio_desc:0 "Шкура волка, которым был [spn_pelt_wolf.GetFullName]. Гости спрашивают о ней, потом перестают спрашивать и встают чуть подальше от стены."
 spn_wolf_pelt_curio_modifier:0 "Волк на стене"
 spn_hunt_delivered_modifier:0 "Охота состоялась"
 spn_hunt_delivered_modifier_desc:0 "Здесь что-то забирало людей, и его выследили. Графство знает, кто прислал охотника."
 spn_silk.0010.t:0 "Взыскать кровью"
 spn_silk.0010.desc:0 "У [spn_cib_debtor.GetFirstName] было достаточно возможностей заплатить. Письма, напоминания, терпение. Сегодня моё терпение кончилось, и [spn_cib_debtor.GetSheHe] сейчас узнает, что я принимаю плату не в одной валюте."
 spn_silk.0010.a:0 "Из [spn_cib_debtor.GetHerHis] собственных жил."
 spn_silk.0010.b:0 "Сгодится кто-нибудь из [spn_cib_debtor.GetHerHis] домашних."
 spn_silk.0010.c:0 "Посмотри на меня. Ты заплатишь то, что должен."
 spn_silk.0010.d:0 "Не сегодня."
 spn_silk.0020.t:0 "Нечто древнее в хранилище"
 spn_silk.0020.desc:0 "Наши ремесленники описывали глубокое хранилище, когда один из них принёс мне вещь, на которую я очень давно не смотрел. Я купил её у человека, чьё имя давно забыл, в городе, который с тех пор сгорел.\n\nЗнаки на ней — знаки Ордена. Теперь я в этом уверен."
 spn_silk.0020.a:0 "Я всегда знал, что её стоит хранить."
