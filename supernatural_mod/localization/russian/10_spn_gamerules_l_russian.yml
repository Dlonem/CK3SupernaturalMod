l_russian:
#Game Rule Category, Supernatural
  game_rule_category_SPN:0 "Сверхъестественное"
  game_rule_category_WC:0 "Колдовство"

#Game Rule, Supernatural - Embrace Decision
 rule_spn_enable_embrace_decision:0 "Сверхъестественное: Решения объятий"
 setting_spn_yes_embrace_decision:0 "ВКЛ."
 setting_spn_yes_embrace_decision_desc:0 "Включить параметры меню решений для получения сверхъестественных и охотничьих черт."
 setting_spn_no_embrace_decision:0 "По умолчанию (Выкл)"
 setting_spn_no_embrace_decision_desc:0 "Отключить параметры меню решений для получения сверхъестественных и охотничьих черт."

#Game Rule, Supernatural - Events
 rule_spn_enable_embrace_events:0 "Сверхъестественное: События"
 setting_spn_yes_embrace_events:0 "По умолчанию (Вкл)"
 setting_spn_yes_embrace_events_desc:0 "Включить события для принятия черт и связанных со сверхъестественным событий."
 setting_spn_no_embrace_events:0 "Выкл"
 setting_spn_no_embrace_events_desc:0 "Отключить события для принятия черт и связанных со сверхъестественным событий."
 setting_spn_only_embrace_events:0 "Только Принятие"
 setting_spn_only_embrace_events_desc:0 "Включает только события принятия и отключает все другие сверхъестественные события."
 setting_spn_only_super_events:0 "Нет Принятия"
 setting_spn_only_super_events_desc:0 "Отключает события Принятия, но включает другие сверхъестественные события."

#Game Rule, Supernatural - Visual Fangs
 rule_spn_enable_visual_fangs:0 "Сверхъестественное: Бледность"
 setting_spn_both_visual_fangs:0 "По умолчанию (Вкл)"
 setting_spn_both_visual_fangs_desc:0 "Как вампиры, так и гибриды будут иметь клыки."
 setting_spn_no_visual_fangs:0 "Выкл"
 setting_spn_no_visual_fangs_desc:0 "Клыки не будут добавлены вампирским персонажам."
 setting_spn_vampire_visual_fangs:0 "Только Вампиры"
 setting_spn_vampire_visual_fangs_desc:0 "Только вампиры будут иметь клыки."

#Game Rule, Supernatural - Paleness
 rule_spn_enable_lighter_skin:0 "Сверхъестественное: Бледность"
 setting_spn_both_lighter_skin:0 "Вампиры и Гибриды"
 setting_spn_both_lighter_skin_desc:0 "Как вампиры, так и гибриды будут иметь более светлые оттенки кожи после обращения."
 setting_spn_no_lighter_skin:0 "Выкл"
 setting_spn_no_lighter_skin_desc:0 "Персонажи не будут иметь более светлые оттенки кожи после обращения."
 setting_spn_vampire_lighter_skin:0 "По умолчанию (Вампиры)"
 setting_spn_vampire_lighter_skin_desc:0 "Только вампиры будут иметь более светлые оттенки кожи после обращения (не гибриды)."

#Game Rule, Supernatural - RCV Changes
 rule_spn_enable_right_click_visuals:0 "Сверхъестественное: Визуальные изменения"
 setting_spn_yes_right_click_visuals:0 "ВКЛ."
 setting_spn_yes_right_click_visuals_desc:0 "Позволить варианты в контекстном меню правой кнопки, которые переключают определенные визуальные элементы персонажей."
 setting_spn_no_right_click_visuals:0 "По умолчанию (Выкл)"
 setting_spn_no_right_click_visuals_desc:0 "Варианты в контекстном меню правой кнопки для визуальных элементов не будут доступны."
 
#Game Rule, Supernatural - Confer Death
 rule_spn_enable_confer_death:0 "Сверхъестественное: Нанесение смерти"
 setting_spn_yes_confer_death:0 "По умолчанию (Вкл)"
 setting_spn_yes_confer_death_desc:0 "Существует вероятность, что персонажи, которые превращаются или тренируются, могут умереть."
 setting_spn_yes_higher_confer_death:0 "Больше смертей"
 setting_spn_yes_higher_confer_death_desc:0 "Существует высокая вероятность, что персонажи, которые превращаются или тренируются, могут умереть."
 setting_spn_yes_lower_confer_death:0 "Меньше смертей"
 setting_spn_yes_lower_confer_death_desc:0 "Существует низкая вероятность, что персонажи, которые превращаются или тренируются, могут умереть."
 setting_spn_no_confer_death:0 "Выкл"
 setting_spn_no_confer_death_desc:0 "Нет вероятности, что персонажи, которые превращаются или тренируются, могут умереть."
 setting_spn_ai_only_confer_death:0 "Только НПС"
 setting_spn_ai_only_confer_death_desc:0 "Существует вероятность, что НПС, которые превращаются или тренируются, могут умереть."
 setting_spn_ai_only_higher_confer_death:0 "Только НПС, сложнее"
 setting_spn_ai_only_higher_confer_death_desc:0 "Существует высокая вероятность, что НПС, которые превращаются или тренируются, могут умереть."
 setting_spn_ai_only_lower_confer_death:0 "Только для НИП"
 setting_spn_ai_only_lower_confer_death_desc:0 "Вероятность того, что НИП будут превращены или обучены, меньше, и они могут умереть."

#Game Rule, Supernatural - AI Confer
 rule_spn_enable_ai_can_confer:0 "Сверхъестественное: Конференция ИИ"
 setting_spn_yes_ai_can_confer:0 "По умолчанию (Вкл)"
 setting_spn_yes_ai_can_confer_desc:0 "Персонажи со сверхъестественными чертами будут превращать или обучать других персонажей."
 setting_spn_no_ai_can_confer:0 "Выкл"
 setting_spn_no_ai_can_confer_desc:0 "Персонажи со сверхъестественными чертами НЕ будут превращать или обучать других персонажей."
 setting_spn_non_hybrid_ai_can_confer:0 "Не гибриды"
 setting_spn_non_hybrid_ai_can_confer_desc:0 "Только вампиры и оборотни будут превращать других персонажей."
 setting_spn_only_vampire_ai_can_confer:0 "Только вампиры"
 setting_spn_only_vampire_ai_can_confer_desc:0 "Только персонажи-вампиры будут превращать других персонажей."
 setting_spn_only_lycan_ai_can_confer:0 "Только оборотни"
 setting_spn_only_lycan_ai_can_confer_desc:0 "Только персонажи-оборотни будут превращать других персонажей."
 setting_spn_only_hunter_ai_can_confer:0 "Только охотники"
 setting_spn_only_hunter_ai_can_confer_desc:0 "Только персонажи-охотники будут обучать других персонажей."

#Game Rule, Supernatural - Trait Distribution
 rule_spn_enable_npc_trait_dist:0 "Сверхъестественное: Распределение черт"
 setting_spn_yes_npc_trait_dist:0 "ВКЛ."
 setting_spn_yes_npc_trait_dist_desc:0 "Все НИП имеют шанс получить сверхъестественные черты случайным образом."
 setting_spn_no_npc_trait_dist:0 "Выкл"
 setting_spn_no_npc_trait_dist_desc:0 "Никакие НИП не имеют шанса получить сверхъестественные черты случайным образом."
 setting_spn_kings_npc_trait_dist:0 "Короли и ниже"
 setting_spn_kings_npc_trait_dist_desc:0 "Только НИП, имеющие титулы королевского уровня и ниже, имеют шанс получить сверхъестественные черты случайным образом."
 setting_spn_dukes_npc_trait_dist:0 "Герцоги и ниже"
 setting_spn_dukes_npc_trait_dist_desc:0 "Только NPC, имеющие титулы герцогов и ниже, имеют шанс получить сверхъестественные черты случайным образом."
 setting_spn_counts_npc_trait_dist:0 "По умолчанию (Комесы и ниже)"
 setting_spn_counts_npc_trait_dist_desc:0 "Только NPC, имеющие титулы комесов и ниже, имеют шанс получить сверхъестественные черты случайным образом."
 setting_spn_barons_npc_trait_dist:0 "Бароны и ниже"
 setting_spn_barons_npc_trait_dist_desc:0 "Только NPC, имеющие титулы баронов и ниже, имеют шанс получить сверхъестественные черты случайным образом."
 setting_spn_no_ruler_npc_trait_dist:0 "Без правителей"
 setting_spn_no_ruler_npc_trait_dist_desc:0 "Только NPC, не имеющие титулов, имеют шанс получить сверхъестественные черты случайным образом."

#Game Rule, Supernatural - Reset Lifetime Events
 rule_spn_enable_periodic_lifetime_events_reset:0 "Сверхъестественное: Сбросить события о жизни"
 setting_no_spn_lifetime_events_reset:0 "Выкл"
 setting_no_spn_lifetime_events_reset_desc:0 "События о жизни не будут сброшены."
 setting_1_spn_lifetime_events_reset:0 "Каждый год"
 setting_1_spn_lifetime_events_reset_desc:0 "Каждый год сбрасывайте возвраченные преимущества, крупные религиозные войны, созданные верования, измененные культуры, вторжения и флаги подчинения."
 setting_10_spn_lifetime_events_reset:0 "Каждый 10 лет"
 setting_10_spn_lifetime_events_reset_desc:0 "Каждые 10 лет сбрасывайте возвраченные преимущества, крупные религиозные войны, созданные верования, измененные культуры, вторжения и флаги подчинения."
 setting_25_spn_lifetime_events_reset:0 "Каждые 25 лет"
 setting_25_spn_lifetime_events_reset_desc:0 "Каждые 25 лет сбрасываются возвращенные преимущества, основные религиозные войны, созданная вера, преобразованная культура, вторжения и признаки подчинения."
 setting_50_spn_lifetime_events_reset:0 "По умолчанию (Каждые 50 лет)"
 setting_50_spn_lifetime_events_reset_desc:0 "Каждые 50 лет сбрасываются возвращенные преимущества, основные религиозные войны, созданная вера, преобразованная культура, вторжения и признаки подчинения."
 setting_75_spn_lifetime_events_reset:0 "Каждые 75 лет"
 setting_75_spn_lifetime_events_reset_desc:0 "Каждые 75 лет сбрасываются возвращенные преимущества, основные религиозные войны, созданная вера, преобразованная культура, вторжения и признаки подчинения."
 setting_100_spn_lifetime_events_reset:0 "Каждые 100 лет"
 setting_100_spn_lifetime_events_reset_desc:0 "Каждые 100 лет сбрасываются возвращенные преимущества, основные религиозные войны, созданная вера, преобразованная культура, вторжения и признаки подчинения."

#Game Rule, Supernatural - Inheritance
 rule_spn_enable_trait_inheritance:0 "Сверхъестественное: Наследование/Беременность"
 setting_spn_yes_trait_inheritance:0 "ВКЛ."
 setting_spn_yes_trait_inheritance_desc:0 "Гибриды создают детенышей-ликанов друг с другом. Ликан-отцы создают человеческих детей с человеческими матерями. Человеческие отцы создают детей-оборотней с бессмертными матерями."
 setting_spn_no_trait_inheritance:0 "Выкл"
 setting_spn_no_trait_inheritance_desc:0 "Вампиры, гибриды и оборотни не смогут размножаться и вместо этого будут полагаться на усыновление."
 setting_spn_immortal_only_trait_inheritance:0 "Только оборотни/гибриды"
 setting_spn_immortal_only_trait_inheritance_desc:0 "Оборотни/гибриды создают детенышей-ликантропов друг с другом, но НЕ с людьми."
 setting_spn_human_no_immortal_trait_inheritance:0 "Оборотни/гибриды создают людей"
 setting_spn_human_no_immortal_trait_inheritance_desc:0 "Оборотни/гибриды создают человеческих потомков независимо от того, являются ли их партнёры ликантропами или людьми."
 setting_spn_human_only_trait_inheritance:0 "Только через людей"
 setting_spn_human_only_trait_inheritance_desc:0 "Оборотни/гибриды могут создавать человеческих потомков с человеческими партнёрами."
 setting_spn_vampire_trait_inheritance:0 "Пропустить эту настройку"
 setting_spn_vampire_trait_inheritance_desc:0 "Нет, правда, просто пропустите это"
 setting_spn_werewolf_trait_inheritance:0 "По умолчанию (только признак оборотня)"
 setting_spn_werewolf_trait_inheritance_desc:0 "Оборотни/гибриды создают детенышей-оборотней друг с другом. Оборотни, размножающиеся с людьми, иногда создают человеческих потомков."
 setting_spn_no_hybrid_trait_inheritance:0 "Нет гибридов"
 setting_spn_no_hybrid_trait_inheritance_desc:0 "Негибридные сверхъестественные существа создают сверхъестественных детей внутри своего вида. Негибридные отцы создают человеческих детей с человеческими матерями. Человеческие отцы создают детенышей-ликантропов с негибридными матерями."

#Game Rule, Supernatural - Ageing
 rule_spn_portrait_aging:0 "Сверхъестественное: Старение"
 setting_spn_stops_at_portrait_maturity:0 "По умолчанию (Старение зрелости)"
 setting_spn_stops_at_portrait_maturity_desc:0 "Все персонажи, которые стали взрослыми или родились до 25 лет, будут визуально стареть до 25 лет. Это возраст зрелости портрета по умолчанию."
 setting_spn_no_automatic_ageing:0 "Без старения"
 setting_spn_no_automatic_ageing_desc:0 "Отключает визуальное старение для всех персонажей. Когда включено, они остаются визуально в этом возрасте. Если использовать это с наследованием бессмертия, то те, кто обладает бессмертием, будут выглядеть как младенцы навсегда... Вы предупреждены..."
 setting_spn_gradual_ageing:0 "Постепенное старение"
 setting_spn_gradual_ageing_desc:0 "Персонажи с бессмертием будут стареть с нормальной скоростью до 16 лет. Затем они будут визуально стареть в 5 раз медленнее. Учтите, что визуальный возраст влияет на фертильность."


### added by sync_localizations.py -- untranslated, 9 keys
 rule_spn_enable_demon_inheritance:0 "Supernatural: Demon Inheritance/Pregnancy"
 setting_spn_demon_yes_inheritance:0 "Default (On)"
 setting_spn_demon_yes_inheritance_desc:0 "Demons can father and bear children. Two Demons have a chance of producing a demon-blooded (Demon Spawn) child. A Demon and a Human have a 50% chance of a demon-blooded child, otherwise a normal Human is born."
 setting_spn_demon_no_inheritance:0 "Off"
 setting_spn_demon_no_inheritance_desc:0 "Demons cannot procreate at all and instead rely upon adoption. This is the original, pre-fix behaviour where Demon pregnancies were always lost."
 setting_spn_demon_immortal_only_inheritance:0 "Demons Only"
 setting_spn_demon_immortal_only_inheritance_desc:0 "Demons only conceive with other Demons, producing a chance of a demon-blooded child. A Demon and a Human produce no pregnancy."
 setting_spn_demon_human_only_inheritance:0 "Only Via Humans"
 setting_spn_demon_human_only_inheritance_desc:0 "Demons only conceive with Humans, with a 50% chance of a demon-blooded child. Two Demons produce no pregnancy."
