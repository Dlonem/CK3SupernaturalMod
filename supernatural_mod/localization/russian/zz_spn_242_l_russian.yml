l_russian:
 # Supernatural 2.42 -- Merchants of the Night.

 # Settle in Souls (zz_spn_242_silk_interactions.txt)
 spn_settle_in_souls_interaction:0 "Расплатиться душами"
 spn_settle_in_souls_interaction_desc:0 "[recipient.GetShortUIName] уже отказался платить то, что [recipient.GetSheHe] тебе должен. Предложи простить долг в обмен на то, чего [recipient.GetSheHe] не хватится до того дня, когда настанет срок."
 SPN_SETTLE_IN_SOULS_PROPOSAL:0 "[actor.GetShortUIName] предлагает простить твой долг. Взамен [actor.GetSheHe] просит лишь твою душу, которую заберут, когда выйдет срок."
 spn_settle_in_souls_taken_tt:0 "Долг прощён. Когда срок истечёт, душа твоя."
 SPN_SETTLE_DEBT_SIZE:0 "Размер долга: $VALUE|=+0$"
 SPN_SETTLE_CANNOT_PAY:0 "Не может заплатить: $VALUE|=+0$"
 SPN_SETTLE_SECOND_LEDGER:0 "Твои книги в порядке: $VALUE|=+0$"

 # Cash In a Soul
 spn_cash_in_soul_interaction:0 "Обналичить душу"
 spn_cash_in_soul_interaction_desc:0 "Тебе принадлежит душа [recipient.GetShortUINamePossessive]. Порви договор сегодня и возьми то, чего он стоит сейчас. [recipient.GetSheHe|U] снова станет цел, и за [recipient.GetHerHim] ничто не придёт."
 spn_cash_in_soul_heading:0 "Что даёт договор"
 SPN_SOUL_FOR_GOLD:0 "Монета"
 SPN_SOUL_FOR_NAME:0 "Имя"
 SPN_SOUL_FOR_STANDING:0 "Положение компании"
 spn_cash_in_soul_freed_tt:0 "Договор разорван. [recipient.GetShortUIName] вернул [recipient.GetHerHis] душу."
 spn_soul_spent_standing_modifier:0 "Договор потрачен с толком"
 spn_soul_spent_standing_modifier_desc:0 "Те, кто сомневался в этом доме, решили в его пользу. Никто толком не может сказать почему."

 # The bargain in coin (magic_ev8.15)
 spn_ev8.15.coin:0 "Оставь свою магию. Я возьму монетой."

 # The Second Ledger and the Alchemist's Still (zz_spn_242_merchant_rooms.txt)
 spn_merchant_second_ledger_01_domicile_building:0 "Вторая книга учёта"
 spn_merchant_second_ledger_01_domicile_building_desc:0 "Маленькая комната при Счётной палате, с одним столом и одной книгой. Писарей никогда не просили её вести, и они никогда не спрашивали, что в ней."
 spn_merchant_second_ledger_02_domicile_building:0 "Закрытая книга учёта"
 spn_merchant_second_ledger_02_domicile_building_desc:0 "Книга разрослась до нескольких. Каждая запись — имя и дата, и каждая дата ещё впереди."
 spn_second_ledger_needs_ledger_tt:0 "В твоём доме есть Счётная палата"
 spn_second_ledger_needs_dealmaker_tt:0 "Ты Делец перекрёстков"
 spn_merchant_still_01_domicile_building:0 "Перегонный куб алхимика"
 spn_merchant_still_01_domicile_building_desc:0 "Задняя комната с хорошим светом, перегонным кубом и множеством подписанных банок. То, что дом продаёт отсюда, действует лучше, чем снадобья аптекаря с соседней улицы, а стоит столько же."
 spn_merchant_still_02_domicile_building:0 "Мастерская алхимика"
 spn_merchant_still_02_domicile_building_desc:0 "Теперь уже три перегонных куба и очередь желающих. Снадобья дома спрашивают по имени даже на рынках, куда он никогда не посылал караван."
 spn_still_needs_medicines_tt:0 "В твоём доме есть Торговцы снадобьями или Аптекарский зал"
 spn_potion_brewed_market_modifier:0 "Снадобья, которые действуют"
 spn_potion_brewed_market_modifier_desc:0 "Кто-то на этом рынке продаёт лекарства, которые делают то, что обещают. От этого чуть лучше идут дела у каждого продавца лекарств здесь."
 spn_potion_brewed_market_tt:0 "Лекарства с твоего родного рынка два года продаются дороже. Выигрывает каждый купец там, включая твоих соперников."

 # Compelled commands
 spn_compel_insights_interaction:0 "Расскажи, что знаешь"
 spn_compel_insights_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] расскажет тебе, что [puppet_or_actor.GetSheHe] знает о ремёслах, в которых [puppet_or_actor.GetSheHe] разбирается лучше тебя."
 spn_compel_insights_nothing_tt:0 "[puppet_or_actor.GetShortUIName] знает какое-то ремесло лучше тебя"
 puppet_action_description_puppet_action_spn_compel_insights:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_insights_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] поделилась тем, что знает о своих ремёслах"
 spn_compel_tolls_interaction:0 "Пропусти мои товары"
 spn_compel_tolls_interaction_desc:0 "Пусть твоя подчинённая [puppet|E], владеющая рынком, пропускает твои товары через него без пошлин."
 spn_compel_tolls_interaction_tt:0 "Твои товары десять лет проходят через рынки [puppet_or_actor.GetShortUINamePossessive] без пошлин"
 puppet_action_description_puppet_action_spn_compel_tolls:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_tolls_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] освободила вас от своих пошлин"

 # The Long Ledger (spn_silk.0040)
 spn_silk.0040.t:0 "Наследник получает долговую книгу"
 spn_silk.0040.desc:0 "[spn_ll_father.GetFirstName] умер. Я давал [spn_ll_father.GetHerHim] в долг, когда [spn_ll_father.GetSheHe] был молод, и получил отказ, когда попросил вернуть. Теперь рядом с долгом новое имя: [spn_ll_heir.GetFirstName]. Не впервые я вижу, как долг переходит из рук в руки через могилу. Книга у меня открыта, и времени у меня сколько угодно, а у [spn_ll_heir.GetSheHe] — нет."
 spn_silk.0040.a:0 "Твой дом мне однажды отказал. Ты это унаследовал."
 spn_silk.0040.a.tt:0 "Считается, что [spn_ll_heir.GetShortUIName] уже однажды тебе отказал"
 spn_silk.0040.b:0 "Долг такой давности заработал свои проценты."
 spn_silk.0040.b.tt:0 "Долг вырастает на десятую часть"
 spn_silk.0040.c:0 "[spn_ll_heir.GetSheHe|U] его не подписывал. Хватит и половины."
 spn_silk.0040.c.tt:0 "Долг уменьшается вдвое"
 spn_silk.0040.d:0 "Долг умер вместе с [spn_ll_father.GetHerHim]."
 spn_silk.0040.e:0 "Книги подождут. Они всегда ждали."
 # 2.42 review (20 Nov 2026)
 spn_cash_in_soul_fresh_tt:0 "Договору должно быть не меньше пяти лет"
