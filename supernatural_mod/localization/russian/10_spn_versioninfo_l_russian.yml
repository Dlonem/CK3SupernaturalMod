 spn_versioninfo.1000.desc:0 "#high Сверхъестественное — Версия#! #P 2.23c#!\nДобро пожаловать в мод #high Сверхъестественное#!\n\n#high 2.23c — Главные изменения:#!\n$BULLET_WITH_TAB$ Добавлено взаимодействие «Призвать по узам крови» — вампиры и гибриды могут заставить своего потомка подчиниться\n$BULLET_WITH_TAB$ Пофикшено принуждение вампиров — теперь работает только у вампиров и гибридов с опытом черт\n$BULLET_WITH_TAB$ Добавлено Насыщение силой и Демонология для колдунов (пока в разработке)\n$BULLET_WITH_TAB$ Новый шаблон Охотника на монстров с правильными чертами и секретами\n$BULLET_WITH_TAB$ Появилась отдельная категория взаимодействий «Сверхъестественное» и куча мелких улучшений интерфейса\n\n#high Спасибо, что играете!#!"

