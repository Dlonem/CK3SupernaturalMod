#Version Info Main
 spn_versioninfo.1000.t:0 "Supernatural: сведения о версии 2.43"

 spn_versioninfo.1000.desc:0 "#high Supernatural – версия#! #P 2.43#!\nДля CK3 1.21. Silk & Silver не требуется. Чтобы поддержать мод, найдите #high «Dlonem»#! на YouTube\nи подпишитесь. Вопросы о моде? Читайте вики:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.43: Голос в крови#!\n$BULLET_WITH_TAB$Охотник, у которого рядом тёплый след, идёт по нему, и Охота бесплатна.\n$BULLET_WITH_TAB$Следопыт господина может выехать по следу.\n$BULLET_WITH_TAB$Купцы-вампиры, оборотни и гибриды начинают с преимуществом в торговле.\n$BULLET_WITH_TAB$Восемь новых ежегодных моментов для оборотней.\n$BULLET_WITH_TAB$Порой жажда говорит на латыни, а волк — на древнескандинавском. Наведи курсор, чтобы узнать смысл.\n$BULLET_WITH_TAB$Сильнейший волк-одиночка может основать стаю.\n$BULLET_WITH_TAB$Человек, которого ты спас своей кровью, может прийти тебя искать.\n$BULLET_WITH_TAB$Короче варианты в событиях 2.42; романтические моменты чуть реже.\n$BULLET_WITH_TAB$Совершенно новые экраны загрузки в стиле оригинальной игры.\n$BULLET_WITH_TAB$Исправления после долгой совместной игры."

 spn_versioninfo.1000.a:0 "Начать"
 spn_versioninfo.1000.a.tt:0 "Закрыть это сообщение и начать игру."
