#Version Info Main
 spn_versioninfo.1000.t:0 "Сверхъестественное: Информация о версии"

 spn_versioninfo.1000.desc:0 "#high Supernatural – Версия#! #P 2.40#!\nОбновлено под CK3 1.20. Чтобы поддержать мод, наберите #high «Dlonem»#! на YouTube\nи подпишитесь. Вопросы по моду? Читайте вики:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.40: Fixes and Balance#!\n$BULLET_WITH_TAB$Borrowing and pledging to the Reliquary work again.\n$BULLET_WITH_TAB$Temples now get relics; pledges pass to an heir in the temple.\n$BULLET_WITH_TAB$Respondeo: any temple member or a Powder can pay, and no wound.\n$BULLET_WITH_TAB$One of Us Is Known: send someone below you to answer it.\n$BULLET_WITH_TAB$Far fewer Order pop-ups, and fewer still while you are at war.\n$BULLET_WITH_TAB$Promotions, teaching and new Mages are slower and rarer.\n$BULLET_WITH_TAB$Temple Magi can step down; the masks can run your temple.\n$BULLET_WITH_TAB$Change Your Temple: ask to join another temple of the Order.\n$BULLET_WITH_TAB$The embrace pickers now give the level you choose.\n$BULLET_WITH_TAB$Golems can no longer be turned, and they serve your heir.\n$BULLET_WITH_TAB$Your golem can be your puppet: seize, strike, guard, seduce and more.\n$BULLET_WITH_TAB$The Sire Bond: a lover you turned is bound to you as a puppet.\n$BULLET_WITH_TAB$Compel Mortal now gives you a puppet for one command.\n$BULLET_WITH_TAB$Any Gnostic Council seat can draw on the council's treasury.\n$BULLET_WITH_TAB$The Fors Factorum: free casting, then the price.\n$BULLET_WITH_TAB$The Transference pays the families of its carriers.\n$BULLET_WITH_TAB$The Hide Finds a Page: claim it, even from the Pope.\n$BULLET_WITH_TAB$Hide champions can meet in a duel on the field.\n$BULLET_WITH_TAB$Every hide says what it does. Midnight is a noble fury.\n$BULLET_WITH_TAB$Alphas can offer each other terms; a True Alpha can split a pack.\n$BULLET_WITH_TAB$Pack Members Clash: real fights between packs, and a fight can leave a trail.\n$BULLET_WITH_TAB$Supernatural Trails lists every trail a hunter could follow.\n$BULLET_WITH_TAB$Supernatural decisions are split into five groups.\n$BULLET_WITH_TAB$Hunt events appear in the hunt window.\n$BULLET_WITH_TAB$Draining a victim dry relieves stress.\n$BULLET_WITH_TAB$Dozens of smaller fixes from your reports.\n\n#high 2.39a – Исправления:#!\n$BULLET_WITH_TAB$Магические ветки заранее предупреждают, что завершить можно только один путь.\n\n#high 2.39 – Герметический орден Голубой розы, часть 2:#!\n$BULLET_WITH_TAB$«Invocare»: храмы могут сместить Великого магуса.\n$BULLET_WITH_TAB$«Imperium»: совет может дать ему чрезвычайную власть.\n$BULLET_WITH_TAB$Иной Великий магус сам устраивает себе беду.\n$BULLET_WITH_TAB$«Great Respondeo»: совет заставляет забыть целое королевство.\n$BULLET_WITH_TAB$Чужаки могут сломить Орден Голубой розы.\n$BULLET_WITH_TAB$Или попросить Адептуса Майора принять их.\n$BULLET_WITH_TAB$Свидетель Vade Maecum: заклинания могут пойти не так.\n$BULLET_WITH_TAB$«The Homunculus Beetle»: реликвия, с которой начинается мор.\n$BULLET_WITH_TAB$Чемпионы могут разорвать цепи и бежать из темницы.\n$BULLET_WITH_TAB$«The Warded Chains» держат волка. Их делают маги.\n$BULLET_WITH_TAB$Вампир в темнице может принудить своего тюремщика.\n$BULLET_WITH_TAB$Волк, чью память стёр Орден, может вспомнить.\n$BULLET_WITH_TAB$«Draught of a Clear Mind» защищает разум.\n$BULLET_WITH_TAB$«Collegium»: редкий зал, под которым собирается храм.\n$BULLET_WITH_TAB$Романы в Ордене. Они приносят вес, а не ранг.\n$BULLET_WITH_TAB$Новые события для неофитов, магусов храмов и стай.\n$BULLET_WITH_TAB$«The Pack Comes Home»: ночь у костра.\n$BULLET_WITH_TAB$Большинство событий Ордена и стай приходит не чаще раза в 60 дней.\n$BULLET_WITH_TAB$Вампиры и волки ведут себя в Ордене сообразно природе.\n$BULLET_WITH_TAB$Орден отвечает на суды над ведьмами и охотится на охотников.\n$BULLET_WITH_TAB$Решения «Embrace Witchcraft» и «Embrace the Mage».\n$BULLET_WITH_TAB$Новое правило: демонами становятся только игроки (по желанию).\n$BULLET_WITH_TAB$Вампиры больше не могут принудить оборотня.\n$BULLET_WITH_TAB$Новые тексты 2.39 пока на английском.\n\n#high 2.39 – Исправления:#!\n$BULLET_WITH_TAB$Приглашения в стаю больше не отменяют сами себя.\n$BULLET_WITH_TAB$Застрявшее собрание Гностического совета теперь завершается.\n$BULLET_WITH_TAB$Никто больше не занимает два места в совете.\n$BULLET_WITH_TAB$«Сбросить события о жизни» сбрасывает и изменение обряда.\n$BULLET_WITH_TAB$Супруг вампира может попросить обратить его.\n$BULLET_WITH_TAB$Маг предупреждает, что закрывает два других пути.\n$BULLET_WITH_TAB$Охотники на ведьм больше не вступают в Орден.\n$BULLET_WITH_TAB$Настоящий охотник больше не исчезает во «Времени нужды».\n$BULLET_WITH_TAB$ИИ-охотник сжигает только ведьму в своих руках.\n$BULLET_WITH_TAB$Гибрид больше не гибнет от давней просьбы об обращении.\n$BULLET_WITH_TAB$Неофит в темнице сохраняет место в Ордене.\n$BULLET_WITH_TAB$Волки младше 18 лет больше не становятся любовниками.\n$BULLET_WITH_TAB$«Сто лет» больше не приходит дважды.\n$BULLET_WITH_TAB$Respondeo больше не разносит тайну ведьмы.\n$BULLET_WITH_TAB$Десятки событий теперь проверяют, уместны ли они ещё.\n\n#high 2.38 – Герметический орден Голубой розы:#!\n$BULLET_WITH_TAB$Орден Голубой розы: шесть храмов Магов.\n$BULLET_WITH_TAB$Приходит письмо. Пройди его испытание — и станешь магусом храма.\n$BULLET_WITH_TAB$Храмы следуют Безмолвию, Покорности или Соблюдению.\n$BULLET_WITH_TAB$Во главе — Гностический совет и его Великий магус.\n$BULLET_WITH_TAB$Когда кресло пустеет, Конклав выбирает заново.\n$BULLET_WITH_TAB$Восемь реликвий — отдать своему храму или одолжить.\n$BULLET_WITH_TAB$«Забрать их реликвии»: война за магическое достояние соперника.\n$BULLET_WITH_TAB$Vade Maecum Infernal: четыре страницы, одна тёмная книга.\n$BULLET_WITH_TAB$Цеккия, демон-вор, отзывается на некоторые призывы.\n$BULLET_WITH_TAB$У ковенов появляется своя панель, и они могут вступить в Орден.\n$BULLET_WITH_TAB$Дружественные заклинания теперь лежат в меню «Сверхъестественное».\n$BULLET_WITH_TAB$Два новых правила игры: Орден и Vade Maecum.\n\n#high 2.38 – Баланс:#!\n$BULLET_WITH_TAB$Одна вершина: Маг, Чернокнижник или Истинная ведьма — не две.\n$BULLET_WITH_TAB$ИИ выбирает свой путь и некромантию по своей природе.\n$BULLET_WITH_TAB$Магические артефакты доходят до придворных и авантюристов.\n$BULLET_WITH_TAB$Черта оборотня даёт меньше военного дела.\n$BULLET_WITH_TAB$Ступени волка: «Бывалый» и «Старший» заменяют «Одичалого» и «Первобытного».\n$BULLET_WITH_TAB$Чемпионы, практикующие магию, каждый год возвращают себе силу.\n$BULLET_WITH_TAB$Стаи приглашают одиноких волков, которых знают.\n$BULLET_WITH_TAB$Орден благоволит юным наследникам великих титулов.\n$BULLET_WITH_TAB$Новые храмы появляются на западе ванильной карты.\n$BULLET_WITH_TAB$Истинные ведьмы вновь появляются рядом с магами Ордена.\n\n#high 2.38 – Исправления:#!\n$BULLET_WITH_TAB$Исцеление больше не забирает Когти Рогатого Бога.\n$BULLET_WITH_TAB$Отказ от некромантии забирает и её скелетные войска.\n$BULLET_WITH_TAB$«Потребовать покорности» правильно обращает цель.\n$BULLET_WITH_TAB$Опыт образа жизни существ показывается в подсказках.\n$BULLET_WITH_TAB$Удалены тысячи ошибок скриптов.\n\n#high 2.37 – Шесть шкур:#!\n$BULLET_WITH_TAB$Шесть древних волчьих шкур, и у каждой своя воля.\n$BULLET_WITH_TAB$Шкура выбирает волка, который ей подходит, — своего Чемпиона.\n$BULLET_WITH_TAB$Чемпионы сильнее, слышат магию и никогда не дряхлеют.\n$BULLET_WITH_TAB$Узы шкуры крепнут с каждым годом, что её носят.\n$BULLET_WITH_TAB$Большинство шкур изначально лежат реликвиями в святилищах при святых местах.\n$BULLET_WITH_TAB$Забрать одну можно, удержав графство, осадой или паломничеством.\n$BULLET_WITH_TAB$Или заплатить и «Послать за шкурой» — как бы далеко она ни была.\n$BULLET_WITH_TAB$Шкура, которую ИИ оставит без дела на десять лет, ускользает.\n$BULLET_WITH_TAB$Оборотни и гибриды могут основать стаю и вступить в неё.\n$BULLET_WITH_TAB$Вес в стае растёт с годами и победами в Испытаниях.\n$BULLET_WITH_TAB$Победи вожака в Испытании — и стая твоя.\n$BULLET_WITH_TAB$Волки под управлением ИИ бросают вызов вожаку только по причине.\n$BULLET_WITH_TAB$Новое занятие: Сход оборотней.\n$BULLET_WITH_TAB$Убитый Чемпион даёт охотнику двойной престиж.\n$BULLET_WITH_TAB$Два новых правила игры: «Шесть шкур» и «Стаи».\n$BULLET_WITH_TAB$Работает на идущем сохранении. Шкуры появляются в течение года.\n\n#high 2.37 – Исправления:#!\n$BULLET_WITH_TAB$Причины сверхъестественных смертей теперь читаются как предложения.\n$BULLET_WITH_TAB$Смерть от отказа от крови больше не показывает ошибку.\n$BULLET_WITH_TAB$У «Они перестали приходить» есть своя иконка.\n$BULLET_WITH_TAB$Исправлена сломанная ссылка в «Воззвать к узам».\n$BULLET_WITH_TAB$«Он», «она» и «его» начинают предложения с заглавной.\n$BULLET_WITH_TAB$Демоны могут иметь детей от оборотней и гибридов.\n\n#high 2.36 – Crusader Kings III 1.20:#!\n$BULLET_WITH_TAB$Новые игры больше не падают при загрузке.\n$BULLET_WITH_TAB$Доктрины о существах стоят на каждом обряде, включая новые.\n$BULLET_WITH_TAB$Известные существа — это грехи или добродетели обряда, как и ведьмы.\n$BULLET_WITH_TAB$Сверхъестественный выбор идёт в зачёт Духовного удовлетворения.\n$BULLET_WITH_TAB$Твой обряд судит твоё кормление, убийства и обращения других.\n$BULLET_WITH_TAB$И осуждает их, лишь когда ты уже известен тем, кто ты есть.\n$BULLET_WITH_TAB$Ревностные чувствуют это сильнее. Циников за это не карают никогда.\n$BULLET_WITH_TAB$Кормление оставляет след, только если о нём кто-то заговорит.\n$BULLET_WITH_TAB$Преступления, отвержение и война с ведьмами следуют за обрядом.\n$BULLET_WITH_TAB$Персонажи, которых мод создаёт или обращает, получают нужный обряд.\n$BULLET_WITH_TAB$Предназначение лагеря Искателей вернулось.\n$BULLET_WITH_TAB$«Учёный» стал «Эрудитом» и сохранил свой магический бонус.\n$BULLET_WITH_TAB$Картинки занятий, иконки событий и подсказки загрузки исправлены под 1.20.\n\n#high 2.35a – Исправления:#!\n$BULLET_WITH_TAB$Отказ от охоты на ведьм больше не убивает ведьму.\n$BULLET_WITH_TAB$Твои собственные ведьмы больше не исчезают, когда ты выдаёшь их замуж.\n$BULLET_WITH_TAB$Частые встречи с ведьмами и чудовищами снова достаются охотникам.\n$BULLET_WITH_TAB$Охотники и существа появляются сами куда реже.\n$BULLET_WITH_TAB$«Обнаружение чудовища» могло срабатывать на ком угодно. Теперь у него есть условие.\n$BULLET_WITH_TAB$Обычное убийство больше не читается как расправа существа.\n\n#high 2.35 – Охота:#!\n$BULLET_WITH_TAB$Новое занятие: выехать и выследить того, кто убивает людей.\n$BULLET_WITH_TAB$Убийства и рыскание оставляют следы в тех графствах, где случились.\n$BULLET_WITH_TAB$Следы накапливаются. После трёх случаев о них узнаёт лорд.\n$BULLET_WITH_TAB$Он может поискать сам, поручить это своему шпионмейстеру, назначить награду\n$BULLET_WITH_TAB$или послать за известным охотником и заплатить ему по завершении.\n$BULLET_WITH_TAB$Новая придворная должность, Следопыт, читает следы по округе.\n$BULLET_WITH_TAB$Охотиться на существо или на ведьму — со своими следами и сценами.\n$BULLET_WITH_TAB$Возьми серебро, кол, собак или людей — и дверь откроется по-разному.\n$BULLET_WITH_TAB$Возьми с собой ученика — и он пройдёт обучение в поле.\n$BULLET_WITH_TAB$Существу достаётся вторая половина сцены и настоящие ответы:\n$BULLET_WITH_TAB$встать и драться, залечь, принудить его, послать своих потомков,\n$BULLET_WITH_TAB$выпустить волка или перевести его на кого-нибудь похуже.\n$BULLET_WITH_TAB$Уйдёшь — сможешь предупредить своего создателя и своих потомков или продать их.\n$BULLET_WITH_TAB$Демоны не убегают, а препираются и могут предложить сделку.\n$BULLET_WITH_TAB$Охотники и существа получают имена, которые начинает использовать округа.\n$BULLET_WITH_TAB$Графство, отогнавшее трёх охотников, перестаёт их привлекать.\n$BULLET_WITH_TAB$Заметай свои убийства: откупиться, подставить другого или спрятать тело.\n$BULLET_WITH_TAB$Принуди весь городок — и дыры начнут выстраиваться в ряд.\n$BULLET_WITH_TAB$Охотники куда реже едут на плохие шансы и умеют повернуть назад.\n\n#high 2.35 – Исправления:#!\n$BULLET_WITH_TAB$До охоты на ведьм было не добраться. Теперь она работает.\n$BULLET_WITH_TAB$Два файла вообще не загружались, поэтому следы не писались никогда.\n$BULLET_WITH_TAB$Слой миграции охотников не запускался. Теперь запускается.\n$BULLET_WITH_TAB$Охотникам куда чаще сообщают о ведьмах и чудовищах.\n$BULLET_WITH_TAB$Тайные ведьмы оставляют следы, а не только всем известные.\n$BULLET_WITH_TAB$Принуждение кого-то ради его тайн больше не вызывает ошибку.\n$BULLET_WITH_TAB$Удалены тысячи ошибок скриптов за сессию.\n$BULLET_WITH_TAB$Полкам охотников теперь нужен перк «Охотничьи академии».\n\n#high 2.34a – Исправления:#!\n$BULLET_WITH_TAB$Твой шпионмейстер перестаёт находить тайны, о которых ты уже знаешь.\n$BULLET_WITH_TAB$Создатели, оцарапавшие, наставники и родители знают, что они сотворили.\n$BULLET_WITH_TAB$Существующие сохранения один раз починяются при загрузке.\n\n#high 2.34 – Кровь помнит, кто:#!\n$BULLET_WITH_TAB$Обращения запоминаются и называют твоего создателя.\n$BULLET_WITH_TAB$Создатели, оцарапавшие и наставники тоже помнят тебя.\n$BULLET_WITH_TAB$Из этих воспоминаний вырастают шесть разовых событий.\n$BULLET_WITH_TAB$Вампир на максимуме может принудить охотника уйти домой.\n$BULLET_WITH_TAB$«Воззвать к узам» показывает свои затраты и получает четыре повеления.\n$BULLET_WITH_TAB$Вершины «Истинный истребитель ведьм» и «Истинный истребитель чудовищ».\n$BULLET_WITH_TAB$Охота на ведьм открывается на пути, а не на вершине.\n$BULLET_WITH_TAB$Вампиры могут кормиться в племенных владениях.\n$BULLET_WITH_TAB$Демоны больше не подхватывают болезни.\n\n#high 2.34 – Исправления:#!\n$BULLET_WITH_TAB$Черты вершин магии снова выдаются.\n$BULLET_WITH_TAB$Кнопки уз «Вступить со мной в брак» и «Твой долг мне» работают.\n$BULLET_WITH_TAB$У отказа от уз наконец есть цена.\n$BULLET_WITH_TAB$Падшие охотники теряют всю свою охотничью суть.\n$BULLET_WITH_TAB$Ведьм больше не обращают случайно.\n$BULLET_WITH_TAB$Задание истребителя ведьм делает настоящего охотника.\n$BULLET_WITH_TAB$Сверхъестественные снова могут открывать другие образы жизни.\n$BULLET_WITH_TAB$ИИ-сверхъестественные чаще выбирают собственную цель.\n$BULLET_WITH_TAB$Защитные руны и боевые заклинания что-то делают.\n\n#high 2.33 – Кровь помнит:#!\n$BULLET_WITH_TAB$Пади в бою с вампирской кровью в себе — и восстань.\n$BULLET_WITH_TAB$Недели голода, а потом покормись или откажись навсегда.\n$BULLET_WITH_TAB$Выпей умирающего капитана, рыцаря или чужака.\n$BULLET_WITH_TAB$Если тот, кто дал тебе кровь, рядом, — спроси его.\n$BULLET_WITH_TAB$Кто бы ни дал тебе кровь, он становится твоим создателем.\n$BULLET_WITH_TAB$Упрямые и ревностные отказываются чаще.\n$BULLET_WITH_TAB$Работает и с владениями, и без них, и не требует патча.\n\n#high 2.33 – Исправления:#!\n$BULLET_WITH_TAB$Создатель и Потомок устанавливаются при любом способе обращения.\n\n#high 2.32 – Новое:#!\n$BULLET_WITH_TAB$Кормиться в чужих городах, а не только в своём королевстве.\n$BULLET_WITH_TAB$Жертвы берутся из местного двора, а не из твоего.\n$BULLET_WITH_TAB$У вампиров вернулось решение «Утолить жажду».\n$BULLET_WITH_TAB$Две новые ветви вампира: дорога и платная кровь.\n$BULLET_WITH_TAB$Две новые ветви оборотня: граница и соперник.\n$BULLET_WITH_TAB$Пережить охотника теперь делает тебя сильнее.\n$BULLET_WITH_TAB$Оборотни называются по ступеням, как вампиры.\n$BULLET_WITH_TAB$Твой создатель и твои потомки могут пригласить тебя всегда.\n$BULLET_WITH_TAB$Заполненная шкала питает твой образ жизни, а не пустоту.\n\n#high 2.32 – Исправления:#!\n$BULLET_WITH_TAB$Преследуемая жертва — один человек, а не три.\n$BULLET_WITH_TAB$Полоса успеха и её подсказка наконец согласны друг с другом.\n$BULLET_WITH_TAB$Гости больше не раздувают эту полосу до предела.\n$BULLET_WITH_TAB$Больше трети ИИ-событий кормления не срабатывало никогда.\n$BULLET_WITH_TAB$Ветвь убийства у оборотня даёт опыт, как у вампира.\n$BULLET_WITH_TAB$Гибриды больше не умирают от смерти, назначенной только оборотням.\n$BULLET_WITH_TAB$Излечение ликантропии убирает и выданные ею перки.\n$BULLET_WITH_TAB$ИИ взбирается по твоим ветвям перков, а не застревает.\n$BULLET_WITH_TAB$31 портрет использовал анимации, которых не существует.\n$BULLET_WITH_TAB$Авантюристы без владений могут завершить каждую ветвь.\n\n#high 2.31c – Исправления:#!\n$BULLET_WITH_TAB$Драконов больше нельзя обратить, принудить или проклясть.\n$BULLET_WITH_TAB$Упыри, Иные и Король Ночи тоже исключены.\n$BULLET_WITH_TAB$Шпионмейстеры снова могут раскрыть все виды тайн, а не четыре.\n$BULLET_WITH_TAB$Оповещения о перках работают для всех четырёх целей существ.\n$BULLET_WITH_TAB$Войско Магического совета прибывает в полном составе.\n$BULLET_WITH_TAB$Тёмные храмы больше не дают ошибок у кастеров без владений.\n$BULLET_WITH_TAB$130 подсказок заклинаний показывали сырой ключ. Теперь они читаются.\n$BULLET_WITH_TAB$Восемь Первородных используют нынешние гены портретов из AGOT.\n$BULLET_WITH_TAB$Сверхъестественные сохраняют современные причёски и никогда не лысеют.\n\n#high 2.31c – Изменения:#!\n$BULLET_WITH_TAB$Ежегодные обходы NPC больше не прочёсывают всех разом.\n$BULLET_WITH_TAB$Предупреждение о дублирующем on_action при загрузке убрано.\n\n#high 2.31a – Исправления:#!\n$BULLET_WITH_TAB$«Мастер теней» и «Вампирское гнездо» можно нажать.\n$BULLET_WITH_TAB$У двух перков охотников был тот же изъян, и они тоже исправлены.\n$BULLET_WITH_TAB$Четверть ИИ-оборотней появлялась вампирами.\n$BULLET_WITH_TAB$Учёное образование возвращает свои 2 потерянных слота домена.\n$BULLET_WITH_TAB$Беременность больше не падает до 5% после первого ребёнка.\n$BULLET_WITH_TAB$Дети с демонической кровью вырастают в демонов к своим 20 годам.\n$BULLET_WITH_TAB$Все десять ванильных описаний тайн снова загружаются.\n$BULLET_WITH_TAB$«Задать визуальный возраст» больше не сбрасывается на следующем дне рождения.\n$BULLET_WITH_TAB$Оборотни в полуволчьей форме снова определяются правильно.\n$BULLET_WITH_TAB$Вампиры, оборотни и гибриды снова сопротивляются болезням.\n$BULLET_WITH_TAB$Чахотка излечивается при обращении, как и любая болезнь.\n\n#high 2.31a – Изменения:#!\n$BULLET_WITH_TAB$Укус оборотня сначала гноится от одного года до трёх.\n$BULLET_WITH_TAB$Переживи ликана — и Охотник, может быть, пощадит тебя.\n$BULLET_WITH_TAB$Эликсир торговца больше не говорит, кем ты станешь.\n$BULLET_WITH_TAB$Приглашения на кормление доходят лишь до тех, кто мог бы знать.\n$BULLET_WITH_TAB$Обходы персонажей по всей карте заменены на дешёвые.\n\n#high Сообщили о проблемах:#!\nshoutyman5, Nightblade, JoeFedz, huntsmanra9,\nDoverow, Hutmacherer, Kaan, AlduinTWE, EatanyBurger.\nРусский перевод: Adrian.\n\n#high Порядок загрузки с AGOT:#!\nAGOT, сабмоды AGOT, The Long Night и Azor Ahai (по желанию),\nSupernatural, затем патч совместимости — всегда последним.\n\n#high Спасибо за поддержку,#!\nDlonem"

