 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.28#!\nWelcome to the #high Supernatural#! mod! If you'd like to support this mod's development, consider subscribing to my YouTube channel. #high Search \"Dlonem\" and subscribe#!.\n\n#high 2.28 – Highlights:#!\n$BULLET_WITH_TAB$ Fixed the Vampire perk tree — Master of Shadows and Vampire Nest are selectable again, in a cleaner 'drop of blood' layout\n$BULLET_WITH_TAB$ Compulsion now notifies both sides — the compelled, and those who resist, finally learn what happened\n$BULLET_WITH_TAB$ New Supernatural loading-screen tips and a 'Vampire Feeding' info concept\n$BULLET_WITH_TAB$ A broad error-log cleanup, with no change to gameplay\n\n#high Thanks for the support,#!\nDlonem"

