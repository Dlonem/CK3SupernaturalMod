 spn_versioninfo.1000.t:0 "Supernatural: сведения о версии 2.40"

 spn_versioninfo.1000.desc:0 "#high Supernatural – версия#! #P 2.40#!\nОбновлено для CK3 1.20. Чтобы поддержать мод, найдите #high «Dlonem»#! на YouTube\nи подпишитесь. Вопросы о моде? Читайте вики:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.40: исправления и баланс#!\n$BULLET_WITH_TAB$Взятие из Реликвария и передача в него снова работают.\n$BULLET_WITH_TAB$Храмы теперь получают реликвии; переданное переходит к наследнику в храме.\n$BULLET_WITH_TAB$Респондео: платить может любой член храма или Порошок, и без раны.\n$BULLET_WITH_TAB$«Один из нас раскрыт»: можно послать разбираться младшего.\n$BULLET_WITH_TAB$Гораздо меньше всплывающих окон Ордена, и ещё меньше во время войны.\n$BULLET_WITH_TAB$Повышения, обучение и новые Маги — медленнее и реже.\n$BULLET_WITH_TAB$Храмовые Магусы могут уйти с поста; маски могут вести твой храм.\n$BULLET_WITH_TAB$«Сменить храм»: попросись в другой храм Ордена.\n$BULLET_WITH_TAB$Выбор при обращении теперь даёт выбранный уровень.\n$BULLET_WITH_TAB$Големов больше нельзя обратить, и они служат твоему наследнику.\n$BULLET_WITH_TAB$Голем может быть марионеткой: схватить, избить, охранять, соблазнить и др.\n$BULLET_WITH_TAB$Узы создателя: обращённый тобой любовник привязан к тебе как марионетка.\n$BULLET_WITH_TAB$«Принудить смертного» теперь даёт марионетку на один приказ.\n$BULLET_WITH_TAB$Любое место Гностического Совета может брать из казны совета.\n$BULLET_WITH_TAB$Форс Факторум: бесплатная магия, а затем цена.\n$BULLET_WITH_TAB$Перенос платит семьям своих носителей.\n$BULLET_WITH_TAB$«Шкура находит страницу»: притязай на неё, даже у Папы.\n$BULLET_WITH_TAB$Чемпионы шкур могут сойтись в поединке на поле боя.\n$BULLET_WITH_TAB$Каждая шкура объясняет, что делает. Миднайт — благородная ярость.\n$BULLET_WITH_TAB$Альфы могут предлагать друг другу условия; Истинный альфа может разделить стаю.\n$BULLET_WITH_TAB$«Стычка членов стай»: настоящие драки между стаями, и драка может оставить след.\n$BULLET_WITH_TAB$«Сверхъестественные следы» показывают каждый след, по которому может пойти охотник.\n$BULLET_WITH_TAB$Сверхъестественные решения разделены на пять групп.\n$BULLET_WITH_TAB$События охоты появляются в окне охоты.\n$BULLET_WITH_TAB$Полное обескровливание жертвы снимает стресс.\n$BULLET_WITH_TAB$Десятки мелких исправлений по вашим отчётам.\n\n#high 2.39a – исправления:#!\n$BULLET_WITH_TAB$Умение перед Магом, Колдуном и Истинной ведьмой теперь предупреждает, что завершить можно только один путь.\n\n#high 2.39 – Герметический Орден Голубой Розы, часть 2:#!\n$BULLET_WITH_TAB$Инвокаре: храмы могут сместить Великого Магуса голосованием.\n$BULLET_WITH_TAB$Империум: совет может дать ему чрезвычайную власть.\n$BULLET_WITH_TAB$Некоторые Великие Магусы сами устраивают чрезвычайное положение.\n$BULLET_WITH_TAB$Великое Респондео: совет заставляет королевство забыть.\n$BULLET_WITH_TAB$Посторонние могут сломить Орден Голубой Розы.\n$BULLET_WITH_TAB$Или попросить Адептуса Майора принять их.\n$BULLET_WITH_TAB$Свидетель Ваде Маэкум: заклинания могут пойти не так.\n$BULLET_WITH_TAB$Жук-гомункул: реликвия, начинающая чуму.\n$BULLET_WITH_TAB$Чемпионы могут разорвать цепи и сбежать из темницы.\n$BULLET_WITH_TAB$Заговорённые цепи держат волка. Их делают Маги.\n$BULLET_WITH_TAB$Заключённый вампир может принудить своего тюремщика.\n$BULLET_WITH_TAB$Волк, чью память стёр Орден, может вспомнить снова.\n$BULLET_WITH_TAB$Настой ясного разума защищает разум.\n$BULLET_WITH_TAB$Коллегия: редкий зал, под которым собирается храм.\n$BULLET_WITH_TAB$Романы в Ордене. Они дают положение, но не ранг.\n$BULLET_WITH_TAB$Новые события для неофитов, Храмовых Магусов и стай.\n$BULLET_WITH_TAB$«Стая возвращается домой»: ночь у костра.\n$BULLET_WITH_TAB$Большинство событий Ордена и стаи — не чаще раза в 60 дней.\n$BULLET_WITH_TAB$Вампиры и волки ведут себя в Ордене соответственно своей природе.\n$BULLET_WITH_TAB$Орден отвечает на суды над ведьмами и охотится на охотников.\n$BULLET_WITH_TAB$Решения «Принять ведовство» и «Стать Магом».\n$BULLET_WITH_TAB$Новое правило: демонами становятся только игроки (по желанию).\n$BULLET_WITH_TAB$Вампиры больше не могут принуждать оборотней.\n$BULLET_WITH_TAB$Магам ИИ нужна причина, чтобы вызвать тебя на дуэль или ограбить.\n$BULLET_WITH_TAB$Храмовые Магусы могут приглашать людей в Орден.\n$BULLET_WITH_TAB$Форс Факторум — для Великого Магуса и Храмовых Магусов.\n$BULLET_WITH_TAB$Наведи курсор на латынь Ордена, чтобы прочитать перевод.\n\n#high 2.39 – исправления:#!\n$BULLET_WITH_TAB$Приглашения в стаю больше не отменяются сами.\n$BULLET_WITH_TAB$Зависшее заседание Гностического Совета теперь завершается.\n$BULLET_WITH_TAB$Никто больше не занимает два места в совете.\n$BULLET_WITH_TAB$«Сброс пожизненных событий» сбрасывает и изменение обрядов.\n$BULLET_WITH_TAB$Супруг вампира может попросить его обратить.\n$BULLET_WITH_TAB$Маг предупреждает, что закрывает два других пути.\n$BULLET_WITH_TAB$Охотники на ведьм больше не могут вступить в Орден.\n$BULLET_WITH_TAB$Настоящий охотник больше не исчезает в «Час нужды».\n$BULLET_WITH_TAB$Охотники ИИ сжигают только тех ведьм, которых держат в плену.\n$BULLET_WITH_TAB$Гибрид больше не умирает из-за старой просьбы обратить его.\n$BULLET_WITH_TAB$Неофит в темнице сохраняет своё место в Ордене.\n$BULLET_WITH_TAB$Волки младше 18 лет больше не становятся любовниками.\n$BULLET_WITH_TAB$«Сто лет» больше не случается дважды.\n$BULLET_WITH_TAB$Респондео больше не раскрывает тайну ведьмы.\n$BULLET_WITH_TAB$Десятки событий теперь проверяют, что они всё ещё уместны.\n$BULLET_WITH_TAB$Конклав показывает каждого кандидата один раз.\n$BULLET_WITH_TAB$Посторонние больше не видят действий Гностического Совета.\n$BULLET_WITH_TAB$Для «Стая возвращается домой» нужна стая.\n$BULLET_WITH_TAB$«Ссора наставника» показывает твоего послушника.\n$BULLET_WITH_TAB$Ученики больше не так часто становятся соперниками.\n$BULLET_WITH_TAB$Детей больше нельзя обратить, и они не могут пользоваться силами существ.\n$BULLET_WITH_TAB$События шкур на охоте показываются в окне охоты.\n\n#high 2.38 – Герметический Орден Голубой Розы:#!\n$BULLET_WITH_TAB$Орден Голубой Розы: шесть храмов Магов.\n$BULLET_WITH_TAB$Приходит письмо. Пройди испытание, поднимись до Храмового Магуса.\n$BULLET_WITH_TAB$Храмы следуют Молчанию, Покорности или Соблюдению.\n$BULLET_WITH_TAB$Им руководят Гностический Совет и его Великий Магус.\n$BULLET_WITH_TAB$Когда кресло пустеет, Конклав выбирает заново.\n$BULLET_WITH_TAB$Восемь реликвий, которые можно передать храму или одолжить.\n$BULLET_WITH_TAB$«Забрать их реликвии»: война за магические сокровища соперника.\n$BULLET_WITH_TAB$Ваде Маэкум Инферналь: четыре страницы, одна тёмная книга.\n$BULLET_WITH_TAB$Зеккья, демон-вор, отвечает на некоторые призывы.\n$BULLET_WITH_TAB$У ковенов есть своя панель, и они могут вступить в Орден.\n$BULLET_WITH_TAB$Дружественные заклинания теперь в меню «Сверхъестественное».\n$BULLET_WITH_TAB$Два новых правила игры: Орден и Ваде Маэкум.\n\n#high 2.38 – баланс:#!\n$BULLET_WITH_TAB$Одна вершина: Маг, Колдун или Истинная ведьма, не две.\n$BULLET_WITH_TAB$ИИ выбирает свой путь и некромантию по характеру.\n$BULLET_WITH_TAB$Магические артефакты доходят до придворных и искателей приключений.\n$BULLET_WITH_TAB$Черта оборотня даёт меньше воинского искусства.\n$BULLET_WITH_TAB$Ступени волка: «Опытный» и «Старейшина» заменяют «Дикий» и «Первобытный».\n$BULLET_WITH_TAB$Чемпионы, практикующие магию, восстанавливают силу каждый год.\n$BULLET_WITH_TAB$Стаи приглашают знакомых волков-одиночек.\n$BULLET_WITH_TAB$Орден благоволит юным наследникам великих титулов.\n$BULLET_WITH_TAB$На стандартной карте новые храмы появляются на Западе.\n$BULLET_WITH_TAB$Истинные ведьмы снова появляются рядом с Магами Ордена.\n\n#high 2.38 – исправления:#!\n$BULLET_WITH_TAB$Исцеление больше не забирает «Когти Рогатого бога».\n$BULLET_WITH_TAB$Отказ от некромантии забирает и войска скелетов.\n$BULLET_WITH_TAB$«Потребовать подчинения» правильно обращает цель.\n$BULLET_WITH_TAB$Опыт образа жизни существ виден в подсказках.\n$BULLET_WITH_TAB$Удалены тысячи ошибок скриптов.\n\n#high 2.37 – Шесть шкур:#!\n$BULLET_WITH_TAB$Шесть древних волчьих шкур, у каждой своя воля.\n$BULLET_WITH_TAB$Шкура выбирает подходящего ей волка своим Чемпионом.\n$BULLET_WITH_TAB$Чемпионы сильнее, слышат магию и никогда не дряхлеют.\n$BULLET_WITH_TAB$Узы шкуры крепнут с каждым годом, что её носят.\n$BULLET_WITH_TAB$Большинство шкур начинают как реликвии в святилищах святых мест.\n$BULLET_WITH_TAB$Забери шкуру, владея графством, осадой или паломничеством.\n$BULLET_WITH_TAB$Или заплати, чтобы «Послать за шкурой», как бы далеко она ни была.\n$BULLET_WITH_TAB$Шкура, которую ИИ десять лет не использует, ускользает.\n$BULLET_WITH_TAB$Оборотни и гибриды могут основывать стаи и вступать в них.\n$BULLET_WITH_TAB$Вес в стае растёт с годами и выигранными Вызовами.\n$BULLET_WITH_TAB$Победи альфу в Вызове, и стая твоя.\n$BULLET_WITH_TAB$Волки ИИ бросают вызов альфе только по причине.\n$BULLET_WITH_TAB$Новое занятие: Сход оборотней.\n$BULLET_WITH_TAB$Убитый Чемпион даёт охотнику двойной престиж.\n$BULLET_WITH_TAB$Два новых правила игры: Шесть шкур и Стаи.\n$BULLET_WITH_TAB$Работает в текущем сохранении. Шкуры появляются в течение года.\n\n#high 2.37 – исправления:#!\n$BULLET_WITH_TAB$Сверхъестественные причины смерти теперь читаются как предложения.\n$BULLET_WITH_TAB$Смерть «отказался от крови» больше не показывает ошибку.\n$BULLET_WITH_TAB$У «Они перестали приходить» есть значок.\n$BULLET_WITH_TAB$Исправлена сломанная ссылка в «Призвать узы».\n$BULLET_WITH_TAB$«Он», «она» и «его» в начале предложения пишутся с заглавной.\n$BULLET_WITH_TAB$Демоны могут иметь детей от оборотней и гибридов.\n\n#high 2.36 – Crusader Kings III 1.20:#!\n$BULLET_WITH_TAB$Новые игры больше не вылетают при загрузке.\n$BULLET_WITH_TAB$Доктрины существ есть у каждого обряда, включая новые.\n$BULLET_WITH_TAB$Известные существа — грехи или добродетели обряда, как ведьмы.\n$BULLET_WITH_TAB$Сверхъестественные выборы учитываются в духовном удовлетворении.\n$BULLET_WITH_TAB$Твой обряд судит твоё кормление, убийства и обращение других.\n$BULLET_WITH_TAB$Он осуждает их только после того, как станет известно, кто ты.\n$BULLET_WITH_TAB$Ревностные чувствуют это сильнее. Циников за это никогда не наказывают.\n$BULLET_WITH_TAB$Кормление оставляет след, только если о нём кто-то говорит.\n$BULLET_WITH_TAB$Преступления, изгнание и война против ведьм следуют обряду.\n$BULLET_WITH_TAB$Созданные или обращённые модом персонажи сохраняют правильный обряд.\n$BULLET_WITH_TAB$Цель лагеря «Искатели» вернулась.\n$BULLET_WITH_TAB$«Учёный» теперь «Эрудит» и сохраняет магический бонус.\n$BULLET_WITH_TAB$Арт занятий, значки событий и советы при загрузке исправлены для 1.20.\n\n#high 2.35a – исправления:#!\n$BULLET_WITH_TAB$Отказ от охоты на ведьму больше не убивает ведьму.\n$BULLET_WITH_TAB$Твои ведьмы больше не исчезают, когда ты выдаёшь их замуж.\n$BULLET_WITH_TAB$Частые появления ведьм и чудовищ снова для охотников.\n$BULLET_WITH_TAB$Гораздо меньше охотников и существ появляется само по себе.\n$BULLET_WITH_TAB$«Замечено чудовище» могло сработать на ком угодно. Теперь есть условие.\n$BULLET_WITH_TAB$Обычное убийство больше не выглядит как убийство существом.\n\n#high 2.35 – Охота:#!\n$BULLET_WITH_TAB$Новое занятие: выезжай и охоться на то, что убивает людей.\n$BULLET_WITH_TAB$Убийства и рыскания оставляют следы в графствах, где случаются.\n$BULLET_WITH_TAB$Следы усиливаются. Три случая — и господин узнаёт.\n$BULLET_WITH_TAB$Он может искать сам, поручить это тайному советнику, назначить награду\n$BULLET_WITH_TAB$или позвать известного охотника и заплатить ему, когда всё будет сделано.\n$BULLET_WITH_TAB$Новая придворная должность, Следопыт, читает округу.\n$BULLET_WITH_TAB$Охоться на существо или на ведьму, у каждой свои следы и сцены.\n$BULLET_WITH_TAB$Возьми серебро, колья, собак или людей, и у двери всё пойдёт иначе.\n$BULLET_WITH_TAB$Возьми с собой ученика, и он выпустится прямо в поле.\n$BULLET_WITH_TAB$Существо получает вторую половину сцены и настоящие ответы:\n$BULLET_WITH_TAB$стоять и биться, затаиться, принудить охотника, послать потомство,\n$BULLET_WITH_TAB$выпустить волка или уговорить его заняться кем-то похуже.\n$BULLET_WITH_TAB$Уйди — и сможешь предупредить своего создателя и потомство либо продать их.\n$BULLET_WITH_TAB$Демоны спорят вместо бегства и могут предложить сделку.\n$BULLET_WITH_TAB$Охотники и существа получают прозвища, которые подхватывает мир.\n$BULLET_WITH_TAB$Графство, прогнавшее трёх охотников, перестаёт их привлекать.\n$BULLET_WITH_TAB$Скрывай свои убийства: откупись, подставь кого-то или спрячь тело.\n$BULLET_WITH_TAB$Принуди целый город, и прорехи начнут выстраиваться в линию.\n$BULLET_WITH_TAB$Охотники гораздо реже выезжают при плохих шансах и могут повернуть назад.\n\n#high 2.35 – исправления:#!\n$BULLET_WITH_TAB$До охот на ведьм невозможно было добраться. Теперь они работают.\n$BULLET_WITH_TAB$Два файла никогда не загружались, поэтому следы не записывались.\n$BULLET_WITH_TAB$Слой миграции охотников никогда не работал. Теперь работает.\n$BULLET_WITH_TAB$Охотникам гораздо чаще сообщают о ведьмах и чудовищах.\n$BULLET_WITH_TAB$Тайные ведьмы оставляют следы, а не только открыто известные.\n$BULLET_WITH_TAB$Принуждение ради тайн больше не вызывает ошибку.\n$BULLET_WITH_TAB$Удалены тысячи ошибок скриптов за сессию.\n$BULLET_WITH_TAB$Полкам охотников теперь нужно умение «Академии охотников».\n\n#high 2.34a – исправления:#!\n$BULLET_WITH_TAB$Тайный советник перестал находить уже известные тебе тайны.\n$BULLET_WITH_TAB$Создатели, обратившие, наставники и родители знают, кого они создали.\n$BULLET_WITH_TAB$Существующие сохранения исправляются один раз при загрузке.\n\n#high 2.34 – Кровь помнит кого:#!\n$BULLET_WITH_TAB$Обращения запоминаются и называют твоего создателя.\n$BULLET_WITH_TAB$Создатели, укусившие и наставники тоже помнят тебя.\n$BULLET_WITH_TAB$Из этих воспоминаний вырастают шесть разовых событий.\n$BULLET_WITH_TAB$Вампир на пике может принудить охотника уйти домой.\n$BULLET_WITH_TAB$«Призвать узы» показывает цены и получает четыре приказа.\n$BULLET_WITH_TAB$Вершины «Истинный охотник на ведьм» и «Истинный охотник на чудовищ».\n$BULLET_WITH_TAB$Охоты на ведьм открываются ветвью, а не вершиной.\n$BULLET_WITH_TAB$Вампиры могут питаться во владениях племён.\n$BULLET_WITH_TAB$Демоны больше не заражаются болезнями.\n\n#high 2.34 – исправления:#!\n$BULLET_WITH_TAB$Черты магических вершин снова выдаются.\n$BULLET_WITH_TAB$Кнопки «Женись на мне» и «Ты мне должен» в узах работают.\n$BULLET_WITH_TAB$У отказа от уз наконец есть цена.\n$BULLET_WITH_TAB$Павшие охотники теряют всю личность охотника.\n$BULLET_WITH_TAB$Ведьм больше не обращают случайно.\n$BULLET_WITH_TAB$Задание охотника на ведьм создаёт настоящего охотника.\n$BULLET_WITH_TAB$Сверхъестественные персонажи снова могут открывать другие образы жизни.\n$BULLET_WITH_TAB$Сверхъестественные персонажи ИИ чаще сами выбирают фокус.\n$BULLET_WITH_TAB$Руны защиты и боевые заклинания что-то делают.\n\n#high 2.33 – Кровь помнит:#!\n$BULLET_WITH_TAB$Пади в бою с кровью вампира в жилах — и восстань.\n$BULLET_WITH_TAB$Недели голода, а затем питайся или откажись навсегда.\n$BULLET_WITH_TAB$Осуши умирающего капитана, рыцаря или незнакомца.\n$BULLET_WITH_TAB$Если тот, кто дал тебе кровь, рядом, попроси его.\n$BULLET_WITH_TAB$Тот, кто дал тебе кровь, становится твоим создателем.\n$BULLET_WITH_TAB$Упрямые и ревностные персонажи отказываются чаще.\n$BULLET_WITH_TAB$Работает с землёй и без неё и не требует патча.\n\n#high 2.33 – исправления:#!\n$BULLET_WITH_TAB$Создатель и потомство задаются при любом способе обращения.\n\n#high 2.32 – содержание:#!\n$BULLET_WITH_TAB$Питайся в чужих городах, а не только в своём королевстве.\n$BULLET_WITH_TAB$Жертвы берутся из местного двора, а не из твоего.\n$BULLET_WITH_TAB$Вампирам вернули решение «Утолить жажду».\n$BULLET_WITH_TAB$Две новые ветви вампира: дорога и купленная кровь.\n$BULLET_WITH_TAB$Две новые ветви оборотня: граница и соперник.\n$BULLET_WITH_TAB$Пережить встречу с охотником теперь делает тебя сильнее.\n$BULLET_WITH_TAB$Оборотни названы по ступеням, как вампиры.\n$BULLET_WITH_TAB$Создатель и потомство всегда могут тебя пригласить.\n$BULLET_WITH_TAB$Ветвь на максимуме питает образ жизни, а не пропадает зря.\n\n#high 2.32 – исправления:#!\n$BULLET_WITH_TAB$Выслеживаемая жертва — один человек, а не трое.\n$BULLET_WITH_TAB$Полоса успеха и её подсказка наконец совпадают.\n$BULLET_WITH_TAB$Гости больше не раздувают эту полосу до предела.\n$BULLET_WITH_TAB$Больше трети событий кормления ИИ никогда не срабатывали.\n$BULLET_WITH_TAB$Ветвь убийства оборотня даёт опыт, как у вампира.\n$BULLET_WITH_TAB$Гибриды больше не умирают от смерти, предназначенной только оборотням.\n$BULLET_WITH_TAB$Излечение ликантропии убирает данные ею умения.\n$BULLET_WITH_TAB$ИИ продвигается по твоим древам умений, а не застревает.\n$BULLET_WITH_TAB$31 портрет использовал несуществующие анимации.\n$BULLET_WITH_TAB$Безземельные искатели приключений могут завершить любую ветвь.\n\n#high 2.31c – исправления:#!\n$BULLET_WITH_TAB$Драконов больше нельзя обратить, принудить или проклясть.\n$BULLET_WITH_TAB$Упыри, Иные и Король Ночи тоже исключены.\n$BULLET_WITH_TAB$Тайные советники снова могут раскрывать все типы тайн, а не 4.\n$BULLET_WITH_TAB$Оповещения об очках умений работают для четырёх фокусов существ.\n$BULLET_WITH_TAB$Войско Магического совета прибывает в полной силе.\n$BULLET_WITH_TAB$Тёмные храмы больше не дают ошибку у безземельных колдунов.\n$BULLET_WITH_TAB$130 подсказок заклинаний показывали сырой ключ. Теперь читаются.\n$BULLET_WITH_TAB$Восемь Древних используют текущие гены портретов AGOT.\n$BULLET_WITH_TAB$Сверхъестественные персонажи сохраняют современные причёски и не лысеют.\n\n#high 2.31c – изменения:#!\n$BULLET_WITH_TAB$Ежегодные проверки NPC больше не обходят всех сразу.\n$BULLET_WITH_TAB$Исчезло повторное предупреждение on_action при загрузке.\n\n#high 2.31a – исправления:#!\n$BULLET_WITH_TAB$«Повелитель теней» и «Гнездо вампиров» можно нажать.\n$BULLET_WITH_TAB$Два умения охотника имели ту же ошибку и тоже исправлены.\n$BULLET_WITH_TAB$Четверть оборотней-NPC появлялись вампирами.\n$BULLET_WITH_TAB$Учёное образование возвращает 2 потерянных слота домена.\n$BULLET_WITH_TAB$Шанс беременности больше не падает до 5% после одного ребёнка.\n$BULLET_WITH_TAB$Дети с кровью демона становятся демонами в 20 с лишним лет.\n$BULLET_WITH_TAB$Все десять стандартных описаний тайн снова загружаются.\n$BULLET_WITH_TAB$«Задать видимый возраст» больше не сбрасывается в следующий день рождения.\n$BULLET_WITH_TAB$Оборотни в форме глабро снова правильно определяются.\n$BULLET_WITH_TAB$Вампиры, оборотни и гибриды снова сопротивляются болезням.\n$BULLET_WITH_TAB$Чахотка излечивается при обращении, как и любая болезнь.\n\n#high 2.31a – изменения:#!\n$BULLET_WITH_TAB$Укус оборотня сначала гноится от одного до трёх лет.\n$BULLET_WITH_TAB$Переживи Ликана, и Охотник может тебя пощадить.\n$BULLET_WITH_TAB$Эликсир торговки больше не говорит, кем ты станешь.\n$BULLET_WITH_TAB$Приглашения на кормление получают только те, кто может знать.\n$BULLET_WITH_TAB$Проверки персонажей по всей карте заменены на дешёвые.\n\n#high Сообщили об ошибках:#!\nshoutyman5, Nightblade, JoeFedz, huntsmanra9,\nDoverow, Hutmacherer, Kaan, AlduinTWE, EatanyBurger.\nРусский перевод: Adrian.\n\n#high Порядок загрузки с AGOT:#!\nAGOT, сабмоды AGOT, The Long Night & Azor Ahai (по желанию),\nSupernatural, затем Compatibility Patch – всегда последним.\n\n#high Спасибо за поддержку,#!\nDlonem"

