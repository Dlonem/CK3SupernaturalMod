l_russian:
 ############################################################
 # Supernatural 2.35, part two -- "The Bridge". English.
 #
 # Demons and witches leave the same county trail vampires and werewolves already left, and a hunter has an
 # answer to a demon that is not a mage's spell. Register: folklore, lightly worn. A demon is smoke that
 # wears a person. Nobody says "elder".
 ############################################################

 # ==========================================================
 # THE TRAIL -- new tags, modifiers and the death reason
 # ==========================================================
 spn_hunt_tag_kind_demon:0 "#positive_value + Ничего не взято, всё порушено#! (Примета)\n"
 spn_hunt_tag_kind_witch:0 "#positive_value + Сделано нарочно#! (Примета)\n"

 spn_no_one_will_come_modifier:0 "Никто не придёт"
 spn_no_one_will_come_modifier_desc:0 "Трое ехали сюда по его следу — и ни один не вернулся с добычей. Торговые люди судачат, а графство перестало быть местом, где кто-то возьмётся за работу. Что осталось, правит собой само — и правит плохо."
 spn_they_stopped_coming_modifier:0 "Они перестали приходить"
 spn_they_stopped_coming_modifier_desc:0 "Что бы ни было в этом графстве, те, кто живёт охотой на подобное, решили: оно не стоит того, что за это платят."
 spn_driven_off_modifier:0 "Отогнан"
 spn_driven_off_modifier_desc:0 "Кто-то едва не взял тебя — и заставил уйти. Это не рана, и заживает оно не как рана."
 spn_brought_back_modifier:0 "Возвращён"
 spn_brought_back_modifier_desc:0 "Тебя долго не было где-то ещё, а здесь в это время было что-то другое. Руки пока не совсем твои."
 spn_took_the_bargain_modifier:0 "Подписал"
 spn_took_the_bargain_modifier_desc:0 "Исцелён, отточен и сбросил тридцать лет. У сделки есть срок, и ты примерно знаешь, когда он придёт."

 spn_death_exorcised:0 "пал(а) там, где [CHARACTER.GetSheHe] стоял(а), и то, что держало [CHARACTER.GetHerHim] на ногах, ушло"

 spn_bought_my_silence_opinion:0 "Купил моё молчание — и оно не удержалось"
 spn_took_my_coin_opinion:0 "Был щедр, когда это было важно"
 spn_gave_me_back_opinion:0 "Вернул мне мою собственную жизнь"
 spn_drove_me_off_opinion:0 "Выставил меня из графства"

 spn_exorcism_soul_returned_toast:0 "Договор окончен"
 spn_exorcism_soul_returned_tt:0 "То, что держало твоё имя, ушло — а с ним и то, что оно держало. Что бы ты ни отдал подписью, никто за этим не придёт."

 # ==========================================================
 # MEMORIES
 # ==========================================================
 spn_sent_it_home_memory:0 "отправил(а) одного восвояси"
 spn_sent_it_home_memory_desc:0 "отправил(а) обратно туда, откуда оно пришло, то, что носило личину человека по имени [demon.GetFirstName], и видел(а), как рухнуло то, что оно оставило после себя"
 spn_sent_it_home_memory_desc_second_perspective:0 "отправил(а) обратно туда, откуда оно пришло, то, что носило личину человека по имени [demon.GetFirstName], и видел(а), как рухнуло то, что оно оставило после себя"
 spn_sent_it_home_memory_desc_third_perspective:0 "отправил(а) обратно туда, откуда оно пришло, то, что носило личину человека по имени [demon.GetFirstName], и видел(а), как рухнуло то, что оно оставило после себя"
 spn_brought_one_back_memory:0 "вернул(а) одного назад"
 spn_brought_one_back_memory_desc:0 "нашёл(а) внутри ещё живого человека и вытащил(а) [person.GetHerHim] оттуда"
 spn_brought_one_back_memory_desc_second_perspective:0 "нашёл(а) внутри ещё живого человека и вытащил(а) [person.GetHerHim] оттуда"
 spn_brought_one_back_memory_desc_third_perspective:0 "нашёл(а) внутри ещё живого человека и вытащил(а) [person.GetHerHim] оттуда"
 spn_remembers_the_exorcist_memory:0 "тот, кто едва меня не взял"
 spn_remembers_the_exorcist_memory_desc:0 "помню [hunter.GetFirstName]: слова были сказаны как надо и почти доведены до конца"
 spn_remembers_the_exorcist_memory_desc_second_perspective:0 "помнишь [hunter.GetFirstName]: слова были сказаны как надо и почти доведены до конца"
 spn_remembers_the_exorcist_memory_desc_third_perspective:0 "помнит [hunter.GetFirstName]: слова были сказаны как надо и почти доведены до конца"
 spn_took_the_demons_bargain_memory:0 "подписал(а)"
 spn_took_the_demons_bargain_memory_desc:0 "перестал(а) охотиться на [demon.GetFirstName] и вместо этого подписал(а) то, что [demon.GetSheHe] подсунул(а) мне на подпись"
 spn_took_the_demons_bargain_memory_desc_second_perspective:0 "перестал(а) охотиться на [demon.GetFirstName] и вместо этого подписал(а) то, что [demon.GetSheHe] подсунул(а) тебе на подпись"
 spn_took_the_demons_bargain_memory_desc_third_perspective:0 "перестал(а) охотиться на [demon.GetFirstName] и вместо этого подписал(а) то, что [demon.GetSheHe] подсунул(а) на подпись"
 # ==========================================================
 # GATE TOOLTIPS
 # ==========================================================
 spn_hunt_exorcise_needs_tt:0 "Требуется #high охота на ведьм 25#!. Слова надо знать."
 spn_hunt_exorcise_named_tt:0 "У этого имя старше самих слов. Оно не пойдёт туда, куда не хочет."
 spn_hunt_banish_needs_tt:0 "Требуется #high охота на ведьм 100#! или само заклинание изгнания."
 spn_hunt_banish_greater_tt:0 "Тут не стоит ничего такого, что можно было бы изгнать."
 spn_hunt_coven_needs_tt:0 "Требуется #high охота на ведьм 60#! или имя, которое в доме уже слышали."

 # ==========================================================
 # THE TRAIL (spn_hunt.0100) -- two new kind reads and the first off-ramp
 # ==========================================================
 spn_hunt.0100.desc_demon:0 "Ты видел дом, через который прошёл волк. Ты видел комнату, в которой работал вампир. Здесь не то и не другое.\n\nМужчина лежит на полу в своём доме, руки вдоль тела. Ни раны. Ничего не пропало. Огонь погас, молоко скисло, а собака не идёт в дом с крыльца.\n\nЖена говорит: он сел посреди фразы и не договорил её."
 spn_hunt.0100.desc_witch:0 "Здесь никого не убили — и в этом вся беда.\n\nЯчмень почернел на одном поле, а на двух соседних нет. У одной женщины пропало молоко. Сын старосты одиннадцать дней говорит чужим голосом, и священник перестал ходить в тот дом.\n\nНичто из этого не преступление. Всё это — нарочно. Ты увидишь очертания только тогда, когда отойдёшь подальше и начнёшь считать."
 spn_hunt.0100.b:0 "Это не моя драка."
 spn_hunt.0100.b.tt:0 "Поверни назад. Что бы здесь ни было, оно здесь ради того, кто подготовлен лучше — или кому меньше есть что терять.\n\nСлед остаётся в графстве. Кто-нибудь может вернуться за ним."
 # ==========================================================
 # WHAT THEY WILL FIND -- Pay It Away
 # ==========================================================
 spn_hunt.0140.pay:0 "Найти того, кому пришлось бы это записать."
 spn_hunt.0140.pay.tt:0 "Стоит #high [spn_body_hush_money|V] золота#!. Ни броска, ни обмана: человеку, которому пришлось бы за это отвечать, дают достаточно, чтобы он не отвечал, — и в книгах графства одной записью меньше.\n\nОн возьмёт. Он и запомнит, что взял, а если охотник когда-нибудь докажет, что здесь жило, — запомнят все остальные."
 # ==========================================================
 # NOTHING WAS TAKEN (spn_hunt.0160)
 # ==========================================================
 spn_hunt.0160.t:0 "Ничего не взято"
 spn_hunt.0160.desc:0 "Четверо за три недели — а ты всё ещё не можешь сказать, на что смотришь.\n\nВ том, что оставляет вампир, всегда чего-то не хватает. Волк оставляет разорванное. А эти целы, холодны, и каждого нашли там, где ему было нечего делать.\n\nЖена бочара вошла в собственный колодец. Староста держал руку в огне. Никто не кричал. Соседи повторяют это так, будто это хоть чем-то помогает."
 spn_hunt.0160.desc_reads:0 "Четверо за три недели — и ты наконец перестал пытаться свести их в одно.\n\nТы искал повреждений. Их нет. Жена бочара сама вошла в свой колодец, староста сам держал руку в огне — оба сделали это своими руками.\n\nНечто стояло в тех комнатах и никого не трогало. Ему достаточно было быть там и говорить."
 spn_hunt.0160.a:0 "Хватит искать, чего не хватает. Смотри на то, что осталось."
 spn_hunt.0160.a.tt:0 "Неверный вопрос стоил тебе трёх недель. Ни у кого из них ничего не отняли, значит, идти надо не по ране. А по тому, что каждый делал, когда перестал быть собой, и по тому, кто стоял достаточно близко, чтобы сказать им слово.\n\n#high +14#! к охоте. Немного опыта охоты на чудовищ."
 spn_hunt.0160.b:0 "Пойти и спросить священника, о чём он умалчивает в своих книгах."
 spn_hunt.0160.b.tt:0 "Он записал четыре смерти и ни одной причины, и он спит в церкви. Он знает, как это назвать. Он предпочёл бы не произносить этого при чужаке с мечом.\n\n#high +8#! к охоте. Немного опыта охоты на ведьм."
 # ==========================================================
 # THE ONES WHO SIGNED (spn_hunt.0161)
 # ==========================================================
 spn_hunt.0161.t:0 "Те, кто подписался"
 spn_hunt.0161.desc:0 "[spn_hunt_signatory.GetTitledFirstName] сразу бросается тебе в глаза: [spn_hunt_signatory.GetSheHe|U] здесь единственный человек, у кого год сложился хорошо.\n\nУрожай был плох, и половина графства больна. [spn_hunt_signatory.GetSheHe|U] в новых сапогах, на новой должности, а жена у [spn_hunt_signatory.GetHerHim] на двадцать лет младше той, что уже в земле. С весны [spn_hunt_signatory.GetSheHe|U] в церковь не ходит.\n\nТебе это уже знакомо. Четырежды никому не везёт."
 spn_hunt.0161.a:0 "Тот, кто составил договор, приходил сюда, чтобы его составить."
 spn_hunt.0161.a.tt:0 "Кто-то стоял в этом графстве и заключил сделку с живущим здесь человеком, а сделки заключают лично. Проследи удачу назад, до самой ночи, с которой она началась, — и ты окажешься там, где стояло оно.\n\n#high +16#! к охоте. Немного опыта охоты на ведьм."
 spn_hunt.0161.b:0 "Рассказать этому человеку — [spn_hunt_signatory.GetFirstName] — что идёт, и примерно когда."
 spn_hunt.0161.b.tt:0 "[spn_hunt_signatory.GetSheHe|U] не знает условий. Почти никто из подписавших их не знает. Ты можешь предупредить [spn_hunt_signatory.GetHerHim], на что поставлена подпись и что явится за платой, — и [spn_hunt_signatory.GetSheHe] возненавидит тебя до конца той жизни, которая окажется короче, чем [spn_hunt_signatory.GetSheHe] думает, и [spn_hunt_signatory.GetSheHe] расскажет тебе всё.\n\n#high +6#! к охоте."
 spn_hunt.0161.c:0 "Пусть всё идёт как идёт. Что подписано — то подписано."
 spn_hunt.0161.c.tt:0 "Ты здесь ради того, что составило этот договор, а не ради глупцов, которые поставили под ним свои подписи."

 # ==========================================================
 # IT KNOWS YOUR NAME (spn_hunt.0162)
 # ==========================================================
 spn_hunt.0162.t:0 "Оно знает твоё имя"
 spn_hunt.0162.desc:0 "В графстве есть человек, который задаёт вопросы. К третьему дню у тебя есть его имя, его ремесло и та гостиница, где он остановился.\n\nВолк к этому времени был бы уже в следующей долине. Вампир думал бы о подвалах. А ты, как выясняется, думаешь о нём: что ему причитается, чего ему не хватает, чего ему никто и никогда не предлагал.\n\nКаждый чего-то хочет."
 spn_hunt.0162.a:0 "Пусть приходит. Пусть узнает, за чем он гнался."
 spn_hunt.0162.a.tt:0 "Тебя это не застанет врасплох — а это уже почти всё. #high +10#! против него, когда он отыщет дверь."
 spn_hunt.0162.b:0 "Сначала выяснить, чего он хочет."
 spn_hunt.0162.b.tt:0 "Человек, который три недели делает работу, за которую ему мало платят, — уже в середине разговора, о котором сам не догадывается.\n\nКогда он доберётся сюда, ему предложат условия."
 spn_hunt.0162.c:0 "Подарить графству тихие две недели, пока он не добрался до главного."
 spn_hunt.0162.c.tt:0 "Две недели ничего не происходит. Никто ничего не замечает. Ему останется на одну находку меньше.\n\n#high -12#! к его охоте, и одно происшествие долой из книг графства."

 # ==========================================================
 # WHAT IS STANDING THERE (spn_hunt.0163) -- the demon confrontation
 # ==========================================================
 spn_hunt.0163.t:0 "Что там стоит"
 spn_hunt.0163.desc:0 "Дверь открыта, и то, что стоит по ту сторону, носит человека.\n\nОно сидит плохо. Лицо работает, руки работают, но вес слегка не тот — будто кому-то дали форму, не дав повадки.\n\n\"Так это ты задаёшь вопросы,\" — говорит оно его голосом. \"Входи. Я никуда не собираюсь.\""
 spn_hunt.0163.desc_named:0 "Дверь открыта, и то, что стоит по ту сторону, не поднимается.\n\nОно отзывается на это имя дольше, чем графство носит своё, и надевает тело так, как рука надевает перчатку. Оно смотрит на соль в твоём кулаке и ждёт, пока ты закончишь.\n\n\"Скажи их,\" — произносит оно. \"Хочу услышать, как тебя этому учили.\""
 spn_hunt.0163.desc_greater:0 "Дверь открыта, и комната не та ещё до того, как ты переступил порог.\n\nОгонь горит и ничего не отдаёт. Все собаки на улице разом умолкли. То, что сидит в кресле, не моргнуло ни разу с тех пор, как ты вошёл, — и не похоже, что оно решило не моргать.\n\n\"Садись,\" — говорит оно. \"Никто не добирался так далеко уже сотню лет.\""
 spn_hunt.0163.desc_made:0 "Дверь открыта, и то, что за ней, стоит в человеке, который всё ещё внутри.\n\nТы это видишь, но не смог(ла) бы объяснить как. Взгляд уходит к окну и слишком быстро возвращается. Руки то и дело начинают жест, принадлежащий кому-то другому, и останавливаются на полпути.\n\n\"Не надо,\" — любезно говорит оно. \"Он тебя слышит.\""
 spn_hunt.0163.a:0 "Попробовать выгнать его из тела."
 spn_hunt.0163.a.tt:0 "Сила не нужна. Нужно удержать его на месте достаточно долго, чтобы довести дело до конца, — и нужно, чтобы тебя правильно учили.\n\nВ основном твоя #high охота на чудовищ#!, отчасти #high охота на ведьм#!. Опыт охоты на ведьм ты получишь в любом случае.\n\nЕсли оно когда-то было человеком — человек вернётся. Если нет — тело, которое оно одолжило, не выживет."
 spn_hunt.0163.b:0 "Изгнать его сразу."
 spn_hunt.0163.b.tt:0 "Мало кто из живущих на это способен, и ты в их числе. Ни броска, ни боя. Оно просто исчезает."
 spn_hunt.0163.c:0 "Идти на него с тем, что принёс."
 spn_hunt.0163.c.tt:0 "Оно истечёт кровью — в том смысле, в каком ею истекает тело, которое оно носит."
 spn_hunt.0163.d:0 "Выслушать его."
 spn_hunt.0163.d.tt:0 "У него есть предложение. У них всегда есть предложение, и предложение всегда лучше того, с чем ты сюда пришёл."
 spn_hunt.0163.e:0 "Закрыть дверь и сесть на коня."
 spn_hunt.0163.e.tt:0 "Ты занимаешься этим достаточно долго, чтобы отличать плохую ночь от последней.\n\nПрестиж #low -25#!. След остаётся на месте."

 # ==========================================================
 # THE BARGAIN IN THE FIELD (spn_hunt.0164)
 # ==========================================================
 spn_hunt.0164.t:0 "Сделка в поле"
 spn_hunt.0164.desc:0 "Оно выходит с тобой во двор и встаёт на открытом месте — так, что ты можешь замахнуться на него.\n\n\"Тебе сорок один,\" — говорит оно. \"Колено у тебя не то с позапрошлой зимы. В двух графствах тебе должны деньги.\" Каждое число верно. \"Брось это дело — и к весне тебе снова будет тридцать. Я приду за платой через тридцать лет. И это всё.\"\n\nОно прикладывает бумагу к стене и отступает от неё."
 spn_hunt.0164.a:0 "Прочитать её и поставить подпись."
 spn_hunt.0164.a.tt:0 "Исцелён. Отточен. Сбросил тридцать лет — и во всём лучше, чем ты когда-либо был(а)."
 spn_hunt.0164.a.tt2:0 "Ты отдаёшь охоту и свою душу — по часам. За ней придут через десять-тридцать лет, и обойдутся с тобой ровно так же вежливо, как оно сейчас."
 spn_hunt.0164.b:0 "Поднять бумагу и протянуть её обратно."
 spn_hunt.0164.b.tt:0 "Меньшее тебе предлагали и худшие. Престиж и благочестие, а оно и вправду задето — и это даёт #high +5#! к тому, что будет дальше."
 
  # ==========================================================
 # THE ONE YOU BROUGHT BACK (spn_hunt.0165)
 # ==========================================================
 spn_hunt.0165.t:0 "Тот, кого ты вернул(а)"
 spn_hunt.0165.desc:0 "[spn_freed_person.GetTitledFirstName] стоит у ворот — и стоит там ещё с темноты.\n\nВозвращаться некуда. В доме живут другие. Семья отгоревала одиннадцать лет назад. В приходской книге под этим именем стоит дата.\n\n\"Мне ничего не нужно\", — говорит [spn_freed_person.GetSheHe], и остаётся стоять."
 spn_hunt.0165.a:0 "Место найдётся. Входи."
 spn_hunt.0165.a.tt:0 "Придворный, обязанный тебе всей оставшейся жизнью — и знающий это."
 spn_hunt.0165.b:0 "Дать [spn_freed_person.GetHerHim] денег на дорогу."
 spn_hunt.0165.b.tt:0 "[spn_freed_person.GetSheHe|U] уйдёт по свету с долгом перед тобой. Это не пустяк, и вы оба знаете, где искать другого."

 # ==========================================================
 # IT DID NOT GO (spn_hunt.0166)
 # ==========================================================
 spn_hunt.0166.t:0 "Не вышло"
 spn_hunt.0166.desc:0 "Ты прошёл(а) почти весь путь. Ты почти уверен(а), что прошёл(а) почти весь путь.\n\nЧто-то в комнате сделалось тонким — удара на четыре. Огонь потянуло в сторону. Лицо человека распалось на чьё-то испуганное — и снова сомкнулось.\n\nПотом оно вернулось, смеясь, а рот у тебя перестал слушаться. Сейчас оно не смеётся. Оно поставило кресло, идёт через комнату — и не торопится."
 spn_hunt.0166.a:0 "Встать и всадить в него клинок."
 spn_hunt.0166.a.tt:0 "Ты на #low -20#!. Ты знал(а) это, когда брался(лась) за другое."
 spn_hunt.0166.b:0 "Ударить так, чтобы вырваться из дверей."
 spn_hunt.0166.b.tt:0 "Отбиться, выставить его из графства и вернуться домой к целому году, в котором рука не поднимается.\n\nОно не умрёт. Оно уйдёт в другое место, забрав с собой твоё имя, и след в графстве оборвётся.\n\nВы оба будете точно знать, кто есть кто."

 # ==========================================================
 # THEY ARE NOT WORKING ALONE (spn_hunt.0170)
 # ==========================================================
 spn_hunt.0170.t:0 "Они работают не одни"
 spn_hunt.0170.desc:0 "У тебя было одно имя, и до её двери оставалось три дня. А потом шинкарка невзначай сказала не то.\n\nОна жалуется на семью. Не на женщину — на семью. Брат, вернувшийся невесть откуда и не работающий. Тётка, которой никто не видит при свете дня. Сестра двоюродная, похоронившая двух мужей и хорошо устроившаяся после обоих.\n\nКто-то из них — то, за чем ты пришёл. И ты уже не уверен, что разница имеет значение."
 spn_hunt.0170.a:0 "Посчитать дом, прежде чем в него стучать."
 spn_hunt.0170.a.tt:0 "Имена, годы, кто из них сегодня под этой крышей, а кто за три долины отсюда. Ты потом будешь рад(а), что это сделал(а).\n\n#high +12#! к охоте. Немного опыта охоты на ведьм."
 spn_hunt.0170.b:0 "Послать к господину за людьми, прежде чем приближаться."
 spn_hunt.0170.b.tt:0 "Это стоит тебе недели внезапности и покупает людей у дверей.\n\n#low -5#! к охоте и люди графства, когда дойдёт до дела."

 # ==========================================================
 # WHERE THE WORK WAS DONE (spn_hunt.0171)
 # ==========================================================
 spn_hunt.0171.t:0 "Где шла работа"
 spn_hunt.0171.desc:0 "Подпол под домом сух, подметён и освещён лучше кухни над ним. Вот это тебе всё и говорит.\n\nБанки с подписями. Учётная книга. Пучки, развешанные в том порядке, в каком их срезали. Табурет, залоснившийся с одного края. Здесь никто не буйствует. Здесь работают.\n\n[spn_defender.GetTitledFirstName] ждёт внизу лестницы с лампой и не выказывает ни удивления, ни раскаяния."
 spn_hunt.0171.desc_coven:0 "Подпол под домом сух, подметён, хорошо освещён — и в нём четыре табурета.\n\nБанки, подписанные двумя разными руками. Учётная книга, начатая задолго до того, как [spn_defender.GetTitledFirstName] появился(лась) на свет. Пучки, развешанные кем-то повыше.\n\n[spn_defender.GetSheHe|U] стоит внизу лестницы с лампой и не удивлён(а) тебя видеть. У тебя над головой, в доме, к которому ты стоишь спиной, кто-то только что перестал ходить."
 spn_hunt.0171.a:0 "Взять [spn_defender.GetHerHim] — а остальное сделает суд."
 spn_hunt.0171.a.tt:0 "По-правильному: с причиной в ордере и причиной, записанной на бумаге. В этих графствах так обычно не делают — и в этом-то вся суть.\n\nСлед в графстве обрывается. Опыт охоты на ведьм."
 spn_hunt.0171.b:0 "Закончить здесь."
 spn_hunt.0171.b.tt:0 "Ни ордера, ни суда, ни учётной книги, зачитанной кому-либо."
 spn_hunt.0171.c:0 "Пройти по всему дому."
 spn_hunt.0171.c.tt:0 "Каждый взрослый под этой крышей, дверь за дверью, пока не кончатся двери или кровь.\n\nКаждая дверь — свой бой и своё решение. Начиная со второй, даже победа чего-то тебе стоит. Кто-то заканчивал это сам, а кого-то оттуда выносили."
 spn_hunt.0171.d:0 "То, что ты пришёл(шла) подтвердить, — подтверждено. Уходи."
 spn_hunt.0171.d.tt:0 "Тот, кто не один в знакомом ему доме и ночью, — это дело на другой день.\n\nПрестиж #low -25#!. След остаётся в графстве."

 # ==========================================================
 # ANOTHER ONE IN THE HOUSE (spn_hunt.0172)
 # ==========================================================
 spn_hunt.0172.t:0 "Ещё один в доме"
 spn_hunt.0172.desc:0 "Есть ещё одна дверь — и за ней кто-то есть.\n\n[spn_defender.GetTitledFirstName] слышал(а) всё, что случилось за последние минуты, и не убежал(а), — а это уже говорит, что за птица. Лампа погашена. Ты слышишь дыхание и ещё тихий звук того, как что-то снимают с полки."
 spn_hunt.0172.desc_late:0 "Есть ещё одна дверь.\n\nТы держишься за косяк, чтобы не упасть, в сапоге кровь, и ты уже сбился(лась), на каком ты этаже. [spn_defender.GetTitledFirstName] потратил(а) несколько минут на подготовку. Ты потратил(а) их на прямо противоположное.\n\nЕсть версия этой ночи, в которой ты спускаешься обратно по лестнице."
 spn_hunt.0172.a:0 "Этого тоже."
 spn_hunt.0172.a.tt:0 "Тот же бой, что и с предыдущим, — но с тем, кто всё это слышал."
 spn_hunt.0172.b:0 "Взять этого живым."
 spn_hunt.0172.b.tt:0 "Руки, верёвка и имя для ордера. Опыт охоты на ведьм."
 spn_hunt.0172.c:0 "Отойти и пропустить [spn_defender.GetHerHim]."
 spn_hunt.0172.c.tt:0 "[spn_defender.GetSheHe|U] уйдёт, не остановится и к утру будет уже не в этом графстве."
 spn_hunt.0172.d:0 "Остановиться. Спуститься по лестнице и выйти."
 spn_hunt.0172.d.tt:0 "Есть черта, за которой полный ими дом перестаёт быть работой и становится тем, как ты умрёшь, — а кто этой черты не чует, до старости не доживает.\n\nЕсли то, за чем ты пришёл(шла), всё ещё наверху, — это отступление, и графство это тоже запомнит."
 
 # ==========================================================
 # THE TEACHING EVENTS -- one rule each, taught by consequence
 # ==========================================================
 spn_hunt.0500.t:0 "Первое тело"
 spn_hunt.0500.desc:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nВ переулке за кожевней нашли человека. Никто его не знает. Священник уже дважды туда ходил и после этого расспрашивал людей — а он обычно так не делает.\n\n\"Говорят, будет ещё.\" Она встаёт и на выходе не смотрит на тебя."
 spn_hunt.0500.desc_wolf:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nВ переулке за кожевней что-то взяло человека. Собак, говорят. Священник уже дважды туда ходил и после этого расспрашивал людей — а он обычно так не делает.\n\n\"Таких собак не бывает.\" Она встаёт и на выходе не смотрит на тебя."
 spn_hunt.0500.desc_demon:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nВ переулке за кожевней нашли человека. Целого, холодного и сидящего. Священник там был дважды. Староста завёл книгу и начал её с даты, а не с имени.\n\n\"Говорят, будет ещё.\" Она уходит, не глядя на тебя."
 spn_hunt.0500.t_talk:0 "Кто-то говорит"
 spn_hunt.0500.desc_talk:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nЖенщина из переулка за кожевней рассказывает всякому, кто согласен постоять и послушать, что что-то держало её в темноте и пило из неё. Большинство смеются. Священник — нет. Он уже дважды к ней ходил и после этого расспрашивал людей — а он обычно так не делает.\n\n\"У неё отметины остались, есть что показать.\" Она встаёт и на выходе не смотрит на тебя."
 spn_hunt.0500.desc_talk_wolf:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nПастух спустился с холма с половиной отары и с историей, которую рассказывает всякому, кто готов купить ему выпивку. Собак, говорят. Священник уже дважды туда поднимался и после этого расспрашивал людей — а он обычно так не делает.\n\n\"Таких собак не бывает.\" Она встаёт и на выходе не смотрит на тебя."
 spn_hunt.0500.desc_talk_demon:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nСемья с кожевенного переулка ночью загрузила телегу и уехала, никому не сказав куда. Соседи сначала слышали крик — голосом, которого никто из них не знал. Священник там был дважды. Староста завёл книгу и начал её с даты, а не с имени.\n\n\"Говорят, будет ещё.\" Она уходит, не глядя на тебя."
 spn_hunt.0500.desc_talk_witch:0 "Девчонка, что топит тебе печь, дожидается, пока закончит, и говорит это в решётку очага, а не тебе.\n\nСын мельника не говорит ни слова с самого вторника. Мать его говорит, что знает почему, и уже сказала об этом священнику, и старосте, и всякому у колодца. Священник дважды был на мельнице и после этого расспрашивал людей — а он обычно так не делает.\n\n\"Она говорит, это была женщина.\" Она встаёт и на выходе не смотрит на тебя."
 spn_hunt.0500.a:0 "Пусть считают."
 spn_hunt.0500.a.tt:0 "Графство хранит память о том, что в нём происходит, и хранит её лет пять. Наберётся достаточно в одном месте — и его господину пишут."
 spn_hunt.0501.t:0 "Никто ничего не видел"
 spn_hunt.0501.desc:0 "На третий день ты идёшь обратно через рынок — и это либо глупость, либо в точности то, что нужно.\n\nНикакой истории нет. Возчик упал в реку. Человек уехал к брату, не попрощавшись, — что было очень на него похоже. Две женщины спорят из-за курицы.\n\nНичего из того, что ты сделал(а), там нет."
 spn_hunt.0501.a:0 "Значит, так можно."
 spn_hunt.0501.a.tt:0 "Можно. Не всегда и не у всех. Насколько хорошо получится — это в основном то, что ты есть, и отчасти то, каков(а) ты.\n\nЕсть и другие способы: кошель тому, кто записал бы это, или сосед такого же сорта, как ты, — с именем, которое уже само по себе стоит подозрений."
 spn_hunt.0502.t:0 "Человек, который задаёт вопросы"
 spn_hunt.0502.desc:0 "Всё меняет именно третий.\n\nОдин — это погода. Два — это неудачный месяц. Три — и вот уже человек с восковой табличкой ходит от двери к двери, улица за улицей, ещё с рассвета. Он не из этого прихода.\n\nО тебе он не спрашивал. Он спрашивал про переулок, про собак и про тех, кто не спит по ночам. В сумерках он всё ещё там."
 spn_hunt.0502.a:0 "Пусть спрашивает."
 spn_hunt.0502.a.tt:0 "Три происшествия в одном графстве — это тот порог, когда его господину пишут. Что он с этим сделает — его дело, и то, что придёт следом, может быть уже не этим человеком."
 spn_hunt.0502.b:0 "Побыть какое-то время в другом месте."
 spn_hunt.0502.b.tt:0 "Тебя здесь нет. Охота, которая явится искать, найдёт переулок, историю и никого, кого можно в неё вписать, — и память графства о тебе станет на одно короче.\n\nВесь год — без кормёжки."
 spn_hunt.0503.t:0 "Что тебе сказала старуха"
 spn_hunt.0503.desc:0 "У богадельни старуха хватает тебя за рукав и не отпускает.\n\n\"Ешь, прежде чем проголодаешься. Это первое. Голод — это когда перестаёшь решать ты.\"\n\nТы понятия не имеешь, кто она. \"Никто тебе ничего этого не рассказывал, верно? Никогда не рассказывают. Тебя сделают — и уходят.\" Она дважды хлопает тебя по руке. \"Садись. Это недолго.\""
 spn_hunt.0503.desc_wolf:0 "У богадельни старуха хватает тебя за рукав и не отпускает.\n\n\"Иди к нему сам(а). Не жди, пока оно придёт к тебе в дом, где есть люди. Это первое правило, и с большинством из них его хватает.\"\n\nТы понятия не имеешь, кто она. \"Никто тебе ничего этого не рассказывал, верно? Оно тебя обдерёт — и уйдёт, а останешься ты и куча дохлых овец.\" Она хлопает тебя по руке. \"Садись.\""
 spn_hunt.0503.a:0 "Сесть."
 spn_hunt.0503.a.tt:0 "Это первый полезный час, который тебе кто-либо подарил."
 spn_hunt.0503.b:0 "Она — напуганная старуха, которая никогда никого из вас не видела."
 spn_hunt.0503.b.tt:0 "Видела, однако. В этом-то весь её смысл."

 # ==========================================================
 # WHAT WAS LEFT IN THE HOUSE (spn_hunt.0600-0602)
 # ==========================================================
 spn_hunt.0600.t:0 "Что осталось в доме"
 spn_hunt.0600.desc:0 "Ты возвращаешься за своим ножом и обнаруживаешь, что дом не пуст.\n\n[spn_hunt_orphan_child.GetTitledFirstName] под столом, и [spn_hunt_orphan_child.GetSheHe|U] там всё это время. Ни звука тогда, ни звука сейчас. Больше никого, и в соседнем доме тоже никого.\n\nЕщё не того возраста, чтобы убежать. И ещё не того возраста, чтобы знать. [spn_hunt_orphan_child.GetSheHe|U] поднимает на тебя взгляд и ждёт, чтобы понять, что ты за человек."
 spn_hunt.0600.a:0 "Взять ребёнка на руки."
 spn_hunt.0600.a.tt:0 "Воспитать [spn_hunt_orphan_child.GetHerHim] сам(а). Через шестнадцать лет [spn_hunt_orphan_child.GetSheHe] решит, кем стать, — и это решение будет во многом зависеть от того, каким человеком оказался(лась) ты."
 spn_hunt.0600.b:0 "Ребёнок — не твоя забота. Оставить [spn_hunt_orphan_child.GetHerHim] здесь."
 spn_hunt.0600.b.tt:0 "[spn_hunt_orphan_child.GetSheHe|U] выживет. Дети чаще всего выживают.\n\nЧерез шестнадцать лет [spn_hunt_orphan_child.GetSheHe] будет точно знать, чьё лицо было в том дверном проёме, и жив ли ты ещё, чтобы тебя найти."
 spn_hunt.0600.c:0 "Закончить."
 spn_hunt.0600.c.tt:0 "Такова природа рода. Но это ещё и ребёнок под столом.\n\nГрафство тебя не поблагодарит и не забудет."
 spn_hunt.0601.t:0 "Шестнадцать"
 spn_hunt.0601.desc_raised:0 "Тебе было четыре, когда [spn_orphan_raiser.GetTitledFirstName] вынес(ла) тебя из того дома, и ты знаешь всю правду с тех пор, как научился(лась) задавать вопросы.\n\nТы знаешь, кем был твой отец. Но никто за всё это время не спросил тебя, какой половиной той ночи ты собираешься стать."
 spn_hunt.0601.desc_left:0 "Тебе было четыре, ты сидел(а) под столом и помнишь сапоги, дверной проём и половину лица.\n\nДвенадцать лет ты выяснял(а) остальное: кем он был, чем зарабатывал, как это называл и где он теперь. Это было нетрудно. Такие люди гордятся своим ремеслом, а ремесло их записано.\n\nСегодня тебе шестнадцать. Никто этого не отметил."
 spn_hunt.0601.a:0 "Взяться за ремесло."
 spn_hunt.0601.a.tt:0 "[spn_orphan_raiser.GetTitledFirstName] сделал(а) из тебя охотника. Не было уверенности, что [spn_orphan_raiser.GetSheHe] это удастся."
 spn_hunt.0601.b:0 "Ты не станешь тем, кто он."
 spn_hunt.0601.b.tt:0 "Он тебя вырастил, но не дотянулся до тебя, и в тебе много от отца — того, о чём он никогда не спрашивал.\n\nТы уходишь, и он становится тем, с кем у тебя есть счёты."
 spn_hunt.0601.c:0 "Выяснить, где он теперь."
 spn_hunt.0601.c.tt:0 "На это ушло двенадцать лет, и ни разу не было сомнений."
 spn_hunt.0602.t:0 "Кто-то расспрашивает о тебе"
 spn_hunt.0602.desc:0 "Какой-то молодой ездит по графствам и спрашивает, где ты пьёшь, — и так уже месяц, и делает это осторожно, вежливо и неспешно так, что люди потом это помнят.\n\nИмя ты не можешь вспомнить. Ты почти уверен(а), что лицо бы запомнил(а).\n\nВ этом и беда ремесла: помнишь тех, кто с тобой дрался, — а приходят никогда не они."
 spn_hunt.0602.a:0 "Ты всегда знал(а), что кто-нибудь из них придёт."

 # ==========================================================
 # THE THING IN THE CRADLE (spn_hunt.0610)
 # ==========================================================
 spn_hunt.0610.t:0 "То, что лежит в колыбели"
 spn_hunt.0610.desc:0 "Ребёнок в задней комнате, в настоящей колыбели, накормлен и обихожен тем, кто сейчас лежит мёртвым во дворе.\n\nГода три, наверное. Не спит и не плачет. Просто лежит и ждёт, когда шум кончится.\n\n[spn_hunt_cradle_child.GetSheHe|U] пока не демон. Сегодня ночью ты был(а) достаточно близко к одному из них, чтобы знать разницу. Но что-то в [spn_hunt_cradle_child.GetHerHim] завершится само примерно через двадцать лет — и спрашивать разрешения оно не станет."
 spn_hunt.0610.a:0 "Изгнать это из [spn_hunt_cradle_child.GetHerHim], пока изгонять ещё нечего."
 spn_hunt.0610.a.tt:0 "Сейчас это легче, чем будет когда-либо потом, потому что внутри почти не с чем спорить.\n\nТо, что должно было случиться через двадцать лет, не случится. [spn_hunt_cradle_child.GetSheHe|U] станет обычным ребёнком с мёртвой семьёй — а с таким мир знает, что делать."
 spn_hunt.0610.b:0 "Забрать [spn_hunt_cradle_child.GetHerHim] домой и следить за [spn_hunt_cradle_child.GetHerHim]."
 spn_hunt.0610.b.tt:0 "Ничего не удалено. Ничего не остановлено."
 spn_hunt.0610.b.tt2:0 "Через двадцать лет ты вырастишь одного из них, и оно будет при твоём дворе, и оно будет точно знать, кто его кормил."
 spn_hunt.0610.c:0 "Это не ребёнок."
 spn_hunt.0610.c.tt:0 "А всё же ребёнок — ещё двадцать лет, и всякий, кто об этом услышит, будет очень даже уверен в этом."
 spn_hunt.0610.d:0 "Закрыть за собой дверь."
 spn_hunt.0610.d.tt:0 "Кто-нибудь найдёт [spn_hunt_cradle_child.GetHerHim]. Кто-нибудь всегда находит. Это будут чьи-то другие двадцать лет."
 
 # ==========================================================
 # 2.35a -- the first boot pass. The kill screen, the conclusion's
 # log lines, and the three outcomes that had no description.
 # ==========================================================
 spn_hunt.0205.t:0 "Дело сделано"
 spn_hunt.0205.desc:0 "Всё закончилось быстрее, чем ты ожидал(а).\n\n[spn_defender.GetTitledFirstName] лежит на полу и не встаёт. В комнате очень тихо. Руки у тебя трясутся — так бывает всегда после и никогда во время."
 spn_hunt.0205.desc_vampire:0 "Ты вогнал(а) кол туда, куда тебя учили его вгонять.\n\n[spn_defender.GetTitledFirstName] падает не так, как падает человек. [spn_defender.GetSheHe|U] смотрит на тебя всё это время, а потом перестаёт смотреть на что-либо."
 spn_hunt.0205.desc_werewolf:0 "Форма уходит из него, пока ты ещё стоишь над ним.\n\nТо, что сейчас лежит на полу, — это [spn_defender.GetTitledFirstName], и оно куда меньше того, что на тебя бросилось. Это сделало серебро."
 spn_hunt.0205.desc_hybrid:0 "Оно кинулось на тебя двумя тварями сразу — а умирает ни одной из них.\n\n[spn_defender.GetTitledFirstName] лежит на полу, и форма то и дело начинает меняться и не может закончить. Ты ждёшь, пока оно перестанет пытаться."
 spn_hunt.0205.desc_demon:0 "Тело сдаётся намного раньше, чем то, что в нём сидит.\n\n[spn_defender.GetTitledFirstName] перестаёт двигаться. Что-то ещё мгновение остаётся в комнате — и ты стоишь не шевелясь, пока оно не уходит."
 spn_hunt.0205.a:0 "Закончить."
 spn_hunt.0205.a.tt:0 "По этому делу книги графства закрываются."
 spn_hunt.0205.b:0 "Взять [spn_defender.GetHerHim] живьём."
 spn_hunt.0205.b.tt:0 "Верёвка и камера вместо могилы. Тебе с этого меньше, зато решение может подождать до утра."
 spn_hunt_log_slain:0 "Тварь, что терзала графство, убита"
 spn_hunt_log_slain_title:0 "Добыча"
 spn_hunt_log_bounty:0 "Награда господина получена"
 spn_hunt_log_bounty_title:0 "Награда"
 spn_hunt_log_fled:0 "Оно залегло прежде, чем ты до него добрался(лась)"
 spn_hunt_log_fled_title:0 "Залегло"
 spn_hunt_log_cold:0 "След оборвался"
 spn_hunt_log_cold_title:0 "Остывший след"
 spn_hunt_log_witch:0 "Ведьмовство здесь прекращено"
 spn_hunt_log_witch_title:0 "Ведьма"
 spn_hunt.0300.desc_exorcised:0 "Оно ушло, и предъявить никому нечего.\n\nС господином из-за этого будут неприятности, а с тобой — нет. Ты знаешь, что здесь было, и знаешь, что сейчас его здесь нет."
 spn_hunt.0300.desc_withdrew:0 "Ты вернулся(лась) домой.\n\nСлед по-прежнему ведёт в графство — как и то, что его оставило. Ты примерно представляешь, что об этом скажут, и ещё лучше представляешь, что было бы, если бы ты остался(лась)."
 spn_hunt.0300.desc_bargained:0 "Ты больше не охотишься.\n\nТы чувствуешь себя лучше, чем за последние двадцать лет, и не можешь смотреть на бумагу, которую подписал(а). На ней стоит дата. Ты примерно знаешь, когда."

 # ==========================================================
 # 2.35a -- the conclusion screen's own text (the activity had
 # no conclusion_description at all), and the age gate.
 # ==========================================================
 spn_hunt_conclusion_slain:0 "Три недели расспросов, одна дверь — и то, что уводило людей из этого графства, лежит на телеге под холстом. Господин захочет взглянуть. Почти все хотят — один раз."
 spn_hunt_conclusion_exorcised:0 "Оно ушло, и положить на телегу нечего. С господином это будет неловко, а с тобой — не неловко вовсе: ты знаешь, что здесь было, и знаешь, что сейчас его здесь нет."
 spn_hunt_conclusion_proxy:0 "Ты убил(а) что-то. Но не то, за чем пришёл(шла), и теперь оно знает твоё лицо, а это положение хуже того, с каким ты сюда приехал(а)."
 spn_hunt_conclusion_fled:0 "Оно услышало, что ты идёшь, и залегло. След и то, что его оставило, остаются в графстве. Кто-нибудь вернётся."
 spn_hunt_conclusion_withdrew:0 "Ты повернул(а) назад. Те, кто рассказывает истории про это ремесло, редко рассказывают про тех, кто повернул назад, — и именно поэтому ремесло продолжает закапывать людей."
 spn_hunt_conclusion_bargained:0 "Ты больше не охотишься. Ты чувствуешь себя лучше, чем за последние двадцать лет, и не можешь смотреть на бумагу, которую подписал(а)."
 spn_hunt_conclusion_beaten:0 "Ты добрался(лась) до двери. То, что было за ней, положило тебя на пол и дало уйти — и ты ещё об этом подумаешь."
 spn_hunt_conclusion_witch:0 "Ты пришёл(шла) искоренить ведьмовство и привёз(везла) доказательство. То ли это был тот, кто нужно, — вопрос к тому, кто станет это записывать."
 spn_hunt_conclusion_cold:0 "Ничего. Три недели, порядочно твоих собственных денег и графство, которое очень сожалеет, что не смогло помочь. Так бывает чаще, чем кто-либо признаёт."

 spn_hunter_too_young_custom:0 "Должно быть не меньше #high 13#! лет"

 # 2.35a -- the two gates that were missing entirely. See 10_spn_confer_interactions.txt.
 spn_already_in_hunter_training_custom:0 "Уже проходит обучение"
 spn_refused_hunter_training_custom:0 "Отказался(лась) от этого за последние #high 5#! лет"