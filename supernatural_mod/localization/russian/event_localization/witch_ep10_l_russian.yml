 ring_of_power_name:0 "Заколдованное кольцо"
 ring_of_power_desc:0 "Это несомненно магическое кольцо излучает силу и, кажется, обладает гипнотическими свойствами. Лишь его создатель знает истинную природу и предназначение предмета."
 ev11.38.desc:0 "Вы придали кольцу нужную форму и подготовили его магическую структуру для заключения могущественных чар. Пришло время финального этапа работы..."
 ev11.38.0.a:0 "Кольцо станет орудием манипуляции."
 ev11.38.0.b:0 "Я вложу в него частицу своей сущности."
 ev11.38.0.c:0 "Обе идеи хороши."
 ev11.38.0.a_ct1:0 "Предмет получит скрытое свойство: создатель кольца сможет использовать взаимодействие «$command_minion_interaction$» против его владельца."
 ev11.38.0.a_ct2:0 "Некоторые могущественные существа, такие как демоны или легендарные маги, будут устойчивы к этому эффекту."
 mr_ring_of_power_power_modifier:0 "Связанная сила"
 mr_sacrificed_power_modifier:0 "Пожертвованная сила"
 ev11.39.title:0 "Кропотливый прогресс"
 ev11.39.0.a:0 "Похоже, меня ждёт ещё одна бессонная ночь."
 ev11.39.0.b:0 "Хмм, а ведь решение лежит на поверхности!"
 ev11.39.0.c:0 "Помидор!"
 odd_behaviour_eccentric_modifier:0 "Странное поведение"
 ev11.40.title:0 "Полная самоотдача"
 ev11.40.desc:0 "Ваши исследования продвигаются, но вы понимаете: для получения выдающихся результатов требуется привлечь ещё больше ресурсов и людей. Разумеется, чем больше людей осведомлено, тем сложнее держать работу в тайне..."
 ev11.40.0.a:0 "Я не собираюсь делать из этого тайну!"
 ev11.40.0.b:0 "Я привлеку нескольких сдержанных помощников."
 ev11.40.0.c:0 "Мне следует больше полагаться на своего ассистента."
 ev11.41.title:0 "Осложнения"
 mr_immortal_child_consumer_modifier:0 "Вечный голод"
