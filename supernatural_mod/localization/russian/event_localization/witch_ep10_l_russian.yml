 ev11.183.title:0 "Научный метод"
 ev11.183.desc:0 "Работая над текущим проектом, вам пришлось систематизировать свой подход и искать эффективные методы анализа результатов. Теперь ваши исследования будут двигаться без сбоев."
 ev11.183.0.a:0 "У меня получается всё лучше."
 ev11.183.0.b:0 "Возможно, я смогу использовать это и в будущем."
 mr_seasoned_scholar_modifier:0 "Опытный учёный"
 mr_sixth_sense_modifier:0 "Шестое чувство"
 ev11.184.desc:0 "Во время испытания заклинания что-то пошло не так. Чары повлияли на вас необычным образом: проявилась колоссальная проницательность и обострение чувств. Вы не можете повторить заклинание, но продлили его действие."
 ev11.184.0.a:0 "Странно... но весьма многообещающе."
 ev6.4.0.d:0 "Знаешь, как снять проклятие Ньярлатхотепа?"
 ev11.185.desc:0 "«Вижу, вы нажили серьёзных врагов. Чем вы досадили Ньярлатхотепу? Впрочем, лучше не знать. Давайте взглянем на проклятие... Я могу ослабить его, но для полного снятия требуется Высшее заклинание»."
 ev11.185.0.a:0 "Хм, спасибо."
 me_golem_option_with_dot:0 "$me_golem_option$."
 ev11.186.title:0 "Враждебные наёмники"
 ev11.186.desc:0 "Ваш лагерь окружён отрядом наёмников. Им нужен артефакт [artifact.GetName], находящийся у вас. Ситуация серьёзная — отказ чреват кровопролитием."
 ev11.186.0.a:0 "Хорошо. [artifact.GetName] ваш."
 ev11.186.0.a_ct:0 "#N Артефакт утерян.#!"
 ev11.186.0.b:0 "Я скажу, что у меня нет такого артефакта."
 ev11.186.0.b_ct:0 "Наёмники уходят ни с чем."
 ev11.186.1.b_ct:0 "Наёмники не поверили вашему блефу."
 ev11.186.0.c:0 "Мощный удар остудит их пыл."
 ev11.186.0.d_ct:0 "Наёмники отбити."
 ev11.187.desc:0 "Наёмники ни на секунду не поверили заверениям. Они готовятся к атаке."
 ev11.188.desc:0 "Ваше заклинание разорвало нескольких наёмников. Несмотря на минутное замешательство, дисциплина взяла верх, и они пошли на штурм."
 ev11.188.0.a:0 "Я могу продолжать это целыми днями!"
 ev11.189.desc:0 "Битва завершилась быстро. Выжившие наёмники спешно отступают и едва ли побеспокоят вас снова."
 ev11.189.0.a:0 "Интересно, кто их нанял."
 ev11.190.title:0 "Наёмники потерпели неудачу"
 ev11.190.desc:0 "Попытка захватить артефакт закончилась провалом. Наёмники понесли большие потери и отказываются возвращать плату."
 ev11.190.0.a:0 "Мощный удар убедит их вернуть золото."
 ev9.0.i:0 "Я найму наёмников, чтобы перехватить артефакт."
 ev9.0.i_ct0:0 "Это действие возможно, так как цель не является правителем и не находится под чьей-либо защитой."
 ev9.0.i_ct:0 "Наёмники перехватили артефакт"
