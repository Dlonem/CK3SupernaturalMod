 ask_tw_for_initiation_interaction_desc:0 "Сделайте первые шаги на пути к обретению истинной силы."
 ev9.0.h:0 "Я с радостью попрошу этот артефакт."
 ev9.0.h_ct1:0 "Ваша просьба будет выполнена во имя дружбы"
 ev9.0.h_ct2:0 "Ваши притязания на артефакт будут признаны"
 ev9.0.h_ct3:0 "Ваш эгоизм положит конец этим отношениям"
 ev11.1a.title:0 "Цена любви"
 ev11.1b.title:0 "Цена дружбы"
 ev11.1.desc:0 "[new_mage.GetTitledFirstName] обращается к вам, напоминая о вашей дружбе и обо всём, что вас связывает, чтобы попросить один из ваших артефактов. [new_mage.GetSheHe|U] подчёркивает своё право владеть им как хранитель и обещает использовать его силу для защиты ваших общих интересов."
 ev11.1.0.a:0 "Пусть будет так, [new_mage.GetSheHe] этого достоин[new_mage.GetEnding('а')]."
 ev11.1.0.b:0 "Я признаю [new_mage.GetHerHis] право на артефакт, но только после моей смерти.."
 ev11.1.0.c:0 "Настоящий друг не стал бы просить такого."
 ev11.2.title:0 "Признание"
 ev11.2.desc:0 "Ваш прогресс в освоении истинной силы неоспорим; вы уже можете назвать себя полностью развитым магом. Такие способности могут привлечь внимание сильнейших этого мира, возможно, даруя вам ещё большие преимущества, ведь правильная репутация несомненно усилит ваше положение в мире"
 ev11.2.0.a:0 "Пусть боятся правды о том, кем я стал."
 ev11.2.0.a_ct0:0 "На вашем следующем Саммите Магов будет скидка 50%."
 ev11.2.0.a_ct:0 "#P $ev11.2.0.a_ct0$#!"
 ev11.2.0.b:0 "Моё имя будет звучать даже спустя века."
 ev11.2.0.c:0 "Я не буду этим хвастаться."
 ev11.2.0.d:0 "Я предпочитаю хранить свои способности в секрете."
 ev11.2.0.d_ct:0 "#P Это действие уменьшит внимание охотников на ведьм.#!"
 ev2.1.a_fl:0 "Медитация и мистические практики должны приносить мне новые ответы."
 ev2.1.c_fl:0 "Если ведьмы и хороши в чем-то, так это наверняка в травах, отварах и эликсирах."
 ev2.1.g_fl:0 "Если ведьмы и хороши в чем-то, так это наверняка в травах, отварах и эликсирах"
 ev2.1.e_fl:0 "Ты не ты, когда голоден..."
 ev2.1.f_fl:0 "Это решение может подождать."
 ev2.1.x:0 "Мне интересна технология и развитие."
 ev2.1.x_fl:0 "Дураки и невежды называют это колдовством — я же называю это наукой."
 ev2.1.x_ct:0 "В будущем вы можете получить дополнительные преимущества."
 wc_innovator_modifier:0 "Новатор"
 wc_innovator_full:0 "Новатор"
 ev11.3.title:0 "$wc_innovator_full$ — Образ мыслей"
 ev11.3.desc:0 "У вас есть несколько идей, которые стоит развивать, но они требуют доработки, усилий и времени. Даже если сейчас они лишь теоретические, вы можете найти в них новый взгляд и вдохновение на будущее. Но больше всего вам нужна лучшая организация работы и продуманный подход."
 ev11.3.0.a:0 "Я поищу полезную информацию в томах."
 ev11.3.0.b:0 "Я придумаю свои методы."
 ev11.5.title:0 "$wc_innovator_full$ - Конструкции"
 ev11.5.desc:0 "В последнее время тебя особенно заинтересовала архитектура, и ты решил поближе познакомиться с методами строительства зданий. Больше всего тебя поразил факт, что хорошо продуманный конструктивный проект может сэкономить значительное количество материалов — а значит, и деньги, и время."
 ev11.5.0.a:0 "Это что-то, что мы можем использовать на практике."
 ev11.5.0.b:0 "Может, я как-нибудь смогу монетизировать эту идею."
 ev11.5.0.c:0 "Одно не исключает другое."
 wc_innovator_constructor_modifier:0 "Архитектурные инновации"
 ev11.6.title:0 "$wc_innovator_full$ - Логистика"
 ev11.6.desc:0 "Люди и товары постоянно перемещаются. Даже обычный крестьянин регулярно ездит между своим двором и полями, а дворяне, торговцы и солдаты иногда преодолевают действительно огромные расстояния. Ты много времени провел, размышляя об этих явлениях, и в голову пришло несколько новых идей, связанных с ними."
 ev11.6.0.a:0 "Путешествия могли бы быть быстрее."
 wc_innovator_fast_travel_modifier:0 "Быстрое путешествие"
 ev11.6.0.b:0 "Путешествия могли бы быть безопаснее."
 wc_innovator_safe_travel_modifier:0 "Безопасное путешествие"
 ev11.6.0.c:0 "Эта тема стоит более глубокого анализа."
 ev11.7.title:0 "$wc_innovator_full$ - Сельское хозяйство"
 ev11.7.desc:0 "Недавно ты встретил группу путешественников, которые рассказали о методах ведения сельского хозяйства в их родном крае. Тебе пришла в голову мысль, что эти же методы могут пригодиться и на степях."
 ev11.7.0.a:0 "Я предпочитаю сосредотачиваться на серьёзной работе."
 ev11.8.title:0 "$wc_innovator_full$ - Война"
 ev11.8.desc:0 "Люди всегда вступали в конфликты с применением насилия. Слабые подчиняются сильным, а сильные — хитрым, так устроен мир. Мораль этой истории проста: нужно быть хитрым, или хотя бы сильным. Уже некоторое время ты анализируешь, как местные правители ведут свои военные кампании, и пришёл к выводу, что число и качество войск — не единственные факторы, определяющие победу в войне. Помимо стратегии и тактики, очень важны сам способ командования и управления армией, а также умение быстро и точно принимать решения — всё это незаменимые компоненты победы."
 ev11.8.0.a:0 "Правильная организация — ключ к победе."
 ev11.8.0.b:0 "И всё же стратегию и тактику недооценивать нельзя."
 ev11.8.0.c:0 "Я учту все факторы."
 ev11.9.desc:0 "Ваши усилия по улучшению вашего окружения до сих пор принесли определенные результаты. Многие ваши идеи требовали нестандартного мышления, а некоторые были вдохновлены практиками, которые некоторые могут считать запретными или сомнительными, но в конце концов важен конечный результат. Это служит доказательством эффективности научного подхода в любой сфере жизни, даже если некоторые считают такие методы неподходящими или эксцентричными.."
 ev11.9.0.a:0 "Мне нужно сделать ещё больше работы."
 ev11.9.0.a_ct:0 "Ваши усилия продолжатся."
 wc_personal_innovator_notes_modifier:0 "Личные заметки"
 ev11.10.title:0 "$wc_innovator_full$ - Оружейник"
 ev11.10.desc:0 "В последнее время тебя заинтересовала тема создания брони. Ты считаешь, что способен модифицировать соединения своей брони так, чтобы она стала более надёжной и долговечной."
 ev11.10.0.a:0 "Стоит попробовать."
 wc_innovator_armor_modifier:0 "Улучшение доспехов"
 ev11.11.title:0 "$wc_innovator_full$ - Управление"
 ev11.11.desc:0 "В последнее время ваше внимание привлекли ремесленники и мастерские. Вам ясно, что наряду с сельским хозяйством именно ремесленное производство и экономическое развитие определяют силу королевства. Да, кто-то может сказать, что сила заключается в армии, но вы знаете лучше других, что для эффективной армии нужны эффективные средства, а они приходят из сильной экономики. Именно на этом и должны быть сосредоточены все усилия."
 ev11.11.0.a:0 "У меня есть несколько идей для немедленной реализации."
 ev11.11.0.b:0 "Я предпочитаю сосредотачиваться на других вещах."
 ev11.12.title:0 "$wc_innovator_full$ - Черный порох"
 ev11.12.desc:0 "Природа полна тайн, и одна из них — смесь угля, серы и селитры, которая при поджигании может вызвать вспышку и взрыв. В одних кругах эти вещества считают безбожным орудием дьявола, а другие сомневаются в самом существовании такой смеси. Тем не менее, есть и те, кто видит её потенциал, и ты среди них. Однако, чтобы узнать точный рецепт, потребуется время и сбор нужных ингредиентов."
 ev11.12.0.a:0 "Возможно, у местных торговцев будут необходимые ингредиенты."
 ev11.12.0.b:0 "Я могу произвести эти ингредиенты."
 ev11.12.0.c:0 "Я бы лучше потратил свои ресурсы на что-то, что меня не взорвёт."
 ev11.12.0.c_ct:0 "Вы отказываетесь от этой идеи."
 ev11.13.desc:0 "Твои эксперименты с чёрным порохом превзошли все ожидания. Вспышки света ослепляют, а грохот оглушающий. Энергия взрыва может также разрушать близлежащие объекты и разбрасывать их осколки на большие расстояния. Приходит много идей для использования таких материалов: от безобидных фейерверков, через горные работы, до военных целей. Один только звук взрыва может напугать лошадей и посеять сумятицу в рядах врага, а, конечно, можно и сбрасывать такие заряды с стен прямо на осаждающую армию... или, наоборот, взрывать такие стены на воздух."
 ev11.13.0.a:0 "Я попробую, как только у меня будет возможность."
 wc_innovator_pyrotechnician_modifier:0 "Пиротехник"
 wc_innovator_pyrotechnician_modifier_desc:0 "Способность создавать шум, дым или даже взрывы может иметь много применений на поле боя — как в наступательных, так и в оборонительных целях."
 ev2.41.f:0 "Я приготовлю заряд черного пороха."
 wc_innovator_bomb_modifier:0 "Заряд чёрного пороха"
 ultimate_spell_loaded_modifier:0 "Заряженное заклинание"
 witchcraft_legacy_3b_ct:0 "Открывает заклинание #italic $aura_reading$#! для магов"
 building_mage_tower_020:0 "Крепость мага"
 building_mage_tower_020_desc:0 "Это место окутано таинственной аурой, вызывая одновременно беспокойство и уважение к тому, кто здесь обитает."
 building_type_mage_tower_020:0 "$building_mage_tower_020$"
 building_type_mage_tower_020_desc:0 "$building_mage_tower_020_desc$"
 building_mage_tower_021:0 "Чёрный замок"
 building_mage_tower_021_desc:0 "Этот мрачный бастион возвышается из проклятого камня и забытых ритуалов. Он предназначен для самых коррумпированных и жаждущих власти колдунов, его шпили пульсируют запретной энергией, а залы отзываются шепотом предательства и магических мучений."
 building_type_mage_tower_021:0 "$building_mage_tower_021$"
 building_type_mage_tower_021_desc:0 "$building_mage_tower_021_desc$"
 mage_seat:0 "Резиденция мага"
 MAGE_FORTRESS_REQUIREMENTS_TXT:0 "Ты должен быть независимым правителем, участником [high_mage_council|E], или обладать культурной традицией магического правления."
 MAGE_FORTRESS_REQUIREMENTS_TXT2:0 "Ты, должно быть, коррумпирован, демон, некромант или лич."
 MUST_BE_MAGE_TRUE_WITCH:0 "Ты должен быть магом или настоящей ведьмой."
