 ev11.42.title:0 "Рискованный эксперимент"
 ev11.42.desc:0 "Вам удалось разработать план серии экспериментов, результаты которых принесут массу ценнейшей информации. Это может стать ключом к успеху всего проекта. Проблема в том, что малейшая ошибка в расчётах приведёт не к прозрению, а к смертельному исходу..."
 ev11.42.0.a:0 "Приступим."
 ev11.42.0.b:0 "Лучше отказаться от этой идеи."
 ev11.42.0.c:0 "Я проработаю более безопасный вариант."
 ev11.42.0.d:0 "Я внесу несколько улучшений в процесс."
 curse_expert_txt:0 "Улучшенные проклятия."
 mr_curse_expert_modifier:0 "Мастерство проклятий"
 mr_curse_expert_spec1_terrain_cancel_negative_supply:0 "Смертельное проклятие всегда приводит к смерти"
 mr_curse_expert_spec2_terrain_cancel_negative_supply:0 "Ментальное проклятие всегда вызывает состояние «[GetTrait('incapable').GetName( GetNullCharacter )|L]»"
 magical_plants_modifier:0 "Магические растения"
 magical_plants2_modifier:0 "$magical_plants_modifier$"
 ev11.43.desc:0 "Исследования завели вас в неожиданную область. Магический механизм, который вы намерены использовать, требует практических испытаний, и лучший способ — наполнить магией органику. Растения кажутся наиболее очевидными подопытными..."
 ev11.43.0.a:0 "Зачарование растений звучит интригующе."
 ev11.43.0.a_ct1:0 "Результаты этого действия непредсказуемы."
 ev11.43.0.b:0 "Я предпочитаю традиционные методы исследований."
 ev11.44.desc:0 "Исследование магических растений оказалось тупиком для вашего текущего проекта, однако работа с ними позволила раскрыть пару важных принципов соединения сырой магии с органикой. Эти знания ещё могут пригодиться."
 ev11.44.0.a:0 "Что ж, попытаться стоило."
 ev11.45.desc:0 "Ваш ботанический эксперимент достиг цели: вы испытали и отточили магический процесс для основного исследования. Но это не всё — зачарование растений открывает массу полезных возможностей. К тому же оставлять такие растения без присмотра просто опасно..."
 ev11.45.0.a:0 "Эти растения требуют дальнейшего изучения и ухода."
 ev11.45.0.b:0 "Пора вернуться к основному исследованию."
 ev11.45.0.c:0 "Кажется, я знаю, как использовать эти растения."
 ev11.46.desc:0 "Текущий этап исследования требует анализа столкновения различных типов энергии. Подобный эффект возникает при столкновении двух магических сил — типичное явление для дуэлей магов или существ. Простейший путь — призвать демона и сойтись с ним в бою, пока ваши диагностические заклинания собирают данные. Разумеется, бой с демоном всегда сопряжён с риском."
 ev11.46.0.a:0 "Значит, я сражусь с демоном."
 ev11.46.0.a_ct:0 "Вы призовёте демона."
 ev11.46.0.b:0 "Я поищу более безопасный метод."
 ev11.47.title:0 "Магическая практика"
 ev11.47.desc:0 "Исследование продолжается, но вы уже понимаете: то, над чем вы работаете — лишь вершина айсберга магических тайн. Узкая ветвь одной лишь дисциплины, когда существуют тысячи других ветвей... а может, и целые леса. Вселенная полна секретов, и у вас есть ключ к их разгадке. К сожалению, объять всё сразу нельзя: в сутках мага столько же часов, сколько у простого смертного (хотя, возможно, однажды вы решите и эту проблему)."
 ev11.47.0.a:0 "Я подготовлюсь к расширению исследований."
 ev11.47.0.b:0 "Меня интересуют лишь некоторые применения."
 ev11.47.0.c:0 "Я начну с алхимии."
 ev11.47.0.d:0 "Нет! Я должен сосредоточиться на текущем проекте."
 ev11.48.title:0 "Сотворение заклинаний"
 ev11.48.desc:0 "Ваши исследования требуют не только умственных и физических усилий, но и колоссального количества магической энергии. Эту проблему необходимо решить."
 ev11.48.0.a:0 "Я задействую столько силы, сколько потребуется."
 ev11.48.0.b:0 "Я буду экономен."
 ev11.48.0.c:0 "Я ограничусь умственным трудом."
 ev11.49.title:0 "Эксперименты на людях"
 ev11.49.desc:0 "Дальнейшие исследования требуют... большей отдачи. Вы должны выяснить, как конкретные магические аспекты влияют на человеческое тело. Для этого нужны подходящие испытуемые, и, к счастью, в ваших темницах уже есть узники."
 ev11.49.0.a:0 "Начнём с [p1.GetTitledFirstNamePossessive]."
 ev11.49.0.b:0 "Посмотрим, как [p2.GetTitledFirstName] выглядит изнутри."
 ev11.49.0.c:0 "Нет, я не могу так поступить."
 ev11.50.desc:0 "Этим утром Лилит огорошила вас вопросом: «Но ты ведь правда меня любишь? Если любишь, сделаешь ради меня всё, верно? Я хочу, чтобы ты это доказал. Отдай мне свою душу. Прямо сейчас»."
 ev11.50.0.a:0 "Но... что?"
 ev11.51.desc:0 "«Да я шучу! Видел бы ты своё лицо... Ты же знаешь, твоё тело интересует меня куда больше твоей души» — задорно подмигнула Лилит."
 ev11.51.0.a:0 "Моё тело принадлежит тебе."
 ev11.52.title:0 "Драгоценная книга"
 ev11.52.desc:0 "Вы слышали об одной запретной книге, содержащей сведения по изучаемой вами теме. Обладание ею облегчило бы дальнейшие исследования. К сожалению, текущий владелец прекрасно знает ей цену, и запрошенная им сумма выглядит чересчур высокой."
 ev11.52.0.a:0 "Цена не имеет значения."
 ev11.52.0.b:0 "Я попытаюсь украсть книгу."
 ev11.52.0.c:0 "Я найду способ убедить его."
 ev11.52.0.d:0 "Я пообещаю ему услугу."
 ev11.53.title:0 "Не для простых смертных"
 ev11.53.desc:0 "Вам удалось создать прекрасный рунический оттиск для контроля потоков силы в арканных цилиндрах, а также впечатляющий ускоритель магической инверсии с временными связями для стабилизации. Но проклятая штуковина отказывается работать! Либо сама идея порочна, либо параметры плохо откалиброваны, либо дело в неудачном расположении планет... трудно сказать."
 ev11.53.0.a:0 "Ускоритель требует оптимизации."
 ev11.53.0.b:0 "Я пересчитаю параметры."
 ev11.53.0.c:0 "Я поищу обходной путь."
 ev11.53.0.d:0 "Я могу стабилизировать процесс вручную."
 ev11.53.0.e:0 "Добавление эфира может решить проблему."
 ev11.54.title:0 "Избыточные прорывы"
 ev11.54.desc:0 "Ваше исследование не только увенчалось полным успехом, но и позволило сделать немало дополнительных выводов, которые пригодятся в будущем."
 ev11.54.0.a:0 "Да, я обязательно этим воспользуюсь."
 ev11.54.0.b:0 "Стоит зафиксировать это в хрониках."
 ev11.54.0.b_ct:0 "Открывает [decision|E] «[GetDecisionWithKey('magic_epic_book_decision').GetName]»"
 ev11.54.0.c:0 "Я разнесу весть о своём достижении."
 magic_epic_book_decision:0 "Написать магический труд"
 magic_epic_book_desc:0 "Вы можете перенести свои познания в магии на страницы книги — для собственного удобства или на пользу будущим поколениям."
 magic_epic_book_decision_desc:0 "$magic_epic_book_desc$"
 magic_epic_book_decision_confirm:0 "$magic_epic_book_decision$"
 magic_epic_book_decision_tooltip:0 "$magic_epic_book_decision_desc$"
 ev11.55.title:0 "Таинственная эманация"
 ev11.55.desc:0 "Результат одного неприметного эксперимента застал вас врасплох. Совершенно случайно вам удалось создать необычную энергетическую структуру, излучающую чистую силу. Воссоздать процесс будет непросто, но сам факт его возможности воодушевляет."
 ev11.55.0.a:0 "Я поглощу эту силу."
 ev11.55.0.b:0 "Я использую её для дальнейших экспериментов."
 ev11.56.title:0 "Похитить принцессу"
 ev11.56.desc:0 "Каждый человек уникален в своём магическом и биологическом сигнатуре. Некоторые люди особенно исключительны, и их аура скрывает множество тайн природы и магии. [princess.GetTitledFirstName] — как раз одна из таких личностей. Вы пришли к выводу, что пары капель её крови хватит, чтобы раскрыть глубокий магический принцип для исследований. Проблема в том, что никто не отдаст свою кровь добровольно для дела, разящего колдовским ритуалом."
 ev11.56.0.a:0 "Мне нужно заманить её в лабораторию."
 ev11.56.0.b:0 "Я заплачу профессионалам за её похищение."
 ev11.56.0.c:0 "Мой воитель доставит её ко мне."
 ev11.56.0.d:0 "Нет, я не стану похищать людей!"
 ev11.57.desc:0 "В результате ваших действий [princess.GetTitledFirstName] стала вашей... гостьей. Разумеется, она не в восторге, но благодаря капле её крови ваши исследования продвинулись. Остаётся вопрос: что делать с принцессой?"
 ev11.57.0.a:0 "Я отпущу её — она больше не нужна."
 ev11.57.0.b:0 "Убейте её — она больше не нужна."
 ev11.57.0.c:0 "Пусть пока посидит в башне."
 ev11.57.0.d:0 "Я решу позже."
 ev11.57.0.e:0 "Думаю, мы сладим."
 witch_hunters_vacations_ct:0 "Охотники на ведьм временно снизят активность."
 ev10.88.e:0 "У Совета должна быть своя армия."
 ev10.89.desc5:0 "«Высокому Совету нужна армия, чтобы защищать свои интересы и оказывать давление. Я думаю о небольших, но высокообученных элитных отрядах. Естественно, эта армия должна подчиняться лично мне»."
 hc_army_name:0 "Армия Высокого Совета."
 amage_rep1_bmage_rep9_ct:0 "Армией будет командовать $mc_black_mage_modifier$."
 amage_rep2_bmage_rep9_ct:0 "Армией будет командовать $mc_archmage_modifier$."
 amage_rep3_bmage_rep9_ct:0 "Армией будет командовать $mc_admin_modifier$."
 ev10.89.j:0 "Армия будет под моим командованием."
 ev10.89.k:0 "Хорошо, но нашим генералом станет [admin.GetTitledFirstNameNoTooltip]."
 ev10.89.l:0 "Вооружённые конфликты не входят в компетенцию Высокого Совета."
 pot11_pure_name:0 "Эфир"
 pot11_name:0 "Жидкий эфир"
 pot11_desc:0 "Жидкий эфир — драгоценный алхимический реагент, используемый в сложных алхимических процессах, а также компонент некоторых заклинаний и ритуалов. Это чрезвычайно экзотическое вещество, получение которого считается почти невозможным."
 gain_pot11_ct:0 "Вы получаете жидкий эфир"
 valuable_magic_component_terrain_cancel_negative_supply:0 "Ценный [useful_magic_component|E]"
 ev11.58.desc:0 "Вы находитесь в процессе разработки заклинания, которое должно продвинуть ваши исследования. К сожалению, для него требуются экзотические ингредиенты, включая эфир. Можно попробовать использовать более дешёвый заменитель, но заклинание сработает не лучшим образом."
 ev11.58.0.a:0 "Я использую свой запас эфира."
 ev11.58.0.b:0 "В качестве замены я могу использовать мутагены."
 ev11.58.0.c:0 "Я поищу замену поблизости."
 ev11.58.0.d:0 "Я попробую купить замену."
 ev11.58.0.e:0 "Мне не нужно это заклинание."
 ultimate_spell_aether_modifier:0 "Экзотические компоненты"
 ev11.59.desc:0 "Ритуал Высшего заклинания продвигается успешно, но процесс недостаточно стабилен. Сейчас самое время задействовать эфир."
 ev11.59.0.a:0 "Нет, эфир слишком ценен."
 ev2.5.h:0 "У [enemy.GetHerHisPossessive] есть эфир. Хм..."
 ev5.53.0.d:0 "Вообще-то, мне не помешал бы эфир."
 monkey_demon_name:0 "Эшу"
 maledictio_demon_name:0 "Маледиктио"
 the_paw_nickname_name:0 "Лапа"
 just_a_paw_name:0 "Лапа"
 ev11.60.title:0 "[monkey_demon_target.GetTitledFirstNameNoTooltip]?"
 ev11.60.desc:0 "Вспыхнул свет, и в круге призыва появился... [monkey_demon_target.GetTitledFirstName]! На [monkey_demon_target.GetHerHis] лице виден страх и отчаяние.\n«Быстрее, освободи меня, пока ад не затянул обратно!»"
 ev11.60.0.a:0 "Я освобождаю тебя!"
 ev11.60.0.b:0 "Подожди минуту..."
 ev11.61.desc:0 "Вы быстро сняли защитные чары, и круг призыва тут же растрескался. [monkey_demon_target.GetTitledFirstName] обратился в дым и вмиг вылетел в окно. Вы поняли, что это не мог быть [monkey_demon_target.GetTitledFirstName]. Кем бы оно ни было — оно вырвалось на свободу."
 ev11.62.desc:0 "Немного подумав, вы решили, что ситуация бессмысленна. Это заклинание должно было призвать обитателя ада, а не [monkey_demon_target.GetTitledFirstNamePossessive]. К тому же защитный круг не сковал бы рождённого на Земле. Вывод один..."
 ev11.62.0.a:0 "Это какой-то трюк."
 ev11.63.desc:0 "«Преклоняюсь перед вашей проницательностью», — произнесла сущность, принимая иной облик. «О, так-то лучше. На чём я остановился... ах да, я Даритель, Владыка Откровений, Указывающий Путь... хотя некоторые злобные души упорно зовут меня Лапой»."
 ev11.63.0.a:0 "Я — [ROOT.Char.GetTitledFirstNameNoTooltip]."
 ev11.63.0.b:0 "Я призвал тебя не для светских бесед."
 ev11.63.0.c:0 "Ты пытался меня обмануть!"
 ev11.64.desc:0 "«Итак, чему я обязан удовольствием оказаться в этом круге призыва?»"
 ev11.64.desc2:0 "«Это лишь безвинная шалость. Уверен, мы всё ещё можем остаться друзьями», — в голосе демона слышится явная насмешка."
 ev11.64.0.a:0 "Я призвал тебя, и теперь ты должен повиноваться мне."
 ev11.65.desc:0 "«Разумеется, я исполню всё, что изволите. Демоны ведь славятся своими благими намерениями, верно?»\nДемон оскалился — вам показалось, что зубов у него куда больше, чем у обычного человека.\n«Вы жаждете власти и богатства, без сомнения? Как насчёт способности превращать в золото всё, к чему прикоснётесь? Самый богатый человек в мире, Золотой Маг... звучит заманчиво»."
 ev11.65.0.a:0 "У царя Мидаса всё закончилось не слишком хорошо."
 ev11.66.desc:0 "«Если подумать, он и впрямь пытался подать жалобу после... Ладно, а как насчёт бессмертия? Интересует?»"
 ev11.66.0.a:0 "Чую здесь подвох."
 ev11.67.desc:0 "«Ну, если бы я обратил вас в камень, смерть никогда бы вас не нашла. Не уверен, 'живут' ли камни, но вид у них вполне довольный. И уж точно не жалуются, в отличие от того Мидаса, да?»\nДемон вздохнул. «Вижу, мне попался требовательный клиент. Ладно, придумал! Я дам вам меч, с которым вы никогда не проиграете ни одной дуэли»."
 ev11.67.0.a:0 "Потому что я умру до начала дуэли?"
 ev11.68.title:0 "Дар Лапы"
 ev11.68.desc:0 "«Вижу, вы начинаете схватывать. Хотя я вообще-то думал о мече, сводящем всё к ничьей... но ваша идея ещё лучше».\nУ вас возникает неприятное чувство, что этот демон может истолковать ваши приказы слишком вольно."
 ev11.68.0.a:0 "Просто дай мне золото."
 ev11.68.0.a_ct:0 "Могут возникнуть дополнительные последствия..."
 ev11.68.0.b:0 "Я хочу знаний."
 ev11.68.0.c:0 "Я хочу, чтобы меня обожали."
 ev11.68.0.d:0 "Я ничего не хочу, убирайся обратно в ад."
 blessng_from_monkey_demon_modifier:0 "Любимый и обожаемый"
 ev11.69.desc:0 "Демон исчез, а на его месте появился сундук, набитый золотыми монетами. Однако вас не покидает чувство, что это золото принесёт больше вреда, чем пользы."
 ev11.69.0.a:0 "Я всё равно им воспользуюсь."
 ev11.69.0.d:0 "Лучше избавиться от него."
 ev11.69.0.b:0 "Я отдам золото [riv0.GetTitledFirstNamePossessive]."
 ev11.69.0.c:0 "Я сниму проклятие."
 ev11.70.desc:0 "Демон исчез, и вы чувствуете, как в разуме вспыхивают новые знания. Ужасающие. Жуткие. Знания о вещах, о которых вы предпочли бы никогда не знать. Они могут пригодиться, но вы глубоко потрясены."
 ev11.70.0.a:0 "Я ступаю по миру, построенному на парадоксе."
 distracted_by_monkey_demon_modifier:0 "Смятение"
 distracted_by_monkey_demon_modifier_desc:0 "Вы узнали ужасающие тайны вселенной, не дающие покоя. Мрачные вспышки и эхо тёмных знаний возвращаются в самые не подходящие моменты — особенно когда вы пытаетесь сосредоточиться."
 ev11.71.desc:0 "Демон вернулся в ад, но вы чувствуете изменения. В последующие дни становится ясно: люди действительно смотрят на вас с большим восхищением и теплом. На самом деле некоторые начинают любить вас даже чересчур сильно."
 ev11.71.0.a:0 "Это ведь, наверное, неплохо... правда?"
 ev11.74.desc:0 "До вас доходят ужасные вести: похоже, [person_win.GetTitledFirstName] и [person_lose.GetTitledFirstName] сошлись в смертельной дуэли! Хуже того, причиной стали вы. Судя по всему, каждый из них считал, что заслуживает вашего расположения больше другого. [person_lose.GetTitledFirstName] не выжил[person_lose.GetEnding('а')] в этой схватке."
 ev11.74.0.a:0 "Это абсурд."
 ev11.74.0.b:0 "[person_win.GetTitledFirstName] ответит за последствия."
 ev11.75.desc:0 "«О, мой любимый маг. Неужели ты соскучился? Или есть желание, которое я исполню с превеликим удовольствием?»"
 ev11.75.0.a:0 "На этот раз без уловок, демон."
 ev11.76.desc:0 "«Разумеется! Я всегда даю лишь то, о чём просят», — демон игриво посмотрел на вас."
 ev11.76.0.a:0 "Я могу причинить тебе боль..."
 ev11.76.0.b:0 "Я серьёзно."
 ev11.77.desc:0 "«Ладно! Будь по-твоему. Так что тебе нужно?»\nОт греха подальше вы решили формулировать все приказы с предельной точностью."
 ev11.77.0.a:0 "Я хочу армию... преданную армию."
 ev11.77.0.b:0 "Пусть остановит охотников на ведьм."
 ev11.77.0.c:0 "Мне нужно несколько услуг."
 ev11.77.0.d:0 "Может, он заготовит немного эфира?"
 ev11.79.desc:0 "«Да, полагаю, я мог бы достать немного эфира... но сначала тебе придётся освободить меня. Увы, это единственный путь».\nДемон выглядит совершенно восхищённым этой перспективой."
 ev11.79.0.a_ct:0 "Демон будет освобождён и останется в материальном мире."
 earthquake_spell:0 "Землетрясение"
 earthquake_spell_desc:0 "Это заклинание хаотично усиливает тектоническое давление, вызывая неконтролируемые и катастрофические толчки."
 earthquake_spell_ct:0 "В скором времени [reci.GetLocationDesc|l] сотрясёт землетрясение."
 get_earthquake_spell_ct:0 "Вы получаете доступ к взаимодействию «#italic $earthquake_spell$#!»"
 stop_the_cataclysm_spell:0 "Остановить катаклизм"
 stop_the_cataclysm_spell_desc:0 "Это заклинание усмиряет силы природы и останавливает стихийные бедствия, такие как землетрясения или наводнения."
 NO_CATACLYSM_TXT:0 "Этому персонажу не угрожает стихийное бедствие."
 stop_the_cataclysm_spell_ct:0 "[situation.GetName] будет остановлено."
 stop_the_cataclysm_spell_info:0 "Катаклизм предотвращён!"
 mr_master_nature_modifier:0 "Власть над природой"
 master_nature_spec1_terrain_cancel_negative_supply:0 "Открывает заклинание «#italic $earthquake_spell$#!»"
 master_nature_spec2_terrain_cancel_negative_supply:0 "Открывает заклинание «#italic $stop_the_cataclysm_spell$#!»"
 mr_nature_txt:0 "Укрощение природы."
 mr_master_destruction_modifier:0 "Мастер разрушения"
 master_destruction_spec1_terrain_cancel_negative_supply:0 "Открывает заклинание «#italic $tornado_spell$#!»"
 master_destruction_spec1_terrain_advantage:0 "Перезарядка заклинания «#italic $tornado_spell$#!»"
 tornado_spell_info:0 "Военное применение."
 ev11.91.title:0 "Тупик"
 ev11.91.desc:0 "Исследование казалось многообещающим, но зашло в тупик. Возможно, поставленная цель была слишком амбициозной. В данный момент вы не видите пути дальше."
 ev11.91.0.a:0 "Что ж, завтра я начну снова."
 ev11.102.title:0 "Невыносимая боль"
 ev11.102.desc:0 "Вы начали трансформацию своего тела, но процесс оказался мучительно болен. Вы не уверены, сколько ещё сможете терпеть. Возможно, лучше сделать перерыв или найти иной путь."
 ev11.102.0.a:0 "Я справлюсь!"
 ev11.102.0.b:0 "Я больше не могу..."
 ev11.105.title:0 "Магическая переработка"
 ev11.105.desc:0 "У вас осталось немало компонентов и побочных продуктов от прошлого эксперимента. Сначала вы хотели выкинуть их, но пришло пару идей получше."
 ev11.105.0.a:0 "Это пригодится для варки эликсиров."
 ev11.105.0.b:0 "Я задействую это при призыве демонов."
 ev11.105.0.c:0 "Может, продать это?"
 funds_for_research_options:0 "Бюджет исследований"
 funds_for_research_options_desc:0 "$funds_for_searching_options_desc$"
 teleportation_spell:0 "Телепортация"
 teleportation_spell_desc:0 "Это заклинание искажает пространство, мгновенно перемещая объект на огромные расстояния."
 magic_teleportation_effect_txt:0 "Вы телепортируетесь в [tprov.GetName]."
 CURRENT_TRAVEL_PLAN_EXISTS:0 "В данный момент вы никуда не путешествуете."
 universal_self_interaction:0 "на себя [interaction|E]"
 gain_magic_teleportation_spell_txt:0 "Открывает заклинание «#italic $teleportation_spell$#!» ($universal_self_interaction$)"
 gain_magic_teleportation_spell_txt_dot:0 "$gain_magic_teleportation_spell_txt$."
 ev11.120.desc:0 "В ходе одного из экспериментов вы вызвали необычайный феномен: вы согнули пространство настолько сильно, что при его выпрямлении объект в центре оказался на самом краю. Иными словами, вы совершили телепортацию. Доработав этот процесс, вы получите заклинание, незаменимое в путешествиях."
 ev11.120.0.a:0 "Да, мне обязательно нужно изучить это."
 ev11.120.0.b:0 "Нет, мой основной проект требует всего внимания."
 mage_countering_spec1_terrain_cancel_negative_supply:0 "Может отражать заклинания, расходуя насыщение силой"
 ev7.129.h:0 "Это заклинание позволит мне жить тысячелетиями!"
 ev5.28.0.z0:0 "Я заберу твои земли и твою жизнь."
 mc_black_mage_special2_terrain_cancel_negative_supply:0 "Исследование боевой магии требует на 1 меньше [mr_breakthrough|E]"
 laamp_magic_1015_contract:0 "Хищные растения"
 laamp_magic_1015_request:0 "Этот [task_contract|E] требует отправиться в владения [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и решить проблему магией или особыми навыками."
 laamp_magic_1015_desc_title:0 "$laamp_magic_1015_contract$"
 laamp_magic_1015_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] обеспокоен[TaskContract.GetEmployer.GetEnding('а')] опасной флорой — и, судя по слухам, это не обычные растения. Возможно, причина этих беспорядков имеет сверхъестественную природу."
 ev11.121.desc:0 "[employer.GetTitledFirstName] вкратце объясняет вам, что проблема с местной растительностью серьезна: несколько человек исчезли бесследно, а двое погибли на глазах свидетелей, схваченные странными растениями. Попытки бороться огнём и экзорцизмом ни к чему не привели. [employer.GetTitledFirstName] опасается, что без решения проблемы вспыхнет бунт или крестьяне пойдут в лес сами, найдя там лишь гибель."
 ev11.121.a:0 "Давайте взглянем на эти растения поближе."
 ev11.122.desc:0 "Вы не ожидали подобного зрелища. Местная растительность необычна и кажется экзотической. Короткая осторожная прогулка превращается в испытание: каждые пару шагов вы спотыкаетесь о корни или путаетесь в диких лианах. Вас не покидает чувство, что на краю зрения что-то движется, но при взгляде туда джунгли замирают."
 ev11.122.a:0 "Возможно, Чтение ауры позволит мне лучше понять это место."
 ev11.122.b:0 "Я изучу эти джунгли с помощью своего магического чутья."
 ev11.122.c:0 "Что ж, пора приниматься за работу."
 ev11.123.desc:0 "Вам удалось точно установить, что это место несёт следы магии, а растительность — результат магической мутации. Трудно сказать, вызвана ли она заклинанием или остатками эксперимента. Эти растения крайне опасны."
 ev11.124.desc:0 "Изучив карты, предоставленные [employer.GetTitledFirstNamePossessive], вы заметили, что джунгли с высоты образуют идеальный круг. Возможно, причина кроется в самом их центре. Вы отправляетесь на разведку, но чем дальше продвигаетесь, тем агрессивнее становится флора. Некоторое растения наносят удары ветвями, другие выделяют ядовитые испарения. Экспедиция смертельно опасна."
 ev11.124.a:0 "Вперёд, без остановок!"
 ev11.124.a_ct:0 "#N Кто-то будет ранен или погибнет.#!"
 ev11.124.b:0 "Я выжгу нам путь огненной магией."
 ev11.124.b_ct:0 "#P Ваша группа безопасно доберется до цели.#!"
 ev11.124.c:0 "Я знаю ритуал, который может усмирить джунгли."
 ev11.124.d:0 "Я найду самый безопасный маршрут."
 ev11.124.e:0 "Этот контракт не стоит такого риска."
 ev11.125.title:0 "Секретная лаборатория"
 ev11.125.desc:0 "Вам удалось добраться до цели — заросшей хижины со следами магических практик. Алхимические реторты и тайные инструменты рассеяны повсюду в достаточно хорошем состоянии, чтобы собраться себе переносную лабораторию."
 ev11.125.a:0 "Эти предметы наверняка мне пригодятся."
 ev11.126.desc:0 "Вы также нашли хозяина этого места — или то, что от него осталось. Тело сильно разложилось, из груди прорастают толстые лианы, уходящие в окно. Записи рядом с ним говорят, что он изучал влияние магии на органику. Очевидно, эксперимент вышел из-под контроля. Но главное — в заметках описан простой ритуал, способный обратить процесс и уничтожить джунгли. К сожалению, его проведение израсходует ценные алхимические вещества."
 ev11.126.a:0 "Значит, мы избавимся от джунглей."
 ev11.126.b:0 "Эти реагенты ценнее самого контракта."
 ev11.127.title:0 "Загадочный голос"
 ev11.127.desc:0 "Ночью к вам приходит сон... или нечто вроде сна. Дрожь проходит по телу, а разум наполняется чужим Присутствием. Внутри собственной черепной коробки вы слышите тревожный шёпот:\n\n#italic Ты дерзнул пойти против воли моего господина. Ты украл у нас Никс. Ты бросил вызов силам, которых не понимаешь. Твоя глупость дорого тебе обойдётся.#!"
 ev11.127.a:0 "Что? Кто ты?! Покажись!"
 ev11.128.desc:0 "Вы чувствуете слабость, будто поддержание контакта с Присутствием требует огромных сил. Стены покоев слегка вздрагивают, возникают странные вспышки света. Всё словно в трансе или под действием дурмана.\n\n#italic Меня зовут Ньярлатхотеп. Я подчиняюсь напрямую тому, кого ты знаешь как Вечное Зло.#!"
 ev11.128.a:0 "Что тебе от меня нужно?"
 ev11.128.b:0 "Отлично, тогда передай ему, пусть идёт к черту!"
 ev11.129.desc:0 "Внезапная волна боли накрывает вас, и злобное Присутствие сжимает хватку.\n\n#italic Я передам ему твои слова... вместе с твоим трупом.#!"
 ev11.129.a:0 "Нет... ты не можешь... убить меня...!"
 ev11.129.b:0 "Не думаю."
 ev11.130.desc:0 "Вы чувствуете, как Присутствие слегка отступает, а боль утихает.\n\n#italic Ты силен для низшего существа. Твоё уничтожение потребовало бы от меня усилий. Вместо этого я обращу твою собственную силу против тебя. Прощай, ничтожество.#!"
 ev11.130.a:0 "Я чувствую... что-то странное."
 nyarlathotep_curse_modifier:0 "Прикосновение Ньярлатхотепа"
 nyarlathotep_curse2_modifier:0 "$nyarlathotep_curse_modifier$ (ослабленное)"
 modifier_definition_nyarlathotep_curse_modifier_modifier:0 "\t#weak Усиливается с каждым сотварённым заклинанием#!"
 ev7.129.i:0 "Пошёл к черту, Ньярлатхотеп!"
 ev7.129.j:0 "Я поменяю магнитных полюса местами!"
 ev7.129.j_ct:0 "Магнитные полюса Земли будут инвертированы."
 ev7.129.j_ct2:0 "Заметного эффекта не будет."
 ev7.129.j_ct3:0 "Заметного эффекта нет."
 ev11.131.desc:0 "#italic Назови причину. Хоть одну причину, почему твоё существование не должно быть прекращено.#!"
 ev11.131.a:0 "Я буду служить тебе! Я и Никс будем служить тебе."
 ev11.131.b:0 "Я отдам тебе свою душу."
 ev11.131.c:0 "Убирайся из моей головы и дай поспать."
 ev11.131.d:0 "Твои пустые угрозы ничего для меня не значат."
 ev11.132.desc:0 "#italic Смерть была бы милосердием. Я, Ньярлатхотеп, изменю твою судьбу: ты принесёшь гибель себе и своему роду. Прощай, ничтожество.#!\n\nВы чувствуете, как Присутствие внезапно исчезает. Однако нечто от него всё ещё остаётся..."
 ev11.133.desc:0 "Эхо зловещего смеха раздаётся в вашей голове.\n\n#italic Я не мелкий демон и не собиратель диковинок. Если бы мне нужна была твоя душа, я бы просто забрал её — вместе с твоим телом.#!"
 ev11.133.a:0 "Тогда ты ничего от меня не получишь."
 ev11.134.desc:0 "#italic Да-а-а. Ты будешь служить. Ты сохранишь свою жалкую жизнь лишь до тех пор, пока полезен. Никс вернётся со мной; мне нужно многое с ней обсудить.#!\n\nВы чувствуете, как зловещее присутствие отступает. Короткий диалог истощил вас; вы едва держитесь на ногах."
 ev11.134.a:0 "Что бы это ни было... надеюсь, оно не вернётся."
 no_soul_modifier:0 "Утраченная душа"
 no_soul_modifier_desc:0 "Из-за сделки с демонами или тёмной магии ваша душа попала во власть тёмных сил. Она не может быть поглощена полностью, пока живо тело — поэтому демоны позаботятся о том, чтобы вы не дожили до спокойной старости."
 ultimate_spell_control_terrain_cancel_negative_supply:0 "Вы всегда сохраняете контроль над [scheme|E] Высшего заклинания"
 ev11.135.title:0 "$nyx_name$"
 ev11.135.desc:0 "Вам сообщили, что кто-то просит аудиенции. Описание совпадает с вашей знакомой, и вы сразу соглашаетесь на встречу. Никс выглядит уставшей, но лёгкая магическая аура подтверждает, что это действительно она."
 ev11.135.a:0 "Никс, что ты здесь делаешь?"
 ev11.136.title:0 "Вечный слуга"
 ev11.136.desc:0 "«Я пришла от имени нашего господина, которому ты присягнул. У Вечного Зла есть для тебя приказ»."
 ev11.136.a:0 "Чего Вечное Зло может хотеть от меня?"
 ev11.136.b:0 "Тоже рад тебя видеть..."
 ev11.137.desc:0 "«Прости, просто груз ответственности давит на меня. Я и не думала, что приказ отдадут тебе, и чувствую вину, что втянула тебя. Если ты не исполнишь волю Вечного Зла, последствия будут катастрофическими — и для меня, и для тебя»."
 ev11.137.a:0 "И чего же твой господин ждёт от меня?"
 ev11.138.desc:0 "Никс вздохнула, явно с облегчением от того, что вы хотя бы допускаете мысль об исполнении приказа.\n«Речь о Земле. Вечное Зло хочет, чтобы ты вызвал инверсию её магнитных полюсов»."
 ev11.138.a:0 "Погоди, что?"
 ev11.139.desc:0 "«Твой мир работает как гигантский кусок магнита. У него есть полюса, которые иногда меняются местами. Твоя задача — ускорить этот процесс. Я сама мало что в этом понимаю, поэтому этим занимаешься ты»."
 ev11.139.a:0 "И как, черт возьми, я должен это сделать?"
 ev11.140.desc:0 "«Ты могущественный маг, уверен, что-нибудь придумаешь. Вечное Зло не дало бы невыполнимое задание...» — Никс запнулась. — «По крайней мере... я так думаю»."
 ev11.140.a:0 "Зачем ему вообще это нужно?"
 ev11.141.desc:0 "«Планы Вечного Зла охватывают бесчисленные миры и тысячелетия. Оно может сдвинуть маленький камень лишь ради того, чтобы в далёком будущем вызвать лавину событий. Возможно, ему нужен конкретный результат, а может, это просто проверка преданности. Сделай всё возможное — оно не терпит неудач или неповиновения»."
 ev11.141.a:0 "Я обдумаю это."
 ev11.142.title:0 "Полюса судьбы"
 ev11.142.desc:0 "Никс ушла, оставив вас с решением непростой задачи. Вы слышали о магнитах, но всегда считали их алхимическим фокусом. Неужели Земля — это один гигантский магнит? Если так, почему доспехи не притягиваются к полюсу? И что произойдёт при смене полюсов?"
 ev11.142.a:0 "Мне нужно провести расчёты."
 ev11.143.desc:0 "За последние дни вы изучили все доступные книги о магнетизме. Удалось систематизировать знания: магнитные силы оказывают скрытое влияние на мир, миграцию птиц и погоду. Повлияет ли инверсия на климат? И почему это важно для Вечного Зла?"
 ev11.143.a:0 "Здесь должно быть что-то ещё."
 ev11.144.desc:0 "Однако вы уловили связь между магией и магнетизмом. Теоретически, очень мощное заклинание способно ускорить смену полюсов. Вы верите, что сила Высшего заклинания справится с этим, если модифицировать его финальную стадию."
 ev11.144.a:0 "Возможно, стоит попробовать."
 ev11.144.a_ct:0 "Возможно, стоит подумать о сотворении Высшего заклинания. Или же лучше забыть обо всём этом."
 ev11.145.desc:0 "«Ты сделал это! Я не была уверена, что ты справишься, но ты сам становишься легендой»"
 ev11.145.a:0 "Ладно, и что теперь?"
 ev11.146.desc:0 "«Вот и всё. Ты выполнил свою часть, Вечное Зло довольна. Тебя повысили до его главного представителя на Земле, а я остаюсь в твоём распоряжении. С сегодняшнего дня я работаю на тебя»."
 ev11.146.a:0 "Знаешь, к чему была эта история с полюсами?"
 ev11.146.b:0 "Что именно включает в себя моя новая роль?"
 ev11.147.desc:0 "«Понятия не имею — мы, вероятно, никогда не узнаем. Хотя мне пришло в голову, что дело вовсе не в магнетизме. Может, Вечному Злу просто нужно было, чтобы ты использовал Высшее заклинание, или оно проверяло твои силы»."
 ev11.147.a:0 "Так что мне делать на посту главного представителя?"
 ev11.148.desc:0 "«Пока ничего делать не нужно, пока не придут новые приказы — а это случится нескоро. Теперь ты чемпион Вечного Зла, и ни один бог не захочет встать у тебя на пути. Можно сказать, ты стал куратором этого мира»."
 ev11.148.a:0 "Отлично. Это всё, что мне нужно было услышать."
 ev11.148.a_ct2:0 "Вы получаете доступ к взаимодействию [interaction|E] «Использовать силы Никс»."
 eternal_champion_modifier:0 "Избранник Вечного Зла"
 eternal_champion_modifier_desc:0 "Вечное Зло видит в вас своего чемпиона. Его благословение усиливает вашу магию до тех пор, пока вы верны ему."
 use_nyx_powers_interaction:0 "Использовать силы Никс"
 use_nyx_powers_interaction_desc:0 "Никс несёт особое благословение Вечного Зла, дарующее ей невероятные способности."
 use_nyx_powers_interaction_info:0 "Никс применит свои силы по вашему приказу."
 ev11.149.desc:0 "«[ROOT.Char.GetTitledFirstNameNoTooltip]! Чем я могу помочь?»"
 necro_chapter6:0 "Некрономикон — Глава 6."
 ev11.150.desc:0 "«Моё последнее звездное путешествие дало ответы. Я решил проблему угасания магии на Земле — создал гигантскую магическую линзу вокруг планеты для постоянного притока арканной энергии. Мне пришлось использовать силы, перед которыми Высшее заклинание — детская забава; я сжёг почти все катализаторы и море эфира... но это работает! Абдул Аль-Хазред вновь спасает день! Правда, линза привязана к магнитным полюсам, и при их смене она разрушится, но это не имеет значения, ведь такое случится лишь через тысячи лет...»"
 ev11.150.0.a:0 "Что я натворил!"
 ev11.151.title:0 "Древняя Сингулярность Мк.III"
 ev11.151.desc:0 "[thief.GetTitledFirstName] нанёс вам неожиданный визит, прибыв в одиночку. [thief.GetSheHe|U] объяснил[thief.GetEnding('а')], что специализируется на магических артефактах и отлично знает устройство Древней Сингулярности. [thief.GetSheHe|U] попросил[thief.GetEnding('а')] осмотреть предмет и пообещал[thief.GetEnding('а')] улучшить его. Сомнений в познаниях [thief.GetTitledFirstNamePossessive] нет."
 ev11.151.0.a:0 "Хорошо, у тебя есть двадцать четыре часа."
 ev11.151.0.a_ct:0 "Сингулярность будет улучшена... возможно?"
 ev11.151.0.b:0 "Нет. Никто не прикоснётся к моей Сингулярности."
 ev11.152.title:0 "Кража Сингулярности"
 ev11.152.desc:0 "На следующее утро покои, отведённые [thief.GetTitledFirstNamePossessive], оказались пусты. Часовые не смыкали глаз, но негодяй применил телепортацию и сбежал, прихватив с собой вашу Сингулярность!"
 ev11.152.0.a:0 "[thief.GetTitledFirstNameNoTooltip] заплатит за это!"
 expects_attack_from_player_modifier:0 "Ожидает нападения"
 ev5.28.0.x2_ct:0 "#P Это заклинание сильнее, потому что вы истинный мастер магии!#!"
