 wc_estate_mage_tower_mtriangulation_01_domicile_building:0 "Триангуляционное устройство"
 wc_estate_mage_tower_mtriangulation_01_domicile_building_desc:0 "Ядро Триангулама использует систему магических линз, показания которых, обработанные через Лей-Резонатор, могут с поразительной точностью определить местоположение источника энергии."
 wc_estate_mage_tower_mtriangulation_02_domicile_building:0 "$wc_estate_mage_tower_mtriangulation_01_domicile_building$"
 wc_estate_mage_tower_mtriangulation_02_domicile_building_desc:0 "$wc_estate_mage_tower_mtriangulation_01_domicile_building_desc$"
 hostile_schemes_wc_stealing_magic_lock:0 "У цели есть магические защиты."
 wc_enemy_steal_artifact_terrain_advantage:0 "Шанс успеха вражеской [scheme|E] «[GetScheme('steal_back_artifact').GetTypeName]»"
 wc_estate_mage_tower_magic_lock_01_domicile_building:0 "Сундук Рунного Стража"
 wc_estate_mage_tower_magic_lock_01_domicile_building_desc:0 "Это магически защищённое место для хранения артефактов и ценных вещей."
 wc_estate_mage_tower_magic_lock_02_domicile_building:0 "Заколдованный сейф"
 wc_estate_mage_tower_magic_lock_02_domicile_building_desc:0 "$wc_estate_mage_tower_magic_lock_01_domicile_building_desc$"
 wc_estate_mage_tower_agents_01_domicile_building:0 "Партнёрская сеть"
 wc_estate_mage_tower_agents_01_domicile_building_desc:0 "Настоящий маг владеет множеством источников информации и поддерживает многочисленные дальние переписки, а его курьеры добираются даже до самых экзотических уголков мира."
 wc_estate_mage_tower_agents_02_domicile_building:0 "$wc_estate_mage_tower_agents_01_domicile_building$"
 wc_estate_mage_tower_agents_02_domicile_building_desc:0 "$wc_estate_mage_tower_agents_01_domicile_building_desc$"
 MUST_BE_MC_MEMBER:0 "Ты должен быть участником [high_mage_council|E]."
 wc_estate_mage_tower_high_council_01_domicile_building:0 "Архивы Высокого Совета"
 wc_estate_mage_tower_high_council_01_domicile_building_desc:0 "Высокий Совет проводит множество операций по всему миру, и немногие осознают, насколько далеко распространяется его влияние. Получение доступа даже к части информации, которой владеет Совет, может принести значительные выгоды."
 wc_estate_mage_tower_high_council_02_domicile_building:0 "$wc_estate_mage_tower_high_council_01_domicile_building$"
 wc_estate_mage_tower_high_council_02_domicile_building_desc:0 "$wc_estate_mage_tower_high_council_01_domicile_building_desc$"
 wc_estate_mage_tower_books_01_domicile_building:0 "Проклятые тома"
 wc_estate_mage_tower_books_01_domicile_building_desc:0 "Эта уникальная коллекция томов содержит секреты, которые превышают понимание обычного смертного ума."
 wc_estate_mage_tower_books_02_domicile_building:0 "$wc_estate_mage_tower_books_01_domicile_building$"
 wc_estate_mage_tower_books_02_domicile_building_desc:0 "$wc_estate_mage_tower_books_01_domicile_building_desc$"
 MAGE_TOWER_BOOKS_REQUIREMENTS:0 "Ты должен обладать Некрономиконом или хотя бы одной магической разработкой."
 surviving_chance_label:0 "@advantage_icon! Шанс выживания: [GetPlayer.MakeScope.Var('surv_chance').GetValue]%"
 surviving_chance_tooltip:0 "#t Шанс выживания#!\nШанс выживания — это параметр, который меняется в зависимости от решений, принимаемых во время нападения охотников. На финальном этапе он определяет, выживете ли вы после атаки."
 ev11.14.title:0 "Охотники идут"
 ev11.14.desc:0 "Уже некоторое время твои разведчики сообщают, что за твоим караваном следует хорошо вооружённая сила. Тебе удалось подтвердить, что это охотники на ведьм — хорошо экипированные, многочисленные и постепенно сокращающие дистанцию. Столкновение кажется неизбежным."
 ev11.14.0.a:0 "Мы попробуем проскользнуть мимо них."
 ev11.14.0.a_ct:0 "Охотники теряют твой след."
 ev11.14.0.a_ct2:0 "Охотники начинают свою атаку."
 ev11.14.0.b:0 "Давай поищем хорошую оборонительную позицию."
 ev11.14.0.b_ct:0 "#P Начальный шанс выживания будет увеличен на значение вашей безопасности в пути.#!"
 ev11.14.0.c:0 "Я сожгу их своей Сингулярностью."
 ev11.14.0.c_ct:0 "#P Группа преследователей будет уничтожена.#!"
 ev11.14.0.d:0 "Даже у охотников есть своя цена."
 ev11.14.0.d_ct:0 "Огромная взятка может убедить охотников отказаться от погони."
 ev11.14.0.e:0 "Мы сбежим с помощью телепортации."
 ev11.15.title:0 "Атака охотников"
 ev11.15.desc:0 "Группа вооружённых воинов внезапно нападает на тебя. Похоже, им всё равно на твою капитуляцию — им нужна только кровь."
 ev11.15.0.a:0 "Я поприветствую их Мощным Ударом."
 ev11.15.0.b:0 "Подождать, пока они не войдут в радиус действия лучников."
 ha_gain_surv_chance:0 "Твои шансы на выживание увеличиваются на "
 ha_loss_surv_chance:0 "Твои шансы на выживание уменьшаются на"
