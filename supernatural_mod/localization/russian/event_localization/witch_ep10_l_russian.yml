 psychic_surgery_spell_clear:0 "Текущая личность будет стёрта."
 ev11.191.desc:0 "Заклинание стабильно; у вас есть полный доступ к разуму [recipient.GetTitledFirstNamePossessive]. Здесь можно изменить многое, но соблюдайте осторожность — легко сломать лишнее...\nНа ум приходит несколько образов новой личности."
 ev11.191.0.a:0 "Агрессивный воин."
 ev11.191.0.b:0 "Ленивый трус."
 ev11.191.0.c:0 "Хитрый подлец."
