 ha_loss_20_surv_chance_ct:0 "$ha_loss_surv_chance$ #N 20%#!"
 ev11.16.title:0 "$ev11.15.title$ - Перегруппировка"
 ev11.16.desc:0 "Тебе удалось отразить первую атаку, но ясно, что отряд охотников собирается заново с пугающей скоростью и готовится к следующей."
 ev11.16.0.a:0 "Эти жалкие паразиты ещё не понимают, что это самоубийство."
 ev11.16.0.b:0 "Нам тоже стоит перегруппироваться."
 ev11.16.0.c:0 "Приготовим для них пару сюрпризов."
 ev11.16.0.d:0 "Заклинание «Стена шипов» поможет в обороне."
 ev11.17.title:0 "$ev11.15.title$ — Непрерывный натиск"
 ev11.17.desc:0 "Натиск охотников на миг захлебнулся, но вскоре стало ясно, что это лишь начало. Их тактика может быть топорной, но в их глазах горит слепой фанатизм — сломить их боевой дух будет непросто."
 ev11.17.0.a:0 "И всё же мы выстоим."
 ev11.17.0.b:0 "Воины... сомкнуть ряды!"
 ev11.17.0.c:0 "Мой Тёмный Клинок вкусит крови."
 ev11.17.0.d:0 "Мы сокрушим их!"
 ev11.17.0.e:0 "Посмотрим, чей фанатизм сильнее."
 ev11.18.title:0 "$ev11.15.title$ — Очередной штурм"
 ev11.18.desc:0 "Следующая атака охотников началась быстрее, чем вы ожидали, а её ярость застала вас врасплох. Теперь вы замечаете, что они придерживаются определённой тактики — эта волна состоит из других бойцов. Значит, часть из них отдыхает... или пытается зайти вам с фланга."
 ev11.18.0.a:0 "Нужно срочно что-то придумать."
 ev11.18.0.b:0 "[en1.GetTitledFirstName] выиграет для меня немного времени."
 ev11.18.0.c:0 "Я возглавлю упреждающий удар!"
 ev11.18.0.d:0 "Немного золота поднимет наш дух."
 ev11.19.title:0 "Затишье перед бурей"
 ev11.19.desc:0 "Очередная атака отбита, но с обеих сторон много раненых. Впрочем, охотники приостановили свой натиск явно не поэтому — похоже, они готовят что-то особое. Как бы то ни было, у вас есть краткая передышка."
 ev11.19.0.a:0 "Мне остаётся лишь молиться о спасении."
 ev11.19.0.b:0 "Я не сдамся без боя."
 ev11.19.0.c:0 "Я нашлю на них проклятие — возможно, это поможет."
 ev11.19.0.d:0 "Значит, пора применить разрушительные заклинания."
 ev11.19.0.e:0 "Довольно! Я сожгу их Огненным штормом."
 ev11.19.0.f:0 "Заклинание торнадо сметёт их с лица земли."
 ev11.19.0.g:0 "Они дают мне время применить Сингулярность."
 ev11.19.0.h:0 "У нас есть время подготовить оборону."
 ev11.19.0.i:0 "Я займусь исцелением раненых."
 ev11.21.title:0 "$ev11.15.title$ — Смерть и разрушение"
 ev11.21.desc:0 "Ваша могущественная магия сеет опустошение по всему полю боя. Возможно, лишь сейчас охотники осознали, с кем столкнулись на самом деле, — и многие из выживших после вашего арканного гнева уже сомневаются в целесообразности новых атак."
 ev11.21.0.a:0 "У меня припасено ещё немало подобного!"
 ev11.21.0.b:0 "Надеюсь, это только разминка."
 ev11.21.0.c:0 "Они не могут убить то, что уже мертво."
 ev11.21.0.d:0 "Мою силу не остановить."
 ev11.20.title:0 "$ev11.15.title$ — Последний рубеж"
 ev11.20.desc:0 "Несмотря на все ваши усилия, охотники продолжают наступать, окружая вас со всех сторон. Их оказалось куда больше, чем вы ожидали! Боевой дух ваших людей начинает колебаться, хотя за каждый шаг к вам охотники платят страшную цену."
 ev11.20.0.a:0 "Мы должны собрать все наши силы!"
 ev11.20.0.b:0 "Возможно, мне стоит передать командование кому-то более умелому."
 ev11.20.0.c:0 "У меня ещё припасено несколько трюков в рукаве."
 ev11.20.0.d:0 "Наши позиции всё ещё дают нам преимущество."
 ev11.20.0.e:0 "Приготовить бочки с порохом!"
 ev11.20.0.f:0 "Пора им познать мою силу."
 ev11.22.title:0 "$ev11.15.title$ - $bp3_survey.0010.t$"
 ev11.22.desc:0 "Охотники идут в последний штурм. Их ряды дрожат, многие изранены, но они полны решимости пожертвовать жизнью ради малейшего шанса добраться до вас."
 ev11.22.0.a:0 "Пусть попробуют."
 ev11.22.1.a:0 "Мы будем сражаться до последнего солдата!"
 ev11.22.0.a_ct:0 "Охотники разгромлены"
 ev11.22.0.x_info:0 "Убит охотниками"
 ev11.23.title:0 "$ep2_wedding.0204.a.tt.success$"
 ev11.23.desc:0 "В тот день погибло немало людей, в основном охотников — лишь немногим удалось отступить. Возможно, это и к лучшему. Это поражение заставит их задуматься, а вести о нём заставят прочих ваших врагов дважды подумать, прежде чем выступать против вас."
 ev11.23.0.a:0 "Надеюсь, остаток пути пройдет спокойно."
 ev11.23.0.b:0 "Превосходно. И что у нас сегодня на обед?"
 ev11.23.0.c:0 "Это было весьма весело!"
 shot_from_cover_interaction:0 "Выстрел из укрытия"
 shot_from_cover_interaction_desc:0 "Арбалет с оптическим прицелом способен произвести точный выстрел со значительного расстояния — это пригодится при попытке устранить цель."
 shot_from_cover_success:0 "Попадание"
 shot_from_cover_csuccess:0 "Критическое попадание"
 shot_from_cover_failure:0 "Промах"
 HAS_ANY_COUNTERMEASURE:0 "У цели активны [scheme_countermeasure_countermeasure|E]."
 NEED_PROWESS_OR_BE_WH:0 "Вам требуется доблесть не менее 18."
 TARGET_IS_TRAVELLING:0 "Вы не можете определить точное местонахождение цели (цель находится в путешествии)."
 ev11.24.title:0 "$shot_from_cover_interaction$"
 ev11.24.desc:0 "Это должен был быть самый обычный день, но у кого-то были иные планы. Занимаясь привычными делами, вы внезапно услышали свист воздуха и глухой удар. Стрелок в маске выпустил арбалетный болт прямо в вас!"
 ev11.24.0.a:0 "Меня этим не ранить, выродок."
 ev11.24.0.b:0 "Хорошо, что у меня есть Драконья чешуя."
 ev11.24.0.c:0 "Мои защитные заклинания остановят болт."
 ev11.26.desc:0 "Снаряд ранил вас, но настоящую опасность представляет яд. Стрелок скрылся без следа. У вас нет доказательств, но подобные методы слишком похожи на почерк охотников на ведьм."
 ev11.27.desc:0 "Вам удалось занять удобную позицию для стрельбы, и наконец [recipient.GetTitledFirstName] входит в зону поражения. Выстрел точен — [recipient.GetTitledFirstName] ранен[recipient.GetEnding('а')]. [recipient.GetSheHe|U] выжил[recipient.GetEnding('а')], но яд на наконечнике всё ещё может довершить начатое."
 ev11.27.0.a:0 "Весьма неплохо."
 ev11.28.desc:0 "Вы заняли отличную позицию для устранения [recipient.GetTitledFirstNamePossessive]. И когда цель показалась в зоне поражения, вы сделали долгожданный выстрел, поразив [recipient.GetHerHim] прямо в сердце. [recipient.GetTitledFirstName] умирает на месте, а вы благополучно отступаете. Чистая работа."
 ev11.28.0.a:0 "Отличный был выстрел."
 ev11.29.desc:0 "Снаряд разминулся с вами в волоске — и к счастью, ведь осмотр показал, что он был отравлен. Стрелок, кем бы он ни был, скрылся бесследно. У вас есть предчувствие, что это был один из охотников на ведьм."
 ev11.29.0.a:0 "Стоит удвоить охрану."
 ev11.30.desc:0 "Вам удалось занять хорошую позицию, чтобы устранить [recipient.GetTitledFirstNamePossessive]. Когда [recipient.GetSheHe] наконец попадает в поле зрения, вы спускаете курок — но случайность или порыв ветра сбивают болт с курса. Вам удалось уйти невредимым, но это единственная хорошая новость."
 ev11.30.0.a:0 "Мне нужно поработать над меткостью."
 ev11.31.desc:0 "Болт не причинил вам вреда, но попытка убийства — дело серьёзное. Стрелок скрылся бесследно, однако точность выстрела, яд на болте и сам почерк явно указывают на охотников на ведьм."
 wc_poisoned_bolt_modifier:0 "Отравленный болт"
 wh_crossbow_cover_shot_terrain_cancel_negative_supply:0 "Открывает [interaction|E] «$shot_from_cover_interaction$»"
 witch_hunter_crossbow:0 "Улучшенный арбалет"
 witch_hunter_crossbow_desc:0 "Это передовое оружие, способное в умелых руках метать снаряды намного дальше любого другого устройства, за исключением разве что осадных машин. Создать подобную технологию мог только выдающийся изобретатель-новатор или секретная мастерская охотников на ведьм."
 YOU_ARE_TRAVELLING:0 "Вы находитесь в путешествии"
 magic_master_defence_1_terrain_cancel_negative_supply:0 "Может #P предотвратить#! некоторые покушения на вашу жизнь"
 magic_master_defence_2_terrain_cancel_negative_supply:0 "Может #P предотвратить#! случайную смерть"
 magical_research:0 "Магическое исследование"
 magical_research_desc:0 "Проводите магические исследования, чтобы раскрыть могущественные способности, новые заклинания и глубокие тайны вселенной."
 magical_research_host_desc:0 "$BULLET_WITH_TAB$Вы можете получить знания и навыки\n$BULLET_WITH_TAB$Вы можете разработать новые заклинания\n$BULLET_WITH_TAB$Вы можете получить опыт свойства «[GetTrait('archmage').GetName( GetNullCharacter )|L]»"
 magical_research_province_desc:0 "Это подходящее место для проведения исследований."
 magical_research_destination_selection:0 ""
 magical_research_selection_tooltip:0 "$magic_epic_decision$"
 magical_research_standard:0 "$magical_research$"
 magical_research_standard_desc:0 "Разработка новых теорий, проведение экспериментов, создание магических изобретений — всё это может привести к совершению прорывов в понимании и использовании магии."
 magical_research_exp:0 "Исследовательская экспедиция"
 magical_research_exp_desc:0 "В мире есть несколько мест, наполненных древней магией, неизведанными знаниями и устрашающей силой. Стоит посетить их и узнать, какие секреты там скрыты."
 TRAVEL_NAME_FOR_magical_research:0 "Ваше прибытие на $magical_research$"
 funds_for_searching_option3:0 "Исчерпывающее финансирование"
 funds_for_searching_option3_desc:0 "Вы получите значительный дополнительный прогресс в качестве стартового бонуса."
 magical_research_guest_desc:0 ""
 magical_research_conclusion_desc:0 "Заключение"
 gain_magical_research_progress_0_txt:0 "Вы получаете #N 0#! прогресса исследований"
 gain_magical_research_progress_1_txt:0 "Вы получаете #P 1#! прогресс исследований"
 gain_magical_research_progress_2_txt:0 "Вы получаете #P 2#! прогресса исследований"
 gain_magical_research_progress_3_txt:0 "Вы получаете #P 3#! прогресса исследований"
 gain_magical_research_progress_5_txt:0 "Вы получаете #P 5#! прогресса исследований"
 gain_magical_research_progress_7_txt:0 "Вы получаете #P 7#! прогресса исследований"
 gain_magical_research_progress_10_txt:0 "Вы получаете #P 10#! прогресса исследований"
 gain_magical_research_progress_15_txt:0 "Вы получаете #P 15#! прогресса исследований"
 gain_magical_research_progress_20_txt:0 "Вы получаете #P 20#! прогресса исследований"
 gain_magical_research_progress_100_txt:0 "Вы получаете #P 100#! прогресса исследований"
 general_research_intent:0 "Общие исследования"
 general_research_intent_desc:0 "Магия скрывает множество тайн, не поддающихся простой классификации, но способных сыграть ключевую роль в изменении ткани реальности. Подобные исследования открывают путь к повелеванию силами природы и метамагии, влиянию на человеческий разум и раскрытию секретов мест силы."
 life_extension_intent:0 "Продление жизни"
 life_extension_intent_desc:0 "Достижение бессмертия — или хотя бы долголетия — возможно с помощью сложных телесных трансформаций, однако подобные исследования считаются чрезвычайно сложными и опасными."
 combat_magic_intent:0 "Боевая магия"
 combat_magic_intent_desc:0 "Сила мага порой сводится к умению эффективно уничтожать своих врагов. Создание боевых заклинаний — будь то против вражеских армий или других адептов — неотъемлемая часть магической традиции."
 creation_magic_intent:0 "Творение и артефакты"
 creation_magic_intent_desc:0 "Магическая трансмутация, начертание рун, создание артефактов или конструктов — всё это входит в область познания искусного мага."
 game_concept_mr_breakthrough:0 "Прорыв"
 game_concept_mr_breakthrough_desc:0 "Завершение любого исследовательского проекта требует совершения определённого числа прорывов. Количество совершённых прорывов зависит от прогресса исследований, достигнутого во время работы."
 game_concept_mr_advanced_project:0 "Продвинутый исследовательский проект"
 game_concept_mr_advanced_project_desc:0 "Продвинутый проект даёт разовый постоянный эффект. В случае успешного завершения персонаж не сможет взять его повторно.\nДоступные продвинутые проекты берутся из пула проектов, соответствующих выбранной цели."
 game_concept_mr_basic_project:0 "Базовый исследовательский проект"
 game_concept_mr_basic_project_desc:0 "У каждой цели есть один базовый исследовательский проект, который доступен всегда и может выполняться неоднократно, давая специфические или временные эффекты."
 mr_basic_project_info2:0 "Этот проект можно выполнять неоднократно."
 game_concept_mr_unique_project:0 "Уникальный исследовательский проект"
 game_concept_mr_unique_project_desc:0 "Уникальные проекты исключительны и неповторимы. В случае их успешного завершения они становятся недоступны для всех остальных в мире."
 game_concept_useful_magic_component:0 "Магический компонент"
 game_concept_useful_magic_component_desc:0 "Магические компоненты — ценный алхимический продукт, жгуче необходимый каждому магу. Они полезны в ритуалах, таких как [GetScheme('ultimate_spell_cast').GetTypeName], или при проведении некоторых видов [GetActivityType('magical_research').GetName]."
 magical_research_special_type_bar_segment_tt_0:0 "#t Базовое прозрение#!\n$EFFECT_LIST_BULLET$Вы совершаете 1 [mr_breakthrough|E]."
 magical_research_special_type_bar_segment_tt_1:0 "#t Многообещающие результаты#!\n$EFFECT_LIST_BULLET$Вы совершаете 2 [mr_breakthrough|E]a.\n$EFFECT_LIST_BULLET$Избыточные прорывы могут давать дополнительный опыт или иные мелкие бонусы."
 magical_research_special_type_bar_segment_tt_2:0 "#t Комплексный анализ#!\n$EFFECT_LIST_BULLET$Вы совершаете 3 [mr_breakthrough|E]a.\n$EFFECT_LIST_BULLET$Избыточные прорывы могут давать дополнительный опыт или иные мелкие бонусы."
 magical_research_special_type_bar_segment_tt_3:0 "#t Новая магическая теория#!\n$EFFECT_LIST_BULLET$Вы совершаете 4 [mr_breakthrough|E]а.\n$EFFECT_LIST_BULLET$Избыточные прорывы могут давать дополнительный опыт или иные мелкие бонусы."
 magical_research_phase:0 "$magical_research$"
 magical_research_phase_desc:0 "$magical_research_desc$"
 magical_research_calibration_phase:0 "Калибровка"
 magical_research_calibration_phase_desc:0 "Если ваш магический проект требует калибровки, сейчас самое время её провести!"
 ev11.33.title:0 "Дополнительная поддержка"
 ev11.33.desc:0 "Приготовления к исследованию почти завершены: вам удалось собрать большинство материалов и ценных компонентов, а остальное подождёт. И всё же вам не помешала бы дополнительная помощь — кто-то компетентный, кто ассистировал бы вам в работе."
 ev11.33.0.a:0 "Я попрошу [assistant.GetTitledFirstNamePossessive]."
 ev11.33.0.b:0 "Или, может, [assistant2.GetTitledFirstNamePossessive]?"
 ev11.33.0.c:0 "[assistant3.GetTitledFirstName] — именно тот, кто нужен."
 ev11.33.0.d:0 "Мне никто не нужен."
 mr_magic_assistant_modifier:0 "Помощь в магических исследованиях"
 ev11.34.title:0 "Направление исследований"
 ev11.34.desc:0 "Финальные приготовления зависят от области, в которую вы намерены погрузиться. На ум приходит несколько идей, достойных изучения и развития. Нынешние обстоятельства как раз подходят для проверки теорий из старых фолиантов."
 ev11.34.0.a:0 "[ROOT.Char.Custom('MyFirstMResearchOption')]"
 ev11.34.0.b:0 "[ROOT.Char.Custom('MySecondMResearchOption')]"
 ev11.34.0.c:0 "[ROOT.Char.Custom('MyThirdMResearchOption')]"
 ev11.34.0.d:0 "[ROOT.Char.Custom('MyFourthMResearchOption')]"
 ev11.34.0.c1:0 "Подготовка ритуала."
 ev11.34.0.c2:0 "Замедление старения."
 ev11.34.0.c3:0 "Усиление боевых заклинаний."
 ev11.34.0.c4:0 "Защитные меры."
 ev11.34.0.f:0 "Кольцо власти!"
 mr_ring_of_power_info:0 "Вы создадите уникальный магический предмет."
 ev11.34.0.e:0 "Я обдумаю что-нибудь другое."
 ev11.34.0.d_ct:0 "У вас есть несколько дней, чтобы сменить цель."
