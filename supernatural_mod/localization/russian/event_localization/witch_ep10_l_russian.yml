 ev11.200.0.d:0 "Я перехожу к следующей фазе."
 ev11.201.title:0 "Послание из иного мира"
 ev11.201.desc:0 "Проснувшись утром, вы обнаружили таинственную шкатулку с драгоценностями, эликсиром и письмом. На письме стоит печатка [stars_traveler.GetTitledFirstNamePossessive], хотя он[stars_traveler.GetEnding('а')] считался/лась погибшей после исчезновения в экспедиции."
 ev11.201.0.a:0 "Приступим к чтению!"
 ev11.202.desc:0 "#italic Мой дорогой [ROOT.Char.GetFirstNameNoTooltip],\nНадеюсь, эта посылка дошла до тебя. Я странствую по дальним землям и иным мирам, раскрывая мрачные тайны. Не раз смерть касалась меня, но удача и разум спасали. Боги и демоны — лишь малая часть опасностей на моём пути.\nЗнания и сила стоят всех рисков. Не знаю, напишу ли снова, ибо держу путь в край смертельной опасности. Если не вернусь — ведай: я ни о чём не жалею.\nС уважением,\n[stars_traveler.GetFirstNameNoTooltip]\nP.S. В придачу к безделушкам и сосуду с эфиром посылаю заметки из моих странствий. Они станут бесценным сокровищем для любого искателя тайной мудрости.#!"
 ev11.202.0.a:0 "Эти заметки воистину удивительны!"
