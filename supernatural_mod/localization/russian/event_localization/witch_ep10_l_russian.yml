 ev11.36.desc:0 "Наконец-то! Ваши исследования принесли долгожданные результаты. Похоже, ваши знания обогатились, и сделан ещё один шаг на пути к просветлению и обретению новой силы."
 ev11.36.0.a:0 "Я приближаюсь к совершенству."
 ev11.36.0.b:0 "Великолепно, не правда ли?"
 ev11.36.0.c:0 "Моя сила растёт."
 ev11.37.desc:0 "Несмотря на множество попыток и огромные усилия, ваши исследования зашли в тупик. Возможно, то, чего вы пытались добиться, просто невозможно, а может, дело в неверном подходе. Тем не менее, вам всё же удалось почерпнуть немало ценных сведений, которые могут пригодиться в будущем."
 ev11.37.0.a:0 "Я извлеку из этого ценный урок на будущее."
