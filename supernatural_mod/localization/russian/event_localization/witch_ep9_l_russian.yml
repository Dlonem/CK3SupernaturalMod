 MC_APP_PROPOSAL1:0 "Я хочу запросить выдвижение в Высший совет магов на должность $mc_loremaster_modifier$. Я считаю, что я отличный кандидат и внесу значительный вклад в работу совета."
 MC_APP_PROPOSAL2:0 "Я хочу запросить выдвижение в Высший совет магов на должность $mc_black_mage_modifier$. Я считаю, что я отличный кандидат и внесу значительный вклад в работу совета."
 MC_APP_PROPOSAL3:0 "Я хочу запросить выдвижение в Высший совет магов на должность $mc_admin_modifier$. Я считаю, что я отличный кандидат и внесу значительный вклад в работу совета."
