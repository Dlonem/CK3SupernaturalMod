l_russian:
 TRAVEL_NAME_FOR_mages_summit:0 "Ваш приезд на Магический Саммит"
 mages_summit_activity:0 "$mages_summit$"
 game_concept_md_elements:0 "Магические элементы"
 game_concept_md_elements_desc:0 "Боевые заклинания состоят из элементов, которые являются источником урона и других эффектов заклинаний. Лучшее владение элементами делает заклинания, использующие их, более мощными."
 game_concept_md_power:0 " @power_element_icon!$game_concept_power_element$"
 game_concept_md_fire:0 " @fire_element_icon!$game_concept_fire_element$"
 game_concept_md_kinetic:0 " @kinetic_element_icon!$game_concept_kinetic_element$"
 game_concept_md_shadow:0 " @shadow_element_icon!$game_concept_shadow_element$"
 game_concept_md_necrotic:0 " @necrotic_element_icon!$game_concept_necrosis$"
 game_concept_power_element:0 "Сила"
 game_concept_power_element_i:0 "@power_element_icon!"
 game_concept_power_element_i2:0 "@no_power_element_icon!"
 game_concept_power_element_desc:0 "Урон силы — это простой и часто эффективный способ подавить противника.\n$EFFECT_LIST_BULLET$ Урон силы не имеет дополнительных эффектов."
 power_element_tooltip:0 "@power_element_icon! #t $game_concept_power_element$#!\n$game_concept_power_element_desc$"
 power_element_icon_with_desc:0 "[power_element_i|E]"
 no_power_element_icon_with_desc:0 "[power_element_i2|E]"
 game_concept_fire_element:0 "Огонь"
 game_concept_fire_element_i:0 "@fire_element_icon!"
 game_concept_fire_element_i2:0 "@no_fire_element_icon!"
 game_concept_fire_element_desc:0 "Заклинания, основанные на огне, высоко ценятся любым боевым магом.\n$EFFECT_LIST_BULLET$ Когда вы успешно наносите огненный урон, ваш противник может потерять #N 1#! [endurance|E] (20% шанс за каждый нанесенный пункт огненного урона)."
 fire_element_tooltip:0 "@fire_element_icon! #t $game_concept_fire_element$#!\n$game_concept_fire_element_desc$"
 fire_element_icon_with_desc:0 "[fire_element_i|E]"
 no_fire_element_icon_with_desc:0 "[fire_element_i2|E]"
 game_concept_kinetic_element:0 "Кинетика"
 game_concept_kinetic_element_i:0 "@kinetic_element_icon!"
 game_concept_kinetic_element_i2:0 "@no_kinetic_element_icon!"
 game_concept_kinetic_element_desc:0 "Кинетические заклинания — хороший выбор, если вы хотите полностью сокрушить противника.\n$EFFECT_LIST_BULLET$ Каждый раз, когда вы наносите больше кинетического урона, чем противник, он теряет #N 1#! [endurance|E]."
 kinetic_element_tooltip:0 "@kinetic_element_icon! #t $game_concept_kinetic_element$#!\n$game_concept_kinetic_element_desc$"
 kinetic_element_icon_with_desc:0 "[kinetic_element_i|E]"
 no_kinetic_element_icon_with_desc:0 "[kinetic_element_i2|E]"
 game_concept_shadow_element:0 "Тень"
 game_concept_shadow_element_i:0 "@shadow_element_icon!"
 game_concept_shadow_element_i2:0 "@no_shadow_element_icon!"
 game_concept_shadow_element_desc:0 "Теневые заклинания сложны, хотя их полный потенциал раскрывается со временем.\n$EFFECT_LIST_BULLET$ Каждый раз, когда вы используете элемент тени, ваш уровень тени увеличивается на #P 1#!. Этот эффект может накапливаться.\n$EFFECT_LIST_BULLET$ Каждый раз, когда противник использует двойной [power_element_i|E][power_element|E] или двойной [fire_element_i|E][fire_element|E] элемент, ваш уровень тени уменьшается на #N 2#!. Этот эффект может накапливаться."
 shadow_element_tooltip:0 "@shadow_element_icon! #t $game_concept_shadow_element$#!\n$game_concept_shadow_element_desc$"
 shadow_element_icon_with_desc:0 "[shadow_element_i|E]"
 no_shadow_element_icon_with_desc:0 "[shadow_element_i2|E]"
 game_concept_necrotic_element:0 "Некротика"
 game_concept_necrosis:0 "Некроз"
 game_concept_necrotic_element_i:0 "@necrotic_element_icon!"
 game_concept_necrotic_element_i2:0 "@no_necrotic_element_icon!"
 game_concept_necrotic_element_desc:0 "Лишь немногие существа достаточно могущественны или злы, чтобы использовать некротическую магию.\n$EFFECT_LIST_BULLET$ Некротический урон одновременно влияет на [power_clash|E] и [endurance|E] противника."
 necrotic_element_tooltip:0 "@necrotic_element_icon! #t $game_concept_necrosis$#!\n$game_concept_necrotic_element_desc$"
 necrotic_element_icon_with_desc:0 "[necrotic_element_i|E]"
 no_necrotic_element_icon_with_desc:0 "[necrotic_element_i2|E]"
 game_concept_magic_shield:0 "Магический щит"
 game_concept_magic_shield_i:0 "@magic_shield_icon!"
 game_concept_magic_shield_desc:0 "Магический щит — это компонент заклинания, который блокирует чистый и вторичный урон от противника, тем самым снижая вероятность потери [endurance|E] и прогресс противника в шкале Схватки Силы.\nИспользование магического щита часто требует затрат [power_element_i|E][power_element|E]."
 magic_shield_tooltip:0 "@magic_shield_icon! #t $game_concept_magic_shield$#!\n$game_concept_magic_shield_desc$"
 magic_shield_icon_with_desc:0 "[magic_shield_i|E]"
 game_concept_endurance:0 "Выносливость"
 game_concept_endurance_i:0 "@endurance_icon!"
 game_concept_endurance_desc:0 "Когда выносливость персонажа падает до нуля, он не может продолжать дуэль — другая сторона побеждает."
 endurance_tooltip:0 "@endurance_icon! #t $game_concept_endurance$#!\n$game_concept_endurance_desc$"
 endurance_icon_with_desc:0 "[endurance_i|E]"
 game_concept_magic_special_effect:0 "Особый эффект"
 game_concept_magic_special_effect_i:0 "@magic_special_icon!"
 game_concept_magic_special_effect_desc:0 "Некоторые заклинания имеют дополнительные эффекты, которые могут влиять на дуэль разными способами."
 magic_special_effect_tooltip:0 "@magic_special_icon! #t $game_concept_endurance$#!\n$game_concept_endurance_desc$"
 magic_special_effect_icon_with_desc:0 "[magic_special_effect_i|E]"
 game_concept_magic_damage:0 "Урон"
 game_concept_magic_damage1:0 "основной урон"
 game_concept_magic_damage2:0 "вторичный урон"
 game_concept_magic_damage3:0 "чистый урон"
 game_concept_magic_damage_desc:0 "Урон наносится через заклинания, и его величина зависит от уровня связанных элементов. Если заклинание использует урон одного типа, такой урон классифицируется как чистый. Если заклинание содержит комбинацию двух типов урона, один считается основным, а другой — вторичным. Эта классификация урона может быть важна, если одна из сторон использует [magic_shield|E]."
 magic_element_tooltip:0 "#t Уровень элемента#!\nУровень элемента влияет на величину урона, связанного с этим элементом."
