 ev10.19.a:0 "Я просто хочу играть со смертными."
 ev10.19.b:0 "Я вестник гибели."
 ev10.19.c:0 "Власть и знания — вот мои цели."
 ev10.20.desc:0 "Утром вы просыпаетесь в прекрасном настроении, но с огромным провалом в памяти. Вы понятия не имеете, что произошло ночью, но слуги явно вас боятся. Атмосфера вокруг кажется странно напряжённой, но вас это не беспокоит — вы чувствуете, будто с ваших плеч сняли огромный груз."
 ev10.20.a:0 "Какое чудесное утро."
 ev10.21.desc:0 "Пребывание в камере быстро вам наскучило — это даже начало действовать на нервы. Поэтому вы разорвали цепи, выломали дверь и убили нескольких слоняющихся поблизости стражников. Вы сразу почувствовали себя лучше."
 ev10.21.a:0 "Пора домой."
 ev10.21.a_cct:0 "Ваша стража была перебита, а заключённый сбежал!"
 ev10.22.desc:0 "Вы мало что помните о последних нескольких часах, но проснулись покрытым кровью. Весь замок пропах серой, и видны следы разрушений. В одной из комнат были найдены человеческие тела, разорванные на части — их трудно опознать, но несколько стражников и слуг пропали без следа. Свидетели утверждают, что ночью в замок ворвалось существо ростом в два человеческих роста, с пылающими крыльями и огромными когтями, чтобы сеять разрушение."
 ev10.22.a:0 "Пусть стража ищет виновного."
 ev10.22.b:0 "Ну, это был я."
