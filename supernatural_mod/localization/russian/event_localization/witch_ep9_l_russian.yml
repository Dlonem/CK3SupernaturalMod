 ev10.8.title:0 "Контрзаклинание"
 ev10.8.desc1a:0 "Вы чувствуете, что [recipient.GetTitledFirstName] является целью заклинания, это [actor.Custom('LastSpellCast')].\n"
 ev10.8.desc1b:0 "Вы чувствуете, что #N вы являетесь целью заклинания#! — [actor.Custom('LastSpellCast')].\n"
 ev10.8.desc2a:0 "[actor.GetTitledFirstName] кажется тем, кто произнес заклинание. "
 ev10.8.desc2b:0 "Вы не можете определить, кто произнес заклинание. "
 ev10.8.desc3a:0 "Нужно действовать быстро! Правильное контрзаклинание устранит угрозу."
 ev10.8.desc3b:0 "Если вы произнесете подходящее контрзаклинание, [recipient.GetTitledFirstName] будет спасен."
 ev10.8.a:0 "Я попробую контрзаклинание."
 ev10.8.b:0 "Я просто создам антимагический щит."
 ev10.8.b_ct:0 "#P Заклинание будет рассеяно.#!"
 ev10.8.c:0 "Это не моя проблема."
 ev10.8.d:0 "Я буду сопротивляться."
 ev10.8.e:0 "Легко."
 ev10.8.c_ct:0 "#N Заклинание ударит в полную силу.#!"
 spell_countered:0 "Заклинание было нейтрализовано!"
 spell_countered_ct:0 "[magic_counterer.GetTitledFirstName] нейтрализовал ваше заклинание."
 spell_not_countered:0 "Заклинание поразило цель!"
 spell_may_be_countered:0 "#N Это заклинание может быть нейтрализовано!#!"
 spell_cannot_be_countered:0 "#P Это заклинание нельзя нейтрализовать!#!"
 ev4bc.0.desc:0 "\nЦелью заклинания, вероятно, является [spell_target.GetTitledFirstName]."
 remove_mana_after_md_ct3:0 "Дуэль поглотила #N [THIS.ScriptValue('md_mana_cost_rev_plus_value')]#! вашей насыщенности силой."
 ev10.9.title:0 "Магический катаклизм"
 ev10.9.desc:0 "Вы чувствуете прилив огромной энергии — чрезвычайно мощное заклинание, слишком сильное, чтобы его нейтрализовать. Поток разрушительной силы обрушился с небес, и вы ощущаете, как дрожь земли усиливается с каждым мгновением. Надвигается ударная волна..."
 ev10.9.a:0 "Я призову магический щит!"
 ev10.9.a_ct:0 "#N Многие персонажи в вашем местоположении погибнут или получат ранения#!."
 ev10.9.b:0 "Мне нужно найти укрытие!"
 ev10.9.d:0 "Я выдержу."
 witch_amulet:0 "Амулет защиты"
 witch_amulet_desc:0 "Амулет, созданный для защиты от враждебных заклинаний."
 upgrade_amulet_interaction:0 "Объединить амулеты"
 upgrade_amulet_interaction_desc:0 "Вы можете объединить защитные амулеты в один, более мощный."
 AT_LEAST_TWO_AMULETS:0 "У вас должно быть не менее двух неснаряжённых амулетов защиты."
 upgrade_amulet_interaction_ct:0 "Оставшиеся неснаряжённые амулеты будут уничтожены."
 upgrade_amulet_interaction_ct2:0 "Выбранный амулет поглотит их свойства (если он их ещё не имеет)."
 upgrade_amulet_interaction_ct3:0 "Выбранный амулет может получить новые свойства."
 game_concept_undetectable_spells:0 "Незаметные заклинания"
 game_concept_undetectable_spells2:0 "незаметные"
 game_concept_undetectable_spells_desc:0 "Незаметные заклинания не могут быть обнаружены персонажами с магическим чутьём. Однако:\n$EFFECT_LIST_BULLET$ Легендарные маги с магическим чутьём всё ещё могут обнаружить ваши заклинания.\n$EFFECT_LIST_BULLET$ Ваше заклинание будет обнаружено колдуном, который его нейтрализует, но определить, что именно вы его произнесли, будет невозможно."
 undetectable_spells_terrain_cancel_negative_supply:0 "Ваши заклинания [undetectable_spells2|E]"
 game_concept_magic_immunity:0 "Магический иммунитет"
 game_concept_magic_immunity2:0 "Иммунитет"
 game_concept_magic_immunity_desc:0 "Персонаж, защищённый иммунитетом к заклинанию, никогда не может стать его целью."
 immunity_curse_terrain_cancel_negative_supply:0 "[magic_immunity2|E] к обычным проклятиям"
