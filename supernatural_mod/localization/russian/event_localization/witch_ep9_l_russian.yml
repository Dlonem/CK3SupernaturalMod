 ev10.62.title:0 "Выборы"
 ev10.62.desc:0 "Этот саммит магов будет отличаться от других — вместо избрания спикера и голосования по резолюциям будут проводиться выборы нового лидера Высшего совета магов. Все собравшиеся взволнованы — новый лидер может означать перемены для всего магического сообщества."
 ev10.62.a:0 "Я выдвину свою кандидатуру."
 ev10.62.a_ct:0 "Вы будете бороться за должность архимага."
 ev10.63.desc:0 "После жарких дебатов и речей стало ясно, какие маги имеют достаточно поддержки, чтобы баллотироваться на пост архимага. Это:"
 ev10.63.cand1:0 "\n$EFFECT_LIST_BULLET$[ms_cand1.GetTitledFirstName]"
 ev10.63.cand2:0 "\n$EFFECT_LIST_BULLET$[ms_cand2.GetTitledFirstName]"
 ev10.63.cand3:0 "\n$EFFECT_LIST_BULLET$[ms_cand3.GetTitledFirstName]"
 ev10.63.cand4:0 "\n$EFFECT_LIST_BULLET$[ms_cand4.GetTitledFirstName]"
 ev10.63.a:0 "Гонка за власть только началась."
 ev10.64.desc:0 "Настало время голосования — каждый участник саммита может написать одно имя на пергаменте и опустить его в урну для голосования. Маг, набравший наибольшее количество голосов, победит на выборах."
 ev10.64.a:0 "[ms_cand1.GetTitledFirstName] получает мой голос."
 ev10.64.b:0 "Я проголосую за [ms_cand2.GetTitledFirstName]."
 ev10.64.c:0 "[ms_cand3.GetTitledFirstName] должен быть поддержан."
 ev10.64.d:0 "[ms_cand4.GetTitledFirstName] — лучший кандидат."
 ev10.64.e:0 "Я голосую за себя, конечно."
 ms_cand1_votes_counter:0 "Голоса за [ms_cand1.GetTitledFirstName]: [ms_cand1.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand2_votes_counter:0 "Голоса за [ms_cand2.GetTitledFirstName]: [ms_cand2.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand3_votes_counter:0 "Голоса за [ms_cand3.GetTitledFirstName]: [ms_cand3.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand4_votes_counter:0 "Голоса за [ms_cand4.GetTitledFirstName]: [ms_cand4.MakeScope.Var('my_arch_votes').GetValue]"
 mage_summit_archmage_elected_title:0 "Новый Архимаг избран!"
 ev7.111.b_ct:0 "[mage0.GetTitledFirstName] будет голосовать за вас."
 ev10.65.a:0 "Я принимаю эту честь."
 ev10.65.b:0 "Меня не интересует политика."
 ev10.66.desc:0 "Вам нужно найти как можно больше сторонников, если вы серьёзно планируете стать архимагом. [guest0.GetTitledFirstName] кажется человеком, поддающимся вашему влиянию."
 ev10.66.a:0 "Я предложу услугу в будущем."
 ev10.66.a_ct:0 "[guest0.GetTitledFirstName] проголосует за вас."
 ev10.67.a_ct:0 "[guest1.GetTitledFirstName] проголосует за вас."
 ev10.66.b:0 "Я просто хочу завоевать расположение [guest0.GetHerHis]."
 ev10.67.desc:0 "Вы не уверены, удалось ли вам собрать достаточно сторонников, чтобы быть избранным архимагом. К счастью, ещё есть несколько человек, которых вы можете убедить."
 ev10.67.a:0 "Пора раздавать взятки."
 ev10.67.b:0 "Я постараюсь произвести хорошее впечатление."
 ev10.67.c:0 "Если они умны, они проголосуют за меня."
 ev10.68.title:0 "Агитация"
 ev10.68.desc:0 "Вы видите, как [guest0.GetTitledFirstName] разговаривает с другими ведьмами — похоже, [guest0.GetSheHe] пытается убедить их голосовать за [guest0.GetHerHim]. Ведьмы проявляют вежливый интерес, но не выглядят убеждёнными."
 ev10.68.a:0 "У меня тоже есть что сказать."
 ev10.68.b:0 "Я укажу на некомпетентность [guest0.GetHerHis]."
 ev10.68.c:0 "Я выражу одобрение кандидатуры [guest0.GetHerHis]."
 ev10.68.d:0 "Я останусь нейтральным."
 ev10.68.e:0 "Очевидно, я был бы гораздо лучшим архимагом."
 ev10.69.desc:0 "В какой-то момент [guest0.GetTitledFirstName] подходит к вам и начинает осторожный разговор. Вы видите, что [guest0.GetSheHe] пытается выяснить, собираетесь ли вы голосовать за [guest0.GetHerHim]."
 ev10.69.a:0 "Моя поддержка недешево стоит."
 ev10.69.a_ct:0 "Вы обещаете проголосовать за [guest0.GetHerHim]."
 ev10.69.b:0 "Может, услуга за услугу?"
 ev10.69.c:0 "Ты мне нравишься, у тебя есть мой голос."
 ev10.69.d:0 "Здесь есть кандидаты получше тебя."
 transfer_to_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] переводит [gold_i]$VALUE|+0$ в [mc_funds|E]"
 take_from_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] получает [gold_i]$VALUE|+0$ из [mc_funds|E]"
 increase_mc_funds_effect_ct:0 "[mc_funds|E] увеличены на [gold_i]$VALUE|+0$ золота"
 decrease_mc_funds_effect_ct:0 "[mc_funds|E] уменьшены на [gold_i]$VALUE|-0$ золота"
 ev10.70.desc:0 "Совету нужны деньги для работы. К счастью, есть несколько способов их добыть — сотрудничество с венецианскими банкирами, торговые операции, более или менее рискованные инвестиции. Иногда магия или пожертвования других магов также могут пополнить бюджет."
 ev10.70.a:0 "Я поищу возможности на рынке."
 ev10.70.b:0 "Мы будем зарабатывать на ростовщичестве."
 ev10.70.c:0 "У меня есть несколько идей."
 ev10.70.d:0 "Это будет рискованная инвестиция."
 ev10.70.e:0 "Никто не заметит, если немного золота пропадёт."
 mc_donate_funds_decision_name:0 "Сделать пожертвование Высшему совету"
 mc_donate_funds_decision_desc:0 "Хотя совет основывает свою власть на магии, золото также является важной опорой. Поэтому финансовая поддержка всегда приветствуется."
 mc_donate_funds_decision_ct:0 "Любой жертвователь может попросить поддержки у Архимага."
 decision_group_type_mc_decisions:0 "$mc_full_name$"
 ev7.105.dx:0 "Высшему совету нужны средства для эффективной работы."
 ev10.71.desc:0 "Быть архимагом — иногда тяжёлая ответственность. С самого начала саммита вас окружают множество ведьм, желающих завоевать вашу симпатию или обсудить не столь важные вопросы. Однако есть и преимущества — собрание внимательно вас слушает и открыто к вашим предложениям."
 ev10.71.a:0 "Устроим большую дискуссию о магии!"
 ev10.71.b:0 "Они знают, что я самый могущественный маг."
 ev10.71.c:0 "Я использую это, чтобы завести новых друзей."
 ev10.71.d:0 "Я уже сыт по горло этой толпой."
 ev10.71.e:0 "Я дам понять, что беспокоить меня ерундой небезопасно."
 ev10.72.title:0 "Обязанности Высшего совета"
 ev10.72.desc:0 "Из-за вашего особого положения в Высшем совете многие хотят обсудить с вами вопросы, которые считают важными. Среди них [guest0.GetTitledFirstName], который пожаловался вам на охотников за ведьмами — [guest0.GetSheHe] едва спасся [guest0.GetHerHis] жизнью, когда один из них недавно пытался убить [guest0.GetHerHim]. По мнению [guest0.GetHerHis], Высший совет должен что-то с этим сделать."
 ev10.72.a:0 "Я подниму этот вопрос на заседании Высшего совета."
 ev10.72.d:0 "Я обсужу это с Архимагом."
 ev10.72.b:0 "У совета слишком мало средств, чтобы эффективно бороться с охотниками."
 ev10.72.c:0 "Вы получите финансирование на личную охрану."
 sponsor_demon_fighting_modifier:0 "Спонсор борьбы с демонами"
 ev10.73.title:0 "Заговор"
 ev10.73.desc:0 "[guest0.GetTitledFirstName] настоял на приватном разговоре, в котором раскрыл [guest0.GetHerHis] сомнения по поводу текущего архимага, [amage.GetShortUIName]. По мнению [guest0.GetHerHis|U], [amage.GetShortUIName] следует устранить — любой ценой, ради блага всего сообщества. [guest0.GetShortUIName] рассчитывает на вашу поддержку..."
 ev10.73.a:0 "Можешь рассчитывать на меня."
 ev10.73.b:0 "Верно, но твой путь слишком радикален."
 ev10.73.c:0 "Ты ошибаешься, архимаг — правильный лидер."
 ev10.74.desc:0 "Как член Высшего совета, вы имеете право на возмещение части расходов на организацию саммита магов. Собираетесь ли вы воспользоваться этой привилегией?"
 ev10.74.a:0 "Нет, совету нужны эти деньги."
 ev7.105.k:0 "Архимагу следует предоставить чрезвычайные полномочия для эффективных действий."
 ev7.105.k_ct:0 "Архимаг может требовать подчинения от ведьм и магов"
 MAGE_DUEL_O1A:0 "Дуэль в указанном месте"
 MAGE_DUEL_O3b:0 "Заставить провести дуэль (в указанном месте)"
 MAGE_DUEL_O5:0 "Пообещать не использовать Сингулярность"
 MAGE_DUEL_O5_ct:0 "Использование Древних Сингулярностей будет запрещено"
 md_duel_in_my_location_ct:0 "Магическая дуэль пройдёт в [actor.location.GetName]"
 md_duel_in_your_location_ct:0 "Магическая дуэль пройдёт в [recipient.location.GetName]"
 demand_submission_archmage_interaction:0 "$demand_submission_cgm_interaction$"
 demand_submission_archmage_interaction_desc:0 "Каждый член магического сообщества обязан вам подчиняться."
 ARCH_DEM_O1:0 "Будь послушным"
 ARCH_DEM_O2:0 "Завершай свои войны"
 ARCH_DEM_O2_ct:0 "Попытается договориться о белом мире."
 ev10.76.title:0 "Мирные переговоры"
 ev10.76.desc:0 "Архимаг потребовал, чтобы вы немедленно прекратили свои войны. В соответствии с этим желанием вы подготовили письма, предлагающие белый мир вашим противникам."
 ev10.76.a:0 "Посмотрим, каким будет ответ."
 ev10.76.a_ct:0 "[THIS.Char.GetTitledFirstName] рассмотрит предложение о белом мире."
 ev10.77.desc:0 "Наша война бессмысленна, и лучше прекратить её как можно скорее. Я предлагаю белый мир."
 ev10.77.a:0 "Статус-кво не будет."
 ev10.77.a_ct:0 "Ваше предложение было отклонено."
 demand_submission_archmage_reaction:0 "#N Высший совет может пожелать наказать за неподчинение#!"
 ev10.78.title:0 "Отклонённое требование"
 ev10.78.desc:0 "[recipient.GetTitledFirstName] отказался подчиниться вашей воле. Это вопиющее нарушение существующих правил."
 ev10.78.a:0 "[recipient.GetSheHe|U] будет исключён из сообщества."
 ev10.78.b:0 "На этот раз инцидент будет забыт."
 ev10.78.c:0 "Чёрный маг должен арестовать [recipient.GetHerHim]."
 ev10.78.c_ct:0 "Чёрный маг попытается арестовать цель."
 ev10.78.c_ct2:0 "Это может привести к магической дуэли и смерти одного из магов."
 ev10.79.desc:0 "[recipient.GetTitledFirstName] нарушил правила и должен быть наказан. Как Чёрный маг, вы обязаны арестовать [recipient.GetHerHim]."
 ev10.79.a:0 "Как пожелаете, архимаг."
 ev10.79.b:0 "Знаете, я отказываюсь от должности Чёрного мага..."
 ev10.79.b_ct:0 "Чёрный маг отказывается"
 ev10.79.a_ct:0 "Вы отправляетесь арестовать [recipient.GetTitledFirstName]"
 ev10.79.a_ct1:0 "Цель сдастся без боя"
 ev10.79.a_ct2:0 "Цель будет сопротивляться"
 ev10.80.desc:0 "[bmage.GetTitledFirstName] предстал перед вами. [bmage.GetSheHe|U] заявил, что явился как представитель Высшего совета магов, чтобы арестовать вас за нарушение правил. Если вы не сдадитесь немедленно, вас ждёт дуэль."
 ev10.80.a:0 "Спокойно, я сдаюсь."
 ev10.81.title:0 "Тайное собрание"
 ev10.81.desc1:0 "Тайное собрание Высшего совета магов началось. Каждый член совета предстаёт перед вами в виде иллюзии; вы можете слышать и видеть друг друга, как будто находитесь в одной комнате. Удивительно, что магия позволяет беспрепятственно общаться на любом расстоянии — обычным людям никогда не будут доступны подобные способности."
 ev10.81.desc0:0 "Члены Высшего совета, как обычно, появились в виде иллюзий. Похоже, можно начинать собрание."
 ev10.81.desc2:0 "Для начала архимаг хочет заслушать доклады всех членов Высшего совета."
 ev10.81.a:0 "Я хочу услышать ваши доклады."
 ev10.81.b:0 "Итак, кто первый?"
 ev10.81.c:0 "Я представлю точный доклад."
 ev10.82.desc0:0 "Сначала [admin.GetTitledFirstNameNoTooltip] кратко изложил текущую ситуацию.\n"
 ev10.82.desc1:0 "В нескольких словах вы представили текущую ситуацию Высшему совету.\n"
 ev10.82.desc2:0 "\n$mc_gold_desc$: $mc_gold$"
 ev10.82.desc3:0 "\nОбеспеченные магические артефакты: [admin.MakeScope.Var('art_counter').GetValue]"
 ev10.82.desc4:0 "\nКонтролируемые места силы: [admin.MakeScope.Var('ppower_counter').GetValue]"
 ev10.82.desc5:0 "\nИзвестные маги: [admin.MakeScope.Var('mages_counter').GetValue]"
 ev10.82.desc6:0 "\nОбнаруженные демоны: [admin.MakeScope.Var('demons_counter').GetValue]"
 ev10.82.desc7:0 "\n\nТеперь ваша очередь представить доклад."
 ev10.82.a:0 "Мне нечего добавить."
 ev10.82.b:0 "Некоторые цифры вызывают беспокойство."
 ev10.82.c:0 "[loremaster.GetShortUINameNotMe], теперь твоя очередь."
 ev10.82.d:0 "Мы обсудим результаты моих исследований."
 ev10.82.e:0 "Пока мне нечего сказать."
 ev10.83.desc0:0 "[loremaster.GetTitledFirstNameNoTooltip] выступил. [loremaster.GetSheHe|U] представил свои исследовательские выводы, которые выглядят многообещающими. [loremaster.GetTitledFirstNameNoTooltip] заявил, что [loremaster.GetSheHe] продолжит свою работу."
 ev10.83.desc1:0 "[loremaster.GetTitledFirstNameNoTooltip] выступил. [loremaster.GetSheHe|U] сказал, что [loremaster.GetSheHe] проводит некоторые исследования, но пока [loremaster.GetSheHe] не готов поделиться результатами [loremaster.GetHerHis] работы."
 ev10.83.desc2:0 "Похоже, теперь ваша очередь доложить."
 ev10.83.a:0 "Хорошо. [bmage.GetShortUINameNotMe]?"
 ev10.83.b:0 "Понятно. [bmage.GetShortUINameNotMe]?"
 ev10.83.c:0 "Хм..."
 ev10.83.d:0 "Охотники за ведьмами в последнее время усилили свою активность."
 ev10.83.d_ct:0 "Архимаг может принять решение по этому вопросу."
 ev10.83.e:0 "Демоны сейчас — главная угроза."
 ev10.83.f:0 "На данный момент угроз нет."
 ev10.83.g:0 "Мои шпионы добыли полезную информацию."
 ev10.84.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] сообщил, что активность охотников за ведьмами в последнее время значительно возросла. [bmage.GetSheHe|U] заявил, что [bmage.GetSheHe] будет внимательно следить за ситуацией."
 ev10.84.a:0 "Найдите их и убейте."
 ev10.84.a_ct:0 "[bmage.GetShortUINameNotMe] попытается устранить некоторых охотников с помощью магии или интриг."
 ev10.84.b:0 "Я займусь этим лично."
 ev10.84.c:0 "Совет назначит награды за головы охотников."
 ev10.84.c_ct:0 "Число охотников может немного сократиться."
 ev10.84.d:0 "Да, пока следите за ними."
 ev10.84.desc1:0 "[bmage.GetTitledFirstNameNoTooltip] сообщил, что демоны создают некоторые проблемы. Возможно, стоит скоординировать усилия, чтобы их остановить."
 ev10.84.e:0 "Я ожидаю, что вы все предпримете какие-то действия."
 ev10.84.e_ct:0 "Члены совета будут чаще использовать заклинание изгнания."
 ev10.84.desc2:0 "[bmage.GetTitledFirstNameNoTooltip] сообщает, что [bmage.GetHerHis] шпионы перехватили некоторую информацию, возможно, она будет полезна."
 ev10.84.desc3:0 "[bmage.GetTitledFirstNameNoTooltip] сообщает, что проблем нет — в настоящее время нет серьёзной угрозы для совета, ситуация под контролем."
 ev10.84.desc4:0 "Архимаг решил, что [bmage.GetTitledFirstNameNoTooltip] должен решить проблему грубой силой."
 ev10.84.desc5:0 "Архимаг решил заняться проблемой лично."
 ev10.84.desc6:0 "Архимаг решил, что совет назначит награду за головы охотников за ведьмами."
 ev10.84.desc7:0 "Архимаг решил, что совет будет ждать развития ситуации."
 ev10.84.f:0 "Ожидание может быть рискованным..."
 ev10.84.desc8:0 "Архимаг решил, что весь совет должен сосредоточиться на этой проблеме."
 ev10.85.desc0:0 "Теперь настало время для второй части собрания — обсуждения оставшихся вопросов и рассмотрения предложений от членов совета."
 ev10.85.a:0 "Есть ли вопросы, которые вы хотите обсудить?"
 ev10.85.b:0 "Нам нужно обсудить текущий кризис."
 ev10.86.desc0:0 "Есть ли темы, которые вы хотите затронуть?"
 ev10.86.title:0 "Ваши предложения"
 ev10.86.a:0 "Я слышал о источнике, который, возможно, требует внимания."
 sm_archmage_rejection_ct:0 "#N Архимаг отклонил это предложение.#!"
 sm_archmage_rejection_ct1:0 "#N Архимаг отклоняет вашу петицию.#!"
 sm_archmage_rejection_ct0:0 "#N Вы отклоняете предложение.#!"
 ev10.86.b:0 "Мне нужны средства для моих исследований."
 ev10.86.c:0 "Мы должны внедрить программу развития."
 mc_development_modifier:0 "Координированное развитие"
 ev10.86.d:0 "У меня нет предложений."
 ev10.86.e:0 "Я могу создать отряд боевых големов для совета."
 ev10.86.e_ct:0 "Каждый член совета получит небольшой отряд големов."
 ev10.86.f:0 "Мы должны избрать ректора магической академии."
 rector_magic_academy_modifier:0 "Ректор магической академии"
 ev10.86.f_ct:0 "Кто-то другой будет избран ректором."
 ev10.87.title:0 "Ответ Архимага"
 ev10.87.desc0:0 "«Есть ребёнок с особыми способностями к магии», — сказал [loremaster.GetTitledFirstNameNoTooltip]. — «Без заботы опытного мага [source_child.GetTitledFirstName] представляет опасность для окружающих. Может, кто-то из нас возьмёт это на себя?»"
 ev10.87.desc1:0 "«Мои исследования требуют значительного финансирования», — сказал [loremaster.GetTitledFirstNameNoTooltip]. — «Могу ли я рассчитывать на финансовую поддержку?»"
 ev10.87.desc2:0 "«Я разработал некоторые научные процедуры, которые могут быть полезны для исследований и управления», — сказал [loremaster.GetTitledFirstNameNoTooltip]. — «К сожалению, их внедрение может потребовать золота.»"
 ev10.87.desc4:0 "«Если совет предоставит мне нужные материалы, я смогу создать отряд боевых големов для каждого из нас», — сказал [loremaster.GetTitledFirstNameNoTooltip]. — «Это усилит наш потенциал.»"
 ev10.87.desc5:0 "«Поскольку мы контролируем Академию магии, нам следует назначить компетентного ректора для её управления. Я вызываюсь на эту роль.»"
 ev10.87.a:0 "Позаботьтесь об этом."
 ev10.87.b:0 "Я с радостью возьму ученика."
 ev10.87.c:0 "Это задача для [bmage.GetShortUINameNotMe]."
 ev10.87.d:0 "Возможно, [admin.GetShortUINameNotMe] найдёт время для этого."
 ev10.87.e:0 "Вы получите финансирование."
 ev10.87.f:0 "Это не наше дело."
 ev10.87.g:0 "У нас есть более важные расходы."
 ev10.87.desc3:0 "Архимаг принял решение по этому вопросу."
 ev10.87.desc3x:0 "Архимаг принял решение."
 ev10.87.h:0 "Это правильное решение."
 ev10.87.i:0 "Ты очевидный выбор для этой роли."
 ev10.87.j:0 "Я возьму на себя эту обязанность."
 ev10.87.k:0 "[bmage.GetShortUINameNotMe] будет хорошим ректором."
 ev10.87.l:0 "Я знаю подходящего кандидата."
 ev10.88.desc0:0 "Вопросительный взгляд архимага устремляется на вас."
 ev10.88.desc:0 "$ev10.88.desc0$ $ev10.86.desc0$"
 ev10.88.a:0 "[magic_art.GetName] должен принадлежать совету."
 ev10.88.b:0 "Совет должен поддержать [war_ruler.GetTitledFirstName]."
 ev10.88.c:0 "Мне нужно золото для зелий."
 ev10.88.d:0 "[troublemaker.GetTitledFirstName] создаёт проблемы, нужно что-то с этим сделать."
 ev10.88.d_ct:0 "[bmage.GetShortUIName|U] будет отправлен арестовать цель."
 ev10.88.d_ct2:0 "#N Может произойти магическая дуэль.#!"
 ev10.89.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] взял слово.\n"
 ev10.89.desc1:0 "«[magic_art.GetName] должен принадлежать совету. Я считаю, что я лучше всего подхожу для охраны этого артефакта.»"
 ev10.89.desc2:0 "«[war_ruler.GetTitledFirstName] — правитель, чьи интересы в некоторых вопросах совпадают с нашими. Я считаю, что мы должны незаметно поддержать [war_ruler.GetHerHim], чтобы сохранить стабильность в регионе.»"
 ev10.89.desc3:0 "«Как Чёрный маг, я всегда должен быть готов к действиям. Я хотел бы, чтобы совет покрыл расходы на покупку зелий, которые помогут мне поддерживать эту готовность.»"
 ev10.89.desc4:0 "«[troublemaker.GetTitledFirstName] создаёт проблемы, безрассудно накладывая заклинания на случайных людей, словно безумец. [troublemaker.GetSheHe|U] портит репутацию всех уважаемых магов и подрывает наш авторитет. Мы должны что-то с этим сделать.»"
 ev10.89.a:0 "Совет поддерживает ваши притязания."
 ev10.89.b:0 "Ну... нет."
 ev10.89.c:0 "Я согласен с этим предложением."
 ev10.89.d:0 "Я предпочитаю поддерживать врагов [war_ruler.GetHerHis]."
 ev10.89.e:0 "Я не вижу здесь выгоды для совета."
 ev10.89.f:0 "Купи и мне одно."
 ev10.89.g:0 "Ладно, я сделаю покупки за свой счёт."
 ev10.89.h:0 "Хорошо, разберитесь с [troublemaker.GetHerHim]."
 ev10.89.i:0 "Я не вижу в этом проблемы."
 troublemaker_arrested:0 "Нарушитель арестован"
 ev10.90.a:0 "Нам нужно укрепить наш бюджет."
 ev10.90.b:0 "Совет должен раскрыть своё существование остальному миру."
 ev10.90.b_ct:0 "Мир узнает о существовании Высшего совета."
 ev10.90.b_ct2:0 "Каждый правитель сможет финансировать совет (и, возможно, рассчитывать на его поддержку)."
 ev10.90.b_ct3:0 "Охотники за ведьмами могут заинтересоваться членами совета."
 mc_approval:0 "Одобрение"
 mc_rejection:0 "Отказ"
 ev10.90.c:0 "Нам нужно укрепить наше влияние в [target.GetName]."
 ev10.90.d:0 "[pvassal.GetTitledFirstName] станет нашей марионеткой, если мы поддержим [pvassal.GetHerHim]."
 ev10.90.e:0 "Мы должны нанести удар по [admin_rival.GetTitledFirstName]."
 ev10.91.desc0:0 "$mc_admin_modifier$, [admin.GetTitledFirstNameNoTooltip], решил выдвинуть своё предложение.\n"
 ev10.91.desc1:0 "«Наша казна в плачевном состоянии. Я предлагаю каждому из нас внести 20% своих средств в совет.»"
 ev10.91.desc2:0 "«$ev10.90.b$ Это облегчит нам влияние на других правителей — иногда некоторые вопросы проще решать официально и дипломатично, чем через манипуляции и тёмные методы.»"
 ev10.91.desc3:0 "«$ev10.90.c$ Раздача нескольких взяток сделает многих важных людей более послушными нашим предложениям.»"
 ev10.91.desc4:0 "«Недавно я установил контакт с [pvassal.GetTitledFirstName]. [pvassal.GetSheHe|U] кажется хорошим кандидатом на роль нашей марионетки. Возможно, мы могли бы посадить [pvassal.GetHerHim] на трон?»"
 ev10.91.desc5:0 "«Есть человек, который мешает нашим интересам — [admin_rival.GetTitledFirstName]. Мы должны нанести удар по этому нарушителю. Давайте используем наше влияние, чтобы уничтожить репутацию [admin_rival.GetHerHis].»"
 ev10.91.a:0 "Сейчас не подходящий момент."
 ev10.91.b:0 "Звучит неплохо."
 ev10.91.c:0 "Да, мы дёрнем за нужные ниточки."
 ev10.91.d:0 "[admin_rival.GetTitledFirstName] — не наш враг."
 amage_rep1_admin_rep6_ct:0 "Совет использовал своё влияние, чтобы саботировать репутацию правителя."
 ev10.92.title:0 "Конец собрания"
 ev10.92.desc:0 "Похоже, все важные темы уже обсуждены. Пора возвращаться к обычным обязанностям."
 ev10.92.a:0 "Я объявляю собрание закрытым."
 ev10.92.a_ct:0 "Тайное собрание подходит к концу."
 ev10.92.b:0 "Пора возвращаться к повседневной жизни."
 ev10.93.title:0 "Из тени"
 ev10.93.desc:0 "Уже некоторое время ходят слухи о существовании секретной организации, которая манипулирует правителями и тонко влияет на ход событий. Эти слухи отрицались великими мира сего, но до сегодняшнего дня. Секретная организация, называющая себя Высшим советом магов, решила раскрыть своё существование. Неизвестно, как долго её интриги направляли геополитику или как далеко простирается её влияние — однако многие утверждают, что мощь Высшего совета превосходит мощь многих империй. Несомненно, эта организация найдёт множество сторонников, а также противников."
 ev10.93.a:0 "Это только начало."
 ev10.93.b:0 "Совет делает смелый шаг."
 ev10.93.c:0 "Это меняет всё."
 ev10.94.title:0 "Чрезвычайные меры"
 ev10.94.desc0:0 "Архимаг затронул текущий кризис — ситуация очень серьёзна.\n"
 ev10.94.desc1:0 "Совет согласился, что необходимо принять чрезвычайные меры, чтобы полностью устранить угрозу."
 ev10.94.a:0 "Мне нужна ваша безоговорочная поддержка."
 ev10.94.b:0 "Я использую все ресурсы, чтобы остановить угрозу."
 ev10.94.c:0 "Будем надеяться, что этого достаточно."
 ask_mc_for_support_interaction:0 "Попросить поддержки Высшего совета"
 ask_mc_for_support_interaction_desc:0 "[high_mage_council|E] может поддерживать своих сторонников множеством способов."
 ask_mc_for_support_interaction_ct:0 "Архимаг рассмотрит вашу петицию."
 ARCHMAGE_BUSY_TEXT:0 "Архимаг в настоящее время не принимает петиции."
 MC_NO_FUNDS_TEXT:0 "У Высшего совета нет средств для поддержки."
 MC_YOU_ARE_EXC_TEXT:0 "Вы исключены из магического сообщества."
 mc_support_o1:0 "Попросить защиты"
 mc_support_o2:0 "Попросить финансирование исследований"
 mc_support_o3:0 "Попросить доступ к месту силы"
 mc_support_o4:0 "Попросить придворного мага"
 mc_support_o5:0 "Попросить поддержки в войне"
 mc_protection_modifier:0 "Под защитой Высшего совета"
 mc_place_of_power_modifier:0 "Доступ к месту силы"
 mc_support_o4_ct:0 "#P К вашему двору присоединится искусный чародей.#!"
 mc_support_o5_ct:0 "#P Архимаг ослабит ваших врагов заклинанием или присоединится к войне.#!"
 ev10.95.desc:0 "Я пишу вам как учёный в области магии и член сообщества ведьм и магов.\n"
 ev10.95.desc1:0 "Я пишу вам как верный сторонник Высшего совета магов, я признаю ваше влияние и знаю, что вы — сила, с которой следует считаться. Надеюсь, вы оцените мою поддержку и в ответ поможете мне в одном деле.\n"
 ev10.95.desc2:0 "Я опасаюсь за свою жизнь — мои враги жаждут моей смерти. Я хотел бы попросить, чтобы совет использовал магические или обычные средства для защиты своего союзника."
 ev10.95.a:0 "Мы отправим несколько агентов."
 ev10.95.b:0 "...чтобы они были нашими глазами в регионе."
 ev10.95.c:0 "Нет, мы не союзники."
 ev10.95.d:0 "У меня нет времени на ерунду."
 ev10.95.d_ct:0 "В течение следующих пяти лет все подобные петиции будут автоматически отклоняться."
 ev10.96.desc:0 "Исследования, которые я сейчас провожу, требуют значительного финансирования. Могу ли я рассчитывать на поддержку Высшего совета?"
 ev10.97.desc:0 "Заниматься колдовством будет гораздо проще, если у меня будет доступ к месту силы. Могу ли я использовать ваше?"
 ev10.98.desc:0 "Мне срочно нужен компетентный придворный маг. Может ли совет назначить кого-нибудь? Я с радостью отплачу золотом."
 ev10.98.a:0 "Я займусь этим сам."
 ev10.98.b:0 "Я уговорю [c1.GetTitledFirstName]."
 ev10.98.c:0 "[c2.GetTitledFirstName] может быть заинтересован."
 ev10.98.d:0 "Я поговорю с [c3.GetTitledFirstName]."
 ev10.98.e:0 "У нас нет доступных магов."
 ev10.99.desc:0 "Мне нужна поддержка в моих военных усилиях. Наверняка совет может помочь мне в моих военных кампаниях?"
 ev10.99.a:0 "Мы можем предложить финансовую поддержку."
 ev10.99.b:0 "Я использую заклинание торнадо."
 ev10.99.c:0 "Я просто присоединюсь к этой войне."
 ev10.99.d:0 "Мы не можем вам помочь."
 ev10.100.desc:0 "Ваша сила огромна и простирается далеко. Многие считают, что вы — самое могущественное существо в этом мире."
 ev10.100.a:0 "Я тоже так думаю."
 ev10.100.b:0 "Моя сила значительна, но я не бог."
 trait_track_necromancer2:0 "Тёмные силы"
 trait_track_necromancer2_desc:0 "Силы пассивно растут со временем."
 necromancer2_special1_terrain_cancel_negative_supply:0 "[necrotic_element_i|E]Урон от [necrotic_element|E] не влияет на вашу выносливость"
 necromancer2_special2_terrain_cancel_negative_supply:0 "Открывает заклинание #italic $death_wish$#!"
 magic_inception_interaction:0 "Внушение"
 magic_inception_interaction_desc:0 "Магическое внушение позволяет внедрить мысль в голову цели, которую цель воспримет как свою собственную. Это высшая форма магической манипуляции."
 magic_inception_terrain_cancel_negative_supply:0 "Открывает заклинание #italic $magic_inception_interaction$#!"
 magic_inception_option_title:0 "Внедрённая мысль"
 magic_inception_o1:0 "«Насилие — не решение.»"
 magic_inception_o2:0 "«Я устал править, так устал...»"
 magic_inception_o3:0 "«Я достигну истинного величия!»"
 magic_inception_o4:0 "«Я так потерян.»"
 magic_inception_o5:0 "«Я должен быть более понимающим к другим.»"
 magic_inception_o6:0 "«Я должен исповедаться в своих грехах.»"
 magic_inception_o7:0 "«Кажется, я кому-то должен услугу.»"
 magic_inception_o6_ct:0 "Раскрывает все личные секреты"
 magic_inception_o4_ct:0 "Завершает все интриги"
 magic_inception_effect_ct:0 "Цель заклинания может изменить личность или принять неожиданные решения."
 antimagic_seal:0 "Антимагическая печать"
 antimagic_seal_desc:0 "Это заклинание заменяет обычную ауру антимагической, которая полностью нейтрализует заклинания в непосредственной близости."
 antimagic_seal_modifier:0 "$antimagic_seal$"
 antimagic_seal_modifier_desc:0 "$antimagic_seal_desc$"
 HAVE_ANTIMAGIC_SEAL:0 "Вы связаны Антимагической печатью!"
 HAS_ANTIMAGIC_SEAL:0 "Цель связана Антимагической печатью!"
 antimagic_seal_terrain_cancel_negative_supply:0 "Открывает заклинание #italic $antimagic_seal$#!"
 antimagic_seal_terrain2_cancel_negative_supply:0 "[magic_immunity2|E] ко #P всем заклинаниям#!"
 antimagic_seal_terrain3_cancel_negative_supply:0 "Немедленно стабилизирует источник"
 antimagic_seal_terrain4_cancel_negative_supply:0 "Нельзя произносить заклинания"
 antimagic_seal_terrain5_cancel_negative_supply:0 "Нельзя участвовать в магических дуэлях"
 ev10.101.desc:0 "Этим утром [golem.GetTitledFirstName] попросил вас о разговоре. [golem.GetSheHe|U] сказал, что [golem.GetSheHe] хотел бы увидеть мир и найти [golem.GetHerHis] предназначение и цель в жизни — [golem.GetSheHe] хотел бы отправиться в путешествие и испытать жизнь, как это делают люди."
 ev10.101.a:0 "Нет, ты мой слуга, и ты нужен здесь."
 ev10.101.b:0 "Если так, удачи."
 ev10.101.c:0 "Прощай, мои мысли будут с тобой."
 ev10.9.c:0 "Антимагическая печать защитит меня, но остальных..."
 ev10.104.desc:0 "Как ткач заклинаний, вы участвуете в ритуале высшего заклинания, которое может иметь огромные, глобальные последствия. [sowner.GetTitledFirstName] контролирует ритуал, и [sowner.GetSheHe] получит все выгоды от него. Но является ли [sowner.GetSheHe] подходящей персоной для управления такой силой? Вы могли бы незаметно внести несколько изменений в ритуал, которые позволили бы вам захватить контроль над его эффектами. Другие могут расценить это как предательство, но, возможно, приз стоит риска."
 ev10.104.0.a:0 "Я должен это сделать."
 ev10.104.0.a_ct:0 "Если ритуал будет успешен, вы будете контролировать его результаты."
 ev10.104.0.a_ct2:0 "Другие маги сочтут ваше действие предательством."
 ev10.104.0.b:0 "Нет, мне важна моя репутация."
 ev10.105.title:0 "Высшее заклинание — Предатель"
 ev10.105.desc:0 "Ритуал высшего заклинания сложен, поэтому вы не сразу заметили, что что-то не так. Кто-то тайно внёс изменения в заклинание. Если ритуал завершится, вы потеряете контроль над заклинанием — кто-то другой захватит его и использует в своих целях. Это должен быть один из ваших ткачей заклинаний. Нет способа определить, кто предатель, но единственный способ сорвать их планы — исключить их из ритуала, пока не поздно."
 ev10.105.0.a:0 "Я не доверяю [sw1.GetTitledFirstName]."
 ev10.105.0.b:0 "[sw2.GetTitledFirstName] будет исключён."
 ev10.105.0.c:0 "Мы справимся без [sw3.GetTitledFirstName]."
 ev10.106.desc:0 "Заклинание удалось, но предатель захватил контроль над ним. Это был [straitor.GetTitledFirstName]! Теперь сила Высшего заклинания будет служить целям [straitor.GetHerHis]."
 ev10.106.0.a:0 "Это было коварно."
 ev10.106.0.b:0 "[straitor.GetSheHe|U] заплатит за это."
 ev10.107.desc:0 "Сегодня ваши сны были полны жестокости, крови и насилия. Проснувшись, вы обнаружили, что на ваших руках кровь. Вы ничего не помните, но утром все говорят только о жестоких убийствах, произошедших в округе. Судя по всему, это сделал какой-то дикий зверь, потому что тела разорваны на части."
 ev10.107.a:0 "В любом случае, я чувствую себя гораздо лучше, чем вчера."
 ev10.108.desc:0 "Новость о смерти двух человек потрясла округу. Неизвестно, кто за это ответствен, возможно, дикие звери, потому что тела в ужасном состоянии. Однако слухи говорят, что это дело рук монстра... или демона."
 ev10.108.a:0 "Лучше предупредить стражу, чтобы была начеку."
 ev10.108.b:0 "Раны действительно указывают на демона."
 harmonius_name:0 "Гармониус"
 ev10.109.desc:0 "В круге призыва появился демон. Его чешуйчатое лицо озарилось нездоровым энтузиазмом при виде вас.\n«Здравствуй, здравствуй! Это я, Гармониус Великолепный, явился по твоему зову!»"
 ev10.109.a:0 "Отлично, что ты можешь мне предложить, демон?"
 ev10.110.desc:0 "Сегодня тебе повезло, ибо ты встретил мастера. Я — победитель тишины, резчик ритма, чародей звука, король сцены и скромный музыкант в одном лице! Моё искусство известно во всех кругах ада; каждый демон знает моё имя и музыкальные таланты! Я рад представить тебе мою фирменную песню, названную: «Песнь жаворонка»."
 ev10.110.a:0 "Почему бы и нет, я послушаю."
 ev10.110.b:0 "Нет, ты должен исполнить моё желание."
 ev10.111.desc0:0 "Демон полностью проигнорировал ваши слова — и начал «петь».\n"
 ev10.111.desc:0 "Сначала вы подумали, что это землетрясение, но это была лишь какофония ужасных звуков, ударившая по вам с силой кузнечного молота. Это трудно назвать музыкой, но она определённо трогает слушателя! Вы понятия не имеете, как одно существо может издавать такие звуки, и не понимаете ни одного слова, если они вообще есть. Всё, что вы знаете, — главная тема состоит из звуков забиваемой свиньи. На самом деле, множества свиней."
 ev10.111.a:0 "Нет... остановись..."
 ev10.112.desc:0 "«Музыка» начала набирать темп. Вы чувствуете, что ваш мозг вот-вот вытечет из ушей, вас тошнит, и вы дрожите всем телом. Внезапно демон перестал издавать звуки, наступила мёртвая тишина, и «артист» поклонился перед вами."
 ev10.112.a:0 "Это худшее, что я когда-либо слышал."
 ev10.112.b:0 "Вдохновляюще."
 ev10.112.c:0 "Прекрасно."
 ev10.113.desc:0 "«Ну, спасибо. Я боялся, что человечество не готово к настоящему искусству, но, похоже, я недооценил вас. Готовы к следующему произведению? Я назвал его «Снежинка», но в аду его зовут «Взрывающаяся голова». Знаете, на моих выступлениях бывали жертвы... но, по сути, это отличная песня, немного сильнее предыдущей. Готовы?»"
 ev10.113.a:0 "Нет, исчезни!"
 ev10.113.b:0 "Ты станешь моим придворным музыкантом."
 ev10.113.c:0 "Уверен, [riv.GetTitledFirstName] захочет это послушать!"
 ev10.113.c_ct:0 "Демон будет отправлен к вашему сопернику."
 ev10.113.d:0 "Позже. А пока ты останешься при моём дворе."
 ev10.114.opening:0 "[riv.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ev10.114.desc:0 "Похоже, это ты отправил ко мне этого проклятого демона. Если это правда, знай, что ты худший подонок этого мира. Я уничтожу тебя."
 ev10.114.a:0 "Я хотел бы получать такие письма почаще."
 ev10.116.title:0 "Разрушенная деревня"
 ev10.116.desc:0 "До вас дошли вести, что одна из деревень под вашей властью была полностью разрушена. Хижины выглядят так, будто их поразил ураган, никто не выжил. Люди говорят, что это гнев Божий, направленный против грешников."
 ev10.116.a:0 "Помолимся о прощении."
 ev10.116.b:0 "Могут быть замешаны сверхъестественные силы."
 ev10.116.c:0 "Я поищу ответы в Сфере Истины."
 ev10.117.desc:0 "Вы смогли использовать Сферу Истины, чтобы заглянуть в прошлое. Вы ясно видите, что [demon1.GetTitledFirstName] ответственен за разрушение деревни. [demon1.GetSheHe|U] впал в демоническую ярость, превратился в настоящего монстра и стёр деревню с лица земли."
 ev10.117.a:0 "Я ожидал чего-то подобного."
 ev10.118.title:0 "Кровожадный вассал"
 ev10.118.desc:0 "Вокруг [demon1.GetTitledFirstName] ходят дурные слухи. Похоже, в [demon1.GetHerHis] землях происходят ужасные вещи: местность обезлюдела, храмы горят в загадочных пожарах, а по ночам из лесов выходят монстры. Однако больше всего подданные боятся самого [demon1.GetTitledFirstName]."
 ev10.118.a:0 "В этих слухах, вероятно, есть доля правды."
 ev10.118.b:0 "В конце концов, [demon1.GetSheHe] — демон."
 ev10.119.title:0 "$trait_demon$"
 ev10.119.desc:0 "В последнее время у вас были проблемы с исчезновением слуг. Были подозрения, что им не нравилась работа, и они ушли, не попрощавшись, но дело случайно прояснилось. Один из слуг (ещё не исчезнувший) нашёл множество человеческих останков в покоях [demon1.GetTitledFirstName]."
 ev10.119.a:0 "Доказательства неопровержимы."
 ev10.119.b:0 "Нет нужды поднимать шум из-за этого."
 ev10.119.a1:0 "Арест прошёл успешно."
 ev10.119.a2:0 "Преступник сбежал."
 ultimate_spell_place_of_power1_modifier:0 "$building_witch_house$"
 ultimate_spell_place_of_power2_modifier:0 "$building_mage_house$"
 ultimate_spell_place_of_power3_modifier:0 "$building_horned_god_house$"
 di_mammon_support_modifier:0 "Поддержка Маммона"
 di_abraxas_support_modifier:0 "Поддержка Абраксаса"
 di_astaroth_support_modifier:0 "Поддержка Астарота"
 ev10.121.title:0 "Апокалипсис"
 ev10.121.desc:0 "До вас дошли ужасные вести о [evil_seed.GetName]. Говорят, что тамошний правитель был свергнут и убит во время дворцового переворота. Теперь там правит неизвестный рыцарь — вместе с небольшой группой сторонников он быстро захватил власть и установил кровавый порядок в землях. Его, предположительно, зовут Баал, хотя неясно, прозвище это или настоящее имя. Говорят, что он не человек, что сталь не может ему навредить, что он способен убивать взглядом и читать мысли. Многие верят, что это исполнение пророчества и предвестник скорого конца света. Как бы то ни было, амбиции Баала велики, его армии растут с каждым днём."
 ev10.121.a:0 "Он может стать угрозой."
 di_supports_title:0 "Баал теряет союзника!"
 di_supports_ct:0 "Баал становится слабее без сторонников."
 ev10.122.desc:0 "Перед вами в магической вспышке появилась Геката.\n«Ух, ты не представляешь, как сложно попасть на Землю, если тебя не призывает маг. Это вызов даже для мастера магии.»"
 ev10.122.a:0 "Что ты здесь делаешь?"
 ev10.123.desc:0 "«Я пришла предупредить тебя. Баал явился.»"
 ev10.123.a:0 "Я слышал кое-какие слухи."
 ev10.124.desc:0 "«Это полномасштабное вторжение. Баал намерен завоевать этот мир и превратить людей в своих рабов — по крайней мере, тех, кто выживет. У него есть ресурсы, чтобы это осуществить.»"
 ev10.124.a:0 "Его нужно остановить."
 ev10.124.b:0 "Почему это моя проблема?"
 ev10.125.desc:0 "«Баал рано или поздно начнёт истреблять местных магов. По сути, вы — единственная угроза для него. Однако у него есть враги и за пределами этого мира, которые шлют тебе свои пожелания. Ты в трудном положении, но — хотя я не могу открыто вмешиваться — я могу передать тебе полезную информацию.»"
 ev10.125.a:0 "Хорошо. Кто такой этот Баал?"
 ev10.126.title:0 "Подготовка к Апокалипсису"
 ev10.126.desc:0 "Он — один из демонических князей, полный амбиций и жажды крови. Он воин и лидер, некогда правивший одним из кругов Ада. Теперь он хочет вернуть себе престиж и ранг. Но это не главная проблема. Согласно старому правилу, Апокалипсис совершается вчетвером. К Баалу присоединились Абраксас, Маммон и Астарот. Вместе они могут легко сокрушить любого врага."
 ev10.126.a:0 "Расскажи мне о Маммоне."
 ev10.126.b:0 "Кто такой Абраксас?"
 ev10.126.c:0 "Что ты знаешь об Астароте?"
 ev10.127.a:0 "Спасибо за информацию."
 ev10.127.desc:0 "Ты не встречался с Маммоном? Он притворяется наивным, но это опытный игрок. Он питается человеческой жадностью и мастер трансмутации. Пока он в игре, у Баала не будет недостатка ни в золоте, ни в союзниках."
 ev10.128.desc:0 "Абраксас — мой вечный соперник. Он очень хотел бы занять моё место при дворе Люцифера в качестве придворного мага, но он и вполовину не так хорош, как я. Хотя, должен признать, он знает несколько неплохих заклинаний. Он, безусловно, защитит Баала от любой магической атаки и может быть опасен даже для обычного мага."
 ev10.129.desc:0 "Астарот, «Адский пёс». Он — главный охотник Ада, наёмник и палач, посылаемый за душами особо упрямых смертных. Он также великий чемпион Люцифера, вероятно, самый эффективный после Кали, «Богоубийцы». Он... Мы когда-то были близки. Очень близки. Поэтому я знаю секрет его силы."
 ev10.129.a:0 "Я понимаю, ты поделишься этим секретом со мной?"
 ev10.130.desc:0 "«Да, но это ничего не изменит. Астарот — антимаг, способный подавлять магию вокруг себя своей волей. Он никогда не говорил, откуда у него эта сила; возможно, это дар какого-то божества. Так что ты не победишь его заклинанием. Ты не победишь его и мечом, поскольку он мастер фехтования с тысячелетним опытом. Ты не застанешь его врасплох, потому что не найдёшь его — он сам тебя найдёт. И это будет твой конец. Он непобедим и неудержим, без единой слабости.»\nВ голосе Гекаты слышится нездоровое восхищение и обожание. Похоже, не все старые чувства забыты."
 ev10.130.a:0 "Похоже, это грозный противник."
 ev10.131.desc:0 "Будем надеяться, что Баал не пошлёт его за тобой. Думаю, даже он его боится. На самом деле, вероятно, все, кроме Люцифера и Асмодея, боятся Астарота."
 ev10.132.desc:0 "«Это всё, что я могу для тебя сделать. Твои шансы невелики, но... надеюсь, у тебя есть туз в рукаве. Удачи.» — после этих слов демонесса исчезла."
 ev10.132.a:0 "Спасибо за веру в меня..."
 ev10.134.desc:0 "Той ночью вы не могли уснуть. Вы ворочались, охваченные предчувствием. Наконец, посреди ночи вы решили прогуляться, чтобы очистить разум. Когда вы вставали с кровати, дверь в вашу спальню взорвалась. Вошёл незваный гость, подобный самой смерти. Инстинктивно вы попытались произнести заклинание, но ваша сила покинула вас. Антимагия! Это был тот демон, о котором говорила Геката. Адский пёс пришёл за вами."
 ev10.134.a:0 "Я схвачу свой меч!"
 ev10.134.b:0 "Быстро, к окну!"
 ev10.134.vamp_escape:0 "Прорвись мимо него к двери!"
 ev10.134.vamp_escape_tt:0 "Вы бросаетесь вперёд — к тому времени, как их сталь вспыхнет, вы уже за порогом благодаря своей сверхъестественной скорости."
 ev10.134.wolf_escape:0 "Прыгни в окно!"
 ev10.134.wolf_escape_tt:0 "Вы плечом выбиваете раму и стекло, тяжело ударяясь о землю, но, к счастью, у вас сверхъестественное исцеление, и вы не оглядываетесь."
 ev10.134.hunter_escape:0 "Бросьте простыни и исчезните!"
 ev10.134.hunter_escape_tt:0 "Вы бросаете простыни им на голову, прерываете визуальный контакт и выскальзываете через выход. Тренировка побеждает браваду."
 ev10.134.demon_escape:0 "Дезаппарируйте."
 ev10.134.demon_escape_tt:0 "Один удар сердца здесь, следующий... где-то ещё. Это апокалипсис — всё дозволено, включая демонов."
 ev10.1344.desc:0 "Вы оторвались от незваного гостя — быстро.\n\nНочь поглощает ваши шаги, когда вы выскальзываете через боковую дверь в сумрак переулка. Без вашей сверхъестественной мощи вы были бы мертвы. Не сегодня."
 ev10.1344.a:0 "Вы выжили, чтобы сражаться в другой день. Так начинается Апокалипсис."
 ev10.1344.a.tt:0 "'Астарот теряет ваш след... пока.' Так начинается Апокалипсис."
 ev10.135.desc:0 "Ваши действия были напрасны. Демон нечеловечески быстр; в один момент он был у двери, а в следующий уже схватил вас за руку и швырнул в стену. Если бы не парализующий страх, боль от сломанных рёбер, вероятно, затмила бы всё остальное. Астарот стоял над вами, готовый сокрушить вас одним движением. Это конец."
 ev10.135.a:0 "Никто не устоит перед моей силой!"
 ev10.135.a_ct:0 "#P Вы ломаете антимагическую силу Астарота!#!"
 ev10.135.b:0 "Погоди! Геката... Геката скучает по тебе!"
 ev10.136.desc:0 "Демон замер на месте. «Что?» — спросил он, удивлённый. Вы чувствуете, что ваше признание отвлекло его, его антимагия на мгновение исчезла. Вы можете произнести заклинание!"
 ev10.137.desc:0 "Ваше заклинание превратило удивлённого демона в кучу пепла. Вы не знаете, был ли он полностью уничтожен или лишь отправлен обратно в ад, но он определённо больше не представляет угрозы."
 ev10.137.a:0 "Так у него всё-таки была слабость."
 astaroth_self_modifier:0 "$astaroth_name$"
 abraxas_self_modifier:0 "$abraxas_name$"
 ev10.138.desc:0 "Геката внезапно появилась перед вами, снова удивив вас. Демонесса выглядит взволнованной.\n«Астарот вернулся в ад, если я правильно понимаю, не по своей воле. Но по своей воле он сразу же пришёл поговорить со мной. Не знаю, что ты ему сказал, но наши отношения изменились к лучшему. С ним я снова чувствую себя на тысячу лет моложе!»"
 ev10.138.a:0 "Рад это слышать..."
 ev10.139.desc:0 "«Я не люблю быть кому-то должной. Возьми это кольцо, и мы в расчёте. Никогда больше не говорим об этом. Прощай.»"
 ev10.139.a:0 "Прощай."
 DS_YOU_HAVE_AS:0 "Боится вашей Древней Сингулярности: $VALUE|=+0$"
 demon_text:0 "демон"
 mortal_text:0 "смертный"
 mortal_or_demon:0 "[ROOT.Char.Custom('GetMortalDemon')]"
 ev10.140.desc:0 "В комнате стало жарко, и запах серы усилился. Внезапно вы услышали треск молнии, и в круге призыва появилась фигура демона.\n«Так ты всё-таки глупец», — сказал Асмодей."
 ev10.140.a:0 "Я хочу бросить тебе вызов!"
 ev10.140.b:0 "Извини, моя ошибка! Исчезни..."
 ev10.140.c:0 "Я убью тебя, ублюдок!"
 ev10.141.desc:0 "«Я только что прибыл, а ты уже выгоняешь меня? Так не встречают гостей. Но у меня есть отличная идея! Тебе, вероятно, не хватает примера для подражания. Я покажу тебе, как выглядит гостеприимство в аду. После тебя.»\nАсмодей щёлкнул пальцами, и ваша жизнь угасла в одно мгновение."
 ev10.142.desc:0 "«Не могли бы вы повторить? Кажется, я вас неправильно понял.»"
 ev10.142.a:0 "Ты... Ты... Ты..."
 ev10.143.desc:0 "«Хм, на мгновение мне показалось, что ты собираешься просить меня не убивать твою семью. Это было бы милое желание. Очень подходящее.»"
 ev10.143.a:0 "$ev10.142.a$!"
 ev10.144.desc:0 "«Я всё ещё не понимаю. Ну, неважно. Пора возвращаться в ад. Думаю, я возьму с собой несколько человек для компании.»\nПосле этих слов демон щёлкнул пальцами и исчез. Вы чувствуете, что произошло что-то очень плохое."
 ev10.145.desc:0 "«Люди рождаются глупцами, и, похоже, большинство из них умирают глупцами. Хорошо, я принимаю твой вызов. Давай сделаем это быстро, у меня сегодня плотный график.»"
 HAS_COUNTERMEASURE_WITHDRAW:0 "Цель имеет [scheme_countermeasure_type_withdraw_from_view|E] [scheme_countermeasure_countermeasure|E]."
 ev10.146.desc:0 "Заклинание изгнания сработало — демон исчез. Похоже, вы выиграли это столкновение..."
 ev10.146.a:0 "Мне нужен вызов побольше."
