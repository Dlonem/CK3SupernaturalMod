 bloodlust_modifier:0 "Жажда крови"
 bloodlust_modifier_desc:0 "Демоны обычно предпочитают насилие как способ решения проблем и удовлетворения своих амбиций. Однако есть те, кто возвёл жестокость и разрушение в ранг искусства, которое само по себе является целью.\n"
 bloodlust_special_terrain_cancel_negative_supply:0 "Снижает стресс при победе в битвах"
 diabolist_modifier:0 "Диаболист"
 diabolist_modifier_desc:0 "Среди демонов есть и более расчётливые и утончённые существа, которые предпочитают хитрость и знание грубой силе.\n"
