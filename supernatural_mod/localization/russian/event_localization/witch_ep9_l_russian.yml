 ev10.1.0.o:0 "Многоступенчатая кинетическая прогрессия сыграет мне на руку."
 ev10.1.0.p:0 "Это будет хорошее начало."
 ev10.1.0.r:0 "...может, просто огненный шар?"
 ev10.1.0.s:0 "Двойная прогрессия высшего порядка с усилением!"
 ev10.1.0.t:0 "Я спланирую одновременную атаку и защиту."
 ev10.1.0.u:0 "Вот как выглядит конец."
 ev10.1.0.w:0 "Ты не сможешь противостоять моей силе."
 ev10.1.0.x:0 "Мне нравится видеть твою беспомощность."
 ev10.1.0.y:0 "Я использую чистую некротическую энергию."
 ev10.1.0.z:0 "Попробуй искаженное пламя."
