 ev10.147.desc:0 "Возвышенная атмосфера Великого Ритуала вдохновила вас на действие. Вы чувствуете, что способны немного улучшить свой защитный амулет."
 ev10.147.a:0 "Я добавлю руну, чтобы укрепить амулет."
 ev10.147.b:0 "Я наполню амулет своей магией."
 ev10.148.desc:0 "Несмотря на хаос битвы, вы заметили [ecommander.GetTitledFirstName]. Добраться до него не составит труда — это идеальная возможность устранить [ecommander.GetHerHim]. Если, конечно, вы сможете с ним справиться..."
 ev10.148.a:0 "Пора для магической дуэли."
 ev10.148.b:0 "Пока я предпочитаю избегать прямого столкновения."
 ev10.149.desc:0 "Вы видите, как [ecommander2.GetTitledFirstName] прорывается к вашей позиции, используя заклинания и [ecommander2.GetHerHis] личную охрану. [ecommander2.GetSheHe|U] направляется прямо к вам, намереваясь бросить вам вызов!"
 threaten_with_magic_interaction:0 "Угрожать магией"
 threaten_with_magic_interaction_desc:0 "Дайте понять, что вы используете чёрную магию, если ваши требования не будут выполнены. Конечно, ваша угроза может быть блефом (особенно если у вас нет магических сил)."
