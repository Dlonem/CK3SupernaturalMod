 mc_archmage_modifier:0 "Архимаг"
 mc_archmage_modifier_desc:0 "Архимаг возглавляет Высший совет магов — ни одно важное решение совета не может быть принято без его одобрения. Обычно это самый могущественный или влиятельный из магов."
 mc_loremaster_modifier:0 "Мастер знаний"
 mc_loremaster_modifier_desc:0 "Мастер знаний — маг с неоспоримыми знаниями и высокими магическими навыками. В совете он выступает экспертом по экстремальным магическим явлениям и занимается всевозможными магическими исследованиями."
 mc_black_mage_modifier:0 "Чёрный маг"
 mc_black_mage_modifier_desc:0 "Чёрный маг занимается вопросами безопасности и может выступать в роли следователя или исполнителя, если того требует ситуация."
 mc_admin_modifier:0 "Администратор совета"
 mc_admin_modifier_desc:0 "Администратор занимается финансовыми и бюрократическими вопросами и уполномочен управлять $mc_gold_desc$. Обычно это кто-то, кто хорошо разбирается в управлении и знаком с политикой."
 mc_supporter_modifier:0 "Сторонник Высшего совета"
 mc_supporter_modifier_desc:0 "Некоторые поддерживают Высший совет из страха, другие надеются на благосклонность Архимага."
 game_concept_high_mage_council:0 "$mc_full_name$"
 game_concept_high_mage_council_desc:0 "Высший совет состоит из Архимага и трёх других магов, назначенных им. Совет обладает ресурсами и влиянием, которым позавидовали бы многие императоры — решения совета существенно влияют на судьбу мира. За пределами круга магов существование совета остаётся тайной — пока совет не решит раскрыть своё существование остальному миру."
 game_concept_mc_funds:0 "$mc_gold_desc$"
 game_concept_mc_funds_desc0:0 "Высший совет может распоряжаться специальным фондом для покрытия своих нужд или предоставления грантов."
 game_concept_mc_funds_desc1:0 "$game_concept_mc_funds_desc0$\nВ фонде сейчас содержится $mc_gold$ золота."
 game_concept_mc_funds_desc:0 "[GetPlayer.Custom('MC_FUNDS_DESC')]"
 mc_archmage_may_appoint_tooltip:0 "Вы можете назначить нового члена совета, используя [interaction|E] Пригласить в Высший совет."
 IS_MC_MEMBER:0 "Цель является членом Высшего совета."
