 ev10.6.title:0 "Обучение колдовству — Передача секретов"
 ev10.6.desc:0 "Вы видите, что [disciple.GetFirstName] усвоил знания и обещает стать искусным учеником магии. Возможно, стоит дать [disciple.GetHerHim] что-то еще — вы можете научить [disciple.GetHerHim] "
 ev10.6.descA:0 "$ev10.6.desc$ $my_custom_spell_final_name$."
 ev10.6.descB:0 "$ev10.6.desc$ [my_custom_spell.GetLocalizedText( 'my_custom_spell_name' )]."
 ev10.6.a_ct:0 "Вы поделитесь своим заклинанием."
 ev10.6.a1:0 "Я научу [disciple.GetHerHim] $my_custom_spell_final_name$."
 ev10.6.a2:0 "Я научу [disciple.GetHerHim] [my_custom_spell.GetLocalizedText( 'my_custom_spell_name' )]."
