 invite_to_high_council_interaction_desc:0 "Вы можете заполнить пустующую должность в [high_mage_council|E]."
 MC_IS_FULL:0 "В Высшем совете нет свободных должностей."
 MC_INV_PROPOSAL0:0 "В Высшем совете есть вакансия — я решил, что вы можете быть подходящим кандидатом для её заполнения. Готовы ли вы присоединиться к нам в качестве"
