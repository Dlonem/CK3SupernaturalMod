 ev10.4.title:0 "Собственное заклинание — Последний элемент"
 ev10.4.desc:0 "Ваше заклинание почти готово, но пока оно не выглядит мощнее тех, что вы уже использовали. Добавление дополнительного компонента должно значительно повысить его эффективность."
 ev10.4.a:0 "[magic_shield_i|E][magic_shield|E]"
 ev10.5.title:0 "Заклинание готово!"
 ev10.5.desc:0 "Ваше заклинание выглядит многообещающим — оно должно дать вам преимущество в магических схватках. Поскольку это ваше творение, вам следует придумать подходящее название."
 ev10.5.completed:0 "Заклинание будет доступно в первом раунде каждой дуэли и может быть использовано в последующих раундах."
