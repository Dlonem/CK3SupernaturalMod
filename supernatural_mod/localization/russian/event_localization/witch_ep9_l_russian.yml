 ev10.1.0.z2:0 "Это ослабит [char2.GetHerHim]."
 ev10.1.0.z3:0 "Я запутаю [char2.GetHerHim] иллюзией."
 ev10.1.0.z4:0 "Ты понятия не имеешь, на что я способен."
