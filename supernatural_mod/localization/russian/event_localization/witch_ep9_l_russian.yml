 ev10.32.title:0 "Быть демоном"
 ev10.32.desc:0 "Каждый день вы узнаёте что-то новое о своей природе и происхождении. Вы, вероятно, можете ускорить процесс развития своих навыков, но это может сопровождаться побочными эффектами. Или, возможно, лучше назвать это дополнительной выгодой? Вам решать."
 ev10.32.a:0 "Я сделаю всё, что в моих силах."
 ev10.32.a_ct:0 "Вы получите очко перка [lifestyle|E] Демонический"
 ev10.32.b:0 "Торопиться некуда..."
 ev10.33.desc:0 "Ваши наблюдения за дипломатическими и политическими манёврами окружающих правителей натолкнули вас на идею. Несколько простых махинаций будет достаточно, чтобы в этом регионе вспыхнули серьёзные конфликты. Реализация этого плана может быть поучительной... и занимательной."
 ev10.33.a:0 "Я сделаю это!"
 ev10.33.b:0 "Я пока воздержусь от действий."
 ev10.34.desc:0 "Ваша природа требует свободы. Жажда крови и разрушений должна быть утолена. Ваш инстинкт подсказывает, что это самый быстрый путь к величию."
 magic_slaughterer_modifier:0 "Убийца"
 ev10.34.a:0 "Да, мне это нужно."
 ev10.34.b:0 "На этот раз я воздержусь..."
 demonic_courtier_name:0 "Нанять демонического придворного"
 demonic_courtier_name_desc:0 "Демоны коварны, но обычно они более компетентны, чем смертные."
 demonic_courtier_desc:0 "$demonic_courtier_name_desc$"
 demonic_courtier_ct:0 "Малый демон присоединится к вашему двору"
