 ev7.105.l:0 "Древняя Сингулярность должна быть запечатана."
 ev7.105.l_ct:0 "Древняя Сингулярность будет деактивирована."
 ev7.105.l_flav:0 "Ни один человек не должен обладать такой силой."
 ev10.158.title:0 "Воля собрания"
 ev10.158.desc:0 "Собрание магов решило, что Древняя Сингулярность должна быть уничтожена или деактивирована. Это решение не подлежит обжалованию; вы должны выполнить его немедленно. Конечно, вы можете воспротивиться, но последствия будут серьёзными."
 ev10.158.a:0 "Я исполню их волю."
 ev10.158.b:0 "Я никогда на это не соглашусь!"
 asmodeus_beaten:0 "Асмодей повержен!"
 ev10.159.desc:0 "Теперь вы — ректор Академии магии. Работа и политика учреждения полностью подчинены вашей воле."
 ev10.159.a:0 "Моя школа будет открыта для всех!"
 ev10.159.a_ct:0 "Открывает Арканный Фокус для каждой истинной ведьмы."
 ev10.159.a_ct2:0 "Следующий ректор сможет отменить это решение."
 ev10.159.b:0 "Академия будет доступна для моего Дома."
 house_magic_academy_modifier:0 "$building_mage_house$"
 ev10.159.c:0 "Я введу строгий отбор студентов."
 ev10.159.c_ct:0 "Время от времени в вашем дворе может появляться новый маг."
 ev10.159.d:0 "Академия будет служить только моим собственным исследованиям."
 ev10.160.title:0 "Маг, обученный в Академии"
 spell_will_be_cast_ct:0 "Заклинание будет произнесено."
 magic_target_confirmed_ct:0 "Ваши враги атакованы заклинанием!"
 ev2.5.g:0 "Я саботирую [enemy.GetHerHis] исследования."
 ev2.5.g_ct:0 "Ваши исследования саботированы!"
 ev10.161.title:0 "Неисправность Древней Сингулярности"
 ev10.161.desc:0 "В последнее время вы заметили, что Древняя Сингулярность ведёт себя ненормально. Иногда она издаёт странные звуки или дрожит при попытке использования. А когда вы её активируете, её сила кажется более хаотичной, что приводит к снижению точности (хотя это не так важно из-за огромного радиуса взрыва, но всё равно тревожно). Вам удалось получить доступ к индикаторам, скрытым в перчатке, но вы не понимаете их — кроме того, что все они горят красным, что, вероятно, нехороший знак."
 ev10.161.a:0 "Я попробую перекалибровать перчатку."
 ev10.161.b:0 "Наверное, ничего страшного, правда?"
 ev10.162.desc:0 "За последние дни вы провели множество измерений и исследований Сингулярности, но понятия не имеете, как исправить неисправность — если это вообще неисправность. Всё, что вам удалось установить, — устройство перегружено: каждое последующее использование может привести к мощному взрыву."
 ev10.162.a:0 "Может, стоит от него избавиться?"
 ev10.163.desc:0 "Сегодня вы заметили, что Сингулярность слегка дымится. Вы также ощущаете, что устройство начало излучать сильную радиацию, которая, вероятно, крайне вредна для здоровья."
 ev10.163.a:0 "Этот артефакт проклят!"
 ev10.164.title:0 "Древняя Сингулярность взрывается!"
