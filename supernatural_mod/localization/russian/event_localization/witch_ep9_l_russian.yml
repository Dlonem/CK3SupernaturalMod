 laamp_magic_1013_contract:0 "Тайная библиотека"
 laamp_magic_1013_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и использовать навыки [diplomacy|E] или [intrigue|E]."
 laamp_magic_1013_desc_title:0 "$laamp_magic_1013_contract$"
 laamp_magic_1013_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] владеет библиотекой, которая может содержать множество полезной информации. Возможно, немного убеждения заставит [TaskContract.GetEmployer.GetTitledFirstName] поделиться [TaskContract.GetEmployer.GetHerHis] книгами для изучения."
 laamp_magic_1013_desc_ct:0 "Вы можете получить очко перка или улучшить свои навыки."
 ev10.150.desc:0 "[employer.GetTitledFirstName] следит за тем, чтобы никто посторонний не приближался к его книгам, но иногда [employer.GetSheHe] предоставляет их друзьям или уважаемым учёным. Вам нужно найти способ получить доступ к этим книгам."
 ev10.150.a:0 "Я поговорю с [employer.GetHerHim] об этом."
 ev10.150.b:0 "Я проберусь туда ночью."
 ev10.150.c:0 "Я заплачу."
 ev10.150.d:0 "Эти книги, вероятно, не представляют интереса."
 laamp_magic_1014_contract:0 "Оценка придворного мага"
 laamp_magic_1014_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и оценить навыки местного придворного мага."
 laamp_magic_1014_desc_title:0 "$laamp_magic_1014_contract$"
 laamp_magic_1014_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] пользуется услугами придворного мага, который, предположительно, проводит исследования и поддерживает [TaskContract.GetEmployer.GetTitledFirstName] своими знаниями. Однако [TaskContract.GetEmployer.GetTitledFirstName] не уверен, обладает ли [TaskContract.GetEmployer.GetHerHis] маг настоящими навыками. Может, он просто мошенник и обманщик? Независимый эксперт, который мог бы это оценить, был бы полезен."
 ev10.151.desc:0 "«Похоже, вы эксперт в тайных знаниях и колдовстве, поэтому я хотел бы попросить вас оценить моего придворного мага, [cmage.GetTitledFirstName]. [cmage.GetSheHe|U] утверждает, что [cmage.GetHerHis] заклинания эффективны, но я не вижу результатов. Я не силён в магии, так что, возможно, это нормально. Однако, если [cmage.GetTitledFirstName] — мошенник, я хотел бы знать.»"
 ev10.151.a:0 "Я поговорю с [cmage.GetHerHim]; возможно, я раскрою правду."
 ev10.152.desc:0 "Вы некоторое время беседовали с [cmage.GetTitledFirstName]. [cmage.GetSheHe|U] неохотно говорит о [cmage.GetHerHis] работе в качестве придворного мага, но это ничего не значит. Волшебники и ведьмы обычно не делятся своими секретами и знаниями."
 ev10.152.a:0 "Я задам несколько каверзных вопросов."
 ev10.152.b:0 "Я использую магическое чутьё."
 ev10.152.c:0 "Я прочитаю [cmage.GetHerHis] ауру."
 ev10.152.d:0 "Ну, похоже, мне придётся полагаться на интуицию."
 ev10.153.desc1:0 "Вы без сомнения установили, что [cmage.GetTitledFirstName] — мошенник. Теперь осталось сообщить ваше суждение [employer.GetTitledFirstName]."
 ev10.153.desc2:0 "Похоже, [cmage.GetTitledFirstName] — всего лишь посредственная ведьма, ничего не знающая о настоящей магии и заклинаниях. Осталось лишь сообщить эту новость [employer.GetTitledFirstName]."
 ev10.153.desc3:0 "Вы определили, что [cmage.GetTitledFirstName] — опытная ведьма. [cmage.GetSheHe|U] обладает знаниями и определёнными навыками, хотя это далеко не настоящая магия. Тем не менее, иметь такого придворного мага лучше, чем не иметь никакого. Осталось представить ваши наблюдения [employer.GetTitledFirstName]."
 ev10.153.desc4:0 "Ваши выводы указывают на то, что [cmage.GetTitledFirstName] — продвинутый практик магии с исключительными навыками. [cmage.GetSheHe|U] явно знает, что делает, и подходит для роли придворного мага. Осталось представить ваши наблюдения [employer.GetTitledFirstName]."
 ev10.153.desc5:0 "Вы не смогли оценить навыки [cmage.GetTitledFirstName]. Вопрос в том, что вы скажете [employer.GetTitledFirstName]?"
 ev10.153.a:0 "[cmage.GetTitledFirstName] — несомненно, искусный волшебник."
 ev10.153.b:0 "[cmage.GetTitledFirstName] — в лучшем случае средний придворный маг."
 ev10.153.c:0 "[cmage.GetSheHe|U] не подходит для этой работы."
 ev10.153.d:0 "[cmage.GetTitledFirstName] — мошенник."
 ev10.153.e:0 "Я не могу здесь помочь."
 ev10.153.f:0 "Я был бы лучшим придворным магом, чем [cmage.GetSheHe]."
 laamp_magic_1014_desc_success_critical_ct:0 "#P Вы можете стать придворным магом и вассалом.#!"
 join_mages_summit:0 "Присоединиться к Саммиту магов"
 join_mages_summit_desc:0 "Ваше приглашение, должно быть, где-то затерялось — тем не менее, вы всё ещё можете посетить Саммит магов."
 ev10.154.title:0 "Прорыв барьера"
 ev10.154.desc:0 "Барьер, который вы установили вокруг Земли, чтобы блокировать все внешние силы, прошлой ночью был разрушен. Какой-то могущественный нарушитель проник в ваш мир. Что бы это ни было, вы все в опасности."
 ev10.154.a:0 "Это должно быть нечто очень могущественное!"
 ev10.154.a_ct:0 "#N Магический барьер вокруг Земли был уничтожен!#!"
