 ev10.19.desc:0 "Каждый демон уникален, но их личность и черты обычно относят их к одной из основных категорий или фракций. В конечном счёте, важны ваша цель и путь, который вы выберете для её достижения."
 succubus_modifier:0 "Суккуб"
 succubus_modifier_desc:0 "Суккубы и инкубы стремятся соблазнять смертных, пробуждая физическую страсть на пути к погибели. Некоторые из них желают заполучить новые души или, через манипуляции, другие выгоды, но большинство демонов распространяют порчу просто ради удовольствия.\n"
