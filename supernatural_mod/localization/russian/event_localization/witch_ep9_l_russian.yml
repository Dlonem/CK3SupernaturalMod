 secret_witch_hunter_tooltip_desc:0 "$secret_witch_hunter$"
 secret_witch_hunter_type_desc:0 "Охотник за ведьмами может действовать эффективнее, если его личность и навыки остаются в тайне."
 ev10.35.desc:0 "Вам в голову пришла блестящая идея — вы можете использовать накопленную хитрость и навыки, чтобы слегка преувеличить свои способности в глазах других. Притворство экспертом в чёрной магии или искусным адептом тайных искусств может принести вам множество выгод, включая признание и, возможно, золото. Есть много доверчивых правителей, которые попадутся на простые уловки."
 ev10.35.a:0 "Конечно, я могущественный [just_me.Custom('GetSorcererBySex')]!"
 ev10.35.b:0 "Это слишком рискованно."
 ev10.36.desc:0 "Похоже, многие поверили, что вы обладаете тайными магическими силами. Некоторые считают, что это дары Бога, результат горячих молитв и медитаций, но другие шепчутся, что это итог сделок с дьяволом. Эта аура таинственности вокруг вас определённо нервирует ваших врагов, но также может привлечь новых друзей."
 laamp_magic_1012_contract:0 "Снятие проклятья"
 laamp_magic_1012_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и решить проблему, используя магию или обман и навык [intrigue|E]."
 laamp_magic_1012_desc_title:0 "$laamp_magic_1012_contract$"
 laamp_magic_1012_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] считает, что на [TaskContract.GetEmployer.GetHerHim] лежит проклятье. [TaskContract.GetEmployer.GetSheHe|U] готов заплатить специалисту, чтобы тот помог [TaskContract.GetEmployer.GetHerHim] снять его."
 ev10.37.desc:0 "Вы видите, что [employer.GetTitledFirstName] относится к вашему визиту с подозрением — [employer.GetSheHe], вероятно, не хочет выглядеть суеверным правителем и не желает, чтобы его связывали с 'сверхъестественными' делами и колдовством."
 ev10.37.a:0 "Я обещаю сохранить это в тайне."
 ev10.38.desc:0 "В течение последнего года [employer.GetTitledFirstName] преследовали неудачи; многие из [employer.GetHerHis] начинаний провалились. Похоже, эта беда затрагивает и тех, кто рядом с [employer.GetHerHim]. [employer.GetTitledFirstName] пытался умилостивить Бога горячими молитвами и подношениями, но церковный алтарь обрушился на [employer.GetHerHim], чуть не убив [employer.GetHerHim]. В итоге гадалка сказала, что [employer.GetTitledFirstName] проклят. По её мнению, только искусный адепт магии сможет решить эту проблему."
 ev10.38.a:0 "Я посмотрю, что можно сделать."
 ev10.38.b:0 "Я недостаточно компетентен в этих вопросах."
 ev10.39.desc2:0 "Вы провели несколько быстрых тестов — похоже, [employer.GetTitledFirstName] действительно проклят. К счастью, это простое малое проклятье. Оно должно исчезнуть само по себе через несколько лет, но искусный колдун мог бы значительно ускорить этот процесс."
 ev10.39.desc1:0 "Вы не знаете, проклятье это, наказание от Бога или просто невезение, но [employer.GetTitledFirstName], очевидно, ожидает от вас поддержки, возможно, просто слова ободрения. Может, просто притвориться, что вы сняли проклятье?"
 ev10.39.a:0 "Я просто очищу ауру [employer.GetHerHis]."
 ev10.39.b:0 "Я не могу не думать, что это действительно проклятье."
 ev10.39.c:0 "Я притворюсь, что произношу 'контрзаклинание'."
 ev10.40.opening:0 "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ev10.40.desc:0 "Я очень интересуюсь темой колдовства и магии и слышал, что вы эксперт в этих областях. Возможно, вы захотите рассказать мне больше об этих тайных искусствах? Мне любопытно, можно ли их использовать для улучшения положения в моём королевстве, конечно же, ради блага моих подданных."
 ev10.40.a:0 "Я эксперт! Но знания стоят дорого..."
 ev10.40.a_ct:0 "Это определённо подогреет любопытство."
 ev10.40.b:0 "Я отвечу вежливо, но в общих чертах."
 ev10.40.c:0 "Я проигнорирую это письмо."
 ev10.41.desc:0 "Спасибо за ваш ответ. Похоже, вы действительно знаете своё дело — именно такой человек мне нужен. Я хочу предложить вам должность придворного мага, и взамен вы получите защиту как мой вассал. С нетерпением жду вашего ответа."
 ev10.41.a:0 "Конечно, я принимаю!"
 ev10.41.b:0 "Меня это не интересует."
 mage_court_alchemy:0 "Алхимические исследования"
 mage_court_alchemy_desc:0 "Придворный маг сосредоточится на производстве зелий и трансмутации свинца в золото."
 mage_court_black_magic:0 "Произнесение заклинаний"
 mage_court_black_magic_desc:0 "Придворный маг будет пытаться произносить заклинания, которые могут навредить вашим врагам или положительно повлиять на ваше королевство."
 mage_court_rituals:0 "Помощь в ритуалах"
 mage_court_rituals_desc:0 "Придворный маг будет поддерживать ваши усилия в изучении магии."
 cm_task_1_terrain_cancel_negative_supply:0 "Вы можете получить магические зелья или золото"
 cm_task_2_terrain_cancel_negative_supply:0 "Придворный маг может нанести вред вашим соперникам и врагам в войне с помощью магии"
 ev10.42.title:0 "Обязанности придворного мага"
 ev10.42.desc:0 "Ваш сюзерен ожидает результатов в области алхимических исследований. Было бы неплохо дать [liege0.GetHerHim] немного золота в качестве доказательства вашего прогресса, это должно удовлетворить [liege0.GetHerHim] на некоторое время."
 ev10.42.a:0 "Я скажу, что превратил свинец в золото."
 ev10.42.b:0 "В будущем этого будет гораздо больше!"
 ev10.42.b_ct2:0 "Вы много обещаете, чтобы выиграть время."
 ev10.42.c:0 "Я попрошу больше времени."
 ev10.42.d:0 "Я представлю свои исследовательские заметки."
 ev10.42.e:0 "На самом деле, я могу превратить свинец в золото."
 ev10.42.title_ct:0 "Усилия придворного мага"
 cm_research_notes_modifier:0 "Заметки придворного мага"
 ev10.43.desc1:0 "Ваш придворный маг, [cmage.GetTitledFirstName], имеет простую цель — производить золото из свинца. [cmage.GetSheHe|U] утверждает, что это возможно, но пока [cmage.GetSheHe] не выполняет [cmage.GetHerHis] обязанности. Когда вы просите [cmage.GetHerHim] представить результаты [cmage.GetHerHis] работы, [cmage.GetSheHe] заявляет, что [cmage.GetSheHe] нужно больше времени."
 ev10.43.desc2:0 "Ваш придворный маг, [cmage.GetTitledFirstName], имеет простую цель — производить золото из свинца. [cmage.GetSheHe|U] утверждает, что это возможно, но, проверив прогресс [cmage.GetHerHis] работы, вы обнаружили, что [cmage.GetSheHe] произвёл небольшой кусок золота стоимостью 5 монет. Это не так уж много, хотя [cmage.GetTitledFirstName] обещает, что это только начало и в будущем будет больше."
 ev10.43.desc3:0 "Ваш придворный маг говорит, что нет гарантии, что проклятье, которое [cmage.GetSheHe] готовит, сработает, и что заклинание требует много времени. Вы должны быть терпеливы."
 ev10.43.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName], потребляет много ресурсов, но [cmage.GetHerHis] работа в последнее время не приносит результатов. На ваши настойчивые вопросы [cmage.GetSheHe] отвечает, что [cmage.GetSheHe] нужно больше времени."
 ev10.43.a:0 "У тебя есть всё время, которое нужно."
 ev10.43.a_ct:0 "Придворный маг не будет торопиться с выполнением своих задач."
 ev10.42.b_ct:0 "Ваш сюзерен может начать терять терпение."
 ev2.65.a_ct:0 "Ваш сюзерен начинает терять терпение."
 ev10.42.a_ct:0 "Сюзерен доволен"
 ev10.44.desc:0 "Вам удалось произвести значительное количество золота. На самом деле, такая трансмутация наверняка порадовала бы вашего сюзерена. Возможно, стоит повторить процесс в рамках ваших обязанностей придворного мага?"
 ev10.44.a:0 "Да, мой сюзерен это оценит."
 ev10.44.c:0 "Да, но я ожидаю чего-то взамен."
 ev10.44.b:0 "Мне нужно сохранить силы на потом."
 ev10.45.desc:0 "Вам удалось создать зелье, однако одна мысль не даёт вам покоя. Как придворный маг, занимающийся алхимией, вы должны передать часть того, что производите, своему сюзерену. Возможно, не стоит оставлять это зелье себе."
 ev10.45.a:0 "Я передам этот эликсир своему сюзерену."
 ev10.45.b:0 "Для сюзерена я приготовлю дополнительное снадобье."
 ev10.45.c:0 "Мой сюзерен получит зелье в следующий раз."
 ev10.46.title:0 "Дилемма Лилит"
 ev10.46.desc:0 "Лилит вызвала вас в связи с какой-то чрезвычайной ситуацией, по-видимому, вопросом жизни и смерти — вам пришлось прервать встречу с советниками по этой причине. Когда вы спросили, что случилось, Лилит показала вам два платья. \n«Я не знаю, какое надеть сегодня! Красное красивое, но в другом я выгляжу как богиня! Что мне делать, дорогой?»"
 ev10.46.a:0 "Красное подойдёт."
 ev10.46.b:0 "Второе определённо лучше."
 ev10.46.c:0 "У меня нет на это времени, женщина."
 ev10.46.d:0 "Я предпочитаю тебя без одежды."
 ev10.47.title:0 "Желания Лилит"
 ev10.47.desc:0 "Лилит пришла к вам сегодня с весьма необычной идеей.\n«Давай повеселимся в темнице! Я буду играть напуганную девственницу, обвинённую в колдовстве, а ты будешь похотливым инквизитором! Звучит здорово, правда?»"
 ev10.47.a:0 "Если тебе это нужно..."
 ev10.47.b:0 "На самом деле, отличная идея!"
 ev10.47.c:0 "Может, в другой раз."
 ev10.48.desc:0 "Вы направились в темницу. Лилит выбрала место для вашей игры, но проблема в том, что оно прямо напротив камеры, в которой находится [vic1.GetTitledFirstName]. [vic1.GetSheHe|U] несомненно будет внимательно следить за всем, что вы делаете, а зная Лилит, будет на что посмотреть. Однако демоница была очень довольна тем, что у вас будет зритель для этого спектакля. «Теперь я очень возбуждена! — сказала она. — Прикуй меня!»"
 ev10.48.a:0 "Всё для тебя, моя любовь..."
 ev10.48.b:0 "Я не могу этого сделать, извини."
 ev10.49.desc:0 "Когда вы закончили, Лилит подошла к камере, из которой [vic1.GetTitledFirstName] смотрел на вас. [vic1.GetTitledFirstName] смотрел на неё как в трансе, когда её рука скользнула между прутьями и начала гладить [vic1.GetHerHis] грудь. Внезапно Лилит резко отдёрнула руку — в её руке было ещё бьющееся сердце [vic1.GetName]. «Что? — спросила она, увидев ваш потрясённый взгляд. — Я хотела, чтобы [vic1.GetHerHim] смотрел, но не хотела, чтобы [vic1.GetHerHim] распространял слухи.» — она озорно ухмыльнулась."
 ev10.49.a:0 "Да... точно..."
 ev10.49.b:0 "..."
 ev10.49.c:0 "Я тебя люблю, Лилит."
 ev10.49.d:0 "Какой поворот."
 ev10.50.desc:0 "Ваш сюзерен, [liege0.GetTitledFirstName], ожидает, что вы будете выполнять обязанности придворного мага и использовать магию для поддержки [liege0.GetHerHim]. Если вы будете слишком долго медлить, [liege0.GetTitledFirstName] может потерять [liege0.GetHerHis] терпение."
 ev10.50.a:0 "Я наложу проклятье на [tchar1.GetTitledFirstName]."
 ev10.50.b:0 "[tchar2.GetTitledFirstName] будет проклят."
 ev10.50.c:0 "[tchar3.GetTitledFirstName] — приоритетная цель."
 ev10.50.d:0 "Я могу зачаровать [tcounty.GetName]."
 ev10.50.e:0 "Я знаю полезное заклинание."
 ev10.50.f:0 "Пока я воздержусь от действий."
 ev10.50.g:0 "Я притворюсь, что накладываю проклятье на [tchar1.GetTitledFirstName]."
 ev10.50.h:0 "Сюзерен оценит исцеляющее заклинание."
 ev10.50.i:0 "У меня есть кое-что, чтобы замедлить вражеские армии."
 ev10.51.title:0 "Задача для придворного мага"
 ev10.51.desc:0 "Сейчас, вероятно, подходящее время, чтобы указать придворному магу подходящую цель. Пусть [cmage.GetHerHim] сосредоточит [cmage.GetHerHis] усилия на одном из ваших врагов."
 ev10.51.a:0 "[tchar1.GetTitledFirstName] должен быть уничтожен."
 ev10.51.b:0 "[tchar2.GetTitledFirstName] требует внимания."
 ev10.51.c:0 "Нужно что-то сделать с [tchar3.GetTitledFirstName]."
 ev10.51.d:0 "[tchar4.GetTitledFirstName] — подходящая цель."
 ev10.51.a_ct:0 "Ваш придворный маг будет мотивирован наложить заклинание на выбранную цель."
 ev10.51.e:0 "Подождём лучшего момента."
 ev10.52.desc:0 "Ваш сюзерен поставил перед вами цель — с помощью магии вы должны уничтожить [tchar0.GetTitledFirstName] или хотя бы навредить [tchar0.GetHerHim]."
 ev10.52.a:0 "Классически — я использую проклятье."
 ev10.52.b:0 "Пора применить мощное проклятье."
 ev10.52.c:0 "Я попробую заклинание чумы."
 ev10.52.d:0 "Ну... Огненный шторм."
 ev10.52.e:0 "Я ударю Древней Сингулярностью."
 ev10.52.f:0 "Подготовка такого заклинания займёт месяцы..."
 ev10.52.f_ct:0 "Сюзерен может заподозрить неладное."
 ev10.52.g:0 "Сегодня у меня выходной."
 ev10.52.x_ct:0 "Ваш придворный маг произнёс заклинание: [cmage.Custom('LastSpellCast')]"
 ev10.53.desc:0 "Вы видите, что ваш сюзерен очень интересуется тайными знаниями, но ему не хватает элементарной информации для понимания теории магии. Возможно, стоит рассказать [liege.GetHerHim] о некоторых тайнах?"
 ev10.53.a:0 "[liege.GetSheHe|U] этого заслуживает."
 ev10.53.a_ct:0 "Сюзерен станет ведьмой."
 ev10.53.a_ct2:0 "Сюзерен не будет заинтересован."
 ev10.53.b:0 "[liege.GetSheHe|U] не готов."
 ev10.53.c:0 "Я саботирую [liege.GetHerHim]."
 ev10.54.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName], видит ваш интерес к тайным знаниям. [cmage.GetSheHe|U] готов посвятить вас в некоторые вещи, если вы пожелаете."
 ev10.54.a:0 "Я открыт для учений [cmage.GetHerHis]."
 ev10.54.a_title:0 "Сюзерен принял ваши учения"
 ev10.54.b:0 "Я предпочитаю держаться от этого подальше."
 something_has_gone_wrong_modifier:0 "Что-то пошло не так"
 something_has_gone_wrong_modifier_desc:0 "Возможно, кто-то саботирует вас или случайно вводит в заблуждение — кажется, что часть собранной вами информации о магии неверна."
 ev10.55.title:0 "Ритуал провалился"
 ev10.55.desc:0 "Несмотря на тщательную подготовку, ритуал получения силы провалился, проблемы возникли уже на первом этапе. Трудно сказать, в чём причина, вероятно, это какой-то просчёт."
 ev10.55.a:0 "Я явно переутомлён."
 ev10.55.b_ct1:0 "Вы выяснили причину проблемы"
 ev10.55.b_ct2:0 "Вы ничего не выяснили"
 ev10.56.desc:0 "Ваше расследование показало, что ритуал провалился из-за грубой некомпетентности вашего придворного мага, [cmage.GetTitledFirstName]. Похоже, [cmage.GetSheHe] вообще ничего не знает о магии, [cmage.GetSheHe] — обычный мошенник!"
 ev10.56.a:0 "Я не могу в это поверить..."
 ev10.56.b:0 "В темницу [cmage.GetHerHim]!"
 ev10.56.desc_title:0 "Сюзерен узнал правду!"
 ev10.57.title:0 "Дорогая магия"
 ev10.57.desc:0 "Очевидно, что работа придворного мага требует больших вложений и дорогостоящих компонентов. Возможно, стоит попросить у [liege0.GetTitledFirstName] дополнительные средства?"
 ev10.57.a:0 "Я обсужу это с [liege0.GetHerHim]."
 ev10.57.b:0 "Моих ресурсов достаточно."
 additional_magic_funds_modifier:0 "Фонд исследований"
 ev10.58.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName], обратился к вам с просьбой о дополнительных средствах на магические исследования, которые [cmage.GetSheHe] проводит. [cmage.GetSheHe|U] утверждает, что это инвестиция, которая обязательно окупится."
 ev10.58.a:0 "[cmage.GetSheHe|U] получит дополнительное финансирование."
 ev10.58.b:0 "Нет."
 ev10.59.desc:0 "Ваша должность придворного мага и доверие, которое [liege0.GetTitledFirstName] к вам питает, делают вас важной фигурой на политической шахматной доске. Вы уверены, что можете использовать это в своих интересах."
 ev10.59.a:0 "Это делает меня более влиятельным."
 ev10.59.b:0 "Я ожидаю множество взяток."
 ev10.59.c:0 "Я желанный друг..."
 ev10.59.d:0 "...или опасный враг."
 CM_MUST_HAS_ASSIGNED_TASK:0 "Сначала нужно назначить задачу придворному магу."
 CM_HELPS_YOU_RITUALS:0 "Ваш придворный маг активно помогает вам ($mage_court_rituals$)."
 press_court_mage1:0 "Придворный маг будет мотивирован."
 press_court_mage_decision_ct1:0 "Придворный маг усилит свои усилия."
 press_court_mage2:0 "Придворный маг плохо справляется с давлением."
 ev2.18.e:0 "Ты даже не представляешь, насколько ты в беде."
 DS_CYRO_HATES_U:0 "#N Цель вас ненавидит#!: $VALUE|=+0$"
 ev10.61.desc:0 "Похоже, демон отступил — возможно, он уже достиг своей цели и утолил свой ужас? Или это было просто послание?"
 ev10.61.a:0 "Защиту нужно усилить... на будущее."
 ev10.61.b:0 "С этим нужно что-то сделать."
 mc_disabled_tooltip:0 "#N Высший совет может быть сформирован только Архимагом.#!"
 mc_full_name:0 "Высший совет магов"
