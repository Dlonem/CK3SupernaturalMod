 HAS_MAGIC_IMMUNITY:0 "Цель имеет иммунитет к этому заклинанию."
 protective_amulets_perk:0 "Защитные амулеты"
 magic_countermeasures_perk:0 "Контрзаклинания"
 magic_countermeasures_perk_ct1:0 "Вы можете нейтрализовать заклинания, направленные на вас или ваших придворных."
 magic_countermeasures_perk_ct2:0 "Как придворный маг, вы можете защищать своего сюзерена и его придворных таким же образом."
 yaga_broom:0 "Метла Яги"
 yaga_broom_desc:0 "Это всего лишь обычная метла — предположительно, используется для уборки, а для чего же ещё?"
 use_magic_on_me_opinion2:0 "Произнес заклинание на мне"
 magic_orb:0 "Сфера Истины"
 magic_orb_desc:0 "В сфере можно увидеть прошлое или настоящее, а иногда и предвестие будущих событий. Сфера показывает правду, не больше и не меньше."
 ev91.1.title:0 "Хрустальный шар"
 ev91.1.desc:0 "Сегодня вам доставили загадочную посылку. На коробке была выгравирована очень неразборчивая надпись, которую вы сочли за «Привет от друга». Вы понятия не имеете, кто этот друг, но внутри коробки вы нашли необычную, мерцающую разноцветную сферу — несомненно, колдовской артефакт."
 magic_orb_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ разоблачает враждебные интриги"
 magic_orb3_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ более эффективно"
 magic_orb_terrain_advantage:0 "Перезарядка $prepare_scrying_decision$"
 ev10.10.desc:0 "Сфера показывает вам образы, которые указывают, что вашей жизни может угрожать опасность. Видения не совсем ясны, но вы можете определить природу угрозы и подготовиться к ней."
 ev10.10.a:0 "Заговорщики понесут наказание."
 ev10.10.a_ct:0 "Гадание продолжится."
 ev10.11.desc:0 "Вы всматривались в Сферу Истины в поисках информации и ответов. Вы можете видеть далёкие места и времена, но многие видения случайны, и вы имеете лишь частичный контроль над тем, что наблюдаете."
 ev10.11.a:0 "Покажи мне мой двор."
 ev10.11.a_ct:0 "Вы можете раскрыть новые секреты"
 ev10.11.b:0 "Покажи мне соседние королевства."
 ev10.11.c:0 "Покажи мне будущее."
 ev10.11.c_ct:0 "Вы можете испытать дополнительное видение"
 ev10.11.d:0 "Покажи передвижения вражеских армий."
 war_intel_modifier:0 "Военная разведка"
 ev10.11.e:0 "Покажи мне [starget.GetTitledFirstName]."
 useful_intel_modifier:0 "Полезная информация"
 ev10.12.desc:0 "Вы видите свой замок с высоты птичьего полёта. Изображение приближается и размывается, но через мгновение вновь обретает чёткость — вы видите своих слуг, стражу и придворных, занимающихся своими повседневными делами. Вы проводите некоторое время за этими поучительными наблюдениями..."
 ev10.13.desc:0 "В сфере вы видите двор [ref.GetTitledFirstName], а также [ref.GetHerHis] рыцарей, придворных и советников. Эти наблюдения приводят к интересным выводам."
 ev10.14.desc:0 "В сфере появляются размытые образы. Вы видите огонь, людей, кричащих от страданий. Сфера показывает вам насилие и боль, сожжённый город и мёртвых людей, но вы не можете разглядеть причину или время этих событий. Завтра? Через сто лет?"
 ev10.14.a:0 "Грядёт война, очевидно."
 ev10.14.b:0 "Это какая-то природная катастрофа."
 ev10.14.c:0 "Это армагеддон."
 ev10.14.d:0 "Это я всё это устрою."
 war_preparation_modifier:0 "Подготовка к войне"
 ev10.15.desc:0 "Вы пытаетесь настроить сферу на нужные вам места, но видите лишь размытые образы, цветные спирали и вспышки света."
 ev10.15.a:0 "Я постучу по сфере, может, это поможет?"
 ev10.15.b:0 "Я потрясу сферу..."
 ev10.16.desc:0 "Внезапно изображение стало чётким. Вы видите, похоже, библиотеку, заполненную огромным количеством книг. Прямо посреди неё вы замечаете существо с деформированным лицом и множеством рук, быстро сортирующее и раскладывающее книги. Существо внезапно замирает, и его лицо медленно поворачивается к вам. Оно вас видит! Вдруг вас поражает резкий, ужасающий звук — крик существа, возможно, заклинание. Изображение исчезло, связь, по-видимому, прервалась."
 ev10.16.a:0 "Что это, чёрт возьми, было!"
 elixir_fertility_modifier:0 "Зелье плодовитости"
 pot10_desc:0 "Снадобье, которое может помочь обеспечить наследование."
 gain_pot10_ct:0 "Вы получаете $elixir_fertility_modifier$"
 use_pot10a_loc:0 "$Зелье плодовитости$ (для меня)"
 use_pot10b_loc:0 "$Зелье плодовитости$ (для моего супруга)"
 ev10.17.desc:0 "Вы видите, что артефакт изменил свою структуру, подстраиваясь под форму вашей руки. Он заряжен и готов к использованию."
 magic_catalyst_desc2:0 "Таинственный камень, который, согласно легендам, упал с небес много эонов назад."
 cut_schemes_decision_title:0 "Борьба с интригами"
 cut_schemes_decision_desc:0 "Вы знаете о заговорах против вас — все ресурсы должны быть использованы, чтобы противостоять им, пока не стало слишком поздно."
 cut_schemes_decision_ct:0 "Вы попытаетесь сорвать планы заговорщиков."
 ev10.18.desc:0 "Заговорщики плетут интриги против вас и могут нанести удар в любой момент. Вам нужно отдать приказы страже, начать допросы и назначить награды за информацию о предателях. Пусть они почувствуют, что их действия не останутся безнаказанными!"
 ev10.18.a:0 "Я перетрясу весь свой двор."
