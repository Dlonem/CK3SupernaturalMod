 ev10.24.desc:0 "Вы прибыли в место, где недавно находился [recipient.GetTitledFirstName], но, похоже, [recipient.GetSheHe] уже здесь нет. Возможно, кто-то предупредил [recipient.GetHerHim], или [recipient.GetSheHe] просто повезло."
 ev10.24.a:0 "Я не вернусь с пустыми руками."
 ev10.25.desc:0 "Вы без труда выследили свою цель. [recipient.GetTitledFirstName] пытался сбежать, но вы были к этому готовы. Один удар раздавил [recipient.GetHerHis] грудь, убив [recipient.GetHerHim] на месте."
 ev10.26.desc:0 "Вам удалось найти [recipient.GetTitledFirstName], однако [recipient.GetSheHe] готов сражаться. Похоже, один из вас скоро умрёт."
 ev10.26.a:0 "Как ягнёнок на заклание."
 ev10.26.b:0 "Ну, на этот раз я пощажу [recipient.GetHerHis]."
 ev10.26.b_ct:0 "Вы отказались от противостояния."
 ev10.27.desc:0 "Вы слышите тревожный шум. В этот же момент один из ваших людей приносит важные сведения — это [actor.GetTitledFirstName], [actor.GetSheHe] прорвался через вашу стражу, ломая ваших рыцарей, как спички. [actor.GetSheHe|U] не человек, [actor.GetSheHe] — кровожадный демон!"
 ev10.27.a:0 "Я встречусь с [actor.GetHerHim]!"
 ev10.27.b:0 "Прикройте моё отступление!"
 ev10.27.b_ct:0 "Вам не удалось сбежать!"
 ev10.27.c:0 "Срочно вызовите придворного мага!"
 ev10.27.d:0 "Передайте [actor.GetHerHim]... что я сдаюсь."
 ev10.27.d_ct:0 "Вы можете проиграть войну [my_war.GetName]."
 ev10.28.desc1:0 "Стража у ворот замка пыталась вас остановить — вы их убили. Решётка быстро опустилась — вы сорвали её сильным рывком и бросили в ров. Несколько рыцарей попытались противостоять вам во дворе — вы их перебили."
 ev10.28.desc2:0 "Стражник лагеря попытался вас остановить, и вы одним движением свернули ему шею. Ещё двое бросились на вас, но вы просто разорвали их на куски. В лагере начался переполох, люди начали кричать и разбегаться."
 ev10.28.desc3:0 "\nПеред вами появился [aprotector.GetTitledFirstName], готовый к бою. Очевидно, [recipient.GetTitledFirstName] нашёл себе защитника. Что ж, ещё один труп сегодня не сделает погоды."
 ev10.28.a:0 "Умри, [aprotector.GetName]."
 ev10.29.desc1:0 "Теперь, когда разминка позади, пора разобраться с [recipient.GetTitledFirstName]. По пути пришлось убить ещё несколько солдат, но в итоге вы нашли [recipient.GetHerHim]. [recipient.GetSheHe|U] кажется, хочет защищаться. Жалкое зрелище."
 ev10.29.desc2:0 "\nНаконец, появился [recipient.GetTitledFirstName]."
 ev10.31.desc:0 "[recipient.GetSheHe|U] сделал вам предложение — [recipient.GetSheHe] готов капитулировать в войне в обмен на [recipient.GetHerHis] жалкую жизнь."
 ev10.29.a:0 "Вот твой конец."
 ev10.29.a_it:0 "Произошло столкновение!"
 ev10.29.a_ct:0 "Вы были зарублены."
 ev10.29.b:0 "Я передумал. Прощай."
 ev10.29.b_it:0 "Демон ушёл, но многие погибли."
 ev10.30.desc:0 "Ваш сюзерен срочно вызвал вас — двор [liege0.GetHerHis] атакован [actor.GetTitledFirstName]. Вам приказано победить демона, пока не стало слишком поздно. Вы видите, что [liege0.GetTitledFirstName] в отчаянии и боится за [liege0.GetHerHis] жизнь."
 ev10.30.a:0 "Я встречусь с демоном."
 ev10.30.a_ct:0 "Вам придётся сражаться."
 ev10.30.b:0 "[liege0.GetTitledFirstName] получил то, что [liege0.GetSheHe] заслужил."
 ev10.30.b_ct:0 "Ваш придворный маг отказался помочь!"
 extra_output_event_ct:0 "Ваш придворный маг провалился"
 ev10.31.a:0 "Нет... ты умрёшь здесь и сейчас."
 ev10.31.a_ct:0 "Демон отверг вашу капитуляцию."
 ev10.31.b_ct:0 "Демон принял вашу капитуляцию."
