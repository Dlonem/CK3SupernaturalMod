l_russian:
 werewolf_gathering:0 "Волчий сход"
 werewolf_gathering_desc:0 "Созвать волков, которых ты знаешь, чтобы бегать вместе и держать совет у костра."
 werewolf_gathering_host_desc:0 "$BULLET_WITH_TAB$Волки получают [spn_pack_standing|E] и ликантропию\n$BULLET_WITH_TAB$Шкура, принесённая в круг, может выбрать одного из вас\n$BULLET_WITH_TAB$Весть о шкурах расходится вокруг костра\n"
 werewolf_gathering_guest_desc:0 "$BULLET_WITH_TAB$Волки получают [spn_pack_standing|E] и ликантропию\n$BULLET_WITH_TAB$Шкура, принесённая в круг, может выбрать одного из вас\n$BULLET_WITH_TAB$Весть о шкурах расходится вокруг костра\n"
 werewolf_gathering_selection_tooltip:0 "Бежать с волками, которых ты знаешь, и держать с ними совет."
 werewolf_gathering_destination_selection:0 ""
 werewolf_gathering_province_desc:0 "Место, где есть где бегать."
 werewolf_gathering_predicted_cost:0 "Месяц кормить стаю — недёшево."
 werewolf_gathering_guest_help_text:0 "Волки, что приходят, заслуживают своё место в стае."
 werewolf_gathering_conclusion_desc:0 "[GetActivityType( 'werewolf_gathering' ).GetName] завершился."
 werewolf_gathering_host_an_a:0 ""
 spn_gathering_calling_phase:0 "Зов"
 spn_gathering_calling_phase_desc:0 "Волки сходятся и приглядываются друг к другу."
 spn_gathering_run_phase:0 "Бег"
 spn_gathering_run_phase_desc:0 "Стая бежит вместе. Графство это заметит."
 spn_gathering_circle_phase:0 "Круг"
 spn_gathering_circle_phase_desc:0 "Совет у костра, где шкуры выбирают, а вести расходятся."
 spn_lead_the_pack_intent:0 "Вести стаю"
 spn_lead_the_pack_intent_desc:0 "Бежать во главе стаи и напомнить каждому волку, кто её водит."
 spn_run_a_rivals_land_intent:0 "Бежать по земле соперника"
 spn_run_a_rivals_land_intent_desc:0 "Провести Сход в чужом краю и дать своей стае пробежать по нему. Окупается только за границей: у себя это не даёт ничего сверх того."
 spn_seek_the_old_ways_intent:0 "Искать старые пути"
 spn_seek_the_old_ways_intent_desc:0 "Сесть со старейшими волками и слушать. Они могут рассказать о потерянной шкуре, которая взяла бы тебя, или о том, где хранят шкуру, что подходит тебе больше всех."
 spn_hold_the_unification_intent:0 "Совершить соединение"
 spn_hold_the_unification_intent_desc:0 "Ввести стаю своего супруга в свою по старому обряду — если между вами нет тайн."
 spn_earn_my_place_intent:0 "Заслужить своё место"
 spn_earn_my_place_intent_desc:0 "Бежать изо всех сил и на виду. Ты получаешь больше [spn_pack_standing|E]."
 spn_challenge_the_alpha_intent:0 "Бросить вызов вожаку"
 spn_challenge_the_alpha_intent_desc:0 "Явиться испытать того, кто водит. Только для волка из стаи, что водит сам хозяин схода, — и только если этот волк у него [spn_second|E]. Или для любого из них, если Второй уже проиграл вожаку."
 spn_seek_another_pack_intent:0 "Искать другую стаю"
 spn_seek_another_pack_intent_desc:0 "Поискать стаю, которая тебя примет, и попросить разрешения бегать со стаей хозяина."
 spn_hold_the_unification_spouse_tt:0 "Твой супруг(а) водит другую стаю"
 spn_challenge_the_alpha_standing_tt:0 "Твой [spn_pack_standing|E] не меньше 50"
 activity_invite_rule_werewolves:0 "Оборотни"
 activity_invite_rule_werewolves_desc:0 "Оборотни, о которых ты можешь по разумным причинам знать, что они такое: те, кто этого не скрывает; те, чью тайну ты хранишь; твоя родня; и те, кого ты оцарапал(а), и те, кто оцарапал тебя."
 activity_invite_rule_pack:0 "Стая"
 activity_invite_rule_pack_desc:0 "Волки твоей собственной стаи и вожаки стай поблизости, о которых ты знаешь."
 activity_invite_rule_fevered:0 "Лихорадящие"
 activity_invite_rule_fevered_desc:0 "Люди, которых ты знаешь и которые всё ещё в лихорадке от раны: те, кому её дал(а) ты или твоя стая, твоя близкая родня и твой двор."
 spn_wg_location_too_far_tt:0 "В пределах поездки от твоего дома или где угодно в державе твоего сюзерена"
 spn_wg_location_capital_tt:0 "Столица графства"
 spn_wg_prov_base:0 "Место, где есть где бегать.\n"
 spn_wg_tag_forest:0 "#positive_value + Глухой лес#! (Местность)\n"
 spn_wg_tag_own:0 "#positive_value + Твоя собственная земля#!\n"
 spn_wg_tag_far:0 "#negative_value - Долгая дорога#!\n"
 spn_wg_join_host_paranoid:0 "Хозяин схода подозрителен"
 spn_wg_join_host_gregarious:0 "Хозяин схода общителен"
 spn_wg_join_my_alpha:0 "Мой вожак зовёт"
 spn_wg_join_guest_eager:0 "Рвётся бежать"
 spn_wg_join_guest_wary:0 "Сторонится общества"
 spn_gathering.0001.t:0 "Зов уходит"
 spn_gathering.0001.desc:0 "Ты созвал(а) волков бежать вместе. Некоторые придут, потому что знают тебя. Некоторые — потому что им любопытно. Немногие — потому что намерены тебя испытать. Каждый волк, который придёт, может стать твоим, если неделя пройдёт хорошо.\n\nВ лесу какое-то время будет шумно."
 spn_gathering.0001.a:0 "Пусть приходят."
 spn_gathering.0110.t:0 "Стая склоняет головы"
 spn_gathering.0110.desc:0 "[spn_bow_champ.GetShortUIName] выходит на поляну, и каждый волк там замирает. Никто не говорил им, что [spn_bow_champ.GetSheHe] носит. И не нужно было.\n\nОдин за другим, без всякой просьбы, они опускают головы. Даже старые, которые ни перед кем не склонялись годами."
 spn_gathering.0110.a:0 "И я тоже."
 spn_gathering.0200.t:0 "Бег"
 spn_gathering.0200.desc:0 "Сегодня ночью ты бежишь со всеми ними сразу — сквозь деревья, через реку, вверх по долгому холму и вниз. На несколько часов нет ничего, что надо решать, и ничего, что надо скрывать. Стая движется как одно животное, и ты — её часть.\n\nЛучше ты себя не чувствовал(а) много лет."
 spn_gathering.0200.a:0 "Завтра снова."
 spn_gathering.0201.t:0 "Овечье стадо"
 spn_gathering.0201.desc:0 "Стая выходит из деревьев над усадьбой, где овец на ночь загнали в загон. Хозяин спит. Собаки — нет, и они в ужасе. Это было бы легко. Об этом же будут говорить год.\n\nКаждый волк смотрит на тебя."
 spn_gathering.0201.a:0 "Взять их."
 spn_gathering.0201.a.tt:0 "В графстве об этом будут говорить."
 spn_gathering.0201.b:0 "Оставить их."
 spn_gathering.0202.t:0 "Собака охотника"
 spn_gathering.0202.desc:0 "Гончий пёс идёт за стаей две ночи подряд — держится на расстоянии и лает. Где-то позади него будет человек с арбалетом.\n\nУбьёшь собаку — и он поймёт, что её что-то убило. Отпустишь — и она может привести его прямо к тебе."
 spn_gathering.0202.a:0 "Убить."
 spn_gathering.0202.b:0 "Пусть бежит домой."
 spn_gathering.0203.t:0 "Молодой волк, который не остановится"
 spn_gathering.0203.desc:0 "[spn_young_wolf.GetShortUIName] молод(а) и никогда прежде не бегал(а) с таким множеством волков. [spn_young_wolf.GetSheHe|U] не останавливается: огрызается на старших, забегает вперёд, воет на пустое место.\n\nОстальные ждут, поставишь ли ты [spn_young_wolf.GetHerHim] на место."
 spn_gathering.0203.a:0 "Осадить [spn_young_wolf.GetHerHim]."
 spn_gathering.0203.b:0 "Пусть бегает."
 spn_gathering.0204.t:0 "Добыча"
 spn_gathering.0204.desc:0 "Стая нашла человека одного на дороге ночью. День-другой его никто не хватится. У него котомка за спиной и фонарь, который он не зажёг, и тебя он ещё не видел.\n\nВолки ждут тебя."
 spn_gathering.0204.a:0 "Пусть едят."
 spn_gathering.0204.a.tt:0 "В графстве найдут то, что останется."
 spn_gathering.0204.b:0 "Не его. Не сегодня."
 spn_gathering.0205.t:0 "Луна на воде"
 spn_gathering.0205.desc:0 "Ты останавливаешься у озера напиться, и вся стая останавливается с тобой. Луна лежит на воде, и какое-то время никто не двигается. Даже молодые замерли. Где-то за озером воет другой волк, и никто из твоих не отвечает.\n\nЭто очень старое. Старше всех вас."
 spn_gathering.0205.a:0 "Побыть ещё немного."
 spn_gathering.0206.t:0 "Лагерь охотников"
 spn_gathering.0206.desc:0 "Под гребнем стоит лагерь: три палатки, костёр, прогоревший до углей, собаки спят кучей. Арбалеты сложены у телеги. Кто-то в этом графстве платит людям за то, чтобы они искали волков.\n\nСтая уже растянулась по гребню и ждёт тебя."
 spn_gathering.0206.a:0 "Прогнать их, пока не проснулись."
 spn_gathering.0206.a.tt:0 "В графстве услышат, что что-то прогнало охотников."
 spn_gathering.0206.b:0 "Оставить их спать."
 spn_gathering.0207.t:0 "Старый волк"
 spn_gathering.0207.desc:0 "На середине долгого холма самый старый волк в стае сбавляет шаг, а потом останавливается. Остальные оглядываются на него, а затем на тебя.\n\nОн бегал со стаями ещё до того, как родился твой дед. Сегодня он на вершину холма не поднимется."
 spn_gathering.0207.a:0 "Мы его подождём."
 spn_gathering.0207.b:0 "Стая не ждёт."
 spn_gathering.0208.t:0 "Земля другой стаи"
 spn_gathering.0208.desc:0 "У реки запах меняется. По эту сторону воды бегает другая стая: старые метки на деревьях, свежие на камнях.\n\nСегодня их здесь нет. Они узнают, что ты был(а) здесь."
 spn_gathering.0208.a:0 "Оставить свою метку поверх их."
 spn_gathering.0208.b:0 "Повернуть от воды."
 spn_gathering.0209.t:0 "Пастушья дочка"
 spn_gathering.0209.desc:0 "Пастушья дочка сидит на стене отцовского загона, совсем не спит и смотрит, как вся стая идёт мимо в лунном свете. Она не кричит. Не бежит.\n\nУтром она кому-нибудь расскажет, что видела."
 spn_gathering.0209.a:0 "Пусть рассказывает. Ей не поверят."
 spn_gathering.0209.a.tt:0 "Графство об этом услышит."
 spn_gathering.0209.b:0 "Дать ей то, чего стоит бояться."
 spn_gathering.0210.t:0 "Только волки"
 spn_gathering.0210.desc:0 "Стая обычных волков выходит из темноты и какое-то время бежит рядом с вами — серые тени держат шаг у кромки деревьев. Они не подходят близко. И не уходят.\n\nОни знают, что вы такое. Похоже, они считают это честью."
 spn_gathering.0210.a:0 "Бежать с ними."
 spn_gathering.0210.b:0 "Прогнать их. Это наша ночь."
 spn_gathering.0211.t:0 "Без луны"
 spn_gathering.0211.desc:0 "Сегодня луны нет. Без неё стая неспокойна, огрызается друг на друга и шарахается от каждого звука. Двое молодых уже вцепились друг в друга.\n\nОни ждут, удержишь ли ты их вместе в темноте."
 spn_gathering.0211.a:0 "Удержать их."
 spn_gathering.0211.b:0 "Пусть сами разберутся."
 spn_gathering.0212.t:0 "Старые камни"
 spn_gathering.0212.desc:0 "Глубоко в лесу стая выходит на кольцо стоячих камней, наполовину ушедших в мох. Каждый волк останавливается на его краю. Волки сходились здесь когда-то, давно. Это можно почуять в камнях.\n\nНикто не хочет идти первым."
 spn_gathering.0212.a:0 "Я пойду первой(первым)."
 spn_gathering.0212.b:0 "Оставить старое место в покое."
 spn_gathering.0213.t:0 "Драка за добычу"
 spn_gathering.0213.desc:0 "Двое волков взяли одного оленя, и никто не уступает. Они кружат над тушей, вздыбив шерсть, а остальная стая отступила и смотрит.\n\nЭта добыча твоя, и решать тебе."
 spn_gathering.0213.a:0 "Отдать сильнейшему."
 spn_gathering.0213.b:0 "Пусть делят её, бок о бок."
 spn_gathering.0300.t:0 "Выбор"
 spn_gathering.0300.desc_me:0 "Ты принёс(принесла) [spn_ch_hide.GetName] в круг. Ты её не надевал(а). Сегодня ночью у костра она двинулась сама — повернулась так, как поворачивается спящий пёс, — и ты понял(а), что она выбрала.\n\nОна выбрала тебя. Весь круг это видел, и никто не говорит ни слова."
 spn_gathering.0300.desc_other:0 "Ты принёс(принесла) [spn_ch_hide.GetName] в круг. Ты её не надевал(а). Сегодня ночью у костра она двинулась сама — повернулась так, как поворачивается спящий пёс, — и ты понял(а), что она выбрала.\n\nОна выбрала не тебя. Она выбрала [spn_ch_chosen.GetShortUIName]. Весь круг это видел, и теперь они смотрят на тебя."
 spn_gathering.0300.a:0 "Да будет так."
 spn_gathering.0300.a.tt:0 "Отныне ты — её [spn_champion|E]."
 spn_gathering.0300.b:0 "Значит, она [spn_ch_chosen.GetHerHis]."
 spn_gathering.0300.b.tt:0 "Ты её уступаешь. Теперь её [spn_champion|E] — [spn_ch_chosen.GetShortUIName]."
 spn_gathering.0300.c:0 "Тогда [spn_ch_chosen.GetSheHe] придётся забрать её у меня."
 spn_gathering.0300.c.tt:0 "Свалка в кругу, без мечей. Победитель оставляет шкуру у себя, но та всё равно выбирает, кому служить."
 spn_gathering.0301.t:0 "Слово у костра"
 spn_gathering.0301.desc:0 "Поздней ночью разговор у костра сворачивает к шкурам, как всегда. Большая часть — старые истории, которые рассказывают одинаково из года в год, и ты слушаешь, не будет ли чего нового."
 spn_gathering.0301.shrine:0 "\n\n[spn_waf_hide.GetName] хранится как святыня в [spn_waf_county.GetName], и тамошние верующие думают, что она принадлежала кому-то святому."
 spn_gathering.0301.held_mine:0 "\n\nГоворят о шкуре, что хранится у тебя. Слух о ней уже пошёл."
 spn_gathering.0301.held:0 "\n\n[spn_waf_holder.GetShortUIName] держит шкуру. Кто захочет её, тому придётся её забрать."
 spn_gathering.0301.lost_silverback:0 "\n\nСреброспин потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_gathering.0301.lost_timber:0 "\n\nКряж потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_gathering.0301.lost_tundra:0 "\n\nТундра потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_gathering.0301.lost_graybeard:0 "\n\nСедобород потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_gathering.0301.lost_midnight:0 "\n\nПолночь потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_gathering.0301.lost_alpha:0 "\n\nВожак потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_gathering.0301.true_alpha:0 "\n\nЕсть волк с красными глазами, [spn_waf_ta.GetShortUIName], который стал вожаком, никого для этого не убив. Старые говорят, такого не было сотню лет."
 spn_gathering.0301.nothing:0 "\n\nТы не слышишь ничего такого, чего не знал(а) бы."
 spn_gathering.0301.a:0 "Запомнить."
 spn_gathering.0302.t:0 "Две стаи, один костёр"
 spn_gathering.0302.desc:0 "[spn_tp_other.GetShortUIName] привёл(привела) стаю к твоему костру, и две стаи всю неделю ходили кругами друг вокруг друга. Драки уже было две, и обе разняли до того, как кто-то сильно пострадал.\n\nСегодня [spn_tp_other.GetShortUIName] садится напротив тебя через огонь. Все остальные замолкают."
 spn_gathering.0302.a:0 "Скрепить Кровавый уговор."
 spn_gathering.0302.a.tt:0 "[spn_tp_other.GetShortUIName] и ты будете двадцать лет хорошо думать друг о друге, и ваши дома сблизятся. Если вы оба правители, это настоящий союз."
 spn_gathering.0302.b:0 "Решить, кто сильнее."
 spn_gathering.0302.b.tt:0 "Вызов между двумя вожаками, здесь и сейчас."
 spn_gathering.0302.c:0 "Держать дистанцию."
 spn_gathering.0303.desc_silverback:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Среброспини, о том, куда она ушла и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.desc_timber:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Кряже, о том, куда он ушёл и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.desc_tundra:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Тундре, о том, куда она ушла и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.desc_graybeard:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Седобороде, о том, куда он ушёл и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.desc_midnight:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Полночи, о том, куда она ушла и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.desc_alpha:0 "Самый старый волк у костра рассказывает историю, которой больше никто не помнит, — о Вожаке, о том, куда он ушёл и чего ждёт. Половина волков здесь слышала её по кусочку прежде. Целиком не слышал никто.\n\nКогда история кончается, старый волк смотрит прямо на тебя."
 spn_gathering.0303.t:0 "Сказ старого волка"
 spn_gathering.0308.t:0 "Вызов у костра"
 spn_gathering.0308.desc:0 "[spn_gc_challenger.GetShortUIName|U] встаёт в свете костра и называет твоё имя — достаточно громко, чтобы услышал каждый волк в кругу. Это вызов, по старому обычаю: без мечей. "
 spn_gathering.0308.desc_cruel:0 ""Эта стая заслуживает вожака получше, чем ты", — говорит [spn_gc_challenger.GetSheHe]."
 spn_gathering.0308.desc_weak:0 ""Ты уже не настолько силён(сильна), чтобы нас водить", — говорит [spn_gc_challenger.GetSheHe]."
 spn_gathering.0308.desc_long:0 "[spn_gc_challenger.GetSheHe|U] хотел(а) этого долго. Это видно."
 spn_gathering.0308.desc_end:0 "\n\nКаждый волк у костра смотрит, что ты сделаешь."
 spn_gathering.0308.a:0 "Тогда решим это."
 spn_gathering.0309.t:0 "Волк у твоего костра"
 spn_gathering.0309.desc_lone:0 "[spn_seek_ask.GetShortUIName|U] пришёл(шла) к твоему костру один(одна). И прежде чем кончится ночь, [spn_seek_ask.GetSheHe] подходит к тебе и просит разрешения бегать с твоей стаей."
 spn_gathering.0309.desc_pack:0 "[spn_seek_ask.GetShortUIName|U] бегает с другой стаей, но прежде чем кончится ночь, [spn_seek_ask.GetSheHe] подходит к тебе у костра и просит разрешения бегать с твоей."
 spn_gathering.0309.a:0 "Беги с нами."
 spn_gathering.0309.a.tt:0 "[spn_seek_ask.GetShortUIName] вступает в твою [spn_pack|E]."
 spn_gathering.0309.b:0 "Не этого волка."
 spn_gathering.0308.b:0 "Не сегодня."
 spn_gathering.0401.t:0 "Они тебя не оставят"
 spn_gathering.0401.desc:0 "Ты пришёл(шла) на Сборище больным(больной) от раны, и волки поняли это, как только ты вошёл(вошла). Они дали тебе бежать, сколько ты мог(ла). Когда больше не мог(ла), они остались с тобой.\n\nЖар с тобой ещё не покончил. Когда он кончится, они намерены быть рядом."
 spn_gathering.0401.a:0 "Я не останусь с этим наедине."
 spn_gathering.0401.a.tt:0 "Когда жар дойдёт до конца, ты можешь позволить стае пронести тебя через него: шансов выйти волком больше, шансов умереть меньше. Если ты обратишься, а [spn_gc_host.GetShortUIName] бегает в [spn_pack|E], где есть место, ты придёшь в себя уже в ней."
 spn_gathering.0307.t:0 "Где её держат"
 spn_gathering.0307.desc:0 "Поздно, когда костёр уже догорает, самый старый волк в кругу садится рядом с тобой. Он следил за тобой всю ночь.\n\nОн говорит, что [spn_tale_shrine_hide.GetName] — в [spn_tale_shrine_county.GetName]. Тамошние люди держат её как святыню и понятия не имеют, что это такое."
 spn_gathering.0307.takes:0 " Он оглядывает тебя ещё раз. Она бы тебя узнала, говорит он."
 spn_gathering.0307.not_yet:0 " Он оглядывает тебя ещё раз. Она бы тебя ещё не взяла, говорит он, но из шкур, что хранятся в святынях, она ближе всех к тому, что ты есть."
 spn_gathering.0307.a:0 "Значит, я знаю, куда идти."
 spn_gathering.0307.a.tt:0 "Ты знаешь, где хранят [spn_tale_shrine_hide.GetName]. Возьми это графство — или иди туда паломником, если это место свято для твоей веры."
 spn_gathering.0303.a:0 "Я это запомню."
 spn_gathering.0303.a.tt:0 "Потерянная шкура пробуждается на исходе года, и ты первый(первая) в очереди, если она тебя примет."
 spn_gathering.0304.t:0 "Две шкуры в одной комнате"
 spn_gathering.0304.desc_silverback:0 "[spn_th_other.GetShortUIName] носит Полночь. Ты понял(а) это в тот же миг, как [spn_th_other.GetSheHe] вышел(вышла) на поляну. Среброспин ненавидит Полночь с тех пор, как ни тебя, ни его ещё не было на свете. Ты чувствуешь, как она тянет тебя с другого конца костра, — так собака тянет поводок.\n\nСейчас она ненавидит особенно сильно."
 spn_gathering.0304.desc_midnight:0 "[spn_th_other.GetShortUIName] носит Среброспин. Ты понял(а) это в тот же миг, как [spn_th_other.GetSheHe] вышел(вышла) на поляну. Полночь ненавидит Среброспин с тех пор, как ни тебя, ни его ещё не было на свете. Ты чувствуешь, как она тянет тебя с другого конца костра, — так собака тянет поводок.\n\nСейчас она ненавидит особенно сильно."
 spn_gathering.0304.a:0 "Старая вражда."
 spn_gathering.0305.t:0 "Единение"
 spn_gathering.0305.desc:0 "[spn_un_elder.GetShortUIName] связывает твою руку с рукой [spn_un_spouse.GetShortUIName] полосой шкуры и говорит над вами обоими старые слова.\n\nДва вожака. Две стаи. Если между вами нет тайн, они станут одной, и каждый волк в них станет больше, чем был."
 spn_gathering.0305.a:0 "Мы одна стая."
 spn_gathering.0305.a.tt:0 "[spn_un_spouse.GetShortUIName] вводит свою стаю в твою и водит её рядом с тобой. Каждый волк в ней — [spn_evolved|E]."
 spn_gathering.0305.b:0 "Не сейчас."
 spn_gathering.0306.t:0 "Обряд не берёт"
 spn_gathering.0306.desc:0 "Старейшина говорит слова, и ничего не происходит. Полоса шкуры развязывается и падает с обоих запястий — твоего и [spn_un_other.GetShortUIName].\n\nЕсть что-то, чего один из вас не сказал другому. Обряд это знает, даже если вы — нет. Старейшина не смотрит тебе в глаза."
 spn_gathering.0306.a:0 "Значит, не сейчас."
 spn_gathering.0400.t:0 "Сборище кончается"
 spn_gathering.0400.desc:0 "Волки расходятся по домам по двое и по трое — усталые и тише, чем пришли. Кто-то уходит с новыми друзьями, а немногие — с новыми обидами. День-другой после этого собаки в деревнях не перестанут лаять."
 spn_gathering.0400.desc_home:0 " Твой собственный лес снова затихнет через неделю-другую."
 spn_gathering.0400.desc_away:0 " Этот лес снова затихнет через неделю-другую."
 spn_gathering.0400.desc_rival_land:0 " В чужом лесу об этом будут говорить год."
 spn_gathering.0400.a:0 "До следующего раза."