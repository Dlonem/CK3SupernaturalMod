l_russian:
 # Supernatural 2.38b -- the Conclave (DESIGN-2.38b §4).
 spn_conclave:0 "Конклав"
 spn_conclave_name:0 "Конклав"
 spn_conclave_desc:0 "Созвать маски. Храмы сходятся, улаживают свои дела и, если престол пустует, выбирают, кто на него сядет."
 spn_conclave_host_desc:0 "$BULLET_WITH_TAB$Каждый член получает [spn_order_standing|E]\n$BULLET_WITH_TAB$Нарушителей правил судят, а новые члены приносят присягу\n$BULLET_WITH_TAB$Если престол пустует, Храмовые Маги избирают Великого Мага"
 spn_conclave_guest_desc:0 "$BULLET_WITH_TAB$Каждый член получает [spn_order_standing|E]\n$BULLET_WITH_TAB$Храмовые Маги и держатели мест голосуют за престол"
 spn_conclave_selection_tooltip:0 "Собрать храмы Ордена под масками."
 spn_conclave_destination_selection:0 ""
 spn_conclave_province_desc:0 "Тихое место, куда маски могут добраться."
 spn_conclave_predicted_cost:0 "Скрытность стоит денег."
 spn_conclave_guest_help_text:0 "Пришедших членов видят, а те, у кого есть чин, могут голосовать."
 spn_conclave_conclusion_desc:0 "[GetActivityType( 'spn_conclave' ).GetName] завершён. Маски разъезжаются по домам разными дорогами."
 spn_conclave_host_an_a:0 "Храмовый Маг"
 spn_conclave_cost_desc:0 "Комнаты, тишина и вино"
 spn_conclave_prov_base:0 "Место, куда маски могут добраться.\n"
 spn_conclave_location_tt:0 "Столица графства, которой вы владеете"
 spn_conclave_one_at_a_time_tt:0 "Другой Конклав не идёт в это время"
 spn_conclave_cooldown_tt:0 "За последние пять лет Конклав не проводился"
 TRAVEL_NAME_FOR_spn_conclave:0 "поездка [Character.GetFirstNamePossessiveNoTooltip] к старым друзьям"
 spn_conclave_masks_phase:0 "Маски"
 spn_conclave_masks_phase_desc:0 "Храмы прибывают, и никто не называет имён."
 spn_conclave_reckoning_phase:0 "Расплата"
 spn_conclave_reckoning_phase_desc:0 "Считают дела и судят нарушителей."
 spn_conclave_anointing_phase:0 "Помазание"
 spn_conclave_anointing_phase_desc:0 "Новые члены приносят присягу перед всеми храмами."
 spn_conclave_vote_phase:0 "Голосование"
 spn_conclave_vote_phase_desc:0 "Если престол пустует, Храмовые Маги выбирают, кто на него сядет. Затем заполняются места в Совете."
 activity_invite_rule_spn_order:0 "Храмы"
 activity_invite_rule_spn_order_desc:0 "Все члены Ордена в пределах вашей досягаемости."
 spn_conclave_join_temple_magus:0 "Храмовый Маг не пропускает Конклав"
 spn_conclave_join_council:0 "Заседает в совете"
 spn_conclave_join_oath:0 "Ждёт принесения присяги"
 spn_conclave_join_devoted:0 "Предан Ордену"
 spn_conclave_join_shy:0 "Не любит толпу"
 spn_conclave_preside_intent:0 "Председательствовать"
 spn_conclave_preside_intent_desc:0 "Провести Конклав так, как положено. Вы получаете [spn_order_standing|E] и престиж."
 spn_conclave_attend_intent:0 "Смотреть и учиться"
 spn_conclave_attend_intent_desc:0 "Не снимать маску и глядеть в оба. Вы получаете немного [spn_order_standing|E]."
 spn_seek_the_chair_intent:0 "Добиваться престола"
 spn_seek_the_chair_intent_desc:0 "Выставить себя в Великие Маги, когда дойдёт до голосования. Храмовые Маги смотрят, кто пришёл за этим."
 spn_seek_a_seat_intent:0 "Добиваться места"
 spn_seek_a_seat_intent_desc:0 "Дать понять, что вы хотите место в [spn_gnostic_council|E]. Когда место освободится, вас назовут первым."
 spn_speak_for_my_temple_intent:0 "Говорить за свой храм"
 spn_speak_for_my_temple_intent_desc:0 "Проследить, чтобы другие храмы услышали, что сделал ваш. Вы получаете больше [spn_order_standing|E]."
 spn_find_a_teacher_intent:0 "Найти учителя"
 spn_find_a_teacher_intent_desc:0 "Уехать с Конклава с наставником."
 spn_borrow_from_another_temple_intent:0 "Взять взаймы у другого храма"
 spn_borrow_from_another_temple_intent_desc:0 "Уехать с чем-то из [spn_reliquary|E] другого храма — в долг на три года."
 spn_ask_for_the_working_intent:0 "Просить о Переносе"
 spn_ask_for_the_working_intent_desc:0 "Попросить Магистрата провести [spn_order_transference|E] для вас — добровольцы уже ждут в комнате."
 spn_make_an_entrance_intent:0 "Произвести впечатление"
 spn_make_an_entrance_intent_desc:0 "Привезти доказательство содеянного: уничтоженного голема или демона либо примечательный магический предмет, положенный на стол. Послушник, сделавший это, возводится в Медикумы."
 spn_conclave_chair_empty_tt:0 "Престол Великого Мага пустует"
 spn_conclave_no_tutor_tt:0 "У вас нет наставника"
 spn_conclave_log_chair_title:0 "Новый Великий Маг"
 spn_conclave_log_chair:0 "По выбору Храмовых Магов престол занимает [CHARACTER.GetTitledFirstName]."
 spn_conclave_log_seat_title:0 "Место занято"
 spn_conclave_log_seat:0 "[CHARACTER.GetTitledFirstName] занимает место в Гностическом Совете."
 spn_conclave_toast_entrance:0 "Эффектное появление"
 spn_conclave_toast_entrance_desc:0 "Кто-то положил доказательство своих дел перед всем Конклавом."
 spn_conclave_call_decision:0 "Созвать Конклав"
 spn_conclave_call_decision_desc:0 "Созвать храмы Ордена на встречу под масками."
 spn_conclave_call_decision_tooltip:0 "Собрать храмы."
 spn_conclave_call_decision_confirm:0 "Разослать повестки"
 spn_conclave_call_decision_effect_tt:0 "Вы можете запланировать [spn_conclave|E] в столице своего графства."
 spn_conclave.0001.t:0 "Маски должны собраться"
 spn_conclave.0001.desc_chair:0 "Престол Великого Мага пустует, а храмы не станут ждать вечно. Ваш храм — старейший, так что созывать их надлежит вам.\n\nЗаписки уходят без имён. В каждой только место и срок."
 spn_conclave.0001.desc_prerogative:0 "Десять лет прошло с тех пор, как [spn_order|E] в последний раз решал, к чему стремиться. Храмы ждут, что их созовут.\n\nЗаписки уходят без имён. В каждой только место и срок."
 spn_conclave.0001.desc_will:0 "Вы решили, что храмы должны собраться. Записки уходят без имён. В каждой только место и срок."
 spn_conclave.0001.desc_second:0 "\n\n[spn_cv_second.GetTitledFirstName] приносит бумагу и воск и ждёт, где именно."
 spn_conclave.0001.a:0 "Выбрать, где они соберутся"
 spn_conclave.0001.b:0 "Не сейчас"
 spn_conclave.0001.b.tt:0 "Вы ещё два года сможете запланировать Конклав из списка мероприятий."
 spn_conclave.0002.t:0 "Конклав начинается"
 spn_conclave.0002.desc:0 "Они прибывают после темноты, по одному, разными дверями. Никто не называет имени. Никому и не нужно.\n\nКогда последний оказывается внутри, двери запирают, и маски поворачиваются к вам."
 spn_conclave.0002.a:0 "Начнём"
 spn_conclave.0100.t:0 "Знакомая маска"
 spn_conclave.0100.desc:0 "Одна из масок из другого храма то и дело поглядывает в вашу сторону. Когда пускают вино, [spn_cv_stranger.GetSheHe] встаёт рядом и тихо говорит, что у вас вид человека, который засиживается над книгами до глубокой ночи.\n\nВы знаете этот голос. Вы слышали его где-то за этими стенами."
 spn_conclave.0100.a:0 "Приподнять свою маску"
 spn_conclave.0100.a.tt:0 "Вы оба узнаёте, кто есть кто. Здесь может начаться дружба."
 spn_conclave.0100.b:0 "Промолчать"
 spn_conclave.0100.b.tt:0 "Молчание — первое из трёх слов."
 spn_conclave.0110.t:0 "Старая история"
 spn_conclave.0110.desc:0 "Старый Магистрат рассказывает новым членам, как всё началось: горстка учёных обнаружила, что некоторые старые книги говорят правду, и поклялась скрывать это знание от королей.\n\nОн рассказывает им о двух сёстрах, которые едва не погубили Орден, и о том, почему его члены никогда не поднимают мёртвых. Он рассказывает, зачем нужны маски: чтобы член, взятый охотниками, не мог назвать больше одного лица."
 spn_conclave.0110.a:0 "Спросить о книгах"
 spn_conclave.0110.a.tt:0 "Вы узнаёте кое-что о магии."
 spn_conclave.0110.b:0 "Спросить об охотниках"
 spn_conclave.0110.b.tt:0 "Вы узнаёте кое-что о том, как оставаться скрытыми."
 spn_conclave.0120.t:0 "Маска знает слишком много"
 spn_conclave.0120.desc:0 "Кто-то в простой серой маске проходит у вас за спиной и бормочет подробность вашей жизни, которой здесь не должен знать никто.\n\nКогда вы оборачиваетесь, серая маска уже на другом конце зала и говорит с кем-то другим."
 spn_conclave.0120.a:0 "Выяснить, кто это был"
 spn_conclave.0120.a.success:0 "Вы их нашли"
 spn_conclave.0120.a.success_desc:0 "Вы застали серую маску одну. Это была проверка, и вы её прошли."
 spn_conclave.0120.a.failure:0 "Исчезла"
 spn_conclave.0120.a.failure_desc:0 "Серой маски нигде не было. Это не даёт вам покоя несколько дней."
 spn_conclave.0120.b:0 "Оставить это"
 spn_conclave.0120.b.tt:0 "Наблюдательность: со временем вы узнаете, кто это был."
 spn_conclave.0200.t:0 "Обвиняемый(ая)"
 spn_conclave.0200.desc:0 "[spn_cv_accused_one.GetTitledFirstName] стоит в середине круга, держа свою маску в руках. Правила [spn_order|E] нарушены, и это известно всем храмам.\n\nМаски ждут, когда вы заговорите."
 spn_conclave.0200.a:0 "Простить"
 spn_conclave.0200.a.tt:0 "Дело закрыто. [spn_cv_accused_one.GetFirstName] запомнит, кто его закрыл."
 spn_conclave.0200.b:0 "Епитимья"
 spn_conclave.0200.b.tt:0 "[spn_cv_accused_one.GetFirstName] теряет [spn_order_standing|E], и дело закрыто."
 spn_conclave.0200.c:0 "Изгнать"
 spn_conclave.0200.c.tt:0 "[spn_cv_accused_one.GetFirstName] изгоняется из Ордена."
 spn_conclave.0300.t:0 "Эффектное появление"
 spn_conclave.0300.desc_item:0 "Присяги принесены наполовину, когда вы входите с опозданием, без маски, и кладёте [spn_cv_proof_art.GetName] на стол перед всеми.\n\nВ зале становится очень тихо."
 spn_conclave.0300.desc_kill:0 "Присяги принесены наполовину, когда вы входите с опозданием и катите по полу то, что осталось от вашей добычи. Оно останавливается у ног Храмового Мага.\n\nВ зале становится очень тихо."
 spn_conclave.0300.desc_raised:0 "\n\nКогда разговоры возобновляются, они — о вас. Прежде чем ночь кончится, вас называют Медикумом, и Великий Маг при всех говорит, что Орден будет ждать от вас великого."
 spn_conclave.0300.a:0 "Я вас не подведу"
 spn_conclave.0400.t:0 "Голосование"
 spn_conclave.0400.desc:0 "Престол Великого Мага пустует во главе зала. Один за другим Храмовые Маги, которые хотят его занять, встают рядом с ним.\n\nКогда приходит ваша очередь, вы пишете имя на клочке бумаги и опускаете его в чашу."
 spn_conclave.0400.c1:0 "[spn_cv_c1.GetTitledFirstName]"
 spn_conclave.0400.c2:0 "[spn_cv_c2.GetTitledFirstName]"
 spn_conclave.0400.c3:0 "[spn_cv_c3.GetTitledFirstName]"
 spn_conclave.0400.c4:0 "[spn_cv_c4.GetTitledFirstName]"
 spn_conclave.0400.abstain:0 "Оставить записку пустой"
 spn_conclave.0410.t:0 "Заполнить места"
 spn_conclave.0410.desc:0 "Место в [spn_gnostic_council|E] пустует. Как Великий Маг вы называете того, кто его займёт, и храмы подтверждают ваш выбор."
 spn_conclave.0410.n1:0 "[spn_cv_n1.GetTitledFirstName]"
 spn_conclave.0410.n2:0 "[spn_cv_n2.GetTitledFirstName]"
 spn_conclave.0410.n3:0 "[spn_cv_n3.GetTitledFirstName]"
 spn_conclave.0410.none:0 "Пока оставить пустым"
 spn_conclave.0410.none.tt:0 "Позже вы сможете пригласить кого-нибудь в совет."