l_russian:
 ev6.1.desc:0 "Я знаю тебя, смертный. Почему ты снова мешаешь мне?"
 ev6.1.0.a:0 "Мне нужна твоя поддержка."
 ev6.1.0.b:0 "Ты должен исполнить моё желание, демон."
 ev6.2.desc:0 "В центре круга призыва появляется фигура, сияющая магическим светом, которая медленно тускнеет. Ты чувствуешь, как твое сердце начинает биться быстрее, когда... Лилит улыбается тебе. 'Ты соскучился по мне, дорогой? - голос демоницы даже более привлекательный, чем ты помнил."
 ev6.2.0.a:0 "Да, останься со мной, моя любовь."
 ev6.2.0.b:0 "Я хочу, чтобы ты исполнил моё желание."
 ev6.3.desc:0 "Демон немедленно появляется в круге召唤. Он не выглядит восторженно от встречи с вами. 'Ты.' - сказал демон - 'Что тебе нужно на этот раз, маг?'"
 ev3.2.desc2:0 "'Мы встречаемся снова, маг. Что тебе нужно?'"
 ev6.4.desc:0 "'[this0.GetTitledFirstName] во плоти. Добро пожаловать. У меня нет для тебя особого предложения, но раз я здесь, я могу научить тебя новому заклинанию. Рассматривай это как подарок.'"
 hells_scepter:0 "Скипетр Ада"
 hells_scepter_desc:0 "Говорят, что этот артефакт принадлежит самому Люциферу. Неясно, как скипетр покинул Ад."
 ev93.1.title:0 "Загадочный Скипетр"
 ev93.1.desc:0 "Твои слуги нашли ценную вещь, скрытую в подземельях замка. Это искусно изготовленный скипетр из неизвестного сплава, и его поверхность, похоже, излучает приятное тепло. Ты не знаешь, что это, но это может пригодиться."
 hells_scepter1_terrain_cancel_negative_supply:0 "Позволяет Магам вызывать Демонов по типу или имени"
 hells_scepter2_terrain_cancel_negative_supply:0 "Непроницаемость к заклинанию Изгнание для Демонов"
 hells_scepter3_terrain_advantage:0 "Ежегодный опыт силы Ада для Демонов"
 ev12.0.c:0 "Это время призвать что-то действительно могущественное!"
 ev12.0.c_ct:0 "Эта опция доступна, потому что у вас есть Скипетр Ада."
 ev6.5.desc:0 "С помощью Скипетра Ада почти любой Демон ответит на ваш призыв. Вы можете призвать конкретного демона - или призвать по имени того, с кем уже встречались."
 ev6.5.0.a:0 "Великий Демон"
 trait_track_combat_magic:0 "Боёвая Магия"
 trait_track_combat_magic_desc:0 "Профессионализм в использовании боевых заклинаний может быть полезен как на поле боя, так и в дуэли против других магов."
 pot6:0 "Эликсир Харизмы"
 pot6_modifier:0 "Эликсир Харизмы"
 pot6_desc:0 "Употребление этой смеси даст вам большую послушность среди других правителей, по крайней мере на некоторое время."
 gain_pot6_ct:0 "Вы получили Эликсир Харизмы"
 drink_pot6_decision:0 "Использовать Эликсир Харизмы"
 drink_pot6_decision_tooltip:0 "Употребление этой смеси даст вам большую послушность среди других правителей."
 drink_pot6_decision_desc:0 "Употребление этой смеси даст вам большую послушность среди других правителей."
 drink_pot6_decision_confirm:0 "Выпейте зелье."
 pot7:0 "Зелье Чтения Умов"
 pot7_desc:0 "Использование этой смеси позволяет вам читать мысли других персонажей."
 gain_pot7_ct:0 "Вы получили зелье чтения мыслей."
 drink_pot7_decision:0 "Используйте зелье чтения мыслей."
 drink_pot7_decision_tooltip:0 "Использование этой смеси позволяет вам читать мысли других персонажей."
 drink_pot7_decision_desc:0 "Использование этой смеси позволяет вам читать мысли других персонажей."
 drink_pot7_decision_ct:0 "В течение 6 месяцев заклинание Скана Мысли #italic#! не будет потреблять насыщение силой."
 drink_pot7_decision_confirm:0 "Выпейте зелье."
 setting_high_whunters:0 "Высокий"
 setting_high_whunters_desc:0 "Охотники будут появляться чаще, а Главный охотник на ведьм получит дополнительные ресурсы."
 nyx_name:0 "Нокс"
 ev6.6.title:0 "Леди Снов"
 ev6.6.desc:0 "В круге призыва появляется женщина - вы чувствуете магическую ауру, исходящую от неё, вы никогда не испытывали ничего подобного ранее. Это не обычный демон. \n «Давненько я не была здесь,» - сказала Демоница, - «А прошло ещё больше времени с тех пор, как кто-то поймал меня заклинанием призыва. Ты не обычный практик.»"
 ev6.6.0.a:0 "Кто ты и какую силу ты можешь мне даровать, демон?"
 ev6.7.desc:0 "«Меня зовут Нокс. Я могу наблюдать за и манипулировать снами смертных и других существ. Это очень особая сила, которую я получила от своего мастера. Он может не одобрить, когда узнает о нашей встрече - и о, он точно узнает.»"
 ev6.7.0.a:0 "Кто твой господин?"
 ev6.7.0.b:0 "Влияние на сны? Это может быть полезно."
 ev6.7.0.c:0 "Я не хочу иметь дело с твоим господином, кем бы он ни был. Исчезни."
 ev6.8.desc:0 "'У него нет имени, хотя его противники иногда называют его Вечным Злом. Он так же стар, как и твой бог. К счастью, он редко интересуется твоим миром - у него более амбициозные цели.'"
 ev6.8.0.a:0 "Я вижу... Скажи, что ты можешь для меня сделать."
 ev6.8.0.b:0 "В таком случае, я не хочу связываться с твоим господином. Исчезни."
 ev6.9.desc:0 "'Я обладаю силой влиять на сны. Это безграничные возможности для манипуляции или получения информации. Что ты желаешь?'"
 ev6.9.desc2:0 "'Призвать меня для тебя небезопасно, маг. Чего ты хочешь в этот раз?'"
 ev6.9.0.a:0 "Пусть люди верят, что мои притязания законны."
 ev6.9.0.b:0 "Пусть люди проявляют ко мне больше уважения и подчинения."
 ev6.9.0.c:0 "Можешь сказать, являюсь ли я целью заговора?"
 ev6.9.0.c_ct:0 "Ты узнаешь, являешься ли ты целью какого-либо заговора."
 ev6.9.0.d:0 "Я хотел бы иметь хорошие сны, вот и всё."
 nyx_blessing_modifier:0 "Благословение Нокс"
 peaceful_dreams_modifier:0 "Мирные сны"
 ev6.10.desc:0 "Нет, я знаю сны большинства людей, и не вижу никаких сведений о том, что кто-то замышляет против вас. Хотя есть люди, которые вас ненавидят... В любом случае, я сделал, что вы просили. Прощайте."
 ev6.10.desc2:0 "Да, я знаю по крайней мере о заговоре против вас - [mscheme.GetFullActionName]. За этим стоит [sowner.GetTitledFirstName], конечно. Это всё, что я знаю на данный момент."
 ev6.10.0.a:0 "Я немедленно это раскрою."
 you_are_cursed:0 "Вы прокляты!"
 IS_MAGICAL_ARTIFACT:0 "Этот артефакт хорошо защищён: $VALUE|+0=$"
 mind_scan_terrain_cancel_negative_supply:0 "Разблокирует заклинание #italic Сканирование разума#!"
 mind_scan_ct1:0 "Вы узнаете, является ли цель частью заговора"
 mind_scan_ct2:0 "Вы можете узнать случайный секрет цели"
 mind_scan_ct3:0 "Не будет осведомлён о вашем заклинании"
 mind_scan:0 "Сканирование разума"
 mind_scan_desc:0 "Используйте силу чтения мыслей, чтобы заглянуть в разум другого человека."
 ev6.11.desc:0 "Похоже, что [recipient.GetTitledFirstName] не участвует в каком-либо заговоре, и вы также не нашли никакого важного секрета в голове [recipient.GetHerHis]."
 ev6.11.desc2:0 "В уме [recipient.GetTitledFirstName] вы ясно видите, что [recipient.GetSheHe] замышляет против [mstarget.GetTitledFirstName]. Это схема [mscheme.GetFullActionName]."
 ev6.11.desc3:0 "В уме [recipient.GetTitledFirstName] вы ясно видите, что [recipient.GetSheHe] является агентом в схеме, руководимой [mschemeowner2.GetTitledFirstName] против [mstarget.GetTitledFirstName]. Это схема [mscheme2.GetFullActionName]."
 ev6.11.desc4:0 "В уме [recipient.GetTitledFirstName] вы ясно видите, что [recipient.GetSheHe] в настоящее время не участвует в интригах, но у [recipient.GetSheHe] есть секреты [recipient.GetHerHis]..."
 DS_WANT_NOT_LOSS_MAGIC:0 "Боится потери магических артефактов: $VALUE|=+0$"
 DS_HAS_MAGE_RULERSHIP:0 "Магистратура #P Мага#!: $VALUE|=+0$"
 asmodeus_name:0 "Асмодей"
 ev6.12.title:0 "Властитель Ада"
 ev6.12.desc:0 "Фигура, излучающая мощную силу, материализуется в комнате. Вы понимаете, что это, вероятно, самое могущественное существо, с которым вы когда-либо сталкивались. Возможно, призыв этой сущности был не лучшей вашей идеей... \n 'Я Асмодей, принц Ада.' - вы видите, что демон пристально на вас смотрит."
 ev6.12.0.a:0 "Я уже где-то слышал это имя..."
 ev6.13.desc:0 "'Вы должны. Я правая рука самого Люцифера и правитель Шестого Круга Ада. Вам не повезло, что ваше заклинание призвало меня, смертный' - вы чувствуете, как сила демона проникает в ваш разум, и просматриваете свои воспоминания. Это не должно быть возможным, призывательный круг должен изолировать вас..."
 ev6.13.0.a:0 "Как...?"
 ev6.13.0.b:0 "Исчезни, сейчас же!"
 ev6.14.desc:0 "Демон засмеялся. 'Ты не слушаешь меня, смертный. Я почти самый могущественный демон в существовании, и ты, своей неосторожностью, призвал меня' - щелкнул он пальцами, и защитный круг призыва полностью испарился. Ничто не мешает демону поразить тебя всей своей мощью сейчас. \n 'Мое предложение: Служи или Умри.'"
 ev6.14.0.a:0 "Ни один Демон не будет мне командовать."
 ev6.14.0.b:0 "Угрозы здесь не нужны..."
 ev6.14.0.c:0 "Пусть будет так, я буду служить тебе."
 ev6.15.desc:0 "Ты ожидал нападения, но все же не смог его блокировать. Заклятье Демона мгновенно поразило тебя. Его мощь невообразима! \n 'Служи мне... или Умри.'"
 ev6.15.0.a:0 "Никогда!"
 ev6.15.0.a_ct:0 "Ты пытаешься атаковать Демона мощным ударом."
 ev6.15.0.a_ct2:0 "Ты атаковал Демона всеми своими силами."
 ev6.15.0.b:0 "Пусть будет так, я уступаю! Я твой."
 ev6.16.desc:0 "Твое заклятье безвредно отскочило от демона. Он, однако, кажется, удовлетворен. \n 'Впечатляюще. Тебе не хватает ни смелости, ни упорства. Твоя магия слаба, но, возможно, однажды ты добьешься величия, хотя бы для человека. Когда этот день придет, я вернусь, чтобы встретиться с тобой. Будь здоров, смертный.'"
 ev6.16.desc2:0 "Ваше заклинание безвредно отскочило от демона. Однако он, кажется, доволен.\n«Похвально. Тебе не занимать ни смелости, ни упорства. Магия твоя слаба, но, быть может, когда-нибудь ты достигнешь величия. В тот день я вернусь, чтобы сразиться с тобой. Прощай, [ROOT.Char.Custom('GetMortalDemon')].»"
 ev6.17.desc:0 "'Хороший выбор. Хотя вопрос в том, будет ли червяк вроде тебя полезен мне для чего-либо. Сначала небольшое испытание на верность. Позови своего наследника, я хочу, чтобы ты пронзил его мечом.'"
 ev6.17.0.a:0 "Если подумать... нет."
 ev6.18.desc:0 "'Это было испытание, но не испытание на верность. Ты провалился. Мне не нужен такой жалкий служитель. Прощай, смертный. И если ты позовешь меня снова, я больше не буду добрым.'"
 ev6.19.desc:0 "Твое заклинание поразило демона и сильно его потрясло. Он выглядит удивленным, но через мгновение он улыбнулся.\n 'Неплохо для человека. Было бы жаль убить тебя, пока ты не достигнешь своего полного потенциала. Увидимся, колдун, возможно.'"
 achoris_name:0 "Ахорис"
 ev6.20.title:0 "Неожиданный визит"
 ev6.20.desc:0 "Сегодня утром человек потребовал аудиенции. Хотя никто его не знает, он смог быть столь убедительным, что твои охранники пропустили его. Ты решил уделить ему несколько минут твоего драгоценного времени."
 ev6.20.0.a:0 "Кто ты, Stranger?"
 ev6.21.desc:0 "'Меня зовут Ахорис. Я член древнего ковена, который занимается важными делами этого мира. Одно из этих дел — защита Кольца Жизни. Артефакт был украден у нас давным-давно, но мы обнаружили, что сейчас он находится у тебя. Мы хотели бы его вернуть.'"
 ev6.21.0.a:0 "Я думаю, что кольцо будет в большей безопасности у меня."
 ev6.21.0.b:0 "Давайте поговорим о цене."
 ev6.22.desc:0 "'Ты глупец. Ты думаешь, что кольцо только дает и ничего не забирает взамен? Ты не представляешь, сколько людей его ищет. Кольцо будет в безопасности только в руках моего ковена.'"
 ev6.22.0.a:0 "Я тебе не верю. Убирайся, прежде чем я вызову стражу."
 ev6.22.0.b:0 "Что ж, в таком случае я могу отдать тебе кольцо, но не бесплатно."
 ev6.23.desc:0 "'Ты об этом пожалеешь!' После этих слов Ахорис покинул chamber. У тебя такое чувство, что с ним будут еще проблемы."
 ev6.23.0.a:0 "Я говорю стражам следить за ним."
 ev6.24.desc:0 "'Конечно, я заплачу золотом. Я также дам несколько свитков из архивов моего ковена в качестве дружеского жеста.'"
 ev6.25.desc:0 "Через несколько мгновений после ухода Ахориса, вы понимаете, что с Кольцом случилось что-то плохое. Его сила подавлена! Вы все еще чувствуете ее, но артефакт не работает должным образом, что-то его блокирует. Это должно быть какое-то злодейство этого Ахориса! Возможно, проведение магических исследований может это исправить, или вам придется найти другой способ."
 ev6.25.0.a_ct1:0 "Проведение магических исследований может восстановить силу кольца."
 ev6.25.0.a_ct2:0 "Узник и допрос Ахориса также могут решить проблему."
 artifact_ring_of_life_modifier0:0 "Подавленная сила"
 artifact_ring_of_life_modifier:0 "Полная сила Кольца Жизни."
 ev6.25.0.a:0 "Небольшая перенастройка ауры должна справиться с задачей."
 ev6.25.0.b:0 "Я смогу насытить кольцо своей магией."
 ev6.25.0.c:0 "Мне и Ахорису следует поговорить."
 ev3.22.c:0 "Мне нужно восстановить силу Кольца Жизни."
 ev3.22.c_ct:0 "Вы попытаетесь восстановить артефакт."
 ev6.26.desc:0 "Сначала вам нужно понять принцип работы кольца. Откуда на самом деле берется его сила? Как и зачем оно было создано? На многие вопросы нужно найти ответы."
 ev6.26.0.a:0 "Я начну с просмотра своих книг."
 ev6.26.0.b:0 "Некоторые эксперименты могут помочь здесь..."
 ev6.26.0.c:0 "Пусть мой ковен поищет полезную информацию."
 ev6.27.desc:0 "Вы нашли полезную информацию, но впереди вас ждет еще много работы. Похоже, что кольцо является более сложным артефактом, чем вы думали."
 ev6.27.0.a_ct:0 "Вам нужно больше времени, чтобы разобраться в этом."
 ev6.27.0.b_ct:0 "Вы заканчиваете свои магические исследования безрезультатно."
 ev6.28.0.b:0 "На самом деле, мои алхимические знания позволят мне сделать это дешевле."
 ev6.29.desc:0 "Вам удалось совершить прорыв - вы выяснили, как работает кольцо. Артефакт содержит демона - или, по крайней мере, некоторый фрагмент его силы. Связь с этой силой была разрушена, но вы можете произнести заклинание, которое это исправит."
 ev6.30.desc:0 "Ахорис в твоей власти. Тебе быстро удалось сломить его - он раскрыл тебе метод, с помощью которого смог починить кольцо. Однако ты не узнал ничего больше.\n 'Другие придут, чтобы остановить тебя!' - это были его последние слова перед тем, как он выпил ранее скрытый яд, у тебя не было времени остановить его."
 ev6.30.0.a:0 "По меньшей мере, кольцо снова работает."
 ev6.31.title:0 "Управление ковеном"
 ev6.31.desc:0 "Ты пришёл к выводу, что ковену нужно больше ресурсов для достижения своих целей. Возможно, стоит ввести небольшую плату за членство?"
 ev6.31.0.a:0 "Да, давай сделаем это."
 ev6.31.0.b:0 "Я мог бы сделать это, но лучше сначала укреплю свою позицию."
 ev6.32.desc:0 "Похоже, что один из членов твоего ковена - [hunter_vict.GetTitledFirstName] - стал жертвой охотников на ведьм. Тело [hunter_vict.GetHerHis|U] было найдено без головы, с пулей в сердце [hunter_vict.GetHerHis]. Вопрос в том, допрашивали ли [hunter_vict.GetSheHe] перед смертью [hunter_vict.GetHerHis] - если да, то весь ковен в опасности."
 ev6.32.0.a:0 "Проклятые охотники!"
 ev6.32.0.b:0 "Лучше не проводить Великий Ритуал какое-то время."
 ev6.32.0.c:0 "Я назначу вознаграждение за головы этих ублюдков."
 ev6.32.0.c_ct:0 "Охотники могут на время уменьшить свою активность."
 ev6.32.0.d:0 "Я найду способ отвлечь их от нашего ковена."
 ev6.33.title:0 "Вражда ковенов"
 ev6.33.desc:0 "Вы давно знаете, что другой ковен также активен в вашем королевстве. Вам это никогда не мешало, потому что, насколько вам известно, его участники в основном крестьяне. Однако недавно их ковен начал усиливаться, и их великая мастерица, похоже, действительно узнала несколько вещей о магии. Возможно, с этим нужно что-то сделать, прежде чем они станут проблемой."
 ev6.33.0.a:0 "Несколько казней крестьян напомнят им о своем месте."
 ev6.33.0.b:0 "Я отправлю наемников, чтобы решить это тихо."
 ev6.33.0.c:0 "Мои шпионы уничтожат этот ковен изнутри."
 MUST_ACCEPTS_WITCHCRAFT:0 "Ваша вера должна принять Колдовство"
 mage_rulership_tradition:0 "Магическое правление"
 mage_rulership_tradition_name:0 "Магическое правление"
 mage_rulership_tradition_desc:0 "Эта традиция рассматривает наличие магической склонности как естественный атрибут истинного правителя. Ваша сила и магические способности определяют ваше место в обществе."
 ALREADY_HAS_GE_PALACE:0 "У вас может быть только одно строение этого типа."
 MAGE_RULERSHIP_REQUIRED:0 "Вы должны иметь культурную традицию магического правления."
 culture_parameter_mage_rulership_rule:0 "Открывает цепочку строений Магической Башни."
 culture_parameter_mage_rulership_rule2:0 "Умение Учить Колдовство [interaction|E] имеет сокращенное время восстановления и увеличивает вашу династическую репутацию."
 culture_parameter_mage_rulership_rule3:0 "Казни восстанавливают уровни Насыщенности Силой."
 mage_rulership_execution:0 "Ваша сила растет!"
 culture_parameter_mage_rulership_rule4:0 "Маги более склонны участвовать в Магических Дуэлях."
 culture_parameter_mage_rulership_rule5:0 "Победитель Магического Дуэля может потребовать претензии проигравшего или главный титул вер王а."
 culture_parameter_mage_rulership_rule6:0 "Маги получают дополнительный престиж и повышенную оценку вассалов."
 culture_parameter_mage_rulership_rule7:0 "Аннулирование титула у не практикующего вассала не вызывает тирании."
 ev5.28.0.z3bb:0 "Я пощажу тебя, но ты доказал, что не заслуживаешь своих титулов."
 ev5.28.desc_lost6:0 "Вы ловко пытаетесь защититься от вражеских заклинаний, но ваш противник слишком силен! Вы быстро теряете силы и безжалостно падаете на колени. Ваш противник решает пощадить вас, но вам придется отдать некоторые из своих титулов."
 ev6.36.title:0 "Власть не для слабых."
 ev6.36.desc:0 "Ваш старший, [liege0.GetTitledFirstName], в отличие от вас, не обладает великими магическими способностями. Должен ли такой слабый правитель продолжать править? Возможно, это хорошая возможность задуматься о том, чтобы занять место [liege0.GetHerHis]."
 ev6.36.0.a:0 "Я обсудю это с другими вассалами."
 ev6.36.0.b:0 "Стоит напомнить [liege0.GetHerHim], что навыки [liege0.GetHerHis] меньше, чем мои."
 ev6.38.title:0 "Магическая грипп"
 ev6.38.desc:0 "Вы какое-то время чувствуете себя хуже, кажется, вы страдаете от какой-то болезни. Однако это нечто необычное, эта болезнь каким-то образом влияет на вашу магическую ауру и, как следствие, блокирует ваш поток силы. Похоже, что пока вы больны, вы не можете восстановить свою насыщенность силой."
 ev6.38.0.a:0 "Я надеюсь вскоре выздороветь."
 magic_flu_modifier:0 "Магическая грипп"
 HAS_MAGIC_FLU:0 "Вы не можете восстановить силы, пока болеете магическим гриппом."
 ev6.39.title:0 "Марионетка?"
 ev6.39.desc:0 "Вы недавно ощутили лёгкое изменение в вашей магической ауре - это может быть случайное нарушение ауры, или, возможно, кто-то наложил на вас заклинание. Если так, трудно сказать, когда это произошло и какое влияние это может оказать на вас. Вы пытались это расследовать, но не нашли никаких убедительных доказательств. Если это действительно заклинание, то следы в вашей ауре указывают на то, что это может быть заклинание подчинения. С другой стороны, такое заклинание не должно проходить сквозь вашу магическую защиту... верно?"
 ev6.39.0.a:0 "Кто-то контролирует меня?!"
 ev6.40.title:0 "Коррупция"
 ev6.40.desc:0 "Долгое воздействие мощной магии оставляет следы на вашем теле и разуме. Изменения, которые вы испытываете, вскоре станут необратимыми."
 ev6.40.0.a:0 "Алхимические методы лечения могут помочь."
 ev6.40.0.a_ct:0 "Проблема может вернуться в будущем."
 ev6.40.0.b:0 "Я использую магию только для благородных целей, коррупция мне не угрожает."
 ev6.41.title:0 "Иссохший источник"
 ev6.41.desc:0 "После многих лет использования магии вы чувствуете, что ваша сила угасает. Возможно, старость — это не только о теле, но и о духе и способности обрабатывать магическую силу."
 ev6.41.0.a:0 "Возраст — это тяжёлое бремя."
 ev6.41.0.b:0 "Я знаю способы предотвратить это."
 ev6.41.0.c:0 "Я нахожу решение в Чёрном Гримуаре."
 alhazred_dynasty:0 "Аль-Хазред"
 alhazred_house:0 "Аль-Хазред"
 alhazred_house_adj:0 "Аль-Хазред"
 mad_arab_nickname:0 "Безумный араб"
 singularity2_name:0 "Древняя Сингулярность Мк.II"
 singularity2_desc:0 "Древнее устройство, предназначенное для разрушения. Улучшенная версия имеет усиленный энергетический ядро и также множество дополнительных мер безопасности, а артефакт сам защищён заклинанием неуловимости."
 rule_magic_endings:0 "Колдовство: Возвращение Архимага"
 setting_normal_magic_endings:0 "Может появиться"
 setting_normal_magic_endings_desc:0 "Вам предстоит столкнуться со старинным противником с невероятной силой. Рекомендуется только для опытных игроков, ищущих дополнительный вызов в поздней игре."
 setting_never_magic_endings:0 "Не может появиться"
 setting_never_magic_endings_desc:0 "Древний архимаг не будет вас беспокоить."
 domination_range_terrain_cancel_negative_supply:0 "Заклинание Доминирования#! увеличило дальность действия."
 mind_scan_range_terrain_cancel_negative_supply:0 "Заклинание Чтение Мысли#! увеличило дальность действия."
 setting_eu_magic_arts:0 "Область игрока"
 setting_eu_magic_arts_desc:0 "Артефакты будут распределены в дипломатическом радиусе игрока."
 ev6.42.title:0 "Тайный Гость"
 ev6.42.desc:0 "Вдруг вы осознаёте, что ваш тронный зал стал неестественно тихим - придворные куда-то исчезли, а слуг и стражников нет. Вместо этого посреди комнаты стоит он - человек в маске, окружённый едва ощутимой магической аурой.\n 'Приветствую, маг. Я пришёл предложить вам замечательный подарок - мою дружбу.'"
 ev6.42.0.a:0 "Никогда не бывает слишком много друзей..."
 ev6.43.title:0 "Архимаг"
 ev6.43.desc:0 "'Я думаю так же. Меня зовут Абдул Аль-Хазред, я архимаго. Возможно, вы слышали обо мне. Вы могли даже прочитать мой Аль Азиф. Похоже, его перевели как Черный Гримуар.'"
 ev6.43.0.a:0 "Автор Черного Гримуара? Рад знакомству."
 ev6.44.desc:0 "'Что же я... ах, я вспомнил. Дружба. В мои времена друзья дарили друг другу подарки в доказательство преданности. Думаю, ваши магические артефакты станут отличным подарком. Для меня.'"
 ev6.44.0.a:0 "Я понимаю, что подарок, который вы мне подарите в ответ, будет столь же ценным?"
 ev6.45.desc:0 "'Я предлагаю свою дружбу в ответ. Поверьте, это много. Это то, что может спасти вас, по крайней мере на некоторое время.'"
 ev6.45.0.a:0 "Это не звучит очень дружелюбно."
 ev6.46.desc:0 "Вы не видите лица мага, но по его голосу узнаете, что он улыбается.\n 'Действительно. Но лучше немного исказить значение слова "дружба", чем стать трупом. Я древний архимага, а вы - никто. Немного везения и трюков, и люди смотрят на вас с восхищением. Жалко. Все, что мне потребовалось - это покинуть этот мир на несколько веков, и вот уже какой-то бесполезный дурак пытается занять мое место!'"
 ev6.46.0.a:0 "Это большой мир, в нём достаточно места для нас обоих."
 ev6.46.0.b:0 "Мы увидим, кто дурак, когда я с тобой покончу."
 ev6.47.desc:0 "'Что ж, в мире может быть только один истинный архимаг. Я был вежлив и решил поговорить первым, прежде чем сразу разрушить твой замок. Но теперь я вижу, что твою династию нужно уничтожить, это будет хорошим примером для остальных магов. Я дам тебе еще месяц жизни - в конце концов, я никуда не спешу и уже сделал ставку на то, попытаешься ли ты сбежать. Прощай.' - маг исчез."
 ev6.47.0.a:0 "Он может быть моим самым серьезным врагом."
 mage_nickname:0 "Маг"
 mage2_nickname:0 "Хранитель Тайн"
 mage3_nickname:0 "Мастер Знаний"
 mage4m_nickname:0 "Неугасимый Король"
 mage5m_nickname:0 "Заклинатель"
 mage6m_nickname:0 "Бог-Император"
 mage4f_nickname:0 "Королева Теней"
 mage5f_nickname:0 "Заклинательница"
 demonslayer_nickname:0 "Убийца Демонов"
 archmage_nickname:0 "Архимаг"
 ev6.48.desc:0 "В какой-то момент ты почувствовал волну магической энергии, поднимающейся вокруг тебя. Рядом с тобой открылся магический портал и... из него вышел демон."
 ev6.49.desc:0 "'Абдул Аль-Хазред вызвал меня, чтобы убить тебя. У нас обоих нет выбора, маг.'"
 ev6.49.0.a:0 "Если так, давай сразимся."
 ev6.49.0.b:0 "Я изгоняю тебя!"
 ev6.49.0.b_ct:0 "Ты пытаешься использовать заклинание изгнания демона."
 ev6.50.desc:0 "'К сожалению, Аль-Хазред предвидел это и наложил защитное заклинание. Нам придется сразиться.'"
 ev6.53.opening:0 ""
 ev6.53.desc:0 "Я слышал, что ты все еще жив. Я рад, что мой демон не убил тебя - это было бы слишком легко. Я предпочел бы видеть, как ты умоляешь о пощаде - и чем больше ты сопротивляешься, тем счастливее я становлюсь. В последнее время я был довольно занят (знаешь, политика...), но я подготовил для тебя несколько сюрпризов. Может быть, мы встретимся скоро..."
 ev6.53.0.a:0 "Подлец задумал что-то."
 ev6.54.desc:0 "Я узнал о твоей заговоре против меня. Довольно жалкая попытка. Надеюсь, в следующий раз ты постараешься больше."
 ev6.55.desc:0 "Твое магическое восприятие почувствовало, что было наложено мощное заклинание. Ты смог определить, что это был сильный проклятие, нацеленное на твоего наследника. К сожалению, заклинание нанесло огромные разрушения. Ты догадываешься, кто мог его наложить."
 ev6.55.0.a:0 "Аль-Хазред, ты ублюдок!"
 ev6.56.title:0 "Дубликат"
 ev6.56.desc:0 "Прогуливаясь по коридорам твоего замка, ты сталкиваешься с [rconc.GetTitledFirstName]. [rconc.GetSheHe|U] очень удивлён тебя видеть.\n«Мой господин, мы только что провели встречу. С вами. Но это не мог быть вы, так как вы здесь. Тогда кто этот человек в зале заседаний?»"
 ev6.56.0.a:0 "Это отличный вопрос!"
 ev6.56.0.a_ct:0 "Ты быстро направляешься проверить зал заседаний."
 ev6.57.desc:0 "В зале заседаний ты видишь... себя. Твоё отражение весело смотрит на тебя.\n«Это стало неловко, не так ли?»"
 ev6.58.desc:0 "Затем заклятие иллюзии исчезает, и перед тобою стоит Абдул Аль-Хазред.\n«У меня сегодня был выходной, и я подумал, что может быть, смогу немного помочь тебе с правлением. Видишь ли, у меня было насыщенное утро. То есть, у тебя было.»"
 ev6.59.desc:0 "«Ну, я отправил несколько трогательных писем твоим вассалам...»"
 ev6.60.desc:0 "«...Я потратил часть твоих денег, местный криминальный синдикат нуждался в дотации...»"
 ev6.60.0.a:0 "...!"
 ev6.61.desc:0 "'...и возможно, я приговорил несколько случайных людей к смерти от твоего имени.'"
 ev6.61.0.a:0 "Ты... ты..."
 ev6.61.0.b:0 "Достаточно - умри!"
 ev6.61.0.b_ct:0 "Ты атакуешь Мага заклинанием."
 ev6.62.desc:0 "'О, и я встретил [target.GetTitledFirstName]. Нам было очень весело!'"
 ev6.63.desc:0 "Возможно, ненависть дала тебе силу, или же это был Аль-Хазред, который слишком сосредоточился на своей речи, но твоё заклинание попало в него. Оно не пробило его магическую защиту полностью, но тебе удалось причинить ему вред. На мгновение он выглядел удивленным, а затем человек исчез. Он, должно быть, телепортировался в безопасное место."
 ev6.63.0.a:0 "Он за всё заплатит!"
 ev6.64.title:0 "Ответка"
 ev6.64.desc:0 "Это должен был быть день, как любой другой, когда вдруг луч смертоносной энергии вылетел с небес прямо в твой замок! Всё вспыхнуло огнем, ты можешь слышать только крики и вопли выживших. Это должна быть ответка Аль-Хазреда - у него тоже есть Древняя Сингулярность!"
 ev6.65.title:0 "Плохие новости"
 ev6.65.desc:0 "Плохие новости дошли до вас. [rconc.GetTitledFirstName] только что сообщил вам, что на вас и вашу семью назначена награда. Аль-Хазред платит 1000 монет за каждую голову. Этого достаточно, чтобы заинтересовать как наёмных убийц, так и местных правителей."
 ev6.65.0.a:0 "Я должен остановить его, прежде чем он убьёт нас всех."
 madman_modifier:0 "Безумец"
 madman_modifier_desc:0 "Этот человек славится как опасный безумец."
 ev2.61.g:0 "Я могу научить [lliege.GetHerHim] магии."
 ev6.66.title:0 "Поглощение детей"
 ev6.66.desc:0 "Ваша диета из детей плохо сказывается на вашей репутации. Хотя, на самом деле, нет доказательств ваших действий, многие начинают связывать вас с исчезновением детей."
 ev6.66.0.a:0 "Ну..."
 ev6.66.0.a_ct:0 "Исчезновение детей может отрицательно повлиять на вашу репутацию."
 fed_dark_blade_interaction_ct2:0 "#N может столкнуться с последствиями, если кто-то обнаружит этот поступок!#!"
 ev6.67.desc:0 "К сожалению, ваш визит в подземелья не остался незамеченным. Несколько придворных бродят поблизости, и если они увидят вас с Кровавым клинком, dripping with blood, они быстро догадаются, что вы натворили."
 ev6.67.0.a:0 "Если они начнут задавать вопросы, я убью и их."
 ev6.67.0.b:0 "Я всё равно не собираюсь это скрывать."
 ev6.67.0.c:0 "Меня касается, что я делаю в своих подземельях."
 ev6.67.0.a_ct:0 "Шум может привлечь больше народу."
 ev6.68.desc:0 "Шумы привлекли ещё больше придворных. Теперь держать всё в секрете станет ещё сложнее..."
 ev6.68.0.a:0 "Ну, они тоже умрут."
 ev6.68.0.b:0 "Пусть будет, я признаюсь во всём."
 ev3.5.h:0 "Убейте Аль-Хазреда!"
 ev6.70.desc:0 "«Сумасшедший араб» слишком силен даже для моей силы. Вы должны попросить меня о чём-то другом."
 ev6.70.0.a:0 "Тогда у меня есть другая просьба."
 MAGIC_DOMINATION_O1:0 "Принять изменение веры и культуры"
 ev6.71.desc:0 "Похоже, что в этом районе нет подходящего места для постройки Магической башни. Необходимо как-то решить эту проблему."
 ev6.71.0.b:0 "[place1.GetName] было бы хорошим местом."
 ev6.71.0.c:0 "Мы построим башню на [place2.GetName]."
 ev6.71.0.d:0 "Мне не нужна башня, маленькой лаборатории будет достаточно."
 magic_lab_modifier:0 "Магическая лаборатория"
 ev6.71.0.e:0 "Мне нужно рассмотреть все варианты."
 ev6.71.0.e_ct:0 "Вы пересмотрите местоположение башни через 10 лет."
 ev2.24.e:0 "Успокойтесь, рыцарь."
 ev2.24.e_ct:0 "Вы убедите рыцаря в том, что вы не угроза."
 ev28.0.c:0 "Владелец Скипетра Ада не обязан вставать на колени перед каким-либо демоном."
 ev6.72.desc:0 "Ах да, скипетр. Даже мне страшно до него дотянуться, и, как я знаю, Люцифер хотел бы вернуть его. Я предпочитаю не стоять между вами. Прощай, маг."
 ev6.73.desc:0 "В последнее время ваши советники заметили, что вы работаете над чем-то особенным. Видимо, они ожидают, что вы покажете им свой проект или, по крайней мере, сделаете какое-то заявление об этом."
 ev6.73.0.a:0 "Это дело магов."
 ev6.73.0.b:0 "Чем меньше вы знаете, тем дольше живете."
 ev6.73.0.c:0 "Я могу показать вам детали."
 ev6.73.0.d:0 "Это великолепный проект, но вам не нужно знать больше."
 ALREADY_HAS_STRONG_HOOK:0 "У вас уже есть сильная зацепка на этом персонаже."
 ev3.21.a_ctct:0 "Арканический Фокус открыт!"
 md_doom_spell3_terrain_advantage:0 "Прогресс противника [doom_spell|E]"
 bounty_for_head_modifier:0 "Награда за живого или мертвого (скорее мертвого)"
