l_russian:

 ############################################################
 # Supernatural 2.41 -- GLITTERHOOF
 # Glitterhoof is by Buck (Steam Workshop 2889293511), with his permission. "Of Course" is his event, in his words.
 ############################################################

 spn_glitterhoof_name:0 "Глиттерхуф"

 trait_spn_horse:0 "Лошадь"
 trait_spn_horse_desc:0 "Это лошадь."
 trait_spn_horse_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лошадь."

 spn_blessed_by_the_stables_modifier:0 "Благословлён конюшней"
 spn_blessed_by_the_stables_modifier_desc:0 "Кто-то решил, что у этой лошади должна быть семья. Никто не остановил."
 spn_undying_steed_modifier:0 "Бессмертный скакун"
 spn_undying_steed_modifier_desc:0 "Кровь вампира, данная лошади. Этот конь не стареет и не устаёт, а другие лошади к нему не подходят."

 spn_replaced_by_a_horse_opinion:0 "Заменил меня лошадью"
 spn_glitterhoof_envoy_charmed_opinion:0 "Очарован лошадью"
 spn_glitterhoof_envoy_insulted_opinion:0 "Послал лошадь меня встречать"

 # Of Course (Buck's)
 spn_glitterhoof.0001.t:0 "Ну конечно"
 spn_glitterhoof.0001.desc:0 "Мой конь всегда казался мне надёжным существом — качество, которого, на мой взгляд, остро не хватает моим советникам. Пора кое-что встряхнуть. Я назначу его своим новым канцлером."
 spn_glitterhoof.0001.t_possessed:0 "Голос говорит"
 spn_glitterhoof.0001.desc_possessed:0 "Голос молчал несколько дней. Сегодня он заговорил, и очень ясно. «Конь мудрее их всех. Посади коня в совет».\n\nТы смотришь на Глиттерхуфа. Глиттерхуф смотрит на тебя. Голос прав. Обычно он прав."
 spn_glitterhoof.0001.a:0 "Глиттерхуф, назначаю тебя канцлером державы."
 spn_glitterhoof.0001.a_camp:0 "Глиттерхуф, нарекаю тебя своим Вторым."
 spn_glitterhoof.0001.b:0 "Не сегодня."
 spn_glitterhoof.0001.b.tt:0 "Глиттерхуф остаётся при твоём дворе. Он по-прежнему лошадь."

 # The Chancellor Receives an Envoy
 spn_glitterhoof.0002.t:0 "Канцлер принимает посланника"
 spn_glitterhoof.0002.desc:0 "Посланник от [spn_gh_foreign.GetTitledFirstName] проделал долгий путь. По обычаю, первой его принимает твоя правая рука.\n\nПосланник смотрит на [spn_gh_horse.GetFirstName]. [spn_gh_horse.GetFirstName] смотрит на посланника. Никто не объяснил посланнику, что делать."
 spn_glitterhoof.0002.a:0 "Пусть говорит от имени державы"
 spn_glitterhoof.0002.a.tt:0 "Может пройти хорошо. Может пройти очень плохо."
 spn_glitterhoof.0002.a.success:0 "Посланник очарован"
 spn_glitterhoof.0002.a.failure:0 "Посланник оскорблён"
 spn_glitterhoof.0002.b:0 "Говорить буду я"

 # Your Father's Horse
 spn_glitterhoof.0003.t:0 "Конь твоего отца"
 spn_glitterhoof.0003.desc:0 "[spn_gh_horse.GetFirstName] принадлежал [spn_gh_previous.GetTitledFirstName], а теперь [spn_gh_horse.GetFirstName] твой. Двор смотрит, что ты с ним сделаешь."
 spn_glitterhoof.0003.a:0 "Он остаётся"
 spn_glitterhoof.0003.a.tt:0 "[spn_gh_horse.GetFirstName] сохраняет свою должность. Двор будет судачить."
 spn_glitterhoof.0003.b:0 "В конюшню"
 spn_glitterhoof.0003.b.tt:0 "[spn_gh_horse.GetFirstName] оставляет должность и остаётся при твоём дворе."

 # The Great Pasture
 spn_glitterhoof.0004.t:0 "Великое пастбище"
 spn_glitterhoof.0004.desc:0 "[spn_gh_dead.GetFirstName] умер. Он служил так хорошо, как только может служить лошадь, — а некоторые говорят, что лучше большинства."
 spn_glitterhoof.0004.a:0 "Похоронить его под старым дубом"
 spn_glitterhoof.0004.b:0 "Он был лошадью"

 # The Horse Question
 spn_glitterhoof.0010.t:0 "Лошадиный вопрос"
 spn_glitterhoof.0010.desc:0 "При дворе слишком много лошадей. Они едят за столом. Заседают в совете. Одна из них стоит в очереди на герцогство.\n\nТвоим людям это надоело, и они хотят, чтобы ты выбрал."
 spn_glitterhoof.0010.a:0 "Лошади тоже люди"
 spn_glitterhoof.0010.a.tt:0 "Лошади остаются. Над тобой будут смеяться."
 spn_glitterhoof.0010.b:0 "Очистить конюшни"
 spn_glitterhoof.0010.b.tt:0 "Все лошади при твоём дворе умирают."
 spn_glitterhoof.0010.c:0 "Пусть решат поединком"
 spn_glitterhoof.0010.c.tt:0 "[spn_gh_champion.GetTitledFirstName] сражается со старейшей лошадью, [spn_gh_eldest.GetFirstName], — для истории."
 spn_glitterhoof.0010.c.man:0 "Побеждает человек"
 spn_glitterhoof.0010.c.horse:0 "Побеждает лошадь"

 # Interactions
 spn_glitterhoof_spouse_interaction:0 "Позволить лошади вступить в брак"
 spn_glitterhoof_spouse_interaction_desc:0 "Разрешить этой лошади жениться и заводить жеребят."
 spn_glitterhoof_spouse_interaction_tt:0 "[recipient.GetFirstName] может вступить в брак и заводить жеребят. Жеребята рождаются лошадьми, и с ними может вступить в брак кто угодно.\n\nЖени [recipient.GetHerHim] на ком-нибудь при своём дворе или найди достаточно отчаявшуюся семью."
 spn_glitterhoof_blood_interaction:0 "Дать лошади свою кровь"
 spn_glitterhoof_blood_interaction_desc:0 "Напои эту лошадь своей кровью. Она не станет вампиром. Она станет чем-то."
 spn_glitterhoof_blood_interaction_tt:0 "[recipient.GetFirstName] становится бессмертным и получает прозвание Неумирающий. Сделать это можно один раз."
