l_russian:
 spn_glitterhoof_name:0 "Glitterhoof"
 trait_spn_horse:0 "A Horse"
 trait_spn_horse_desc:0 "This is a horse."
 trait_spn_horse_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a horse."
 spn_blessed_by_the_stables_modifier:0 "Blessed by the Stables"
 spn_blessed_by_the_stables_modifier_desc:0 "Somebody decided this horse should have a family. Nobody stopped them."
 spn_undying_steed_modifier:0 "Undying Steed"
 spn_undying_steed_modifier_desc:0 "Vampire blood, given to a horse. This one does not age or tire, and the other horses will not go near it."
 spn_replaced_by_a_horse_opinion:0 "Replaced me with a horse"
 spn_glitterhoof_envoy_charmed_opinion:0 "Charmed by the horse"
 spn_glitterhoof_envoy_insulted_opinion:0 "Sent a horse to greet me"
 spn_glitterhoof.0001.t:0 "Of Course"
 spn_glitterhoof.0001.desc:0 "My horse has always struck me as being a dependable sort, a quality I feel is sorely lacking in my councillors. Time to shake things up a bit. I will appoint it as my new Chancellor."
 spn_glitterhoof.0001.t_possessed:0 "The Voice Says"
 spn_glitterhoof.0001.desc_possessed:0 "The voice has been quiet for days. Today it speaks, and it is very clear. \"The horse is wiser than all of them. Put the horse on the council.\"\n\nYou look at Glitterhoof. Glitterhoof looks back. The voice is right. It usually is."
 spn_glitterhoof.0001.a:0 "Glitterhoof, I appoint thee as the Chancellor of the realm."
 spn_glitterhoof.0001.a_camp:0 "Glitterhoof, I name thee my Second."
 spn_glitterhoof.0001.b:0 "Not today."
 spn_glitterhoof.0001.b.tt:0 "Glitterhoof stays at your court. He is still a horse."
 spn_glitterhoof.0002.t:0 "The Chancellor Receives an Envoy"
 spn_glitterhoof.0002.desc:0 "An envoy from [spn_gh_foreign.GetTitledFirstName] has come a long way. By custom, your right hand receives him first.\n\nThe envoy looks at [spn_gh_horse.GetFirstName]. [spn_gh_horse.GetFirstName] looks at the envoy. Nobody has told the envoy what to do."
 spn_glitterhoof.0002.a:0 "Let him speak for the realm"
 spn_glitterhoof.0002.a.tt:0 "It could go well. It could go very badly."
 spn_glitterhoof.0002.a.success:0 "The envoy is charmed"
 spn_glitterhoof.0002.a.failure:0 "The envoy is insulted"
 spn_glitterhoof.0002.b:0 "I will do the talking"
 spn_glitterhoof.0003.t:0 "Your Father's Horse"
 spn_glitterhoof.0003.desc:0 "[spn_gh_horse.GetFirstName] was [spn_gh_previous.GetTitledFirstName]'s, and now [spn_gh_horse.GetFirstName] is yours. The court is watching to see what you do with him."
 spn_glitterhoof.0003.a:0 "He stays"
 spn_glitterhoof.0003.a.tt:0 "[spn_gh_horse.GetFirstName] keeps his place. The court will talk."
 spn_glitterhoof.0003.b:0 "To the stables"
 spn_glitterhoof.0003.b.tt:0 "[spn_gh_horse.GetFirstName] gives up the post and stays at your court."
 spn_glitterhoof.0004.t:0 "The Great Pasture"
 spn_glitterhoof.0004.desc:0 "[spn_gh_dead.GetFirstName] is dead. He served as well as a horse can, which some say was better than most."
 spn_glitterhoof.0004.a:0 "Bury him under the old oak"
 spn_glitterhoof.0004.b:0 "He was a horse"
 spn_glitterhoof.0010.t:0 "The Horse Question"
 spn_glitterhoof.0010.desc:0 "There are too many horses at court. They eat at the table. They sit on the council. One of them is in line for a duchy.\n\nYour people have had enough, and they want you to choose."
 spn_glitterhoof.0010.a:0 "Horses are people too"
 spn_glitterhoof.0010.a.tt:0 "The horses stay. People will laugh at you."
 spn_glitterhoof.0010.b:0 "Clear the stables"
 spn_glitterhoof.0010.b.tt:0 "Every horse at your court dies."
 spn_glitterhoof.0010.c:0 "Let them fight it out"
 spn_glitterhoof.0010.c.tt:0 "[spn_gh_champion.GetTitledFirstName] fights [spn_gh_eldest.GetFirstName], the eldest horse, for the record."
 spn_glitterhoof.0010.c.man:0 "The man wins"
 spn_glitterhoof.0010.c.horse:0 "The horse wins"
 spn_glitterhoof_spouse_interaction:0 "Let the Horse Take a Spouse"
 spn_glitterhoof_spouse_interaction_desc:0 "Allow this horse to marry and have foals."
 spn_glitterhoof_spouse_interaction_tt:0 "[recipient.GetFirstName] can marry, and can have foals. Foals are born horses, and anyone may marry them.\n\nMarry [recipient.GetHerHim] to someone in your own court, or find a family desperate enough."
 spn_glitterhoof_blood_interaction:0 "Give the Horse Your Blood"
 spn_glitterhoof_blood_interaction_desc:0 "Feed this horse your blood. It will not become a vampire. It will become something."
 spn_glitterhoof_blood_interaction_tt:0 "[recipient.GetFirstName] becomes immortal and is known as the Undying. You can do this once."
