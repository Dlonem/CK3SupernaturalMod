l_russian:
 # Supernatural 2.38 "The Blue Rose" -- the Vade Maecum Infernal (WORK-ORDER-2.38 §12).
 spn_vade.0100.t:0 "Оно хочет быть целым"
 spn_vade.0100.desc:0 "Шкура сегодня неспокойна. Она снова и снова разворачивает тебя в одну сторону — туда, где [spn_vade_heard_holder.GetTitledFirstName].\n\n[spn_vade_heard_holder.GetTitledFirstName] держит страницу [spn_vade_maecum|E], и страница зовёт остальные."
 spn_vade.0100.desc_many:0 " Это не единственная."
 spn_vade.0100.a:0 "Пойти за ней"
 spn_vade.0100.b:0 "Оставить как есть"

 spn_vade.0110.t:0 "Страница зовёт"
 spn_vade.0110.desc_silverback:0 "Страница [spn_vade_maecum|E] попала тебе в руки, и шкура Среброспин замирает внутри тебя.\n\nШкура уже хранила страницу прежде. Она знает, что книга делает с людьми. Она хочет, чтобы ты уберёг эту от всякого, кто пустит её в дело."
 spn_vade.0110.desc_timber:0 "Страница [spn_vade_maecum|E] попала тебе в руки. Шкура Кряж хочет унести её куда-то глубоко в лес, где никто и никогда её не найдёт."
 spn_vade.0110.desc_tundra:0 "Страница [spn_vade_maecum|E] попала тебе в руки. Шкура Тундра терпелива. Она хочет, чтобы ты держал(а) страницу близко и молчал(а)."
 spn_vade.0110.desc_graybeard:0 "Страница [spn_vade_maecum|E] попала тебе в руки. Шкура Седобород хочет, чтобы ты встал(а) над ней, как волк над добычей, и бросил(а) вызов всякому, кто придёт за ней."
 spn_vade.0110.desc_midnight:0 "Страница [spn_vade_maecum|E] попала тебе в руки. Шкура Полночь в ярости. Книга — единственное, что шкура ненавидит сильнее охотников."
 spn_vade.0110.desc_alpha:0 "Страница [spn_vade_maecum|E] попала тебе в руки. Шкура Вожак хочет, чтобы её стерегла вся стая — до последнего волка, пока не станет безопасно."
 spn_vade.0110.a:0 "Я буду её хранить"
 spn_vade.0110.b:0 "Пусть её возьмёт Маг"

 spn_vade.0120.t:0 "Страницы тянутся друг к другу"
 spn_vade.0120.desc:0 "Ты держишь(держишь) у себя две страницы [spn_vade_maecum|E], и шкура не хочет, чтобы они лежали рядом. Ты просыпаешься с разодранной рукой и не помнишь, как это вышло."
 spn_vade.0120.a:0 "Она не хочет их"

 spn_vade.0122.t:0 "Его тянет к своим"
 spn_vade.0122.desc:0 "Страница, которую хранит твоя шкура, чует рядом другую часть книги. Ночью она тянет — и ты просыпаешься в крови."
 spn_vade.0122.a:0 "Оно хочет быть целым"

 spn_vade.0130.t:0 "Кто-то тянет шкуру"
 spn_vade.0130.desc:0 "[spn_th_caster.GetTitledFirstName] творит над тобой магию с другого конца комнаты. Ты чувствуешь, как [spn_th_caster.GetTitledFirstName] тянет шкуру, пытаясь вырвать из неё страницу."
 spn_vade.0130.a:0 "Держаться"
 spn_vade.0130.a_tt:0 "Чем глубже твоя [spn_hide_bond|E], тем больше шансов, что шкура устоит. Не устоит — страницу из неё вырвут, а ты будешь ранен(а). Если ты уже был(а) тяжело ранен(а), ты умрёшь."
 spn_vade_toast_hide_held:0 "Шкура удержала"
 spn_vade_toast_hide_torn:0 "Страницу вырвали"

 spn_vade.0200.t:0 "Страницы отвечают"
 spn_vade.0200.desc:0 "Ты расстилаешь карту и спрашиваешь у неё про книгу. Булавка движется сама и останавливается там, где правит [spn_named_holder.GetTitledFirstName]."
 spn_vade.0200.desc_none:0 "Ты расстилаешь карту и спрашиваешь у неё про книгу. Булавка не двигается. Ни у кого в твоей досягаемости нет страницы."
 spn_vade.0200.a:0 "Теперь я знаю"

 spn_vade.0211.t:0 "Что нашёл голем"
 spn_vade.0211.desc:0 "[spn_golem.GetFirstName] вернулся. Говорить он не умеет, но пальцем чертит в пыли герб. Ты узнаёшь его: [spn_named_holder.GetTitledFirstName]."
 spn_vade.0211.desc_none:0 "[spn_golem.GetFirstName] вернулся ни с чем. Где бы ни были страницы, он их не нашёл."
 spn_vade.0211.a:0 "Хорошо"

 spn_vade.0212.t:0 "Голем вернулся не тем"
 spn_vade.0212.desc:0 "[spn_golem.GetFirstName] вернулся, но кто-то до него добрался. Одна рука висит плетью, и он врезается в стены."
 spn_vade.0212.a:0 "Кто это сделал?"

 spn_vade.0300.t:0 "Книга называет твоего сына"
 spn_vade.0300.desc:0 "[spn_vade_contract|E] заключён. Утром в книге появляется новая строка, красным: имя твоего первенца, [ROOT.Char.MakeScope.Var('spn_vade_firstborn').GetCharacter.GetFirstName].\n\nВот она, цена. У тебя три года, чтобы её уплатить."
 spn_vade.0300.desc_bastard:0 "[spn_vade_contract|E] заключён. Утром в книге появляется строка, красным: имя, [ROOT.Char.MakeScope.Var('spn_vade_firstborn').GetCharacter.GetFirstName].\n\nТы не знал(а), что этот человек — твоей крови. Книга знала. Вот она, цена, и у тебя три года, чтобы её уплатить."
 spn_vade.0300.desc_none:0 "[spn_vade_contract|E] заключён. Утром в книге написана строка, красным: место для имени — и оно пустое.\n\nЖивого сына твоей крови нет. Книге нечем заплатить."
 spn_vade.0300.a:0 "Да будет так"

 spn_vade.0310.t:0 "Последняя цена"
 spn_vade.0310.desc:0 "Свидетель здесь. Пальца нет. [spn_lp_son.GetFirstName] стоит перед тобой и не знает почему.\n\nКнига открыта на столе."
 spn_vade.0310.a:0 "Уплатить"
 spn_vade.0310.b:0 "Подсунуть ей другого"
 spn_vade.0310.b_tt:0 "Книгу не обмануть. [spn_vade_contract|E] не исполняется, и книга забирает тебя."
 spn_vade.0310.c:0 "Не сейчас"

 spn_vade.0320.t:0 "Книга забирает тебя"
 spn_vade.0320.desc:0 "Три года истекли. Ты не заплатил(а).\n\nСтраницы переворачиваются сами, всё быстрее и быстрее, и комната темнеет."
 spn_vade.0320.a:0 "Нет"

 spn_vade.0330.t:0 "Советник предлагает себя"
 spn_vade.0330.desc:0 "[spn_co_councilor.GetTitledFirstName] приходит к тебе наедине. [spn_co_councilor.GetSheHe|U] знает, что ты делаешь с книгой.\n\n"Тебе нужен свидетель. Пусть это буду я. Лучше я, чем тот, кто тебя продаст.""
 spn_vade.0330.a:0 "Будь моим свидетелем"
 spn_vade.0330.b:0 "Нет"

 spn_vade.0340.t:0 "Развеивание"
 spn_vade.0340.desc:0 "Великий Маг [spn_un_magus.GetTitledFirstName] стоит перед тобой с двумя членами [spn_gnostic_council|E]. Они говорят одни и те же слова, и книга в твоих руках кричит."
 spn_vade.0340.a:0 "..."

 spn_vade.0400.t:0 "Разорвать её"
 spn_vade.0400.desc:0 "Ты кладёшь [spn_vade_maecum|E] на стол и достаёшь нож. На то, чтобы собрать эту книгу, ушло четыре страницы. Чтобы её разъять, понадобится четыре.\n\nОдна страница может уйти волку, который станет её хранить. Остальные разлетятся."
 spn_vade.0400.silverback:0 "Отдать одну тому, кто носит Среброспин"
 spn_vade.0400.timber:0 "Отдать одну тому, кто носит Кряж"
 spn_vade.0400.tundra:0 "Отдать одну тому, кто носит Тундру"
 spn_vade.0400.graybeard:0 "Отдать одну тому, кто носит Седоборода"
 spn_vade.0400.midnight:0 "Отдать одну тому, кто носит Полночь"
 spn_vade.0400.alpha:0 "Отдать одну тому, кто носит Вожака"
 spn_vade.0400.a:0 "Разбросать их все"
 spn_vade.0400.b:0 "Оставить книгу целой"

 spn_vade.0410.t:0 "Книга рассыпается"
 spn_vade.0410.desc:0 "[spn_vade_maecum|E], что ты когда-то держал(а), больше нет — и четырёх её страниц вместе с ней. Где-то они уже в других руках."
 spn_vade.0410.a:0 "Скатертью дорога"

 spn_vade.voice_named:0 "Голос, которым шепчет книга, — [spn_vade_voice.GetFirstName]."
 spn_vade.voice_old:0 "Книга шепчет голосом старше собственного пергамента."
 spn_vade.voice_blood:0 "\n\nТы знаешь этот голос. [spn_vade_voice.GetFirstName] был(а) твоей крови. [spn_vade_voice.GetFirstName] звучит моложе, чем ты помнишь."
 
 spn_vade.0510.t:0 "Что он знал"
 spn_vade.0510.desc:0 "\n\nОн предлагает научить тебя тому, что узнал при жизни. Он хочет, чтобы ты слушал."
 spn_vade.0510.a:0 "Научи меня"
 spn_vade.0510.b:0 "Закрыть книгу"

 spn_vade.0511.t:0 "Имя за имя"
 spn_vade.0511.desc:0 "\n\nОн знает кое-что о ком-то из твоих близких. Он расскажет, если ты будешь слушать дальше."
 spn_vade.0511.a:0 "Расскажи"
 spn_vade.0511.b:0 "Береги свои тайны"

 spn_vade.0512.t:0 "Он показывает, где"
 spn_vade.0512.desc_page:0 "\n\n«Другая страница у [spn_vw_holder.GetTitledFirstName]. Иди и возьми её.»"
 spn_vade.0512.desc_seal:0 "\n\n«Кольцо царя где-то там. Я могу сказать, где.»"
 spn_vade.0512.desc_relic:0 "\n\n«У [spn_vw_relic.GetTitledFirstName] есть то, что тебе нужно. Я могу сказать, что именно.»"
 spn_vade.0512.desc_nothing:0 "\n\nОн пытается тебе что-то показать, но там ничего нет."
 spn_vade.0512.a:0 "Покажи"
 spn_vade.0512.b:0 "Я не хочу знать"

 spn_vade.0513.t:0 "Доверши то, что не смог я"
 spn_vade.0513.desc:0 "\n\n«Я был так близко. У меня были все четыре. Свяжи её и доверши то, что начал я.»"
 spn_vade.0513.a:0 "Может быть"
 spn_vade.0513.b:0 "Никогда"

 spn_vade.0514.t:0 "Выпусти меня"
 spn_vade.0514.desc:0 "\n\n«Выпусти меня. Прошу. Я так долго здесь.»"
 spn_vade.0514.a:0 "Я найду способ"
 spn_vade.0514.b:0 "Молчи"

 spn_vade.0515.t:0 "Книга голодна"
 spn_vade.0515.desc:0 "\n\nКнига не кормлена. Ей нужно, чтобы кто-то страдал, и ближе всех ты."
 spn_vade.0515.a:0 "Накорми её"
 spn_vade.0515.b:0 "Заморить её голодом"

 spn_vade.0520.t:0 "Они знают твоё имя"
 spn_vade.0520.desc:0 "Ты слушал слишком часто. Сегодня каждый голос в книге говорит разом, и все они называют твоё имя.\n\n«Останься с нами. Узнай то, что знаем мы.»"
 spn_vade.0520.a:0 "Я не один из вас"
 spn_vade.0520.b:0 "Научи меня"

 spn_vade.0530.t:0 "Они свободны"
 spn_vade.0530.desc:0 "Последняя страница [spn_vade_maecum|E] обращается в пепел. На миг каждая свеча в комнате клонится к тебе, а затем замирает.\n\nДуши из книги свободны."
 spn_vade.0530.desc_names:0 "\n\nСреди них были [GetGlobalVariable( 'spn_vade_soul_1' ).Char.GetFirstName] и многие до него."
 spn_vade.0530.desc_old:0 "\n\nИхних имён не знает ни один живой."
 spn_vade.0530.a:0 "Покойтесь"

 spn_vade.0540.t:0 "Имена в книге"
 spn_vade.0540.desc:0 "Ты переворачиваешь книгу к последней странице. Имена тех, кого она взяла, записаны там, от самых новых к старым."
 spn_vade.0540.soul_1:0 "\n- [GetGlobalVariable( 'spn_vade_soul_1' ).Char.GetFirstName]"
 spn_vade.0540.soul_2:0 "\n- [GetGlobalVariable( 'spn_vade_soul_2' ).Char.GetFirstName]"
 spn_vade.0540.soul_3:0 "\n- [GetGlobalVariable( 'spn_vade_soul_3' ).Char.GetFirstName]"
 spn_vade.0540.soul_4:0 "\n- [GetGlobalVariable( 'spn_vade_soul_4' ).Char.GetFirstName]"
 spn_vade.0540.soul_5:0 "\n- [GetGlobalVariable( 'spn_vade_soul_5' ).Char.GetFirstName]"
 spn_vade.0540.more:0 "\n...и ещё [ROOT.Char.MakeScope.Var('spn_vn_more').GetValue|0]."
 spn_vade.0540.old:0 "\n\nДо них: те, кого никто не помнит: рыцарь, разорвавший её на четыре части, и Великий Магус, у которого её отняли первые Рыцари Голубой Розы."
 spn_vade.0540.a:0 "Закрыть"

 spn_vade.0550.t:0 "Узы разрываются"
 spn_vade.0550.desc:0 "Ритуал длится всю ночь. На рассвете что-то отпускает тебя, как разжимается ладонь.\n\nТы больше не свидетель книги."
 spn_vade.0550.a:0 "Свободен"

 spn_vade.0560.t:0 "Камень открывается"
 spn_vade.0560.desc:0 "Ты произносишь слова повеления, и чёрный камень раскалывается пополам. Внутри лежит страница, сухая и целая.\n\nТеперь она засчитывается."
 spn_vade.0560.a:0 "Наконец"