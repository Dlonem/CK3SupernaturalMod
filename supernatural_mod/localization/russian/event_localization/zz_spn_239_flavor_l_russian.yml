l_russian:
 # Supernatural 2.39 -- F14: Order romance, the three words, the Temple Magus and the council, the pack's night home.
 # T17: an opinion or a relation reason is seen by the other person, so none of these names the Order, a temple, the
 # Rose or a Magus.
 spn_order_favouritism_opinion:0 "Фаворитизм"
 spn_pack_home_opinion:0 "Бегали вместе"
 spn_rel_order_advance:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали любовниками после долгой ночи занятий."
 spn_rel_pack_night:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] провели ночь вместе у костра."
 spn_rel_pack_home:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] бегали вместе и сидели у костра ещё долго после того, как остальные уснули."

 spn_order_talk_toast:0 "Разговоры в храме"
 spn_order_talk_toast_desc_junior:0 "[spn_fe_witness.GetTitledFirstName] знает, что между тобой и [spn_fe_patron.GetFirstName], и сказал об этом. Маски поднимут этот вопрос на следующем [spn_conclave|E]."
 spn_order_talk_toast_desc_patron:0 "[spn_fe_witness.GetTitledFirstName] знает, что между тобой и [spn_fe_junior.GetFirstName], и сказал об этом. Маски поднимут этот вопрос на следующем [spn_conclave|E]."

 # ---- After the Others Have Gone (.0350)
 spn_order.0350.t:0 "Когда остальные ушли"
 spn_order.0350.desc:0 "Весь этот месяц [spn_adv_junior.GetTitledFirstName] находит повод задержаться после каждого обряда. Сегодня остальные разошлись по домам, и [spn_adv_junior.GetSheHe] больше не делает вид, что прибирает свечи."
 spn_order.0350.a:0 "Позволить [spn_adv_junior.GetHerHim] остаться"
 spn_order.0350.b:0 "Не здесь и не со мной"
 spn_order.0350.c:0 "Напомнить [spn_adv_junior.GetHerHim], с кем [spn_adv_junior.GetSheHe] говорит"
 spn_order.0350.c.tt:0 "[spn_adv_junior.GetFirstName] теряет [spn_order_standing|E]."

 # ---- A Door Left Open (.0351)
 spn_order.0351.t:0 "Незакрытая дверь"
 spn_order.0351.desc:0 "[spn_adv_senior.GetTitledFirstName] задержал тебя допоздна, чтобы помочь с описью. Опись заняла четверть часа. Это было два часа назад, и никто из вас не заговорил об уходе."
 spn_order.0351.a:0 "Сказать то, что я хотел сказать уже несколько месяцев"
 spn_order.0351.a.tt:0 "[spn_adv_senior.GetSheHe|U] может хотеть того же. Если нет, между вами станет неловко, и храм может об этом услышать."
 spn_order.0351.b:0 "Сказать это и сказать, чего я хочу взамен"
 spn_order.0351.b.tt:0 "Если [spn_adv_senior.GetSheHe] согласится, вы станете любовниками, и [spn_adv_senior.GetSheHe] замолвит за тебя слово на следующем Обряде. Если нет, [spn_adv_senior.GetSheHe] запомнит, что ты просил, а честный старший может донести об этом."
 spn_order.0351.c:0 "Поблагодарить [spn_adv_senior.GetHerHim] за урок и уйти"
 spn_order.0351.talk:0 "Слух расходится"
 spn_order.0351.talk_desc:0 "Кто-то видел твоё лицо, когда ты выходил из кабинета [spn_adv_senior.GetFirstName]. К следующему обряду весь храм знает, что тебе отказали."
 spn_order.0351.no:0 "Отказ"
 spn_order.0351.no_desc:0 "[spn_adv_senior.GetFirstName] выслушивает тебя, а потом довольно мягко говорит, что уже поздно и тебе пора. Никто из вас больше об этом не вспоминает."
 spn_order.0351.deal:0 "Договорённость"
 spn_order.0351.deal_desc:0 "[spn_adv_senior.GetFirstName] не делает вид, что удивлён. На следующем Обряде [spn_adv_senior.GetSheHe] замолвит за тебя слово."
 spn_order.0351.reported:0 "Донесено маскам"
 spn_order.0351.reported_desc:0 "[spn_adv_senior.GetFirstName] отказал тебе, а затем рассказал маскам, о чём ты просил. Они поднимут этот вопрос на следующем [spn_conclave|E]."
 spn_order.0351.cold:0 "Отвергнут"
 spn_order.0351.cold_desc:0 "[spn_adv_senior.GetFirstName] холодно велит тебе уйти. [spn_adv_senior.GetSheHe|U] не забудет, что ты просил."

 # ---- What Is It Worth? (.0352)
 spn_order.0352.t:0 "Чего это стоит?"
 spn_order.0352.desc:0 "[spn_fv_patron.GetTitledFirstName] хорошо к тебе относится, и храм это заметил. [spn_fv_patron.GetSheHe|U] мог бы замолвить за тебя слово на следующем Обряде. [spn_fv_patron.GetSheHe|U] этого не предлагал."
 spn_order.0352.a:0 "Попросить [spn_fv_patron.GetHerHim] замолвить за меня слово"
 spn_order.0352.a.tt:0 "Если [spn_fv_patron.GetSheHe] согласится, ты получишь [spn_order_standing|E]. Слово может поднять твоё положение, но никогда не ранг. Кто-то твоего ранга может это заметить."
 spn_order.0352.b:0 "Не впутывать храм"
 spn_order.0352.yes:0 "Слово на Обряде"
 spn_order.0352.yes_desc:0 "[spn_fv_patron.GetFirstName] замолвит за тебя слово на следующем Обряде."
 spn_order.0352.no:0 "Отшучивание"
 spn_order.0352.no_desc:0 "[spn_fv_patron.GetFirstName] рассмеялся и сменил тему."

 # ---- Your Lover Asks a Favour (.0353)
 spn_order.0353.t:0 "Любовник просит об услуге"
 spn_order.0353.desc:0 "[spn_fv_junior.GetFirstName] ждёт, пока ты почти уснёшь.\n\n«Обряд в следующем месяце, — говорит [spn_fv_junior.GetSheHe]. — Ты мог бы назвать моё имя»."
 spn_order.0353.a:0 "Я назову его"
 spn_order.0353.a.tt:0 "[spn_fv_junior.GetFirstName] получает [spn_order_standing|E]. Слово может поднять положение, но никогда не ранг. Кто-то [spn_fv_junior.GetHerHis] ранга может это заметить."
 spn_order.0353.b:0 "Не так"
 spn_order.0353.c:0 "Тогда между нами всё кончено"
 spn_order.0353.no:0 "Не так"
 spn_order.0353.no_desc:0 "[spn_fv_patron.GetFirstName] не замолвит за тебя слово и не хочет, чтобы об этом просили снова."

 # ---- The Masks Are Watching (.0360)
 spn_order.0360.t:0 "Маски наблюдают"
 spn_order.0360.desc:0 "На сегодняшнем обряде ты насчитал одиннадцать масок, и каждая хотя бы раз повернулась в твою сторону. Никто не заговорил с тобой после. Никому и не нужно было."
 spn_order.0360.a:0 "Не поднимать глаз от пола"
 spn_order.0360.a.tt:0 "Ты получаешь немного [spn_order_standing|E]."
 spn_order.0360.b:0 "Узнать, чьё лицо за каждой маской"
 spn_order.0360.b.success:0 "Лицо за маской"
 spn_order.0360.b.success_desc:0 "Теперь ты знаешь одного из них: [spn_mw_mask.GetTitledFirstName]."
 spn_order.0360.b.success_none_desc:0 "Ты узнаёшь маски по голосам и рукам, но за ними нет лица, которого ты бы уже не знал."
 spn_order.0360.b.failure:0 "Замечен за подглядыванием"
 spn_order.0360.b.failure_desc:0 "Одна из масок поймала твой взгляд и не отпускала, пока ты не отвёл глаза. Храм это запомнит."
 spn_order.0360.c:0 "Смотреть в ответ"
 spn_order.0360.d:0 "Вместо этого прислушаться к их сердцам"

 # ---- Beneath Your Station (.0361)
 spn_order.0361.t:0 "Ниже твоего положения"
 spn_order.0361.desc:0 "[spn_bs_senior.GetTitledFirstName] вручает тебе ведро и щётку. Нижний зал не мыли с последнего обряда, а полы моют послушники.\n\n«То, чем ты правишь за этими стенами, здесь ничего не значит», — говорит [spn_bs_senior.GetSheHe] и, кажется, получает от этого удовольствие."
 spn_order.0361.a:0 "Вымыть пол"
 spn_order.0361.a.tt:0 "Ты получаешь [spn_order_standing|E]."
 spn_order.0361.b:0 "Послать за слугой"
 spn_order.0361.b.tt:0 "Заметит ли [spn_bs_senior.GetFirstName] — другой вопрос."
 spn_order.0361.noticed:0 "Замечено"
 spn_order.0361.noticed_desc:0 "[spn_bs_senior.GetFirstName] вернулся раньше и застал слугу, моющего нижний зал вместо тебя. Ты теряешь [spn_order_standing|E]."
 spn_order.0361.unnoticed:0 "Чистый пол"
 spn_order.0361.unnoticed_desc:0 "Пол сияет чистотой, и никто не спрашивает, кто его мыл."
 spn_order.0361.c:0 "Отказаться"
 spn_order.0361.c.tt:0 "Ты теряешь [spn_order_standing|E], и [spn_bs_senior.GetFirstName] этого не забудет."

 # ---- The Same Night (.0362)
 spn_order.0362.t:0 "Та же ночь"
 spn_order.0362.desc:0 "[spn_sn_kin.GetTitledFirstName] попросил тебя быть рядом завтра вечером. По тому, как осторожно [spn_sn_kin.GetSheHe] просил, ты понимаешь, что это важно.\n\nКапитул собирается завтра вечером. Тех, кто пропускает обряд, запоминают."
 spn_order.0362.a:0 "Пойти на обряд"
 spn_order.0362.a.tt:0 "Ты получаешь [spn_order_standing|E]."
 spn_order.0362.b:0 "Остаться с [spn_sn_kin.GetHerHim]"
 spn_order.0362.b.tt:0 "Ты теряешь [spn_order_standing|E]."
 spn_order.0362.c:0 "Сообщить, что я болен"
 spn_order.0362.c.tt:0 "Если храм тебе поверит, ты ничего не потеряешь. Если нет, ложь обойдётся тебе дороже, чем простое отсутствие."
 spn_order.0362.held:0 "Извинён"
 spn_order.0362.held_desc:0 "Капитул собрался без тебя, и никто не спросил почему. [spn_sn_kin.GetFirstName] был рад, что ты пришёл."
 spn_order.0362.seen:0 "Разоблачён"
 spn_order.0362.seen_desc:0 "Кто-то видел тебя в ту ночь на улице, вполне способным ходить. Храм знает, что ты ему солгал."

 # ---- One of the Seniors (.0363)
 spn_order.0363.t:0 "Один из старших"
 spn_order.0363.desc:0 "[spn_ss_senior.GetTitledFirstName] решил, что ты — посмешище капитула. [spn_ss_senior.GetSheHe|U] поправляет твою латынь при всех, отсылает тебя обратно за не теми свечами и смеётся, когда ты запинаешься на третьей строке. Остальные тоже немного смеются, чтобы не стать следующими."
 spn_order.0363.a:0 "Терпеть"
 spn_order.0363.a.tt:0 "Ты получаешь немного [spn_order_standing|E]."
 spn_order.0363.b:0 "Ответить [spn_ss_senior.GetHerHim] при всех"
 spn_order.0363.b.success:0 "Последнее слово"
 spn_order.0363.b.success_desc:0 "Твой ответ звучит на лучшей латыни, чем у [spn_ss_senior.GetSheHe], и смех оборачивается против него. Ты получаешь [spn_order_standing|E], [spn_ss_senior.GetFirstName] его теряет, и [spn_ss_senior.GetSheHe] этого не простит."
 spn_order.0363.b.failure:0 "Осмеян"
 spn_order.0363.b.failure_desc:0 "Ты запинаешься на ответе, и на этот раз смех громче. Ты теряешь [spn_order_standing|E]."
 spn_order.0363.c:0 "Пойти к Храмовому Магусу"
 spn_order.0363.c.tt:0 "[spn_ss_magus.GetFirstName] встанет на сторону того из вас, о ком [spn_ss_magus.GetSheHe] лучшего мнения."
 spn_order.0363.c.mine:0 "Выслушан"
 spn_order.0363.c.mine_desc:0 "[spn_ss_magus.GetFirstName] выслушал тебя и поговорил с [spn_ss_senior.GetFirstName]. Больше такого не повторится."
 spn_order.0363.c.his:0 "Отослан"
 spn_order.0363.c.his_desc:0 "[spn_ss_magus.GetFirstName] выслушал тебя, а затем сказал, что младший, который не может вынести немного насмешек, долго не продержится. Ты теряешь [spn_order_standing|E]."
 spn_order.0363.d:0 "Узнать, что [spn_ss_senior.GetSheHe] скрывает"
 spn_order.0363.d.success:0 "Есть за что зацепиться"
 spn_order.0363.d.success_desc:0 "Ты узнаёшь кое-что, о чём [spn_ss_senior.GetFirstName] предпочёл бы, чтобы никто не знал."
 spn_order.0363.d.success_none_desc:0 "Ты неделями наблюдаешь за [spn_ss_senior.GetFirstName] и не находишь ничего хуже острого языка. По крайней мере, ты кое-чему научился в слежке."
 spn_order.0363.d.failure:0 "Пойман на вынюхивании"
 spn_order.0363.d.failure_desc:0 "[spn_ss_senior.GetFirstName] заметил, что ты следишь за [spn_ss_senior.GetHerHim]. Теперь у [spn_ss_senior.GetSheHe] есть настоящая причина тебя не любить."
 spn_order.0363.e:0 "Пусть [spn_ss_senior.GetHerHim] увидит волка в моих глазах"
 spn_order.0363.e.tt:0 "[spn_ss_senior.GetSheHe|U] оставит тебя в покое. И [spn_ss_senior.GetSheHe|U] также узнает, кто ты такой."

 # ---- A Brother Asks for Help (.0370)
 spn_order.0370.t:0 "Брат просит о помощи"
 spn_order.0370.t_sister:0 "Сестра просит о помощи"
 spn_order.0370.desc:0 "[spn_ba_asker.GetTitledFirstName] подходит к тебе после обряда, белый как полотно. [spn_ba_asker.GetSheHe|U] нарушил правила Ордена, и кто-то это видел. Маски услышат об этом на следующем [spn_conclave|E].\n\n«Ты мог бы сделать так, чтобы это забылось», — говорит [spn_ba_asker.GetSheHe]."
 spn_order.0370.a:0 "Я позабочусь, чтобы это похоронили"
 spn_order.0370.a.tt:0 "Никто не поднимет этот вопрос на следующем [spn_conclave|E]."
 spn_order.0370.a.risk_tt:0 "Если это всплывёт, маски назовут твоё имя."
 spn_order.0370.b:0 "Пусть маски судят [spn_ba_asker.GetHerHim]"
 spn_order.0370.b.tt:0 "Ты получаешь [spn_order_standing|E]."
 spn_order.0370.c:0 "Это между тобой и масками"

 # ---- A Feud in the Chapter / A Feud on the Council (.0371)
 spn_order.0371.t:0 "Вражда в капитуле"
 spn_order.0371.t_council:0 "Вражда в совете"
 spn_order.0371.desc:0 "[spn_fd_a.GetTitledFirstName] и [spn_fd_b.GetTitledFirstName] уже несколько месяцев не обменялись ни единым вежливым словом. Сегодня дело дошло до крика посреди обряда, и весь капитул смотрел, что ты сделаешь."
 spn_order.0371.desc_council:0 "[spn_fd_a.GetTitledFirstName] и [spn_fd_b.GetTitledFirstName] заседают вместе с тобой в [spn_gnostic_council|E] и больше не выносят друг друга в одной комнате. Последнее заседание закончилось ничем, и каждый потом пришёл к тебе жаловаться на другого."
 spn_order.0371.a:0 "Встать на сторону [spn_fd_a.GetFirstName]"
 spn_order.0371.a.tt:0 "[spn_fd_b.GetFirstName] теряет [spn_order_standing|E]."
 spn_order.0371.b:0 "Встать на сторону [spn_fd_b.GetFirstName]"
 spn_order.0371.b.tt:0 "[spn_fd_a.GetFirstName] теряет [spn_order_standing|E]."
 spn_order.0371.c:0 "Пусть вместе проведут следующий обряд"
 spn_order.0371.c_council:0 "Пусть вместе внесут следующее предложение"
 spn_order.0371.c.success:0 "Примирение"
 spn_order.0371.c.success_desc:0 "Вечер вышел натянутым, но прошёл хорошо, и к концу они снова разговаривали друг с другом. Оба получают [spn_order_standing|E]."
 spn_order.0371.c.failure:0 "Хуже, чем прежде"
 spn_order.0371.c.failure_desc:0 "Они снова нашли способ поссориться при всех, и оба винят тебя в том, что ты их туда поставил."
 spn_order.0371.d:0 "Пусть разберутся между собой"
 spn_order.0371.d.tt:0 "Один из них выйдет из этого с потерями. Никто не погибнет."
 spn_order.0371.d.done:0 "Улажено"
 spn_order.0371.d.done_desc:0 "[spn_fd_winner.GetFirstName] и [spn_fd_loser.GetFirstName] уладили это по-старому. [spn_fd_loser.GetFirstName] вышел из этого хуже, и у него есть раны в доказательство."

 # ---- Where Do You Go at Night? (.0372)
 spn_order.0372.t:0 "Куда ты ходишь по ночам?"
 spn_order.0372.desc:0 "[spn_wg_spouse.GetTitledFirstName] не спит, когда ты входишь. [spn_wg_spouse.GetSheHe|U] не спал каждый раз, говорит [spn_wg_spouse.GetSheHe], уже несколько месяцев.\n\n«Я никогда не спрашивал, куда ты ходишь. Теперь спрашиваю»."
 spn_order.0372.a:0 "Солгать"
 spn_order.0372.a.success:0 "Поверили"
 spn_order.0372.a.success_desc:0 "[spn_wg_spouse.GetFirstName] оставляет это. [spn_wg_spouse.GetSheHe|U], похоже, тебе верит."
 spn_order.0372.a.failure:0 "Не поверили"
 spn_order.0372.a.failure_desc:0 "[spn_wg_spouse.GetFirstName] больше ничего не говорит. [spn_wg_spouse.GetSheHe|U] не верит ни единому слову."
 spn_order.0372.b:0 "Сказать [spn_wg_spouse.GetHerHim] правду"
 spn_order.0372.b.tt:0 "Молчание — первое из трёх слов. Рассказав [spn_wg_spouse.GetHerHim], ты нарушишь правила Ордена, и тебя могут за это изгнать."
 spn_order.0372.c:0 "Попросить храм рассмотреть [spn_wg_spouse.GetHerHim]"
 spn_order.0372.c.tt:0 "Ты говоришь [spn_wg_spouse.GetHerHim] лишь, что это учёное общество и что ты спросишь."
 spn_order.0372.c.yes:0 "Имя выдвинуто"
 spn_order.0372.c.yes_desc:0 "Маски рассмотрят [spn_wg_spouse.GetFirstName]."
 spn_order.0372.c.no:0 "Не рассмотрено"
 spn_order.0372.c.no_desc:0 "Маски не станут рассматривать [spn_wg_spouse.GetFirstName]. Причины они не называют."
 spn_order.0372.d:0 "Пусть [spn_wg_spouse.GetHerHim] думает, что есть кто-то другой"

 # ---- The Pack Comes Home (spn_pack.0105)
 spn_pack.0105.t:0 "Стая возвращается домой"
 spn_pack.0105.desc_moon:0 "Стая бегала, пока не зашла луна, и по одному вернулась к костру. У кого-то нашлось вино. На одну ночь никто не был ни лордом, ни сыном пастуха. Вы были стаей, и вы были дома."
 spn_pack.0105.desc_rain:0 "Всю пробежку лил дождь, и никто не возражал. Стая вернулась промокшей и смеющейся, столпилась у костра, чтобы обсохнуть, и кто-то нашёл вино. Сегодня среди вас не было ни лордов, ни пастушьих сыновей — только стая, снова дома."
 spn_pack.0105.desc_stag:0 "На опушке леса стая повалила оленя и вместе принесла его домой. Пока он жарился, никто не мог договориться, кто его убил, и никому не было дела. Сегодня вы были стаей, и ничем больше."
 spn_pack.0105.desc_friends:0 "\n\n[spn_ph_a.GetShortUIName] и [spn_ph_b.GetShortUIName] сидели вместе ещё долго после того, как остальные затихли. Теперь они друзья."
 spn_pack.0105.desc_quarrel:0 "\n\nНе всем было легко. [spn_ph_a.GetShortUIName] и [spn_ph_b.GetShortUIName] повздорили из-за последнего куска мяса, и остальным пришлось их растаскивать."
 spn_pack.0105.a:0 "Пойти домой к [spn_ph_spouse.GetShortUIName]."
 spn_pack.0105.b:0 "Остаться у костра с [spn_ph_other.GetShortUIName]."
 spn_pack.0105.c:0 "Посидеть с [spn_ph_friend.GetShortUIName]."
 spn_pack.0105.d:0 "Сказать слово у костра."
 spn_pack.0105.d.tt:0 "Каждый волк твоей стаи получает [spn_pack_standing|E]."
 spn_pack.0105.e:0 "Побыть сегодня одному."
