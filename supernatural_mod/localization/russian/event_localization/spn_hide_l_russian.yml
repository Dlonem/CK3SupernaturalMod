l_russian:
 spn_hide.0010.t:0 "Шкура приживается"
 spn_hide.0010.desc_silverback:0 "Шкура тяжелее, чем кажется. Ты накидываешь её на плечи, и какое-то время это всего лишь старая серая шкура, пахнущая дымом и кедром.\n\nА потом — уже нет. Что-то входит в тебя у основания шеи: сначала холод, потом тепло. Сердце спотыкается и находит новый ритм. Когда ты смотришь вниз, кожа на твоих плечах снова просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Среброспин, одна из шести шкур. Она выбрала тебя. Она не отпустит."
 spn_hide.0010.desc_timber:0 "Шкура бурая, жёсткая, пахнет сосновой смолой. Ты надеваешь её — и в комнате становится очень тихо.\n\nЧто-то скользит в тебя так, как волк скользит между деревьями: без звука, без спешки. На миг ты слышишь каждое дыхание в зале, и ни одно из них тебе не нравится. Потом кожа на твоих плечах — просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Кряж, одна из шести шкур. Она выбрала тебя. Она не делится."
 spn_hide.0010.desc_tundra:0 "Шкура белая и холоднее, чем должна быть. Ты надеваешь её — и твоё дыхание видно в тёплой комнате.\n\nЧто-то оседает в тебя медленно, как снег на неподвижную воду. Ты обнаруживаешь, что вглядываешься в лица вокруг, и можешь сказать, кто из них лжёт. Потом холод уходит, и кожа на твоих плечах — просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Тундра, одна из шести шкур. Она выбрала тебя. Она терпелива — и теперь ты тоже."
 spn_hide.0010.desc_graybeard:0 "Шкура пепельно-серая, в шрамах — старые порезы, которые так и не затянулись. Ты надеваешь её, и твои ноги встают сами, словно навстречу стене щитов.\n\nЧто-то входит в тебя, как железо в форму. Спина выпрямляется. Мысль отступить уходит от тебя и не возвращается. Потом кожа на твоих плечах — просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Седобород, одна из шести шкур. Она выбрала тебя. Она никогда не отступала."
 spn_hide.0010.desc_midnight:0 "Шкура чёрная, и она тёплая ещё до того, как ты её коснёшься. Ты надеваешь её — и руки начинают дрожать.\n\nЧто-то входит в тебя разом — голодное и громкое. Ты чувствуешь вкус крови, которой нет. Тебе хочется бежать, и хочется чего-то в конце бега. Потом всё стихает, и кожа на твоих плечах — просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Полночь, одна из шести шкур. Она выбрала тебя. Она будет хотеть."
 spn_hide.0010.desc_alpha:0 "Шкура рыже-бурая и тяжёлая, и собаки во дворе начинают выть. Ты надеваешь её — и каждая голова в зале поворачивается к тебе.\n\nЧто-то входит в тебя и выпрямляется. Ты знаешь, где каждый из твоих людей, не глядя, и для чего каждый из них годится. Потом кожа на твоих плечах — просто кожа. То, что было в ней, теперь в тебе.\n\nЭто Вожак, потерянная шкура, та, что ведёт. Она выбрала тебя. Она ждёт, что за ней пойдут."
 spn_hide.0010.a:0 "Так тому и быть."
 spn_hide.0010.a.tt:0 "Ты становишься её [spn_champion|E]. Её дух теперь в тебе: когда ты принимаешь волчий облик, волк — из этой шкуры. Ты говоришь на всех языках, которые она забрала у прежних чемпионов."
 spn_hide.0011.t:0 "Она тебя не примет"
 spn_hide.0011.desc_silverback:0 "Ты носишь серую шкуру днями, и ничего не происходит. Это всего лишь шкура, и пахнет она чужим костром.\n\nТебе снится волк, стоящий между ребёнком и темнотой. Он долго смотрит на тебя, а потом отводит взгляд."
 spn_hide.0011.desc_timber:0 "Ты носишь бурую шкуру днями, и ничего не происходит. Она жёсткая, пахнет сосновой смолой — и это всё, что в ней есть.\n\nТебе снится волк на гребне, следящий за твоим костром. Он так и не подходит ближе."
 spn_hide.0011.desc_tundra:0 "Ты носишь белую шкуру днями, и ничего не происходит. Она остаётся холодной на твоих плечах — с каждым утром холоднее.\n\nТебе снится белый волк в снегу. Он уходит до рассвета."
 spn_hide.0011.desc_graybeard:0 "Ты носишь серую шкуру днями, и ничего не происходит. Старые порезы в ней никогда не затягиваются, и она свисает с твоей спины, как мёртвая.\n\nТебе снится серый волк, который не хочет на тебя смотреть."
 spn_hide.0011.desc_midnight:0 "Ты носишь чёрную шкуру днями, и ничего не происходит. Она остаётся тёплой на твоих плечах, и ждёт, и ничего не приходит.\n\nТебе снится чёрный волк, что кружит мимо твоего костра. Он не заходит внутрь."
 spn_hide.0011.desc_alpha:0 "Ты носишь рыжую шкуру днями, и ничего не происходит. Никто не смотрит на тебя иначе. Собаки даже не поднимают головы.\n\nТебе снится рыжий волк на холме. Он тебя не зовёт."
 spn_hide.0011.wants_silverback:0 "\n\nСреброспин ищет чемпиона с одной из этих черт: [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_timber:0 "\n\nКряж ищет чемпиона с одной из этих черт: [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] или [GetTrait('wrathful').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('gregarious').GetName( GetNullCharacter )] или [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_tundra:0 "\n\nТундра ищет чемпиона с одной из этих черт: [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] или [GetTrait('patient').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('honest').GetName( GetNullCharacter )] или [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_graybeard:0 "\n\nСедобород ищет чемпиона с одной из этих черт: [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('craven').GetName( GetNullCharacter )] или [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_midnight:0 "\n\nПолночь ищет чемпиона с одной из этих черт: [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] или [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_alpha:0 "\n\nВожак ищет чемпиона с одной из этих черт: [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] или [GetTrait('arrogant').GetName( GetNullCharacter )]. Она отворачивается от всякого, у кого есть [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] или [GetTrait('craven').GetName( GetNullCharacter )]."
 spn_hide.0011.why_none:0 " Она не нашла этого в тебе, а волк в тебе ещё не настолько глубок, чтобы это восполнить."
 spn_hide.0011.why_outweighed:0 " Она нашла в тебе кое-что из этого — и не меньше того, от чего она отворачивается."
 spn_hide.0011.why_leader:0 " И она берёт только вожака: альфу стаи либо герцога или выше."
 spn_hide.0011.why_leader_nopacks:0 " И она берёт только вожака: герцога или выше, истинного оборотня либо волка, чья ликантропия достигла полноты."
 spn_hide.0011.a:0 "Тогда отпусти её."
 spn_hide.0011.a.tt:0 "Шкура снимается. Она не взглянет на тебя снова пять лет."
 spn_hide.0012.t:0 "Два волка"
 spn_hide.0012.desc:0 "Теперь их двое в тебе, и они не станут делиться.\n\n[spn_kept_hide.GetName] — твоя уже годами. Она знает твои руки и твой норов, и она злится. [spn_offered_hide.GetName] — новая, она уже тянет тебя к себе, уверенная в себе, просит впустить.\n\nОдно тело. Один волк. Придётся выбрать, а та, которую ты отложишь, не попросит снова очень долго."
 spn_hide.0012.a:0 "[spn_kept_hide.GetName] остаётся со мной."
 spn_hide.0012.a.tt:0 "Новая шкура снимается и остаётся у тебя, несвязанной. [spn_hide_bond|E] твоей собственной шкуры растёт."
 spn_hide.0012.b:0 "Пусть будет [spn_offered_hide.GetName]."
 spn_hide.0012.b.tt:0 "Старая шкура отпускает тебя и оставляет себе то, чем ты для неё был. Новая занимает её место."
 spn_hide.0013.t:0 "Она тебя знает"
 spn_hide.0013.desc:0 "Шкура висит в твоём зале годами. Сегодня ночью она лежит на полу, и собаки не подходят к ней близко.\n\nКогда ты поднимаешь её, она тёплая. Что-то, что не совсем голос, говорит тебе, что она наблюдала за тобой и что ей нравится увиденное. Она просит.\n\nЕсли ты скажешь да, к утру ты уже не будешь человеком."
 spn_hide.0013.a:0 "Я отвечаю на зов."
 spn_hide.0013.a.tt:0 "Ты становишься [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], и через три дня шкура принимает тебя как своего [spn_champion|E]."
 spn_hide.0013.b:0 "Только не я."
 spn_hide.0013.b.tt:0 "Ты убираешь её. Она не спросит тебя снова десять лет."
 spn_hide.0014.t:0 "Её не отложить"
 spn_hide.0014.desc_silverback:0 "Ты убираешь шкуру. Хватает на неделю.\n\nТы просыпаешься ночью со шкурой на коленях и без памяти о том, как встал. Она тёплая, будто её только что кто-то носил.\n\nСреброспин не буйствует. Она ждёт. Это хуже."
 spn_hide.0014.desc_timber:0 "Ты убираешь шкуру. Хватает на неделю.\n\nНа седьмую ночь ты находишь её в ногах постели — сложенной так, как ты бы её никогда не сложил. Дверь всё ещё на засове.\n\nКряж ничего не говорит. Никогда не говорил. Она просто не позволит себя оставить."
 spn_hide.0014.desc_tundra:0 "Ты убираешь шкуру. Хватает на неделю.\n\nТеперь у тебя всё время холодные руки. На седьмое утро на внутренней стороне окна — изморозь в форме лежащего волка.\n\nТундра может ждать дольше тебя. Она даёт тебе это понять."
 spn_hide.0014.desc_graybeard:0 "Ты убираешь шкуру. Хватает на неделю.\n\nКаждый день её ты чувствуешь желание отступить — от двери, от человека, от резкого слова, — и с каждым днём ненавидишь это сильнее.\n\nСедобород не спорит. Она лишь показывает тебе, кто ты без неё."
 spn_hide.0014.desc_midnight:0 "Ты убираешь шкуру. Хватает на неделю.\n\nВ первый день ты разбиваешь чашку, на пятый — руку слуге. На седьмую ночь ты находишь сундук открытым, а шкуру в своих руках, и не помнишь, как открывал его.\n\nПолночь в ярости. Она хочет, чтобы её носили."
 spn_hide.0014.desc_alpha:0 "Ты убираешь шкуру. Хватает на неделю.\n\nТвои люди перестают на тебя оглядываться. Никто не говорит почему. На седьмой день твои собственные псы проходят мимо тебя к шкуре в сундуке и ложатся рядом с ней.\n\nВожак не умоляет. Она напоминает тебе, кто ты, когда её нет."
 spn_hide.0014.a:0 "Я надеваю её обратно."
 spn_hide.0014.a.tt:0 "Шкура надевается обратно. Твой [spn_hide_bond|E] немного падает."
 spn_hide.0014.b:0 "Мне нужно было вдохнуть."
 spn_hide.0014.b.tt:0 "Шкура всё равно надевается обратно. Твой [spn_hide_bond|E] падает сильнее, но неделя пошла тебе на пользу."
 spn_hide.0100.t:0 "Она говорит"
 spn_hide.0100.desc_silverback:0 "В тишине перед сном что-то говорит с тобой. Не словами — тяжестью на груди, ровной, как рука.\n\nЭто Среброспин. Она слушала тебя две недели. Она знает, кто сидел с тобой за ужином и кого ты отвёл от двери, и у неё есть мнение об обоих. Теперь она хочет, чтобы ты послушал в ответ."
 spn_hide.0100.desc_timber:0 "В лесу, один, ты слышишь её впервые. Не голос. Вторую пару шагов, которые останавливаются, когда останавливаешься ты.\n\nЭто Кряж. Она с тобой две недели и не сказала ни слова, потому что решала, стоишь ли ты его. Она тебе ещё не доверяет. Она хочет знать, станешь ли ты слушать."
 spn_hide.0100.desc_tundra:0 "За столом, между одним словом и другим, что-то холодное замечает ложь и указывает тебе на неё. Гость напротив продолжает говорить. Он понятия не имеет.\n\nЭто Тундра. Она смотрела твоими глазами. Теперь она говорит."
 spn_hide.0100.desc_graybeard:0 "На тренировочном поле клинок идёт на тебя, а твои ноги не двигаются. Что-то старое и упрямое удержало их там. Клинок останавливается на ширину пальца от твоего лица, и человек, держащий его, смотрит на тебя так, будто никогда прежде не видел.\n\nЭто Седобород. Она хочет, чтобы ты знал: она здесь."
 spn_hide.0100.desc_midnight:0 "Ты просыпаешься со стиснутыми зубами и чужим именем во рту. Что-то в тебе расхаживает взад-вперёд. Костяшки сбиты, и в стене рядом с постелью свежая трещина.\n\nЭто Полночь. Она молчала две недели. Она закончила молчать."
 spn_hide.0100.desc_alpha:0 "В твоём зале, среди твоих людей, что-то считает их для тебя — кто верен, кто нет, кто мог бы быть больше. Наутро ты тихо проверяешь это на нескольких из них. Оно было право каждый раз.\n\nЭто Вожак. Она начала говорить. Она ждёт ответа."
 spn_hide.0100.a:0 "Я слушаю."
 spn_hide.0100.a.tt:0 "Шкура чувствует твой ответ. Твой [spn_hide_bond|E] растёт."
 spn_hide.0100.b:0 "Тихо."
 spn_hide.0100.b.tt:0 "Она замолкает. Она не уходит."
 spn_hide.0101.t:0 "Тот, кто был до тебя"
 spn_hide.0101.desc_silverback:0 "Среброспин показывает тебе смерть. Не твою. Кто-то один на дороге ночью, стоящий между телегой, полной детей, и чем-то с лишними зубами. Он не сдвинулся. Телега уехала, и он так и не увидел, как она скрылась."
 spn_hide.0101.desc_timber:0 "Кряж показывает тебе смерть. Кто-то один в зимнем лесу, далеко от всех, смеётся над пришедшими охотниками. Четверо из тех охотников не вышли из деревьев, и тела так и не нашли."
 spn_hide.0101.desc_tundra:0 "Тундра показывает тебе смерть. Кто-то старый в тёплой комнате, отравленный другом тридцати лет. Он узнал это прежде, чем чаша опустела, и улыбнулся, потому что друг выпил из другой."
 spn_hide.0101.desc_graybeard:0 "Седобород показывает тебе смерть. Строй щитов ломается, и один щит в нём не сломался. Врагу пришлось обходить его, а пока он обходил, день был проигран."
 spn_hide.0101.desc_midnight:0 "Полночь показывает тебе смерть. Зал в огне, и кто-то в нём всё ещё дрался и всё ещё смеялся — долго после того, как должен был умереть. Крыша рухнула раньше, чем он."
 spn_hide.0101.desc_alpha:0 "Вожак показывает тебе смерть. Серый волк во главе огромной стаи, старый и медленный, поворачивается навстречу молодому, который займёт его место. Он не побежал. Когда всё кончилось, стая пошла домой за молодым."
 spn_hide.0101.named:0 "\n\nЭто был(а) [spn_last_champ.GetName]. [spn_last_champ.GetSheHe|U] носил(а) её до тебя."
 spn_hide.0101.unnamed:0 "\n\nТы не знаешь имени того, кто был до тебя. Шкура знает — и не говорит."
 spn_hide.0101.a:0 "Я почту их память."
 spn_hide.0101.a.tt:0 "Твой [spn_hide_bond|E] растёт."
 spn_hide.0101.b:0 "Мёртвые мертвы."
 spn_hide.0101.b.tt:0 "Шкура отпускает память. Она запомнит, что ты это сделал."
 spn_hide.0102.t:0 "Чего она хочет"
 spn_hide.0102.desc_silverback:0 "Среброспин чего-то хочет от тебя. Есть люди под твоей рукой, которые не могут себя защитить, и она хочет, чтобы ты стоял над ними. Ей всё равно, родня они или чужаки, — только бы твои.\n\nОна показывает как. Волк у двери. Ничто не пройдёт."
 spn_hide.0102.desc_timber:0 "Кряж чего-то хочет от тебя. Ты оставляешь следы. Ты оставляешь истории. Она хочет, чтобы ты научился не оставлять вообще ничего — так, чтобы лучший охотник в твоих землях прошёл мимо тебя в лесу и не заметил.\n\nОна показывает, как остывает след."
 spn_hide.0102.desc_tundra:0 "Тундра чего-то хочет от тебя. Все вокруг тебя что-то прячут, и она хочет знать что: управляющий, гость, который слишком много улыбается, мальчик, что приносит вино.\n\nОна показывает, как читать лицо."
 spn_hide.0102.desc_graybeard:0 "Седобород чего-то хочет от тебя. Когда строй гнётся, она хочет, чтобы ты был тем местом, где он не гнётся. Люди удержатся, если увидят, что хоть один держится. Она видела это сотню раз.\n\nОна показывает, как держаться."
 spn_hide.0102.desc_midnight:0 "Полночь чего-то хочет от тебя. В бою ты сдерживаешь волка, и она ненавидит тебя за это. Она хочет — всего один раз — быть выпущенной до конца. Она обещает, что ты мало что запомнишь потом.\n\nОна показывает, как это было бы."
 spn_hide.0102.desc_alpha:0 "Вожак чего-то хочет от тебя. Есть другие стаи — разбросанные и малые. Она хочет, чтобы их созвали. Одинокого волка травят по одному, и она помнит времена, когда волки не были одни.\n\nОна показывает, как звать."
 spn_hide.0102.a:0 "Покажи."
 spn_hide.0102.a.tt:0 "Твой [spn_hide_bond|E] растёт. Собственное действие шкуры теперь доступно тебе."
 spn_hide.0102.b:0 "Ещё нет."
 spn_hide.0102.b.tt:0 "Собственное действие шкуры всё равно открыто тебе. Она хотела, чтобы ты взял его с радостью."
  spn_hide.0103.t:0 "Остальные"
 spn_hide.0103.desc_silverback:0 "Среброспин говорит тебе, что никогда не была одна. Их шесть. Некоторые носят. Некоторые висят в святых местах. Одну потеряли так давно, что остальные едва помнят её запах. Она говорит о них так, как старый солдат говорит о тех, с кем служил.\n\nОна хочет, чтобы ты их знал."
 spn_hide.0103.desc_timber:0 "Кряж неохотно говорит тебе, что есть и другие, похожие на неё. Шесть шкур. Ни одна из них ей не мила, а некоторых она не видела сотню лет и охотно сделала бы так, чтобы и не видеть.\n\nИ всё же она хочет, чтобы ты знал, где они. Одиночка всегда держит счёт стае."
 spn_hide.0103.desc_tundra:0 "Тундра говорит тебе, что шкур шесть, и раскладывает их в твоём сознании, как фигуры на доске: кто какую носит, какие висят в святилищах, какие потеряны. Она знает, с кем из них можно торговаться и кто станет лгать об этом.\n\nОна хочет, чтобы ты знал эту игру."
 spn_hide.0103.desc_graybeard:0 "Седобород говорит тебе, что шкур шесть, и что он сражался с одними из них рядом, а с другими — друг против друга. Он помнит, с кем именно. Он прощает неохотно и не забывает вообще.\n\nОн хочет, чтобы ты знал, кто где стоит."
 spn_hide.0103.desc_midnight:0 "Полночь говорит тебе, что есть ещё пять, и что она в своё время ненавидела каждую из них — так или иначе. Среброспин больше всех. Она произносит это имя как проклятие.\n\nОна хочет, чтобы ты их нашёл. Она не говорит зачем."
 spn_hide.0103.desc_alpha:0 "Вожак говорит тебе, что их было шесть и что она была первой среди них. Остальные когда-то были её стаей. Они разбрелись, когда она потерялась, — как стая и поступает, когда вожак падает, — и ни одна из них с тех пор не вела.\n\nОна хочет, чтобы их снова собрали."
 spn_hide.0103.a:0 "Я буду их искать."
 spn_hide.0103.a.tt:0 "Твой [spn_hide_bond|E] растёт. Шкура отдаёт тебе часть того, что знает."
 spn_hide.0103.b:0 "Оставь их в покое."
 spn_hide.0103.b.tt:0 "Шкура всё равно отдаёт тебе часть того, что знает."
 spn_hide.0104.t:0 "Оставить свой след"
 spn_hide.0104.desc_silverback:0 "В самую длинную ночь года шкура становится тяжёлой, и ты слышишь их.\n\nМужчина считает на языке, которого ты никогда не учил. Женщина молится богу, чьё имя стёрлось. Каждый из них носил Среброспин до конца, и каждый оставил в ней что-то своё. Ты годами говорил их словами, не зная об этом.\n\nЕсть место ещё для одного. Твой язык у неё уже есть. Оставь след — и тот, кто наденет её следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.desc_timber:0 "В самую длинную ночь года шкура становится тяжёлой, и ты слышишь их — несколько голосов, далеко друг от друга, каждый сам по себе.\n\nКаждый из них носил Кряжа до конца, и каждый оставил в ней немного себя: язык, привычку, обиду. Ты носил их в себе, не зная об этом.\n\nЕсть место ещё для одного. Твой язык у неё уже есть. Оставь след — и тот, кто наденет её следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.desc_tundra:0 "В самую длинную ночь года шкура становится холодной, и ты слышишь их — тихие голоса, осторожные голоса, каждый выбирает слова.\n\nКаждый из них носил Тундру до конца, и каждый оставил в ней что-то своё. Ты годами думал их мыслями.\n\nЕсть место ещё для одного. Твой язык у неё уже есть. Оставь след — и тот, кто наденет её следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.desc_graybeard:0 "В самую длинную ночь года шкура становится тяжёлой, и ты слышишь их — старых солдат, что на десятке языков приказывают строю держаться.\n\nКаждый из них носил Седоборода до конца, и каждый оставил в нём что-то своё. Ты годами отдавал их приказы, не зная об этом.\n\nЕсть место ещё для одного. Твой язык у него уже есть. Оставь след — и тот, кто наденет его следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.desc_midnight:0 "В самую длинную ночь года шкура становится горячей, и ты слышишь их — крик, смех, ругань на давно мёртвых языках.\n\nКаждый из них носил Полночь до конца, и каждый оставил в ней частицу своего огня. Ты годами горел вместе с ней.\n\nЕсть место ещё для одного. Твой язык у неё уже есть. Оставь след — и тот, кто наденет её следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.desc_alpha:0 "В самую длинную ночь года шкура становится тяжёлой, и ты слышишь их — голоса, что отдают приказы давно разбежавшимся стаям.\n\nКаждый из них носил Вожака до конца, и каждый оставил в ней что-то своё. Ты годами вёл их словами, не зная об этом.\n\nЕсть место ещё для одного. Твой язык у неё уже есть. Оставь след — и тот, кто наденет её следующим, начнёт с половины той связи, что выстроил ты."
 spn_hide.0104.a:0 "Я оставлю свой след."
 spn_hide.0104.a.tt:0 "Тот, кто наденет шкуру после тебя, начнёт с половины твоего [spn_hide_bond|E]."
 spn_hide.0104.b:0 "Моё имя принадлежит мне."
 spn_hide.0104.b.tt:0 "Больше ничего твоего в шкуру не уйдёт."
 spn_hide.0105.t:0 "Один волк"
 spn_hide.0105.desc_silverback:0 "Однажды утром ты уже не можешь сказать, где кончаешься ты и начинается шкура. Голоса больше нет. Есть только ты, и ты серый, и ты стоек. Тем, кто под твоей рукой, спится лучше, и никто из них не знает почему.\n\nСреброспин не в тебе. Среброспин — это ты."
 spn_hide.0105.desc_timber:0 "Однажды утром тишина в твоей голове перестаёт быть пустой. Она твоя. Шкура замолчала, потому что говорить больше нечего. Ты идёшь через свой зал, и никто не поднимает головы, и тебе это нравится.\n\nКряж не в тебе. Кряж — это ты."
 spn_hide.0105.desc_tundra:0 "Однажды утром ты ловишь себя на улыбке чужой лжи и не можешь понять, чья это улыбка. Это неважно. Ты знаешь, чего хочет каждый за твоим столом и что он за это отдаст, и ничто из этого тебя больше не удивляет.\n\nТундра не в тебе. Тундра — это ты."
 spn_hide.0105.desc_graybeard:0 "Однажды утром ты обнаруживаешь, что не помнишь, как это — бояться. Ты пытаешься вспомнить. Это как вспоминать лицо незнакомца. Теперь, когда ты стоишь на своём, стоящие рядом встают с тобой без единого слова.\n\nСедобород не в тебе. Седобород — это ты."
 spn_hide.0105.desc_midnight:0 "Однажды утром огонь уже не то, что ты в себе подавляешь. Он просто то, чем ты являешься, — как горн горяч. Люди чувствуют это, едва ты входишь в комнату, и большинство находит причину уйти.\n\nПолночь не в тебе. Полночь — это ты."
 spn_hide.0105.desc_alpha:0 "Однажды утром ты входишь в свой зал, и всё живое в нём поворачивается к тебе, и ты понимаешь, что иначе и быть не могло. Волки, которых ты никогда не встречал, узнают твоё имя прежде, чем кончится год.\n\nВожак не в тебе. Вожак — это ты."
 spn_hide.0105.a:0 "Один волк."
 spn_hide.0105.a.tt:0 "Шкура отдаёт тебе последнее, что у неё есть."
 spn_hide.0200.t:0 "Волк и война"
 spn_hide.0200.desc:0 "Идёт война, и ты в ней. Шкура знает об этом раньше, чем гонец договаривает.\n\nОна может сражаться рядом с тобой в поле — не человек с мечом, а то, что она есть. Умрут те, кто иначе остался бы жив. Кто-то из них увидит, что его убило, а кто-то из остальных заговорит.\n\nЧто ты позволишь ей сделать?"
 spn_hide.0200.a:0 "Пусть бежит."
 spn_hide.0200.a.tt:0 "В бою шкура каждый раз убивает нескольких рыцарей противника. Кто-нибудь может увидеть, что ты такое."
 spn_hide.0200.b:0 "Держать её."
 spn_hide.0200.b.tt:0 "Ты сражаешься как человек. Никто ничего не видит."
 spn_hide.0200.c:0 "Больше меня об этом не спрашивай."
 spn_hide.0200.c.tt:0 "Начало войны больше не будет тебя об этом спрашивать. «Выпустить волка» и «Сдержать волка» останутся в твоих решениях."
 spn_hide.0201.t:0 "Что видели люди"
 spn_hide.0201.open_two:0 "В самой гуще ты готов был поклясться, что на поле было два зверя, а не люди."
 spn_hide.0201.open_one:0 "В самой гуще ты готов был поклясться, что на поле был зверь, а не человек."
 spn_hide.0201.kills_none:0 " Насколько тебе известно, от него никто не пал, и никто не скажет, что это было."
 spn_hide.0201.theirs_1:0 " [spn_men_saw_victims.GetShortUIName] недосчитался одного рыцаря, и никто не скажет, что с ним случилось."
 spn_hide.0201.theirs_2:0 " [spn_men_saw_victims.GetShortUIName] недосчитался двух рыцарей, и никто не скажет, как они погибли."
 spn_hide.0201.theirs_3:0 " [spn_men_saw_victims.GetShortUIName] недосчитался трёх рыцарей, и никто не скажет, как они погибли."
 spn_hide.0201.theirs_many:0 " [spn_men_saw_victims.GetShortUIName] недосчитался стольких рыцарей, что никто не хочет их считать, и никто не скажет, как они погибли."
 spn_hide.0201.ours_1:0 " Мы недосчитались одного рыцаря, и никто не скажет, что с ним случилось."
 spn_hide.0201.ours_2:0 " Мы недосчитались двух рыцарей, и никто не скажет, как они погибли."
 spn_hide.0201.ours_3:0 " Мы недосчитались трёх рыцарей, и никто не скажет, как они погибли."
 spn_hide.0201.ours_many:0 " Мы недосчитались стольких рыцарей, что никто не хочет их считать, и никто не скажет, как они погибли."
 spn_hide.0201.close:0 "\n\nТвой маршал говорит: дым и страх. Твои солдаты говорят другое."
 spn_hide.0201.a:0 "Значит, дым и страх."
 spn_hide.0202.t:0 "Два волка на одном поле"
 spn_hide.0202.desc:0 "С другого конца поля ты учуял его раньше, чем увидел: ещё одна шкура, которую носит [spn_field_foe.GetShortUIName].\n\nАрмии дрались вокруг вас двоих и оставили вам место. Никто из смотревших не понимал, что видит. Шкуры поняли. Они встречались прежде, давным-давно, в других обличьях."
 spn_hide.0202.a:0 "Я запомню этого."
 spn_hide.0221.t:0 "Что-то шло за звоном"
 spn_hide.0221.desc_won:0 "Ты почувствовал это раньше, чем увидел: что-то на твоём следу, быстрое и низкое, что бросилось к тебе сразу, как только твоё колдовство закончилось. Оно не издало ни единого звука.\n\nЭто был(а) [spn_ring_champion.GetShortUIName], и [spn_ring_champion.GetSheHe] был(а) в том теле не один(а). Ты отогнал(а) это. Ты не забудешь его глаз."
 spn_hide.0221.desc_lost:0 "Ты почувствовал это раньше, чем увидел: что-то на твоём следу, быстрое и низкое, что бросилось к тебе сразу, как только твоё колдовство закончилось. Оно не издало ни единого звука.\n\nЭто был(а) [spn_ring_champion.GetShortUIName], и [spn_ring_champion.GetSheHe] был(а) в том теле не один(а). Оно сбило тебя с ног, оставило лежать и дало тебе жить."
 spn_hide.0221.a:0 "Что бы это ни было, оно слышит магию."
 spn_hide.0300.t:0 "Что-то в твоих лесах"
 spn_hide.0300.desc:0 "Твои охотники возвращаются бледными. В твоих лесах есть волк — белый, как кость, и больше пони, и он не бежит от собак. Две собаки не вернулись.\n\nОдин из охотников клянётся, что волк остановился на гребне и посмотрел прямо на твой замок. Остальные зовут его дураком, и никто из них не пойдёт обратно в лес без тебя."
 spn_hide.0300.a:0 "Значит, будем на него охотиться."
  spn_hide.0300.a.tt:0 "Замечен легендарный волк. Устройте легендарную охоту, чтобы загнать его."
 spn_hide.0302.t:0 "Он всё ещё там"
 spn_hide.0302.desc:0 "Белый волк снова ушёл. Твои охотники нашли его след, ведущий в холмы, неспешный. Там, где он останавливался оглянуться, трава примята кольцом — будто он лежал там долго и ждал тебя.\n\nОн вернётся. Он пришёл сюда не просто так."
 spn_hide.0302.a:0 "В другой раз."
 spn_hide.0303.t:0 "Он вышел из деревьев"
 spn_hide.0303.desc:0 "Сегодня из деревьев вышел волк — белый и огромный — и лёг перед тобой, будто пришёл издалека.\n\nКогда ты протянул к нему руку, волка не было. На земле лежала только шкура, тёплая, и ощущение чужого взгляда. Кони не подходят к ней."
 spn_hide.0303.a:0 "Я надеваю её."
 spn_hide.0303.a.tt:0 "Шкура надевается. Она сама решит, чем ты для неё будешь."
 spn_hide.0303.b:0 "Пока оставлю её там, где лежит."
 spn_hide.0304.t:0 "Знакомый запах"
 spn_hide.0304.desc:0 "Посреди охоты, когда собаки уже лают впереди, ты останавливаешься. На ветру что-то, что не олень и не кабан. Собаки замолчали, и все до одной смотрят в одну сторону.\n\nЭто пахнет так, как пахнешь ты сам в волчьем облике. Что-то старое там, и оно потерялось."
 spn_hide.0304.a:0 "Я узнаю этот запах снова."
 spn_hide.0305.t:0 "Волк, который был больше, чем волк"
 spn_hide.0305.desc:0 "Белый волк мёртв. Твои охотники ликуют — а потом замолкают, потому что тело на земле меняется.\n\nКогда всё заканчивается, для твоего зала остаётся туша, а рядом с ней — что-то ещё: шкура, сложенная, тёплая, старше любого из вас. Она не принадлежит волку. Волк принадлежал ей.\n\nОна уже всё решила насчёт тебя."
 spn_hide.0305.a:0 "Он пришёл за мной."
 spn_hide.0305.a.tt:0 "Шкура твоя, и, если ты волк, она принимает тебя как своего [spn_champion|E]."
 spn_hide.0310.t:0 "Слух идёт дальше"
 spn_hide.0310.desc:0 "У [spn_shrine_faith.PriestNeuterPlural] в [spn_shrine_county.GetName] новая реликвия, говорят. Старая шкура за стеклом, и верующим позволяют к ней прикладываться по праздникам. Паломники пошли за три графства, и некоторые говорят, что она тёплая на ощупь.\n\nТы знаешь, что это. Ты почти чуешь её отсюда."
 spn_hide.0310.a:0 "Полезно знать."
 spn_hide.0320.t:0 "Что оставил зверь"
 spn_hide.0320.desc:0 "Зверь мёртв, и он снова принял человеческий облик, лёжа там, где упал.\n\nРядом с телом лежит шкура, которой ты на нём никогда не видел. Она тёплая. Мгновение назад её здесь не было. Твои люди не станут к ней прикасаться.\n\nТо, что сделало зверя зверем, лежит на траве рядом с телом, и кто-то должен решить, что с этим делать."
 spn_hide.0320.a:0 "Я оставляю её себе."
 spn_hide.0320.a.tt:0 "Трофей, которого нет ни у одного охотника. Пока она у тебя, выслеживать волков легче."
 spn_hide.0320.b:0 "Пусть будет у моего господина."
 spn_hide.0320.c:0 "Она принадлежит [ROOT.Char.GetFaith.HouseOfWorship]."
 spn_hide.0320.c.tt:0 "Она отправляется в ближайшее святое место твоей веры — храниться как священная реликвия."
 spn_hide.0320.d:0 "Сжечь её."
 spn_hide.0320.d.tt:0 "Она не горит. Ты всё равно оставляешь её себе и спишь плохо."
 spn_hide.0330.t:0 "Разъединение"
 spn_hide.0330.desc:0 "[spn_unbinder.GetShortUIName] кладёт обе руки тебе на грудь и тянет, и что-то разрывается — то, что разрываться не должно было.\n\nТы на полу. Шкура лежит рядом с тобой, снова просто шкура. Волк в тебе всё ещё здесь — он всегда был твой, — но теперь он меньше, и он один."
 spn_hide.0330.a:0 "Свершилось."
 spn_hide.0331.t:0 "Разъединение"
 spn_hide.0331.desc:0 "Ты достаёшь дух шкуры из [spn_unbound.GetShortUIName] так, как достают занозу, — если бы заноза сопротивлялась. Он цепляется за каждую часть [spn_unbound.GetHerHim], до которой может дотянуться, и доставать приходится по куску.\n\nСвершилось. Руки будут дрожать неделю. Где-то что-то это услышало."
 spn_hide.0331.a:0 "Больше никогда."
 spn_hide.0350.t:0 "Шкура в святилище"
 spn_hide.0350.desc:0 "[spn_siege_county.GetName] — твой. В [spn_siege_faith.HouseOfWorship] за решёткой [spn_siege_faith.PriestNeuterPlural] держат старую шкуру, которую называют реликвией. Они встают перед ней, когда входят твои солдаты, будто это кого-то остановит.\n\nЭто не реликвия. Это [spn_siege_hide.GetName], и она повернула голову к тебе в тот самый миг, как ты вошёл."
 spn_hide.0350.a:0 "Она уходит со мной."
 spn_hide.0350.a.tt:0 "Ты снимаешь шкуру и забираешь её с собой."
 spn_hide.0350.b:0 "Оставить её висеть где висит."
 spn_hide.0360.t:0 "Реликвия в [spn_pilgrim_county.GetName]"
 spn_hide.0360.desc:0 "Паломники один за другим проходят мимо реликвии и трогают стекло. Ты знаешь, что за ним. Это [spn_pilgrim_hide.GetName], и она знает, что ты здесь. Стекло тёплое там, где лежит твоя ладонь.\n\n[spn_pilgrim_faith.PriestNeuterPlural] устали. Толпа плотная. Осторожная рука могла бы это сделать."
 spn_hide.0360.a:0 "Выйти с ней."
 spn_hide.0360.a.success:0 "Никто ничего не замечает."
 spn_hide.0360.a.failure:0 "Кто-то замечает."
 spn_hide.0360.b:0 "Не здесь. И не так."
 spn_hide.0370.t:0 "Ты ответил за [spn_guarded.GetShortUIName]"
 spn_hide.0370.desc:0 "За [spn_guarded.GetShortUIName] пришёл охотник и нашёл в дверях тебя. Охотник готовился к одному виду чудовища, а нашёл другое.\n\nСреброспин не дала тебе замешкаться. Она никогда не даёт."
 spn_hide.0370.a:0 "Ничто не пройдёт."
 spn_hide.0380.t:0 "Послать за шкурой"
 spn_hide.0380.desc:0 "Некоторые из шкур висят в святилищах очень далеко отсюда. Святилище — всего лишь здание, и осторожный человек с серебром в кошеле может выйти из него с реликвией под плащом.\n\nВыбери шкуру. Чем дальше её держат, тем позже ты что-нибудь услышишь."
 spn_hide.0380.silverback:0 "Среброспин, в [spn_sf_county_silverback.GetName]"
 spn_hide.0380.timber:0 "Кряж, в [spn_sf_county_timber.GetName]"
 spn_hide.0380.tundra:0 "Тундра, в [spn_sf_county_tundra.GetName]"
 spn_hide.0380.graybeard:0 "Седобород, в [spn_sf_county_graybeard.GetName]"
 spn_hide.0380.midnight:0 "Полночь, в [spn_sf_county_midnight.GetName]"
 spn_hide.0380.alpha:0 "Вожак, в [spn_sf_county_alpha.GetName]"
 spn_hide.0380.go_tt:0 "Твой человек отправляется. Когда он доберётся до святилища, ты решишь, забирать ли ему шкуру."
 spn_hide.0380.none:0 "Ещё нет."
 spn_hide.0381.t:0 "Весть из [spn_errand_county.GetName]"
 spn_hide.0381.found:0 "Из [spn_errand_county.GetName] приходит письмо. Твой человек нашёл [spn_errand_faith.HouseOfWorship], и [spn_errand_hide.GetName] висит внутри, на виду у всех.\n\n[spn_errand_faith.PriestNeuterPlural] запирают двери на ночь и спят крепко. Он ждёт твоего слова."
 spn_hide.0381.gone:0 "Из [spn_errand_county.GetName] приходит письмо. Твой человек нашёл святилище, но шкуры там не было ещё до его прихода. Никто не сказал куда.\n\nОн едет домой, и везёт только эту историю."
 spn_hide.0381.a:0 "Забрать её."
 spn_hide.0381.a.success:0 "Она уже едет к тебе."
 spn_hide.0381.a.failure:0 "Его поймали, и они знают, кто его послал."
 spn_hide.0381.b:0 "Вернуть его домой."
 spn_hide.0381.c:0 "Так тому и быть."