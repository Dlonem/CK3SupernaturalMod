l_russian:
 spn_relic_beetle_name:0 "Жук-гомункул"
 spn_relic_beetle_desc:0 "Жук длиной в большой палец, с панцирем глубокого маслянисто-синего цвета, запечатанный в закупоренной банке. Его достали из мертвеца. Никто в Ордене так и не решился сказать, что он делает с живым.\n\nЗапечатанный, он спит. Просыпается он только внутри кого-то.\n\nПроглотить Жука: щёлкни правой кнопкой по себе, раздел «Сверхъестественное».\nПодсунуть Жука: щёлкни правой кнопкой по кому-нибудь при своём дворе, своему гостю, супругу или любому, кто там же, где ты, раздел «Враждебные».\nСкормить узнику: щёлкни правой кнопкой по своему узнику, раздел «Враждебные»."
 spn_relic_beetle_modifier:0 "Жук-гомункул"
 spn_relic_beetle_modifier_desc:0 "Люди держатся подальше от того, кто хранит банку."
 epidemic_spn_blue_beetle:0 "Голубая чума"
 trait_spn_blue_fever:0 "Голубая лихорадка"
 trait_spn_blue_fever_desc:0 "Этот персонаж горит в лихорадке, от которой под ногтями остаётся голубой оттенок, а во рту — привкус меди."
 spn_death_blue_fever:0 "умер от [GetTrait('spn_blue_fever').GetName( CHARACTER.Self )]"
 spn_loosed_the_beetle_opinion:0 "Выпустил Жука"
 spn_beetle_swallow_interaction:0 "Проглотить Жука"
 spn_beetle_swallow_interaction_desc:0 "Проглоти Жука-гомункула и носи его в себе."
 spn_beetle_swallow_interaction_tt:0 "Ты носишь в себе жука. Через 3–10 дней он проснётся, и его лихорадка вспыхнет там, где ты будешь в тот момент."
 spn_beetle_slip_interaction:0 "Подсунуть Жука"
 spn_beetle_slip_interaction_desc:0 "Подложи Жука-гомункула туда, где [recipient.GetFirstName] проглотит его, сам того не зная."
 spn_beetle_slip_interaction_tt:0 "Если тебя никто не увидит, [recipient.GetFirstName] будет носить жука, не зная об этом, а когда он проснётся, его лихорадка вспыхнет там, где [recipient.GetSheHe] будет. Если тебя увидят, [recipient.GetSheHe] узнает, что ты пытался убить [recipient.GetHerHim], а жук останется у тебя."
 spn_beetle_prisoner_interaction:0 "Скормить узнику"
 spn_beetle_prisoner_interaction_desc:0 "Вели затолкать Жука-гомункула в горло [recipient.GetFirstName] в [recipient.GetHerHis] камере."
 spn_beetle_prisoner_interaction_tt:0 "[recipient.GetFirstName] носит в себе жука. Когда он проснётся, его лихорадка вспыхнет там, где [recipient.GetSheHe] содержится."
 spn_beetle_sealed_tt:0 "Жук запечатан в [spn_reliquary|E]. Сначала забери его обратно."
 spn_beetle_plague_running_tt:0 "Чума жука ещё не бушует."
 spn_beetle_actor_free_tt:0 "Ты не в заключении."
 spn_beetle_slip_reach_tt:0 "[recipient.GetFirstName] находится при твоём дворе, у тебя в гостях, является твоим супругом или находится там же, где ты."
 spn_beetle_breaks_rules_tt:0 "Это нарушает правила [spn_order|E]: ты теряешь 20 [spn_order_standing|E], и твой Храмовый Магус этого не забудет."
 spn_beetle_slip_breaks_rules_tt:0 "Если это сработает, это нарушит правила [spn_order|E]: ты теряешь 20 [spn_order_standing|E], и твой Храмовый Магус этого не забудет."
 spn_beetle_toast_fever:0 "Ты подхватил Голубую лихорадку"
 spn_beetle_toast_contained:0 "Орден сдержал Голубую чуму"
 spn_beetle_toast_claim:0 "Жук вернулся"
 spn_beetle_toast_crawled:0 "Он выполз из тела"
 spn_beetle_toast_drawn:0 "Жук вышел вместе с лихорадкой"
 spn_beetle_toast_returned:0 "Жук снова в банке"
 spn_beetle_toast_no_chance:0 "Момент упущен"
 spn_beetle_toast_slipped:0 "Дело сделано"
 spn_beetle_toast_attempt:0 "Кто-то пытался тебя отравить"
 spn_beetle_toast_seen:0 "Тебя увидели"
 spn_beetle_toast_carrier:0 "Вот кто его носит"
 spn_relic.0700.t:0 "Жук просыпается"
 spn_relic.0700.desc_swallowed:0 "Уже несколько дней что-то шевелится у тебя под рёбрами. Сегодня ночью оно проснулось, и ты проснулся вместе с ним, весь горя."
 spn_relic.0700.desc_forced:0 "То, что тебе затолкали в горло в камере, проснулось. Ты проснулся вместе с ним, весь горя, с привкусом меди во рту."
 spn_relic.0700.desc_slipped:0 "Ты проснулся в жару, с привкусом меди во рту и ощущением, что что-то под рёбрами перевернулось во сне."
 spn_relic.0700.desc_outbreak:0 "\n\nК утру лихорадка была в доме. К концу недели — в каждом доме вокруг тебя."
 spn_relic.0700.desc_few:0 "\n\nК утру лихорадка перекинулась на самых близких тебе людей."
 spn_relic.0700.a:0 "Итак, началось."
 spn_relic.0700.b:0 "Что со мной происходит?"
 spn_relic.0710.t:0 "Голубая чума"
 spn_relic.0710.desc:0 "Распространяется лихорадка, оставляющая голубой оттенок под ногтями. Так действует лишь одно. Кто-то выпустил жука.\n\nЕё можно сдержать. Обереги вокруг города, где она вспыхнула, и карантин замедлят её ценой твоей собственной силы."
 spn_relic.0710.a:0 "Сдержать её."
 spn_relic.0710.b:0 "Узнать, кто его носит."
 spn_relic.0710.b_tt:0 "Ты узнаёшь, кто носит жука."
 spn_relic.0710.c:0 "Это не дело Ордена."
 spn_relic.0720.t:0 "Голубая лихорадка проходит"
 spn_relic.0720.desc:0 "Ночью жар спал. Голубизна ушла из-под ногтей, а с ней и привкус меди."
 spn_relic.0720.a:0 "Я всё ещё здесь."
 spn_relic.0790.t:0 "Отладка: Жук-гомункул"
 spn_relic.0790.desc:0 "Выдать себе жука, задать результат броска после «Подсунуть Жука» или вернуть жука прямо сейчас."
 spn_relic.0790.a:0 "Дай мне жука, из любого Реликвария."
 spn_relic.0790.b:0 "Каждая попытка подсунуть удаётся (на год)."
 spn_relic.0790.c:0 "Каждую попытку подсунуть замечают (на год)."
 spn_relic.0790.d:0 "Вернуть настоящие шансы."
 spn_relic.0790.e:0 "Вернуть жука прямо сейчас."
