l_russian:
 ############################################################
 # Supernatural 2.35b -- the Supernatural Hunt's field events. English.
 ############################################################

 # Duels
 spn_hunt_wounds_duel:0 "Читать раны"
 spn_hunt_dogs_duel:0 "Пройти там, где не идут собаки"
 spn_hunt_misdirect_duel:0 "Дать ему искать в другом месте"

 # --- Two Different Animals (hybrid) ---
 spn_hunt.0150.t:0 "Две разные твари"
 spn_hunt.0150.desc:0 "Теперь их шесть, и одно с другим не сходится.\n\nУ двоих вскрыто горло и выпито всё. Ни лужи, ни следа на стенах. Остальных четверых разобрало что-то тяжёлое.\n\nВсе в [spn_hunt_county.GetName], у кого есть мнение, говорят одно. Их двое. Их двое.\n\n"
 spn_hunt.0150.a:0 "Значит, двое."
 spn_hunt.0150.a.tt:0 "Ты готовишься к обоим. #weak Ошибёшься с половиной снаряжения, чем бы это ни оказалось#!: #high -8#! в бою и #weak -5#! к шкале охоты."
 spn_hunt.0150.b:0 "Одно. Это одно и то же."
 spn_hunt.0150.b.tt:0 "Ты это уже видел(а) или слышал(а) о таком от того, кто видел. #high +15#! к шкале охоты."
 spn_hunt.0150.c:0 "Вскрыть одного и выяснить."
 spn_hunt.0150.c.tt:0 "Твоя [learning|E] против шести дней могильщиковых слухов. Работа неприятная, но только она и даёт ответ."
 spn_hunt.0150.c.success_tt:0 "Все шесть — дело одних рук"
 spn_hunt.0150.c.failure_tt:0 "Ты проводишь ночь и не узнаёшь ничего сверх того, что и так подозревал(а)"

 # --- By the Moon (werewolf) ---
 spn_hunt.0151.t:0 "По луне"
 spn_hunt.0151.desc:0 "Приход записывает своих мёртвых по церковным праздникам. Почти календарь.\n\nТы раскладываешь их на столе при свече — и всё распадается у тебя на глазах. Они идут кучкой. Трое за одну неделю, месяц пустоты, потом двое.\n\nЧто бы это ни было, оно голодно не всегда. Оно голодно по расписанию. Значит, ты примерно знаешь, когда будет следующий."
 spn_hunt.0151.a:0 "Быть там, где будет оно."
 spn_hunt.0151.a.tt:0 "Ты перестаёшь задавать вопросы и проводишь недели в ожидании. #high +20#! к шкале охоты, и никто не слышит, как ты идёшь, потому что ты перестал(а) говорить."
 spn_hunt.0151.b:0 "Сказать графству, в какую ночь запирать двери."
 spn_hunt.0151.b.tt:0 "Умрёт их меньше. #weak -10#! к шкале охоты (улица, где смотрят, — это улица, по которой оно не пойдёт), и всё живое в [spn_hunt_county.GetName] услышит, почему."

 # --- Not a Drop (vampire) ---
 spn_hunt.0152.t:0 "Ни капли"
 spn_hunt.0152.desc:0 "Пономарь похоронил четверых и всякий раз хочет говорить об одном и том же. Грязи не было.\n\nНичего в комнате, ничего на дороге, ничего на одежде. У человека со вскрытым горлом половина его остаётся там, где он упал. У этих — нет.\n\nТо, что приходило за ними, приходило не убивать. Убийство было тем, чем всё кончилось, а не тем, для чего всё было."
 spn_hunt.0152.a:0 "Значит, искать тех, кто выжил."
 spn_hunt.0152.a.tt:0 "Четверо погибли. То, что так кормится, на четырёх не останавливается. #high +12#! к шкале охоты."
 spn_hunt.0152.b:0 "Следить за землёй, которую ему придётся пройти."
 spn_hunt.0152.b.tt:0 "Оно приходит пешком и приходит ночью, а в этот квартал ведут три дороги. #high +8#! к шкале охоты и #high +5#! в бою."

 # --- They Are All Very Sure (compelled county) ---
 spn_hunt.0153.t:0 "Они все очень уверены"
 spn_hunt.0153.desc:0 "Ты расспросил(а) сорок человек в [spn_hunt_county.GetName] о той неделе и получил(а) сорок гладких ответов.\n\nВ этом и беда. Ни один не чешет в затылке. Ни один не называет не тот день и не поправляется. Они рассказывают тебе — все рассказывают одно и то же, — а потом смотрят так, будто ты был(а) невежлив(а).\n\nНикто не помнит неделю так хорошо."
 spn_hunt.0153.a:0 "Перестать спрашивать, что было."
 spn_hunt.0153.a.tt:0 "Спрашивай вместо этого, чего они тебе сказать не могут. Пустоты и есть его очертания. #high +15#! к шкале охоты."
 spn_hunt.0153.b:0 "То, что это делает, умеет залезать человеку в голову."
 spn_hunt.0153.b.tt:0 "А значит, может залезть и в твою. Ты посылаешь за людьми — и от этого медлишь: #weak -5#! к шкале охоты, зато мечи графства будут при тебе, когда понадобятся."

 # --- What the Dogs Will Not Pass ---
 spn_hunt.0154.t:0 "Чего собаки не пройдут"
 spn_hunt.0154.desc:0 "Есть сорок ярдов нижней дороги, по которым собаки не идят.\n\nНе лают. Не шарахаются. Не идут. Погонщик водит их в обход, и так уже год, и не скажет, с чего начал; а когда ты просишь провести их напрямик, он сперва смеётся над тобой, а потом, поняв, что ты не шутишь, перестаёт смеяться.\n\nТо, что там есть, есть и при свете дня. Просто при свете дня оно ничего не делает."
 spn_hunt.0154.desc_reader:0 "Есть сорок ярдов нижней дороги, по которым собаки не идут, и [spn_hunt_reader.GetTitledFirstName] нашёл(ла) это раньше тебя.\n\nНе лают. Не шарахаются. Не идут. \"Год, около того, — говорит [spn_hunt_reader.GetSheHe], присев над тем, чего ты не видишь. — Земля тут не та. Она не та полосой\".\n\nТо, что там есть, есть и при свете дня. Просто при свете дня оно ничего не делает."
 spn_hunt.0154.a:0 "Пройти ночью."
 spn_hunt.0154.a.tt:0 "Твоя [prowess|E] против того, что собаки уже поняли. #high +15#! к шкале охоты, если ты к концу пути ещё стоишь на ногах."
 spn_hunt.0154.a.success_tt:0 "Ты находишь, где оно залегает"
 spn_hunt.0154.a.failure_tt:0 "Что-то добирается до тебя раньше, чем ты до него"
 spn_hunt.0154.b:0 "Пройти при свете и прочесть как следует."
 spn_hunt.0154.b.tt:0 "Медленнее и безопаснее. #high +6#! к шкале охоты и ещё #high +6#!, если ты взял(а) с собой того, кто читает землю за плату."

 # --- He Asked About You By Name (the creature's side) ---
 spn_hunt.0155.t:0 "Он спрашивал о тебе по имени"
 spn_hunt.0155.desc:0 "Сестра твоего повара работает в таверне на нижней дороге, и она сама поднялась на холм, чтобы рассказать тебе, — уже по этому ты знаешь, что она испугалась.\n\n[spn_hunter.GetTitledFirstName] в [spn_hunt_county.GetName] две недели, и до этой недели [spn_hunter.GetSheHe] расспрашивал(а) о мёртвых. Теперь [spn_hunter.GetSheHe] расспрашивает о тебе. Не о твари. О тебе, по имени, и о том, где ты был(а) в ночи, которые [spn_hunter.GetSheHe] может перечислить.\n\nЕщё есть время оказаться в другом месте. Но немного."
 spn_hunt.0155.a:0 "Уходить сейчас."
 spn_hunt.0155.a.tt:0 "Ты уходишь раньше, чем [spn_hunter.GetSheHe] добирается до двери, и охота кончается ничем. Но это стоит тебе двух лет кормёжки, и [spn_hunter.GetSheHe] точно поймёт, что это значит."
 spn_hunt.0155.b:0 "Дать ему искать в другом месте."
 spn_hunt.0155.b.tt:0 "Твоя [intrigue|E] против [spn_hunter.GetHerHis]. Сделано хорошо — это #high -20#! от всего, что [spn_hunter.GetSheHe] собрал(а) воедино. Сделано плохо — ты только что подтвердил(а) ту неделю, о которой [spn_hunter.GetSheHe] расспрашивал(а)."
 spn_hunt.0155.b.success_tt:0 "След уводит от твоей двери"
 spn_hunt.0155.b.failure_tt:0 "Ты отвечаешь на вопрос, которого [spn_hunter.GetSheHe] ещё не задавал(а)"
 spn_hunt.0155.c:0 "Пусть приходит."
 spn_hunt.0155.c.tt:0 "Ты будешь готов(а), а готовность чего-то стоит, когда откроется дверь."

 # --- The Ones Who Helped ---
 spn_hunt.0156.t:0 "Те, кто помог"
 spn_hunt.0156.desc:0 "[spn_hunt_helper.GetTitledFirstName] рассказал(а) тебе о нижней дороге, о датах и о том, кто из мёртвых с кем из живых пил. [spn_hunt_helper.GetSheHe|U] рассказывал(а) охотно. До тебя никто не спрашивал.\n\nКто-то стоит ночами напротив его двери. Кто именно, [spn_hunt_helper.GetSheHe] не видел(а), [spn_hunt_helper.GetSheHe] не спит и пришёл(шла) к тебе, потому что в [spn_hunt_county.GetName] только ты согласен [spn_hunt_helper.GetHerHim] выслушать.\n\nТы это сделал(а). Не нарочно — и всё равно сделал(а)."
 spn_hunt.0156.a:0 "Пусть [spn_hunt_helper.GetFirstName] будет там, куда оно не дотянется."
 spn_hunt.0156.a.tt:0 "Ты лишаешься [spn_hunt_helper.GetHerHis] глаз и ушей до конца дела (#weak -8#! к шкале охоты), зато [spn_hunt_helper.GetSheHe] останется жив(а)."
 spn_hunt.0156.b:0 "Использовать. Испуганные помнят больше."
 spn_hunt.0156.b.tt:0 "#high +12#! к шкале охоты. [spn_hunt_helper.GetTitledFirstName] тебя не поблагодарит, и это [spn_hunt_helper.GetHerHim] сломает."