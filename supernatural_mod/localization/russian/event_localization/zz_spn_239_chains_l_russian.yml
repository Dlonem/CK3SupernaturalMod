l_russian:
 # 2.39 (WORK-ORDER-2.39 B6, D7, F16): Compel Mortal. One reason key wherever a guarded mind is checked (red team L14).
 spn_mind_guarded_custom:0 "Его разум защищён от подчинения."
 spn_compel_did_not_take_actor:0 "Принуждение: не подействовало"
 spn_msg_compel_did_not_take_actor:0 "[recipient.GetShortUIName|U] встретил твой взгляд, и ничего не произошло. [recipient.GetSheHe|U] ведьма, и [recipient.GetSheHe] знает, что ты пытался сделать."
 spn_compel_did_not_take_recipient:0 "Не подействовало"
 spn_msg_compel_did_not_take_recipient:0 "Что-то надавило на твой разум и не нашло, за что ухватиться. Теперь ты знаешь, кто такой [actor.GetShortUIName]."
 COMPEL_MORTAL_FREE_ME:0 "Освободи меня"
 spn_compel_free_me_tt:0 "Твой тюремщик отпирает камеру и выпускает тебя."

 # 2.39 (WORK-ORDER-2.39 F6): The Warded Chains, relic number ten.
 spn_held_in_chains_custom:0 "У твоего тюремщика Заговорённые цепи, и они держат волка."
 spn_held_in_chains_other_custom:0 "У их тюремщика Заговорённые цепи, и цепи держат волка."
 spn_relic_chains_name:0 "Заговорённые цепи"
 spn_relic_chains_desc:0 "Железные цепи, над которыми Маг трудился, пока звенья не обрели оберег. Волк, скованный ими, не может принять другой облик, а без него не может вырваться. Для вампира это просто цепи."
 spn_relic_chains_modifier:0 "Заговорённые цепи"
 spn_relic_chains_modifier_desc:0 "Волк, чей тюремщик владеет ими, не может принять другой облик."
 spn_ward_chains_decision:0 "Заговорить цепи"
 spn_ward_chains_decision_desc:0 "Вплети оберег в железные цепи. Волк, скованный ими, не может принять другой облик, а без него не может вырваться из камеры."
 spn_ward_chains_decision_tooltip:0 "Изготовить Заговорённые цепи."
 spn_ward_chains_decision_confirm:0 "Заговорить"
 spn_ward_chains_ring_tt:0 "Любой поблизости, кто слышит магию, услышит, как ты работаешь."
 spn_commission_chains_interaction:0 "Заказать Заговорённые цепи"
 spn_commission_chains_interaction_desc:0 "Заплати Магу 150 золота, чтобы он заговорил для тебя железные цепи. Волк, скованный ими, не может принять другой облик, а без него не может вырваться из камеры."
 spn_commission_chains_interaction_notification:0 "[actor.GetShortUIName|U] предлагает тебе 150 золота, чтобы ты заговорил для [actor.GetHerHim] цепи."
 spn_commission_chains_effect_tt:0 "Ты получаешь Заговорённые цепи"
 spn_ai_swept_chapter:0 "Выжег зал Магов"

 # 2.39 (WORK-ORDER-2.39 F5): Break the Chains.
 spn_break_the_chains_decision:0 "Разорвать цепи"
 spn_break_the_chains_decision_desc:0 "Шкура ждала достаточно долго. Открой волку дверь."
 spn_break_the_chains_decision_tooltip:0 "Попытаться вырваться из темницы в облике волка."
 spn_break_the_chains_decision_confirm:0 "Вырваться"
 spn_break_the_chains_decision_effect_tt:0 "Если кто-нибудь это увидит, он узнает, кто ты такой. Чем дальше продвинулся твой волк и чем крепче твои [spn_hide_bond|E], тем меньше шансов, что кто-то увидит."
 spn_break_the_chains_success_tt:0 "Ты вырываешься"
 spn_break_the_chains_success_outcome_tt:0 "Ты свободен"
 spn_break_the_chains_failure_tt:0 "Тебя ловят"
 spn_break_the_chains_failure_outcome_tt:0 "Ты ранен и переведён в [dungeon|E]"

 spn_hide.0401.t:0 "Дверь поддаётся"
 spn_hide.0401.desc_seen:0 "Ты даёшь волку подняться, и дверь его не удерживает. Засов вырывается из камня. Стражник бросается на тебя в коридоре и тяжело падает, а остальные жмутся к стене и смотрят, как ты уходишь.\n\nОни видели, кто ты такой, и к утру [imprisoner.GetShortUIName] будет рассказывать об этом всякому, кто станет слушать."
 spn_hide.0401.desc_seen_midnight:0 "Волк хочет, чтобы его видели, и сегодня ты ему позволяешь. Дверь слетает с петель. Двое стражников пытаются остановить тебя в коридоре, и ни один из них не поднимается быстро.\n\nОни видели, кто ты такой, и к утру [imprisoner.GetShortUIName] будет рассказывать об этом всякому, кто станет слушать."
 spn_hide.0401.desc_seen_unhurt:0 "Ты даёшь волку подняться, и дверь его не удерживает. Стражники в коридоре не пытаются тебя остановить. Они вжимаются в стену, когда ты проходишь мимо, и ты оставляешь их невредимыми.\n\nОни видели, кто ты такой, и к утру [imprisoner.GetShortUIName] будет рассказывать об этом всякому, кто станет слушать."
 spn_hide.0401.desc_seen_timber:0 "Ты даёшь волку подняться ровно настолько, насколько нужно. Засов поддаётся. Стражник шагает в темноту коридора и падает, не успев увидеть, что его ударило.\n\nВ дальнем конце, с лампой в руке, [imprisoner.GetShortUIName] видит всё. Теперь [imprisoner.GetSheHe|U] знает, кто ты такой. Больше никто."
 spn_hide.0401.desc_unseen_a:0 "Никто не видит, как ты уходишь. К утру камера стоит открытой, засов отодвинут, а стражники на ногах на своих постах. Каждый клянётся, что не спал. Никто не может сказать, что видел."
 spn_hide.0401.desc_unseen_b:0 "Стражники запомнят долгий, тихий отрезок ночи, в котором ничего не было. К тому времени, как кому-то придёт в голову заглянуть к тебе, дверь открыта, а тебя нет."
 spn_hide.0401.a:0 "Бежать дальше."
 spn_hide.0402.t:0 "Пойман у решётки"
 spn_hide.0402.desc_seen:0 "Волк поднимается слишком медленно. Стражники набрасываются на тебя прежде, чем дверь поддаётся, и успевают увидеть достаточно, пока валят тебя: глаза, зубы, облик, в который ты наполовину перешёл.\n\nТы приходишь в себя в камере хуже прежней, раненым, и [imprisoner.GetShortUIName] знает, кто ты такой."
 spn_hide.0402.desc_unseen:0 "Ты у решётки, когда приходят стражники, и всё, что они находят, — узник, дёргающий дверь. Тебя за это избивают, а камера, куда тебя потом сажают, хуже прежней.\n\nОни думают, что ты пытался открыть дверь. Никто из них не знает, кто ты такой."
 spn_hide.0402.a:0 "Ещё нет."
 spn_hide.0402.gaoler_toast:0 "Узник пытался сбежать"
 spn_hide.0402.gaoler_toast_seen_tt:0 "[spn_btc_wolf.GetShortUIName|U] пытался вырваться из твоей темницы и был пойман. Твои стражники видели, кто [spn_btc_wolf.GetSheHe] такой."
 spn_hide.0402.gaoler_toast_unseen_tt:0 "[spn_btc_wolf.GetShortUIName|U] пытался вырваться из твоей темницы и был пойман у решётки."
 spn_hide.0403.t:0 "Пустая камера"
 spn_hide.0403.desc_seen:0 "Дверь камеры висит на одной петле, засов всё ещё в ней. Стражники, добежавшие первыми, рассказывают одну и ту же историю о том, что вышло наружу, и ни один не произносит этого слова.\n\n[spn_btc_wolf.GetShortUIName|U] исчез. Заговорённые цепи удержали бы [spn_btc_wolf.GetHerHim]."
 spn_hide.0403.desc_seen_timber:0 "Ты стоял в конце коридора с лампой, когда оно вышло из камеры, и видел всё. Твои стражники не видели ничего, что могли бы описать.\n\n[spn_btc_wolf.GetShortUIName|U] исчез. Заговорённые цепи удержали бы [spn_btc_wolf.GetHerHim]."
 spn_hide.0403.desc_unseen:0 "Камеру нашли открытой на рассвете. Стражники бодрствовали на постах и клянутся, что мимо них никто не проходил. Ни один не может сказать, когда в последний раз заглядывал внутрь."
 spn_hide.0403.a:0 "Найти [spn_btc_wolf.GetHerHim]!"
 spn_hide.0403.b:0 "Пусть [spn_btc_wolf.GetHerHim] бежит."
