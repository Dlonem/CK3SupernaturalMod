 spn_msg_tooltip_embrace_mage_desc:0 "Ты также становишься ведьмой и получаешь всё древо Тайных искусств, а также «Контроль разума», «Ткача судеб» и «Призывателя» из Чёрной магии. Твой фокус образа жизни сбрасывается. Первые опыты опасны и могут оставить долговременную травму."
 spn_msg_tooltip_embrace_mage_witch_desc:0 "Ты получаешь всё древо Тайных искусств, а также «Контроль разума», «Ткача судеб» и «Призывателя» из Чёрной магии. Твой фокус образа жизни сбрасывается. Первые опыты опасны и могут оставить долговременную травму."

 # 2.39 (WORK-ORDER-2.39 F9): the rule "Supernatural: Mortals Becoming Demons".
 rule_spn_mortal_demons_rule:0 "Сверхъестественное: смертные становятся демонами"
 setting_spn_mortal_demons_on:0 "По умолчанию (все)"
 setting_spn_mortal_demons_on_desc:0 "И игроки, и ИИ могут становиться демонами — например, когда наследник с кровью демона достигает совершеннолетия."
 setting_spn_mortal_demons_players_only:0 "Только игроки"
 setting_spn_mortal_demons_players_only_desc:0 "Ни один персонаж ИИ никогда не становится демоном. Персонажи ИИ с кровью демона остаются с кровью демона. Демоны, призванные магией, по-прежнему появляются."

