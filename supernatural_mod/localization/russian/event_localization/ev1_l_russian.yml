 ev2.46.title:0 "Онейромантия"
 ev2.46.desc:0 "Вы осознали, что ваши сны часто показывают будущее или позволяют вам как-то влиять на реальный мир."
 ev2.46.a:0 "Это должно быть исследовано."
 ev2.46.b:0 "Следующий полезный инструмент у меня в руках."
 oneiromancy_modifier:0 "Онейромантия"
 ev2.47.title:0 "Источник магической энергии"
 ev2.47.desc:0 "Вы нашли возможность наблюдать за магической аномалией, связанной с потоками элементальной силы. В результате вы собрали небольшую часть этой энергии."
 ev2.47.a:0 "Она пригодится для следующего эксперимента."
 ev2.47.b:0 "Я найду практическое применение."
 ev2.47.a_ct:0 "Вы получите очко магического таланта"
 ev2.47.a_ct2:0 "[wwitch.GetTitledFirstName] получит очко магического таланта"
 YOU_ARE_HERCULEAN:0 "Вы уже полубог"
 ev2.48.title:0 "Дворцовый переворот"
 ev2.48.desc:0 "Крики разбудили вас ночью. Вы поняли, что группа вооруженных солдат врывается во дворец."
 ev2.48.a:0 "Стража! Захватчики...!"
 ev2.48.b:0 "Я остановлю их своей магией!"
 ev2.48.c:0 "Я попробую сбежать..."
 ev2.48.a_ct1:0 "Нападающие были отражены"
 ev2.48.a_ct2:0 "Переворот удался"
 ev2.48.c_ct:0 "Переворот удался, но вы сохранили свою жизнь"
 legion_name:0 "Баэль"
 ev2.50.title:0 "Долгая ночь"
 ev2.50.desc:0 "Нападающие были разбиты после жестоких боев, но, похоже, атака была отвлекающим маневром. Ваши магические артефакты пропали."
 ev2.50.a:0 "Что?!"
 ev2.50.a_ct:0 "Ваши магические предметы потеряны."
