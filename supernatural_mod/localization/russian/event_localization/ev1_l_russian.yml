 ev16.t.a:0 "Учение Демона"
 mammon_name:0 "Маммон"
 ev30.0.title:0 "Незнакомец"
 ev30.0.desc:0 "В вашей комнате появляется гуманоидная фигура. Она не выглядит как существо из этого мира. Незнакомец молча смотрит на вас."
 ev30.0.a:0 "Эм... ты Демон?"
 ev31.0.desc:0 "'Нет, я Карл Великий, вернувшийся за вторым раундом. Конечно, я Демон, а ты смертный или просто дурак?"
 ev31.0.a:0 "Да, я Колдун."
 ev31.0.b:0 "Нет, я не таков! Я тоже Демон."
 ev31.0.c:0 "Нет, я... что-то другое."
 ev31.0.d:0 "Это не твое дело."
 ev32.0.desc:0 "'Здорово. Почему я здесь?'"
 ev32.0.a:0 "Я хочу, чтобы ты сделал что-то для меня."
 ev32.0.b:0 "Я не уверен."
 ev32.0.c:0 "Ладно, достаточно. Исчезни."
 ev33.0.desc:0 "Я не силен в том, чтобы 'что-то' делать. Я знаю только числа."
 ev33.0.a:0 "Какие числа?"
 ev34.0.desc:0 "Арифметика, доходы, убытки, доход, возвраты, интерес, налогообложение..."
 ev34.0.a:0 "Подожди секунду. Это значит, что ты можешь дать мне золото, верно?"
 ev34.0.b:0 "Доходы? Ты видишь будущее? Покажи мне."
 ev35.0.desc:0 "Да, я могу. Дело в том, что у меня тонна золотых слитков, монет и ювелирных изделий. Хотел бы ты немного?"
 ev35.0.a:0 "Конечно."
 ev35.0.b:0 "Я бы предпочел, чтобы ты научила меня этой... арифметике."
 ev35.0.c:0 "Дай мне... БОЛЬШЕ!"
 financial_knowledge_modifier:0 "Финансовые Знания"
 cursed_gold_modifier:0 "Проклятое Золото Маммона"
 ev36.0.desc:0 "Интересно. Давайте посмотрим... я стою в круге призыва, вот почему я заблокирован. Эта камера выглядит как примитивная лаборатория ведьмы, и в воздухе чувствуется свежий запах магии. Похоже, ты наложила заклинание, которое призвало меня. Умышленно? Я думаю, да. Ты, вероятно, ищешь знания или власть. У меня есть и то, и другое. Выпусти меня, и я поделюсь с тобой..."
 ev36.0.a:0 "Пусть будет так. Я освобождаю тебя."
 ev36.0.b:0 "Неплохая попытка."
 ev37.0.title:0 "Премия Дарвина"
 ev37.0.desc:0 "'Ты дурак', демон покинул круг, 'Как я и обещал, я покажу тебе свою силу...'"
 ev37.0.a:0 "Нет-нет-нет...!"
 ev38.0.desc:0 "Ты не дурак, хорошо. Итак, чего ты хочешь, колдун? Будь осторожен с тем, о чем мечтаешь..."
 ev38.0.a:0 "Освободи мой Потенциал."
 ev38.0.b:0 "Тайное Знание."
 ev38.0.c:0 "Я хочу Богатство."
 ev38.0.d:0 "Я хочу богатство! Сундуки с ценностями..."
 mammons_knowledge_modifier:0 "Знание Маммона"
 lilith_name:0 "Лилит"
 ev39.0.title:0 "Лилит"
 ev39.0.desc:0 "Вдруг вспышка света заполняет пространство, и ты видишь... самую красивую Демоницу. 'Привет, красавчик' - в её голосе ты слышишь что-то... властное."
 ev39.1.desc:0 "Вдруг вспышка света заполняет пространство, и ты видишь... ангела. 'Привет, красавица' - в её голосе ты слышишь что-то... властное."
 ev39.0.a:0 "Добро пожаловать, моя леди..."
 ev40.0.desc:0 "Прошло время с тех пор, как я гуляла по этому миру. Классное место, кстати, мне нравится. Хотя я бы изменила несколько вещей... Видишь ли, я рада быть здесь. Там внизу так скучно, я совсем не буду по этому скучать."
 ev40.0.a:0 "На самом деле я..."
 ev41.0.desc:0 "На самом деле, ты выглядишь так, будто тебе нужно немного развлечений. Я думаю, я могу что-то с этим сделать..."
 ev41.0.a:0 "...да?"
 ev41.0.b:0 "Тишина. Я призвал тебя, и ты должна исполнить моё желание сейчас."
 ev42.0.desc:0 "Желание... покажи мне свою спальню. У меня есть ощущение, что там будет более комфортно. Поверь мне, я могу исполнить твоё желание."
 ev42.0.a_not_used:0 "Отличная идея, иди."
 ev42.0.a:0 "Как ты пожелаешь, моя леди."
 ev43.0.desc:0 "Ура, я люблю желания. Скажи мне, чего ты желаешь. Удовольствия? Славы? Почёта и уважения? Или... чтения мыслей? Иногда это полезно."
 ev43.0.a:0 "Удовольствия."
 ev43.0.b:0 "Славы и уважения."
 ev43.0.c:0 "Чтение мыслей? Конечно."
 ev43.0.d:0 "Красоты."
 ev43.0.e:0 "Долгой и счастливой жизни."
 lilith_blessing:0 "Благословение Лилит"
 ev46.0.title:0 "Нужды Лилит"
 ev46.0.desc:0 "Этим утром Лилит подошла к тебе с кислым лицом. 'Мне скучно! Давай сделаем что-нибудь весёлое. Ты должен организовать пиршество как можно скорее.'"
 ev46.0.a:0 "Конечно, дорогая, скоро, обещаю."
 ev46.0.b:0 "Нет, я хочу сосредоточиться."
 ev46.0.c:0 "У меня есть лучшая идея."
 ev48.0.title:0 "Планы Лилит"
 ev48.0.desc:0 "Сегодня Лилит пришла ко мне с новой сумасшедшей идеей. 'Я придумала план' - сказала она весело - 'Я пойду к [riv.GetTitledFirstName] и выясню, что он замышляет. Это должно быть легко.' Ты видишь её великолепные глаза и понимаешь, что будет непросто отказать ей... в чем угодно."
 ev48.0.a:0 "Ээ... да, дорогая, отличная идея."
 ev48.0.b:0 "Я думаю... это слишком рискованно."
 ev48.0.c:0 "Ты нужна мне здесь, и у меня есть серьезные доказательства, чтобы это подтвердить."
 ev49.0.title:0 "Ночной гость"
 ev49.0.desc:0 "Тебя будит ночью стук в дверь. Странно, должно быть что-то срочное. Открыв дверь, ты видишь одного из своих новых придворных. А куда делись стражники? Они должны быть здесь... С другой стороны, она выглядит потрясающе, может быть, это к лучшему, что мы одни? Есть только одна причина, почему она пришла сюда."
 ev49.0.a:0 "Входи."
 ev49.0.b:0 "Я сделаю вид, что не вижу тебя. Оставь меня в покое."
 ev50.0.desc:0 "'Как ты смеешь, смертный?' Она сломала тебе шею одним резким движением быстрее, чем это возможно."
 ev50.0.a:0 "Что...?"
 ev51.0.title:0 "Она возвращается"
 ev51.0.desc:0 "Она выглядит пристыженной. 'Не все пошло по плану', - сказала Лилит, - 'Не спрашивай, я была импульсивной. Но я скучала по тебе!'"
 ev51.0.a:0 "Я тоже скучала по тебе, дорогой."
 ev52.0.desc:0 "'Он рассказал мне всё!' - сказала она, - 'Это было слишком легко. Мне нужно искать большую задачу.'"
 ev52.0.a:0 "Молодец, дорогой."
 ev53.0.desc:0 "Лилит выглядит... иначе. Она избегает твоего взгляда? После одного неловкого момента она говорит: '[riv.GetTitledFirstName] - весёлый человек. Я останусь с [owner.GetHerHim]. Я ухожу от тебя. Пока.'"
 ev53.0.a:0 "Чёрт..."
 ev54.0.title:0 "Желания Лилит"
 ev54.0.desc:0 "'Я хочу быть твоей королевой', - сказала Лилит однажды, - 'Твои подданные должны стать и моими подданными. Ты возьмешь меня в жены, согласно твоей глупой религии.'\n'Но, дорогая, у меня есть жена!' - ты отвечаешь в отчаянии.\n'Не беспокойся' - говорит она невинным тоном, - 'Я просто отрублю ей голову и подарю тебе как сувенир.'"
 ev54.0.a:0 "Пусть будет так."
 ev54.0.b:0 "Сейчас всё хорошо, как есть."
 ev54.0.c:0 "Мы поговорим об этом позже."
 ev55.0.title:0 "Природа Лилит"
 ev55.0.desc:0 "Лилит вошла в твою комнату, и ты видишь, что она вся в крови. Оказалось, она убила одного из твоих советников. \n 'У меня было плохое настроение' - сказала она - 'Не сердись на меня.' - Лилит улыбается, как маленькая девочка."
 ev55.0.a:0 "Конечно, дорогая, всё в порядке."
 ev55.0.b:0 "Ты не можешь убивать моих советников просто так!"
 ev56.0.desc:0 "Лилит сделала необычную просьбу сегодня. \n 'Мне нужно немного золота, знаешь, мне нужно купить несколько вещей. Новые платья, украшения... Думаю, 200 монет будет достаточно.'"
 ev56.0.a:0 "Конечно, дорогая."
 ev56.0.b:0 "200 золота за... платья? Ни за что."
 ev2.2.title:0 "Магический артефакт?"
 ev2.2.desc:0 "Интересная возможность появилась в твоем дворе - один из пришлых хочет продать тебе магический артефакт. \n 'Цена не чрезмерная, всего 100 монет' - уверяет продавец."
 ev2.2.a:0 "Я возьму это!"
 ev2.2.b:0 "Он выглядит поддельным."
 ev2.2.c:0 "Магии не существует."
 ev2.2.d:0 "Возможно, в другой раз."
 fake_magic_artifact:0 "Поддельный 'Магический' меч"
 fake_magic_artifact_desc:0 "Обычный хлам, притворяющийся магическим предметом."
 ev2.2.a_ct:0 "Вы получите 'Магический меч'."
 NOT_WAR_AGAINST:0 "Не время для войны против цели"
 ev2.3.title:0 "Новый враг?"
 ev2.3.desc:0 "Все указывает на то, что [enemy.GetTitledFirstName] также практикует продвинутую магию. [enemy.GetSheHe|U] может causar проблемы в будущем."
 ev2.3.a:0 "Я разберусь с ним."
 ev2.3.b:0 "Я доверяю [enemy.GetHerHim], [enemy.GetSheHe] не предаст меня."
 ev2.3.c:0 "Он не представляет угрозы."
 ev2.3.d:0 "Здесь нечего беспокоиться."
 ev2.4.title:0 "Новый враг"
 ev2.4.desc:0 "Все указывает на то, что [this0.GetTitledFirstName] также практикует продвинутую магию. [this0.GetSheHe|U] может causar проблемы в будущем."
 ev2.4.a:0 "Посмотрим."
 ev2.5.title:0 "Время бить в ответ!"
 ev2.5.desc:0 "[enemy.GetTitledFirstName], вероятно, уже замышляет против тебя. Может, стоит задуматься о превентивной атаке?"
 ev2.5.a:0 "Я распущу злые слухи о [enemy.GetHerHim]."
 ev2.5.b:0 "Еще нет."
 ev2.5.c:0 "Я отправлю своего подручного."
 ev2.5.d:0 "Я покончу с [enemy.GetHerHim] раз и навсегда."
 ev2.5.f:0 "Я прокляну землю [enemy.GetHerHis]."
 strike_duel_mages_ct:0 "Вы нападете на [this0.GetTitledFirstName] напрямую в поединке на смерть."
 ev2.5.e:0 "У меня есть более срочные дела."
 harmful_rumors_modifier:0 "Злые слухи"
 preparation_for_strike_modifier:0 "Подготовка к атаке"
 ev2.6.title:0 "Враг наносит удар!"
 ev2.6.desc:0 "Твой враг решил бросить тебе вызов в твоем собственном замке. Он обманул твоих стражей с помощью заклинания и атаковал тебя, с мечом в руке!"
 ev2.6.a:0 "Наконец-то!"
 game_concept_mminion:0 "Прислужник"
 game_concept_mmaster:0 "Властелин"
 game_concept_mminion_desc:0 "Просто слуга"
 game_concept_mmaster_desc:0 "Лорд со своими прислужниками"
 ev2.7.title:0 "Магические эксперименты"
 ev2.7.desc:0 "Твой уровень инициации позволяет тебе проводить исследования, которые откроют путь к истинной силе. Но рискнешь ли ты?"
 ev2.7.a:0 "Я готов к этому."
 ev2.7.b:0 "Это слишком опасно."
 minion_starts_scheme_ct:0 "[minion.GetTitledFirstName] начнет схему убийства против [enemy.GetTitledFirstName]"
 masters_orders_modifier:0 "Приказ мастера"
 ev2.8.title:0 "Еще более мощный"
 ev2.8.desc:0 "Долгосрочная практика магии сделала тебя более могущественным. Ты пришел к выводу, что границ нет."
 ev2.8.a:0 "Я — Бог нового мира!"
 ev2.9.title:0 "Приказ мастера"
 ev2.9.desc:0 "Мой мастер, [this0.GetTitledFirstName], дал мне приказ убить его врага - [enemy.GetTitledFirstName]. Я сделаю все возможное."
 ev2.9.a:0 "Как скажете, мастер."
 ev2.10.title:0 "Путь к истинной силе"
 ev2.10.desc:0 "В одном видении ты увидел, что у [target.GetTitledFirstName] есть предмет невероятной силы. Забрав его, ты откроешь для себя новые возможности."
 ev2.10.a:0 "Это мой шанс!"
 ev2.10.b:0 "Это слишком рискованно."
 NOT_HAVE_MAGE_TOWER:0 "У тебя уже есть башня магов."
 looked_to_the_future:0 "Посмотрел в будущее"
 ev2.11.title:0 "Отдай мне свою душу"
 ev2.11.desc:0 "Сегодня ночью в твоей комнате появляется существо, не пришедшее из этого мира. Ты ощущаешь强ный запах серы... и тебе становится холодно.НЛ@ 'Ты продал свою душу давным-давно. Сегодня я забираю тебя в ад, смертный' - говорит демон."
 ev2.11.a:0 "Ладно. Я иду с тобой."
 ev2.11.b:0 "Подожди, нет другого варианта?"
 ev2.11.c:0 "Может, ты и не уязвим для магии, но мой клинок отправит тебя обратно в ад."
 ev2.11.d:0 "Я просто использую заклинание изгнания из Книги Теней, ты, черноглазая сука!"
 banish_demon_ct:0 "Демон будет изгнан из этого мира."
 ev2.12.desc:0 "Существо на мгновение задумалось.НЛ@ 'Я могу дать тебе больше времени, если ты позволишь мне попробовать твоё тело.'"
 ev2.12.a:0 "Я выбираю смерть."
 ev2.12.b:0 "Пусть. Будет. Так."
 fucked_by_demon_modifier:0 "Потрахан с демоном"
 ev2.13.title:0 "Вернуться в ад"
 ev2.13.desc:0 "Время вернуться в ад."
 ev2.13.a:0 "Хорошо."
 ev2.14.title:0 "Этот человек должен умереть!"
 ev2.14.desc:0 "Ни один смертный не может быть для вас угрозой, но существование колдунов кажется неуместным."
 ev2.14.a:0 "Ррррр... маги... Я ненавижу их всех."
 ev2.16.title:0 "Время охоты"
 ev2.16.desc:0 "Вы нашли свое призвание - любые ведьмы, демоны, колдуны и монстры должны умереть. Это ваша миссия."
 ev2.16.a:0 "Я готов."
 ev2.17.title:0 "Охота на ведьм"
 ev2.17.desc:0 "Согласно вашему расследованию, [witch.GetTitledFirstName] практикует тёмную магию. Вам нужно судить [witch.GetHerHim]."
 ev2.17.a:0 "Я начну приготовления."
 ev2.17.b:0 "Еще нет."
 ev2.17.c:0 "Я отправлю своих Охотников."
 ev2.17.c_ct:0 "Один Охотник будет отправлен."
 ev2.18.title:0 "Суд над ведьмой"
 ev2.18.desc:0 "'Вы обвиняетесь в колдовстве' - сказал [imprisoner.GetTitledFirstName] - 'Признайте свою вину и молите о прощении души... если она у вас еще есть.'"
 ev2.18b.desc:0 "'Признайтесь!' - крикнул [imprisoner.GetTitledFirstName] - 'Я могу держать вас здесь до конца вашей жалкой жизни.'"
 ev2.18.a:0 "Я не виновен!"
 ev2.18.a_ct:0 "Вас, вероятно, будут пытать."
 ev2.18.b:0 "Я занимаюсь колдовством, бедный человек."
 ev2.18.b_ct:0 "Это, вероятно, тоже не закончится хорошо."
 ev2.18.c:0 "Ты пожалеешь об этом!"
 ev2.18.d:0 "Я могу всё объяснить!"
 ev2.18.d_ct:0 "Тебя, вероятно, выпустят."
 ev2.19.desc:0 "Ты немедленно начал процесс над ведьмой, но обвиняемая заявляет, что она не виновна."
 ev2.19.a:0 "Время пыток!"
 ev2.19.b:0 "Я думаю, он невиновен."
 you_were_torture:0 "Тебя пытали!"
 ev2.20.desc:0 "[prisoner.GetHerHim|U] признался! [prisoner.GetHerHim|U] любит дьявола!"
 ev2.20.a:0 "Зажгите костёр!"
 ev2.20.b:0 "Хм..."
 mages_target:0 "Охотник на ведьм против Ведьмы #P +30%#!"
 released_prison_toast:0 "Ты был оправдан."
 ev2.21.title:0 "Следят?"
 ev2.21.desc:0 "Ты подозреваешь, что за тобой кто-то наблюдает. Неважно, чьи это шпионы, нужно быть осторожным."
 ev2.21.a:0 "Я буду бдительным."
 ev2.21.b:0 "Я не могу доверять никому."
 ev2.22.title:0 "Охота завершена."
 ev2.22.desc:0 "Охота завершилась без результатов."
 ev2.22.a:0 "Время прощаться."
 ev2.23.title:0 "Источник магии?"
 ev2.23.desc:0 "Этот артефакт, магический катализатор, может дать тебе секретную силу. Хочешь обладать им?"
 ev2.23.a:0 "Конечно."
 ev2.23.b:0 "Это было бы грехом."
 ev2.24.title:0 "Рыцарь-странник"
 ev2.24.desc:0 "Рыцарь-странник пожаловал в твою башню и вызывает тебя на поединок. \n 'Подходи и сражайся со мной, маг! Твоя распущенность должна закончиться!"
 ev2.24.a:0 "Я принимаю твой вызов. Давай сражаться!"
 ev2.24.b:0 "Я сдаюсь, но я хочу суда."
 ev2.24.c:0 "Может, я просто сожгу тебя своей силой?"
 imprison_and_trial_ct:0 "Ты был заключён в штаб охотника на ведьм, и суд скоро начнётся."
 ev2.24.d:0 "Я не маг, но я знаю одного."
 sent_wh_2_rival_ct:0 "Рыцарь-долгожитель будет отправлен к твоему врагу, [potential_target2.GetTitledFirstName]"
 cursed_land_modifier:0 "Проклятая земля"
 ev2.25.title:0 "Слухи о... Маге?"
 ev2.25.desc:0 "Ты в последнее время слышал странные слухи о [mmage.GetTitledFirstName]. allegedly этот человек практикует продвинутую магию."
 ev2.25.a:0 "Что это вообще значит?"
 ev2.25.b:0 "Похоже, [mmage.GetSheHe] знает больше, чем я. На данный момент."
 ev2.26.title:0 "Ребёнок?"
 ev2.26.desc:0 "В кругу призывателя материализовался... ребёнок. Мальчик выглядит обычным, это нормальный, здоровый ребёнок."
 ev2.26.a:0 "Я вырасту этого ребёнка как своего собственного."
 ev2.26.b:0 "Я его сохраню."
 ev2.26.b_ct:0 "Ты держишь ребёнка во дворе."
 ev2.26.c:0 "Я отправлю его обратно."
 ev2.26.c_ct:0 "Ты вернёшь ребёнка в другое измерение."
 not_empty_demon_name:0 "Абаддон"
 ev2.27.title:0 "Ребёнку нужно имя"
 ev2.27.desc:0 "Мне следует сначала выбрать имя."
 ev2.27.a:0 "Добро пожаловать в наш мир."
 ev2.28.title:0 "Большой, странный мир"
 ev2.28.desc:0 "Эта прекрасная дама, можно я её потрогаю?"
 ev2.28.a:0 "Мамочка?"
 ev2.29.title:0 "Самоубийство?"
 ev2.29.desc:0 "Странное дело: няня [demon_child.GetTitledFirstName], [nanny.GetTitledFirstName], покончила с собой прошлой ночью. Она сбросилась с самой высокой башни. Перед этим она ужасно кричала."
 ev2.29.a:0 "Хм..."
 ev2.310.a:0 "Здесь происходит что-то странное"
 ev2.30.title:0 "Сильные чувства"
 ev2.30.desc:0 "[potential_vict.GetTitledFirstName] часто опекает меня. Я чувствую..."
 ev2.30.a:0 "Ярость..."
 ev2.30.b:0 "Отвращение."
 ev2.30.c:0 "Ничего."
 ev2.31.title:0 "Голоса в моей голове"
 ev2.31.desc:0 "Я слышу шепоты у себя в голове. Они говорят мне полезные вещи, но иногда тоже имеют требования. Сегодня они хотят почувствовать кровь."
 ev2.31.a:0 "Просто скажи мне, что мне делать."
 ev2.32.title:0 "Смерть при дворе"
 ev2.32.desc:0 "Похоже, один из твоих придворных, [potential_vict.GetTitledFirstName], упал с лестницы и сломал шею."
 ev2.32.a:0 "Несчастные случаи происходят постоянно..."
 ev2.33.desc:0 "Они снова хотят, чтобы я кого-то убил. Это легко; мой взгляд, моё прикосновение, одна мысль могут вызвать смерть. Но я чувствую внутреннее сопротивление..."
 ev2.33.a:0 "Я сделаю, как ты говоришь."
 ev2.33.b:0 "Тишина! Я решаю, кто будет убит."
 ev2.34.desc:0 "Один из твоих придворных, [potential_vict.GetTitledFirstName], споткнулся и упал из окна. По крайней мере, ты так думаешь, потому что свидетелей нет."
 ev2.34.a:0 "Еще один несчастный случай...?"
 ev2.35.title:0 "Ненавидимая персона"
 ev2.35.desc:0 "Есть один человек, которого я ненавижу больше всего. Я собираюсь использовать свои способности, чтобы покончить с жизнью [potential_vict.GetHerHis]."
 ev2.35.a:0 "Это хорошая практика."
 ev2.35.b:0 "Это лишь часть плана."
 ev2.35.c:0 "Это справедливость."
 ev2.35.d:0 "Это мне нужно."
 ev2.36.desc:0 "Сегодня утром слуги нашли тело одного из твоих придворных. Причина смерти: неизвестна."
 ev2.36.a:0 "У нас в последнее время много мертвых."
 ev2.36.b:0 "Я разберусь с этим."
 ev2.36.b1_ct:0 "Убийца найден"
 ev2.36.b2:0 "Расследование провалено"
 ev2.36.b2_ct:0 "Ты ничего не нашел"
 ev2.37.title:0 "Источник"
 ev2.37.desc:0 "Я чувствую, как что-то пробуждается во мне."
 ev2.37.a:0 "Следующий дар, следующая возможность."
 ev2.38.title:0 "Истина обо мне"
 ev2.38.desc:0 "Я ощущаю новую силу внутри себя. Теперь я знаю правду - я не нормален. Я не просто человек."
 ev2.38.a:0 "Начинается новая эпоха."
 ev2.39.title:0 "Найденный убийца?"
 ev2.39.desc:0 "Расследование показало, что [demon_child.GetTitledFirstName] видели со всеми жертвами незадолго до их смерти. У вас нет доказательств, лишь это тревожное совпадение."
 ev2.39.a:0 "Его будут наблюдать."
 ev2.39.b:0 "Подземелья — хорошее место для него."
 ev2.39.c:0 "Я организую казнь, тихо."
 ONLY_SPECIFIED_CHILD:0 "Целью должен быть ваш гость, придворный, подопечный или узник."
 ONLY_SPECIFIED_CHILD2:0 "Вы не можете съесть своих собственных детей (если только вы не садист)."
