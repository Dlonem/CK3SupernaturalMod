 ev2.57.title:0 "Ведьмак-король"
 ev2.57.desc:0 "Быть ведьмой само по себе сложно, но вы также правитель, который должен справляться с проблемами смертного характера. Иногда вам нужно пересмотреть свои приоритеты."
 ev2.57.a:0 "Я сосредоточусь на своей колдовстве."
 ev2.57.b:0 "Я сосредоточусь на своем королевстве."
 ev2.59.title:0 "Сотрудничество"
 ev2.59.desc:0 "Конструктивная дискуссия и обмен опытом ускорят прогресс ваших исследований. [wwitch.GetTitledFirstName] может быть подходящим человеком для сотрудничества."
 ev2.59.a:0 "[wwitch.GetTitledFirstName], у меня есть предложение для тебя."
 ev2.59.b:0 "Я справлюсь с этим сам."
