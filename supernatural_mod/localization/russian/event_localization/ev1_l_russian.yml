 ev1.1.desc:0 "Вернувшись в свою chamber, вы видите старый том, лежащий на столе. Он выглядит изношенным, и вы можете сказать, что тот, кто им владел до вас, добавил в него много страниц. Кто оставил его здесь?"
 ev1.1.a:0 "Странно..."
 ev97.1.title:0 "Таинственное кольцо"
 ev97.1.desc:0 "Вернувшись в свою chamber, вы видите старое золотое кольцо, лежащее на столе. Просто взглянув на него, вы чувствуете молодость, но также и то, что вы причинили бы вред любому, кто попытается его забрать. Кто оставил его здесь?"
 ev97.1.a:0 "Странно..."
 ev98.1.title:0 "Таинственный камень"
 ev98.1.desc:0 "Вернувшись в свою chamber, вы находите что-то похожее на случайный кусок камня. Этот загадочный предмет просто лежит на столе, и вы чувствуете, как от него исходит что-то странное. Кто-то должен был оставить это здесь."
 ev98.1.a:0 "Странно..."
  
