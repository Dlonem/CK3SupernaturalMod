 ev2.40.desc:0 "При дворе [sender.GetTitledFirstName] один ребенок исчез при загадочных обстоятельствах, без всяких следов."
 ev2.40.a:0 "Даже дети не в безопасности в наши дни."
 ev2.40.b:0 "След приводит к [actor.GetTitledFirstName]."
 create_potion_decision_ct:0 "Зелье будет создано."
