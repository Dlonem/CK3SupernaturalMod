 #Events
 ev2.1.title:0 "Специализация на ведьмах"
 ev2.1.desc:0 "Пора выбрать, на чём будут сосредоточены ваши исследования."
 ev2.1.a:0 "Искать истину."
 ev2.1.a_ct:0 "Даёт мало шансов узнать что-то о настоящем колдовстве в будущем"
 ev2.1.c:0 "Приготовление зелий и травология."
 ev2.1.c_ct:0 "Открывает решение создать зелье"
 ev2.1.d:0 "Нет конкретного изучения, я скорее хочу увидеть мир."
 ev2.1.e:0 "Может, я просто съем несколько детей?"
 ev2.1.e_ct:0 "Открывает взаимодействие 'Сожрать ребёнка'"
 ev2.1.f:0 "Я подумаю об этом позже."
 ev2.1.f_ct:0 "Вы сможете пересмотреть свой выбор через десять лет"
 ev3.0.title:0 "Плохие предчувствия"
 ev3.0.desc:0 "Сегодня я чувствую себя иначе. Как будто некоторая невидимая сила пытается повлиять на меня."
 ev3.0.a:0 "Я останусь спокойным, конечно, ничего плохого не может произойти."
 ev3.0.b:0 "Здесь пахнет магией. Лучше поищу свои амулеты."
 ev3.1.a:0 "Заклинание не сработало."
 ev3.2.a:0 "Меня прокляли!"
 ev3.2.a_repelled:0 "Заклинание провалилось!"
 ev3.2.a_cursed:0 "Цель была проклята!"
 ev4.0.title:0 "Магические чувства"
 ev4.0.desc:0 "Аура сегодня нестабильна. Магическая энергия пульсирует в каждом, я это чувствую."
 ev4.0.a:0 "Похоже, кто-то играет с магией."
 ev4.0.b:0 "Я могу использовать магическую триангуляцию, чтобы определить источник магии."
 ev4.0.b_ct:0 "В вашем районе вы найдете мага или ведьму."
 ev4.0.c:0 "Давайте отследим это."
 ev4.0.d:0 "Мне следует сказать своему сюзерену."
 ev4b.0.title:0 "Отслеживание магии"
 ev4b.0.desc:0 "Я выяснил, что [magic_user.GetTitledFirstName] — это ведьма, или даже маг!"
 ev4b.0.a:0 "Мне нужно быть осторожным."
 ev4b.0.b:0 "Я должен убить её."
 ev4b.0.c:0 "Мне следует сказать своему сюзерену."
 ev7.0.title:0 "Ритуал Силы"
 ev7.0.desc:0 "Подготовка завершена. Правила просты: Сила в обмен на человеческую жизнь. В видении я увидел подходящее жертвоприношение..."
 ev7.0.a:0 "Это жертвоприношение, на которое я готов пойти."
 ev7.0.b:0 "Цена слишком высока."
 ev7.0.c:0 "Ты мне больше не нужен."
 ev8.0.desc:0 "Подготовка завершена. Теперь я могу получить силу в обмен на..."
 ev8.0.a:0 "Мое здоровье."
 ev8.0.b:0 "Мой разум."
 ev8.0.c:0 "Моя душа."
 ev8.cost_magic:0 "Ваша жертва."
 ev5.0.title:0 "Ритуал жизни."
 ev5.0.desc:0 "Во время подготовки к ритуалу вы поняли, что нужно выбрать правильную жертву. После часов медитации и анализа созвездий на звездах вы чувствуете, что ответ становится ближе. Есть только один человек, который подходит."
 ev5.0.a:0 "Я возьму только немного..."
 ev5.0.b:0 "Цена слишком высока."
 ev9.0.title:0 "Магическая триангуляция"
 ev9.0.desc:0 "Магическая триангуляция была успешно завершена. Скanning показал, что [potential_magician.GetTitledFirstName] окружен магической аурой. У них может быть даже магический артефакт..."
 ev9.0.a:0 "Я должен следить за [potential_magician.GetHerHim]."
 ev9.0.b:0 "Я заберу этот артефакт!"
 ev9.0.c:0 "[potential_magician.GetSheHe|U] представляет угрозу."
 ev9.0.d:0 "Я должен встретиться с [potential_magician.GetHerHim]."
 ev10.0.title:0 "Могущественное проклятие."
 ev10.0.desc:0 "Вы готовите мощное заклинание против [reci.GetTitledFirstName]. Время выбрать, какое проклятие..."
 ev10.0.a:0 "[reci.GetSheHe|U] должно умереть."
 ev10.0.b:0 "Пусть [reci.GetHerHim] страдает."
 ev10.0.c:0 "Я сломаю [reci.GetHerHim]."
 ev10.0.d:0 "У [reci.GetSheHe|U] не будет детей."
 ev10.0.e:0 "Не беда."
 ev11.0.title:0 "Возвращение магии"
 ev11.0.desc:0 "Я чувствую прилив энергии, я чувствую... силу."
 ev11.0.a:0 "Хорошо быть мной."
 ev12.0.title:0 "Подготовка к призыву"
 ev12.0.desc:0 "Вы собрали необходимые компоненты, нарисовали защитные руны и подготовили полезные заклинания на случай необходимости, но все еще существует огромный риск. Призыв демона — это вызов, но вы также должны их поймать. Многое может пойти не так..."
 ev12.0.a:0 "Давайте начнем."
 ev12.0.b:0 "Может быть, это не самая хорошая идея после всего."
 ev12.1.a:0 "Демон был призван..."
 ev12.1.a_ct:0 "Вы можете столкнуться с демоном"
 ev12.2.a:0 "Призыв провален"
 ev12.3.a:0 "Призыв удался, но демон сбежал!"
 ev12.3.a_ct:0 "Демон на свободе"
 ev12.4.a:0 "Призыв удался, но вы не смогли удержать демона, и он разорвал вас на части"
 ev13.0.title:0 "Бешеный демон"
 ev13.0.desc:0 "Демон был призван, вы видите фигуру, окруженную огнями и вращающимися тенями. К сожалению, это существо явно не заинтересовано в разговоре. Оно атакует защитные руны, вызывая зловещие всплески искр. Если круг будет нарушен, вы безусловно умрете."
 ev13.0.a:0 "Руны должны пережить..."
 ev13.1.a:0 "Руны выдержали"
 ev13.1.a_ct:0 "Ритуал продолжается"
 ev13.2.a:0 "Демон разорвал круг и растерзал вас"
 ev13.0.b:0 "Я думаю, знаю заклинание, которое может помочь..."
 ev13.1.b:0 "Был укрощен"
 ev13.0.c:0 "Я немедленно отправлю его обратно!"
 ev13.0.c_ct:0 "Ритуал завершен"
 ev15.0.title:0 "Демон"
 ev15.0.desc:0 "Демон вошел в ближайшего придворного и смотрит на вас. 'Скажи, чего ты хочешь, ведьма' - сказал В0@ - 'У меня нет времени для тебя.'"
 ev15.0.a:0 "Я хочу Власти!"
 ev15.0.b:0 "Я хочу Богатства!"
 ev15.0.c:0 "Я ничего не хочу. Тебе пора исчезнуть."
 ev15.0.d:0 "Давай дружить! Я освобождаю тебя!"
 ev15.1.d:0 "Демон становится твоим другом."
 ev15.2.d:0 "Демон убивает тебя."
 ev16.0.title:0 "Путь к Власти"
 ev16.0.desc:0 "Власть... ты всегда хочешь власти. Но что это значит для тебя, человек? Я могу дать тебе тайные знания... или призвать армию мертвецов по твоему велению."
 ev16.0.a:0 "Научи меня чему-то полезному."
 ev16.0.a_ct:0 "Ты также можешь получить случайную очко перка"
 ev16.0.b:0 "Мертвецы звучат неплохо."
 ev17.0.title:0 "Путь к богатству"
 ev17.0.desc:0 "Золото, конечно. Я могу создать немного, если хочешь. Или я отдам тебе драгоценный предмет..."
 ev17.0.a:0 "Я возьму монеты."
 ev17.0.b:0 "Новый артефакт может оказаться полезным."
 ev17.0.b_ct:0 "Вы получаете новый артефакт"
 ev17.0.c:0 "Почему бы не оба?"
 ev18.0.title:0 "Прощай, Существо"
 ev18.0.desc:0 "Свет гаснет, и демон исчезает. Ты все еще жив..."
 ev18.0.a:0 "Какое облегчение..."
 ev20.0.desc:0 "'Ты стоишь перед лордом ада, Белиа' - сказал демон - 'Я один из четырех лордов ада. Говори, смертный.'"
 ev20.0.a:0 "Сам Белий... Прошу прощения за беспокойство. Я ищу мудрость и силу."
 ev20.0.b:0 "Ты должен выполнить мое желание, жалкий демон."
 ev20.0.c:0 "Э... неважно, исчезни!"
 ev21.0.desc:0 "Жалкий? Береги свои слова, смертный. Сегодня твои защитные руны отделяют нас, но ситуация может измениться в будущем. Она изменится, я тебя уверяю."
 ev21.0.a:0 "Я в это сомневаюсь, Демон. И сейчас у меня одно желание..."
 ev21.0.b:0 "Успокойся, я не хотел тебя обидеть."
 ev21.0.c:0 "Иди обратно в ад, ты черноглазая сука."
 ev22.0.desc:0 "Поскольку ты меня призвал, я должен дать тебе что-то. Непобедимая армия? Огромная сила? Уважение других правителей?"
 ev22.0.a:0 "Армия."
 ev22.0.a_ct:0 "Переговоры продолжатся."
 ev22.0.b:0 "Сила."
 ev22.0.c:0 "Уважение."
 ev23.0.desc:0 "Хм... да. Твоя армия будет непобедимой, если ты сделаешь меня своим генералом. Я могу служить тебе 10 лет в обмен на свободу. Ты освободишь меня в этом мире."
 ev23.0.a:0 "Сделка."
 ev23.0.b:0 "В этом мире? Ни за что. Просто сделай мою армию сильнее."
 ev23.0.c:0 "Не строй из себя дурака. Просто сделай мою армию сильнее и дай мне несколько способных рыцарей."
 ev24.0.desc:0 "'Скажи это, дурак.'"
 ev24.0.a:0 "Убей моего врага."
 ev24.0.b:0 "Дай мне знания."
 ev24.0.c:0 "Очисти мое тело."
 ev24.0.d:0 "Укрепи мое тело."
 ev24.0.d_ct:0 "Твоя положительная физическая черта будет укреплена."
 ev27.0.desc:0 "Прошло 10 лет с тех пор, как мы подписали контракт. Ты обещал мне свободу, но я устал от этого царства. Я возвращаюсь в ад, смертный."
 ev27.0.a:0 "Прощай, Демон."
 ev28.0.desc:0 "Прошло 10 лет с тех пор, как мы подписали контракт. Ты обещал мне свободу, так что я теперь свободен. Этот мир почувствует мой гнев, но ты первый в очереди. Ты можешь жить, если будешь служить мне. Встань на колени, смертный, или умри."
 ev28.0.a:0 "Конечно, я буду служить тебе, Владыка..."
 ev28.0.b:0 "Никакой Демон не будет мной командовать!"
