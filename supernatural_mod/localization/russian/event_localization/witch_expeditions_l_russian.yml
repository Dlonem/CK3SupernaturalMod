l_russian:
 ev11.80.desc:0 "Вы чувствуете, что пересекли какую-то границу — заклинание маскировки в сочетании с различными защитными чарами, вероятно, охраняющими это место. Впрочем, чары никак на вас не отреагировали, так что, похоже, вас не считают нарушителем. Вдали виднеется необычный пейзаж и силуэт монументального замка. Должно быть, это академия, которую вы искали."
 ev11.80.0.a:0 "Дальше я пойду в одиночку."
 almanach_name:0 "Альманах"
 ev11.81.desc:0 "Казалось, до академии ещё далеко, однако вскоре вы подошли к воротам, которые сами отворились перед вами. Внутри, в вестибюле, ждала фигура — она открыла глаза при вашем приближении.\n«Добро пожаловать, [ROOT.Char.Custom('GetProperWitchDesc')]», — фигура чопорно поклонилась, её голос показался совершенно лишённым эмоций. — «Я — Альманах, смотритель этого места»."
 ev11.81.desc2:0 "Рад познакомиться."
 ev11.81.desc2a:0 "'$ev11.81.desc2$'"
 ev11.81.desc2b:0 "«Хм, архимаг личной персоной — я слышал о вас. $ev11.81.desc2$»"
 ev11.81.desc2c:0 "«[ROOT.Char.GetTitledFirstNameNoTooltip], член Высокого совета магов? Я слышал о вас. $ev11.81.desc2$»"
 ev11.81.desc3:0 "«Раньше это была академия, хотя мы по-прежнему называем её так. Ныне это скорее библиотека и архив — место, где маг может искать ответы на свои вопросы или развивать навыки, хотя большей частью самостоятельно. Мы давненько не обучали адептов, хотя некоторые маги всё же приходят со своими учениками, чтобы воспользоваться... местными условиями и научными ресурсами. Но по правде говоря, это место большей частью заброшено, и посетители у нас бывают редко»."
 ev11.81.desc4:0 "«Я ни на кого не работаю. Я здесь потому, что мои создатели наделили меня этим предназначением. Да, в это трудно поверить, но я не человек. Я — конструкт, которому поручено поддерживать порядок в этом месте. Можно сказать, я ничего не получаю от этого, кроме чувства удовлетворения — но мне этого более чем достаточно»."
 ev11.81.desc5:0 "«Когда-то существовала развитая цивилизация, чьё развитие строилось на магии. Место, где мы стоим, было её важным форпостом и даже сумело пережить её падение. Позже были попытки превратить его в школу магов — стремление сохранить знания, которые иначе были бы утрачены. И по правде говоря, большая их часть действительно была потеряна. Со временем те немногие маги, что следили за Академией, ополчились друг на друга. Теперь комплекс больше не используется, хотя многие древние знания всё ещё можно здесь найти»."
 ev11.81.desc6:0 "«Мои сведения неполны, но, судя по всему, кто-то призвал могущественного демона, который разрушил Эрум, столицу Великой Магократии. Тогда же были утрачены многие чудеса магической инженерии той эпохи, и большинство тогдашних магов погибло. Как я уже сказал, мне неизвестны все подробности тех событий, хотя я слышал немало домыслов. С некоторыми из них вы можете ознакомиться в наших библиотеках»."
 ev11.81.0.a:0 "Так это и есть Академия магии?"
 ev11.81.0.b:0 "Кстати, на кого ты работаешь?"
 ev11.81.0.c:0 "Я осмотрюсь вокруг."
 ev11.81.0.d:0 "Кто построил это место?"
 ev11.81.0.e:0 "Почему пала та цивилизация?"
 ev11.82.desc:0 "«Разумеется, наши собрания в вашем распоряжении. У нас нет формальных правил или устава, но я должен предупредить вас: любая попытка повредить предметы, украсть их или применить насилие в любой форме активирует защитные чары этого места. Кроме того, ради вашей собственной безопасности я не советую пытаться взламывать двери, которые заперты, защищены рунами, невидимы, замурованы или опечатаны иным образом. Многие секции закрыты, так как могут содержать всё ещё активные нестабильные заклинания или незавершённые эксперименты. Полагаю, это всё. Хорошего дня».\nКонструкт закрыл глаза — судя по всему, разговор был окончен."
 ev11.82.0.a:0 "Что ж, я буду осторожен[ROOT.Char.GetEnding('а')]."
 ev11.83.desc:0 "Блуждая по коридорам замка, вы быстро теряете дорогу. Комплекс огромен и полон странных экспонатов, которые могут быть как произведениями искусства, так и разновидностями приборов, хотя большинство из них не магические. И всё же магия ощущается повсюду — и как аура древних заклятий, и как сырая сила, которой здесь, похоже, в избытке. Время от времени до вас доносятся различные звуки и тихий шум; пару раз вам готово было показаться, что вы слышите эхо далёких шагов. Возможно, вы здесь не единственный маг."
 ev11.83.0.a:0 "Возможно, мне стоит пойти на эти звуки."
 ev11.84.title:0 "История Земли"
 ev11.84.desc:0 "Наконец вы нашли комнату, привлекшую ваше внимание. Это была ещё не сама библиотека, но здесь хранилось множество свитков, в основном карт. Некоторые из них бросились в глаза: вы без труда узнали знакомые очертания Евразии и Африки — последняя оказалась крупнее, чем вы ожидали. Но это было не всё: за океаном простирались другие огромные континенты, а также несколько крупных островов. С растущим азарт вы начали разбирать карты, раскладывая их — как вам казалось — в хронологическом порядке. Чем ниже номер карты, тем сильнее она отличалась от привычной вам. Неужели на этих картах изображены иные миры? Альтернативные реальности? Или сам лик Земли так кардинально менялся сквозь века?"
 ev11.84.0.a:0 "Увлекательно!"
 ev11.85.desc:0 "Вы нашли комнату, которая сразу привлекла внимание. Это лаборатория, давно не использовавшаяся, но всё ещё полная алхимических веществ — включая Эфир! Вы могли бы взять немного себе... если защитные чары этого места не испепелят вас за попытку кражи."
 ev11.85.0.a:0 "Я возьму совсем немного, никто и не заметит."
 ev11.85.0.b:0 "Нет, но я осмотрю это место."
 ev11.86.desc:0 "Вы нашли помещение с табличкой «Мастерская», заполненное хаотичными записями и фолиантами. На одном из них красуется заглавие: «Заклинания на каждый день». С любопытством листая его, вы убедились, что автор действительно собрал уйму заклятий — правда, большинство выглядит бесполезными или абсурдными. Среди них вы обнаружили одно под названием: «Откроет любую банку!». Поскольку в комнате как раз оказался опечатанный сосуд, вы решили опробовать чары."
 ev11.86.0.a:0 "Ладно, поехали!"
 ev11.87.desc:0 "Сначала вам показалось, что заклинание не сработало, но мгновение спустя перед вами материализовалась двухметровая тварь. Зловоние ударило в нос, за ним последовал грозный рык, заставивший вас отскочить. Тварь схватила банку одной из лап, одним рывком открыла её — и сгинула так же быстро, как появилась."
 ev11.87.0.a:0 "Это... может... весьма пригодиться."
 ev11.87.0.b:0 "Ни одна банка не устоит перед моей силой!"
 ev11.88.title:0 "Великая библиотека"
 ev11.88.desc:0 "Вам наконец удалось отыскать настоящую библиотеку. Количество книг поражает, но истинным шоком стало то, что это лишь один из множества библиотечных коридоров! В его дальнем конце находится развилка, ведущая к новым залам, хранилищам, архивам и скрипториям. Правда, большинство книг вам не прочесть — они написаны на забытых языках. И всё же многие из них вы способны узнать и понять."
 ev11.88.0.a:0 "Это же Пнакотические рукописи!"
 ev11.88.0.b:0 "Я всегда хотел[ROOT.Char.GetEnding('а')] прочесть «Откровения Глааки»."
 ev11.88.0.c:0 "«Книги Хсана»? Пора за чтение."
 ev11.88.0.d:0 "«Ars Notoria» и «Книга Еноха»! С чего же начать?"
 ev11.89.desc:0 "Вы провели долгие часы за книгами, усталость дает о себе знать, но азарт не угас. И всё же нужно сосредоточиться и искать то, что вам действительно необходимо."
 ev11.89.0.a:0 "Мне пригодилось бы что-нибудь по теории магии."
 ev11.89.0.b:0 "Мне нужно больше материалов по демонологии."
 ev11.89.0.c:0 "Пожалуй, выберу алхимический трактат."
 ev11.89.0.d:0 "Где-то здесь я видел[ROOT.Char.GetEnding('а')] книгу по боевой магии..."
 ev11.90.desc:0 "Вы провели в библиотеке всю ночь и часть следующего дня — даже пришлось прибегнуть к бодрящим заклинаниям, чтобы не заснуть. В конце концов вы решили, что собрали то, за чем пришли. Опытный учёный легко провёл бы здесь полжизни, но вы полагаете, что узнали достаточно, чтобы применить полученные знания на практике."
 mr_visited_academy_modifier:0 "Визит в место «$building_mage_house$»"
 mr_visited_academy_modifier_log_title:0 "$mr_visited_academy_modifier$"
 ev11.92.desc:0 "Финальный отрезок пути пришлось проделать в одиночку — это место излучает настолько тревожную ауру, что ваши спутники предпочли остаться на безопасном расстоянии. От местных вы узнали, что храм заброшен, хотя несколько раз в год изнутри доносятся странные звуки — песнопения или молитвы, а поблизости изредка видят подозрительного жреца или паломника. Что ж, сегодня этот паломник — вы. Если это место силы таит секрет, именно вы должны его раскрыть."
 ev11.92.0.a:0 "Я осмотрюсь."
 ev11.93.desc:0 "Интерьер выглядит величественно, хотя и немного жутковато. Он не похож ни на один храм, что вы видели — возможно, из-за тишины, чувства изоляции... или ауры могущества. Кажется, барельефы на стенах следят за вами взглядом — каждый изображает одну из трёх фигур: воина, отца и мудреца. Это три аспекта Рогатого Бога. Замысловатые надписи вокруг изображений выглядят интригующе, как и украшенные двери, ведущие в основную часть храма."
 ev11.93.0.a:0 "Я попробую перевести эти надписи."
 ev11.93.1.a_ct:0 "Вам удалось расшифровать надписи."
 ev11.93.2.a_ct:0 "Вам не удалось расшифровать надписи."
 ev11.93.0.b:0 "Я получше осмотрю эти двери."
 ev11.94.desc:0 "Вам удалось разобрать несколько слов. В них говорится о трёх испытаниях: Испытании Разума, Испытании Мужества и Испытании Уз. В последнем вы не совсем уверены, так как в алхимическом контексте «узы» могут пониматься как синтез или синергия. Интересно — не намеренна ли эта двусмысленность? Похоже, эти испытания связаны с неким ритуалом посвящения, но ничего более конкретного выяснить не удаётся."
 ev11.94.0.a:0 "Интересно. Теперь я проверю дверь."
 ev11.95.desc:0 "После нескольких попыток вникнуть в текст вы приходите к выводу, что не можете извлечь из него ничего внятного. Возможно, это молитва? Описание аспектов Рогатого Бога? Или предупреждение? Понятия не имеете."
 ev11.95.0.a:0 "Надеюсь, с дверью повезёт больше."
 ev11.96.title:0 "Первое испытание"
 ev11.96.desc:0 "Двери заперты, но на них есть текст, который вы можете прочесть — это один и тот же отрывок, повторенный на разных языках.\n\n"
 ev11.96.desc2:0 "#italic У меня нет рта, но мой голод бесконечен.\nУ меня нет ног, но я грациозно танцую.\nВо мне нет жизни, но я могу расти.\nУ меня нет формы, но меня узнают мгновенно.\nСкажи мне: что я такое?#!"
 ev11.96.0.a:0 "Ты — пустота."
 ev11.96.0.b:0 "Хм, чума."
 ev11.96.0.c:0 "Огонь? Ты — огонь."
 ev11.96.0.d:0 "Мой ответ: буря."
 ev11.96.0.e:0 "Ты — танцующий нищий калека?"
 ev11.97.desc:0 "На миг ничего не произошло, а затем с тихим шипением из пола выскочил шип, пробивший вашу стопу насквозь. Стоило вам стоять строго по центру, а не чуть в стороне, вас нанизало бы как свинью на вертел — хотя боль всё равно невыносимая. Шип убирается обратно, но вас не покидает чувство, что врата закрылись для вас навсегда."
 ev11.97.0.a:0 "Моя... моя нога..."
 ev11.97.0.a_ct:0 "#N Экспедиция окончена.#!"
 ev11.97.0.b:0 "Я взорву эти двери магией!"
 ev11.98.desc:0 "Хотя вы и не нашли знаний или силы, на которые надеялись, экспедиция не была совсем уж пустой тратой времени. По крайней мере, вы усвоили, что некоторые места опасны даже для могущественного мага."
 ev11.98.0.a:0 "Я никогда сюда не вернусь."
 mr_visited_horned_temple1_modifier:0 "Визит в место «$building_horned_god_house$»"
 mr_visited_horned_temple2_modifier:0 "$mr_visited_horned_temple1_modifier$"
 mr_visited_horned_temple_modifier_log_title:0 "$mr_visited_horned_temple1_modifier$"
 ev11.99.desc:0 "Ваше заклинание ударило в врата с огромной силой, но отскочило и полетело прямо в вас! В последний момент вы успели поднять магический щит, сблокировав часть энергии, но сила заклинания всё равно сбила вас с ног."
 ev11.99.0.a:0 "Глупые загадки! Глупые двери!"
 ev11.100.desc:0 "На миг ничего не произошло, а затем двери со скрежетом стали медленно отворяться, открывая путь дальше. За ними оказался коридор и две боковые комнаты, но ни в одной вы не нашли ничего интересного. Нужно идти дальше."
 ev11.100.0.a:0 "Я чувствую что-то в этом коридоре."
 ev11.101.title:0 "Второе испытание"
 ev11.101.desc:0 "В коридоре появился рыцарь. Фигура не откликнулась на ваши слова, но едва вы сделали шаг вперёд, он обнажил меч и пошёл на вас. По его движениям видно, что это опытный и смертоносный воин. В его шагах есть нечто нечеловеческое и неумолимое — вам кажется, будто сама смерть пришла за вами."
 ev11.101.0.a:0 "Что ж, скрестим клинки!"
 ev11.101.0.a_ct:0 "Вы побеждаете рыцаря."
 ev11.101.0.b:0 "Нет, лучше мне бежать!"
 ev11.103.desc:0 "В это трудно поверить, но воин парировал ваше заклинание своим мечом! Вы не совсем уверены, но похоже, ваша попытка магической атаки только разозлила его. Вы чувствуете холод приближающейся смерти."
 ev11.103.0.a:0 "Хм, пора бежать!"
 ev11.104.desc:0 "Едва ваши клинки готовились скреститься, рыцарь растворился в клубах дыма и исчез без следа. Инерция вашего удара едва не сбила вас с ног, когда лезвие не встретило сопротивления, но вы ощутили волну облегчения — и понимание. Очевидно, испытание заключалось не в победе, а в принятии самого вызова. Испытание мужества! Путь дальше свободен."
 ev11.104.0.a:0 "Интересно, что ещё ждёт меня здесь."
 ev11.106.title:0 "Финальное испытание"
 ev11.106.desc:0 "Дальше вы нашли нечто похожее на алтарь, но он оказался искусно скрытым проходом вглубь. За алтарём находился пустой зал — точнее, в нём стоял лишь пьедестал с чашей и двумя урнами с жидкостями: зелёной и красной. Дальше пути нет. Неужели это конец путешествия? Финальное испытание?"
 ev11.106.0.a:0 "Я получше осмотрю всё это."
 ev11.107.desc:0 "Вы склоняетесь над зелёной жидкостью и тут же чувствуете, как её испарения раздражают горло. Сомнений нет — это яд или даже кислота. Проведя быстрый тест из имеющихся компонентов, вы подтверждаете догадку: вещество смертельно."
 ev11.107.0.a:0 "Это совершенно непригодно для питья."
 ev11.108.desc:0 "Из второй урны доносится сладковатый запах, а сама жидкость имеет глубокий красный цвет. Она немного похожа на кровь, но это не она — в ней виден слабый фосфоресцирующий свет."
 ev11.108.0.a:0 "Понятия не имею, что это такое."
 ev11.108.0.b:0 "Я знаю это! Это Алая Скверна, смертельный яд."
 ev11.109.desc:0 "Чаша выглядит как обычный кубок. Похоже, именно это от вас и требуется для прохождения испытания — сделать глоток. К сожалению, обе жидкости вызывают дурные предчувствия. Но стоит ли рисковать жизнью ради... чего-то, чего вы даже толком не понимаете?"
 ev11.109.0.a:0 "Я выпью зелёную жидкость."
 ev11.109.0.b:0 "Я выпью красную жидкость."
 ev11.109.0.c:0 "Э-э... Я выпью обе."
 ev11.109.0.d:0 "Нет, хватит. Я возвращаюсь домой."
 ev11.109.0.e:0 "Я наполню эту чашу водой из своего бурдюка!"
 ev11.109.0.a_ct:0 "Яд убивает вас."
 ev11.109.1.a_ct:0 "...или всё же нет?"
 ev11.109.2.a_ct:0 "Каким-то образом вы выжили."
 ev11.110.title:0 "Роковая ошибка"
 ev11.110.desc:0 "Вы делаете первый глоток, и поначалу ничего не происходит. Но вскоре накатывает тошнота, боль разносится по телу, и вы падаете на землю. Единственное ваше желание — чтобы эти муки скорее закончились."
 ev11.111.desc:0 "\nСпустя несколько мгновений, показавшихся вечностью, боль начинает утихать. Один яд нейтрализовал другой! Похоже, вы выживете, хотя слабы как ребёнок. Внезапно в вашем разуме раздаётся могучий голос: «ВСТАНЬ, ЧЕМПИОН!»"
 ev11.111.0.a:0 "Для меня это честь, мой лорд."
 ev11.111.0.b:0 "Я никому не служу, кем бы ты ни был."
 ev11.112.desc:0 "«ТЫ ПРОШЁЛ МОИ ИСПЫТАНИЯ, — прогремел голос подобно удару молнии. — ТЫ ДОКАЗАЛ СВОЮ ДОСТОЙНОСТЬ. Я БЛАГОСЛОВЛЯЮ ТЕБЯ, ЧЕМПИОН. ИДИ В МИР И ПРИНЕСИ СЛАВУ МОЕМУ ИМЕНИ».\nВы чувствуете прилив незнакомой энергии, а вместе с ней приходят знания — обрывки бесчисленных тайн, вплетённых в ткань вселенной."
 ev11.112.0.a:0 "Да будет так, мой лорд!"
 ev11.112.0.b:0 "Я заслуживаю большего!"
 ev11.113.desc:0 "Вы покидаете храм с чувством триумфа. Вы бросили вызов этому месту и выжили. Вы стали сильнее и мудрее."
 ev11.113.0.a:0 "Мои испытания окончены, но моя история ещё далека от завершения."
 ev11.114.desc:0 "Вы чувствуете странное ощущение, и внезапно волна боли разрывает вас — словно остатки токсина всё ещё таятся в теле. Вы сжимаете зубы, и мгновение спустя боль отступает.\n«ДА БУДЕТ ТАК, — грохочет голос с силой молнии. — ТЫ ВСЁ ЕЩЁ ДОСТОИН МОЕЙ НАГРАДЫ, МОЕГО БЛАГОСЛОВЕНИЯ».\n$ev11.114.desc2$"
 ev11.114.desc2:0 "Странная сила наполняет ваше тело, и в следующее мгновение вы обнаруживаете, что снова стоите перед вратами с загадкой, произнося слово «огонь». Однако на этот раз ничего не происходит. Вы теряетесь в догадках, было ли всё увиденное видением или сном... но сила, которую вы ощущаете внутри, несомненно реальна."
 ev11.114.0.a:0 "Я получил[ROOT.Char.GetEnding('а')] то, за чем пришёл[ROOT.Char.GetEnding('а')]."
 ev11.115.desc:0 "Вы наполнили чашу водой и выпили её до последней капли, затем со вздрогом поставили сосуд. Земля задрожала, и жидкость в обоих сосудах зловеще заколыхалась. Внезапно в вашем разуме прогремел голос: «ВПЕЧАТЛЯЮЩЕ. А ВЕДЬ ГОВОРИЛИ, ЧТО ВАШ РОД ДОВОЛЬНО СКУДОУМЕН».\nТряска постепенно утихла, и вы поняли: это было вовсе не землетрясение, а смех. Похоже, божество находит вас забавным.\n«ТВОЯ СМЕКАЛКА БУДЕТ НАГРАЖДЕНА, — прогремел голос с силой молнии. — ПРИМИ ЭТУ СИЛУ И ПЕРЕДЕЛАЙ МИР. Я БУДУ НАБЛЮДАТЬ»."
 ev11.115.0.a:0 "Уф..."
 horned_god_favor_modifier:0 "Милость Рогатого Бога"
 horned_god_favor_modifier_desc:0 "Рогатый Бог избрал вас своим любимым чемпионом, и Его воля будет вершиться вашими руками — даже когда вы сами этого не осознаёте."
 ev11.118.desc:0 "Вы внимательно осматриваете входные врата. Они опечатаны и выглядят нерушимыми. На их поверхности видны слабые следы надписей, но время размыло их слишком сильно. Жаль — это могло быть заклинание или инструкция по открытию. Похоже, большая часть храма недоступна и останется таковой навсегда.\nТем не менее, зал, в котором вы стоите, пропитан аурой могущества, а иероглифы под барельефами привлекают внимание. Это вполне подходящее место для отдыха, размышлений и медитации."
 ev11.118.0.a:0 "Я помолюсь."
 ev11.118.0.b:0 "Я погружусь в медитацию."
 ev11.118.0.c:0 "Я изучу иероглифы."
 ev11.119.desc:0 "Вы провели некоторое время в храме и обнаружили, что атмосфера этого места помогла привести мысли в порядок. Вы надеялись на большее, но время не прошло даром. Вы пришли к выводу, что скрытые силы здесь действительно есть, но они спят и не имеют власти ни над вами, ни над остальным миром."
 ev11.119.0.a:0 "Пора двигаться дальше."
 ev11.153.title:0 "Обитель Бабы-яги"
 ev11.153.desc:0 "Вы добрались до места, где, по слухам, находится легендарная избушка на курьих ножках. Земли здесь дикие, пустынные и неприветливые — похоже, большинство путников обходят их стороной. Местный проводник не потребовался: ауру могущества, окружающую это место, было легко ощутить. Продираясь сквозь заросли, вы внезапно увидели то, ради чего пришли."
 ev11.153.0.a:0 "Значит, легенды не врали."
 ev11.153.0.b:0 "Я думал[ROOT.Char.GetEnding('а')], всё будет... эффектнее."
 ev11.154.desc:0 "Создаётся впечатление, что чем ближе вы подходите, тем сильнее сгибается ножка избушки, огибая её к земле. Хороший знак — карабкаться по верёвке было бы затруднительно. Вблизи видно, что стены покрыты едва заметными рунами для защиты или даже нападения. Вы не можете разобрать их все, но само место излучает необычную ауру, словно не от мира сего. Внутри горит свет — неужели Баба-яга дома?"
 ev11.154.0.a:0 "Я просто постучу в дверь."
 ev11.155.desc:0 "«Открыто!» — слышится женский голос, и дверь плавно расхинивается. Сильный запах трав и готовящейся еды тут же бьёт в нос. В комнате суетится молодая женщина — и, надо признать, весьма привлекательная.\n«Вовремя вы, ужин почти готов», — говорит она, бросив на вас быстрый взгляд."
 ev11.155.0.a:0 "Говорят, Баба-яга может принимать облик красивой женщины."
 sefia_name:0 "Сефия"
 ev11.156.desc:0 "«Я тоже слышала этот слух, — загадочно улыбнулась женщина. — Если бы вы хотели создать заклинание для смены облика, какой магический механизм вы бы использовали?»"
 ev11.156.0.a:0 "Самый простой способ — сотворить иллюзию."
 ev11.156.0.b:0 "Я бы использовал[ROOT.Char.GetEnding('а')] полиморфизм."
 ev11.156.0.c:0 "Честно говоря, понятия не имею."
 ev11.157.desc1:0 "«Неплохо, но иллюзии нестабильны, и их легко раскусить», — задумалась женщина.\n"
 ev11.157.desc2:0 "«Ах да, полиморфизм. Это было бы практично, но подобные заклинания очень сложны, и если допустить ошибку, можно застрять в новом облике дольше желаемого», — задумалась женщина.\n"
 ev11.157.desc3:0 "«Да уж, будь всё так просто, каждый чародей менял бы внешность так же часто, как носки», — задумалась женщина.\n"
 ev11.157.desc:0 "«Если бы я хотела изменить облик, я бы попыталась повлиять на мысли тех, кто на меня смотрит. Исказить восприятие, чтобы они видели во мне другого человека. Но сейчас вы видите меня настоящую. Я не Баба-яга — она моя бабушка. Меня зовут Сефия»."
 ev11.158.desc:0 "«Рада познакомиться. Садитесь, я подаю ужин — приготовила по бабушкиному рецепту. Она называет его «Гензель и Гретель». Думаю, это какая-то шутка, но понятия не имею, что это значит. Бабушка иногда бывает такой странной...»\nМгновение спустя перед вами оказывается дымящееся блюдо, излучающее восхитительный аромат."
 ev11.158.0.a:0 "Выглядит аппетитно!"
 ev11.158.0.b:0 "Вообще-то... что это за мясо?"
 ev11.159.desc:0 "«Мастер высокой гастромантии никогда не раскрывает своих тайн — ну, разве что собственной внучке, — рассмеялась Сефия. — Но всё здесь приготовлено из того, что можно найти в этом лесу. Я в хороших отношениях с местными, они иногда приносят мне то да сё. Приятного аппетита!»"
 ev11.160.desc:0 "Еда великолепна, и весь ужин проходит в непринуждённой обстановке. Сефия расспрашивает вас о новостях из внешнего мира, а взамен делится местными слухами. Однако вы замечаете, что темы Бабы-яги она избегает — лишь упоминает, что старухи часто не бывает дома, и Сефия присматривает за избушкой. Когда вы начинаете задавать более подробные вопросы, Сефия объявляет, что устала. «Поговорим завтра. Вы переночуете в гостевой комнате — я провожу»."
 ev11.160.0.a:0 "Хмм, хорошо."
 ev11.161.desc:0 "Сефия пожелала вам доброй ночи и оставила в просторной спальне. Она выглядит довольно роскошно — странно даже, как такая комната помещается в избушке, которая снаружи казалась не такой уж большой. Местная магия явно искажает пространство. Магических ловушек вы не замечаете, хотя вся избушка излучает непостижимую силу. Кровать выглядит заманчиво, но рядом стоит витрина с небольшой коллекцией книг. Судя по названиям, за владение некоторыми из них вас могли бы сжечь на костре."
 ev11.161.0.a:0 "Нет, я хочу хорошенько выспаться."
 ev11.161.0.b:0 "Похоже, я проведу за этими книгами всю ночь."
 ev11.162.desc:0 "На следующий день сразу после завтрака Сефия повела вас прогуляться по окрестностям. На этот раз она была готова ответить на все вопросы.\n«Баба-яга когда-то вступила в весьма сложные отношения с одним божеством. Она верит, что оно наложило на неё некое проклятие, хотя в хорошие дни говорит о нём так, будто это благословение. Впрочем, я не уверена, проклятие ли это на самом деле или случайное следствие связи с богами»."
 ev11.162.0.a:0 "Что это за божество?"
 ev11.162.0.b:0 "В чём заключается это «проклятие»?"
 ev11.163.desc:0 "«Его зовут Цернунн, хотя последователи называют его Рогатым Богом. Он бог света и тьмы, дня и ночи, зверей и деревьев, хотя у него много и других аспектов. Местные ведьмы часто считают его своим покровителем, но и друиды относятся к нему с уважением. В отличие от моей бабушки, которая сплошь и рядом зовёт его ублюдком. Наверное, она знает, о чём говорит»."
 ev11.163.0.a:0 "А избушка? Откуда она взялась?"
 ev11.164.desc:0 "«Бабушка обладает огромной силой, хотя никогда не занималась волшебством в привычном смысле, хоть и знает некоторые продвинутые заклинания. Лес и избушка повинуются ей, а её желания просто сбываются. И она не умирает — она была древней старухой уже тогда, когда я родилась. Звучит вроде бы не так плохо, но печать Рогатого Бога имеет ментальную и эмоциональную сторону. Мою бабушку не назвать самым уравновешенным человеком на свете; она бывает жестокой, и мне кажется, в глубине души она очень страдает. Не знаю, из-за проклятия ли это или из-за воспоминаний. А может, на каком-то уровне это одно и то же»."
 ev11.165.desc:0 "«Видите ли, магия божества повлияла не только на бабушку, но и — пусть и в меньшей степени — на всю её семью, а также на само это место. Всё, что с ней произошло, либо началось, либо закончилось прямо на том месте, где сейчас стоит избушка. Вся округа пропиталась силой, вылепившей Бабу-ягу. Силой, превратившей её в существо, которое мы знаем»."
 ev11.165.0.a:0 "Избушка может передвигаться?"
 ev11.165.0.b:0 "Значит, проклятие влияет и на вас?"
 ev11.166.desc:0 "«Бабушка может перемещать избушку, но та всё равно всегда возвращается сюда. В каком-то смысле она привязана к этому месту»."
 ev11.167.desc:0 "«Да. Потомки Бабы-яги мужского пола обычно либо слабаки, либо жестокие неотёсанные мужики. А вот женщины одарены магией и долговечны. Правда, иногда у них тоже не всё в порядке с головой. Ещё говорят, будто все в моей семье прокляты, и после смерти их души скитаются по Земле вместо загробной жизни. Но, может, это лишь слухи...» — вам показалось, что Сефия взгрустнула, произнося это."
 ev11.168.desc:0 "Вечером ужин был столь же вкусен, но Сефия также угостила вас выпивкой из погреба Бабы-яги (да, оказалось, избушке не нужно касаться земли, чтобы иметь просторный подвал).\nМежду тем ваш разговор набрал обороты. Сефия — искусная чародейка, чьи познания поразительны для её возраста. Вы убеждены, что вам обоим есть чему поучиться друг у друга."
 ev11.168.0.a:0 "Что ты можешь рассказать мне о демонах?"
 ev11.168.0.b:0 "Давай поговорим об алхимии!"
 ev11.169.desc:0 "По мере того как опустошается всё больше бутылок вина, ваши беседы уходят в совсем уж абсурдные и абстрактные темы, но вы оба отлично проводите время. Похоже, алкоголь действует на вас куда сильнее, чем на Сефию — у этой женщины поистине железный организм!"
 ev11.170.desc:0 "На следующий день вы просыпаетесь в нерассчитанный час с раскалывающейся головой. По правде говоря, вы почти ничего не помните из вчерашнего вечера. Постойте... Сефия пыталась научить вас летать на метле? Это объяснило бы синяки. Но что было потом? Вас не покидает чувство, что Сефия рассказала вам что-то очень важное, но вы ни за что не можете припомнить, что именно."
 ev11.170.0.a:0 "Между нами что-то было?"
 ev11.171.desc:0 "Внезапно вы осознаёте, что в дверях спальни стоит сама Баба-яга, метающая в вас молнии взглядом.\n«Уверена, у тебя есть отличная причина спать в моей постели, не так ли?» — произнесла она ледяным голосом."
 ev11.171.0.a:0 "Сефия сказала мне, что это гостевая комната!"
 ev11.172.desc:0 "Вы осознали ошибку в тот же миг, как вырвались слова. Эта спальня похожа, но это не та, что показывала Сефия. Очевидно, прошлый ночью вы не добрались до нужной двери. Не успели вы заикнуться с извинениями, как одно из заклятий Бабы-яги вышвыривает вас прямо в окно. Чудо, что ничего не сломано, хотя приземление вышло болезненным. Сзади доносится её крик: «Держись подальше от моей внучки, пропойца!»"
 ev11.172.0.a:0 "Не думаю, что я вернусь за своими штанами..."
 ev11.172.0.b:0 "Пожалуй, лучше мне убраться отсюда."
 ev11.173.desc:0 "Уходя от избушки, вы не можете избавиться от ощущения, что нечто внутри вас изменилось. Словно капля местной силы просочилась в ваше тело. Вряд ли это что-то плохое... по крайней мере, вы на это надеетесь."
 ev11.173.0.a:0 "Пребывание здесь стало любопытным опытом."
 mr_visited_yaga_hut_modifier:0 "Визит в место «$building_witch_house$»"
 mr_visited_yaga_hut_modifier_log_title:0 "$mr_visited_yaga_hut_modifier$"
 ev11.174.desc:0 "Когда вы приближаетесь к избушке, та, кажется, медленно поворачивается к вам передом. Вы чувствуете странную магию, недоступную вашему пониманию. Сомнений нет — место то. На стенах виднеются почти невидимые защитные и боевые руны. Вас не покидает чувство, что попытка взлома может закончится плачевно."
 ev11.174.0.a:0 "Я осмотрю это место."
 ev11.174.0.b:0 "Я найду способ проникнуть внутрь."
 ev11.175.desc:0 "Вы сотворили несколько диагностических заклинаний, получив ответы. Сила, циркулирующая в воздухе, исходит не от избушки, а от самой земли. Что-то произошло здесь давным-давно... Так что избушка стоит здесь из-за силы, а не наоборот. Баба-яга явно не случайно выбрала этот уголок. Вы также установили, что вы единственный чародей в округе. Но почему тогда внутри горит свет? Возможно, магическое освещение просто включено всегда, а может, дело в чём-то ином."
 ev11.176.desc:0 "Вся округа пропитана магией, но чем дальше от избушки, тем она слабее. Эта сила исходит не от волшебников, но и естественной её не назвать. Возможно, это происки демона или божества? Тем не менее вы замечаете несколько других магических следов, один из которых точно принадлежит Бабе-яге. Старая ведьма наложила здесь свои чары, хотя ни одно не выглядит свежим."
 ev11.176.0.a:0 "Хмм, я пойду по этому следу."
 ev11.177.desc:0 "В окрестностях вы нашли пещеру, которую Баба-яга явно посещала регулярно для колдовства. Засветив подготовленный костёр, вы решаете осмотреть место. Здесь стоят честы с алхимическими материалами, но есть и бытовые вещи — похоже на подношения местных, пытавшихся снискать расположение ведьмы. Также здесь начертан круг призыва демонов, более сложный и прочный, чем всё, что вы видели. Возможно, Баба-яга не хочет призывать демонов в месте силы... или просто не желает видеть их в своём доме?"
 ev11.177.0.a:0 "Я изучу устройство этого круга."
 ev11.177.0.b:0 "Эти алхимические вещества могут пригодиться."
 ev11.177.0.b_ct:0 "Баба-яга может разозлиться, если узнает, что вы украли у неё."
 ev11.178.desc:0 "Осмотрев пещеру, вы решаете вернуться к избушке. Чем дольше вы находитесь здесь, тем лучше понимаете местную магию — вернее, она будто проникает в вас, словно нечто изучает вас или пытается выйти на связь. Неужели у избушки есть собственный разум? Внезапно попытка войти внутрь уже не кажется хорошей идеей. Вы чувствуете, что даже короткое пребывание тут изменило вас; остается надеяться, что к лучшему."
 ev11.178.0.a:0 "Я убираюсь отсюда."
 ev11.179.desc:0 "Магическая защита избушки выглядит прочной, но должен быть способ ее пробить. На ум приходит пара заклинаний, способных сокрушить подобную ограду. Но если что-то пойдёт не так, последствия трудно предсказать."
 ev11.179.0.a:0 "Я попробую отключить магическую защиту."
 ev11.179.0.a_ct:0 "Избушка отворяется перед вами."
 ev11.179.1.a_ct:0 "Избушка остаётся недоступной."
 ev11.180.desc:0 "Несмотря на несколько попыток, пробить магическую защиту не удалось. Она оказалась куда сложнее, чем вы ожидали — обычный чародей не смог бы сотворить ничего подобного. Защитные чары буквально нечеловеческие. Похоже, избушка на курьих ножках остаётся для вас недосягаемой."
 ev11.181.desc:0 "Вам удалось войти в главный зал, который выглядит так, словно подготовлен к приёму гостей. Всё помещение заполнено лёгким травяным ароматом с едва заметной затхлостью. Похоже, здесь давно никого не было. Вы быстро понимаете, что изнутри избушка куда больше, чем казалась снаружи. Здесь полно комнат и укромных уголков, достойных изучения."
 ev11.182.desc:0 "Вы нашли множество загадочных эликсиров, магических инструментов, книг с запретными тайнами и прочих предметов — хотя на первый взгляд трудно определить, какие из них представляют реальную ценность. Но главное: чем дольше вы здесь находитесь, тем чётче чувствуете, что кто-то или что-то пытается связаться с вами. Эта избушка... вы ощущаете, что она в какой-то мере разумна, и ей, похоже, что-то от вас нужно. Или... ей нужны вы."
 ev11.182.0.a:0 "Думаю, я мог[ROOT.Char.GetEnding('а')] бы здесь жить."
 mr_became_yaga_log_title:0 "Вы стали новой Ягой."
 ev11.182.0.b:0 "Я захвачу пару книг и уберусь отсюда."
 MR_EXPED_MUST_BE_COMPLETED:0 "Сначала необходимо завершить соответствующую экспедицию."
 witchcraft_legacy_3_expedition_ct:0 "Открывает все цели экспедиций для всей династии."
 unlocks_new_expedition_destination_txt:0 "#P Вы открыли новую цель для экспедиций!#!"
 MAGIC_EXPEDITION_DEST_REQUIRED:0 "Вы не знаете мест, достойных изучения."