l_russian:

 ############################################################
 # Supernatural 2.41 -- flavour (WORK-ORDER-2.41 §7)
 ############################################################

 # ==========================================================
 # The wolf with demon blood (§6, §7.1)
 # ==========================================================
 spn_two_natures.lean_wolf_tt:0 "Волк в [spn_tn_child.GetFirstName] становится сильнее."
 spn_two_natures.lean_demon_tt:0 "Демон в [spn_tn_child.GetFirstName] становится сильнее."

 spn_two_natures.0001.t:0 "Укушенная рука"
 spn_two_natures.0001.desc_child:0 "Тот мальчишка толкнул тебя, и ты его укусил. Не сильно. Достаточно сильно. Была кровь, и тебе понравился её вкус, а потом тебе стало стыдно, что понравился.\n\nТеперь все на тебя смотрят."
 spn_two_natures.0001.desc_parent:0 "Сегодня [spn_tn_child.GetFirstName] укусил другого ребёнка. Не сильно, говорят, но была кровь, и потом [spn_tn_child.GetSheHe] не плакал. [spn_tn_child.GetSheHe|U] улыбался.\n\nТы знаешь, что в [spn_tn_child.GetHerHim]. И то и другое."
 spn_two_natures.0001.a_child:0 "Я сказал, что мне жаль"
 spn_two_natures.0001.b_child:0 "Он это заслужил"
 spn_two_natures.0001.a_parent:0 "Я учу [spn_tn_child.GetHerHim] милосердию"
 spn_two_natures.0001.b_parent:0 "Я учу [spn_tn_child.GetHerHim] силе"

 spn_two_natures.0002.t:0 "Две тени"
 spn_two_natures.0002.desc_child:0 "Полная луна, и ты идёшь домой. С твоей тенью что-то не так. Их две. У одной длинная морда, и она бежит на четырёх лапах. У другой рога, и она не двигается вовсе.\n\nОбе ждут тебя."
 spn_two_natures.0002.desc_parent:0 "[spn_tn_child.GetFirstName] возвращается домой бледным и дрожащим. [spn_tn_child.GetSheHe|U] говорит, что под луной [spn_tn_child.GetHerHis] тень раздвоилась: одна — волк, другая — нечто с рогами.\n\n[spn_tn_child.GetSheHe|U] спрашивает, какая из них — [spn_tn_child.GetHerHim]."
 spn_two_natures.0002.a_child:0 "Я иду за волком"
 spn_two_natures.0002.b_child:0 "Я иду к той, что с рогами"
 spn_two_natures.0002.a_parent:0 "«Волк. Это тень волка»."
 spn_two_natures.0002.b_parent:0 "«Обе. Не бойся ни одной»."

 spn_two_natures.0003.t:0 "Первое превращение"
 spn_two_natures.0003.desc_child:0 "Всё начинается с позвоночника. Каждая кость ломается, одна за другой. Затем очень спокойный голос говорит, что может это прекратить. Нужно лишь попросить.\n\nБоль сильнее всего на свете. Голос очень терпелив."
 spn_two_natures.0003.desc_parent:0 "Сегодня ночью [spn_tn_child.GetFirstName] впервые превращается, и ты рядом. Сквозь крик ты слышишь [spn_tn_child.GetHerHim]: идёт разговор с кем-то. Что-то предлагает это прекратить.\n\nТы мог бы велеть [spn_tn_child.GetHerHim] послушаться."
 spn_two_natures.0003.a_child:0 "Я терплю"
 spn_two_natures.0003.b_child:0 "Пусть это прекратится"
 spn_two_natures.0003.a_parent:0 "«Не отвечай ему. Терпи»."
 spn_two_natures.0003.b_parent:0 "«Позволь ему помочь тебе»."

 spn_two_natures.0010.t:0 "Две природы"
 spn_two_natures.0010.desc_wolf:0 "Демон в тебе ждал двадцать лет. Этой ночью он хочет ответа. Но волк владеет тобой дольше и знает тебя лучше.\n\nОстаться может только один из них."
 spn_two_natures.0010.desc_demon:0 "Демон в тебе ждал двадцать лет. Этой ночью он хочет ответа, и ты уже знаешь, что скажешь. Волк тише, чем прежде.\n\nОстаться может только один из них."
 spn_two_natures.0010.desc_even:0 "Демон в тебе ждал двадцать лет. Этой ночью он хочет ответа. Волк тоже хочет. Ни один из них никогда не был сильнее другого.\n\nОстаться может только один из них."
 spn_two_natures.0010.a:0 "Я волк"
 spn_two_natures.0010.a.tt:0 "Ты остаёшься оборотнем. Кровь демона тоже остаётся, но она никогда не сделает тебя демоном."
 spn_two_natures.0010.b:0 "Я то, чем меня сделала моя кровь"
 spn_two_natures.0010.b.tt:0 "Волк покидает тебя. Ты становишься демоном."

 spn_two_natures.0011.t:0 "Потом"
 spn_two_natures.0011.desc_wolf:0 "Прошёл год. Иногда в тихой комнате ты всё ещё слышишь спокойный голос. Он больше не просит. Он только ждёт.\n\nВолк громче."
 spn_two_natures.0011.desc_demon:0 "Прошёл год. Иногда под полной луной ты чувствуешь, что твои кости хотят сдвинуться. Потом это проходит.\n\nТы не скучаешь. Почти."
 spn_two_natures.0011.a:0 "Вот кто я"

 # ==========================================================
 # Creature moments (§7.2)
 # ==========================================================
 spn_moment.0001.t:0 "Зеркало"
 spn_moment.0001.desc:0 "Новое зеркало в твоих покоях, хорошее венецианское стекло. Ты по привычке останавливаешься перед ним.\n\nЛицо твоё. То же лицо, что было очень давно. Ни у кого больше лицо не остаётся прежним."
 spn_moment.0001.a:0 "Я отвожу взгляд"
 spn_moment.0001.b:0 "Я смотрю, пока снова не узнаю его"
 spn_moment.0001.c:0 "Всё ещё самое прекрасное лицо в любой комнате"
 spn_moment.0001.d:0 "Тщеславие — для недолговечных"

 spn_moment.0002.t:0 "Почему ты не ешь?"
 spn_moment.0002.desc:0 "[spn_mo_child.GetFirstName] весь ужин наблюдал за тобой. Теперь [spn_mo_child.GetSheHe] очень громко спрашивает, почему ты никогда ничего не ешь.\n\nЗа столом становится тихо."
 spn_moment.0002.a:0 "Вместо ответа я рассказываю [spn_mo_child.GetHerHim] сказку"
 spn_moment.0002.b:0 "«Потому что я не хочу хлеба»."
 spn_moment.0002.c:0 "«Иди поиграй»."

 spn_moment.0003.t:0 "Старая песня"
 spn_moment.0003.desc:0 "Певец в таверне заводит песню, которую ты знаешь. Ты впервые услышал её, когда она была новой, и он перевирает слова.\n\nПравильных не помнит никто из живых. Только ты."
 spn_moment.0003.a:0 "Я пою её по-старому"
 spn_moment.0003.b:0 "Я молчу и слушаю"

 spn_moment.0004.t:0 "Порезанный палец"
 spn_moment.0004.desc:0 "[spn_mo_carver.GetFirstName] режет [spn_mo_carver.GetHerHis] палец, разделывая мясо. Маленький порез. [spn_mo_carver.GetSheHe|U] обматывает его салфеткой и отшучивается.\n\nТы чувствуешь это через весь стол: тепло, запах, медленно расползающееся по полотну красное пятно."
 spn_moment.0004.a:0 "Я извиняюсь и выхожу"
 spn_moment.0004.b:0 "Я остаюсь за столом"
 spn_moment.0004.c:0 "Я смотрю, как краснеет салфетка"
 spn_moment.0004.d:0 "Я передаю соль и ни о чём не думаю"

 spn_moment.0005.t:0 "Луна и жажда"
 spn_moment.0005.desc:0 "Полная луна, и одновременно тебя мучает жажда. Волк хочет бежать. Другое хочет крови.\n\nОба они — ты, и они не согласны друг с другом."
 spn_moment.0005.a:0 "Я даю волку бежать"
 spn_moment.0005.b:0 "Я позволяю жажде вести"
 spn_moment.0005.c:0 "Я держу обоих и жду рассвета"

 spn_moment.0006.t:0 "Знакомая могила"
 spn_moment.0006.desc:0 "Ты проходишь мимо места, где похоронен [spn_mo_grave.GetFirstName]. Камень уже стар, и имя трудно прочесть.\n\nТы был уже стар, когда [spn_mo_grave.GetSheHe] родился. Сейчас ты не стар."
 spn_moment.0006.a:0 "Я ненадолго задерживаюсь"
 spn_moment.0006.b:0 "Я иду дальше"
 spn_moment.0007.t:0 "Пир"
 spn_moment.0007.desc:0 "Зал полон и шумен. Блюдо следует за блюдом, а [spn_mo_carver.GetFirstName] всё подливает тебе в кубок и спрашивает, почему он всё ещё полон.\n\nВсе здесь едят. Все здесь тёплые."
 spn_moment.0007.a:0 "Я вожу еду по тарелке, пока не уберут посуду"
 spn_moment.0007.b:0 "Я смотрю на гостей, а не на мясо"
 spn_moment.0007.c:0 "Глоток вина — всё, что я когда-либо пью"
 spn_moment.0007.d:0 "Я смешу весь стол, и никто не смотрит в мою тарелку"
 spn_moment.0007.e:0 "Я ухожу до второй перемены блюд"
 spn_moment.0008.t:0 "Ланцет лекаря"
 spn_moment.0008.desc:0 "[spn_mo_physician.GetFirstName] решил, что твои гуморы не в равновесии. [spn_mo_physician.GetSheHe|U] уже приготовил чашу и ланцет и улыбается с уверенностью того, кто пустил кровь сотне пациентов.\n\nТо, что вытечет из твоей руки, не будет похоже на их кровь."
 spn_moment.0008.a:0 "Не сегодня. Ни в какой день."
 spn_moment.0008.b:0 "Дать [spn_mo_physician.GetHerHim] посмотреть, а потом заставить [spn_mo_physician.GetHerHim] забыть"
 spn_moment.0008.c:0 "Никто не пускает мне кровь"
 spn_moment.0008.d:0 "За ширмой кровь пускают слуге. Показать [spn_mo_physician.GetHerHim] эту чашу."
 spn_moment.0009.t:0 "Уснул у тебя на плече"
 spn_moment.0009.desc:0 "[spn_mo_partner.GetFirstName] уснул у тебя на плече, запрокинув голову, горло открыто. Пульс прямо здесь. Ты считаешь его, даже не стараясь.\n\n[spn_mo_partner.GetSheHe|U] полностью тебе доверяет."
 spn_moment.0009.a:0 "Я лежу неподвижно и слушаю сердце"
 spn_moment.0009.b:0 "Совсем чуть-чуть. [spn_mo_partner.GetSheHe|U] никогда не узнает."
 spn_moment.0009.c:0 "Я встаю и брожу до рассвета"
 spn_moment.0010.t:0 "Молитва перед трапезой"
 spn_moment.0010.desc:0 "[spn_mo_chaplain.GetFirstName] встаёт, чтобы благословить стол. Все склоняют головы. Слова древние — о свете, о крови и о том, что ждёт нечестивых.\n\nНа тебя они ложатся иначе, чем на всех остальных здесь."
 spn_moment.0010.a:0 "Я склоняю голову вместе со всеми"
 spn_moment.0010.b:0 "Эти слова всё ещё что-то для меня значат"
 spn_moment.0010.c:0 "Я улыбаюсь и пережидаю. Слова — это только слова."
