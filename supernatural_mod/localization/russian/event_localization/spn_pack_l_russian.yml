l_russian:
 spn_pack.0010.t:0 "Ты водишь стаю"
 spn_pack.0010.desc:0 "Теперь у тебя есть стая. Она мала, и она твоя.\n\nВолки, что бегают с тобой, станут от этого сильнее, и они будут оглядываться на тебя, когда что-то пойдёт не так. Тот, кто стоит сразу за тобой, — твой Второй, и он же первый, кто попробует твою силу.\n\nКорми их и прячь их — и они сохранят тебя."
 spn_pack.0010.a:0 "Значит, бежим."
 spn_pack.0011.t:0 "Приглашение"
 spn_pack.0011.desc:0 "У того, кто тебя сделал, есть стая, и ведёт её [spn_inv_alpha.GetShortUIName]. Приходит весть — простая и короткая: для тебя есть место. Первые годы самые тяжёлые, сказано в ней, и большинство тех, кто проводит их в одиночку, не видят многих следующих.\n\nТы в этом новичок. Но не обязательно быть новичком в одиночку."
 spn_pack.0011.desc_recruit:0 "[spn_inv_alpha.GetShortUIName] водит стаю и знает, что ты такое. Приходит весть — простая и короткая: для тебя есть место, если захочешь. Никто не прикрывает спину волка, что бегает один, сказано в ней, а годы долги.\n\nПока ты справлялся(лась) один(одна). Не обязательно продолжать."
 spn_pack.0011.a:0 "Я буду бегать с ними."
 spn_pack.0011.b:0 "Я найду свой путь."
 spn_pack.0012.t:0 "Уход"
 spn_pack.0012.desc:0 "[spn_rem_who.GetShortUIName] больше не в стае. Ни ссоры, ни слова. Просто нет. [spn_rem_who.GetHerHis|U] запах уже выветривается на тропах, где вы бегали вместе.\n\nОстальные заметили. Они смотрят, что ты с этим сделаешь."
 spn_pack.0012.a:0 "Пусть уходит."
 spn_pack.0015.t:0 "Ты просыпаешься среди волков"
 spn_pack.0015.desc:0 "Когда жар спадает, первое, что ты чуешь, — мокрая шерсть и дым костра. Они вокруг тебя, волки со Схода, и по их виду видно, что они здесь уже дни. Кто-то поддерживал огонь. Кто-то носил воду.\n\nТеперь ты из них."
 spn_pack.0015.a:0 "Из них."
 spn_pack.0015.a.tt:0 "Ты бегаешь со стаей, которую водит [spn_carry_alpha.GetShortUIName]."
 spn_pack.0013.t:0 "Новый вожак"
 spn_pack.0013.desc:0 "У стаи новый вожак: [spn_sa_new.GetShortUIName]. Каждый волк в ней почувствовал перемену в тот же миг, как она случилась, — как смену ветра.\n\nНекоторые рады. Некоторые уже считают дни до того, как смогут испытать [spn_sa_new.GetHerHim]."
 spn_pack.0013.desc_me:0 "Теперь стая твоя. Каждый волк в ней почувствовал перемену в тот же миг, как она случилась, и все до одного смотрят на тебя.\n\nНекоторые рады. Некоторые уже прикидывают, сколько ты продержишься."
 spn_pack.0013.desc_joined:0 "[spn_sa_new.GetShortUIName] водит другую стаю. С этого Схода вы — одна стая: так велел старый обряд."
 spn_pack.0013.a:0 "Так оно и бывает."
 spn_pack.0020.t:0 "Вызов"
 spn_pack.0020.desc_won:0 "Ты бросил(а) вызов, и всё кончилось быстро: зубы, вес и никаких мечей. [spn_ch_b.GetShortUIName] на земле. Ты — нет.\n\nОстальные это видели. К утру об этом будет знать каждый волк на много миль вокруг, и некоторые станут смотреть на тебя иначе."
 spn_pack.0020.desc_lost:0 "Ты бросил(а) вызов, и всё кончилось быстро: зубы, вес и никаких мечей. Ты на земле. [spn_ch_b.GetShortUIName] — нет.\n\nОстальные это видели. К утру об этом будет знать каждый волк на много миль вокруг, и некоторые станут смотреть на тебя иначе."
 spn_pack.0020.a:0 "Решено."
 spn_pack.0021.t:0 "Вызов"
 spn_pack.0021.desc_won:0 "Вызов был не твой: его бросил [spn_ch_a.GetShortUIName]. Всё кончилось быстро: зубы, вес и никаких мечей. [spn_ch_a.GetShortUIName] на земле. Ты — нет.\n\nОстальные это видели. К утру об этом будет знать каждый волк на много миль вокруг, и некоторые станут смотреть на тебя иначе."
 spn_pack.0021.desc_lost:0 "Вызов был не твой: его бросил [spn_ch_a.GetShortUIName]. Всё кончилось быстро: зубы, вес и никаких мечей. Ты на земле. [spn_ch_a.GetShortUIName] — нет.\n\nОстальные это видели. К утру об этом будет знать каждый волк на много миль вокруг, и некоторые станут смотреть на тебя иначе."
 spn_pack.0021.a:0 "Решено."
 spn_pack.0100.t:0 "Запах чужой стаи"
 spn_pack.0100.desc:0 "Твои волки возвращаются с границы твоих земель неспокойными. Там бегала другая стая. Водит её [spn_mo_other.GetShortUIName].\n\nОни ничего не перешли. Им и не нужно было. Они оставили свой запах там, где ты его найдёшь. Твои младшие волки хотят пойти и ответить на него сегодня же."
 spn_pack.0100.a:0 "Пусть знают, чья это земля."
 spn_pack.0100.a.tt:0 "[spn_mo_other.GetShortUIName] может стать твоим соперником."
 spn_pack.0100.b:0 "Места хватит обоим."
 spn_pack.0100.b.tt:0 "[spn_mo_other.GetShortUIName] будет держать с тобой перемирие."
 spn_pack.0101.t:0 "Волк просится к тебе"
 spn_pack.0101.desc:0 "[spn_mo_other.GetShortUIName] водит стаю, в которой бегает [spn_mo_asker.GetShortUIName]. Сегодня [spn_mo_asker.GetShortUIName] здесь, у тебя, и просит остаться. [spn_mo_asker.GetShortUIName] говорит, что [spn_mo_other.GetShortUIName] водит свою стаю жёстко и мало что даёт взамен. Может, так и есть.\n\nСкажешь да — [spn_mo_other.GetShortUIName] тебя не поблагодарит."
 spn_pack.0101.a:0 "Оставайся."
 spn_pack.0101.a.tt:0 "[spn_mo_asker.GetShortUIName] присоединится к твоей стае. [spn_mo_other.GetShortUIName] примет это плохо."
 spn_pack.0101.b:0 "Ступай домой."
 spn_pack.0102.t:0 "Молодые волки дерутся"
 spn_pack.0102.desc_won:0 "На опушке сошлись [spn_mo_ours.GetShortUIName] и молодой волк из чужой стаи, и дрались они так, как дерутся молодые волки. Твой вернулся первым — в крови, прихрамывая и в полном восторге от себя."
 spn_pack.0102.desc_lost:0 "На опушке сошлись [spn_mo_ours.GetShortUIName] и молодой волк из чужой стаи, и дрались они так, как дерутся молодые волки. Твой вернулся хромая. Тот, второй, уже рассказывает эту историю всей стае, которой водит [spn_mo_other.GetShortUIName]."
 spn_pack.0102.desc_friends:0 "На опушке сошлись [spn_mo_ours.GetShortUIName] и молодой волк из чужой стаи, и дрались они так, как дерутся молодые волки. А потом сели рядом и стали зализывать раны, и теперь они друзья."
 spn_pack.0102.a:0 "Молодые волки."
 spn_pack.0103.t:0 "Родные души"
 spn_pack.0103.desc_friends:0 "[spn_kin_other.GetShortUIName] бегает в другой стае — ты в своей. И это как будто не имеет значения. Вы нашли друг друга в лесу, и что-то в вас обоих сказало: вот этот. Ни одна из ваших стай не знает, что с этим делать."
 spn_pack.0103.desc_lovers:0 "[spn_kin_other.GetShortUIName] бегает в другой стае — ты в своей. И это не имело значения. Однажды ночью вы нашли друг друга в лесу, а утром ни одному из вас не хотелось домой. Обе стаи уже знают, и ни одна не в восторге."
 spn_pack.0103.a:0 "Родные души."
 spn_pack.0104.t:0 "Замеченная шкура"
 spn_pack.0104.desc:0 "Один из твоих волков вернулся из долгого бега с новостью. Она пришла от путника, пьяницы и старухи, что не назвала своего имени, и все трое рассказали её одинаково."
 spn_pack.0104.shrine:0 "\n\n[spn_waf_hide.GetName] хранится как святыня в [spn_waf_county.GetName], и тамошние верующие думают, что она принадлежала кому-то святому."
 spn_pack.0104.held_mine:0 "\n\nГоворят о шкуре, что хранится у тебя. Слух о ней уже пошёл."
 spn_pack.0104.held:0 "\n\n[spn_waf_holder.GetShortUIName] держит шкуру. Кто захочет её, тому придётся её забрать."
 spn_pack.0104.lost_silverback:0 "\n\nСреброспин потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_pack.0104.lost_timber:0 "\n\nКряж потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_pack.0104.lost_tundra:0 "\n\nТундра потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_pack.0104.lost_graybeard:0 "\n\nСедобород потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_pack.0104.lost_midnight:0 "\n\nПолночь потеряна. Её не видели годами. Она где-то там и ждёт кого-то."
 spn_pack.0104.lost_alpha:0 "\n\nВожак потерян. Его не видели годами. Он где-то там и ждёт кого-то."
 spn_pack.0104.true_alpha:0 "\n\nЕсть волк с красными глазами, [spn_waf_ta.GetShortUIName], который стал вожаком, никого для этого не убив. Старые говорят, такого не было сотню лет."
 spn_pack.0104.nothing:0 "\n\nТы не слышишь ничего такого, чего не знал(а) бы."
 spn_pack.0104.a:0 "Запомнить."
 spn_pack.0200.t:0 "Вражда из-за шкуры"
 spn_pack.0200.desc:0 "Шкура перешла между твоей стаей и стаей, которой водит [spn_feud_other.GetShortUIName], и перешла она не по-доброму. Кто её имел — хочет вернуть, кто имеет теперь — не отдаст.\n\nСлова «вражда» ещё никто не сказал. Но все его думают. По границе больше никто не бегает в одиночку."
 spn_pack.0200.a:0 "Они не забудут — и я тоже."
 spn_pack.0300.t:0 "Истинный Вожак"
 spn_pack.0300.desc:0 "За это с тобой никто не дрался. Никто не умер. Ты проснулся(лась) утром, и стая уже смотрела на тебя, а глаза твои в воде были красными.\n\nЭто случается без убийства, говорят старые, — с волком, который заслужил это тем, каков он есть. Такого не было сотню лет.\n\n[spn_ta_old_alpha.GetShortUIName] водит эту стаю. И сейчас водит?"
 spn_pack.0300.a:0 "Я поведу эту стаю."
 spn_pack.0300.a.tt:0 "Ты становишься вожаком этой стаи. [spn_ta_old_alpha.GetShortUIName] сохраняет своё положение и не держит на тебя зла."
 spn_pack.0300.b:0 "Я основаю свою."
 spn_pack.0300.b.tt:0 "Ты уходишь и основываешь свою стаю. Кто-то из этой может пойти за тобой."
 spn_pack.0301.t:0 "Волк с красными глазами"
 spn_pack.0301.desc:0 "Прошлой ночью это почувствовал каждый волк на сотню миль вокруг. Где-то там вожак поднялся без драки, и глаза у него красные.\n\n[spn_ta.GetHerHis|U] имя — [spn_ta.GetShortUIName]. Ты услышишь его снова. Старые волки, которых ты знаешь, примолкли — и по этому ты понимаешь, что они встревожены."
 spn_pack.0301.a:0 "Истинный Вожак."