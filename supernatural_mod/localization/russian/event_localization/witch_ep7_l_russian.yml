 illusion_spells:0 "Неизвестное заклинание иллюзий"
 ev8.2.0.a:0 "Это может стать темой для сплетен."
 ev8.2.0.b:0 "Я объявлю, кто настоящий отец."
 ev8.2.0.c:0 "[recipient.GetSheHe|U] колдовал запрещённое заклинание!"
 ev8.3.title:0 "Понимание ведьм"
 ev8.3.desc:0 "В результате вашей недавней охоты на ведьм вы нашли заметки одной из них. Записи описывают ритуалы, которые обычный человек назвал бы мерзкими, но вы знаете, что эта информация может быть ключевой для понимания того, как ведьмы работают и думают."
 ev8.3.0.a:0 "Я не буду рисковать, я сожгу заметки."
 ev8.3.0.b:0 "Я изучу эти документы."
 ev8.4.desc:0 "Вам удалось расшифровать заметки ведьмы, которые вы перехватили. Похоже, что быть ведьмой — это только начало на пути к познанию очень тёмных секретов и обретению истинной силы, выходящей за пределы человеческого воображения."
 ev8.4.0.a:0 "Я использую эти знания в борьбе против ведьм."
 ev8.4.0.b:0 "Моя миссия кажется бесполезной перед лицом такой силы."
 ev6.11.desc4B:0 "Этот секрет, который вы обнаружили, связан с [rstarget.GetTitledFirstName]."
 ev6.11.desc4M:0 "$ev6.11.desc4$\n$ev6.11.desc4B$"
 ev6.11.desc5:0 "В уме [recipient.GetTitledFirstName] вы ясно видите, что [recipient.GetSheHe] в данный момент не участвует в интригах, но [recipient.GetSheHe] знает о [rsecret2.GetName], принадлежащем [rsowner.GetTitledFirstName]."
 ev6.11.desc6:0 "Это странно, но ваше заклинание не может проникнуть в разум [recipient.GetTitledFirstName], как будто вокруг [recipient.GetHerHim] есть особая магическая преграда."
 me_time_travel_project_ct:0 "Вы открываете #italic Путешествие во времени#! [magic_special_project|E]"
 me_time_travel_option:0 "Путешествие во времени"
 ev8.5.desc:0 "Ваше заклинание путешествия во времени готово. Вы откалибровали его для перемещения в будущее, так как путешествие в другом направлении может привести к парадоксу. Сохранится ли ваша династия в эти несколько сотен лет? Стала ли магия чем-то обыденным среди обычных дворян? Пора это выяснить."
 ev8.5.0.a:0 "Я наклепаю заклинание!"
 ev8.5.0.a_ct:0 "Вы отправляетесь в будущее, хотя готовы немедленно вернуться, если возникнут проблемы."
 ev8.6.title:0 "Будущее наступило"
 ev8.6.desc:0 "На вас обрушивается волна оглушительного шума. Вы не знаете, что здесь происходит, но это небезопасно!"
 ev8.6.0.a:0 "Быстро, я разбиваю заклинание!"
 ev8.7.desc:0 "Вы справились, вы выжили! Хотя очевидно, что это заклинание слишком рискованно использовать, по крайней мере, без веской причины. Будущее выглядит тревожно. Видимо, мир подчинён огромным... стальным драконам. Если человечество вообще существует, то оно, вероятно, является пищей или рабами для них. Откуда появились стальные чудовища? Будут ли маги в будущем побеждены ими? Одно ясно..."
 ev8.7.0.a:0 "Я должен остановить это!"
 ev8.7.0.a_ct:0 "Вы рассмотрите варианты, чтобы остановить 'стальных драконов'."
 ev8.7.0.b:0 "Это будущее неизбежно."
 ev8.8.title:0 "Изменяя Будущее"
 ev8.8.desc:0 "Долгое время вы размышляли, как остановить будущее, которое видели. Вы пришли к выводу, что у вас недостаточно информации — вы даже не уверены, что безопасно изменять будущее. Вам нужен кто-то с опытом в этих делах. Может быть, Мерлин или Баба Яга, хотя даже если они что-то знают, вы не уверены, что будут готовы помочь вам. Возможно, кто-то из демонов сможет помочь. Это должен быть мощный демон, разбирающийся в вопросах магии..."
 ev8.8.0.a_ct:0 "Вы должны поговорить с Гекатой"
 ev6.4.0.c:0 "Можете сказать мне, как изменить будущее?"
 ev8.9.desc:0 "'Интересный вопрос. Вы что-то увидели, не так ли?'"
 ev8.9.0.a:0 "Я видел гибель своего народа в будущем. Я так думаю."
 ev8.9.0.a_ct:0 "Вы рассказываете историю о своей временной поездке."
 ev8.10.desc:0 "'Люди... Вы добровольно делаете вещи, даже если не понимаете их. Даже боги редко манипулируют временем, мелкие существа никогда не должны этого делать.' - задумалась демоница - 'Если вы видели будущее, то, вероятно, его невозможно изменить. Это был бы парадокс. Возможно, ваше путешествие само perpetuировало временную шкалу, и эти драконы все равно появятся.'"
 ev8.10.0.a:0 "Значит, ничего нельзя сделать?"
 ev8.11.desc:0 "'Вы можете попробовать объединить мир, чтобы противостоять стальным драконам под сильным руководством. Или работать над оружием, чтобы уничтожить их. Вероятно, вы не добьетесь успеха, потому что боретесь с судьбой. Другой способ - сразиться с драконами в их времени. Это может нарушить целостность временной шкалы, но... ну что ж. Однажды я разработала заклинание для борьбы с драконами, или хотя бы с их аналогами в моем мире.'"
 ev8.11.0.a:0 "Ты научишь меня этому заклинанию?"
 ev8.12.desc:0 "'В конце концов, я Демон. Я бы с удовольствием увидел, как ты подвергаешь временную линию своего мира разрушению. Но заклинание сложное и одноразовое. Оно создаст волшебный воронкообразный капкан, который притянет все массивные объекты на огромной территории, а затем разобьет их на атомы. Такие... крошечные частицы. Если ты произнесешь заклинание прямо в будущее, некоторые драконы, безусловно, погибнут.'"
 ev8.12.0.a:0 "Я подумаю об этом, но я все равно хочу узнать заклинание."
 ev8.12.0.a_ct:0 "Ты выучил особое заклинание Гекаты."
 ev8.12.0.a_ct2:0 "Ты разблокировал "Остановить драконов"."
 change_the_future_title:0 "Остановить драконов"
 change_the_future_desc:0 "Поскольку ты не можешь предотвратить приход драконов, ты по крайней мере можешь отомстить им. Ты можешь создать временной разрыв и произнести заклинание Гекаты через него... если это имеет смысл."
 ev8.13.desc:0 "Ты не знаешь, как остановить приход «стальных драконов» (если это возможно), но можешь попытаться навредить им в их собственное время. Заклинание Гекаты посеет хаос среди них. Чтобы уменьшить риск, ты решаешь создать временное нарушение, через которое ты произнесешь заклинание. Одновременное произнесение двух сложных заклинаний было огромной задачей, но, похоже, ты справился... Хотя ты не уверен, что выбрал правильное время и место, драконы определенно должны почувствовать воздействие."
 ev8.13.0.a:0 "Больше я ничего не могу сделать на данный момент."
 ev8.13.0.a_ct:0 "Заклинание Гекаты было произнесено"
 ev8.14.title:0 "Тем временем, в будущем..."
 ev8.14.desc:0 "В 1880 году, в конце января, британский корабль HMS Atalanta отправляется в своё последнее путешествие через Атлантику, направляясь в Фалмут в Англии. Корабль, вместе со всем экипажем, исчезает без следа. Четыре года спустя такая же участь постигла итальянский шхуна 'Мирамон'. \n В времена, когда магии нет, даже мощные заклинания являются лишь эхом прошлых сил, но этого достаточно, чтобы многие корабли и самолёты исчезали в этом месте, известном как..."
 ev8.14.0.a:0 "Бермудский треугольник"
 ev8.14.0.a_ct:0 "Ваша работа завершена (на этот раз всерьёз)"
 master_magic_modifier:0 "Мастер магии"
