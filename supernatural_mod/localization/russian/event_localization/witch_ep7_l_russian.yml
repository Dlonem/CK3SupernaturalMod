 ev8.46.title:0 "Массовое исцеление"
 ev8.46.desc:0 "Эта ночь принесла хорошие новости. Многие люди, пострадавшие или страдающие от различных болезней, проснулись полностью выздоровевшими, без следов их недугов. Признаем, болезни не полностью исчезли из мира, но многие люди благодарят Бога за показанную им благодать."
 ev8.46.0.a:0 "Это чудо."
 ev8.46.0.b:0 "Они должны поблагодарить меня."
 ev8.47.desc:0 "Одна ведьма очень заинтересована в вашем Древнем Сингуляре. [witch0.GetTitledFirstName] с удовольствием взглянула бы на артефакт поближе. С одной стороны, получение симпатии [witch0.GetTitledFirstName] может быть выгодным, с другой стороны, у вас есть некоторые опасения по поводу передачи вашего артефакта кому-то, даже если это всего лишь на мгновение."
 ev8.47.0.a:0 "Ладно, я все же не буду упускать [witch0.GetHerHis] из виду."
 ev8.48.desc:0 "[witch0.GetTitledFirstName] посмотрела на предмет, задала вам несколько вопросов. В какой-то момент [witch0.GetSheHe] неправильно схватила устройство, и оно сработало. Артефакт излучил поток мощной энергии, который ударил в стену, пробив ее. Один гость и несколько слуг, стоявших там, испарились без следа. Через отверстие видно, что луч также причинил ущерб снаружи, разрушив стену и подожгив несколько зданий..."
 ev8.48.0.a:0 "К счастью, уровень мощности был установлен на 10%..."
 ev8.49.desc:0 "Вы чувствуете, что цель сопротивляется вам. Манипулировать [target.GetHerHim] может быть гораздо сложнее, чем вы думали."
 ev8.49.0.a:0 "Мне нужно подумать о новых тактиках."
 ev8.49.0.b:0 "Это просто требует больше времени."
