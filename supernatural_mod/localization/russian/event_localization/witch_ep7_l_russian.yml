 cyro_proposal_interaction:0 "Предложите циограф"
 cyro_proposal_interaction_desc:0 "Вы можете наделить смертного магической силой, если он пообещает вам свою душу в обмен."
 DEMON_CYRO_PROPOSAL:0 "У меня есть предложение для вас, смертные. Вы готовы рассмотреть возможность продажи своей души в обмен на огромную силу?"
 magic_cyro_ct1:0 "Как только контракт будет завершен (или цель умрет), вы сможете поглотить душу."
 magic_cyro_ct2:0 "Цель получит доступ к магии или другим преимуществам в обмен на свою душу."
 magic_cyro_ct3:0 "Контракт #N не#! будет подписан."
