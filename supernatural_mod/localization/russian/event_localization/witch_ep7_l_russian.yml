l_russian:
 ev8.1.desc:0 "Ты понимаешь, что ты отличаешься от своих сверстников. Иногда ты знаешь, что произойдет, прежде чем это случится, ты точно угадываешь мысли и намерения других, и ветер с огнём, кажется, повинуются тебе. Иногда."
 ev8.1.0.a:0 "Это будет очень весело!"
 ev8.1.0.b:0 "Я буду развивать свой талант!"
 ev8.1.0.c:0 "Лучше займусь чем-то другим."
