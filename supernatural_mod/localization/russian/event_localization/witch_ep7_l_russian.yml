 ev8.50.desc:0 "Слуга принес вам новости о том, что у ворот замка стоит человек, который, якобы, является магом. [mage1.GetSheHe|U] требует почетного дуэля магов, чтобы доказать, что [mage1.GetSheHe] сильнее вас."
 ev8.50.0.a:0 "Наконец-то, возможность немного размяться."
 ev8.50.0.b:0 "Откажись от [mage1.GetHerHim], мне не нужно никому ничего доказывать."
