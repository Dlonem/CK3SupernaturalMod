 ev8.15.title:0 "Цирограф"
 ev8.15.desc:0 "[actor.GetTitledFirstName] пришел к вам с предложением - [actor.GetSheHe] может предоставить вам силу в обмен на вашу душу. Это означает, что в В2@ придет один демон или другой, чтобы забрать вас в ад. Но кого волнует, что произойдет в В3@? Кроме того, может быть, вы сможете как-то перехитрить демонов..."
 ev8.15.0.a:0 "Я отвергаю ваше предложение, Демон."
 ev8.15.0.b:0 "Я принимаю это соглашение."
 ev8.15.0.c:0 "Я буду торговаться за еще лучшие условия."
 ev8.16.desc:0 "Похоже, что [recipient.GetTitledFirstName] отверг ваше щедрое предложение..."
 ev8.17.desc:0 "[recipient.GetTitledFirstName] согласился на ваше предложение - цирограф был подписан. Согласно соглашению, после [actor.Custom('CYRU_DURATION')] [recipient.GetTitledFirstName] уйдет в ад, и вы сможете поглотить душу [recipient.GetHerHis]."
 arcane_focus_unlocked_ct:0 "$arcane_focus$ разблокирован!#"
 ev8.18.desc:0 "Время вашего контракта с Демоном истекло. Согласно цирографу, вы теперь должны пойти в ад, чтобы позволить демону поглотить вашу душу."
 ev8.18.0.a:0 "Я никуда не ухожу."
 ev8.18.0.a_ct:0 "Демоны, вероятно, попытаются тебя убить."
 ev8.18.0.b:0 "Ну... я готов, поехали."
 ev8.19.desc:0 "После многих лет ожидания контракт наконец-то осуществился, и ты можешь отправить [recipient.GetTitledFirstName] в ад. [recipient.GetSheHe|U] не сопротивляется, так что, когда тело [recipient.GetHerHis] наконец-то умрёт, ты сможешь легко вытянуть необходимую тебе энергию из души [recipient.GetHerHis]."
 ev8.20.desc:0 "Контракт выполнен, и согласно соглашению, [recipient.GetTitledFirstName] должен отправиться в ад, оставив тебе душу [recipient.GetHerHis]. Однако [recipient.GetTitledFirstName] не собирается умирать добровольно. [recipient.GetSheHe|U] думает, что [recipient.GetSheHe] может восстать против тебя..."
 ev8.20.0.a:0 "Я убью этого дурака!"
 ev8.20.0.b:0 "Я подожду, однажды [recipient.GetSheHe] всё равно умрёт."
 ev8.20.0.c:0 "Я продам этот контракт другому демону."
 ev8.20.0.c_ct:0 "Ты передашь контракт другому демону, сохранив небольшую комиссию."
 cyro_prematurly_completed_toast:0 "Цирографическая цель умерла до завершения контракта."
 cyro_completed_toast:0 "Ты поглощаете душу"
 cyrographer_terrain_advantage:0 "Предложить время перезарядки Цирографа (в годах)"
 cyrographer_terrain_cancel_negative_supply:0 "Доступ к предложению Цирографа [interaction|E]"
 cyro_proposal_cooldown_reset:0 "Предложение о циклическом графике [interaction|E] время восстановления было убрано."
 magic_art_hide_ct:0 "Вам не удалось перехватить магические артефакты."
 magic_art_hide_ct2:0 "Ваш заключенный смог спрятать или отдать свои вещи прежде, чем его поймали."
 ev8.21.desc:0 "Ваш поиск сталкивается с постоянными препятствиями. Слуга, отправленный за информацией, пропал. Коллекция книг, которую вы хотели купить, внезапно была куплена кем-то другим. Кроме того, различные странные инциденты продолжают отвлекать вас от работы. Вы задаетесь вопросом, является ли это совпадением или, возможно, один из ваших соперников незаметно саботирует вас."
 ev8.21.0.a:0 "Мне нужно сосредоточиться на своей работе."
 ev2.10.c:0 "Это будет решено на поле битвы."
 touched_divinity_modifier:0 "Мистические силы."
 blob_name:0 "Сгусток."
 blob_name2:0 "Левиафан."
 ev8.22.title:0 "Изгнанник"
 ev8.22.desc:0 "В магическом круге появился маленький демон. Существо выглядит печальным, но на его лице видно явное облегчение. \n «Спасибо, Люцифер! Ты спас бедного Сгустка в последний момент...»"
 ev8.22.0.a:0 "Что?"
 ev8.23.desc:0 "Простите меня, господин! Я знаю, что вы ожидали более могущественного демона, но я обязан был воспользоваться возможностью сбежать из ада. Другие демоны хотят убить бедного Блоба, конечно, без всякой причины... Да, меня зовут Блобоарисивилас, но все называют меня Блоб. В вашем распоряжении, господин."
 ev8.23.0.a:0 "Что ты можешь мне предложить... Блоб?"
 ev8.24.desc:0 "[this0.GetLadyLord|U], Блоб, в отличие от других демонов, не обладает магическими талантами. Именно поэтому другие демоны презирают его... Я могу дать вам только свою преданность, но, пожалуйста, не отправляйте меня обратно! Блоб может служить! Он лучший слуга всех миров, вы увидите! Пожалуйста!"
 ev8.24.0.a:0 "Пусть будет так, ты станешь моим личным слугой."
 ev8.24.0.b:0 "Я не отпущу демона, даже такого жалкого. Прощай."
 ev8.25.desc:0 "Господин, спасибо за вызов! Вы передумали? Могу ли я служить вам? Каждое мгновение в аду для бедного Блоба болезненно."
 ev8.25.0.a:0 "Нет, я просто хотел видеть, как ты страдаешь. До свидания."
 ev8.26.desc:0 "С момента вызова Блоб служит вам на каждом шагу. Он рядом, когда вам это нужно, ближе или дальше, но всегда готов исполнить вашу команду. Он отличный дворецкий и отличный курьер, но также поддерживает порядок вокруг вас."
 ev8.26.0.a:0 "Наконец-то у меня есть компетентный слуга."
 ev8.27.desc:0 "В последнее время вы видите Блоба реже, но он по-прежнему приходит по вашему зову. Однако его присутствие ощущается по всему замку. Полы сверкают от чистоты, всё выглядит аккуратно и красиво. Недавно даже ваши советники заметили, что ваше поместье никогда не выглядело лучше, чем сейчас..."
 ev8.27.0.a:0 "Блоб заслуживает награды."
 ev8.27.0.b:0 "Давайте продолжим в том же духе."
 shining_mansion_modifier:0 "Сияющий Замок"
 ev8.29.desc:0 "Магическая треангуляция как источник заклятия указывает... ваш замок или его окрестности. По неизвестным причинам вы не можете точно отследить вашу цель."
 ev8.29.0.a:0 "Что-то плохое, похоже, происходит у меня на глазах."
 ev8.30.opening:0 ""
 ev8.30.desc:0 "Обычно я не вмешиваюсь в дела демонов и смертных, но на этот раз я сделаю небольшое исключение. Демон, которого вы знаете как 'Blob', мой враг. Поэтому я хочу сказать вам, что он не тот, кем себя выдает. Однажды он смог обмануть даже меня; он великий актер и мастер манипуляции. Вам лучше быть настороже."
 ev8.30.0.a:0 "Мефисто пытается втянуть меня в какую-то извращённую демоническую интригу."
 ev8.30.0.b:0 "Мне лучше следить за Блобом, на всякий случай."
 ev8.31.title:0 "Плохие предчувствия"
 ev8.31.desc:0 "Вы просыпаетесь ночью с странным чувством. Через некоторое время вы осознаёте, что можете ощущать магию в округе, должно быть, именно это вас разбудило. Воздух наполняет электричество от избыточной мощи. Кто-то очень близко творит мощные заклинания - вы предполагаете, что источник находится где-то под замком, в ваших подземельях."
 ev8.31.0.a:0 "Я пойду и проверю это."
 ev8.32.desc:0 "В этот час замок очень тихий и немного жутковатый. Странно то, что по дороге не встретить ни одного человека, даже охранников. В конце концов, даже ночью они должны патрулировать коридоры и стены, верно?"
 ev8.32.0.a:0 "Завтра я проведу серьезный разговор с командиром охраны."
 ev8.32.0.a_ct:0 "Ты продолжаешь идти к подземельям."
 ev8.33.desc:0 "Ты наткнулся на первое тело на входе в подземелья, а через мгновение — на второе. Это был командир охраны, с которым ты собирался поговорить завтра. Дальше находятся еще охранники и слуги. Подземелья все больше напоминают бойню. Это какая-то извращенная мечта? В центре главной камеры ты видишь своего слугу, Блоба, который смотрит на тела. На его лице появляется легкая улыбка. Он является эпицентром тех заклинаний, которые ты ощущаешь."
 ev8.33.0.a:0 "Почему, Blob? Если это твоё настоящее имя..."
 ev8.34.desc:0 "Заклинание иллюзии расплывается и показывает истинную форму Bloba. Он больше не напоминает незаметного демона, которого ты знал раньше. \n'Моё настоящее имя $blob_name2$. Я долго пытался попасть в ваш мир. Мой мир. Мир моего истинного хозяина, одного из Великих Древних, который сейчас спит где-то на дне ваших океанов.'"
 ev8.34.0.a:0 "Почему ты убил моих людей?"
 ev8.35.desc:0 "'Я убивал их некоторое время. Мне нужны эти жизни, чтобы разбудить моего Господа, хотя смерть простых людей даёт мало силы. Твоя, наоборот, может быть чем-то, что оценит мой хозяин, что может его разбудить. Я знал, что ты рано или поздно появишься здесь. Я готов. Мы готовы.'"
 ev8.35.0.a:0 "'Мы'?"
 ev8.36.desc:0 "Два демона появляются из тьмы. Они не выглядят такими мощными, как Левиафан, но всё равно... они демоны. \n'Ты могучий маг, вызов даже для демона. И я не люблю рисковать... Убей его.' \nОба демона бросились к тебе."
 ev8.36.0.a:0 "Я отвечу своим мечом!"
 ev8.36.0.a_ct:0 "Ты сможешь отразить атаку демонов!"
 ev8.36.0.a_ct2:0 "Ты можешь получить ранения!"
 ev8.36.0.a_ct3:0 "Оба демона будут изгнаны."
 ev8.36.0.b:0 "Я постараюсь наложить заклинание двойного изгнания."
 ev8.36.0.c:0 "Заклинание Шаг Тени сбьет их с толку."
 ev8.36.0.d:0 "Древняя Сингулярность просто сожжет их."
 magic_damaged_walls_modifier:0 "Поврежденные Стены"
 ev8.37.desc:0 "'Ты сказал, что он просто обычный смертный!' - закричал один из демонов Левиафану. Оба мелких демона отступили, явно не желая сражаться с магом. Через мгновение вы с Левиафаном остались одни в подземелье."
 ev8.37.desc2:0 "Тебе удалось одолеть и уничтожить обоих демонов своей силой. Остался только Левиафан."
 ev8.37.0.a:0 "Есть у тебя какие-нибудь козыри, демон?"
 ev8.38.desc:0 "'Ты знаешь, что верных слуг в наше время трудно найти. Но они выполнили свою работу, я хотел, чтобы ты потратил часть своей энергии на них. Теперь твой конец близок.' - ты видишь, как демон начинает накладывать боевое заклинание."
 ev8.39.title:0 "Маленький спутник"
 ev8.39.desc:0 "В общем, вы довольны своим спутником, хотя иногда задаётесь вопросом, не подошёл бы другой лучше."
 ev8.39.0.a:0 "Думаю, я предпочитаю одного."
 ev8.39.0.b:0 "Любой другой будет лучше."
 ev8.39.0.c:0 "Я оставлю своего маленького спутника."
 become_fallen_hunter_decision_title:0 "Стать Падшим Охотником на Ведьм"
 become_fallen_hunter_decision_desc:0 "Возможно, ведьмы правы - сила, которую они ищут, стоит любой цены."
 become_fallen_hunter_decision_confirm:0 "Вот мой новый путь."
 elixir_learning_modifier:0 "Эликсир Познания"
 pot9_desc:0 "Это зелье временно улучшает интеллектуальные способности."
 gain_pot9_ct:0 "Вы получаете Эликсир Познания"
 drink_pot9_decision:0 "Использовать Эликсир Познания"
 STOP_THE_WITCH_WAR:0 "Война Против Ведьмы"
 against_the_witch_war:0 ""
 against_the_witch_war_desc:0 "Ведьма будет сожжена на костре."
 against_the_witch_war_defender:0 "Вы будете сожжены на костре."
 against_the_witch_war_defender2:0 "Вы будете заключены в тюрьму."
 ev8.41.opening:0 ""
 ev8.41.desc:0 "Мы готовимся к крупной войне против влиятельной ведьмы, [defender.GetTitledFirstName]. Я предлагаю вам возможность присоединиться к нашему благородному делу, что порадует вашего бога и впишет ваше имя в страницы истории."
 ev8.41.0.a:0 "Конечно, вы имеете мою полную поддержку!"
 ev8.41.0.b:0 "Это не мое дело."
 ev4.10.0.d:0 "Я создам великую коалицию против ведьмы."
 ev4.10.0.d_ct:0 "#N Вы можете использовать эту опцию один раз за жизнь.#!"
 ev8.42.title:0 "Великая коалиция"
 ev8.42.desc:0 "Вы начинаете подготовку к Великой войне против [recipient.GetTitledFirstName]. Многие правители, кажется, заинтересованы в поддержке этой благородной идеи. Тем не менее, война может быть не нужна - начните с того, чтобы отправить ультиматум [recipient.GetTitledFirstName]. Возможно, [recipient.GetSheHe] сдадутся без боя."
 ev8.43.opening:0 ""
 ev8.43.desc:0 "Я пишу, чтобы дать вам ультиматум. Вы сдадитесь мне и позволите провести суд над вами как над ведьмой, или я и другие благочестивые правители объявим вас ведьмой, сокрушим ваши армии в прах, и вы сгорите на костре. Каков ваш ответ?"
 ev8.43.0.a:0 "Тогда будет война."
 ev8.43.0.a_ct:0 "Скоро на вас может напасть великая коалиция."
 ev8.43.0.b:0 "Поскольку это единственный способ избежать войны, я сдамся."
 ev8.43.0.b_title:0 "Сдался без боя"
 ev8.43.0.c:0 "Мой ответ: пошел ты, охотник."
 ev8.44.desc:0 "Как вы могли догадаться, [recipient.GetTitledFirstName] отказывается сдаваться. Вы должны продолжать свои приготовления к войне, которые идут гладко. Признаем, пока вам не удалось убедить всех важных правителей принять участие в войне, но некоторые готовы отправить вам добровольцев, элитные войска и опытных рыцарей - при условии, что вы покроете затраты на их продовольствие."
 ev8.44.0.a:0 "Дополнительные войска могут быть полезны."
 ev8.44.0.b:0 "Нам не нужны дополнительные солдаты."
 ev8.45.desc:0 "Ваши силы готовы к войне. По крайней мере, некоторые правители, которые сейчас не участвуют в войнах, могут оказать вам поддержку."
 ev8.45.0.a:0 "Ну что ж, пришло время для войны!"
 ev8.45.0.b_ct:0 "Вы пересмотрите это через три месяца."
