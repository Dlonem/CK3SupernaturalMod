l_russian:
 spn_vade.0600.t:0 "Заклинание идёт не так"
 spn_vade.0600.desc:0 "Это было заклинание [ROOT.Char.Custom('LastSpellCast')], которое ты знаешь наизусть. На середине что-то другое перехватило его.\n\n"
 spn_vade.0600.desc_kill:0 "Оно не отпустило [spn_mf_victim.GetFirstName], когда должно было. К тому времени, как кто-то догадался позвать на помощь, [spn_mf_victim.GetSheHe] был мёртв, и все, кто это видел, знают, чьё это было заклинание."
 spn_vade.0600.desc_spared:0 "Оно не отпустило [spn_mf_victim.GetFirstName], когда должно было. [spn_mf_victim.GetSheHe|U] выжил, но не без ран."
 spn_vade.0600.desc_back:0 "Оно извернулось у тебя в руках и ударило по тебе."
 spn_vade.0600.desc_wide:0 "Оно прошло мимо цели. Ты почувствовал, как оно легло на тебя, и оно не уходит."
 spn_vade.0600.desc_court:0 "Оно отправилось искать кого-то другого и нашло [spn_mf_hurt.GetFirstName], стоявшего слишком близко."
 spn_vade.0600.desc_felt:0 "Оно прогремело, как ударенный колокол. Каждый с даром на много миль вокруг почувствовал это, и люди поблизости не забудут эту ночь."
 spn_vade.0600.desc_cancer:0 "Исцеление не остановилось, когда рана закрылась. Оно продолжало сращивать [spn_mf_victim.GetFirstName] там, где в этом не было нужды."
 spn_vade.0600.desc_reopen_other:0 "Рана, которую ты закрыл на [spn_mf_victim.GetFirstName], открылась снова в течение часа, шире прежнего."
 spn_vade.0600.desc_reopen_self:0 "Ты закрыл рану, и в течение часа она открылась снова, шире прежнего."
 spn_vade.0600.desc_curdle:0 "Действо скисло на пути в землю. [spn_mf_county.GetName] от этого стало хуже, а не лучше."
 spn_vade.0600.desc_mind_other:0 "Оно вошло в разум [spn_mf_victim.GetFirstName] и оставило его более тесным, чем нашло."
 spn_vade.0600.desc_mind_self:0 "Вместо этого оно вошло в твой собственный разум и оставило его более тесным, чем нашло."
 spn_vade.0600.desc_ward:0 "Оберег сомкнулся на тебе, а не вокруг тебя."
 spn_vade.0600.desc_travel:0 "Ты прибыл куда хотел, но прибыл не весь благополучно."
 spn_vade.0600.desc_nosebleed:0 "Когда заклинание покинуло тебя, у тебя пошла носом кровь и не останавливалась сутки."
 spn_vade.0600.desc_laugh:0 "Ничего не произошло вовсе, у всех на глазах. Твой двор нашёл это очень забавным."
 spn_vade.0600.desc_through:0 "Что-то прошло следом за ним. Ты его не звал, и оно не ушло обратно."
 spn_vade.0600.a:0 "Это была книга."
 spn_vade_misfire_felt_tt:0 "Каждый с даром поблизости почувствовал это, и графство это запомнит."
 spn_vade_misfire_through_tt:0 "Что-то прошло и не оставит тебя в покое."
 spn_vade_toast_misfire:0 "Заклинание пошло не так"
 spn_vade_toast_misfire_tt:0 "Наложенное на тебя заклинание не закончилось там, где должно было."
 spn_death_misfire:0 "умер, когда заклинание пошло не так"
 spn_death_misfire_killer:0 "умер, когда заклинание [TARGET_CHARACTER.GetUIName] пошло не так"
 spn_vade.0690.t:0 "Отладка: сбой свидетеля"
 spn_vade.0690.desc:0 "Сделай себя свидетелем [spn_vade_maecum|E], затем задай, как часто заклинание свидетеля идёт не так."
 spn_vade.0690.a:0 "Сделай меня свидетелем."
 spn_vade.0690.b:0 "Каждое заклинание идёт не так (на год)."
 spn_vade.0690.c:0 "Ни одно заклинание не идёт не так (на год)."
 spn_vade.0690.d:0 "Вернуть собственные шансы книги."
 spn_vade.0690.e:0 "Освободи меня от уз."
