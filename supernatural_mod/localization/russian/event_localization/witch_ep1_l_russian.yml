l_russian:
 rule_magic_arts:0 "Колдовство: Магические Артефакты"
 setting_normal_magic_arts:0 "Случайное распределение"
 setting_normal_magic_arts_desc:0 "Распределение магических артефактов совершенно случайно."
 setting_user_magic_arts:0 "Гарантировано для игрока"
 setting_user_magic_arts_desc:0 "Один магический артефакт будет выдан игроку в начале игры."
 rule_magic_whunters:0 "Колдовство: Деятельность Охотников на ведьм"
 setting_normal_whunters:0 "Обычный"
 setting_normal_whunters_desc:0 "Охотники на ведьм и Главный охотник на ведьм могут появляться в любое время."
 setting_low_whunters:0 "Низкий"
 setting_low_whunters_desc:0 "Могут появляться только обычные Охотники на Ведьм."
 rule_magic_bael:0 "Колдовство: Баэль (Демон)"
 setting_normal_magic_bael:0 "Может появиться"
 setting_normal_magic_bael_desc:0 "Баэль, скорее всего, появится, если вы станете слишком могущественным."
 setting_never_magic_bael:0 "Не может появиться"
 setting_never_magic_bael_desc:0 "Баэль останется в Аду..."
 press_court_mage_decision:0 "Нажмите на вашего Дворцового Мага"
 press_court_mage_decision_toast:0 "Нажмите на вашего Дворцового Мага"
 press_court_mage_decision_desc:0 "Время пришло - ваш дворцовый маг должен доказать свою полезность. Пусть его магия поможет вашему королевству любым образом."
 press_court_mage_decision_tooltip:0 "Попросите вашего дворцового мага дать вам что-то."
 press_court_mage_decision_confirm:0 "Попросите магической поддержки"
 press_court_mage_decision_ct:0 "Ваш Дворцовый Маг ответит на ваш призыв."
 ev2.61.title:0 "Приказы Лорда"
 ev2.61.desc:0 "Ваш лорд, [lliege.GetTitledFirstName], просит вас доказать ваши магические способности. 'Вы должны сделать что-то полезное для нашего королевства' - сказал [lliege.GetSheHe]."
 ev2.61.a:0 "Я просто дам [lliege.GetHerHim] немного золота..."
 ev2.61.b:0 "Я покажу [lliege.GetHerHim] свои исследования."
 court_mage_support:0 "Поддержка Дворцового Мага"
 ev2.61.c:0 "Я прокляну врага [lliege.GetHerHis]."
 ev2.61.d:0 "Я уничтожу врага [lliege.GetHerHis]!"
 ev2.61.d_ct:0 "Будет наложено мощное проклятие"
 ev2.61.e:0 "Моя магия требует времени, я не могу вам сейчас помочь."
 lazy_court_mage_modifier:0 "Ленивый дворцовый маг"
 ev2.61.e_ct:0 "Вас могут уволить"
 ev2.62.title:0 "Ответ магистраCourt"
 ev2.62.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName] пришёл к вам с новостью. 'Мой сюзерен, мне удалось превратить свинец в золото. Это мой подарок для вас.'"
 ev2.62.a:0 "Отличная работа, мой придворный маг!"
 ev2.63.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName] пришёл к вам с новостью. 'Мой сюзерен, я наложил проклятие на вашего врага, [potential_tar.GetTitledFirstName]. Надеюсь, вы примете это как доказательство моей лояльности.'"
 ev2.63.a_ct:0 "[potential_tar.GetTitledFirstName] подвергся проклятию (по слухам)"
 ev2.64.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName] пришёл к вам с кучей манускриптов и свитков. 'Я не могу показать вам никакой волшебный трюк, но, возможно, вы сможете использовать мои знания для достижения своих целей.'"
 ev2.64.a:0 "Интересно."
 ev2.65.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName] пришёл к вам и объявил: 'Мой сюзерен, моя магия требует времени, я не могу помочь вам сейчас.'"
 ev2.65.a:0 "Я дам тебе больше времени тогда."
 ev2.65.b:0 "Ты бесполезен."
 ev2.65.c:0 "Я всё равно воспользуюсь тобой."
 ev7.0.d:0 "Вместо этого я пожертвую своими пленниками - всеми!"
 singularity_name:0 "Древняя Сингулярность"
 singularity_desc:0 "Древнее устройство неизвестного назначения. Оно имеет сильную магическую ауру - такую сильную, что даже обычный человек может её ощутить."
 ev96.1.title:0 "Загадочное устройство"
 ev96.1.desc:0 "Вернувшись в свою chambers, вы видите странный объект, лежащий на столе. Кто оставил его здесь? И что это вообще?"
 ev96.1.a:0 "Мне следует расследовать это."
 study_singularity_decision:0 "Изучить Древнюю Сингулярность"
 study_singularity_decision_toast:0 "Изучить Древнюю Сингулярность"
 study_singularity_decision_desc:0 "Древняя Сингулярность — это самое сложное устройство, которое вы когда-либо видели. Его судьба должна быть раскрыта."
 study_singularity_decision_tooltip:0 "Изучить Древнюю Сингулярность."
 study_singularity_decision_confirm:0 "Осмотреть устройство"
 IS_SCHOLAR_MAGE_CUSTOM:0 "У вас должны быть черты мага, ученого или чудотворца"
 ev2.66.title:0 "Древняя Сингулярность"
 ev2.66.desc:0 "Артефакт состоит из множества механических частей, некоторые из них медленно меняют свое положение. Вы можете попробовать манипулировать ими или изучить руны на корпусе."
 ev2.66.a:0 "Я буду импровизировать."
 ev2.66.b:0 "Сначала я проверю руны."
 ev2.67.desc:0 "Ваши действия принесли плоды, и Древняя Сингулярность была активирована. В каком-то смысле... Артефакт явно увеличивает вашу умственную силу, но магическая радиация может быть вредной в долгосрочной перспективе. Похоже, что что-то застряло, и нет способа изменить конфигурацию устройства."
 ev2.67.a:0 "Это может быть полезно в любом случае."
 ev2.68.desc:0 "Руны – это inscriptionы на древнем языке – заклинания и предупреждения магической природы. Вы можете попробовать их расшифровать."
 ev2.68.a:0 "Я начинаю перевод."
 ev2.68.a_ct:0 "Ваши исследования продолжатся."
 ev2.68.b:0 "Это пустая трата времени."
 ev2.68.b_ct:0 "Ваши исследования будут прерваны."
 ev2.69.desc:0 "Вам удалось успешно перевести некоторые руны. Это своего рода руководство. Однако вы всё еще не знаете, для чего может быть использован этот механизм."
 ev2.69.a:0 "Достаточно. Я найду применение этим рунам."
 ev2.69.b:0 "Я продолжу свою работу."
 ev2.70.desc:0 "Вы думаете, что сможете использовать устройство. Вы подозреваете, что его можно использовать для обработки магической энергии."
 ev2.70.a:0 "Значит, время для экспериментов!"
 ev2.70.a_ct1:0 "Вы приближаетесь к пониманию истинной природы артефакта."
 ev2.70.a2:0 "Древняя Сингулярность была активирована."
 ev2.70.a3:0 "Древняя Сингулярность была активирована... вроде как."
 ev2.70.a_ct3:0 "Частичный успех..."
 ev2.72.desc:0 "Странный артефакт, похоже, сейчас спит. Возможно, проведение исследований поможет понять его природу."
 ev2.72.a:0 "Возможно..."
 ev2.73.desc:0 "Вы догадываетесь, что наконец-то поняли, для чего может быть этот артефакт. Он излучает смертоносную магическую радиацию - возможно, древние маги использовали его как оружие."
 ev2.73.a:0 "Теперь я стану неуязвимым!"
 ev2.73.b:0 "Я также могу использовать эту силу, чтобы трансформировать свое тело!"
 ev2.73B.desc:0 "Вы догадываетесь, что наконец-то поняли, для чего может быть этот артефакт. Он излучает смертоносную магическую радиацию - возможно, древние маги использовали его как оружие. Но есть кое-что еще. Он может оказаться полезным не только на поле боя. Он работает на очень большие дистанции, может дотянуться до любого места в мире!"
 NOT_TITLE_TIER_TRIGGER:0 "Только графства могут быть допустимыми целями"
 use_singularity_ct:0 "Большинство персонажей в выбранной провинции погибнет"
 use_singularity_ct2:0 "Вы потеряете статус Насыщенный властью"
 use_singularity:0 "Используйте Древнюю Сингулярность"
 use_singularity_desc:0 "Используйте Древнюю Сингулярность как ужасное оружие"
 magical_radiation_modifier:0 "Магическое Излучение"
 ev2.73.a_ct:0 "Позволяет использовать взаимодействие с Древней Сингулярностью"
 ev2.74.title:0 "Великая Катастрофа"
 ev2.74.desc:0 "Что-то ужасное произошло в [ttile.GetName]. Огромный взрыв потряс все окружающие земли. Многие люди погибли, а остальные получили травмы или заболели. Бог покинул это место."
 ev2.74.a:0 "Это ужасно."
 ev2.74.b:0 "Какую силу могла сделать что-то подобное?"
 ev2.74.c:0 "Неограниченная сила!"
 ev2.75.title:0 "Источник Истинной Силы"
 ev2.75.desc:0 "Один из ваших гостей во дворе, похоже, опытный мистик. Он утверждает, что может продать вам информацию о магическом предмете."
 ev2.75.a:0 "Пусть [wwitch.GetHerHim] говорит, я заплачу."
 ev2.75.b:0 "Еще один мошенник..."
 ev2.75.a_ct:0 "Вы можете узнать местонахождение магического артефакта"
 ev2.76.desc:0 "Согласно словам вашего гостя, [mowner.GetTitledFirstName] обладает магическим артефактом."
 ev2.76.a:0 "Я должен встретиться с [mowner.GetHerHim]..."
 artifact_hunter:0 "Охотник за Артефактами"
 ev2.78.title:0 "Проекция Силы"
 ev2.78.desc:0 "[hholder.GetTitledFirstName] пришел сдаваться. Мы не можем противостоять такой силе - сказал [hholder.GetSheHe]."
 ev2.78.a:0 "Значит, ты все-таки не дурак."
 dead_ring:0 "Кольцо Смерти"
 dead_ring_desc:0 "Созданное в Аду, инструмент смерти и разрушения, темное отражение Кольца Жизни."
 astaroth_name:0 "Астарот"
 astaroth_nickname:0 "Адский пёс"
 astaroth_nickname_desc:0 "Адский пёс"
