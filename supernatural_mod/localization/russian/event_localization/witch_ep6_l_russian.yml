 ev2.24.f_1:0 "Чемпион проиграл"
 ev2.24.f_2:0 "Чемпион выиграл"
 ev2.24.desc2:0 "'Я победил твоего чемпиона, теперь ты должен сдаться!'"
 grand_spell_decision_title:0 "Наложите окончательное заклинание"
 grand_spell_decision_desc:0 "Используйте силу, которую вы получили от собрания магов, чтобы произнести мощное заклинание."
 grand_spell_decision_ct:0 "Вы попытаетесь использовать мощную магию."
 POWER_NEEDED_CUSTOM2:0 "Требуется 100 очков насыщения силой."
 ev7.129.desc:0 "Вам удалось собрать огромные объемы силы, которая медленно испаряется из вашего тела. Теперь вам нужно сформировать и использовать её. Для себя или для других..."
 ev7.129.a:0 "Для других, конечно. Я наложу заклинание массового исцеления."
 ev7.129.a_ct:0 "Персонажи по всему миру будут исцелены."
 ev7.129.b:0 "Такая сила позволит мне призвать и контролировать большую армию демонов."
 ev7.129.c:0 "Я сохраню эту силу для себя."
 ev7.129.d:0 "Я оставлю Высшее Заклинание для дуэли магов."
 ev7.129.e:0 "Я могу дальше развивать свои навыки."
 ultimate_spell_modifier:0 "Высшее Заклинание"
 source3_terrain_cancel_negative_supply:0 "Развивает #italic Использовать Высшее Заклинание#! [decision|E] для магов"
