 building_houska:0 "Замок Гауска"
 building_houska_desc:0 "Фольклор считает, что этот замок закрывает один из входов в Ад, построенный, чтобы предотвратить попадание демонов (запертых на нижних уровнях) в остальной мир."
 building_type_houska:0 "Замок Гауска"
 building_type_houska_desc:0 "Фольклор считает, что этот замок закрывает один из входов в Ад, построенный, чтобы предотвратить попадание демонов (запертых на нижних уровнях) в остальной мир."
