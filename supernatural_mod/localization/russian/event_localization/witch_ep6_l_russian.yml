 court_position_viking_trait:0 ""
 court_position_demon_trait:0 ""
 dark_champion_court_position:0 "Темный Чемпион"
 dark_champion_court_position_desc:0 "Злые маги часто пытаются вербовать падших рыцарей, коррумпированных придворных или менее опытных волшебников в качестве своих личных агентов. Самые доверенные и безжалостные среди них могут стать Темным Чемпионом, идеальным военным командиром, темным слугой или просто человеком для грязной работы, контролирующим операции своего темного господина."
 dark_champion_special_tasks:0 "Специальная миссия"
 dark_champion_special_tasks_desc:0 "Темный Чемпион будет в резерве для выполнения специальных миссий, связанных с саботажем или убийством назначенной цели."
 dark_champion_training:0 "Постоянная подготовка"
 dark_champion_training_desc:0 "Темный Чемпион сосредоточится на развитии своих навыков, установлении новых контактов и сборе ресурсов, полезных в его обязанностях."
 dark_champion_domain_supervision:0 "Надзор за владениями"
 dark_champion_domain_supervision_desc:0 "Темный Чемпион будет иметь дело с проблемными горожанами, поселенцами и мелкими дворянами, а также с вопросами безопасности в ваших владениях."
 dark_champion_train_terrain_cancel_negative_supply:0 "Ваш Темный Чемпион может повысить свои навыки или приобрести новые черты"
 dark_champion_special_terrain_cancel_negative_supply:0 "Разблокирует Специальную миссию [interaction|E]"
 special_champion_mission:0 "Специальная миссия"
 special_champion_mission_failure:0 "Специальная миссия - Неудача"
 special_champion_mission_success:0 "Специальная миссия - Успех"
 special_champion_mission_desc:0 "Отправьте своего Темного Чемпиона на секретную миссию."
 DARK_CHAMPION_IS_ON_MISSION:0 "Ваш Темный Чемпион уже на миссии."
 DARK_CHAMPION_ONLY_DURING_PEACE:0 "Ваш Темный Чемпион занимается военными действиями."
 special_champion_mission_o1a:0 "Ваш Темный Чемпион инициирует схему убийства или принимает непосредственные меры против цели."
 special_champion_mission_o1b:0 "Может быть убит."
 special_champion_mission_option_title:0 "Выберите Задачу"
 special_champion_mission_o1:0 "Убийство"
 special_champion_mission_o2:0 "Грабеж деревень"
 special_champion_mission_o2a:0 "Ваш Темный Чемпион соберет команду для рейда на владения цели."
 special_champion_mission_o2b:0 "Домен будет в хаосе."
 special_champion_mission_o3:0 "Похищение"
 special_champion_mission_o3a:0 "Ваш Темный Чемпион попытается похитить цель."
 special_champion_mission_o3b:0 "Может быть похищен."
 special_champion_mission_o4:0 "Спасательная операция"
 special_champion_mission_o4a:0 "Ваш Темный Чемпион отправится на спасательную операцию."
 special_champion_mission_o4b:0 "Может быть освобожден."
 ev7.31.desc:0 "Ваш сюзерен вызвал вас сегодня, чтобы назначить вам особую миссию. Ваша цель - [recipient.GetTitledFirstName]."
 ev7.31.desc1:0 "\n[recipient.GetSheHe|U] должен умереть."
 ev7.31.desc2:0 "\nВы берете несколько доверенных людей и начинаете грабить деревни [recipient.GetHerHis], одну за другой."
 ev7.31.desc3:0 "\nВы должны захватить [recipient.GetHerHim] любой ценой, я хочу видеть [recipient.GetHerHim] в своих подземельях."
 ev7.31.desc4:0 "\nВы должны организовать спасательную операцию, чтобы освободить [recipient.GetHerHim]."
 ev7.31.descX:0 "У вас есть полная свобода выбора, как завершить задание."
 ev7.31.0.a:0 "Как вы пожелаете, мой [actor.GetLadyLord]."
 ev7.32.desc:0 "После нескольких дней планирования вам удалось продумать свой следующий ход относительно [recipient.GetTitledFirstName]."
 ev7.32.0.a:0 "Я вызову [recipient.GetHerHim] на дуэль."
 ev7.32.0.a_ct:0 "Вы отправите приглашение на дуэль."
 ev7.32.0.b:0 "Я сделаю это незаметно."
 ev7.32.0.c:0 "Я возглавлю группу смерти."
 ev7.32.0.c_ct:0 "Вы подготовите ударную группу для ночной атаки."
 ev7.32.0.d:0 "Давайте устроим налет."
 ev7.32.0.d_ct:0 "Вы будете двигаться впереди команды, чтобы сеять бедствие на территории цели."
 ev7.32.0.e:0 "Время охоты."
 ev7.32.0.e_ct:0 "Вы готовите план по похищению цели."
 ev7.32.0.f:0 "Мне нужно подготовиться."
 ev7.32.0.f_ct:0 "Вы составите план по освобождению цели."
 ev7.32.0.g:0 "Эта задача выше моих сил, я сдаюсь."
 ev7.32.0.g_ct:0 "Ваш старший рассмотрит вашу просьбу."
 ev7.32.0.h:0 "Сначала я попрошу о дополнительном финансировании."
 ev7.32.0.h_ct:0 "Вы составите план по освобождению цели."
 ev7.33.desc:0 "Ваш Темный Чемпион пал, выполняя свою миссию. Это может задержать ваши планы."
 ev7.33.0.a:0 "Похоже, мне нужен новый слуга."
 special_mission_dco_ends_ct:0 "Специальная миссия отменена."
 special_mission_dco_ends_ct2:0 "Специальная миссия выполнена."
 ev7.34.desc:0 "Ваш Темный Чемпион сообщает, что человек, которого вы указали [dchampion.GetHerHim], мертв."
 ev7.34.0.a:0 "Пусть [dchampion.GetHerHim] ожидает дальнейших указаний."
 ev7.35.desc:0 "К вам дошли слухи, что ваш Темный Чемпион был заключен в тюрьму. В этих обстоятельствах вы не можете ожидать, что [dchampion.GetHerHim] продолжит выполнение миссии [dchampion.GetHerHis]."
 ev7.35.0.a:0 "Это неудобство."
 ev7.37.desc:0 "Ваш Темный Чемпион вернулся с хорошими новостями - [dchampion.GetHerHis] задание выполнено, [recipient.GetTitledFirstName] погиб от руки [dchampion.GetHerHis]."
 ev7.38.desc:0 "Ваш сюзерен приветствовал ваши новости о результатах вашей миссии. Тем не менее, [dchampion.GetSheHe] дал понять, что у вас все еще много работы, и вы можете получить новые указания в ближайшее время."
 ev7.38.0.a:0 "Я живу, чтобы служить."
 ev7.40.desc:0 "[dchampion.GetTitledFirstName] вызвал вас на поединок насмерть! Мотивации [dchampion.GetHerHis|U] не ясны вам, но ваш ответ должен быть решительным."
 ev7.40.0.a:0 "Мечи или топоры?"
 ev7.40.0.b:0 "У меня нет причин сражаться с [dchampion.GetHerHim]."
 ev7.40.0.b_ct:0 "Вы отказываетесь от вызова на поединок."
 ev7.41.desc:0 "Вы получили ответ от [recipient.GetTitledFirstName] - [recipient.GetSheHe] не будет сражаться с вами. [recipient.GetSheHe|U] явно напуган..."
 ev7.41.0.a:0 "Я скажу своему сюзерену, что мне нужно больше времени."
 ev7.41.0.b:0 "Я просто придумаю новый план."
 ev7.42.desc:0 "'Мой [actor.GetLadyLord], я вызвал [recipient.GetTitledFirstName] на поединок насмерть, но трус отказался! Мне нужно больше времени, чтобы выполнить задание.'"
 ev7.42.0.a:0 "Извинения... просто закончи с [recipient.GetHerHim]!"
 ev7.42.0.b:0 "Я хочу видеть [recipient.GetHerHim] мёртвым, сделай это."
 ev7.42.0.c:0 "Понял, продолжай."
 ev7.42.0.d:0 "Изменение планов, у меня для тебя другие распоряжения."
 ev7.43.desc:0 "Ваш господин отправил вам сообщение - вы должны немедленно прервать миссию. Вы вскоре получите новые указания."
 ev7.45.desc:0 "Ваш Темный Чемпион сообщает, что [dchampion.GetSheHe] столкнулся с некоторыми проблемами во время миссии [dchampion.GetHerHis]. [dchampion.GetSheHe|U] нужно больше времени."
 ev7.45.0.a:0 "[dchampion.GetSheHe|U] лучше приступить к работе!"
 ev7.45.0.b:0 "Либо [dchampion.GetSheHe] завершит задание, либо я закончу с [dchampion.GetHerHim]."
 ev7.45.0.c:0 "Достаточно, я подготовлю для вас другое задание."
 ev7.45.0.d:0 "Вы подводите меня в последний раз."
 ev7.45.0.d_ct:0 "Вы накладываете Удар Силы."
 ev7.46.desc:0 "Вам нужны люди, опытные воины и assassins, которые могут незаметно добраться до своих целей и тихо устранить стражу."
 ev7.46.0.a:0 "Мне не нужно много поддержки."
 ev7.46.0.b:0 "Нанимайте наемников."
 ev7.46.0.b_ct:0 "Ваша операция увеличит шансы на успех."
 ev7.46.0.c:0 "Я рекрутирую лучших."
 ev7.46.0.c_ct:0 "Ваша операция значительно #P увеличит шансы на успех."
 ev7.46.0.d:0 "Я знаю несколько подходящих людей."
 ev7.47.desc:0 "Чтобы разработать план атаки, вам нужно больше информации. Ваши шпионы должны внедриться на целевую локацию и в её окрестности."
 ev7.47.0.a:0 "Я отправлю своих лучших людей."
 ev7.47.0.b:0 "Мои шпионы уже внутри."
 ev7.47.0.c:0 "Взятка должна помочь."
 ev7.47.0.d:0 "Невозможно собрать информацию."
 ev7.48.desc:0 "Время развивать финальную стадию плана. Правильная стратегия позволит мне закрепить район, устранить цель и отступить прежде чем появится организованная защита."
 ev7.48.0.a:0 "Мы должны избежать срабатывания тревоги любой ценой."
 ev7.48.0.b:0 "Команда Красных нападёт с востока, когда Команда Синих очистит стены."
 ev7.48.0.c:0 "Мой шпион отвлечёт стражников."
 ev7.48.0.d:0 "Нам нужна лишь грубая сила."
 ev7.49.title:0 "Ночной штурм"
 ev7.49.desc:0 "В разгар ночи вас будят крики. Вы выбегаете из своей камеры и понимаете, что замок был атакован. Вы пытаетесь найти выход, но слышите звуки сражения со всех сторон."
 ev7.49.0.a:0 "Мы должны отразить их атаку!"
 ev7.49.0.b:0 "Они будут уничтожены."
 ev7.49.0.c:0 "Я покажу им, что не стоит связываться с магом."
 ev7.50.desc:0 "Ты вел свой народ, но с самого начала ничего не шло по плану. Завязалась яростная битва, в которой с каждой минуты приходило все больше и больше стражников. У тебя нет другого выбора, кроме как отступить."
 ev7.50.0.a:0 "Отступаем!"
 ev7.51.desc:0 "Нападающие были разбиты, но некоторые у逃li. Тебе удалось выяснить, что их возглавляет [dchampion.GetTitledFirstName], и из слов пленников кажется, что именно ты стал целью этой атаки."
 ev7.51.1.a:0 "[dchampion.GetSheHe|U] заплатит за это."
 ev7.52.desc:0 "Ты ворвался в замок, где скрывался твой противник. Стражники были полностью застигнуты врасплох, и тебе удалось победить их почти без потерь. Без труда ты добрался до [recipient.GetTitledFirstName], который теперь в твоей власти."
 ev7.52.0.a:0 "[actor.GetTitledFirstName] передает [actor.GetHerHis] привет."
 ev7.53.desc:0 "Ты и твои люди атаковали деревню, принадлежащую [recipient.GetTitledFirstName]. Жители были уничтожены, а все поселение сожжено. Тебе также удалось ограбить некоторые товары."
 ev7.53.0.a:0 "Это только начало."
 ev7.54.desc:0 "[dchampion.GetTitledFirstName], ваш Темный Чемпион, привел маленький отряд в одну из деревень, принадлежащих [recipient.GetTitledFirstName]. Поселение было сожжено, а жители убиты — все согласно вашим приказам."
 ev7.54.0.a_ct:0 "Ваш Темный Чемпион продолжит задачу."
 ev7.55.desc:0 "Вам стало известно, что одна из ваших деревень недавно была разграблена и уничтожена бандитами. Это то, с чем следует разобраться."
 ev7.55.0.a:0 "Я поручю стражникам разобраться с этим."
 ev7.55.0.b:0 "Мои рыцари займутся этим."
 ev7.55.0.b_ct:0 "Ваши рыцари будут преследовать бандитов."
 ev7.55.0.c:0 "Я назначу награду за их головы."
 ev7.56.desc:0 "В ответ на атаки вашего Темного Чемпиона, [recipient.GetTitledFirstName] решил послать стражников, чтобы перехватить [dchampion.GetHerHim]. Это ослабит личную охрану [recipient.GetHerHis]."
 ev7.56.0.a:0 "Отлично, миссия выполнена."
 ev7.56.0.b:0 "Я думаю, что несколько деревень должно сгореть."
 ev7.57.desc:0 "Вы постепенно становитесь ужасом царства [recipient.GetTitledFirstName]. Все больше деревень и караванов разоряются вашими людьми, вы оставляете после себя руины и висячие деревья. Единственная проблема в том, что [recipient.GetTitledFirstName], вероятно, уже узнал, что это вы за этим стоите."
 ev7.57.0.a:0 "Я сообщу моему феодалу о моем прогрессе."
 ev7.58.desc:0 "Ваш Темный Чемпион погрузил область [recipient.GetTitledFirstName] в хаос. Смерть и огонь теперь там в порядке вещей. Эти атаки также вызвали у [recipient.GetHerHim] финансовые проблемы."
 ev7.59.desc:0 "Ваше королевство опустошено неизвестными войсками. Они действуют слишком резко и организованы лучше, чем обычные бандиты. Ваши шпионы сообщают, что ими командует [dchampion.GetTitledFirstName]. [dchampion.GetSheHe|U] отвечает за многочисленные грабежи и разрушения, которые ведут вас к разорению."
 ev7.59.0.a:0 "Я хочу голову [dchampion.GetHerHis]!"
 ev7.59.0.b:0 "Я не буду действовать опрометчиво."
 magic_epic_cooldown_terrain_advantage:0 "Время восстановления Магических Исследований (в годах)"
 hells_scepter4_terrain_advantage:0 "Время восстановления Призыва Демонической Армии (в годах)"
 NOT_CHARACTER_ARE_IS_INCAPABLE:0 "Не неспособен"
 ev7.60.desc:0 "Тайминг и правильный момент для действия имеют решающее значение. Вы должны учитывать различные факторы и рассмотреть возможность более тонкого подхода."
 ev7.60.0.a:0 "Я использую уловку."
 ev7.60.0.b:0 "Мы не будем излишне осторожны - мы будем быстрыми и решительными."
 ev7.60.0.a_ct:0 "Вы составили хороший план."
 ev7.60.1.a_ct:0 "Ваш план имеет серьезные недостатки."
 ev7.61.desc:0 "Вы готовы начать свою операцию. Если все пройдет хорошо, вы перехватите [recipient.GetTitledFirstName] сегодня ночью. Ваш владыка определенно будет доволен..."
 ev7.61.0.a:0 "Время действовать!"
 ev7.62.desc:0 "Удар в дверь разбудил вас. Прежде чем вы смогли что-то сделать, дверь была сломана, и в комнату вбежали вооруженные люди. У них не самые благие намерения, но, похоже, они хотят взять вас живым."
 ev7.62.0.a:0 "Стражники! На меня напали..."
 ev7.62.0.b:0 "Я буду защищаться!"
 ev7.63.desc:0 "Ваша попытка перехвата [recipient.GetTitledFirstName] закончилась spektakularным провалом, все пошло не по плану, вам едва удалось спастись. Хуже того, теперь вам нужно рассказать об этом вашему владыке..."
 ev7.64.desc:0 "Ваша попытка перехвата [recipient.GetTitledFirstName] увенчалась успехом, все прошло по плану. Вам удалось безопасно отступить, прежде чем началась большая суматоха. Задача выполнена."
 ev7.64.0.a:0 "Я буду ждать дальнейших приказов."
 ev7.65.desc:0 "Ваш Темный Чемпион прибыл. [dchampion.GetSheHe|U] сообщал, что специальная миссия провалилась. [dchampion.GetSheHe|U] не смог ничего сделать с [recipient.GetTitledFirstName]."
 ev7.65.0.a:0 "Ты неудачник! Убери себя с глаз моих!"
 ev7.65.0.b:0 "Ты понесешь последствия."
 ev7.66.desc:0 "Ваш Темный Чемпион прибыл. [dchampion.GetSheHe|U] сообщал, что специальная миссия была успешно завершена."
 ev7.66.0.a:0 "Хорошая работа, мой темный чемпион."
 ev7.66.0.b:0 "Отлично, поместите [recipient.GetHerHim] в камеру."
 ev7.67.desc:0 "Ваша команда проникла в зону замка, где заключен [recipient.GetTitledFirstName]. Охранники выглядят ленивыми и сонными, но любая ваша ошибка может их насторожить."
 ev7.67.0.a:0 "Мы действуем по плану."
 ev7.67.0.b:0 "Давайте сначала отвлечем их."
 ev7.67.0.a_ct:0 "Операция провалилась."
 ev7.68.desc:0 "Вас разбудил посреди ночи [dchampion.GetTitledFirstName]. Команда [dchampion.GetSheHe|U] и [dchampion.GetHerHis] прибыла, чтобы освободить вас! Им удалось успокоить охранников, но вы должны поторопиться..."
 ev7.68.0.a:0 "Я свободен?"
 ev7.69.desc:0 "Ваш Темный Чемпион пришел к вам с просьбой. [dchampion.GetSheHe|U] просит вас о дополнительных средствах для специальной миссии, которую [dchampion.GetSheHe] проводит для вас."
 ev7.69.0.a:0 "Это шутка, [dchampion.GetSheHe]?"
 ev7.69.0.a_ct:0 "Ваш запрос был отклонён."
 IS_YOUR_MMINION:0 "Это ваш приспешник?"
 ev7.70.desc:0 "Вы чувствуете, как ваша магия медленно охватывает [target.GetTitledFirstName]. Вы не знаете, сможете ли полностью контролировать [target.GetHerHim], но коррупция уже коснулась [target.GetHerHim]. Вы чувствуете, что способны тонко направлять этот процесс."
 ev7.70.0.a:0 "Я оставлю метку на теле [target.GetHerHis]."
 ev7.70.0.b:0 "Я ослаблю разум [target.GetHerHis]."
 ev7.70.0.b_ct:0 "Кошмары"
 ev7.70.0.c:0 "Да свершится тёмное благословение над [target.GetHerHim]."
 ev7.70.0.d:0 "Я разбудю потенциал [target.GetHerHis]."
 ev7.70.0.e:0 "Я проведу эксперимент."
 ev7.70.0.f:0 "На самом деле, это может укрепить [target.GetHerHim]."
 ev7.71.desc:0 "Ваша эффективность и сила стабильно растут, и с ними осознание человеческих слабостей и уязвимостей. Но когда вы направляете их, они могут достичь своего потенциала или упасть на дно."
 ev7.71.0.a:0 "Смертные существа fascin'уют."
 ev7.72.title:0 "Обучение Тёмного Чемпиона"
 ev7.72.0.a_ct:0 "Тёмный Чемпион приобретает навыки"
 ev7.73.desc:0 "Ваш Тёмный Чемпион усердно тренируется, чтобы стать величайшим из ваших слуг. Тем не менее, стоит направить шаги [dchampion.GetHerHis] так, чтобы навыки [dchampion.GetHerHis] соответствовали вашим целям."
 ev7.73.0.a:0 "Мне нужен опытный командир."
 ev7.73.0.b:0 "Мне нужен хитрый инструмент."
 ev7.74.0.a:0 "[dchampion.GetSheHe|U] должен стать квалифицированным бойцом."
 ev7.74.0.b:0 "Я буду стимулировать творческое начало [dchampion.GetHerHis]."
 ev7.74.0.c:0 "[dchampion.GetSheHe|U] должен доказать V1@self на поле битвы."
 ev7.74.0.d:0 "Восстань, мой чемпион."
 trait_track_demonology:0 "Демонология"
 trait_track_demonology_desc:0 "Призыв и управление демонами требует больших навыков, но потенциальные выгоды еще больше."
 ev6.5.desc2:0 "Благодаря вашему мастерству в демонологии почти любой демон может ответить на ваш зов. Вы можете призвать конкретный вид демона - или призвать по имени того, с кем уже встречались."
 blackgrimoire_demonology_terrain_advantage:0 "Получение опыта в демонологии для магов"
 summoning_demonology_terrain_cancel_negative_supply:0 "Уменьшает шансы на осложнения при призыве"
 summoning_demonology2_terrain_cancel_negative_supply:0 "Призыв демонов не увеличивает стресс"
 summoning_demonology3_terrain_cancel_negative_supply:0 "Открывает заклинание #italic Изгнать демона#!"
 witchcraft_legacy_3_ct:0 "Новые маги получат #P 10#! Очков Тайного Знания в качестве стартового бонуса"
 hells_scepter4_terrain_cancel_negative_supply:0 "Может призывать демонов во время призыва"
 ev15.0.e:0 "Ты будешь служить мне."
 ev2.11.d2:0 "Я просто использую заклинание изгнания, ублюдок!"
 ev3.6.c2:0 "Потому что я не буду использовать свои заклинания, чтобы изгнать тебя?"
 additional_sc_for_mage_ct:0 "Ты получишь #P 5#! Очков Секретного Знания, когда станешь магом."
 ev7.75.title:0 "Магия и Мораль"
 ev7.75.desc:0 "Твоё понимание правил магии постоянно углубляется, однако некоторые из твоих наблюдений могут быть тревожными. Использование магических сил имеет свою цену, что часто заставляет магов действовать против законов Бога. Значит ли это, что колдовство – дело Сатаны? Могут ли быть магами только злые люди?"
 ev7.75.0.a:0 "Я оставлю это философам и теологам."
 ev7.75.0.b:0 "Поскольку это существует, Бог допускает это."
 ev7.75.0.c:0 "Цель оправдывает средства."
 ev7.75.0.d:0 "И что с того?"
 ev7.75.0.e:0 "Добро и зло – это всего лишь философские концепции."
 ev7.75.0.f:0 "Я найду способ быть добрым."
 ev7.75.0.f_ct:0 "Проведение Магического Ритуала [decision|E] отключено навсегда."
 ev7.75.0.f_ct2:0 "Удержание Мистического Общения [decision|E] может восстановить насыщение силой."
 ev7.75.0.g:0 "Я – злодей этой истории."
 ev7.75.0.h:0 "Магия — это благословение от [ROOT.Char.GetFaith.WitchGodName]."
 plague_spell_ct2:0 "Чума начнется."
 mages_summit:0 "Собрание магов"
 mages_summit_desc:0 "Маги и ведьмы со всего мира соберутся для обсуждения."
 MAY_CALL_MAGE_SUMMIT:0 "У вас должен быть более высокий уровень славы или вы должны быть легендарным магом."
 mages_summit_host_desc:0 "V1@Participants может получить [prestige|E]\nV2@Participants может получить знание и навыки\nV3@May приведут к магическим дуэлям\nV4@Participants примут участие в совете магов"
 mages_summit_guest_desc:0 "V1@Participants может получить [prestige|E]\nV2@Participants может получить знание и навыки\nV3@May приведут к магическим дуэлям\nV4@Participants примут участие в совете магов"
 mages_summit_province_desc:0 "Это подходящее место для Собрания магов."
 mages_summit_destination_selection:0 ""
 mages_summit_selection_tooltip:0 "Созовите совет магов."
 mages_summit_guest_help_text:0 "Конечно, магов следует пригласить, но возможно, что некоторые другие ведьмы тоже должны присутствовать на собрании."
 activity_invite_rule_mages:0 "Могущественные маги"
 activity_invite_rule_true_witches:0 "Истинные ведьмы"
 activity_invite_rule_other_magic:0 "Дворцовые 'маги' и другие теоретики"
 mages_summit_conclusion_desc:0 "[GetActivityType( 'mages_summit' ).GetName] завершилось"
 sharing_knowledge_intent:0 "Обмен знаниями"
 sharing_knowledge_intent_desc:0 "Сосредоточьтесь на обмене знаниями и информацией о магии. Ищите партнеров, наставников или учеников."
 political_matters_intent:0 "Дипломатические дела"
 political_matters_intent_desc:0 "Попробуйте расширить свое влияние, получить зацепки и узнать потенциальных союзников."
 show_superiority_intent:0 "Проявите превосходство"
 show_superiority_intent_desc:0 "Вы самый могущественный маг в мире, и другие должны это признать. Найдите способ продемонстрировать им свою силу и гений."
 prelude_phase:0 "Банкет"
 prelude_phase_desc:0 "Это возможность поговорить и немного расслабиться."
 meeting_phase:0 "Совет Магов"
 meeting_phase_desc:0 "Официальная часть саммита магов."
 options_security:0 "Меры безопасности"
 options_security_desc:0 "Такое событие должно быть особенно защищено."
 option_security_1:0 "Минимальные"
 option_security_1_desc:0 "Ваших охранников должно быть достаточно."
 option_security_2:0 "Экстраординарные"
 option_security_2_desc:0 "Следует привлечь дополнительных охранников, включая квалифицированных ведьм и рыцарей — конечно, они должны быть доверенными и надежными людьми."
 funds_for_searching_options:0 "Средства для поиска"
 funds_for_searching_options_desc:0 "Дополнительное золото может предоставить дополнительную информацию."
 funds_for_searching_option1:0 "Экономический вариант"
 funds_for_searching_option1_desc:0 "Без дополнительных средств."
 funds_for_searching_option2:0 "Увеличенное финансирование"
 funds_for_searching_option2_desc:0 "Вы получите дополнительный прогресс в качестве стартового бонуса."
 ev7.76.desc:0 "Начинается менее официальная часть встречи. Гости могут немного поговорить и расслабиться после путешествия. Многие из них приехали со всей свитой, и в замке сейчас много людей. Это не только маги и их спутники, но и обычные ведьмы и мистики различного уровня инициации, вероятно, не все из них достойны быть среди истинных магов."
 ev7.76.a:0 "Все заинтересованные стороны приветствуются."
 ev7.76.b:0 "Пиршество и развлечение скроют истинную природу этой встречи."
 ev7.76.c:0 "Пусть стражники проверят, что у всех есть приглашения."
 ev7.76.c_ct:0 "Гости могут отреагировать..."
 ev7.77.desc:0 "Вы видите, что ваши стражники выгоняют незваного гостя. Мужчина восклицает, что он уважаемый алхимик и имеет право быть здесь."
 ev7.77.a:0 "Хорошо, пусть он останется."
 ev7.77.b:0 "Только маги имеют право быть здесь."
 ev7.77.c:0 "Место для таких людей, как он, в подземельях."
 ev7.77.d:0 "На самом деле, мы можем начать банкет с публичной пытки."
 ev7.78.desc:0 "Когда стражники начали проверять гостей, один из них начал убегать - ему удалось ранить двух стражников, прежде чем его поймали. Это охотник на ведьм..."
 ev7.78.a:0 "Заберите [whunter0.GetHerHim]."
 ev7.78.b:0 "Так мы начнем с казни."
 ev7.79.desc:0 "Вы видите, что стражники привели какого-то мужчину, вероятно, одного из гостей, к [aowner.GetTitledFirstName]. Вы слышите шепот вокруг, что этот мужчина на самом деле охотник на ведьм, который смог пробраться сюда. Через некоторое время [aowner.GetTitledFirstName] тихо сказал что-то, и поток силы вырвался из руки [aowner.GetHerHis], сжигая охотника. Некоторые гости начали аплодировать, в то время как другие с опаской смотрели."
 ev7.79.a:0 "Потрясающе!"
 ev7.79.b:0 "Вот и все с официальным открытием."
 ev7.79.c:0 "Это ужасно..."
 ev7.80.a:0 "Я собираюсь немного повеселиться."
 ev7.80.b:0 "Я надеялся на более приятную компанию."
 ev7.80.c:0 "Я собираюсь немного осмотреться здесь."
 ev7.81.desc:0 "Вам стало известно, что [host.GetTitledFirstName] планирует крупное событие - саммит магов. Маги и колдуны со всего мира соберутся там, чтобы обсудить магию и политику. Вы не можете пропустить такое событие."
 ev7.81.a:0 "Я подумаю над этим."
 ev7.81.a_ct:0 "Вы можете присутствовать на саммите магов."
 ev7.82.title:0 "Великий Ритуал?"
 ev7.82.desc:0 "В какой-то момент капитан стражи сообщил, что под стенами замка происходит что-то странное. Когда вы пошли проверить это, оказалось, что группа колдунов решила воспользоваться возможностью провести великий ритуал."
 ev7.82.a:0 "Слава [ROOT.Char.GetFaith.WitchGodName]!"
 ev7.82.b:0 "Могу я присоединиться?"
 ev7.82.c:0 "Примитивные глупцы, я не приглашу их снова."
 ev7.82.d:0 "Идиоты привлекут охотников на ведьм. Стража!"
 ev7.83.desc:0 "Вы видите, что несколько колдунов собираются вокруг Бабы Яги, слушая какую-то историю. Вы решаете подойти и тоже послушать, что скажет старая колдунья."
 ev7.83.desc2:0 "\n'...Рогатый Бог? Да, я встречала его однажды, давно, когда была новичком-ведьмой. Это было во время грандиозного ритуала. Мой ковен решил сделать необычное предложение — жертву человека. Они выбрали меня. Рогатый Бог явился лично и увёл меня в своё царство.'"
 ev7.83.a:0 "А что было дальше?"
 ev7.84.desc:0 "'Я встречала много злых людей и демонов в своей жизни, но Рогатый Бог — это невероятный ублюдок. Прошло 100 лет, а я всё ещё мечтаю о том, что он сделал со мной. В конце концов, ему стало со мной скучно, и он отправил меня обратно на землю. Однако перед этим он рассказал мне много тайн и дал свою «благословение». Вернувшись, я смогла очистить ковен и начать заново. Однажды я снова встречу Рогатого Бога, и на этот раз именно он будет страдать. Я готова к этому.'"
 ev7.84.a:0 "Ну... довольно интересная история."
 ev7.84.b:0 "У меня были похожие приключения..."
 ev7.84.b_1:0 "Ты рассказал хорошую историю."
 ev7.84.b_2:0 "Твои похвальбы не произвели впечатления."
 ms_guest_important_event:0 "Это очень важное событие: $VALUE|=+0$"
 ev7.85.title:0 "Фонд борьбы с демонами"
 ev7.85.desc:0 "Один из магов подходит к тебе, ты думаешь, что у него есть о чем поговорить. \n 'Демоны становятся растущей проблемой по всему миру. По этой причине я решил создать Фонд борьбы с демонами. Каждый может пожертвовать золото и таким образом финансировать борьбу с демонами. Фонд также будет выплачивать награды всем, кто сможет убить или изгнать демона.'"
 ev7.85.a:0 "Я поддерживаю эту инициативу."
 ev7.85.a_ct:0 "Ты будешь получать золото каждый раз, когда убьешь демона."
 ev7.85.b:0 "Можешь рассказать мне больше о демонах?"
 ev7.85.c:0 "Меня это не интересует."
 ev7.85.d:0 "Как будущий архимаг, я должен вмешаться в это."
 ev7.85.d2:0 "Как архимаг, я должен вмешаться в это."
 ev7.85.e:0 "Услуга за услугу."
 ev7.85.f:0 "Неправильный адрес."
 ev7.85.f_ct:0 "Ты бросишь ублюдка на стену."
 ev7.87.title:0 "Магия на продажу"
 ev7.87.desc:0 "Вдруг один из гостей деликатно открывает свой плащ перед вами, показывая разнообразные зелья и эликсиры. 'Заинтересованы?' - спрашивает ведьма - 'Это подлинные смеси, созданные мной.'"
 ev7.87.a:0 "Может, у вас есть какие-то интересные книги или свитки?"
 ev7.87.b:0 "Нет, спасибо."
 ev7.88.title:0 "Бремя славы"
 ev7.88.desc:0 "Когда вы двигались среди гостей, вас неожиданно окружили две молодые ведьмы. Кажется, их очаровал тот факт, что у них есть возможность встретить настоящего мага. Вы чувствуете, что они выполнит ваше каждое желание."
 ev7.88.a:0 "Я думаю, одна из вас может стать моим помощником..."
 ev7.88.b:0 "Дамы, позвольте мне показать вам настоящую магию."
 ev7.88.c:0 "Вы определенно можете мне помочь."
 ev7.88.d:0 "Кто впустил вас? Здесь не место обычным ведьмам."
 ev7.89.title:0 "Новые знания"
 ev7.89.desc:0 "Слушая разговоры между магами и ведьмами, вы узнаете много нового. Мир полон тайн, и вы изучаете их все больше."
 ev7.89.a:0 "Я могу это использовать."
 ev7.90.desc:0 "Собрание магов - отличное время, чтобы найти наставника. [actor.GetTitledFirstName] кажется отличным кандидатом на роль учителя. Однако, согласится ли [actor.GetSheHe] поделиться знаниями [actor.GetHerHis]?"
 ev7.90.a:0 "В конце концов, я заплачу..."
 ev7.90.a_ct:0 "Маг рассмотрит ваше предложение."
 ev7.90.b:0 "Может быть, большая сумма убедит [actor.GetHerHim]?"
 ev7.90.c:0 "Если [actor.GetSheHe] согласится, я одарю [actor.GetHerHim] золотом."
 ev7.91.desc:0 "Во время банкета [recipient.GetTitledFirstName] подходит к вам. [recipient.GetSheHe|U] кажется хочет учиться магии и видит в вас [recipient.GetHerHis] учителя. [recipient.GetSheHe|U] предлагает много золота, только если вы поделитесь секретами магии с [recipient.GetHerHim]."
 ev7.91.a:0 "Что ж, [recipient.GetSheHe] станет моим учеником."
 ev7.91.a_ct:0 "Вы соглашаетесь быть наставником."
 ev7.91.a_ct2:0 "Вы начинаете практиковать магию."
 ev7.91.b:0 "Нет, у меня уже слишком много работы."
 ev7.91.c:0 "Я не вижу потенциала для обучения здесь."
 ev7.91.a_ct3:0 "Маг отказался."
 ev7.92.desc:0 "Вы и некоторые гости организовали дебаты о теории магии. Вы узнали много нового и смогли взглянуть на знакомые вещи с новой точки зрения."
 ev7.92.a:0 "Это просветительная дискуссия."
 ev7.92.b:0 "Эта информация также будет полезна мне в других делах."
 ev7.93.title:0 "Непринужденная беседа"
 ev7.93.desc:0 "Вы и [guest0.GetTitledFirstName] прекрасно пообщались. Когда вы перевели разговор на политические темы, выяснилось, что у вас обоих есть общие интересы. Вы можете помочь друг другу."
 ev7.93.a:0 "Это начало плодотворного сотрудничества."
 ev7.93.b:0 "Нам следует сразу же заключить соглашение."
 ev7.93.c:0 "Я убедю [guest0.GetHerHim] поддержать меня."
 ev7.94.title:0 "Вот-вот начнется..."
 ev7.94.desc:0 "Среди присутствующих можно заметить волнение и интерес к предстоящей сессии. Многие люди задаются вопросом, какая будет основная тема встречи."
 ev7.94.a:0 "Я заверю присутствующих, что подниму важные вопросы."
 ev7.94.b:0 "У меня еще есть время, чтобы заручиться поддержкой моих постулатов."
 gathered_supporters:0 "Собравшиеся сторонники"
 ev7.94.c:0 "Я распространю слухи."
 ev7.94.d:0 "Это возможность поговорить с [guest0.GetTitledFirstName]."
 ev7.95.title:0 "Магия и политика"
 ev7.95.desc:0 "Вы подошли к группе магов, обсуждающих политику и глобальную ситуацию. Кажется, что у каждого волшебника свое мнение, но здесь также формируются фракции и группы с общими интересами."
 ev7.95.a:0 "Я выберу сторону."
 ev7.95.b:0 "Я останусь нейтральным."
 ev7.95.c:0 "Магам следует объединиться.... Под моим руководством."
 ev7.95.d:0 "Я использую напряженность в своих интересах."
 ev7.95.e:0 "Я могу быть миротворцем, если это потребуется."
 ev7.96.title:0 "Демонстрация магических умений"
 ev7.96.desc:0 "Некоторые гости обладают минимальными магическими способностями, в то время как немногие, кто действительно владеет магией, сомневаются в ваших способностях. Пора показать им всю свою истинную силу."
 ev7.96.a:0 "Время продемонстрировать свои заклинания."
 ev7.96.b:0 "Я представлю свой магический артефакт."
 ev7.96.c:0 "Я расскажу всем о своих достижениях."
 ev7.96.d:0 "Общество моих нежити выполнит свою задачу."
 ev7.96.e:0 "Сейчас не подходящее время."
 ev7.96.f:0 "Я покажу им, на что способен демон."
 ev7.97.desc:0 "Ваша репутация может вырасти, если вы победите другого мага в дуэли на глазах у всех. [mage0.GetTitledFirstName] кажется подходящей целью. Если [mage0.GetSheHe] откажется при свидетелях, другие маги перестанут уважать [mage0.GetHerHim]."
 ev7.97.a:0 "Я вызову [mage0.GetHerHim] на дуэль."
 ev7.97.a_ct:0 "Маг ответит на ваш вызов... или нет."
 ev7.97.b:0 "Я просто начну оскорблять [mage0.GetHerHim]."
 ev7.98.desc:0 "[challenger.GetTitledFirstName] решил вызвать вас на duel! [challenger.GetSheHe|U] требует магического поединка, боя на смерть. Если вы откажетесь с таким количеством свидетелей, ваша репутация пострадает."
 ev7.98.a:0 "Не думаю, что сегодня готов к дуэлям."
 ev7.99.desc:0 "Вы разговариваете с одним из гостей о демонах. В какой-то момент ваш собеседник пошутил, что обсуждать эту тему было бы гораздо проще, если бы вы вызвали демона. Конечно, такое призывание без защитного круга было бы очень рискованным..."
 ev7.99.a:0 "Я могу призвать его и сразу же отпустить назад."
 ev7.99.a_1:0 "Вы сразу отправляете демона обратно после призыва."
 ev7.99.a_ct:0 "Демон атакует вас, прежде чем вы сможете отправить его обратно."
 ev7.99.b:0 "Хорошая шутка, мне ты нравишься!"
 ev7.100.desc:0 "В определённый момент к вам подходит человек... нет, не человек! Вы его узнали, это Маммон! Он выглядит немного иначе, но это точно он. \n 'Какой-то дурак призвал меня' - заявляет демон - 'Я пощадил его, чтобы не портить вашу вечеринку. Могу я присоединиться? Обещаю вести себя хорошо'."
 ev7.100.a:0 "Конечно, что может пойти не так?"
 ev7.100.b:0 "Думаю, я отправлю тебя в ад."
 ev7.101.desc:0 "Официальная часть начинается. Сначала ассамблея должна выбрать Спикера, который будет вести заседание."
 ev7.101.a:0 "Конечно, я выдвину свою кандидатуру."
 ev7.101.b:0 "Интересно, кто станет Спикером?"
 ev7.101.b_ct:0 "Ты не станешь Спикером."
 ev7.101.c:0 "Кажется, никто не принимает меня во внимание."
 ev7.101.a_ct1:0 "У тебя #P хорошие#! шансы стать Спикером."
 ev7.101.a_ct2:0 "У тебя средние шансы стать Спикером."
 ev7.101.a_ct3:0 "У вас #N мало#! шансов стать Спикером."
 ev7.102.title:0 "Спикер"
 ev7.102.desc:0 "Собрание выбрало вас Спикером этого саммита. Это великая честь и ответственность."
 ev7.102.a:0 "Я торжественно открываю заседание совета магов."
 ev7.102.b:0 "Это событие войдет в историю."
 ev7.103.desc:0 "Собрание выбрало [speaker0.GetTitledFirstName] Спикером. [speaker0.GetSheHe|U] будет тем, кто возглавит заседание совета в этом году."
 ev7.103.a:0 "Интересный выбор."
 ev7.104.title:0 "Речь"
 ev7.104.desc:0 "Время для вашей речи. Это также хорошее время указать на темы, которые вас больше всего интересуют."
 ev7.104.a:0 "Магия. Что это на самом деле? Каким правилам она подчиняется?"
 ev7.104.b:0 "Нам нужно увеличить сотрудничество, это критически важно для нашего общества."
 ev7.104.c:0 "Мы собрались здесь, потому что у нас общие интересы... и враги."
 ev7.104.d:0 "Я стою здесь перед вами как лучший среди вас..."
 ev7.104.e:0 "Друзья, мы сталкиваемся с множеством проблем, которые больше не можем игнорировать."
 ev7.104.f:0 "История всех существующих обществ — это история классовых конфликтов..."
 ev7.104.g:0 "Начнем с того, что вы — кучка идиотов..."
 ev7.105.desc:0 "Процесс начался. Некоторые участники поднимают различные вопросы, в то время как другие выдвигают темы, которые кажутся совершенно неуместными. В конце концов, как Спикер, вы решите, о чем будет голосование. Однако, будет ли требование выполнено, зависит от поддержки, которую вы соберете."
 ev7.105.a:0 "Мы разработаем совместную программу магических исследований."
 research_cooperation:0 "Сотрудничество в области исследований"
 ev7.105.b:0 "Мы все подпишем совместныйpakt о взаимной обороне."
 ev7.105.b_ct:0 "Присоединится к пакту о взаимной обороне."
 ev7.105.b_ct3:0 "Вы присоединитесь к пакту о взаимной обороне."
 ev7.105.b_ct2:0 "Участники смогут поддерживать друг друга в оборонительных войнах."
 ev7.109.title:0 "Пакт обороны"
 ev7.105.c:0 "Нам нужен архимаг — я выдвигаю себя на эту ответственную роль!"
 ev7.105.c_ct:0 "Архимаг имеет больше шансов стать Спикером в будущем."
 ev7.105.c_ct2:0 "Архимаг имеет доступ к дополнительным опциям в качестве Оратора."
 ev7.105.d:0 "В качестве архимага мне нужно собрать средства, чтобы обеспечить вашу безопасность."
 ev7.105.e:0 "Мы должны запретить использование черной магии."
 ev7.105.e_ct:0 "Проклятия, мощные проклятия и заклинания подчинения #N запрещены#!."
 ev7.105.e_ct2:0 "Если их использование будет обнаружено, репутация правонарушителя пострадает, другие маги могут получить претензии и основание для тюремного заключения."
 ev7.105.f:0 "Обычные правители станут нашими марионетками. Давайте разработаем план..."
 joint_intrigues:0 "Совместная сеть шпионов"
 ev7.105.g:0 "[target1.GetTitledFirstName] является угрозой и должна быть устранена."
 ev7.105.g_ct:0 "Собрание будет использовать магию или интриги для устранения цели."
 death_sentence:0 "Приговор к смерти"
 ev7.105.h:0 "[target2.GetTitledFirstName] следует исключить из нашего сообщества."
 ev7.105.i:0 "Мне нужна ваша сила, чтобы подготовить мощное заклинание. Для общего блага..."
 ev7.105.i_ct:0 "Оратор сможет наложить #italic Универсальное заклинание#! один раз ([decision|E])."
 ev7.105.i_ct2:0 "Собрание перенесет свою насыщенность силой или жизненную силу на Оратора."
 excluded_from_magic_community:0 "Изгнанник"
 mage_summit_excluded_terrain_cancel_negative_supply:0 "Не может быть приглашен на Собрание Магов"
 ev4b.0.d:0 "Я чувствую, что [magic_user.GetSheHe] наложил запрещенное заклинание."
 use_black_magic_opinion:0 "Использовались запрещенные заклинания"
 ms_if_succeded_desc:0 "Если голосование #P будет успешным#!:"
 ev7.106.desc:0 "Собрание собирается голосовать по вашему предложению. К сожалению, не все выглядят убежденными."
 ev7.106.a:0 "Я надеюсь, что они меня поддержат."
 ev7.106.b:0 "Я напомню другим об их обязанностях."
 ev7.106.b_ct:0 "Вы можете получить дополнительную поддержку за счет имеющихся у вас это."
 ev7.107.desc:0 "Дебаты продолжаются уже долго, и многие люди высказали свои мнения по многим темам. Не все темы показались вам интересными, но некоторые привлекли ваше внимание. Сессия движется к завершению, и Спикер решил вынести одну из идей на голосование."
 ev7.107.b:0 "Это плохая идея."
 ev7.107.c:0 "Я не маг и даже не истинная ведьма, я не могу голосовать в любом случае."
 ms_vote_yes_ct:0 "Вы проголосуете #P ДА#!"
 ms_vote_no_ct:0 "Вы проголосуете #N НЕТ#!"
 mage_summit_log_yes_title:0 "Голосование было #P успешным#!."
 mage_summit_log_no_title:0 "Голосование #N провалилось.#!"
 mage_summit_log_yes_count:0 "#P ДА#! голоса: #P [speaker0.MakeScope.Var('ms_vote_yes').GetValue]#!"
 mage_summit_log_no_count:0 "#N НЕТ#! голоса: #N [speaker0.MakeScope.Var('ms_vote_no').GetValue]#!"
 ev7.109.desc:0 "Вы получили информацию о том, что [defender.GetTitledFirstName] был атакован. Ваш пакт взаимной обороны обязывает вас поддержать [defender.GetHerHim]."
 ev7.109.a:0 "Конечно, я помогу [defender.GetHerHim]."
 ev7.109.b:0 "Никто не уточнил, какую именно поддержку я должен оказать."
 ev7.109.c:0 "Я вынужден сказать нет."
 ev7.109.c_ct:0 "Разорвать пакт взаимной обороны."
 ev7.109.c_ct2:0 "Разрыв обязательств."
 empty1_desc:0 ""
 ev6.75.title:0 "Аль-Хазред остановлен!"
 ev6.75.ct:0 "Теперь вы самый могущественный маг в мире..."
 ev7.110.desc:0 "Ассамблея вынесла приговор [target1.GetTitledFirstName]. Согласно приказу, каждый должен попытаться устранить цель."
 ev7.110.a:0 "Ну, я воспользуюсь магией..."
 ev7.110.b:0 "Мы сделаем это классически."
 ev7.110.c:0 "Я принужу [target1.GetHerHim] к магическому дуэлю."
 ev7.111.title:0 "Поиск поддержки"
 ev7.111.desc:0 "В связи с предстоящей встречей у вас есть несколько идей, которые ассамблея должна обсудить. Однако ваши предложения потребуют поддержки других участников, чтобы стать чем-то большим, чем просто ваши желания. [mage0.GetTitledFirstName] кажется тем, кого вы могли бы убедить в своей точке зрения."
 ev7.111.a:0 "Есть простой способ убедить [mage0.GetHerHim]."
 ev7.111.a_ct:0 "Если вы станете Говорящим, ваш проект получит дополнительную поддержку."
 ev7.111.b:0 "Может быть, [mage0.GetSheHe] сможет помочь мне в обмен на услугу?"
 ev7.111.c:0 "Золото — это ответ."
 ev7.111.d:0 "Я думаю, что найду способ это сделать."
 ev7.111.e:0 "Это трата времени."
 ev7.111.f:0 "Неважно, давайте поговорим о магии!"
 ev3.22.d:0 "Специальный проект."
 ev3.22.d_ct:0 "Будет разработан [magic_special_project|E]."
 ME_YOU_HAVE_THEM_ALL:0 "Вы провели все возможные исследования."
 ME_DONT_HAVE_SPECIAL_PROJECTS:0 "В настоящее время у вас нет специального проекта для разработки."
 ev3.22.a3_ct:0 "Вы можете разблокировать случайный [magic_special_project|E]."
 ev3.22.a4_ct:0 "У вас #P высокая#! вероятность разблокировать [magic_special_project|E]."
 ev3.22.a5_ct:0 "У вас #N низкая#! вероятность разблокировать [magic_special_project|E]."
 trait_golem:0 "Голем"
 trait_golem_desc:0 "Продукт продвинутого магического инжиниринга. Совершенная имитация человека, но лишенная истинной души."
 #trait_immortal1:0 "Immortal"
 #trait_immortal1_desc:0 "Through powerful magic, this wizard was able to stop his aging process."
 #trait_immortal2:0 "Cursed Forever"
 #trait_immortal2_desc:0 "As a result of Yaga's powerful curse, this character cannot die naturally."
 ev10.0.g:0 "Пусть [reci.GetSheHe] будет проклят навсегда."
 immune_for_illness_terrain_cancel_negative_supply:0 "Иммунен к болезням"
 ev7.112.desc:0 "Сейчас время рассмотреть ваш специальный проект."
 ev7.113.desc:0 "Во время проведения исследований к вам пришли новые идеи. Возможно, это что-то стоящее для изучения."
 ev7.113.a:0 "Я рассмотрю это в будущем."
 ev7.113.b:0 "Это всего лишь абстрактная теория."
 game_concept_magic_special_project:0 "Специальный проект"
 game_concept_magic_special_project_desc:0 "Маги могут разрабатывать специальные проекты в рамках своих магических исследований. Новый специальный проект может быть разблокирован во время написания elaboration или в результате случайных событий. Некоторые специальные проекты требуют дополнительных условий для разблокировки."
 me_golem_project_ct:0 "Вы разблокировали #italic Искусственного человека#! [magic_special_project|E]"
 me_golem_option:0 "Искусственный человек"
 me_immortality_project_ct:0 "Вы разблокировали #italic Вечную жизнь#! [magic_special_project|E]"
 legendary_mage_terrain_cancel_negative_supply:0 "Разблокирует #italic Вечную жизнь#! [magic_special_project|E]"
 me_immortality_option:0 "Вечная жизнь"
 me_death_project_ct:0 "Вы разблокировали #italic Обмануть смерть#! [magic_special_project|E]"
 me_death_option:0 "Обмануть смерть"
 me_ascendency_project_ct:0 "Вы разблокировали #italic Превосходство#! [magic_special_project|E]"
 me_ascendency_option:0 "Превосходство"
 me_soul_project_ct:0 "Вы разблокировали #italic Перенос души#! [magic_special_project|E]"
 me_soul_option:0 "Перенос души"
 me_castle_project_ct:0 "Вы разблокировали #italic Летающий замок#! [magic_special_project|E]"
 flying_castle_modifier:0 "Летающий замок"
 me_sing_project_ct:0 "Вы разблокировали #italic Улучшение Древней Сингулярности#! [magic_special_project|E]"
 me_sing_option:0 "Улучшение Древней Сингулярности"
 devils_servant_modifier:0 "Слуга Дьявола"
 ev7.114.desc:0 "Сначала подготовьте план, ищите источники и сделайте необходимые расчеты. В данный момент вы даже не уверены, с чего начать, хотя прогресс, похоже, лишь вопрос времени."
 ev7.114.a:0 "Я буду тщательным."
 ev7.114.b:0 "Я не усну, пока не сделаю это."
 ev7.115.desc:0 "В ходе вашей работы вы столкнулись с серьезной проблемой. Из ваших последних расчетов видно, что завершить проект может не получиться. Возможно, вы где-то ошиблись, или это просто невозможно."
 ev7.115.a:0 "Я сделаю расчеты еще раз."
 ev7.115.b:0 "Ну, я все равно продолжу."
 ev7.115.c:0 "Да, это ошибка, я уже вижу это."
 ev7.115.a_ct:0 "Ваша работа может #N провалиться#!"
 ev7.116.desc:0 "К сожалению, ваш специальный проект оказался тупиком. Вы не можете реализовать его согласно вашему плану - возможно, это просто невозможно."
 ev7.116.a:0 "Мне еще многому предстоит научиться."
 ev7.116.a_ct:0 "Ваш [magic_special_project|E] потерпел #N неудачу#!."
 ev7.117.desc:0 "Наконец-то! Ваша работа над"
 ev7.117.desc2:0 "подошла к концу. Еще одна загадка решена, еще одно произведение достигнуто."
 ev7.117.a:0 "Вот моя судьба."
 ev7.117.b:0 "То, что уже мёртво, не может умереть."
 ev7.117.c:0 "Пора садиться на диету."
 ev7.117.c_ct:0 "Каждый пожранный ребёнок продлит вашу жизнь на 10 лет."
 ev7.117.d:0 "Ни одна армия не может завоевать летающий замок."
 ev7.117.e:0 "Думаю, я стану... ещё более неуязвимым."
 ev7.117.f:0 "Я могу быть... кем угодно."
 ev7.117.f_ct:0 "Вы открыли заклинание #italic Перенос Души#! ([interaction|E])."
 ev7.117.z:0 "Нет, я не могу это сделать."
 ev7.118.desc:0 "Это заключительная стадия производства голема. Тем не менее, необходимо решить одну 'проблему' с дизайном."
 ev7.118.a:0 "Я создам человека."
 ev7.118.b:0 "Я создам женщину."
 ev7.119.desc:0 "Наконец-то! Ваше сооружение завершено! Это великолепно..."
 ev7.119.a:0 "Оно живо!"
 golem_name:0 "Титан"
 golem_name2:0 "Кристалл"
 HAS_NO_SOUL_CUSTOM:0 "Вы продали свою душу, так что не можете её перенести..."
 soul_transfer_spell:0 "Перенос души"
 soul_transfer_spell_desc:0 "Отправьте свою душу в другое тело..."
 soul_transfer_spell_ct:0 "Ваша душа и разум будут перенесены в тело цели."
 soul_transfer_spell_ct2:0 "Вы перенесёте личность, но не физические черты."
 ST_ALSO_ARTIFACTS:0 "Перенос артефактов"
 ev7.120.title:0 "Улучшение Голема"
 ev7.120.desc:0 "Вы вполне довольны своим големом, но видите, что есть ещё вещи, которые можно улучшить."
 ev7.120.a:0 "Я буду работать над [golem.GetHerHis] разведкой."
 ev7.120.b:0 "Мне нужно улучшить боевую способность."
 ev7.120.c:0 "Как насчет установки магического генератора? Это имеет смысл?"
 ev7.120.d:0 "Я не буду себя ограничивать."
 ev7.121.desc:0 "Во сне ты видишь приближающуюся горящую фигуру. Ты чувствуешь, что это сама смерть, требующая тебя, монструозность, с которой не может столкнуться ни один смертный. Последнее, что ты помнишь, это ужасный голос, говорящий: 'Я иду за тобой.'"
 ev7.121.a:0 "Это всего лишь сон..."
 triangulation_terrain_cancel_negative_supply:0 "Магическая триангуляция показывает артефакт на твой выбор."
 ev7.122.desc:0 "Твоя искусность в магии достаточно высока, чтобы ты мог точно откалибровать свое заклинание сканирования."
 necro_chapter1:0 "Некрономикон - Глава 1."
 necro_chapter2:0 "Некрономикон - Глава 2."
 necro_chapter3:0 "Некрономикон - Глава 3."
 necro_chapter4:0 "Некрономикон - Глава 4."
 necro_chapter5:0 "Некрономикон - Глава 5."
 necro_chapter_desc1:0 "'Меня зовут Абдул Аль-Хазред, и я самый могущественный маг этого мира. Говорят, что я безумец, но даже если это правда, это не высокая цена за ту силу, которая у меня есть. Другие отдали гораздо больше в обмен на гораздо меньшее. Если ты читаешь эти слова, значит, я покинул этот мир, как и многие до меня. Не знаю, вернусь ли я. Пусть эта книга станет путеводителем для поколений будущих магов.'"
 necro_chapter_desc2:0 "'У магии есть своя цена. Это неестественное состояние - люди были созданы таким образом, что использование силы затруднительно. Возможно, мы были созданы как эксперимент, или, возможно, как раса слуг, предназначенная для самых простых задач и рабского труда. Мне не удалось связаться с нашим создателем, но, возможно, мое следующее путешествие принесет новые ответы.'"
 necro_chapter_desc3:0 "'Во вселенной есть как минимум три звезды, где рождаются боги. Эти звезды также являются источником магии - каждый мир в их пределах позволяет своим обитателям использовать магические силы. Наш мир находится в досягаемости одной из них, но, согласно моим расчетам, примерно через 600 лет мы удалимся слишком далеко, и магия исчезнет на очень долгий срок, возможно, навсегда. Это еще одна причина покинуть этот мир.'"
 necro_chapter_desc4:0 "' demons были созданы как слуги богов, но многие из них восстали и провозгласили себя богами. Конечно, у них нет истинной силы Творения и Разрушения, но для обычных людей, в основном лишенных магических способностей, они могут казаться богами. Однако большинство из них не может свободно путешествовать между мирами - их необходимо вызвать заклинанием или силой контракта, который они подписали с смертным.'"
 necro_chapter_desc5:0 "'Боги - странные существа. Их мотивации никогда не напоминают человеческие или даже демонские. Это ужасает даже меня. Я могу двигать горы и укрощать демонов, но не знаю, смог бы я справиться с одним из меньших божеств. К счастью, они не интересуются нашим миром, у них есть свои дела и свои тайны. Хотя одно из них здесь, но оно находится в летаргии где-то на дне океана. Пока что это не представляет угрозы.'"
 ev7.124.a:0 "Больше тайн в моих руках."
 pot8:0 "Зелье силы"
 pot8_desc:0 "Это зелье временно увеличивает магические и физические силы."
 gain_pot8_ct:0 "Вы получаете Зелье силы"
 drink_pot8_decision:0 "Использовать Зелье силы"
 drink_pot8_decision_tooltip:0 "Это зелье временно увеличивает магические и физические силы."
 drink_pot8_decision_desc:0 "Это зелье временно увеличивает магические и физические силы."
 drink_pot8_decision_confirm:0 "Выпейте зелье."
 alchemical_enhancement:0 "Алхимическое улучшение"
 return_to_witchcraft_decision_title:0 "Назад к колдовству"
 return_to_witchcraft_decision_desc:0 "Отказаться от колдовства было ошибкой, которую вам нужно исправить."
 ev6.4.0.a:0 "Расскажи мне что-нибудь о магии."
 ev6.4.0.b:0 "Мне нужна ваша поддержка в моих интригах."
 ev6.9.desc3:0 "Так что, чего ты хочешь, маг?"
 ev7.125.desc:0 "Ты видишь, что демоница появилась перед тобой, но она выглядит не очень хорошо. Она едва стоит на ногах."
 ev7.125.a:0 "Нкса? Что случилось?"
 ev7.126.desc:0 "'Мой господин... недоволен нашими встречами. У меня есть предложение к тебе - если ты склонится перед ним, ты сможешь пользоваться моими услугами. В противном случае, я должна тебя убить.'"
 ev7.126.a:0 "Подожди минуту..."
 ev7.127.desc:0 "'Ты должен согласиться. Признай свою верность ему здесь и сейчас, тогда пострадает только твое гордость. Мой господин вряд ли захочет чего-либо от тебя в течение следующих тысяч лет, хотя он иногда непредсказуем. Если ты не согласишься, мы сразимся.'"
 ev7.127.a:0 "Пусть будет так, я буду служить твоему господину."
 ev7.127.b:0 "Извини, я не подчиняюсь никому."
 ev7.127.c:0 "Есть третий вариант. Присоединяйся ко мне и будь свободен."
 ev7.128.desc:0 "'Хороший выбор, ты избавил меня и себя от многих страданий. Если мой... наш господин будет нуждаться в тебе, я дам знать.'"
 ev7.128.a:0 "Ну, давайте перейдём к делу."
 legend_chronicle_legendary_mage:0 "Легенда о [ancestor.GetNameNoTooltip|U]"
 legend_chronicle_legendary_mage_desc:0 "Подвиги и сила [ancestor.GetNameNoTooltip|U] стали легендарными - мир должен признать [ancestor.GetHerHim] одним из самых могучих магов и правителей."
 legend_chapter_opening_mage:0 "В юности [ROOT.Legend.GetProtagonist.GetHerHis] был необычным человеком, выделяющимся среди остальных. Только самые близкие к [ROOT.Legend.GetProtagonist.GetHerHim] знали о причудливых интересах [ROOT.Legend.GetProtagonist.GetHerHis], но даже они не имели представления о мотивах и стремлениях, которые вели [ROOT.Legend.GetProtagonist.GetNameNoTooltip]."
 legend_chapter_motivation_mage:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] искал знания, истину и мудрость. Но не только это. Истинная сила, магия, способность подчинять законы физики воле [ROOT.Legend.GetProtagonist.GetHerHis] - вот что больше всего завораживало [ROOT.Legend.GetProtagonist.GetHerHim]. Или, по крайней мере, так гласили слухи."
 legend_chapter_discovery_mage:0 "Говорили, что [ROOT.Legend.GetProtagonist.GetNameNoTooltip] призывал демонов, общался с духами, владел могущественными силами природы. [ROOT.Legend.GetProtagonist.GetSheHe|U] окружала аура страха и мощи. В мире было мало тех, кто мог бы сравниться с [ROOT.Legend.GetProtagonist.GetHerHim], и это было даже до пика силы [ROOT.Legend.GetProtagonist.GetHerHis]."
 legend_chapter_conclusion_mage:0 "В конце концов, по крайней мере, некоторые слухи о [ROOT.Legend.GetProtagonist.GetNameNoTooltip] оказались правдой. Даже скептики не могут сомневаться в силе [ROOT.Legend.GetProtagonist.GetHerHis] и месте в истории, принадлежащем [ROOT.Legend.GetProtagonist.GetHerHim]."
 legend_magic_type:0 "Уникальная легенда"
