 get_all_magic_claims_ct:0 "Вы #P получаете права#! на все магические артефакты."
 mage_summit_enables_terrain_cancel_negative_supply:0 "Любой маг этого Дома может организовать Собрание Магов"
 hecate_support_modifier:0 "Поддержка от Гекаты"
 ev3.16.b:0 "...однако правила иногда можно нарушить."
 is_a_threat_opinion:0 "Это угроза"
 ev3.6.f:0 "Забери мою душу..."
 ev7.132.desc:0 "Это история о магии и демонах, о борьбе великих сил и невообразимых секретах, которые скрываются от глаз простых людей или даже правителей. Возможно, будущие поколения будут ставить под сомнение этот рассказ, но истинные ведьмы и маги всегда будут бояться имени [legend_protagonist.GetTitledFirstName]."
 ev7.133.title:0 "Финальная Калибровка"
 ev7.133.desc:0 "Ваш голем функционирует почти как обычный человек, но имеет потенциал для гораздо большего. Пора внести финальные корректировки и определить его цель. Какую роль он должен играть?"
 ev7.133.a:0 "Это мой герольд."
 ev7.133.b:0 "Мой рыцарь."
 ev7.133.c:0 "Мой секретарь."
 ev7.133.d:0 "Мой помощник."
 ev7.133.e:0 "Мой... теневой наместник."
 ev7.134.desc:0 "После наложения защитных заклинаний вам приходит в голову, что, возможно, вашим близким тоже нужна дополнительная защита. У вас достаточно силы для еще одного заклинания..."
 ev7.134.a:0 "Я должен защитить своего наследника."
 ev7.134.b:0 "Я должен думать о своём супруге."
 ev7.134.c:0 "[target0.GetTitledFirstName] нуждается в защите..."
 ev7.134.d:0 "Другой заклинание не нужно."
 ev7.135.title:0 "Знания на продажу"
 ev7.135.desc:0 "[wmage0.GetTitledFirstName] появилась при вашем дворе - вы знаете, что [wmage0.GetSheHe] также волшебник, вы слышали различные слухи о [wmage0.GetHerHim]. Похоже, что [wmage0.GetSheHe] имеет для вас предложение, [wmage0.GetSheHe] хочет продать вам книги с магическими знаниями. После поверхностного осмотра вы видите, что они действительно могут содержать ценную информацию."
 ev7.135.a:0 "Это не стоит такой цены."
 ev7.136.opening:0 ""
 ev7.136.desc:0 "Мне стало известно, что у вас есть предмет, который представляет для меня значительный интерес. Я готов предложить много золота в обмен на этот предмет. Надеюсь на быструю реакцию, прежде чем я передумаю."
 ev7.136.a:0 "Продано!"
 ev7.136.b:0 "Этот предмет бесценен."
 ev3.69.c2:0 "Время для заклинания изгнания."
 ev7.139.desc:0 "Вам удалось собрать много силы, которая вам подчиняется. Вы верите, что можете повлиять на мышление вашей жертвы. Хотя вы также можете использовать эту магию более разрушительным образом..."
 ev7.139.a:0 "Давайте попробуем это."
 ev7.139.b:0 "Как насчет другого способа?"
 ev7.139.c:0 "Я желаю [recipient.GetHerHis] смерти."

