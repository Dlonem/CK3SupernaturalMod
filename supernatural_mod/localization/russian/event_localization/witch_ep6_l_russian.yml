l_russian:
 ev7.1.title:0 "Темные Видения"
 ev7.1.desc:0 "В последнее время вам снятся странные сны. В них вы парите над неизвестными землями и видите существ, которые напоминают людей, но точно не являются таковыми. В этом сне вы чувствуете себя могущественным, способным на всё - вы знаете, что даже горы могут двигаться с вашим повелением. Однако это чувство быстро меняется. В дополнение к вашей растущей силе, вы также ощущаете тьму внутри себя. Тьма тянется к вам, и затем сон проходит, и вы просыпаетесь, покрытые потом."
 ev7.1.0.a:0 "Неприятный сон, я его не люблю."
 trait_source4:0 "Нестабильный Источник"
 trait_source0_desc:0 "Кажется, в этом человеке есть что-то особенное..."
 ev7.2.title:0 "Кто-то Особенный"
 ev7.2.desc:0 "Вы чувствуете, что в вас есть что-то странное. Вам иногда кажется, что вы слышите мысли других людей, вы также можете предсказать внезапное изменение погоды. Вы часто воспринимаете больше, чем другие, как будто обладаете каким-то дополнительным чувством. Прежде всего, однако, вы чувствуете силу внутри себя. Вы еще не понимаете её, но, возможно, однажды сможете её использовать."
 ev7.2.0.a:0 "Я особенный."
 ev7.2.0.b:0 "Мне интересно, что еще я могу сделать."
 ev7.2.0.c:0 "Уммм..."
 ev7.3.title:0 "Непобедимая магия"
 ev7.3.desc:0 "Вы недавно обнаружили, что можете делать много вещей, которые другие не могут. Когда вы сосредотачиваетесь, вам часто удается зажечь свечу одним лишь взглядом. Однажды вы подняли одну из своих игрушек в воздух силой воли! Однако это перестает быть крутым, когда вы заставили горничную исчезнуть - она растворилась в воздухе. Она исчезла без следа и ее никогда не нашли. Кроме того, в последнее время вам снятся плохие сны, и вещи вокруг вас могут загореться без причины."
 ev7.3.0.a:0 "Что со мной происходит?"
 ev7.4.title:0 "Странный ребенок"
 ev7.4.desc:0 "[schild.GetTitledFirstName] - странный ребенок. Слуги боятся [schild.GetHerHim], и вы также слышали, что странные вещи происходят, когда рядом [schild.GetSheHe]. Предметы движутся сами по себе, слышны странные звуки, недавно даже был пожар. Когда приближается [schild.GetTitledFirstName], часто становится холоднее или гораздо теплее, без причины. Возможно, с этим нужно что-то сделать..."
 ev7.4.0.a:0 "Мне нужно найти подходящего опекуна."
 ev7.4.0.b:0 "Ребёнок проклят. Ему не место здесь."
 ev7.4.0.c:0 "Пусть священники решают."
 ev7.4.0.d:0 "Я знаю заклинание печати, которое может помочь."
 ev7.6.title:0 "Магическая Эрупция"
 ev7.6.desc:0 "В какой-то момент ты чувствуешь, как сила поднимается внутри тебя. Она требует освобождения! Всё, что ты можешь сделать, это выбрать направление выстрела..."
 ev7.6.0.a:0 "Я не могу... остановить... это..."
 ev7.6.0.b:0 "Оно приближается...!"
 ev7.6.0.c:0 "Я попробую... там..."
 ev7.7.desc:0 "Ты чувствуешь силу внутри себя, у которой нет выхода. Боль растет с каждой passing моментом, ты видишь вспышки света вокруг себя и разряды магической энергии. Ты не знаешь, что делать, ты чувствуешь себя потерянным."
 ev7.7.0.a:0 "[resper.GetTitledFirstName], помоги мне!"
 ev7.7.0.b:0 "Я не собираюсь умирать так!"
 ev7.7.0.a_ct:0 "Может произойти магическая эрупция."
 ev7.8.desc:0 "Ты слышишь крики в замке, кто-то зовёт твоё имя. Это оказывается [mchild.GetTitledFirstName]. Вокруг [mchild.GetHerHim] ты видишь вспышки света и предметы, плавающие в воздухе. С каждым моментом всё сияет всё ярче, и у тебя возникает чувство, что что-то плохое вот-вот произойдёт."
 ev7.8.0.a:0 "Я постараюсь успокоить [mchild.GetHerHim]!"
 ev7.8.0.b:0 "Я сбегаю!"
 ev7.8.0.c:0 "Возможно, есть способ?"
 ev7.8.0.d:0 "Я знаю способ, мы справимся с этим вместе."
 ev7.8.0.e:0 "Просто дай мне эту силу."
 ev7.8.0.f:0 "Я покажу тебе, как с этим справиться."
 ev7.8.0.g:0 "Я дам тебе часть своей сущности."
 ev7.8.0.g_ct:0 "В будущем это может стать демоном."
 meruption_avoided:0 "Магическая вспышка была предотвращена."
 ev7.9.desc:0 "Вдруг на тебя накатывает волна силы. Магия пытается вырваться через твои глаза и рот в виде потоков ослепительного света, и ты чувствуешь боль, не позволяющую мыслить. Сила поднимает тебя с земли, вот-вот взорвется..."
 ev7.9.0.a:0 "Я могу это выдержать!"
 ev7.10.desc:0 "Ты входишь в зал [mchild.GetTitledFirstName] и видишь [mchild.GetHerHim], висящего в воздухе, изогнутого, с потоками света, вы pouring из его глаз и рта. Ты слышишь нарастающий гул в ушах и чувствуешь, что сила вот-вот будет освобождена. Ты должен что-то предпринять..."
 ev7.11.desc:0 "Ты чувствуешь, как накатывает волна силы, с которой ты можешь не справиться. Вокруг тебя появляются разряды магической энергии, стало жарко, предметы вокруг начали парить. Поступает магическая вспышка."
 ev7.11.0.a:0 "Я знаю, как с этим справиться."
 magic_resonance:0 "Магическая резонанс"
 ev7.11.0.b:0 "Я стабилизирую свой источник."
 ev7.11.0.c:0 "Я буду использовать зелья, чтобы подавить это."
 ev7.11.0.d:0 "Я должен овладеть этой силой любой ценой."
 ev7.11.0.d_ct:0 "Кто знает, что может произойти?"
 ev7.11.0.d_title:0 "Источник стабилизировался."
 ev7.11.0.e:0 "Бог будет защищать меня."
 source4_terrain_cancel_negative_supply:0 "Шансы на #N [magic_eruption|E]#!"
 source4B_terrain_cancel_negative_supply:0 "Позволяет использовать #italic Сырая магия #![interaction|E]"
 reduce_eruption_terrain_cancel_negative_supply:0 "Снижает шанс на #N [magic_eruption|E]#! для нестабильных источников"
 game_concept_magic_eruption:0 "Магическая Эрупция"
 game_concept_magic_eruption_desc:0 "Персонажи, насыщенные энергией и имеющие нестабильный источник, могут столкнуться с магическим извержением, т.е. неконтролируемым выбросом магической силы. Это часто принимают форму магического взрыва, который в худшем случае может убить всех в округе. Персонажи, proficient в магии (или те, кто имеет компетентного волшебного наставника), менее подвержены последствиям магического извержения."
 use_raw_magic:0 "Использовать сырую магию"
 use_raw_magic_desc:0 "Попробуйте использовать вашу врожденную магию, чтобы повлиять на другого персонажа."
 use_raw_magic_ct0:0 "Использование сырой силы может быть опасным.#!"
 use_raw_magic_ct1:0 "Будет применен случайный магический эффект."
 ev7.12.title:0 "Сырая магия"
 ev7.12.desc:0 "Вам удалось отправить магический импульс, который прилип к ауре [recipient.GetTitledFirstName]. У вас есть предчувствие, что это может навредить [recipient.GetHerHim] каким-то образом."
 ev7.12.0.a:0 "Отлично."
 ev7.12.0.b:0 "Я постараюсь усилить эту магию."
 ev7.12.0.c:0 "Нет, нет, я не хочу причинить никому вред!"
 ev7.13.desc1:0 "Вы попытались использовать силу, но только смогли вызвать небольшой пожар в вашей комнате. К счастью, слуги быстро его потушили..."
 ev7.13.desc2:0 "К сожалению, ваша попытка использовать силу завершилась неудачей. Магия сегодня не хочет вас слушать."
 ev7.13.desc3:0 "В результате вашей силы одно из предметов мебели в вашей комнате поднялось в воздух, но через мгновение упало безвредно на пол. Это определенно не оказывает влияния на [recipient.GetTitledFirstName]..."
 ev7.14.desc:0 "Вы использовали свою силу против [recipient.GetTitledFirstName], и хотя вы не видите эффектов, кажется, что что-то изменилось."
 ev7.15.desc:0 "Вы чувствуете, как сила принимает форму в ваших руках. Как вы хотите ее использовать?"
 ev7.15.0.a:0 "Это, вероятно, не лучшая идея."
 ev7.15.0.b:0 "Повинуйся мне."
 ev7.15.0.c:0 "Ты должен меня любить."
 bewitched_opinion:0 "Заколдованный"
 ev7.15.0.d:0 "Покажите мне свои секреты."
 ev7.15.0.e:0 "Мы поговорим... в твоем уме."
 ev7.15.0.f:0 "Это будет весело!"
 ev7.15.0.g:0 "[recipient.GetSheHe|U] никогда не узнает, что это сделал я."
 terrible_stench:0 "Ужасный запах"
 ev7.16.desc:0 "Вы пытаетесь использовать магию, но понимаете, что её слишком много, она слишком мощная. Сила начинает нарастать, и вы безнадежно пытаетесь сделать что-то, прежде чем произойдет магический взрыв..."
 ev7.16.0.a:0 "Мне нужно подавить это."
 ev7.16.0.b:0 "Я укрощу это!"
 ev92.1.title:0 "Таинственная корона"
 ev92.1.desc:0 "Прибыла анонимная посылка, коробка, в которой скрывалась таинственная корона. Вы не имеете ни малейшего представления, кто мог ее вам прислать."
 crown_shadows:0 "Корона теней"
 crown_shadows_desc:0 "Эта тревожная корона кажется притягивает тени и сбивает с толку тех, кто смотрит на нее слишком долго. В ней есть нечто странное, нечто властное и неуловимое."
 crown1_terrain_cancel_negative_supply:0 "Открывает заклинание #italic Теневой Шаг #!для магов"
 crown2_terrain_cancel_negative_supply:0 "Открывает Коррупцию [scheme|E]"
 crown3_terrain_cancel_negative_supply:0 "Заклинание #italic Теневой Шаг #!усиливается"
 crown4_terrain_cancel_negative_supply:0 "Открывает Темного Чемпиона [court_position|E]"
 start_corruption_interaction:0 "Коррупция #weak (Схема)#!"
 start_corruption_interaction_notification:0 "Коррупция"
 scheme_interaction_tt_corruption_approved:0 "Пытается коррупцировать [recipient.GetShortUINameNoTooltip]"
 trait_corrupted:0 "Коррупция"
 trait_corrupted_desc:0 "Согласно слухам, этот человек подписал pacto с демоном или был затронут темными силами иным образом. Истина ли это, другие чувствуют себя некомфортно в такой компании."
 corruption:1 "Коррупция"
 corruption_action:0 "Коррупция"
 corruption_desc:0 "[SCHEME.GetTarget.GetShortUINameNoTooltip] вскоре поддастся моей силе и станет моим слугой."
 corruption_desc_general:1 "Коррупция — это [hostile_scheme|E], которая направлена на коррупцию или влияние на свою цель."
 corruption_successful_roll_tt:0 "[target.GetShortUIName] испорчен!"
 corruption_become_discovered_roll_tt:0 "#N Мое участие раскрыто#!"
 CORRUPTION_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] становится испорченным"
 CORRUPTION_DISCOVERY_DESC:0 "Вы не раскрыты за коррупцию"
 IS_CYROGRAPHER:0 "#P Вы — киберограф#!: $VALUE|+0=$"
