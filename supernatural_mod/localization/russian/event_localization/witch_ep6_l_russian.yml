 DS_KNOWS_WELL:0 "#P Хорошо знай цель#!: $VALUE|=+0$"
 DS_SCHEME_EXPOSED:0 "#N Заговор раскрыт#!: $VALUE|=+0$"
 DS_HAS_CATALYST:0 "#N Боится вашего волшебного катализатора#!: $VALUE|=+0$"
 IS_ALREADY_CORRUPTED:0 "Цель уже испорчена."
 corruption_chance_terrain_advantage:0 "Коррупция [scheme|E] [success_chance|E]"
 ev7.17.desc:0 "Ваши интриги увенчались успехом - [target.GetTitledFirstName] встретился с вами и кажется уязвимым для вашего влияния. Вы чувствуете, что можете легко манипулировать [target.GetHerHim]."
 ev7.17.0.a:0 "Мои слова отравят разум [target.GetHerHis]."
 ev7.17.0.b:0 "Мне нужна новая марионетка."
 ev7.17.0.b_ct:0 "Становится вашим слугой."
 ev7.17.0.c:0 "Я направлю падение [target.GetHerHis]."
 ev7.17.0.d:0 "Я ожидаю лишь немного... доброты."
 HAS_POWERFUL_MAGIC_PROTECTION:0 "Цель устойчива к коррупции."
 ev7.18.0.a:0 "Я приму клятву верности [target.GetHerHis]."
 ev7.18.0.b:0 "Я буду использовать [target.GetHerHim] по-другому."
 ev7.19.0.a:0 "[target.GetSheHe|U] станет моим слугой."
 ev7.19.0.b:0 "Я поделюсь своими знаниями с [target.GetHerHim]."
 ev7.19.0.c:0 "Я просто хочу любви от [target.GetHerHis]."
 ev7.19.0.d:0 "Подойди ближе, я покажу тебе что-то."
 ev7.19.0.e:0 "У меня есть другая идея."
 ev7.20.desc:0 "Несмотря на многочисленные попытки, тебе не удалось повлиять на [target.GetTitledFirstName]. Возможно, [target.GetSheHe] везет, возможно, [target.GetSheHe] силен духом, или, может быть, кто-то просто предупредил [target.GetHerHim] о тебе. В любом случае, [target.GetSheHe] иммунен к твоим манипуляциям."
 ev7.21.desc:0 "Ты решил, что [target.GetTitledFirstName] поддастся твоему влиянию. С помощью тонкой persuasion, манипуляции и магии ты можешь привести к падению [target.GetHerHis]... или к возвышению, как твоего верного слуги."
 ev7.21.0.a:0 "Пора действовать."
 ev7.22.desc:0 "Ты не можешь связаться с [target.GetTitledFirstName] напрямую, пока нет. Сначала нужно подготовить [target.GetHerHim], смягчить [target.GetHerHim]. Ты находишься в процессе написания загадочного и анонимного письма, которое станет твоей приманкой. Однако тебе нужен аргумент, чтобы соблазнить [target.GetHerHim]."
 ev7.22.0.a:0 "Обещание власти должно быть достаточно."
 ev7.22.0.b:0 "Удовольствия [target.GetHerHis|U] - это [target.GetHerHis] слабости."
 ev7.22.0.c:0 "Золото и богатство, это всегда работает."
 ev7.22.0.d:0 "[target.GetSheHe|U] гордый и благородный, я это использую."
 ev7.22.0.e:0 "Я предложу [target.GetHerHim] магию и секретные знания."
 corruption_scheme_good_bait_modifier:0 "Цель попалась на приманку."
 corruption_scheme_bad_bait_modifier:0 "Цель не заинтересована."
 ev7.23.title:0 "Анонимное письмо."
 ev7.23.desc:0 "Тем утром курьер доставил тебе письмо - оно не подписано, но его содержание привлекло твое внимание. Написано очень загадочно, но судя по тому, что ты понимаешь, его отправитель имеет для тебя какое-то предложение. Он пишет, что свяжется с тобой скоро."
 ev7.23.0.a:0 "Я не знаю, что о этом думать."
 ev7.24.desc:0 "Твой план для [target.GetTitledFirstName] набираетMomentum. Теперь нужно поработать над завоеванием доверия [target.GetHerHis]."
 ev7.24.0.a:0 "Я дам ему информацию."
 ev7.24.0.b:0 "Я буду манипулировать [target.GetHerHim]."
 ev7.24.0.c:0 "Небольшой подарок покажет мои добрые намерения."
 ev7.24.0.d:0 "Пока что я просто понаблюдаю."
 ev7.25.desc:0 "Пришло еще одно анонимное письмо - на этот раз содержащее более конкретную информацию. Это может быть полезно."
 ev7.26.desc:0 "Пришло ещё одно анонимное письмо - все еще нет конкретной информации, но оно было сопровождением мешочка с золотом."
 ev7.27.desc:0 "Ваша интрига требует дополнительной информации о [target.GetTitledFirstName]. Вы должны использовать все доступные ресурсы, чтобы найти слабые места [target.GetHerHis]."
 ev7.27.0.a:0 "Это задача для моих шпионов."
 ev7.27.0.b:0 "Я выясню что-то через официальные каналы."
 ev7.27.0.c:0 "У меня есть идея."
 ev7.27.0.d:0 "Я могу положиться на свой ковен."
 ev7.27.0.e:0 "У меня уже есть вся необходимая информация."
 ev7.28.desc:0 "Следующий этап плана требует вашего дополнительного усердия. Вам нужно что-то веское, чтобы убедить [target.GetTitledFirstName], что ваше сотрудничество принесет пользу [target.GetHerHim]."
 ev7.28.0.a:0 "Сейчас подходящее время для магической подсказки."
 magical_suggestion_modifier:0 "Магическая подсказка"
 ev7.28.0.b:0 "Я покажу [target.GetHerHim] несколько трюков."
 ev7.28.0.c:0 "Я не буду рисковать."
 ev7.28.0.d:0 "[target.GetSheHe|U] получит темное благословение."
 limited_risk_modifier:0 "Ограниченный риск"
 ev7.29.desc:0 "Похоже, ваши действия оказывают влияние. Ваши шпионы сообщают, что [target.GetTitledFirstName] ведет себя иначе, чем обычно, кажется более отвлеченным и безрассудным."
 ev7.29.0.a_ct:0 "Цель может изменить личность или получить стресс."
 ev7.30.title:0 "Странные мысли"
 ev7.30.desc:0 "В последнее время вы чувствуете себя странно, у вас возникают проблемы со сном и концентрацией. Возможно, это из-за анонимных писем, которые вы получаете, или, может быть, вы просто перегружены обязанностями."
 ev7.30.0.a:0 "Я поправлюсь через некоторое время."
 ev7.30.0.b:0 "Это поможет мне лучше узнать себя."
 ev7.30.0.c:0 "Это правда?"
 court_position_corrupted_trait:0 ""
 #court_position_schemer_trait:0 "[GetTrait('schemer').GetName( ROOT.Char )]"
 court_position_berserker_trait:0 ""
