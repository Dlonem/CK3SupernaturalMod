l_russian:
 # Supernatural 2.38 "The Blue Rose" -- the Order's events (WORK-ORDER-2.38 §5, §11.6, §13, §16). The voice: second person,
 # short, what happened in the first two lines, options as short first-person intent. No em dashes.

 spn_order.0001.t:0 "Храм без главы"
 spn_order.0001.desc:0 "На столе тебя ждёт письмо. Имени на нём нет — только голубая роза, вдавленная в воск.\n\n"Есть шесть храмов [spn_order|E]. Один из них стоит рядом с тобой, и у него нет главы. У тебя есть дар. Станешь ли ты его [spn_temple_magus|E]?""
 spn_order.0001.desc_late:0 "На столе тебя ждёт письмо. Имени на нём нет — только голубая роза, вдавленная в воск.\n\n"У шести храмов [spn_order|E] теперь есть главы. Совет, возможно, позже дарует тебе грамоту. А до тех пор мы будем наблюдать.""
 spn_order.0001.a:0 "Я стану его Храмовым Магом"
 spn_order.0001.b:0 "Пусть Орден ищет другого"
 spn_order.0001.c:0 "Тогда я подожду"

 spn_order.0003.t:0 "Храм закрыт для тебя"
 spn_order.0003.desc:0 "Сегодня ночью было шесть храмов. Ты почувствовал(а), как каждый из них открыл двери кому-то. Ни один не открылся тебе.\n\nУ [spn_order|E] есть закон о том, что делают с мёртвыми. Этот закон соблюдают давно."
 spn_order.0003.a:0 "Тогда я найду другую дверь"
 spn_order.0003.b:0 "Однажды я им понадоблюсь"

 spn_order.0101.t:0 "Записка и голубая роза"
 spn_order.0101.desc_pillow:0 "Когда ты идёшь спать, на подушке лежит сложенная записка, запечатанная синим воском, а рядом — голубая роза. Никто в доме не видел, кто их оставил.\n\n"Мы наблюдаем за тобой давно. Ты видишь то, что упускают другие, и хочешь знать больше, чем мир согласен тебе преподать. Мы можем показать. Приходи в старую часовню в следующее новолуние. Приходи один(одна) и никому не говори."\n\nВнизу нет имени. Только маленькая голубая роза, нарисованная чернилами."
 spn_order.0101.desc_market:0 "На рынке женщина в сером капюшоне вкладывает тебе в руку записку и исчезает раньше, чем ты успеваешь на неё взглянуть. К бумаге приколота голубая роза.\n\n"Мы наблюдаем за тобой давно. Ты видишь то, что упускают другие, и хочешь знать больше, чем мир согласен тебе преподать. Мы можем показать. Приходи в старую часовню в следующее новолуние. Приходи один(одна) и никому не говори."\n\nВнизу нет имени. Только маленькая голубая роза, нарисованная чернилами."
 spn_order.0101.desc_book:0 "Ты открываешь книгу, которую читал(а) вчера вечером. Между страницами — записка, которую ты не клал(а), и засушенная голубая роза. Чернила ещё свежие.\n\n"Мы наблюдаем за тобой давно. Ты видишь то, что упускают другие, и хочешь знать больше, чем мир согласен тебе преподать. Мы можем показать. Приходи в старую часовню в следующее новолуние. Приходи один(одна) и никому не говори."\n\nВнизу нет имени. Только маленькая голубая роза, нарисованная чернилами."
 spn_order.0101.a:0 "Я приду"
 spn_order.0101.b:0 "Не для меня"
 spn_order.0101.a.tt:0 "Ты идёшь в старую часовню в следующее новолуние. То, что ты там найдёшь, решит, оставят ли они тебя."
 spn_order.0096.t:0 "Роза среди вещей"
 spn_order.0096.desc:0 "Разбирая вещи [spn_dying.GetTitledFirstName], ты находишь небольшую шкатулку, о которой больше никто не знал. Внутри — засушенная голубая роза, старая монета с оттиснутой розой и лист, написанный на языке, которого ты не читаешь.\n\nТы уже слышал(а) об этой розе раньше, где-то. Ты почти уверен(а) в этом."
 spn_order.0096.a:0 "Оставить их себе"
 spn_order.0096.a.tt:0 "Если кто-нибудь однажды придёт спрашивать о ребёнке [spn_dying.GetFirstName], ты поймёшь, кто это."
 spn_order.0096.b:0 "Убрать их"
 spn_order.0096.b.tt:0 "Ничего не меняется. Они могут прийти за тобой и так."
 spn_order.0102.t:0 "Старая часовня"
 spn_order.0102.desc_open:0 "В часовне темно, когда ты входишь. Потом разом загораются все свечи, и ты видишь их: круг людей в простых плащах и белых масках. Один из них выходит вперёд. Лица не видно, но ты знаешь, что главный здесь — он.\n\n"
 spn_order.0102.desc_gifted:0 ""Ты касался Истока сам(а), без того, кто мог бы тебя учить. Это опасно, и это расточительно. Мы [spn_order|E]. Мы учим таких, как ты, дольше, чем кто-либо помнит."\n\n"
 spn_order.0102.desc_new:0 ""У тебя пока нет дара. У большинства из нас его не было, когда мы впервые сюда пришли. У тебя есть ум, который хочет знать, как мир устроен на самом деле. Мы [spn_order|E], и мы можем показать."\n\n"
 spn_order.0102.desc_rules:0 ""Три слова держат нас живыми. Молчание: о том, что ты здесь видел(а), ты не говоришь никогда. Покорность: ты делаешь то, о чём просят старшие. Наблюдение: ты смотришь и учишься. Мы испытаем тебя по всем трём. Если не пройдёшь, ты просто забудешь, что когда-либо здесь был(а).""
 spn_order.0102.a:0 "Я пройду испытания"
 spn_order.0102.a.tt:0 "Первое испытание будет в течение двух месяцев."
 spn_order.0102.b:0 "Я уйду сейчас"
 spn_order.0102.b.tt:0 "Они тебя отпускают. К утру ты не вспомнишь часовню, и Орден долго не позовёт тебя снова."

 spn_order.0110.t:0 "Монета"
 spn_order.0110.desc_tomb:0 "Маски дают тебе одно поручение. Где-то в старом склепе под часовней лежит монета с розой. Принеси её до рассвета.\n\nВ склепе темно, ступени обрушены, и ищешь не только ты."
 spn_order.0110.desc_tower:0 "Люди в масках дают тебе одно поручение. Монета с розой оставлена на крыше колокольни. Принеси её до рассвета.\n\nДверь башни заперта, стена высока, и ищешь не только ты."
 spn_order.0110.desc_mill:0 "Люди в масках дают тебе одно поручение. Монета с розой прибита к старому мельничному колесу. Принеси её до рассвета.\n\nКолесо вертится, вода быстра, и ищешь не только ты."
 spn_order.0110.desc_cage:0 "Маски ведут тебя вниз, в подвал под часовней. В дальнем конце стоит железная клетка, и внутри что-то большое дышит. Монета с розой лежит в соломе у его ног. Принеси её до рассвета.\n\nНа прутьях засохшая кровь. Тот, кто пробовал до тебя, не стал задумываться."
 spn_order.0110.a:0 "Полезть за ней"
 spn_order.0110.b:0 "Найти в этом подвох"
 spn_order.0110.c:0 "Спросить нужного человека"
 spn_order.0110.d:0 "Отдать свою монету другому неофиту"
 spn_order.0110.a_cage:0 "Запустить руку и схватить"
 spn_order.0110.a_cage.tt:0 "Если зверь проснётся, ты потеряешь руку."
 spn_order.0110.b_cage:0 "Сначала узнать, что это"
 spn_order.0110.c_cage:0 "Добиться от смотрителя, чтобы он рассказал о его повадках"
 spn_order.0110.e_cage:0 "Пусть сначала попробует кто-то другой"
 spn_order.0110.e_cage.tt:0 "Ты смотришь, как пробует другой неофит, и учишься на том, что с ним выйдет. Чем лучше твоя [learning|E], тем больше шансов принести монету."
 spn_order_coin_lean_prowess_tt:0 "Испытание силы. Чем лучше твоя [prowess|E], тем больше шансов принести монету."
 spn_order_coin_lean_learning_tt:0 "Испытание ума. Чем лучше твоя [learning|E], тем больше шансов принести монету."
 spn_order_coin_lean_intrigue_tt:0 "Испытание хладнокровия. Чем лучше твоя [intrigue|E], тем больше шансов принести монету."
 spn_order_coin_given_tt:0 "Монета и была испытанием. Отдавать её тебе никогда не следовало."

 spn_order.0120.t:0 "Наблюдение"
 spn_order.0120.desc_1:0 "Это второе испытание, хотя никто тебе об этом не говорит. Ночью ты метёшь пол в старом доме, как тебе велели. С дождя входит человек и спрашивает, что ты делаешь здесь так поздно.\n\nПохоже, он запомнит твой ответ."
 spn_order.0120.desc_2:0 "Это второе испытание, хотя никто тебе об этом не говорит. Ты зажигаешь свечи в пустом доме, как тебе велели. Сторож замечает свет и подходит к двери. Он спрашивает, что ты делаешь здесь в такой час.\n\nПохоже, он запомнит твой ответ."
 spn_order.0120.desc_3:0 "Это второе испытание, хотя никто тебе об этом не говорит. Ты ждёшь в тёмном доме, как тебе велели. Незнакомец находит тебя там и спрашивает, кого ты ждёшь.\n\nПохоже, он запомнит твой ответ."
 spn_order.0120.a:0 "Ничего не говорить"
 spn_order.0120.b:0 "Хорошо соврать"
 spn_order.0120.c:0 "Рассказать ему"

 spn_order.0130.t:0 "Ответишь ли ты на зов?"
 spn_order.0130.desc_1:0 "Тебя вводят в комнату, полную свечей. Все в масках. Один из них, [spn_temple_magus|E], протягивает тебе голубую розу.\n\n"
 spn_order.0130.desc_2:0 "Маски ждут тебя в крипте. [spn_temple_magus|E] выступает вперёд с голубой розой. "Ex tenebris lux, — говорит голос из-под маски. — Из тьмы — к свету."\n\n"
 spn_order.0130.desc_3:0 "Кто-то снимает с тебя повязку. Ты стоишь в кругу масок под расписным потолком. [spn_temple_magus|E] протягивает тебе голубую розу. "Всё, что ты делал(а), было под наблюдением, — говорит голос из-под маски.\n\n"
 spn_order.0130.desc_conclave:0 "Сегодня ночью за тобой следит не один храм, а все. Маски каждого храма [spn_order|E] заполняют зал [spn_conclave|E], и розу протягивают тебе у них на глазах.\n\n"
 spn_order.0130.desc_story:0 ""Мы храним то, что мир сжёг бы: старую учёность и дар, что идёт с ней. Короли нас травили, и каждый из них — прах. Возьми розу — и ты Маг, и один(одна) из нас до конца своих дней. Уйдёшь от нас или предашь нас — и забудешь всё это. Ответишь ли ты на зов?""
 spn_order.0130.a:0 "Я отвечаю на зов"
 spn_order.0130.b:0 "Я не стану"

 spn_order.0190.t:0 "Pulveris Memoria"
 spn_order.0190.desc:0 "Ты просыпаешься в собственной постели. Голова болит, и во рту вкус пепла.\n\nБыла какая-то ночь, которую ты не помнишь. Ты пытаешься долго, и ничего не приходит."
 spn_order.0190.a:0 "..."

 spn_order.0191.t:0 "Орден не даёт тебе уйти"
 spn_order.0191.desc:0 "Ты говоришь своему [spn_temple_magus|E], что покидаешь [spn_order|E]. Никто не спорит.\n\n"Никто не уходит с тем, чему здесь научился. Позволь нам забрать это — и ты нас забудешь. Или оставь себе — и мы будем помнить тебя.""
 spn_order.0191.desc_head:0 "Ты говоришь маскам своего храма, что покидаешь [spn_order|E] и что им понадобится новый [spn_temple_magus|E]. Никто не спорит.\n\n"Никто не уходит с тем, чему здесь научился, — даже ты. Позволь нам забрать это — и ты нас забудешь. Или оставь себе — и мы будем помнить тебя.""
 spn_order.0191.a:0 "Пусть забирают"
 spn_order.0191.b:0 "Я оставлю то, что знаю"

 spn_order.0192.t:0 "Изгнание"
 spn_order.0192.desc:0 "Маски решили. Ты больше не один из них.\n\n"Никто не уходит с тем, чему здесь научился. Позволь нам забрать это — и ты нас забудешь. Или оставь себе — и мы будем помнить тебя.""
 spn_order.0192.a:0 "Пусть забирают"
 spn_order.0192.b:0 "Я оставлю то, что знаю"

 spn_order.0193.t:0 "Они пришли за тем, что ты знаешь"
 spn_order.0193.desc:0 "Кто-то в твоей комнате. Ты узнаёшь голос раньше, чем видишь маску. Это кто-то из [spn_order|E].\n\n"Ты сохранил(а) то, чему научился. Мы пришли это вернуть." Слова начинаются, тихие и старые, и ты чувствуешь, как память начинает ускользать."
 spn_order.0193.a:0 "Удержать это"
 spn_order_defector_lean_tt:0 "Битва воль. Чем лучше твоя [learning|E], тем больше шансов сохранить воспоминания, и тогда они оставят тебя в покое навсегда. Проиграешь — забудешь."

 spn_order_toast_sought:0 "Кто-то взял розу"
 spn_order_toast_not_sought:0 "Розу не взял никто"
 spn_order_toast_sought_desc:0 "Храм рядом с тобой взял розу. Ты будешь почти в самом начале его следующего Отбора."
 spn_order_toast_not_sought_none_desc:0 "Нигде не стоит ни одного храма [spn_order|E]. Маг, владеющий землёй и знающий двоих других, может основать храм."
 spn_order_toast_not_sought_far_desc:0 "Ни в одном храме в пределах твоей досягаемости нет для тебя места. Попробуй снова через несколько лет."
 spn_order_toast_not_sought_barred_desc:0 "Орден не примет тебя таким(ой), как ты есть."

 spn_order.0105.t:0 "Дверь остаётся закрытой"
 spn_order.0105.desc:0 "Ответ приходит на чёрной бумаге.\n\n"Некромантия запрещена. Запрещена с тех пор, как две сестры едва не погубили [spn_order|E]. Тому, что ты делаешь, среди нас места нет.""
 spn_order.0105.a:0 "Тогда я найду свой путь"
 spn_order.0105.b:0 "Я мог(ла) бы от этого отказаться"

 spn_order.0106.t:0 "Запретное искусство"
 spn_order.0106.desc:0 "До твоего храма дошла весть о том, чему ты научился делать с мёртвыми.\n\nУ [spn_order|E] против этого есть закон. Твой [spn_temple_magus|E] хочет ответа."
 spn_order.0106.desc_head:0 "По [spn_order|E] разошлась весть о том, чему ты научился делать с мёртвыми.\n\nУ Ордена против этого есть закон, а [spn_temple_magus|E] должен этот закон соблюдать, а не нарушать. Остальные храмы хотят ответа."
 spn_order.0106.a:0 "Отречься от этого"
 spn_order.0106.b:0 "Пусть судят меня"
 spn_order.0106.c:0 "Уйти, пока меня не изгнали"

 spn_order.0107.t:0 "Некромант среди нас"
 spn_order.0107.desc:0 "[spn_nj_member.GetTitledFirstName] занялся некромантией. [spn_nj_member.GetSheHe|U] не собирается от неё отказываться и просит тебя судить.\n\nЗакон [spn_order|E] ясен. Соблюдать его надлежит тебе."
 spn_order.0107.a:0 "Изгнать их"
 spn_order.0107.b:0 "Закон может уступить однажды"

 spn_order.0140.t:0 "Первое настоящее заклинание"
 spn_order.0140.desc:0 "Твой наставник годами заставлял тебя повторять одни и те же слова каждую ночь. Сегодня, когда ты их произносишь, свеча перед тобой гаснет.\n\nЗатем гаснут все свечи в комнате. Когда их снова зажигают, ты чувствуешь, что сила всё ещё в твоих руках."
 spn_order.0140.desc_craft:0 "Ты знал(а) своё ремесло ещё до того, как пришёл(шла) в Орден. Годами наставник заставлял тебя повторять его слова — каждую ночь, слово в слово. Сегодня, когда ты произносишь их, все свечи в комнате гаснут.\n\nКогда их снова зажигают, ты понимаешь, как Орден творит свою магию. Это не твой путь, но теперь ты его знаешь."
 spn_order.0140.a:0 "Теперь я Маг"
 spn_order.0140.b:0 "Я узнал(а) всё, чему Орден может меня научить"

 spn_order.0141.t:0 "Возведён в Медикумы"
 spn_order.0141.desc:0 "Твой [spn_temple_magus|E] называет тебя Медикумом перед всем капитулом. С этого дня ты будешь учить послушников.\n\nВопрос в том, как именно."
 spn_order.0141.a:0 "Строго, как учили меня"
 spn_order.0141.b:0 "С терпением"

 spn_order.0143.t:0 "Маска храма"
 spn_order.0143.desc:0 "Теперь ты [spn_temple_magus|E]. Маска на стене — твоя.\n\nДевиз [spn_order|E] состоит из трёх слов: Молчание, Покорность, Наблюдение. Каждый храм выбирает, какое из них держит выше остальных."
 spn_order.0143.a:0 "Молчание"
 spn_order.0143.b:0 "Покорность"
 spn_order.0143.c:0 "Наблюдение"
 spn_order_way_silence_tt:0 "Твои члены владеют эзотерическими науками и защитой от козней. Здесь никто не говорит."
 spn_order_way_subservience_tt:0 "Твои члены получают на #high +2#! [spn_order_standing|E] больше каждый год. Здесь чтут чин."
 spn_order_way_observance_tt:0 "Твои члены владеют эзотерическими науками и получают #high +1#! [learning|E], и твои ритуалы идут лучше. Каждый обряд соблюдается."

 spn_order.0144.t:0 "Место среди масок"
 spn_order.0144.desc:0 "Теперь ты занимаешь место в [spn_gnostic_council|E]. Маски за столом замечают таких, как ты.\n\nНекоторые служат им тихо. Некоторые хотят престол во главе стола."
 spn_order.0144.a:0 "Я буду служить"
 spn_order.0144.b:0 "Однажды престол будет моим"

 spn_order.0150.t:0 "Обрял капитула"
 spn_order.0150.desc:0 "Раз в год капитул собирается за закрытыми дверями, чтобы возвысить тех, кто готов. Маски встают в круг, читают имена, и зал ждёт тебя.\n\n"
 spn_order.0150.desc_medicum:0 "[spn_yr_to_medicum.GetTitledFirstName] служил(а) достаточно долго, чтобы стать Медикумом. [spn_yr_to_medicum.GetSheHe|U] пока соблюдал(а) каждое слово.\n\n"
 spn_order.0150.desc_magistratus:0 "[spn_yr_to_magistratus.GetTitledFirstName] готов(а) стать Магистратом — одним из немногих, кто говорит за храм, когда тебя нет.\n\n"
 spn_order.0150.desc_end:0 "Как [spn_temple_magus|E], выбор за тобой. Тот, кого ты обойдёшь, ждёт ещё год и знает, что это выбрал(а) ты."
 spn_order.0150.a:0 "Пусть [spn_yr_to_medicum.GetFirstName] станет Медикумом"
 spn_order.0150.b:0 "Пусть [spn_yr_to_magistratus.GetFirstName] станет Магистратом"
 spn_order.0150.c:0 "Возвысить обоих"
 spn_order.0150.d:0 "Не в этом году"

 spn_order.0160.t:0 "Посторонний задаёт вопросы"
 spn_order.0160.desc_open:0 "Приезжий в таверне расспрашивает про старую часовню и про людей, которые ходят туда по ночам. Кто-то направил [spn_os_who.GetHerHim] к тебе.\n\n"
 spn_order.0160.desc_hunter:0 "Имя тебе знакомо: [spn_os_who.GetTitledFirstName]. [spn_os_who.GetSheHe|U] охотится на ведьм и делает это хорошо."
 spn_order.0160.desc_stranger:0 "[spn_os_who.GetTitledFirstName] говорит, что [spn_os_who.GetSheHe] — учёный и хочет лишь послушать старые истории. Ты не уверен(а), что веришь этому."
 spn_order.0160.fail.tt:0 "Если ты проиграешь, а [spn_os_who.GetFirstName] — охотник, [spn_os_who.GetSheHe] узнает, кто ты, и где собирается твой храм."
 spn_order.0160.c:0 "Выследить [spn_os_who.GetHerHim]"
 spn_order.0160.c.tt:0 "Если выйдет, ты узнаешь достаточно, чтобы держать [spn_os_who.GetHerHim] в руках."
 spn_order.0160.d:0 "Поручить это Адептусу Майору"
 spn_order.0160.d.tt:0 "[spn_os_who.GetFirstName] исчезает навсегда. Адептус Майор в ответ потребует услугу."
 spn_order.0160.e:0 "Пусть [spn_os_who.GetSheHe] не найдёт ничего"
 spn_order.0160.e.tt:0 "Нечего будет найти, если какое-то время никто не ходит в часовню."
 spn_order.0160.a:0 "Направить [spn_os_who.GetHerHim] по ложному следу"
 spn_order.0160.b:0 "Предупредить своего Храмового Мага"

 spn_order.0161.t:0 "Реликвия, которая не желала спать"
 spn_order.0161.desc:0 "Одна из вещей в [spn_reliquary|E] храма начала гудеть по ночам. Послушники не подходят к ней."
 spn_order.0161.a:0 "Я её успокою"
 spn_order.0161.b:0 "Оставить как есть"

 spn_order.0162.t:0 "Испытание неофита пошло не так"
 spn_order.0162.desc:0 "Один из неофитов сорвался во время испытания монеты. За ним никто не пришёл, потому что помогать не положено. Нашёл его ты."
 spn_order.0162.a:0 "Отнести его назад"
 spn_order.0162.b:0 "Испытание есть испытание"

 spn_order.0163.t:0 "Ссора с наставником"
 spn_order.0163.desc:0 "Твой послушник, [spn_q_tutee.GetFirstName], поспорил(а) с тобой перед капитулом. [spn_q_tutee.GetSheHe|U] считает, что ты учишь [spn_q_tutee.GetHerHim] не тому."
 spn_order.0163.a:0 "Выслушать [spn_q_tutee.GetHerHim]"
 spn_order.0163.b:0 "Поставить [spn_q_tutee.GetHerHim] на место"

 spn_order.0170.t:0 "Одного из нас узнали"
 spn_order.0170.desc:0 "Кто-то узнал, что [spn_ex_who.GetTitledFirstName] принадлежит [spn_order|E]. Слух уже пошёл.\n\nТы можешь заставить это графство забыть с помощью [spn_respondeo|E], если у тебя хватит сил заплатить."
 spn_order.0170.a:0 "Я с этим разберусь"

 spn_order.0180.t:0 "Respondeo"
 spn_order.0180.desc:0 "Respondeo: заклинание забвения [spn_order|E]. Произнесённое как надо, оно заставляет целое графство забыть увиденное, и след любого охотника здесь остывает.\n\nОно требует очень много силы. Ты можешь заплатить один(одна) или попросить капитул."
 spn_order.0180.a:0 "Я заплачу один(одна)"
 spn_order.0180.b:0 "Капитул заплатит вместе со мной"
 spn_order.0180.c:0 "Не сейчас"

 spn_order.0181.t:0 "Капитул взывает к тебе"
 spn_order.0181.desc:0 "[spn_rs_caller.GetTitledFirstName] читает [spn_respondeo|E] и нуждается в силе капитула. Отдашь свою?"
 spn_order.0181.a:0 "Отдаю"
 spn_order.0181.b:0 "Не в этот раз"

 spn_order.0600.t:0 "Прошение о грамоте"
 spn_order.0600.desc:0 "[spn_ch_petitioner.GetTitledFirstName] просит у [spn_gnostic_council|E] грамоту: позволение основать новый храм [spn_order|E] у себя в столице и стать его [spn_temple_magus|E]."
 spn_order.0600.a:0 "Даровать"
 spn_order.0600.b:0 "Отказать"

 spn_order.0610.t:0 "Орден снова"
 spn_order.0610.desc:0 "[spn_oa_founder.GetTitledFirstName] знает, что ты такое. [spn_oa_founder.GetSheHe|U] основал(а) [spn_order|E] заново и хочет видеть тебя в нём.\n\n"Храмы пусты. Мы можем их наполнить.""
 spn_order.0610.a:0 "Я присоединюсь к тебе"
 spn_order.0610.b:0 "Нет"

 spn_order.0700.t:0 "Расскажи мне о розе"
 spn_order.0700.desc:0 "Перед концом [spn_rose_member.GetTitledFirstName] сказал(а) то, чего ты не ожидал(а): имя храма и голубая роза.\n\nЭто была не одна ведьма. [spn_rose_member.GetSheHe|U] принадлежал(а) к чему-то."
 spn_order.0700.a:0 "Тогда я найду остальных"

 spn_order.0710.t:0 "Адептус Майор делает ход"
 spn_order.0710.desc:0 "У твоего коня ждёт незнакомец в простом кафтане. [spn_am_agent.GetSheHe|U] знает твоё имя и храм, о котором ты расспрашивал(а).\n\n"Возьми золото и забудь об этом доме. Или останься — и мы заставим тебя забыть.""
 spn_order.0710.a:0 "Взять золото и забыть об этом доме"
 spn_order.0710.b:0 "Заставь меня"

 spn_order.0800.t:0 "Храм посылает тебя"
 spn_order.0800.desc:0 "Записка с голубой розой: "Маски будут на Саммите. Пойди туда за нас.""
 spn_order.0800.errand_recover:0 "\n\n[spn_order_prerogative|E] — вернуть утраченное. Следи, кто что несёт."
 spn_order.0800.errand_silence:0 "\n\n[spn_order_prerogative|E] — молчание. Не говори ничего, что можно повторить."
 spn_order.0800.errand_book:0 "\n\n[spn_order_prerogative|E] — книга. Слушай, кто заговорит о страницах."
 spn_order.0800.errand_grow:0 "\n\n[spn_order_prerogative|E] — новые руки. Ищи молодых с даром."
 spn_order.0800.errand_pit:0 "\n\n[spn_order_prerogative|E] — договор с Ямой. Если на Саммит явится демон, будь вежлив(а)."
 spn_order.0800.errand_none:0 "\n\nГлавное — чтобы тебя увидели нужные люди."
 spn_order.0800.a:0 "Я пойду за Орден"
 spn_order.0800.b:0 "У меня свои дела"

 spn_order.0815.t:0 "Брат умирает"
 spn_order.0815.desc:0 "[spn_tr_asker.GetTitledFirstName] умирает и пришёл в храм просить о [spn_order_transference|E]. Пятерым членам пришлось бы нести эту болезнь вместе с [spn_tr_asker.GetHerHim]."
 spn_order.0815.a:0 "Мы найдём кровь"
 spn_order.0815.b:0 "Храм не может себе этого позволить"

 spn_order.0820.t:0 "Храм просит твоей крови"
 spn_order.0820.desc:0 "[spn_tb_patient.GetTitledFirstName] умирает. Храму нужно пятеро, чтобы нести то, что убивает [spn_tb_patient.GetHerHim], — каждый по пятой части, на пять лет.\n\nЕсли кого-то из несущих убьют раньше срока, болезнь вернётся туда, откуда пришла."
 spn_order.0820.a:0 "Берите мою кровь"
 spn_order.0820.b:0 "У храма есть свои пятеро"
 spn_order.0820.c:0 "Только не мою"

 spn_order.0822.t:0 "Крови не хватило"
 spn_order.0822.desc:0 "Ритуал провести нельзя. Пришло меньше пяти, или тот, ради кого всё делалось, уже вне всякой помощи. Ты отправляешь их по домам."
 spn_order.0822.desc_spent:0 "Пятеро пришли, но у тебя не осталось силы, чтобы заплатить. Храм истощён, и [spn_order_transference|E] провести нельзя."
 spn_order.0822.a:0 "В другой раз"

 spn_order.0823.t:0 "Ex Tenebris Lux"
 spn_order.0823.desc:0 "Из тьмы — к свету. Пятеро стоят кругом вокруг [spn_tw_patient.GetTitledFirstName], соединённые цепями из ртути. Ты начинаешь слова.\n\nБолезни нужно куда-то уйти. Сегодня она уйдёт в них."
 spn_order.0823.a:0 "Начать ритуал"
 spn_order.0823.b:0 "Мне нечего больше ей дать"
 spn_transference_lean_tt:0 "Чем лучше твоя [learning|E], тем больше шансов, что удержится. [spn_temple_magus|E] справляется лучше, как и храм, соблюдающий Наблюдение. Если не выйдет, оттуда может что-то прийти."

 spn_order.0824.t:0 "Жар отступил"
 spn_order.0824.desc:0 "Ты просыпаешься, и боли нет. Пятеро людей, которых ты почти не знаешь, теперь несут её — понемногу каждый.\n\nЕсли кого-то из них убьют, она вернётся."
 spn_order.0824.a:0 "Я им обязан(а) жизнью"

 spn_order.0825.t:0 "Поток оборвался"
 spn_order.0825.desc:0 "На середине слов ртуть рвётся. Что-то бьёт тебя в грудь и отбрасывает через комнату.\n\nБольной всё ещё болен. Ты ранен(а)."
 spn_order.0825.a:0 "Не удержалось"

 spn_order.0826.t:0 "Открывается разлом"
 spn_order.0826.desc:0 "Там, где был круг, пол выжжен дочерна, и в воздухе пахнет серой.\n\nЧто-то оттуда вышло. Оно знает твоё имя и охотится за тобой."
 spn_order.0826.a:0 "Господи, помоги мне"

 spn_order.0828.t:0 "Перенос распадается"
 spn_order.0828.desc:0 "Одного из пятерых, что несли болезнь, убили. Всё, что он нёс, возвращается разом."
 spn_order.0828.desc_wolf:0 "\n\nТело нашли утром. Сердца в нём не было."
 spn_order.0828.a:0 "Она вернулась"

 spn_order.0829.t:0 "У волков есть зубы"
 spn_order.0829.desc:0 "Волк убил одного из пятерых, что несли ритуал твоего храма. [spn_order_transference|E] разрушен."
 spn_order.0829.desc_member:0 "Волк убил одного из твоего храма. [spn_order|E] и стаи уже воевали прежде."
 spn_order.0829.a:0 "Пусть охотники найдут его"
 spn_order.0829.b:0 "Я запомню"
 
 spn_order.0831.t:0 "Некромант возвращается"
 spn_order.0831.desc:0 "[spn_bg_necro.GetTitledFirstName] был(а) изгнан(а) за то, что делает с мёртвыми. Теперь [spn_bg_necro.GetSheHe] умирает и принёс(несла) [spn_bg_item.GetName] в уплату за [spn_order_transference|E].\n\n[spn_order_old_law|E] говорит: нет."
 spn_order.0831.a:0 "Найти пятерых, кто её понесёт"
 spn_order.0831.c:0 "Сейчас мы этого не можем"
 spn_order.0831.b:0 "Закон есть закон"

 spn_order.0832.t:0 "Старый закон нарушен"
 spn_order.0832.desc:0 "[spn_ol_breaker.GetTitledFirstName] исцелил(а) некроманта и взял(а) за это плату. Это против [spn_order_old_law|E], и отвечать за это тебе."
 spn_order.0832.a:0 "Изгнать [spn_ol_breaker.GetHerHim]"
 spn_order.0832.b:0 "Пусть сойдёт с рук"

 spn_order.0840.t:0 "Самый тайный чар"
 spn_order.0840.desc:0 "Старейший член [spn_gnostic_council|E] отводит тебя в сторону. "Есть один чар, которому мы не учим. Он позволяет творить магию, не платя за неё."\n\n"Заплатишь позже. Он съедает тебя медленно, как рак. Ты всё ещё хочешь его?""
 spn_order.0840.a:0 "Научи меня"
 spn_order.0840.b:0 "Иные цены слишком высоки"

 spn_order.0842.t:0 "Это всегда и была цена"
 spn_order.0842.desc:0 "Лекарь находит опухоль и не поднимает глаз.\n\n[spn_order_fors_factorum|E] никогда не давался даром. Он лишь был отложен."
 spn_order.0842.a:0 "Я знал(а)"

 spn_order.0850.t:0 "Адепты зовут тебя"
 spn_order.0850.desc:0 "[spn_order_adepti|E] работают вне храмов, на весь [spn_order|E]. Они хотят тебя.\n\nТы всё ещё будешь принадлежать своему капитулу, но отвечать будешь не одному хозяину."
 spn_order.0850.a:0 "Я буду работать вне храма"
 spn_order.0850.b:0 "Моё место — в моём капитуле"

 spn_order.0900.t:0 "Демон у дверей храма"
 spn_order.0900.desc:0 "[spn_dm_demon.GetTitledFirstName] стоит на пороге храма, и все свечи повернулись к [spn_dm_demon.GetHerHim].\n\n"Демоны стары. Мы знаем, где стоят храмы. Я пришёл поговорить.""
 spn_order.0900.a:0 "Мы выслушаем твои условия"
 spn_order.0900.b:0 "Правило первое. Уходи"
 spn_order.0900.c:0 "Преклони колени перед кольцом"

 spn_order.0901.t:0 "Связан(а) кольцом"
 spn_order.0901.desc:0 "Кольцо на руке хозяина старше тебя. Ты понял(а) это, едва его увидел(а).\n\nТы опускаешься на колени. Не по своей воле."
 spn_order.0901.a:0 "..."

 spn_order.0910.t:0 "Об услуге вспомнили"
 spn_order.0910.desc:0 "[spn_order|E] когда-то одолжил тебе кое-что. Теперь он хочет это вернуть. [spn_fv_lender.GetTitledFirstName] прислал(а) весть."
 spn_order.0910.task_recover:0 "\n\n"Принеси нам вещь силы от того, кто не наш.""
 spn_order.0910.task_silence:0 "\n\n"Одно графство помнит одного из наших. Сделай так, чтобы забыло.""
 spn_order.0910.task_book:0 "\n\n"Скажи нам, где страница.""
 spn_order.0910.task_grow:0 "\n\n"Приведи нам ребёнка, в котором есть Исток.""
 spn_order.0910.task_pit:0 "\n\n"Научи нас тому, что знает только Яма.""
 spn_order.0910.a:0 "Сделано"
 spn_order.0910.b:0 "Я Ордену ничего не должен"

 spn_order.0940.t:0 "Прерогатива Ордена"
 spn_order.0940.desc:0 "Как глава [spn_order|E], ты решаешь, к чему храмы будут стремиться следующие десять лет. Члены, служащие этому, получают [spn_order_standing|E]."
 spn_order.0940.a:0 "Вернуть утраченное"
 spn_order.0940.b:0 "Молчание"
 spn_order.0940.c:0 "Книга должна быть найдена"
 spn_order.0940.d:0 "Новые руки"
 spn_order.0940.e:0 "Договор с Ямой"
 spn_order_prerogative_recover_tt:0 "Залог реликвии, добыча её на войне, взятие Печати Соломона или вычерчивание страницы приносят положение."
 spn_order_prerogative_silence_tt:0 "Чтение Respondeo, применение Порошка и год без разоблачённых членов приносят положение. Разоблачённый член теряет больше."
 spn_order_prerogative_book_tt:0 "Услышать, где страница, вычертить страницу или открыть Чёрный Камень приносят положение."
 spn_order_prerogative_grow_tt:0 "Наставники получают больше, каждый капитул делает четыре отбора в год, и грамоту можно просить раньше."
 spn_order_prerogative_pit_tt:0 "Правило первое отменяется. Договор ничего не стоит главе, и услуга демона оплачивает его заимодавца."

 spn_order.0960.t:0 "Маски склоняются перед тобой"
 spn_order.0960.desc:0 "Теперь ты занимаешь престол [spn_gnostic_council|E]. Несколько человек за столом носят маски, которых ты прежде не видел, и одна из них оставляет у твоей руки голубую розу.\n\n"Мы хотели бы видеть тебя одним из нас.""
 spn_order.0960.a:0 "Тогда я надену маску"
 spn_order.0960.b:0 "Маску я не надену"
 
 spn_order.0963.t:0 "Престол Великого Мага"
 spn_order.0963.desc:0 "Ты Великий Маг, и [spn_order|E] — твой. Пока ты держишь престол, ты его глава.\n\nХрамы спросят тебя, к чему им стремиться."
 spn_order.0963.a:0 "Я им скажу"

 spn_order.0971.t:0 "Совет зовёт тебя"
 spn_order.0971.desc:0 "[spn_gnostic_council|E] потерял одного из своих: место пустует, и Великий Маг предлагает его тебе."
 spn_order.0971.a:0 "Я займу это место"
 spn_order.0971.b:0 "Не сейчас"
 spn_order.0141.a_tt:0 "[spn_order_standing|E] твоих послушников растёт каждый год, и ты им нравишься меньше."
 spn_order.0141.b_tt:0 "Ты нравишься послушникам больше."
 spn_order.0960.b.tt:0 "Ты отказываешься от престола. Храмы Ордена выберут себе Великого Мага сами."
 spn_order.0975.t:0 "Роспуск Гностического Совета"
 spn_order.0975.desc:0 "Ты созываешь совет и говоришь им прямо: ты распускаешь Гностический Совет.\n\nКанцлер бледнеет. Чья-то чаша замирает на полпути ко рту. "Распускаешь, Великий Маг?"\n\nТы даёшь тишине продлиться мгновением дольше, чем нужно. "Совет. Не советников.""
 spn_order.0975.a:0 "Совет. Только совет."
 spn_order.0975.a.tt:0 "[spn_gnostic_council|E] лишится всех мест разом. Следующий Конклав их заполнит."
 spn_order.0975.b:0 "Впрочем, оставить как есть"
 spn_order.0108.t:0 "Имя для розы"
 spn_order.0108.desc:0 "Маски приносят тебе имя: [spn_sel_pick.GetTitledFirstName]. Они наблюдали за [spn_sel_pick.GetSheHe] год. Они думают, что в [spn_sel_pick.GetSheHe] есть то, что ищет [spn_order|E].\n\nЗаписка и роза готовы. Отправить их можешь только ты."
 spn_order.0108.a:0 "Отправить розу"
 spn_order.0108.a.tt:0 "Орден протянет руку [spn_sel_pick.GetFirstName]. Если [spn_sel_pick.GetSheHe] отзовётся, начнутся испытания."
 spn_order.0108.b:0 "Только не этому"
 spn_order.0108.b.tt:0 "[spn_sel_pick.GetFirstName] не услышит зова пять лет."
 spn_order.0108.c:0 "Отправить и позволить маскам выбирать впредь"
 spn_order.0108.c.tt:0 "Записки уходят, не спрашивая тебя. Ты можешь вернуть себе выбор отдельным решением."
 spn_order.0090.t:0 "Имя, которое ты уже слышал(а)"
 spn_order.0090.desc_scholar:0 "Двое старых учёных спорят за вином о том, что один из них когда-то читал. Он называет имя: Герметический Орден Голубой Розы. Второй смеётся над ним — чуть громче, чем следовало бы, — и меняет тему.\n\nТы уверен(а), что уже слышал(а) это имя. Вспомнить не можешь где."
 spn_order.0090.desc_merchant:0 "Торговец редкими книгами упоминает покупателя, который берёт только очень старые. "Платит хорошим серебром и никогда не торгуется. Носит маленькую голубую розу, приколотую под пальто. Какой-то орден, говорит. Герметический, что ли."\n\nИмя не уходит от тебя весь вечер. Ты где-то его уже слышал(а)."
 spn_order.0090.desc_priest:0 "Твой духовник сегодня неспокоен. Кто-то расспрашивал его о тебе: читаешь ли ты, что именно, умеешь ли хранить тайну. "Они оставили вот это", — говорит он и кладёт на стол между вами голубую розу. "Надеюсь, я не сделал ничего дурного."\n\nТы уже видел(а) такую розу прежде. Ты почти уверен(а) в этом."
 spn_order.0090.a:0 "Запомнить имя"
 spn_order.0090.a.tt:0 "Если они когда-нибудь придут за тобой, ты узнаешь их и будешь знать, как проходят их испытания."
 spn_order.0090.b:0 "Это ничего не значит"
 spn_order.0090.b.tt:0 "Ничего не меняется. Они могут прийти и так."
 spn_order.0090.c:0 "Расспросить об этом"
 spn_order.0090.c.tt:0 "С осторожной рукой кто-нибудь заметит любопытство нужного рода. С неуклюжей — ничего не выйдет."
 spn_order.0090.c.success:0 "Кто-то заметил"
 spn_order.0090.c.success_desc:0 "Незнакомец благодарит тебя за интерес. О тебе дадут знать друзья."
 spn_order.0090.c.failure:0 "След остывает"
 spn_order.0090.c.failure_desc:0 "Никто не станет об этом говорить, а те, кого ты расспрашивал(а), клянутся, что и имени такого не слыхали."
 spn_order.0095.t:0 "Роза говорит"
 spn_order.0095.desc:0 "Это занимает больше времени, чем ты ожидал(а). [recipient.GetFirstName] боится людей в масках больше, чем тебя.\n\nВ конце [recipient.GetSheHe] называет имена, которые знает, — и их немного. "Каждый храм держит своё при себе. Больше нескольких лиц не знает никто. Клянусь.""
 spn_order.0095.a:0 "Тогда назови им моё имя"
 spn_order.0095.a.tt:0 "[recipient.GetFirstName] выйдет на свободу и замолвит за тебя слово. Твоё имя будет почти в самом начале следующего Отбора в храме."
 spn_order.0095.b:0 "Отпустить [recipient.GetHerHim]"
 spn_order.0095.b.tt:0 "[recipient.GetFirstName] выйдет на свободу. [spn_order|E] узнает, что [recipient.GetSheHe] сказал(а)."
 spn_order.0095.c:0 "Держать [recipient.GetHerHim] там, где [recipient.GetSheHe] есть"
 spn_order.0310.t:0 "Слова"
 spn_order.0310.desc:0 "Твой наставник даёт тебе лист со словами на языке, на котором уже никто не говорит, и велит произносить их каждую ночь, пока они не перестанут звучать чужеродно.\n\n"Они долго не будут работать, — говорит наставник. — Дело не в этом. Дело в том, что ты продолжаешь их говорить.""
 spn_order.0310.a:0 "Каждую ночь, без пропусков"
 spn_order.0310.a.tt:0 "Ты приближаешься к концу обучения на год — ценой части своего сна."
 spn_order.0310.b:0 "Спросить, что они значат"
 spn_order.0310.b.tt:0 "Ты узнаёшь, что значат эти слова, но к концу обучения не приближаешься."
 spn_order.0311.t:0 "Свеча, которая не погасла"
 spn_order.0311.desc:0 "Сегодня, когда ты заканчиваешь слова, свеча перед тобой не гаснет. Она горит ярче, потом зелёным, потом снова как обычно.\n\nРуки у тебя дрожат. Больше этого никто не видел."
 spn_order.0311.a:0 "Попробовать снова сейчас же"
 spn_order.0311.a.tt:0 "Возможно, ты приблизишься к концу обучения."
 spn_order.0311.b:0 "Рассказать наставнику"
 spn_order.0311.b.tt:0 "Наставник будет доволен, что ты сказал(а)."
 spn_order.0320.t:0 "Первый урок"
 spn_order.0320.desc_tutee:0 "Твой наставник — [spn_tp_tutor.GetTitledFirstName]. Первое, что [spn_tp_tutor.GetSheHe] делает, — забирает твои книги.\n\n"Ты получишь их обратно, когда сможешь сказать мне, зачем они тебе были нужны. А до тех пор ты слушаешь, смотришь и молчишь. Это и есть три слова. Выучи сначала их.""
 spn_order.0320.desc_tutor:0 "Храм дал тебе послушника: [spn_tp_tutee.GetTitledFirstName]. Рвение — есть, и немного страха перед тобой — а это правильно.\n\nКаким учителем ты будешь?"
 spn_order.0320.a:0 "Я буду слушать"
 spn_order.0320.a.tt:0 "Наставник будет о тебе хорошего мнения."
 spn_order.0320.b:0 "Я буду читать тайком"
 spn_order.0320.b.tt:0 "Ты кое-чему научишься. Наставнику знать не обязательно."
 spn_order.0320.c:0 "Строго, как учили меня"
 spn_order.0320.d:0 "С терпением"
 spn_order.0321.t:0 "Поручение"
 spn_order.0321.desc:0 "[spn_tp_tutor.GetTitledFirstName] вручает тебе запечатанное письмо и адрес в нехорошей части города. "Отдай в руки тому, кто откроет дверь. Не читай. Не попадайся на глаза."\n\nТы добираешься туда затемно. За домом следят."
 spn_order.0321.a:0 "Пройти по крышам"
 spn_order.0321.b:0 "Пройти прямо мимо соглядатаев"
 spn_order.0321.c:0 "Принести письмо обратно"
 spn_order.0321.c.tt:0 "Наставник будет разочарован."
 spn_order.0321.success:0 "Доставлено"
 spn_order.0321.success_desc:0 "Письмо в нужных руках, и никто тебя не видел. Наставник кивает — а это высокая похвала."
 spn_order.0321.failure:0 "Замечен(а)"
 spn_order.0321.failure_desc:0 "Письмо ты передал(а), но кто-то видел твоё лицо. Какое-то время ты будешь спать плохо."
 spn_order.0321.failure_hurt:0 "Пойман(а)"
 spn_order.0321.failure_hurt_desc:0 "Соглядатаи поймали тебя в переулке. Письмо ты передал(а), но не без побоев."
 spn_order.0322.t:0 "Две головы над одной задачей"
 spn_order.0322.desc:0 "Один из вас глубоко в магическом исследовании, которое никак не даётся. Другой неделю читает через плечо.\n\nЧто-то на полях привлекает твой взгляд."
 spn_order.0322.a:0 "Работать над этим вместе"
 spn_order.0322.a.tt:0 "Текущему исследованию потребуется на один прорыв меньше. Послушник получает [spn_order_standing|E] и учёность."
 spn_order.0322.b:0 "Это не моя работа"
 spn_order.0322.b.tt:0 "Ничего не меняется."
 spn_order.0323.t:0 "Урок, возвращённый назад"
 spn_order.0323.desc_tutee:0 "Ты показываешь [spn_tp_tutor.GetTitledFirstName] способ произносить третью строку, который вывел(а) сам(а). [spn_tp_tutor.GetSheHe|U] долго молчит.\n\n"Меня научили неправильно, — говорит [spn_tp_tutor.GetSheHe] наконец. — И я двадцать лет учу неправильно.""
 spn_order.0323.desc_tutor:0 "Твой послушник, [spn_tp_tutee.GetTitledFirstName], показывает тебе способ произносить третью строку, которому тебя никогда не учили. Он лучше твоего.\n\nТы долго молчишь."
 spn_order.0323.a:0 "Мы учимся друг у друга"
 spn_order.0323.a.tt:0 "Оба вы чему-то учитесь. Послушник получает [spn_order_standing|E]."
 spn_order.0324.t:0 "Поздние уроки"
 spn_order.0324.desc:0 "Уроки идут всё позже и позже. Сегодня никто из вас не заглядывал в книгу уже час.\n\nУ Ордена есть правила насчёт многого. Насчёт этого — нет."
 spn_order.0324.a:0 "Пусть случится"
 spn_order.0324.a.tt:0 "Вы становитесь любовниками."
 spn_order.0324.b:0 "Оставить только уроки"
 spn_order.0324.b.tt:0 "Ты держишься уроков, и вы начинаете уважать друг друга сильнее."
 spn_order.0330.t:0 "Храм помогает"
 spn_order.0330.desc:0 "Магистрат твоего храма приходит к тебе в кабинет с фонарём и без вопросов. К утру твои записи исписаны вторым почерком.\n\n"Ты был(а) близко, — говорят они. — Теперь ближе.""
 spn_order.0330.a:0 "Я у тебя в долгу"
 spn_order.0330.a.tt:0 "Твоему текущему магическому исследованию потребуется на один прорыв меньше."
 spn_order.0860.t:0 "Изготовление"
 spn_order.0860.desc:0 "Магистраты твоего храма собираются в подвале. Голема можно вылепить из глины, вырезать из дерева или выковать из железа. Глина не стоит ничего сверх прочего и даёт самого слабого слугу. Железо стоит целое состояние и даёт самого сильного.\n\nСлова для этого старше самого Ордена. Что бы ты ни выбрал(а), это займёт месяцы."
 spn_order.0860.a:0 "Вылепить из глины"
 spn_order.0860.a.tt:0 "Не стоит ничего сверх прочего. Изготовление закончится через несколько месяцев."
 spn_order.0860.b:0 "Вырезать из дерева"
 spn_order.0860.b.tt:0 "Стоит 100 золота. Голем будет лучшим бойцом, чем глиняный."
 spn_order.0860.c:0 "Выковать из железа"
 spn_order.0860.c.tt:0 "Стоит 300 золота и займёт больше времени. Голем будет лучшим бойцом, какого Орден умеет делать."
 spn_order.0861.t:0 "Голем просыпается"
 spn_order.0861.desc_success:0 "В последнюю ночь он садится.\n\nОн смотрит на тебя глазами, которые ты сам(а) придал(а) ему, и ждёт, что ему скажут делать."
 spn_order.0861.desc_failure:0 "В последнюю ночь он раскалывается сверху донизу. Месяцы работы — и ничего."
 spn_order.0861.a:0 "Он служит мне"
 spn_order.0861.a.tt:0 "Голем твой. Он подчиняется тебе и никому больше."
 spn_order.0861.c:0 "Он служит храму"
 spn_order.0861.c.tt:0 "Ты отдаёшь его своему [spn_temple_magus|E], чтобы охранять храм и посылать туда, где Орден нужен. Храм запомнит этот дар."
 spn_order.0861.b:0 "Подмести"
