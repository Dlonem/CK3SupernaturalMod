l_russian:
 samael_name:0 "Самуил"
 ev3.1.title:0 "Архангел"
 ev3.1.desc:0 "Яркая фигура стоит перед тобой. Существо смотрит на тебя и на руны, которые разделяют вас. 'Непрерывный круг призыва' - сказал демон."
 ev3.101.a:0 "Спасибо. Давайте перейдем к делу."
 ev3.101.b:0 "Я мог бы освободить тебя. Ты этого хочешь?"
 ev3.101.c:0 "Ты мне не нужен. Возвращайся в ад."
 ev3.2.desc:0 "'Я догадываюсь, ты чего-то хочешь, колдун. Говори.'"
 ev3.102.a:0 "Что ты можешь мне предложить?"
 ev3.102.b:0 "Ты должен исполнить мою волю, демон."
 ev3.3.desc:0 "Одно желание смерти, колдун. Назови мое имя и подумай о ком-то. Я заберу его жизнь... если только он не бессмертен или не имеет действительно сильной магической защиты, конечно. Я также могу благословить твоего наследника..."
 ev3.3.desc2:0 "Одно желание смерти, колдун. Назови мое имя и подумай о ком-то. Я заберу его жизнь... если только он не бессмертен или не имеет действительно сильной магической защиты, конечно. Я также могу благословить твоего наследника или заставить твоих врагов сдаться."
 ev3.103.a:0 "Я приму желание смерти."
 ev3.103.a_ct:0 "Вы получите одно применение заклинания желания смерти."
 ev3.103.b:0 "Защити моего наследника."
 samael_blessing:0 "Защита Самаэля"
 ev3.103.c:0 "Покажите моим врагам, что у них нет шансов против меня!"
 death_wish:0 "Желание смерти"
 death_wish_title:0 "Желание смерти"
 death_wish_ct:0 "Вы истощите заклинание желания смерти."
 ev3.4.desc:0 "Колдуны... вы так предсказуемы. Что вы хотите?"
 ev3.4.a:0 "Очистите мой разум."
 ev3.4.b:0 "Очищите мою душу."
 ev3.4.c:0 "Дайте мне абсолютную магическую защиту!"
 amp_modifier:0 "Абсолютная магическая защита"
 ev3.4.d:0 "Дайте мне тайное знание."
 ev3.4.e:0 "Укрепите мой разум."
 ev3.4.f:0 "Научите меня сражаться."
 ev3.5.desc:0 "В чем подвох, колдун?"
 ev3.5.a:0 "Баэль. Я хочу его смерти."
 ev3.5.b:0 "Вы убьете Белиала."
 ev3.5.c:0 "Отправьте Астарота обратно в ад."
 ev3.5.d:0 "Лилит должна умереть."
 ev3.5.f:0 "Убейте Молоха."
 ev3.5.e:0 "Я передумал. Что вы можете мне предложить?"
 ev3.5_ct:0 "Вы освободили Самаэля."
 ev3.6.desc:0 "'Я выполнил ваше желание, колдун. Теперь, почему я должен пощадить вас?'"
 ev3.6.a:0 "Заберите моих придворных, делайте с ними что хотите."
 ev3.6.b:0 "Я дам вам мой артефакт..."
 ev3.6.c:0 "Потому что я не буду использовать Черный Гримуар, чтобы изгнать тебя?"
 ev3.6.d:0 "Я изгоняю тебя, демон!"
 ev3.6.e:0 "Я могу предложить тебе нечто лучшее..."
 ev3.7.desc:0 "'Приятно иметь с тобой дело, маг. Прощай.'"
 ev3.7.a:0 "Прощай, Демон."
 ev3.8.desc:0 "Справедливо. Прощай, Колдун."
 ev3.9.a:0 "Надеюсь, мы больше nunca не встретимся."
 coven_rule_tradition:0 "Власть Ковена"
 coven_rule_tradition_name:0 "Власть Ковена"
 coven_rule_tradition_desc:0 "В этом сообществе ковен имеет решающее слово по важным вопросам."
 culture_parameter_coven_rule:0 "Лишение наследства взрослых нехристианских персонажей не имеет затрат."
 culture_parameter_coven_rule2:0 "Позволяет создать полк культистов."
 culture_parameter_coven_rule3:0 "Черты Ведьмы и Настоящей Ведьмы получают дополнительные преимущества."
 cultists:0 "Культисты"
 cultists_flavor:0 "#F Демонические последователи и фанатичные группы, возглавляемые опытными ведьмами.#!"
 COVEN_NEEDED:0 "У тебя должен быть Ковен Ведьм."
 teach_sorcery:0 "Обучить Колдовству"
 MUST_BE_WITCH_CUSTOM:0 "Цель должна быть Ведьмой."
 IS_SORCER_CUSTOM:0 "Цель уже практикует магию."
 teach_sorcery_desc:0 "Ты можешь предложить свои наставления и тайное обучение."
 teach_sorcery_custom_tooltip:0 "Предложить Тайное обучение."
 teach_sorcery_custom_tooltip3:0 "Ты можешь получить сильную зацепку на цель."
 teach_sorcery_custom_tooltip2:0 "Цель получит возможность открыть аркан фокус в будущем (в зависимости от его навыка учения)."
 ev3.10.title:0 "Арканическое обучение"
 ev3.10.desc:0 "[actor.GetFullName] предлагает вам обучение в области арканической магии. У вас будет возможность понять настоящую магию."
 ev3.10.a:0 "Да, учите меня!"
 ev3.10.b:0 "Мне не нужна ваша 'наставничество'."
 refuse_sorcery_training_modifier:0 "Предложение отклонено"
 ev3.10.a_ct:0 "Арканическое обучение начнется."
 ev3.11.desc:0 "[disciple.GetFullName] принял ваше щедрое предложение. [disciple.GetSheHe|U] готов начать обучение."
 ev3.11.a:0 "Давайте начнем, мой ученик."
 sorcery_training_modifier:0 "Арканическое обучение"
 ev3.12.desc:0 "[disciple.GetFullName] отклонил ваше щедрое предложение!"
 ev3.12.a:0 "Дурак..."
 ev3.13.title:0 "Арканическое обучение - Первый урок"
 ev3.13.desc:0 "Время для серьезного обучения. Я должен подумать, с чего начать."
 ev3.13.a:0 "Сначала - теория. Я покажу вам свои заметки."
 mage_guidance:0 "Наставничество мага"
 ev3.13.b:0 "Мы сделаем что-то практическое. Я покажу вам, как работает магия."
 ev3.13.b_ct:0 "Арканическое обучение приносит #P прогресс#!"
 ev3.14.desc:0 "Мой мастер, [mteacher.GetFullName], показывает мне заметки [mteacher.GetHerHis]. Это может быть очень полезно."
 ev3.14.a:0 "Я прочитаю это немедленно."
 ev3.15.desc:0 "Сегодня я покажу своему ученику, как накладывать незначительные заклинания. Я думаю, что [disciple.GetSheHe] готов."
 ev3.15.a:0 "Слушай меня внимательно, мой ученик..."
 ev3.16.title:0 "Арканистское Обучение - Правила Магии"
 ev3.16.desc:0 "Сегодня я объясню своему ученику самое важное правило магии. [disciple.GetSheHe|U] должен знать, что истинная магия всегда имеет свою цену."
 ev3.16.a:0 "Помни об этом, мой apprentice, всегда есть цена, которую нужно заплатить."
 ev3.17.desc:0 "Сегодня мой мастер, [mteacher.GetFullName], рассказал мне о самых важных правилах магии. Магия, похоже, требует какой-то энергии для своей работы. Но мой мастер не объяснил, как я могу получить эту энергию."
 ev3.17.a:0 "Интересно."
 ev3.18.title:0 "Арканистское Обучение - Практический Урок"
 ev3.18.desc:0 "Я должен познакомить своего ученика с практическими аспектами магии. Я буду использовать..."
 ev3.18.a:0 "...мой магический артефакт."
 ev3.18.b:0 "...как я насылаю мощные заклинания."
 ev3.18.c:0 "...я пока не знаю, но я разберусь."
 ev3.19.desc:0 "Мой мастер, [mteacher.GetFullName], дал мне много практических советов. Я добиваюсь большого прогресса."
 ev3.19.a:0 "Я могу зажечь факел силой моей воли!"
 ev3.20.title:0 "Арканистское Обучение - Конец Учебы"
 ev3.20.desc:0 "Мой ученик, [disciple.GetFullName], увидел всё, чему я мог научить [disciple.GetHerHim]. Всё остальное в руках [disciple.GetHerHis]."
 ev3.20.a:0 "Удачи, мой ученик."
 ev3.20.a_ct:0 "Обучение завершено."
 ev3.21.desc:0 "Сегодня мой мастер, [mteacher.GetFullName], заявил, что я достаточно знаю, чтобы продолжить обучение самостоятельно. [mteacher.GetSheHe|U] больше не будет моим мастером."
 ev3.21.a:0 "Теперь настало время проверить, что я узнал."
 ev3.21.a_1:0 "Вы проводите магические эксперименты."
 ev3.21.a_2:0 "Ваши эксперименты провалились."
 ev3.21.a_ct:0 "Вы не станете магом в ближайшее время..."
 magic_epic_decision:0 "Провести магическое исследование"
 magic_epic_decision_desc:0 "Вы можете написать том исследований, который будет содержать все ваши знания об Аркане, или попробовать изобрести новое заклинание."
 magic_epic_decision_tooltip:0 "Провести арканическое исследование"
 magic_epic_decision_confirm:0 "Начать"
 magic_epic_decision_ct:0 "Ваше исследование начнётся."
 ev3.22.title:0 "Арканическое исследование"
 ev3.22.desc:0 "Вы можете записать свои текущие знания или исследовать новые магические дисциплины."
 ev3.22.a:0 "Я напишу магическую разработку."
 ev3.22.b:0 "Я постараюсь развить свою мощь."
 ev3.23.desc:0 "Сначала вам следует выбрать тему для вашей книги."
 ev3.23.a:0 "Магические ритуалы."
 ev3.23.b:0 "Магические артефакты."
 ev3.23.c:0 "Нежить."
 ev3.23.d:0 "Энергетические каналы."
 ev3.23.e:0 "Демоны."
 ev3.23.f:0 "[ROOT.Char.GetFaith.WitchGodName|U]."
 ev3.24.desc:0 "Письмо идет медленно. Мне нужно вдохновение."
 ev3.24.a:0 "Я заставлю себя продолжать работать."
 ev3.24.b:0 "Я сделаю перерыв..."
 ev3.24.b_ct:0 "Работа над книгой замедляется."
 ev3.24.c:0 "Медитация должна помочь."
 ev3.25.desc:0 "Я достиг стадии, на которой мне необходимо провести дополнительные эксперименты. Они будут дорогими..."
 ev3.25.a:0 "Этого может быть достаточно."
 ev3.25.b:0 "Я сделаю это правильно."
 ev3.25.c:0 "Это приоритетные расходы."
 ev3.25.a_ct:0 "Ваша работа дает #P прогресс#!"
 ev3.25.b_ct:0 "Ваша работа достигает лучшей #P качества#!"
 ev3.26.desc:0 "В данный момент я работаю над важной частью книги. Мне нужно сосредоточиться."
 ev3.26.a:0 "Я справлюсь с этим."
 ev3.26.a_1:0 "Работа идет хорошо."
 ev3.26.a_2:0 "Работа идет плохо."
 ev3.26.b:0 "Я вдохну немного магии в страницы."
 ev3.26.c:0 "Я добавлю цитаты из Черного Гримуара."
 ev3.27.desc:0 "Итак, окончательный вывод моей книги будет..."
 ev3.27.a:0 "Некоторые вещи нельзя объяснить."
 ev3.27.b:0 "Ритуалы используются для кражи силы у богов."
 ev3.27.c:0 "Только боги или демоны могут создать магический артефакт."
 ev3.27.d:0 "Только те, кто понимает артефакты, могут их использовать."
 ev3.27.e:0 "Невозможно полностью воскрешать мёртвых."
 ev3.27.f:0 "Нежить — неутомимые воины."
 ev3.27.f_ct:0 "Вы открываете полк скелетов."
 skeletons:0 "Скелетные Воины"
 skeletons_flavor:0 "#F Эта армия не заботится о зарплате.#!"
 ev3.27.g:0 "Люди не созданы для использования магии."
 ev3.27.h:0 "Из-за моей силы я в каком-то смысле бог."
 ev3.27.i:0 "Нет различий между демонами и богами. Они одинаковы."
 ev3.27.j:0 "Вы можете многому научиться у демонов."
 ev3.27.k:0 "Мы никогда не поймём великий план [ROOT.Char.GetFaith.WitchGodName]."
 ev3.27.l:0 "Я [ROOT.Char.GetFaith.WitchGodName]...!"
 ev3.27.m:0 "[ROOT.Char.GetFaith.WitchGodName|U] не существует."
 horned_nickname:0 "Рогатый Бог"
 ev3.28.title:0 "Магическое Исследование - Завершение Книги"
 ev3.28.desc:0 "Наконец-то! Книга завершена."
 ev3.28.a:0 "Следующие поколения оценят это."
 mbook1_name:0 "Тайны Магии"
 mbook2_name:0 "Руководство по Магическим Ритуалам"
 mbook1_desc:0 "Тома описывает магические обряды и практические аспекты колдовства."
 mbook3_name:0 "Руководство по магическим артефактам"
 mbook4_name:0 "Заклинательные артефакты"
 mbook3_desc:0 "Книга описывает магические артефакты и как их использовать."
 mbook5_name:0 "Книга мертвых"
 mbook6_name:0 "Основы кладбищенника"
 mbook5_desc:0 "Книга о некромантии и связанных с ней экспериментах."
 mbook7_name:0 "Источник силы"
 mbook8_name:0 "Магические колебания и как их использовать"
 mbook7_desc:0 "Книга о магических силах и использовании продвинутой колдовской магии."
 mbook9_name:0 "Демонология"
 mbook10_name:0 "Демониум"
 mbook9_desc:0 "Руководство по демонам и другим слоям реальности."
 mbook11_name:0 "Рогатый"
 mbook12_name:0 "Бог богов"
 mbook13_name:0 "Вызов [ROOT.Char.GetFaith.WitchGodName]"
 mbook11_desc:0 "Введение в тайны [ROOT.Char.GetFaith.WitchGodName] и основы колдовства."
 ev3.28.a_ct:0 "Ваша работа завершена!"
 ev3.29.desc:0 "Сначала вам нужно выбрать тему для вашего исследования. Вы думаете, что у вас есть хорошая идея..."
 ev3.29.a:0 "Модификация."
 ev3.29.b:0 "Гадание."
 ev3.29.c:0 "Некромантия."
 ev3.29.d:0 "Псионика."
 ev3.29.e:0 "Метамагия."
 ev3.29.f:0 "Улучшение тела."
 ev3.29.g:0 "Другие миры."
 ev3.30.desc:0 "Ваше исследование медленно продвигается вперед, но результаты не удовлетворительны. Вам нужно выбрать другой подход."
 ev3.30.a:0 "Я просто начну заново."
 ev3.30.b:0 "Мне нужно сосредоточиться. Я разберусь!"
 ev3.30.b_ct:0 "Ваше исследование продвигается."
 ev3.30.c:0 "Я спрошу другую ведьму о помощи."
 ev3.30.d:0 "Я потрачу на это больше времени."
 ev3.31.desc:0 "Вы обнаружили что-то неожиданное во время вашего исследования. Вы узнали, как управлять силой таким образом, чтобы использовать её для защиты. По крайней мере, вы так думаете."
 ev3.31.a:0 "Ничего страшного, мне нужно придерживаться изначального плана."
 ev3.31.b:0 "Итак, я сосредоточусь на магии защиты."
 ev3.31.b_ct:0 "Вы меняете тему вашего исследования."
 ev3.32.desc:0 "Вы всё ближе и ближе к прорыву, вы это ощущаете. Однако вы чувствуете, что вам все еще чего-то не хватает."
 ev3.32.a:0 "Мне нужно больше экспериментов."
 ev3.32.b:0 "Энергия! Я использую магический катализатор как источник силы."
 ev3.32.c:0 "Я точно знаю, что нужно сделать."
 ev3.33.desc:0 "Ваше исследование близится к завершению. Время для финального эксперимента."
 ev3.33.a:0 "Я готов!"
 ev3.33.a_1:0 "Успех!"
 ev3.33.a_2:0 "Могло бы быть и лучше..."
 ev3.34.title:0 "Завершение магических исследований"
 ev3.34.desc:0 "Готово. Я сделал это. Мое исследование завершено, и моя сила возросла."
 ev3.34.desc2:0 "Итак... Я не открыл ничего нового, но подтвердил некоторые ранние теории и теперь знаю больше."
 ev3.34.desc3:0 "Вы установили магическую связь с существом из другого мира. Это не демон, это что-то... другое. Существо было дружелюбным и рассказало вам много секретов. Кажется, мир совершенно иной, чем вы думали."
 ev3.34.z:0 "На шаг впереди..."
 ev3.34.a:0 "Камень в воздух. Свинец в золото."
 ev3.34.a2:0 "Свинец в золото..."
 ev3.34.a2_ct:0 "Разблокирует заклинание трансмутации [decision|E]"
 master_alteration_modifier:0 "Мастера Преображения"
 magic_transmutation_decision:0 "Заклинание магической трансмутации"
 magic_transmutation_decision_desc:0 "Используйте свою силу, чтобы превратить немного свинца в чистое золото."
 magic_transmutation_decision_tooltip:0 "Заклинание магической трансмутации"
 magic_transmutation_decision_confirm:0 "Применить заклинание"
 ev3.34.b:0 "Наконец-то у меня будут слуги, на которых я могу положиться."
 master_necromancer_modifier:0 "Мастер Некромант"
 ev3.34.c:0 "'Мастер марионеток, я дергаю за ваши нити...'"
 ev3.34.c_ct:0 "Ваше заклинание магического господства теперь может изменить веру и культуру цели."
 ev3.34.d:0 "Похоже, я могу назвать себя магом."
 ev3.34.d_ct:0 "У вас есть 50% шанс восстановить вашу силу насыщения после каждого магического заклинания."
 metamagic_title:0 "Метамагия"
 master_metamagic_modifier:0 "Мастер метамагии"
 ev3.34.e:0 "Я сверхчеловек!"
 upgraded_body_modifier:0 "Усовершенствованное тело"
 ev3.34.f:0 "Мое защитное заклинание готово."
 ev3.34.f_ct:0 "Вы получите доступ к ритуалу Великой Защиты"
 master_defence_modifier:0 "Защитные заклинания"
 magic_defence_decision:0 "Ритуал Великой Защиты"
 magic_defence_decision_desc:0 "Вы начнете мощное защитное заклинание, которое убережет вас от враждебной магии."
 magic_defence_decision_tooltip:0 "Ритуал Великой Защиты"
 magic_defence_decision_confirm:0 "Применить заклинание"
 ev3.34.g:0 "Мне все еще интересно, что именно означает слово 'Блорг'."
 contact_other_worlds_modifier:0 "Контакт с другими мирами"
 ev3.34.g_ct:0 "Вы получите доступ к заклинанию Путешествие в Другой Мир"
 travel_to_stars_decision:0 "Путешествие в Другой Мир"
 travel_to_stars_decision_desc:0 "Вы сможете открыть нестабильный магический портал в другой мир. Вероятно, это будет поездка в один конец, так что вы покинете свое царство для своих наследников."
 travel_to_stars_decision_tooltip:0 "Путешествие в Другой Мир"
 travel_to_stars_decision_confirm:0 "Время отправляться в путь."
 travel_to_stars_decision_ct:0 "Вы покинете этот мир навсегда."
 ev2.61.f:0 "Я могу исцелить [lliege.GetHerHim]."
 ev2.81.desc:0 "Ваш придворный маг, [cmage.GetTitledFirstName], пришёл к вам и начал выполнять какой-то магический ритуал. 'Вы теперь здоровы' - сказал [cmage.GetSheHe]."
 witch_familiar_modifier5:0 "Птичий спутник"
 call_witch_hunter_decision:0 "Вызвать охотника на ведьм"
 call_witch_hunter_decision_desc:0 "Ходят слухи, что в королевстве появились ведьмы и те, кто практикует тёмную магию. Вам стоит подумать о вызове специалиста, чтобы решить эту проблему."
 call_witch_hunter_decision_tooltip:0 "Вызвать охотника на ведьм"
 call_witch_hunter_decision_confirm:0 "Отправьте вызов."
 call_witch_hunter_decision_ct:0 "Охотник на ведьм прибудет к вашему двору и предложит вам свои услуги."
 ev3.341.title:0 "Охотник на ведьм"
 ev3.341.desc:0 "Охотник на ведьм (или, по крайней мере, человек, claiming быть охотником на ведьм) прибыл к вашему двору и немедленно встретился с вами. 'Я слышал, у вас есть проблема. Если у вас также есть деньги, возможно, я смогу найти решение для вас.' - сказал [whunter.GetSheHe]."
 ev3.341.a:0 "Конечно, я заплачу."
 ev3.341.b:0 "Я передумал, вы мне не нужны."
 ev3.35.desc:0 "Значит, у нас сделка. Поиск ведьмы может занять некоторое время, но вы можете на меня рассчитывать."
 ev3.35.a:0 "Удачной охоты."
 ev3.35.a_ct:0 "Охотник начинает свой поиск."
 ev3.35.b:0 "Могу я присоединиться к вам?"
 ev3.37.desc:0 "'Я ничего не нашёл. Возможно, вокруг нет ведьм.'"
 ev3.37.a:0 "Понимаю. Значит, мне больше не нужны ваши услуги."
 ev3.37.b:0 "Продолжайте поиск. Возможно, вы что-то пропустили."
 ev3.37.b_ct:0 "Охотник продолжает поиски."
 ev3.38.desc:0 "Ваши слуги нашли тело сегодня утром. Оказалось, это ваш охотник на ведьм. Видимых повреждений нет, он, должно быть, был убит магией!"
 ev3.38.desc2:0 "Ваши слуги нашли тело сегодня утром. Оказалось, это ваш охотник на ведьм. Тело было полностью изуродовано."
 ev3.38.a:0 "Итак, [whunter.GetSheHe] нашёл ведьм..."
 ev3.39.desc:0 "Ваш охотник вернулся, и похоже, он нашёл ведьму. 'Один демонослужитель меньше!' - сказал [whunter.GetSheHe]. Охотник также рассказал вам о своём расследовании и о том, как он выяснил, что [htarget.GetTitledFirstName] - ведьма.'"
 ev3.39.a:0 "Спасибо за вашу службу."
 ev3.39.b:0 "Может быть, есть и другие ведьмы. Продолжайте искать."
 ev3.40.desc:0 "Ваш охотник вернулся и привёл пленника. 'Вы хотели ведьму? Так что, держите.' - сказал [whunter.GetSheHe]. Охотник также рассказал вам о своём расследовании и о том, как он выяснил, что [htarget.GetTitledFirstName] - ведьма.'"
 ev3.41.desc:0 "Я вижу, вы хотите узнать что-то полезное. Обычно я работаю один, но не скажу "нет" господину этих земель."
 ev3.41.a:0 "Отлично, давайте приступим к работе."
 ev3.42.title:0 "Охота на ведьм"
 ev3.42.desc:0 "Охотник связался со своими информаторами. Основываясь на неясных слухах, вы провели целый день, наблюдая за домом, disguised as beggars. Вы не ожидали, что охота на ведьм будет такой скучной."
 ev3.42.a:0 "Я выдержу... как-нибудь."
 ev3.42.b:0 "Я справлюсь с этим."
 ev3.42.c:0 "..."
 ev3.42.d:0 "Достаточно. Вы можете справиться без меня."
 ev3.42.d_ct:0 "Охотник продолжает поиски... без вашей помощи."
 ev3.43.desc:0 "Вы обнаружили, что дом, за которым вы следили, был заброшен. Однако охотник не выглядит разочарованным. [whunter.GetSheHe|U] тщательно обыскал здание, но ничего не нашел. 'У нас есть еще несколько мест для проверки.' - сказал [whunter.GetSheHe]."
 ev3.43.a:0 "Если вы так говорите..."
 ev3.43.a_ct:0 "Вы продолжаете поиски."
 ev3.43.b:0 "Вы справитесь самостоятельно."
 ev3.44.desc:0 "Через несколько дней вы нашли вероятное логово ведьм. Вопрос в том, как вы попробуете их перехватить."
 ev3.44.a:0 "Мы одолеем их."
 ev3.44.b:0 "Я заточу их к капитуляции."
 ev3.44.c:0 "Я использую своих рыцарей."
 ev3.44.d:0 "Я использую своих агентов."
 ev3.44.a_1:0 "Ведьмы были успокоены."
 ev3.44.a_1_ct:0 "Вы запираете ведьм в подземелья."
 ev3.44.a_2:0 "Ведьмы сбежали."
 ev3.44.a_2_ct:0 "Ведьмы исчезают без следа."
 ev3.45.desc:0 "'Иногда это не удаётся.' - сказал Охотник на ведьм - 'Но я думаю, что справлюсь без вашей помощи.'"
 ev3.45.a:0 "Пусть будет так..."
 ev3.46.desc:0 "Лидер ковена ведьм в вашем подземелье, но пока не время для празднования. Могут быть и другие ведьмы."
 ev3.46.a:0 "Мы справились хорошо. Продолжайте без меня."
 ev3.46.b:0 "Ты думаешь, я мог бы стать охотником?"
 ev3.47.desc:0 "'Сражение с ведьмами - это призвание. Однако тебе будет проще с твоими ресурсами, чем мне. Я могу показать тебе несколько вещей.'"
 ev3.47.a:0 "На самом деле, я чувствую призвание!"
 ev3.47.b:0 "У меня есть и другие дела на уме. Продолжай искать ведьм."
 novice_witch_hunter_modifier:0 "Ученик охотника на ведьм."
 ev3.48.title:0 "Путь охотника."
 ev3.48.desc:0 "Охотник уже некоторое время обучает меня основам о ведьмах. Сегодня я узнал, как защитить себя от ведьминских проклятий."
 ev3.48.a:0 "Бесценная информация!"
 ev3.49.desc:0 "Сегодня [whunter.GetTitledFirstName] заявил, что мне нужны практические уроки в борьбе с колдуньями."
 ev3.49.a:0 "Да, давайте потренируемся в фехтовании."
 ev3.49.b:0 "Расскажи мне больше о привычках колдуней."
 ev3.50.desc:0 "[whunter.GetTitledFirstName] показал мне несколько способов отслеживать колдуней сегодня. Я научился технике медитации, которая позволяет мне чувствовать магию в окрестностях."
 ev3.50.a:0 "Колдуньи, я иду за вами!"
 ev3.51.a:0 "Колдуньи должны быть ответственны за это..."
 ev3.51.a_ct:0 "Ты начинаешь отслеживать колдуней."
 ev3.51.b:0 "Лучше мне держаться подальше от этого."
 ev3.52.desc:0 "Ты собрал множество улик о смерти охотника. Теперь тебе нужно все это собрать воедино."
 ev3.52.a:0 "Время для финальной стадии."
 ev3.52.b:0 "Думаю, я уже все знаю."
 ev3.52.c:0 "Кто-то должен знать правду!"
 ev3.52.d:0 "Лучше мне отпустить это."
 ev3.52.a_1:0 "Ты добился успеха."
 ev3.52.a_2:0 "Ты потерпел неудачу."
 ev3.52.a_1_ct:0 "Ты находишь колдунью."
 ev3.52.a_2_ct:0 "След ведет никуда."
 ev3.53.desc:0 "Доказательства показывают, что [wwwitch.GetTitledFirstName] — убийца и колдунья. Ты немедленно арестовал [wwwitch.GetHerHis]."
 ev3.53.a:0 "Думаю, теперь я могу назвать себя охотником на ведьм."
 rival_magic_modifier:0 "Враждебный Колдун"
 not_accepted_witchcraft_faith_desc:0 "Ваша вера не принимает ведовство."
 TRUE_WITCH_NEEDED:0 "Вы должны быть истинной ведьмой."
 secret_knowledge_modifier:0 "Секретное знание"
 witch_trial:0 "Суд над ведьмой"
 witch_trial_desc:0 "Провести суд над ведьмой"
 witch_trial_ct:0 "Начните суд над ведьмой."
 witch_trial_ct2:0 "Может быть подвергнута пыткам, убита... или даже оправдана."
 witch_trial_ct3:0 "У вас есть возможность заработать или потерять престиж/благочестие."
 ev3.54.desc:0 "Обвиняемый готов к допросу. С чего вы начнете?"
 ev3.54.desc2:0 "'Я не виновен, пожалуйста!' - кричат они."
 ev3.54.desc3:0 "Обвиняемый просто молчит и смотрит на вас."
 ev3.54.a:0 "Итак, [accused.GetTitledFirstName], ты ведьма?"
 ev3.54.b:0 "Сначала я покажу [accused.GetHerHim] свои инструменты."
 ev3.54.c:0 "Давайте не будем терять время."
 ev3.54.c_ct:0 "Вы начинаете пытки."
 ev3.55.desc:0 "Ваш преследователь пришел в подземелье и начал допрос. 'Ты ведьма?' - спрашивает [whunter.GetSheHe]."
 ev3.55.a:0 "Нет, я не ведьма!"
 ev3.55.b:0 "Вы все равно ничего не поймете."
 ev3.55.c:0 "Да, я ведьма!"
 ev3.56.desc:0 "'Нет, я не ведьма!' - отчаянно сказала [accused.GetSheHe] - 'Я не виновна!'"
 ev3.56.desc2:0 "'Вы все равно ничего не поймете.' - сказала [accused.GetSheHe]. Вы считаете это признанием вины."
 ev3.56.desc3:0 "'Да, я такой, жалкий червь!' - сказал [accused.GetSheHe]."
 ev3.56.desc4:0 "'Я не ведьма, сколько раз мне повторять?!'"
 ev3.56.desc5:0 "'Я не ведьма, пожалуйста, поверьте мне!'"
 ev3.56.desc6:0 "'Я ничего плохого не сделала, я просто пытаюсь быть хорошим человеком!'"
 ev3.56.desc7:0 "'Пусть будет, может, я ведьма.'"
 ev3.56.desc8:0 "'Да, я преданная слуга [accused.Char.GetFaith.WitchGodName]!'"
 ev3.56.desc9:0 "'Остановитесь, я вас умоляю... Я ничего плохого не сделала!'"
 ev3.56.desc10:0 "'Подождите! Я ничего не знаю, но я сделаю все что угодно!'"
 ev3.56.desc11:0 "'Подождите! Я ведьма! Я признаюсь!'"
 ev3.56.desc12:0 "'Подождите! Я могу вам кое-что рассказать!'"
 ev3.56.a:0 "Я предложу, что у меня есть доказательства вины [accused.GetHerHis]."
 ev3.56.b:0 "Я буду на него давить."
 ev3.56.c:0 "Время для пыток!"
 ev3.56.d:0 "Значит, вы невиновны."
 ev3.56.d_ct:0 "Суд окончен."
 ev3.56.e:0 "Назовите членов вашего ковена, ведьма."
 ev3.56.f:0 "Думаю, этого достаточно. Зажгите костер!"
 ev3.56.g:0 "Не играйте со мной. Признайтесь, кто вы!"
 ev3.56.h:0 "Я оставлю тебя в своей темнице, пока что."
 ev3.57.desc:0 "[whunter.GetTitledFirstName] утверждает, что [whunter.GetSheHe] имеет доказательства вашей вины. 'Признание вины может смягчить наказание.' - сказал [whunter.GetSheHe]."
 ev3.57.a:0 "Я не ведьма, сколько раз мне ещё это повторять?!"
 ev3.57.b:0 "Я не ведьма, пожалуйста, поверьте мне!"
 ev3.57.c:0 "Я ничего плохого не сделала, я просто пытаюсь быть хорошим человеком!"
 ev3.57.d:0 "Пусть будет, может, я ведьма."
 ev3.57.e:0 "Да, я преданный слуга [ROOT.Char.GetFaith.WitchGodName]!"
 ev3.58.desc:0 "Охотник на ведьм сказал, что ты пока принадлежишь к темницам. Твой суд был отложен."
 ev3.58.a:0 "Пусть будет так..."
 ev3.58.b:0 "Я не виновен!"
 ev3.59.desc:0 "В полной тишине твой преследователь показал тебе орудия пыток. Твоя фантазия рисует мрачные картины того, что может произойти."
 ev3.60.desc:0 "Ты готовишь орудия и закатываешь рукава."
 ev3.60.a:0 "Я буду бережной."
 ev3.60.b:0 "Не двигайся, когда я работаю!"
 ev3.61.desc:0 "Этот сумасшедший мучил меня! Вдруг я поняла, что это я кричу так громко... Затем я увидела, как [whunter.GetSheHe] взял ещё одно лезвие."
 ev3.61.desc2:0 "'Выдавай членов своего ковена, ведьма.' - сказал охотник твердо."
 ev3.61.a:0 "Остановись, умоляю тебя..."
 ev3.61.b:0 "Подожди! Я ничего не знаю, но я сделаю всё!"
 ev3.61.c:0 "Подожди! Я ведьма..."
 ev3.61.d:0 "Подожди! Я могу тебе что-то сказать!"
 ev3.62.desc:0 "Костер горит, и ты смотришь на свое достижение."
 ev3.62.a:0 "Еще один день тяжелой работы."
 ev3.62.b:0 "Я не уверен, что [accused.GetSheHe] была ведьмой вообще."
 witch_hunting_decision:0 "Начать охоту на ведьм"
 witch_hunting_decision_desc:0 "Ты можешь использовать свои навыки, чтобы отследить местных ведьм."
 witch_hunting_decision_tooltip:0 "Начать охоту на ведьм"
 witch_hunting_decision_confirm:0 "Начать охоту на ведьм"
 witch_hunting_decision_ct:0 "Ты начнешь охоту на ведьм."
 ev3.63.desc:0 "Ведьмы нуждаются в магических ингредиентах для проведения своих ритуалов. Если ты найдешь эти ингредиенты, ты также сможешь найти ведьм."
 ev3.63.a:0 "Я буду искать подозрительные расходы."
 ev3.63.b:0 "Я точно знаю, на что смотреть."
 ev3.63.a_1:0 "Ты находишь улики."
 ev3.63.a_1_ct:0 "У тебя есть подозреваемый."
 ev3.63.a_2_ct:0 "Ты ничего не находишь."
 ev3.64.desc:0 "Все указывает на то, что [htarget.GetTitledFirstName] - ведьма."
 ev3.64.a:0 "Я поймаю подозреваемого."
 ev3.64.b:0 "Пока что я просто буду следить."
 ev3.64.c:0 "Я установлю ловушку и убью [htarget.GetHerHim] сама."
 ev3.65.desc:0 "Ведьмы могут быть повсюду. Я должен использовать все свои навыки, чтобы их раскрыть."
 ev3.65.b:0 "Я вознагражу за любую информацию, касающуюся ведьм."
 ev3.65.c:0 "Ничто не может скрыться от меня."
 ev3.65.d:0 "Я воспользуюсь семейными связями."
 witchhunter_weapons_modifier:0 "Оружие охотника на ведьм"
 moloch_name:0 "Молох"
 ev3.66.desc:0 "Ужасное чудовище появляется в круге призыва. Создание смотрит на вас и бьёт по рунам невероятной силой, но эффекта нет, кроме облака искр."
 ev3.66.a:0 "Итак, демон, ты должен подчиняться моим приказам."
 ev3.67.desc:0 "'Уничтожь... Уничтожь... Уничтожь!!!' - он бьёт по рунам, и вся башня дрожит. Вы инстинктивно делаете шаг назад."
 ev3.67.a:0 "Я призвал тебя, подчиняйся мне!"
 ev3.68.desc:0 "Демон притирается к рунам, и вы видите, что они могут не выдержать его силы. Он мощен!"
 ev3.68.a:0 "Хмм... исчезни, сейчас же!"
 ev3.69.desc:0 "Демон проигнорировал ваш приказ, вы явно потеряли контроль над заклинанием призыва. Руны начинают ломаться..."
 ev3.69.a:0 "Ладно, я освобожу тебя!"
 ev3.69.b:0 "Я использую древние заклинания, чтобы изгнать его..."
 ev3.69.c:0 "Я использую Чёрный Гримуар, чтобы изгнать его..."
 ev3.69.d:0 "Я убью его традиционным способом."
 ev3.69.a_ct:0 "Молох свободен."
 ev3.69.b_ct1:0 "Ты отправил Молоха обратно."
 ev3.70.desc:0 "Демон швырнул тебя в стену с невероятной силой. 'Убивай! Убивай! УБИВАЙ!' Но вместо того, чтобы убить тебя, он спустился вниз в покои."
 ev3.70.a:0 "Я... не могу... двигаться..."
 ev3.70.a_ct:0 "Молох уничтожает твой двор."
 ev3.70.a_ct2:0 "Молох будет путешествовать по миру и сеять хаос."
 ev3.71.title:0 "Вот приходит Молох."
 full_protection_decision:0 "Удвоить охрану."
 full_protection_decision_desc:0 "В ответ на угрозу ты можешь усилить охрану и выделить дополнительные средства на защиту."
 full_protection_decision_tooltip:0 "Удвоить охрану."
 full_protection_decision_confirm:0 "Построить удвоенную охрану."
 double_guards_modifier:0 "Удвоенные охранники."
 ev3.72.title:0 "Будь магом двора."
 ev3.72.desc:0 "Ответственность и обязанности приходят с должностью court mage. Ты должен решить, как использовать свои способности."
 ev3.72.a:0 "Сначала я докажу, что я достоин."
 ev3.72.b:0 "Я вызову страх."
 ev3.72.c:0 "Я сосредоточусь на обучении."
 ev3.72.d:0 "Я буду искать истинную магию."
 ev3.72.d_ct:0 "Ты можешь получить подсказку о магическом артефакте."
 ev3.73.desc:0 "Ваша проверка показала, что [mmmowner.GetTitledFirstName] является владельцем магического артефакта."
 ev3.73.b:0 "Эта вещь должна быть моей. Я докажу это."
 ev3.73.b_1:0 "Вы отстояли свои права."
 archmage2:0 "Легендарный маг"
 trait_archmage2:0 "Легендарный маг"
 trait_archmage2_desc:0 "Живая легенда."
 merlins_name:0 "Мерлин"
 rival_random_m1:0 "Магическое соревнование"
 friend_random_m1:0 "Общие интересы"
 lover_random_m1:0 "Соблазненный"
