l_russian:
 # Supernatural 2.39 -- the Collegium (WORK-ORDER-2.39 F15). T17: the building's own text never names the Order; only a
 # member's panel, the Order's events and the hunter's Corridor do. No existing key changes, so the other languages
 # receive these through sync_localizations.py and never go stale.

 # The building: the same text for everyone.
 building_type_spn_order_collegium_01:0 "Коллегия"
 building_type_spn_order_collegium_01_desc:0 "Дом учёности, где знатоки права, словесности и звёзд преподают и хранят свои книги."
 building_spn_order_collegium_01:0 "Коллегия"
 building_spn_order_collegium_01_desc:0 "Дом, где знатоки права, словесности и звёзд преподают и хранят свои книги. Его покровителей причисляют к учёным людям."

 # The member's panel (spn_OrderCouncilSeat): two new lines, the old ones untouched.
 spn_order_line_hall:0 " Он собирается под тамошней Коллегией."
 spn_order_line_council_seat_hall:0 "$spn_order_line_hall$$spn_order_line_council_seat$"

 # Toasts.
 spn_order_toast_hall_raised:0 "Коллегия возведена"
 spn_order_toast_hall_raised.desc:0 "Твой храм теперь собирается под Коллегией в [spn_ha_county.GetName]."
 spn_order_toast_hall_lost:0 "Коллегии больше нет"
 spn_order_toast_hall_lost.desc:0 "Коллегия, под которой собирался твой храм, больше не стоит. Пока не будет возведена другая, храм собирается где может."
 spn_order_toast_hall_has_one:0 "Дом учёности"
 spn_order_toast_hall_has_one.desc:0 "Твой храм уже собирается под другой Коллегией. Эта — просто дом учёности, не более."
 spn_order_toast_hall_refused:0 "Маски говорят «нет»"
 spn_order_toast_hall_refused.desc:0 "Маски не примут [spn_hl_new.GetTitledFirstName]. Они не говорят почему."
 spn_order_toast_hall_profaned:0 "Кто-то прошёл по коридору"
 spn_order_toast_hall_profaned.desc:0 "Охотник прошёл по коридору под Коллегией и вышел с другой стороны. Пройдут годы, прежде чем храм снова почувствует себя там в безопасности."
 spn_order_toast_hall_searched:0 "Кто-то обыскал подвалы"
 spn_order_toast_hall_searched.desc:0 "[spn_hs_lord.GetTitledFirstName] велел обыскать Коллегию в [spn_hl_county.GetName] сверху донизу. Ничего не нашли."
 spn_order_toast_cellar_found:0 "Лестница за полками"
 spn_order_toast_cellar_found.desc:0 "За книжным шкафом в нижней библиотеке твои люди нашли уходящую вниз лестницу, а у её подножия — дверь с вырезанной голубой розой. Теперь ты знаешь, чья это дверь."
 spn_order_toast_cellar_nothing:0 "Внизу ничего"
 spn_order_toast_cellar_nothing.desc:0 "Твои люди простучали каждую стену и подняли каждую плиту. У Коллегии нет подвала."
 spn_order_toast_master_talks:0 "Право, словесность и звёзды"
 spn_order_toast_master_talks.desc:0 "Магистр Коллегии целый час рассказывает о праве, словесности и звёздах. Ты уходишь, не узнав ничего нового."

 # Respondeo (the decision's tooltip, and the working itself when it is cast in the hall's county).
 spn_order_respondeo_hall_tt:0 "Произнесённое в графстве собственной Коллегии твоего храма, оно не стоит тебе стресса."
 spn_order_respondeo_no_wound_tt:0 "Твой храм собирается под Коллегией этого графства. Здесь действо не стоит тебе стресса."

 # A Name You Have Heard Before: the opening for a lord who holds a Collegium's county (the show's words, S1E01).
 spn_order.0090.desc_collegium:0 "У студентов [Glossary('Collegium','spn_gloss_collegium')] есть история, которую рассказывают каждому новичку: будто здесь обитает тайное общество учёных, [Glossary('Hermetic','spn_gloss_hermetic')] Орден Голубой Розы, и под зданием скрыт храм. Твой управляющий говорит, что у Коллегии нет подвала.\n\nТы уверен, что уже слышал это название. Только не можешь вспомнить где."

 # Beneath the Collegium (a chapter moment).
 spn_order.0164.t:0 "Под Коллегией"
 spn_order.0164.desc:0 "За книжным шкафом в Коллегии в [spn_bc_county.GetName], про который студентам говорят, что в нём лишь старые проповеди, вниз к храму уходит лестница. В коридоре у её подножия на арке высечены слова. Тот, кто пройдёт под ними без права быть здесь, увидит то, чего боится больше всего, и дальше не пойдёт.\n\nСегодня новички храма впервые проходят под аркой. Кто-то должен идти рядом с ними."
 spn_order.0164.a:0 "Идти с ними"
 spn_order.0164.a.tt:0 "Неофиты запомнят, кто шёл рядом с ними. Ты получаешь [spn_order_standing|E]."
 spn_order.0164.b:0 "Обновить оберег над аркой"
 spn_order.0164.b.tt:0 "Десять лет любому, кто станет обыскивать подземелья Коллегии или попробует пройти коридор без права, будет труднее. Ты получаешь [spn_order_standing|E]."
 spn_order.0164.c:0 "Пусть с ними пойдёт кто-то другой"

 # A New Lord Above the Hall (a player Temple Magus).
 spn_order.0165.t:0 "Новый господин над залом"
 spn_order.0165.desc:0 "У [spn_hl_county.GetName] новый господин: [spn_hl_new.GetTitledFirstName]. Коллегия теперь [spn_hl_new.GetHerHis] — с её учёными, книгами и сборами. Лестница за книжным шкафом всё ещё принадлежит храму, пока [spn_hl_new.GetSheHe] не начнёт её искать.\n\nМагистраты хотят знать, что ты намерен делать с [spn_hl_new.GetHerHim]."
 spn_order.0165.a:0 "Принять [spn_hl_new.GetHerHim] в Орден"
 spn_order.0165.a.tt:0 "Ты выдвинешь [spn_hl_new.GetHerHim] на следующем Отборе. Если маски не примут [spn_hl_new.GetHerHim], тебе об этом скажут, и не более того."
 spn_order.0165.b:0 "Учёные продолжат, как всегда"
 spn_order.0165.b.tt:0 "Ничего не меняется. [spn_hl_new.GetSheHe|U] всё ещё может начать искать."
 spn_order.0165.c:0 "Оставить зал"
 spn_order.0165.c.tt:0 "Лестницу замуровывают, и твой храм больше не собирается под этой Коллегией. Здание остаётся [spn_hl_new.GetHerHis]. Ты можешь возвести новую Коллегию в своей столице, если это замок, город или храм."

 # The Cellar That Isn't There (a player lord over a hall).
 spn_order.0166.t:0 "Подвал, которого нет"
 spn_order.0166.desc:0 "Коллегия в [spn_hl_county.GetName] досталась тебе вместе с графством. Твой управляющий просмотрел её счета и нашёл их в полном порядке, разве что щедрыми на свечи.\n\n«У студентов есть история, которую рассказывают каждому новичку, — говорит управляющий. — Тайное общество учёных, Герметический Орден Голубой Розы, с храмом, скрытым под зданием. И неважно, что у Коллегии нет подвала»."
 spn_order.0166.a:0 "Учёные живут по странному распорядку"
 spn_order.0166.b:0 "Обыскать подвалы"
 spn_order.0166.b.tt:0 "Твои люди простучат стены и поднимут плиты. Возможно, они ничего не найдут."
 spn_order.0166.c:0 "Спросить магистра Коллегии, чему там учат по ночам"
 spn_order.0166.c.tt:0 "Если в этой истории что-то есть, кто-то может заинтересоваться господином, который задаёт правильные вопросы."

 # The Corridor (a hunter's temple sweep).
 spn_hunt.0173.t:0 "Коридор"
 spn_hunt.0173.desc:0 "За второй дверью — лестница, а у её подножия длинный коридор под аркой, на которой высечены слова на языке, который ты знаешь лишь наполовину. Через несколько шагов воздух становится холодным. Что-то в этом месте хочет, чтобы ты боялся, и точно знает, чего ты боишься.\n\nТе, за кем ты пришёл, ушли этим путём."
 spn_hunt.0173.a:0 "Пройти через него"
 spn_hunt.0173.a.tt:0 "Некоторые проходят. Некоторые приходят в себя на лестнице, когда ночь уже прошла."
 spn_hunt.0173.b:0 "Повернуть назад"
 spn_hunt.0173.b.tt:0 "Облава заканчивается здесь. Никто не назовёт это трусостью."
 spn_hunt_toast_corridor_pass:0 "Сквозь коридор"
 spn_hunt_toast_corridor_pass.desc:0 "Ты вышел в дальнем конце, весь дрожа, в комнату, полную книг и свечей. В храм под Коллегией проникли."
 spn_hunt_toast_corridor_sigil:0 "Знак открывает путь"
 spn_hunt_toast_corridor_sigil.desc:0 "Знак, который ты забрал у [spn_cor_sigil.GetFirstName], тёплый в твоей руке, и коридор — просто коридор."
 spn_hunt_toast_corridor_fail:0 "Ты приходишь в себя на лестнице"
 spn_hunt_toast_corridor_fail.desc:0 "Ты лежишь на лестнице, оружие рядом. Свечи догорели, ночь прошла. У тех, кто был внизу, было сколько угодно времени."
