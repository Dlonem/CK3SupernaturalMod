l_russian:
 # 2.39 (WORK-ORDER-2.39 F17): the wolf remembers, and the Draught of a Clear Mind.
 spn_order.0190.desc_guarded:0 "Порошок вспыхнул, комната поплыла, но это прошло. Ты помнишь всё: храм, маски, имена."
 spn_order.0195.t:0 "Оно возвращается"
 spn_order.0195.desc:0 "Звон начинается снова, и на этот раз с ним приходит что-то ещё: храм, маски, имена. Ночь, которую ты не мог вспомнить, — вся здесь."
 spn_order.0195.desc_pull:0 "Тебе снится комната, полная масок. Когда ты просыпаешься, имена всё ещё с тобой."
 spn_order.0195.a:0 "Я помню."
 spn_clear_mind_modifier:0 "Настой ясного разума"
 spn_clear_mind_modifier_desc:0 "Горький настой, сохраняющий разум за его хозяином. Пока он действует, никто не может принудить или подчинить выпившего или заставить его забыть."
 spn_ev2.41.mind:0 "Настой ясного разума."
