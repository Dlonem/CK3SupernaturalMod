l_russian:
 spn_order_invocare_decision:0 "Инвокаре"
 spn_order_invocare_decision_desc:0 "[Glossary('Invocare','spn_gloss_invocare')] вписано в закон [spn_order|E], и его редко произносят вслух. Произнеси его, и храмы должны собраться в масках, чтобы решить, сохранит ли Великий Магус кресло.\n\nНикто не забывает, кто его произнёс."
 spn_order_invocare_decision_tooltip:0 "Призвать храмы судить Великого Магуса."
 spn_order_invocare_decision_confirm:0 "Произнести слово"
 spn_invocare_standing_tt:0 "У тебя не менее 50 [spn_order_standing|E]"
 spn_invocare_second_tt:0 "Тебя поддержит другой [spn_temple_magus|E]: тот, кто не любит Великого Магуса, или твой друг"
 spn_invocare_temples_tt:0 "Существует не менее трёх храмов (если меньше, старший [spn_temple_magus|E] просто занимает кресло)"
 spn_invocare_settled_tt:0 "Великий Магус занимает кресло не менее трёх лет"
 spn_invocare_cd_tt:0 "Инвокаре не звучало в последние десять лет"
 spn_invocare_pending_tt:0 "Других Инвокаре, ожидающих рассмотрения, нет"
 spn_invocare_imperium_tt:0 "Великий Магус не обладает Империумом"
 spn_invocare_host_tt:0 "Ты или другой свободный [spn_temple_magus|E] можете принять храмы: тот, кто владеет землёй и не принимал [spn_conclave|E] в последние пять лет"
 spn_invocare_effect_tt:0 "Храмы собираются на [spn_conclave|E]. Великий Магус узнаёт об этом первым и может подготовить защиту. Если голосующих «за» больше, чем «против», кресло освобождается, и тот же Конклав выбирает, кто его займёт. При равенстве голосов Великий Магус остаётся в нём."
 spn_invocare_effect_cost_tt:0 "Когда предложение рассматривают, ты теряешь 20 [spn_order_standing|E], и ещё десять лет никто не сможет призвать другое Инвокаре. Если оно провалится, ты потеряешь ещё 20 и своё место в [spn_gnostic_council|E], если оно у тебя есть. Если Конклав так и не соберётся, никто ничего не платит."
 spn_invocare_toast_no_host:0 "Ни один храм не может принять собрание"
 spn_invocare_toast_no_host_desc:0 "Ни один [spn_temple_magus|E], владеющий землёй, не может созвать храмы. Ничего не было сказано."
 spn_order_invocare_opinion:0 "Усомнился в моей власти"
 spn_invocare_toast_lapsed:0 "Предложение утратило силу"
 spn_invocare_toast_lapsed_desc:0 "Храмы собрались, но Инвокаре так и не рассмотрели. Никто за это ничего не платит."
 spn_conclave.0001.desc_invocare:0 "Слово произнесено: Инвокаре. Храмы должны собраться и решить, сохранит ли Великий Магус кресло, и созвать их выпало тебе.\n\nЗаписки уходят без имён. В каждой сказано лишь где и когда."
 spn_conclave.0001.desc_invocare_self:0 "Ты произнёс слово: Инвокаре. Теперь храмы должны собраться и решить, сохранит ли Великий Магус кресло, и созываешь их ты.\n\nЗаписки уходят без имён. В каждой сказано лишь где и когда."
 spn_conclave.0240.t:0 "Кресло под вопросом"
 spn_conclave.0240.desc:0 "Записка без подписи, но ты узнаёшь почерк. [spn_iv_caller.GetTitledFirstName] призвал [Glossary('Invocare','spn_gloss_invocare')].\n\nКогда храмы в следующий раз соберутся в масках, они проголосуют, сохранишь ли ты кресло Великого Магуса. Если «за» больше, чем «против», кресло опустеет ещё до конца ночи. Если поровну — оно по-прежнему твоё.\n\nДо их встречи есть время. Немного."
 spn_conclave.0240.a:0 "Тогда они вспомнят, чем мне обязаны"
 spn_conclave.0240.a.tt:0 "Когда храмы соберутся, ты потребуешь долги с каждого голосующего в зале, на кого у тебя есть крючок. Каждый из них проголосует за то, чтобы ты остался."
 spn_conclave.0240.b:0 "Открыть сундуки совета"
 spn_conclave.0240.b.tt:0 "Когда храмы соберутся, 100 золота из средств совета купят три маски, менее всего уверенные в своём голосе. Если к тому времени сундуки опустеют, ничего не будет заплачено."
 spn_conclave.0240.c:0 "Напомнить им, что Орден совершил при мне"
 spn_conclave.0240.c.success:0 "Они прислушались"
 spn_conclave.0240.c.success_desc:0 "Твои слова повторяют в каждом храме. Некоторые маски вспомнят их при голосовании."
 spn_conclave.0240.c.failure:0 "Никого не тронуло"
 spn_conclave.0240.c.failure_desc:0 "Письма разосланы, и храмы их прочли. Похоже, никто не изменил своего мнения."
 spn_conclave.0240.d:0 "Показать силу"
 spn_conclave.0240.d.tt:0 "Когда храмы соберутся, ты потратишь очень много силы так, чтобы это почувствовал каждый Маг в зале. Если к тому времени тратить будет нечего, ничего не произойдёт."
 spn_conclave.0240.e:0 "Пусть видят, кому переходят дорогу"
 spn_conclave.0240.e.tt:0 "Те, кто тебя боится, подумают дважды. Те, кто не боится, могут оскорбиться угрозой."
 spn_conclave.0240.f:0 "Я не стану ждать, пока меня столкнут"
 spn_conclave.0240.f.tt:0 "Когда храмы соберутся, ты оставишь кресло до голосования. Ты получаешь 10 [spn_order_standing|E], и никто не сможет сказать, что тебя выгнали. В последующем голосовании ты не участвуешь как кандидат."
 spn_conclave.0240.g:0 "Пусть решают маски"
 spn_conclave.0240.g.tt:0 "Ты ничего не делаешь. Голосование будет таким, каким будет."
 spn_conclave.0250.t:0 "Инвокаре"
 spn_conclave.0250.desc:0 "[spn_iv_caller.GetTitledFirstName] встаёт в центр круга и произносит слово: [Glossary('Invocare','spn_gloss_invocare')]. Зал замирает.\n\nВопрос в том, сохранит ли [spn_iv_magus.GetTitledFirstName] кресло Великого Магуса. Когда чаша дойдёт до тебя, ты напишешь на своей записке «за» или «против» — или ничего. Если «за» больше, кресло опустеет. Если меньше или поровну, оно по-прежнему [spn_iv_magus.GetHerHis]."
 spn_conclave.0250.desc_broke:0 "\n\nПо залу прошёл слух: [spn_iv_magus.GetSheHe] нарушил правила [spn_order|E]."
 spn_conclave.0250.desc_favour:0 "\n\nГоворят об услугах, оказанных там, где не следовало."
 spn_conclave.0250.desc_bound:0 "\n\n[spn_iv_magus.GetFirstName] уже напомнил тебе, чем ты обязан [spn_iv_magus.GetHerHim]."
 spn_conclave.0250.a:0 "За. Пусть кресло опустеет"
 spn_conclave.0250.b:0 "Против. [spn_iv_magus.GetSheHe|U] сохраняет его"
 spn_conclave.0250.c:0 "Оставить записку пустой"
 spn_conclave.0250.c.tt:0 "Твоя записка не засчитывается ни одной из сторон."
 spn_conclave.0250.bound_tt:0 "Великий Магус потребовал то, чем ты обязан [spn_iv_magus.GetHerHim]"
 spn_conclave.0250.late_tt:0 "Записки уже подсчитаны."
 spn_conclave.0260.t:0 "Записки подсчитаны"
 spn_conclave.0260.desc_passed_magus:0 "Записки зачитывают одну за другой. Задолго до последней никому уже не нужно этого говорить: кресло Великого Магуса больше не твоё.\n\nПрежде чем разойтись, храмы выберут, кто его займёт. На этот раз твоего имени среди кандидатов не будет."
 spn_conclave.0260.desc_passed_caller:0 "Записки зачитывают одну за другой, и побеждают голоса «за». [spn_iv_magus.GetTitledFirstName] больше не Великий Магус.\n\nПрежде чем разойтись, храмы выберут, кто займёт кресло."
 spn_conclave.0260.desc_kept_magus:0 "Записки зачитывают одну за другой, и когда прочитана последняя, кресло всё ещё твоё. [spn_iv_caller.GetTitledFirstName] не смотрит на тебя.\n\nТы запомнишь, кто произнёс слово."
 spn_conclave.0260.desc_kept_caller:0 "Записки зачитывают одну за другой, и этого недостаточно. [spn_iv_magus.GetTitledFirstName] сохраняет кресло, и [spn_iv_magus.GetSheHe] всё это время не сводил с тебя глаз.\n\nМаски помнят, кто призывает Инвокаре и проигрывает. Ты теряешь ещё [spn_order_standing|E] и своё место в [spn_gnostic_council|E], если оно у тебя было."
 spn_conclave.0260.desc_yielded_magus:0 "Прежде чем чаша пошла по кругу, ты встал и оставил кресло. Голосования не было.\n\nЧто бы ни думали о тебе храмы, никто не сможет сказать, что тебя выгнали."
 spn_conclave.0260.desc_yielded_caller:0 "Прежде чем чаша успела пойти по кругу, [spn_iv_magus.GetTitledFirstName] встал и оставил кресло. Голосования не было.\n\nПрежде чем разойтись, храмы выберут, кто его займёт."
 spn_conclave.0260.a:0 "Дело сделано"
 spn_conclave_log_invocare_passed_title:0 "Инвокаре"
 spn_conclave_log_invocare_passed:0 "Храмы проголосовали за то, чтобы [CHARACTER.GetTitledFirstName] оставил кресло Великого Магуса."
 spn_conclave_log_invocare_kept_title:0 "Инвокаре"
 spn_conclave_log_invocare_kept:0 "Храмы проголосовали, и [CHARACTER.GetTitledFirstName] сохранил кресло Великого Магуса."
 spn_conclave_toast_favouritism:0 "Маски услышали разговоры"
 spn_conclave_toast_favouritism_desc:0 "Разговоры об услугах дошли до Конклава. Ты теряешь [spn_order_standing|E], и дело закрыто."
 spn_order_break_decision:0 "Сломить Орден Голубой Розы"
 spn_order_break_decision_desc:0 "За тихими учёными и запертыми библиотеками стоит [spn_order|E]: храмы, что собираются в масках, совет, не подчиняющийся ни одному королю, и Великий Магус над всеми ними. Ты видел достаточно, чтобы знать: это правда.\n\nСорви маски со всех храмов разом, и пройдёт много времени, прежде чем он сможет собраться снова."
 spn_order_break_decision_tooltip:0 "Сорвать маски со всех храмов Ордена разом."
 spn_order_break_decision_confirm:0 "Сломить"
 spn_order_break_road_tt:0 "Ты охотишься на ведьм, возглавляешь веру, осуждающую ведовство, являешься Главным инквизитором, покинул Орден или в родстве с тем, кому он причинил зло"
 spn_order_break_heads_tt:0 "Ты знаешь [spn_temple_magus|E] не менее половины его храмов"
 spn_order_break_fallen_tt:0 "Храм пал от твоей руки или от руки охотника при твоём дворе, или [spn_temple_magus|E], которого ты знаешь как такового, сидит в твоём подземелье"
 spn_order_break_chair_tt:0 "Кресло Великого Магуса пустует, или его обладатель сидит в твоём подземелье и ты знаешь, кто это"
 spn_order_break_not_broken_tt:0 "Орден не был сломлен в последние двадцать лет"
 spn_order_break_not_pending_tt:0 "Никто ещё не выступил против Ордена"
 spn_order_break_effect_night_tt:0 "Весть доходит до Ордена этой же ночью, и он ответит. Если его ответ тебя остановит, ты не потеряешь ничего, кроме времени."
 spn_order_break_effect_secrets_tt:0 "Каждый член Ордена разоблачён."
 spn_order_break_effect_treasury_tt:0 "Казна совета — твоя, или то, что Орден не успел спрятать."
 spn_order_break_effect_council_tt:0 "Кресло Великого Магуса и все места в совете пустеют."
 spn_order_break_effect_temples_tt:0 "Каждый храм закрыт."
 spn_order_break_effect_rise_tt:0 "Двадцать лет не будет основан ни один новый храм, если только Маг, знающий троих других такими, какие они есть, не основит его снова."
 spn_order_break_effect_cost_tt:0 "Когда всё будет кончено, ты тратишь 1000 престижа (1000 благочестия, если возглавляешь веру)."
 spn_order.0982.t:0 "Роза сжигает свои письма"
 spn_order.0982.desc:0 "После наступления темноты прискакал всадник с одним именем: [spn_bk_breaker.GetTitledFirstName]. К утру [spn_bk_breaker.GetSheHe] намерен сорвать маски со всех храмов разом.\n\nВ очаге уже горят письма [spn_order|E]. Что случится до рассвета, решать тебе."
 spn_order.0982.a:0 "Послать Адептуса Майора"
 spn_order.0982.a.tt:0 "Адептус Майор этой ночью навестит [spn_bk_breaker.GetFirstName]. Если [spn_bk_breaker.GetSheHe] можно подкупить или заставить забыть, ломать будет нечего."
 spn_order.0982.b:0 "Спрятать то, что можно спрятать"
 spn_order.0982.b.tt:0 "Бумаги идут в огонь, а половина сундуков совета прячется там, где их никто не найдёт. Если Разгром наступит, взять будет настолько же меньше."
 spn_order.0982.c:0 "Пусть храмы разбегутся"
 spn_order.0982.c.tt:0 "Каждый храм закрывается этой ночью. Его члены уходят со своими тайнами и своей магией, но Ордена больше нет, и пройдут годы, прежде чем он сможет собраться снова."
 spn_order.0980.t:0 "Роза сломлена"
 spn_order.0980.desc:0 "К утру всё кончено. Имена раскрыты, кресло Великого Магуса пустует, то, что оставалось в сундуках совета, — твоё, и каждый храм закрыт.\n\nСкоро они не соберутся. А когда соберутся, будут помнить, кто это сделал."
 spn_order.0980.a:0 "Пусть помнят"
 spn_order.0981.t:0 "Маски сорваны"
 spn_order.0981.desc:0 "Перед рассветом [spn_bk_breaker.GetTitledFirstName] выступил против всех храмов разом. Имена, которые никогда не произносились за пределами масок, зачитывают вслух в залах и на рынках, и твоё среди них.\n\n[spn_order|E] кончен. Что бы ни пришло теперь, ты встретишь это без маски."
 spn_order.0981.a:0 "Тогда пусть смотрят"
 spn_order.0981.a.tt:0 "Твоё место в Ордене становится известно всем, а твой храм закрыт."
 spn_order.0983.t:0 "Роза помнит"
 spn_order.0983.desc:0 "Новый храм — это подвал, несколько стульев и одолженный ключ. Это начало.\n\nСтаршие члены всё ещё произносят одно имя как проклятие: [spn_or_breaker.GetTitledFirstName], сломивший [spn_order|E]. [spn_or_breaker.GetSheHe|U] всё ещё жив."
 spn_order.0983.a:0 "Послать за [spn_or_breaker.GetHerHim] Адептуса Майора"
 spn_order.0983.a.tt:0 "Адептус Майор найдёт [spn_or_breaker.GetFirstName], и Орден будет следить за [spn_or_breaker.GetHerHim]."
 spn_order.0983.b:0 "Пусть старая рана затянется"
 spn_order.0983.b.tt:0 "У нового храма и так хватает дел."
 spn_order.0710.desc_break:0 "У твоего коня ждёт незнакомец в простом плаще. [spn_am_agent.GetSheHe|U] знает твоё имя, и [spn_am_agent.GetSheHe] знает, что ты собираешься сделать утром.\n\n«Возьми золото и забудь этот дом. Или останься, и мы заставим тебя забыть»."
 spn_order.0710.c:0 "Я лучше стану одним из вас"
 spn_order.0710.c.tt:0 "Незнакомец улыбается. Когда храмы в следующий раз будут выбирать, кого позвать, твоё имя будет в начале списка. Ты сохраняешь всё, что знаешь."
 spn_order_toast_temples_scatter:0 "Храмы разбегаются"
 spn_order_toast_break_failed:0 "Роза ускользает"
 spn_order_toast_break_failed_desc:0 "К утру бить было уже не по чему. Что бы ты ни задумал, этого не случилось."
 spn_order_toast_break_unpaid_desc:0 "К утру ты уже не мог заплатить нужную цену. Ничего не было сделано, и ничего не было заплачено."
 spn_order_toast_order_broken:0 "Орден сломлен"
 spn_order_toast_pledge_ends_desc:0 "Твой храм закрылся, и твоя клятва [spn_order|E] заканчивается вместе с ним."
 spn_order_refound_broken_tt:0 "Орден был сломлен меньше двадцати лет назад: тебе нужно знать трёх других Магов в пределах досягаемости, а не двух"
 spn_order.1007.t:0 "Сестра под судом"
 spn_order.1007.t_brother:0 "Брат под судом"
 spn_order.1007.desc_dead:0 "Приходят вести от двора [spn_st_accuser.GetTitledFirstName]. [spn_st_sister.GetTitledFirstName] судили как ведьму, и [spn_st_sister.GetSheHe] этого не пережил.\n\nХрам захочет знать, что ты намерен с этим делать."
 spn_order.1007.desc_cell:0 "[spn_st_accuser.GetTitledFirstName] отдал [spn_st_sister.GetTitledFirstName] под суд как ведьму. Допросы окончены, но [spn_st_sister.GetSheHe] всё ещё в камере, и никто не спешит выпускать [spn_st_sister.GetHerHim].\n\nЧто [spn_st_sister.GetSheHe] там сказал, никто тебе сказать не может."
 spn_order.1007.desc_free:0 "[spn_st_accuser.GetTitledFirstName] отдал [spn_st_sister.GetTitledFirstName] под суд как ведьму, и [spn_st_sister.GetSheHe] вышел оттуда.\n\nЭто хорошая новость, насколько это возможно. Что [spn_st_sister.GetSheHe] там сказал, никто тебе сказать не может."
 spn_order.1007.a:0 "[spn_st_sister.GetSheHe|U] не останется без ответа"
 spn_order.1007.a.tt:0 "Адептус Майор навестит [spn_st_accuser.GetFirstName], и Орден будет следить за [spn_st_accuser.GetHerHim]."
 spn_order.1007.b:0 "Назвать [spn_st_sister.GetHerHis] имя на следующем обряде, и не более"
 spn_order.1007.b.tt:0 "Молчание — первое из трёх слов."
 spn_order.1007.c:0 "Выкупить [spn_st_sister.GetHerHis] свободу"
 spn_order.1007.c.tt:0 "Золото переходит из рук в руки, и [spn_st_sister.GetFirstName] выпускают из [spn_st_sister.GetHerHis] камеры."
 spn_order.1007.c.ai_tt:0 "[spn_st_sister.GetHerHis|U] тюремщик не из тех, кому храм может просто заплатить"
 spn_order.1007.d:0 "Бросить Порошок в [spn_st_sister.GetHerHis] тюремщиков"
