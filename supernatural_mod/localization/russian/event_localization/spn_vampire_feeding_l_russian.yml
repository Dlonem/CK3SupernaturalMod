l_russian:
 vampire_feeding:0 "Пиршество"
 vampire_feeding_desc:0 "Прошло немало времени с вашего последнего пиршества. Отправляйтесь в ближайший город и найдите того, кем можно насытиться."
 vampire_feeding_host_desc:0 "$BULLET_WITH_TAB$Вампиры могут получить [prestige|E]\n$BULLET_WITH_TAB$Вампиры могут получить [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Вампиры могут получить [gold|E]\n$BULLET_WITH_TAB$Вампиры могут обрести знания и навыки\n"
 vampire_feeding_guest_desc:0 "$BULLET_WITH_TAB$Вампиры могут получить [prestige|E]\n$BULLET_WITH_TAB$Вампиры могут получить [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Вампиры могут получить [gold|E]\n$BULLET_WITH_TAB$Вампиры могут обрести знания и навыки\n"
 vampire_feeding_selection_tooltip:0 "Отправляйтесь на поиски человека, чтобы насытиться и укрепить свою силу."
 vampire_feeding_destination_selection:0 ""
 vampire_feeding_province_desc:0 "Это подходящее место, чтобы найти того, кем можно насытиться."
 vampire_feeding_predicted_cost:0 "Вам потребуется потратить немного золота, чтобы смешаться с толпой."
 vampire_feeding_guest_help_text:0 "Пиршество в одиночку более насыщающее, но совместная охота с другими вампирами повышает безопасность."
 vampire_feeding_host_an_a:0 "вампир"
 known_vampire_feed:0 "Вам будет сложнее питаться, будучи известным как [GetTrait('spn_known_vampire').GetName( GetNullCharacter )]."
 known_hybrid_feed:0 "Вам будет сложнее питаться, будучи известным как [GetTrait('spn_known_hybrid').GetName( GetNullCharacter )]."
 
 #Activity Intents
 strengthen_the_blood_intent:0 "Укрепить кровь"
 strengthen_the_blood_intent_desc:0 "Питайся, чтобы усилить свои вампирские силы, развивая [Concept('vampire','Vampirism')|E], чтобы открыть большую мощь и власть над своими способностями."
 satiate_thirst_intent:0 "Утолить жажду"
 satiate_thirst_intent_desc:0 "Питайся, чтобы сохранить равновесие и власть над своим неустойчивым состоянием, ослабив [stress|E], которым грызущий голод терзает разум и тело."
 embrace_the_night_intent:0 "Принять ночь"
 embrace_the_night_intent_desc:0 "Питайся, чтобы упиться азартом ночи. Предайся своему бессмертию, растворись в мгновении, и пусть дикая энергия ночи смоет твой [stress|E], принеся [prestige|E] за твою невоздержанность."

 #Phases
 searching_phase:0 "Поиск"
 searching_phase_desc:0 "Охотьтесь за идеальной добычей в тенях."
 feeding_phase:0 "Пиршество"
 feeding_phase_desc:0 "Утолите свой голод и примите ночь."
 
 #Guest Invites
 activity_invite_rule_vampires:0 "Вампиры"
 activity_invite_rule_vampires_desc:0 "Вампиры, о которых ты можешь по разумным причинам знать, что они такое: те, кто этого не скрывает; те, чью тайну ты хранишь; твой супруг(а) и близкая родня; и твой создатель или твоё потомство."
 activity_invite_rule_supernatural_mp:0 "Сверхъестественные игроки"
 activity_invite_rule_supernatural_mp_desc:0 "Другие игроки с твоим состоянием, отобранные по тому же признаку: у тебя должен быть способ узнать, что они такое."
 activity_invite_rule_hybrids:0 "Гибриды"
 activity_invite_rule_hybrids_desc:0 "Гибриды по тому же правилу — известные тебе по черте, по тайне, по крови или по тому, что это они сделали тебя тем, кто ты есть."
 
 #Activity Options
 options_preparations:0 "Подготовка"
 preparations_option_instinct:0 "Вампирские инстинкты"
 preparations_option_instinct_desc:0 "Положись на инстинкты и рыскай по округе в поисках лёгкой одинокой цели.\n\nТы не делаешь особых приготовлений и не тратишь [gold|E]. Ты просто импровизируешь, когда приходит момент кормления."
 preparations_option_scout:0 "Разведать город"
 preparations_option_scout_desc:0 "Потрать время на разведку, чтобы найти самые безопасные и подходящие места для кормления.\n\nОткрывает более безопасный, продуманный подход во время кормления — для более чистого убийства и более устойчивого роста силы."
 preparations_option_trap:0 "Устроить ловушку"
 preparations_option_trap_desc:0 "Используй уловки, чтобы заманить лучшие цели в выбранное место кормления, и пусть всё будет устроено в точности под твои нужды.\n\n#high Значительно#! улучшает твой подход во время кормления (вернейший путь к чистому и выгодному убийству), но стоит [gold|E]."
 options_spoils:0 "Добыча"
 spoils_option_dead_respect:0 "Уважение к мертвым"
 spoils_option_dead_respect_desc:0 "Проявите почтение к тем, кто погиб, отказавшись грабить их имущество.\n\nПолучите [piety|E] за свою сдержанность и честь среди тех, кто ценит такие принципы."
 spoils_option_robbing:0 "Взять то, что нужно"
 spoils_option_robbing_desc:0 "Выдай своё кормление за досадное ограбление. \n\nОбчистив карманы жертвы, ты получаешь немного лишнего [gold|E], чтобы пережить грядущие века. \n\nЕсли что-то пойдёт не так, это может даже сойти за неудачное ограбление. \n\nДобычу ты забираешь, когда подбираешься для кормления."
 spoils_option_casing:0 "Выбрать богатую цель"
 spoils_option_casing_desc:0 "Тщательно выбирай жертв, чтобы найти ценную цель. Их кровь обещает быть вкусной, а карманы — ещё полнее.\n\nИх более толстый кошелёк приносит гораздо больше [gold|E], которое ты забираешь, когда наконец подбираешься для убийства."

 #Activity Conclusion
 vampire_feeding_conclusion_desc:0 "[GetActivityType( 'vampire_feeding' ).GetName] завершено."
 supernatural_ev1.24.title:0 "Наслаждающийся ночью"
 supernatural_ev1.24.desc:0 "С наступлением темноты город оживает — музыка, смех и теплая атмосфера толпы смертных. На одну ночь вы становитесь не монстром, крадущимся в тени, а существом с аппетитом, наслаждающимся ими. Вы можете полностью забыться или насладиться острыми ощущениями, сохраняя бдительность."
 supernatural_ev1.24.a:0 "Погрузитесь в это веселье с головой."
 supernatural_ev1.24.a_tt:0 "Получить [prestige|E] и потратить [stress|E]. высокомерные упиваются больше всех; умеренных такая снисходительность выбивает из колеи."
 supernatural_ev1.24.b:0 "Балуй себя своим желаниям, но держи себя в руках."
 supernatural_ev1.24.b_tt:0 "Наслаждайтесь ночью, оставаясь начеку. Немного повысьте свой  [prestige|E] и ослабьте свой [stress|E]; параноикам легче отдыхать из-за осторожности."

 supernatural_ev1.23.botched:0 "Ускользнуть в ночь."
 supernatural_ev1.23.botched_tt:0 "Кормление пошло не так, и свидетель выжил. Преодолейте стресс, исчезните и молитесь, чтобы слухи о том, кто вы такой, не распространились."
 supernatural_ev1.23.desc_botched:0 "Всё идёт не так. Крик, упавший фонарь, лицо, которое увидело слишком много, прежде чем ты успел закончить. Улица просыпается, а ты всё ещё стоишь над телом. Тебе нужно уходить и надеяться, что слух о том, кто ты такой, не переживёт эту ночь."
 supernatural_ev1.23.botched_silence:0 "Заставить свидетеля замолчать навсегда."
 supernatural_ev1.23.botched_silence_tt:0 "Убей того, кто тебя увидел. Разоблачения не будет, но труп на улице и кровь на твоих руках, и настоящий Охотник все равно может заметить. Черствые едва ли дрогнут; такие люди одержимы."
 supernatural_ev1.23.botched_flee:0 "Скрыться в ночи."
 supernatural_ev1.23.botched_flee_tt:0 "Исчезни сейчас, и пусть они болтают без умолку. Ты сбежал, но живой свидетель означает, что слухи о твоей натуре, скорее всего, распространятся — и Охотник в городе может их услышать."
 supernatural_ev1.23.botched_compel:0 "Заставь их забыть."
 supernatural_ev1.23.botched_compel_tt:0 "Завладейте их разумом и сотрите память начисто. Истинное мастерство (перк "Принуждение" или опыт "глубокого следования") гораздо надежнее; в случае неудачи они ускользнут, а с ними и ваш секрет."
 vf_prov_base:0 "Некоторые улицы предлагают более богатую и безопасную охоту, чем другие.\n"
