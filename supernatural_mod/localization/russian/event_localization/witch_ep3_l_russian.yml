 gift_from_hecate_modifier:0 "Подарок от Гекаты"
 ev4.85.title:0 "Мастер Магии"
 ev4.85.desc:0 "Перед вами материализуется демон. Он напоминает деформированную старую женщину, но окружен поистине мощной магической аурой. На мгновение вы боитесь, что рунический круг не выдержит напора ее силы. 'Вы стоите перед богиней, смертный' - ее губы не шевелятся, но вы слышите слова в своей голове - 'Я слежу за вами уже некоторое время и знаю, чего вы хотите. Силы. Все больше и больше силы...'"
 ev4.85.0.a:0 "Да, именно. Дайте мне больше силы."
 ev4.85.0.b:0 "Бессмертие. Я хочу жить вечно."
 ev4.85.0.c:0 "Я только хочу силы, чтобы защитить себя от своих врагов."
 ev4.85.0.d:0 "Меня интересует только сила знаний."
 ev4.86.desc:0 "О, да, я могу дать это тебе. Но не безвоздмездно. Я не обычный подчиненный демон, которого ты можешь заставить сотрудничать. Если ты хочешь мои дары, ты должен отдать мне свою душу, ни больше, ни меньше. Через 30 лет я пришлю кого-то, чтобы забрать тебя к воротам ада."
 ev4.86.desc2:0 "Качество имеет значение, а не длина. Я могу дать тебе вторую молодость... и 30 лет беззаботной жизни. Тогда твоя душа будет моей. Я не дам тебе ничего без 'платы'."
 ev4.86.0.a:0 "Пусть будет так, моя душа твоя."
 ev4.86.0.b:0 "Моя душа в обмен на силу."
 ev4.86.0.c:0 "Тогда я предпочитаю защиту."
 ev4.86.0.d:0 "На самом деле, я могу заставить тебя сотрудничать..."
 ev4.86.0.d_ct:0 "Ты наложил мощное связывающее заклинание."
 ev4.86.0.d1:0 "Демон исполнит твою волю бесплатно."
 ev4.86.0.d2:0 "Заклинание не сработало..."
 ev4.86.0.e:0 "Мне не нравится твое предложение. Исчезни."
 ev4.87.title:0 "Место для Магической Башни было определено."
 drink_pot5_decision_ct:0 "Ты можешь вернуть несколько лет своей жизни."
 ev4.85.0.b_ct:0 "Демон рассмотрит твою просьбу."
 hecate_option2_ct:0 "Ты будешь омоложен."
