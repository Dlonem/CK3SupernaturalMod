l_russian:
 witchcraft_legacy_1_ct2:0 "Вы можете захватить магический артефакт, посадив в тюрьму его владельца"
 mage_trait_required:0 "#N Для разблокировки этого перка требуется арканный фокус или черта мага#!"
 trait_track_witch_hunter:0 "Охота на ведьм"
 trait_track_witch_hunter_desc:0 "Справляться с ведьмами и сверхъестественными угрозами."
 witch_hunter_ct0:0 "Тестест"
 wh_spec1_terrain_cancel_negative_supply:0 "Разблокирует суд над колдуньей [interaction|E] с пленниками"
 wh_spec2_terrain_cancel_negative_supply:0 "Разблокирует остановку колдуньи [interaction|E] с колдуньями"
 wh_spec3_terrain_cancel_negative_supply:0 "Эта черта होगी унаследована вашим наследником"
 wh_spec_BH_terrain_cancel_negative_supply:0 "Разблокирует начало охоты на колдунью [decision|E]"
 one_less_witch_title:0 "Колдунья умерла"
 inq_modifier:0 "Главный инквизитор"
 stop_the_witch:0 "Остановить колдунью"
 stop_the_witch_desc:0 "Примите необходимые меры, чтобы остановить колдунью."
 stop_the_witch_ct:0 "Операция против колдуньи будет начата"
 stop_the_witch_ct2:0 "[recipient.GetSheHe|U] может быть убит, захвачен или подвергнут саботажу"
 ev4.1.title:0 "Ассистент на прокат"
 ev4.1.desc:0 "В ваш дворец пришел мужчина, [sidek.GetSheHe] кажется экспертом в охоте на колдуней. Вы думаете, что [sidek.GetSheHe] ищет работу."
 ev4.1.0.a:0 "Помощь всегда пригодится."
 ev4.1.0.b:0 "Я не хочу [sidek.GetHerHim] здесь."
 ev4.2.title:0 "Молот ведьм"
 ev4.2.desc:0 "На горизонте появилась еще одна ведьма, и только вам решать, что с этим делать. Долг зовет."
 ev4.2.0.a:0 "Я хочу [recipient.GetHerHim] в своей темнице, сейчас же!"
 ev4.2.0.a1:0 "Ведьма была поймана"
 ev4.2.0.a2:0 "Ведьма сбежала"
 ev4.2.0.b:0 "Я отправлю [helper.GetTitledFirstName]."
 ev4.2.0.c:0 "Я сам займусь грязной работой."
 ev4.2.0.ct:0 "Вы продолжаете свои усилия, чтобы остановить ведьму"
 ev4.2.0.d:0 "Я назначу награду за голову ведьмы."
 ev4.2.0.d1:0 "Вы нашли опытного охотника за головами"
 ev4.2.0.d2:0 "Вы нашли неуклюжего охотника за головами"
 ev4.2.0.d_ct:0 "Охота начнется"
 ev4.2.0.e:0 "Я прошу [wliege.GetTitledFirstName] передать мне ведьму."
 ev4.2.0.e_ct:0 "Ваша просьба будет рассмотрена"
 ev4.2.0.e_ct1:0 "Вы убедительны"
 ev4.2.0.e_ct2:0 "Ваша петиция, вероятно, будет отклонена"
 ev4.4.desc:0 "Нанятый охотник за головами вернулся. Похоже, он был успешен."
 ev4.4.0.a:0 "Он справился хорошо."
 ev4.5.desc:0 "Ваши агенты сообщают, что нанятый охотник за головами не справился с ведьмой. Его изуродованное тело было найдено на дороге."
 ev4.5.0.a:0 "Я достану тебя когда-нибудь, ты, чертовка."
 ev4.5.0.a_ct:0 "Колдунья останется на свободе... пока что."
 ev4.5.0.b:0 "Отправьте моих рыцарей!"
 ev4.6.title:0 "Петиция охотника на ведьм"
 ev4.6.desc:0 "[whunter.GetTitledFirstName] попросил меня передать [recipient.GetTitledFirstName] в его руки. Мой придворный официально обвинен в колдовстве. Позвольте подумать..."
 ev4.6.0.a:0 "Ну... нет."
 ev4.6.0.b:0 "Конечно."
 ev4.7.title:0 "Петиция отклонена"
 ev4.7.desc:0 "[wliege.GetTitledFirstName] отказался передать мне колдунью. Также возможно, что он будет готов к моим следующим действиям."
 ev4.7.0.a:0 "Мне нужен новый план."
 ev4.7.0.b:0 "Возможно, тебе вовсе не стоит быть правителем."
 ev4.7.0.c:0 "Или ты тоже колдунья?"
 ev4.8.desc:0 "Ты провела несколько дней, тщательно планируя. Колдунья, похоже, ни о чем не догадывается. Время сделать ход."
 ev4.8.0.a:0 "Я воспользуюсь классическим способом."
 witch_hunter_hunts_modifier:0 "Совершенный план"
 ev4.8.0.a_ct:0 "Твоя схема получает дополнительный шанс на успех"
 ev4.8.0.b:0 "Я подкрадусь к колдунье и сделаю то, что нужно."
 ev4.8.0.b1:0 "Колдунья попалась в ловушку"
 ev4.8.0.b2:0 "Колдунья не клюнула на приманку"
 ev4.8.0.c:0 "Пока что я останусь наблюдать."
 ev4.8.0.c_ct:0 "Наблюдения дадут вам шанс получить дополнительную информацию"
 ev4.9.title:0 "Ведьма под наблюдением"
 ev4.9.desc:0 "В конце концов, ваши наблюдения и отслеживание ведьмы принесли некоторые результаты. Вы получили ценную информацию."
 ev4.9.0.a:0 "Это может быть полезно."
 ev4.9.0.b:0 "Впереди еще больше работы."
 ev4.10.0.a:0 "Я встречусь с [recipient.GetHerHim] официально."
 ev4.10.0.a_ct:0 "Это действие #N рискованно#!"
 hunt_witch_lord_ps:0 "Ваша операция достигает #P прогресса#!"
 ev4.10.0.b:0 "Пусть [helper.GetTitledFirstName] разберется с [recipient.GetHerHim]."
 ev4.10.0.b_ct:0 "Ваш человек продолжает операцию против ведьмы"
 ev4.10.0.c:0 "Необходимо подготовить соответствующий план."
 ev4.11.title:0 "Без объявления о визите"
 ev4.11.desc:0 "[whunter.GetTitledFirstName] появился у ворот вашего поместья. Судя по всему, он хочет поговорить о каком-то деле."
 ev4.11.0.a:0 "Пусть [whunter.GetHerHim] войдет."
 ev4.11.0.b:0 "У меня нет времени для [whunter.GetHerHim] сегодня."
 ev4.11.0.c:0 "Охотник на ведьм! Пусть [whunter.GetHerHim] приходит, я готов."
 prepared_for_hunter_modifier:0 "Готовы к охотнику на ведьм"
 ev4.12.desc:0 "[recipient.GetTitledFirstName] отказался встретиться со мной! Возможно, это было совпадением, или [recipient.GetSheHe] догадался, что это ловушка."
 ev4.12.desc2:0 "[recipient.GetTitledFirstName] определённо ведьма. Необходимо предпринять дальнейшие действия в этом отношении."
 ev4.12.0.a:0 "Достаточно, другие дела требуют моего внимания."
 ev4.13.title:0 "Встретьте ведьму"
 ev4.13.desc:0 "[recipient.GetTitledFirstName] пригласила вас на порог [recipient.GetHerHis]. Вы настаивали на разговоре наедине, но вокруг есть слуги, и вы заметили несколько стражников. [recipient.GetTitledFirstName] явно пытается узнать цель вашего визита."
 ev4.13.0.a:0 "Итак... Я знаю, что ты ведьма"
 ev4.13.0.b:0 "Я думаю, у нас общие интересы..."
 ev4.13.0.c:0 "Не имеет значения, мне нужно идти."
 ev4.13.0.c_ct:0 "Вы заканчиваете встречу"
 ev4.14.desc:0 "'Я знаю, что ты ведьма' - сказала [whunter.GetTitledFirstName]. Вы вдруг вспоминаете слухи о том, что [whunter.GetSheHe] может быть охотником на ведьм."
 ev4.14.desc2:0 "'Я знаю, что ты ведьма' - сказала [whunter.GetTitledFirstName]. Так что это не совпадение - [whunter.GetSheHe] пришла за вами."
 ev4.14.0.a:0 "И что с того?"
 ev4.14.0.b:0 "Стражи! Арестуйте этого мужчину."
 ev4.14.0.b_ct:0 "Охотник на ведьм победил ваших стражников"
 ev4.15.desc:0 "'И что с того?' - ведьма смотрит на вас. Вы чувствуете, что атмосфера разговора резко изменилась."
 ev4.15.0.a:0 "Вы, вероятно, слышали, что я охотник. Немного неловко, да?"
 ev4.15.0.b:0 "Я бросаю вам вызов на дуэль."
 ev4.15.0.b_ct:0 "Ведьма рассмотрит ваше предложение."
 ev4.16.desc:0 "'Вы, вероятно, слышали, что я охотник. Охотник на ведьм. Немного неловко, да?' - вы видите опасный блеск в глазах [whunter.GetHerHis]."
 ev4.16.0.a:0 "Плюс, вы еще и дурак, что пришли сюда."
 ev4.16.0.b:0 "Подождите, не убивайте меня! Я буду сотрудничать!"
 ev4.17.desc:0 "'Плюс, вы еще и дурак, что пришли сюда' - ведьма выглядит уверенно - 'Что именно вы хотите добиться этим? Кроме вашей собственной смерти?'"
 ev4.17.0.a:0 "Я хотел узнать вас, прежде чем разобраться с вами."
 ev4.17.0.b:0 "Сдавайтесь, и вы спасете свою жизнь. Может быть."
 ev4.17.0.c:0 "Вы будете тем, кто умрет."
 ev4.17.0.c1:0 "Вам удается запереть дверь в покой."
 ev4.17.0.c2:0 "Вам не удается запереть дверь в покой."
 ev4.17.0.c2_ct:0 "Вам придется столкнуться с охранниками."
 ev4.18.desc:0 "'Я хотел узнать вас, прежде чем разобраться с вами' - сказал [whunter.GetSheHe]. Вы приходите к выводу, что [whunter.GetSheHe] либо очень глуп, либо очень смел."
 ev4.18.0.a:0 "Убирайся отсюда, охотник."
 ev4.18.0.b:0 "Достаточно. Сожги, ты ублюдок!"
 ev4.18.0.b_ct:0 "Ты ударил охотника потоком магической силы."
 ev4.19.desc:0 "'Убирайся отсюда, охотник, убирайся, прежде чем я позову стражу' - сказала ведьма, положив [recipient.GetHerHis] руку на гарду меча."
 ev4.19.0.a:0 "Увидимся, ведьма."
 ev4.19.0.a_ctx:0 "Охотник покидает твой дом."
 ev4.19.0.b:0 "Думаю, я убью тебя первым."
 ev4.20.desc:0 "Ты离ел ведьму и вернулся домой. К сожалению, ты надеялся на больший прогресс."
 ev4.20.desc2:0 "Ведьма не пришла на тайную встречу. Явно, что [recipient.GetSheHe] узнала о твоих намерениях."
 ev4.20.desc3:0 "Значит, [recipient.GetTitledFirstName] истинный волшебник. Это меняет многое. [recipient.GetSheHe|U] может быть самым серьезным противником, с которым ты столкнулся до сих пор."
 ev4.20.0.a:0 "Мне нужно подумать о следующем шаге."
 ev4.20.0.b:0 "Тем не менее, я кое-что узнал."
 ev4.21.desc:0 "'Думаю, у нас общие интересы' - сказал он после долгой паузы - 'Это деликатное дело, можем поговорить более приватно?'"
 ev4.21.0.a:0 "Никто не подслушивает нас, продолжай."
 ev4.21.0.b:0 "Хорошая попытка, охотник. Стражи!"
 ev4.22.desc:0 "'Общие интересы? Говори.'"
 ev4.22.0.a:0 "Дело касается [riv1.GetTitledFirstName]. [riv1.GetSheHe|U] наш общий враг."
 ev4.22.0.b:0 "Колдовство. Научи меня быть ведуньей."
 ev4.23.desc:0 "'Колдовство. Научи меня быть ведуньей' - голос [whunter.GetHerHis] дрожал."
 ev4.23.desc2:0 "'Дело касается [riv1.GetTitledFirstName]. [riv1.GetSheHe|U] наш общий враг. Мы можем объединить силы, чтобы остановить [riv1.GetHerHim]'"
 ev4.23.0.a:0 "Понимаю..."
 ev4.23.0.a_ct:0 "Вы принимаете приглашение на тайную встречу."
 ev4.23.0.a_ct2:0 "Вы принимаете приглашение на тайную встречу... но на самом деле не планируете на неё идти."
 ev4.24.desc:0 "Похоже, ведьма попалась на удочку. Вы пригласили [recipient.GetTitledFirstName] на тайную встречу, где обсудите детали. Теперь нам просто нужно подождать, пока ведьма придёт на собственные похороны [recipient.GetHerHis]."
 ev4.24.0.a:0 "Ловушка была подготовлена."
 ev4.25.desc:0 "Ваша цель пришла на тайное 'собрание'. Ведьма пришла одна. Похоже, [recipient.GetSheHe] в вашей власти."
 ev4.25.0.a:0 "Стражи, отведите ведьму в камеру."
 ev4.25.0.b:0 "Я просто отрублю ей голову."
 ev4.25.0.a_tit:0 "Поймана на секретной встрече"
 ev4.26.title:0 "Побеждённая Ведьмой"
 ev4.26.desc:0 "Вдруг, стражники появляются из ниоткуда. Прежде чем ты успел осознать это, тебя успокоили и разоружили. Теперь ты в милости ведьмы."
 ev4.26.0.a:0 "Проклятая ведьма!"
 ev4.27.desc:0 "Вдруг, стражники появляются из ниоткуда. Ты едва отразил их атаку. Ты ранен, но ведьма, похоже, в пределах досягаемости."
 ev4.27.0.a:0 "Сразись со мной, ведьма!"
 ev4.27.0.b:0 "Я доберусь до тебя... в следующий раз."
 ev4.27.0.b_ct:0 "Ты убегаешь"
 ev4.27.0.b_tit:0 "Твои стражники были побеждены"
 ev4.27.0.b_ct2:0 "Охотник сбежал"
 ev4.28.desc:0 "'В качестве охотника на ведьм, я вызываю тебя на честный дуэль насмерть!' - [whunter.GetSheHe] вытащил меч."
 ev4.28.0.a:0 "Пусть будет так."
 ev4.28.0.b:0 "Ты смешной. Стражники!"
 ev4.29.desc:0 "[recipient.GetTitledFirstName] поднимает [recipient.GetHerHis] руки, и между ними появляется шар магической энергии. 'Гори, охотник-пидор!' - [recipient.GetSheHe] кричит, когда поток силы попадает в тебя. Защитные руны смягчили часть удара, но ты ранен. Он настоящий маг!"
 ev4.29.0.a:0 "Время для тактического отступления!"
 ev4.30.desc:0 "Поток силы ударяет по охотнику, но у него есть какая-то магическая защита, которая рассеивает часть энергии заклинания. Он ранен, но бросился наутёк."
 ev4.30.0.a:0 "Впечатляюще. В следующий раз я использую более мощное заклинание."
 ev4.31.desc:0 "Сложная операция требует разработки продуманного плана. Особенно влиятельные ведьмы могут быть вне досягаемости прямой атаки. Вы должны решить, как вы хотите воздействовать на вашу цель."
 ev4.31.0.a:0 "Я предпринялю соответствующие дипломатические усилия."
 ev4.31.0.b:0 "Физическое противостояние - лучший способ. Я убью [recipient.GetHerHim]."
 ev4.31.0.c:0 "Я нанесу удар по финансам [recipient.GetHerHis]."
 ev4.31.0.c1:0 "Вам удаётся перехватить значительные средства."
 ev4.31.0.c2:0 "Вам удалось вызвать проблемы с купцами."
 ev4.31.0.d:0 "Я просто буду внимательно наблюдать за [recipient.GetHerHim]."
 ev4.31.0.d_ct:0 "Вы отправляете своих шпионов."
 ev4.31.0.d_ct2:0 "Вы сможете узнать, является ли цель членом ковена."
 ev4.31.0.e:0 "Ведьмы не должны быть правителями вообще."
 special_task_modifier:0 "Специальное задание"
 problems_with_merchants_modifier:0 "Проблемы с торговцами"
 ev4.32.desc:0 "Ваши шпионы сообщают, что ваша цель участвует в секретных встречах. Вероятно, вы имеете дело с организованным ковеном ведьм."
 ev4.33.desc:0 "Несколько подходящих писем и разговоров с нужными людьми могут заставить ведьму потерять поддержку и репутацию. Это может быть правильным способом ослабить её перед следующими атаками."
 ev4.33.0.a:0 "Я поговорю с [recipient.GetHerHis] сюзереном."
 ev4.33.0.a_tit:0 "Дипломатический саботаж"
 ev4.33.0.b:0 "Я попрошу главу веры вмешаться."
 ev4.33.0.c:0 "Я буду финансировать противников [recipient.GetHerHis]."
 ev4.33.0.d:0 "Я посею недовольство в королевстве [recipient.GetHerHis]."
 ev4.34.desc:0 "'Подождите, не убивайте меня! Я буду сотрудничать! Я всё расскажу! Просто послушайте...' - ведьма делится с вами многими секретами."
 ev4.34.0.a:0 "Я пощажу тебя пока что."
 ev4.34.0.b:0 "Акта покаяния недостаточно, чтобы спасти вашу жизнь."
 ev4.35.desc:0 "Сдавайся, ведьма! Тебя могут пощадить, если ты confess свои прегрешения и выдашь своих сообщников. В противном случае я отправлю тебя прямиком в ад."
 ev4.35.0.a:0 "Пусть будет, я сдаюсь."
 ev4.36.desc:0 "[whunter.GetTitledFirstName] бросился к двери и запер её. Затем он накинулся на вас с мечом [whunter.GetHerHis]!"
 ev4.36.0.a:0 "Так давайте сражаться."
 ev4.37.desc:0 "Решение принято. Ведьма умрет от вашей руки. Цель благородная, но путь к её достижению может быть не таким простым. Если бы убить ведьм было так просто, охотники не были бы нужны вовсе..."
 ev4.37.0.a:0 "Я постараюсь устроить дуэль."
 ev4.37.0.a_ct:0 "Ведьма будет вызвана на дуэль."
 ev4.37.0.b:0 "Один рез решит проблему."
 ev4.37.0.b_ct:0 "Вы отправляетесь на ночную миссию."
 ev4.37.0.c:0 "Я устрою несчастный случай."
 ev4.38.desc:0 "Вы получили письмо от [whunter.GetTitledFirstName]. Это похоже на официальное приглашение на дуэль насмерть. [whunter.GetTitledFirstName] – самопровозглашенный охотник на ведьм, и, похоже, вы - следующая цель [whunter.GetHerHis]."
 ev4.38.0.b:0 "Может быть, в другой раз..."
 ev4.39.desc:0 "[recipient.GetTitledFirstName] отверг ваше предложение, похоже, [recipient.GetSheHe] трус. Вам нужно придумать другой план."
 ev4.40.desc:0 "Собрав свои инструменты и натянув капюшон на голову, вы вышли под покровом ночи, чтобы пропитать землю ведьмы её кровью. После прибытия в логово [recipient.GetTitledFirstName], вы понимаете, что оно хорошо охраняется. Вам нужно найти способ попасть внутрь."
 ev4.40.0.a:0 "Я осторожно унимаю стража."
 ev4.40.0.a_ct:0 "Тебе удается попасть внутрь."
 ev4.40.0.a_ct2:0 "Тебе нужно бежать."
 ev4.40.0.b:0 "Я подкуплю стража."
 ev4.40.0.c:0 "Я думаю, что смогу забраться на стену."
 ev4.40.0.d:0 "Я передумал, сделаю это в другой раз."
 ev4.40.0.d_ct:0 "Ты отменяешь операцию."
 ev4.41.desc:0 "Ты попал внутрь. Вдалеке ты видишь сонные силуэты других стражей, но тебе удается их избежать. Ты приближаешься к месту, где, согласно твоей информации, находится спальня твоей цели. Вдруг ты понимаешь, что, возможно, заблудился."
 ev4.41.0.a:0 "Я спущусь по темному коридору."
 ev4.41.0.b:0 "Я воспользуюсь лестницей."
 ev4.41.0.c:0 "Я просто проверю ближайшую дверь."
 ev4.42.desc:0 "Ты нашел спальню своей цели. Однако будь осторожен, так как ты видел спящего стража у входа. Перед тобой стоит огромная кровать, и форма, скрытая под одеялом, вероятно, твоя цель."
 ev4.42.0.a:0 "Я подкрадусь ближе и заберу [recipient.GetHerHis] жизнь."
 ev4.42.0.a_ct:0 "Ведьма проснулась и позвала стражников"
 ev4.43.desc:0 "Вы подходите и видите, что это действительно тот человек, которого вы ищете. Ведьма спит беспечно, как ребенок. Вы легко забираете жизнь [recipient.GetTitledFirstName] одним ударом меча в полной тишине. Вы чувствуете, что пришло время вернуться домой, ускользнуть не составит проблем."
 witch_hunter_burgler:0 "Вор пойман."
 ev2.1.g:0 "Я буду вести свой дом как священник [ROOT.Char.GetFaith.WitchGodName]."
 ev2.1.g_ct:0 "Часть вашей семьи может быть обращена в ведьм"
 ev2.1.g_ct2:0 "Вы получаете дополнительные преимущества во время поклонения [THIS.Char.GetFaith.WitchGodName]"
 oneiromancy_perk_scrying_ct:0 "Открывает использование Ясновидения [decision|E]"
 prepare_scrying_decision:0 "Использовать Ясновидение"
 prepare_scrying_decision_tooltip:0 "Использовать Ясновидение"
 prepare_scrying_decision_confirm:0 "Начать Ясновидение"
 prepare_scrying_decision_desc:0 "Используя ведьмовские техники предсказания, вы впадаете в наркотический транс, позволяющий вам получать крошки знаний из различных мест и времен."
 prepare_scrying_decision_ct:0 "Существует вероятность узнать чей-то секрет или получить другую полезную информацию."
 ev4.44.title:0 "Ясновидение"
 ev4.44.desc:0 "Вы медленно впадаете в транс, чувствуете, как кровь стучит в висках. На мгновение мир наполняется ослепляющим светом, который тут же гаснет. Вы понимаете, что лежите на земле, не знаете, как долго это продолжалось, вы потеряли ощущение времени. Тем не менее, в вашей голове появилось новое знание."
 ev4.44.a:0 "Мне нужно больше практики в этом."
 ev4.45.desc:0 "Ты медленно погружаешься в транс, чувствуя, как кровь бурлит в висках. Тебя охватывают видения разных людей, некоторых из которых ты можешь узнать. Вдруг один из этих персонажей, [scrying_target.GetTitledFirstName], окружён аурой света. Образ меняется, и теперь ты видишь мир глазами [scrying_target.GetTitledFirstName]. Ты видишь одну конкретную сцену из прошлого, которую [scrying_target.GetSheHe] определённо хотел бы сохранить в секрете."
 ev4.45.a:0 "Это было действительно мощное видение!"
 ev4.46.desc:0 "Ты медленно погружаешься в транс, чувствуя, как кровь бурлит в висках. Ты видишь калейдоскоп вихрящихся цветов, перед твоими глазами мелькает ряд изображений. Однако одно из них продолжает возвращаться к тебе - [rruler.GetTitledFirstName]. В этом есть что-то странное. Ты чувствуешь, что видения пытаются передать тебе что-то важное."
 ev4.46.a:0 "Мне следует следить за [rruler.GetHerHim]."
 dark_blade:0 "Темный клинок"
 dark_blade_desc:0 "Когда ты держишь меч, ты слышишь тихие шепоты, побуждающие тебя убивать и разрушать. Лезвие кажется идеальным как для боя, так и для человеческих жертвоприношений."
 ev95.1.title:0 "Загадочный меч"
 ev95.1.desc:0 "Вернувшись в свои покои, ты видишь старый меч, лежащий на столе. Лезвие меча, кажется, поглощает свет, а рукоятка украшена древними руническими надписями."
 dark_blade_fed:0 "Темный клинок был накормлен"
 dark_blade_fed_ct:0 "Меч становится сильнее"
 HAS_HOOK_ON_YOU_CM:0 "На тебя наведена засада!"
 fed_dark_blade_interaction:0 "Накормить Темный клинок"
 fed_dark_blade_interaction_desc:0 "Ритуальное жертвоприношение узника может усилить твою силу"
 fed_dark_blade_interaction_ct:0 "Будет выполнено тихое казнь"
 converted2witch:0 "[tttarget.GetTitledFirstName] была превращена в ведьму!"
 rule_magic_witches:0 "Колдовство: быть ведьмой"
 setting_nope_magic_witches:0 "По умолчанию (Нет)"
 setting_nope_magic_witches_desc:0 "Ты начинаешь игру как обычный человек."
 setting_yep_magic_witches:0 "Да"
 setting_yep_magic_witches_desc:0 "Ты начинаешь игру как ведьма."
 rule_magic_witches_info:0 "Быть ведьмой"
 ev4.51.title:0 "Плохие предчувствия"
 ev4.51.desc:0 "В последнее время ты чувствуешь, что за тобой наблюдают. У тебя есть ощущение, что это может быть связано с твоим кольцом. Кто-то хочет его украсть, это точно! Нужно принять дополнительные меры предосторожности."
 ev4.51.a:0 "Мой... драгоценный..."
 ev3.5.g:0 "[main_inq.GetTitledFirstName] должен быть остановлен."
 ev4.52.desc:0 "Темный клинок... в этом мече есть нечто удивительное. Держать его в руках заставляет чувствовать себя непобедимым, и с каждой смертью, которую ты причиняешь, твоя сила растет. Однако ты беспокоишься, что твое желание убивать возросло с тех пор, как он попал к тебе."
 ev4.52.a:0 "Я буду сопротивляться этому."
 ev4.52.b:0 "Этот меч раскрывает мой потенциал."
 ev4.52.c:0 "Я не буду об этом думать."
 ev4.53.desc:0 "Во время прогулки ты встречаешь [rvic.GetTitledFirstName], с которым решаешь поговорить немного. Во время разговора ты вдруг чувствуешь неконтролируемое желание убивать. Вдруг ты понимаешь, что держишь Темный клинок в руках. Ты видишь ужас на лице [rvic.GetTitledFirstName]."
 ev4.53.a:0 "Я не могу... сопротивляться..."
 ev4.53.b:0 "Я сделаю глубокий вдох и спрячу этот чертов меч."
 ev4.53.c:0 "Меч играет с моим разумом, мне нужно контролировать себя."
 ev4.53.d:0 "ХАХАХАХА!"
 ev4.54.desc:0 "Ты чувствуешь, что каждый день теряешь контроль над собой. Этот меч... делает с тобой что-то очень плохое. Ты начинаешь подозревать, что Темный клинок имеет свои собственные планы и намерения по отношению к тебе."
 ev4.54.a:0 "Повинуйся мне, Темный Клинок!"
 ev4.54.a_ct:0 "Похоже, что ты можешь контролировать меч."
 ev4.54.a1:0 "Меч подчинился твоей воле."
 ev4.54.a2:0 "Меч берет под контроль тебя."
 ev4.54.b:0 "Я знаю заклинание, которое может помочь в этом."
 ev4.55.desc:0 "Сегодня я услышал голос моего хозяина в своей голове. 'Убей их всех' - приказал он. Так я обнажил Темный Клинок и принялся за дело."
 ev4.55.a:0 "Эта ярость дает мне силу!"
 ev4.56.title:0 "Верный Слуга"
 ev4.56.desc:0 "Незнакомец потребовал аудиенции. Ты решил встретиться с [created_witch.GetHerHim] и быстро обнаружил, что он колдун. 'Я слышал, ты священник [ROOT.Char.GetFaith.WitchGodName]' - сказал [created_witch.GetSheHe] - 'Я хочу служить тебе, пожалуйста, покажи мне путь!'"
 ev4.56.a:0 "Служи мне хорошо."
 ev4.56.b:0 "Ты шпион? Убирайся!"
 ev4.56.c:0 "У меня есть лучшая идея."
 ev4.57.desc:0 "Большая часть Черного Гримуара все еще остается для меня загадкой, но мне удалось расшифровать главу с интригующим заклинанием. Интересно, стоит ли мне испытать его на [riv0.GetTitledFirstName]."
 ev4.57.a:0 "...да, давай попробуем."
 ev4.57.b:0 "Я думаю, что нет."
 ev4.58.desc:0 "После произнесения заклинания оно исчезло из книги. Вместо этого появилось изображение, которое изображало [riv0.GetTitledFirstName]. Неподвижное лицо [riv0.GetHerHis|U] показывает страх и дезориентацию."
 ev4.58.a:0 "Ты останешься здесь навсегда."
 seek_for_power_intent:0 "Ищи Истинную Силу"
 seek_for_power_intent_desc:0 "Вместе с другими ведьмами постарайтесь узнать что-то о истинной магии."
 choose_grandmaster_intent:0 "Выдвиньте свою кандидатуру на пост Великого Мастера"
 choose_grandmaster_intent_desc:0 "Потребуйте своей кандидатуры на пост Великого Мастера Ковена и ищите поддержку от других членов ковена."
 magic_dup_evs.3010.z1:0 "Я расскажу им несколько вещей об истинной магии."
 ev4.59.title:0 "Темное Благословение"
 ev4.59.desc:0 "В качестве священника [ROOT.Char.GetFaith.WitchGodName] ты решаешь благословить собравшихся членов Саббата. Ты поднимаешь руки к небу и призываешь имя своего темного хозяина."
 ev4.59.a:0 "Преклоните колени перед Ним, братья и сестры!"
 ev4.60.title:0 "Темная Медитация"
 ev4.60.desc:0 "Ты решаешь провести часть ритуала в одиночку. Эффекты медитации очень вдохновляют. Тебе кажется, что [ROOT.Char.GetFaith.WitchGodName] особым образом благоволит тебе."
 ev4.60.a:0 "Я не подведу тебя, мой Темный Господь."
 horned_god_blessing_modifier:0 "Благословение Рогатого Бога"
 ev4.61.title:0 "Новый Спутник"
 ev4.61.desc:0 "Во время молитвы ты почувствовал, что за тобой наблюдают. Когда ты встал, чтобы оглядеться, ты услышал что-то в кустах. Маленькое животное вышло из кустов, и ты сразу понял, что это посланец. Ты ощущаешь метку [ROOT.Char.GetFaith.WitchGodName] на уме существа."
 ev4.61.a:0 "Я позабочусь о тебе."
 ev4.62.title:0 "Темная Сила"
 ev4.62.desc:0 "Ночь, полная молитв, приносит плоды. Когда ты встаешь с колен после многих часов, ты видишь, что воздух вокруг тебя слегка сверкает. Ты чувствуешь силу внутри себя - это награда от [ROOT.Char.GetFaith.WitchGodName]."
 ev4.63.title:0 "Неправедное Оплодотворение"
 ev4.63.desc:0 "После многих часов молитвы твои глаза закрываются, и ты засыпаешь. Тебе снится демон, который предложил тебе свое благословение. Ты внезапно просыпаешься, охваченный желанием. Ты осознаешь, что твоя одежда порвана, а дыхание учащено. Что-то также изменилось в твоем теле…"
 ev4.63.a:0 "Я избран."
 ev4.64.title:0 "Демон"
 ev4.64.desc:0 "Твои молитвы прерываются вспышкой энергии. Перед тобой появляется существо из ада. Демон смотрит на тебя и говорит: - 'Я отвечаю на ваши молитвы, смиренные. Я приношу вам подарок, а взамен возьму вашу душу.'"
 ev4.64.a:0 "Забери мою душу!"
 ev4.64.b:0 "...забери душу [sssac.GetTitledFirstName]."
 ev4.64.c:0 "Я отказываюсь от твоего предложения, демон."
 ev4.64.c_ct:0 "Демон исчезнет... или по крайней мере, ты на это надеешься."
 ev4.64.d:0 "Подчинись мне, демон."
 touched_magic_modifier:0 "Ощутимо"
 gift_from_hell_modifier:0 "Дар Из Ада"
 ev16.0.c:0 "Дай мне свое благословение."
 grandmaster_coven:0 "Великий Магистр Ковена"
 grandmaster_coven_desc:0 "Официальный лидер ковена"
 trait_grandmaster_coven:0 "Великий Магистр Ковена"
 trait_track_grandmaster_coven:0 "Власть"
 trait_track_grandmaster_coven_desc:0 "Сильное руководство необходимо для развития и силы ковена."
 trait_grandmaster_coven_desc:0 "Официальный лидер ковена"
 ev4.65.title:0 "В поисках поддержки"
 ev4.65.desc:0 "Тебе удалось убедить несколько человек, что титул Великого Магистра должен принадлежать тебе. Тем не менее, у тебя по-прежнему недостаточно поддержки."
 ev4.65.a:0 "Я добьюсь большего числа сторонников любой ценой."
 ev4.65.b:0 "Я попрошу о поддержке."
 ev4.65.c:0 "Неважно..."
 progress4magicintent:0 "Твое намерение получает #P прогресс#!"
 ev4.66.desc:0 "Решающий момент приближается. Ты все еще не уверен, считают ли достаточное количество людей тебя подходящим кандидатом на Великого Магистра. Ты все еще можешь попытаться убедить сомневающихся..."
 ev4.66.a:0 "Золото решит эту проблему, как всегда."
 ev4.66.b:0 "Мои навыки неоспоримы."
 ev4.66.c:0 "Я произнесу речь."
 ev4.66.d:0 "Я очевидный кандидат."
 ev4.66.e:0 "Что должно быть, то и будет."
 cgrandmaster_chosen_title:0 "Вы были выбраны Великим Магистром Ковена."
 ev4.68.title:0 "Великий Магистр"
 ev4.68.desc:0 "Ковен решил. Титул Великого Магистра принадлежит вам."
 ev4.68.a:0 "Я этого заслужил."
 ev4.69.desc:0 "Большинство членов ковена решило, что нужно выбрать нового Великого Магистра Ковена. Титул был присвоен [new_cgm.GetTitledFirstName]."
 ev4.69.a:0 "[new_cgm.GetSheHe|U] это заслужил."
 ev4.69.b:0 "Это должен быть я."
 ev4.70.desc:0 "Вам удалось собрать достаточно поддержки, чтобы претендовать на титул Великого Магистра. Однако сначала вы должны вызвать и победить предыдущего."
 ev4.70.a:0 "Я готов!"
 ev4.70.a_ct:0 "Текущий Великий Магистр ответит на ваш вызов."
 ev4.70.b:0 "Вероятно, в этот раз нет."
 ev4.70.b_ct:0 "Ваша попытка #N провалилась#!"
 ev4.71.desc:0 "[new_cgm.GetTitledFirstName] осмелился бросить вам вызов на дуэль! Это бой за титул Великого Магистра. Как смеет [new_cgm.GetSheHe]?!"
 ev4.71.b:0 "Я не хочу сражаться, я сдаюсь."
 ev4.71.c:0 "Я Великий Мастер, и так будет всегда!"
 ev4.72.desc:0 "Этот coward сдался без боя. Теперь ты новый Великий Мастер Ковена."
 ev4.72.0.a:0 "Отлично."
 ev4.73.desc:0 "Ты выиграл бой и сохранил титул Великого Мастера. Это должно заставить других ведьм задуматься."
 ev4.73.desc2:0 "Ты проиграл бой и потерял титул Великого Мастера Ковена. Это большое унижение."
 ev4.73.desc3:0 "Ты выиграл бой и получил титул Великого Мастера. Теперь ты лидер Ковена."
 ev4.73.desc4:0 "Ты проиграл бой. На данный момент титул Великого Мастера Ковена вне твоей досягаемости."
 ev4.72.0.b:0 "Черт возьми."
 ev4.72.0.b_tit:0 "Ты отстоял свое руководство."
 ev4.75.title:0 "Древние Тексты"
 ev4.75.desc:0 "Вместе с другими ведьмами ты решил исследовать коллекции, собранные Ковеном. Изучение древних текстов дает правильные результаты."
 ancient_tomes_modifier:0 "Древние Томы"
 ev4.76.title:0 "Жертва"
 ev4.76.desc:0 "Великий Ритуал — это отличная возможность восстановить свою власть. Тебе нужна только правильная жертва, которую никто не заметит..."
 ev4.76.0.a:0 "Думаю, у меня есть идея."
 ev4.76.0.a_ct:0 "Это убийство может быть обнаружено другими членами ковена."
 ev4.76.0.a_ct2:0 "Как Грандиозный Магистр Ковена, вы не столкнетесь с последствиями."
 ev4.77.title:0 "Дебаты"
 ev4.77.desc:0 "Вы вступили в дебаты с другими ведьмами о принципах магии и тайнах вселенной. Благодаря этому вы стали смотреть на некоторые вещи с новой перспективы."
 ev4.77.0.a:0 "Великие дебаты."
 ev4.78.0.a:0 "Артефакт должен быть моим!"
 ev4.78.0.a1:0 "Вы сфабриковали утверждения"
 GRANDMASTER_COVEN_NEEDED:0 "Вы должны быть Грандиозным Магистром Ковена"
 cgm_spec_1_terrain_cancel_negative_supply:0 "Открывает культурную традицию Власти Ковена"
 cgm_spec_2_terrain_cancel_negative_supply:0 "Открывает Требование Подчинения [interaction|E] против ведьм из вашего [house|E]"
 cgm_spec_3_terrain_cancel_negative_supply:0 "Открывает Отправить Агента [interaction|E]"
 cgm_spec_4_terrain_cancel_negative_supply:0 "Требование Подчинения также распространяется на всех неаффилированных ведьм в вашем королевстве."
 ev4.79.title:0 "Рекомендации Священника"
 ev4.79.desc:0 "У вас давно есть собственное мнение о традициях вашей династии. Сегодня идеальное время, чтобы поделиться своими наблюдениями с другими."
 ev4.79.a:0 "Это правильное направление."
 demand_submission_cgm_interaction:0 "Требовать подчинения"
 demand_submission_cgm_interaction_desc:0 "Вы можете требовать подчинения от колдунь в вашем Доме."
 DS_DIPLOMACY_ACTOR:0 "Ваш [diplomacy|E]: $VALUE|=+0$"
 DS_IS_VASSAL:0 "Вы лорд: $VALUE|=+0$"
 DS_IS_ARROGANT:0 "#N Высокомерный#!: $VALUE|=+0$"
 DS_IS_CRAVEN:0 "#P Трусливый#!: $VALUE|=+0$"
 DS_I_AM_NOBODY:0 "#P Низкого рождения#!: $VALUE|=+0$"
