l_russian:
 # Supernatural 2.39 -- Imperium and the council's works (WORK-ORDER-2.39 F12, F13). Events: zz_spn_imperium_events.txt,
 # zz_spn_imperium_conclave_events.txt. The rename of "Mage Council support" to "Imperium" is in replace/zz_spn_replace_l_english.yml.

 # I1: the motion, in Witchcraft's meeting (the second part, magic_ev10.85)
 spn_ev10_85_motion:0 "Я вношу предложение на рассмотрение совета."

 # F1's Invocare line "The Grand Magus does not hold Imperium" (spn_invocare_imperium_tt) is P3's key, with its decision.

 # .1000 The Council's Business
 spn_order.1000.t:0 "Дела совета"
 spn_order.1000.desc:0 "Вторая часть заседания — твоя. Что бы ты сейчас ни вынес на рассмотрение совета, места должны будут ответить."
 spn_order.1000.desc_work:0 "\n\nИз [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] пришли вести. В графстве за графством люди говорят о смертях, а среди них живёт один из наших. Респондео может успокоить одно графство. Целое королевство потребует всего совета."
 spn_order.1000.a:0 "Я прошу у совета Империум."
 spn_order.1000.a.tt:0 "Три места голосуют. Если «за» больше, чем «против», ты получаешь [Glossary('Imperium','spn_gloss_imperium')] на пять лет: против тебя нельзя призвать Инвокаре, ты можешь требовать подчинения от ведьм и Магов, сам распоряжаешься средствами совета и можешь сразу провозгласить новую Прерогативу."
 spn_order.1000.b:0 "Память [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] должна быть сдвинута."
 spn_order.1000.b.tt:0 "Места голосуют, и каждое может внести свою долю. Если совет примет предложение, ты творишь Великое Респондео и платишь его цену. Чем больше мест внесут долю, тем больше забудет королевство."
 spn_order.1000.c:0 "Тогда послушаем остальных."
 spn_rm_target_ok_tt:0 "Пять или больше графств этого королевства всё ещё говорят, и там всё ещё живёт кто-то из [spn_order|E]"
 spn_rm_gm_pays_tt:0 "У тебя хватает силы сотворить его"

 # .1001 Before the Council Votes
 spn_order.1001.t:0 "Перед голосованием совета"
 spn_order.1001.desc:0 "Места будут голосовать, даровать ли тебе Империум. Перед этим у тебя есть минута с каждым из них."
 spn_order.1001.desc_lapsed:0 "Места ждали твоего слова, а затем вернулись к своим делам. Предложение утратило силу."
 spn_order.1001.a:0 "Они вспомнят, чем мне обязаны."
 spn_order.1001.a.tt:0 "Ты используешь крючок, который держишь на каждом обладателе места, что тебе должен. Они обязаны даровать его, если только сами не держат что-то против тебя."
 spn_order.1001.b:0 "Каждый из вас получит мою благосклонность."
 spn_order.1001.b.tt:0 "Каждый обладатель места получает на тебя крючок-услугу."
 spn_order.1001.c:0 "Золото открывает двери."
 spn_order.1001.c.tt:0 "Ты платишь каждому обладателю места 100 золота."
 spn_order.1001.d:0 "Позвольте рассказать, с чем мы столкнулись."
 spn_order.1001.d.tt:0 "Ты излагаешь им свои доводы. Если они попадут в цель, это тронет каждого обладателя места."
 spn_order.1001.e:0 "Пусть решают сами."
 spn_order.1001.lapsed:0 "Тогда в другой раз."

 # A vote window still open after the vote ended (.1002, .1004): counted, or the Grand Magus died first
 spn_imperium_counted_opt:0 "Совет уже подсчитал голоса."
 spn_imperium_gm_dead_opt:0 "Голосовать больше не о чем."

 # .1002 The Grand Magus Asks for Imperium
 spn_order.1002.t:0 "Архимаг просит Империум"
 spn_order.1002.desc:0 "[spn_imp_gm.GetTitledFirstName] просит у совета [Glossary('Imperium','spn_gloss_imperium')]: пять лет, в течение которых [spn_imp_gm.GetSheHe] не подчиняется ни одному нашему голосованию."
 spn_order.1002.desc_crisis:0 "\n\nПосле случившегося в зале тише, чем было."
 spn_order.1002.desc_bound:0 "\n\n[spn_imp_gm.GetSheHe|U] потребовал то, чем ты обязан [spn_imp_gm.GetHerHim]."
 spn_order.1002.desc_favour:0 "\n\n[spn_imp_gm.GetSheHe|U] пообещал каждому из вас услугу."
 spn_order.1002.desc_paid:0 "\n\nНа столе перед тобой лежит кошель."
 spn_order.1002.desc_spoke:0 "\n\n[spn_imp_gm.GetSheHe|U] хорошо говорил о том, с чем столкнулся [spn_order|E]."
 spn_order.1002.desc_rift:0 "\n\nТы знаешь, что [spn_imp_gm.GetSheHe] сделал в прошлый раз, когда совет отказал [spn_imp_gm.GetHerHim]."
 spn_order.1002.desc_count:0 "\n\nПока что: [spn_imp_gm.MakeScope.Var('spn_imp_yes').GetValue|0] «за», [spn_imp_gm.MakeScope.Var('spn_imp_no').GetValue|0] «против»."
 spn_order.1002.a:0 "Даровать"
 spn_order.1002.b:0 "Отказать"
 spn_order.1002.c:0 "Оставить решать другим"
 spn_imp_bound_tt:0 "[spn_imp_gm.GetFirstName] потребовал то, чем ты обязан [spn_imp_gm.GetHerHim]"

 # .1003 The Council Has Spoken
 spn_order.1003.t:0 "Совет сказал своё слово"
 spn_order.1003.desc_crisis:0 "После случившегося совет поспешно собрался снова, и в зале было тише, чем прежде.\n\n"
 spn_order.1003.desc_granted:0 "Итог: [spn_imp_ayes.GetValue|0] «за» и [spn_imp_nays_n.GetValue|0] «против». Совет дарует тебе Империум.\n\nПять лет ты не подчиняешься ни одному их голосованию."
 spn_order.1003.desc_refused:0 "Итог: [spn_imp_ayes.GetValue|0] «за» и [spn_imp_nays_n.GetValue|0] «против». Совет отказывает тебе в Империуме."
 spn_order.1003.desc_dissenter:0 "\n\nСильнее всех возражал [spn_imp_dissenter.GetTitledFirstName]."
 spn_order.1003.a:0 "Тогда начнём."
 spn_order.1003.a.tt:0 "Ты обладаешь Империумом пять лет."
 spn_order.1003.b:0 "Да будет так."
 spn_order.1003.c:0 "Тогда опасность придёт к ним."
 spn_order.1003.c.tt:0 "Что-то разверзнется там, где стоит [spn_imp_dissenter.GetFirstName]. Если это когда-нибудь выведут на тебя, это будет считаться нарушением правил [spn_order|E]."
 spn_order.1003.c.tt_fors:0 "Сейчас за это платит Форс Факторум. Ты заплатишь позже."
 spn_imp_means_tt:0 "Ты можешь сделать это без цены или потратить очень много силы"

 # .1004 The Council Pledges (F13)
 spn_order.1004.t:0 "Совет вносит доли"
 spn_order.1004.desc:0 "[spn_imp_gm.GetTitledFirstName] просит совет сдвинуть память [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier]. Слишком многие там говорят о смертях, а среди них живёт один из наших.\n\nТворить будет Архимаг. Чем больше мест внесут свою долю, тем больше забудет королевство: сначала слухи, затем то, кто мы, затем то, что узнали его охотники."
 spn_order.1004.desc_funds:0 "\n\nТвоя доля как Канцлера — 200 золота из средств совета."
 spn_order.1004.desc_power:0 "\n\nТвоя доля — твоя собственная сила."
 spn_order.1004.desc_count:0 "\n\nПока что: [spn_imp_gm.MakeScope.Var('spn_imp_yes').GetValue|0] «за», из них [spn_imp_gm.MakeScope.Var('spn_imp_pledge_slips').GetValue|0] внесли долю, и [spn_imp_gm.MakeScope.Var('spn_imp_no').GetValue|0] «против»."
 spn_order.1004.a:0 "Я вношу свою долю."
 spn_order.1004.a.tt_funds:0 "Если совет примет предложение, из средств совета будет взято 200 золота. Твоя доля засчитывается."
 spn_order.1004.a.tt_power:0 "Если совет примет предложение, ты потратишь силу. Твоя доля засчитывается."
 spn_order.1004.b:0 "Я за, но ничего не вношу."
 spn_order.1004.c:0 "Я против."
 spn_order.1004.d:0 "Оставить решать другим."
 spn_rm_can_pledge_tt:0 "Ты можешь внести свою долю"

 # .1005 The Ground Splits
 spn_order.1005.t:0 "Земля раскалывается"
 spn_order.1005.desc:0 "Пол разверзается беззвучно. Из трещины прямо там, где ты стоишь, бьёт свет, и воздух наполняется серой.\n\nЧто-то с той стороны рвётся пройти."
 spn_order.1005.desc_sensed:0 "\n\nУ этого действа был почерк, который ты уже чувствовал."
 spn_order.1005.a:0 "Закрыть её"
 spn_order.1005.a.tt:0 "Ничто не проходит."
 spn_order.1005.b:0 "Отбросить его"
 spn_order.1005.b.tt:0 "Ты встаёшь между разломом и всеми остальными."
 spn_order.1005.c:0 "Вывести всех"
 spn_order.1005.c.tt:0 "Что-то проходит у тебя за спиной, и оно тебя запомнит."
 spn_order.1005.d:0 "Бежать"

 # .1006 A Realm Forgets (F13)
 spn_order.1006.t:0 "Королевство забывает"
 spn_order.1006.desc_passed:0 "Действо завершено. В [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] разговоры стихают. Никто там больше не может сказать, что их так пугало."
 spn_order.1006.desc_two:0 "\n\nТе, кто знал там, кто принадлежит к [spn_order|E], больше этого не знают, если только их разум не был защищён."
 spn_order.1006.desc_three:0 "\n\nОхотники там, нашедшие путь к храму, тоже его потеряли."
 spn_order.1006.desc_member:0 "\n\nСовет сделал это ради каждого из нас, кто там живёт."
 spn_order.1006.desc_failed:0 "Совет принял предложение, но действо так и не началось. [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] всё ещё помнит."
 spn_order.1006.desc_refused:0 "Совет не стал этого делать. [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] придётся забывать самому, если вообще получится."
 spn_order.1006.a:0 "Дело сделано."
 spn_order.1006.b:0 "Да будет так."

 # spn_conclave.0210 What the Grand Magus Did
 spn_conclave.0210.t:0 "Что сделал Архимаг"
 spn_conclave.0210.desc:0 "Маски ещё прибывают. В другом конце зала [spn_cv_gm.GetTitledFirstName] тихо беседует с Храмовым Магусом, будто ничего не случилось.\n\nТы знаешь, что разлом, открывшийся под одним из членов совета, был делом [spn_cv_gm.GetHerHis] рук. Сказанное здесь, перед всеми храмами, назад уже не возьмёшь."
 spn_conclave.0210.a:0 "Сказать это здесь, перед всеми."
 spn_conclave.0210.a.tt:0 "Каждый храм узнаёт, что сделал [spn_cv_gm.GetFirstName]. [spn_cv_gm.GetSheHe|U] нарушил правила [spn_order|E], и если [spn_cv_gm.GetSheHe] обладает Империумом, тот утрачивает силу."
 spn_conclave.0210.b:0 "Ещё нет."
 spn_conclave.0210.b.tt:0 "Ты сохраняешь то, что знаешь, и то, чего это стоит."
 spn_conclave.0210.c:0 "Кто-то уже это сказал."

 # Toasts
 spn_order_toast_imperium_granted:0 "Архимаг обладает Империумом"
 spn_order_toast_imperium_void:0 "Империум Архимага утратил силу"
 spn_imperium_toast_refused:0 "Совет отказывает в Империуме"
 spn_imperium_toast_spoke_well:0 "Тебя услышали"
 spn_imperium_toast_spoke_badly:0 "Их это не тронуло"
 spn_imperium_toast_staged:0 "Земля раскалывается"
 spn_imperium_toast_rift_held:0 "Он закрывается"
 spn_imperium_toast_rift_failed:0 "Что-то прошло"

 # The secret (common/secret_types/zz_spn_order_secrets.txt)
 spn_secret_staged_rift:0 "Подстроил разлом"
 spn_secret_staged_rift_desc:0 "Открыл разлом, поразивший [TARGET_CHARACTER.GetShortUIName]"
 spn_secret_staged_rift_tooltip_desc:0 "Этот персонаж намеренно открыл разлом там, где стоял кто-то другой."
 spn_secret_staged_rift_type_desc:0 "$spn_secret_staged_rift_tooltip_desc$"

 # Debug (events/10_spn_debug_events.txt, spn_debug_events.0470)
 spn_debug_events.0470.t:0 "Империум и дела совета (отладка)"
 spn_debug_events.0470.desc:0 "Инструменты проверки для Империума и Великого Респондео из версии 2.39 (WORK-ORDER-2.39 F12, F13)."
 spn_debug_events.0470.a:0 "Открыть дела совета сейчас (пропустить 50 лет) и найти королевство"
 spn_debug_events.0470.b:0 "Внести предложение на рассмотрение совета сейчас (я Архимаг)"
 spn_debug_events.0470.c:0 "Очистить записи: отказ, усталость от продления, перезарядку Великого Респондео"
