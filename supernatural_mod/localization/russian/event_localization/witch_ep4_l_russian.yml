 artifacts_searching_intent_desc:0 "Сосредоточьтесь на получении информации о магических артефактах."
 artifacts_searching_desc:0 "Используйте все ресурсы, чтобы получить информацию о местоположении магических артефактов. С удачей, вы также сможете подготовить обстоятельства для их захвата."
 artifacts_searching_host_desc:0 "Проведение попытки получить информацию или претензии на магические артефакты."
 artifacts_searching_special_type_bar_segment_tt_0:0 "#t Бесплодный поиск (Уровень 1)#!\nВы получаете #N стресс#!"
 artifacts_searching_special_type_bar_segment_tt_1:0 "#t Успешный поиск (Уровень 2)#!\nВы узнаете #P местоположение магического артефакта#!\n#N Нет#! шансов получить претензии на магический артефакт"
 artifacts_searching_special_type_bar_segment_tt_2:0 "#t Очень успешный поиск (Уровень 3)#!\nВы узнаете #P местоположение магического артефакта#!\n#N Низкие#! шансы получить претензии на магический артефакт"
 artifacts_searching_special_type_bar_segment_tt_3:0 "#t Безупречный поиск (Уровень 4)#!\nВы узнаете #P местоположение магического артефакта#!\n#P Высокие#! шансы получить претензии на магический артефакт"
 ev5.9.title:0 "Начало"
 ev5.9.desc:0 "Вы закончели предварительные приготовления, но пока у вас есть лишь несколько книг и слухов, собранных в вашем дворе. Вам нужно проанализировать имеющиеся материалы и собрать больше. Впереди вас ждет тяжелая работа!"
 asp_witch_hunters_key_title:0 "Наблюдают охотники на ведьм?"
 asp_witch_hunters_title:0 "Наблюдают охотники на ведьм?"
 asp_breakthrough_key_title:0 "Прорыв!"
 asp_breakthrough_title:0 "Прорыв!"
 artifacts_searching_tt_positive_tiny:0 "Ваши поиски #P немного продвигаются#!."
 artifacts_searching_tt_positive_medium:0 "Ваши поиски #P значительно продвигаются#!."
 artifacts_searching_tt_positive_major:0 "Ваши поиски #P колоссально продвигаются#!."
 artifacts_searching_tt_negative_medium:0 "Ваши поиски #N значительно теряют прогресс#!."
 asp_night_on_books_title:0 "Ночь с книгами"
 asp_procrastination_title:0 "Краткий отдых"
 ev5.10.title:0 "Возможность"
 ev5.10.desc:0 "Появилась возможность купить некоторые манускрипты, которые могут содержать интересную информацию. Это похоже на дневники какого-то путешественника, который стал свидетелем необъяснимых явлений - возможно, здесь замешана магия."
 ev5.10.0.a:0 "Это тупик."
 ev5.11.title:0 "Человеческие ресурсы"
 ev5.11.desc:0 "Вам следует использовать своих людей для помощи в поисках. Пусть они собирают информацию, слушают слухи, говорят с купцами и духовенством."
 ev5.11.0.a:0 "Да, они должны больше вовлекаться."
 ev5.11.0.b:0 "Они должны приложить все усилия!"
 ev5.11.0.b_ct:0 "#N Небольшая вероятность #!привлечь внимание охотников на ведьм."
 ev5.11.0.c:0 "Я прекрасно знаю, как заставить их помочь."
 ev5.11.0.c_ct:0 "#N Средняя вероятность #!привлечь внимание охотников на ведьм."
 ev5.12.desc:0 "Известия могут многое рассказать. Вам следует поручить эту задачу вашему шпиону - кто знает, сколько информации вы сможете узнать таким образом?"
 additional_tasks_modifier:0 "Дополнительные обязанности"
 ev5.12.0.a:0 "У моего шпиона более важные задачи."
 ev5.12.0.b:0 "Да, это хорошая идея."
 ev5.13.title:0 "Книга"
 ev5.13.desc:0 "В ваши руки попала интересная книга. К сожалению, вы не говорите на этом языке, но с небольшим везением вы сможете перевести самые важные отрывки. Кажется, речь идет о магическом объекте."
 ev5.13.0.a:0 "Я постараюсь."
 ev5.13.0.b:0 "С этим не будет проблем."
 ev5.13.0.c:0 "Это займет время, но я справлюсь."
 ev5.13.0.d:0 "Мне стоит нанять переводчика."
 ev5.14.desc:0 "До вас дошли слухи, что кто-то очень заинтересован в ваших исследованиях. Этот человек очень озабочен своей анонимностью. Он находится при вашем дворе, но ускользает от охраны. Это может быть шпион... или охотник за ведьмами."
 ev5.14.0.a:0 "Я лучше на время отложу свои поиски."
 ev5.14.0.b:0 "Я просто проигнорирую это."
 ev5.15.desc:0 "Я узнал о неком ритуале, который вызывает пророческие сны. С его помощью я мог бы получить некоторые ответы на интересующие меня вопросы. Однако есть одна проблема - мне придется пожертвовать своим любимцем."
 ev5.15.0.a:0 "Конечно, я это сделаю."
 ev5.15.0.b:0 "Я буду искать другой способ."
 ev5.16.title:0 "Нет прогресса"
 ev5.16.desc:0 "Ваши поиски пока ни к чему не приводят. Этот недостаток прогресса негативно сказывается на вашем самочувствии."
 ev5.16.0.a:0 "Может, мне нужен перерыв?"
 ev5.16.0.b:0 "Мне нужно продолжать работать..."
 ev5.16.0.c:0 "Я попробую другой подход."
 ev5.17.title:0 "Обязанности перед королевством"
 ev5.17.desc:0 "Ваш поиск оставляет вам мало времени для выполнения ваших обычных обязанностей. Вам нужно найти способ разделить своё внимание."
 ev5.17.0.a:0 "Моя текущая работа важнее."
 ev5.17.0.b:0 "Мое королевство важнее."
 ev5.17.0.c:0 "Если у кого-то есть возражения, я с радостью всё поясню."
 ev5.18.desc:0 "Ваш поиск набирает обороты, всё больше ресурсов и людей вовлечены. Некоторые из собранных вами сведений выглядят многообещающе..."
 ev5.18.0.a:0 "Я не собираюсь замедляться!"
 ev5.18.0.b:0 "Пора подготовиться к следующему этапу."
 ev5.19.desc:0 "Вам удалось купить карту, предположительно созданную могущественной ведьмой. На ней отмечено место, которое может содержать какую-то магическую аномалию..."
 ev5.19.0.a:0 "Эта карта – ещё одна часть головоломки."
 ev5.19.0.b_ct:0 "Вы узнаете местоположение Места Силы."
 ev5.20.desc:0 "Согласно карте, место магической аномалии [magic_p.GetName] обладает магической аурой. Эта провинция принадлежит [owner_p.GetTitledFirstName]."
 artifacts_searching_studies_completed_log_title:0 "Ваш поиск не увенчался успехом."
 artifacts_searching_studies_completed_log2_title:0 "Ваш поиск увенчался успехом!"
 ev5.21.desc:0 "Из вашего поиска не вышло ничего значительного. Безусловно, в мире есть магические артефакты, но их владельцы хранят это под строгим секретом. Это не меняет того факта, что вы чувствуете огромное разочарование."
 ev5.21.desc2:0 "После кропотливых исследований вам наконец удалось получить конкретную информацию о [final_arti.GetName]. Похоже, он находится во владении [owner_a.GetTitledFirstName]!"
 ev5.21.0.a:0 "Чёрт возьми!"
 ev5.21.0.b:0 "Я хорошо поработал."
 artifacts_searching_concluded:0 "Вы узнали местонахождение магического артефакта."
 artifacts_searching_concluded2:0 "Вы получили претензии на магический артефакт."
 artifacts_searching_concluded3:0 "Вам не удалось получить претензии."
 artifacts_searching_concluded4:0 "Вы получили претензии!"
 artifacts_searching_conclusion_desc:0 "Вы провели поиск магических артефактов..."
