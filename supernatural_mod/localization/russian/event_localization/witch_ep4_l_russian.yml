 ev5.27.desc:0 "Вы успешно достигли своей цели. Бой решится во дворе замка, здесь достаточно места. Ваш противник уже ждет вас..."
 ev5.27.0.a:0 "Давайте начнем."
 mage_duel1:0 "Дуэль магов - Первый раунд"
 mage_duel2:0 "Дуэль магов - Второй раунд"
