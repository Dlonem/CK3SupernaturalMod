 shadowstep_spell:0 "Теневой Шаг"
 shadowstep_spell_desc:0 "Это заклинание позволяет вам быстро и безопасно путешествовать или сбежать из немагической тюрьмы."
 shadow_step_modifier:0 "Теневой Шаг"
 shadow_step_modifier2:0 "Теневой Шаг"
 shadow_step_prison_ct:0 "Это заклинание также может освободить вас из немагической тюрьмы."
 PRISON_MAGIC_SECURE_CUSTOM:0 "Эта тюрьма защищена от использования любой магии."
 ev5.1.0.e:0 "Безопасность прежде всего!"
 ev5.1.0.e_ct:0 "Вы получаете заклинание Теневой Шаг #italic #!(сам [interaction|E])"
 ev5.1.0.e2:0 "Мне нужно что-то, чтобы избежать толпы."
 plague_spell_modifier:0 "Источник Чумы"
 plague_spell:0 "Заклинание Чумы"
 ev5.1.0.f:0 "Мои враги почувствуют боль."
 ev5.1.0.f_ct:0 "Вы получаете заклинание Чумы #italic#!"
 ev5.1.0.k:0 "Сожгите их! Сожгите их всех!"
 ev5.1.0.k_ct:0 "Вы получаете заклинание #italic Огненная буря#!"
 ev5.1.0.healing_ct:0 "Вы получаете заклинание #italic Исцеление#!"
 plague_spell_ct:0 "Большинство персонажей в том же месте тоже заболеют!"
 ev5.2.title:0 "Чума"
 ev5.2.desc:0 "Без всякой причины вы вдруг почувствовали себя очень плохо. Слуга, который попытался перенести вас на кровать, потерял сознание - он болен, как и вы. Кажется, что все больны, всё ваше королевство! Однако вы никогда не слышали, чтобы болезнь наступала так внезапно и сразу у всех."
 ev5.2.0.a:0 "Это проклятие!"
 ev5.1.0.g:0 "У меня есть лучшая идея!"
 ev5.1.0.g_ct:0 "Вы получаете немедленный доступ к #italic Проведению магического исследования#![decision|E]"
