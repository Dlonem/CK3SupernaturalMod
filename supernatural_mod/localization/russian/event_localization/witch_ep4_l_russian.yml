 mage_duel7a:0 "Дуэль магов - Седьмой раунд"
 mage_duel7:0 "Дуэль магов - Финальный раунд"
 mage_duel_won:0 "Дуэль магов - Вы выиграли!"
 mage_duel_lost:0 "Дуэль магов - Вы проиграли!"
 ev5.29.title:0 "Дуэль магов - Без разрешения"
 ev5.28.desc:0 "Вы лицом к лицу с противником, оценивая друг друга взглядом, оба морально готовитесь к битве. Вдруг ваш противник начинает произносить заклинание. Вы видите, как [char2.GetHerHis] начинает излучать энергию от силы, пробуждающейся внутри [char2.GetHerHim]. У вас мало времени на реакцию..."
 ev5.28.desc_won1:0 "Вам удалось отразить атаки врага достаточно долго, чтобы заклинание окончательного разрушения было готово. Поток силы ударяет по [char2.GetTitledFirstName], разрывая [char2.GetHerHim] на атомы..."
 ev5.28.desc_won2:0 "Ваши заклинания атакуют противника так долго и мощно, что [char2.GetSheHe] наконец падает на колени перед вами. У [char2.GetSheHe|U] нет сил защищать V2@self дальше - [char2.GetSheHe] находится под вашей милостью."
 ev5.28.desc_lost1:0 "Вы ловко пытаетесь защититься от заклинаний противника, когда вдруг атака полностью останавливается. Вы видите, что противник находится в середине какого-то очень сложного заклинания. Вы пытаетесь произнести свое, чтобы остановить [char2.GetHerHim], но уже слишком поздно. Враг вызывает поток энергии, который разрывает вас на части."
 ev5.28.desc_lost2:0 "Вы ловко пытаетесь защититься от враждебных заклинаний, но ваш противник слишком силен! Вы быстро теряете силы и бессильно падаете на колени. Еще одно враждебное заклинание просто разрывает вас на части."
 ev5.28.desc_lost3:0 "Вы ловко пытаетесь защититься от враждебных заклинаний, но ваш противник слишком силен! Вы быстро теряете силы и бессильно падаете на колени. Противник щедро воспринял это как знак капитуляции и решил пощадить вас."
 ev5.28.desc_lost4:0 "Вы ловко пытаетесь защититься от враждебных заклинаний, но ваш противник слишком силен! Вы быстро теряете силы и бессильно падаете на колени. Ваш противник решил пощадить вас, но забрал ваши магические предметы в трофей."
 ev5.28.desc_lost5:0 "Вы ловко пытаетесь защититься от враждебных заклинаний, но ваш противник слишком силен! Вы быстро теряете силы и бессильно падаете на колени. Ваш противник решил пощадить вас, но вы вынуждены капитулировать в войне."
 ev5.28.desc1:0 "Ваш противник постоянно атакует заклинаниями В0@. Промежуток между вами вибрирует от нарастающей силы."
 ev5.28.desc2:0 "На мгновение ваш противник прекратил направлять заклинания в вашу сторону. Кажется, он замышляет что-то недоброе."
 ev5.28.desc3:0 "В0@ бросает на вас ещё больше заклинаний, магия взрывается в воздухе. Вы отступаете, ощущая, что ваши силы истощаются..."
 ev5.28.desc4:0 "В0@ отступает под натиском ваших заклинаний. Вы видите, что В1@ слабеет с каждым мгновением. Вы близки к победе!"
 ev5.28.desc5:0 "Дуэль магов продолжается, но вы замечаете нечто тревожное. Ваш противник пытается одновременно отразить ваши атаки и подготовить какое-то сложное заклинание. Заклинание Судьбы! Вы должны остановить В0@..."
 ev5.28.desc6:0 "Заклинания вашего противника в основном отражаются от ваших магических щитов или вам удается их парировать, но В0@ тоже неплохо справляется, по крайней мере, пока."
 ev5.28.desc7:0 "Ваш противник накладывает крайне сложное заклинание, вы никогда не видели ничего столь утончённого - вам едва удалось его отразить! Вы думаете, что [char2.GetSheHe] слишком сильно ударяет, потому что [char2.GetSheHe] не смертный человек."
 ev5.30.desc:0 "Ваш противник не смог отразить одно из ваших заклинаний - оно попало в него с фатальным эффектом, разрывая его на двое. Похоже, вы победили."
 ev5.30.0.a:0 "Итак, кто следующий?"
 ev5.30.0.b:0 "Никто не может меня остановить."
 ev5.30.0.c:0 "Я поймал тебя!"
 game_concept_power_clash:0 "Столкновение сил"
 game_concept_power_clash_desc:0 "Во время дуэли магов Столкновение сил представляет собой преимущество (или баланс) в противостоянии магии обоих участников. Доминирование над противником с помощью Столкновения сил - один из способов его победить."
 game_concept_doom_spell:0 "Заклинание гибели"
 game_concept_doom_spell_desc:0 "Заклинание гибели представляет собой заклинание, мощность которого достаточна, чтобы прорвать все возможные магические щиты и истребить любого противника на глаза. Это один из способов победить в дуэли магов. Однако такое мощное заклинание требует времени для подготовки..."
