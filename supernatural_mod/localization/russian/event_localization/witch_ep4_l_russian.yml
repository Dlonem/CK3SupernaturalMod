 game_concept_magic_protection_desc:0 "Основная магическая защита предотвращает большинство враждебных заклинаний, но может быть разрушена магическим катализатором или достаточно искусным магом. Некоторые мощные заклинания, такие как Желание Смерти, Изгнание Демона или Удар Силы, по умолчанию обходят основную магическую защиту. С другой стороны, полная магическая защита - предоставляемая мощными заклинаниями, некоторыми артефактами или демоническими эффектами - защищает от почти любого заклинания."
