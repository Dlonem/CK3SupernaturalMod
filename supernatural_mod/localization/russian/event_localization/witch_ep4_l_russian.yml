 power_clash:0 "#t Столкновение Сил#!\nТрек столкновения сил представляет собой преимущество, которое одна сторона может добиться, подавляя противника серией заклинаний. Дуэль заканчивается, когда одна из сторон достигает полного преимущества. Эта шкала также будет использоваться для определения победителя, если дуэль не закончится в течение семи раундов."
 doom_spell:0 "#t Заклинание Рока#!\nОдно мощное заклинание может уничтожить любого противника. Когда этот бар заполнится, заклинание окончательного уничтожения будет готово, и противник будет уничтожен."
 enemy_doom_spell:0 "#t Заклинание Рока Противника#!\nВаш противник также готовит мощное заклинание против вас. Когда этот бар заполнится, заклинание врага будет приведено в действие, и вы умрете."
