 ev5.22.title:0 "Масштабный поиск"
 ev5.22.desc:0 "Поиск магических артефактов — задача не из простых, но у вас есть множество способов собрать информацию. Пора выбрать начальную ось ваших усилий."
 ev5.22.0.a:0 "Я воспользуюсь своими шпионами."
 ev5.22.0.b:0 "Я буду использовать свои книги."
 ev5.22.0.c:0 "Я буду использовать свои контакты."
 ev5.22.0.d:0 "Я буду использовать свой ковен."
 ev5.23.title:0 "Выбор цели"
 ev5.23.desc:0 "Вы наткнулись на упоминания о магических артефактах. Некоторые из них могут быть труднее найти, чем другие. Вы должны выбрать, по какому следу будете идти."
