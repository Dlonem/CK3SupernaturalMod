 ev5.1.0.g1:0 "Я могу позволить себе больше!"
 ev5.1.0.h:0 "Я могу использовать магию, чтобы ускорить свой разум."
 ev5.1.0.h_ct:0 "Вы получаете заклинание #italic Гиперкогнитивность#!(сам [interaction|E])"
