 ev81.0.desc:0 "Расположение звёзд как раз такое, как нужно! В такой день акт жестокости должен дать силу, необходимую для осуществления твоих амбиций."
 ev81.0.a:0 "Я ограблю одну из деревень, никто не узнает."
 ev81.0.b:0 "Почему бы мне не перебить нескольких приезжих купцов?"
 ev81.0.c:0 "Долгое и мучительное казнь будет в самый раз."
 ev5.58.title:0 "Сила Великого Ритуала"
 ev5.58.desc:0 "Церемония с участием твоего ковена оказывает влияние - ты ощущаешь, как магия витает в воздухе. Всё, что тебе нужно сделать, это схватить её..."
 ev5.58.0.a:0 "Я становлюсь сильнее."
