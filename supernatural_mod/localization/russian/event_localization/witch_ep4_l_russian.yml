 ev5.60.desc:0 "Я пришёл завоевать этот мир - смертные ничтожны, но маги иногда могут стать проблемой. Ты, похоже, являешься самой большой проблемой здесь, так что я начну с тебя. Да станет твоя смерть предвестником нового начала!"
