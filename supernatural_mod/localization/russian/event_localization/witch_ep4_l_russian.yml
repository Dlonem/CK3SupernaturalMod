 bless_land:0 "Благослови Землю"
 bless_land_desc:0 "Это заклинание улучшает благосостояние назначенной провинции."
 blessed_land_modifier:0 "Благословенная Земля"
 ev5.1.0.b:0 "На самом деле, я сосредоточусь на общем развитии."
