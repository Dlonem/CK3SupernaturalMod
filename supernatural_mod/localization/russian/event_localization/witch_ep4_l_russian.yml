 ev5.30.desc_ct:0 "#P Вы победили в результате критического удара вашим заклинанием!#!"
 ev5.28.0.s1:0 "У меня есть кое-что особенное для этого случая."
 ev5.28.0.s1_ct:0 "Эта опция доступна, потому что вы легендарный маг."
 ev5.28.0.a:0 "Силовой удар, сейчас!"
 ev5.28.0.b:0 "Мне нужно больше времени... магический щит!"
 ev5.28.0.c:0 "Я постараюсь наложить два заклинания одновременно."
 ev5.28.0.s2:0 "Заклинание "Теневой Шаг" даст мне преимущество."
 ev5.28.0.d:0 "Время импровизировать."
 ev5.28.0.e:0 "Я сосредоточусь на заклинании "Гибель"."
 ev5.28.0.f:0 "Я создам поток ослепляющего света!"
 ev5.28.0.s4:0 "Я ударю Тёмным клинком."
 ev5.28.0.g:0 "Я буду бороться с магией [char2.GetHerHis] своей магией!"
 ev5.28.0.g_ct:0 "Шанс создать разрыв в реальности: #N низкий#!"
 ev5.28.0.h:0 "Я нанесу удар серией магических снарядов!"
 ev5.28.0.i:0 "Мне нужно как-то отвлечь [char2.GetHerHim]..."
 ev5.28.0.s3:0 "Заклинание чумы отвлечёт [char2.GetHerHim]."
 ev5.28.0.s5:0 "Смертельное проклятие! Умри!"
 ev5.28.0.j:0 "Контрзаклинание!"
 ev5.28.0.k:0 "Сожги!"
 ev5.28.0.l:0 "Мне нужно что-то покрепче!"
 ev5.28.0.l_ct:0 "Твоё следующее заклинание Разрушительного состязания будет #P мощнее#!"
 ev5.28.0.l_ctd:0 "Ты #P получишь больше прогресса в заклинании Проклятия судьбы#! с следующего заклинания"
 ev5.28.0.s6:0 "Я наклоню ШТОРМ ОГНЯ!"
 ev5.28.0.s6_ct:0 "Наблюдатели могут пострадать #N!#!"
 ev5.28.0.s6_it:0 "Противник заклинал Шторм Огня!"
 ev5.28.0.m:0 "Как насчёт заклинания в заклинании? Лови!"
 ev5.28.0.n:0 "Угроза надвигается."
 ev5.28.0.n1:0 "С гиперкогницией, заклинание Проклятия судьбы будет готово через момент."
 ev5.28.0.n2:0 "Я буду атаковать устойчивым потоком силы."
 ev5.28.0.n2_ct:0 "Следующее заклинание противника не увеличит его прогресс в заклинании Проклятия судьбы."
 my_doom_spell_lesser_progress:0 "#N Это заклинание ослаблено в результате действий противника!#!"
 my_doom_spell_lesser_progress2:0 "#N Вы уменьшили прогресс Заклинания Судьбы, потому что вам нужно больше времени, чтобы преодолеть полную магическую защиту противника.#!"
 ev5.28.0.s7:0 "Я использую ловушку-заклинание."
 ev5.28.0.o:0 "Вам нужен перерыв? Я дам вам минутку."
 ev5.28.0.p:0 "Я собираюсь попробовать ментальную атаку."
 ev5.28.0.p_it:0 "Ментальная Атака"
 ev5.28.0.p_ct:0 "#P Это заклинание усилено, потому что вы мастер психоники.#!"
 ev5.28.0.r:0 "Мне нужно еще немного времени..."
 ev5.28.0.x1:0 "Посмотрим, что из этого выйдет..."
 ev5.28.0.x2:0 "Увидьте мастера магии!"
 ev5.28.0.x3:0 "Адаптация — ключ к победе."
 ev5.28.0.x4:0 "Это заклинание из Черного Гримуара — я всегда хотел его попробовать."
 ev5.28.0.z1:0 "Умри!"
 ev5.28.0.z2:0 "Я пощажу тебя..."
 ev5.28.0.z3:0 "Я пощажу тебя, но твои магические артефакты мои!"
 ev5.28.0.z3b:0 "Я пощажу тебя, но ты сдашь нашу войну."
 ev5.28.0.z4:0 "Нет...!"
 ev5.28.0.z5:0 "Ну, спасибо..."
 ev5.28.0.z6:0 "Справедливая цена..."
 ev5.29.desc:0 "После долгой борьбы ни у вас, ни у вашего противника больше нет сил продолжать сражение. Должен быть объявлен ничейный результат."
 ev5.29.0.a:0 "Хорошая схватка."
 ev5.29.0.b:0 "В следующий раз я тебя уничтожу."
 IS_ON_MAGE_DUEL_CUSTOM:0 "Это заклинание недоступно во время дуэли магов."
 remove_mana_after_md_ct:0 "Дуэль израсходовала #N все#! твоё энергетическое насыщение."
 remove_mana_after_md_ct2:0 "Дуэль израсходовала #N [THIS.Var('mdmana').GetValue]#! твоё энергетическое насыщение."
 critical_spell_it:0 "Критический удар заклинанием"
 ev5.28.0.pen1:0 "Я постараюсь временно снять [char2.GetHerHis] магическую защиту."
 ev5.28.0.pen1_ct:0 "#P Полная магическая защита противника будет временно отключена.#!"
 ev5.28.0.pen1_ct2:0 "Прорыв магической защиты"
 ev5.28.0.pen1_ct3:0 "Твой противник нашёл способ отключить твою магическую защиту!"
 ev5.28.0.f2:0 "Сингулярность - перезагружено и готово к атаке!"
 ev5.28.0.f2_it:0 "Противник использовал Древнюю Сингулярность!"
 ev5.28.0.f3:0 "Прямой удар от Древней Сингулярности должен разрушить любую магическую защиту."
 ev5.28.0.s31:0 "Я могу использовать метамагию, чтобы обойти магическую защиту противника."
 ev5.28.0.s31_ct:0 "Эта опция доступна, потому что ты мастер метамагии."
 ev5.28.0.t:0 "Я постараюсь удивить [char2.GetHerHim]."
 ev5.28.0.u:0 "Теперь я собираюсь ударить чем-то действительно мощным!"
 ev5.28.0.v:0 "Я буду уничтожать [char2.GetHerHim] кусок за куском."
 ev5.28.0.w:0 "Я призову вихрь лезвий, чтобы отвлечь [char2.GetHerHim]."
 ev5.28.0.y:0 "Я буду продолжать наступать."
 ev5.28.0.s8:0 "Мне нужен более тактический подход."
 ev5.28.0.s9:0 "Я могу использовать Сосущий Манну, чтобы усилить Проклятое Заклинание энергией моего противника!"
 mage_p4_perk_ctt:0 "Вы разблокировали Поединок Магов [interaction|E]"
 ev5.28.0.necro:0 "Итак... Я просто заколдую заклинание Изгнания."
 mage_house_learn_terrain_cancel_negative_supply:0 "Доступ к изучению нового заклинания [decision|E] для магов"
 ev2.6.b:0 "Я отвечу своим собственным лезвием!"
 ev2.6.c:0 "Я буду защищаться с помощью магии."
 learn_new_spell_decision:0 "Изучить новое заклинание"
 learn_new_spell_decision_desc:0 "Вы можете просмотреть книги магической академии, чтобы узнать что-то новое о магии."
 learn_new_spell_decision_tooltip:0 "Изучить новое заклинание"
 learn_new_spell_decision_confirm:0 "Изучайте магию"
 NOT_TITLE_TIER_TRIGGER_THIRD:0 "Вам нужно выбрать графство."
 ev4.0.e:0 "Я на время подавлю свое магическое чутье."
 ev4.0.e_ct:0 "Ваше магическое чутье будет отключено на 10 лет."
 ev5.31.title:0 "Засада Охотников на Ведьм"
 ev5.31.desc:0 "Вдруг вы осознаете, что ваши охранники подверглись атаке со стороны каких-то людей, и прямо рядом с вашей головой пронзается болт. Похоже, это засада от довольно хорошо обученных людей - это охотники на ведьм. Скоро к вам полетят еще болты, и ваши охранники не продержатся долго."
 ev5.31.0.a:0 "Я присоединюсь к бою!"
 ev5.31.0.b:0 "Я попробую ускользнуть."
 ev5.31.0.b_ct:0 "Тебе удалось сбежать."
 ev5.31.0.c:0 "Я уничтожу их заклинанием."
 ev5.31.0.d:0 "Хорошо, что у меня всегда есть запасные охранники."
 power_strike_md_ct1:0 "Буду сопротивляться."
 ev5.32.title:0 "Магическая атака"
 ev5.32.desc:0 "Неожиданно, [actor.GetTitledFirstName] решил атаковать тебя мощным заклинанием, которое тебе удалось отразить в последний момент. Это не может остаться без ответа!"
 ev5.33.title:0 "Изучение магии"
 ev5.33.desc:0 "Тебе удалось получить свиток с множеством интересной информации о магии. Он не касается непосредственно магических артефактов, но всё равно может быть полезен."
 ev5.33.0.a:0 "Это стоит изучить."
 ev5.33.0.b:0 "Я предпочитаю сосредоточиться на магических артефактах."
 trait_source3:0 "Избранный"
 trait_source3_desc:0 "Раз в несколько столетий в мир приходит исключительно одарённый индивид, волшебник, который интуитивно понимает нюансы магии лучше всех. При надлежащей тренировке он имеет потенциал достигнуть силы, сопоставимой с демоническими принцами или даже меньшими богами."
 ev5.34.desc:0 "Вы заперлись в своей комнате сегодня, пытаясь разобраться с обычными бюрократическими делами, когда вдруг осознали, что вы не одни в комнате. Мужчина появился из ниоткуда, он, должно быть, как-то обманул ваших стражников. Тем не менее, он не выглядит как убийца, хотя вы чувствуете, что это человек, с которым нужно считаться."
 ev5.34.0.a:0 "Кто, черт возьми, ты?"
 ev5.35.desc:0 "Меня зовут Мерлин, и да, я колдун. Не делай такое лицо - я знаю, что у тебя есть интерес к магии. Извини за вторжение, но я пришел по делу. В вашем районе прячется некий демон, с которым у меня есть счёты. Однако мне нужна помощь в его поиске и поимке."
 ev5.35.0.a:0 "Demon? Звучит серьезно."
 ev5.35.0.b:0 "Продолжай."
 ev5.36.desc:0 "Вот и всё, вкратце. Этот демон однажды нанёс много вреда человечеству, я бы предпочёл, чтобы этого не происходило снова. Не волнуйся, в прямом столкновении она не так опасна - в противном случае я бы не стал вас вовлекать."
 ev5.36.0.a:0 "'Она'?"
 ev5.37.desc:0 "Пандора, так её зовут. Возможно, я не единственный, кто её ищет, так что нам следует поспешить. Ты поможешь мне? Тебя, конечно, вознаградят."
 ev5.37.0.a:0 "Пусть будет так. Я предпочитаю не иметь демона рядом."
 ev5.37.0.b:0 "Я помогу тебе, но не бесплатно..."
 ev5.37.0.c:0 "Я думаю, ты не говоришь мне всего."
 ev5.37.0.d:0 "Нет, я не хочу ничего с этим иметь общего."
 ev5.37.0.d_ct:0 "Мерлин будет искать помощь у кого-то другого."
 ev5.38.desc:0 "Чем меньше ты знаешь, тем дольше ты наслаждаешься счастьем и спокойствием. Так что, как ты думаешь, поможешь мне?"
 ev5.39.desc:0 "Отлично. У меня есть идея, с чего начать поиски. Демонесса слишком умна, чтобы я мог отследить её с помощью магии, но обычный поиск может принести результаты, если я дам тебе несколько подсказок..."
 ev5.39.0.a:0 "Я заставлю своих людей поискать."
 ev5.39.0.a_ct:0 "Учитывая совет Мерлина, ты отправляешь своих шпионов."
 ev5.39.0.a_ct2:0 "Вам нужно подождать результатов."
 ev5.40.title:0 "Поиск Пандоры"
 ev5.40.desc:0 "Ваши люди получили рисунок женщины, которую искали (по слухам, Пандора приняла облик обычной женщины) и информацию о том, на что обращать внимание, но пока что у них нет никаких зацепок. Поиск становится дорогостоящим, и Мерлин не появлялся с момента вашего последнего разговора."
 ev5.40.0.a:0 "Я отправлю больше агентов на поиски."
 ev5.40.0.b:0 "Я делегирую своего доверенного человека для выполнения этой задачи."
 ev5.40.0.c:0 "Пора положить конец этому безумию."
 ev5.40.0.c_ct:0 "Вы прерываете поиски Пандоры."
 ev5.41.opening:0 ""
 ev5.41.desc:0 "Мои шпионы сообщают, что вы выполняете определённую задачу для Мерлина - я подозреваю, что это связано с похищением демона по имени Пандора. Я не знаю, что этот ловкач вам пообещал, но я дам вдвое больше, чем он. Я ожидаю, что вы передадите мне Пандору, как только её поймаете."
 ev5.41.0.a:0 "Хм, становится интересно."
 mefisto_name:0 "Мефистофель"
 ev5.41.0.b:0 "Может, я воз возобновлю поиск."
 ev5.41.0.b_ct:0 "Поиск Пандоры продолжится."
 ev5.41.0.c:0 "Меня это не интересует."
 ev5.42.title:0 "Мефисто"
 ev5.42.desc:0 "Вдруг перед вами появляется человек... Или не человек, вы ощущаете легкий запах серы и магии от него. Очередной незваный гость, этот производит впечатление очень беззаботного. 'Позвольте представиться: Мефистофель, к вашим услугам.'"
 ev5.42.0.a:0 "Демон!"
 ev5.43.desc:0 "Расслабьтесь, я цивилизованный демон, я долго жил среди людей. На самом деле, я пришел помочь - похоже, вы кого-то ищете. Ах да, Пандора... Я знаю, где она прячется."
 ev5.43.0.a:0 "Зачем тебе помогать мне?"
 ev5.44.desc:0 "Для удовольствия. Мне любопытно, чем закончится история: станешь ли ты марионеткой Мерлина или прислужником Яги? Или пойдешь своим путем? Смертные могут быть так интересны! В любом случае, Пандора скрывается в замке в [rrrcounty.GetName], она одурила [rrruler.GetTitledFirstName] и чувствует себя в безопасности там. Я думаю, насильственная смерть [rrruler.GetTitledFirstName] выманит ее из укрытия, тогда я помогу вашему шпиону установить ловушку. Конечно, вы также можете просто штурмом взять стену замка..."
 ev5.44.0.a:0 "Спасибо за предложение... Почему эта Пандора так важна?"
 ev5.45.desc:0 "'Отличный вопрос, не так ли?' - рассмеялся демон - 'Если бы ты знал, то это было бы не так смешно. Разберись с [rrruler.GetTitledFirstName], и Пандора будет в пределах досягаемости. Возможно, увидимся' - демон исчез."
 ev5.45.0.a:0 "Великолепно..."
 ev5.45.0.a_ct:0 "Ты должен завоевать графство или убить защитника Пандоры."
 pandora_name:0 "Пандора"
 ev5.47.desc:0 "Твои люди смогли найти женщину с соответствующим описанием. Она не сопротивлялась, но определенно была той, кого ты искал. Она слишком красивая для смертной женщины..."
 ev5.47.0.a:0 "Чем ты так особенный, демон? Говори."
 ev5.47.desc2:0 "Письмо, подписанное Мефистофелем, содержало точное время и место, где будет Пандора - похоже, она пыталась выкрасться, чтобы найти новое укрытие. Твои люди перехватили её, она определенно та, кого ты ищешь. Она слишком красивая для смертной женщины."
 ev5.49.desc:0 "Любой другой демон на моем месте разорвал бы тебя и твоих людей на куски, знаешь? Но я всегда относился с большим уважением к жизни, вот почему я прячусь. Было предсказано, что именно я приведу эту землю к гибели. Однажды, в результате моей неосторожности, я использовал артефакт, который вызвал великий катаклизм. Некоторые считали, что пророчество тогда сбылось - но есть и те, кто верит, что настоящая гибель еще впереди, благодаря мне."
 ev5.49.0.a:0 "Это звучит невероятно."
 ev5.49.0.b:0 "Артефакт?"
 ev5.50.desc:0 "Артефакт давно пропал, но существуют многие древние силы, которые могут угрожать этому миру, и я могу стать ключом к этому. Возможно. Я не собираюсь этого допустить, но и с тобой сражаться не собираюсь. Будь разумным... и отпусти меня. Я найду безопасное место для себя и буду держаться подальше от неприятностей, как делал это на протяжении последних веков."
 ev5.50.0.a:0 "Если всё это правда... тогда ты должен умереть."
 ev5.50.0.b:0 "Пусть будет так, можешь уходить."
 ev5.50.0.b_ct:0 "Пандора уйдет, и вы, вероятно, больше никогда не встретитесь."
 ev5.50.0.c:0 "Ты останешься со мной, здесь ты будешь в безопасности."
 ev5.50.0.c_ct:0 "Пандора останется при твоем дворе."
 ev5.50.0.d:0 "Ты проблема Мерлина, он разберется с тобой."
 ev5.50.0.d_ct:0 "#P Мерлин вознаградит тебя!#!"
 ev5.50.0.e:0 "Я думаю, я просто передам тебя Бае Яге."
 ev5.50.0.e_ct:0 "#P Баба Яга вознаградит тебя!#!"
 ev5.51.desc:0 "'Это стоило много времени, но я вижу, что это того стоило' - сказал Мерлин - 'Я не был уверен, что могу на тебя полагаться, но я сомневался в тебе без необходимости. Ты заслужил мою благодарность и, конечно, моё вознаграждение.'"
 ev5.51.0.a:0 "Что будет с Пандорой?"
 ev5.51.0.b:0 "Да, моя плата. Давай поговорим об этом."
 ev5.52.desc:0 "Согласно пророчествам, Пандора внесет свой вклад в апокалипсис. Всё когда-нибудь должно закончиться, даже этот мир - но я бы предпочёл, чтобы это не случилось скоро. Я знаю несколько очень нестабильных заклинаний для путешествий во времени. Я отправлю Пандору в... 2012? Может быть, 2024? Я пока не уверен. Нам лучше поговорить о твоем вознаграждении."
 ev5.52.0.a:0 "Да?"
 ev5.53.desc:0 "Ты интересуешься магией, так что я мог бы рассказать тебе несколько магических секретов. Или я могу просто подарить тебе несколько драгоценностей..."
 ev5.53.0.a:0 "На самом деле, я не ожидаю компенсации от друга."
 ev5.53.0.b:0 "Да, научи меня магии."
 ev5.53.0.c:0 "Я приму деньги."
 ev5.54.desc:0 "'Хороший выбор' - сказала Яга - 'Кто знает, что бы Мерлин сделал с Пандорой. Так ситуация под контролем, и ты имеешь мою благодарность.'"
 ev5.54.0.a:0 "Имеет ли твоя благодарность какие-либо материальные последствия?"
 ev5.55.desc:0 "Пророчество говорит, что Пандора принесет разрушение миру. Exact значение этого должно быть в том, что ребенок Пандоры может обладать способностью разрушать мир. Это возможно, скрещивание между людьми и демонами иногда приводит к странным мутациям, именно так рождаются самые могущественные маги. Я дам проклятие, которое сделает так, что Пандора никогда не сможет иметь детей, это решит проблему. А затем она пойдет своей дорогой. Проклинать демонов трудно, но я найду способ."
 ev5.56.desc:0 "Да, пора для твоей награды. Я слишком стар, чтобы взять ещё одного ученика, но могу дать тебе несколько советов о том, как получить магический артефакт. Я также дам тебе немного зелей, которые могут оказаться полезными. У меня есть ещё одна дочь, хотя я держу это в секрете. Она молода и способна, и я мог бы отдать её тебе - если ты пообещаешь заботиться о ней."
 ev5.56.0.a:0 "Меня интересуют магические предметы."
 ev5.56.0.b:0 "Я бы с радостью встретил твою дочь."
 ev5.57.desc:0 "'Какой замечательный поворот!' - Мефистофель появился ниоткуда - 'Я не разочарован в тебе. Твои действия заслуживают какой-то награды. Магия? Золото? Рукопожатие? Просто скажи.'"
 ev5.57.0.a:0 "Немного золота всегда полезно."
 ev5.57.0.b:0 "Просто уйди."
