 hipercognition_option_title:0 "Тип усиления"
 hipercognition_desc:0 "Заклинание, которое значительно повышает эффективность вашего разума."
 hipercognition_modifier1:0 "Гиперкогниция (дипломатия)"
 hipercognition_modifier2:0 "Гиперкогниция (военное дело)"
 hipercognition_modifier3:0 "Гиперкогниция (управление)"
 hipercognition_modifier4:0 "Гиперкогниция (интриги)"
 ev5.4.title:0 "Черная магия!"
 ev5.4.desc:0 "Я встретил [actor.GetTitledFirstName], и слухи о [actor.GetHerHim] оказались правдой! [actor.GetSheHe|U] овладел силами дьявола. [actor.GetTitledFirstName] поднял [actor.GetHerHis] руки, и вдруг меня окружило пламя, я едва успел спастись. У меня есть чувство, что если бы [actor.GetSheHe] этого пожелал, [actor.GetSheHe] просто сжёг бы меня до ashes."
 ev5.4.0.a:0 "Лучше не связываться с [actor.GetHerHim]."
 ev5.4.0.b:0 "Я буду иметь это в виду."
 ev5.5.title:0 "Реакция на вашу магию"
 ev5.5.desc:0 "Заклинание сработало, и началась настоящая суматоха. Люди начали кричать или убегать, некоторые замерли от страха. Вдруг вы видите, как несколько стражников пробиваются в вашу сторону, у них определённо нет добрых намерений."
 ev5.5.0.a:0 "Я попробую незаметно выбраться."
 ev5.5.0.b:0 "Они хотят связываться с магом? Идиоты."
 ev5.5.0.b2:0 "Они хотят связываться с демоном? Идиоты."
 ev5.5.0.b_ct:0 "Ты сжигаешь стражников дотла."
 ev5.5.0.c:0 "Ну что ж, я сдаюсь."
 ev5.5.0.a_ct:0 "Ты эффективно ускользаешь от стражников."
 ev5.6.desc:0 "[actor.GetTitledFirstName] — настоящий маг! Когда [actor.GetSheHe] начал колдовать, а за [actor.GetHerHim] отправили стражников, [actor.GetSheHe] просто сжег их дотла!"
 ev5.6.0.a:0 "[actor.GetSheHe|U] неудержим!"
 ev5.5.title2:0 "Попытка ареста"
 ev5.1.0.i:0 "У дайте мне подумать..."
 ev5.1.0.i_ct:0 "Ты получишь случайное заклинание."
 ev5.1.0.j:0 "Мне нужно тщательно обдумать это."
 ev5.1.0.j_ct:0 "Через несколько лет ты пересмотришь свой выбор."
 ev5.1.0.j_ct2:0 "У тебя есть шанс получить больше заклинаний на выбор."
 ev5.8.desc:0 "[actor.GetTitledFirstName] перед твоими глазами поднял руки и призвал поток магической энергии, который ударил по [recipient.GetTitledFirstName]. [actor.GetSheHe|U] не только настоящий маг, но и достаточно безжалостен, чтобы атаковать врагов [actor.GetHerHis] даже на глазах у свидетелей!"
 ev5.8.0.a:0 "Невероятно..."
 artifacts_searching:0 "Поиск магических артефактов"
