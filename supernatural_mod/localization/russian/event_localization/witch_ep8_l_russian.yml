 camp_purpose_seekers:0 "Искатели тайн"
 camp_purpose_seekers_effects:0 "$EFFECT_LIST_BULLET$Открывает больше [learning|E] и [intrigue|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Может открыть особые колдовские [task_contracts|E]\n$EFFECT_LIST_BULLET$Активирует [GetTravelOption('adventurers_search_for_secrets_option').GetName] [travel_option|E]\n$EFFECT_LIST_BULLET$Разблокирует [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('fortune_tellers_tent_01').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('cult_caravan_01').GetName]#!\n$EFFECT_LIST_BULLET$Открывает доступ к особым [officers|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('cult_priest_camp_officer').GetName()] #weak (Разблокируется через $cult_caravan_01_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Разблокируется через $supply_tent_subdued_gear_domicile_building$)#!\n\n#WEAK Будь вы ведьмой, жаждущей власти, жрецом запретного культа или просто opportunist, тайные знания и забытые загадки — это путь к могуществу и пониманию вселенной.#!"
 camp_requirement_unlocked_by_purpose_seekers:0 "Ваш $camp_purpose$ должен быть [GetLaw('camp_purpose_seekers').GetName]"
 fortune_tellers_tent_01_domicile_building:0 "Шатер гадалки"
 fortune_tellers_tent_01_domicile_building_desc:0 "Это может быть просто уловка, а может, в этом кроется капля настоящей магии. В любом случае, гадалка рада делиться своими доходами."
 fortune_tellers_components_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ [decision|E] не имеет #P стоимости#!"
 cult_caravan_01_domicile_building:0 "Караван культа"
 cult_caravan_01_domicile_building_desc:0 "Культисты [GetPlayer.GetFaith.WitchGodName] путешествуют в этом караване; лишь немногие знают о тайнах, которые он скрывает."
 cult_caravan_02_domicile_building:0 "$cult_caravan_01_domicile_building$"
 cult_caravan_02_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
