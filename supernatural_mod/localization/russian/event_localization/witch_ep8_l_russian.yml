 domicile_building_parameter_camp_may_host_grand_rites: "Разблокирует #high $activity_witch_ritual$#! [activity|E]"
 domicile_building_parameter_camp_cult_priest_more_effective:0 "Жрец культа обладает повышенной эффективностью"
 cult_caravan_chapel_domicile_building:0 "Переносная часовня"
 cult_caravan_chapel_domicile_building_desc:0 "Удобное место для жрецов культа, чтобы проводить свои темные ритуалы."
 domicile_building_parameter_camp_unlocks_cult_priest: "Разблокирует [GetCourtPositionType('cult_priest_camp_officer').GetName()] [officer|E]"
 domicile_building_parameter_camp_unlocks_spread_cult: "Разблокирует $spread_the_cult_decision_title$ [decision|E]"
 cult_priest_camp_officer:0 "Жрец культа"
 cult_priest_camp_officer_desc:0 "Жрец восхваляет имена темных богов и собирает дары от обращенных крестьян."
 spread_the_cult_decision_title:0 "Распространить культ"
 spread_the_cult_decision_desc:0 "Пора позволить культистам побеседовать с местными жителями."
 spread_the_cult_decision_ct1:0 "Вы можете основать отделение культа или обратить местных жителей."
 spread_the_cult_decision_ct2:0 "Это действие может принести вам пользу в будущем, но также может вызвать недовольство местных властей."
 ev2.1.g_ct3:0 "$spread_the_cult_decision_title$ [decision|E] будет более эффективным"
 NOT_IS_A_WITCH:0 "Вы должны быть ведьмой."
 cult_caravan_arms_domicile_building:0 "Боевое снаряжение"
 cult_caravan_arms_domicile_building_desc:0 "Вооруженные культисты с фанатичной преданностью выступят против любого врага, на которого вы укажете."
 domicile_building_parameter_camp_unlocks_cultists_maa: "$culture_parameter_coven_rule2$"
 cult_caravan_convertion_domicile_building:0 "Темные миссионеры"
 cult_caravan_convertion_domicile_building_desc:0 "Среди культистов есть харизматичные ораторы и внимательные наблюдатели. Мы предоставим им дополнительные ресурсы для действий."
 domicile_building_parameter_camp_unlocks_witch_convertion: "Обращает одного последователя в год в ведьму"
 cult_caravan_archive_domicile_building:0 "Архивы культа"
 cult_caravan_archive_domicile_building_desc:0 "Лишь немногие имеют доступ к архивам культа."
 witch_dark_cult_modifier:0 "Деятельность темного культа"
 witch_dark_cult_custom_tooltip:0 "Вы основали отделение культа."
 DARK_CULT_ALREADY_EXISTS_CUSTOM:0 "В этой провинции уже существует отделение культа."
 trait_track_cultist:0 "Культист"
 trait_track_cultist_desc:0 "Мистицизм и религия всегда были отличным способом манипулировать и контролировать других людей."
 ev9.2.desc:0 "Ваши культисты обратили несколько местных жителей, но это не осталось незамеченным властями. Возможно, стоит приостановить деятельность, если вы не хотите привлечь к себе внимание."
 ev9.2.0.a:0 "Лишь воля [ROOT.Char.GetFaith.WitchGodName] имеет значение."
 ev9.2.0.b:0 "[cpriest.GetTitledFirstName] возьмет вину на себя."
 ev9.2.0.c:0 "В таком случае, мы подождем более подходящего момента."
 ev9.3.desc:0 "Местные жители не заинтересованы в вашем культе, но их правитель, [lruler.GetTitledFirstName], кажется, человек с открытым разумом. Возможно, вы сможете передать [lruler.GetHerHim] некоторые секреты в обмен на [lruler.GetHerHis] поддержку."
 ev9.3.0.a:0 "Я поговорю с [lruler.GetHerHim]."
 ev9.3.0.b:0 "Это ненужный риск."
 ev9.4.desc:0 "Обращение местных жителей прошло гладко, во многом благодаря жрецу культа, [cpriest.GetTitledFirstName]. Конечно, крестьяне и бедные торговцы недостойны постичь истинную мудрость, но даже такие марионетки могут быть полезны в великом плане [ROOT.Char.GetFaith.WitchGodName]."
 ev9.4.0.a:0 "Я назначаю [cpriest.GetTitledFirstName] верховным жрецом."
 ev9.4.0.b:0 "[cpriest.GetSheHe|U] хорошо справляется, но лидер культа — я."
 ev9.5.title:0 "Темные связи"
 ev9.5.desc:0 "Отделение культа в [cbranch.GetName] присылает вам дары — это приятно с их стороны..."
 ev9.6.desc:0 "Культ, основанный вами в [cbranch.GetName], процветает. Пора потребовать от них дань."
 ev9.6.0.a:0 "Пусть присылают припасы."
 ev9.6.0.b:0 "Пусть делятся золотом."
 ev9.6.0.c:0 "Несколько дополнительных людей были бы полезны."
 ev9.7.desc:0 "Молодой послушник из вашего отделения культа в [cbranch.GetName] прибыл, желая присоединиться к вашей команде. Возможно, [created_witch.GetSheHe] обладает потенциалом стать подходящим культистом."
 ev9.7.0.a:0 "Отлично, пусть [created_witch.GetHerHim] присоединится к нам."
 ev9.7.0.b:0 "[created_witch.GetSheHe|U] лучше продолжить помогать в [cbranch.GetName]."
 ev9.7.0.b_ct:0 "Это отделение культа просуществует еще 10 лет."
 ev9.8.desc:0 "До вас дошли вести, что ваше отделение культа в [cbranch.GetName] больше не существует — оно было уничтожено во время рейда охотников на ведьм."
 ev9.8.0.a:0 "Надеюсь, никаких следов, ведущих к нам, не осталось."
 ev9.9.desc:0 "Агенты-культисты из [cbranch.GetName] получили информацию, которая может быть вам полезна. Они решили поделиться ею с вами."
 ev9.9.0.a:0 "Это именно то, что мне нужно."
 ev9.9.0.b:0 "Я добавлю это в свой список тайн."
 ev9.10.desc:0 "Ваш культ в [cbranch.GetName] превзошел все ожидания. Культисты завербовали слуг местного лорда, нескольких клириков и множество горожан. Все они тайно поклоняются [ROOT.Char.GetFaith.WitchGodName] и считают вас святым."
 ev9.10.0.a:0 "Я не святой, я пророк."
 darkprophet_nickname:0 "Темный Пророк"
 ev9.10.0.b:0 "Славьте [ROOT.Char.GetFaith.WitchGodName]!"
 ev9.10.0.c:0 "Они заслуживают похвалы, но пусть остаются бдительными."
 ev9.11.desc:0 "Культисты из [cbranch.GetName] сообщают, что они вербуют новых последователей среди горожан, и культ медленно растет. Они отправили к вам гонца с просьбой о дальнейших указаниях."
 ev9.11.0.a:0 "Пусть разнесут весть всем, что Пророк грядет."
 ev9.11.0.b:0 "Им следует удвоить усилия."
 ev9.11.0.c:0 "Сейчас самое время прислать дань."
 ev9.11.0.d:0 "Пусть настроят местных против их сюзерена."
 command_minion_interaction_unlocked_ct:0 "Разблокирует $command_minion_interaction$ [interaction|E] с целью."
 COMMAND_MINION_O9:0 "Стань моим покровителем"
 laamp_magic_1001_contract:0 "Неприятная ведьма"
 laamp_magic_1001_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и разобраться с ведьмой, используя [intrigue|E], [martial|E] или [diplomacy|E]."
 laamp_magic_1001_desc_title:0 "$laamp_magic_1001_contract$"
 laamp_magic_1001_desc:0 "Местный правитель конфликтует с ведьмой — это не было бы особо интересно, если бы не тот факт, что ведьма может обладать полезной информацией. Возможно, удастся убить двух зайцев одним выстрелом."
 ev9.12.desc:0 "Похоже, в окрестностях живет ведьма, подстрекающая крестьян. [employer.GetTitledFirstName] хочет, чтобы ведьма исчезла — любым способом, лишь бы быстро."
 ev9.12.0.a:0 "Я уговорю ведьму уйти."
 ev9.12.0.a_ct:0 "Ведьма была изгнана"
 ev9.12.0.a_ct2:0 "Ведьма отказывается"
 ev9.12.0.b:0 "Я уговорю местных разобраться с этим."
 ev9.12.0.c:0 "Это работа для моих головорезов."
 ev9.12.0.c_ct2:0 "Ведьме удалось скрыться"
 ev9.12.0.d:0 "Эта ведьма была бы полезна в качестве нового члена культа."
 ev9.13.desc:0 "Несмотря на ваши усилия, ведьма все еще здесь. Пора прибегнуть к плану Б..."
 ev9.13.0.a:0 "Может, подкуп поможет."
 ev9.13.0.a_ct:0 "Ведьма принимает предложение"
 ev9.14.desc:0 "Дело с ведьмой улажено, и [employer.GetTitledFirstName] доволен, но это лишь одна сторона медали. Теперь у вас есть доступ к записям и материалам ведьмы, которые содержат множество полезной информации."
 laamp_magic_1002_contract:0 "Поиск ингредиентов"
 laamp_magic_1002_request:0 "Этот [task_contract|E] требует доставки алхимических ингредиентов — могут понадобиться [learning|E] или соответствующие черты."
 laamp_magic_1002_desc_title:0 "$laamp_magic_1002_contract$"
 laamp_magic_1002_desc:0 "[TaskContract.GetEmployer.GetTitledFirstNamePossessive] нужен особый ингредиент для приготовления зелья. Добыть или купить этот ингредиент не должно быть сложно."
 ev9.15.desc:0 "Вашему нанимателю нужно особое растение для приготовления зелья. Возможно, оно растет где-то поблизости или его можно купить у местных торговцев."
 ev9.15.0.a:0 "Что ж, отправимся за покупками."
 ev9.15.0.b:0 "Я знаю, где найти это растение."
 ev9.15.0.c:0 "Кажется, у меня есть нужный ингредиент в запасах."
 ev9.15.0.d:0 "Местные ведьмы наверняка знают, где его искать."
 ev9.15.0.e:0 "Этот контракт меня не интересует."
 laamp_magic_1003_contract:0 "Демоническая одержимость"
 laamp_magic_1003_request:0 "Этот [task_contract|E] требует навыков настоящей ведьмы."
 laamp_magic_1003_desc_title:0 "$laamp_magic_1003_contract$"
 laamp_magic_1003_desc:0 "Один из придворных [TaskContract.GetEmployer.GetTitledFirstNamePossessive] производит впечатление одержимого. Молитвы и священники не помогли — [TaskContract.GetEmployer.GetTitledFirstName] готов обратиться за помощью к ведьме, чтобы решить проблему. Это может быть поучительный случай..."
 ev9.16.desc:0 "Похоже, что [cpossessed.GetTitledFirstName] действительно одержим или, по крайней мере, болен. Вам удалось установить, что случай серьезный и не является какой-либо мистификацией. Однако вам не хватает навыков, чтобы разгадать эту тайну."
 ev9.17.desc:0 "Как только вы прибыли в замок [employer.GetTitledFirstNamePossessive], вы сразу направились в покои [cpossessed.GetTitledFirstName]. [cpossessed.GetSheHe|U] определенно опасен, но что еще хуже — вы чувствуете магию, исходящую от [cpossessed.GetHerHim]. Сверхъестественные силы явно замешаны."
 ev9.17.0.a:0 "Мне нужно осмотреть [cpossessed.GetHerHim], удерживайте [cpossessed.GetHerHim]."
 ev9.17.0.b:0 "Я приготовлю настой, чтобы успокоить [cpossessed.GetHerHim]."
 ev9.17.0.c:0 "Начну с простой молитвы."
 ev9.17.0.d:0 "У меня есть идеи, но мне нужно время, чтобы обдумать."
 ev9.18.desc:0 "Вы пришли к выводу, что [cpossessed.GetTitledFirstName] не одержим, и уж точно не демоном. Однако нет сомнений, что состояние [cpossessed.GetHerHis] вызвано магией."
 ev9.18.0.a:0 "Интересно... Я понаблюдаю за [cpossessed.GetHerHim] несколько дней."
 ev9.18.0.b:0 "Заклинание для чтения ауры решит эту загадку."
 ev9.19.desc:0 "Вам удалось выяснить, что на [cpossessed.GetTitledFirstName] было наложено заклинание. Скорее всего, оно должно было подчинить [cpossessed.GetHerHim], но ведьма, наложившая его, не обладала достаточными знаниями или силой, и заклинание сработало не так, как задумывалось."
 ev9.19.0.a:0 "Я подготовлю ритуал, чтобы нейтрализовать заклинание."
 ev9.19.0.a_ct:0 "Заклинание будет снято."
 ev9.19.0.b:0 "Я просто наложу контрзаклинание."
 ev9.19.0.c:0 "Я попробую провести экзорцизм."
 ev9.19.0.d:0 "Снятие этого заклинания мне не по силам."
 ev9.20.desc:0 "Ваши усилия окупились — похоже, [cpossessed.GetTitledFirstName] полностью исцелился, заклинание снято. Ваш наниматель доволен результатами, но остается еще один вопрос: кто наложил заклинание? И почему?"
 ev9.20.0.a:0 "Это не мое дело — я выполнил свою часть."
 ev9.20.0.b:0 "Я могу поискать виновника за дополнительную плату."
 ev9.20.0.b_ct:0 "Контракт продолжается — вы должны найти ведьму."
 ev9.21.title:0 "Поиск ведьмы"
 ev9.21.desc:0 "Заклинатель не обладает исключительной силой, но демонстрирует изрядное мастерство. Вам нужно выяснить, как найти этого человека."
 ev9.21.desc2:0 "Похоже, это тупик. Нужно попробовать что-то другое."
 ev9.21.0.a:0 "Я поговорю со слугами."
 ev9.21.0.a_ct1:0 "Вы находите убежище ведьмы."
 ev9.21.0.a_ct2:0 "Никаких следов ведьмы."
 ev9.21.0.b:0 "Может, местные крестьяне что-то знают?"
 ev9.21.0.c:0 "Я расспрошу местных осведомителей."
 ev9.21.0.d:0 "Я использую магическую триангуляцию."
 ev9.22.title:0 "$ev9.21.title$ - $board_games.0001.tt.failure$"
 ev9.22.desc:0 "Вам не удалось найти ведьму — вероятно, тот, кто наложил заклинание, покинул местность. Тем не менее, вы выполнили основную часть контракта."
 ev9.22.0.a:0 "Я сделал все, что мог."
 ev9.23.desc:0 "Вы нашли хижину ведьмы и сразу решили отправиться туда. Ведьма удивлена, увидев вас."
 ev9.23.0.a:0 "Я знаю, что это ты наложила заклинание на [cpossessed.GetTitledFirstName]!"
 ev9.24.desc:0 "Вместо ответа вы слышите невнятные слова, исходящие из уст ведьмы. Это заклинание!"
 ev9.24.0.a:0 "Я просто убью [created_witch.GetHerHim] мечом."
 ev9.24.0.b:0 "Как ты посмела? Силовой удар!"
 ev9.24.0.a_ct:0 "Ведьма успела завершить заклинание."
 ev9.25.desc:0 "Ведьма закончила заклинание, прежде чем вы добрались до [created_witch.GetHerHim] — заклинание было слабым, но на мгновение затуманило вам разум. Этого хватило, чтобы ведьма сбежала — вероятно, вы больше не встретите [created_witch.GetHerHim]. Однако это не меняет того факта, что вы выполнили основную часть контракта."
 ev9.26.desc:0 "Вы убили ведьму, прежде чем [created_witch.GetSheHe] успела завершить заклинание."
 ev9.26.desc2:0 "Ваше заклинание разорвало ведьму на куски, остались лишь черное пятно и обрывки обгоревшей плоти."
 ev9.26.desc3:0 "\nМотивы [created_witch.GetHerHis|U] неясны, но из найденных записок видно, что ведьма была близка к раскрытию секрета истинной магии — вы уже понимаете, что сможете использовать эти знания. Ваш наниматель будет доволен, что проблема решена."
 ev9.26.0.a:0 "Да, мне нужно изучить эти записи."
 laamp_magic_1004_contract:0 "Безжалостное соперничество"
 laamp_magic_1004_request:0 "Этот [task_contract|E] требует магических навыков или обмана ([intrigue|E])."
 laamp_magic_1004_desc_title:0 "$laamp_magic_1004_contract$"
 laamp_magic_1004_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] готов использовать любые средства, чтобы навредить [TaskContract.GetEmployer.GetHerHis] сопернику — включая магические."
 ev9.27.desc:0 "«Сядь и послушай. Есть один человек, который мне невыносимо мешает, и я его искренне не выношу. Я хочу видеть его смерть и страдания... Я слышал слухи, что у тебя есть особые способности. Если ты сможешь навредить [nrival.GetTitledFirstName], я заплачу золотом.»"
 ev9.27.0.a:0 "Конечно, да, я наложу... э-э... проклятье."
 ev9.27.0.a_ct:0 "Ты блефуешь"
 ev9.27.0.b:0 "Я сделаю это."
 ev9.27.0.c:0 "Я не занимаюсь такими делами."
 ev9.27.0.c_ct:0 "Вы отказываетесь от контракта"
 ev9.28.desc:0 "Ваша цель — [nrival.GetTitledFirstName]. [employer.GetTitledFirstName|U], очевидно, ожидает, что вы наложите заклинание, которое ранит или убьет [employer.GetHerHis] соперника."
 ev9.28.0.a:0 "Я подготовлю проклятье."
 ev9.28.0.b:0 "Мощное проклятье даст впечатляющие результаты."
 ev9.28.0.c:0 "Я сделаю вид, что накладываю заклинание."
 ev9.27.0.c1:0 "Наниматель думает, что вы наложили заклинание"
 ev9.27.0.c2:0 "Наниматель раскрыл ваш обман"
 ev9.28.0.d:0 "Я отказываюсь от этой работы."
 laamp_magic_1005_contract:0 "Задание для целителя"
 laamp_magic_1005_request:0 "Этот [task_contract|E] требует магических навыков или особых черт."
 laamp_magic_1005_desc_title:0 "$laamp_magic_1005_contract$"
 laamp_magic_1005_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] страдает от тяжелой болезни, с которой его придворный лекарь не справляется. Возможно, магия сможет здесь помочь?"
 ev9.29.desc:0 "[employer.GetTitledFirstName|U] тяжело болен, и неизвестно, сколько дней [employer.GetSheHe] осталось. [employer.GetSheHe|U] готов заплатить за любое лечение, даже необычное, если оно окажется эффективным."
 ev9.29.0.a:0 "Я попытаюсь помочь [employer.GetHerHim]."
 ev9.29.0.a1:0 "Лечение эффективно"
 ev9.29.0.a2:0 "Лечение неэффективно"
 ev9.29.0.b:0 "Я могу усилить ауру [employer.GetHerHis]."
 ev9.29.0.c:0 "Целебное заклинание решит проблему."
 ev9.29.0.d:0 "Не думаю, что я могу что-то сделать."
 laamp_magic_1006_contract:0 "Магическая аномалия"
 laamp_magic_1006_request:0 "Этот [task_contract|E] требует магических навыков и высокого [learning|E]."
 laamp_magic_1006_desc_title:0 "$laamp_magic_1006_contract$"
 laamp_magic_1006_desc:0 "Вы чувствуете источник магических эманаций в землях [TaskContract.GetEmployer.GetTitledFirstNamePossessive]. Стоит отправиться туда и исследовать."
 laamp_magic_1006_ct:0 "Вы получите неизвестную награду"
 ev9.30.desc:0 "Вы ощущаете довольно сильную магию в этой местности. Магическая триангуляция указала на обычный холмик, который на первый взгляд ничем не выделяется."
 ev9.30.0.a:0 "Что такого особенного в этом месте?"
 ev9.30.0.a_ct:0 "Вы решаете рассмотреть его поближе"
 ev9.31.desc:0 "Вы провели несколько магических экспериментов, но не получили четких ответов, кроме того, что магические следы очень старые. Здесь давно что-то произошло..."
 ev9.31.0.a:0 "Я проведу дополнительные исследования."
 ev9.31.0.a1:0 "Вы ближе к пониманию этого феномена"
 ev9.31.0.a2:0 "Загадка останется неразгаданной"
 ev9.31.0.b:0 "Возможно, стоит взглянуть на это с другой стороны."
 ev9.31.0.c:0 "Кажется, я когда-то читал о чем-то подобном..."
 ev9.31.0.d:0 "У меня есть гипотеза."
 ev9.32.title:0 "$laamp_magic_1006_contract$ - $board_games.0001.tt.failure$"
 ev9.32.desc:0 "Вы испробовали разные способы, но не смогли раскрыть природу этого странного феномена. Все, что вы знаете, — это то, что он возник давно и, вероятно, безвреден для окружающих. Возможно, однажды вы сможете разгадать эту тайну."
 ev9.32.0.a:0 "Это все равно было поучительно."
 ev9.33.desc:0 "Похоже, что в этом месте давно было наложено мощное заклинание. Вам удалось выяснить, что это было заклинание телепортации, хотя сегодня трудно сказать, было ли это место началом или концом чьего-то пути. Тот, кто здесь был, обладал огромной силой, и остатки этой силы все еще сохраняются в ауре этого места."
 ev9.33.0.a:0 "Думаю, я могу поглотить часть магии здесь."
 ev9.33.0.b:0 "Это был интересный эксперимент."
 ev9.33.0.c:0 "Мне нужно учесть это в будущих исследованиях."
 ev9.33.0.a_ct:0 "Исследование аномалии завершено"
 ev9.34.desc:0 "Недавно один из встреченных мной путников упомянул интересный слух — похоже, [rumors_target.GetTitledFirstName] владеет необычным предметом. Возможно, речь идет о магическом артефакте."
 laamp_magic_1007_contract:0 "Таинственный свиток"
 laamp_magic_1007_request:0 "Этот [task_contract|E] требует уплаты большого количества золота... или воровства ([intrigue|E])."
 laamp_magic_1007_desc_title:0 "$laamp_magic_1007_contract$"
 laamp_magic_1007_desc:0 "Похоже, что [TaskContract.GetEmployer.GetTitledFirstName] владеет особым свитком, который может быть бесценным для такого, как вы. Возможно, вы сможете убедить [TaskContract.GetEmployer.GetTitledFirstName] продать свиток... а если нет, можно прибегнуть к менее законным способам его получения."
 laamp_magic_1007_desc_ct:0 "#P Вы станете владельцем артефакта.#!"
 msscroll:0 "Древний свиток"
 msscroll_desc:0 "Этот свиток содержит инструкции по управлению так называемой Сингулярностью. Он совершенно непонятен тому, кто не является опытным адептом магии."
 msscrol_additional_desc_cancel_negative_supply:0 "Разблокирует активацию Сингулярности [magic_special_project|E] для владельца Древней Сингулярности"
 ev9.35.desc:0 "[employer.GetTitledFirstName] был рад, что вы заинтересовались свитком — он с радостью продаст его, ему явно нужно золото. Однако названная им цена кажется высокой."
 ev9.35.0.a:0 "1000 монет? Это что, шутка?"
 ev9.35.0.b:0 "Ну, пусть будет так."
 ev9.35.0.a1:0 "Вы договоритесь о лучшей цене"
 ev9.35.0.a_ct:0 "Вы получаете скидку"
 ev9.35.0.a2:0 "[employer.GetTitledFirstName] будет раздражен"
 ev9.36.desc:0 "[employer.GetTitledFirstName] не удалось убедить — [employer.GetSheHe] видит, что вам нужен свиток, и хочет выжать из вас как можно больше золота."
 ev9.36.desc2:0 "Вам удалось уговорить [employer.GetTitledFirstName] немного снизить [employer.GetHerHis] нелепую цену — но это все равно много золота."
 ev9.36.0.a:0 "Хорошо, я беру."
 ev9.36.0.b:0 "Я поищу другой способ..."
 ev9.36.0.b_ct:0 "Вы прибегнете к преступным методам, чтобы заполучить свиток"
 ev9.36.0.c:0 "На самом деле, этот свиток мне не нужен."
 ev9.36.0.c_ct:0 "Вы полностью отказываетесь от попыток заполучить свиток"
 ev9.37.desc:0 "Поскольку покупка невозможна, остается спланировать кражу. Имущество [employer.GetTitledFirstNamePossessive] выглядит не слишком хорошо защищенным, это может сработать."
 ev9.37.0.a:0 "Придумаем план."
 ev9.37.0.b:0 "Мой человек разберется с этим."
 ev9.37.0.b_ct:0 "Вы отправляете своего мастера-вора."
 ev9.37.0.c:0 "Ладно, я сдаюсь."
 ev9.37.0.d:0 "Я просто использую заклинание подчинения."
 ev2.73C.desc:0 "\nОднако вы все еще не знаете, как заставить это работать."
 ev2.73.c:0 "Кто-то должен что-то знать."
 ev2.73.c_ct:0 "Вы отправите своих людей на поиски информации."
 ev2.73.c1_ct:0 "Вы находите полезную зацепку."
 ev2.73.c2_ct:0 "Поиск ни к чему не приводит."
 ev2.73.d:0 "Я решу эту проблему со временем."
 as_special_project:0 "Активация Древней Сингулярности"
 me_as_project_ct:0 "Вы разблокируете #italic Активацию Древней Сингулярности#! [magic_special_project|E]"
 me_as_project_ct2:0 "$as_special_project$ [magic_special_project|E] может быть случайно разблокирована в будущем."
 me_as_project_done_ct:0 "Древняя Сингулярность активирована"
 ev9.38.desc:0 "Несмотря на ваши усилия, вы не смогли получить дополнительных зацепок по Древней Сингулярности. Если такая информация существует, она пока вне вашей досягаемости."
 ev9.39.desc:0 "Один из ваших агентов услышал интересный слух — похоже, [aowner.GetTitledFirstName] владеет свитком, в котором упоминается Древняя Сингулярность. Это может быть именно то, что вы ищете!"
 ev9.39.0.a:0 "Я найду способ заполучить свиток."
 use_ac_inter_mod_cancel_negative_supply:0 "$ev2.73.a_ct$"
 use_singularity_agains_army_ct:0 "Армии в этой провинции будут #N уничтожены#!."
 laamp_magic_1008_contract:0 "Тайная миссия"
 laamp_magic_1008_request:0 "Вы понятия не имеете, чего ожидать от этого [task_contract|E]."
 laamp_magic_1008_desc_title:0 "$laamp_magic_1008_contract$"
 laamp_magic_1008_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] ищет скрытную ведьму для выполнения особой миссии. Пока вы знаете лишь, что это очень важная задача, с которой справится только опытная ведьма."
 ev9.40.desc:0 "Вы и ваши люди прибыли в замок [employer.GetTitledFirstNamePossessive]. Слуга велел вам ждать во дворе, [employer.GetTitledFirstName] скоро к вам выйдет. Вы замечаете множество стражников вокруг, в их движениях чувствуется напряжение. Они у ворот, у окон, на стенах, и их, кажется, становится все больше с каждой минутой. «Что-то здесь не так», — шепчет [rcourt.GetFirstName]. \nНаконец появляется [employer.GetTitledFirstName] в сопровождении еще большего числа стражей. «[this0.GetTitledFirstName], наконец-то мы встретились!» — говорит [employer.GetSheHe]. Ворота замка с грохотом захлопываются, отрезая вам путь к отступлению."
 ev9.40.0.a:0 "Что это, черт возьми, значит!?"
 ev9.41.title:0 "Ловушка"
 ev9.41.desc:0 "«Я давно охочусь за тобой, ведьма. Оказывается, иногда самые простые способы — лучшие, верно? Убейте их, убейте всех ведьм!» \nСтражники бросаются в атаку, и с крепостных стен на вас обрушивается дождь стрел."
 ev9.41.0.a:0 "К оружию!"
 ev9.41.0.a_ct1:0 "Вы отбиваете первую атаку"
 ev9.41.0.a_ct2:0 "Вы разбиты"
 mass_followers_dying:0 "#N Ваши последователи перебиты#!"
 ev9.41.0.b:0 "Оборонительная формация!"
 ev9.41.0.c:0 "Стойте! Я тоже тайный охотник."
 ev9.41.0.c_ct1:0 "Ваш блеф сработал"
 ev9.41.0.c_ct1A:0 "Вы избегаете кровопролития"
 ev9.41.0.d:0 "Будет проще, если я использую Силовой удар."
 ev2.48.d_ct1:0 "Многие враги погибают"
 ev9.41.0.e:0 "Глупцы отведают Огненный шторм."
 ev9.41.0.e_ct:0 "Враги будут уничтожены"
 ev9.41.0.f:0 "Сейчас подходящее время, чтобы использовать Сингулярность."
 ev9.41.0.g:0 "Я сбегу с помощью Теневого шага."
 ev9.41.0.g_ct:0 "#N Вы сбежите, но ваши последователи будут обречены#!"
 ev9.41.0.h:0 "Если мне суждено умереть, они умрут вместе со мной!"
 ev9.41.0.h_ct:0 "Вы призываете торнадо!"
 ev9.41.0.h_ct2:0 "Большинство людей в замке погибнут"
 ev9.41.0.i:0 "Я убью их одного за другим!"
 ev9.41.0.j:0 "[demon.GetTitledFirstName], убей их!"
 ev9.41.0.j_ct:0 "Ваш демон устроит резню, а у вас появится возможность отступить"
 ev9.41.0.k:0 "Моя сила сокрушит их."
 ev9.42.desc:0 "«Какой сюрприз, даже я был обманут! Похоже, ты тут самый умный, да? Прошу прощения за мою интригу, каждый выживает, как может. Дай знать, если я смогу чем-то помочь в будущем.»"
 ev9.42.0.a:0 "Это было на грани..."
 ev9.43.title:0 "Разрушительная сила"
 ev9.43.desc:0 "Ландшафт изменился в одно мгновение — повсюду дым и огонь. Тела нападавших сгорели, и, вероятно, вместе с ними погиб охотник. Ваша сила огромна."
 ev9.43.0.a:0 "Я раздавил их, как насекомых."
 ev9.43.0.b:0 "У меня не было выбора."
 ev9.44.desc0:0 "С большим трудом вам удалось отбить первую атаку и пробиться к ближайшей башне."
 ev9.44.desc1:0 "Ваше заклинание сожгло несколько врагов, но их место быстро заняли другие. К счастью, это дало вам время прорваться к ближайшей башне."
 ev9.44.desc2:0 "\nВы забаррикадировались внутри, и на мгновение наступило затишье; враг, вероятно, перегруппировывается. Башня соединена со стенами, которые ведут к воротам, но этот путь, скорее всего, охраняют вражеские лучники. Хорошая новость в том, что место, где вы находитесь, удобно для обороны."
 ev9.44.0.a:0 "Быстро, к воротам, пока они не перегруппировались!"
 ev9.44.0.a_ct:0 "Ваше бегство #P продвигается#!"
 ev9.44.1.a:0 "Вам удалось добраться до ворот"
 ev9.44.2.a:0 "Вражеские лучники расстреляли вас, как мишени"
 ev9.44.0.b:0 "Мне нужно время, чтобы подумать."
 ev9.44.0.b_ct:0 "Вы пытаетесь составить план"
 suffering_casualties:0 "Вы несете потери!"
 ev9.45.desc:0 "Однако враги не дают вам времени на действия. Вы слышите, что они готовят штурм башни. Некоторые из ваших людей ранены, но большинство способно сражаться."
 ev9.45.0.a:0 "Пусть идут, мы готовы!"
 ev9.45.0.a_ct:0 "Вы отбиваете вторую атаку"
 ev9.45.0.b:0 "Я могу распылить травы, которые ослепят нападающих."
 ev9.45.0.c:0 "Я сожгу любого, кто попытается войти, с помощью заклинания."
 ev9.46.desc:0 "Штурм отбит, и у входа в башню лежит груда тел нападавших. У вас есть момент, чтобы разработать план и обработать раны. Тем временем вы слышите голос [employer.GetTitledFirstNamePossessive] снаружи.\n"
 ev9.46.desc2:0 "«Впечатляюще, ведьма. Но мы все еще можем уморить вас голодом или просто поджечь башню. У меня есть предложение — сдавайтесь, и я пощажу ваших спутников, они уйдут свободно. А ты получишь быструю смерть.»"
 ev9.46.0.a:0 "Нам придется сдаться."
 ev9.46.0.a_ct:0 "Ваши последователи будут пощажены"
 ev9.46.0.b:0 "Я попробую договориться о лучших условиях капитуляции."
 ev9.46.0.b_ct:0 "Вас пощадят (пока...)"
 ev9.46.0.c:0 "Мы будем продолжать защищаться."
 ev9.47.desc:0 "Время идет, приближается вечер. Противники, кажется, готовятся к новому штурму, но не торопятся. Вы же размышляете, как выбраться из этой ловушки. В голову приходит идея..."
 ev9.47.desc2:0 "«Эй, вы там! — это снова [employer.GetTitledFirstName] — Мы захватили вашего человека. Думаете, я глупец? Никто не придет вам на помощь, сдавайтесь!»\nПохоже, нужен новый план..."
 ev9.47.0.a:0 "У нас тут много стрел и масла. Что ж..."
 ev9.47.0.a_fl:0 "Кто-нибудь упоминал что-то о поджоге?"
 ev9.47.0.a_ct:0 "Стрельба горящими стрелами по другим частям замка может вызвать хаос — это облегчит побег."
 ev9.47.0.a_ct2:0 "Вы используете отвлечение, чтобы пробраться по стенам к воротам."
 ev9.47.0.b:0 "Нужно отправить сообщение в лагерь."
 ev9.47.0.b_fl:0 "Один человек может незаметно сбежать — и вызвать наши войска."
 ev9.47.0.b_ct:0 "Вы должны продержаться, пока не прибудет подкрепление"
 ev9.47.1.b:0 "Сообщение будет доставлено"
 ev9.47.2.b:0 "Курьер будет схвачен"
 ev9.47.0.c:0 "Я призову демона."
 ev9.47.0.c_fl:0 "Демон определенно вызовет смятение в рядах врагов, если только не обратится против вас."
 ev9.47.0.c_ct:0 "Результат будет непредсказуем"
 ev9.47.0.d:0 "Я распылю стену, чтобы мы могли сбежать."
 ev9.47.0.d_fl:0 "$master_alteration_modifier$ без труда превратит твердый камень в воздух."
 ev9.47.0.e:0 "Я подготовлю заклинание массового подчинения."
 ev9.47.0.e_fl:0 "$master_psionic_modifier$ может заставить некоторых врагов сражаться друг против друга, если обстоятельства благоприятны."
 ev9.47.0.e_ct:0 "Это создаст возможность для побега!"
 ev9.47.0.f:0 "Думаю, заклинание торнадо отвлечет врагов."
 ev9.47.0.f_fl:0 "Заклинание торнадо непредсказуемо, но, если буря не ударит прямо по башне, вы будете в безопасности."
 ev9.47.0.f_ct:0 "Это создаст возможность для побега!"
 ev9.47.0.g_fl:0 "Иногда сдача — единственный выход."
 ev9.48.desc:0 "Вы добрались до ворот, которые охранялись, но вы быстро разобрались со стражей. Вы повредили решетку ворот, чтобы ее нельзя было поднять — это затруднит погоню — а затем спустились по веревкам с другой стороны. Вы свободны."
 ev9.48.0.a:0 "Исчезнем, пока они не организовались."
 ev9.48.0.b:0 "Однажды я отомщу за это."
 ev9.49.desc:0 "В комнате появился демон, и с ним — резкий запах серы. Демон выглядит недовольным.\n«Ты прервал мою трапезу, смертный. Зачем ты меня беспокоишь?»"
 ev9.49.0.a:0 "У меня есть еда получше. Снаружи."
 ev9.50.desc:0 "«О чем ты говоришь? Здесь есть подвох?» — демон выглядит заинтересованным."
 ev9.50.0.a:0 "Я освобожу тебя, если ты убьешь для меня несколько солдат."
 ev9.51.desc:0 "«Смертный, ты вызвал мой интерес, а теперь завладел моим вниманием.»\nВы объяснили демону свою ситуацию, и, кажется, достигли взаимопонимания. Хотя такое количество солдат могло бы одолеть даже демона, его атака точно вызовет достаточно хаоса, чтобы вы смогли вырваться из окружения. Спустя мгновение вы освободили демона из импровизированного круга призыва, и он покинул башню. Снаружи раздаются крики ужаса и боли, словно вы выпустили не одного демона, а весь ад!"
 ev9.51.0.a:0 "Быстро! К воротам!"
 MAGIC_HEALING_SCARS:0 "Удаление шрамов."
 rol_special1_terrain_cancel_negative_supply:0 "Открывает целебное заклинание для магов"
 rol_special2_terrain_cancel_negative_supply:0 "Исцеление устраняет генетические дефекты"
 visited_place_of_power:0 "Вы посетили место силы!"
 laamp_magic_1009_contract:0 "Охота на монстра"
 laamp_magic_1009_request:0 "Этот [task_contract|E] требует магических навыков и высокой магической насыщенности."
 laamp_magic_1009_desc_title:0 "$laamp_magic_1009_contract$"
 laamp_magic_1009_desc:0 "В королевстве [TaskContract.GetEmployer.GetTitledFirstName] бродит монстр, по крайней мере, так говорят слухи. Что бы это ни было, оно убивает людей, и никто не может его остановить. [TaskContract.GetEmployer.GetTitledFirstName] готов заплатить золотом за решение проблемы."
 ev9.52.desc:0 "Вы побеседовали с [employer.GetTitledFirstName], чтобы собрать основную информацию о задании. Некоторое время местные крестьяне исчезали без следа, но никто не придавал этому значения, ведь это были всего лишь крестьяне. Однако недавно на краю леса было найдено тело одного из придворных, [dead_courtier.GetTitledFirstName]. Похоже, [dead_courtier.GetSheHe] был растерзан каким-то диким зверем, но когда охотники отправились выследить его, никто из них не вернулся. Военный патруль также был послан, но солдаты тоже исчезли без следа. Тогда [employer.GetTitledFirstName] решил призвать профессионала — такого, как вы."
 ev9.52.0.a:0 "Я хочу осмотреть тело."
 ev9.53.desc:0 "[dead_courtier.GetTitledFirstName] был найден несколько дней назад, поэтому тело уже начало разлагаться, но вы все еще замечаете следы когтей на теле [dead_courtier.GetHerHis]. Это не поверхностные царапины, а глубокие раны, как будто кто-то выпотрошил [dead_courtier.GetHerHim]. Это, должно быть, была мучительная смерть."
 ev9.53.0.a:0 "Я хочу осмотреть место, где нашли [dead_courtier.GetSheHe]."
 ev9.53.0.b:0 "Я проведу вскрытие."
 ev9.53.0.c:0 "Я поищу следы магии."
 ev9.53.0.d:0 "Я осмотрю следы когтей."
 ev9.53.0.e:0 "Я попробую прочитать ауру."
 ev9.53.0.f:0 "У меня плохое предчувствие — я отказываюсь."
 ev9.53.desc1:0 "Придворный получил тяжелые ранения и умер долгой, мучительной смертью. Судя по расположению и размеру ран, боль длилась очень долго, как будто то, что убило [dead_courtier.GetHerHim], хотело сохранить [dead_courtier.GetHerHis] жизнь как можно дольше. Животные так не поступают. Вы также замечаете, что печень и сердце отсутствуют."
 ev9.53.desc2:0 "Вы ощущаете слабые следы магической ауры на трупе, но не можете сказать ничего определенного. Возможно, это совпадение или какой-то магический отголосок?"
 ev9.53.desc3:0 "Вы изучили раны, но можете лишь сказать, что не слышали о животном, которое наносит раны такого типа."
 ev9.53.desc4:0 "Аура слишком слабая, чтобы вы могли четко ее прочитать, но вы установили, что [dead_courtier.GetTitledFirstName] определенно не был магом и даже не был целью заклинания. Но существо, убившее [dead_courtier.GetHerHim], могло обладать магией."
 ev9.54.desc:0 "Вы добрались до места, где было найдено тело. Здесь нет никаких следов, кроме того, что земля в одном месте немного темнее — пропитана кровью погибшего. Вероятно, вы не найдете здесь ничего интересного."
 ev9.54.0.a:0 "Думаю, я осмотрю окрестности."
 ev9.54.0.a_ct:0 "Вы идете по пути, который могли пройти охотники и солдаты."
 ev9.55.desc:0 "Местность становится болотистой, в воздухе витает странный запах. Вас также не покидает неприятное чувство, что кто-то или что-то следит за вами. Возможно, эта одиночная экспедиция была не лучшей идеей."
 ev9.55.0.a:0 "Я продолжу, ответ должен быть близко."
 ev9.55.0.a1:0 "Вы находите след."
 ev9.55.0.a1_ct:0 "Вы приближаетесь к разгадке"
 ev9.55.0.a2:0 "Вы сбились с пути."
 ev9.55.0.a2_ct:0 "Вы понятия не имеете, где находитесь"
 ev9.55.0.b:0 "Я поищу следы."
 ev9.55.0.c:0 "Я возвращаюсь в замок, скоро стемнеет."
 ev9.55.0.c_ct:0 "Вы решаете вернуться в замок к своим спутникам"
 ev9.56.desc1:0 "Когда вы повернулись, чтобы вернуться в замок, вы обнаружили, что за вами кто-то стоит...\n"
 ev9.56.desc0:0 "Вам удалось найти правильный путь, очевидно, что здесь недавно прошло много людей. Вы были так сосредоточены на тропе, что не заметили, что вы здесь не одни.\n"
 ev9.56.desc:0 "«Заблудились, [this0.Custom('GetProperWitchDesc')]?\"\nИз теней выступило существо. На первый взгляд оно напоминает человека, но вы чувствуете запах серы и магии, а также чистую злобу в его взгляде. Это демон."
 ev9.56.0.a:0 "$ev53.0.a$"
 ev9.56.0.b:0 "Значит, вероятно, это тебя я ищу."
 behemoth_name:0 "Бегемот"
 mage_small_letter:0 "маг"
 witch_small_letter:0 "ведьма"
 ev9.57.desc:0 "«Хорошо сказано. Похоже, местный правитель немного недоволен тем, что я убиваю его подданных одного за другим. И он посылает мне еще один вкусный кусочек. М-м-м.»"
 ev9.57.0.a:0 "Ты умрешь, демон!"
 ev9.57.0.b:0 "Я не ищу неприятностей..."
 ev9.58.desc:0 "«Но неприятности нашли тебя!» — демон бросился в атаку."
 ev9.58.0.a:0 "Ты пожалеешь об этом."
 ev9.57.1.a:0 "Вы побеждаете демона"
 ev9.57.2.a:0 "Демон разрывает вас на куски"
 ev9.59.desc:0 "Вам с трудом удалось победить демона, вы никогда раньше не сражались с таким быстрым и сильным противником. Такой трофей точно впечатлит вашего нанимателя."
 ev9.59.0.a:0 "Дело закрыто."
 ev9.60.desc:0 "«Значит, местный правитель отправил мага, чтобы разобраться с проблемой? Впечатляющая решимость.»"
 ev9.60.0.a:0 "Кто тебя призвал?"
 ev9.61.desc:0 "«Какой-то недоученный волшебник. Я вырвался из-под его контроля и начал исследовать ваш прекрасный мир. Он полон вкусных кусочков... и сюрпризов.»"
 ev9.61.0.a:0 "Я отправлю тебя в бездну."
 ev9.62.desc:0 "«Я не хочу возвращаться туда. Но и сражаться с тобой я не хочу, я чувствую, что ты силен. Как насчет компромисса? Я присоединюсь к тебе как твой слуга.»"
 ev9.62.0.a:0 "Доверять демону? Никогда."
 ev9.62.0.b:0 "Пусть будет так. Возвращаемся в лагерь."
 ev9.63.desc:0 "«Хороший подход, но ты все равно умрешь» — демон набросился на вас."
 ev9.63.0.a:0 "Я сожгу [demon2.GetHerHim] своей силой."
 ev9.63.0.b:0 "Я разрублю [demon2.GetHerHim] на куски."
 ev9.64.desc:0 "Вы и демон направляетесь к лагерю. Вы размышляете, что сказать [employer.GetTitledFirstName], как вдруг мощный удар сбивает вас с ног. Вы понимаете, что лежите в оцепенении в луже собственной крови, не в силах что-либо сделать.\n«Значит, люди все-таки глупцы. По крайней мере, ты вкусный. Интересно, какова на вкус печень мага. Вижу, ты буквально умираешь от любопытства...»"
 ev9.64.0.a:0 "Нет...!"
 ev3.29.n:0 "Разрушение."
 ev3.34.i:0 "Это значительно облегчит войны."
 ev3.34.i_ct:0 "Вы получаете доступ к #italic заклинанию Торнадо#! [interaction|E]"
 tornado_spell:0 "Торнадо"
 tornado_spell_desc:0 "Это заклинание создано для уничтожения вражеских армий, хотя его эффекты иногда могут выйти из-под контроля."
 tornado_spell_ct:0 "Торнадо ударит по армии цели или ее владениям."
 ev9.65.desc:0 "Заклинание Торнадо готово! Теперь нужно лишь выбрать точную цель удара..."
 ev9.65.0.a:0 "Я направлю торнадо туда, где находится [recipient.GetTitledFirstName]."
 ev9.65.0.b:0 "Торнадо ударит по столице [recipient.GetTitledFirstName]."
 ev9.65.0.c:0 "[army1.GetName] будет уничтожена."
 ev9.65.0.d:0 "Торнадо сметет [army2.GetName]."
 ev9.65.0.e:0 "Однако я подожду более подходящего момента."
 ev9.65.0.e_ct:0 "Заклинание не будет использовано."
 use_tornado_spell_army_ct:0 "Армия будет #N уничтожена#!."
 use_tornado_spell_army_ct2:0 "Все армии в этой провинции будут #N уничтожены#!."
 use_tornado_spell_army_ct3:0 "Персонажи в этой области могут быть #N ранены#!."
 use_tornado_spell_destruction_ct:0 "Торнадо сеет разрушения!"
 tornado_notification_ct:0 "Торнадо #N уничтожает#! вашу армию!"
 tornado_spell_modifier:0 "Эффекты торнадо"
 ev7.129.g:0 "Метеоритный дождь обрушится на моих врагов."
 ev7.129.g_ct:0 "Некоторые вражеские армии будут #N уничтожены#!."
 ev7.129.g_ct2:0 "Одна из ваших армий была уничтожена."
 ancient_archmage_modifier:0 "Древний архимаг"
 md_power_clash2_terrain_advantage:0 "Прогресс в [power_clash|E] противника"
 YOUR_SMP_IS_HIGHER:0 "Цель должна иметь более высокий потенциал, чем у вас"
 drink_magic_potion_interaction:0 "Выпить зелье"
 drink_magic_potion_interaction_desc:0 "В зависимости от типа эликсира вы можете получить различные преимущества."
 POTION_USED_TOO_OFTEN:0 "Вы не можете выпить зелье, которое недавно пили."
 no_potion_right_now:0 "#N Вы не можете выпить зелье в данный момент.#!"
 trait_track_alchemy:0 "Алхимия"
 trait_track_alchemy_desc:0 "Природа хранит множество тайн, включая способы трансмутации материи и достижения долголетия."
 mage_alchemy_terrain_advantage:0 "Снижение стоимости $create_potion_decision$ [decision|E]"
 mage_alchemy2_terrain_advantage:0 "Перезарядка $create_potion_decision$ [decision|E] (в годах)"
 mage_alchemy3_terrain_cancel_negative_supply:0 "Разблокирует $magic_transmutation_decision$ [decision|E]"
 mage_alchemy4_terrain_cancel_negative_supply:0 "Вы можете создавать продвинутые составы по вашему выбору"
 ev9.66.0.a:0 "Я приготовлю продвинутое зелье."
 ev9.67.desc:0 "Ваше мастерство в алхимии позволяет вам создавать любой состав, который вы пожелаете."
 ev9.67.0.a:0 "Может, что-то другое..."
 ev9.68.0.a:0 "Однако я сделаю что-то обычное."
 monthly_income:0 "Дополнительный доход"
 witchcraft_legacy_1_ct3:0 "Члены династии обладают лучшей [aptitude|e] в роли придворных магов"
 ev6.71.desc2:0 "У вас сейчас нет земель, поэтому построить башню мага невозможно. Это нужно решить иным способом."
 ev6.71.0.f:0 "На самом деле, мне это не нужно."
 me_golem2_project_ct:0 "Вы разблокируете #italic Армию големов#! [magic_special_project|E]"
 me_golem2_option:0 "Армия големов"
 ev7.117.g:0 "Новая сила восходит."
 ev7.117.g_ct:0 "Вы разблокируете полк $golems_army$!"
 ev7.118.c:0 "Я создам его по своему образу и подобию."
 ev9.69.title:0 "Еще големы?"
 ev9.69.desc:0 "Если упростить процесс создания голема и не уделять столько внимания деталям, теоретически можно создать целую армию таких конструктов. Такие солдаты не устают, не требуют платы и, вероятно, будут непобедимыми."
 ev9.69.0.a:0 "Я подумаю об этом на досуге."
 ev9.70.title:0 "Настройка голема"
 ev9.70.desc:0 "Ваш голем продолжает вдохновлять вас на новые идеи. Вы думаете о том, как адаптировать его человеческое поведение..."
 ev9.70.0.a:0 "Я усилю поведенческие функции."
 ev9.70.0.b:0 "Интеллект [golem.GetHerHis|U] будет улучшен."
 ev9.70.0.c:0 "А как насчет такого подхода..."
 ev9.70.0.d:0 "Было бы лучше, если бы [golem.GetSheHe] был менее человечным."
 golems_army:0 "Боевые големы"
 golems_army_flavor:0 "#F Величайшее достижение магической инженерии — армия конструктов, специализирующихся на подавлении любого сопротивления.#!"
 fire_storm_spell_ct3:0 "Армии в провинции будут повреждены."
 game_rule_category_witchcraft:0 "Колдовство"
 setting_yep2_magic_witches:0 "Да, с источником!"
 setting_yep2_magic_witches_desc:0 "Вы начинаете игру как ведьма с чертой Источника."
 decision_group_type_magic_decisions:0 "Заклинания и ритуалы"
 trait_demon0:0 "Демоническое наследие"
 trait_demon0_desc:0 "В будущем истинная природа этого человека может проявиться..."
 demon0_terrain_cancel_negative_supply:0 "В будущем может стать демоном"
 ev2.38.b:0 "Я отвергаю свое... наследие."
 ev8.2.desc.puppet:0 "[recipient.GetSheHe|U] #N подчинен#! [my_mmaster.GetTitledFirstName]."
 ev9.0.e:0 "Артефакт должен быть моим."
 ev9.0.f:0 "Мой слуга передаст мне артефакт."
 ev9.0.g:0 "Я попытаюсь купить этот артефакт."
 ev9.1.g:0 "Сделка состоялась."
 ev9.2.g:0 "Цель отклоняет ваше предложение."
 ev9.71.desc:0 "К сожалению, [second_mage.GetTitledFirstName] отклонил ваше щедрое предложение."
 ev9.71.0.a:0 "[second_mage.GetSheHe|U] пожалеет об этом."
 alchemy_archmage_terrain_advantage:0 "Увеличение опыта в алхимии для магов"
 ev9.72.title:0 "Гурман"
 ev9.72.desc:0 "В последнее время вы испытываете нарастающее недовольство, причиной которого, вероятно, является плохое питание. Было бы неплохо полакомиться чем-то по-настоящему вкусным — в конце концов, быть ведьмой — это тоже про удовольствия. [victim.GetTitledFirstName] кажется подходящим кандидатом для роскошного ужина. Это будет восхитительно..."
 ev9.72.0.a:0 "Мясо должно вернуться в меню."
 ev9.72.0.b:0 "У меня сейчас нет на это времени."
 ev9.73.title:0 "Уважение и признание"
 ev9.73.desc:0 "Один из колдунов подошел, чтобы поздравить вас с победой в магической дуэли с [defeated.GetTitledFirstName]. Похоже, все больше людей уважают ваши навыки и силу, которой вы обладаете."
 ev9.73.0.a:0 "Это приятно..."
 ev9.73.0.b:0 "Репутация важна."
 ev9.73.0.c:0 "Мне все равно."
 ev9.73.0.d:0 "Они не должны меня поздравлять, они должны меня бояться."
 ev9.74.desc:0 "Обстоятельства благоприятствуют особому ритуалу — вы можете извлечь силу прямо из своих владений и земель. Ваши подданные станут чуть менее продуктивными, но также более спокойными."
 power_extraction_modifier:0 "Извлечение силы"
 ev9.74.desc2:0 "Обстоятельства благоприятствуют особому ритуалу — вы можете вытянуть силу прямо из этой местности."
 ev9.74.0.a:0 "Я сделаю это."
 ev9.74.0.b:0 "Я пожертвую своим наследником."
 ev9.74.0.c:0 "Я использую свою собственную жизненную силу."
 ev2.56.c:0 "Мне нужно лучше понять этот процесс."
 ev2.56.c_ct:0 "Вы получите дополнительный опыт в алхимии, когда станете магом."
 mage_duel_terrain_cancel_negative_supply:0 "Разблокирует Магическую дуэль [interaction|E]"
 search_artifacts_terrain_cancel_negative_supply:0 "Разблокирует Поиск магических артефактов [activity|E] для землевладельца-ведьмы"
 ev9.75.desc:0 "Вы нашли несколько весьма тревожных глав в Черногримуаре. Если хотя бы часть из этого правдива, вселенная полна существ с непостижимыми силами и моралью, совершенно отличной от той, что принимают люди. Некоторые из них могут даже скрываться на Земле."
 ev9.75.0.a:0 "Это невероятно."
 ev6.5.0.b:0 "Я давно не сражался с Молохом."
 ev9.76.desc:0 "Молох появился в круге призыва. Увидев вас, он пришел в еще большую ярость — он вас помнит! В исступлении он бросается на круг призыва, искры разлетаются в воздухе."
 ev9.76.0.a:0 "Готов к новому раунду?"
 ev9.76.0.b:0 "Ты скучен, исчезни."
 ev9.77.desc:0 "«Добро пожаловать, [this0.GetTitledFirstName]», — демонесса выглядит довольной, увидев вас. — «Как удачно, что ты меня призвал, мы можем заключить небольшую сделку. Мне нужно забрать одного из твоих придворных в ад — [rcourtier.GetTitledFirstName].»"
 ev9.77.0.a:0 "Почему ты хочешь забрать [rcourtier.GetHerHim]?"
 ev9.78.desc:0 "«Ты все равно не поймешь, адские дела. Скажем так, он нужен для моего эксперимента. Взамен я могу поделиться с тобой магическими секретами.»"
 ev9.78.0.a:0 "Я бы предпочел больше силы."
 abduct_enemy_scheme_phase_duration_add:0 "Вражеская $murder_scheme_phase_duration_add$"
 murder_enemy_scheme_phase_duration_add:0 "Вражеская $abduct_scheme_phase_duration_add$"
 laamp_magic_1010_contract:0 "Проклятый замок"
 laamp_magic_1010_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и решить проблему, используя навык [learning|E]."
 laamp_magic_1010_desc_title:0 "$laamp_magic_1010_contract$"
 laamp_magic_1010_desc:0 "Говорят, что замок [TaskContract.GetEmployer.GetTitledFirstName] населён призраками. [TaskContract.GetEmployer.GetTitledFirstName] ищет специалиста, который сможет избавить замок от этих нежеланных гостей."
 ev9.80.desc:0 "«Я рад, что вы прибыли. Верю, что вы сможете мне помочь. По ночам в замке слышны странные звуки, мерцают огни, стены движутся и меняют цвет. Люди здесь плохо спят, и мне тоже снятся странные сны. Некоторые слышат голоса в своих головах... возможно ли, что это призраки?»"
 ev9.80.0.a:0 "Я не верю в призраков."
 ev9.80.0.b:0 "Все возможно."
 ev9.81.desc:0 "«Что бы это ни было, я хочу, чтобы вы решили эту проблему. Текущая ситуация вредит моей репутации, мои придворные становятся тревожными, а мои враги наверняка попытаются это использовать. Останьтесь на ночь в замке, и вы сможете сами оценить ситуацию.»"
 ev9.81.0.a:0 "У меня нет времени на глупости, прощайте."
 ev9.81.0.b_ct:0 "Вы останетесь в замке на некоторое время."
 ev9.82.desc:0 "Вы провели несколько дней в замке, но ничего подозрительного не произошло. Однако следующей ночью вас разбудили странные звуки... Вы поднялись с кровати и почувствовали головокружение. Такого вы раньше не испытывали. Вам кажется, что вы слышите шепот из коридора."
 ev9.82.0.a:0 "Мне нужно это проверить."
 ev9.83.desc:0 "В коридоре тихо и спокойно. На мгновение вам показалось, что вы заметили движение в темноте, но, подойдя ближе, вы никого не нашли. Неужели это были призраки? И это странное чувство все еще не покидает вас..."
 ev9.83.desc2:0 "Вы не находите следов магии в этом месте. Возможно, это что-то незнакомое, неизвестное вам? Или призраки не оставляют магических следов?"
 ev9.83.0.a:0 "Мне нужно об этом подумать."
 ev9.83.1.a:0 "У вас появилась идея."
 ev9.83.2.a:0 "Вы понятия не имеете, что здесь происходит"
 ev9.83.0.b:0 "Я поищу следы магии."
 ev9.83.0.b_ct:0 "Вы исследуете местность на наличие следов магии."
 ev9.84.desc:0 "Вы провели несколько экспериментов, осмотрели стены и полы, но ничего интересного не нашли. Вы не понимаете, что здесь происходит."
 ev9.84.0.a:0 "Я останусь здесь еще ненадолго."
 ev9.84.0.b:0 "Я убираюсь отсюда."
 ev9.85.desc:0 "Следующей ночью вам приснился кошмар. Вы резко проснулись, и прошло немало времени, прежде чем вы вспомнили, где находитесь. Снова вам кажется, что вы слышите шепот — то ли из коридора, то ли из стен. Когда вы встали, чтобы осмотреться, вы обнаружили, что едва можете стоять. Может, вы больны?"
 ev9.85.0.a:0 "Я возвращаюсь в постель..."
 ev9.85.0.b:0 "Моя болезнь не случайна."
 ev9.85.0.b_ct:0 "Вы решаете провести эксперимент."
 ev9.86.desc:0 "На следующий день вы чувствуете себя плохо. Возможно, это вовсе не призраки, а какая-то болезнь — другие обитатели замка тоже выглядят неважно. Вы приходите к выводу, что лучше всего как можно скорее покинуть этот замок."
 ev9.86.0.a:0 "Назад в лагерь."
 ev9.87.desc:0 "Используя травы и инструменты, которые у вас были под рукой, вы провели эксперимент. Результат очевиден — воздух заражён. Похоже, пребывание в замке несколько дней может вызывать болезни, галлюцинации или кошмары. Это объясняет проблему с «призраками»."
 ev9.87.0.a:0 "Но что может быть причиной?"
 ev9.88.desc:0 "На следующий день вы решили осмотреть другие части замка и поговорить с персоналом. Теперь вы знали, что искать и о чем спрашивать. Так вы добрались до подземелий, частично затопленных водой. На стенах вы обнаружили причину проблемы — экзотический гриб, чьи споры вызывали все эти явления. Осушение или запечатывание подземелий устранит «призраков»."
 ev9.88.0.a:0 "[employer.GetTitledFirstName] будет доволен моими выводами."
 laamp_magic_1011_ct1:0 "Вы узнаете местоположение магического артефакта"
 laamp_magic_1011_ct2:0 "Вы получите права на магический артефакт"
 laamp_magic_1011_contract:0 "$ev2.55.title$"
 laamp_magic_1011_request:0 "Этот [task_contract|E] требует отправиться в земли [TaskContract.GetEmployer.GetTitledFirstNamePossessive] и использовать золото или [intrigue|E] для получения информации."
 laamp_magic_1011_desc_title:0 "$laamp_magic_1011_contract$"
 laamp_magic_1011_desc:0 "По слухам, [TaskContract.GetEmployer.GetTitledFirstName] может знать что-то о магическом артефакте. Возможно, немного хитрости или золота заставят [TaskContract.GetEmployer.GetHerHim] поделиться этой информацией с вами."
 ev9.89.desc:0 "Вам удалось подтвердить, что [employer.GetTitledFirstName] действительно может знать что-то о магических артефактах. Золото или убеждение могут побудить [employer.GetHerHim] заговорить."
 ev9.89.0.a:0 "Я предложу золото."
 ev9.89.0.b:0 "Я добуду информацию обманом."
 ev9.89.0.c:0 "Думаю, мы придем к соглашению."
 ev9.89.0.e:0 "Я просканирую разум [employer.GetHerHis]."
 ev9.89.0.d:0 "Пустая трата времени, [employer.GetSheHe] ничего не знает."
 ev9.89.0.d_ct:0 "Вы отказываетесь от попыток получить информацию."
 ev9.90.desc:0 "Из полученной информации следует, что магический артефакт находится во владении [maowner.GetTitledFirstName]. Вам придется учесть это в своих планах."
 ev9.90.0.a:0 "$ev4.23.0.a$"
 ev9.90.0.b:0 "Это должно быть моим."
 ev9.90.0.c:0 "Это следующая цель для моего мастера-вора."
