 agent_spellweaver: "Заклинатель"
 agent_spellweaver_i: "[success_chance_max_i]"
 agent_spellweaver_desc: "#WEAK Опытные маги — ключевой элемент в произнесении групповых заклинаний. Они должны обладать безупречными навыками, но также непревзойденной лояльностью — любой из них может легко саботировать заклинание или использовать его эффекты в своих целях.#!\n$EFFECT_LIST_BULLET$ Дает [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Маги с высоким уровнем тайных знаний лучше всего подходят для этой роли"
 agent_magic_source: "Резервуар"
 agent_magic_source_i: "[success_chance_max_i]"
 agent_magic_source_desc: "#WEAK Запасной источник магической энергии может пригодиться для стабилизации процесса. Эту роль может выполнить любой человек, насыщенный силой.#!\n$EFFECT_LIST_BULLET$ Дает [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Требуется черта источника и/или насыщенность силой"
 agent_magic_assistant: "Ассистент"
 agent_magic_assistant_i: "[scheme_speed_i]"
 agent_magic_assistant_desc: "#WEAK Ассистент обеспечивает бесперебойное проведение ритуала и наличие всех необходимых компонентов под рукой. Ему или ей не обязательно обладать магическими способностями.#!\n$EFFECT_LIST_BULLET$ Дает [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Лучший выбор — искусная ведьма или человек с высоким уровнем знаний"
 ultimate_spell_cast:0 "$grand_spell_decision_title$"
 ultimate_spell_cast_action:0 "$grand_spell_decision_title$ под руководством"
 ultimate_spell_cast_desc:0 "Мощная магия иногда требует совместных усилий нескольких магов. Если ритуал будет успешным, вы сможете создать эффект глобального масштаба. Однако провал может означать смерть участников ритуала, включая вас."
 ultimate_spell_cast_desc_general:0 "$ultimate_spell_cast_desc$"
 ultimate_spell_cast_start_ct:0 "Вы начинаете ритуал"
 ultimate_spell_blackgrimoire_modifier:0 "$blackgrimoire$"
 ultimate_spell_catalyst_modifier:0 "$magic_catalyst$"
 ultimate_spell_master_modifier:0 "$master_magic_modifier$"
 ultimate_spell_chosen_modifier:0 "$trait_source3$"
