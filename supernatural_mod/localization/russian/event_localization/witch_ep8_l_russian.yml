 CHANCE_IS_TOO_LOW_CUSTOM:0 "Шансы на успех слишком низкие"
 ADVANTAGES_ARE_TOO_LOW_CUSTOM:0 "Вам нужно как минимум пять преимуществ"
 ev9.91.desc:0 "Ваши приготовления к ритуалу произнесения Высшего Заклинания продвигаются. Скоро огромная сила будет в ваших руках, готовая подчиниться вашей воле!"
 ev9.91.0.a:0 "Пора произнести заклинание!"
 ev9.91.0.b:0 "Мы подождем еще немного."
 ev9.91.1.a_ct:0 "#P Вы успешно произнесли Высшее Заклинание.#!"
 ev9.91.2.a_ct:0 "#N Заклинание провалилось.#!"
 ev9.91.3.a_ct:0 "#N Может произойти катастрофа.#!"
 ev9.91.4.a_ct:0 "#N Участники ритуала могут погибнуть.#!"
 ev9.92.desc:0 "Вы готовы провести ритуал, который позволит вам произнести Высшее Заклинание. Это, вероятно, одно из самых мощных заклинаний, которые может сотворить колдун — вам, скорее всего, понадобится помощь других магов, а также огромное количество магической энергии."
 ev9.92.0.a:0 "Я начну подготовку."
 ev9.92.0.b:0 "$ev2.2.d$"
 ev9.92.0.c:0 "Я могу произнести заклинание прямо сейчас."
 ev9.92.0.c_ct:0 "Высшее Заклинание будет произнесено немедленно."
 ev9.92.0.a_ct:0 "Вы начнете [GetScheme('ultimate_spell_cast').GetTypeName] [scheme|E]"
 ev9.93.title:0 "Высшее Заклинание — Критический провал"
 ev9.93.desc:0 "Когда вы попытались произнести заклинание, накопленная сила вышла из-под контроля. Огромный выброс энергии вызвал взрыв, который был слышен даже в соседних королевствах."
 ev9.94.title:0 "Высшее Заклинание — Провал"
 ev9.94.desc:0 "Когда вы попытались произнести заклинание, накопленная сила вышла из-под контроля. Если вы ничего не сделаете, все вы погибнете!"
 ev9.94.0.a:0 "Я подавлю заклинание!"
 ev9.94.0.b:0 "Я пожертвую [p1.GetTitledFirstName]."
 grand_spell_decision_desc2:0 "Высшее Заклинание очень мощное и имеет множество применений, но оно сложное и рискованное — малейшая ошибка в процессе его произнесения может привести к катастрофическим последствиям."
 ev9.95.title:0 "Высшее Заклинание — Стабилизация"
 ev9.95.desc:0 "Ритуал сосредотачивает силу, которую всё сложнее контролировать. Вам нужно найти способ защитить себя и своих заклинателей."
 ev9.95.0.a:0 "Я пересчитаю параметры заклинания."
 ev9.95.0.b:0 "Нечего беспокоиться..."
 ultimate_spell_unstable_modifier:0 "Нестабильное заклинание"
 ultimate_spell_stable_modifier:0 "Стабильное заклинание"
 ev9.96.title:0 "Высшее Заклинание — Концентрация силы"
 ev9.96.desc:0 "Ритуалу требуется дополнительная сила для поддержания эффекта — иначе заклинание может ослабнуть или стать нестабильным."
 ev9.96.0.a:0 "Мы зарядим заклинание."
 ev9.96.0.b:0 "Я не думаю, что это необходимо."
 ev9.96.0.b_ct:0 "#N Заклинание может иметь более слабый эффект.#!"
 ev9.97.title:0 "Высшее Заклинание — Эксперимент"
 ev9.97.desc:0 "Работа с такой мощной магией открывает возможности для множества интересных наблюдений. Вам кажется, что вы уже можете использовать часть силы заклинания на этом этапе."
 ev9.97.0.a:0 "Я попробую поглотить часть силы."
 ev7.105.j:0 "Я требую поддержки совета."
 ev7.105.j_ct:0 "Участники Магического Саммита могут присоединиться к [GetScheme('ultimate_spell_cast').GetTypeName] [scheme|E]"
 mage_council_support_modifier:0 "Поддержка Магического Совета"
 ultimate_spell_council_modifier:0 "$mage_council_support_modifier$"
 ev9.98.title:0 "Тёмные дары"
 ev9.98.desc:0 "Вы погружаетесь в беспокойный сон. В этом сне вы видите существо из теней и света, наблюдающее за вами. Вы слышите, как оно говорит: «У меня есть кое-что для тебя, смертный. Чувствуешь? Это мои дары.»"
 ev9.98.0.a:0 "Мои руки... что со мной происходит!"
 ev9.98.0.b:0 "Я вижу... как-то иначе."
 ev9.98.0.c:0 "Мне не нужны твои дары, я отвергаю их!"
 ev9.99.desc:0 "Сон закончился, вы просыпаетесь и шатко поднимаетесь. Вы чувствуете себя как-то иначе, что-то изменилось."
 ev9.99.0.a:0 "Это был не сон!"
 ev9.99.0.b:0 "Мои глаза!"
 ev9.99.0.c:0 "Это было вдохновляюще."
 magic_claws_modifier:0 "Когти"
 magic_eyes_modifier:0 "Новые глаза"
 trait_source3_character_desc:0 "Раз в несколько столетий рождается исключительно одарённый человек, чудотворец, который интуитивно понимает тонкости магии лучше всех. При правильной подготовке [ROOT.GetCharacter.GetSheHe] способен достичь силы, сравнимой с демоническими принцами или даже младшими богами."
 trait_necromancer_character_desc:0 "Этот [ROOT.GetCharacter.Custom('GetProperWitchDesc')] нашёл способ обмануть смерть, хотя [ROOT.GetCharacter.GetSheHe] заплатил за это высокую цену..."
 abdicate_decision_ct:0 "Отречение бесплатно, так как вы [GetTrait('incapable').GetName( GetNullCharacter )]"
 ultimate_spell_hecate_modifier:0 "$hecate_support_modifier$"

