l_russian:
 # Supernatural 2.38 "The Blue Rose" -- relics and the Seal of Solomon (WORK-ORDER-2.38 §9).
 spn_relic.0050.t:0 "Куда ты её передашь?"
 spn_relic.0050.desc:0 "Ты принадлежишь и храму [spn_order|E], и ковену своего дома. [spn_pp_art.GetName] может уйти в один [spn_reliquary|E] или в другой, но не в оба."
 spn_relic.0050.a:0 "В мой капитул"
 spn_relic.0050.b:0 "В мой ковен"
 spn_relic.0050.c:0 "Пока оставлю себе"

 spn_relic.0100.t:0 "Под перчаткой"
 spn_relic.0100.desc:0 "[spn_gl_asker.GetTitledFirstName] надевает чёрную перчатку и кладёт [spn_gl_asker.GetHerHis] руку тебе на грудь. Жжёт, как клеймо.\n\n"Пока я ношу это, ты не соврёшь мне без того, чтобы обжечься. Говори.""
 spn_relic.0100.a:0 "Я скажу тебе правду"
 spn_relic.0100.a_nothing:0 "Тебе больше нечего сказать."
 spn_relic.0100.b:0 "Я совру"
 spn_relic.0100.c:0 "Вытерпеть"
 spn_relic_toast_glove_word:0 "Обожжён(а) под перчаткой"

 spn_relic.0200.t:0 "Вызвать мёртвых"
 spn_relic.0200.desc:0 "Ты поворачиваешь диск Некрофона. Сквозь шипение отвечает голос. Он принадлежит тому, кто мёртв уже давно.\n\n"Спрашивай. Быстро.""
 spn_relic.0200.desc_cracking:0 "\n\nВ стекле трещина, которой ты прежде не видел(а). Второго вызова оно не выдержит."
 spn_relic.0200.a:0 "Где страница Книги?"
 spn_relic.0200.a_tt:0 "Мёртвый называет того, кто держит страницу [spn_vade_maecum|E]. Ты будешь помнить, кто это, десять лет."
 spn_relic.0200.b:0 "Где потерянная шкура?"
 spn_relic.0200.b_tt:0 ""Она спит. Она проснётся примерно через [ROOT.Char.MakeScope.Var('spn_nc_wake').GetValue|0] лет.""
 spn_relic.0200.c:0 "Где Печать Соломона?"
 spn_relic.0200.c_tt:0 "Мёртвый говорит, где теперь покоится [spn_seal_of_solomon|E]. Ты будешь помнить десять лет."
 spn_relic.0200.d:0 "Положить трубку"
 spn_relic_necrophone_cracks_tt:0 "Некрофон трескается и пропадает."

 spn_relic.0400.t:0 "Вещь поменьше"
 spn_relic.0400.desc:0 "На дне сундука, который не открывали сотню лет, под тряпьём ты находишь кое-что, всё ещё тёплое на ощупь.\n\nЭто не один из великих артефактов. Это [spn_relic|E], и он всё ещё работает."
 spn_relic.0400.a:0 "Теперь мой"

 spn_relic.0600.t:0 "Кольцо под алтарём"
 spn_relic.0600.desc:0 "Храм в руках твоих солдат. Под алтарём [spn_seal_siege_county.GetName], в свинцовой шкатулке, лежит латунное кольцо с вырезанной на нём шестиконечной печатью.\n\nЭто [spn_seal_of_solomon|E]. Жрецы смотрят на тебя."
 spn_relic.0600.a:0 "Забрать"
 spn_relic.0600.b:0 "Оставить жрецам"

 spn_relic.0610.t:0 "Кольцо в святилище"
 spn_relic.0610.desc:0 "Ты пришёл(шла) как паломник, но знаешь, что здесь хранят. [spn_seal_of_solomon|E] стоит за решёткой в святилище [spn_seal_pilgrim_county.GetName], а стража наполовину спит."
 spn_relic.0610.a:0 "Забрать"
 spn_relic.0610.a_tt:0 "Чем лучше твоя [intrigue|E], тем больше шансов выйти с ней. Попадёшься — правитель этих мест этого не забудет."
 spn_relic.0610.b:0 "Я пришёл(шла) молиться"
 spn_relic_toast_seal_taken:0 "Печать Соломона у тебя"
 spn_relic_toast_seal_caught:0 "Пойман(а) в святилище"