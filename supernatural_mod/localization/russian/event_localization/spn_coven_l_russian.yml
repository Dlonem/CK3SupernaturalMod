 # Supernatural 2.38 "The Blue Rose" -- covens (WORK-ORDER-2.38 §7, §16.1).
 spn_coven.0001.t:0 "Ваш ковен"
 spn_coven.0001.desc:0 "Ваш дом теперь ковен. Ведьмы вашей крови знают друг друга и будут держаться вместе.\n\nКто в него входит и что они обещали — видно в разделе «Обстоятельства»."
 spn_coven.0001.desc_owner:0 "Ваш дом теперь ковен, и вы его возглавляете. Ведьмы вашей крови подчиняются вам.\n\nКто в него входит и что они обещали — видно в разделе «Обстоятельства»."
 spn_coven.0001.a:0 "Вместе мы сильнее"

 spn_coven.0010.t:0 "Сёстры спрашивают, кто вы"
 spn_coven.0010.desc:0 "[spn_sa_owner.GetTitledFirstName] заметил(а), что вас нет дома по ночам. [spn_sa_owner.GetSheHe|U] спрашивает при остальных, куда вы уходите.\n\nКовен не хранит тайн от себя. [spn_order|E] не хранит ничего, кроме тайн."
 spn_coven.0010.a:0 "Рассказать им об Ордене"
 spn_coven.0010.b:0 "Солгать своим"
 spn_coven_lie_tt:0 "Чем лучше ваша [intrigue|E], тем вероятнее они поверят. Если не поверят — они всё равно узнают, и не забудут, что вы солгали."
