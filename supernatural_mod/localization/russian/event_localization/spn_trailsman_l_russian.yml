l_russian:

 # Supernatural 2.36 -- the Trailsman
 #################################################

 spn_trailsman_court_position:0 "Следопыт"
 spn_trailsman_court_position_desc:0 "$spn_trailsman_court_position$ ходит по твоим графствам и читает то, что в них оставлено. Тела, найденные на краю деревни; стада, взятые так, как их не берёт волк; дорога, которой никто не пользуется после темноты, — он идёт и смотрит, а потом возвращается и говорит тебе, где. Хороший возвращается с именем."
 spn_trailsman_camp_officer:0 "Следопыт"
 spn_trailsman_camp_officer_desc:0 "$spn_trailsman_camp_officer$ идёт впереди лагеря и читает землю, на которой вы будете спать. У него нет земель, чтобы их обходить, и нет священника, чтобы расспросить, — только графство, в котором вы стоите, и соседние, а этого обычно довольно: тварь, что кормилась, прячется плохо."

 spn_trailsman_aptitude_hunter:0 "#D Уже травил(а) такую#!"
 spn_trailsman_aptitude_witch_hunter:0 "#D Травил(а) ведьм#!"
 spn_trailsman_aptitude_lifestyle_hunter:0 "#D Охотник#!"
 spn_trailsman_aptitude_patient:0 "#D Терпеливого нрава#!"
 spn_trailsman_aptitude_athletic:0 "#D Атлетичного склада#!"
 spn_trailsman_aptitude_creature:0 "#D И сам(а) из них#!"

 spn_trailsman_task_read_the_countryside:0 "Читать округу"
 spn_trailsman_task_read_the_countryside_desc:0 "Твой $spn_trailsman_court_position$ ходит по земле в поисках [spn_menace|E], о котором тебе ещё не донесли. Твои священники напишут тебе только после того, как графство потеряет трёх человек; он приходит раньше."
 spn_trailsman_task_read_the_countryside_tt:0 "Каждый год твой $spn_trailsman_court_position$ может найти графство, несущее [spn_menace|E], и сказать тебе, какое именно.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_follow_the_trail:0 "Идти по следу"
 spn_trailsman_task_follow_the_trail_desc:0 "Твой $spn_trailsman_court_position$ перестаёт искать места и начинает искать то, что их оставило. Медленнее, дороже — и единственный способ дать [spn_menace|E] лицо, если не считать собственной охоты."
 spn_trailsman_task_follow_the_trail_tt:0 "Каждый год твой $spn_trailsman_court_position$ может назвать тварь, что стоит за [spn_menace|E] в твоих землях, и открыть тебе её тайну.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_beat_the_bounds:0 "Обход рубежей"
 spn_trailsman_task_beat_the_bounds_desc:0 "Твой $spn_trailsman_court_position$ перестаёт охотиться и начинает обходить. Дороги под присмотром, леса пройдены, деревни успокаиваются — а в год, когда снаружи никого нет, это стоит больше любого донесения."
 spn_trailsman_task_beat_the_bounds_tt:0 "Твои графства получают [county_opinion|E] и быстрее восстанавливают [county_control|E]. Ничего не находит.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_generic_tt:0 "Как часто он преуспевает, зависит от его [aptitude|E]."

 #################################################
 # Word from the Trailsman
 #################################################
 spn_hunt.0400.t:0 "Слово от следопыта"
 spn_hunt.0400.desc:0 "[spn_trailsman.GetTitledFirstName] пропадал(а) одиннадцать дней и возвращается по колено в грязи. Не садится. "Графство [spn_menace_county.GetName], — говорит [spn_trailsman.GetTitledFirstName]. — Они теряли людей. Сколько — не говорят, и за последний дом после темноты не выходят." Ждёт, потому что знает, что ты спросишь, а потом говорит, что не знает, что это, — только что там что-то есть и оно не закончило."
 spn_hunt.0400.desc_vampire:0 "[spn_trailsman.GetTitledFirstName] пропадал(а) одиннадцать дней и возвращается по колено в грязи. Не садится. "Графство [spn_menace_county.GetName], — говорит [spn_trailsman.GetTitledFirstName]. — Двоих нашли у опушки, одного в собственном дворе. Ни в одном не было крови, и на земле её тоже не было." Он не знает, что это значит. Ты знаешь. Оно там кормится и следит за тем, где оставляет тела."
 spn_hunt.0400.desc_werewolf:0 "[spn_trailsman.GetTitledFirstName] пропадал(а) одиннадцать дней и возвращается по колено в грязи. Не садится. "Графство [spn_menace_county.GetName], — говорит [spn_trailsman.GetTitledFirstName]. — Овцы ушли из закрытого загона. Человек разорван на дороге и не съеден." Он называет это плохой зимой для волков. Ты видел(а), что волк делает с загоном, и это выглядит не так."
 spn_hunt.0400.a:0 "Значит, оно там"
 spn_hunt.0400.a.tt:0 "Графство [spn_menace_county.GetName] несёт [spn_menace|E]. Теперь ты знаешь, где искать."
 spn_hunt.0400.b:0 "Тогда я поеду и посмотрю сам(а)"
 spn_hunt.0400.b.tt:0 "Пока след тёплый, в графстве [spn_menace_county.GetName] доступна $supernatural_hunt$."
 spn_hunt.0400.c:0 "Ему платят за ходьбу. Пусть ходит"
 spn_hunt.0400.c.tt:0 "Ничего не делается. Графство [spn_menace_county.GetName] продолжит терять [county_control|E], пока тварь не угомонится."

 #################################################
 # A Name for the Trail
 #################################################
 spn_hunt.0401.t:0 "Имя для следа"
 spn_hunt.0401.desc:0 "[spn_trailsman.GetTitledFirstName] идёт(шла) по нему с самой оттепели. Он не говорит, где был(а). Он говорит, что смерти в графстве [spn_menace_county.GetName] прекращаются, когда один человек уезжает, и начинаются снова, когда он возвращается, — и что он наблюдал(а) достаточно долго, чтобы в этом убедиться. Потом называет имя: [spn_menace_culprit.GetTitledFirstName]."
 spn_hunt.0401.desc_vampire:0 "[spn_trailsman.GetTitledFirstName] идёт(шла) по нему с самой оттепели. "Их всегда находят поутру, — говорит [spn_trailsman.GetTitledFirstName], — и всегда на расстоянии ночного перехода от того места, где ночует [spn_menace_culprit.GetTitledFirstName]." Он считал(а) это четырежды. Ни разу он не видел(а), чтобы [spn_menace_culprit.GetTitledFirstName] ел(а) за общим столом. Ему страшно, и правильно."
 spn_hunt.0401.desc_werewolf:0 "[spn_trailsman.GetTitledFirstName] идёт(шла) по нему с самой оттепели. "Убийства идут по луне, — говорит [spn_trailsman.GetTitledFirstName], — и [spn_menace_culprit.GetTitledFirstName] тоже. Три ночи нет, на четвёртую возвращается, и ни слова о том, где был(а)." Он нашёл(нашла) отпечаток у загона в графстве [spn_menace_county.GetName] и описывать его не станет. И не нужно."
 spn_hunt.0401.a:0 "Теперь я знаю его в лицо"
 spn_hunt.0401.a.tt:0 "Ты узнаёшь тайну [spn_menace_culprit.GetTitledFirstName]. Заключение, казнь и [supernatural_hunt|E] отныне тебе доступны."
 spn_hunt.0401.b:0 "Молчать — пусть думает, что его не видят"
 spn_hunt.0401.b.tt:0 "Ты узнаёшь тайну [spn_menace_culprit.GetTitledFirstName] и держишь её при себе. Знать, что ходит по твоим землям, и ничего с этим не делать — тоже род славы."
 