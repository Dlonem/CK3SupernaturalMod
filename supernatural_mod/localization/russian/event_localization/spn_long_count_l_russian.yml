l_russian:
 ############################################################
 # Supernatural 2.35 -- The Long Count. English.
 # Milestones on how long a creature has been what it is.
 ############################################################

 spn_long_count_perk_point_tt:0 "#high Очко перка#! в вашем собственном древе"
 spn_long_count_perk_points_tt:0 "#high Два очка перков#! в вашем собственном древе"
 spn_long_count_kept_opinion:0 "Всё ещё здесь, после всего этого"

 spn_long_count.0001.t:0 "Сто лет"
 spn_long_count.0001.desc:0 "Ты понял(а) это на дороге, по которой ходил(а) сотню раз, — и из-за чего-то, что не имело значения.\n\nВек. Ребёнок, что держал твоего коня в ту неделю, умер шестьдесят лет назад, как и его собственный ребёнок. Город, который ты помнишь, зовётся иначе, и река сдвинулась.\n\nТы не считал(а). Вот что тебя останавливает: ты не считал(а), а оно всё равно прошло."
 spn_long_count.0001.desc_wolf:0 "Ты понял(а) это на дороге, по которой ходил(а) сотню раз, — и из-за чего-то, что не имело значения.\n\nВек лун. Ребёнок, что держал твоего коня в ту неделю, умер шестьдесят лет назад, как и его собственный ребёнок. Ты хоронил(а) людей, родившихся много позже того, как ты перестал(а) умирать от чего-либо обыкновенного.\n\nВолк не считает. Ты тоже не считал(а) — до сих пор."
 spn_long_count.0001.desc_both:0 "Ты понял(а) это на дороге, по которой ходил(а) сотню раз, — и из-за чего-то, что не имело значения.\n\nВек, и обоим в тебе хватило. Больше ни в чём они никогда не сходились. Город, который ты помнишь, зовётся иначе, и река сдвинулась, и каждый его год уходил в твои руки — смотрел(а) ты или нет.\n\nТы не считал(а). А оно всё равно прошло."
 spn_long_count.0001.a:0 "Оценить, что есть."
 spn_long_count.0001.b:0 "Посчитать, чего это стоило."

 spn_long_count.0002.t:0 "Двести лет"
 spn_long_count.0002.desc:0 "Двести — и ты замечаешь это так же, как замечаешь погоду.\n\nНе осталось никого, кто мог бы рассказать тебе о тебе такое, чего ты сам(а) не рассказал(а) ему первым. Семьи, которые ты знал(а), истончились до имён на стенах. Дважды ты возвращался(лась) туда, где что-то было, и не находил(а) его; однажды — находил(а), но не то.\n\nЧто у тебя есть вместо этого — навык. В мире осталось очень мало такого, что может застать твои руки врасплох."
 spn_long_count.0002.desc_wolf:0 "Двести — и ты замечаешь это так же, как замечаешь погоду.\n\nСемьи, которые ты знал(а), истончились до имён на стенах. Дважды ты возвращался(лась) туда, где что-то было, и не находил(а) его; однажды — находил(а), но не то. Ничто, что тебя травит, не травило тебя дважды.\n\nЧто у тебя есть вместо этого — навык. В мире осталось очень мало такого, что может застать твои руки врасплох."
 spn_long_count.0002.a:0 "Один из нас всё ещё помнит начало."
 spn_long_count.0002.b:0 "Не осталось никого, кто мог бы мне возразить."

 spn_long_count.0003.t:0 "Триста лет"
 spn_long_count.0003.desc:0 "Триста лет — и арифметика перестала что-либо значить.\n\nНикто из живых не видел, как ты пришёл(шла). Никто из живых не слышал об этом от того, кто видел. То, чем ты был(а) прежде, теперь история, и ты — единственный, кто её ещё рассказывает, а значит, она такая, какой ты её назовёшь.\n\nЭто должно бы освобождать. В большинство ночей так и есть."
 spn_long_count.0003.a:0 "Каким я его назову."
