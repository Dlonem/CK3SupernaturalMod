l_russian:
 # Supernatural 2.38 "The Blue Rose" -- Zecchia, a minor demon who steals for a fee (WORK-ORDER-2.38 §11).
 spn_zecchia.0001.t:0 "Воровка откликается"
 spn_zecchia.0001.desc:0 "Круг вспыхивает, и из него выходит женщина, смахивая пепел с рукавов. Она оглядывает твою комнату так, будто прикидывает ей цену.\n\n"Я Зеккия. Я беру вещи. Меня вызвали — значит, что-то надо унести.""
 spn_zecchia.0001.desc_seal:0 "\n\nЕё взгляд падает на кольцо у тебя на руке и остаётся там. "Хорошее кольцо", — говорит она и отступает на шаг."
 spn_zecchia.0001.a:0 "Называй цену"
 spn_zecchia.0001.b:0 "Уходи туда, откуда пришла"

 spn_zecchia.0005.t:0 "Имя на полях"
 spn_zecchia.0005.desc:0 "Кто-то написал на полях гримуара мелким, аккуратным почерком: имя и то, как её вызвать.\n\n"Зеккия. Она берёт вещи. Плати ей столько, сколько она просит.""
 spn_zecchia.0005.a:0 "Я это запомню"

 spn_zecchia.0010.t:0 "Сколько ты возьмёшь?"
 spn_zecchia.0010.desc:0 "Зеккия садится на край твоего стола. "Одну вещь или пять. Чем больше хочешь, тем больше платишь. Сотня золота за каждую вещь сейчас и больше, если то, что я принесу, будет хорошим.""
 spn_zecchia.0010.price_wine:0 "\n\n"И после я хочу выпить с тобой. Долго.""
 spn_zecchia.0010.price_cloak:0 "\n\n"И я хочу что-нибудь твоё. То, что тебе нравится.""
 spn_zecchia.0010.price_hair:0 "\n\n"И я хочу прядь твоих волос." Она улыбается. "Не спрашивай.""
 spn_zecchia.0010.desc_seal:0 "\n\nОна то и дело поглядывает на твоё кольцо."
 spn_zecchia.0010.desc_seal_told:0 "\n\n"Кое-что бесплатно. Есть одно кольцо, к которому я близко не подойду. Решила, что тебе стоит знать, чего я боюсь.""
 spn_zecchia.0010.desc_council:0 "\n\n[spn_gnostic_council|E] оплатит её счёт."
 spn_zecchia.0010.a:0 "Одну вещь"
 spn_zecchia.0010.b:0 "Две вещи"
 spn_zecchia.0010.c:0 "Три вещи"
 spn_zecchia.0010.d:0 "Четыре вещи"
 spn_zecchia.0010.e:0 "Пять вещей"
 spn_zecchia.0010.f:0 "Совет заплатит"
 spn_zecchia.0010.g:0 "Кто нанял тебя против меня?"
 spn_zecchia.0010.h:0 "Забудь"
 spn_zecchia_job_tt:0 "Отправить её за чьими-нибудь сокровищами через действие «Отправить Зеккию за их сокровищами». Она вернётся через девяносто дней."

 spn_zecchia.0020.t:0 "Зеккия доставляет"
 spn_zecchia.0020.desc:0 "Зеккия швыряет мешок на твой стол и забирает свою плату. "[spn_zd_target.GetFirstName] не хватится их день-другой.""
 spn_zecchia.0020.desc_council:0 "\n\nЗа неё заплатила казна [spn_gnostic_council|E]."
 spn_zecchia.0020.a:0 "Хорошая работа"

 spn_zecchia.0030.t:0 "Зеккия начинает скучать"
 spn_zecchia.0030.desc:0 "Зеккия три месяца лежит на твоей постели и ест твою еду. "Мне до сих пор не сказали, чей дом обчистить. Мне становится скучно.""
 spn_zecchia.0030.a:0 "Сейчас назову"
 spn_zecchia.0030.b:0 "Забудь"
 spn_zecchia.0030.c:0 "Я хочу больше, чем мы условились"
 spn_zecchia.0030.c_tt:0 "Вместо этого она берёт у тебя что хочет — и уходит."
 spn_zecchia.0030.c_seal_tt:0 "Она смотрит на твоё кольцо, усмехается и соглашается."

 spn_zecchia.0040.t:0 "Книга учёта не лжёт"
 spn_zecchia.0040.desc:0 "В книге учёта канцлера значится платёж из казны [spn_gnostic_council|E] кому-то без имени. За ним стоит [spn_zd_hirer.GetTitledFirstName], и эти деньги заплатили демону за воровство."
 spn_zecchia.0040.a:0 "Занять [spn_zd_hirer.GetHerHis] место"
 spn_zecchia.0040.b:0 "Я это запомню"
 spn_zecchia.0040.c:0 "Оставить как есть"
 spn_zecchia.0030.c_seal_leave_tt:0 "Она снова смотрит на твоё кольцо, пожимает плечами и уходит туда, откуда пришла, ни с чем."
