 spn_hunt_tag_compelled:0 "#negative_value - Здесь никто не помнит#! (Свидетели)\n"
 spn_hunt_tag_no_one_comes:0 "#negative_value -- Ни один охотник за это не возьмётся#! (Репутация)\n"
 # The ride
 spn_hunt_tag_ride_very_short:0 "#positive_value +++ Совсем близко#! (Дорога)\n"
 spn_hunt_tag_ride_short:0 "#positive_value ++ Близко#! (Дорога)\n"
 spn_hunt_tag_ride_long:0 "#negative_value - Далеко#! (Дорога)\n"
 spn_hunt_tag_ride_very_long:0 "#negative_value -- Очень далеко#! (Дорога)\n"

 # The bar
 spn_hunt_success_bar:0 "Выслеживание"
 spn_hunt_success_pct:0 "[Activity.MakeScope.Var('spn_hunt_success_chance').GetValue|0]%"
 spn_hunt_chance_change_tt:0 "Это сдвигает твой шанс найти тварь."
 spn_hunt_sc_track:0 "Твой $trait_track_monster_hunting$"
 spn_hunt_sc_guests:0 "Охотники, что едут с тобой"
 spn_hunt_sc_guides:0 "Местные проводники"
 spn_hunt_sc_approach:0 "Твой подход"
 spn_hunt_sc_known:0 "Ты знаешь, что это за тварь"
 spn_hunt_sc_culprit_track:0 "Сила твари"
 spn_hunt_sc_gone:0 "След остыл"
 spn_hunt_sc_silence:0 "Графство, что помнит слишком мало"
 spn_hunt_sc_renown:0 "Имя, которое графство уже знает"
 spn_hunt_sc_legend:0 "Имя, которое графство не произносит"
 spn_hunt_sc_partner:0 "Местный охотник едет с тобой"
 spn_hunt_sc_events:0 "То, что ты узнал(а)"

 # Duels
 spn_hunt_ledger_duel:0 "Найти убийцу"
 spn_hunt_press_duel:0 "Надавить на выжившего"
 spn_hunt_lead_duel:0 "Взвесить названное имя"
 spn_hunt_lead_duel_success_tt:0 "Ты видишь названное имя насквозь"
 spn_hunt_lead_duel_failure_tt:0 "Ты принимаешь названное имя на веру"
 spn_hunt_hide_duel:0 "Залечь на дно"
 spn_hunt_fight_duel:0 "Бой"
 spn_hunt_fight_defender_wins_tt:0 "Тварь побеждает"
 spn_hunt_fight_hunter_wins_tt:0 "Охотник побеждает"
 spn_hunt_list_duel:0 "Читать список"
 spn_hunt_counting_duel:0 "Счесть, что есть в этом графстве"
 spn_compel_investigate_duel:0 "Спросить город, что он делал прошлой зимой"

 # --- Modifiers ---
 spn_menace_modifier:0 "Здесь что-то охотится"
 spn_menace_modifier_desc:0 "Найдены тела. Правитель, который смотрит внимательно, может узнать почему, а охотник, знающий своё ремесло, — что."
 spn_hunt_mob_justice_modifier:0 "Толпа сделала своё"
 spn_hunt_mob_justice_modifier_desc:0 "Охотник позволил людям графства взять невиновного. Они помнят, кто из них это был."
 spn_gone_to_ground_modifier:0 "Залег(ла) на дно"
 spn_gone_to_ground_modifier_desc:0 "Приходил охотник с расспросами. Ты в другом месте, пока не станет безопасно кормиться снова."
 spn_compelled_modifier:0 "Здесь никто не помнит"
 spn_compelled_modifier_desc:0 "Слишком много людей здесь уверены, что ничего не было. Ни один из них не может сказать, что делал на той неделе, и ни один не находит в этом ничего странного."
 spn_hunter_recovering_modifier:0 "Оправился(лась) от охоты"
 spn_hunter_recovering_modifier_desc:0 "Ты отступил(а) из боя, который проигрывал(а). Новой охоты не будет, пока раны не закроются."
 spn_on_the_payroll_modifier:0 "На содержании"
 spn_on_the_payroll_modifier_desc:0 "Тварь платит тебе, чтобы ты смотрел(а) в другую сторону. Она же держит твоё слово."

 # --- Opinions ---
 spn_slew_the_menace_opinion:0 "Прекратил(а) то, что охотилось на моих людей"
 spn_false_witness_opinion:0 "Дал(а) мне имя, которое никуда не вело"
 spn_named_to_the_hunter_opinion:0 "Назвал(а) моё имя охотнику"
 spn_hunter_wrong_door_opinion:0 "Выволок невиновного из его дома"
 spn_rode_together_opinion:0 "Мы работали в одном графстве и не сделали из этого ссору"
 spn_warned_off_opinion:0 "Велел(а) мне искать свой след"
 spn_careful_witch_hunter_opinion:0 "Спрашивал, прежде чем жечь"
 
 # --- Memories ---
 spn_slew_the_beast_memory:0 "прикончил(а) тварь"
 spn_bested_the_hunter_memory:0 "одолел(а) охотника"
 spn_lost_the_thread_memory:0 "потерял(а) след"
 spn_progeny_slain_by_hunter_memory:0 "потерял(а) своё создание от руки охотника"
 spn_took_the_vampires_coin_memory:0 "взял(а) монету твари"
 spn_slew_the_beast_memory_desc:0 "прикончил(а) тварь по имени [creature.GetFirstName], что охотилась на графство"
 spn_slew_the_beast_memory_desc_second_perspective:0 "прикончил(а) тварь по имени [creature.GetFirstName], что охотилась на графство"
 spn_slew_the_beast_memory_desc_third_perspective:0 "прикончил(а) тварь по имени [creature.GetFirstName], что охотилась на графство"
 spn_bested_the_hunter_memory_desc:0 "одолел(а) охотника по имени [hunter.GetFirstName], что пришёл по мою душу, и дал(а) уползти"
 spn_bested_the_hunter_memory_desc_second_perspective:0 "одолел(а) охотника по имени [hunter.GetFirstName], что пришёл по твою душу, и дал(а) уползти"
 spn_bested_the_hunter_memory_desc_third_perspective:0 "одолел(а) охотника по имени [hunter.GetFirstName], что пришёл по его душу, и дал(а) уползти"
 spn_lost_the_thread_memory_desc:0 "проследил(а) след до двери, которой не помню, и поехал(а) домой"
 spn_lost_the_thread_memory_desc_second_perspective:0 "проследил(а) след до двери, которой не помнишь, и поехал(а) домой"
 spn_lost_the_thread_memory_desc_third_perspective:0 "проследил(а) след до двери, которой [owner.GetSheHe] не помнит, и поехал(а) домой"
 spn_progeny_slain_by_hunter_memory_desc:0 "потерял(а) своё создание по имени [progeny.GetFirstName] от руки охотника по имени [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_second_perspective:0 "потерял(а) твоё создание по имени [progeny.GetFirstName] от руки охотника по имени [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_third_perspective:0 "потерял(а) [owner.GetHerHis] создание по имени [progeny.GetFirstName] от руки охотника по имени [hunter.GetFirstName]"
 spn_took_the_vampires_coin_memory_desc:0 "взял(а) золото твари по имени [creature.GetFirstName] и уехал(а) домой, не докончив охоту"
 spn_took_the_vampires_coin_memory_desc_second_perspective:0 "взял(а) золото твари по имени [creature.GetFirstName] и уехал(а) домой, не докончив охоту"
 spn_took_the_vampires_coin_memory_desc_third_perspective:0 "взял(а) золото твари по имени [creature.GetFirstName] и уехал(а) домой, не докончив охоту"

 # --- The contract (D9) ---
 laamp_hunter_1001_contract:0 "Напасть: [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName]"
 laamp_hunter_1001_desc_title:0 "$laamp_hunter_1001_contract$"
 laamp_hunter_1001_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] хоронит людей одного за другим. В графстве [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName] завёлся хищник, и правитель хочет, чтобы его нашли и покончили с ним — руками того, кто знает, как это делается."
 laamp_hunter_1001_request:0 "Этот [task_contract|E] платит охотнику за то, чтобы тот провёл [supernatural_hunt|E] в графстве [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName] и убил тварь, что там охотится. Пока контракт держится, охота ничего не стоит. Платят, когда тварь мертва."

 # ============================================================
 # EVENTS
 # ============================================================

 # Something Stalks [county]
 spn_hunt.0001.t:0 "Что-то охотится в графстве [spn_menace_county.GetName]"
 spn_hunt.0001.desc:0 "Священник в графстве [spn_menace_county.GetName] не скажет, что убивает людей, — только что убивает. Трижды тела приносили ему (бледные или разорванные, он не говорит, какие), и графство начало запирать двери в сумерках. Что бы это ни было, оно ещё не закончило."
 spn_hunt.0001.desc_vampire:0 "Священник в графстве [spn_menace_county.GetName] не скажет, что убивает людей. И не нужно. Три тела, все обескровлены, все найдены на краю городка после ночи, которую никто толком не помнит. Ты такое уже травил(а). Графство начало запирать двери в сумерках, и правильно делает."
 spn_hunt.0001.desc_werewolf:0 "Священник в графстве [spn_menace_county.GetName] не скажет, что убивает людей. И не нужно. Три тела, разорванных так, как не рвёт ни один волк, и скот пропадает с пастбищ так, как не берёт его ни один волк. Ты такое уже травил(а). Графство начало запирать двери в сумерках, и правильно делает."
 spn_hunt.0001.a:0 "Я займусь этим сам(а)."
 spn_hunt.0001.b:0 "Поручить это моему шпионмейстеру."
 spn_hunt.0001.c:0 "Назначить награду."
 spn_hunt.0001.c.tt:0 "В графстве [spn_menace_county.GetName] выставлен контракт на охотника. Взять его может искатель приключений с этим ремеслом; охота там для него бесплатна, а платят ему, когда тварь мертва."
 spn_hunt.0001.d:0 "Суеверия и невезение."
 spn_hunt.0001.d.tt:0 "Ничего не делается. Графство продолжит терять [county_control|E], пока тварь не угомонится."

 # The Ledger of the Dead
 spn_hunt.0002.t:0 "Книга мёртвых"
 spn_hunt.0002.desc:0 "У тебя есть список священника, список управляющего и список могильщика. Кто умер, где его нашли, кто видел его последним. Где-то в этих трёх книгах есть имя, что слишком часто стоит рядом с мёртвыми и ни разу не стоит среди них."
 spn_hunt.0002.a:0 "Перечитать их."
 spn_hunt.0002.success_tt:0 "Ты находишь имя"
 spn_hunt.0002.failure_tt:0 "След остывает"
 spn_hunt.0002.known_tt:0 "Все уже знают, что такое [spn_menace_culprit.GetTitledFirstName]. Книги лишь подтверждают, кто был голоден."
 spn_hunt.0002.cold_tt:0 "Имена никуда не ведут. Графство хранит своих мёртвых и свою тайну."

 # The Spymaster's Report
 spn_hunt.0003.t:0 "Донесение шпионмейстера"
 spn_hunt.0003.desc:0 "[spn_spymaster.GetTitledFirstName] провёл(провела) месяц в графстве [spn_menace_county.GetName], задавая вопросы, которые звучат как другие вопросы. Донесение короткое. Либо в нём есть имя, либо в нём объяснено, почему его нет."
 spn_hunt.0003.a:0 "Ну?"
 spn_hunt.0003.success_tt:0 "[spn_spymaster.GetFirstName] нашёл(нашла) имя"
 spn_hunt.0003.failure_tt:0 "[spn_spymaster.GetFirstName] не нашёл(нашла) ничего"

 # A Bounty Posted
 spn_hunt.0004.t:0 "Награда назначена"
 spn_hunt.0004.desc:0 "Контракт на охотника выставлен в графстве [spn_menace_county.GetName]. Если искатель приключений с этим ремеслом возьмётся, охота там для него бесплатна, а платят ему, когда тварь мертва."

 # A Lord's Coin
 spn_hunt.0010.t:0 "Монета правителя"
 spn_hunt.0010.desc:0 "[spn_contract_employer.GetTitledFirstName] не хочет знать, что ты делаешь и как. [spn_contract_employer.GetSheHe|U] хочет, чтобы в графстве [spn_contract_county.GetName] перестали хоронить, и заплатит, когда это случится. Охота там ничего тебе не стоит, пока бумага в силе."
 spn_hunt.0010.a:0 "Считай, сделано."
 spn_hunt.0010.a.tt:0 "Проведи [supernatural_hunt|E] в графстве [spn_contract_county.GetName]. По контракту заплатят, когда тварь, что там охотится, будет мертва."

 # Whispers of a Hunter
 spn_hunt.0020.t:0 "Слухи об охотнике"
 spn_hunt.0020.desc:0 "Чужак ставит выпивку в графстве [spn_hunt_county.GetName] и расспрашивает о мёртвых. Не так, как расспрашивает скорбящий родственник. Так расспрашивает тот, кто уже знает ответ и хочет узнать адрес.\n\nТы был(а) осторожен(осторожна). Можно быть осторожнее."
 spn_hunt.0020.a:0 "Буду смотреть в оба."
 spn_hunt.0020.a.tt:0 "Ты предупреждён(а) на полгода: если охотник тебя найдёт, ты встретишь его во всеоружии (#high +10#! ко всем твоим ответам)."
 spn_hunt.0020.b:0 "Пора мне в другое место."
 spn_hunt.0020.b.tt:0 "Ты покидаешь графство. Охота, что придёт за тобой, никого не найдёт, и ты не кормишься год."
 spn_hunt.0020.c:0 "Пусть спрашивает."
 
 # The Trail
 spn_hunt.0100.t:0 "След"
 spn_hunt.0100.desc:0 "Графство [spn_hunt_county.GetName] хоронит людей одного за другим, и люди это знают. Они станут с тобой говорить — как только убедятся, что ты не то, чего они боятся. Чего они тебе не скажут, так это что оно такое. Тела в земле; священник описывает их так, как описывают священники, то есть никак.\n\nТри недели. Потом ты либо узнаешь, либо нет."
 spn_hunt.0100.desc_vampire:0 "Графство [spn_hunt_county.GetName] хоронит людей одного за другим, и люди это знают. Могильщику не нужно описывать тела, чтобы ты понял, кто это сделал: обескровлены, на краю городка, после ночей, которые никто толком не помнит. Вампир. Ты взял(а) то, что взял(а).\n\nТри недели — узнать, кто именно."
 spn_hunt.0100.desc_werewolf:0 "Графство [spn_hunt_county.GetName] хоронит людей одного за другим, и люди это знают. Могильщику не нужно описывать тела, чтобы ты понял, кто это сделал: разорваны так, как не рвёт ни один волк, и стада поредели так, как не редеют от волка. Оборотень. Ты взял(а) то, что взял(а).\n\nТри недели — узнать, кто именно."
 spn_hunt.0100.a:0 "Начать."
 spn_hunt.0100.a.tt:0 "Выслеживание начинается. Каждая тварь в графстве может услышать, что кто-то расспрашивает про охотника."

 # The Survivor
 spn_hunt.0101.t:0 "Выживший"
 spn_hunt.0101.desc:0 "[spn_survivor.GetTitledFirstName] был(а) найден(а) однажды утром в нехорошем конце городка — с головной болью и с рассказом, которому никто не поверил. С тех пор [spn_survivor.GetSheHe] плохо спит. [spn_survivor.GetSheHe|U] помнит лицо — или думает, что помнит."
 spn_hunt.0101.a:0 "Слушать."
 spn_hunt.0101.b:0 "Надавить на [spn_survivor.GetHerHim]."
 spn_hunt.0101.b.success_tt:0 "[spn_survivor.GetFirstName] вспоминает больше, чем хотел(а) бы"
 spn_hunt.0101.b.failure_tt:0 "[spn_survivor.GetFirstName] захлопывает дверь перед тобой"

 # What the Graves Say
 spn_hunt.0102.t:0 "Что говорят могилы"
 spn_hunt.0102.desc_few:0 "Две могилы, свежие. Могильщик выкопал их сам и не присматривался. Охотник присматривается дольше. Мёртвые не были стары и не были больны, а графство перестало спрашивать почему."
 spn_hunt.0102.desc_many:0 "Ряд свежих могил, и место в конце ряда ещё осталось. Могильщик перестал спрашивать кто и начал спрашивать сколько. Что бы это ни делало, оно нашло графство, которое ему подходит."
 spn_hunt.0102.desc_vampire:0 "Могильщик даёт тебе посмотреть. Ты уже видел это: горло, бледность, и кровь, которой должно было быть полно всё вокруг, но её нет. Вампир, и не из торопливых."
 spn_hunt.0102.desc_werewolf:0 "Могильщик даёт тебе посмотреть. Ты уже видел это: раны, каких не оставляет волк, и сила, которая понадобилась, чтобы их сделать. Оборотень, и он не боится, что его найдут."
 spn_hunt.0102.a:0 "Закопать обратно."

 # The Wrong Man
 spn_hunt.0103.t:0 "Не тот человек"
 spn_hunt.0103.desc:0 "Графство решило. [spn_accused.GetTitledFirstName] живёт не по часам, за [spn_accused.GetHerHim] некому заступиться, и его видели рядом с последним телом. Людям с верёвкой этого достаточно. Тебе — нет. В [spn_accused.GetFirstName] нет ничего от того, за чем ты охотишься, но тебя об этом не спрашивают."
 spn_hunt.0103.a:0 "Отпустить [spn_accused.GetHerHim]."
 spn_hunt.0103.a.tt:0 "Ты отправляешь толпу по домам. [spn_accused.GetFirstName] — не то, за чем ты охотишься."
 spn_hunt.0103.b:0 "Пусть толпа возьмёт [spn_accused.GetHerHim]."

 # Lessons in the Dark
 spn_hunt.0104.t:0 "Уроки в темноте"
 spn_hunt.0104.desc:0 "[spn_apprentice.GetFirstName] смотрит, как ты работаешь: какие задаёшь вопросы, какие ответы пропускаешь мимо ушей, на что глядишь в ране. Этому обучение научить не могло — для этого нужно графство, которое и вправду боится."
 spn_hunt.0104.a:0 "Смотри. Потом сделаешь сам(а)."

 # A Fellow Hunter's Tale
 spn_hunt.0105.t:0 "Рассказ другого охотника"
 spn_hunt.0105.desc:0 "За второй чаркой [spn_fellow.GetFirstName] рассказывает тебе про такое же графство, много лет назад, и про то, чем оно оказалось. Не то же самое, но пряталось оно так же, и нашли его так же."
 spn_hunt.0105.a:0 "Это помогает."

 # A Word with [name]
 spn_hunt.0106.t:0 "Разговор: [spn_informer.GetFirstName]"
 spn_hunt.0106.desc:0 "Все в графстве [spn_hunt_county.GetName] знают, кто такой [spn_informer.GetTitledFirstName], и никто ничего с этим не сделал, а это кое-что говорит о [spn_informer.GetHerHim]. [spn_informer.GetSheHe|U] в графстве не единственный(ая) из [spn_informer.GetHerHis] рода, иначе с [spn_informer.GetHerHim] давно бы уже разобрались. [spn_informer.GetSheHe|U] может знать, кто именно. [spn_informer.GetSheHe|U] может быть этим самым кем-то."
 spn_hunt.0106.a:0 "Пойти и спросить."
 spn_hunt.0106.a.tt:0 "[spn_informer.GetFirstName] решит, что тебе сказать: правду, ложь, ничего — или пустит в ход зубы."
 spn_hunt.0106.b:0 "Оставить как есть."

 # A Name That Led Nowhere
 spn_hunt.0107.t:0 "Имя, которое никуда не привело"
 spn_hunt.0107.desc:0 "Имя, которое дал тебе [spn_hunt_informer.GetFirstName], не сходится. Ночи не сходятся. Могилы не сходятся. А когда ты спрашиваешь про [spn_hunt_lead.GetFirstName], графство смотрит на тебя так, будто ты пил(а) не с теми. Пила, да. Настоящий след всё ещё там."
 spn_hunt.0107.a:0 "Обратно к могилам."

 # The Wrong Door
 spn_hunt.0108.t:0 "Не та дверь"
 spn_hunt.0108.desc:0 "Ты пошёл(шла) туда, куда вело имя. [spn_hunt_lead.GetTitledFirstName] был там — испуганный, в крови, и ничем из того, за чем ты охотился: человек, просто человек. И графство видело, как ты выволок(ла) его наружу. То, что убивает людей, всё ещё в графстве [spn_hunt_county.GetName]. Оно уже услышит про эту ночь."
 spn_hunt.0108.a:0 "Мне назвали имя."

 # Cornered
 spn_hunt.0110.t:0 "В углу"
 spn_hunt.0110.desc:0 "След обрывается у двери. Всё, что рассказало тебе графство, сходится между собой, и могилы тоже. То, что за дверью, знает, кто ты, — или узнает в тот миг, как ты постучишь. Как ты войдёшь — последнее решение, которое целиком твоё."
 spn_hunt.0110.desc_known:0 "След обрывается там, где живёт [spn_culprit.GetTitledFirstName]. Ты знал(а), что это [spn_culprit.GetSheHe]; теперь ты знаешь, что это [spn_culprit.GetSheHe]. [spn_culprit.GetSheHe|U] знает, кто ты, — или узнает в тот миг, как ты постучишь. Как ты войдёшь — последнее решение, которое целиком твоё."
 spn_hunt.0110.desc_crowded:0 "След обрывается у двери, и дверь — не главная беда. Ты считал(а) тени, что входили и выходили из этого дома с тех пор, как село солнце, и число тебе разонравилось. То, что за этим деревом, в графстве [spn_hunt_county.GetName], похоже, не одно, а что бы здесь ни было ещё, оно достаточно близко, чтобы услышать крик.\n\nКак ты войдёшь, важнее, чем когда-либо."
 spn_hunt.0110.a:0 "Ударить сейчас."
 spn_hunt.0110.a.tt:0 "Ты входишь таким(ой), какой(ая) есть. Тварь отвечает."
 spn_hunt.0110.b:0 "Дождаться света."
 spn_hunt.0110.b.tt:0 "#positive_value +15 Столкновение#!, если тварь — вампир.\nНичего, если это волк.\nТварь отвечает."
 spn_hunt.0110.c:0 "Привести людей графства."
 spn_hunt.0110.c.tt:0 "#positive_value +10 Столкновение#!\nТварь отвечает."
 spn_hunt.0110.d:0 "Тут и вовсе гнездо. Мне с этим не справиться."
 spn_hunt.0110.d.tt:0 "#negative_value Охота кончается здесь.#!\nТы покидаешь графство с жизнью и почти ни с чем больше. След остаётся где стоял — как, скорее всего, и то, что его оставило."

 # The Trail Goes Cold
 spn_hunt.0111.t:0 "След остывает"
 spn_hunt.0111.desc:0 "Три недели, и графство рассказало тебе всё, что знает, — а знает оно меньше, чем думает. Ночи с твоего приезда были тихими. Это не то же самое, что «кончено». Что бы это ни было, оно научилось ждать."
 spn_hunt.0111.desc_gone:0 "Три недели, и графство рассказало тебе всё, что знает. Тела были настоящие. След настоящий. Но ночи стихли до того, как ты приехал(а), а не после. Что бы это ни сделало, оно кормилось здесь, а спало в другом месте — насколько тут кто-либо может тебе сказать, — и ты потратил(а) три недели на землю, которую оно уже покинуло."
 spn_hunt.0111.a:0 "В другой раз."
 
 # Someone Is Asking Questions
 spn_hunt.0200.t:0 "Кто-то задаёт вопросы"
 spn_hunt.0200.desc:0 "[spn_hunter.GetTitledFirstName] стоит у твоей двери, и [spn_hunter.GetSheHe] пришёл(шла) не спрашивать. Три недели в графстве [spn_hunt_county.GetName] — и у [spn_hunter.GetHerHim] есть твоё имя, твои ночи и кое-что в руках, что покупали не для людей.\n\nУ тебя есть мгновение. Недолгое."
 spn_hunt.0200.desc_forewarned:0 "Ты знал(а). Ты знал(а) уже недели, что чужак ставит выпивку и расспрашивает о мёртвых, и вот [spn_hunter.GetTitledFirstName] у твоей двери — с твоим именем и с кое-чем в руках, что покупали не для людей.\n\nТы к этому готов(а). Это чего-то стоит."
 spn_hunt.0200.desc_caught:0 "Дверь открывается, пока твой рот ещё на запястье.\n\n[spn_hunter.GetTitledFirstName] не кричит, не бежит и не выглядит удивлённым(ой). [spn_hunter.GetSheHe|U] выглядит как тот, кто наконец увидел то, ради чего проделал долгий путь. Объяснять нечего. В этой комнате негде быть.\n\nЧто бы ты ни сделал(а) теперь, ты делаешь это с кровью на себе."
 spn_hunt.0200.a:0 "Пусть входят."
 spn_hunt.0200.a.tt:0 "Бой. Твой $spn_hunt_creature_track_word$ и [prowess|E] против [spn_hunter.GetHerHis] $trait_track_monster_hunting$ и [prowess|E] — и того, что [spn_hunter.GetSheHe] принёс(принесла)."
 spn_hunt.0200.b:0 "Уйти на дно."
 spn_hunt.0200.b.tt:0 "Твоя [intrigue|E] против [spn_hunter.GetHerHis]. Спрячешься: охота найдёт пустой дом, и ты не кормишься два года. Найдут: бой, причём с худших условий."
 spn_hunt.0200.b.hidden_tt:0 "Ты исчезаешь раньше, чем [spn_hunter.GetFirstName] добирается до двери"
 spn_hunt.0200.b.found_tt:0 "[spn_hunter.GetFirstName] находит тебя первым"
 spn_hunt.0200.c:0 "Посмотреть в глаза."
 spn_hunt.0200.c.tt:0 "[spn_hunter.GetFirstName] пришёл(шла) неподготовленным(ой) к тому, что ты такое. Потрать 20 $spn_hunt_creature_track_word$ [trait_level_track_xp|E] и отправь [spn_hunter.GetHerHim] домой так, чтобы не помнил(а) и двери."
 spn_hunt.0200.d:0 "Послать [spn_proxy.GetFirstName]."
 spn_hunt.0200.d.tt:0 "Вместо тебя дверь открывает [spn_proxy.GetTitledFirstName]. Если [spn_proxy.GetSheHe] — игрок, [spn_proxy.GetSheHe] может отказаться."
 spn_hunt.0200.e:0 "Сделать им предложение."
 spn_hunt.0200.e.tt:0 "Пятьдесят [gold|E] сейчас, содержание пять лет и крепкий [hook|E] на [spn_hunter.GetHerHim], если [spn_hunter.GetSheHe] согласится. Если откажется, оскорбление пойдёт в бой."
 spn_hunt.0200.f:0 "Выпустить это."
 spn_hunt.0200.f.tt:0 "Ты перестаёшь её держать. #high Сильнейший ответ, какой у тебя есть#!: обращение стоит [prowess|E] и большего в бою. Каждый охотник у этой двери увидит, что ты такое, и не забудет."

 # Overmatched
 spn_hunt.0210.t:0 "Перевес"
 spn_hunt.0210.desc:0 "Оно сильнее тебя. И не чуть-чуть. Ты на полу, [spn_defender.GetTitledFirstName] стоит над тобой и ещё не закончил(а), а за твоей спиной есть дверь, до которой ты всё ещё можешь добраться."
 spn_hunt.0210.a:0 "Отойти."
 spn_hunt.0210.a.tt:0 "Ты выбираешься. Ранен(а), и новой охоты не будет год."
 spn_hunt.0210.b:0 "Давить дальше."
 spn_hunt.0210.b.tt:0 "Ещё один обмен, при твари на #high +20#!. Проиграешь — не выйдешь."

 # Gone
 spn_hunt.0211.t:0 "Ушло"
 spn_hunt.0211.desc:0 "Дом пуст. Не пуст впопыхах. Пуст по выбору: очаг холоден уже сутки, и не осталось ничего, что сказало бы тебе хоть слово. Оно знало, что ты идёшь, и решило здесь не быть.\n\nЧто бы это ни было, оно осторожно и подумало об этом задолго до тебя. Такое умное не даётся в руки оттого, что его выследили. Графство [spn_hunt_county.GetName] какое-то время будет спать спокойнее. Это всё, что ты получил(а)."
 spn_hunt.0211.a:0 "Оно вернётся."

 # Turned Back
 spn_hunt.0212.t:0 "Повёрнут(а) назад"
 spn_hunt.0212.desc:0 "Ты на дороге из графства [spn_hunt_county.GetName], и ты не помнишь почему. Была дверь. Было лицо. Оно было у тебя, ты уверен(а), что оно было у тебя, — и оно ушло так, как уходят сны, и руки у тебя пусты, и ты едешь домой."
 spn_hunt.0212.a:0 "…что я делал(а)?"

 # Sent in Your Place
 spn_hunt.0220.t:0 "Послан(а) вместо тебя"
 spn_hunt.0220.desc:0 "У двери [spn_culprit.GetTitledFirstName] стоит охотник, и [spn_culprit.GetSheHe] решил(а), что эта дверь — твоя. Это не просьба. И не совсем приказ: [spn_culprit.GetSheHe] тебя создал(а) и напоминает тебе об этом."
 spn_hunt.0220.a:0 "Я открою."
 spn_hunt.0220.a.tt:0 "Бой, где ты стоишь за [spn_culprit.GetFirstName]."
 spn_hunt.0220.b:0 "Открывай сам(а)."
 spn_hunt.0220.b.tt:0 "[spn_culprit.GetFirstName] недоволен(довольна) и должен(должна) встретить охотника одна."

 # The Hunter at Your Door
 spn_hunt.0230.t:0 "Охотник у твоей двери"
 spn_hunt.0230.desc:0 "[spn_hunter.GetTitledFirstName] вежлив(а). Все знают, что ты такое; [spn_hunter.GetSheHe] здесь не из-за этого. [spn_hunter.GetSheHe] здесь из-за могил в графстве [spn_hunt_county.GetName] — и [spn_hunter.GetSheHe] думает, что ты можешь знать, чьи они.\n\nМожет, и знаешь."
 spn_hunt.0230.desc_culprit:0 "[spn_hunter.GetTitledFirstName] вежлив(а). Все знают, что ты такое; [spn_hunter.GetSheHe] здесь не из-за этого. Пока не из-за этого. [spn_hunter.GetSheHe] здесь из-за могил в графстве [spn_hunt_county.GetName] и думает, что ты можешь знать, чьи они.\n\nОни твои. [spn_hunter.GetSheHe|U] этого не знает. Пока."
 spn_hunt.0230.a:0 "Это был(а) [spn_hunt_other.GetFirstName]."
 spn_hunt.0230.a.tt:0 "Ты даёшь охотнику имя другой твари. Если [spn_hunt_other.GetFirstName] оставил(а) след в этом графстве или в соседнем, охотник повернёт к [spn_hunt_other.GetHerHim]. Если нет, хороший охотник со временем это увидит, а плохой — нет."
 spn_hunt.0230.a.toast:0 "Имя"
 spn_hunt.0230.a.toast_tt:0 "[ROOT.Char.GetFirstName] дал(а) тебе имя. Верное ли — покажет след."
 spn_hunt.0230.f:0 "Это был(а) [spn_hunt_false_lead.GetFirstName]."
 spn_hunt.0230.f.tt:0 "Ты даёшь охотнику имя, которое хотел(а) бы увидеть на виселице. [spn_hunt_false_lead.GetFirstName] — не тварь. Хороший охотник со временем это увидит, а плохой выволокет невиновного из дома."
 spn_hunt.0230.f.toast_tt:0 "[ROOT.Char.GetFirstName] дал(а) тебе имя. Верное ли — покажет след."
 spn_hunt.0230.b:0 "Да. Это был(а) [spn_culprit.GetFirstName]."
 spn_hunt.0230.b.tt:0 "Правда. Охотник повернёт к [spn_culprit.GetFirstName], и [spn_culprit.GetFirstName] узнает, кто рассказал."
 spn_hunt.0230.b.toast:0 "Имя"
 spn_hunt.0230.b.toast_tt:0 "[ROOT.Char.GetFirstName] дал(а) тебе имя. След тёплый."
 spn_hunt.0230.c:0 "Я ничего не знаю."
 spn_hunt.0230.c.toast:0 "Ничего"
 spn_hunt.0230.c.toast_tt:0 "[ROOT.Char.GetFirstName] ничего не знает — или говорит так."
 spn_hunt.0230.d:0 "Вон из моего зала."
 spn_hunt.0230.d.tt:0 "Охотник уходит с меньшим, чем пришёл(шла), и с причиной тебя запомнить."
 spn_hunt.0230.d.toast:0 "Дверь"
 spn_hunt.0230.d.toast_tt:0 "[ROOT.Char.GetFirstName] указал(а) тебе на дверь. След остывает."
 spn_hunt.0230.e:0 "Дай покажу тебе, что я такое."
 spn_hunt.0230.e.tt:0 "Бой, здесь и сейчас. Охотник был(а) готова к чему-то; ты ли это — [spn_hunter.GetSheHe] сейчас узнает."
 
 # The Price of Silence
 spn_hunt.0240.t:0 "Цена молчания"
 spn_hunt.0240.desc:0 "[spn_culprit.GetTitledFirstName] не бежит и не дерётся. [spn_culprit.GetSheHe|U] кладёт на стол между вами кошель (пятьдесят золотом и обещание большего каждый месяц) и спрашивает, вполне рассудительно, чего стоят мёртвые графства охотнику, которому надо есть."
 spn_hunt.0240.a:0 "Взять золото."
 spn_hunt.0240.a.tt:0 "Пятьдесят [gold|E] сейчас и содержание пять лет. [spn_culprit.GetFirstName] получает крепкий [hook|E] на тебя. Охота кончается здесь."
 spn_hunt.0240.b:0 "Отказаться."
 spn_hunt.0240.b.tt:0 "[prestige|E], а оскорбление стоит #high +5#! в бою, что за этим последует."

 # Accused
 spn_hunt.0250.t:0 "Обвинён(а)"
 spn_hunt.0250.desc:0 "[spn_hunter.GetTitledFirstName] вошёл(шла) в твою дверь с кое-чем в руках, что покупали не для людей, и пустил(а) это в ход прежде, чем посмотрел(а) на тебя как следует. Ты человек. И кровь у тебя человеческая. [spn_hunter.GetSheHe|U] ушёл(шла) не сказав ни слова, и графство это видело."
 spn_hunt.0250.a:0 "Я ничего не сделал(а)."

 # What the Hunt Was Worth
 spn_hunt.0300.t:0 "Чего стоила охота"
 spn_hunt.0300.desc_slain:0 "Всё кончено. Графство [spn_hunt_county.GetName] похоронит ещё одного, а потом — впервые за долгое время — никого. Люди не знают, что ты сделал(а). Они знают, что ночи стали тихими."
 spn_hunt.0300.desc_proxy_slain:0 "У той двери что-то умерло, но это было не то, за чем ты охотился. Это было то, что послали вместо него. Графство [spn_hunt_county.GetName] стало немного безопаснее. Тварь, что его создала, — нет."
 spn_hunt.0300.desc_fled:0 "Дом был пуст. Графство [spn_hunt_county.GetName] будет спать спокойнее, пока он такой, — а ты знаешь имя того, кто решит, когда это кончится."
 spn_hunt.0300.desc_compelled:0 "Ты поехал(а) домой. И не совсем понимаешь откуда."
 spn_hunt.0300.desc_bought:0 "Ты поехал(а) домой с более тяжёлым кошелём и более лёгкой совестью, чем ожидал(а). Графство [spn_hunt_county.GetName] продолжит хоронить людей. Это больше не твоя забота; тебе заплатили, чтобы это так и было."
 spn_hunt.0300.desc_hunter_beaten:0 "Ты выбрался(лась). Это самое большее, что можно сказать. Графство [spn_hunt_county.GetName] знает, кто приходил ему на помощь и как он выглядел, уезжая."
 spn_hunt.0300.desc_witch:0 "Вопросы были заданы, подозреваемые названы, в дверь постучали. Стало ли от этого графство чище — дело священника."
 spn_hunt.0300.desc_cold:0 "Три недели, и на выходе — графство потише, чем было, и ни на волос умнее."
 spn_hunt.0300.a:0 "Домой."

 # The Hunter's Verdict
 spn_hunt.0301.t:0 "Приговор охотника"
 spn_hunt.0301.desc_fled:0 "[spn_hunter.GetTitledFirstName] покинул(а) графство [spn_hunt_county.GetName]. [spn_hunter.GetSheHe|U] нашёл(нашла) пустой дом, и [spn_hunter.GetSheHe] знает, что это значит, и [spn_hunter.GetSheHe] знает твоё имя. Два года — и ты снова проголодаешься."
 spn_hunt.0301.desc_bought:0 "[spn_hunter.GetTitledFirstName] покинул(а) графство [spn_hunt_county.GetName] с твоим золотом. Теперь ты владеешь охотником — пока хватает золота и держится крючок."
 spn_hunt.0301.desc_hunter_beaten:0 "[spn_hunter.GetTitledFirstName] покинул(а) графство [spn_hunt_county.GetName] медленно и будет залечивать раны ещё долго. [spn_hunter.GetSheHe|U] тебя запомнит. Как и всякий, кому [spn_hunter.GetSheHe] об этом расскажет."
 spn_hunt.0301.a:0 "Хорошо."

 # Shared words
 spn_hunt_creature_track_word:0 "след твари"
 spn_hunt_location_too_far_tt:0 "Досягаемо для твоего двора — или где угодно под властью твоего сюзерена, сколь угодно далеко"
 spn_hunt_location_legend_tt:0 "Ты достаточно охотник для того, что есть в этом графстве"
 spn_hunt_location_recently_hunted_tt:0 "В этом графстве не охотились последние четыре года"
 spn_hunt_tag_legend:0 "#negative_value -- Охотники уже бывали здесь#! (Репутация)\n"
 spn_hunt_tag_legend_high:0 "#negative_value --- Охотники пришли сюда и не вернулись#! (Репутация)\n"

 # 2.35a -- one selectable place per county, so the map pins stop stacking. See supernatural_hunt.txt.
 spn_hunt_location_capital_tt:0 "Столица графства: след идут оттуда, откуда графством управляют"

 ############################################################
 # 2.35 -- THE WITCH HUNT. The Witch kind's own week.
 ############################################################
 spn_hunt.0120.t:0 "Список имён"
 spn_hunt.0120.desc:0 "[spn_hunt_chaplain.GetTitledFirstName] ждал(а) кого-то вроде тебя долго.\n\nВ списке четыре страницы, и чернила не всё одних лет. Против некоторых имён стоит строка объяснения: мертворождённый ребёнок, скисший колодец, женщина, которую видели идущей до рассвета. Против других не стоит ничего.\n\n"Все они в чём-то виновны, — говорит [spn_hunt_chaplain.GetSheHe]. — Ты поймёшь, в чём.""
 spn_hunt.0120.desc_nochaplain:0 "Список подсунули тебе под дверь, и никто не скажет, кто.\n\nВ нём четыре страницы, и чернила не все выглядят одинаково старыми. Против некоторых имён стоит строка объяснения: мертворождённый ребёнок, скисший колодец, женщина, которую видели идущей до рассвета. Против других не стоит ничего.\n\nКто-то в этом графстве хочет, чтобы кто-то другой умер, и решил, что орудием будешь ты."
 spn_hunt.0120.a:0 "Прочесть как следует."
 spn_hunt.0120.a.tt:0 "Твоя [learning|E] против заложенной в нём злобы. Прочтёшь верно — и одно из имён может чего-то стоить; прочтёшь неверно — и потратишь неделю на чью-то обиду."
 spn_hunt.0120.a.success_tt:0 "Кажется, ты находишь имя под именами"
 spn_hunt.0120.a.failure_tt:0 "Ты тратишь неделю на чью-то обиду"
 spn_hunt.0120.b:0 "Спросить, кто внёс каждое имя."
 spn_hunt.0120.b.tt:0 "Медленнее, и это стоит тебе недели. Правитель этого графства предпочёл бы сохранить своих повитух."
 spn_hunt.0120.c:0 "Сжечь его."
 spn_hunt.0120.c.tt:0 "Ничто на этих страницах не доказательство. Ты найдёшь её сам(а) — или не найдёшь вовсе."
 spn_hunt.0121.t:0 "Женщина, о которой говорят"
 spn_hunt.0121.desc:0 "Её имени на улице не произносят. Говорят #EMP её #!, и все знают, о ком речь, а потом смотрят на свои руки.\n\n[spn_hunt_witch.GetTitledFirstName] живёт там, где жила всегда. Она похоронила двух мужей и ни разу в жизни не болела, и второе пугает их сильнее первого.\n\nКогда ты встаёшь так, что видишь её дверь, она не поднимает головы."
 spn_hunt.0121.a:0 "Взять её."
 spn_hunt.0121.a.tt:0 "[spn_hunt_witch.GetTitledFirstName] выводят наружу. Что с ней будет дальше — твоё решение и твоя ноша."
 spn_hunt.0121.b:0 "Смотреть за ней."
 spn_hunt.0121.b.tt:0 "Ты уходишь, точно зная, что она такое, а она не знает, что ты знаешь. Это дороже костра."
 spn_hunt.0121.c:0 "Оставить её."
 spn_hunt.0121.c.tt:0 "Она похоронила двух мужей и не сделала зла никому, кого ты можешь назвать. Ты едешь дальше."

 # 2.35 -- You Are Being Counted (the pack, during tracking)
 spn_hunt.0112.t:0 "Тебя считают"
 spn_hunt.0112.desc:0 "Одиннадцать дней уходит на то, чтобы понять, что было не так с самого твоего приезда.\n\nНе то, что люди не хотят с тобой говорить. А то, что одни и те же четыре лица присутствовали при каждом разговоре — в четырёх разных концах графства [spn_hunt_county.GetName], — и ни одно из них ни разу не сказало ни слова.\n\nИх здесь больше одного. Сколько — ты не знаешь. И охотятся ли они вместе — тоже."
 spn_hunt.0112.a:0 "Выяснить, сколько."
 spn_hunt.0112.a.tt:0 "Твоя [learning|E] против осторожного счёта. Выйдет — и у тебя будет неплохое представление о том, что тебя ждёт; не выйдет — и они узнают, что ты считал(а)."
 spn_hunt.0112.a.success_tt:0 "Ты получаешь число, в которое веришь наполовину, и оно хуже, чем ты надеялся(лась)"
 spn_hunt.0112.a.failure_tt:0 "Ты не получаешь ничего, а они получают твоё лицо"
 spn_hunt.0112.b:0 "Сказать правителю, что это за графство."
 spn_hunt.0112.b.tt:0 "Правитель графства [spn_hunt_county.GetName] одолжит тебе людей, когда они понадобятся. Он же и разговорится, а это графство слушает."
 spn_hunt.0112.c:0 "Ты приехал(а) за одним."
 spn_hunt.0112.c.tt:0 "Что бы здесь ни жило ещё — сегодня ночью не твоя забота. Ты идёшь дальше и молчишь."

 # 2.35 -- Nobody Here Remembers (the compulsion's own trail)
 spn_hunt.0130.t:0 "Здесь никто не помнит"
 spn_hunt.0130.desc:0 "Твой староста две недели пробыл(а) в графстве [spn_compel_hole_county.GetName] и вернулся(лась) неспокоен(неспокойна) из-за чего-то, чему не может назвать имени.\n\nНикто не напуган. Вот к чему он возвращается снова и снова. Возчик не может объяснить четыре дня весной и не думает, что должен. Вдова отдала поле и помнит, что согласилась, — но не помнит, кому.\n\n"Они мне не врут, мой господин. Вот через это я и не могу перейти.""
 spn_hunt.0130.a:0 "Пусть этим займутся."
 spn_hunt.0130.a.tt:0 "Твоя [learning|E] против того, насколько аккуратно это было сделано. Найдёшь очертания — и можешь уйти с именем и с графством, которое знает, чего ему ждать."
 spn_hunt.0130.a.success_tt:0 "Ты находишь очертания, и очертания очень похожи на имя"
 spn_hunt.0130.a.failure_tt:0 "Каждая нить, за которую ты тянешь(тянешь), обрывается у тебя в руке"
 spn_hunt.0130.b:0 "Поручить Следопыту."
 spn_hunt.0130.b.tt:0 "Он зарабатывает на жизнь чтением земли, а графство, потерявшее неделю, — тоже земля. #high Шансы лучше#!."
 spn_hunt.0130.c:0 "Плохой воздух, плохой урожай, плохой год."
 spn_hunt.0130.c.tt:0 "Города сходят с ума. У тебя держава, которой надо править, и ни единого доказательства."
 
 # 2.35 -- earned names
 nick_the_beastbane:0 "Зверобой"
 nick_the_unhunted:0 "Неуловимый"

 # 2.35 -- Another Man's Trail (hunter meets hunter)
 spn_hunt.0113.t:0 "Чужой след"
 spn_hunt.0113.desc:0 "Человек в углу уже час тянет одну и ту же чашку и задал хозяину два вопроса, которые собирался задать ты.\n\n[spn_hunt_rival.GetTitledFirstName] не делает вид, что это не так, когда ты садишься. [spn_hunt_rival.GetSheHe|U] в графстве [spn_hunt_county.GetName] девятый день, [spn_hunt_rival.GetSheHe] прошёл(шла) те же три улицы, что и ты этим утром, и [spn_hunt_rival.GetSheHe] знает, как выглядят могилы.\n\nСлед здесь один, а стоите на нём двое."

 spn_hunt.0113.a:0 "Ехать вместе."
 spn_hunt.0113.a.tt:0 "#high +10#! к шкале и #high +12#! в бою. Он задаёт эти вопросы дольше тебя. Вы оба это запомните."
 spn_hunt.0113.b:0 "Спросить, что он знает."
 spn_hunt.0113.b.tt:0 "Девять дней чужой работы — за цену признания, что она тебе нужна. #high +5#! к шкале."
 spn_hunt.0113.c:0 "Сказать ему, что это твой след."
 spn_hunt.0113.c.tt:0 "Он найдёт себе другое графство. Он также запомнит, кто из вас сказал это первым."

 ############################################################
 # 2.35 -- What They Will Find (the morning after a compelled death)
 ############################################################
 spn_hunt.0140.t:0 "Что они найдут"
 spn_hunt.0140.desc:0 "Всё сделано, и всё тихо, и тихо это не останется.\n\nКто-нибудь пройдёт по этой улице ещё до колоколов. Он найдёт то, что здесь лежит, и что бы он ни решил, будто здесь случилось, — именно в это графство [spn_body_county.GetName] и будет верить следующие пять лет, и именно это расскажут следующему человеку с колом в седельной сумке, когда он спросит.\n\nУ тебя есть время до первого света, чтобы решить, что это будет."
 spn_hunt.0140.desc_someone:0 "Всё сделано, и всё тихо, и тихо это не останется.\n\nКто-нибудь пройдёт по этой улице ещё до колоколов, и что бы он ни решил, будто здесь случилось, — именно в это графство [spn_body_county.GetName] и будет верить следующие пять лет.\n\n[spn_body_frame.GetTitledFirstName] спит в четырёх улицах отсюда и ничуть не более человек, чем ты. В этом графстве об этом никто не знает. К утру могли бы — если бы ты был(а) неосторожен(осторожна) в нужную сторону."
 spn_hunt.0140.a:0 "Сделать так, будто ничего не было."
 spn_hunt.0140.a.tt:0 "Твоя сила и твой дар ко лжи — против улицы, по которой через три часа пойдут люди. Выйдет — и следа не останется вовсе. Не выйдет — след будет, и он твой."
 spn_hunt.0140.b:0 "Пусть посмотрят на [spn_body_frame.GetFirstName]."
 spn_hunt.0140.b.tt:0 "Труднее, чем спрятать. Ложь должна выдержать проверку. Выйдет — и след поведёт к [spn_body_frame.GetTitledFirstName], и будет читаться как [spn_body_frame.GetHerHis] работа. Не выйдет — он твой."
 spn_hunt.0140.c:0 "Пусть знают, что это был(а) я."
 spn_hunt.0140.c.tt:0 "Прятать нечего, значит, и проваливать нечего. След твой, и он #high громкий#!, втройне, и правителю графства [spn_body_county.GetName] и каждому в его зале расскажут в точности, что прошло здесь.\n\nОхотники придут. В этом и замысел."

 ############################################################
 # 2.35g -- SEND FOR A HUNTER (spn_hunt.0006-0012), the cascade (0030-0031), the redirect (0200.g)
 ############################################################
 spn_hunt.0001.e:0 "Послать за охотником."
 spn_hunt.0001.e.tt:0 "Написать тем, кто этим занимается. Придут три имени, и ты выберешь, кому достанется дорога в графство [spn_menace_county.GetName]."

 spn_hunt.0006.t:0 "Три человека, что этим занимаются"
 spn_hunt.0006.desc:0 "Письма ушли на второй неделе, а ответы пришли в течение следующего месяца — быстрее, чем ты ожидал(а), и медленнее, чем хотелось.\n\nТрое из них достаточно близко, чтобы это имело значение. Твой управляющий разложил ответы на столе в том порядке, какой считает лучшим, то есть в порядке того, сколько они просят.\n\nОдин из этих людей поедет в графство [spn_menace_county.GetName]. Двое других больше от тебя ничего не услышат и это запомнят."
 spn_hunt.0006.desc_nobody:0 "Письма ушли. В последующие недели они вернулись — или не вернулись.\n\nЛюдей, которые этим занимаются, мало, а те немногие, что есть, оказались в другом месте: на жалованье у другого правителя, в темнице у другого правителя или где-то между. Посылать в графство [spn_menace_county.GetName] некого, кроме тех, кто у тебя уже есть.\n\nУправляющий собирает бумаги, не дожидаясь просьбы."
 spn_hunt.0006.a:0 "Послать за [spn_summons_a.GetShortUIName]."
 spn_hunt.0006.b:0 "Послать за [spn_summons_b.GetShortUIName]."
 spn_hunt.0006.c:0 "Послать за [spn_summons_c.GetShortUIName]."
 spn_hunt.0006.d:0 "Ни за кем."
 spn_hunt.0006.d.tt:0 "Никого не зовут. След в графстве [spn_menace_county.GetName] остаётся где стоит — как и то, что его оставило. Написать снова можно через год."

 spn_hunt.0007.t:0 "Тебе написал правитель"
 spn_hunt.0007.desc:0 "Письмо короткое, и почерк писарский, но печать — своя, [spn_summons_lord.GetTitledFirstName], и деньги в нём названы, что для таких писем верно не всегда.\n\nВ графстве [spn_summons_county.GetName] что-то убивает людей. Что именно — он не пишет. Он пишет, что расспрашивал, и что расспросы и привели его к твоему имени.\n\n[spn_summons_purse|V] золота, когда всё будет кончено."
 spn_hunt.0007.a:0 "Поеду."
 spn_hunt.0007.a.tt:0 "Тебя ждут в графстве [spn_summons_county.GetName]. Кошель, [spn_summons_purse|V] золота, выплачивается, когда тварь, что оставила этот след, будет мертва, и не раньше."
 spn_hunt.0007.b:0 "Это обойдётся [spn_summons_lord.GetHerHim] дороже."
 spn_hunt.0007.b.tt:0 "Ответить с большей цифрой и посмотреть, что [spn_summons_lord.GetTitledFirstName] с этим сделает. Заплатит — и кошель удвоится. Не заплатит — и работы нет, и кошеля нет."
 spn_hunt.0007.c:0 "Найти кого-нибудь другого."
 spn_hunt.0007.c.tt:0 "Ты не отвечаешь. [spn_summons_lord.GetTitledFirstName] об этом услышит и не забудет, на чьё имя [spn_summons_lord.GetSheHe] потратил(а) письмо."

 spn_hunt.0008.t:0 "Охотник называет свою цену"
 spn_hunt.0008.desc:0 "[spn_summons_target.GetTitledFirstName] отвечает собственной рукой — почерк хуже писарского и куда понятнее.\n\nОн знает, что в графстве [spn_summons_county.GetName]. Он приблизительно знает, что для этого понадобится. И он знает — потому что делал это прежде, — что правитель, уже написавший одно письмо, обычно напишет и второе.\n\nВдвое, или он остаётся где стоит."
 spn_hunt.0008.a:0 "Заплатить ему."
 spn_hunt.0008.a.tt:0 "Кошель удваивается, до [spn_summons_purse|V] золота, и он приезжает."
 spn_hunt.0008.b:0 "Пусть голодает."
 spn_hunt.0008.b.tt:0 "Второго письма не будет. Работа остаётся невыполненной, а графство — со своим следом."

 spn_hunt.0009.t:0 "Он едет"
 spn_hunt.0009.desc:0 "Весть с дороги: он взялся.\n\nОн не спросил, что это, — твой управляющий считает это добрым знаком, а твой капеллан нет."
 spn_hunt.0009.a:0 "Хорошо."
 spn_hunt.0009.a.tt:0 "До графства он доберётся сам. Что он там делает — его дело, пока оно не кончено, а тогда кошель за тобой."

 spn_hunt.0011.t:0 "Он не едет"
 spn_hunt.0011.desc:0 "Ответ, когда приходит, занимает две строки и не объясняет себя.\n\nЧто было в том графстве, то там и осталось, а теперь об этом знает ещё один человек."
 spn_hunt.0011.a:0 "Значит, придётся кому-то другому."
 spn_hunt.0011.a.tt:0 "Написать снова можно в течение года."

 spn_hunt.0012.t:0 "Кошель"
 spn_hunt.0012.desc:0 "Прибывает без церемоний: мешок, писарь и строчка в какой-то книге учёта, которая переживёт всех, кто был в том графстве.\n\nПисарь ждёт, станешь ли ты пересчитывать. Ты не станешь — о чём он и доложит."
 spn_hunt.0012.a:0 "Заплачено — значит, заплачено."

 spn_hunt.0030.t:0 "Послать весть"
 spn_hunt.0030.desc:0 "Ты в пути третий день и всё ещё не спишь.\n\nОн не был глупцом и был не один, а такие люди не останавливаются на одном имени. Что бы он ни записал, он записал это где-то, и остальные твоей крови не знают, что эта запись существует.\n\nПисьмо сегодня дойдёт до них раньше, чем он."
 spn_hunt.0030.a:0 "Предупредить своё потомство."
 spn_hunt.0030.a.tt:0 "Каждый, кого ты создал(а), слышит, что за тобой пришли. Они год будут смотреть на дорогу и будут знать, кто их предупредил."
 spn_hunt.0030.b:0 "Предупредить того, кто создал меня."
 spn_hunt.0030.b.tt:0 "Письмо идёт вверх. Твой создатель год смотрит на дорогу и помнит, что ты подумал(а) о [spn_kin_maker.GetHerHim]."
 spn_hunt.0030.c:0 "Предупредить всех."
 spn_hunt.0030.c.tt:0 "Каждое имя твоей крови, за одну ночь, какими только надёжными руками. Все они год смотрят на дорогу. Держать историю в согласии через столько писем тебе чего-то стоит."
 spn_hunt.0030.d:0 "Пусть лучше посмотрят в другую сторону."
 spn_hunt.0030.d.tt:0 "Слово, сказанное кому надо, в графстве [spn_kin_get.GetTitledFirstName]: ничего, что называло бы тебя, — только то, что заметят. Оно притянет ровно того, кто пришёл за тобой, и обрушится на [spn_kin_get.GetHerHim]."
 spn_hunt.0030.e:0 "Ничего не говорить."
 spn_hunt.0030.e.tt:0 "Письмо — вещь, которую можно найти. От тебя никто ничего не услышит."

 spn_hunt.0031.t:0 "Кто-то тебя сдал"
 spn_hunt.0031.desc:0 "Есть человек, который расспрашивает о тебе по имени.\n\nНе о смертях, не о графстве. О тебе — и начал он с нужного места и с нужными вопросами, а это значит, что с начала он не начинал. Кто-то вручил ему середину.\n\nВопрос в том, кто, и ответ стоит для тебя дороже, чем бегство."
 spn_hunt.0031.a:0 "Кто проговорился?"
 spn_hunt.0031.a.found_tt:0 "Ты находишь очертания: чьё графство, чья комната, чья шея была на кону на той неделе. Ты знаешь."
 spn_hunt.0031.a.lost_tt:0 "Обратный след остывает в двух шагах от тебя. Кто-то был осторожен."
 spn_hunt.0031.b:0 "Неважно кто. Смотреть на дорогу."
 spn_hunt.0031.b.tt:0 "Ты будешь смотреть год — и это единственное во всём этом, что ты можешь控制. Опечатка, поправляю ниже: «Ты будешь смотреть год — и это единственное во всём этом, что тебе подвластно.»"

 spn_hunt.0200.g:0 "В этих землях есть и похуже меня."
 spn_hunt.0200.g.tt:0 "Твоя [diplomacy|E] против [spn_hunter.GetHerHis]. Ты не отрицаешь, что ты такое. Ты говоришь [spn_hunter.GetHerHim], где тела ложатся гуще, — и это правда. Успех: [spn_hunter.GetSheHe|U] уходит и едет в то графство. Отказ: ты только что сказал(а) охотнику, что ведёшь счёт. Бой будет тяжелее."
 spn_hunt.0200.g.taken_tt:0 "[spn_hunter.GetSheHe|U] слушает дольше, чем сам(а) собирался(лась), а потом уходит. Недалеко. Просто не здесь."
 spn_hunt.0200.g.refused_tt:0 "[spn_hunter.GetSheHe|U] не желает знать, сколько их в других местах. [spn_hunter.GetSheHe|U] пришёл за одним."

 spn_hunt_redirect_duel:0 "Направить его в другое место"
 spn_hunt_whotalked_duel:0 "Выяснить, кто проговорился"

 # 2.35h -- the beat between the door and the fight, when what comes through it is the wrong man
 spn_hunt.0221.t:0 "Это не тот"
 spn_hunt.0221.desc:0 "У тебя есть дверь, у тебя есть час и у тебя наконец есть нужный дом, — а из него выходит [spn_proxy.GetShortUIName], который на сорок лет моложе тех убийств, о которых ты читал(а).\n\n[spn_proxy.GetSheHe|U] вооружён(а). [spn_proxy.GetSheHe|U] ещё и в ужасе — и не перед тобой: [spn_proxy.GetSheHe] то и дело оглядывается на темноту за спиной, а это говорит тебе всё о том, кто там стоит и что было сказано прежде, чем отодвинули засов.\n\nКто-то послал [spn_proxy.GetHerHim] сюда, чтобы его убили вместо другого. Это сработало — в том смысле, что перед тобой именно он."
 spn_hunt.0221.a:0 "Тогда он умрёт первым."
 spn_hunt.0221.a.tt:0 "Ты принимаешь бой, который тебе дали. Это та же кровь и тот же след, а тот, кто его послал, сохраняет себе ночь."
 spn_hunt.0221.b:0 "Отойди. Я пришёл(шла) за тем, кто тебя послал."
 spn_hunt.0221.b.tt:0 "[spn_proxy.GetSheHe|U] остаётся жить и уходит. Ты возвращаешься к двери, и на этот раз посылать наружу уже некого."