l_russian:
 ############################################################
 # Supernatural 2.35 -- The Hunt. English.
 ############################################################

 # --- The activity ---
 supernatural_hunt:0 "Сверхъестественная охота"
 supernatural_hunt_desc:0 "Где-то графство теряет людей от чего-то, что не человек. Поезжай туда, выясни, что это и кто это, и положи этому конец."
 supernatural_hunt_host_desc:0 "$BULLET_WITH_TAB$Выследить тварь, что охотится на графство\n$BULLET_WITH_TAB$[county_control|E] графства и его [development|E] восстанавливаются, когда она погибнет\n$BULLET_WITH_TAB$Получить [prestige|E] и $trait_track_monster_hunting$ [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Взять с собой ученика и завершить его обучение\n"
 supernatural_hunt_guest_desc:0 "$BULLET_WITH_TAB$Проехать охоту вместе с другим охотником\n$BULLET_WITH_TAB$Получить $trait_track_monster_hunting$ [trait_level_track_xp|E], когда охота удалась\n$BULLET_WITH_TAB$Ученик, проехавший охоту со своим учителем, завершает обучение\n"
 supernatural_hunt_selection_tooltip:0 "Выследить тварь, что охотится на графство."
 supernatural_hunt_destination_selection:0 ""
 supernatural_hunt_province_desc:0 "Что-то повадилось ходить в это графство."
 supernatural_hunt_predicted_cost:0 "Кони, ночлег и немного монет в нужные руки."
 supernatural_hunt_guest_help_text:0 "Охотник может ехать и один. Каждый, кто едет с тобой, делает след легче для чтения — и добавляет клинок, когда тварь найдена."
 supernatural_hunt_host_an_a:0 ""
 spn_hunt_cannot_start_recovering_tt:0 "Ты ещё не оправился(лась) от прошлой охоты"
 spn_hunt_cannot_start_no_quarry_tt:0 "Нигде в пределах твоей досягаемости никого не травят"
 spn_hunt_activity_conclusion_title:0 "Сверхъестественная охота завершилась."
 spn_hunt_activity_conclusion_desc:0 "[GetActivityType( 'supernatural_hunt' ).GetName] завершилась."
 supernatural_hunt_conclusion_desc:0 "[GetActivityType( 'supernatural_hunt' ).GetName] завершилась."

 # Game concepts
 game_concept_supernatural_hunt:0 "Сверхъестественная охота"
 game_concept_supernatural_hunts:0 "Сверхъестественные охоты"
 game_concept_monster_hunt:0 "Охота на монстра"
 game_concept_monster_hunts:0 "Охоты на монстров"
 game_concept_supernatural_hunt_desc:0 "[activity|E] для охотника. Охоту на монстра можно провести только в графстве, которое несёт [spn_menace|E]: там что-то сделала тварь. Охотник выслеживает её три недели, выясняет, что это и кто это, а затем выходит к ней. Тварь получает предупреждение и имеет право ответить.\n\nНиже 50 $trait_track_monster_hunting$ охотник не может прочесть, какая тварь оставила след, и выбор между Кольями и Серебром — это догадка."
 game_concept_spn_menace:0 "След"
 game_concept_spn_menaces:0 "Следы"
 game_concept_spn_trail:0 "След"
 game_concept_spn_trails:0 "Следы"
 game_concept_spn_menace_desc:0 "Графство помнит, что с ним сделала тварь. Каждое убийство вампира или оборотня оставляет отметину, как и кормёжка, о которой кто-то проговорился: [county_control|E] графства падает (убийство оборотня стоит ещё и [development|E]), модификатор #high Здесь что-то охотится#! держится пять лет, а на третьем случае о нём сообщают правителю графства. Там, где след ещё тёплый, может пройти [supernatural_hunt|E], а убитая тварь возвращает часть того, что забрала."

 # Kinds
 # (the special option category is special_type, shared with every activity that has one; no key of its own)
 spn_hunt_kind_monster:0 "Охота на монстра"
 spn_hunt_kind_monster_desc:0 "$EFFECT_LIST_BULLET$ Выследить тварь, что охотится на графство\n$EFFECT_LIST_BULLET$ Годятся только графства, несущие [spn_menace|E]\n$EFFECT_LIST_BULLET$ Повышает $trait_track_monster_hunting$ [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Убитая тварь возвращает графству утраченное\n#weak Мёртвые графства говорят тебе, что тварь здесь. Они не говорят, какая.#!"
 spn_hunt_kind_witch:0 "Охота на ведьм"
 spn_hunt_kind_witch_desc:0 "$EFFECT_LIST_BULLET$ Искоренить колдовство в собственных землях\n$EFFECT_LIST_BULLET$ Любое графство, что держишь ты, твои вассалы или твой сюзерен\n$EFFECT_LIST_BULLET$ Повышает $trait_track_witch_hunting$ [trait_level_track_xp|E]\n#weak Старый способ, обёрнутый в охоту: те же вопросы, те же подозреваемые, тот же стук в дверь.#!"
 spn_hunt_location_needs_trail_tt:0 "Для Охоты на монстра нужно графство, несущее [spn_menace|E] от живой твари"
 spn_hunt_kind_witch_needs_tt:0 "Присоединиться может любой охотник. Как хорошо всё пройдёт, решает твой $trait_track_witch_hunting$, а не то, позволено ли тебе ехать"
 spn_hunt_location_witch_tt:0 "Охота на ведьм проходит в твоих землях, у вассала или у сюзерена"

 # Preparations
 spn_hunt_preparations:0 "Снаряжение"
 spn_hunt_prep_light:0 "Налегке"
 spn_hunt_prep_light_desc:0 "Клинок, лук и то, что даст дорога.\n\nНи [gold|E] не потрачено, и ответить твари нечем, кроме того, что ты и так носишь."
 spn_hunt_prep_stakes:0 "Колья"
 spn_hunt_prep_stakes_desc:0 "Ясень, заострённый. И веточка того, за что ручаются старухи.\n\n#positive_value +15 Столкновение#! против вампира, и он не сможет смотреть тебе в глаза.\n#negative_value −10 Столкновение#! против волка.\nПротив гибрида — без разницы."
 spn_hunt_prep_silver:0 "Серебро"
 spn_hunt_prep_silver_desc:0 "Клинки и наконечники, что стоят дороже, чем должны. Ты слышал(а), почему.\n\n#positive_value +15 Столкновение#! против оборотня.\n#negative_value −10 Столкновение#! против вампира, и тот, кто застанет тебя с не тем снаряжением, сможет смотреть тебе в глаза.\nПротив гибрида — без разницы."
 spn_hunt_prep_guides:0 "Нанять местных проводников"
 spn_hunt_prep_guides_desc:0 "Заплати людям, что ходят этими дорогами каждый день, чтобы они прошли их с тобой.\n\n#positive_value +15 Выслеживание#!"
 spn_hunt_prep_kit_cost:0 "Снаряжение"
 spn_hunt_prep_guides_cost:0 "Проводники"

 # Approach
 spn_hunt_approach:0 "Подход"
 spn_hunt_approach_quiet:0 "Расспрашивать тихо"
 spn_hunt_approach_quiet_desc:0 "Ставить выпивку, спрашивать о мёртвых, не называть себя.\n\nВыслеживание не меняется.\nТвари в графстве всё равно могут услышать, что чужак о чём-то расспрашивает."
 spn_hunt_approach_open:0 "Въехать открыто"
 spn_hunt_approach_open_desc:0 "Пусть графство знает: приехал охотник.\n\n#positive_value +10 Выслеживание#!\n#negative_value Каждая тварь в графстве о тебе услышит.#!"
 spn_hunt_approach_signs:0 "Читать знаки"
 spn_hunt_approach_signs_desc:0 "Смотреть на раны, на следы, на то, в какие ночи это случалось.\n\n#positive_value +5 Выслеживание#!\n#positive_value +5 Столкновение#!"

 # Phases
 spn_tracking_phase:0 "Выслеживание"
 spn_tracking_phase_desc:0 "Три недели расспросов, могил и страха графства."
 spn_confrontation_phase:0 "Столкновение"
 spn_confrontation_phase_desc:0 "След заканчивается у двери."

 # Intents
 spn_cleanse_the_land_intent:0 "Очистить землю"
 spn_cleanse_the_land_intent_desc:0 "Положить конец тому, что охотится на это графство, и вернуть людям их ночи."
 spn_train_the_apprentice_intent:0 "Обучить ученика"
 spn_train_the_apprentice_intent_desc:0 "Взять ученика и докончить урок, которого не докончило обучение. Ученик, проехавший с тобой охоту, где тварь найдена или прогнана, — уже охотник."
 spn_earn_my_spurs_intent:0 "Заслужить шпоры"
 spn_earn_my_spurs_intent_desc:0 "Проехать охоту со старшим охотником и выучиться ремеслу там, где ему учат."
 spn_root_out_witchcraft_intent:0 "Искоренить колдовство"
 spn_root_out_witchcraft_intent_desc:0 "Задать вопросы, назвать подозреваемых, постучать в дверь."
 
 # Invite rules
 activity_invite_rule_spn_hunters:0 "Охотники"
 activity_invite_rule_spn_hunters_desc:0 "Охотники, которых ты знаешь: друзья, родня, твой двор и те, чью тайну ты хранишь."
 activity_invite_rule_spn_hunter_players:0 "Игроки-охотники"
 activity_invite_rule_spn_hunter_players_desc:0 "Другие игроки, которые охотятся."
 activity_invite_rule_spn_apprentices:0 "Ученики"
 activity_invite_rule_spn_apprentices_desc:0 "Твои ученики: те, кого не докончило обучение, и те, кого тебе передала цепь ран."
 spn_hunt_join_brave:0 "Смел(а)"
 spn_hunt_join_craven:0 "Труслив(а)"
 spn_hunt_join_friend:0 "Друг хозяина охоты"
 spn_hunt_join_renown:0 "О тебе слышали"
 spn_hunt_join_apprentice:0 "Ученик хозяина охоты"

