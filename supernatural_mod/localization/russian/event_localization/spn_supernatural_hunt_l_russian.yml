 spn_hunt_prov_base:0 "Охотник судит о графстве по тому, что оно потеряло.\n"
 # The trail
 spn_hunt_tag_trail_1:0 "#positive_value + Недавние убийства#! (След)\n"
 spn_hunt_tag_trail_2:0 "#positive_value ++ Череда их#! (След)\n"
 spn_hunt_tag_trail_3:0 "#positive_value +++ Графство теряет людей#! (След)\n"
 # What left it
 spn_hunt_tag_kind_vampire:0 "#positive_value + Обескровлен#! (Признак)\n"
 spn_hunt_tag_kind_werewolf:0 "#positive_value + Разорван#! (Признак)\n"
 spn_hunt_tag_kind_unknown:0 "#negative_value - Не прочесть#! (Признак)\n"
 # The county
 spn_hunt_tag_control_low:0 "#positive_value + Порядка никто не держит#! (Контроль)\n"
