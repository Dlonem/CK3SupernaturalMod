l_russian:
 # 2.39 (WORK-ORDER-2.39 F7): vampires, wolves and witches inside the Order.

 # The Coin (spn_order.0110), the cage: a wolf.
 spn_order.0110.scent:0 "Пусть учует мой запах"
 spn_order.0110.scent.tt:0 "Зверь узнаёт своих. Что бы ни случилось, он не откусит тебе руку."

 # The Observance (spn_order.0120): a vampire or hybrid neophyte.
 spn_order.0120.forget:0 "Заставить его забыть, что он меня видел"
 spn_order.0120.forget.tt:0 "Он забудет, что ты здесь был. Но это и было испытанием, и маски наблюдали: твой Храмовый Магус узнаёт, кто ты такой."

 # An Outsider Asks Questions (spn_order.0160): a vampire or hybrid member.
 spn_order.0160.look:0 "Посмотреть [spn_os_who.GetHerHim] в глаза"
 spn_order.0160.look.tt:0 "Ты удерживаешь [spn_os_who.GetHerHis] взгляд и велишь [spn_os_who.GetHerHim] забыть часовню и идти домой."
 spn_order.0160.look_hunter.tt:0 "#N Против охотника на это уходят все твои силы: вдвое больше обычной крови, и ты можешь потерять ступень, пока не заработаешь её снова.#!"

 # The Relic That Would Not Sleep (spn_order.0161): a Champion, or anyone with Magical Senses.
 spn_order.0161.listen:0 "Выслушать, чего она хочет"
 spn_order.0161.listen.tt:0 "Ты сидишь с ней всю ночь и слушаешь. К утру она затихает, а послушники видели, кто её успокоил."

 # They Came for What You Know (spn_order.0193): a wolf who left the Order.
 spn_order.0193.wolf:0 "Выпустить волка"
 spn_order.0193.wolf.tt:0 "Схватка в темноте. Чем выше твоя [prowess|E], тем вероятнее, что они сбегут и оставят тебя в покое навсегда. Если проиграешь — забудешь."

 # The Temple Asks for Your Blood (spn_order.0820): any creature.
 spn_order.0820.a_creature:0 "Моя кровь носила и худшее"

 # The Wolves Have Teeth (spn_order.0829): a wolf Temple Magus.
 spn_order.0829.scent:0 "Я знаю этот запах"
 spn_order.0829.scent.tt:0 "Ты узнал бы этот запах где угодно. Ты узнаёшь [spn_wolf_killer.GetHerHis] тайну."
 spn_order.0829.scent_known.tt:0 "Ты уже знаешь, кто [spn_wolf_killer.GetSheHe] такой. Теперь ты знаешь и [spn_wolf_killer.GetHerHis] запах."

 # A Mask Knows Too Much (spn_conclave.0120): a wolf.
 spn_conclave.0120.scent:0 "Идти по запаху"
 spn_conclave.0120.scent.desc:0 "Ты прошёл по запаху серой маски сквозь толпу и нашёл её в одиночестве. Это задумывалось как испытание, и ты его прошёл."
