 l_russian:
 # Invitation to Satiate Thirst Activity - Ev1.01
 supernatural_ev1.01:0 "Запечатанное письмо"
 supernatural_ev1.01.desc:0 "Курьер доставил запечатанное письмо с четкими указаниями: оно должно быть передано лично вам в руки и уничтожено после прочтения.\n\nВы узнаете в курьере слугу [host.GetName], того, кто разделяет вашу... особую жажду.\n\nПрочитав письмо, вы обнаруживаете, что [host.GetName] приглашает вас присоединиться к ним в следующем выезде на охоту за человеческой кровью и считает, что ваше участие поможет всё провести гладко.\n\nЭто отличная возможность утолить жажду и укрепить свои силы."
 supernatural_ev1.01.a:0 "Я подумаю об этом."
 supernatural_ev1.01.a.tt:0 "Вы сможете присоединиться к их охоте за кровью."

# No Other Vampires Arrived - Ev1.02
 supernatural_ev1.02.t:0 "Тихая ночь"
 supernatural_ev1.02.desc:0 "Когда наступает назначенная ночь, ни один другой вампир не появляется на месте встречи. Вы не воспринимаете это как отвержение, а скорее как подтверждение собственной осторожности — доверие среди вашего рода заслуживается с трудом, и этой ночью ваша жажда останется незамеченной любопытными глазами.\n\nВ отсутствие других вы наслаждаетесь одиночеством и свободой утолять жажду без помех. Нет ни шепота о соперничестве, ни намёков на союзы — лишь тихое удовлетворение от тщательно выбранной добычи."
 supernatural_ev1.02.a:0 "Так даже лучше."
 
 # Host Event - Ev1.03
 supernatural_ev1.03.t:0 "Начало собрания"
 supernatural_ev1.03.desc:0 "Прибывающие вампиры тихо появляются в уединенной таверне, их движения бесшумны и расчетливы. Воздух пропитан предвкушением, каждый гость слегка кивает хозяину, прежде чем раствориться в тенях. Эта ночь сулит возможности и насыщение, но не без риска."
 supernatural_ev1.03.a:0 "Приветствовать гостей с теплом и дружелюбием."
 supernatural_ev1.03.b:0 "Излучать сдержанную властность."
 supernatural_ev1.03.c:0 "Оценить помещение на наличие возможных угроз."
 supernatural_ev1.03.c_ct:0 "Могут произойти неожиданные события."

# Monster Hunter Appears At Activity - Ev1.04
 supernatural_ev1.04.t:0 "Нежданное вторжение"
 supernatural_ev1.04.desc:0 "Когда собрание начинается, дверь таверны открывается, и входит одинокая фигура. Атмосфера накаляется — становится ясно, что в собрание проник искусный охотник на чудовищ. Такая дерзость одновременно опасна и оскорбительна, требуя быстрого и бесшумного ответа, чтобы сохранить тайну этой ночи."
 supernatural_ev1.04.a:0 "Схватить охотника и разобраться с ним незаметно."
 supernatural_ev1.04.b:0 "Тихо выпить жизнь охотника и избавиться от тела."

# Guest's Reaction to Hunter's Death - Ev1.05
 supernatural_ev1.05.t:0 "Конец охотника"
 supernatural_ev1.05.desc:0 "Жизнь охотника оборвана с холодной точностью, его кровь выпита хозяином под взглядами других вампиров. Нет жалости к тому, кто осмелился проникнуть на такое собрание. Вместо этого в комнате царит холодное уважение к эффективности хозяина, смешанное с презрением к безрассудной дерзости охотника."
 supernatural_ev1.05.a:0 "Достойный конец для такой наглости."
 supernatural_ev1.05.b:0 "Необходимый поступок для безопасности всех."
 supernatural_ev1.05.c:0 "Пусть это будет уроком для других."
 
# Mikaelson Attending Activity - Ev1.06, Ev1.07
 supernatural_ev1.06.title:0 "Имя, звучащее в тенях"
 supernatural_ev1.06.desc:0 "Собрание в разгаре, воздух наполнен предвкушением и голодом. Когда хозяин готовится открыть ночь, в помещение входит фигура, излучающая ауру древней силы. Среди гостей начинают распространяться шепотки. \n\nГоворят, это Микаэльсон — имя, окутанное тайной и страхом, которое, по слухам, лежит в истоках всего вампиризма. Правда это или всего лишь легенда, присутствие Микаэльсона неоспоримо, а их репутация стремительной мести и ненасытного голода опережает их."
 supernatural_ev1.06.a:0 "Приветствовать их с осторожностью."
 supernatural_ev1.07.title:0 "Первые среди своего рода"
 supernatural_ev1.07.desc:0 "Пока собрание продолжается, вампир из рода Микаэльсон начинает говорить, их голос властный, но удивительно сдержанный. Они рассказывают отрывки истории, каждая деталь произнесена с точностью, в которой сквозят гордость и осторожность. \n\n«Вы можете не знать мою семью, но кровь, которую вы пьете, несет отголоски нашего наследия. Задолго до королей и империй мы были охотниками, ставшими чем-то большим. Мы не ищем славы или признания, лишь то, что нам причитается — уважение равных и азарт охоты.» \n\nВ комнате воцаряется тишина, каждый гость впитывает вес их слов. Является ли эта история предупреждением, заявлением или просто моментом самоудовлетворения? Намерения Микаэльсона остаются столь же неуловимыми, как и правда об их происхождении."
 supernatural_ev1.07.a:0 "Выказать уважение их присутствию."
 supernatural_ev1.07.b:0 "Молча наблюдать за их поведением."
 supernatural_ev1.07.b.tt:0 "Вы предпочитаете оставаться в тенях, с осторожным интересом наблюдая за вампиром из рода Микаэльсон и их историей. Возможно, со временем их мотивы станут яснее."

# An Unexpected Dinner Guest Activity - Ev1.08
 supernatural_ev1.08.title:0 "Нежданный гость за ужином"
 supernatural_ev1.08.desc:0 "Когда группа собирается в тускло освещенной таверне, дверь со скрипом открывается, и внутрь вваливается раненый человек. Один из присутствующих инстинктивно помогает ему, вызывая беспокойство хозяина таверны. За лишнюю плату в золоте группа получает винный погреб, чтобы «позаботиться» о человеке — хотя его истинная судьба находится в руках загадочных хозяев."
 supernatural_ev1.08.a:0 "Питаться им, его жизнь даст нам силы."
 supernatural_ev1.08.b:0 "Исцелить его — эта ночь не должна быть омрачена проблемами."
 supernatural_ev1.08.c:0 "Сдержать голод — питаться и исцелить его, не оставив следов."

# Tavern Game of Wits - Ev1.09
 supernatural_ev1.09.title:0 "Игра в остроумие"
 supernatural_ev1.09.desc:0 "После долгой ночи, проведенной в поиске по темным улицам, вы укрываетесь в тускло освещенной таверне. Воздух густой от трубочного дыма и запаха прокисшего эля.\n\nВ углу группа шумных завсегдатаев увлечена игрой в загадки и остроумие. Один из них, с лукавым блеском в глазах, обращается к вам: «Не хочешь проверить свой ум, чужак?» Ухмылка на его лице выдает вызов... или, возможно, возможность.\n\nВы ощущаете притяжение момента — шанс проявить себя в хитроумной игре или показать тонкую силу, доступную лишь хищнику."
 supernatural_ev1.09.a:0 "Принять вызов."
 supernatural_ev1.09.a_tt:0 "Вы проверяете свой ум в игре на загадки и интеллект."
 supernatural_ev1.09.a_win_tt:0 "Ваш острый ум и находчивость позволяют вам доминировать в игре."
 supernatural_ev1.09.a_draw_tt:0 "Вы держитесь достойно, но игра заканчивается вничью."
 supernatural_ev1.09.a_lose_tt:0 "Ваше остроумие подводит, и толпа смеется над вами."
 supernatural_ev1.09.b:0 "Подчинить вызывающего."
 supernatural_ev1.09.b_tt:0 "Вы используете свои вампирские способности, чтобы незаметно повлиять на противника, обретая силу и уверенность."
 supernatural_ev1.09.c:0 "Вежливо отказаться."
 supernatural_ev1.09.c_tt:0 "Вы теряете уважение среди завсегдатаев, ваше нежелание воспринимается как слабость."

# The Catacombs Below - Ev1.10
 supernatural_ev1.10.title:0 "Катакомбы внизу"
 supernatural_ev1.10.desc:0 "С наступлением глубокой ночи хозяин таверны наклоняется к вам с хитрой ухмылкой, его глаза блестят от озорства.\n\nСлышали когда-нибудь голоса снизу? — шепчет он, бросая взгляд на дверь в углу. «Там внизу старый вход в катакомбы. Люди говорят, если прислушаться, можно услышать шепот тех, кто заблудился и не вернулся.» Он посмеивается, явно наслаждаясь дрожью, пробежавшей по толпе.\n\nНо для вас мысль о темном, забытом проходе под городом имеет иное притяжение — там, где тени сулят тайну, а добыча бродит без защиты."
 supernatural_ev1.10.a:0 "Исследовать катакомбы."
 supernatural_ev1.10.a_tt:0 "Тьма и тишина... идеальные охотничьи угодья."
 supernatural_ev1.10.ab_tt:0 "Что-то может произойти."
 supernatural_ev1.10.b:0 "Заплатить за проводника."
 supernatural_ev1.10.b_tt:0 "Немного золота убережет вас от того, чтобы стать одним из тех шепотов."
 supernatural_ev1.10.c:0 "Остаться в таверне."
 supernatural_ev1.10.c_tt:0 "Нет нужды гоняться за байками о призраках."
 supernatural_ev1.10.d:0 "Принять 'добровольного' помощника."
 supernatural_ev1.10.d_tt:0 "Это кажется слишком простым — люди редко помогают вампирам из чистой доброты."
 
# Ambush in the Catacombs - Ev1.11
 supernatural_ev1.11.title:0 "Засада в катакомбах"
 supernatural_ev1.11.desc:0 "Исследуя катакомбы, вы слишком поздно ощущаете опасность. Из теней появляется опытный охотник с оружием наготове. Нужно действовать быстро."
 supernatural_ev1.11.a:0 "Сразиться с охотником"
 supernatural_ev1.11.a_tt:0 "Вы готовитесь бороться за свою жизнь."
 supernatural_ev1.11.a_win_tt:0 "Вы побеждаете охотника и выпиваете его жизнь."
 supernatural_ev1.11.a_lose_tt:0 "Оружие охотника находит цель, и тьма поглощает вас."
 supernatural_ev1.11.b:0 "Подчинить охотника"
 supernatural_ev1.11.b_tt:0 "Вы готовитесь сразиться с охотником и попытаться подчинить его."
 supernatural_ev1.11.b_success_tt:0 "Вам удается подчинить и пленить охотника."
 supernatural_ev1.11.b_fail_tt:0 "Охотник ускользает из ваших рук, растворяясь в тенях."
 supernatural_ev1.11.c:0 "Отступить и бежать"
 supernatural_ev1.11.c_tt:0 "Вы сбегаете, но ваша гордость уязвлена."

# A Moment of Desire - Ev1.12
 supernatural_ev1.12.title:0 "Мгновение страсти"
 supernatural_ev1.12.desc:0 "[lover_participant.GetTitledFirstName] наклоняется ближе, глаза искрятся озорством. «Эта охота, этот азарт... я жажду тебя, мой [ROOT.Char.Custom('LoverPetName')]!» [lover_participant.GetSheHe|U] мягко тянет вас за руку, намекая на укромные комнаты над таверной."
 supernatural_ev1.12.a:0 "Снять комнату и предаться страсти."
 supernatural_ev1.12.a_tt:0 "Охота может подождать; некоторые желания не терпят отлагательств."
 supernatural_ev1.12.b:0 "Сосредоточиться на охоте."
 supernatural_ev1.12.b_tt:0 "Сохраняйте сосредоточенность; добыча ждет."

# Additional Entries - Ev1.12
 supernatural_lovers_sneak_key:0 "[ROOT.Char.GetFirstName|U] и [lover_participant.GetFirstName] на время исчезли..."
 supernatural_lovers_focus_key:0 "[ROOT.Char.GetFirstName|U] остался сосредоточен на охоте, устояв перед соблазном [lover_participant.GetFirstName]."
 supernatural_fresh_air_and_exercise_modifier:0 "Свежий воздух и движение"
 supernatural_focused_attention_modifier:0 "Сосредоточенное внимание"
 
# Prepared for the Night - Ev1.13
 supernatural_ev1.13.title:0 "Готовность к ночи"
 supernatural_ev1.13.desc:0 "Перед сегодняшней охотой хозяин собрания провел время в тенях, прислушиваясь к шепотам горожан и отмечая любую подозрительную активность. Ничего не указывало на присутствие охотников. Вы доверяете подготовке, и воздух наполняется уверенностью, пока вы готовитесь выйти на охоту."
 supernatural_ev1.13.a:0 "Сегодня ночью не должно быть проблем."
 supernatural_ev1.13.a_tt:0 "Разведка местности снижает вероятность встречи с охотниками."

# The Trap - Ev1.14
 supernatural_ev1.14.title:0 "Ловушка"
 supernatural_ev1.14.desc:0 "Подготовка была тщательной. Ловушка установлена, скрытая в тенях переулка. Каждый шаг просчитан, каждый риск учтен. Теперь остается лишь ждать, когда подходящий человек угодит в наши сети."
 supernatural_ev1.14.a:0 "План безупречен."
 supernatural_ev1.14.a_tt:0 "С установленной ловушкой нет шансов на нежелательные помехи во время питания."

# Tavern Gossip - Ev1.15
 supernatural_ev1.15.title:0 "Сплетни в таверне"
 supernatural_ev1.15.desc:0 "Пьяный завсегдатай громко рассказывает истории о таинственных исчезновениях в других городах. Толпа в таверне слушает с смесью страха и любопытства. Он винит в этих пропажах существ, скрывающихся в ночи, хотя другие посмеиваются над этой идеей. Вы не можете не ощутить тонкую силу в том, как эта история может быть направлена вами."
 supernatural_ev1.15.a:0 "Я сам сражался с этими тварями."
 supernatural_ev1.15.a_tt:0 "Вы говорите правду о своих тайных битвах, намекая на свою незримую силу."
 supernatural_ev1.15.b:0 "Это просто убийства и воровство, а не легенды."
 supernatural_ev1.15.b_tt:0 "Вы настаиваете на рациональном объяснении, зарабатывая благочестие за свою убежденность."
 supernatural_ev1.15.c:0 "Я, возможно, знаю причину этих исчезновений..."
 supernatural_ev1.15.c_tt:0 "Хитрая улыбка расплывается по вашему лицу. Ирония ваших слов не ускользает от вас."
 
# Hidden Passageway - Ev1.16
 supernatural_ev1.16.title:0 "Тайный проход в погребе"
 supernatural_ev1.16.desc:0 "Исследуя винный погреб под таверной, вы натыкаетесь на скрытый проход, искусно укрытый за грудой пыльных бочек. Легкий запах влажной земли и холод застоявшегося воздуха доносятся из узкого отверстия, намекая на давно забытый путь к внешнему миру.\n\nПроход, кажется, вьется за пределы стен таверны, его тени обещают секретность и безопасность. Если ночное пиршество пойдет не по плану, этот путь отступления может стать разницей между жизнью и смертью. Вы почти слышите эхо отчаянных шагов тех, кто в прошлом мог использовать этот самый путь, чтобы раствориться в ночи.\n\nЗапасной план всегда мудр — особенно для создания ночи."
 supernatural_ev1.16.a:0 "Сохранить это в тайне."
 supernatural_ev1.16.a_tt:0 "Любой вампир знает, как важен запасной путь отступления."
 supernatural_ev1.16.b:0 "Поделиться с остальными."
 supernatural_ev1.16.b_tt:0 "Стоит рассказать гостям об этом пути отступления на случай, если что-то пойдет не так."

# A Moment of Solace - Ev1.17
 supernatural_ev1.17.title:0 "Мгновение покоя"
 supernatural_ev1.17.desc:0 "Прокравшись в узкий переулок за таверной, вы ощущаете, как вас обволакивает прохладный ночной воздух. Приглушенные звуки веселья затихают на заднем плане, оставляя лишь тихий шелест теней.\n\nВы делаете глубокий вдох, чувствуя, как напряжение отступает, и сосредотачиваетесь на том, что ждет впереди — обещание охоты и удовлетворение от скорого пиршества."
 supernatural_ev1.17.a:0 "Насладиться предвкушением охоты."
 supernatural_ev1.17.a_tt:0 "Вы позволяете азарту грядущего пиршества захлестнуть вас, сбрасывая бремя забот."
 supernatural_ev1.17.b:0 "Укрепить решимость перед ночью."
 supernatural_ev1.17.b_tt:0 "Вы собираетесь с силами, обретая сдержанный контроль и готовность к любым испытаниям ночи."
 
# A Test of Restraint - Ev1.18
 supernatural_ev1.18.title:0 "Испытание сдержанности"
 supernatural_ev1.18.desc:0 "Внезапный крик прорезает гул разговоров в таверне. Мужчина хватается за лицо, кровь хлещет из его носа, ее резкий запах переполняет чувства.\n\nИскушение обрушивается, словно молния. Инстинкты вспыхивают, но глубокая решимость удерживает вас. Это испытание — шанс доказать, что ваша сила не в потакании желаниям, а в контроле над ними."
 supernatural_ev1.18.a:0 "Сопротивляться порыву."
 supernatural_ev1.18.a_tt:0 "Вы чувствуете, как сила вашей крови возрастает, когда вы укрощаете голод."
 supernatural_ev1.18.b:0 "Укрепить решимость."
 supernatural_ev1.18.b_tt:0 "Ваша двойственная природа крепнет, когда вы противостоите искушению крови."

# A Moment of Respect - Ev1.19
 supernatural_ev1.19.title:0 "Мгновение уважения"
 supernatural_ev1.19.desc:0 "Бродя по темным переулкам, вы натыкаетесь на безжизненное тело, привалившееся к стене. Запах свежей крови всё ещё витает в воздухе, а из складок одежды поблескивает золото.\n\nСегодня ночь для охоты, но вас охватывает чувство торжественной скорби. Эта душа встретила свой конец — возможно, лучше оставить её в покое."
 supernatural_ev1.19.a:0 "Выказать уважение и пройти мимо."
 supernatural_ev1.19.a_tt:0 "Вы сопротивляетесь соблазну ограбить мертвеца, ощущая торжественное достоинство."

# Whispers In The Dark - Ev1.20
 supernatural_ev1.20.title:0 "Шепот в темноте"
 supernatural_ev1.20.desc:0 "Последний луч заходящего солнца угасает, когда вы проскальзываете в темный переулок. Шум оживленного города окружает вас — скрип телег, крики торговцев, эхо шагов по булыжникам.\n\nСквозь гам вы улавливаете приглушенные голоса двух фигур. Они жмутся друг к другу, торопливо говоря о людях, что обращаются в зверей, когда восходит луна. Их слова почти теряются в шуме, но, возможно, вы сумеете отфильтровать гул и узнать больше."
 supernatural_ev1.20.a:0 "Сосредоточиться и внимательно слушать."
 supernatural_ev1.20.a_tt:0 "Вы пытаетесь выделить их разговор из фонового шума."
 supernatural_ev1.20.a_success_tt:0 "Вам удается расслышать их шепот, получив ценные сведения о возможных угрозах."
 supernatural_ev1.20.a_fail_tt:0 "Вы не можете разобрать их разговор, и ваши усилия привлекают нежелательное внимание."
 supernatural_ev1.20.b:0 "Игнорировать их и двигаться дальше."
 supernatural_ev1.20.b_tt:0 "Вы решаете не тратить время и продолжаете свои поиски."
 
# Wary Citizens - Ev1.21
 supernatural_ev1.21.title:0 "Настороженные горожане"
 supernatural_ev1.21.desc:0 "Когда последний луч заходящего солнца исчезает, тени в узком переулке удлиняются. Обычный шум оживленного города сменяется зловещей тишиной, нарушаемой лишь шорохом крыс и далеким гулом веселья.\n\nВаше внимание привлекает фигура — настороженный горожанин, спешащий вперед и оглядывающийся через плечо. Что-то в нем кажется необычным, словно он *знает*, что этой ночью что-то скрывается во тьме."
 supernatural_ev1.21.a:0 "Доверять инстинктам и следовать бесшумно."
 supernatural_ev1.21.a_tt:0 "Вы полагаетесь на свои сверхъестественные чувства, чтобы оставаться незаметным в тенях."
 supernatural_ev1.21.b:0 "Использовать знание окрестностей."
 supernatural_ev1.21.b_tt:0 "Благодаря предварительной разведке хозяина, вы знаете все слепые углы и тайные тропы в этом районе. Вы внимательно анализируете цель, готовясь использовать любые уязвимости."
 supernatural_ev1.21.c:0 "Хорошо, что ловушка уже готова."
 supernatural_ev1.21.c_tt:0 "Вы готовите засаду, затрудняя добыче побег."
 supernatural_ev1.21.d:0 "Нет никаких тварей здесь, друг, только крысы."
 supernatural_ev1.21.d_tt:0 "Вы выступаете уверенно, отводя любые подозрения своей решительностью."

# Whispers of Danger - Ev1.22
 supernatural_ev1.22.title:0 "Шепот опасности"
 supernatural_ev1.22.desc:0 "Цель замирает, словно холодный озноб предупреждает ее о надвигающейся угрозе. Плохо освещенные углы переулка становятся еще темнее, и зловещая тишина окутывает окрестности. Глаза человека мечутся, мышцы напрягаются, готовые к рывку при малейшем звуке опасности."
 supernatural_ev1.22.a:0 "Сократить расстояние с вампирской скоростью."
 supernatural_ev1.22.a_tt:0 "Ваш уровень мастерства оттачивает рефлексы."
 supernatural_ev1.22.b:0 "Использовать обнаруженную слабость."
 supernatural_ev1.22.b_tt:0 "Вы точно знаете, как загнать их в угол."
 supernatural_ev1.22.c:0 "Активировать ловушку, не оставив шансов на побег."
 supernatural_ev1.22.c_tt:0 "Ловушка захлопывается, запечатывая их судьбу."
 supernatural_ev1.22.d:0 "Наступать смело, ощущая их страх."
 supernatural_ev1.22.d_tt:0 "Вы упиваетесь противостоянием, уверенные в своей силе."

# The Crimson Decision - Ev1.23
 supernatural_ev1.23.title:0 "Алый выбор"
 supernatural_ev1.23.desc:0 "Человек дрожит перед вами, его сердцебиение — неистовый барабан в ваших ушах. Страх в его венах почти осязаем, каждый удар сердца — словно яркий маяк для вас.\n\nНаступает момент истины: как вы утолите свой голод этой ночью?"
 supernatural_ev1.23.a:0 "Выпить их досуха, смакуя каждую каплю."
 supernatural_ev1.23.a_tt:0 "Вы предаетесь полному наслаждению, невзирая на последствия."
 supernatural_ev1.23.b:0 "Взять ровно столько, чтобы утолить голод."
 supernatural_ev1.23.b_tt:0 "Вы оставляете их в живых, едва помнящих о встрече."
 supernatural_ev1.23.c:0 "Взять лишь малую толику и отступить."
 supernatural_ev1.23.c_tt:0 "Вы проявляете дисциплину, питаясь с осторожностью."
 supernatural_ev1.23.d:0 "Использовать тайный путь отступления."
 supernatural_ev1.23.d_tt:0 "Вы растворяетесь в ночи, не оставив следов."
 supernatural_ev1.23.e:0 "Питаться и затем ограбить их."
 supernatural_ev1.23.e_tt:0 "Вы находите несколько монет в их карманах."
 supernatural_ev1.23.f:0 "Богатая цель приносит больше, чем просто кровь."
 supernatural_ev1.23.f_tt:0 "Вы облегчаете их кошель на значительную сумму."
 supernatural_ev1.25.title:0 "Кровоточащий дом"
 supernatural_ev1.25.desc:0 "В переулке, окутанном густым туманом, захолустный лекарь занимается своим ремеслом при свечах, переливая кровь из больных в медные чаши и продавая дурные напитки любому, кто согласится купить. Воздух насыщен железным привкусом крови, и никто здесь не считает чаши."
 supernatural_ev1.25.a:0 "Пейте из чаш — ни жертв, ни следов."
 supernatural_ev1.25.a_tt:0 "Осторожный глоток не оставляет следов и не вызывает вопросов. Ваша охота становится более безопасной."
 supernatural_ev1.25.b:0 "Питайтесь пациентом, получающим успокоительное."
 supernatural_ev1.25.b_tt:0 "Слабые и бесчувственные, они не могут бороться, но исчезнувшего пациента могут искать."
 supernatural_ev1.26.title:0 "Бред пьяницы"
 supernatural_ev1.26.desc:0 "Пьяный горожанин приваливается к стойке бара, болтливый и жаждущий поболтать: о том, какие сторожа берут деньги, какие дома стоят пустыми, а по каким переулкам стражник никогда не ходит. Полезные вещи, выплескивающиеся из неосторожных уст."
 supernatural_ev1.26.a:0 "Заставь его сделать то, что он знает."
 supernatural_ev1.26.a_tt:0 "Его пьяные секреты раскрывают секретные зоны района. Ваша охота становится более безопасной."
 supernatural_ev1.26.b:0 "Выпей,а потом дай ему сбится."
 supernatural_ev1.26.b_tt:0 "Тихий глоток; он просыпается с головной болью, и ничего больше."


### added by sync_localizations.py -- untranslated, 5 keys
 supernatural_ev1.01.desc_sire:0 "The courier will not hand it to anyone but me, and will not leave until he has watched me read it.\n\nI know the hand before I know the seal. [host.GetName] made me what I am, and has never once had to ask me twice for anything.\n\nIt is not phrased as a summons. It does not need to be — we both know what it is, and we both know I will be there. There is a kind of courtesy in pretending otherwise, and I find I am grateful for it.\n\nBurn after reading, it says at the bottom. They taught me that."
 supernatural_ev1.01.desc_progeny:0 "The courier will not hand it to anyone but me, and will not leave until he has watched me read it.\n\nIt is from [host.GetName]. I made them — I remember the night, and I remember how badly they took the first year.\n\nNow they are hosting, and writing to me about it in careful language, the way someone writes when they want very much to be thought of as an equal. I could go and watch them do it properly. I find that I want to.\n\nBurn after reading, it says at the bottom. Good. They were listening."
 supernatural_ev1.01.desc_known:0 "The courier does not lower his eyes the way couriers used to. Everyone in this hall knows what I am; there has been no point pretending since the business last winter.\n\n[host.GetName] knows it too, and has written to me anyway — an invitation to a quiet evening and a matter of appetite. From someone with nothing left to hide, to someone else who is running out of places to put it.\n\nBurn after reading, it says at the bottom. A habit now, more than a precaution."
 supernatural_ev1.01.b:0 "Burn it, and forget the courier's face."
 supernatural_ev1.01.b.tt:0 "Refuse. They took a risk putting this in writing."
