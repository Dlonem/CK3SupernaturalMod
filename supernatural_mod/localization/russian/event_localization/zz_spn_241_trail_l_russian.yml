l_russian:

 ############################################################
 # Supernatural 2.41 -- the trail and the hunt (WORK-ORDER-2.41 §1-§2)
 # Events: events/supernatural_events/zz_spn_241_trail_events.txt
 ############################################################

 # ==========================================================
 # spn_hunt.0402 -- The Trail Leads Home
 # ==========================================================
 spn_hunt.0402.t:0 "След ведёт домой"
 spn_hunt.0402.desc_who:0 "[spn_trailsman.GetTitledFirstName] не садится. «Я шёл по следу смертей в [spn_menace_county.GetName], — говорит [spn_trailsman.GetSheHe]. — Они ведут сюда. К тебе».\n\n[spn_trailsman.GetSheHe|U] никому больше не сказал. Пока."
 spn_hunt.0402.desc_where:0 "[spn_trailsman.GetTitledFirstName] указывает пальцем на карту. «[spn_menace_county.GetName]. Там умирают люди, и я не знаю, что это делает».\n\nТы знаешь. Это был ты. [spn_trailsman.GetSheHe|U] хорош в своём деле, и [spn_trailsman.GetSheHe] подбирается всё ближе."
 spn_hunt.0402.a:0 "Тогда пусть знают, кто я"
 spn_hunt.0402.a.tt:0 "Твоя тайна раскрыта. Все узнают, кто ты такой."
 spn_hunt.0402.b:0 "Ты забудешь то, что нашёл"
 spn_hunt.0402.b.tt:0 "Ты сгибаешь разум [spn_trailsman.GetTitledFirstName]. [spn_trailsman.GetSheHe|U] не вспомнит этого и пять лет не назовёт тебя снова."
 spn_hunt.0402.c:0 "Это был [spn_tlh_neighbour.GetFirstName]. Посмотри ещё раз."
 spn_hunt.0402.c.tt:0 "Вина за [spn_menace_county.GetName] переходит на [spn_tlh_neighbour.GetTitledFirstName]."
 spn_hunt.0402.d:0 "Спросить, где [spn_tlh_rival.GetFirstName] был той ночью"
 spn_hunt.0402.d.tt:0 "Ты пытаешься натравить [spn_trailsman.GetTitledFirstName] на своего соперника [spn_tlh_rival.GetTitledFirstName], который тоже существо. Если получится, вина будет [spn_tlh_rival.GetHerHis], и [spn_tlh_rival.GetSheHe] узнает, что кто-то назвал [spn_tlh_rival.GetHerHim]."
 spn_hunt.0402.d.success:0 "[spn_trailsman.GetSheHe|U] тебе верит"
 spn_hunt.0402.d.failure:0 "[spn_trailsman.GetSheHe|U] тебе не верит, и теперь [spn_trailsman.GetSheHe] следит за тобой"
 spn_hunt.0402.e:0 "У [spn_tlh_mortal.GetFirstName] повадки чудовища"
 spn_hunt.0402.e.tt:0 "Ты пытаешься свалить всё на [spn_tlh_mortal.GetTitledFirstName], который вовсе не существо. Такое труднее приклеить."
 spn_hunt.0402.e.success:0 "[spn_trailsman.GetSheHe|U] тебе верит"
 spn_hunt.0402.e.failure:0 "[spn_trailsman.GetSheHe|U] не верит ни единому слову, и теперь [spn_trailsman.GetSheHe] следит за тобой"
 spn_hunt.0402.f:0 "Держи это при себе — и этот кошель тоже"
 spn_hunt.0402.f.tt:0 "[spn_trailsman.GetTitledFirstName] получает плату за молчание. Теперь [spn_trailsman.GetSheHe|U] точно знает, кто ты такой."
 spn_hunt.0402.g:0 "Я сам за собой приберу"
 spn_hunt.0402.g.tt:0 "Твой след в [spn_menace_county.GetName] остывает. Ты на год затаиваешься."
 spn_hunt.0402.h:0 "Ты слишком хорошо делаешь свою работу"
 spn_hunt.0402.h.tt:0 "[spn_trailsman.GetTitledFirstName] умирает. Это будет похоже на убийство, потому что это убийство."
 spn_hunt.0402.i:0 "Найди, за кем ещё следить"
 spn_hunt.0402.i.tt:0 "[spn_trailsman.GetTitledFirstName] уволен. [spn_trailsman.GetSheHe|U] уносит с собой то, что [spn_trailsman.GetSheHe] знает."
 spn_hunt.0402.j:0 "Тогда я буду осторожнее"
 spn_hunt.0402.j.tt:0 "Ничего не меняется. [spn_trailsman.GetSheHe|U] продолжает искать."

 # ==========================================================
 # spn_hunt.0700 -- Not a Monster (a human trail, found)
 # ==========================================================
 spn_hunt.0700.t:0 "Не чудовище"
 spn_hunt.0700.desc:0 "След обрывается у двери [spn_culprit.GetTitledFirstName]. Ни зубов, ни когтей, ни заклинаний. Только нож и тот, кто им пользуется.\n\n[spn_culprit.GetSheHe|U] знает, кто ты. [spn_culprit.GetSheHe|U] тебя боится."
 spn_hunt.0700.a:0 "Я не охочусь на людей"
 spn_hunt.0700.a.tt:0 "Ты отпускаешь [spn_culprit.GetHerHim]. Господин [spn_hunt_county.GetName] узнаёт, что [spn_culprit.GetSheHe] сделал."
 spn_hunt.0700.b:0 "Чудовище есть чудовище"
 spn_hunt.0700.b.tt:0 "Ты убиваешь [spn_culprit.GetTitledFirstName]."
 spn_hunt.0700.c:0 "Пусть с [spn_culprit.GetHerHim] разбирается [spn_culprit.GetHerHis] господин"
 spn_hunt.0700.c.tt:0 "[spn_culprit.GetTitledFirstName] брошен в подземелье [spn_hunt_county.GetHolder.GetTitledFirstName]."

 # ==========================================================
 # spn_hunt.0705 -- There Is Another One ("all of them")
 # ==========================================================
 spn_hunt.0705.t:0 "Есть ещё один"
 spn_hunt.0705.desc:0 "Один покончен. Но на этом следе были отпечатки двух видов, и [spn_ct_next.GetTitledFirstName] всё ещё в [spn_hunt_county.GetName]."
 spn_hunt.0705.a:0 "Я сейчас же иду за [spn_ct_next.GetHerHim]"
 spn_hunt.0705.a.tt:0 "Схватка. Победишь — и [spn_ct_next.GetSheHe] тоже умрёт. Проиграешь — будешь ранен."
 spn_hunt.0705.a.success:0 "[spn_ct_next.GetSheHe|U] умирает"
 spn_hunt.0705.a.failure:0 "[spn_ct_next.GetSheHe|U] уходит, оставив тебя истекать кровью"
 spn_hunt.0705.b:0 "Не сегодня"

 # ==========================================================
 # spn_hunt.0710 -- It Has Gone
 # ==========================================================
 spn_hunt.0710.t:0 "Оно ушло"
 spn_hunt.0710.desc:0 "Некоторые знаки в [spn_hunt_county.GetName] старые. [spn_ct_offer.GetTitledFirstName] убивал и здесь, а потом ушёл. Ты можешь понять, по какой дороге."
 spn_hunt.0710.desc_origin:0 "Самые старые знаки в [spn_hunt_county.GetName] — следы [spn_ct_offer.GetTitledFirstName]. [spn_ct_offer.GetSheHe|U] начал всё это, и [spn_ct_offer.GetSheHe] ушёл до твоего прихода. Ты можешь понять, по какой дороге."
 spn_hunt.0710.a:0 "Тогда я пойду за [spn_ct_offer.GetHerHim]"
 spn_hunt.0710.a.tt:0 "Ты начинаешь [spn_cold_trail|E]. В каждом графстве ты можешь его потерять."
 spn_hunt.0710.b:0 "Отпустить [spn_ct_offer.GetHerHim]"

 # ==========================================================
 # spn_hunt.0711 -- Was Here
 # ==========================================================
 spn_hunt.0711.t:0 "Здесь был [spn_ct_quarry.GetFirstName]"
 spn_hunt.0711.desc_first:0 "Дорога прочь хранит знаки, если уметь их читать. [spn_ct_quarry.GetTitledFirstName] ушёл в сторону [spn_ct_where.GetName]."
 spn_hunt.0711.desc:0 "Трактирщик помнит [spn_ct_quarry.GetHerHim]. Платил монетой, ничего не ел, ушёл до рассвета. В сторону [spn_ct_where.GetName]."
 spn_hunt.0711.desc_lost:0 "Ты потерял целый сезон на ложном следе, прежде чем снова нашёл настоящий. Он ведёт в сторону [spn_ct_where.GetName]."
 spn_hunt.0711.a:0 "Я еду дальше"
 spn_hunt.0711.a.tt:0 "Теперь след указывает на [spn_ct_where.GetName]. [supernatural_hunt|E] там может найти [spn_ct_quarry.GetHerHim]."
 spn_hunt.0711.b:0 "Хватит. Отпустить [spn_ct_quarry.GetHerHim]."

 # ==========================================================
 # spn_hunt.0712 -- Lost
 # ==========================================================
 spn_hunt.0712.t:0 "Потерян"
 spn_hunt.0712.desc:0 "Следы обрываются у реки, на людной дороге или вовсе посреди ничего. [spn_ct_quarry.GetTitledFirstName] исчез, и ты не знаешь куда."
 spn_hunt.0712.a:0 "В следующий раз."

 # ==========================================================
 # spn_hunt.0715 -- Someone Is Following You
 # ==========================================================
 spn_hunt.0715.t:0 "За тобой кто-то идёт"
 spn_hunt.0715.desc:0 "В последнем трактире о тебе расспрашивал незнакомец. [spn_ct_hunter.GetTitledFirstName], охотник. Отстаёт на два дня, а может, и меньше."
 spn_hunt.0715.desc_long:0 "[spn_ct_hunter.GetTitledFirstName] идёт за тобой уже через три графства. [spn_ct_hunter.GetSheHe|U] не остановится."
 spn_hunt.0715.a:0 "Я оставлю ложный след"
 spn_hunt.0715.a.tt:0 "Когда [spn_ct_hunter.GetSheHe] в следующий раз прочтёт твой след, он укажет не туда. Мастер-охотник может это раскусить."
 spn_hunt.0715.b:0 "Я направлю [spn_ct_hunter.GetHerHim] на [spn_ct_rival.GetFirstName]"
 spn_hunt.0715.b.tt:0 "[spn_ct_hunter.GetTitledFirstName] идёт вместо тебя за [spn_ct_rival.GetTitledFirstName]."
 spn_hunt.0715.c:0 "Я заставлю трактирщика забыть меня"
 spn_hunt.0715.c.tt:0 "Никто не помнит, что ты проходил. [spn_ct_hunter.GetSheHe|U] не найдёт твой след в следующий раз."
 spn_hunt.0715.d:0 "Я затаюсь"
 spn_hunt.0715.d.tt:0 "Ты на год затаиваешься. Твои следы остывают."
 spn_hunt.0715.e:0 "Я вернусь назад и подожду [spn_ct_hunter.GetHerHim]"
 spn_hunt.0715.e.tt:0 "[spn_ct_hunter.GetSheHe|U] найдёт тебя, а ты будешь готов. [spn_ct_hunter.GetSheHe|U] будет драться в невыгодном положении."
 spn_hunt.0715.f:0 "Я продолжу путь"
 spn_hunt.0715.f.tt:0 "Ничего не меняется. [spn_ct_hunter.GetSheHe|U] ещё может тебя потерять."
 spn_hunt.0715.g:0 "Пусть [spn_ct_hunter.GetHerHim] приходит"
 spn_hunt.0715.g.tt:0 "Ты перестаёшь прятаться. [spn_ct_hunter.GetSheHe|U] тебя найдёт."

 # ==========================================================
 # spn_hunt.0716 -- A Stranger Asks About the Dead (a human trail's killer)
 # ==========================================================
 spn_hunt.0716.t:0 "Незнакомец расспрашивает о мёртвых"
 spn_hunt.0716.desc:0 "В таверне говорят: в [spn_hunt_county.GetName] появился охотник и расспрашивает о мёртвых. [spn_hunter.GetTitledFirstName]. [spn_hunter.GetSheHe|U] охотится на чудовищ, в основном.\n\nВ основном."
 spn_hunt.0716.a:0 "Я уйду, пока [spn_hunter.GetSheHe] меня не нашёл"
 spn_hunt.0716.a.tt:0 "Ты на год затаиваешься. След остывает."
 spn_hunt.0716.b:0 "Я остаюсь. Пусть [spn_hunter.GetHerHim] ищет."
 spn_hunt.0716.c:0 "Я заплачу [spn_hunter.GetHerHim], чтобы искал в другом месте"
 spn_hunt.0716.c.tt:0 "[spn_hunter.GetSheHe|U] берёт деньги и уезжает домой."

 # ==========================================================
 # spn_hunt.0717 -- Someone Named You
 # ==========================================================
 spn_hunt.0717.t:0 "Кто-то назвал тебя"
 spn_hunt.0717.desc:0 "До тебя доходит слух, что Следопыту назвали твоё имя. Кто-то навёл на тебя [spn_trailsman.GetTitledFirstName], и ты не знаешь кто."
 spn_hunt.0717.a:0 "Тогда я буду готов"

 # ==========================================================
 # The hunt -- Cold Trail, human outcomes, quarry option
 # ==========================================================
 spn_hunt.0111.b:0 "Я иду по нему"
 spn_hunt.0111.b.tt:0 "Ты начинаешь [spn_cold_trail|E] за [spn_culprit.GetTitledFirstName]. В каждом графстве ты можешь его потерять."

 spn_hunt.0300.desc_human_slain:0 "Дело сделано. Убийца из [spn_hunt_county.GetName] мёртв. Это был человек, а не существо, и графству, в общем, всё равно."
 spn_hunt.0300.desc_human_jailed:0 "Убийца из [spn_hunt_county.GetName] сидит в подземелье господина. Что будет дальше — дело господина."
 spn_hunt.0300.desc_human_spared:0 "Ты отпустил убийцу и рассказал всё господину. Пусть [spn_hunt_county.GetName] само разбирается со своими."

 spn_hunt_conclusion_human_slain:0 "Это был человек. Ты всё равно его убил. В графстве тихо."
 spn_hunt_conclusion_human_jailed:0 "Это был человек, и теперь этот человек в подземелье. В графстве тихо."
 spn_hunt_conclusion_human_spared:0 "Это был человек. Ты не охотишься на людей. Господин знает, кто это был."

 spn_hunt_location_your_own_trail_tt:0 "Единственный, кого можно винить за этот след, — ты сам"

 spn_hunt_quarry:0 "Добыча"
 spn_hunt_quarry_lead:0 "Тот, кого винят"
 spn_hunt_quarry_lead_desc:0 "Охотиться на того, кого графство винит больше всех."
 spn_hunt_quarry_other:0 "Другой"
 spn_hunt_quarry_other_desc:0 "Охотиться на следующего по следу, а не на того, кого винит графство.\n\nНужен мастер-охотник."
 spn_hunt_quarry_all:0 "Все они"
 spn_hunt_quarry_all_desc:0 "Охотиться на того, кого винят, а затем на всех остальных по следу, кто ещё в графстве.\n\nНужен мастер-охотник."
 spn_hunt_quarry_needs_expert_tt:0 "Нужен мастер-охотник: 75 опыта охоты на чудовищ или Истинный охотник на чудовищ"

 spn_hunt_tag_kind_human:0 "#positive_value + Нож, а не зубы#! (Знак)\n"
 spn_hunt_tag_mixed:0 "#negative_value - Их больше одного#! (Знак)\n"
 spn_hunt_tag_mixed_origin:0 "#positive_value + Ты знаешь, кто это начал#! (Знак)\n"
 spn_hunt_tag_cold_trail:0 "#positive_value ++ Тот, за кем ты идёшь#! (Остывший след)\n"

 spn_trails_row_kind_human:0 "Оставил: человек"

 spn_hunt.0001.desc_human:0 "Священник [spn_menace_county.GetName] хоронит уже третьего за этот сезон. Ни зубов, ни когтей. Каждый раз нож, и каждый раз у убитого была причина бояться. Кто-то в [spn_menace_county.GetName] убивает людей, и ему это сходит с рук."
 spn_hunt.0100.desc_human:0 "В [spn_hunt_county.GetName] хоронят людей, и могильщик рассказывает тебе, как они умерли: нож, удавка, толчок с лестницы. Ничто из того, на кого ты охотишься, так не убивает. Это сделал человек."
 spn_hunt.0102.desc_human:0 "Могильщик позволяет тебе посмотреть. Чистые раны — такие оставляет клинок. Ни зверь, ни что-то из преисподней этого не делали. Просто человек, осторожный и ещё не закончивший."

 # The concept
 game_concept_spn_cold_trail:0 "Остывший след"
 game_concept_spn_cold_trails:0 "Остывшие следы"
 game_concept_spn_cold_trail_desc:0 "Опытный охотник может идти за существом, покинувшим графство, от графства к графству. На каждом шаге его можно потерять. Существо может прослышать о тебе и ответить: оставить ложный след, навести тебя на кого-то другого, затаиться или подстеречь тебя.\n\nПока ты идёшь по следу, [supernatural_hunt|E] в графстве, на которое указывает след, находит твою добычу."

 # ==========================================================
 # OLD GRAVES (spn_hunt.0403) -- 2.41 boot 7
 # ==========================================================
 spn_hunt.0403.t:0 "Старые могилы"
 spn_hunt.0403.desc_open:0 "[spn_trailsman.GetFirstName] не нашёл в [spn_old_trail_county.GetName] ничего нового. Но старики там помнят дурное время — [spn_old_trail_years.GetValue|0] лет назад.\n\n"
 spn_hunt.0403.desc_vampire:0 "Тела, в которых не осталось крови."
 spn_hunt.0403.desc_werewolf:0 "Разорванные тела, всегда около полнолуния."
 spn_hunt.0403.desc_witch:0 "Смерти без единой отметины и разговоры о ведьме."
 spn_hunt.0403.desc_demon:0 "Пожары, которые не удавалось потушить, и люди, продавшие что-то, чему не знали имени."
 spn_hunt.0403.desc_human:0 "Убийства. За них так никого и не повесили."
 spn_hunt.0403.desc_unknown:0 "Смерти, которые никто не мог объяснить."
 spn_hunt.0403.desc_blamed_alive:0 "\n\nОни до сих пор говорят, что это был [spn_old_trail_culprit.GetTitledFirstName]."
 spn_hunt.0403.desc_blamed_dead:0 "\n\nОни говорили, что это был [spn_old_trail_culprit.GetTitledFirstName], которого уже нет в живых."
 spn_hunt.0403.desc_blamed_nobody:0 "\n\nНикто не может сойтись на том, кто это был."
 spn_hunt.0403.a:0 "Записать."
 spn_hunt.0403.a.tt:0 "Сейчас там охотиться не на кого. Если всё начнётся снова, ты будешь знать, что искать."

 # The yearly census line (debug.log). Not shown to players.
 spn_trail_census_log:0 "Перепись сверхъестественных следов: живых [GetGlobalVariable( 'spn_tc_live' ).GetValue|0] (человек [GetGlobalVariable( 'spn_tc_live_human' ).GetValue|0], смешанных [GetGlobalVariable( 'spn_tc_live_mixed' ).GetValue|0]), графств когда-либо [GetGlobalVariable( 'spn_tc_history' ).GetValue|0], носителей [GetGlobalVariable( 'spn_tc_bearers' ).GetValue|0], идущих охот [GetGlobalVariable( 'spn_hunts_running' ).GetValue|0], лагерей охотников [GetGlobalVariable( 'spn_tc_camps' ).GetValue|0] | с начала: вышли на дорогу [GetGlobalVariable( 'spn_tc_road' ).GetValue|0], меток [GetGlobalVariable( 'spn_tc_marks' ).GetValue|0], открыто [GetGlobalVariable( 'spn_tc_opened' ).GetValue|0], остыло [GetGlobalVariable( 'spn_tc_cleared' ).GetValue|0], охот [GetGlobalVariable( 'spn_tc_hunts' ).GetValue|0] | итоги: убит [GetGlobalVariable( 'spn_tc_out_slain' ).GetValue|0], охотник побеждён [GetGlobalVariable( 'spn_tc_out_hunter_beaten' ).GetValue|0], бежал [GetGlobalVariable( 'spn_tc_out_fled' ).GetValue|0], отступил [GetGlobalVariable( 'spn_tc_out_withdrew' ).GetValue|0], остыл [GetGlobalVariable( 'spn_tc_out_cold' ).GetValue|0], изгнан [GetGlobalVariable( 'spn_tc_out_exorcised' ).GetValue|0], сделка [GetGlobalVariable( 'spn_tc_out_bargained' ).GetValue|0], подкуп [GetGlobalVariable( 'spn_tc_out_bought' ).GetValue|0], принуждён [GetGlobalVariable( 'spn_tc_out_compelled' ).GetValue|0], ведьма [GetGlobalVariable( 'spn_tc_out_witch' ).GetValue|0], убит подставной [GetGlobalVariable( 'spn_tc_out_proxy_slain' ).GetValue|0], убит человек [GetGlobalVariable( 'spn_tc_out_human_slain' ).GetValue|0], пощажён [GetGlobalVariable( 'spn_tc_out_human_spared' ).GetValue|0], заточён [GetGlobalVariable( 'spn_tc_out_human_jailed' ).GetValue|0], отменено [GetGlobalVariable( 'spn_tc_out_aborted' ).GetValue|0]"
