l_russian:
 spn_council_seats_distinct_tt:0 "Никто в Гностическом Совете не занимает два места"
 spn_order.0140.c:0 "Ещё нет. Я иду другим путём"
 spn_order.0140.c.tt:0 "Твоё обучение завершено, и тебя ещё могут возвести в Медикумы. Ты не становишься Магом, так что пути Колдуна и Истинной ведьмы остаются для тебя открытыми."
 spn_council_dedupe_toast:0 "Ты отказался от места в совете"
 spn_council_dedupe_keeper_tt:0 "Никто не может занимать два места в Гностическом Совете. Ты сохранил кресло и отказался от места Хранителя Реликвария."
 spn_council_dedupe_adeptus_tt:0 "Никто не может занимать два места в Гностическом Совете. Ты сохранил более высокое место и отказался от места Адептуса Майора."
 spn_council_dedupe_chancellor_tt:0 "Никто не может занимать два места в Гностическом Совете. Ты сохранил более высокое место и отказался от места Канцлера."
