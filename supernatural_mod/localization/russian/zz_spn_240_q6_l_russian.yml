l_russian:
 spn_hide.2100.t:0 "Через поле"
 spn_hide.2100.desc:0 "Сквозь дым и давку людей ты чуешь её: другую шкуру, которую носит [spn_hduel_other.GetShortUIName]. Она тоже тебя почуяла."
 spn_hide.2100.a:0 "Вцепиться в горло."
 spn_hide.2100.b:0 "Измотать."
 spn_hide.2100.c:0 "Ускользнуть в гущу боя."
 spn_hide.2101.t:0 "Оно идёт за тобой"
 spn_hide.2101.desc:0 "[spn_hduel_other.GetShortUIName|U] идёт через поле к тебе, и люди между вами расступаются."
 spn_hide.2101.throat:0 "Оно метит тебе в горло."
 spn_hide.2101.a:0 "Встретить лицом к лицу."
 spn_hide.2101.b:0 "Стоять на месте."
 spn_hide.2101.c:0 "Оторваться."
 spn_hide.2102.t:0 "Оно бежит"
 spn_hide.2102.desc:0 "Другая шкура отвернулась от тебя и теряется в битве. [spn_hduel_other.GetShortUIName|U] пытается уйти, прежде чем ты доберёшься до [spn_hduel_other.GetHerHim]."
 spn_hide.2102.hurt:0 " [spn_hduel_other.GetSheHe|U] уже ранен."
 spn_hide.2102.a:0 "Загнать."
 spn_hide.2102.b:0 "Let it go."
 spn_hide.2103.t:0 "Твой волк увидел другого"
 spn_hide.2103.desc:0 "С передовой возвращается всадник. [spn_hduel_a.GetShortUIName|U] увидел на поле другую шкуру, которую носит [spn_hduel_b.GetShortUIName], и сдерживает волка, пока ты не дашь слово."
 spn_hide.2103.a:0 "Let [spn_hduel_a.GetHerHim] go."
 spn_hide.2103.a.tt:0 "[spn_hduel_a.GetShortUIName|U] идёт за другой шкурой. Если [spn_hduel_a.GetSheHe] проиграет, [spn_hduel_a.GetSheHe] может не вернуться."
 spn_hide.2103.b:0 "Отозвать [spn_hduel_a.GetHerHim]."
 spn_hide.2103.b.tt:0 "[spn_hduel_a.GetShortUIName|U] не идёт за ней."
 spn_hide_duel_sees_silverback:0 "Это Серебряная Спина, серая как дым и крупнее, чем имеет право быть любой волк."
 spn_hide_duel_sees_timber:0 "Это Бурелом, бурый, как кора. Ты видишь его только потому, что он тебе позволил."
 spn_hide_duel_sees_tundra:0 "Это Тундра, белая как снег, и она смотрит на тебя, а не на битву."
 spn_hide_duel_sees_graybeard:0 "Это Седобородый, пепельно-серый и в шрамах, и он за весь день не отступил ни на шаг."
 spn_hide_duel_sees_midnight:0 "Это Полночь, чёрная, и она идёт сквозь строй, будто строя нет."
 spn_hide_duel_sees_alpha:0 "Это Альфа, рыжевато-бурый и огромный, и люди вокруг него бьются за него яростнее."
 spn_hide_duel_lean_strong:0 "\n\nТы сильнее. Твоя шкура это знает, и другая тоже."
 spn_hide_duel_lean_even:0 "\n\nНи у кого из вас нет перевеса."
 spn_hide_duel_lean_weak:0 "\n\nОна сильнее, и твоя шкура это знает."
 spn_hide_duel_knight_lean_strong:0 "\n\nТвой [spn_champion|E] сильнее из двоих."
 spn_hide_duel_knight_lean_even:0 "\n\nСилы равны."
 spn_hide_duel_knight_lean_weak:0 "\n\nДругой сильнее."
 spn_hide_duel_wanted:0 "\n\nТы знаешь эту шкуру. По праву она должна храниться у твоей семьи."
 spn_hide_duel_throat_tt:0 "Если ты победишь, она может больше не подняться. Если проиграешь — не поднимешься и ты. Если ты не намного сильнее, без ран тебе не уйти."
 spn_hide_duel_wear_tt:0 "Ты хочешь повалить её, а не убить. Если никто из вас не вцепится в горло, погибнет разве что волк, уже тяжело раненный."
 spn_hide_duel_wear_vs_throat_tt:0 "Она метит тебе в горло. Что бы ты сейчас ни сделал, эта схватка может убить любого из вас."
 spn_hide_duel_slip_tt:0 "Ты пытаешься затеряться среди людей. Она может увидеть, как ты уходишь, и пойти следом."
 spn_hide_duel_break_tt:0 "Ты поворачиваешься и бежишь. Она может тебя догнать, а волк, пойманный при бегстве, дерётся в невыгодном положении."
 spn_hide_duel_chase_tt:0 "Она ещё может от тебя уйти."
 spn_hide_duel_let_go_tt:0 "Она уходит, а ты возвращаешься в битву."
 spn_hide_duel_runner_wounded_tt:0 "Она уже ранена."
 spn_hide_duel_timber_tt:0 "Бурелом умеет исчезать."
 spn_hide_duel_midnight_tt:0 "Полночь не отпускает след."
 spn_hide_duel_slipped_t:0 "Потерян в бою"
 spn_hide_duel_slipped_tt:0 "Ты потерял её в бою."
 spn_hide_duel_leave_won_t:0 "Твой волк вернулся"
 spn_hide_duel_leave_won_tt:0 "[spn_hduel_a.GetShortUIName|U] одолел [spn_hduel_b.GetShortUIName] на поле."
 spn_hide_duel_leave_won_kill_tt:0 "[spn_hduel_a.GetShortUIName|U] убил [spn_hduel_b.GetShortUIName] на поле."
 spn_hide_duel_leave_lost_t:0 "Твой волк вернулся раненым"
 spn_hide_duel_leave_lost_tt:0 "[spn_hduel_b.GetShortUIName|U] взял верх над [spn_hduel_a.GetShortUIName]."
 spn_hide_duel_leave_dead_t:0 "Твой волк не вернулся"
 spn_hide_duel_leave_dead_tt:0 "[spn_hduel_a.GetShortUIName|U] был убит [spn_hduel_b.GetShortUIName] на поле."
 spn_hide_duel_leave_broke_t:0 "Потеряны в бою"
 spn_hide_duel_leave_broke_tt:0 "[spn_hduel_a.GetShortUIName|U] и [spn_hduel_b.GetShortUIName] потеряли друг друга в битве."
 spn_hide.0202.you_escaped:0 "\n\nТы ушёл от неё. Битва сомкнулась за тобой, и когда ты оглянулся, её уже не было."
 spn_hide.0202.they_escaped:0 "\n\nОна ушла от тебя. Битва сомкнулась за ней, и запах ушёл вместе с ней."
 spn_hide.0202.won_kill:0 "\n\nВсё кончается быстро. [spn_hduel_other.GetShortUIName|U] больше не поднимается, и шкура, которую [spn_hduel_other.GetSheHe] носил, теперь твоя."
 spn_hide.0202.won:0 "\n\nТы повалил [spn_hduel_other.GetHerHim] и держал [spn_hduel_other.GetHerHim] так, пока из [spn_hduel_other.GetHerHim] не ушёл весь боевой пыл."
 spn_hide.0202.lost:0 "\n\n[spn_hduel_other.GetSheHe|U] взял над тобой верх. Ты вернулся к своим в крови, а шкура молчит так, как тебе не нравится."
 spn_hide.0202.b:0 "Пусть [spn_hduel_other.GetHerHim] уползает к [spn_hduel_other.GetHerHis] своим."
 spn_hide.0202.b.tt:0 "Шкура думает о тебе лучше. Твои [spn_hide_bond|E] немного крепнут."
 spn_hide.2110.t:0 "Шкура говорит"
 spn_hide.2110.desc_silverback:0 "Перед первым ударом шкура говорит, тихо и ровно. Она будет драться, если придётся. Она хочет, чтобы ты помнил, кто на твоём попечении, и что [spn_hs_other.GetShortUIName] может быть одним из них."
 spn_hide.2110.desc_timber:0 "Перед первым ударом шкура говорит, и она никуда не спешит. Ей всё равно, кто ведёт. Ей важно, чтобы ты вышел из этого на своих ногах."
 spn_hide.2110.desc_tundra:0 "Перед первым ударом шкура говорит, холодно и тихо. Она уже измерила [spn_hs_other.GetShortUIName] и говорит тебе, где [spn_hs_other.GetSheHe] будет медлителен."
 spn_hide.2110.desc_graybeard:0 "Перед первым ударом шкура говорит. Она не спрашивает, победишь ли ты. Она лишь просит, чтобы ты не отступал."
 spn_hide.2110.desc_midnight:0 "Ещё до первого удара шкура уже шевелится под твоей кожей. Она хочет этой схватки. Хочет, чтобы всё было честно, и хочет победить."
 spn_hide.2110.desc_alpha:0 "Перед первым ударом шкура говорит. Стая смотрит, говорит она. Что бы здесь ни случилось, они запомнят, как ты это сделал."
 spn_hide.2110.weaker:0 "\n\nЗатем она говорит ещё одно. [spn_hs_other.GetShortUIName|U] бегает в твоей же стае и слабее тебя. Она не станет драться со слабым волком своей стаи."
 spn_hide.2110.a:0 "Пусть дерётся."
 spn_hide.2110.a.tt:0 "Шкура дерётся вместе с тобой."
 spn_hide.2110.b:0 "Удержать её."
 spn_hide.2110.b.tt:0 "Ты дерёшься как волк, а не как её [spn_champion|E]: сила шкуры в этой схватке не участвует."
 spn_hide.2110.c:0 "Отступить."
 spn_hide.2110.c.tt:0 "Схватки не будет. Отступление стоит тебе 10 [spn_pack_standing|E], а шкура думает о тебе лучше."
 spn_hide_speaks_stood_t:0 "Вызов отменён"
 spn_hide_speaks_stood_tt:0 "[spn_hs_stood.GetShortUIName|U] отступил."
 spn_hide.0010.kin:0 "\n\nОна уже бывала в твоей семье. Она знала эту кровь прежде, чем узнала тебя."
 spn_hide.0010.a.strength_tt:0 "Волки, носившие её до тебя, оставили в ней свою силу. Твоя ликантропия растёт."
 spn_hide.0010.a.strength_perk_tt:0 "Их было трое или больше. Ты получаешь бесплатное очко умения в своём волчьем древе."
