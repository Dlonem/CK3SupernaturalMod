 # Supernatural 2.38 -- debug events (WORK-ORDER-2.38 §23). Console: event spn_debug_events.0400 (to .0419).
 spn_debug_events.0400.t:0 "Отладка: вступить в капитул"
 spn_debug_events.0400.desc:0 "Делает тебя Магом, если ты им ещё не стал, и Медикумом капитула в пределах твоей досягаемости (любого капитула, если такого нет)."
 spn_debug_events.0400.a:0 "Выполнить"
 spn_debug_events.0401.t:0 "Отладка: основать капитул здесь"
 spn_debug_events.0401.desc:0 "Делает тебя Магом, если ты им ещё не стал, и Магусом Храма нового капитула в твоей столице. Вслед за ним — Маска Храма."
 spn_debug_events.0401.a:0 "Выполнить"
 spn_debug_events.0402.t:0 "Отладка: дать мне реликвию"
 spn_debug_events.0402.desc:0 "Создаёт реликвию в твоём инвентаре. Печать Соломона переходит к тебе, если существует; иначе создаётся."
 spn_debug_events.0403.t:0 "Отладка: дать мне страницы"
 spn_debug_events.0403.desc:0 "Переносит к тебе страницу Ваде Маэкум или создаёт её, если её нет в мире. Страница, которая переплетена, сожжена или заключена в шкуру, пропускается."
 spn_debug_events.0404.t:0 "Отладка: задать моё положение"
 spn_debug_events.0404.desc:0 "Задаёт твоё положение в Ордене."
 spn_debug_events.0405.t:0 "Отладка: провести Отбор"
 spn_debug_events.0405.desc:0 "Проводит Отбор этого года прямо сейчас, а вместе с ним — и шествие Сделки."
 spn_debug_events.0405.a:0 "Провести"
 spn_debug_events.0406.t:0 "Отладка: призвать Зеккию"
 spn_debug_events.0406.desc:0 "Открывает тебе имя Зеккии, освобождает её, если она занята, и призывает её."
 spn_debug_events.0406.a:0 "Призвать её"
 spn_debug_events.0407.t:0 "Отладка: сделать мой дом ковеном"
 spn_debug_events.0407.desc:0 "Делает ведьмами тебя и двух взрослых членов твоего дома, а сам дом — ковеном."
 spn_debug_events.0407.a:0 "Выполнить"
 spn_debug_events.0408.t:0 "Отладка: сдвинуть Контракт на год"
 spn_debug_events.0408.desc:0 "Отнимает год у твоего текущего Контракта с книгой."
 spn_debug_events.0408.a:0 "Выполнить"
 spn_debug_events.0409.t:0 "Отладка: перечислить капитулы"
 spn_debug_events.0409.desc:0 "Записывает в game.log всех глав капитулов и сами капитулы."
 spn_debug_events.0409.a:0 "Записать"
 spn_debug_events.0410.t:0 "Отладка: закрыть мои ссуды"
 spn_debug_events.0410.desc:0 "Закрывает все ссуды, которые ты выдал или взял, как если бы прошло три года."
 spn_debug_events.0410.a:0 "Выполнить"
 spn_debug_events.0411.t:0 "Отладка: провести год Ваде"
 spn_debug_events.0411.desc:0 "Проводит годичный проход книги прямо сейчас."
 spn_debug_events.0411.a:0 "Провести"
 spn_debug_events.0412.t:0 "Отладка: провести год моего капитула"
 spn_debug_events.0412.desc:0 "Проживает год твоего капитула прямо сейчас."
 spn_debug_events.0412.a:0 "Провести"
 spn_debug_events.0413.t:0 "Отладка: рак и пятеро добровольцев"
 spn_debug_events.0413.desc:0 "Даёт тебе рак и добавляет ко твоему двору пятерых членов твоего капитула под управлением ИИ, которые пойдут добровольцами."
 spn_debug_events.0413.a:0 "Выполнить"
 spn_debug_events.0414.t:0 "Отладка: убить одного из моих носителей"
 spn_debug_events.0414.desc:0 "Убивает одного из пятерых носителей твоей болезни. Убийцей станет волк при твоём дворе, если он там есть; иначе — ты."
 spn_debug_events.0414.a:0 "Выполнить"
 spn_debug_events.0415.t:0 "Отладка: сделать меня Мастером"
 spn_debug_events.0415.desc:0 "Делает тебя Мастером Ордена и открывает Прерогативу Ордена."
 spn_debug_events.0415.a:0 "Выполнить"
 spn_debug_events.0416.t:0 "Отладка: сделать меня демоном"
 spn_debug_events.0416.desc:0 "Запускает на тебе то же демоническое превращение, что и в Ведьмовщине."
 spn_debug_events.0416.a:0 "Выполнить"
 spn_debug_events.0417.t:0 "Отладка: востребовать мою услугу"
 spn_debug_events.0417.desc:0 "Востребует услугу, которой ты обязан Ордену, прямо сейчас."
 spn_debug_events.0417.a:0 "Выполнить"
 spn_debug_events.0418.t:0 "Отладка: убить Великого Магуса"
 spn_debug_events.0418.desc:0 "Великий Магус умирает."
 spn_debug_events.0418.a:0 "Выполнить"
 spn_debug_events.0419.t:0 "Отладка: Форс Факторум"
 spn_debug_events.0419.desc:0 "Обучает тебя Форс Факторум и сразу взыскивает его цену."
 spn_debug_events.0419.a:0 "Выполнить"
 spn_debug_events.0402.glove:0 "Перчатка"
 spn_debug_events.0402.necrophone:0 "Некрофон"
 spn_debug_events.0402.blade:0 "Зачарованный клинок"
 spn_debug_events.0402.pendant:0 "Подвеска Эха"
 spn_debug_events.0402.powder:0 "Порошок Сокрытия"
 spn_debug_events.0402.mirror:0 "Осколок зеркала"
 spn_debug_events.0402.bell:0 "Колокол Мёртвого Часа"
 spn_debug_events.0402.seal:0 "Печать Соломона"
 spn_debug_events.0403.one:0 "Первая страница"
 spn_debug_events.0403.all:0 "Все четыре"
 spn_debug_events.0404.a:0 "25"
 spn_debug_events.0404.b:0 "50"
 spn_debug_events.0404.c:0 "75"
 spn_debug_events.0404.d:0 "100"
 spn_zecchia_name:0 "Зеккия"
