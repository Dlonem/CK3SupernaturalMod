l_russian:
 # Supernatural 2.42 -- Blood for Blood (zz_spn_242_kin_*.txt).
 spn_bfb.0100.t:0 "Один из наших"
 spn_bfb.0100.desc:0 "[spn_bfb_dead.GetFirstName] мёртв. Не болезнь и не старость. Кто-то, кто знал, кто [spn_bfb_dead.GetSheHe] такой, пошёл искать [spn_bfb_dead.GetHerHim], нашёл [spn_bfb_dead.GetHerHim] и хорошо знал своё дело.\n\nНикто не может сказать мне, кто это был. Те, кто делает такую работу, не оставляют имён."
 spn_bfb.0100.desc_two:0 "[spn_bfb_dead.GetFirstName] мёртв, и не от болезни или старости. Это уже второй из моих, кто ушёл так.\n\nОдин раз — это охотник проездом. Два раза — это кто-то, у кого есть наши имена."
 spn_bfb.0100.desc_three:0 "[spn_bfb_dead.GetFirstName] мёртв. Это уже третий, и каждый раз одинаково — чисто и умело.\n\nЭто не невезение. Кто-то идёт по списку, и я в нём есть."
 spn_bfb.0100.known:0 "Я уже знаю, чья это была рука."
 spn_bfb.0100.known.tt:0 "Ты знаешь имя охотника. Ты можешь ответить [spn_bfb_slayer.GetHerHim] «Кровью за кровь»."
 spn_bfb.0100.a:0 "Найти, кто это сделал."
 spn_bfb.0100.a.tt:0 "Ты начинаешь расспрашивать о том, кто это сделал"
 spn_bfb.0100.b:0 "Кто-то за это ответит."
 spn_bfb.0100.c:0 "Я буду скорбеть. Это всё, что я могу сделать этой ночью."
 spn_bfb.0100.d:0 "Пусть мёртвые покоятся. Больше никакой крови."
 spn_bfb.0110.t:0 "Расспросы"
 spn_bfb.0110.desc:0 "Такое убийство, как у [spn_bfb_dead.GetFirstNamePossessive], оставляет мало следов, но не ничего. Кто-то одолжил коня. Кто-то продал серебро и не спросил зачем. Кого-то поблагодарил тамошний господин, и он уехал дальше.\n\nПотянуть за эту нить можно по-разному, и ни один способ не надёжен."
 spn_bfb.0110.a:0 "У моего тайного советника там есть люди."
 spn_bfb.0110.b:0 "Кто-то это видел. Он заговорит."
 spn_bfb.0110.b.tt:0 "Ты узнаешь имя охотника"
 spn_bfb.0110.c:0 "Я пойду и расспрошу сам."
 spn_bfb.0110.d:0 "Хватит. Знание ничего бы не изменило."
 spn_bfb_name_found_toast:0 "У тебя есть имя"
 spn_bfb_name_not_found_toast:0 "В этом году ничего"
 spn_bfb.0200.t:0 "За тобой пришли"
 spn_bfb.0200.desc:0 "Я достаточно долго занимаюсь этой работой, чтобы понять, когда следят за мной. [spn_bfb_avenger.GetFirstName] и не пытался это скрыть. [spn_bfb_avenger.GetSheHe|U] хотел, чтобы я знал.\n\n[spn_bfb_avenger.GetSheHe|U] теперь стоит посреди дороги, один, и произносит имя. Я его помню. Я помню их всех. «Тот был моим», — говорит [spn_bfb_avenger.GetSheHe]."
 spn_bfb.0200.a:0 "Тогда решим это здесь."
 spn_bfb.0200.b:0 "У жизни есть цена. Я её заплачу."
 spn_bfb.0200.b.tt:0 "[spn_bfb_avenger.GetShortUIName] принимает виру и оставляет всё как есть"
 spn_blood_for_blood_interaction:0 "Кровь за кровь"
 spn_blood_for_blood_interaction_desc:0 "[recipient.GetShortUIName] убил одного из твоих. Теперь ты знаешь [recipient.GetHerHis] имя. Реши, чего это будет стоить [recipient.GetHerHim]."
 spn_bfb_heading:0 "Каким будет ответ"
 SPN_BFB_FACE:0 "Встретиться с [recipient.GetHerHim]"
 SPN_BFB_RUIN:0 "Медленно погубить [recipient.GetHerHim]"
 SPN_BFB_LIE:0 "Оставить как есть"
 spn_bfb_face_tt:0 "[recipient.GetShortUIName] будет найден и может сразиться с тобой или предложить виру"
 spn_bfb_lie_tt:0 "Ты вычёркиваешь [recipient.GetHerHis] имя. Этого уже не вернуть."
 spn_hunted_modifier:0 "Затравленный"
 spn_hunted_modifier_desc:0 "Этот охотник убил слишком многих из одной семьи. Он это знает, и ищет его не только он сам."
 spn_bfb_fury_modifier:0 "Три могилы"
 spn_bfb_fury_modifier_desc:0 "Трое родных этого персонажа погибли от одной руки."
 spn_bfb_vendetta_modifier:0 "Медленный ответ"
 spn_bfb_vendetta_modifier_desc:0 "Этот персонаж решил разобрать охотника по частям."
 # The hunter death reasons, when the killer is known to the reader
 spn_death_beheaded_as_hybrid_killer:0 "лишился головы: [CHARACTER.GetHerHis] голову отделили от [CHARACTER.GetHerHis] тела"
 spn_death_silver_arrow_by_hunter_as_werewolf_killer:0 "получил серебряную стрелу в [CHARACTER.GetHerHis] грудь"
 spn_death_killed_by_hunter_killer:0 "был выслежен и убит"
 # 2.42 review (20 Nov 2026)
 spn_bfb.0200.b.offer.tt:0 "[spn_bfb_avenger.GetShortUIName] предлагают виру, и он может отказаться"
 spn_bfb.0200.c:0 "Запереть дверь. Сегодня никто не умрёт."
 spn_bfb.0200.c.tt:0 "Ты не выходишь. У [spn_bfb_avenger.GetShortUIName] всё ещё есть твоё имя."
 spn_bfb.0220.t:0 "Вира"
 spn_bfb.0220.desc:0 "[spn_bfb_slayer.GetFirstName] не тянется к оружию. [spn_bfb_slayer.GetSheHe|U] кладёт кошель на дорогу между нами и отступает от него.\n\n«За того, кто был твоим, — говорит [spn_bfb_slayer.GetSheHe]. — Столько стоит жизнь, и здесь всё. Возьми — и пусть на этом всё кончится»."
 spn_bfb.0220.a:0 "Я беру. Всё кончено."
 spn_bfb.0220.a.tt:0 "Ты принимаешь виру и вычёркиваешь [spn_bfb_slayer.GetHerHis] имя"
 spn_bfb.0220.b:0 "Подними его. Я пришёл не за золотом."
 spn_bfb.0220.c:0 "Оставь себе. И оглядывайся."
 spn_bfb_refused_toast:0 "Они не вышли"
 spn_bfb_duel_won_toast:0 "Решено"
 spn_bfb_duel_off_toast:0 "Встреча не состоялась"
 spn_bfb_hunted_toast:0 "На тебя охотятся"
 spn_death_killed_as_culprit:0 "был убит охотником"
 spn_death_killed_as_culprit_killer:0 "был убит [TARGET_CHARACTER.GetUIName], принявшим [CHARACTER.GetHerHim] за чудовище"
