 ###################### Game concepts ######################
 game_concept_spn_order:0 "Орден Голубой Розы"
 game_concept_spn_order_desc:0 "Герметический Орден Голубой Розы: тайное общество Магов, старше любого королевства, организованное в храмах (капитулы) под руководством [spn_temple_magus|E]. Его члены узнают друг друга по голубой розе, носят маски на обрядах и хранят три слова: Молчание, Послушание, Наблюдение.\n\nОрден выбирает своих: каждый год каждый храм отправляет записку и розу нескольким людям с даром. Члены поднимаются по [spn_order_ranks|E], приносят реликвии в [spn_reliquary|E] храма и служат [spn_order_prerogative|E] Ордена."
 game_concept_spn_order_chapter:0 "Капитул"
 game_concept_spn_order_chapter_desc:0 "Один храм [spn_order|E], возглавляемый его [spn_temple_magus|E]. Капитул содержит от тридцати до шестидесяти членов, растёт с годами и хранит [spn_reliquary|E]. Ты можешь видеть свой в своих Ситуациях."
 game_concept_spn_temple_magus:0 "Храмовый Магус"
 game_concept_spn_temple_magus_desc:0 "Глава капитула [spn_order|E]. Храмовый Магус повышает членов в ранге, хранит путь храма и судит нарушивших его правила."
 game_concept_spn_order_ranks:0 "Ранги Ордена"
 game_concept_spn_order_ranks_desc:0 "Неофит (испытание), послушник (обучение), Медикум, Магистрат, [spn_temple_magus|E], место в [spn_gnostic_council|E] и на вершине Великий Магус, ведущий весь Орден. [spn_order_adepti|E] — это Магистраты, работающие вне своих храмов.\n\nКаждый год Орден учит каждого своего Мага чуть-чуть: одну точку на одном из четырёх путей Мага, выбранном случайно. Путь храма делает свой путь вдвое вероятнее: Алхимия за Молчание, Боевая магия за Послушание, Тайное знание за Наблюдение."
 game_concept_spn_order_standing:0 "Положение"
 game_concept_spn_order_standing_desc:0 "Как [spn_order|E] ценит тебя, от 0 до 100. Оно растёт каждый год твоей принадлежности и с делами, служащими [spn_order_prerogative|E]. На 25 послушник может быть возведён в Медикум; на 50 Медикум в Магистрат."
 game_concept_spn_gnostic_council:0 "Гностический Совет"
 game_concept_spn_gnostic_council_desc:0 "Совет [spn_order|E]: Великий Магус в кресле, Хранитель Реликвария, Адептус Майор и Канцлер. Только члены Ордена заседают в нём. Храмы выбирают Великого Магуса на [spn_conclave|E], и места заполняются там же."
 game_concept_spn_reliquary:0 "Реликварий"
 game_concept_spn_reliquary_desc:0 "Магические предметы, которые члены капитула или ковена принесли в жертву. Чем больше его содержит, тем сильнее каждый член. Принесённый в жертву предмет всё ещё принадлежит владельцу и не может быть взят при осаде или набеге; война, вор или демон всё ещё могут его взять."
 game_concept_spn_relic:0 "Реликва"
 game_concept_spn_relic_desc:0 "Меньший магический предмет: Перчатка, Некрофон, Зачарованный клинок, Подвеска Эха, Порошок сокрытия, Осколок зеркала и Колокол мёртвого часа. Каждый делает одно. [spn_seal_of_solomon|E] — величайший из них."
 game_concept_spn_coven_panel:0 "Ковен"
 game_concept_spn_coven_panel_desc:0 "Дом, чьи ведьмы знают друг друга, что они ведьмы. Ковен хранит [spn_reliquary|E], и ты можешь видеть свой в своих Ситуациях."
 game_concept_spn_zecchia:0 "Зеккья"
 game_concept_spn_zecchia_desc:0 "Малый демон, который крадёт за плату. Вызови её, скажи, чей дом ограбить, и она вернётся с тем, что взяла. Она не подойдёт близко к [spn_seal_of_solomon|E]."
 game_concept_spn_vade_maecum:0 "Ваде Маэкум Инферналь"
 game_concept_spn_vade_maecum_desc:0 "Справочник демона, давно разорванный на четыре страницы. Собранный воедино, он может быть связан [spn_vade_contract|E]: сила без цены за ужасную. Души тех, кто не удался, всё ещё внутри него."
 game_concept_spn_vade_contract:0 "Договор"
 game_concept_spn_vade_contract_desc:0 "Сделка [spn_vade_maecum|E]. В течение трёх лет назови свидетеля, отдай палец и заплати последнюю цену: твоего первого сына по крови. Заплати, и ты связан с книгой на всю жизнь. Не заплати, и она возьмёт тебя."
 game_concept_spn_vade_bound:0 "Связанный с книгой"
 game_concept_spn_vade_bound_desc:0 "Тот, кто заплатил [spn_vade_contract|E]. Магия ничего не стоит им, демоны их слушают, и они очень трудно убиваемы. Охотнику нужен Зачарованный клинок; [spn_gnostic_council|E] может их развоплотить; чемпион шести шкур может их убить."
 game_concept_spn_respondeo:0 "Респондео"
 game_concept_spn_respondeo_desc:0 "Заклятие забывания [spn_order|E]. Всё графство забывает, что видело, и след охотника там холодеет. Это стоит большую власть или капитул."
 game_concept_spn_pulveris_memoria:0 "Пулверис Мемориа"
 game_concept_spn_pulveris_memoria_desc:0 "Пыль памяти. Что [spn_order|E] делает с тем, кто не прошёл его испытания или его покинул: они забывают Орден, и члены, которые уходят, теряют магию, которую учили."
 game_concept_spn_order_ladder:0 "Лестница"
 game_concept_spn_order_ladder_desc:0 "Дорога от Неофита к Великому Магусу. Смотри [spn_order_ranks|E]."
 game_concept_spn_order_prerogative:0 "Прерогатива"
 game_concept_spn_order_prerogative_desc:0 "К чему работает [spn_order|E] в течение следующих десяти лет, установленное его мастером: Восстановить потеряное, Молчание, Книга должна быть найдена, Больше рук или Договориться с преисподней. Члены получают [spn_order_standing|E] за дела, служащие ей."
 game_concept_spn_order_old_law:0 "Древний закон"
 game_concept_spn_order_old_law_desc:0 "[spn_order|E] не берёт некромантов, и член, ставший одним, судится. Это закон с тех пор, как две сестры чуть не уничтожили Орден."
 game_concept_spn_order_rule_one:0 "Первое правило"
 game_concept_spn_order_rule_one_desc:0 "С демонами не работай. Член, вызвавший демона или заключивший [spn_order_compact|E], теряет [spn_order_standing|E], если только Орден не договаривается с преисподней."
 game_concept_spn_order_compact:0 "Сговор"
 game_concept_spn_order_compact_desc:0 "Сделка между демоном и [spn_order|E]. Двадцать лет демон может занимать из [spn_reliquary|E] Ордена и должен одну услугу за каждый заём."
 game_concept_spn_order_transference:0 "Элементарный перенос"
 game_concept_spn_order_transference_desc:0 "«Ex tenebris lux»: из тьмы на свет. Ритуал [spn_order|E], который переносит смертельную болезнь из одного человека пятерым добровольцам, по пятой части каждому. Если кто-то из пятерых убит до пяти лет, болезнь возвращается."
 game_concept_spn_order_fors_factorum:0 "Форс Факторум"
 game_concept_spn_order_fors_factorum_desc:0 "Самое тайное заклятие [spn_order|E]. Магия ничего не стоит тебе, но цена приходит позже, как рак, снова и снова."
 game_concept_spn_order_adepti:0 "Адепти"
 game_concept_spn_order_adepti_desc:0 "Магистраты [spn_order|E], работающие вне своих храмов, под руководством Адептуса Майора. Адептус может занимать из любого храма, членов которого он знает."
 game_concept_spn_seal_of_solomon:0 "Печать Соломона"
 game_concept_spn_seal_of_solomon_desc:0 "Кольцо царя, который связал демонов. Оно начинает в святилище. Кто бы его не носил, не может быть магически подчинён, демоны его боятся, и [spn_order|E] его хочет."

