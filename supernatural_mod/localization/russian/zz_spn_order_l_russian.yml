 SPN_ORDER_RELIQUARY:0 "Реликварий"
 spn_coven_string:0 "Ведьмы одного дома, что знают друг друга такими, какие они есть. В нём [Story.MakeScope.Var('spn_coven_size').GetValue|0] членов. То, что они посвящают [spn_reliquary|E], укрепляет их всех."
