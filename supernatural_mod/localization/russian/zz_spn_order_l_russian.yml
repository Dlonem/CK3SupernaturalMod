 ###################### Artifacts ######################
 artifact_spn_relic:0 "Реликвия"
 spn_relic_glove_name:0 "Перчатка"
 spn_relic_glove_desc:0 "Чёрная кожаная перчатка, загрубевшая от времени. Надень её на чью-нибудь кожу и задай вопрос: солжёт — обожжёт. Дознаватели Ордена пользовались ею веками."
 spn_relic_necrophone_name:0 "Некрофон"
 spn_relic_necrophone_desc:0 "Латунный ящик с диском и рупором. Поверни диск достаточно далеко — и ответит кто-то мёртвый. С каждым вызовом по нему идёт новая трещина."
 spn_relic_blade_name:0 "Зачарованный Клинок"
 spn_relic_blade_desc:0 "Кинжал самого простого вида, что режет волка, как серебро. Охотники давно мечтают о нём."
 spn_relic_pendant_name:0 "Подвеска Эха"
 spn_relic_pendant_desc:0 "Серебряная подвеска с полым камнем. Проклятие, нацеленное на того, кто её носит, возвращается к тому, кто его наслал."
 spn_relic_powder_name:0 "Порошок Сокрытия"
 spn_relic_powder_desc:0 "Мешочек серого порошка, отдающего палёным волосом. Брошенный в воздух, он заставляет людей в округе забыть то, что они видели. При броске расходуется."
 spn_relic_mirror_name:0 "Осколок Зеркала"
 spn_relic_mirror_desc:0 "Кусок разбитого зеркала, в котором никогда не видно твоего лица. Двое, взглянувшие в него вместе, связываются: если одного убьют, другой умрёт следом."
 spn_relic_bell_name:0 "Колокол Мёртвого Часа"
 spn_relic_bell_desc:0 "Небольшой железный колокол. Звонит сам собой, когда охотник близко."
 spn_relic_seal_name:0 "Печать Соломона"
 spn_relic_seal_desc:0 "Латунное кольцо с печатью царя, что связывал демонов. О нём знали в Иерусалиме, Константинополе и Багдаде задолго до всех ныне живущих. Ни один демон не подойдёт к нему добровольно, и того, кто его носит, нельзя подчинить магией."
 spn_vade_page_1_name:0 "Страница Чёрного Камня"
 spn_vade_page_1_desc:0 "Страница [spn_vade_maecum|E], запечатанная в обсидиане под заклятием, что обращает магию против того, кто её наслал."
 spn_vade_page_2_name:0 "Страница Спящего"
 spn_vade_page_2_desc:0 "Страница [spn_vade_maecum|E]. Тому, кто её хранит, снятся сны на языке, которого он не учил."
 spn_vade_page_3_name:0 "Страница из Сундука"
 spn_vade_page_3_desc:0 "Страница [spn_vade_maecum|E], долго пролежавшая в железном сундуке у людей, не знавших, что это."
 spn_vade_page_4_name:0 "Страница Сереброспинного"
 spn_vade_page_4_desc:0 "Страница [spn_vade_maecum|E]. Годами она была спрятана в шкуре волка и до сих пор ею пахнет."
 spn_vade_book_name:0 "Ваде Маэкум Инферналь"
 spn_vade_book_desc:0 "Учебник демона, снова целый. Тот, кто его свяжет, получит силу без цены, а заплатит пальцем, свидетелем и сыном."
 spn_vade_book_desc_souls:0 "Учебник демона, снова целый. Каждая душа, что он забрал, всё ещё внутри. Последняя: [GetGlobalVariable( 'spn_vade_soul_last' ).Char.GetFirstName]."

 ###################### Seize Their Relics ######################
 spn_relic_war:0 "Забрать их реликвии"
 SPN_RELIC_WAR_NAME:0 "Война [ATTACKER.GetShortUIName] за реликвии [DEFENDER.GetShortUINamePossessive]"
 SPN_RELIC_WAR_NAME_FALLBACK:0 "Война за реликвии"
 spn_relic_war_victory_desc:0 "Нападавший забирает все реликвии и магические предметы, которыми владеет защитник."
 spn_relic_war_victory_desc_defender:0 "Ты теряешь все свои реликвии и магические предметы в пользу нападавшего."
 spn_relic_war_white_peace_desc:0 "Ничего не переходит из рук в руки. Нападавший теряет немного престижа."
 spn_relic_war_defeat_desc:0 "Нападавший платит репарации и теряет престиж. Никто не лишается прав на престол из-за этой войны."
 spn_relic_war_invalidated_desc:0 "У защитника больше нет ничего, что стоило бы отнять."
 spn_vade_blow_turned_aside_friendly:0 "Удар, который должен был убить нашего [CHARACTER.GetShortUINameNoTooltip], достался тому, кто стоял рядом."
 spn_vade_blow_turned_aside_enemy:0 "Удар, который должен был убить [CHARACTER.GetShortUINameNoTooltip], достался тому, кто стоял рядом."

 ###################### Intents ######################
 spn_meet_in_the_masks_intent:0 "Найти единомышленников"
 spn_meet_in_the_masks_intent_desc:0 "Ты пришёл ради людей в масках, а не ради речей."
 spn_speak_for_the_order_intent:0 "Говорить за мой Круг"
