 SPN_COVEN_RELIQUARY:0 "Реликварий"
 spn_vade_contract_string:0 "Ты связал [spn_vade_maecum|E]. Чтобы удержать её, ты должен назвать свидетеля, отдать палец и уплатить последнюю цену: твоего первого сына. Если время кончится раньше, книга заберёт тебя.\n\nОсталось [Story.MakeScope.Var('spn_vade_days_left').GetValue|0] дней.\n[Story.Custom('spn_VadeWitnessLine')]\n[Story.Custom('spn_VadeSonLine')]"
