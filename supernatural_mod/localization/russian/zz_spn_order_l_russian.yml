 spn_relic_glove_interaction_desc:0 "Надень Перчатку и допроси твоего пленника. Если он лжёт, она обожжёт его."
 spn_relic_glove_interaction_tt:0 "[recipient.GetFirstName] должен ответить."
 spn_relic_glove_cd_tt:0 "Ты не использовал Перчатку последние два года."
 spn_relic_necrophone_interaction:0 "Позвать мертвецов"
 spn_relic_necrophone_interaction_desc:0 "Повести циферблат Некрофона и задай вопрос мёртвым."
 spn_relic_necrophone_interaction_tt:0 "Мёртвые ответят на один вопрос. Три звонка и она треснет."
 spn_relic_necrophone_cd_tt:0 "Ты не звал мёртвых в этом году."
 spn_relic_powder_interaction:0 "Бросить порошок"
 spn_relic_powder_interaction_desc:0 "Брось Порошок Сокрытия. Графство, где ты стоишь, забывает, что видело."
 spn_relic_powder_interaction_tt:0 "Любой след, которым охотник шёл, здесь простывает. Порошок израсходован."
 spn_relic_mirror_interaction:0 "Связать наши судьбы"
 spn_relic_mirror_interaction_desc:0 "Посмотрите в Осколок Зеркала вместе."
 spn_relic_mirror_interaction_tt:0 "Если кого-то убьют, другой умрёт в течение дня. Естественная смерть разрывает узы. Связать врага — значит сделать себя его заложником."
 spn_relic_mirror_cd_tt:0 "Ты не использовал осколок последние десять лет."
 spn_relic_mirror_bound_tt:0 "Ты не связан ни с кем уже."
 spn_relic_mirror_other_bound_tt:0 "Они не связаны ни с кем уже."
 spn_zecchia_send_interaction:0 "Послать Зеккию за их сокровищами"
 spn_zecchia_send_interaction_desc:0 "Скажи [spn_zecchia|E], чей дом ограбить."
 spn_zecchia_send_interaction_tt:0 "Она вернётся через девяносто дней с тем, что взяла."
 spn_zecchia_send_seal_tt:0 "Не носишь Печать Соломона."
 spn_zecchia_send_privilege_tt:0 "Зеккия не грабила их для тебя раньше."
 spn_zecchia_send_nothing_tt:0 "Они владеют чем-то, что она возьмёт."
 spn_vade_witness_interaction:0 "Назвать свидетелем"
 spn_vade_witness_interaction_desc:0 "Попроси [recipient.GetFirstName] стать свидетелем твоего [spn_vade_contract|E]. Книга отметит и его."
 spn_vade_witness_interaction_tt:0 "[recipient.GetFirstName] твой свидетель и связан как таковой."
 spn_vade_ask_page_interaction:0 "Попросить страницу"
 spn_vade_ask_page_interaction_desc:0 "Попроси [recipient.GetFirstName] страницу книги, которую хранит его шкура."
 spn_vade_ask_page_interaction_tt:0 "Страница извлечена из шкуры и она твоя."
 spn_vade_tear_hide_interaction:0 "Разорвать шкуру"
 spn_vade_tear_hide_interaction_desc:0 "Используй свою магию, чтобы вырвать страницу из шкуры [recipient.GetFirstName]."
 spn_vade_tear_hide_interaction_tt:0 "Шкура может выдержать. Если нет, страница твоя, и [recipient.GetFirstName] ранен, или убит, если уже сильно ранен."
 spn_vade_golem_interaction:0 "Отправить голема на поиски"
 spn_vade_golem_interaction_desc:0 "Отправь своего голема искать страницы [spn_vade_maecum|E]."
 spn_vade_golem_interaction_tt:0 "Он будет в пути два-пять лет."
 spn_vade_golem_away_tt:0 "Уже не ищет."

