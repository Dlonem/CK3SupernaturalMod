 ###################### Traits ######################
 trait_spn_vade_bound:0 "Связан с Книгой"
 trait_spn_vade_bound_desc:0 "Этот персонаж заплатил последнюю цену [spn_vade_maecum|E] и был связан с ней до конца жизни. Магия ничего ему не стоит, демоны ему повинуются, и убить его может очень немногое."
 trait_spn_vade_bound_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] заплатил последнюю цену [spn_vade_maecum|E] и был связан с ней до конца жизни. Магия ничего [ROOT.Char.GetHerHim] не стоит, демоны [ROOT.Char.GetHerHim] повинуются, и убить [ROOT.Char.GetHerHim] может очень немногое."

