 ###################### Modifiers ######################
 spn_order_studies_modifier:0 "Эзотерические штудии"
 spn_order_studies_modifier_desc:0 "Тихие ночи учения с теми, кто знает больше тебя. Растёт с [spn_order_standing|E]."
 spn_order_studies_silence_modifier:0 "Эзотерические штудии"
 spn_order_studies_silence_modifier_desc:0 "Тихие ночи учения с теми, кто знает больше тебя и никогда об этом не говорит. Растёт с [spn_order_standing|E]."
 spn_order_studies_subservience_modifier:0 "Эзотерические штудии"
 spn_order_studies_subservience_modifier_desc:0 "Тихие ночи учения, в добром порядке, каждый на своём месте. Растёт с [spn_order_standing|E]."
 spn_order_studies_observance_modifier:0 "Эзотерические штудии"
 spn_order_studies_observance_modifier_desc:0 "Тихие ночи учения, каждый обряд — как он был записан. Растёт с [spn_order_standing|E]."
 spn_order_studies_modifier_scale_desc:0 "[spn_order_standing|E]"
 spn_order_tutor_modifier:0 "Под наставником"
 spn_order_tutor_modifier_desc:0 "Кто-то старше учит тебя каждую ночь, хочешь ты того или нет."
 spn_order_respondeo_modifier:0 "Потрачено на Респондео"
 spn_order_respondeo_modifier_desc:0 "Ты заставил целое графство забыть. Это что-то из тебя вынуло."
 spn_reliquary_modifier:0 "Реликварий"
 spn_reliquary_modifier_desc:0 "То, что члены твоего храма посвятили его [spn_reliquary|E], делает вас всех сильнее."
 spn_reliquary_modifier_scale_desc:0 "Предметы в реликварии"
 spn_coven_reliquary_modifier:0 "Реликварий ковена"
 spn_coven_reliquary_modifier_desc:0 "То, что твой ковен посвятил его [spn_reliquary|E], делает вас всех сильнее."
 spn_coven_reliquary_modifier_scale_desc:0 "Предметы в реликварии"
 spn_fates_bound_modifier:0 "Связанные судьбы"
 spn_fates_bound_modifier_desc:0 "Твоя жизнь связана с чужой осколком зеркала. Если убьют одного из вас, другой умрёт в течение дня."
 spn_missing_finger_modifier:0 "Не хватает пальца"
 spn_missing_finger_modifier_desc:0 "Ты отдал книге палец."
 spn_vade_humanity_modifier:0 "Меньше, чем человек"
 spn_vade_humanity_modifier_desc:0 "Что-то покинуло тебя, когда книга взяла свою цену. Это заметно."
 spn_golem_away_modifier:0 "В поисках"
 spn_golem_away_modifier_desc:0 "Этот голем отправлен искать страницы книги."
 spn_vade_witness_bond_modifier:0 "Связан как свидетель"
 spn_vade_witness_bond_modifier_desc:0 "Ты был свидетелем договора с [spn_vade_maecum|E]. С тех пор твоя магия не в порядке."
 spn_vade_echoes_modifier:0 "Эхо Книги"
 spn_vade_echoes_modifier_desc:0 "Голоса в книге учат тебя. Ты быстро учишься и плохо спишь."
 spn_vade_sleeper_modifier:0 "Чужие сны"
 spn_vade_sleeper_modifier_desc:0 "Тебе снятся сны на языке, которого ты не учил."
 spn_transference_carrier_modifier:0 "Носитель чужой болезни"
 spn_transference_carrier_modifier_desc:0 "Пятая часть чужой хвори какое-то время живёт в тебе."
 spn_fors_factorum_modifier:0 "Магия без цены"
 spn_fors_factorum_modifier_desc:0 "Твои чары ничего тебе не стоят. Платит кто-то другой."
 spn_vade_page_modifier:0 "Страница Книги"
 spn_vade_page_modifier_desc:0 "Одна из четырёх страниц [spn_vade_maecum|E]."
 spn_vade_book_modifier:0 "Ваде Маэкум Инферналь"
 spn_vade_book_modifier_desc:0 "Вся книга, снова переплетённая."
 spn_seal_kept_modifier:0 "Здесь хранится Печать Соломона"
 spn_seal_kept_modifier_desc:0 "Здешние жрецы держат старое латунное кольцо в свинцовой шкатулке. Паломники приходят прикоснуться к шкатулке."
 spn_relic_glove_modifier:0 "Перчатка"
 spn_relic_glove_modifier_desc:0 "Кто её носит, хорошо читает людей. Надетая на узника, она жжёт лжеца."
 spn_relic_necrophone_modifier:0 "Некрофон"
 spn_relic_necrophone_modifier_desc:0 "Он позволяет говорить с мёртвыми."
 spn_relic_blade_modifier:0 "Зачарованный Клинок"
 spn_relic_blade_modifier_desc:0 "Он режет волка так же, как серебро."
 spn_relic_powder_modifier:0 "Порошок Сокрытия"
 spn_relic_powder_modifier_desc:0 "Брошенный в воздух, он заставляет место забыть."
 spn_relic_mirror_modifier:0 "Осколок Зеркала"
 spn_relic_mirror_modifier_desc:0 "Он может связать две жизни в одну."
 spn_relic_bell_modifier:0 "Колокол Мёртвого Часа"
 spn_relic_bell_modifier_desc:0 "Он звонит перед приходом охотника."
 spn_relic_seal_modifier:0 "Печать Соломона"
 spn_relic_seal_modifier_desc:0 "Кольцо царя. Оно повелевает; ему не повелевают."

