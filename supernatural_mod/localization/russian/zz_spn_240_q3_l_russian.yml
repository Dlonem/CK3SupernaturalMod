l_russian:
 spn_conclave.0300.desc_host_item:0 "Прежде чем клятвы закончены, ты встаёшь с кресла и кладёшь [spn_cv_proof_art.GetName] на стол перед всеми.\n\nВ зале становится очень тихо."
 spn_conclave.0300.desc_host_kill:0 "Прежде чем клятвы закончены, ты встаёшь с кресла и катишь по полу то, что осталось от твоей добычи. Оно останавливается у ног Храмовых Магусов.\n\nВ зале становится очень тихо."
 spn_order_toast_tutee_taught:0 "[spn_tf_tutee.GetFirstName] выучил слова"
 spn_order_toast_tutee_taught_desc:0 "Твой послушник завершил обучение. Теперь ты отдыхаешь, и пять лет храм не даст тебе другого послушника, чтобы обучить его до конца."
 spn_order_no_acolytes_decision:0 "Я не возьму послушников"
 spn_order_no_acolytes_decision_desc:0 "Обучение послушника отнимает годы ночей. Ты можешь сказать своему храму, что не возьмёшь ни одного."
 spn_order_no_acolytes_decision_tooltip:0 "Больше не получать послушников для обучения."
 spn_order_no_acolytes_decision_confirm:0 "Я не буду учить"
 spn_order_no_acolytes_decision_effect_tt:0 "Тебе не будут давать послушников для обучения. Те, кого ты учишь сейчас, перейдут к другому наставнику в следующем году капитула. Ты теряешь [spn_order_standing|E], которое зарабатывает наставник."
 spn_order_take_acolytes_decision:0 "Снова брать послушников"
 spn_order_take_acolytes_decision_desc:0 "Ты сказал своему храму, что не будешь учить. Можешь сказать, что будешь."
 spn_order_take_acolytes_decision_tooltip:0 "Снова получать послушников для обучения."
 spn_order_take_acolytes_decision_confirm:0 "Я буду учить"
 spn_order_take_acolytes_decision_effect_tt:0 "Храм снова может давать тебе послушников для обучения, начиная со следующего года капитула."
 spn_order.0163.c:0 "Тогда покажи мне"
 spn_order.0163.c.tt:0 "Ты тратишь немного своей силы, чтобы показать [spn_q_tutee.GetHerHim], как это делается. После этого никто не спорит."
 spn_order.0163.d:0 "Тогда попробуй по-своему"
 spn_order.0163.d.tt:0 "Ты позволяешь [spn_q_tutee.GetHerHim] попробовать. Капитул считает тебя мягким, но [spn_q_tutee.GetSheHe] может от этого учиться быстрее."
 spn_order.0163.e:0 "Не при капитуле"
 spn_order.0163.e.tt:0 "Ты выходишь и решаешь это между вами двоими. Оба сохраняете лицо."
 spn_order.0163.f:0 "Напомнить [spn_q_tutee.GetHerHim], кто кого учит"
 spn_order.0163.f.tt:0 "Никто в капитуле не станет вскоре снова спорить с тобой, и меньше всех — [spn_q_tutee.GetFirstName]. [spn_q_tutee.GetSheHe|U] этого не забудет."
 spn_order_lean_learning_tt:0 "Чем выше твоя [learning|E] по сравнению с их, тем вероятнее, что всё выйдет по-твоему."
 spn_order_lean_intrigue_tt:0 "Чем выше твоя [intrigue|E] по сравнению с их, тем вероятнее, что всё выйдет по-твоему."
 spn_order.2100.t:0 "Другая дорога"
 spn_order.2100.desc:0 "У [spn_tp_tutee.GetTitledFirstName] ведьмин дар, и слова даются [spn_tp_tutee.GetHerHim] легко. К Источнику ведёт и другая дорога, кроме храмовых лет: обучение, которое один Маг даёт одному ученику, как было до того, как появились храмы.\n\nЭто тяжёлый труд, и ещё много лет ты не сможешь так учить другого."
 spn_order.2100.a:0 "Учить [spn_tp_tutee.GetHerHim] чародейству"
 spn_order.2100.a.tt:0 "Открывается окно «Учить чародейству». Если [spn_tp_tutee.GetSheHe] согласится, начнётся [spn_tp_tutee.GetHerHis] Тайное обучение, и его завершение сократит [spn_tp_tutee.GetHerHis] годы в храме."
 spn_order.2100.b:0 "Храмовой дороги достаточно"
 spn_order.2100.b.tt:0 "Ничего не меняется. [spn_tp_tutee.GetSheHe|U] продолжает как прежде."
 spn_order.2101.t:0 "Не то слово"
 spn_order.2101.desc_tutor:0 "Посреди вечернего действа [spn_tp_tutee.GetFirstName] произносит одно слово неправильно. Пламя свечи становится голубым и тянется к потолку, а полка над ним начинает дымиться.\n\n[spn_tp_tutee.GetSheHe|U] застывает, следующая строка вылетела у [spn_tp_tutee.GetHerHis] из головы."
 spn_order.2101.desc_tutee:0 "Посреди вечернего действа ты произносишь одно слово неправильно. Пламя свечи становится голубым и тянется к потолку, а полка над ним начинает дымиться.\n\n[spn_tp_tutor.GetTitledFirstName] не шевелится. Следующая строка вылетела у тебя из головы."
 spn_order.2101.a:0 "Поддержать [spn_tp_tutee.GetHerHim]"
 spn_order.2101.a.tt:0 "Ты проводишь [spn_tp_tutee.GetHerHim] через следующую строку. [spn_tp_tutee.GetSheHe|U] запомнит, кто стоял рядом с [spn_tp_tutee.GetHerHim]."
 spn_order.2101.b:0 "Пусть [spn_tp_tutee.GetHerHim] гасит сам"
 spn_order.2101.b.tt:0 "Страх — тоже учитель. [spn_tp_tutee.GetSheHe|U] может вынести из этой ночи больше, чем из месяца уроков, или уйти сильно потрясённым."
 spn_order.2101.c:0 "Взглянуть на [spn_tp_tutor.GetFirstName]"
 spn_order.2101.c.tt:0 "[spn_tp_tutor.GetFirstName] вмешивается и завершает действо. Ты благодарен и немного пристыжен."
 spn_order.2101.d:0 "Закончить самому"
 spn_order.2101.d.tt:0 "Ты снова находишь строку — или нет. Так или иначе, эту ночь ты не забудешь."
 spn_order.2102.t:0 "Вопрос, на который нет ответа"
 spn_order.2102.desc_tutor:0 "[spn_tp_tutee.GetFirstName] спрашивает тебя при всём капитуле, почему третью строку нужно произносить до четвёртой, а не после.\n\nТы открываешь рот, чтобы ответить, и понимаешь, что тебе этого никто никогда не объяснял."
 spn_order.2102.desc_tutee:0 "Ты спрашиваешь [spn_tp_tutor.GetTitledFirstName] при всём капитуле, почему третью строку нужно произносить до четвёртой, а не после.\n\n[spn_tp_tutor.GetSheHe|U] открывает рот — [spn_tp_tutor.GetHerHis] губы шевелятся — и снова закрывает его, и в зале становится тихо."
 spn_order.2102.a:0 "Разобраться при всех"
 spn_order.2102.a.success:0 "Ты находишь ответ"
 spn_order.2102.a.success_desc:0 "Ты рассуждаешь вслух, строка за строкой, и к концу весь капитул понимает это лучше, чем прежде. И ты тоже."
 spn_order.2102.a.failure:0 "Ты ходишь по кругу"
 spn_order.2102.a.failure_desc:0 "Ты долго говоришь и ничего не сказал. [spn_tp_tutee.GetFirstName] уходит и разбирается сам."
 spn_order.2102.b:0 "Признать, что я не знаю"
 spn_order.2102.b.tt:0 "Ты говоришь, что не знаешь, и вы разбираетесь вместе. [spn_tp_tutee.GetSheHe|U] уважает тебя за это ещё больше."
 spn_order.2102.c:0 "Настаивать на вопросе"
 spn_order.2102.c.success:0 "Ты находишь ответ"
 spn_order.2102.c.success_desc:0 "Вдвоём вы разбираетесь. [spn_tp_tutor.GetFirstName] говорит, что сегодня ты научил [spn_tp_tutor.GetHerHim] кое-чему."
 spn_order.2102.c.failure:0 "Ты слишком надавил"
 spn_order.2102.c.failure_desc:0 "Никто из вас не находит ответа, и [spn_tp_tutor.GetFirstName] не благодарит тебя за то, что ты спросил при всех."
 spn_order.2102.d:0 "Let it go"
 spn_order.2102.d.tt:0 "Ты меняешь тему. [spn_tp_tutor.GetFirstName] это замечает и благодарен тебе."
 spn_order.2103.t:0 "Где ты был прошлой ночью?"
 spn_order.2103.desc_tutee:0 "[spn_tp_kin.GetTitledFirstName] не спал, когда ты вернулся домой перед рассветом, и хочет знать, где ты был. Это уже третий раз за месяц.\n\n[spn_tp_kin.GetSheHe|U] заметил чернила на твоих пальцах и запах свечного дыма, и [spn_tp_kin.GetSheHe] не собирается оставлять это просто так."
 spn_order.2103.desc_tutor:0 "[spn_tp_kin.GetTitledFirstName] приходит к тебе. [spn_tp_tutee.GetFirstName] возвращается домой перед рассветом, пропахнув свечным дымом, и его видели у твоей двери.\n\n[spn_tp_kin.GetSheHe|U] хочет знать почему."
 spn_order.2103.a:0 "Солгать [spn_tp_kin.GetHerHim] убедительно"
 spn_order.2103.a.success:0 "[spn_tp_kin.GetSheHe|U] тебе верит"
 spn_order.2103.a.success_desc:0 "Болезнь друга, долгая игра в кости. [spn_tp_kin.GetFirstName] удовлетворён и больше ни о чём не спрашивает."
 spn_order.2103.a.failure:0 "[spn_tp_kin.GetSheHe|U] тебе не верит"
 spn_order.2103.a.failure_desc:0 "[spn_tp_kin.GetFirstName] выслушивает тебя, ничего не говорит и с этих пор следит за тобой внимательнее."
 spn_order.2103.b:0 "Ничего [spn_tp_kin.GetHerHim] не говорить"
 spn_order.2103.b.tt:0 "Ты хранишь молчание Ордена. [spn_tp_kin.GetFirstName] это не понравится."
 spn_order.2103.c:0 "Прикрыть [spn_tp_tutee.GetFirstName]"
 spn_order.2103.c.success:0 "[spn_tp_kin.GetSheHe|U] тебе верит"
 spn_order.2103.c.success_desc:0 "Уроки грамоты, говоришь ты, а это единственный час, когда вы оба свободны. [spn_tp_kin.GetFirstName] уходит домой удовлетворённым."
 spn_order.2103.c.failure:0 "[spn_tp_kin.GetSheHe|U] тебе не верит"
 spn_order.2103.c.failure_desc:0 "[spn_tp_kin.GetFirstName] уходит, не сказав ни слова. Это ещё не конец."
 spn_order.2103.d:0 "Прогнать [spn_tp_kin.GetHerHim]"
 spn_order.2103.d.tt:0 "Ты хранишь молчание Ордена. [spn_tp_kin.GetFirstName] это не понравится."
 spn_order.0170.desc_county:0 "Кто-то узнал, что [spn_ex_who.GetTitledFirstName] носит Голубую Розу, и слух расходится по [spn_ex_county.GetName]. [spn_respondeo|E], произнесённое там, заставило бы людей забыть."
 spn_order.0170.send:0 "Послать [spn_rs_agent.GetFirstName] разобраться"
 spn_order.0170.send.tt:0 "[spn_rs_agent.GetTitledFirstName] отправится в [spn_ex_county.GetName] и произнесёт слова. Платит за это Порошок, [spn_rs_agent.GetHerHis] храм или [spn_rs_agent.GetSheHe] сам, но не ты. [spn_rs_agent.GetSheHe|U] может отказаться."
 spn_order.0170.a.tt:0 "Встать в этом графстве и применить [spn_respondeo|E]. Оно заставит забыть и [spn_ex_who.GetFirstName]."
 spn_order.0170.c:0 "Let it lie"
 spn_order.0170.c.tt:0 "Ничего не делается. Слух продолжает расходиться, а след остаётся на месте."
 spn_order.0180.a_powder:0 "Применить Порошок Сокрытия"
 spn_order_respondeo_powder_tt:0 "Расходуется Порошок Сокрытия: твой собственный или же из [spn_reliquary|E] твоего храма — его хранителю сообщат."
 spn_order_respondeo_rehide_tt:0 "Член Ордена, которого там разоблачили, тоже будет забыт. Только храм снова будет знать [spn_rs_rehide.GetHerHim]."
 spn_order_toast_respondeo_sent:0 "Маски кого-то послали"
 spn_order_toast_respondeo_sent_desc:0 "[spn_rs_exposed.GetTitledFirstName] увидели в [spn_rs_county.GetName] таким, каков [spn_rs_exposed.GetSheHe] есть. Пока ты был занят, твой храм отправил [spn_rs_agent.GetTitledFirstName] произнести там [spn_respondeo|E]."
 spn_order_toast_respondeo_nobody_desc:0 "[spn_rs_exposed.GetTitledFirstName] увидели таким, каков [spn_rs_exposed.GetSheHe] есть. Послать разобраться было некого."
 spn_order_toast_respondeo_done:0 "[spn_rs_county.GetName] забыло"
 spn_order_toast_respondeo_done_desc:0 "[spn_rs_agent.GetTitledFirstName] произнёс [spn_respondeo|E] в [spn_rs_county.GetName]. Тебе это ничего не стоило."
 spn_order_toast_respondeo_unpaid:0 "Никто не смог заплатить"
 spn_order_toast_respondeo_unpaid_desc:0 "[spn_rs_agent.GetTitledFirstName] отправился в [spn_rs_county.GetName], но ни у [spn_rs_agent.GetSheHe], ни у [spn_rs_agent.GetHerHis] храма не хватило силы заплатить за [spn_respondeo|E]."
 spn_order_toast_respondeo_refused:0 "Приказ отвергнут"
 spn_order_toast_respondeo_refused_desc:0 "[spn_rs_refuser.GetTitledFirstName] не пожелал отправиться в [spn_rs_county.GetName], чтобы произнести за тебя [spn_respondeo|E]."
 spn_order.2120.t:0 "Весть от твоего Храмового Магуса"
 spn_order.2120.t_gm:0 "Весть от Великого Магуса"
 spn_order.2120.desc:0 "[spn_rs_commander.GetTitledFirstName] посылает тебя в [spn_rs_county.GetName]. Там увидели [spn_rs_exposed.GetTitledFirstName] таким, каков [spn_rs_exposed.GetSheHe] есть, а ты ближе всех из тех, кто может произнести слова.\n\n[Glossary('Respondeo','spn_gloss_respondeo')], произнесённое там, заставит графство забыть, и [spn_rs_exposed.GetHerHim] тоже."
 spn_order.2120.cannot:0 "Мне нечем заплатить"
 spn_order.2120.cannot.tt:0 "У тебя нет Порошка, не хватает силы, и твой храм не может заплатить вместе с тобой. [spn_rs_commander.GetFirstName] об этом узнает."
 spn_order.2120.refuse:0 "Я не пойду"
 spn_order.2120.refuse.tt:0 "Ты теряешь [spn_order_standing|E], и [spn_rs_commander.GetFirstName] это запомнит."
 spn_order_refused_command_opinion:0 "Отверг мой приказ"
 spn_council_draw_funds_decision:0 "Взять из казны Совета"
 spn_council_draw_funds_decision_desc:0 "[spn_gnostic_council|E] держит свою казну общей, и у каждого места есть от неё ключ. В нужде ты можешь взять из неё, и остальные места увидят в книге учёта, что ты это сделал."
 spn_council_draw_funds_decision_tooltip:0 "Взять золото из казны [spn_gnostic_council|E]."
 spn_council_draw_funds_decision_confirm:0 "Открыть книгу учёта"
 spn_council_draw_funds_decision_effect_tt:0 "Ты выбираешь, сколько взять: 100, 500 или 1000 золота, насколько позволяет казна."
 spn_council_draw_funds_offence_tt:0 "Каждое другое место совета станет думать о тебе немного хуже."
 spn_council_toast_funds_drawn:0 "Золото взято из казны"
 spn_council_toast_funds_drawn_desc:0 "[spn_cdf_magus.GetTitledFirstName] взял [spn_cdf_gold.GetValue|0] золота из казны совета."
 spn_council_drew_funds_opinion:0 "Брал из казны"
 spn_council_toast_funds_late:0 "Из казны ничего не взято"
 spn_council_toast_funds_late_desc:0 "Книга учёта больше этого не позволяет: в казне меньше, чем ты собирался взять, или ты уже брал из неё в последние два года. Ты ничего не взял."
 spn_council_reveal_decision:0 "Раскрыть Гностический Совет"
 spn_council_reveal_decision_desc:0 "Совет собирается тайно с незапамятных времён. Ты можешь положить этому конец и дать миру узнать о его существовании."
 spn_council_reveal_decision_tooltip:0 "Сделать [spn_gnostic_council|E] известным миру."
 spn_council_reveal_decision_confirm:0 "Раскрыть"
 spn_council_reveal_decision_effect_tt:0 "Каждый правитель узнает о существовании совета и сможет его финансировать. Охотники на ведьм заинтересуются его членами."
 spn_council_reveal_break_tt:0 "Теперь кто угодно может попытаться сломить [spn_order|E]."
 spn_council_reveal_recommended_tt:0 "Это рекомендовал [spn_crv_by.GetTitledFirstName]."
 spn_ev10.90.b_tt:0 "Ты выносишь это на суд Великого Магуса. Раскроет ли себя совет — решать Великому Магусу."
 spn_ev10.91.weigh:0 "Я обдумаю это"
 spn_ev10.91.weigh_tt:0 "Сегодня ничего не решено. Ты можешь раскрыть совет когда пожелаешь решением «Раскрыть Гностический Совет»."
 spn_order.0101.desc_pillow_open:0 "Ложась спать, ты находишь на подушке сложенную записку, запечатанную голубым воском, и рядом голубую розу. Ставни заперты изнутри, и никто в доме не видел, чтобы кто-то входил.\n\n"
 spn_order.0101.desc_market_open:0 "На рынке женщина в сером капюшоне суёт тебе в руку записку и исчезает в толпе, прежде чем ты успеваешь разглядеть её лицо. К бумаге приколота голубая роза.\n\n"
 spn_order.0101.desc_book_open:0 "Ты открываешь книгу, которую читал прошлой ночью. Между страниц лежит записка, которую ты туда не клал, и засушенная голубая роза. Чернила ещё не высохли.\n\n"
 spn_order.0101.desc_letter_seat:0 "«Мы давно наблюдаем за тобой. Ты видишь то, чего не замечают другие, и хочешь знать больше, чем готов научить тебя мир. Мы можем показать тебе. Приходи в старую часовню за [spn_pl_seat.GetName] в следующее новолуние. Приходи один и никому не говори».\n\nВнизу нет подписи, только маленькая голубая роза, нарисованная чернилами."
 spn_order.0101.desc_letter:0 "«Мы давно наблюдаем за тобой. Ты видишь то, чего не замечают другие, и хочешь знать больше, чем готов научить тебя мир. Мы можем показать тебе. Приходи в старую часовню в следующее новолуние. Приходи один и никому не говори».\n\nВнизу нет подписи, только маленькая голубая роза, нарисованная чернилами."
 spn_order.0102.desc_open_seat:0 "В старой часовне за [spn_pl_seat.GetName] не служили на памяти живущих. Половины крыши нет, дверь распахнута. Внутри темно и пахнет мокрым камнем, и ты долго ждёшь в одиночестве, гадая, не шутка ли это.\n\nЗатем разом загораются все свечи. Вокруг тебя кольцом стоят люди в серых плащах и белых масках, гораздо ближе, чем ты думал. Один из них выступает вперёд. Лица не видно, но ты знаешь, что он здесь главный.\n\n"
 spn_order.0102.desc_open_hall:0 "В записке говорилось о старой часовне, но у её двери ждёт слуга. Не говоря ни слова, он ведёт тебя обратно в город, в [Glossary('Collegium','spn_gloss_collegium')] в [spn_pl_hall.GetName], через закрытую на ночь библиотеку, за книжный шкаф, где вниз уходит лестница.\n\nВнизу разом загораются все свечи. Вокруг тебя кольцом стоят люди в серых плащах и белых масках. Один из них выступает вперёд, и ты знаешь, что он здесь главный.\n\n"
 spn_order.0110.desc_call:0 "Первое испытание приходит в сумерках — фигура в маске у твоей двери говорит лишь, куда и к какому сроку.\n\n"
 spn_order.0110.desc_tomb_place:0 "Под старой часовней есть гробница, запечатанная ещё до того, как у часовни появилась крыша. Где-то внутри лежит монета с оттиском розы. Принеси её до рассвета.\n\nСтупени разбиты, у тебя одна свеча, и ты слышишь, что внизу ты не один."
 spn_order.0110.desc_tower_place:0 "Перед твоим приходом одна из масок поднялась на колокольню часовни и оставила монету с оттиском розы на выступе под колоколом. Принеси её вниз до рассвета и не разбуди старого пономаря, что спит у подножия башни.\n\nДверь заперта, стена высока. Никто не говорит тебе, почему именно башня, и ты начинаешь подозревать, что испытание вовсе не в подъёме."
 spn_order.0110.desc_mill_seat:0 "На реке под [spn_pl_seat.GetName] всё ещё крутится старая мельница, хотя мельник не работал на ней уже много лет. Кто-то прибил к её колесу монету с оттиском розы. Принеси её до рассвета.\n\nКолесо не останавливается, вода быстрая и холодная, и ищешь её не ты один."
 spn_order.0110.desc_mill_place:0 "На реке неподалёку всё ещё крутится старая мельница, хотя мельник не работал на ней уже много лет. Кто-то прибил к её колесу монету с оттиском розы. Принеси её до рассвета.\n\nКолесо не останавливается, вода быстрая и холодная, и ищешь её не ты один."
 spn_order.0110.desc_cage_place:0 "Маски ведут тебя по лестнице за алтарём часовни в подвал. В дальнем конце стоит железная клетка, и в ней дышит что-то большое. Монета с розой лежит в соломе у его ног. Принеси её до рассвета.\n\nНа прутьях засохшая кровь. Кто бы ни пытался до тебя, он не остановился подумать."
 spn_order.0120.desc_1_seat:0 "Это второе испытание, хотя никто тебе этого не говорит. Неделю назад маска дала тебе ключ и адрес в [spn_pl_seat.GetName] — пустой дом у рынка — и одно указание: подметать в нём полы каждую ночь, пока тебе не скажут прекратить. Сегодня с дождя заходит человек и спрашивает, что ты здесь делаешь так поздно.\n\nОн похож на того, кто запомнит твой ответ."
 spn_order.0120.desc_2_seat:0 "Это второе испытание, хотя никто тебе этого не говорит. Неделю назад маска дала тебе ключ и адрес в [spn_pl_seat.GetName] — пустой дом у стен — и одно указание: зажигать в нём все свечи в полночь и гасить их на рассвете. Сегодня стражник замечает свет, подходит к двери и спрашивает, что ты здесь делаешь в такой час.\n\nОн похож на того, кто запомнит твой ответ."
 spn_order.0120.desc_3_seat:0 "Это второе испытание, хотя никто тебе этого не говорит. Неделю назад маска дала тебе ключ и адрес в [spn_pl_seat.GetName] — пустой дом в глухом переулке — и одно указание: каждую ночь ждать там в темноте, пока кто-нибудь не придёт. Сегодня тебя находит незнакомец и спрашивает, кого ты ждёшь.\n\nОн похож на того, кто запомнит твой ответ."
 spn_order.0130.desc_1_seat:0 "За тобой приходят в полночь и завязывают глаза у двери. Ты считаешь ступени вниз: их куда больше, чем мог бы вместить подвал часовни. Когда повязку снимают, ты в храме под [spn_pl_seat.GetName] — длинном зале со свечами под расписным потолком, и здесь все маски капитула. [spn_temple_magus|E] выступает вперёд и протягивает голубую розу.\n\n"
 spn_order.0140.desc_tutor:0 "Годами [spn_pl_tutor.GetFirstName] заставлял тебя каждую ночь повторять одни и те же слова в одной и той же холодной комнате под храмом, пока ты не стал произносить их во сне. Сегодня, когда ты их произносишь, свеча перед тобой гаснет.\n\nЗатем гаснут все свечи в комнате. Когда они загораются снова, [spn_pl_tutor.GetFirstName] улыбается, а ты чувствуешь, что сила всё ещё у тебя в руках."
 spn_order.0140.desc_craft_tutor:0 "Ты знал своё ремесло ещё до прихода в Орден. Годами [spn_pl_tutor.GetFirstName] заставлял тебя каждую ночь повторять слова Ордена в одной и той же холодной комнате под храмом. Сегодня, когда ты их произносишь, гаснут все свечи в комнате.\n\nКогда они загораются снова, [spn_pl_tutor.GetFirstName] улыбается, и ты понимаешь, как Орден творит свою магию. Это не твой путь, но теперь ты его знаешь."
 spn_order.0090.desc_sought:0 "Через три дня после того, как ты оставил розу на ступенях библиотеки, она исчезла. Сегодня незнакомый мальчишка вручает твоему управляющему веточку розмарина, перевязанную голубой нитью, говорит, что это для тебя, и убегает, прежде чем кто-то успевает спросить, кто его послал. Вокруг стебля обёрнута полоска бумаги с названием: [Glossary('Hermetic','spn_gloss_hermetic')] Орден Голубой Розы.\n\nРоза за розу. Кто-то всё-таки наблюдал."
 spn_order_toast_sought_withered:0 "Роза завяла"
 spn_order_toast_sought_withered_desc:0 "Прошло больше года с тех пор, как ты оставил розу, а записки всё нет. Тот, кто её взял, забыл о тебе. Можешь оставить другую."
 spn_order_research_help_helper_tt:0 "Придёт [spn_rh_helper.GetTitledFirstName] и заработает за это [spn_order_standing|E]."
 spn_order_toast_research_helped_desc:0 "[spn_rh_helper.GetTitledFirstName] пришёл в твой кабинет с фонарём и без вопросов. К утру твои записи покрылись вторым почерком, а работа сдвинулась с места."
 spn_council_draw_funds_has_gold_tt:0 "В казне совета не меньше 100 золота"
 spn_council_draw_funds_recent_tt:0 "Ты не брал из казны в последние два года"
 spn_order.2130.t:0 "Казна Совета"
 spn_order.2130.desc:0 "Книга учёта совета ведётся шифром, который могут читать только места. Сегодня она показывает $mc_gold$ золота в общей казне.\n\nЧто бы ты ни взял, остальные места прочтут об этом в книге, когда откроют её в следующий раз."
 spn_order.2130.a:0 "Взять 100 золота"
 spn_order.2130.b:0 "Взять 500 золота"
 spn_order.2130.c:0 "Взять 1000 золота"
 spn_order.2130.d:0 "Закрыть книгу учёта"
 spn_order.2130.d.tt:0 "Ты ничего не берёшь и можешь снова открыть её когда пожелаешь."
 spn_council_ask_research_funding_interaction:0 "Попросить Великого Магуса оплатить исследование"
 spn_council_ask_research_funding_interaction_desc:0 "Напиши Великому Магусу и попроси золота из казны [spn_gnostic_council|E] на твоё исследование."
 spn_council_ask_research_funding_considers_tt:0 "Великий Магус прочтёт твоё письмо и решит."
 spn_council_research_reason_tt:0 "Ты Маг или участвуешь в Магическом исследовании"
 spn_council_research_fund_held_tt:0 "У тебя ещё нет Фонда исследований"
