#Secret Events Vampire
 spn_secret_exposed_notification_effect_message_vampire:0 "В0@ вампиризм был раскрыт [secret_exposer.GetTitledFirstName]!"
 spn_secret_exposed_notification_effect_message_vampire.i_exposed:0 "Я раскрыл вампиризм В0@!"

 spn_secrets.0001.t:0 "Тайна раскрыта"
 spn_secrets.0001.desc:0 "В0@ осудил меня как нечестивое зло! Люди теперь называют меня вампиром и врагом [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.0001.a:0 "Разве они не видят ту силу, которую я обладаю?"

 spn_secrets.0002.negative.desc:0 "В0@ публично обвиняет [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в вампиризме! Негодяй [owner.GetWomanMan] — подлое существо! Несомненно, они творение [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] спаси нас от этих созданий!"
 spn_secrets.0002.positive_1.desc:0 "В0@ публично обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в вампиризме!"
 spn_secrets.0002.positive_2.desc:0 "Этот недоумок [secret_exposer.GetWomanMan] пустословит о состоянии [owner.GetTitledFirstNamePossessiveNoTooltip]. Разве [secret_exposer.GetSheHe] не понимает силу, которой обладает [owner.GetTitledFirstNamePossessiveNoTooltip]?"
 spn_secrets.0002.worried.desc:0 "\n\nЯ должен показать им всю силу, которую предоставляет вампиризм! Но... я боюсь, что они обратятся против меня дальше..."
 spn_secrets.0002.dislikes_negative:0 "Убить Вампира!"
 spn_secrets.0002.b:0 "Вампир заплатит!"
 spn_secrets.0002.c:0 "Эти обвинения не что иное, как злонамеренность и ложь."

 spn_secrets.1001.t:0 "Тайна раскрыта"
 spn_secrets.1001.desc:0 "Неизвестный обвинитель раскрыл мой секрет, и меня объявили нечестивым мерзавцем! Теперь люди видят во мне врага [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.1001.a:0 "Разве они не видят ту силу, которую я обладаю?"

#Secret Events Werewolf
 spn_secret_exposed_notification_effect_message_lycan:0 "[owner.GetTitledFirstNamePossessive] Ликантропия была раскрыта [secret_exposer.GetTitledFirstName]!"
 spn_secret_exposed_notification_effect_message_lycan.i_exposed:0 "Я раскрыл [owner.GetTitledFirstNamePossessive] Ликантропию!"

 spn_secrets.0003.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] объявил меня нечестивым мерзавцем! Теперь люди называют меня Волком, и врагом [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.0003.a:0 "Разве они не видят ту силу, которую я обладаю?"

 spn_secrets.0004.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в том, что он Волк! [owner.GetWomanMan|U] — мерзкое существо! Конечно, они творение [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] спаси нас от этих существ!"
 spn_secrets.0004.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] публично обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в Ликантропии!"
 spn_secrets.0004.positive_2.desc:0 "Этот недоумок [secret_exposer.GetWomanMan] пустословит о состоянии [owner.GetTitledFirstNamePossessiveNoTooltip]. Разве [secret_exposer.GetSheHe] не понимает силу, которой обладает [owner.GetTitledFirstNamePossessiveNoTooltip]?"
 spn_secrets.0004.worried.desc:0 "\n\nЯ должен показать им всю силу, которую предлагает Ликантропия! Но... я боюсь, что они также обратятся против меня..."
 spn_secrets.0004.dislikes_negative:0 "Убить Волка!"
 spn_secrets.0004.b:0 "Волк заплатит!"
 spn_secrets.0004.c:0 "Эти обвинения не что иное, как злонамеренность и ложь."

#Secret Events Hybrid
 spn_secret_exposed_notification_effect_message_hybrid:0 "[owner.GetTitledFirstNamePossessive] был раскрыт [secret_exposer.GetTitledFirstName] как Гибрид!"
 spn_secret_exposed_notification_effect_message_hybrid.i_exposed:0 "Я раскрыл [owner.GetTitledFirstName] как Гибрид!"

 spn_secrets.0005.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] объявил меня безбожным абomination! Люди теперь называют меня Гибридом и врагом [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.0005.a:0 "Разве они не видят ту силу, которую я обладаю?"

 spn_secrets.0006.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в том, что тот - Гибрид! Нечестивый [owner.GetWomanMan] - жалкое создание! Несомненно, они - творение [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] спаси нас от этих созданий!"
 spn_secrets.0006.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] публично обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в том, что тот - Гибрид!"
 spn_secrets.0006.positive_2.desc:0 "Этот недоумок [secret_exposer.GetWomanMan] пустословит о состоянии [owner.GetTitledFirstNamePossessiveNoTooltip]. Разве [secret_exposer.GetSheHe] не понимает силу, которой обладает [owner.GetTitledFirstNamePossessiveNoTooltip]?"
 spn_secrets.0006.worried.desc:0 "\n\nЯ должен продемонстрировать им всю силу, которую дает быть Гибридом! Но... я боюсь, что они развернутся против меня..."
 spn_secrets.0006.dislikes_negative:0 "Убейте Абоминацию!"
 spn_secrets.0006.b:0 "Гибрид заплатит!"
 spn_secrets.0006.c:0 "Эти обвинения не что иное, как злонамеренность и ложь."

#Secret Events Hunter
 spn_secret_exposed_notification_effect_message_hunter:0 "[owner.GetTitledFirstNamePossessive] была разоблачена [secret_exposer.GetTitledFirstName] как Охотник!"
 spn_secret_exposed_notification_effect_message_hunter.i_exposed:0 "Я разоблачил [owner.GetTitledFirstName] как Охотника на монстров!"

 spn_secrets.0007.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] объявил меня безбожным абomination! Люди теперь называют меня Охотником на монстров и врагом [ROOT.Char.GetFaith.HighGodName]!"
