 spn_secrets.0008.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в том, что тот - Охотник на монстров! Нечестивый [owner.GetWomanMan] - жалкое создание! Несомненно, они - творение [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] спаси нас от этих созданий!"
 spn_secrets.0008.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] публично обвинил [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] в том, что тот - Охотник на монстров!"
 spn_secrets.0008.positive_2.desc:0 "Этот недоумок [secret_exposer.GetWomanMan] пустословит о состоянии [owner.GetTitledFirstNamePossessiveNoTooltip]. Разве [secret_exposer.GetSheHe] не понимает силу, которой обладает [owner.GetTitledFirstNamePossessiveNoTooltip]?"
 spn_secrets.0008.worried.desc:0 "\n\nЯ должен показать им всю силу, которую предоставляет работа Охотника на монстров! Но... я боюсь, что они повернутся против меня следующим..."
 spn_secrets.0008.dislikes_negative:0 "Убейте Охотника на монстров!"
 spn_secrets.0008.b:0 "Охотник заплатит!"
 spn_secrets.0008.c:0 "Эти обвинения не что иное, как злонамеренность и ложь."

#Spymaster uncovers Vampire
 spn_spymaster_task.0001.t:0 "Шпионаж: Вампиризм"
 spn_spymaster_task.0001.spn_secret_vampire.shared:0 "\n\nКажется, что [secret_holder.GetSheHe] также является вампиром. О, что только не пережил [secret_holder.GetSheHe]... Если бы мы могли открыто говорить о нашей бессмертии."
 spn_spymaster_task.0001.spn_secret_vampire:0 "\n\nСуществуют доказательства того, что [secret_holder.GetSheHe] возможно пьёт кровь других. Какое другое объяснение может быть для чего-то подобного? Они должны быть вампиром!"
 spn_spymaster_task.0001.a:0 "Что сделает это существо?"

#Spymaster uncovers Lycan
 spn_spymaster_task.0002.t:0 "Шпионаж: Ликанторопия"
 spn_spymaster_task.0002.spn_secret_werewolf.shared:0 "\n\nКажется, что [secret_holder.GetSheHe] также является оборотнем. О, что только не пережил [secret_holder.GetSheHe]... Если бы мы могли открыто говорить о нашей бессмертии."
 spn_spymaster_task.0002.spn_secret_werewolf:0 "\n\nСуществуют доказательства того, что [secret_holder.GetSheHe] может иметь способность превращаться в существо, похожее на волка. Какое другое объяснение может быть для чего-то подобного? Они должны быть оборотнем!"
 spn_spymaster_task.0002.a:0 "Что сделает это существо?"

#Spymaster uncovers Hybrid
 spn_spymaster_task.0003.t:0 "Шпионская деятельность: Гибрид"
 spn_spymaster_task.0003.spn_secret_hybrid.shared:0 "\n\nПохоже, что [secret_holder.GetSheHe] тоже является Гибридом. О, что же [secret_holder.GetSheHe], должно быть, пережил... Если бы мы только могли открыто говорить о нашей бессмертии."
 spn_spymaster_task.0003.spn_secret_hybrid:0 "\n\nСуществуют доказательства того, что [secret_holder.GetSheHe] может пить кровь других и превращаться в некое подобие зверя. Какое еще объяснение может быть для чего-либо подобного? Они должны быть Гибридом!"
 spn_spymaster_task.0003.a:0 "Что сделает это существо?"

#Spymaster uncovers Hunter
 spn_spymaster_task.0004.t:0 "Шпионская деятельность: Охотник"
 spn_spymaster_task.0004.spn_secret_hunter.shared:0 "\n\nПохоже, что [secret_holder.GetSheHe] тоже является Охотником. О, что же [secret_holder.GetSheHe], должно быть, пережил... Если бы мы только могли открыто говорить о наших подвигах."
 spn_spymaster_task.0004.spn_secret_hunter:0 "\n\nСуществуют доказательства того, что [secret_holder.GetSheHe] может охотиться на сверхъестественных существ. Какое еще объяснение может быть для чего-либо подобного? Они должны быть Охотником на монстров!"
 spn_spymaster_task.0004.a:0 "Что же сделает этот Охотник на монстров?"
