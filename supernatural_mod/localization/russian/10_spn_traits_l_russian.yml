#Vampire Genetic Traits
 trait_supernatural_vampire:0 "Вампир"
 supernatural_vampire:0 "Вампир"
 trait_supernatural_vampire_desc:0 "Этот персонаж — вампир.\nЭто проклятье считается неизлечимым."
 trait_supernatural_vampire_character_desc:0 ""
 trait_supernatural_vampire_1:0 "Новорождённый вампир"
 trait_supernatural_vampire_2:0 "Вампир"
 trait_supernatural_vampire_3:0 "Почитаемый вампир"
 trait_supernatural_vampire_4:0 "Старейшина вампир"
 trait_track_vampirism:0 "Вампиризм"
 trait_track_vampirism_desc:0 "Древняя кровь существа, дарующая различные способности и преимущества тем, кто жаждет пить кровь других."
 trait_track_blood_magic:0 "Кровавая магия"
 trait_track_blood_magic_desc:0 "В крови бессмертного вампира таится могущество, позволяющее контролировать других и совершенствовать собственные навыки."

 trait_spn_vampire_1_progeny_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — вампир.\nОни обладают вечной молодостью, невообразимой силой и скоростью, а также способностью влиять на разум других.\nБудьте осторожны.\n\n#high Потомок: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_progeny').GetCharacter.GetName] #!"
 trait_spn_vampire_1_sire_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — вампир.\nОни обладают вечной молодостью, невообразимой силой и скоростью, а также способностью влиять на разум других.\nБудьте осторожны.\n\n#high Сир: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!"
 trait_spn_vampire_1_both_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — вампир.\nОни обладают вечной молодостью, невообразимой силой и скоростью, а также способностью влиять на разум других.\nБудьте осторожны.\n\n#high Сир: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!\n#high Недавний потомок: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_progeny').GetCharacter.GetName] #!"

 trait_spn_true_vampire:0 "Истинный вампир"
 trait_spn_true_vampire_desc:0 "Это могущественный вампир, обладающий множеством способностей."

 # Known Vampire
 trait_spn_known_vampire:0 "Известный вампир"
 trait_spn_known_vampire_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] известен как вампир."

 # Lycan Traits
 trait_supernatural_werewolf:0 "Оборотень"
 trait_supernatural_werewolf_desc:0 "Этот персонаж — оборотень.\nЭто генетическая черта, которую можно улучшить."
 trait_supernatural_werewolf_character_desc:0 ""
 trait_track_lycanthropy:0 "Ликантропия"
 trait_track_lycanthropy_desc:0 "Человек, превращающийся в волка и пожирающий животных, людей или трупы, но возвращающийся к человеческому облику."
 trait_track_wolf_pack:0 "Волчья стая"
 trait_track_wolf_pack_desc:0 "Семья, преимущества и множество бонусов от сосредоточения на стае имеют большое значение для оборотней."

 trait_spn_werewolf_3_confer_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — оборотень.\nЭто генетическая черта, которую нельзя улучшить. У детей есть шанс унаследовать улучшенные версии этих черт.\n\n#high Сир: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_both_parents_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — оборотень.\nЭто генетическая черта, которую нельзя улучшить. У детей есть шанс унаследовать улучшенные версии этих черт.\n\n#high Мать: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!\n#high Отец: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_mother_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — оборотень.\nЭто генетическая черта, которую нельзя улучшить. У детей есть шанс унаследовать улучшенные версии этих черт.\n\n#high Мать: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_father_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — оборотень.\nЭто генетическая черта, которую нельзя улучшить. У детей есть шанс унаследовать улучшенные версии этих черт.\n\n#high Отец: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"

 trait_spn_true_werewolf:0 "Истинный оборотень"
 trait_spn_true_werewolf_desc:0 "Это могущественный оборотень, обладающий огромной силой."

