 trait_ww_infected_wound_5:0 "Пожирающая рана"
 trait_track_infection:0 "Заражение"
 trait_track_infection_desc:0 "Насколько далеко скверна зверя распространилась по ране. Чем выше она поднимается, тем меньше шансов пережить перемену."

 trait_spn_true_monster_hunter:0 "Истинный истребитель чудовищ"
 trait_spn_true_monster_hunter_desc:0 "Это Охотник, который встречал чудовищ любого вида, какие только есть, и уцелел в схватке с каждым."
