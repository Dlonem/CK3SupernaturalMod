 trait_track_monster_hunting_desc:0 "Искры тех, кто способен одолеть существ ночи и принести гибель их роду."
 trait_track_witch_hunting:0 "Охота на ведьм"
 trait_track_witch_hunting_desc:0 "Искушённые в тайных искусствах, они уничтожают тех, кто использует их во зло."

 trait_spn_hunter_3_confer_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — охотник на монстров.\n\n#high Обучен: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_hunter_trainer').GetCharacter.GetName] #!"

