l_russian:
 # Supernatural 2.40 (WORK-ORDER-2.40, package Q5: hides and packs). New English keys only.

 # C2 The Wolves Have Teeth: the temple remembers.
 spn_order.0829.b.tt:0 "Каждый член твоего храма держит этот долг вместе с тобой, и твой дом будет хуже думать о доме, который отвечает за [spn_wk_target.GetShortUIName]."
 house_relation_reason_spn_blood_debt_desc:0 "У [char.GetShortUINameNotMe|U] кровный долг перед волками [target_char.GetShortUINameNotMe]"

 # C4 Hold the Unification; Other Packs.
 spn_hold_the_unification_unified_tt:0 "Твоя [spn_pack|E] ещё не была объединена"
 spn_gathering.0305.desc_same:0 "[spn_un_elder.GetShortUIName] связывает твою руку с рукой [spn_un_spouse.GetShortUIName] полоской шкуры и произносит над вами обоими древние слова.\n\nВы уже бегаете одной стаей. Если между вами нет тайн, обряд сделает её чем-то большим, и каждый волк в ней станет больше, чем был."
 spn_gathering.0305.a.tt_same:0 "[spn_un_spouse.GetShortUIName] ведёт твою стаю рядом с тобой. Каждый волк в ней — [spn_evolved|E]."
 SPN_PACK_KNOWN:0 "Другие стаи"

 # C5 Red Eyes in Your Pack.
 spn_pack.2000.t:0 "Красные глаза в твоей стае"
 spn_pack.2000.desc:0 "[spn_ta.GetShortUIName] пришёл к тебе этим утром, и [spn_ta.GetHerHis] глаза были красными. Стая увидела это раньше тебя. Половина из них теперь не смотрит на тебя, а другая половина ждёт, что ты сделаешь.\n\n[spn_ta.GetSheHe|U] не просил стаю. [spn_ta.GetSheHe|U] сказал тебе, что она [spn_ta.GetHerHis]."
 spn_pack.2000.a:0 "[spn_ta.GetSheHe|U] теперь ведёт."
 spn_pack.2000.a.tt:0 "[spn_ta.GetShortUIName] становится альфой этой стаи. Ты сохраняешь своё положение."
 spn_pack.2000.b:0 "Тогда пусть [spn_ta.GetSheHe] возьмёт её силой."
 spn_pack.2000.b.tt:0 "Ты сражаешься с [spn_ta.GetShortUIName] за стаю, волк против волка. Если [spn_ta.GetSheHe] победит, [spn_ta.GetSheHe] поведёт. Если победишь ты, [spn_ta.GetSheHe] уйдёт основать собственную стаю ([spn_ta.GetHerHis]), и кто-то из твоих может последовать за ним."
 spn_pack.2000.c:0 "Уходи и забирай тех, кто пойдёт."
 spn_pack.2000.c.tt:0 "[spn_ta.GetShortUIName] уходит и основывает собственную стаю ([spn_ta.GetHerHis]). Некоторые из твоих волков могут уйти с [spn_ta.GetHerHim]."

 # C6 A Feud Over a Hide: the cause and two more answers.
 spn_pack.0200.desc_force:0 "\n\n[spn_feud_taker.GetShortUIName] снял её с тела [spn_feud_loser.GetShortUIName]."
 spn_pack.0200.desc_fight:0 "\n\n[spn_feud_taker.GetShortUIName] выиграл её у [spn_feud_loser.GetShortUIName] у костра."
 spn_pack.0200.desc_demand:0 "\n\nТеперь она у [spn_feud_taker.GetShortUIName], и [spn_feud_loser.GetShortUIName] отдал её не по своей воле."
 spn_pack.0200.b:0 "[spn_feud_taker.GetShortUIName] за это ответит."
 spn_pack.0200.b.tt:0 "Ты бросаешь [spn_feud_taker.GetShortUIName] Вызов. Победа решит, кто сильнее. Шкуру она не вернёт."
 spn_pack.0200.c:0 "Отпусти. Шкура сделала выбор."
 spn_pack.0200.c.tt:0 "Ты отпускаешь обиду, и [spn_feud_other.GetShortUIName] тоже. Некоторые назовут это слабостью."
 spn_pack.0013.desc_terms:0 "Твоя стая и стая [spn_sa_new.GetShortUIName] теперь одна стая. Два альфы договорились между собой, и ведёт [spn_sa_new.GetShortUIName]."

 # C6 Offer Pack Terms.
 spn_offer_pack_terms_interaction:0 "Предложить условия стаи"
 spn_offer_pack_terms_interaction_desc:0 "Договориться с другим альфой: один из вас бежит под началом другого, или две стаи заключают [spn_blood_pact|E]."
 spn_offer_pack_terms_interaction_notification:0 "[actor.GetShortUIName|U] предлагает условия между вашими стаями."
 spn_offer_pack_terms_heading:0 "Условия"
 spn_terms_my_lead:0 "Бегать под моим началом"
 spn_terms_my_lead_desc:0 "Их стая присоединяется к твоей. [recipient.GetShortUIName] бегает в ней со своим положением ([recipient.GetHerHis])."
 spn_terms_your_lead:0 "Я буду бегать под твоим"
 spn_terms_your_lead_desc:0 "Твоя стая присоединяется к их стае. Ты бегаешь в ней со своим положением."
 spn_terms_pact:0 "Заключить Кровавый пакт"
 spn_terms_pact_desc:0 "Обе стаи остаются как есть, связанные [spn_blood_pact|E]."
 spn_terms_pact_sworn_tt:0 "Ваши стаи ещё не заключили [spn_blood_pact|E]"
 spn_pack_terms_unified_tt:0 "Ни одна из стай не была объединена [spn_unification|E]"
 spn_terms_my_lead_tt:0 "Стая [recipient.GetShortUIName] присоединяется к твоей, и [recipient.GetSheHe] бегает в ней."
 spn_terms_your_lead_tt:0 "Твоя стая присоединяется к стае [recipient.GetShortUIName], и ты бегаешь в ней."
 spn_terms_pact_tt:0 "Ваши стаи заключают [spn_blood_pact|E]."
 spn_ai_terms_they_follow:0 "Их стая присоединилась бы к моей"
 spn_ai_terms_give_up_lead:0 "Я отказался бы от своей стаи"
 spn_ai_terms_smaller:0 "Моя стая намного меньше"
 spn_ai_terms_bigger:0 "Моя стая больше"
 spn_ai_terms_beaten:0 "[actor.GetSheHe|U] победил меня в Вызове"
 spn_ai_terms_ambitious:0 "Я хочу вести, а не следовать"
 spn_ai_terms_pact:0 "Наши стаи связаны [spn_blood_pact|E]"
 spn_ai_terms_gregarious:0 "Я люблю компанию"
 spn_ai_terms_feud:0 "Между нами [spn_hide_feud|E]"
 spn_ai_terms_paranoid:0 "Я не доверяю [actor.GetHerHim]"

 # C7 Battle lines when the player is one of the two in the line.
 spn_hide_feat_1_friendly_player:0 "Ты прорвался сквозь строй, и [TARGET_CHARACTER.GetShortUINameNoTooltip] больше не поднялся."
 spn_hide_feat_1_enemy_player:0 "Тебя повалило нечто, что не было человеком."
 spn_hide_feat_2_friendly_player:0 "Ты ринулся в давку и вышел из неё весь в крови. [TARGET_CHARACTER.GetShortUINameNoTooltip] не вышел вовсе."
 spn_hide_feat_2_enemy_player:0 "Тебя разорвали в давке."
 spn_hide_feat_3_friendly_player:0 "Ты двигался быстрее, чем дано человеку, и [TARGET_CHARACTER.GetShortUINameNoTooltip] пал."
 spn_hide_feat_3_enemy_player:0 "Ты пал от руки [CHARACTER.GetShortUINameNoTooltip], и раны были не от клинка."
 spn_hide_feat_hunter_friendly_player:0 "Ты нашёл зверя в рядах врага и пустил ему кровь."
 spn_hide_feat_hunter_enemy_player:0 "Охотник в их рядах, [CHARACTER.GetShortUINameNoTooltip], нашёл тебя и пустил тебе кровь."
 spn_hide_clash_friendly_player:0 "Два зверя сошлись на поле, и ты вышел из схватки победителем."
 spn_hide_clash_enemy_player:0 "Два зверя сошлись на поле, и ты вышел из схватки окровавленным."
 spn_vade_blow_turned_aside_friendly_player:0 "Удар, который должен был убить тебя, вместо этого нашёл человека рядом с тобой."
 spn_vade_blow_turned_aside_enemy_player:0 "Удар, который должен был убить [CHARACTER.GetShortUINameNoTooltip], вместо этого нашёл человека рядом с [CHARACTER.GetHerHim]."

 # C8 Let It Take Me.
 spn_let_it_take_me_war_tt:0 "Ты или твой сюзерен находитесь в состоянии войны"

 # C11 Satiate Hunger/Thirst.
 spn_satiate_bloodhunger_maxed_tt:0 "Твой вампиризм или ликантропия ещё не достигли пика"

 # F5 Where It Is Kept, for a hide in someone's keeping.
 spn_gathering.0307.desc_held:0 "Поздно, когда костёр догорает, старейший волк круга садится рядом с тобой. Он наблюдал за тобой всю ночь.\n\nОн говорит тебе, что [spn_tale_shrine_hide.GetName] хранится у [spn_tale_holder.GetShortUIName] и что её никто не носит."
 spn_gathering.0307.not_yet_held:0 " Он ещё раз оглядывает тебя. Она бы тебя пока не приняла, говорит он, но из шкур, которые никто не носит, эта ближе всех к тому, кто ты есть."
 spn_gathering.0307.a.tt_held:0 "Ты знаешь, у кого [spn_tale_shrine_hide.GetName]. Как забрать её у [spn_tale_holder.GetShortUIName] — решать тебе."

 # B5 + G11 Send for a Hide.
 spn_hide.0380.desc_agent:0 "\n\n[spn_errand_agent.GetShortUIName] пойдёт за тебя."
 spn_hide.0380.go_agent_tt:0 "[spn_errand_agent.GetShortUIName] отправляется в путь. Когда [spn_errand_agent.GetSheHe] доберётся до святилища, ты решишь, что будет дальше."
 spn_hide.0381.found_agent:0 "Приходит письмо из [spn_errand_county.GetName]. [spn_errand_agent.GetShortUIName] нашёл [spn_errand_faith.HouseOfWorship], и [spn_errand_hide.GetName] висит внутри, где её может видеть любой.\n\n[spn_errand_faith.PriestNeuterPlural] запирают двери на ночь и спят крепко. [spn_errand_agent.GetSheHe|U] ждёт твоего слова."
 spn_hide.0381.gone_agent:0 "Приходит письмо из [spn_errand_county.GetName]. [spn_errand_agent.GetShortUIName] нашёл святилище, но шкура, за которой ты [spn_errand_agent.GetHerHim] послал, [ROOT.Char.Custom('spn_ErrandHideName')], исчезла до того, как [spn_errand_agent.GetSheHe] туда добрался. Никто не сказал куда.\n\n[spn_errand_agent.GetSheHe|U] возвращается домой ни с чем, кроме истории."
 spn_hide.0381.gone_named:0 "Приходит письмо из [spn_errand_county.GetName]. Твой человек нашёл святилище, но шкура, за которой ты его послал, [ROOT.Char.Custom('spn_ErrandHideName')], исчезла до того, как он туда добрался. Никто не сказал куда.\n\nОн возвращается домой ни с чем, кроме истории."
 spn_hide_errand_name_unknown:0 "шкура"
 spn_hide_errand_lean_good_tt:0 "Похоже, это сработает."
 spn_hide_errand_lean_even_tt:0 "Может выйти и так, и так."
 spn_hide_errand_lean_poor_tt:0 "Шансы невелики."
 spn_hide.0381.a.tt:0 "Твой человек попытается вынести её. Если его поймают, узнают, кто его послал."
 spn_hide.0381.a.agent_tt:0 "[spn_errand_agent.GetShortUIName] попытается вынести её. Если [spn_errand_agent.GetSheHe] попадётся, [spn_errand_agent.GetSheHe] будет задержан там, и узнают, кто послал [spn_errand_agent.GetHerHim]."
 spn_hide.0381.a.failure_agent:0 "[spn_errand_agent.GetShortUIName] пойман и задержан, и они знают, кто послал [spn_errand_agent.GetHerHim]."
 spn_hide.0381.b.agent_tt:0 "[spn_errand_agent.GetShortUIName] возвращается домой невредимым."
 spn_hide.0381.won_t:0 "Шкура твоя"
 spn_hide.0381.lost_t:0 "Шкура остаётся на месте"
 spn_hide.0381.powder:0 "Бросить Порошок в святилище."
 spn_hide.0381.powder.tt:0 "Что бы ни случилось, никто в святилище не вспомнит твоего человека. Порошок израсходован."
 spn_hide.0381.powder.success:0 "Никто в святилище не помнит чужака, а шкура уже на пути к тебе."
 spn_hide.0381.powder.failure:0 "Твой человек вернулся ни с чем, и никто там его не помнит. Порошок израсходован."
 spn_hide.0381.wolf:0 "Пойти самому, ночью."
 spn_hide.0381.wolf.tt:0 "Ты идёшь в обличье волка, один. Если что-то пойдёт не так, ты будешь ранен, а графство заговорит о волке."
 spn_hide.0381.wolf.success:0 "Ты пришёл и ушёл прежде, чем проснулись собаки. Шкура твоя."
 spn_hide.0381.wolf.failure:0 "Тебя ждали. Ты ушёл раненым и с пустыми руками, а графство говорит о волке."
 spn_hide.0381.pack:0 "Послать вместо себя волка из стаи."
 spn_hide.0381.pack.tt:0 "[spn_errand_wolf.GetShortUIName] идёт вместо тебя. Если что-то пойдёт не так, [spn_errand_wolf.GetSheHe] заплатит кровью, а графство заговорит о волке."
 spn_hide.0381.pack.success:0 "[spn_errand_wolf.GetShortUIName] принёс её тебе."
 spn_hide.0381.pack.failure:0 "[spn_errand_wolf.GetShortUIName] вернулся раненым и с пустыми руками, а графство говорит о волке."
 spn_hide.0381.compel:0 "Заставить хранителя принести её тебе."
 spn_hide.0381.compel.tt:0 "Твой голос может дотянуться до [spn_errand_keeper.GetShortUIName] на расстоянии. Если не выйдет, кто-нибудь заметит, кто ты такой."
 spn_hide.0381.compel.success:0 "[spn_errand_keeper.GetShortUIName] прислал её тебе в дар и сам толком не знает почему."
 spn_hide.0381.compel.failure:0 "[spn_errand_keeper.GetShortUIName] стряхнул твою власть. Графство говорит о чём-то, что пришло в ночи."

 # Boot 2 (b) The pack's panel: nobody listed twice.
 SPN_PACK_REST:0 "Остальная стая"

 # Boot 2 (j) Offer Pack Terms: who may send it.
 spn_terms_not_alpha_tt:0 "Предлагать условия за стаю может только её альфа"
 spn_terms_no_pack_tt:0 "Чтобы предлагать условия, ты должен вести [spn_pack|E]. Основай её или попросись бегать с их стаей"

 # Boot 2 (k) Pack Members Clash (Young Wolves Fight until boot 3), rebuilt as a choice.
 spn_pack.0102.desc_intro:0 "Сегодня ночью [spn_mo_ours.GetShortUIName] встретил [spn_mo_theirs.GetShortUIName] на опушке леса."
 spn_pack.0102.desc_pack_house:0 " [spn_mo_theirs.GetSheHe|U] бегает со стаей дома [spn_mo_other.GetHouse.GetBaseName] из [spn_yf_other_land.GetName], под началом её альфы, [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_pack_land:0 " [spn_mo_theirs.GetSheHe|U] бегает со стаей из [spn_yf_other_land.GetName], под началом её альфы, [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_pack_alpha:0 " [spn_mo_theirs.GetSheHe|U] бегает со стаей [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_ring:0 " Теперь они кружат друг вокруг друга, вздыбив шерсть, а волки обеих стай встали вокруг них кольцом. Каждый из них ждёт, что ты сделаешь."
 spn_pack.0102.desc_odds:0 "\n\nЭто не игра. Между твоей стаей и стаей [spn_mo_other.GetShortUIName] дурная кровь, и если позволить драке идти, один из них может больше не подняться."
 spn_pack.0102.desc_game:0 "\n\nЭто из тех драк, что бывают у молодых волков. Кто-то приковыляет домой, и, скорее всего, на этом всё кончится."
 spn_pack.0102.part:0 "Растащить их."
 spn_pack.0102.settle:0 "Пусть разберутся сами."
 spn_pack.0102.settle.tt:0 "Они дерутся до конца. Проигравший будет ранен."
 spn_pack.0102.settle.tt_odds:0 "Между вашими стаями это настоящая схватка. Проигравший будет ранен и может погибнуть."
 spn_pack.0102.back:0 "Я стою за [spn_mo_ours.GetShortUIName]."
 spn_pack.0102.back.tt:0 "Твоё имя идёт в бой вместе с [spn_mo_ours.GetShortUIName]. Если [spn_mo_ours.GetSheHe] победит, ты получишь [prestige|E], а [spn_mo_ours.GetSheHe] получит [spn_pack_standing|E]. Если [spn_mo_ours.GetSheHe] проиграет, ты потеряешь [prestige|E]."
 spn_pack.0102.back.tt_house:0 "Принятие стороны немного портит отношения между твоим [house|E] и домом [spn_mo_other.GetHouse.GetBaseName], и сильнее, если погибнет волк. Драка за дракой, два дома могут прийти к вражде."
 spn_pack.0102.back.tt_odds:0 "Ты и [spn_mo_other.GetShortUIName] можете стать соперниками."
 spn_pack.2001.t:0 "После драки"
 spn_pack.2001.desc_killed:0 "[spn_mo_ours.GetShortUIName] вернулся домой один и молча. [spn_clash_loser.GetShortUIName] больше не поднялся. Волки [spn_mo_other.GetShortUIName] унесли [spn_clash_loser.GetHerHim] домой на руках и не забудут, чей волк это сделал."
 spn_pack.2001.desc_died:0 "Всё кончилось быстро. В конце [spn_clash_winner.GetShortUIName] стоял над [spn_mo_ours.GetShortUIName], и [spn_mo_ours.GetShortUIName] больше не поднялся. Твои волки унесли [spn_mo_ours.GetHerHim] домой на руках."
 spn_pack.2001.desc_won_odds:0 "[spn_mo_ours.GetShortUIName] и [spn_mo_theirs.GetShortUIName] дрались всерьёз, и за ними стояла дурная кровь обеих стай. Твой вернулся домой первым, изодранный и в крови, а [spn_mo_theirs.GetShortUIName] отнесли обратно к волкам [spn_mo_other.GetShortUIName]."
 spn_pack.2001.desc_lost_odds:0 "[spn_mo_ours.GetShortUIName] и [spn_mo_theirs.GetShortUIName] дрались всерьёз, и за ними стояла дурная кровь обеих стай. Твой вернулся домой изодранным и хромая, а волки [spn_mo_other.GetShortUIName] уже слагают об этом историю."
 spn_pack.2001.desc_backed_won:0 "\n\nВсе видели, как ты стоял за [spn_mo_ours.GetShortUIName], и все видели, как [spn_mo_ours.GetHerHim] победил."
 spn_pack.2001.desc_backed_lost:0 "\n\nВсе видели, как ты стоял за [spn_mo_ours.GetShortUIName], и все видели, как [spn_mo_ours.GetHerHim] проиграл."
 spn_pack.2001.desc_seen:0 "\n\nПастух видел часть этого с другого края долины. Он не станет держать это при себе."
 spn_pack.2001.desc_none:0 ""
 spn_pack.2001.a:0 "Молодые волки."
 spn_pack.2001.a_dead:0 "До такого не должно было дойти."
