l_russian:
 spn_blood_will_not_take_tt:0 "Something already in your blood will not let it in."
 spn_calling_will_not_take_tt:0 "What you already are will not let you take up the hunter's calling."
 spn_household_blood_decision:0 "Answer the Old Blood"
 spn_household_blood_decision_desc:0 "Something old runs in your family, and it has been waiting for one of you to listen."
 spn_household_blood_decision_tt:0 "Choose what the blood makes of you."
 spn_household_blood_decision_confirm:0 "Listen"
 spn_household_blood_decision_effect_tt:0 "Choose what the blood makes of you: a [GetTrait('supernatural_vampire').GetName( GetNullCharacter )], a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], a [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] or a [GetTrait('demon1').GetName( GetNullCharacter )].\nFor the first three you also choose how far it has already taken you: not at all, halfway, or all the way along its track."
 spn_household.0001.t:0 "The Old Blood Answers"
 spn_household.0001.desc:0 "It was always there, under the family's name and behind its portraits. Now that you have listened, it asks only what you want to be."
 spn_household.0001.a:0 "The thirst."
 spn_household.0001.a.tt:0 "You become a [GetTrait('supernatural_vampire').GetName( THIS.Char )], and choose how far into it."
 spn_household.0001.b:0 "The wolf."
 spn_household.0001.b.tt:0 "You become a [GetTrait('supernatural_werewolf').GetName( THIS.Char )], and choose how far into it."
 spn_household.0001.c:0 "Both."
 spn_household.0001.c.tt:0 "You become a [GetTrait('supernatural_hybrid').GetName( THIS.Char )], and choose how far into it."
 spn_household.0001.d:0 "The pit."
 spn_household.0001.d.tt:0 "You become a [GetTrait('demon1').GetName( THIS.Char )]."
 spn_household.0001.e:0 "Not today."
 spn_household_hide_decision:0 "Send for the Family Hide"
 spn_household_hide_decision_desc:0 "One of the old hides has been in the family's keeping longer than anyone remembers. Have it brought to you."
 spn_household_hide_decision_tt:0 "Have the hide that suits you best brought to you."
 spn_household_hide_decision_confirm:0 "Send for it"
 spn_household_hide_decision_effect_tt:0 "The hide that suits you best is brought to you. Whether it chooses you is up to the hide."
 spn_household_none_free_tt:0 "Every hide is spoken for."
 spn_household_strongbox_decision:0 "Open the Family Strongbox"
 spn_household_strongbox_decision_desc:0 "The family has always kept something back for the ones who carry its blood."
 spn_household_strongbox_decision_tt:0 "Gold, and what the blood has taught you."
 spn_household_strongbox_decision_confirm:0 "Open it"
 spn_household_mend_decision:0 "Let the Blood Mend You"
 spn_household_mend_decision_desc:0 "Wounds close, fevers break, and the weight on the mind lifts. What people say about you, you keep."
 spn_household_mend_decision_tt:0 "Mend the body: wounds, scars, sickness and the weight on the mind."
 spn_household_mend_decision_confirm:0 "Let it"
 spn_household_mend_tt:0 "Every wound, scar, sickness and infirmity is healed, and #V 100#! stress is lifted."
 spn_household_silence_decision:0 "The Household Keeps Its Silence"
 spn_household_silence_decision_desc:0 "Every old family has people who know more than they say. It does no harm to remind them whose bread they eat."
 spn_household_silence_decision_tt:0 "Up to three of your courtiers become [GetTrait('loyal').GetName( GetNullCharacter )], those who know your secrets first."
 spn_household_silence_decision_confirm:0 "Speak to them"
 spn_household_silence_none_tt:0 "Every adult in your court is already loyal."
 spn_hunt_cl_none:0 ""
 spn_hunt_cl_door_alone:0 "is at your door, and"
 spn_hunt_cl_door_one:0 "is at your door with another hunter, and"
 spn_hunt_cl_door_many:0 "is at your door with a band of hunters, and"
 spn_hunt_cl_fight_one:0 " There is a second hunter at the door."
 spn_hunt_cl_fight_many:0 " There are other hunters at the door."
 spn_hunt_cl_down_one:0 " The hunter who rode with you is down too."
 spn_hunt_cl_down_many:0 " One of the hunters who rode with you is down too."
 spn_hunt_cl_forgot_too:0 " Nobody who rode with you remembers it either."
 spn_hunt.2000.desc_company:0 "[activity.Custom('SpnHuntWithYouDown')]"
 spn_hunt.2002.desc_company:0 "[activity.Custom('SpnHuntTurnedBackCompany')]"
 spn_hunt.2010.t:0 "Riding Home"
 spn_hunt.2010.desc_done:0 "It is finished, and you were there when it was. [spn_hunter.GetTitledFirstName] does not say much on the road, and neither do you. You have seen how the work is done, up close, and you will not see it the same way again."
 spn_hunt.2010.desc_beaten:0 "[spn_hunter.GetTitledFirstName] got out of that house, and so did you. Not everyone who rode out with [spn_hunter.GetHerHim] is riding home whole, and nobody talks about what was behind the door."
 spn_hunt.2010.desc_compelled:0 "At the last door [spn_hunter.GetTitledFirstName] stopped, turned round, and rode for home, and when you ask why, [spn_hunter.GetSheHe] cannot tell you. Neither can you."
 spn_hunt.2010.desc_terms:0 "[spn_hunter.GetTitledFirstName] came out of that house with terms instead of blood on [spn_hunter.GetHerHis] hands. You ride home and you do not ask what they were."
 spn_hunt.2010.desc_quiet:0 "Three weeks, and no fight at the end of them. You ride home with tired horses and a few things learned about how a trail is followed."
 spn_hunt.2010.a:0 "Home."
 spn_hunt.0300.desc_witch_found:0 "There was a real name under all the others, and you found the woman it belonged to. What became of her was your decision. The rest of the list was only the county's grudges."
 decision_group_type_spn_household:0 "The Household"
