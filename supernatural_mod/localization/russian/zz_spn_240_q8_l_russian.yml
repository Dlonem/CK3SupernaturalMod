l_russian:

 # Supernatural 2.40, package Q8: pickers, the household, the hunt, feeding.

 # F3: the embrace decisions, when something already in the blood refuses it
 spn_blood_will_not_take_tt:0 "Нечто, что уже есть в твоей крови, не впустит это."
 spn_calling_will_not_take_tt:0 "То, кем ты уже являешься, не позволит тебе избрать призвание охотника."

 # F2: household administration. Deliberately dull, as in the Long Night's: nothing here should read as remarkable to a
 # player who is not looking for it.
 spn_household_blood_decision:0 "Ответить старой крови"
 spn_household_blood_decision_desc:0 "В твоей семье течёт нечто древнее, и оно ждало, когда кто-нибудь из вас прислушается."
 spn_household_blood_decision_tt:0 "Выбери, кем тебя сделает кровь."
 spn_household_blood_decision_confirm:0 "Прислушаться"
 spn_household_blood_decision_effect_tt:0 "Выбери, кем тебя сделает кровь: [GetTrait('supernatural_vampire').GetName( GetNullCharacter )], [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] или [GetTrait('demon1').GetName( GetNullCharacter )].\nДля первых трёх ты также выбираешь, как далеко она тебя уже завела: ничуть, наполовину или до конца её ветви."
 spn_household.0001.t:0 "Старая кровь отвечает"
 spn_household.0001.desc:0 "Она всегда была здесь, под именем семьи и за её портретами. Теперь, когда ты прислушался, она спрашивает лишь, кем ты хочешь быть."
 spn_household.0001.a:0 "Жажда."
 spn_household.0001.a.tt:0 "Ты становишься [GetTrait('supernatural_vampire').GetName( THIS.Char )] и выбираешь, как далеко зайти."
 spn_household.0001.b:0 "Волк."
 spn_household.0001.b.tt:0 "Ты становишься [GetTrait('supernatural_werewolf').GetName( THIS.Char )] и выбираешь, как далеко зайти."
 spn_household.0001.c:0 "Оба."
 spn_household.0001.c.tt:0 "Ты становишься [GetTrait('supernatural_hybrid').GetName( THIS.Char )] и выбираешь, как далеко зайти."
 spn_household.0001.d:0 "Преисподняя."
 spn_household.0001.d.tt:0 "Ты становишься [GetTrait('demon1').GetName( THIS.Char )]."
 spn_household.0001.e:0 "Не сегодня."

 spn_household_hide_decision:0 "Послать за семейной шкурой"
 spn_household_hide_decision_desc:0 "Одна из старых шкур хранится в семье дольше, чем кто-либо помнит. Вели принести её тебе."
 spn_household_hide_decision_tt:0 "Вели принести тебе шкуру, которая подходит тебе лучше всего."
 spn_household_hide_decision_confirm:0 "Послать за ней"
 spn_household_hide_decision_effect_tt:0 "Тебе приносят шкуру, которая подходит тебе лучше всего. Выберет ли она тебя — решать шкуре."
 spn_household_none_free_tt:0 "Все шкуры уже заняты."

 spn_household_strongbox_decision:0 "Открыть семейный сундук"
 spn_household_strongbox_decision_desc:0 "Семья всегда кое-что припасала для тех, кто несёт её кровь."
 spn_household_strongbox_decision_tt:0 "Золото и то, чему тебя научила кровь."
 spn_household_strongbox_decision_confirm:0 "Открыть"

 spn_household_mend_decision:0 "Пусть кровь исцелит тебя"
 spn_household_mend_decision_desc:0 "Раны затягиваются, жар спадает, тяжесть с души уходит. То, что о тебе говорят люди, остаётся при тебе."
 spn_household_mend_decision_tt:0 "Исцелить тело: раны, шрамы, болезни и тяжесть на душе."
 spn_household_mend_decision_confirm:0 "Пусть исцелит"
 spn_household_mend_tt:0 "Все раны, шрамы, болезни и немощи исцелены, и снято #V 100#! стресса."

 spn_household_silence_decision:0 "Дом хранит молчание"
 spn_household_silence_decision_desc:0 "В каждой старой семье есть люди, которые знают больше, чем говорят. Не повредит напомнить им, чей хлеб они едят."
 spn_household_silence_decision_tt:0 "До трёх твоих придворных становятся [GetTrait('loyal').GetName( GetNullCharacter )] — в первую очередь те, кто знает твои тайны."
 spn_household_silence_decision_confirm:0 "Поговорить с ними"
 spn_household_silence_none_tt:0 "Все взрослые при твоём дворе уже верны."

 # D6: the hunt's text counts the hunters (common/customizable_localization/zz_spn_240_hunt_custom_loc.txt)
 spn_hunt_cl_none:0 ""
 spn_hunt_cl_door_alone:0 "стоит у твоей двери, и"
 spn_hunt_cl_door_one:0 "стоит у твоей двери с другим охотником, и"
 spn_hunt_cl_door_many:0 "стоит у твоей двери с отрядом охотников, и"
 spn_hunt_cl_fight_one:0 " У двери второй охотник."
 spn_hunt_cl_fight_many:0 " У двери другие охотники."
 spn_hunt_cl_down_one:0 " Охотник, который ехал с тобой, тоже повержен."
 spn_hunt_cl_down_many:0 " Один из охотников, которые ехали с тобой, тоже повержен."
 spn_hunt_cl_forgot_too:0 " Никто из тех, кто ехал с тобой, тоже этого не помнит."
 spn_hunt.2000.desc_company:0 "[activity.Custom('SpnHuntWithYouDown')]"
 spn_hunt.2002.desc_company:0 "[activity.Custom('SpnHuntTurnedBackCompany')]"

 # D6: Riding Home, a player guest's ending
 spn_hunt.2010.t:0 "Дорога домой"
 spn_hunt.2010.desc_done:0 "Всё кончено, и ты был там, когда это случилось. [spn_hunter.GetTitledFirstName] мало говорит в дороге, как и ты. Ты увидел вблизи, как делается эта работа, и больше не будешь смотреть на неё по-прежнему."
 spn_hunt.2010.desc_beaten:0 "[spn_hunter.GetTitledFirstName] выбрался из того дома, и ты тоже. Не все, кто выехал с [spn_hunter.GetHerHim], возвращаются домой целыми, и никто не говорит о том, что было за дверью."
 spn_hunt.2010.desc_compelled:0 "У последней двери [spn_hunter.GetTitledFirstName] остановился, развернулся и поскакал домой, а когда ты спрашиваешь почему, [spn_hunter.GetSheHe] не может ответить. Как и ты."
 spn_hunt.2010.desc_terms:0 "[spn_hunter.GetTitledFirstName] вышел из того дома с договором, а не с кровью на [spn_hunter.GetHerHis] руках. Ты едешь домой и не спрашиваешь, каковы были условия."
 spn_hunt.2010.desc_quiet:0 "Три недели — и никакой схватки в конце. Ты едешь домой на усталых конях, узнав кое-что о том, как идут по следу."
 spn_hunt.2010.a:0 "Домой."

 # D6: the Witch Hunt now opens with A List of Names; the conclusion knows when the list led somewhere
 spn_hunt.0300.desc_witch_found:0 "Под всеми прочими было одно настоящее имя, и ты нашёл женщину, которой оно принадлежало. Что с ней стало, решал ты. Остальной список был лишь обидами графства."
 decision_group_type_spn_household:0 "Дом"
