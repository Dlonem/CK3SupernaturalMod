l_russian:
 # Supernatural 2.43 -- werewolf moments (spn_moment.0026 to .0033). #spn_wolf is the wolf's own voice.
 spn_moment.0026.t:0 "Гончие"
 spn_moment.0026.desc:0 "На псарне шумно, пока ты не входишь. Тогда все гончие затихают и ложатся брюхом на солому.\n\n[spn_wm_servant.GetFirstName] смотрит на собак, а потом на тебя."
 spn_moment.0026.a:0 "Хорошие собаки."
 spn_moment.0026.b:0 "Они знают, кто их кормит. Скажи это."
 spn_moment.0026.c:0 "После этого я обхожу псарню стороной."
 spn_moment.0027.t:0 "Накануне"
 spn_moment.0027.desc:0 "Завтра полнолуние. Сегодня мясо безвкусно, в зале слишком шумно, а собственная кожа сидит на тебе не так.\n\n[Glossary('#spn_wolf Brátt.#!','spn_gloss_wolf_bratt')]"
 spn_moment.0027.a:0 "Я рано запираю дверь."
 spn_moment.0027.b:0 "Я уезжаю, пока ещё могу."
 spn_moment.0027.c:0 "Я досиживаю ужин. Еле-еле."
 spn_moment.0028.t:0 "Оленина"
 spn_moment.0028.desc:0 "По какой-то ошибке на кухне оленину подают почти сырой. Ты очищаешь тарелку прежде, чем кто-либо успевает взяться за нож.\n\nСтол это заметил."
 spn_moment.0028.a:0 "Я кладу кость. Медленно."
 spn_moment.0028.b:0 "Я был голоден. Пусть смотрят."
 spn_moment.0028.c:0 "Несите второй окорок."
 spn_moment.0029.t:0 "Грязь на лестнице"
 spn_moment.0029.desc:0 "[spn_wm_servant.GetFirstName] стоит на коленях на лестнице и отскребает пол. Следы ведут со двора — босые ноги. На полпути наверх они становятся чем-то другим.\n\n[spn_wm_servant.GetSheHe|U] ещё не поднял на тебя глаз."
 spn_moment.0029.a:0 "Забежала собака. Вот и всё."
 spn_moment.0029.b:0 "Я беру щётку и заканчиваю сам."
 spn_moment.0029.c:0 "Ты видел собаку. Повтори."
 spn_moment.0030.t:0 "Будет дождь"
 spn_moment.0030.desc:0 "Небо ясное, а ты всё равно чуешь дождь. Он в часе отсюда, может, и меньше, идёт с запада.\n\nНикто больше во дворе даже не поднял головы."
 spn_moment.0030.a:0 "Убирайте сено. Сейчас же."
 spn_moment.0030.b:0 "Я молчу и смотрю, как они бегут."
 spn_moment.0031.t:0 "Другой голос"
 spn_moment.0031.desc:0 "После темноты с холмов доносится вой. Это не волк. Ты точно знаешь, как звучит волк.\n\n[Glossary('#spn_wolf Eigi einn.#!','spn_gloss_wolf_einn')]"
 spn_moment.0031.a:0 "Я отвечаю ему."
 spn_moment.0031.b:0 "Я слушаю, пока он не стихнет."
 spn_moment.0031.c:0 "Я удваиваю стражу."
 spn_moment.0032.t:0 "Любимец пса"
 spn_moment.0032.desc:0 "[spn_wm_child.GetFirstName] хочет знать, почему старый пёс ходит за тобой из комнаты в комнату и не идёт ни к кому другому.\n\n«На священника он рычит, — говорит [spn_wm_child.GetSheHe]. — А на тебя никогда»."
 spn_moment.0032.a:0 "Он знает, что я никогда его не обижу."
 spn_moment.0032.b:0 "Спроси его. Может, он тебе скажет."
 spn_moment.0032.c:0 "Собаки знают, кто здесь главный."
 spn_moment.0033.t:0 "Серебряная чаша"
 spn_moment.0033.desc:0 "Гость принёс тебе подарок: чашу для питья из чистого серебра, которую он протягивает обеими руками перед всем залом.\n\nВсе ждут, что ты её возьмёшь.\n\n[Glossary('#spn_wolf Eigi þat.#!','spn_gloss_wolf_that')]"
 spn_moment.0033.a:0 "Я беру её. И улыбаюсь."
 spn_moment.0033.b:0 "На мне перчатки. Я беру её."
 spn_moment.0033.c:0 "Переплавьте её для бедных."
