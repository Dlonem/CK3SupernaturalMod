 #####################
 ### Main Concepts ###
 #####################
 
 game_concept_vampire:0 "Вампир"
 game_concept_vampires:0 "Вампиры"
 game_concept_vampire_desc:0 "Вампиры — бессмертные сверхъестественные существа, проклятые жаждой крови. Они живут среди людей, скрывая свою истинную природу. Их сила превосходит возможности любого смертного, они обладают повышенной скоростью и способностью контролировать действия других. Несмотря на их огромное могущество, вампиры вечно разрываются между хищническими инстинктами и остатками своей человечности."

 game_concept_werewolf:0 "Оборотень"
 game_concept_werewolves:0 "Оборотни"
 game_concept_werewolf_desc:0 "Оборотни — сверхъестественные существа, наделённые огромной силой, ловкостью и обострёнными чувствами. Их проклятье вынуждает принимать двойственную природу, превращаясь в могучих зверей. Несмотря на первобытные инстинкты, оборотни часто образуют крепкие стаи и живут среди людей, балансируя между своей человечностью и зовом дикой природы."

 game_concept_hybrid:0 "Гибрид"
 game_concept_hybrids:0 "Гибриды"
 game_concept_hybrid_desc:0 "Гибриды — почти мифические существа, рождённые от слияния кровей вампиров и оборотней. Их существование бросает вызов законам природы, наделяя их совокупной силой обоих: бессмертием, непревзойдённой мощью и способностью существовать между мирами без многих ограничений, обременяющих их сородичей. Гибриды — живые легенды, внушающие одновременно благоговение и страх."

 game_concept_spn_hunter:0 "Охотник"
 game_concept_spn_hunters:0 "Охотники"
 game_concept_spn_hunter_desc:0 "Охотники — умелые и преданные воины, чья задача — защищать мир от сверхъестественных угроз. Они специализируются на двух дисциплинах: охоте на монстров, нацеленной на вампиров, оборотней и других существ, и охоте на ведьм, сосредоточенной на магических отступниках. Их решимость и подготовка делают их первой линией защиты человечества против неизведанного."
 
 game_concept_mmaker:0 "Создатель"
 game_concept_mmaker_plural:0 "Создатели"
 game_concept_mmaker_desc:0 "[Concept('vampire','Вампир')|E], создавший другого вампира. Создатель связан сверхъестественной связью со своим [Concept('pprogeny','Потомком')|E], которая может дарить прозрения, лояльность и — в некоторых случаях — абсолютное влияние. Некоторые способности и взаимодействия ссылаются на эту связь, позволяя создателю навязывать свою волю при выполнении условий."

 game_concept_pprogeny:0 "Потомок"
 game_concept_pprogeny_plural:0 "Потомки"
 game_concept_pprogeny_desc:0 "Вампир, созданный [Concept('mmaker','Создателем')|E]. Потомки часто ощущают зов крови своего создателя — неразрывную связь, которая может влиять на эмоции или решения. Некоторые события и взаимодействия используют эту связь, хотя сила воли, расстояние и обстоятельства могут ослабить её."

 game_concept_sire_bond:0 "Связь создателя"
 game_concept_sire_bond_desc:0 "Оккультная нить между [Concept('mmaker','Создателем')|E] и его [Concept('pprogeny','Потомком')|E]. На практике она проявляется как почтение, общие инстинкты и порой — принуждение. Механики и моды могут использовать её для разблокировки уникальных опций (например, #bold Взывать к крови#!) или изменения шансов принятия."
 
 
 ###################
 ### Men At Arms ###
 ###################
 game_concept_supernatural_animals:0 "Животные"
 game_concept_supernatural_animal:0 "Животное"
 game_concept_animal:0 "Животное"
 game_concept_supernatural_animal_desc:0 "Животные — это [men_at_arms|E], которыми командуют сверхъестественные монстры, искусные в преследовании врага.\n\nХотя их качество может быть низким, они компенсируют это количеством. Обычно они [counter|E] [archers|E]."

 game_concept_supernatural_monsters:0 "Монстры"
 game_concept_supernatural_monster:0 "Монстр"
 game_concept_monster:0 "Монстр"
 game_concept_supernatural_monster_desc:0 "Монстры — это [men_at_arms|E], которыми командуют другие, более могущественные сверхъестественные монстры, искусные в уничтожении неподготовленного врага.\n\nХотя их количество может быть небольшим, их высокое качество проявляется в полной мере. Обычно они [counter|E] [archers|E]."
 
 #game_concept_werewolf:0 "Werewolf"
 game_concept_were-wolves:0 "Оборотни"
 game_concept_werewolves_desc:0 "Оборотни — это [men_at_arms|E], которыми командуют другие, более могущественные сверхъестественные монстры, искусные в уничтожении неподготовленного врага.\n\nХотя их количество может быть небольшим, их высокое качество проявляется в полной мере."

 game_concept_feeding_success_chance_no_prefix:0 "Шанс успешного питания"
 game_concept_feeding_success_chance:0 "Шанс успешного питания"
 game_concept_feeding_success_chance_desc:0 "При участии в [GetActivityType('vampire_feeding').GetName] успех не гарантирован. Основные факторы, влияющие на успех питания:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] или [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] целевой территории\n$BULLET_WITH_TAB$Выбранная подготовка и [intent|E] во время активности\n\n$game_concept_feeding_success_chance$ никогда не может превышать #V 95#!.\n\n#weak Успешное питание усиливает вашу вампирскую силу. Скрытность крайне важна; неудача может раскрыть вашу природу миру.#!"
 game_concept_feeding_success_chance_no_prefix_desc:0 "При участии в [GetActivityType('vampire_feeding').GetName] успех не гарантирован. Основные факторы, влияющие на успех питания:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] или [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] целевой территории\n$BULLET_WITH_TAB$Выбранная подготовка и [intent|E] во время активности\n\n$game_concept_feeding_success_chance$ никогда не может превышать #V 95#!.\n\n#weak Успешное питание усиливает вашу вампирскую силу. Скрытность крайне важна; неудача может раскрыть вашу природу миру.#!"

### added by sync_localizations.py -- untranslated, 6 keys
 game_concept_vampire_feeding:0 "Vampire Feeding"
 game_concept_feeding:0 "feeding"
 game_concept_feedings:0 "feedings"
 game_concept_feeding_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_feedings_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_vampire_feeding_desc:0 "Vampire Feeding is an [activity|E] in which a [Concept('vampire','Vampire')|E] or [Concept('hybrid','Hybrid')|E] hunts a mortal for blood, usually in one of your towns.\n\nA clean, undiscovered feeding quietly bleeds the host county—both its [development|E] and its Control fall. Poorer, less-controlled lands are the easiest prey, so vampires hunt your weakest holdings first.\n\nYou will rarely catch a feeder in the act. When a county's development or control slips for no clear reason, a vampire may be hunting there—but you will only think to look if you know one walks your realm."
