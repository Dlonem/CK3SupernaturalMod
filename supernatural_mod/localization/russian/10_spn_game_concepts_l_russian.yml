l_russian:
 #####################
 ### Main Concepts ###
 #####################
 
 game_concept_vampire:0 "Вампир"
 game_concept_vampires:0 "Вампиры"
 game_concept_vampire_desc:0 "Вампиры — бессмертные сверхъестественные существа, проклятые жаждой крови. Они живут среди людей, скрывая свою истинную природу. Их сила не имеет равных среди смертных, и они обладают обострённой скоростью и способностью управлять чужими поступками. Но при всей своей мощи они обречены на вечную борьбу между хищными инстинктами и остатками человечности."

 game_concept_werewolf:0 "Оборотень"
 game_concept_werewolves:0 "Оборотни"
 game_concept_werewolf_desc:0 "Оборотни — сверхъестественные существа, наделённые огромной силой, ловкостью и обострёнными чувствами. Их проклятие вынуждает их принять свою двойную природу и обращаться в могучих зверей. При всей первобытности инстинктов оборотни часто сбиваются в крепкие стаи и живут среди людей, уравновешивая человечность зовом дикой природы."

 game_concept_hybrid:0 "Гибрид"
 game_concept_hybrids:0 "Гибриды"
 game_concept_hybrid_desc:0 "Гибриды — почти легендарные создания, рождённые от слияния вампирской и волчьей крови. Их существование попирает законы природы, даруя им силы обоих: бессмертие, несравненную мощь и способность ходить между мирами без многих ограничений, что тяготят их сородичей. Гибриды — живые легенды; их присутствие и повергает в благоговение, и внушает страх."

 game_concept_spn_hunter:0 "Охотник"
 game_concept_spn_hunters:0 "Охотники"
 game_concept_spn_hunter_desc:0 "Охотники — умелые и преданные воины, призванные защищать мир от сверхъестественных угроз. Они владеют двумя дисциплинами: истреблением чудовищ, нацеленным на вампиров, оборотней и прочих тварей, и истреблением ведьм, обращённым против колдунов-отступников. Их решимость и выучка делают их первым рубежом человечества против неведомого."

 game_concept_mmaker:0 "Создатель"
 game_concept_mmaker_plural:0 "Создатели"
 game_concept_mmaker_desc:0 "[Concept('vampire','Vampire')|E], создавший другого вампира. Создатель разделяет со своим [Concept('pprogeny','Progeny')|E] сверхъестественную связь, которая может давать понимание, верность, а порой и прямое влияние. Некоторые силы и взаимодействия опираются на эти узы и позволяют Создателю навязывать свою волю при соблюдении условий."

 game_concept_pprogeny:0 "Потомство"
 game_concept_pprogeny_plural:0 "Потомство"
 game_concept_pprogeny_desc:0 "Вампир, созданный [Concept('mmaker','Sire')|E]. Потомство часто чувствует зов крови своего создателя — затаённую связь, способную влиять на чувства и решения. Некоторые события и взаимодействия могут использовать эту связь, хотя сила воли, расстояние и обстоятельства способны её ослабить."

 game_concept_sire_bond:0 "Узы создателя"
 game_concept_sire_bond_desc:0 "Оккультная привязь между [Concept('mmaker','Sire')|E] и его [Concept('pprogeny','Progeny')|E]. На практике она проявляется как почтение, общие инстинкты и порой принуждение. Моды и механики могут использовать её, чтобы открывать особые варианты (например, #bold Призвать узы#!) или изменять шансы согласия."


 ###################
 ### Men At Arms ###
 ###################
 game_concept_supernatural_animals:0 "Звери"
 game_concept_supernatural_animal:0 "Зверь"
 game_concept_animal:0 "Зверь"
 game_concept_supernatural_animal_desc:0 "Звери — это [men_at_arms|E], которыми командуют сверхъестественные чудовища; они искусны в изматывании врага.\n\nКачество их может быть невысоким, но они берут числом. Обычно они [counter|E] [archers|E]."
 
 game_concept_supernatural_monsters:0 "Чудовища"
 game_concept_supernatural_monster:0 "Чудовище"
 game_concept_monster:0 "Чудовище"
 game_concept_supernatural_monster_desc:0 "Чудовища — это [men_at_arms|E], которыми командуют другие, более могущественные сверхъестественные чудовища; они искусны в истреблении необученного врага.\n\nЧислом они могут быть невелики, зато высокое качество берёт своё. Обычно они [counter|E] [archers|E]."
  
 #game_concept_werewolf:0 "Werewolf"
 game_concept_were-wolves:0 "Оборотни"
 game_concept_werewolves_desc:0 "Оборотни — это [men_at_arms|E], которыми командуют другие, более могущественные сверхъестественные чудовища; они искусны в истреблении необученного врага.\n\nЧислом они могут быть невелики, зато высокое качество берёт своё."
 
 ##################
 ### Activities ###
 ##################
 game_concept_vampire_feeding:0 "Вампирское кормление"
 game_concept_feeding:0 "кормление"
 game_concept_feedings:0 "кормления"
 game_concept_feeding_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_feedings_desc:0 "$game_concept_vampire_feeding_desc$"
 game_concept_vampire_feeding_desc:0 "Вампирское кормление — это [activity|E], в которой [Concept('vampire','Vampire')|E] или [Concept('hybrid','Hybrid')|E] охотится на смертного ради крови, обычно в одном из твоих городов.\n\nЧистое кормление само по себе не оставляет следа. Его оставляет тело, а также жертва, которая проговорится: контроль в графстве падает, и графство помнит об этом годами. Самая лёгкая добыча — бедные, плохо контролируемые земли, поэтому вампиры охотятся сначала в твоих самых слабых владениях.\n\nПоймать кормящегося с поличным удаётся редко. Когда контроль в графстве падает без явной причины, там может охотиться вампир, но искать ты догадаешься, только если знаешь, что в твоём королевстве бродит такое существо."

 game_concept_feeding_success_chance_no_prefix:0 "Шанс успешного кормления"
 game_concept_feeding_success_chance:0 "Шанс успешного кормления"
 game_concept_feeding_success_chance_desc:0 "Когда ты берёшься за [GetActivityType('vampire_feeding').GetName], успех не гарантирован. Главные условия, влияющие на успех кормления:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] или [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] — [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] выбранной области\n$BULLET_WITH_TAB$выбранная подготовка и [intent|E] во время занятия\n\n$game_concept_feeding_success_chance$ не может быть выше #V 95#!.\n\n#weak Удачные кормления усиливают твою вампирскую силу. Главное — осторожность; провал может открыть миру твою суть.#!"
 game_concept_feeding_success_chance_no_prefix_desc:0 "Когда ты берёшься за [GetActivityType('vampire_feeding').GetName], успех не гарантирован. Главные условия, влияющие на успех кормления:\n$BULLET_WITH_TAB$[GetTrait('supernatural_vampire').GetName( GetNullCharacter )] или [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )] — [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[development|E] выбранной области\n$BULLET_WITH_TAB$выбранная подготовка и [intent|E] во время занятия\n\n$game_concept_feeding_success_chance$ не может быть выше #V 95#!.\n\n#weak Удачные кормления усиливают твою вампирскую силу. Главное — осторожность; провал может открыть миру твою суть.#!"
