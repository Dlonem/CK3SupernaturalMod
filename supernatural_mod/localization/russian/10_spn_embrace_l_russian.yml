l_russian:
#-------------------------------------------------------------------------- 
# Peddler Event Chain
#-------------------------------------------------------------------------- 
#Peddler Event
 spn_embrace.0001.t:0 "Рыночный день"
 spn_embrace.0001.desc:0 "Рынок шумен и обыден, пока ты не доходишь до последнего прилавка, который не таков.\n\nЗа столом с вещами, которые не подходят друг к другу, сидит старуха: костяные гребни, банка серых зубов, лента, сушёное ухо, снятое с животного, которого ты не можешь назвать. Она не зазывает тебя, как другие. Она ждёт, пока ты не повернёшься уходить.\n\n«О, [ROOT.Char.GetLadyLord]». Она поднимает маленький закупоренный флакон и держит его так, чтобы видел только ты. «Это не для прилавка».\n\nСтекло тёплое. Это видно даже отсюда.\n\n«Оно кладёт конец той части умирания, что приходит за каждым, — говорит она. — Даром оно не даётся, и цена никогда не бывает одинаковой дважды. Одни платят золотом, и только. Другие всё ещё платят, когда меня давно уже нет». Она ставит флакон между вами. «Двадцать пять за флакон. Остальное решится между тобой и ним»."
 spn_embrace.0001.a:0 "Я возьму это."
 spn_embrace.0001.a.tt:0 "Ты берёшь эликсир, не задавая никаких вопросов, у совершенно незнакомого человека."
 spn_embrace.0001.a.live.tt:0 "Флакон делает то, что она обещал. А что это значит на деле — остаётся между тобой и ночью."
 spn_embrace.0001.a.nothing.tt:0 "Некоторые флаконы — просто флаконы."
 spn_embrace.0001.a.die.tt:0 "Для некоторых цена — это всё."
 spn_embrace.0005.t:0 "Двадцать пять золотых"
 spn_embrace.0005.desc:0 "Ты пьёшь его у собственного очага, в одиночестве, так, как принимают лекарство. На вкус — железо и мокрая листва, и идёт хуже, чем ты ожидаешь.\n\nПотом ты ложишься спать. И спишь — крепко и без происшествий, — и просыпаешься в обычный час, и старость в тебе — ровно та же, что вчера. То же самое ты чувствуешь и на следующий день.\n\nТы возвращаешься на рынок в течение недели. Там, где была лавка, торгует рыбник. Он держит это место, говорит он, одиннадцать лет."
 spn_embrace.0005.a:0 "Двадцать пять золотых."
 spn_embrace.0001.b:0 "Какое шоу ты тут пытаешься устроить?"
 spn_embrace.0001.b.tt:0 "Ты покидаешь рынок."
#Peddler Event, Part 2, Lycan
 spn_embrace.0002.t:0 "Бледная Луна"
 spn_embrace.0002.desc:0 "После покупки эликсира ты возвращаешься домой. В ту ночь ты пьёшь зловонную жидкость, а затем ложишься спать. \n\nТы просыпаешься посреди ночи от сильной боли. Полная луна светит в окно. Кажется, что все кости в твоём теле ломаются, когда твои конечности начинают менять форму. \n\nСледующее, что ты помнишь, это просыпание в изолированном месте вдали от замка. Кровь повсюду на твоём голом теле."
 spn_embrace.0002.a:0 "Что я стал!"
 spn_embrace.0002.a.tt:0 "Прими бессмертие."
#Peddler Event, Part 2, Vampire
 spn_embrace.0003.t:0 "Алый Ночь"
 spn_embrace.0003.desc:0 "После покупки эликсира ты возвращаешься домой. В ту ночь ты пьёшь зловонную жидкость, а затем ложишься спать. \n\nТы просыпаешься посреди ночи от сильной жажды. Прежде чем ты полностью осознаешь, что происходит, ты оказываешься вне своих покоев. Затем ты проникаешь в одну из комнат прислуги. Ты слышишь, как бьётся сердце горничной и ощущаешь шипение крови, когда она течёт. \n\nСледующее, что ты понимаешь, это то, что она лежит там безжизненная с прорезанным горлом и покрыта кровью. Ты смотришь на маленькое зеркало в её комнате. Ты видишь своё лицо, шею и торс, покрытые кровью!"
 spn_embrace.0003.a:0 "Что я стал!"
 spn_embrace.0003.a.tt:0 "Прими бессмертие."

#-------------------------------------------------------------------------- 
# Vampire Event 1, A Night Amongst the Nobles
#-------------------------------------------------------------------------- 
#Vamp Event 1, Part 1
 spn_embrace.1001.t:0 "Ночь среди знать"
 spn_embrace.1001.desc:0 "Во время ночи чрезмерного угощения с благородными, вы начинаете уставать от празднеств. После некоторых усилий, чтобы удалить себя от общества довольно скучных гостей, вы находите возможность ускользнуть от сбора."
 spn_embrace.1001.a:0 "Занять одежду слуги, чтобы сбежать через кухню"
 spn_embrace.1001.a.tt:0 "Продолжить поиск черты Вампир."
 spn_embrace.1001.b:0 "С другой стороны, я, пожалуй, останусь"
 spn_embrace.1001.b.tt:0 "Прекратить поиск черты Вампир."
#Vamp Event 1, Part 2
 spn_embrace.1002.t:0 "Кухня"
 spn_embrace.1002.desc:0 "Когда вы проходите через кухню, вы поворачиваете за угол и видите одного из слуг, покрытого кровью. Вы встречаетесь взглядом с его глазами, видя, как последняя искорка света угасает, когда вы смотрите на него в шоке.\n\nРядом с ним, [spn_new_created_vampire.GetHerHis] рот покрыт кровью, находится придворный, которого вы никогда раньше не видели при дворе. Убирая [spn_new_created_vampire.GetHerselfHimself] беспорядок с помощью льняного полотна из кухни, [spn_new_created_vampire.GetSheHe] поднимает взгляд, чтобы увидеть вас.\n\n«Я не ожидал, что кто-то найдет это так рано. Тем более, ваше благородное высочество.»\n\nКладя [spn_new_created_vampire.GetHerHis] кровавое полотенце в карман обессиленного слуги, [spn_new_created_vampire.GetSheHe] подходит к вам."
 spn_embrace.1002.surv.tt:0 "Шанс Выживания"
 spn_embrace.1002.a:0 "Ты умрешь за это, чудовище!"
 spn_embrace.1002.a.tt:0 "Ты атакуешь придворного"
 spn_embrace.1002.b:0 "Подожди, я уверен, мы можем что-то придумать."
 spn_embrace.1002.b.tt:0 "Ты пытаешься договориться."
 spn_embrace.1002.c:0 "Извини, я просто пойду!"
 spn_embrace.1002.c.tt:0 "Ты пытаешься убежать... крича."
 spn_embrace.1002.d:0 "Всё ещё в шоке, ты не можешь заставить свои ноги двигаться."
 spn_embrace.1002.d.tt:0 "Ты потрясён и не можешь двигаться."
#Vamp Event 1, Part 3, Option A from Vamp Event 2
 spn_embrace.1003.t:0 "Борьба"
 spn_embrace.1003.desc:0 "После жестокой борьбы ты наконец одолел мерзкое создание, которое расправилось с твоими поварами. Но победа досталась тебе дорогой ценой. В разгар битвы вампир вонзил свои зубы в твою шею. В хаосе его кровь пролилась тебе в рот — деталь, которую ты едва заметил в тот момент. \n\n Позже, когда придворный лекарь перевязывал твои раны, тебя охватил сильный головная боль, и поднялась лихорадка. Ночь тянулась, полная невыносимой боли. Когда ты проснулся на рассвете, твои раны таинственным образом зажили, но неутолимая жажда терзала тебя — жажда, какой ты никогда не испытывал."
 spn_embrace.1003.a:0 "Начни свою новую жизнь как Вампир"
 spn_embrace.1003.a.tt:0 "Ты становишься [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
#Vamp Event 1, Part 3, Option B from Vamp Event 2
 spn_embrace.1004.t:0 "Переговоры"
 spn_embrace.1004.desc:0 "После долгого спора тебе как-то удалось убедить [spn_new_created_vampire.GetTitledFirstName], что ты никому не расскажешь о том, что [spn_new_created_vampire.GetSheHe] сделал. [spn_new_created_vampire.GetSheHe|U] согласился сохранить тебе жизнь при условии, что [spn_new_created_vampire.GetSheHe] обратит тебя. Если ты станешь таким же, как [spn_new_created_vampire.GetHerHim], рассказ о [spn_new_created_vampire.GetHerHim] подвергнет опасности и тебя. Скрепя сердце, ты соглашаешься на эту цену. Хотя и не понимаешь, сколько именно только что заплатил.\n\nКогда разговор закончился, [spn_new_created_vampire.GetTitledFirstName] схватил тебя и вонзил зубы тебе в шею. В следующий миг [spn_new_created_vampire.GetSheHe] исчез, а у тебя застучало в голове и начался жар. После, казалось, бесконечной ночи мучений ты очнулся на рассвете и обнаружил, что раны зажили. Однако появилась странная новая жажда, не похожая ни на что из пережитого прежде."
#Vamp Event 1, Part 3, Option C from Vamp Event 2
 spn_embrace.1005.t:0 "Побег"
 spn_embrace.1005.desc:0 "Вы бежали так быстро, как могли ваши трусливые ноги. Но это было бесполезно, преследователь догнал вас с огромной скоростью. [spn_new_created_vampire.GetSheHe|U] вцепился в вашу шею и держал крепко, пока вы пытались вырваться. Вам как-то удалось сбросить [spn_new_created_vampire.GetHerHim] и убежать из кухни. Вы быстро нашли несколько стражников, чтобы отправить их в кухню за нарушителем. Стражники обыскали крепость, но не смогли найти ни следа придворного. Теперь вам все время думается, вернется ли [spn_new_created_vampire.GetSheHe], чтобы добить вас. \n\nКогда придворный врач перевязал вашу шею, голова начала раскалываться, и вы стали лихорадочно. После того, что казалось вечной ночью страданий, вы проснулись с рассветом и увидели, что раны зажили. Однако, появилась странная жажда, отличная от всего, что вы испытывали раньше."
#Vamp Event 1, Part 3, Option D from Vamp Event 2
 spn_embrace.1006.t:0 "Выживание"
 spn_embrace.1006.desc:0 "Парализованный и неспособный двигаться, вы позволили [spn_new_created_vampire.GetHerHim] подойти ближе. Прежде чем вы успели понять, что происходит, они оказались рядом и укусили вас за шею. Оставив вас при смерти, вы видите, как [spn_new_created_vampire.GetHerHim] покидает кухню, прежде чем потерять сознание. Некоторое время спустя вас обнаруживают ваши стражники и доставляют к придворному врачу. \n\nКогда придворный врач перевязал вашу шею, голова начала раскалываться, и вы стали лихорадочно. После того, что казалось вечной ночью страданий, вы проснулись с рассветом и увидели, что раны зажили. Однако, появилась странная жажда, отличная от всего, что вы испытывали раньше."

#-------------------------------------------------------------------------- 
# Vampire Event 2, A Unique Visit
#-------------------------------------------------------------------------- 
#Vamp Event 2, Part 1
 spn_embrace.1011.t:0 "Уникальный визит"
 spn_embrace.1011.desc:0 "Это был обычный день в моем дворе, но в момент, когда [spn_new_created_vampire.GetSheHe] вошел, я почувствовал, как будто попал под заклинание [spn_new_created_vampire.GetHerHis]. Едва ли не изысканно одетый [spn_new_created_vampire.GetWomanMan] с безупречной фигурой. Я боролся с каждой своей желанием и пытался вести себя так, как требует мой статус. [spn_new_created_vampire.GetSheHe|U] кланяется и заявляет, что у [spn_new_created_vampire.GetSheHe] есть важные дела для обсуждения, но только наедине. [spn_new_created_vampire.GetSheHe|U] уверяет меня, что мне будет очень интересно то, что они собираются сказать."
 spn_embrace.1011.a:0 "Поставьте нас!"
 spn_embrace.1011.a.tt:0 "Вы приказываете двору оставить вас наедине с незнакомцем."
 spn_embrace.1011.b:0 "Ваши слова меня не интересуют."
 spn_embrace.1011.b.tt:0 "Вы отказываете незнакомцу."
#Vamp Event 2, Part 2
 spn_embrace.1012.t:0 "Предложение"
 spn_embrace.1012.desc:0 "«Я слышал, что наследование твоего королевства тебя тревожит, [ROOT.Char.GetLadyLord]», — говорит [spn_new_created_vampire.GetSheHe]. На миг мне показалось, что [spn_new_created_vampire.GetSheHe] намекает на что-то коварное.\n\n«Я могу сделать так, что тебе никогда не придётся бояться потерять своё королевство. За небольшую плату, разумеется...» [spn_new_created_vampire.GetSheHe|U] говорит о существах несокрушимой силы, вырвавшихся из оков времени. Я стою, не в силах поверить [spn_new_created_vampire.GetHerHis] рассказам. [spn_new_created_vampire.GetHerHis|U] таинственная аура придаёт вес [spn_new_created_vampire.GetHerHis] словам, но могу ли я и правда верить, что всё это так?"
 spn_embrace.1012.a:0 "Мне интересно ваше предложение. Что вы просите взамен?"
 spn_embrace.1012.a.tt:0 "[spn_new_created_vampire.GetTitledFirstName] становится вашим Шпионом"
 spn_embrace.1012.b:0 "Я отказываюсь слушать их потусторонние разговоры."
 spn_embrace.1012.b.tt:0 "Вы отказываете незнакомцу."
 spn_embrace.1012.c:0 "Стража! В темницу с [spn_new_created_vampire.GetHerHim]!"
 spn_embrace.1012.c.tt:0 "Вы пытаетесь заключить в тюрьму странного посетителя."
#Vamp Event 2, Part 3, Option C Death
 spn_embrace.1013.t:0 "Ошибка"
 spn_embrace.1013.desc:0 "[spn_new_created_vampire.GetHerHim] понадобилась всего секунда, чтобы лишить моих личных стражей боеспособности. Мои планы поймать [spn_new_created_vampire.GetHerHim] провалились! [spn_new_created_vampire.GetSheHe|U], с невыразимой скоростью, мчится к трону, на котором я сижу, и кусает меня за шею! Я чувствую тепло, когда кровь стекает по моему горлу."
 spn_embrace.1013.a:0 "Ух… Я… д…"
 spn_embrace.1013.a.tt:0 "Возможно, ты будешь жить лучше в своей жизни после смерти."
#Vamp Event 2, Part 3, Option A Turned
 spn_embrace.1014.t:0 "Жажда"
 spn_embrace.1014.desc:0 "Ведомый моей жаждой власти и, возможно, к [spn_new_created_vampire.GetHerHim], я решаю ступить в этот мир теней [spn_new_created_vampire.GetHersHis]. Несмотря на огромное колебание внутри, я проявляю мало сопротивления указаниям [spn_new_created_vampire.GetHerHis]. Я должен выбрать между тем, чтобы пить кровь [spn_new_created_vampire.GetHerHis] или позволить [spn_new_created_vampire.GetHerHim] укусить меня. С оставшимися обрывками разума я выбираю первое. \n\nВ один момент я ставлю пустой кубок с кровью, а в следующем стою на кровавых останках своей горничной. Что же я стал!"
 spn_embrace.1014.a:0 "Жажда!"
 spn_embrace.1014.a.tt:0 "Ты принимаешь вампиризм."

#-------------------------------------------------------------------------- 
# Werewolf Event 1, Just Another Hunt
#-------------------------------------------------------------------------- 
#Werewolf Event 1, Part 1
 spn_embrace.2001.t:0 "Охотник"
 spn_embrace.2001.desc:0 "Когда ты находишься на месячной охоте, ты находишь изысканного северного оленя с рогами, похожими на те, что в старых мифах. Ты чувствуешь желание повесить его голову в своем тронном зале как трофей. Ты внимательно следишь за особью, но не замечаешь, что случайно отделился от своей охотничьей группы. Когда ты собираешься нанести смертельный удар, ты слышишь громкий, но глухой рычание и становишься свидетелем того, как олень разрывается пополам."
 spn_embrace.2001.a:0 "Беги!"
 spn_embrace.2001.a.tt:0 "Ты делаешь отчаянную попытку сбежать."
 spn_embrace.2001.a.surv.tt:0 "Шанс погибнуть"
 spn_embrace.2001.b:0 "Попытайся спрятаться и остаться тихим."
 spn_embrace.2001.b.tt:0 "Ты делаешь все возможное, чтобы не издавать ни звука и не быть услышанным."
#Werewolf Event 1, Part 2, Option A Death
 spn_embrace.2002.t:0 "Становится преследуемым"
 spn_embrace.2002.desc.a:0 "Не в состоянии ясно мыслить, твои инстинкты выживания берут верх над телом, и ты оказываешься бегущим через лес. Ты не пытаешься оглянуться, потому что все еще не уверен, что только что увидел. \n\n Ты продолжаешь бег, но внезапно останавливаешься с силой. Испытывая боль, ты опускаешь глаза и видишь огромное чудовище с невообразимо острыми зубами, проникающими в твой живот, и начинаешь ощущать, как чувствует тебя тошнота."
 spn_embrace.2002.a:0 "Мучение!"
 spn_embrace.2002.a.tt:0 "Ты умираешь."
#Werewolf Event 1, Part 2, Option A Survive with a Broken Mind
 spn_embrace.2003.t:0 "Становится преследуемым"
 spn_embrace.2003.desc.a:0 "Не в силах думать ясно, инстинкты выживания берут верх над твоим телом, и ты оказываешься в бегстве сквозь лес. Ты не пытаешься оглянуться, потому что всё еще не уверен в том, что только что увидел.\n\nПо какому-то чуду ты вновь присоединяешься к своей охотничьей группе, но твои королевские одежды в клочьях, у тебя перехватывает дыхание, и кажется, что ты вот-вот расплачешься или рассмеёшься от невыносимого ужаса, который испытал."
 spn_embrace.2003.a:0 "ХА!"
 spn_embrace.2003.a.tt:0 "Твое рассудок был погублен."
#Werewolf Event 1, Part 2, Option B Death
 spn_embrace.2004.t:0 "Становится преследуемым"
 spn_embrace.2004.desc.a:0 "Ты застываешь на месте и наблюдаешь, как это гигантское существо пожирает то, что еще мгновение назад было величественным животным. Оно похоже на волка, но возвышается над тобой, стоя на задних лапах. Оно останавливается и нюхает в твой сторону. Ощущение, что тебя обнаружили, обрушивается на всё твоё существо, как огромная волна.\n\nТы стоишь там, поражённый и в ужасе, когда зверь стремится к тебе и кусаешь твою черепную кость."
 spn_embrace.2004.a:0 "Ах!"
 spn_embrace.2004.a.tt:0 "Ты умираешь."
#Werewolf Event 1, Part 2, Option B Turn
 spn_embrace.2005.t:0 "Становится преследуемым"
 spn_embrace.2005.desc.a:0 "Ты застыл на месте и смотришь, как этот огромный зверь пожирает то, что мгновение назад было величественным животным. Он похож на волка, но, стоя на задних лапах, возвышается над тобой. Он замирает и принюхивается в твою сторону. Понимание того, что тебя обнаружили, накрывает тебя, словно огромная волна.\n\nОн медленно приближается, а ты даже не пытаешься бежать. Ужас растёт с каждым его шагом. Каким-то чудом тебя находят твои спутники-охотники и пускают в зверя стрелы; он успевает убить нескольких из них, а ты получаешь рану в схватке и теряешь сознание.\n\nТы приходишь в себя в своей постели, весь в бинтах. Боли нет, и ты, похоже, полностью исцелился. Входит твой канцлер и объясняет, что на тебя напал большой волк, а свита тебя спасла. Никто не заметил, что он ходил, как ходят люди, а из-за густого тумана ты решил поразмыслить об этом, когда тебе станет лучше.\n\nНочь не приносит облегчения. Лекарь снимает бинты и замолкает. Рана не закрывается. Она даже не пытается. Плоть по её краям посерела и стала тёплой, а под ней что-то шевелится, когда ты дышишь.\n\nЛекарь говорит, что это пройдёт, и говорит так, как люди говорят то, во что сами не верят."
 spn_embrace.2005.a:0 "АРХ-УУУУУУУУУ!"
 spn_embrace.2005.a.tt:0 "Ты превращаешься в оборотня."

#-------------------------------------------------------------------------- 
# Werewolf Event 2, Carriage Ambush
#-------------------------------------------------------------------------- 
#Werewolf Event 2, Part 1
 spn_embrace.2011.t:0 "Это Засада!"
 spn_embrace.2011.desc:0 "Я собирался посетить одного из своих вассалов на пиршество, которое они подготовили в мою честь. Всё шло хорошо, пока мы не начали получать выстрелы из арбалета из леса. Нас засадили! Мои охранники сражались храбро, чтобы защитить своего сеньора, но нас было в разы меньше, и мы оказались в неожиданной ситуации. Нас осталось немного, может мне стоит присоединиться к битве?"
 spn_embrace.2011.a:0 "Выходите и сражайтесь, трусы!"
 spn_embrace.2011.a.tt:0 "Держите оборону!"
 spn_embrace.2011.b:0 "Я должен сбежать!"
 spn_embrace.2011.b.tt:0 "Ты делаешь отчаянную попытку сбежать."
#Werewolf Event 2, Part 2, Option A 
 spn_embrace.2012.t:0 "За Честь и Выживание"
 spn_embrace.2012.desc.a:0 "После того, что кажется часами, но на самом деле, должно быть, прошло всего несколько минут, только один охранник и я остаемся на ногах. Израненные и сильно поврежденные, наши шансы кажутся весьма призрачными. Я помню этого охранника, [spn_new_created_lycan.GetSheHe] он никогда не говорил много. Не знал, что [spn_new_created_lycan.GetSheHe] такой способный боец. Мне стоило бы больше обращать на это внимание. Теперь, когда я об этом думаю, мне стоило бы поступить многими другими способами.\n\nЯ возвращаюсь в реальность от пугающего боевого крика моего спутника. Засадчики колеблются, и мы используем этот момент, чтобы атаковать."
 spn_embrace.2012.a:0 "Последняя отчаянная попытка!"
 spn_embrace.2012.a.tt:0 "Вы стремительно бросаетесь на врага."
#Werewolf Event 2, Part 2, Option A Second
 spn_embrace.2013.t:0 "Более ценно, чем золото"
 spn_embrace.2013.desc.a:0 "Теперь мы оба лежим на земле. Воздух наполнен смрадом смерти. Полдень, но мне холодно от потери крови. Храбрый защитник впервые при мне высказывает [spn_new_created_lycan.GetHerHis] мысли. «Сражаться рядом с тобой было честью, [spn_new_created_lycan.GetLadyLord]. Я могу покоиться с миром, зная, что отдал жизнь за столь достойного сюзерена». [spn_new_created_lycan.GetSheHe|U] хватает меня за ногу и впивается в неё зубами. Я больше не могу терпеть боль и теряю сознание.\n\nМеня будит боль. Нога горячая на ощупь, а кровь остановилась слишком рано, будто что-то внутри решило, что с неё хватит. Я сам перевязываю её и никому не говорю.\n\nТеперь я знаю, что [spn_new_created_lycan.GetSheHe] мне дал. Я об этом не просил, но и не отказался."
 spn_embrace.2013.a:0 "АААААААААААХ!"
 spn_embrace.2013.a.tt:0 "Ты превращаешься в оборотня."
#Werewolf Event 2, Part 2, Option A Death
 spn_embrace.2014.t:0 "Резня"
 spn_embrace.2014.desc.a:0 "Ты и твои спутники прилагаете все усилия. В конце концов, этого не хватает, и ты оказываешься на мече."
 spn_embrace.2014.a:0 "Нет!"
#Werewolf Event 2, Part 2, Option B Run
 spn_embrace.2015.t:0 "Беги"
 spn_embrace.2015.desc.a:0 "Ты бежал изо всех сил, зигзагами пробираясь через деревья, и как-то умудрился уклониться от поимки. Даже вернувшись домой, ты теперь ищешь каждую щель и уголок в ожидании следующей атаки!"
 spn_embrace.2015.a:0 "Фух!"
 spn_embrace.2015.a.tt:0 "Тебе как-то удалось избежать поимки, но не без последствий."
#Werewolf Event 2, Part 2, Option B Death
 spn_embrace.2016.t:0 "Беги"
 spn_embrace.2016.desc.a:0 "Ты бежал изо всех сил, зигзагами пробираясь через деревья, и получил болт арбалета в спину."
 spn_embrace.2016.a:0 "Ахhh!"

#-------------------------------------------------------------------------- 
# Hunter Event 1, A Bump In The Night
#-------------------------------------------------------------------------- 
#Hunter Event 1, Part 1
 spn_embrace.3001.t:0 "Удар в ночи"
 spn_embrace.3001.desc:0 "Крик разбудил тебя ночью. Ты на мгновение зажигаешь свечу и берешь нож. Ты открываешь дверь своих покоев и смотришь вниз по коридору. Сквозь тусклый свет свечи ты замечаешь своего охранника, лежащего на земле. По всему коридору разлита кровь и кишки.\n\nТы слышишь, как твои стражи в панике кричат по всему крепости. В следующее мгновение ты слышишь рычание, от которого у тебя по спине пробегают мурашки. Вдруг блеск двух больших глаз отражает свет твоей свечи. Монструозное существо, похожее на волка, выходит на свет свечи и издает гремящий вой."
 spn_embrace.3001.a:0 "Быстро закрой дверь и спрячься под кроватью."
 spn_embrace.3001.a.tt:0 "Если я спрячусь, они, несомненно, уйдут!"
 spn_embrace.3001.b:0 "Беги по противоположному коридору и попытайся найти помощь."
 spn_embrace.3001.b.tt:0 "Моя единственная надежда - попытаться получить помощь!"
 spn_embrace.3001.c:0 "Тихо закрой дверь и вернись в постель."
 spn_embrace.3001.c.tt:0 "Снаружи не было ничего интересного. Я в любой момент проснусь от этого сна."
 spn_embrace.3001.d:0 "Выпусти боевой крик и бросься на зверя!"
 spn_embrace.3001.d.tt:0 "Если я пойду на дно, то пойду сражаясь!"
#Hunter Event 1, Part 2 What An Ordeal
 spn_embrace.3002.t:0 "Какое испытание"
 spn_embrace.3002.desc:0 "Взбешенный зверь громко врывается в дверь и сметает все в твоих покоях. Он останавливается и начинает рысить, как собака на охоте. Зверь на мгновение останавливается у твоей кровати, а затем прыгает под нее. Его клыки и когти тянутся к тебе.\n\nТвои пронзительные крики приводят в твою комнату полдюжины стражников. С яростными боевыми криками они нападают. Вопя от боли, создание retreats от кровати и разбивает окно в твоих покоях. Твои стражи помогают тебе выбраться из-под кровати, качая головами в недоумении."
 spn_embrace.3002.a:0 "Это было близко."
#Hunter Event 1, Part 2 Time of Need
 spn_embrace.3003.t:0 "Время нужды"
 spn_embrace.3003.desc:0 "Мчась по коридорам, ты слышишь, как существо преследует тебя. На бегу ты натыкаешься на тех, кто встретил зверя раньше тебя. То, что от них осталось, разбросано повсюду. Ты видишь дверь во двор, как можно быстрее проскакиваешь в неё и захлопываешь за собой. Не дожидаясь, выдержит ли она, ты вылетаешь во двор. Грохот позади говорит, что дверь не выдержала.\n\nКогда зверь уже почти настигает тебя, навстречу ему бросается воин в капюшоне. Пока воин бьётся с существом, ты переводишь дух и собираешься с мыслями. Увидев на земле копьё, ты поднимаешь его и метаешь в существо. Этого отвлечения хватило, чтобы незнакомец одним быстрым движением обезглавил зверя.\n\n«Что это было?» — спрашиваешь ты незнакомца.\nОткидывая капюшон, тот отвечает: «Ликан... этих зверей и других мерзких тварей этого мира становится всё больше. Я — [spn_new_created_hunter.GetTitledFirstName]». \n\n«Что можно сделать?» — спрашиваешь ты.\n«Я могу научить тебя сражаться со зверями, но путь будет нелёгким. Одно обучение может убить тебя, если не убьют звери», — говорит [spn_new_created_hunter.GetSheHe]."
 spn_embrace.3003.a:0 "Я сделаю все возможное, чтобы научиться."
 spn_embrace.3003.a.tt:0 "Ты выбираешь путь Охотника. Это обучение займет около 2 недель."
 spn_embrace.3003.b:0 "Мне не нужны такие навыки."
 spn_embrace.3003.b.tt:0 "Ты решаешь не следовать по пути Охотника."
#Hunter Event 1, Part 3 Training Complete
 spn_embrace.3004.t:0 "Обучение завершено"
 spn_embrace.3004.desc:0 "После недель интенсивного обучения [spn_new_created_hunter.GetTitledFirstName] считает, что ты научился достаточно, чтобы называть себя Охотником. Хотя многому еще нужно научиться, ты сделал свои первые шаги на этом пути."
 spn_embrace.3004.a:0 "Время искать и уничтожать этих монстров!"
#Hunter Event 1, Part 2 Creature Left You Alone
 spn_embrace.3005.t:0 "Выживание ночью"
 spn_embrace.3005.desc:0 "Убеждая себя, что это был всего лишь плохой сон, ты снова погружаешься в сон. Тебя резко будят свита из охранников и слуг. По-видимому, это вовсе не был сон. Либо благодаря чистой удаче, либо из жалости со стороны зверя, ты пережил эту ночь."
 spn_embrace.3005.a:0 "Я не уверен, что чувствую по этому поводу."
#Hunter Event 1, Part 2 Attack the Creature
 spn_embrace.3006.t:0 "Жестокая борьба"
 spn_embrace.3006.desc:0 "Невнятно вспоминая, что боролся с существом, теперь лежащим рядом с тобой, ты в полусознательном состоянии, покрытый кровью. Незнакомец наклоняется к тебе и осматривает твои раны.\n\n«Скверна укусила тебя...это обидно...по виду, ты бы оказался полезным в бою.»\n\nНезнакомец вытаскивает свой меч.\n\n«Не беспокойся, они посчитают тебя героем за столь храброе сражение с этим существом - говорит незнакомец, поднимая свой меч над твоей грудью.»"
 spn_embrace.3006.a:0 "Подожди! Я все еще могу сразиться с этими монстрами!"
 spn_embrace.3006.a.tt:0 "Ты пытаешься договориться о своей жизни."
#Hunter Event 1, Part 2 Attack the Creature
 #spn_embrace.3006.t:0 "Brutal Struggle" #commented out for 1.22 because of update 1.9 saying it was duplicated in error.log, same reason for line below
 #spn_embrace.3006.desc:0 "Drifting in and out of consciousness, covered in blood, you vaguely recall fighting the creature now lying sprawled on the ground next to you. A stranger kneels beside you and inspects your wounds.\n\n"The bastard bit you... that's a shame... by the looks of it, you would have been useful in the fight."\n\nThe stranger draws their blade.\n\n"Don't worry, they'll consider you a hero for fighting so bravely against this creature." The stranger says as they raise their blade above your chest."
 #spn_embrace.3006.a:0 "Wait! I can still fight these monsters!"
 #spn_embrace.3006.a.tt:0 "You attempt to negotiate for your life and train as a Hunter."
#Hunter Event 1, Part 3 Training Complete And Transformation
 spn_embrace.3007.t:0 "Трудное путешествие"
 spn_embrace.3007.desc:0 "Железо вошло холодным и вышло красным, и сознание ты потерял гораздо позже, чем хотелось бы. [spn_new_created_hunter.GetTitledFirstName] держал тебя всё это время и ни разу не отвёл взгляда.\n\nДальше было хуже и дольше. Недели. Но в конце [spn_new_created_hunter.GetSheHe] возвращает тебе твой собственный клинок и говорит, что ты можешь называть себя Охотником — тем самым словом, заслужить которое [spn_new_created_hunter.GetSheHe] тебе едва не помешал, чуть не убив тебя."
 spn_embrace.3007.a:0 "Время искать и уничтожать этих монстров!"

 spn_embrace.3008.t:0 "Что он тебе оставил"
 spn_embrace.3008.desc:0 "Клинок не опускается.\n\n[spn_new_created_hunter.GetTitledFirstName] долго изучает тебя, дольше, чем хотелось бы, затем отводит ткань с укуса. Что бы [spn_new_created_hunter.GetSheHe] там ни увидел, это решает дело.\n\n«Не сегодня, — говорит [spn_new_created_hunter.GetSheHe]. — Но я уже видел такое и знаю, чем это кончается. Год. Может, три. Ты почувствуешь это задолго до остальных».\n\n[spn_new_created_hunter.GetSheHe|U] вкладывает тебе в руку нож и сжимает твои пальцы вокруг рукояти. «Если, когда всё кончится, ты останешься собой, найди меня, и я закончу то, чему начал тебя учить. А если нет, — говорит [spn_new_created_hunter.GetSheHe], кивая на клинок, — сделай это сам и избавь нас обоих от дороги»."
 spn_embrace.3008.a:0 "Когда всё кончится, я останусь собой."
 spn_embrace.3008.a.tt:0 "Рана начинает гноиться. Предложение Охотника ждёт, чем это решится."

 spn_embrace.3009.t:0 "Предложение всё ещё в силе"
 spn_embrace.3009.desc:0 "Когда ты спускаешься, [spn_new_created_hunter.GetTitledFirstName] уже ждёт во дворе, словно кто-то сказал [spn_new_created_hunter.GetHerHis] день.\n\n[spn_new_created_hunter.GetSheHe|U] смотрит на шрам, затем тебе в глаза, и [spn_new_created_hunter.GetHerHis] плечи чуть опускаются.\n\n«Большинство не выдерживает, — говорит [spn_new_created_hunter.GetSheHe]. — Я хоронил тех, кто от этого умер, и охотился на тех, кто не умер. Ты третий из всех, кого я встречал, кто просто... выдержал».\n\n[spn_new_created_hunter.GetSheHe|U] протягивает руку за ножом, но передумывает. «Оставь себе. Скоро тебе понадобится свой. Ну что, ты всё ещё хочешь учиться или чудовищ с тебя хватит?»"
 spn_embrace.3009.a:0 "Учи меня. Я это заработал(а) дважды."
 spn_embrace.3009.a.tt:0 "Ты возвращаешься на путь Охотника с того места, где этот путь прервал жар."
 spn_embrace.3009.b:0 "Чудовищ с меня хватит."
 spn_embrace.3009.b.tt:0 "Ты отпускаешь Охотника. Второго предложения не будет."