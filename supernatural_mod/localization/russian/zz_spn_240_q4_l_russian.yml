l_russian:
 # Supernatural 2.40 (WORK-ORDER-2.40, package Q4): the Fors Factorum, the Elemental Transference, the page hunt, the Ringing.

 # ---- G5 the Fors Factorum ----
 spn_order_fors_relic_tt:0 "Письмо Форс Факторум принадлежит тебе или хранится в Реликварии твоего храма"
 spn_order_fors_no_cancer_tt:0 "Заклинание не возьмёт тело, которое уже несёт его цену"
 spn_order_fors_recast_cd_tt:0 "Ты не творил его в последние пять лет"
 spn_order_fors_broken_tt:0 "Форс Факторум заканчивается вместе с раком."
 spn_order.0840.a.tt:0 "От двух до пяти лет твои заклинания не стоят тебе силы. Затем один раз приходит рак. Пока он в твоём теле, заклинания остаются бесплатными, а если его когда-нибудь вылечат, заклинание закончится вместе с ним."
 spn_order.2201.t:0 "Заклинание разрушено"
 spn_order.2201.desc:0 "Рак прошёл, а вместе с ним ушёл и [spn_order_fors_factorum|E]. Твои заклинания снова будут тебе стоить.\n\nТы мог бы сотворить его снова — и снова заплатить."
 spn_order.2201.a:0 "So be it"
 spn_order.2201.a.tt:0 "Ты можешь сотворить его снова через пять лет после последнего раза."
 spn_order.0824.desc_fors:0 "\n\nРак был ценой [spn_order_fors_factorum|E]. Он прошёл, и заклинание ушло вместе с ним."
 spn_order.0828.desc_fors:0 "\n\nРак вернулся. [spn_order_fors_factorum|E] — нет."

 # ---- B7 + G6 the Elemental Transference ----
 spn_order.0815.t_sister:0 "Сестра умирает"
 spn_order.0815.b.tt:0 "[spn_tr_asker.GetFirstName] не станет снова просить храм в течение пяти лет."
 spn_order_toast_masks_heal:0 "Маски начали действо"
 spn_order_transference_refused_tt:0 "Твой Храмовый Магус не отказывал тебе в последние пять лет"
 spn_order.0820.a.tt:0 "На этот раз это несёшь ты. Храм больше тебя не попросит."
 spn_order.0820.willing:0 "Возьмите мою кровь и просите меня, когда храму понадобится"
 spn_order.0820.willing.tt:0 "На этот раз это несёшь ты, и храм будет просить тебя снова всякий раз, когда ему понадобится кровь."
 spn_order.0820.c.tt:0 "Храм больше тебя не попросит."
 spn_order.0823.desc_town:0 "\n\nНе все они из храма. Некоторые — горожане, пришедшие ради своих семей, и их семьям заплатили."
 spn_order.0824.desc_paid:0 "\n\nНекоторые из пятерых — горожане. Ты заплатил их семьям за то, что они несут."
 spn_transference_paid_opinion:0 "Заплатил за долю родича"
 spn_transference_string:0 "Люди, названные ниже, несут за тебя часть твоего недуга ([Story.Custom('spn_TransferenceDisease')]), каждый по пятой доле. Если кого-то из них убьют до [Story.MakeScope.Var('spn_tr_until').GetValue|0] года, она вернётся к тебе."
 spn_transference_mirror_string:0 "Ты перенёс болезнь ([Story.Custom('spn_TransferenceDisease')]) в людей, названных ниже. Если кого-то из них убьют до [Story.MakeScope.Var('spn_tr_until').GetValue|0] года, Действо распустится и болезнь вернётся."
 SPN_TR_CASTER:0 "Сотворил"
 SPN_TR_CARRIERS:0 "Несут её"
 SPN_TR_PATIENT:0 "Исцелён"
 spn_tr_disease_cancer:0 "рак"
 spn_tr_disease_consumption:0 "чахотка"
 spn_tr_disease_leper:0 "проказа"
 spn_tr_disease_great_pox:0 "великая оспа"
 spn_tr_disease_blue_fever:0 "Голубая лихорадка"
 spn_tr_disease_infirm:0 "немощь"
 spn_tr_disease_fragile_bones:0 "хрупкие кости"
 spn_tr_disease_typhus:0 "тиф"
 spn_tr_disease_bubonic_plague:0 "чума"
 spn_tr_disease_smallpox:0 "оспа"
 spn_tr_disease_pneumonic:0 "воспаление лёгких"
 spn_tr_disease_dysentery:0 "кровавый понос"
 spn_tr_disease_measles:0 "корь"
 spn_tr_disease_ill:0 "болезнь"

 # ---- B3 + B4 + G10 the page hunt ----
 spn_vade.0100.desc_oath:0 "\n\nВолки, носившие эту шкуру до тебя, поклялись, что книгой больше никогда не воспользуются. Шкура всё ещё хранит эту клятву и теперь просит хранить её тебя."
 spn_vade.0100.desc_silverback:0 "\n\nСеребряная Спина уже стерегла однажды страницу. Она помнит, что книга сделала с теми, кто её читал."
 spn_vade.0100.desc_timber:0 "\n\nБурелом хочет, чтобы страницу закопали в глухом лесу, где её никто никогда не откопает."
 spn_vade.0100.desc_tundra:0 "\n\nТундра терпелива. Она будет ждать сколько потребуется, но страницу не отпустит."
 spn_vade.0100.desc_graybeard:0 "\n\nСедобородый видел, кем становятся люди, держащие книгу, и не хочет увидеть этого снова."
 spn_vade.0100.desc_midnight:0 "\n\nПолночь ненавидит книгу сильнее, чем охотников."
 spn_vade.0100.desc_alpha:0 "\n\nАльфа хочет, чтобы стая нашла её раньше всех остальных."
 spn_vade.0100.a.tt:0 "Теперь у тебя есть притязание на то, что [spn_vade_heard_holder.GetFirstName] хранит из книги. Шкура приведёт тебя к [spn_vade_heard_holder.GetHerHim]."
 spn_vade.2000.t:0 "Имя в твоих записях"
 spn_vade.2000.desc:0 "Твои исследования завели тебя туда, куда ты не собирался. Три старых источника, написанные тремя разными руками, описывают одну и ту же книгу: [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')], справочник демона, давным-давно разорванный на части.\n\nСамый новый из них называет того, у кого сейчас есть её часть: [spn_named_holder.GetTitledFirstName]."
 spn_vade.2000.desc_none:0 "Твои исследования завели тебя туда, куда ты не собирался. Три старых источника, написанные тремя разными руками, описывают одну и ту же книгу: [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')], справочник демона, давным-давно разорванный на части.\n\nНи один из них не может сказать, где сейчас хоть какая-то её часть."
 spn_vade.2000.a:0 "Теперь я знаю, где она"
 spn_vade.2000.a.tt:0 "У тебя есть притязание на то, что [spn_named_holder.GetFirstName] хранит из книги. Ты можешь попытаться выкрасть это или пойти за этим войной."
 spn_vade.2000.b:0 "Теперь я знаю, что это"
 spn_vade.2001.t:0 "След обрывается у двери [spn_vade_heard_holder.GetFirstName]"
 spn_vade.2001.desc:0 "Шкура довела тебя так далеко, как могла. [spn_vade_heard_holder.GetTitledFirstName] держит то, что у [spn_vade_heard_holder.GetSheHe] есть из книги, за запертыми дверями и не знает, что волк уже неделю следит за домом.\n\nШкура хочет вырвать это из [spn_vade_heard_holder.GetHerHis] рук. Как — решать тебе."
 spn_vade.2001.a:0 "Будем следить"
 spn_vade.2001.a.tt:0 "Ты сохраняешь притязание. Ты можешь попытаться выкрасть это или пойти за этим войной."
 spn_vade.2001.b:0 "Забрать сегодня ночью"
 spn_vade.2001.b.tt:0 "Ты идёшь сам, ночью, с волком близко под кожей. Если тебя увидят, [spn_vade_heard_holder.GetFirstName] узнает, что за этим кто-то приходил, а графство запомнит волка."
 spn_vade.2001.b.success:0 "Ты вышел из тьмы с добычей, и никто не видел, как ты ушёл."
 spn_vade.2001.b.failure:0 "Кто-то тебя увидел. Ты убежал, а добыча осталась на месте."
 spn_vade.2001.c:0 "Послать стаю"
 spn_vade.2001.c.tt:0 "[spn_vt_wolf.GetFirstName] идёт вместо тебя. Если что-то пойдёт не так, расплачиваться будет [spn_vt_wolf.GetSheHe], а не ты."
 spn_vade.2001.c.success:0 "Стая приносит её тебе до рассвета."
 spn_vade.2001.c.failure:0 "[spn_vt_wolf.GetFirstName] возвращается в крови и с пустыми руками."
 spn_vade.2001.d:0 "Сообщить храму"
 spn_vade.2001.d.tt:0 "Твой [spn_temple_magus|E] узнаёт, у кого она, и запомнит, кто ему сказал."
 spn_relic_war_page_tt:0 "Владеет частью [spn_vade_maecum|E]"

 # ---- B8 the Ringing ----
 spn_ev4.0.desc_book:0 "\n\nПод звоном есть что-то ещё, слабое и древнее: запах книги. Тот, кто творит заклинание, владеет частью [spn_vade_maecum|E]."
 spn_ev4.0.silence:0 "Пусть больше не звенит для [magic_user.GetShortUIName]."
 spn_ev4.0.silence.tt:0 "Ты больше не будешь слышать магию, которую творит [magic_user.GetShortUIName]. Шкура этого не забывает, и ты можешь решить снова прислушаться."
 spn_ringing_listen_decision:0 "Снова прислушаться"
 spn_ringing_listen_decision_desc:0 "Ты велел шкуре приглушить Звон для некоторых из тех, кто колдует рядом с тобой. Ты можешь снова открыть для них слух."
 spn_ringing_listen_decision_tooltip:0 "Снова слышать Звон для всех, кого ты заглушил."
 spn_ringing_listen_decision_confirm:0 "Слушать"
 spn_ringing_listen_decision_effect_tt:0 "Ты снова будешь слышать Звон для всех, кого ты заглушил."
 spn_vade_claim_given_tt:0 "У тебя будет притязание на то, что они хранят из книги, и ты сможешь попытаться выкрасть это или пойти за этим войной."
 spn_vade.0512.relic_claim_tt:0 "У тебя будет притязание на реликвию, и ты сможешь попытаться выкрасть её или пойти за ней войной."
 spn_ev4.0.ring.book.tt:0 "Ты узнаешь, кто владеет частью книги, и получишь на неё притязание."
