 l_russian:

 # Vampire Blood Event Localization
 spn_vampire_events.0102.t:0 "Кровь"
 spn_vampire_events.0102.desc:0 "Ваши чувства обострились. Мир кажется яснее, чётче, живее. Каждый вдох наполнен ароматами, каждый звук ясен и отчётлив. Это, должно быть, затянувшееся действие крови вампира, текущей в ваших венах.\n\nВнутри вас пробуждается странная тяга, но вы не уверены, что она означает."
 spn_vampire_events.0102.a:0 "Наслаждаться этой новой ясностью."
 spn_vampire_events.0102.a.tt:0 "Вы принимаете обострённые чувства, дарованные кровью вампира."
 spn_vampire_events.0102.b:0 "Это неправильно. Я должен сопротивляться."
 spn_vampire_events.0102.b.tt:0 "Вы сопротивляетесь противоестественному влечению, пытаясь игнорировать эффекты."
 spn_vampire_events.0102.c:0 "Это не просто ощущение. Я должен узнать больше."
 spn_vampire_events.0102.c.tt:0 "Вы будете искать знания о вампиризме."

 spn_vampire_events.0103.t:0 "Кровь: Часть вторая"
 spn_vampire_events.0103.desc:0 "Ваши исследования привели к интригующим выводам, хотя ничего окончательного. Если вы хотите продолжить, вам нужно решить, как далеко вы готовы зайти."
 spn_vampire_events.0103.a:0 "Я раскрыл секрет. Пора действовать."
 spn_vampire_events.0103.a.tt:0 "Ваши знания гарантируют успешное превращение."
 spn_vampire_events.0103.b:0 "Кажется, я понимаю, как это сделать... наверное."
 spn_vampire_events.0103.b.tt:0 "Рискованный эксперимент. Дарует ли он вам силу или отнимет жизнь?"
 spn_vampire_events.0103.c:0 "Я не узнал ничего полезного."
 spn_vampire_events.0103.c.tt:0 "Ваши исследования ни к чему не привели, и вы отказываетесь от попыток."


 # Hunter Event Localization
 spn_hunters.0001.t:0 "Охотник: Ведьма замечена"
 spn_hunters.0001.desc:0 "Несколько местных жителей подошли к вам на рынке, который вы осматривали.\n\n«Мы видели ведьму на днях. Были сумерки, и мы возвращались из таверны. Она несла кучу ингредиентов, наверняка для проклятья горожан. Мы пытались поймать её, чтобы привести к вам, но она, должно быть, применила магию, запутала нас и сбежала!»\n\nВ ходе расследования многие упомянули комету, летящую в обратном направлении. Это звучит как дурное предзнаменование."
 spn_hunters.0001.a:0 "Похоже, начинается охота на ведьм!"
 spn_hunters.0001.b:0 "Это звучит слишком опасно. Найдите кого-то более квалифицированного."
 spn_hunters.0001.c:0 "Похоже на бред пьяной толпы."
 spn_hunters.0001.d:0 "Я найду вашу ведьму, но жду оплаты."
 spn_hunters.0001.e:0 "Вы обратились к нужному человеку. Доверьтесь профессионалу."
 spn_hunters.0001.c.tt:0 "Вы отмахиваетесь от местных, ведь людям свойственно выдумывать истории, когда им нечем заняться."
 spn_hunters.0001.d.tt:0 "Благодаря вашей репутации охотника вы получаете половину оплаты сейчас, а остальное — после поимки ведьмы."


 spn_hunters.0002.desc:0 "После нескольких дней преследования в густом лесу ваша группа натыкается на узкую, явно рукотворную тропинку, уходящую в тени.\n\nКто-то бормочет, что воздух кажется странным, словно потрескивает от невидимой энергии. Другой тут же отмахивается, утверждая, что это, вероятно, опять Андрей, которому пора мыться.\n\nРазговор перерастает в лёгкую перепалку, и, прежде чем вы успеваете вернуть всех к делу, люди начинают разбредаться в разные стороны, спотыкаясь о корни и сухие листья — возможно, затаптывая правильный след, даже не осознавая этого."
 spn_hunters.0002.a:0 "Попытаться проследить её следы."
 spn_hunters.0002.aa.t:0 "Ваша группа находит ведьму."
 spn_hunters.0002.ab.t:0 "Ваша группа теряет след ведьмы."
 spn_hunters.0002.ac.t:0 "Ведьма находит вашу группу первой."
 spn_hunters.0002.b:0 "Попытаться следовать за магией."
 spn_hunters.0002.b.tt:0 "В воздухе действительно ощущаются следы магии."
 spn_hunters.0002.c:0 "Может, это была не лучшая идея..."
 spn_hunters.0002.c.tt:0 "Вы прекращаете поиски ведьмы и возвращаетесь назад."

 spn_hunters.00021.t:0 "Охотник: Ведьма потеряна"
 spn_hunters.00021.a:0 "Надеюсь, кто-то другой её поймает..."
 spn_hunters.00021.desc:0 "После нескольких дней бесплодных поисков группа признаёт поражение. Сумки собраны, и уставшая команда начинает обратный путь в город. По крайней мере, Андрею прямо говорят, что ему давно пора помыться.\n\nТем не менее, покидая лес, вас не покидает навязчивая мысль. Была ли там в воздухе настоящая магия или это лишь разыгравшееся воображение? Остаётся надеяться, что кто-то другой продолжит поиски там, где вы остановились."


 spn_hunters.0003.desc:0 "Перед вами стоит хижина в глубине леса, а снаружи женщина уже привязана к куче сухих дров.\n\nОна выглядит пугающе знакомой, её черты вызывают в памяти рассказы о «Бабе Яге». Но что-то внутри вас шепчет, что это не та легендарная ведьма... или всё же она? «Я невиновна», — умоляет она. Она утверждает, что лесоруб Джозеф давно хочет выгнать её из леса, чтобы расширить свои угодья.\n\nДжозеф настаивает, что видел, как она прокляла его брата, отчего тот слёг с неведомым недугом. Его голос дрожит, словно он сам не уверен. Но ропот ваших спутников нарастает — говорят, только ведьма могла принести такую беду человеку."

 spn_hunters.0003.a:0 "Сжечь ведьму! Нельзя рисковать."
 spn_hunters.0003.a.tt:0 "[witch.GetName] будет казнена за свои преступления."
 spn_hunters.0003.b:0 "Вы все с ума сошли? Посмотрите на неё... эти «ингредиенты» были для супа!"
 spn_hunters.0003.b.tt:0 "[witch.GetName] будет отпущена на свободу."
 spn_hunters.0003.c:0 "Развяжите её! Я знаю, как заставить её говорить..."
 spn_hunters.0003.c.tt:0 "Вы убеждаете их оставить [witch.GetName] в покое, если она поделится секретами ведовства."



 spn_hunters.0010.t:0 "Охотник: Слухи о монстре"
 spn_hunters.0010.desc:0 "В таверне гудит привычный шум — звон кружек, взрывы смеха и тихий гул разговоров. Потягивая свой напиток, вы улавливаете голос одного из посетителей, достаточно громкий, чтобы привлечь ваше внимание.\n\n«Клянусь, — шепчет он заговорщически, — его взгляд... кожа какая-то странная, будто солнца никогда не видел. А ещё этот звук... вроде рычания, а может, просто откашлялся. Не знаю. Но мурашки по коже!»\n\nПосетитель наклоняется ближе к своим собеседникам, понижая голос. «Он остановился наверху, в последней комнате по коридору.»\n\nВаше любопытство пробуждается. Возможно, это просто пьяные сплетни... а вдруг нет?"
 spn_hunters.0010.a:0 "Вы берёте свой напиток и пытаетесь присоединиться к их столу."
 spn_hunters.0010.a.tt:0 "Лучше узнать больше, прежде чем делать выводы."
 spn_hunters.0010.b:0 "Вы оплачиваете счёт посетителя, прежде чем присоединиться к их столу."
 spn_hunters.0010.b.tt:0 "Оплата их напитков облегчает присоединение к разговору без подозрений."
 spn_hunters.0010.c:0 "Вы подходите с видом опытного охотника."
 spn_hunters.0010.c.tt:0 "Посетитель, оценив ваш вид и репутацию, не возражает, когда вы садитесь за стол."
 spn_hunters.0010.d:0 "Вы бросаете немного монет на стойку и направляетесь к двери."
 spn_hunters.0010.d.tt:0 "Возможно, лучше не вмешиваться в слухи."

 spn_hunters.0011.desc:0 "Вы садитесь за стол к посетителю с кружкой в руке, пытаясь смешаться с оживлённым шумом таверны. Посетитель едва замечает вас, поглощённый потоком болтовни о своих путешествиях, странных снах и проклятом скоте.\n\nКогда вы уже начинаете думать, что разговор — пустая трата времени, посетитель возвращается к теме, которая привлекла ваше внимание, — монстрам. Он понижает голос и описывает фигуру, которую, как он утверждает, видел.\n\nСквозь пелену хмеля трудно разобрать слова, и чем больше он говорит, тем меньше у вас уверенности. Есть ли в этом что-то стоящее, или это лишь плод слишком большого количества эля?"
 spn_hunters.0011.a:0 "Похоже на вампира."
 spn_hunters.0011.a.tt:0 "Бледная кожа, странное присутствие... всё совпадает."
 spn_hunters.0011.b:0 "Это может быть оборотень, скрывающийся среди людей."
 spn_hunters.0011.b.tt:0 "Странное поведение и гортанные звуки намекают на что-то звериное."
 spn_hunters.0011.c:0 "Это пустая трата времени."
 spn_hunters.0011.c.tt:0 "Вы допиваете свой напиток и оставляете посетителя с его болтовнёй."
 # Hunter events from spn_hunters_events.txt
 spn_hunters.0012.desc:0 "Вы подходите, и посетитель кивает вам, слегка ухмыляясь, приветствуя вашу компанию. Кажется, он более чем рад поделиться своей историей.\n\n«Вы не поверите, — говорит он, наклоняясь ближе, словно делясь тёмной тайной. — Тот парень наверху — он был какой-то не такой. От него веяло... пугающим присутствием. Клянусь, я видел, как его глаза загорелись, словно угли, когда трактирщик сказал, что свободных комнат больше нет!» Он нервно посмеивается, но вы чувствуете, что он не шутит.\n\nКакова бы ни была правда, эта история определённо завладела вашим вниманием."
 spn_hunters.0012.a:0 "Это похоже на вампира."
 spn_hunters.0012.a.tt:0 "Существо ночи... это может быть именно то, что вы ищете."
 spn_hunters.0012.b:0 "Это может быть оборотень."
 spn_hunters.0012.b.tt:0 "Разговоры о глазах и странном поведении идеально совпадают."
 spn_hunters.0012.c:0 "Я знаю, о чём они говорят — это оборотень."
 spn_hunters.0012.c.tt:0 "Ваш опыт охотника не оставляет сомнений."
 spn_hunters.0012.d:0 "Думаю, я достаточно услышал. Но кошелёк я заберу."
 spn_hunters.0012.d.tt:0 "Пока все отвлечены, вы незаметно прихватываете кошелёк и уходите."

 spn_hunters.0013.desc:0 "Вы поднимаетесь по лестнице на верхний этаж, нервы на пределе. Шум оживлённой таверны внизу мешает что-либо расслышать, но вы говорите себе, что это, вероятно, к лучшему.\n\nДеревянный кол в вашей руке кажется тяжелее, чем вы ожидали, но вы крепче сжимаете его и идёте вперёд. Когда дверь со скрипом открывается, вы осматриваете фигуру перед собой. Что-то не так. Вы ожидали острых клыков, чего-то явно вампирского — но ничего подобного. Однако их зубы слегка слишком зазубрены, чтобы не обратить на это внимания.\n\nВы прокручиваете в голове разговор — упоминали ли они рычание... или просто откашлялись? Мысли кружатся, и приходит осознание: это вовсе не вампир."
 spn_hunters.0013.a:0 "Вы зашли слишком далеко, чтобы отступать. Сражайтесь с монстром!"
 spn_hunters.0013.a.tt:0 "Идите до конца, к лучшему или к худшему. Пути назад нет."
 spn_hunters.0013.b:0 "Это может быть шанс стать одним из них."
 spn_hunters.0013.b.tt:0 "Из-за того, как вы начали встречу, шансы на успех снижены."
 spn_hunters.0013.c:0 "Быстро закройте дверь и убегайте, игнорируя смех за спиной."
 spn_hunters.0013.c.tt:0 "Бегите из этой ситуации, спасая свою шкуру, но оставляя свой кошелёк."
 spn_hunters.0013.aa.t:0 "Вам удалось одолеть монстра!"
 spn_hunters.0013.ab.t:0 "Монстр сумел сбежать!"
 spn_hunters.0013.ac.t:0 "Монстр заразил вас и сбежал!"
 spn_hunters.0013.ad.t:0 "Монстр убил вас."
 spn_hunters.0013.e.tt:0 "Они смеются и отпускают вас невредимым."


 spn_hunters.0014.desc:0 "Вы поднимаетесь по лестнице с мечом наголо, каждый шаг выверен, а шум буйной таверны внизу становится всё тише. Открыв дверь, вы видите ждущее внутри существо — фигуру, чьи мышцы переливаются неестественной силой. Их острые глаза расширяются от удивления, и на мгновение кажется, что ваше появление застало их врасплох.\n\nВы знаете, что промедление может стоить вам жизни; лучший шанс выжить — ударить быстро. Но исходящая от них мощь заставляет вас задуматься — возможно, есть другой путь. Время замедляется, пока вы взвешиваете варианты, ощущая, как напряжение в воздухе нарастает. Что бы вы ни выбрали, существо не останется ошеломлённым надолго."
 spn_hunters.0014.a:0 "Атакуйте, пока существо в шоке!"
 spn_hunters.0014.a.tt:0 "Вы наносите быстрый удар, стремясь одолеть зверя, пока он не пришёл в себя."
 spn_hunters.0014.b:0 "Опустите оружие и попросите существо обратить вас в одного из них."
 spn_hunters.0014.b.tt:0 "Вы опускаете оружие, надеясь, что существо поделится своей силой и мощью."
 spn_hunters.0014.c:0 "Извинитесь за то, что вошли не в ту комнату, и уходите."
 spn_hunters.0014.c.tt:0 "Отступите из ситуации, сохранив свою шкуру, но пожертвовав достоинством."
 spn_hunters.0014.aa.t:0 "Вам удалось одолеть монстра!"

 spn_hunters.0014.ab.t:0 "Монстр сумел сбежать!"
 spn_hunters.0014.ac.t:0 "Монстр заразил вас и сбежал!"
 spn_hunters.0014.ad.t:0 "Монстр убил вас."
 spn_hunters.0014.e.tt:0 "Они смеются и отпускают вас невредимым."


 # Hunter events from training in 10_spn_train_hunter.txt
 spn_train_hunter.0001.t:0 "Охотник: Становление охотником (Специализация)"
 spn_train_hunter.0003.t:0 "Охотник: Становление охотником (Специализация)"
 spn_train_hunter.0001.desc:0 "Стоя на уединённой поляне, окружённой шёпотом природы, ваш наставник делится своей мудростью и опытом, стремясь направить вас на путь охотника. Это спокойное убежище, великодушно предоставленное благодарным землевладельцем после того, как ваш наставник уничтожил скрытую угрозу, служит идеальным фоном для вашего преображения.\n\nСолнечный свет пробивается сквозь деревья, отбрасывая пятнистые тени на землю, пока вы размышляете о своём будущем. С горячим желанием избавить мир от зла вы чувствуете готовность противостоять тьме, изучить путь охотника и открыть свою истинную силу.\n\nВы понимаете, что это путешествие будет нелёгким, полным выборов, которые определят вашу судьбу."

 spn_train_hunter.0001.a:0 "Я хочу пройти традиционное обучение против монстров."
 spn_train_hunter.0001.a.tt:0 "Ваш наставник научит вас всему, что знает об охоте на монстров."
 spn_train_hunter.0001.b:0 "Я хочу пройти традиционное обучение против ведьм."
 spn_train_hunter.0001.b.tt:0 "Ваш наставник научит вас всему, что знает об охоте на ведьм."
 spn_train_hunter.0001.c:0 "Поразмыслив..."
 spn_train_hunter.0001.c.tt:0 "Вы пересматриваете своё решение стать охотником."

 spn_train_hunter.0002.t:0 "Охотник: Становление охотником (Завершение)"
 spn_train_hunter.0004.t:0 "Охотник: Становление охотником (Завершение)"
 spn_train_hunter.0002.desc:0 "После месяцев сурового обучения под руководством вашего наставника вы стоите на перепутье. Уроки, усвоенные на этой уединённой поляне, подготовили вас к грядущим испытаниям, но путь полон опасностей.\n\nВы ощущаете тяжесть своего решения, обдумывая следующие шаги. Примете ли вы свои новые навыки и станете охотником, или отвернёте этот путь, зная, что он ведёт лишь к одному концу?"

 spn_train_hunter.0002.a:0 "Я готов стать охотником в этом мире."
 spn_train_hunter.0002.a.tt:0 "Вы делаете шаг вперёд, готовый противостоять тьме с вашим обучением за спиной."
 spn_train_hunter.0002.b:0 "Я не создан для спасения людей и охоты на существ."
 spn_train_hunter.0002.b.tt:0 "Вы понимаете, что эта жизнь не для вас, и решаете отказаться от пути охотника."

 # Hunter event for the trainer (more of a notification)
 spn_train_hunter.0005.t:0 "Охотник: Обучение охотника (Наставник)"
 spn_train_hunter.0005.desc:0 "На уединённой поляне, окружённой шёпотом природы, вы стоите перед начинающим учеником, жаждущим принять путь охотника. Это спокойное убежище, великодушно предоставленное благодарным землевладельцем после того, как вы уничтожили скрытую угрозу, служит идеальным фоном для их преображения.\n\nКогда солнечный свет пробивается сквозь деревья, отбрасывая пятнистые тени на землю, ваш ученик выражает горячее желание избавить мир от зла. Они готовы противостоять тьме, изучить путь охотника и открыть свою истинную силу.\n\nВы надеетесь быть подходящим наставником, чтобы провести их через это нелёгкое путешествие, где они выберут свой путь, столкнутся с грозными испытаниями и в конечном итоге встретят свою судьбу."

 spn_train_hunter.0005.a:0 "Я постараюсь обучить их как можно лучше."
 spn_train_hunter.0005.a.tt:0 "Ваш ученик пройдёт собственную многомесячную цепочку заданий, в ходе которой у него будет возможность выбрать специализацию, завершить обучение, погибнуть или полностью отказаться."
 spn_train_hunter.0005.b.tt:0 "Вы получите очко перка в образе жизни охотника."

### added by sync_localizations.py -- untranslated, 1 keys
 spn_hunters.0013.b.bite.tt:0 "They oblige you. The wound will decide the rest — in a year, or three."
