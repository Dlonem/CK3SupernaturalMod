l_russian:
 spn_wound_incubation.0010.t:0 "Рана гноится"
 spn_wound_incubation.0010.desc:0 "Рана не закрывается. Она сочится и горит, и под кожей тлеет жар. Что-то пускает в тебе корни — и тело твоё знает, что оно здесь чужое."
 spn_wound_incubation.0010.a:0 "Отлежаться и переломить её"
 spn_wound_incubation.0010.a.tt:0 "Пойти войной на болезнь. Заражение резко отступает — но усилия тебя износят (#weak получишь Стресс#!)."
 spn_wound_incubation.0010.b:0 "Не отрываться от своих дел"
 spn_wound_incubation.0010.b.tt:0 "Не время лежать в постели, пока ты правишь. Заражение усиливается, но ты избавляешь себя от стресса безделья."
 spn_wound_incubation.0010.c:0 "Утопить жар в вине"
 spn_wound_incubation.0010.c.tt:0 "Заражение усиливается, но вино притупляет страх (#high потеряешь Стресс#!)."
 spn_wound_incubation.0010.d:0 "Довериться своему телу"
 spn_wound_incubation.0010.d.tt:0 "Твоё крепкое сложение отбрасывает большую часть болезни."
 spn_wound_incubation.0010.e:0 "Сжаться и молить, чтобы прошло"
 spn_wound_incubation.0010.e.tt:0 "Страх берёт верх. Заражение забирается глубже, но нервы твои немного успокаиваются."

 spn_wound_incubation.0011.t:0 "Ночи в жару"
 spn_wound_incubation.0011.desc:0 "Сон не приносит отдыха. Ты просыпаешься мокрым(мокрой) от пота, с медным привкусом на языке, и сны твои полны бега, воя и тёплой тяжести погони. С каждой ночью они всё меньше похожи на сны."
 spn_wound_incubation.0011.a:0 "Терпеть, ночь за ночью"
 spn_wound_incubation.0011.a.tt:0 "Стиснуть зубы и вынести это. Заражение отступает — ценой Стресса."
 spn_wound_incubation.0011.b:0 "Одолеть жар волей"
 spn_wound_incubation.0011.b.tt:0 "Твоя отвага отгоняет большую часть болезни и заодно укрепляет тебя."
 spn_wound_incubation.0011.f:0 "Изучить болезнь"
 spn_wound_incubation.0011.f.tt:0 "Обратить взгляд учёного на собственный недуг и найти способ его притупить."
 spn_wound_incubation.0011.c:0 "Отдаться тёмным снам"
 spn_wound_incubation.0011.c.tt:0 "Пусть сны берут своё. Заражение вздымается, но покорность облегчает твой стресс."
 spn_wound_incubation.0011.d:0 "У моего тела не осталось сил бороться"
 spn_wound_incubation.0011.d.tt:0 "Твоё хрупкое тело сдаёт позиции, и заражение вздымается."

 spn_wound_incubation.0030.t:0 "Рана ухудшается"
 spn_wound_incubation.0030.desc:0 "Края раны почернели, и тёмные нити гнили теперь поднимаются по конечности под кожей — горячие, натянутые и пахнущие чем-то, что сломалось глубоко внутри. Лекари перешёптываются и не смотрят тебе в глаза. Если дать этому распространиться, оно дойдёт до сердца, и тогда уже никакое средство от жара не поможет. Возможно, конечность ещё удастся спасти — а возможно, придётся от неё отказаться, чтобы сохранить жизнь."
 spn_wound_incubation.0030.a:0 "Бороться за спасение конечности"
 spn_wound_incubation.0030.a.tt:0 "Рискнуть и оставить её. Крепкие телом и смелые сердцем куда чаще побеждают; неудача стоит тебе конечности и усиливает заражение."
 spn_wound_incubation.0030.b:0 "Отдать конечность, чтобы спасти себя"
 spn_wound_incubation.0030.b.tt:0 "Потерять конечность наверняка — но вместе с ней отсечь и большую часть заражения."
 spn_wound_incubation.0030.c:0 "Заняться ею своими познаниями во врачевании"
 spn_wound_incubation.0030.c.tt:0 "Приложить к гнили собственную учёность. Умелые имеют сильный шанс спасти конечность и заодно отогнать заражение; а если конечность всё же будет потеряна, ты сдержишь худшее из распространения."

 spn_wound_incubation.0012.t:0 "Руки лекаря"
 spn_wound_incubation.0012.desc:0 "Твой личный лекарь за годы службы врачевал всякие болезни, но, признаёт он, никогда — такую. Он предлагает своё искусство даром: припарки, настоянные за ночь, осторожные кровопускания, прохладные примочки и тихое бдение у твоей постели, — и просит лишь позволить ему работать. Но глаза лекаря мало что упускают, и чем дольше он над тобой склоняется, тем больше может понять о том, что на самом деле гноится у тебя в крови."
 spn_wound_incubation.0012.a:0 "Принять его полную заботу"
 spn_wound_incubation.0012.a.tt:0 "Большая часть заражения вытянута — но есть #weak малый шанс#!, что он сложит воедино то, что с тобой на самом деле."
 spn_wound_incubation.0012.b:0 "Только осторожное лечение"
 spn_wound_incubation.0012.b.tt:0 "Скромное улучшение, и ничего не выдано."
 spn_wound_incubation.0012.c:0 "Отказаться от его вмешательства"
 spn_wound_incubation.0012.c.tt:0 "Отослать его. Заражение ползёт дальше беспрепятственно."

 spn_wound_incubation.0040.t:0 "Охотник проникается подозрением"
 spn_wound_incubation.0040.desc:0 "У одного из твоих людей глаза истребителя чудовищ, и он давно за тобой следит. Он тихо загоняет тебя в угол: он видывал такую болезнь прежде, у тех, кого коснулся зверь. "Кто это с тобой сделал?" — спрашивает он."
 spn_wound_incubation.0040.a:0 "Назвать того, кто меня оцарапал"
 spn_wound_incubation.0040.a.tt:0 "Выдать того, кто тебя обратил. Охотник отметит его как добычу — а если ты верен(верна) или доверчив(доверчива), предательство ляжет на тебя грузом."
 spn_wound_incubation.0040.b:0 "Отрицать всё"
 spn_wound_incubation.0040.b.tt:0 "Держаться за ложь. Если ты честен(честна), она будет тебя грызть."
 spn_wound_incubation.0040.c:0 "Запугать его до молчания"
 spn_wound_incubation.0040.c.tt:0 "Отпугнуть его. Такой угрозы он не простит долго."

 spn_wound_incubation.0020.t:0 "Волк шевелится"
 spn_wound_incubation.0020.desc:0 "Перемена берёт верх. В глубине жара ты чувствуешь, как зверь давит на края твоего разума и ждёт. Ты ясно понимаешь, что можешь уступить ему — или бороться, чтобы не впустить. Этот выбор определит, чем всё кончится."
 spn_wound_incubation.0020.a:0 "Я этого хочу — впусти его"
 spn_wound_incubation.0020.a.tt:0 "Принять перемену. Заражение стихает, и стресс отпускает — самый верный путь стать оборотнем."
 spn_wound_incubation.0020.b:0 "Я отказываюсь становиться чудовищем"
 spn_wound_incubation.0020.b.tt:0 "Отогнать зверя. Напряжение усиливает заражение и твой стресс — но это единственная дорога выжить #high без#! обращения."
 spn_wound_incubation.0020.c:0 "Держаться — ещё не время"
 spn_wound_incubation.0020.c.tt:0 "Сегодня ничего не решать. Небольшой шаг назад от края."

 spn_wound_incubation.0021.t:0 "Тот, кто тебя оцарапал"
 spn_wound_incubation.0021.desc:0 "Можно послать весть [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] — тому, с чьих зубов всё это началось. Он знает эту болезнь так, как не узнает ни один лекарь, потому что сам прошёл по этой дороге. Но просить его о помощи — значит впустить его обратно в свою жизнь."
 spn_wound_incubation.0021.a:0 "Найти его — я хочу жить"
 spn_wound_incubation.0021.a.tt:0 "Его наставления облегчают заражение и открывают между вами дверь."
 spn_wound_incubation.0021.b:0 "Встретить это в одиночку"
 spn_wound_incubation.0021.b.tt:0 "Отказаться от его помощи. Если он навязал тебе это силой, горечь затвердеет в соперничество."
 spn_wound_incubation.0021.c:0 "Принять его помощь сейчас — и помнить, кто кому должен"
 spn_wound_incubation.0021.c.tt:0 "Дать ему провести тебя через худшее (#weak снижает Заражение#!) и позволить узам сложиться — но держать свои мысли при себе. Навязанная рана — это неоплаченный долг, и она ещё может обратиться в открытое соперничество, когда ты перестанешь в нём нуждаться."

 spn_wound_incubation.0022.t:0 "Всё ближе"
 spn_wound_incubation.0022.desc:0 "[ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] оставался рядом через худшее — сдерживал жар, выговаривал с тобой долгие ночи. Что-то между вами сдвинулось. Чем это станет, решать тебе."
 spn_wound_incubation.0022.a:0 "Будем друзьями"
 spn_wound_incubation.0022.a.tt:0 "Связать себя дружбой; эта близость укрепляет тебя против заражения."
 spn_wound_incubation.0022.b:0 "Пусть между нами загорится"
 spn_wound_incubation.0022.b.tt:0 "Пусть это станет больше, чем дружбой, — и посмотрим, куда приведут ночи впереди."
 spn_wound_incubation.0022.c:0 "Держать его на расстоянии"
 spn_wound_incubation.0022.c.tt:0 "Не подпускать его близко."

 spn_wound_incubation.0023.t:0 "Опасная близость"
 spn_wound_incubation.0023.desc:0 "Ночи с [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] стали тяжелы не только от жара. Он держал тебя сквозь темноту, и желание между вами ничем не скрыто. Ночей может остаться немного — так как ты проведёшь эту?"
 spn_wound_incubation.0023.a:0 "Лечь с ним — будь моим возлюбленным"
 spn_wound_incubation.0023.a.tt:0 "Взять его в возлюбленные. Что за этим последует — то и последует."
 spn_wound_incubation.0023.b:0 "Отдать ему всё своё сердце"
 spn_wound_incubation.0023.b.tt:0 "Привязать себя к нему целиком — есть настоящий шанс, что вы станете родными душами."
 spn_wound_incubation.0023.c:0 "Одна безрассудная ночь, и не больше"
 spn_wound_incubation.0023.c.tt:0 "Одна ночь, без обещаний — хотя у природы могут быть свои замыслы."
 spn_wound_incubation.0023.d:0 "Отступить от края"
 spn_wound_incubation.0023.d.tt:0 "Отойти, пока не зашло слишком далеко."

 spn_wound_incubation.9000.t:0 "Жар достигает предела"
 spn_wound_incubation.9000.desc:0 "Это приходит разом: жар вздымается волной, сердце гремит, и сами кости ноют так, будто намерены перестроиться. Ты знаешь, что это переломный миг. Чем бы ты ни стал(стала), когда кончится ночь, прежним(прежней) ты уже не будешь. Остаётся лишь выбрать, как это встретить."
 spn_wound_incubation.9000.a:0 "Бороться за жизнь"
 spn_wound_incubation.9000.a.tt:0 "Вложить всю свою волю в то, чтобы выжить. #weak Твоя судьба в основном зависит от того, как прошло испытание.#!"
 spn_wound_incubation.9000.b:0 "Отдаться волку"
 spn_wound_incubation.9000.b.tt:0 "Отдать себя зверю целиком. #weak Сильнее всего склоняет к тому, чтобы стать оборотнем, — если тело это выдержит.#!"
 spn_wound_incubation.9000.c:0 "Отказаться становиться чудовищем"
 spn_wound_incubation.9000.c.tt:0 "Сопротивляться до конца. #weak Лучшая надежда выжить, не обратившись, — но провал на этом пути означает смерть.#!"
 spn_wound_incubation.9000.d:0 "Положиться на крепость своего тела"
 spn_wound_incubation.9000.d.tt:0 "#weak Крепкое сложение сильно повышает шансы пережить обращение.#!"
 spn_wound_incubation.9000.e:0 "Опереться на того, кто меня выходил"
 spn_wound_incubation.9000.e.tt:0 "#weak Его твёрдое присутствие улучшает твои шансы — но в твоей слабости он получает над тобой крючок.#!"

 spn_wound_incubation.9010.t:0 "Кое-что большее"
 spn_wound_incubation.9010.desc:0 "Боль ломается — и то, что вливается на её место, прекрасно. Сила, какой ты не знал(а), поёт в каждой конечности. Ты не просто пережил(пережила) перемену — ты ею овладел(а).\n\nТы поднимаешься на ноги — [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )]. И кое-что сверх того."
 spn_wound_incubation.9010.a:0 "Я пересоздан(пересоздана)"

 spn_wound_incubation.9011.t:0 "Перемена берёт верх"
 spn_wound_incubation.9011.desc:0 "Жар спадает, и на его месте устанавливается странная ясность. Боль уходит, рана затягивается чисто, и ты чувствуешь, как волк укладывается в тебе так, будто был там всегда.\n\nТы вышел(вышла) из этого целым(целой). Теперь ты — [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )]."
 spn_wound_incubation.9011.a:0 "Да будет так"

 spn_wound_incubation.9012.t:0 "Тяжёлое обращение"
 spn_wound_incubation.9012.desc:0 "Ты выжил(выжила). Едва. Перемена прорвалась сквозь тебя и оставила следы: нервы ободраны, тело выжато и заживает медленно.\n\nНо ты жив(жива), и волк живёт в тебе: [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], купленный дорогой ценой."
 spn_wound_incubation.9012.a:0 "Оно того стоило... кажется"

 spn_wound_incubation.9020.t:0 "Проклятие ослабляет хватку"
 spn_wound_incubation.9020.desc:0 "Ты боролся(боролась) с ним ночь за ночью, и каким-то образом — немыслимо — победил(победила). Жар наконец спадает и не возвращается. Волк за тобой не пришёл.\n\nТы не оборотень... но ты и не тот(та), кого оцарапали. Ты теперь твёрже, закалён(закалена) испытанием, которое мало кто переживает."
 spn_wound_incubation.9020.a:0 "Я выдержал(выдержала)"

 spn_wound_incubation.9021.t:0 "Горькая передышка"
 spn_wound_incubation.9021.desc:0 "Болезнь наконец отпускает тебя — но не оставляет такой(таким) же, какой(каким) нашла. Волк так и не взял; борьба с ним — взяла. Ты разорван(разорвана) там, где жар работал сильнее всего, и пройдёт долгий сезон, прежде чем ты сможешь опереться на это место не задумываясь.\n\nИ всё же: ты жив(жива), и ты — это ты."
 spn_wound_incubation.9021.a:0 "Я всё ещё здесь"

 spn_wound_incubation.9030.t:0 "Перемена поглощает тебя"
 spn_wound_incubation.9030.desc:0 "Бороться больше нечем. Жар забирает последние твои силы, и то, что силится родиться в тебе, родиться уже не может — оно лишь выжигает то немногое, что осталось.\n\nПроклятие забрало ещё одну душу. Здесь всё и кончается."
 spn_wound_incubation.9030.a:0 "..."

 spn_wound_incubation.0050.t:0 "Кризис веры"
 spn_wound_incubation.0050.desc:0 "В долгие часы перед рассветом тебя мучает не жар, а вопрос под ним. Что за вещь пускает корни в твоей плоти — кара, испытание или дар под личиной проклятия? Ты молился(молилась), пока слова не потеряли форму во рту. Священники называют зверей, что ходят как люди, мерзостью перед Богом; и всё же ты здесь, всё ещё Его создание — и что-то ещё сверх того. Когда ты закрываешь глаза, ты уже не различаешь, чей вой слышишь: дьявола у дверей или собственную душу, учащую новый и страшный язык. Как бы ты ни собирался(собиралась) пройти через это перед своим Богом, пройти придётся одному(одной)."
 spn_wound_incubation.0050.a:0 "Если Бог создаёт всё, Он создал и это"
 spn_wound_incubation.0050.a.tt:0 "Примириться с тем, чем ты становишься. Это приятие успокаивает и плоть, и дух (#weak снижает Заражение, потеряешь Стресс, немного Благочестия#!) и ставит тебя на путь #EMP приятия#! перемены."
 spn_wound_incubation.0050.b:0 "Молить об избавлении от этой погибели"
 spn_wound_incubation.0050.b.tt:0 "Просить Небеса выжечь проклятие из тебя. Эта борьба изматывает тело (#weak усиливает Заражение, получишь Стресс#!), но закаляет веру (#weak немного Благочестия#!) и ставит тебя на путь #EMP сопротивления#! перемене."
 spn_wound_incubation.0050.c:0 "Исповедовать всё и покориться Его суду"
 spn_wound_incubation.0050.c.tt:0 "Снять с души всё до конца и вложить остаток своей судьбы в святые руки. Глубокий акт веры (#high много Благочестия, потеряешь Стресс#!)."
 spn_wound_incubation.0050.d:0 "Искать в писаниях правду о том, что я такое"
 spn_wound_incubation.0050.d.tt:0 "Обратить учёную дисциплину на собственную погибель и найти холодное утешение в её понимании (#weak снижает Заражение, немного Благочестия#!)."
 spn_wound_incubation.0050.e:0 "Никакой справедливый бог так не поступил бы — с молитвами покончено"
 spn_wound_incubation.0050.e.tt:0 "Отвернуться от Небес и встретить перемену на своих условиях (#weak снижает Заражение, потеряешь Стресс, потеряешь Благочестие#!). Ставит тебя на путь #EMP приятия#! перемены."