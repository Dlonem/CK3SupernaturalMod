l_russian:
 # Supernatural 2.40 boot 2 -- package QS, the Sire Bond (Thomas's report item h). Boot 3: the bond forms by itself and
 # lasts; new favours; the verbs shared with the golem puppet.

 # The puppet type
 spn_sire_puppet:0 "Узы создателя"
 spn_sire_puppet_desc:0 "Твоё [pprogeny|E], связанное с тобой твоей кровью и любовью. Оно действует за тебя как твоя [puppet|E], и ничто из того, о чём ты просишь, его не изматывает. Узы длятся, пока один из вас не умрёт или не перестанет быть [vampire|E] или [hybrid|E], или пока ты их не отпустишь."
 spn_sire_puppet_concept_desc:0 "[hybrid|E] или [vampire|E], освоивший Поцелуй вампира, держит Узы создателя над [pprogeny|E], которое его любит: над тем, кого он обратил и кто стал его любовником или родственной душой. Узы возникают сами и сохраняются, даже если любовь проходит.\n\nСвязанный — твоя [puppet|E]. Щёлкни правой кнопкой по персонажу и действуй от его имени ради особых услуг уз, дел, которые выполнил бы голем, или, если он владеет землёй, собственного правосудия правителя. Щёлкни правой кнопкой по себе, чтобы он прислал тебе золото, или открой его карточку, чтобы призвать его к себе. Ничто из того, о чём ты просишь, его не изматывает, но небрежно оказанная услуга может оставить прореху в памяти графства, а достаточно таких прорех заставят его господина искать [spn_menace|E]."

 # Sense the Sire Bond (the type's own interaction)
 spn_sire_bond_interaction:0 "Почувствовать Узы создателя"
 spn_sire_bond_interaction_desc:0 "Твоя кровь сделала [recipient.GetShortUIName] тем, кем [recipient.GetSheHe] стал, и [recipient.GetSheHe] любит тебя или когда-то любил. Прими [recipient.GetHerHim] через Узы создателя как свою [puppet|E]: тогда ты сможешь действовать от имени [recipient.GetHerHim] и просить о собственных услугах.\n\nУзы длятся, пока один из вас не умрёт, не перестанет быть вампиром или пока ты не отпустишь [recipient.GetHerHim]."
 spn_sire_bond_interaction_tt:0 "[recipient.GetShortUIName] становится твоей [puppet|E] по Узам создателя."
 spn_sire_bond_replaces_tt:0 "Твоя нынешняя [puppet|E] по Узам создателя отходит в сторону; узы с ней сохраняются, и ты можешь снова их почувствовать."
 spn_sire_bond_player_tt:0 "[recipient.GetShortUIName] не управляется игроком"
 spn_sire_bond_still_vampire_tt:0 "[recipient.GetShortUIName] всё ещё вампир"
 spn_sire_bond_perk_effect:0 "Это нужно [vampire|E], чтобы держать Узы создателя над тем, кого он обратил и кто его любит"

 # The bond forms
 spn_sire.0002.t:0 "Узы создателя"
 spn_sire.0002.desc:0 "Это видно по тому, как [spn_sire_bond_puppet.GetShortUIName] смотрит на дверь, когда тебя нет в комнате, и как [spn_sire_bond_puppet.GetSheHe] замолкает, когда начинаешь говорить ты. Твоя кровь сделала [spn_sire_bond_puppet.GetHerHim] тем, кем [spn_sire_bond_puppet.GetSheHe] стал, и [spn_sire_bond_puppet.GetSheHe] любит тебя. Между тем и другим что-то укоренилось.\n\nЧто бы ты теперь ни попросил у [spn_sire_bond_puppet.GetHerHim], [spn_sire_bond_puppet.GetSheHe] это сделает. Если любовь когда-нибудь угаснет, узы останутся."
 spn_sire.0002.desc_soulmate:0 "[spn_sire_bond_puppet.GetShortUIName] никогда не нужно было, чтобы ты договаривал фразу. Твоя кровь сделала [spn_sire_bond_puppet.GetHerHim] тем, кем [spn_sire_bond_puppet.GetSheHe] стал, и [spn_sire_bond_puppet.GetSheHe] — твоя родственная душа. Между тем и другим что-то укоренилось.\n\nЧто бы ты теперь ни попросил у [spn_sire_bond_puppet.GetHerHim], [spn_sire_bond_puppet.GetSheHe] это сделает. Если любовь когда-нибудь угаснет, узы останутся."
 spn_sire.0002.a:0 "Тогда [spn_sire_bond_puppet.GetSheHe] мой."
 spn_sire.0002.a.tt:0 "[spn_sire_bond_puppet.GetShortUIName] теперь твоя [puppet|E] по Узам создателя."
 spn_sire.0002.b.tt:0 "Узы держат [spn_sire_bond_puppet.GetShortUIName]. Ты уже действуешь через кого-то другого; используй «Почувствовать Узы создателя» на [spn_sire_bond_puppet.GetHerHim], чтобы принять [spn_sire_bond_puppet.GetHerHim] вместо него."
 spn_sire.0002.c:0 "Я не стану держать [spn_sire_bond_puppet.GetHerHim] так."
 spn_sire.0002.c.tt:0 "Ты отпускаешь узы. Сами они больше не укоренятся; пока [spn_sire_bond_puppet.GetSheHe] всё ещё любит тебя, «Почувствовать Узы создателя» может их вернуть."

 # The romance ends, the bond holds
 spn_sire.0001.t:0 "Узы держат"
 spn_sire.0001.tt:0 "[spn_sire_bond_puppet.GetShortUIName] больше не любит тебя так, как [spn_sire_bond_puppet.GetSheHe] любил. Твоя кровь всё ещё держит [spn_sire_bond_puppet.GetHerHim]."

 # Favors
 spn_sire_bond_cooldown_tt:0 "Ты не опирался на узы ради этой услуги слишком недавно"
 spn_sire_bond_reach_tt:0 "[puppet_or_actor.GetShortUIName] может добраться до [recipient.GetHerHim]: тот же двор, семья, супруг, вассал или сюзерен, или то же место"
 puppet_action_description_puppet_action_spn_sire_speak:0 "Пусть связанный узами любовник хорошо отзовётся о тебе перед кем-то из своих близких"
 puppet_action_description_puppet_action_spn_sire_secrets:0 "Пусть связанный узами любовник выведает тайну у того, кто ему доверяет"
 puppet_action_description_puppet_action_spn_sire_cover:0 "Пусть связанный узами любовник отговорит господина от одной метки твоего следа в графстве, где он находится"
 puppet_action_description_puppet_action_spn_puppet_seduce:0 "Пусть ваша марионетка соблазнит кого-то — или вас"
 puppet_action_description_puppet_action_spn_puppet_court:0 "Пусть ваша марионетка заведёт роман с кем-то — или с вами"
 puppet_action_description_puppet_action_spn_puppet_befriend:0 "Пусть ваша марионетка составляет кому-то компанию, пока они не подружатся"
 spn_puppet_befriend_interaction:0 "Составить компанию"
 spn_puppet_befriend_interaction_desc:0 "Твоя марионетка проводит время с [recipient.GetShortUIName]. В первый раз они могут проникнуться симпатией друг к другу; в следующий — станут друзьями."
 spn_puppet_befriend_already_tt:0 "Твоя марионетка и [recipient.GetShortUIName] ещё не друзья"
 spn_friend_puppet_company:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] составляли друг другу компанию."
 puppet_action_description_puppet_action_spn_sire_blood:0 "Пусть связанный узами любовник даст кому-то вампирской крови"
 puppet_action_description_puppet_action_spn_puppet_murder:0 "Пусть ваша марионетка замыслит чьё-то убийство"
 puppet_action_description_puppet_action_spn_puppet_give_artifact:0 "Пусть ваша марионетка отдаст кому-то один из предметов, которые она несёт"

 spn_sire_bond_speak_interaction:0 "Замолви за меня слово"
 spn_sire_bond_speak_interaction_desc:0 "Твой связанный узами любовник хорошо отзывается о тебе перед [recipient.GetShortUIName], и тот несколько лет будет думать о тебе лучше.\n\nЕсли сделать это небрежно, в памяти графства может остаться прореха."
 spn_sire_bond_speak_already_tt:0 "За тебя ещё не замолвили слово перед [recipient.GetShortUIName]"
 spn_sire_bond_speak_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] замолвил за тебя слово."

 spn_sire_bond_secrets_interaction:0 "Выведать тайны"
 spn_sire_bond_secrets_interaction_desc:0 "Твой связанный узами любовник попытается выведать что-нибудь у [recipient.GetShortUIName], который должен ему доверять, и принести тебе.\n\nЕсли не выйдет, [recipient.GetShortUIName] станет меньше доверять твоему любовнику. Если сделать это небрежно, в памяти графства может остаться прореха."
 spn_sire_bond_trust_tt:0 "[recipient.GetShortUIName] доверяет твоему связанному узами любовнику (хорошее мнение о нём, друг, супруг или близкий родственник)"
 spn_sire_bond_secrets_effect_tt:0 "Твой связанный узами любовник может узнать для тебя одну из тайн [recipient.GetShortUINamePossessive]"
 spn_sire_bond_secrets_found_tt:0 "[spn_sire_bond_puppet.GetShortUIName] принёс тебе то, о чём [recipient.GetShortUIName] предпочёл бы, чтобы никто не знал."
 spn_sire_bond_secrets_none_tt:0 "[recipient.GetShortUIName] говорил свободно, но не рассказал ничего, чего бы ты уже не знал."
 spn_sire_bond_secrets_failed_tt:0 "[recipient.GetShortUIName] заметил расспросы и промолчал. Теперь [recipient.GetSheHe|U] меньше доверяет [spn_sire_bond_puppet.GetShortUIName]."

 spn_sire_bond_cover_interaction:0 "Замести следы"
 spn_sire_bond_cover_interaction_desc:0 "Твой связанный узами любовник находится в графстве [recipient.GetShortUINamePossessive]. Если на графстве есть след, ведущий к тебе, любовник попытается уговорить [recipient.GetHerHim] списать одну его метку на что-то другое.\n\nЕсли не выйдет, [recipient.GetShortUIName] станет меньше доверять твоему любовнику. Если сделать это небрежно, в памяти графства может остаться прореха."
 spn_sire_bond_cover_player_tt:0 "[recipient.GetShortUIName] не управляется игроком"
 spn_sire_bond_cover_no_trail_tt:0 "На графстве, где находится твой связанный узами любовник, есть след"
 spn_sire_bond_cover_effect_tt:0 "Если след ведёт к тебе, твой связанный узами любовник может отговорить [recipient.GetShortUIName] от одной его метки"
 spn_sire_bond_cover_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] рассказал [recipient.GetShortUIName] историю получше правды. След в графстве стал на одну метку слабее."
 spn_sire_bond_cover_failed_tt:0 "[recipient.GetShortUIName] выслушал и не поверил ни слову. След остаётся прежним, и теперь [recipient.GetSheHe] меньше доверяет [spn_sire_bond_puppet.GetShortUIName]."
 spn_sire_bond_cover_not_yours_tt:0 "[spn_sire_bond_puppet.GetShortUIName] выслушал, что говорит графство, и ничто из этого не ведёт к тебе. Объяснять было нечего."

 spn_puppet_seduce_interaction:0 "Соблазнить"
 spn_puppet_seduce_interaction_desc:0 "Твоя марионетка берётся соблазнить [recipient.GetShortUIName] — это её собственная интрига соблазнения. Тебе сообщат, чем всё кончится."
 spn_puppet_court_interaction:0 "Роман"
 spn_puppet_court_interaction_desc:0 "Твоя марионетка берётся завоевать сердце [recipient.GetShortUIName] — это её собственная романтическая интрига. Тебе сообщат, чем всё кончится."

 spn_sire_blood_interaction:0 "Дать им свою кровь"
 spn_sire_blood_interaction_desc:0 "Твой связанный узами любовник даёт [recipient.GetShortUIName] вампирской крови. Сейчас она исцеляет [recipient.GetHerHim]. Если [recipient.GetSheHe] умрёт, пока она ещё в [recipient.GetHerHim], или попросит обратить себя, [recipient.GetSheHe] восстанет вампиром, а твой любовник станет [recipient.GetHerHis] [mmaker|E].\n\n[recipient.GetShortUIName] должен доверять твоему любовнику. Если сделать это небрежно, в памяти графства может остаться прореха."
 spn_sire_blood_has_some_tt:0 "В [recipient.GetShortUIName] ещё нет вампирской крови ([recipient.GetHerHim])"
 spn_sire_blood_will_not_take_tt:0 "Вампирская кровь приживётся в [recipient.GetShortUIName]"
 spn_sire_blood_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] дал [recipient.GetShortUIName] [spn_sire_bond_puppet.GetHerHis] кровь."

 # Shared with the golem puppet
 spn_puppet_murder_interaction:0 "Заказать убийство"
 spn_puppet_murder_interaction_desc:0 "Твоя марионетка замышляет смерть [recipient.GetShortUIName] — это её собственная интрига убийства, со своими агентами. Тебе сообщат, чем всё кончится.\n\nЕсли его раскроют, убийство припишут твоей марионетке, а через неё — тебе."
 spn_puppet_give_artifact_interaction:0 "Отдать"
 spn_puppet_give_artifact_interaction_desc:0 "Твоя марионетка отдаёт [recipient.GetShortUIName] один из предметов, которые несёт. Ты выбираешь какой."
 spn_puppet_give_artifact_tt:0 "Ты выбираешь один из предметов своей марионетки, и он переходит к [recipient.GetShortUIName]"
 spn_puppet_carries_nothing_tt:0 "У твоей марионетки есть предмет, который она может отдать [recipient.GetShortUIName] (не надетый и не из тех, что не могут переходить из рук в руки)"
 spn_puppet.0001.t:0 "Отдать"
 spn_puppet.0001.desc:0 "[spn_pa_puppet.GetShortUIName] ждёт и раскладывает то, что [spn_pa_puppet.GetSheHe] несёт. Что из этого достанется [spn_pa_target.GetShortUIName]?"
 spn_puppet.0001.a:0 "[spn_pa_item_1.GetNameNoTooltip]."
 spn_puppet.0001.b:0 "[spn_pa_item_2.GetNameNoTooltip]."
 spn_puppet.0001.c:0 "[spn_pa_item_3.GetNameNoTooltip]."
 spn_puppet.0001.d:0 "В конце концов, ничего."
 spn_puppet.0001.d.tt:0 "Всё остаётся на месте."
 spn_puppet_gift_msg:0 "Вручён подарок"
 spn_puppet_gift_msg_tt:0 "[spn_pa_puppet.GetShortUIName] отдал тебе [spn_pa_item.GetNameNoTooltip]."

 # Seduce Me and Release the Sire Bond (on the puppet card)
 spn_sire_seduce_me_decision:0 "Соблазни меня"
 spn_sire_seduce_me_decision_desc:0 "Попроси своего связанного узами любовника прийти к тебе."
 spn_sire_seduce_me_decision_tooltip:0 "Если вы всё ещё любовники, он придёт к тебе, и твой стресс уменьшится. Если роман закончился, он снова возьмётся тебя соблазнить. Раз в год."
 spn_sire_seduce_me_decision_confirm:0 "Приди ко мне"
 spn_sire_seduce_me_lovers_tt:0 "Твой связанный узами любовник придёт к тебе этой ночью"
 spn_sire_seduce_me_scheme_tt:0 "Твой связанный узами любовник начинает против тебя интригу соблазнения"
 spn_sire_release_decision:0 "Отпустить Узы создателя"
 spn_sire_release_decision_desc:0 "Отпусти своего связанного узами любовника."
 spn_sire_release_decision_tooltip:0 "Он перестаёт быть твоей [puppet|E] по Узам создателя, и сами узы больше не укоренятся. Пока он всё ещё любит тебя, «Почувствовать Узы создателя» может их вернуть."
 spn_sire_release_decision_confirm:0 "Ступай"
 spn_sire_release_tt:0 "Узы создателя отпущены"
 spn_sire_release_toast_tt:0 "[spn_sire_bond_puppet.GetShortUIName] свободен от Уз создателя."

 # Opinions (boot 4: the strain opinion is no longer given; kept for running saves)
 spn_sire_bond_strain_opinion:0 "Использован через Узы создателя"
 spn_sire_bond_good_word_opinion:0 "Слышал хорошее"

