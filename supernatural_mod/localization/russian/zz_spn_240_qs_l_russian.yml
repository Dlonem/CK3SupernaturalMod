 # Boot 4: Send Me Your Gold (shared by every puppet type)
 spn_puppet_send_gold_interaction:0 "Пришли мне своё золото"
 spn_puppet_send_gold_interaction_desc:0 "[puppet_or_actor.GetShortUIName] присылает тебе золото из [puppet_or_actor.GetHerHis] собственного кошелька. Выбери сколько."
 puppet_action_description_puppet_action_spn_puppet_send_gold:0 "Пусть ваша марионетка пришлёт вам золото из собственного кошелька"
 spn_puppet_no_gold_tt:0 "У [puppet_or_actor.GetShortUIName] есть золото, чтобы прислать"
 spn_puppet_send_gold_100:0 "100 золота"
 spn_puppet_send_gold_500:0 "500 золота"
 spn_puppet_send_gold_1000:0 "1000 золота"
 spn_puppet_send_gold_all:0 "Всё"

 # Boot 4: the deeds any puppet may do (zz_spn_240_puppet_verb_triggers.txt)
 spn_puppet_busy_tt:0 "[puppet_or_actor.GetShortUIName] не на поисках и не выполняет другое поручение"
 spn_puppet_deed_reach_tt:0 "[puppet_or_actor.GetShortUIName] может добраться до [recipient.GetHerHim]: [recipient.GetSheHe] находится там же, где [puppet_or_actor.GetSheHe], живёт в твоём королевстве или в [puppet_or_actor.GetHerHis], или принадлежит к [puppet_or_actor.GetHerHis] двору или семье"
