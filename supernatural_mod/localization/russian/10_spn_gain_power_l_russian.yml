 #### Vampire Feeding Event ###
 spn_gain_power.4010.t:0 "Укушенная ночь"
 spn_gain_power.4010.desc:0 "Пока я крадусь по замку, я нахожу одного из своих придворных в одиночестве у открытого окна, вдыхая свежий ночной воздух. Я прячусь за аркой и наблюдаю, где сейчас находятся стражники и собирается ли мой придворный уйти. \n\nЯ решил, что постараюсь сделать это быстро и тихо. Мой план — схватить его, посмотреть ему прямо в глаза и заставить его молчать и стереть его память об этой ночи."
 spn_gain_power.4010.a:0 "Схватить, съесть, стереть. Понял."
 spn_gain_power.4010.a.tt:0 "Я наконец утолю свою жажду крови."
 
 spn_gain_power.4010.ab.t:0 "Вероятность успеха"
 spn_gain_power.4010.ac.t:0 "Вероятность быть обнаруженным"
 spn_gain_power.4010.ad.t:0 "Вероятность убить придворного"
 
 
 spn_gain_power.4010.b:0 "С другой стороны.. Я пойду высосать кровь у животного."
 spn_gain_power.4010.b.tt:0 "Охота на животное в лесу, возможный прирост силы отсутствует."
 
 
 ### Vampire Bite Night: Success ###
 spn_gain_power.4011.t:0 "Укушенная ночь: Успех"
 spn_gain_power.4011.desc:0 "Мой придворный никогда не видел меня подходящим, я смог заглянуть им в глаза и сказать: «Ты будешь молчать, и у тебя было неприятное столкновение с собакой, чтобы объяснить следы на шее» \n\n Мой голод утихает, и я возвращаюсь в свои покои - никто не видел меня этой ночью."
 spn_gain_power.4011.a:0 "Моя сила кажется обновленной."
 spn_gain_power.4011.a.tt:0 "В этом истощении есть что-то иное. Я чувствую, что моя сила растет... или я просто сыт."
 
 ### Vampire Bite Night: Discovered ###
 spn_gain_power.4012.t:0 "Ночь укусов: Открыто."
 spn_gain_power.4012.desc:0 "Прежде чем я успел заговорить, мой придворный издал ужасный крик! \n\n Я вонзаю зубы в его шею и начинаю пить. Но это не имеет значения, придворный уже узнал меня, и мои стражники видели мои клыки. Как их сюзерен, я приказываю им отступить, и они слушают с сомнением. \n\n Все теперь знают мой секрет, но я все еще у власти."
 spn_gain_power.4012.a:0 "Не так быстро, как я думал..."
 spn_gain_power.4012.a.tt:0 "Несмотря на то, что мои подданные знают о моей природе, я все равно их сюзерен."
 
 ### Vampire Bite Night: Killed ###
 spn_gain_power.4013.t:0 "Ночь укуса: Убито"
 spn_gain_power.4013.desc:0 "Все шло по плану, я подкрался к своему придворному и заставил его молчать и не двигаться. Однако... моя жажда одолела меня, и, когда я поглощал кровь, я потерял счет времени и не заметил, как его тело стало безжизненным."
 spn_gain_power.4013.a:0 "Похоже, моя жажда одолела меня..."
 spn_gain_power.4013.a.tt:0 "Я позволил своей кровожадности взять верх и убил своего бедного курьера."


 ### Werewolf Feeding Event ###
 spn_gain_power.4020.t:0 "Здоровое сердце"
 spn_gain_power.4020.desc:0 "Я чувствую прилив силы и животное влечение, охватывающее меня, эта ночь предлагает отличную возможность выйти в лес и найти животное, на котором можно поесть, ведь крестьяне и жители замка менее склонны выходить на улицы. \n\nПрошло довольно много времени с тех пор, как я в последний раз ел сердце животного, так как я стараюсь избегать пищи из людей, чтобы не вызывать подозрений и не быть охотимым, не то чтобы местные жители были достаточно умны, чтобы распознать что-то кроме атаки животных..."
 spn_gain_power.4020.a:0 "Ночь наступила, я отправлюсь в лес."
 spn_gain_power.4020.a.tt:0 "Я наконец-то смогу удовлетворить свой голод."
 
 spn_gain_power.4020.ab.t:0 "Вероятность успешной охоты"
 spn_gain_power.4020.ac.t:0 "Вероятность быть обнаруженным"
 spn_gain_power.4020.ad.t:0 "Вероятность убийства человека"
 spn_gain_power.4020.ae.t:0 "Вероятность смерти"
 
 
 ### Werewolf Heart Healthy: Success ###
 spn_gain_power.4021.t:0 "Сердце здорово: успешная охота"
 spn_gain_power.4021.desc:0 "Сила наполняет мои вены в уединении леса, где я могу найти никого, кроме себя и своих сородичей. \n\n До сих пор я нашел только мелкую добычу, такую как кролики и лисицы, но я чувствую в воздухе что-то большее за мгновение до того, как услышу треск ветки позади себя. \n\n Я поворачиваюсь и вижу красивого и величественного оленя, его плоть покрыта мускулами. Вскоре я в атаке, бросаясь к нему, наши тела сталкиваются, и его кожа разрывается под моими когтями. Я наскочу на него, как сила природы, разрываясь, чтобы добраться до его сердца. \n\n С вкусом этого сердца на языке и кровью, пропитавшей почти каждую часть меня, я иду нагим обратно к своему замку."
 spn_gain_power.4021.a:0 "Сегодня ночью моя сила возросла."
 spn_gain_power.4021.a.tt:0 "Я начинаю свой путь обратно в замок и привожу себя в порядок."
 
 ### Werewolf Heart Healthy: Discovered ###
 spn_gain_power.4022.t:0 "Сердце Здоровья: Обнаружено"
 spn_gain_power.4022.desc:0 "Охота этой ночи проходила лучше некуда, мне удалось подстрелить крупного оленя, а также схватить пару лис и съесть их сердца.\n\nКогда я решил закончить вечер и вернуться в замок, приняв человеческий облик, мне следовало сначала осмотреться. На гребне холма на лошади стоял один из моих гонцов, вернувшийся от графа, которого я отправил, и смотрел на меня с недоверием - а затем он воскочил на своем коне в город, крича: «Наш Повелитель - Вервольф!»\n\n Похоже, тайна раскрыта."
 spn_gain_power.4022.a:0 "Как мне не удалось почувствовать их поблизости?"
 spn_gain_power.4022.a.tt:0 "Они доберутся до города к тому времени, как я их поймаю, если я побегу за ними, меня воспримут как большее, чем просто монстра."
 
 
 ### Werewolf Heart Healthy: Killed Vassal ###
 spn_gain_power.4023.t:0 "Сердечно здоровый: Убил вассала"
 spn_gain_power.4023.desc:0 "Как только я закончил прятать свою одежду и броню, я услышал какой-то шум вдалеке в лесу и решил преобразиться в волка и уйти в противоположном направлении. Всё, что мне нужно, это утолить свой голод и вернуться, нет смысла ввязываться в неприятности здесь.\n\nМне удалось найти красивого оленя на некотором расстоянии в лесу, и я думал, что мне повезёт ещё больше, когда я набросился на очередное блюдо за камнем, и когда мои зубы вонзились в его шею, я понял слишком поздно..\n\nЯ только что разодрал горло одному из моих вассалов, который, как я теперь помню, должен был отправиться на охоту на следующей неделе!"
 spn_gain_power.4023.a:0 "Похоже, они решили начать свою охоту раньше запланированного."
 spn_gain_power.4023.a.tt:0 "Похоже, это был не просто охотник, а один из моих вассалов, который охотился при полном месяце."
 
 
 ### Werewolf Heart Healthy: Death by Hunter###
 spn_gain_power.4024.t:0 "Сердечно здоровый: Смерть от охотника"
 spn_gain_power.4024.desc:0 "Моя охота проходит хорошо, я смог полакомиться группой оленей, к которым подошёл незаметно, и это меня сильно удовлетворило. \nЯ планирую добыть ещё одну жертву, прежде чем закончить охоту и вернуться в замок, но треск веток ранее насторожил меня. \n\nМне удалось обнаружить последнего кролика, когда я услышал очередной треск ветки поблизости - и в тот же момент я увидел лицо в том направлении, как из моего груди вылетела стрела. \n\nЯ только видел их при своём дворе, когда они поднимали вопрос о зверях и ночных созданиях, казалось, они сами решили взять дело в свои руки..."
 spn_gain_power.4024.a:0 "Поражён охотником..."
 spn_gain_power.4024.a.tt:0 "Я смотрю вниз и вижу, как из моего груди вылетела стрела."


### added by sync_localizations.py -- untranslated, 23 keys
 spn_gain_power.4015.t:0 "The Road, Not the Castle"
 spn_gain_power.4015.desc:0 "The castle keeps its people close, and close people are counted. So I take the road instead.\n\nHalf a league out there is a cart pulled onto the verge, an ox unhitched and grazing, and a man asleep against the wheel with his hat over his face. A carter, or a pilgrim who ran out of daylight. Nobody knows where he is tonight. Nobody will know where he was.\n\nI kneel beside him and put two fingers on his throat, the way a physician might. He does not wake. I only need a little — enough to take the edge off the ache, not enough that he cannot get the ox moving in the morning."
 spn_gain_power.4015.a:0 "A little, and then I let him sleep."
 spn_gain_power.4015.a.tt:0 "He wakes at dawn light-headed and blames the wine."
 spn_gain_power.4016.t:0 "Blood You Paid For"
 spn_gain_power.4016.desc:0 "There is a man in the shambles who bleeds his beasts into a pail and sells the pail, and there is a physician two streets over whose leech-jars have to be emptied into something.\n\nNeither of them asks what it is for. That is what the coin is buying — not the blood, which is cheap, but the incuriosity, which is not.\n\nIt is thin stuff. It tastes of iron and the pail. It does not sing the way a living throat sings. But no one goes missing, no one wakes on a verge wondering, and no one comes looking. There is a great deal to be said for being boring."
 spn_gain_power.4016.a:0 "Coin is cheaper than suspicion."
 spn_gain_power.4016.a.tt:0 "Thin, cold, and entirely uneventful. The best kind of meal."
 spn_gain_power.4026.t:0 "Run the Border"
 spn_gain_power.4026.desc:0 "My own woods have been hunted thin, and more to the point, they are mine. A carcass found on my land is my problem twice — once as a carcass, once as a question.\n\nSo I go over the line. The trees do not change and the ground does not change, but the trouble does: past that stream it belongs to somebody else.\n\nThere are sheep in the fold below, and a dog that knows before the man does. I take what I came for and I am back across the water before the lanterns are lit. Someone over there will count his flock in the morning and swear."
 spn_gain_power.4026.a:0 "Let them count their sheep on their own side."
 spn_gain_power.4026.a.tt:0 "Fed, and the mess is somebody else's to explain."
 spn_gain_power.4027.t:0 "Another Wolf's Ground"
 spn_gain_power.4027.desc_born:0 "I smell it before I see it — a stag brought down and opened, still steaming, and not by me.\n\nThe throat is torn out the way I would have torn it out. Whatever did this stood where I am standing, not long ago, and had the same thought I did.\n\nI have never met another. My mother never said there were others; she only ever said to be careful, which I understood too late to be the same thing. I put my hand flat in the print beside the carcass. It is bigger than mine.\n\nSomething is watching me from the treeline. It has not moved and it has not run."
 spn_gain_power.4027.desc_turned:0 "I smell it before I see it — a stag brought down and opened, still steaming, and not by me.\n\nThe throat is torn out the way I would have torn it out. Whatever did this stood where I am standing, not long ago, and had the same thought I did.\n\nI was made, not born. Somewhere there is the one who made me, and there is no reason on earth to think they stopped at me. I put my hand flat in the print beside the carcass. It is bigger than mine.\n\nSomething is watching me from the treeline. It has not moved and it has not run."
 spn_gain_power.4027.a:0 "I eat first. We can decide what we are afterwards."
 spn_gain_power.4027.a.tt:0 "Neither of us gives ground, and neither of us starts anything."
 spn_gain_power.4010.c:0 "There are men who sell it by the pail."
 spn_gain_power.4010.c.tt:0 "Pay for blood instead of taking it. Costs coin; risks nothing."
 spn_gain_power.4020.b:0 "Not my woods. Over the line."
 spn_gain_power.4020.b.tt:0 "Hunt across the county border, where the carcass is somebody else's problem."
 spn_gain_power.4020.c:0 "Something else has been hunting here."
 spn_gain_power.4020.c.tt:0 "Follow the kill that isn't yours."
