 #### Vampire Feeding Event ###
 spn_gain_power.4010.t:0 "Ночь укуса"
 spn_gain_power.4010.desc:0 "Я крадусь по замку и нахожу одного из своих придворных — он один у открытого окна и вдыхает свежий ночной воздух. Я жду за аркой и смотрю, где сейчас стоят стражники и собирается ли придворный уходить. \n\nЯ решил(а) сделать это быстро и тихо. Мой план: схватить его, посмотреть прямо в глаза, принудить молчать и стереть из его памяти эту ночь."
 spn_gain_power.4010.a:0 "Схватить, выпить, стереть. Ясно."
 spn_gain_power.4010.a.tt:0 "Наконец-то я утолю свою жажду крови."
 
 spn_gain_power.4010.ab.t:0 "Шанс успеха"
 spn_gain_power.4010.ac.t:0 "Шанс быть обнаруженным"
 spn_gain_power.4010.ad.t:0 "Шанс убить придворного"
 
 
 spn_gain_power.4010.b:0 "Только не здесь. На дороге всегда кто-то есть."
 spn_gain_power.4010.b.tt:0 "Взять немного у путника, который никогда не узнает твоего имени."
 
 
 ### Vampire Bite Night: Success ###
 spn_gain_power.4011.t:0 "Ночь укуса: успех"
 spn_gain_power.4011.desc:0 "Придворный меня не заметил. Я заглядываю ему в глаза и говорю: «Ты будешь молчать, а следы на твоей шее — от того, что ты неудачно столкнулся с собакой». \n\n Голод отступает, и я возвращаюсь к себе — этой ночью меня никто не видел."
 spn_gain_power.4011.a:0 "Силы будто вернулись ко мне."
 spn_gain_power.4011.a.tt:0 "В этой трапезе есть что-то необычное. Кажется, силы мои растут... или я просто сыт(а)."
 
 ### Vampire Bite Night: Discovered ###
 spn_gain_power.4012.t:0 "Ночь укуса: разоблачение"
 spn_gain_power.4012.desc:0 "Не успеваю я и слова сказать, как придворный издаёт душераздирающий крик! \n\n Я вонзаю зубы ему в шею и начинаю пить. Но это уже не важно: придворный меня узнал, а стражники видели мои клыки. Как их сюзерен, я приказываю им опустить оружие — и они подчиняются, пусть и неохотно. \n\n Теперь мой секрет знают все — но власть всё ещё моя."
 spn_gain_power.4012.a:0 "Не так быстро, как мне казалось..."
 spn_gain_power.4012.a.tt:0 "Пусть подданные знают мою природу, — сюзерен для них всё ещё я."
 
 ### Vampire Bite Night: Killed ###
 spn_gain_power.4013.t:0 "Ночь укуса: убийство"
 spn_gain_power.4013.desc:0 "Всё шло по плану: я подкрадываюсь к придворному и принуждаю его молчать и не двигаться. Вот только... голод берёт верх, и, пока я пью кровь, я теряю счёт времени — и не замечаю, как давно его тело обмякло."
 spn_gain_power.4013.a:0 "Кажется, жажда взяла надо мной верх..."
 spn_gain_power.4013.a.tt:0 "Жажда крови взяла верх — и бедный мой придворный мёртв."


 ### Werewolf Feeding Event ###
 spn_gain_power.4020.t:0 "Полезно для сердца"
 spn_gain_power.4020.desc:0 "Я чувствую прилив силы и звериное желание — эта ночь отличный случай уйти в лес и найти зверя, чтобы насытиться: крестьяне и обитатели замка в такое время выходят редко. \n\nПрошло немало времени с тех пор, как я последний раз ел сердце зверя: я стараюсь не трогать людей, чтобы не навлечь подозрений и не стать добычей охотников. Впрочем, местные вряд ли способны распознать что-то, кроме нападения зверя..."
 spn_gain_power.4020.a:0 "Ночь наступила — я ухожу в лес."
 spn_gain_power.4020.a.tt:0 "Наконец-то я смогу утолить свой голод."
 
 spn_gain_power.4020.ab.t:0 "Шанс удачной охоты"
 spn_gain_power.4020.ac.t:0 "Шанс быть обнаруженным"
 spn_gain_power.4020.ad.t:0 "Шанс убить человека"
 spn_gain_power.4020.ae.t:0 "Шанс погибнуть"
 
 
 ### Werewolf Heart Healthy: Success ###
 spn_gain_power.4021.t:0 "Полезно для сердца: удачная охота"
 spn_gain_power.4021.desc:0 "В лесной глуши сила гудит в моих жилах: здесь, кроме меня и моих собратьев-зверей, никого нет. \n\n Пока мне попадалась только мелкая добыча — кролики и лисы, — но я чую на ветру что-то крупное, и в тот же миг слышу за спиной хруст ветки. \n\n Я оборачиваюсь и вижу прекрасного, могучего оленя — под кожей перекатываются тугие мышцы. Через мгновение я бросаюсь на него: наши тела сталкиваются, его кожа рвётся под моими когтями. Я обрушиваюсь на него, как стихия, прогрызая путь к сердцу. \n\n Со вкусом этого сердца на языке, залитый кровью едва ли не целиком, я возвращаюсь в замок нагишом."
 spn_gain_power.4021.a:0 "Сегодня ночью силы мои выросли."
 spn_gain_power.4021.a.tt:0 "Отправляюсь назад в замок — привести себя в порядок."
 
 ### Werewolf Heart Healthy: Discovered ###
 spn_gain_power.4022.t:0 "Полезно для сердца: разоблачение"
 spn_gain_power.4022.desc:0 "Охота идёт настолько хорошо, насколько можно пожелать: мне удаётся завалить крупного оленя, а ещё я догоняю пару лис и съедаю их сердца.\n\nЯ решаю закончить и идти назад к замку, принимаю человеческий облик, чтобы обмыться, — и вот тут надо было сначала осмотреться. На гребне, верхом, стоит один из моих гонцов — тот, что возвращается от графа, к которому я его посылал. Он смотрит на меня не веря своим глазам — а потом уносится на коне в город, крича: «Наш сюзерен — оборотень!»\n\n Что ж, собака, что называется, выскочила из мешка."
 spn_gain_power.4022.a:0 "Как можно было не почуять его рядом?"
 spn_gain_power.4022.a.tt:0 "Прежде чем я его догоню, он будет в городе; а пустись я в погоню — меня увидят и увидят во мне больше, чем просто чудовище."
 
 
 ### Werewolf Heart Healthy: Killed Vassal ###
 spn_gain_power.4023.t:0 "Полезно для сердца: убитый вассал"
 spn_gain_power.4023.desc:0 "Убрав одежду и доспехи, я слышу в глубине леса какой-то шум и решаю обратиться в волка и пойти в другую сторону. Мне нужно только утолить голод и вернуться — незачем искать приключений здесь.\n\nПоодаль я нахожу прекрасного оленя и, бросаясь на очередную добычу за камнем, думаю, что мне повезло ещё больше, — и только когда зубы смыкаются на шее, я понимаю, поздно...\n\nЯ только что вырвал горло одному из своих вассалов — и тут же вспоминаю, что он собирался на охоту на следующей неделе! "
 spn_gain_power.4023.a:0 "Видимо, они решили начать охоту раньше, чем собирались."
 spn_gain_power.4023.a.tt:0 "И это не просто охотник — это один из моих вассалов, вышедший на охоту при полной луне."
 
 
 ### Werewolf Heart Healthy: Death by Hunter###
 spn_gain_power.4024.t:0 "Полезно для сердца: смерть от Охотника"
 spn_gain_power.4024.desc:0 "Охота идёт хорошо: я подкрадываюсь к стаду оленей и насыщаюсь вдоволь. \nПеред тем как закончить и вернуться в замок, я решаю взять ещё одну добычу, — но тот хруст веток оставил во мне немного тревоги.\n\nЯ нахожу последнего кролика — и слышу рядом ещё один хруст ветки. И в тот же миг, когда стрела вырастает у меня из груди, я различаю в той стороне лицо.\n\nЯ встречал его в своём дворе лишь однажды — когда он поднимал вопрос о зверях и тварях ночи. Похоже, он решил взяться за это сам..."
 spn_gain_power.4024.a:0 "Меня одолел Охотник..."
 spn_gain_power.4024.a.tt:0 "Я смотрю вниз: из груди у меня торчит стрела."

 ### 2.32 -- The Road, Not the Castle (vampire safe floor) ###
 spn_gain_power.4015.t:0 "Дорога, а не замок"
 spn_gain_power.4015.desc:0 "Замок держит своих людей при себе, а тех, кто под рукой, пересчитывают. Потому я выхожу на дорогу.\n\nПоллиги отсюда — телега, свезённая на обочину, отпряженный вол, что пасётся рядом, и человек, спящий у колеса, накрыв лицо шляпой. Возчик — или паломник, которого застигла темнота. Сегодня ночью никто не знает, где он. Никто не узнает, где он был.\n\nЯ опускаюсь рядом на колени и кладу два пальца ему на горло — так, как это сделал бы лекарь. Он не просыпается. Мне нужно немного: ровно чтобы притупить боль и не настолько, чтобы утром он не смог поднять вола."
 spn_gain_power.4015.a:0 "Немного — и пусть спит."
 spn_gain_power.4015.a.tt:0 "На рассвете он проснётся с тяжёлой головой и всё свалит на вино."

 ### 2.32 -- Blood You Paid For (vampire, gold cost) ###
 spn_gain_power.4016.t:0 "Кровь, за которую заплачено"
 spn_gain_power.4016.desc:0 "На бойне есть человек, который спускает кровь своих животных в ведро и продаёт это ведро, а в двух улицах отсюда есть лекарь, чьи банки с пиявками надо во что-то опорожнять.\n\nНи один из них не спрашивает, зачем это. Именно это и покупают деньги: не кровь, которая дёшева, а безразличие, которое — нет.\n\nЭто жидкая дрянь. На вкус — железо и ведро. Оно не поёт так, как поёт живое горло. Зато никто не пропадает, никто не просыпается на обочине в недоумении, и никто не приходит искать. В том, чтобы быть скучным, есть много хорошего."
 spn_gain_power.4016.a:0 "Монета дешевле подозрения."
 spn_gain_power.4016.a.tt:0 "Жидко, холодно и совершенно без происшествий. Лучшая из трапез."

 ### 2.32 -- Run the Border (werewolf) ###
 spn_gain_power.4026.t:0 "Пробежка по границе"
 spn_gain_power.4026.desc:0 "Мои собственные леса я уже выбил почти подчистую, и, что важнее, они мои. Туша, найденная на моей земле, — двойная моя забота: как туша и как вопрос.\n\nПоэтому я перехожу черту. Деревья не меняются, земля не меняется — меняются только неприятности: за тем ручьём это уже чужое.\n\nВнизу, в загоне, овцы, и собака чует меня раньше хозяина. Я беру то, за чем пришёл, и успеваю обратно за ручей прежде, чем зажгут фонари. Кто-то там утром пересчитает своё стадо и выругается."
 spn_gain_power.4026.a:0 "Пусть считают своих овец на своей стороне."
 spn_gain_power.4026.a.tt:0 "Голод утолён, а разбираться с этим — не мне."

 ### 2.32 -- Another Wolf's Ground (werewolf, reads born/turned) ###
 spn_gain_power.4027.t:0 "Земля другого волка"
 spn_gain_power.4027.desc_born:0 "Я чую его прежде, чем вижу: заваленный и вскрытый олень, ещё парит, и завалил его не я.\n\nГорло вырвано так, как вырвал бы я. То, что это сделало, стояло там, где стою я, — не так давно — и думало то же, что думаю я.\n\nМне не доводилось встречать другого. Мать никогда не говорила, что есть и другие; она говорила только про осторожность, и только слишком поздно до меня дошло, что это одно и то же. Я кладу ладонь на отпечаток рядом с тушей. Он больше моего.\n\nЧто-то следит за мной с опушки. Оно не двинулось и не убежало."
 spn_gain_power.4027.desc_turned:0 "Я чую его прежде, чем вижу: заваленный и вскрытый олень, ещё парит, и завалил его не я.\n\nГорло вырвано так, как вырвал бы я. То, что это сделало, стояло там, где стою я, — не так давно — и думало то же, что думаю я.\n\nМеня сделали, а не родили. Где-то есть тот, кто меня создал, и нет ни одной причины думать, что он остановился на мне. Я кладу ладонь на отпечаток рядом с тушей. Он больше моего.\n\nЧто-то следит за мной с опушки. Оно не двинулось и не убежало."
 spn_gain_power.4027.a:0 "Сначала поем. Решим, кто мы такие, потом."
 spn_gain_power.4027.a.tt:0 "Ни один из нас не уступает и ни один не начинает первым."

 ### 2.32 -- new options on the existing entry events ###
 spn_gain_power.4010.c:0 "Есть люди, которые продают её вёдрами."
 spn_gain_power.4010.c.tt:0 "Заплатить за кровь, а не брать её. Стоит денег; ничем не рискуешь."
 spn_gain_power.4020.b:0 "Не мои леса. За чертой."
 spn_gain_power.4020.b.tt:0 "Поохотиться за границей графства, где туша — чужая забота."
 spn_gain_power.4020.c:0 "Здесь охотился кто-то ещё."
 spn_gain_power.4020.c.tt:0 "Пойти по следу чужой добычи."
