l_russian:

 trait_spn_champion_silverback:0 "Чемпион Серебряной Спины"
 trait_spn_champion_silverback_desc:0 "Избранник Серебряной Спины, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Серебряной Спине — серый, как дым.\n\nСильнейший из шести. Он встаёт между слабыми и теми, кто причинил бы им вред."
 trait_spn_champion_silverback_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Серебряной Спиной, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Серебряной Спине — серый, как дым.\n\nСильнейший из шести. Он встаёт между слабыми и теми, кто причинил бы им вред."
 trait_spn_champion_timber:0 "Чемпион Кряжа"
 trait_spn_champion_timber_desc:0 "Избранник Кряжа, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Кряжу — бурый, как кора.\n\nОдиночка. Наедине с лесом он сильнее всего, и найти его трудно."
 trait_spn_champion_timber_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Кряжем, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Кряжу — бурый, как кора.\n\nОдиночка. Наедине с лесом он сильнее всего, и найти его трудно."
 trait_spn_champion_tundra:0 "Чемпион Тундры"
 trait_spn_champion_tundra_desc:0 "Избранник Тундры, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Тундре — белый, как снег.\n\nТерпеливый. Его чемпионы отговариваются там, где другие дерутся."
 trait_spn_champion_tundra_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Тундрой, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Тундре — белый, как снег.\n\nТерпеливый. Его чемпионы отговариваются там, где другие дерутся."
 trait_spn_champion_graybeard:0 "Чемпион Седоборода"
 trait_spn_champion_graybeard_desc:0 "Избранник Седоборода, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Седобороду — пепельно-серый, в шрамах.\n\nСамый бесстрашный. Его чемпионы не отступают — и их солдаты тоже."
 trait_spn_champion_graybeard_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Седобородом, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Седобороду — пепельно-серый, в шрамах.\n\nСамый бесстрашный. Его чемпионы не отступают — и их солдаты тоже."
 trait_spn_champion_midnight:0 "Чемпион Полночи"
 trait_spn_champion_midnight_desc:0 "Избранник Полночи, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Полночи — чёрный.\n\nСамый свирепый. Мир чувствует, кто её чемпион."
 trait_spn_champion_midnight_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Полночью, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Полночи — чёрный.\n\nСамый свирепый. Мир чувствует, кто её чемпион."
 trait_spn_champion_alpha:0 "Чемпион Альфы"
 trait_spn_champion_alpha_desc:0 "Избранник Альфы, одной из шести шкур. Дух шкуры живёт в этом персонаже, и, когда он принимает волчью форму, волк принадлежит Альфе — рыже-бурый и огромный.\n\nШкура вожака, потерянная на десятилетия. Она берёт только вожака, и стая от этого растёт быстрее."
 trait_spn_champion_alpha_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] назван(а) Альфой, одной из шести шкур; дух шкуры — в [ROOT.Char.GetHerHis] крови. Когда [ROOT.Char.GetSheHe] принимает волчью форму, волк принадлежит Альфе — рыже-бурый и огромный.\n\nШкура вожака, потерянная на десятилетия. Она берёт только вожака, и стая от этого растёт быстрее."
 trait_spn_true_alpha:0 "Истинная Альфа"
 trait_spn_true_alpha_desc:0 "Альфа, поднявшаяся без единого убийства — одной лишь своей сутью. Каждый волк в стае от этого сильнее, а [spn_pack_standing|E] никогда не падает ниже 75. Такое случается раз в сто лет."
 trait_spn_true_alpha_character_desc:0 "Альфа, поднявшаяся без единого убийства — одной лишь своей сутью. Каждый волк в стае от этого сильнее, а [ROOT.Char.GetHerHis] [spn_pack_standing|E] никогда не падает ниже 75. Такое случается раз в сто лет."
 trait_track_hide_bond:0 "Узы шкуры"
 spn_hide_tongue_toast_t:0 "Шкура говорит на твоём языке"
 decision_group_type_supernatural:0 "Сверхъестественные решения"
 spn_hide_tongue_toast_tt:0 "Кто бы ни носил твою шкуру после тебя, он заговорит на твоём языке."
 trait_track_hide_bond_desc:0 "Насколько глубоко дух шкуры вошёл в тебя. Он растёт понемногу каждый год, что ты носишь шкуру, — сильнее, если ты бегаешь со [spn_pack|E], и когда ты откликаешься на зов шкуры, побеждаешь охотника или сражаешься; он падает, когда ты снимаешь шкуру. На 25 шкура учит твой язык. Её голос говорит на 20, 40, 60, 80 и 100."
 spn_hide_silverback_modifier:0 "Серебряная Спина"
 spn_hide_silverback_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_silverback_modifier:0 "Здесь хранят реликвию: Серебряная Спина"
 spn_hide_relic_kept_silverback_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
 spn_hide_timber_modifier:0 "Кряж"
 spn_hide_timber_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_timber_modifier:0 "Здесь хранят реликвию: Кряж"
 spn_hide_relic_kept_timber_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
