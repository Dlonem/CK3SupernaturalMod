 spn_hunt.0200.f.card_tt:0 "Шкура не промахивается. Охотник погибает без боя. (Раз в десять лет; семь — при самых глубоких [spn_hide_bond|E].)"
 spn_hunt.0200.b.timber_tt:0 "Бурелом умеет уходить без следа. Уйти тебе намного легче."
 spn_hunt.0200.g.tundra_tt:0 "Тундра знает, что сказать. Охотник куда охотнее тебе поверит."
 spn_hunt.0200.h:0 "[ROOT.Char.MakeScope.Var('spn_silverback_guard').Char.GetShortUIName|U] заслоняет меня собой."
