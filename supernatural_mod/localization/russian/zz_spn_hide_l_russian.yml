 spn_wound_incubation.9000.g:0 "Пусть стая несёт меня."
 spn_wound_incubation.9000.g.tt:0 "Волки, что сидели с тобой, выведут тебя: ты скорее станешь волком и реже погибнешь. Если ты обратишься, а [ROOT.Char.MakeScope.Var('spn_pack_carried_by').Char.GetShortUIName] состоит в [spn_pack|E], где есть место, ты проснёшься в ней."
 spn_ask_to_unbind_effect_tt:0 "Дух шкуры покидает тебя. Шкура остаётся в твоих руках — вновь старая кожа, — и десять лет не будет смотреть на тебя."
