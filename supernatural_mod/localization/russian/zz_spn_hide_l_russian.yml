 spn_hide_tundra_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_tundra_modifier:0 "Здесь хранят реликвию: Тундра"
 spn_hide_relic_kept_tundra_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
 spn_hide_graybeard_modifier:0 "Седобород"
 spn_hide_graybeard_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_graybeard_modifier:0 "Здесь хранят реликвию: Седобород"
 spn_hide_relic_kept_graybeard_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
 spn_hide_midnight_modifier:0 "Полночь"
 spn_hide_midnight_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_midnight_modifier:0 "Здесь хранят реликвию: Полночь"
 spn_hide_relic_kept_midnight_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
 spn_hide_alpha_modifier:0 "Альфа"
 spn_hide_alpha_modifier_desc:0 "Сила шкуры — для её собственного [spn_champion|E]."
 spn_hide_relic_kept_alpha_modifier:0 "Здесь хранят реликвию: Альфа"
 spn_hide_relic_kept_alpha_modifier_desc:0 "Местные верующие хранят старую шкуру как святую реликвию и прикладываются к ней в праздники. Волки знают, что это на самом деле."
 spn_hide_known_dread_modifier:0 "Носит одну из шести"
 spn_hide_known_dread_modifier_desc:0 "Все знают, что это за волк и какая из шести шкур на нём."
 spn_hide_known_dread_timber_modifier:0 "Носит одну из шести"
 spn_hide_known_dread_timber_modifier_desc:0 "Все знают, что это за волк и что на нём. Чемпионов Кряжа трудно найти — потому их труднее забыть."
 spn_pack_modifier:0 "Бегает со стаей"
 spn_pack_modifier_desc:0 "Волки сильнее вместе. Чем больше [spn_pack|E], тем сильнее каждый волк в ней."
 spn_pack_modifier_scale_desc:0 "Волков в стае"
 spn_pack_mentality_modifier:0 "Стайный склад"
 spn_pack_mentality_modifier_desc:0 "Сила стаи в числе считается для этого волка в полтора раза."
 spn_two_spirits_modifier:0 "Два духа бегут вместе"
 spn_two_spirits_modifier_desc:0 "Две из шести шкур бегут в этой [spn_pack|E]."
 spn_old_ones_gather_modifier:0 "Древние сходятся"
 spn_old_ones_gather_modifier_desc:0 "Три или больше из шести шкур бегут в этой [spn_pack|E]. Леса такого давно не видели."
 spn_alone_in_the_woods_modifier:0 "Наедине с лесом"
 spn_hide_ageless_modifier:0 "Нестареющий волк"
 spn_hide_ageless_modifier_desc:0 "Шкура не может дать годы тому, кто не стареет, поэтому она питает самого волка."
 spn_alone_in_the_woods_modifier_desc:0 "Чемпион Кряжа бежит в одиночку, как всегда бежал Кряж, и от этого его труднее найти."
 spn_evolved_modifier:0 "Развившийся"
 spn_evolved_modifier_desc:0 "Стаю этого волка коснулось Объединение. Она стала больше, чем была."
 spn_hybrid_gift_modifier:0 "Дар гибрида"
 spn_hybrid_gift_modifier_desc:0 "Сила альфы-гибрида, переданная через Объединение каждому волку в стае."
 spn_hold_the_line_modifier:0 "Держать строй"
 spn_hold_the_line_modifier_desc:0 "Седобород не отступает. И люди за его чемпионом — тоже."
 spn_let_it_take_me_modifier:0 "Пусть оно возьмёт меня"
 spn_let_it_take_me_modifier_desc:0 "Полночь выпущена до конца. В следующем бою она убьёт вдвое больше, а когда бой кончится, оставит своего чемпиона без сил."
 spn_hide_feud_opinion:0 "Вражда из-за шкуры"
 spn_kindred_blood_opinion:0 "Родная кровь"
 spn_lured_away_opinion:0 "Переманил(а) моего волка"
 spn_left_my_pack_opinion:0 "Покинул(а) мою стаю"
 spn_challenge_lost_opinion:0 "Победил(а) меня в Испытании"
 spn_blood_pact_opinion:0 "Кровавый пакт"
 spn_shrine_thief_opinion:0 "Хотел(а) украсть реликвию"
 spn_true_alpha_rose_opinion:0 "Истинная Альфа"
 spn_pack_truce_opinion:0 "Перемирие стай"
 artifact_spn_hide:0 "Шкура"
 spn_hide_silverback_name:0 "Серебряная Спина"
 spn_hide_silverback_desc:0 "Старая серая волчья шкура, пахнущая дымом и кедром. Тяжелее, чем кажется. Это Серебряная Спина, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nСеребряная Спина ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_silverback_desc_christopher:0 "Старая серая волчья шкура, пахнущая дымом и кедром. Тяжелее, чем кажется. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nСеребряная Спина ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_timber_name:0 "Бурелом"
 spn_hide_timber_desc:0 "Бурая волчья шкура, жёсткая, пахнущая сосновой смолой. В одиночестве она кажется легче. Это Бурелом, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nБурелом ищет чемпиона, который [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] или [GetTrait('wrathful').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('gregarious').GetName( GetNullCharacter )] или [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_timber_desc_christopher:0 "Бурая волчья шкура, жёсткая, пахнущая сосновой смолой. В одиночестве она кажется легче. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nБурелом ищет чемпиона, который [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] или [GetTrait('wrathful').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('gregarious').GetName( GetNullCharacter )] или [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_tundra_name:0 "Тундра"
 spn_hide_tundra_desc:0 "Белая волчья шкура, холодная на ощупь в любую погоду. Это Тундра, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nТундра ищет чемпиона, который [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] или [GetTrait('patient').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('honest').GetName( GetNullCharacter )] или [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_tundra_desc_christopher:0 "Белая волчья шкура, холодная на ощупь в любую погоду. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nТундра ищет чемпиона, который [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] или [GetTrait('patient').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('honest').GetName( GetNullCharacter )] или [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_graybeard_name:0 "Седобородый"
 spn_hide_graybeard_desc:0 "Пепельно-серая волчья шкура, изрезанная старыми шрамами, которые так и не затянулись. Это Седобородый, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nСедобородый ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Он отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )] или [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide_graybeard_desc_christopher:0 "Пепельно-серая волчья шкура, изрезанная старыми шрамами, которые так и не затянулись. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nСедобородый ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Он отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )] или [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide_midnight_name:0 "Полночь"
 spn_hide_midnight_desc:0 "Чёрная волчья шкура. Тёплая ещё до того, как её коснутся. Это Полночь, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nПолночь ищет чемпиона, который [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] или [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide_midnight_desc_christopher:0 "Чёрная волчья шкура. Тёплая ещё до того, как её коснутся. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nПолночь ищет чемпиона, который [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] или [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide_alpha_name:0 "Альфа"
 spn_hide_alpha_desc:0 "Огромная рыже-бурая волчья шкура. Собаки ложатся, когда её проносят мимо. Это Альфа, одна из шести шкур. Шкура не делает волка. Она выбирает волка.\n\nАльфа ищет чемпиона, который [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] или [GetTrait('arrogant').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] или [GetTrait('craven').GetName( GetNullCharacter )]."
 spn_hide_alpha_desc_christopher:0 "Огромная рыже-бурая волчья шкура. Собаки ложатся, когда её проносят мимо. Монахи хранят её как плащ святого Христофора, которого греки пишут с собачьей головой. Надеть её никому не дают.\n\nАльфа ищет чемпиона, который [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] или [GetTrait('arrogant').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] или [GetTrait('craven').GetName( GetNullCharacter )]."
 story_spn_pack:0 "Стая"
 story_spn_pack_desc:0 "[spn_pack|E] волков и альфа, за которым она идёт."
 story_spn_pack_membership:0 "Стая"
 story_spn_pack_membership_desc:0 "[spn_pack|E], с которой ты бегаешь."
 spn_pack_story_string:0 "Волки бегут сильнее вместе. Каждый волк в стае ([spn_pack|E]) получает от её размера; [spn_alpha|E] ведёт её, а [spn_second|E] стоит следующим. Волк, покинувший стаю, теряет [spn_pack_standing|E].\n\nВ стае [Story.MakeScope.Var('spn_pack_size').GetValue|0] из возможных 25 волков."
 SPN_PACK_ALPHA:0 "Альфа"
 SPN_PACK_SECOND:0 "Второй"
 SPN_PACK_CO_ALPHA:0 "Со-альфа"
 SPN_PACK_CHAMPIONS:0 "Чемпионы шести"
 SPN_PACK_MEMBERS:0 "Стая"
 spn_let_the_wolf_run_decision:0 "Выпустить волка"
 spn_let_the_wolf_run_decision_desc:0 "Уходя на войну, ты берёшь шкуру с собой — не как человека с мечом, а как то, чем она является."
 spn_let_the_wolf_run_decision_tooltip:0 "Позволить шкуре сражаться в твоих битвах."
 spn_let_the_wolf_run_decision_confirm:0 "Пусть бежит"
 spn_let_the_wolf_run_decision_effect_tt:0 "В бою шкура каждый раз убивает нескольких вражеских рыцарей и первой схватывается с любым другим чемпионом на поле. Кто-нибудь может увидеть, кто ты."
 spn_hold_the_wolf_back_decision:0 "Сдерживать волка"
 spn_hold_the_wolf_back_decision_desc:0 "Ты сражаешься как человек. Шкура молчит в бою, и никто ничего не видит."
 spn_hold_the_wolf_back_decision_tooltip:0 "Держать шкуру вне твоих битв."
 spn_hold_the_wolf_back_decision_confirm:0 "Сдерживать её"
 spn_hold_the_wolf_back_decision_effect_tt:0 "Шкура не сражается в твоих битвах."
 spn_vanish_decision:0 "Исчезнуть"
 spn_vanish_decision_desc:0 "Бурелом показывает, как остывает след. След, что ты оставил здесь, исчезнет к утру."
 spn_vanish_decision_tooltip:0 "Стереть след, оставленный тобой в этом графстве."
 spn_vanish_decision_confirm:0 "Исчезнуть"
 spn_vanish_no_trail_tt:0 "Здесь есть след, в котором названо твоё имя"
 spn_vanish_hunt_running_tt:0 "В этом графстве ещё не работает ни один охотник"
 spn_hold_the_line_decision:0 "Держать строй"
 spn_hold_the_line_decision_desc:0 "Седобородый не отступает — и год не будут отступать люди за твоей спиной."
 spn_hold_the_line_decision_tooltip:0 "Седобородый держит строй."
 spn_hold_the_line_decision_confirm:0 "Держать"
 spn_let_it_take_me_decision:0 "Пусть оно возьмёт меня"
 spn_let_it_take_me_decision_desc:0 "Выпустить Полночь до конца. В следующей битве она убьёт вдвое больше — а когда битва кончится, ты останешься без сил."
 spn_let_it_take_me_decision_tooltip:0 "Выпустить Полночь."
 spn_let_it_take_me_decision_confirm:0 "Пусть возьмёт меня"
 spn_let_it_take_me_decision_effect_tt:0 "В следующей битве шкура убивает вдвое больше. Когда битва кончается, ты получаешь сильный [stress|E]."
 spn_let_it_take_me_runs_tt:0 "Волк выпущен"
 spn_call_the_packs_decision:0 "Созвать стаи"
 spn_call_the_packs_decision_desc:0 "Альфа хочет, чтобы разрозненные стаи собрались вместе. Год каждый альфа в пределах досягаемости будет тебя слышать, и те, кто придёт, останутся тебе должны."
 spn_call_the_packs_decision_tooltip:0 "Созвать каждую стаю в пределах досягаемости на Сход оборотней ([werewolf_gathering|E])."
 spn_call_the_packs_decision_confirm:0 "Созвать их"
 spn_call_the_packs_decision_effect_tt:0 "В течение года ты можешь приглашать каждого альфу в пределах досягаемости на [werewolf_gathering|E], и каждый пришедший альфа остаётся тебе должен услугу."
 spn_call_the_packs_cooldown_tt:0 "Ты не проводил(а) [werewolf_gathering|E] последние пять лет"
 spn_send_for_hide_decision:0 "Послать за шкурой"
 spn_send_for_hide_decision_desc:0 "Ты знаешь, где хранится шкура. Пошли кого-нибудь принести её, как бы далеко она ни была."
 spn_send_for_hide_decision_tooltip:0 "Послать кого-нибудь украсть шкуру из святилища, где её хранят."
 spn_send_for_hide_decision_confirm:0 "Послать кого-нибудь"
 spn_send_for_hide_busy_tt:0 "У тебя ещё нет никого в дороге"
 spn_send_for_hide_caught_tt:0 "Тебя не ловили на краже из святилища последние пять лет"
 spn_send_for_hide_decision_effect_tt:0 "Выбери, за какой шкурой послать. Чем дальше она хранится, тем дольше ждать вестей."
 spn_take_hide_from_shrine_decision:0 "Забрать шкуру из святилища"
 spn_take_hide_from_shrine_decision_desc:0 "Святая реликвия, что хранится в твоих собственных землях, — не реликвия. Сними её."
 spn_take_hide_from_shrine_decision_tooltip:0 "Снять шкуру со святилища."
 spn_take_hide_from_shrine_decision_confirm:0 "Забрать"
 spn_found_pack_decision:0 "Основать стаю"
 spn_found_pack_decision_desc:0 "Собери волков, которые пойдут за тобой, и веди их как их альфа."
 spn_found_pack_decision_tooltip:0 "Основать [spn_pack|E] и возглавить её."
 spn_found_pack_decision_confirm:0 "Основать"
 spn_found_pack_standing_tt:0 "Ты [spn_champion|E], или твой [spn_pack_standing|E] равен 50 (40 с «Вожаком стаи» или для волка, рождённого волком; 25, если другой волк при твоём дворе мог бы бегать с тобой)"
 spn_leave_pack_decision:0 "Покинуть стаю"
 spn_leave_pack_decision_desc:0 "Уйти от своей стаи. Это будет стоить тебе [spn_pack_standing|E], и твоему альфе это не понравится."
 spn_leave_pack_decision_tooltip:0 "Покинуть свою стаю ([spn_pack|E])."
 spn_leave_pack_decision_confirm:0 "Уйти"
 spn_disband_pack_decision:0 "Распустить стаю"
 spn_disband_pack_decision_desc:0 "Отпустить каждого волка своей стаи своей дорогой. Ни один волк от этого ничего не теряет."
 spn_disband_pack_decision_tooltip:0 "Распустить свою [spn_pack|E]."
 spn_disband_pack_decision_confirm:0 "Распустить её"
 spn_abandon_hide_warning_tt:0 "Шкура отпускает тебя. Шкурка остаётся у тебя, но ты больше не её [spn_champion|E]."
 spn_stand_over_them_interaction:0 "Встать над ними"
 spn_stand_over_them_interaction_desc:0 "Серебряная Спина охраняет тех, кто на попечении её чемпиона. Пять лет охотник, который придёт за ними, найдёт тебя в дверях."
 spn_stand_over_them_interaction_tt:0 "Если охотник придёт за [recipient.GetShortUIName] в течение следующих пяти лет, [recipient.GetSheHe] сможет позвать тебя сразиться вместо [recipient.GetHerHis]."
 spn_read_them_interaction:0 "Читать их"
 spn_read_them_interaction_desc:0 "Тундра читает лицо, как учёный читает страницу. Узнать одну вещь, которую они скрывают."
 spn_read_them_nothing_tt:0 "Больше искать нечего"
 spn_ask_to_unbind_interaction:0 "Попросить снять шкуру"
 spn_ask_to_unbind_interaction_desc:0 "Попросить великого магуса вынуть дух шкуры из тебя. Это будет больно и будет стоить 150 золота."
 spn_ask_to_unbind_interaction_notification:0 "[actor.GetShortUIName|U] просит тебя снять дух шкуры с [actor.GetHerHim]."
 spn_ask_to_unbind_gold_tt:0 "У тебя есть 150 золота"
 spn_ask_to_unbind_power_tt:0 "У магуса есть на это силы"
 spn_invite_to_pack_interaction:0 "Пригласить в стаю"
 spn_invite_to_pack_interaction_desc:0 "Пригласить этого волка бегать с твоей стаей ([spn_pack|E])."
 spn_invite_to_pack_interaction_notification:0 "[actor.GetShortUIName|U] приглашает тебя бегать с [actor.GetHerHis] стаей."
 spn_challenge_interaction:0 "Испытание"
 spn_challenge_interaction_desc:0 "Уладить это по-старому: драка между волками, без мечей. Проигравший получает раны и теряет [spn_pack_standing|E]. Победи своего альфу — и стая твоя."
 spn_challenge_interaction_notification:0 "[actor.GetShortUIName|U] вызывает тебя на Испытание.[actor.Custom2('spn_ChallengeWhy', recipient)]"
 spn_challenge_too_hurt_tt:0 "Ты не тяжело ранен(а)"
 spn_challenge_target_too_hurt_tt:0 "[recipient.GetShortUIName|U] не тяжело ранен(а)"
 spn_challenge_decline_summary:0 "Отказ стоит 10 [spn_pack_standing|E]."
 spn_moment_passed_tt:0 "Момент упущен. Ничего не происходит."
 spn_challenge_second_first_tt:0 "Ты [spn_second|E], или Второй проиграл альфе за последние два года"
 spn_challenge_alpha_standing_tt:0 "Твой [spn_pack_standing|E] не меньше 50"
 spn_ask_to_run_with_interaction:0 "Попросить принять в стаю"
 spn_ask_to_run_with_interaction_desc:0 "Попросить этого альфу принять тебя в [recipient.GetHerHis] стаю ([spn_pack|E]). Ты покидаешь свою."
 spn_ask_to_run_with_interaction_notification:0 "[actor.GetShortUIName|U] просит принять его в твою стаю."
 spn_lure_away_interaction:0 "Переманить"
 spn_lure_away_interaction_desc:0 "Пригласить одного из волков чужой стаи бегать с твоей вместо неё. Его альфа этого не простит."
 spn_lure_away_interaction_notification:0 "[actor.GetShortUIName|U] предлагает тебе покинуть свою стаю и бегать с [actor.GetHerHis]."
 spn_pack_full_tt:0 "В стае есть место"
 spn_invite_recently_tt:0 "Ты не приглашал(а) этого волка последние два года"
 spn_ai_pack_standing:0 "Вес среди волков"
 spn_ai_pack_kin:0 "Родня или кровные"
 spn_ai_pack_friend_inside:0 "Друг или возлюбленный в стае"
 spn_ai_pack_champion_alpha:0 "Альфа — чемпион"
 spn_ai_pack_tundra:0 "Чемпион Тундры просит"
 spn_ai_pack_wary:0 "Осторожен(на) с другими"
 spn_ai_pack_champion_asker:0 "Просит чемпион"
 spn_ai_pack_small:0 "Малой стае нужны волки"
 spn_ai_challenge_bold:0 "Смел(а)"
 spn_ai_challenge_craven:0 "Труслив(а)"
 spn_ai_challenge_rival:0 "Соперник"
 spn_ai_challenge_champion:0 "Чемпион одной из шкур"
 spn_ai_challenge_outmatched:0 "Не по силам"
 spn_ai_lure_own_alpha:0 "Что они думают о своём альфе"
 spn_ai_lure_fickle:0 "Непостоянен(на)"
 spn_ai_lure_ambitious:0 "Честолюбив(а)"
 spn_ai_lure_loyal:0 "Предан(а)"
 spn_ai_greedy:0 "Жаден(на)"
 spn_ai_hunter:0 "Охотник"
 spn_unification_too_many_tt:0 "Вместе ваши стаи будут не больше 25 волков"
 spn_unification_no_elder_tt:0 "Здесь есть третий волк, чтобы встать старшим"
 spn_hide_chosen_memory:0 "избран(а) шкурой"
 spn_hide_left_me_memory:0 "шкура отпустила"
 spn_hide_trophy_memory:0 "сохранил(а) шкуру"
 spn_clash_lean_strong_tt:0 "Бой клонится в сторону [spn_clash_a.GetShortUIName]."
 spn_clash_lean_even_tt:0 "Они равны по силе."
 spn_clash_lean_weak_tt:0 "Бой клонится в сторону [spn_clash_b.GetShortUIName]."
 rule_spn_hides_rule:0 "Сверхъестественное: Шесть шкур"
 setting_spn_hides_off:0 "Выкл."
 setting_spn_hides_off_desc:0 "Ни одна шкура никогда не создаётся."
 setting_spn_hides_lost:0 "Потеряны"
 setting_spn_hides_lost_desc:0 "С началом игры все шесть шкур потеряны. Каждая пробуждается в свой срок и отправляется искать волка."
 setting_spn_hides_scattered:0 "По умолчанию (разрознены)"
 setting_spn_hides_scattered_desc:0 "Альфа потеряна. Одну шкуру носит оборотень, который ей подходит, если такой есть; остальные хранятся в святилищах как святые реликвии."
 setting_spn_hides_awakened:0 "Пробуждены"
 setting_spn_hides_awakened_desc:0 "Каждая шкура, кроме Альфы, начинает на оборотне, который ей подходит."
 rule_spn_packs_rule:0 "Сверхъестественное: Стаи"
 setting_spn_packs_on:0 "По умолчанию (вкл.)"
 setting_spn_packs_on_desc:0 "Волки могут основывать стаи и вступать в них, поднимать вес в стае и враждовать между стаями."
 setting_spn_packs_off:0 "Выкл."
 setting_spn_packs_off_desc:0 "Стай нет. Сход оборотней всё равно проходит, но с меньшим советом."
 game_concept_spn_six_hides:0 "Шесть шкур"
 game_concept_spn_six_hides_desc:0 "Шесть древних волчьих шкур, и у каждой свой дух и своя воля: Серебряная Спина, Бурелом, Тундра, Седобородый, Полночь и Альфа. Шкура выбирает своего [spn_champion|E] и входит в него. Надень одну — и она решит за считанные дни: она возьмёт волка, у которого есть одна из черт, что она ищет, и таких черт у него больше, чем тех, от которых она отворачивается, — или волка, достаточно глубоко ушедшего в кровь. Стаи зовут их Первыми шестью; верующие хранят их как реликвии; ведьмы говорят, что это шесть душ, вшитых в шкуры.\n\nШкура не делает волка. Она выбирает волка."
 game_concept_spn_champion:0 "Чемпион"
 game_concept_spn_champion_desc:0 "Волк, которого выбрала шкура. Дух шкуры — в нём: он сильнее, живёт дольше, старость не может его сломить, он слышит магию, и, принимая волчий облик, он становится волком этой шкуры. Отнять шкуру у её чемпиона могут лишь смерть, снятие магом или утрата волчьей крови.\n\nЧемпион, практикующий магию — как Магус, Истинная ведьма или рождённый с Источником, — каждый год возвращает себе силу. Магус среди них растёт ещё и в боевой магии."
 game_concept_spn_hide_bond:0 "Узы шкуры"
 game_concept_spn_hide_bond_desc:0 "Насколько глубоко дух шкуры вошёл в своего [spn_champion|E]. Он растёт понемногу с каждым годом, что шкуру носят, и быстрее — в стае ([spn_pack|E]). Он растёт и тогда, когда чемпион отвечает шкуре, побеждает охотника или сражается, и падает, когда шкуру снимают. В любом бою между существами он делает чемпиона сильнее."
 game_concept_spn_hide_strength:0 "Сила шкуры"
 game_concept_spn_hide_strength_desc:0 "Насколько [spn_champion|E] сильнее в бою между существами: сначала в полтора раза, а при самых глубоких [spn_hide_bond|E] — в два с половиной."
 game_concept_spn_leave_my_mark:0 "Оставить свой след"
 game_concept_spn_leave_my_mark_desc:0 "Как только [spn_hide_bond|E] чемпиона достигает 25, шкура забирает себе его язык, и всякий, кто наденет её после него, будет говорить на нём. Много позже шкура просит большего: если он оставит свой след, всякий, кто наденет её следующим, начнёт с половиной его [spn_hide_bond|E]."
 game_concept_spn_pack:0 "Стая"
 game_concept_spn_pack_desc:0 "Волки, что бегают вместе под началом альфы. Каждый волк в стае сильнее от её размера и получает [spn_pack_standing|E] каждый год."
 game_concept_spn_pack_standing:0 "Вес в стае"
 game_concept_spn_pack_standing_desc:0 "Место волка среди волков. Он растёт с годами в стае ([spn_pack|E]), с хорошо проведённым сходом оборотней ([werewolf_gathering|E]) и с выигранным Испытанием, а падает, когда волк покидает стаю или проигрывает либо отклоняет Испытание."
 game_concept_spn_alpha:0 "Альфа"
 game_concept_spn_alpha_desc:0 "Волк, ведущий стаю ([spn_pack|E]). Победи своего альфу в Испытании — и стая твоя."
 game_concept_spn_second:0 "Второй"
 game_concept_spn_second_desc:0 "Волк, что стоит в стае ([spn_pack|E]) выше всех после альфы. Внутри стаи только Второй может бросить вызов альфе, и только при [spn_pack_standing|E] 50. Как только альфа победит Второго, это на два года может любой волк стаи с весом 50."
 game_concept_spn_omega:0 "Омега"
 game_concept_spn_omega_desc:0 "Волк без стаи ([spn_pack|E])."
 game_concept_spn_true_alpha:0 "Истинная альфа"
 game_concept_spn_true_alpha_desc:0 "Альфа, поднявшаяся без убийства — тем, что она есть. Такое случается раз в сто лет."
 game_concept_spn_unification:0 "Объединение"
 game_concept_spn_unification_desc:0 "Древний обряд, соединяющий две стаи, чьи альфы женаты. Он работает, только если между ними нет тайн. Каждый волк в объединённой стае — [spn_evolved|E]."
 game_concept_spn_evolved:0 "Развившийся"
 game_concept_spn_evolved_desc:0 "Волк, чья стая ([spn_pack|E]) была соединена Объединением. Он сражается так, будто уже в волчьем облике, даже когда это не так."
 game_concept_spn_blood_pact:0 "Кровавый пакт"
 game_concept_spn_blood_pact_desc:0 "Клятва двух альф у общего костра. Между двумя правителями это настоящий союз."
 game_concept_spn_hide_feud:0 "Вражда из-за шкуры"
 game_concept_spn_hide_feud_desc:0 "Дурная кровь между двумя стаями из-за шкуры, что перешла от одной к другой."
 game_concept_werewolf_gathering:0 "Сход оборотней"
 game_concept_werewolf_gathering_desc:0 "Волки собираются вместе, чтобы бегать и сидеть в совете у костра. Там шкуры выбирают своих, и там же разносится молва."
 game_concept_spn_hide_silverback:0 "Серебряная Спина"
 game_concept_spn_hide_silverback_desc:0 "Старая серая волчья шкура, пахнущая дымом и кедром. Тяжелее, чем кажется. Сильнейшая из шести. Встаёт между слабыми и тем, что причинило бы им вред. Серебряная Спина ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]."
 game_concept_spn_hide_timber:0 "Бурелом"
 game_concept_spn_hide_timber_desc:0 "Бурая волчья шкура, жёсткая, пахнущая сосновой смолой. В одиночестве она кажется легче. Одиночка. В лесу, наедине с собой, она сильнее всего — и найти её трудно. Бурелом ищет чемпиона, который [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] или [GetTrait('wrathful').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('gregarious').GetName( GetNullCharacter )] или [GetTrait('trusting').GetName( GetNullCharacter )]."
 game_concept_spn_hide_tundra:0 "Тундра"
 game_concept_spn_hide_tundra_desc:0 "Белая волчья шкура, холодная на ощупь в любую погоду. Терпеливая. Её чемпионы отговариваются от того, во что другие ввязываются дракой. Тундра ищет чемпиона, который [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] или [GetTrait('patient').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('honest').GetName( GetNullCharacter )] или [GetTrait('impatient').GetName( GetNullCharacter )]."
 game_concept_spn_hide_graybeard:0 "Седобородый"
 game_concept_spn_hide_graybeard_desc:0 "Пепельно-серая волчья шкура, изрезанная старыми шрамами, которые так и не затянулись. Самый бесстрашный. Его чемпионы не отступают, и их воины тоже. Седобородый ищет чемпиона, который [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] или [GetTrait('strong').GetName( GetNullCharacter )]. Он отворачивается от всякого, кто [GetTrait('craven').GetName( GetNullCharacter )] или [GetTrait('paranoid').GetName( GetNullCharacter )]."
 game_concept_spn_hide_midnight:0 "Полночь"
 game_concept_spn_hide_midnight_desc:0 "Чёрная волчья шкура. Тёплая ещё до того, как её коснутся. Самая свирепая. Мир чувствует, каков её чемпион. Полночь ищет чемпиона, который [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] или [GetTrait('sadistic').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] или [GetTrait('compassionate').GetName( GetNullCharacter )]."
 game_concept_spn_hide_alpha:0 "Альфа"
 game_concept_spn_hide_alpha_desc:0 "Огромная рыже-бурая волчья шкура. Собаки ложатся, когда её проносят мимо. Шкура вожака, потерянная на десятилетия. Берёт только вожака — и его стая растёт быстрее. Альфа ищет чемпиона, который [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] или [GetTrait('arrogant').GetName( GetNullCharacter )]. Она отворачивается от всякого, кто [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] или [GetTrait('craven').GetName( GetNullCharacter )]."
