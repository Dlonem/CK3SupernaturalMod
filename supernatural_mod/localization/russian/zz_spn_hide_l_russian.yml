 spn_wound_incubation.9000.f:0 "Протянуть руку к шкуре."
 spn_wound_incubation.9000.f.tt:0 "Шкура вытягивает тебя. Ты становишься вервольфом, получаешь [GetTrait('strong').GetName( GetNullCharacter )], и выходишь из лихорадки настолько сильным, насколько она способна тебя сделать."
 spn_wound_incubation.0060.t:0 "Она лежит у постели"
 spn_wound_incubation.0060.desc:0 "Кто-то оставил шкуру у твоей постели. Никто не скажет, кто. Она тёплая, и когда лихорадка мучает сильнее всего, твоя рука сама ложится на неё.\n\nОна не остужает тебя. От неё жар словно начинает куда-то идти."
 spn_wound_incubation.0060.a:0 "Держать её подле себя."
 spn_wound_incubation.0060.a.tt:0 "Перемена приходит немного быстрее, а отдыхается чуть легче."
 spn_wound_incubation.0060.b:0 "Вели её унести."
 spn_the_prowl_pack_tt:0 "Ты можешь бросить Вызов любому вервольфу или гибриду, которого знаешь, — как в своей [spn_pack|E], так и за её пределами."
 spn_wolf_challenge_pack_tt:0 "Ты можешь бросить Вызов любому вервольфу или гибриду, которого знаешь, — как в своей [spn_pack|E], так и за её пределами."
 spn_pack_leader_found_tt:0 "Ты можешь основать [spn_pack|E] при 40 [spn_pack_standing|E] вместо 50."
 spn_pack_mentality_pack_tt:0 "Сила твоей стаи в числе считается для тебя в полтора раза выше."
 spn_wolf_politics_pack_tt:0 "Уход из стаи стоит вдвое меньше обычного [spn_pack_standing|E], а будучи альфой ты можешь переманивать волков из других стай."
 spn_ev4.0.title:0 "Звон"
 spn_ev4.0.desc:0 "В твоём ухе начинает звучать тонкая высокая нота и не умолкает. Больше никто в комнате её не слышит.\n\nКто-то рядом творит магию. Шкура это чует — теперь чуешь и ты."
 spn_ev4.0.ring:0 "Пойти на звон."
 spn_ev4.0.ring.tt:0 "Ты отправляешься за тем, кто его наслал, и узнаёшь, кто они. Это можно делать лишь раз в год."
 spn_ev4b.0.go:0 "Пойти за ними."
 spn_ev4b.0.go.tt:0 "Шкура против заклинателя. Никто от этого не погибнет, но кто-то пострадает."
