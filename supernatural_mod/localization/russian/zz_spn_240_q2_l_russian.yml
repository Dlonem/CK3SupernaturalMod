l_russian:
 # Supernatural 2.40 -- the Order's politics and pacing (WORK-ORDER-2.40 A2, A3, A5, A6, A7, A11, pop-ups). Package Q2.
 # The masks run the temple (A2/A3).
 spn_order_toast_rite_auto:0 "Возвышен твоим храмом"
 spn_order_toast_rite_auto_medicum:0 "Маски возвели [spn_yr_to_medicum.GetTitledFirstName] в Медикумы на Обряде капитула."
 spn_order_toast_rite_auto_magistratus:0 "Маски возвели [spn_yr_to_magistratus.GetTitledFirstName] в Магистраты на Обряде капитула."
 spn_order_toast_rite_busy:0 "Маски провели Обряд"
 spn_order_toast_rite_busy_desc:0 "Ты был занят в другом месте, поэтому маски провели Обряд капитула без тебя."
 spn_order_toast_rose_masks:0 "Маски разослали розы"
 spn_order_toast_rose_masks_desc:0 "У твоего храма были готовы имена, и маски разослали записки, не дожидаясь тебя."
 spn_order_toast_rose_auto:0 "Твой храм отправил розу"
 spn_order_toast_rose_auto_desc:0 "Маски выбрали для твоего храма [spn_sel_pick.GetTitledFirstName]. Записка уже в пути."
 spn_order_auto_temple_decision:0 "Оставить храм маскам"
 spn_order_auto_temple_decision_desc:0 "Пусть маски ведут дела твоего храма. Они рассылают розы тем, кого выбирают, и возвышают готовых на Обряде капитула, а тебе рассказывают, что сделали."
 spn_order_auto_temple_decision_tooltip:0 "Передать розы и Обряд маскам."
 spn_order_auto_temple_decision_confirm:0 "Пусть ведут"
 spn_order_auto_temple_decision_effect_tt:0 "С этого момента маски рассылают розы твоего храма и возвышают готовых, а тебе рассказывают, что сделали. Ты можешь отменить это решением «Вести храм самому»."
 # A Name for the Rose, once a year (A3).
 spn_order.0108.desc_one:0 "Маски приносят тебе имя: [spn_rose_1.GetTitledFirstName]. Они наблюдали за [spn_rose_1.GetHerHim] целый год. Они считают, что у [spn_rose_1.GetSheHe] есть то, что ищет [spn_order|E].\n\nЗаписка и роза готовы. Отправить их можешь только ты."
 spn_order.0108.desc_two:0 "Маски приносят тебе два имени: [spn_rose_1.GetTitledFirstName] и [spn_rose_2.GetTitledFirstName]. Они наблюдали за обоими целый год. Они считают, что у каждого есть то, что ищет [spn_order|E].\n\nЗаписки и розы готовы. Отправить их можешь только ты."
 spn_order.0108.desc_three:0 "Маски приносят тебе три имени: [spn_rose_1.GetTitledFirstName], [spn_rose_2.GetTitledFirstName] и [spn_rose_3.GetTitledFirstName]. Они наблюдали за всеми тремя целый год. Они считают, что у каждого есть то, что ищет [spn_order|E].\n\nЗаписки и розы готовы. Отправить их можешь только ты."
 spn_order.0108.send_one:0 "Отправить розу"
 spn_order.0108.send_all:0 "Отправить розу каждому из них"
 spn_order.0108.send_tt:0 "Орден протягивает руку. Тот, кто ответит на записку, начинает испытания."
 spn_order.0108.only:0 "Только [spn_rose_1.GetFirstName]"
 spn_order.0108.only_tt:0 "Остальных не выдвинут снова в течение года."
 spn_order.0108.none_one:0 "Не этого"
 spn_order.0108.none_one_tt:0 "[spn_rose_1.GetFirstName] не выдвинут снова в течение года."
 spn_order.0108.none_all:0 "Никого в этом году"
 spn_order.0108.none_all_tt:0 "Никого из них не выдвинут снова в течение года."
 spn_order.0108.masks:0 "Отправить их и впредь оставить храм маскам"
 spn_order.0108.masks_tt:0 "Каждое имя здесь получит свою записку. С этого момента маски рассылают розы твоего храма и возвышают готовых на Обряде капитула, не спрашивая тебя. Ты можешь отменить это решением «Вести храм самому»."
 # The Rite of the Chapter (A2).
 spn_order.0150.d.tt:0 "В этом году никого не возвышают. Готовых снова выдвинут на Обряде следующего года."
 spn_order.0150.e:0 "Впредь оставить храм маскам"
 spn_order.0150.e.tt:0 "Названные здесь возвышаются сейчас. С этого момента маски возвышают готовых и рассылают розы твоего храма, не спрашивая тебя. Ты можешь отменить это решением «Вести храм самому»."
 # Hand On Your Temple (A11).
 spn_order_step_down_decision:0 "Передать свой храм"
 spn_order_step_down_decision_desc:0 "Передай руководство своим храмом другому Магистрату. Ты сохраняешь своё [spn_order_standing|E] и место в [spn_order|E]: оставайся Магистратом храма или работай вне его вместе с [spn_order_adepti|E]."
 spn_order_step_down_decision_tooltip:0 "Сложить с себя звание [spn_temple_magus|E]."
 spn_order_step_down_decision_confirm:0 "Передать"
 spn_order_step_down_decision_effect_tt:0 "Ты выбираешь, как уйти. После тебя храм возглавит названный тобой наследник; если ты никого не назвал — старший член храма."
 spn_order_step_down_heir_tt:0 "Другой Магистрат твоего храма может его возглавить"
 spn_order_step_down_recent_tt:0 "Ты не передавал храм в последние десять лет"
 spn_order.2050.t:0 "Маска переходит"
 spn_order.2050.desc:0 "Ты достаточно долго носил маску этого храма. Пусть кто-то другой хранит ключи, читает имена на Обряде и отвечает, когда маски зовут."
 spn_order.2050.desc_next:0 "\n\nПосле тебя его возглавит [spn_sd_next.GetTitledFirstName]."
 spn_order.2050.a:0 "Остаться Магистратом храма"
 spn_order.2050.a.tt:0 "Ты слагаешь с себя звание [spn_temple_magus|E] и остаёшься Магистратом этого храма. Ты сохраняешь своё [spn_order_standing|E]."
 spn_order.2050.b:0 "Работать вне храма, с Адепти"
 spn_order.2050.b.tt:0 "Ты слагаешь с себя звание [spn_temple_magus|E] и становишься одним из [spn_order_adepti|E] — Магистратом, который работает вне храма. Ты сохраняешь своё [spn_order_standing|E]. Послушники переходят к другим наставникам, пока они есть."
 spn_order.2050.c:0 "Not yet"
 # The Conclave (A5, A6).
 spn_conclave.0001.desc_chair_passed:0 "Кресло Великого Магуса пустует, а храмы не станут ждать вечно. Храм, который должен был их созвать, передал этот зов твоему.\n\nЗаписки уходят без имён. В каждой сказано лишь где и когда."
 spn_conclave.0001.desc_prerogative_passed:0 "Прошло десять лет с тех пор, как [spn_order|E] в последний раз решал, к чему он стремится. Храм, который должен был созвать маски, передал этот зов твоему.\n\nЗаписки уходят без имён. В каждой сказано лишь где и когда."
 spn_conclave.0001.desc_prerogative_why:0 "Прошло десять лет с тех пор, как [spn_order|E] в последний раз решал, к чему он стремится. Великому Магусу негде принять храмы, поэтому зов ложится на старейший храм, у которого такое место есть.\n\nЗаписки уходят без имён. В каждой сказано лишь где и когда."
 spn_conclave.0001.b_will:0 "Not now"
 spn_conclave.0001.b_will.tt:0 "Конклав не созывается. Ты можешь созвать его решением, когда будешь готов."
 spn_conclave_need_home_tt:0 "У тебя есть земли, лагерь или поместье, где могут собраться маски"
 spn_conclave_toast_passed:0 "Зов переходит дальше"
 spn_conclave_toast_passed_desc:0 "Ты был занят в другом месте, поэтому маски попросили другой храм созвать Конклав."
 spn_conclave_toast_passed_none_desc:0 "Ты был занят в другом месте, а ни один другой храм сейчас не может созвать Конклав, поэтому он не созывается."
 # Invite into the Order, on one who is already a member (A7).
 spn_order_toast_invite_member:0 "Уже один из нас"
 spn_order_toast_invite_member_desc:0 "Твоя записка к [recipient.GetTitledFirstName] вернулась с засушенной в ней голубой розой. [recipient.GetSheHe|U] уже состоит в [spn_order|E] и теперь знает, что ты тоже."

 # Boot 2 (item c): the story focus in the Situations window (gui/window_situation_list.gui)
 SPN_STORY_FOCUS_ORDER:0 "Показан только твой капитул Ордена."
 SPN_STORY_FOCUS_PACK:0 "Показана только твоя стая."
 SPN_STORY_FOCUS_COVEN:0 "Показан только твой ковен."
 SPN_STORY_FOCUS_SHOW_ALL:0 "Показать все ситуации"

 # Boot 2 (item e): Ask to Join Their Temple, and The Temples of the Order
 spn_order_ask_join_temple_interaction:0 "Попросить принять в их храм"
 spn_order_ask_join_temple_interaction_desc:0 "Попроси [recipient.GetTitledFirstName], Храмового Магуса другого храма [spn_order|E], принять тебя в [recipient.GetHerHis] храм. Ты сохраняешь свой ранг, своё [spn_order_standing|E] и переданные тобой реликвии, которые уйдут с тобой в новый Реликварий. Послушнику там дадут нового наставника."
 spn_order_ask_join_temple_interaction_tt:0 "Ты покидаешь свой храм и вступаешь в храм [recipient.GetTitledFirstName] в своём нынешнем ранге. Всё, что ты брал у Ордена, возвращается к хранителю. Ты не сможешь снова сменить храм в течение пяти лет."
 spn_order_join_temple_head_tt:0 "Ты возглавляешь собственный храм. Сначала передай его (решение «Передать свой храм»)"
 spn_order_join_temple_moved_tt:0 "Ты менял храм меньше пяти лет назад"
 spn_order_join_temple_free_tt:0 "Ты не в заключении"
 spn_ai_accept_join_magistratus:0 "Магистрат послужил бы моему храму"
 spn_ai_accept_join_medicum:0 "Медикум учил бы в моём храме"
 spn_ai_accept_join_mage:0 "Маг"
 spn_ai_accept_join_far:0 "Далеко от своего храма"
 spn_ai_accept_join_standing:0 "На хорошем счету в Ордене"
 spn_ai_accept_join_gregarious:0 "Общительный"
 spn_ai_accept_join_ambitious:0 "Хочет храм побольше"
 spn_ai_accept_join_paranoid:0 "Не доверяет члену другого храма"
 spn_ai_accept_join_arrogant:0 "Высокомерный"
 spn_ai_accept_join_friend_head:0 "Не отнимет члена у друга"
 spn_ai_accept_join_rival:0 "Соперник"
 spn_order_joined_my_temple_opinion:0 "Вступил в мой храм"
 spn_order_left_my_temple_opinion:0 "Покинул мой храм"
 spn_order_toast_left_temple:0 "Член покинул твой храм"
 spn_order_toast_left_temple_desc:0 "[spn_jt_who.GetTitledFirstName] попросил принять его в храм [spn_jt_head.GetTitledFirstName], и его приняли."
 spn_order_temples_decision:0 "Сменить храм"
 spn_order_temples_decision_desc:0 "Перейти в другой храм [spn_order|E]. Здесь перечислены ближайшие к тебе храмы, где есть место, и Храмовый Магус, возглавляющий каждый из них. Напиши одному и попроси принять тебя; если он согласится, ты покинешь свой храм ради его. Ты сохраняешь свой ранг, своё [spn_order_standing|E] и переданные тобой реликвии. Пользуйся этим, когда твой храм слишком далеко, чтобы участвовать в его делах, или когда ты предпочёл бы служить под другим Храмовым Магусом.\n\nРанги, начиная с низшего: Неофит (ещё не принёсший клятву), Послушник, Медикум, Магистрат, а затем Храмовый Магус, который возглавляет храм. Адепт — это Магистрат, который работает вне своего храма на Адептуса Майора [spn_gnostic_council|E]."
 spn_order_temples_decision_tooltip:0 "Перейти в другой храм Ордена: посмотреть ближайшие храмы, где есть место, и попросить один из них принять тебя."
 spn_order_temples_decision_effect_tt:0 "Ты видишь ближайшие храмы, где есть для тебя место, и можешь написать одному из них с просьбой о вступлении."
 spn_order_temples_decision_confirm:0 "Найти другой храм"
 spn_order.2051.t:0 "Сменить храм"
 spn_order.2051.desc:0 "Ты мог бы покинуть свой храм ради другого. Храмы Ордена поддерживают связь письмами, и каждый присягнувший член знает, где они собираются и кто их ведёт. Вот ближайшие, где есть место ещё для одного. Напиши одному, и его Храмовый Магус ответит. Если он примет тебя, ты перейдёшь в его храм в своём нынешнем ранге."
 spn_order.2051.desc_none:0 "Ты мог бы покинуть свой храм ради другого. Храмы Ордена поддерживают связь письмами, и каждый присягнувший член знает, где они собираются и кто их ведёт. Но сейчас ни в одном другом храме нет места ещё для одного, так что пока ты остаёшься там, где есть."
 spn_order.2051.desc_head:0 "\n\nТы сам возглавляешь храм. Чтобы вступить в другой, сначала нужно передать свой."
 spn_order.2051.desc_moved:0 "\n\nТы недавно менял храм. Орден не переведёт тебя снова так скоро."
 spn_order.2051.a:0 "Написать [spn_tj_1.GetTitledFirstName]"
 spn_order.2051.b:0 "Написать [spn_tj_2.GetTitledFirstName]"
 spn_order.2051.c:0 "Написать [spn_tj_3.GetTitledFirstName]"
 spn_order.2051.d:0 "Написать [spn_tj_4.GetTitledFirstName]"
 spn_order.2051.e:0 "Я останусь в своём храме."
 spn_order.2051.write_tt:0 "Открывает «Попросить принять в их храм» для этого Храмового Магуса, где видно, может ли храм тебя принять."
 # Boot 3: The Relic That Would Not Sleep (spn_order.0161), its outcomes, and What the Relic Wanted / The Hum Stops
 spn_order.0161.desc_named:0 "Одна из вещей в [spn_reliquary|E] храма, [spn_hum_relic.GetName], начала гудеть по ночам. Послушники к ней не подходят."
 spn_order.0161.desc_keeper:0 "Одна из вещей в [spn_reliquary|E] храма, [spn_hum_relic.GetName], начала гудеть по ночам. Послушники к ней не подходят, а [spn_hum_keeper.GetTitledFirstName], который хранит её для храма, просит кого-нибудь знающего."
 spn_order.0161.a.tt:0 "Ты заставляешь её умолкнуть собственной силой. Послушники видят, как это делает Маг: ты получаешь 5 [spn_order_standing|E]."
 spn_order.0161.listen_tt:0 "Ты сидишь с ней всю ночь и слушаешь, и она затихает. Послушники видят, кто её успокоил: ты получаешь 5 [spn_order_standing|E]. Через несколько дней ты понимаешь, чего она хотела."
 spn_order.0161.b.tt:0 "Ты оставляешь её в покое. Через несколько недель ты узнаешь, чем всё кончилось: она может затихнуть сама, или другой член твоего храма успокоит её и получит [spn_order_standing|E] вместо тебя."
 spn_order.0161.a.toast:0 "В реликварии тихо"
 spn_order.0161.a.toast_desc:0 "Реликвия перестала гудеть, и твой храм видел, кто её остановил. Ты получил 5 [spn_order_standing|E]."
 spn_order.2052.t:0 "Чего хотела реликвия"
 spn_order.2052.desc:0 "Ты сидел с реликвией, пока она не затихла, и теперь понимаешь, чего она хотела. Её сделали, чтобы носить и использовать, а не запирать во тьме, и она звала руку. То, что она показала тебе, пока гудела, остаётся с тобой."
 spn_order.2052.desc_keeper:0 "Ты сидел с [spn_hum_relic.GetName], пока она не затихла, и теперь понимаешь, чего она хотела. Её сделали, чтобы носить и использовать, а не запирать во тьме, и она звала руку. [spn_hum_keeper.GetTitledFirstName] хранит её для храма. То, что она показала тебе, пока гудела, остаётся с тобой."
 spn_order.2052.desc_mine:0 "Ты сидел с [spn_hum_relic.GetName], пока она не затихла, и теперь понимаешь, чего она хотела. Это та самая, что ты передал храму, и она хочет, чтобы её носили и использовали, а не запирали во тьме. То, что она показала тебе, пока гудела, остаётся с тобой."
 spn_order.2052.a:0 "Попросить [spn_hum_keeper.GetFirstName] одолжить её мне"
 spn_order.2052.a.tt:0 "Открывает «Попросить на время» для [spn_hum_keeper.GetFirstName], где видно, можешь ли ты взять её сейчас."
 spn_order.2052.b:0 "Я запомню, что она мне показала."
 spn_order.2053.t:0 "Реликвия снова затихла"
 spn_order.2053.desc_quiet:0 "Через несколько недель после того, как ты оставил гудящую реликвию в покое, она смолкла так же внезапно, как начала. Никто ничего не делал, и, похоже, ничего из этого не вышло."
 spn_order.2053.desc_other:0 "Ты оставил гудящую реликвию в покое, а [spn_hum_other.GetTitledFirstName] — нет. [spn_hum_other.GetSheHe|U] три ночи просидел с ней, пока она не затихла, и весь храм знает, кто это сделал."
 spn_order.2053.a:0 "Молодец [spn_hum_other.GetHerHim]."
 spn_order.2053.a.tt:0 "[spn_hum_other.GetTitledFirstName] получает 5 [spn_order_standing|E]."
 spn_order.2053.b:0 "So it did."
 spn_order.2053.b.tt:0 "Ничего не меняется."
