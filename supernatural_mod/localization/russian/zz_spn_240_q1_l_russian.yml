l_russian:
 # Supernatural 2.40 -- package Q1: relics and the Reliquary (WORK-ORDER-2.40 G7, B1, B2, G9, B9, B12, G5).

 # The pick lists (G7, B1, B2): every refusal in words.
 spn_relic_pick_magic_tt:0 "Это магический предмет"
 spn_relic_pick_not_hide_tt:0 "Это не волчья шкура. Шкура подчиняется своему чемпиону, а не храму"
 spn_relic_pick_not_vade_tt:0 "Это не часть [spn_vade_maecum|E]. Орден не станет хранить книгу в [spn_reliquary|E]"
 spn_relic_pick_not_seal_tt:0 "Это не Печать Соломона"
 spn_relic_pick_not_pledged_tt:0 "Это ещё не передано в залог"
 spn_relic_pick_is_pledged_tt:0 "Это передано в [spn_reliquary|E]"
 spn_relic_pick_pledged_tt:0 "Это передано в [spn_reliquary|E]"
 spn_relic_pick_pledged_here_tt:0 "Это передано в [spn_reliquary|E] храма [recipient.GetFirstNamePossessive]"
 spn_relic_pick_not_lent_tt:0 "Это не выдано на время"
 spn_relic_pick_rested_tt:0 "Это не выдавали на время последние три года"
 spn_relic_pick_not_powder_tt:0 "Порошок Сокрытия никогда не выдают на время"
 spn_relic_pick_not_fors_tt:0 "Форс Факторум никогда не выдают на время"
 spn_relic_pick_beetle_rank_tt:0 "Только Магистрат или Храмовый Магус может взять Жука-гомункула"
 spn_relic_take_back_nothing_tt:0 "У тебя есть переданный тобой предмет, который можно забрать обратно: не выданный на время и не Форс Факторум, который остаётся в своём храме"
 spn_relic_pick_fors_stays_tt:0 "Форс Факторум остаётся в [spn_reliquary|E] своего храма"
 spn_relic_pledge_nothing_tt:0 "У тебя есть то, что может принять [spn_reliquary|E]"
 spn_relic_borrow_nothing_tt:0 "У [recipient.GetTitledFirstName] есть переданное в [spn_reliquary|E], что можно сейчас выдать тебе"
 spn_relic_borrow_rank_tt:0 "Брать из [spn_reliquary|E] может только Медикум или выше"

 # Take the Beetle into Custody (G7, B2).
 spn_relic_beetle_custody_interaction:0 "Взять Жука под охрану"
 spn_relic_beetle_custody_interaction_desc:0 "Взять Жука-гомункула на собственное хранение. Он остаётся переданным в [spn_reliquary|E] твоего храма."
 spn_relic_beetle_custody_interaction_tt:0 "Жук-гомункул переходит к тебе, по-прежнему числясь за твоим храмом."
 spn_relic_custody_pledged_tt:0 "[recipient.GetFirstName] хранит его как переданного в [spn_reliquary|E] твоего храма, и он не выдан на время"
 spn_relic_toast_beetle_custody:0 "Твой Храмовый Магус забрал Жука"

 # The Powder (B9, G11).
 spn_relic_minor_ps_tt:0 "У тебя есть немного лишней силы"
 spn_relic_toast_powder_spent:0 "Твой Порошок израсходован"
 spn_relic_toast_powder_thrown:0 "Порошок сделал своё дело"
 spn_relic_toast_powder_thrown_desc:0 "Твой Порошок Сокрытия рассыпался там, где ты стоял. Здешние люди уже забыли, что видели, а Порошка больше нет."

 # The Beetle on loan (G7).
 spn_beetle_toast_loan_loosed:0 "Одолженный Жук на свободе"
 spn_beetle_toast_loan_loosed_desc:0 "[spn_bs_user.GetTitledFirstName] взял Жука-гомункула из [spn_reliquary|E] и пустил его в ход."

 # The relic seed (G9).
 spn_order_toast_reliquary_seeded:0 "В реликварии твоего храма появились первые реликвии"

 # Relic eleven (B12, G5).
 spn_relic_fors_name:0 "Форс Факторум"
 spn_relic_fors_desc:0 "Письмо, запечатанное голубым воском, написанное рукой основателей Ордена. В нём изложено действие Форс Факторум: несколько лет твои заклинания не стоят тебе силы, а затем заклинание берёт свою цену с твоего тела. Орден хранит его в [spn_reliquary|E] и мало кому даёт прочесть."
 spn_relic_fors_modifier:0 "Форс Факторум"
 spn_relic_fors_modifier_desc:0 "Хранитель письма основателей перечитывает его снова и снова."

 # The relic count (G9, debug only).
 spn_relic.2090.t:0 "Реликвии мира"
 spn_relic.2090.desc:0 "Реликвии в мире сейчас:\nПерчатка [GetGlobalVariable( 'spn_relic_n_glove' ).GetValue|0], Некрофон [GetGlobalVariable( 'spn_relic_n_necrophone' ).GetValue|0], Клинок [GetGlobalVariable( 'spn_relic_n_blade' ).GetValue|0], Подвеска [GetGlobalVariable( 'spn_relic_n_pendant' ).GetValue|0], Зеркало [GetGlobalVariable( 'spn_relic_n_mirror' ).GetValue|0], Колокол [GetGlobalVariable( 'spn_relic_n_bell' ).GetValue|0], Цепи [GetGlobalVariable( 'spn_relic_n_chains' ).GetValue|0]\nПорошок [GetGlobalVariable( 'spn_relic_n_powder' ).GetValue|0], Печать [GetGlobalVariable( 'spn_relic_n_seal' ).GetValue|0], Жук [GetGlobalVariable( 'spn_relic_n_beetle' ).GetValue|0], Форс Факторум [GetGlobalVariable( 'spn_relic_n_fors' ).GetValue|0]\nПередано в Реликварии: [GetGlobalVariable( 'spn_relic_n_pledged' ).GetValue|0]"
 spn_relic.2090.a:0 "Пересобрать все списки Реликвариев и выдать реликвии каждому пустому храму, который их ещё не получил"
 spn_relic_debug_count_log:0 "Счётчик сверхъестественных реликвий: перчатка [GetGlobalVariable( 'spn_relic_n_glove' ).GetValue|0], некрофон [GetGlobalVariable( 'spn_relic_n_necrophone' ).GetValue|0], клинок [GetGlobalVariable( 'spn_relic_n_blade' ).GetValue|0], подвеска [GetGlobalVariable( 'spn_relic_n_pendant' ).GetValue|0], зеркало [GetGlobalVariable( 'spn_relic_n_mirror' ).GetValue|0], колокол [GetGlobalVariable( 'spn_relic_n_bell' ).GetValue|0], цепи [GetGlobalVariable( 'spn_relic_n_chains' ).GetValue|0], порошок [GetGlobalVariable( 'spn_relic_n_powder' ).GetValue|0], печать [GetGlobalVariable( 'spn_relic_n_seal' ).GetValue|0], жук [GetGlobalVariable( 'spn_relic_n_beetle' ).GetValue|0], форс [GetGlobalVariable( 'spn_relic_n_fors' ).GetValue|0], передано [GetGlobalVariable( 'spn_relic_n_pledged' ).GetValue|0]"
