l_russian:
 # Supernatural 2.42 -- creature moments (zz_spn_242_moment_events.txt).

 # Fates Intertwined
 spn_moment.0011.t:0 "Сплетённые судьбы: плащ"
 spn_moment.0011.desc:0 "[spn_mo_forever.GetFirstName] сидит у окна с иглой и уже второй раз с весны распускает швы [spn_mo_forever.GetHerHis] собственной хорошей одежды. За спиной у [spn_mo_forever.GetHerHim] на крючке висит мой плащ, тот самый, что я носил в ту зиму, когда мы встретились.\n\n«Тебе он всё ещё впору», — говорит [spn_mo_forever.GetSheHe] и откусывает нитку. [spn_mo_forever.GetSheHe|U] не поднимает глаз. [spn_mo_forever.GetSheHe|U] и не нужно. Я слышу, как то, о чём [spn_mo_forever.GetSheHe] не спросил, сидит в комнате вместе с нами, терпеливое, как кошка."
 spn_moment.0011.desc_knows:0 "[spn_mo_forever.GetFirstName] сидит у окна с иглой и уже второй раз с весны распускает швы [spn_mo_forever.GetHerHis] собственной хорошей одежды. За спиной у [spn_mo_forever.GetHerHim] на крючке висит мой плащ, тот самый, что я носил в ту зиму, когда мы встретились.\n\n[spn_mo_forever.GetSheHe|U] знает, кто я. [spn_mo_forever.GetSheHe|U] знает это много лет и ни разу ничего не попросил. «Тебе он всё ещё впору», — говорит [spn_mo_forever.GetSheHe] сегодня, и на этот раз [spn_mo_forever.GetSheHe] поднимает глаза и не отводит взгляда."
 spn_moment.0011.a:0 "Отложи иглу. Спроси меня."
 spn_moment.0011.b:0 "Иди сюда. Посмотри, что ещё не изменилось."
 spn_moment.0011.c:0 "Я смеюсь. Ты просто хорошо выбрал."
 spn_moment.0011.d:0 "Я молчу."
 spn_moment.0011.e:0 "Посмотри на меня. Ты никогда не задавался вопросом."
 spn_moment.0011.e.tt:0 "[spn_mo_forever.GetShortUIName] больше не будет об этом думать, и между вами это не всплывёт"

 spn_moment.0012.t:0 "Сплетённые судьбы: что было сосчитано"
 spn_moment.0012.desc:0 "«Сегодня утром — седой волос, — говорит [spn_mo_forever.GetFirstName]. Свеча почти догорела, а [spn_mo_forever.GetSheHe] и не думает зажечь другую. — Вчера ночью я считал(а) годы. Наши. Ты не спал, пока я считал(а). Ты никогда не спишь».\n\n[spn_mo_forever.GetSheHe|U] берёт мою руку и переворачивает её, будто ответ может быть написан на ладони. Это та же рука, которую [spn_mo_forever.GetSheHe] взял в первую ночь. В этом-то и беда."
 spn_moment.0012.a:0 "Правду, всю целиком."
 spn_moment.0012.b:0 "Слова тут не помогут. Я показываю [spn_mo_forever.GetHerHim]."
 spn_moment.0012.c:0 "В моей семье годы носят легко."
 spn_moment.0012.d:0 "Я обнимаю [spn_mo_forever.GetHerHim] и молчу."
 spn_moment.0012.e:0 "Это не дар. Не проси меня о нём."
 spn_moment.0012.told.tt:0 "[spn_mo_forever.GetShortUIName] узнаёт, кто ты такой"

 spn_moment.0013.t:0 "Сплетённые судьбы: перед рассветом"
 spn_moment.0013.desc_wants:0 "У [spn_mo_forever.GetFirstName] было время подумать, и ни минуты из него не ушло на то, чтобы изменить [spn_mo_forever.GetHerHis] решение. [spn_mo_forever.GetSheHe|U] подходит ко мне, вынимая шпильки из [spn_mo_forever.GetHerHis] волос.\n\n«Хватит с меня могил, у которых я стою, — говорит [spn_mo_forever.GetSheHe]. — Я не собираюсь заставлять тебя хоронить меня. Я хочу каждый год, что у тебя есть. Хочу быть рядом, когда они тебе надоедят». [spn_mo_forever.GetHerHis|U] пульс частит у меня под пальцем, и это не страх."
 spn_moment.0013.desc_afraid:0 "[spn_mo_forever.GetFirstName] стоит так близко, что можно коснуться, но не касается. «Я этого хочу, — говорит [spn_mo_forever.GetSheHe]. — Лежу без сна и хочу. А потом думаю о тьме и о том, что пришлось бы делать, чтобы остаться в ней, и не могу дышать».\n\n[spn_mo_forever.GetSheHe|U] смеётся над [spn_mo_forever.GetHerselfHimself], неловко. «Скажи, что я трус. Так было бы легче»."
 spn_moment.0013.desc_time:0 "«Не в этом году», — говорит [spn_mo_forever.GetFirstName], прежде чем я успеваю спросить. [spn_mo_forever.GetSheHe|U] явно это отрепетировал. «Есть дела, которые я хочу закончить тем, кто я есть. Люди, которым нужно, чтобы я ещё немного побыл обычным».\n\n[spn_mo_forever.GetSheHe|U] легко целует меня в уголок губ, как запечатывают письмо. «Но никуда не уходи. Я не говорю „нет“»."
 spn_moment.0013.desc_none:0 "«Я знаю, что ты хочешь мне предложить, — говорит [spn_mo_forever.GetFirstName], — и люблю тебя за то, что ты этого хочешь. Ответ — нет».\n\n[spn_mo_forever.GetSheHe|U] говорит это мягко и без малейшего сомнения. «Я хочу состариться. Хочу, чтобы ты смотрел, как я старею, и всё равно любил меня. Это всё, о чём я тебя прошу»."
 spn_moment.0013.a:0 "Тогда останься. На каждую ночь, что есть."
 spn_moment.0013.b:0 "Запри дверь. Хватит с меня осторожности."
 spn_moment.0013.c:0 "Не сейчас. Но выпей немного меня."
 spn_moment.0013.d:0 "Посиди со мной. Я расскажу, каково это."
 spn_moment.0013.e:0 "Через сто лет ты скажешь мне спасибо."
 spn_moment.0013.f:0 "Тогда старей. Я буду рядом."
 spn_moment.0013.g:0 "[spn_mo_forever.GetSheHe|U] ничего из этого не вспомнит."
 spn_moment.0013.turn.tt:0 "[spn_mo_forever.GetShortUIName] получает твою кровь и обращается. Обращённый тобой любовник или родственная душа может оказаться связан с тобой Узами создателя."
 spn_moment.0013.blood.tt:0 "[spn_mo_forever.GetShortUIName] три года носит твою кровь: [spn_mo_forever.GetSheHe] исцеляется, а если [spn_mo_forever.GetSheHe] умрёт за это время, [spn_mo_forever.GetSheHe] может восстать"

 # The One Who Followed You Home
 spn_moment.0014.t:0 "Тот, кто пошёл за тобой домой"
 spn_moment.0014.desc:0 "Уже три недели. Одно и то же лицо на краю рынка, в глубине церкви, под фонарём через улицу, когда я закрывал ставни. Сегодня стук в дверь, и на пороге стоит [spn_mo_admirer.GetFirstName] с дождём в [spn_mo_admirer.GetHerHis] волосах.\n\n«Я знаю, что поздно, — говорит [spn_mo_admirer.GetSheHe]. — Знаю, что мне не следует здесь быть. Я твержу себе это каждую ночь весь этот месяц». [spn_mo_admirer.GetSheHe|U] смотрит на мои губы, когда [spn_mo_admirer.GetSheHe] это говорит, а потом намеренно — в глаза. «Больше я себе этого не твержу»."
 spn_moment.0014.a:0 "Заходи, не стой на холоде."
 spn_moment.0014.b:0 "Заходи. Никто из нас сегодня не уснёт."
 spn_moment.0014.c:0 "Ты пришёл за тем, кто я есть."
 spn_moment.0014.c.tt:0 "[spn_mo_admirer.GetShortUIName] присоединяется к твоему двору, получает твою кровь и обращается"
 spn_moment.0014.d:0 "Ты, похоже, совсем замёрз. А я ещё не ел."
 spn_moment.0014.e:0 "Кто тебя послал?"
 spn_moment.0014.e.nobody:0 "Никто [spn_mo_admirer.GetHerHim] не посылал. [spn_mo_admirer.GetSheHe|U] ушёл в слезах."
 spn_moment.0014.e.spy:0 "Охотник заплатил [spn_mo_admirer.GetHerHim], чтобы следить за твоей дверью. Ты знаешь, что они придут."
 spn_moment.0014.f:0 "Иди домой. Ты ошибся."

 # Three in the Dark
 spn_moment.0015.t:0 "Трое в темноте"
 spn_moment.0015.desc:0 "Я узнал шаги на лестнице прежде, чем открылась дверь. В проёме стоит [spn_mo_partner.GetFirstName] с лампой и смотрит на кровать, на [spn_mo_admirer.GetFirstName] в ней, а потом долго — на меня.\n\nНикто не говорит ни слова. [spn_mo_admirer.GetFirstName] натягивает простыню, а потом, передумав, отпускает её. [spn_mo_partner.GetFirstName] очень осторожно ставит лампу на стол — так [spn_mo_partner.GetSheHe] делает, когда [spn_mo_partner.GetSheHe] ещё не решил, бросить ли чем-нибудь."
 spn_moment.0015.a:0 "Никому не нужно уходить из этой комнаты."
 spn_moment.0015.a.tt:0 "[spn_mo_partner.GetShortUIName] решит сам за [spn_mo_partner.GetHerselfHimself]"
 spn_moment.0015.a.yes:0 "[spn_mo_partner.GetFirstName] закрыл за [spn_mo_partner.GetHerHim] дверь и погасил лампу. До полудня никого в доме не видели."
 spn_moment.0015.a.no:0 "[spn_mo_partner.GetFirstName] посмотрел на твою руку, как на объедок на тарелке, и вышел."
 spn_moment.0015.b:0 "Ошибка. Это всегда был ты."
 spn_moment.0015.c:0 "Не стану лгать. Я хочу вас обоих."
 spn_moment.0015.d:0 "Я отправляю обоих спать. Порознь."

 # The Portrait
 spn_moment.0016.t:0 "Портрет"
 spn_moment.0016.desc:0 "Художник пришёл насчёт заказа и стоит в зале со шляпой в руках, переводя взгляд с меня на стену и обратно.\n\nТам висит портрет моего деда. Так всегда говорили домашним. Старый управляющий, который вытирал пыль с рамы ещё до рождения художника, откашливается. «Сильное фамильное сходство, — говорит он в пустоту. — Все всегда замечали. Даже шрам тот же. На той же руке»."
 spn_moment.0016.a:0 "Пиши меня таким, какой я есть. Пусть гадают."
 spn_moment.0016.b:0 "Никакого портрета. Сожгите старый."
 spn_moment.0016.c:0 "Мой дед. Прекрасное сходство."
 spn_moment.0016.d:0 "Пиши меня старше. С проседью на висках."
 spn_moment.0016.e:0 "Ты ни разу не смотрел на эту раму."

 # A Hunter at Your Table
 spn_moment.0017.t:0 "Охотник за твоим столом"
 spn_moment.0017.desc:0 "[spn_mo_hunter.GetFirstName] допивает [spn_mo_hunter.GetHerHis] третью чашу и рассказывает [spn_mo_hunter.GetHerHis] вторую историю. Эта — о твари, которую [spn_mo_hunter.GetSheHe] прикончил в подвале, и о том, как она умоляла в конце. Стол смеётся там, где положено.\n\n[spn_mo_hunter.GetSheHe|U] целый сезон ест мой хлеб. [spn_mo_hunter.GetSheHe|U] точил [spn_mo_hunter.GetHerHis] колья у моего очага. [spn_mo_hunter.GetSheHe|U] теперь тепло поднимает [spn_mo_hunter.GetHerHis] чашу за меня через мой же стол и понятия ни о чём не имеет."
 spn_moment.0017.a:0 "Я наполняю [spn_mo_hunter.GetHerHis] чашу. Расскажи ещё."
 spn_moment.0017.b:0 "Позже, наедине: расскажи о каждом убийстве."
 spn_moment.0017.b.tt:0 "Если среди них есть кто-то из твоих, ты поймёшь, что значит [spn_mo_hunter.GetHerHis] имя"
 spn_moment.0017.c:0 "Я ничего не ем и считаю двери."
 spn_moment.0017.d:0 "Я ускользаю на кухню, чтобы поесть."
 spn_moment.0017.e:0 "Приятный ужин. Для одного из нас."

 # The Morning After
 spn_moment.0018.t:0 "Наутро"
 spn_moment.0018.desc:0 "Я просыпаюсь от голосов, тихих и непринуждённых, и не сразу понимаю, чьи они. [spn_mo_partner.GetFirstName] сидит, скрестив ноги, в изножье кровати в моей рубашке и ест яблоко. [spn_mo_admirer.GetFirstName] заплетает [spn_mo_partner.GetHerHis] волосы, неумело, и над этим смеются.\n\nОни умолкают, увидев, что я проснулся. Ни один не выглядит виноватым. [spn_mo_partner.GetFirstName] протягивает мне яблоко надкусанной стороной и поднимает бровь, задавая вполне разумный вопрос: ну, и что теперь?"
 spn_moment.0018.desc_edge:0 "Я просыпаюсь в тишине, осторожной тишине. [spn_mo_partner.GetFirstName] уже одет и стоит у окна. [spn_mo_admirer.GetFirstName] всё ещё в постели рядом со мной, тёплый и неторопливый, рука закинута мне на грудь, будто всегда там и была.\n\n[spn_mo_partner.GetFirstName] оборачивается. [spn_mo_partner.GetSheHe|U] улыбается, и это настоящая улыбка, но в ней есть немного стали. «Я ни о чём не жалею, — говорит [spn_mo_partner.GetSheHe]. — Мне бы только знать, где теперь моё место, раз у кровати появилась третья сторона»."
 spn_moment.0018.a:0 "Накройте за моим столом третье место."
 spn_moment.0018.b:0 "Здесь будет порядок."
 spn_moment.0018.c:0 "Пусть сами договорятся."
 spn_moment.0018.d:0 "Одна хорошая ночь. Не привычка."

 # The Household It Becomes
 spn_moment.0019.t:0 "Дом, которым это становится"
 spn_moment.0019.desc:0 "Прошли годы, и дом держится на нас троих, как часы на своих гирях. Теперь они заканчивают ссоры друг за друга. Сегодня они приходят ко мне вместе, чего давно не делали, и закрывают дверь; [spn_mo_admirer.GetFirstName] садится на подлокотник моего кресла, а [spn_mo_partner.GetFirstName] стоит передо мной, сложив [spn_mo_partner.GetHerHis] руки, как проситель.\n\n«Мы поговорили, — говорит [spn_mo_partner.GetSheHe]. — Несколько месяцев, так что не думай, что это прихоть. [spn_mo_admirer.GetFirstName] хочет стать тем, кто ты есть. Быть рядом с тобой во всём этом, до конца». Пальцы [spn_mo_admirer.GetFirstNamePossessive|U] находят мой затылок. «А я хочу остаться таким, какой я есть, — говорит [spn_mo_partner.GetFirstName]. — Кто-то в этом доме должен видеть солнце. Кто-то должен состариться и всё равно быть любимым. Я бы хотел(а), чтобы это был(а) я»."
 spn_moment.0019.a:0 "Как вы договорились. Один для ночи, другой для дня."
 spn_moment.0019.a.tt:0 "[spn_mo_admirer.GetShortUIName] получает твою кровь и обращается. [spn_mo_partner.GetShortUIName] остаётся смертным, как [spn_mo_partner.GetSheHe] и просил."
 spn_moment.0019.b:0 "Вас обоих. Сегодня."
 spn_moment.0019.b.tt:0 "Оба получают твою кровь и обращаются. [spn_mo_partner.GetShortUIName] просил остаться таким, какой [spn_mo_partner.GetSheHe] есть."
 spn_moment.0019.c:0 "Сначала я выслушаю каждого из вас наедине."
 spn_moment.0019.c.tt:0 "Ты поговоришь с [spn_mo_partner.GetShortUIName] наедине и услышишь, чего [spn_mo_partner.GetSheHe] на самом деле хочет"
 spn_moment.0019.d:0 "Нам хорошо и так."

 # A Guest for Supper
 spn_moment.0020.t:0 "Гость к ужину"
 spn_moment.0020.desc:0 "На столе третья чаша и вино, которого я не заказывал, а у [spn_mo_partner.GetFirstName] тот самый вид, какой бывает у [spn_mo_partner.GetSheHe], когда [spn_mo_partner.GetSheHe] сделал что-то, чем [spn_mo_partner.GetSheHe] весьма доволен.\n\n«Это [spn_mo_guest.GetFirstName], — говорит [spn_mo_partner.GetSheHe]. — Мы встретились на рынке. Мы говорили о тебе». Незнакомец смотрит мне в глаза безо всякого смущения, а [spn_mo_partner.GetFirstName] обходит стол, просовывает руку мне за ворот и приближает [spn_mo_partner.GetHerHis] губы к моему уху. «Я знаю, на что ты смотришь, — очень тихо говорит [spn_mo_partner.GetSheHe]. — Я подумал(а), что хоть раз тебе можно это получить. Если хочешь. Только если хочешь»."
 spn_moment.0020.a:0 "Закрой дверь. Оставь одну свечу."
 spn_moment.0020.b:0 "Медленно. У нас вся ночь."
 spn_moment.0020.c:0 "Отправь своего друга домой. Я хочу только тебя."
 spn_moment.0020.suspect:0 "И давно вы двое устраиваете это за моей спиной?"
 spn_moment.0020.e:0 "Это не я."

 # The Door She Closed
 spn_moment.0021.t:0 "Дверь, которую закрыли"
 spn_moment.0021.desc:0 "[spn_mo_partner.GetFirstName] не кричал. Крик я бы вынес. [spn_mo_partner.GetSheHe|U] вежлив за столом и отсутствует везде остальное время, а дверь [spn_mo_partner.GetHerHis] комнаты закрыта для меня уже месяц.\n\nСегодня под ней полоска света. Я стою в коридоре, как мальчишка, зная, что [spn_mo_partner.GetSheHe] слышит моё дыхание, зная, что [spn_mo_partner.GetSheHe] решает по ту сторону двух дюймов дуба, чего я теперь стою для [spn_mo_partner.GetHerHim]."
 spn_moment.0021.a:0 "Я стучу, пока [spn_mo_partner.GetSheHe] не откроет."
 spn_moment.0021.b:0 "Я пишу [spn_mo_partner.GetHerHim], прямо и просто."
 spn_moment.0021.c:0 "Я не стану умолять."
 spn_moment.0021.d:0 "Посмотри на меня. Той ночи не было."
 spn_moment.0021.d.tt:0 "[spn_mo_partner.GetShortUIName] забывает, что [spn_mo_partner.GetSheHe] видел"

 # What Your Spouse Knows
 spn_moment.0022.t:0 "Что знает твой супруг"
 spn_moment.0022.desc:0 "[spn_mo_wife.GetFirstName] дожидается, пока уйдут слуги, а затем ставит [spn_mo_wife.GetHerHis] чашку точно в середину блюдца.\n\n«[spn_mo_other.GetFirstName]», — говорит [spn_mo_wife.GetSheHe]. Только имя. [spn_mo_wife.GetSheHe|U] оставляет его лежать на столе между нами. «Меня не проведёшь, и святости я от тебя никогда не требовал(а). Я просто хотел(а) бы услышать это от тебя, прежде чем снова услышу от прачки»."
 spn_moment.0022.desc_lustful:0 "[spn_mo_wife.GetFirstName] дожидается, пока уйдут слуги, а затем, вместо того чтобы сесть, подходит и присаживается на край моего стола.\n\n«[spn_mo_other.GetFirstName]», — говорит [spn_mo_wife.GetSheHe], и, к моему удивлению, [spn_mo_wife.GetSheHe] почти смеётся. «Ох, не смотри так убито. Я видел(а) [spn_mo_other.GetHerHim]. Я не сержусь, что ты смотрел». [spn_mo_wife.GetSheHe|U] склоняет [spn_mo_wife.GetHerHis] голову набок. «Я немного сержусь, что ты не подумал поделиться»."
 spn_moment.0022.desc_zealous:0 "Когда я вхожу, [spn_mo_wife.GetFirstName] стоит на [spn_mo_wife.GetHerHis] коленях и не встаёт. Горят все свечи.\n\n«Я молюсь за тебя, — говорит [spn_mo_wife.GetSheHe]. — И за [spn_mo_other.GetFirstName], который, может, не ведает, что творит. За себя ещё нет. Сначала хочу спросить тебя, что именно мне предстоит простить»."
 spn_moment.0022.a:0 "Это правда. Я не стану отрицать."
 spn_moment.0022.b:0 "Болтовня слуг. Тут нечего знать."
 spn_moment.0022.c:0 "Пойдём, познакомься с [spn_mo_other.GetFirstName]."
 spn_moment.0022.c.tt:0 "[spn_mo_wife.GetShortUIName] решит сам за [spn_mo_wife.GetHerselfHimself]"
 spn_moment.0022.c.yes:0 "[spn_mo_wife.GetFirstName] велел принести вторую бутылку. Больше в тот вечер вас троих никто не видел."
 spn_moment.0022.c.no:0 "[spn_mo_wife.GetFirstName] долго смотрел на тебя, а потом попросил выйти из комнаты."
 spn_moment.0022.d:0 "Назови свои условия. Брак остаётся."
 spn_moment.0022.d.tt:0 "[spn_mo_wife.GetShortUIName] называет цену за [spn_mo_wife.GetHerHis] молчание и [spn_mo_wife.GetHerHis] благосклонность, и ты её платишь"
 spn_moment.0022.e:0 "Сегодня это закончится. Даю слово."

 # Older Than You
 spn_moment.0023.t:0 "Старше тебя"
 spn_moment.0023.desc:0 "Я думал, что это мне есть что скрывать. [spn_mo_admirer.GetFirstName] лежит в моей постели, опершись на локоть, и смотрит, как я догадываюсь, а когда я наконец догадываюсь, [spn_mo_admirer.GetSheHe] смеётся, низко и восторженно, и показывает мне [spn_mo_admirer.GetHerHis] зубы.\n\n«Месяц под твоим фонарём под дождём, — говорит [spn_mo_admirer.GetSheHe], — и ты ни разу не задумался, почему мне не холодно». [spn_mo_admirer.GetSheHe|U] проводит ногтем линию по моему горлу — ровно там, где провёл бы я сам. «Я был(а) стар(а), когда прадед твоего деда лежал в колыбели. Я хотел(а) увидеть, кто ты, прежде чем позволю тебе увидеть меня. Ты сгодишься. Ты беспечен, ты жаден, ты прекрасен, и ты сгодишься»."
 spn_moment.0023.a:0 "Тогда научи меня."
 spn_moment.0023.b:0 "Иди сюда и узнай до конца."
 spn_moment.0023.c:0 "Ты пробрался в мой дом обманом."
 spn_moment.0023.d:0 "Я молчу. Двое умеют хранить тайну."

 # 2.42 s4: the bite (Before Dawn), The First Night, The Night You Do Not Come Home
 spn_moment.0013.h:0 "Не превращение. Только лучшая его часть."
 spn_moment.0013.h.tt:0 "Ты пьёшь немного от [spn_mo_forever.GetShortUIName]. [spn_mo_forever.GetSheHe|U] остаётся таким, какой [spn_mo_forever.GetSheHe] есть, и может выбрать снова в другой раз."

 spn_moment.0024.t:0 "Сплетённые судьбы: первая ночь"
 spn_moment.0024.desc:0 "[spn_mo_forever.GetFirstName] впервые просыпается в сумерках и лежит очень тихо, прислушиваясь. Я знаю, что [spn_mo_forever.GetSheHe] слышит. Сердце кухарки двумя этажами ниже. Сердце конюшонка. Моё, которое бьётся медленнее, чем следовало бы.\n\n«Я чую дождь на улице, — говорит [spn_mo_forever.GetSheHe]. — Чую, кто по нему прошёл». [spn_mo_forever.GetSheHe|U] поворачивается ко мне, и это те же глаза, и уже не те. «Голод такой, что хоть плачь. Покажи, что с этим делать»."
 spn_moment.0024.desc_unwilling:0 "[spn_mo_forever.GetFirstName] с тех пор со мной не разговаривает. [spn_mo_forever.GetSheHe|U] просыпается в сумерках и сидит на краю кровати, повернувшись ко мне [spn_mo_forever.GetHerHis] спиной, положив ладони на [spn_mo_forever.GetHerHis] колени, и держится изо всех сил.\n\n«Я слышу сердце кухарки, — наконец говорит [spn_mo_forever.GetSheHe] стене. — Отсюда. Ты знал, что так будет?» [spn_mo_forever.GetSheHe|U] не ждёт ответа. «Я об этом не просил(а). Но я не стану морить себя голодом назло тебе. Покажи»."
 spn_moment.0024.a:0 "Медленно. Немного, из запястья."
 spn_moment.0024.b:0 "Сегодня мы охотимся вдвоём."
 spn_moment.0024.c:0 "Только те, кто предлагает сам."
 spn_moment.0024.d:0 "Бери кого хочешь."
 spn_moment.0024.e:0 "Этому тебе придётся научиться самому."
 spn_moment.0024.f:0 "Это я с тобой сделал. Что тебе нужно?"

 spn_moment.0025.t:0 "Ночь, когда ты не пришёл домой"
 spn_moment.0025.desc:0 "Была полная луна, и я был неосторожен. На рассвете я перелезаю через садовую стену в грязи по колено и с подсыхающей на рубашке чужой кровью, а [spn_mo_forever.GetFirstName] сидит на крышке колодца, закутав [spn_mo_forever.GetHerHis] плечи одеялом. [spn_mo_forever.GetSheHe|U] просидел там всю ночь.\n\n«Каждый месяц, — говорит [spn_mo_forever.GetSheHe]. — Я думал(а), у тебя кто-то есть. Прошлой ночью я дошёл(дошла) за тобой до опушки, чтобы узнать кто». [spn_mo_forever.GetSheHe|U] смотрит на мои руки, а потом на мой рот. «Никого ведь нет, да? Есть только то, что я слышал в тех деревьях»."
 spn_moment.0025.a:0 "Иди сюда. Оно никогда не причинит тебе вреда."
 spn_moment.0025.b:0 "Никого другого никогда не было. Пойдём в дом."
 spn_moment.0025.c:0 "Браконьеры. Они сбежали. Иди спать."
 spn_moment.0025.d:0 "Не здесь. Спроси меня сегодня вечером."
 spn_moment.0025.e:0 "Посмотри на меня. Ты проспал всю ночь."
 # 2.42 review (20 Nov 2026)
 spn_moment.0012.later.tt:0 "[spn_mo_forever.GetShortUIName] со временем сам придёт к [spn_mo_forever.GetHerHis] собственному ответу"
