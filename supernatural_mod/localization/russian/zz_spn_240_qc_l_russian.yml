l_russian:
 spn_compel_puppet:0 "Подчинённый"
 spn_compel_puppet_desc:0 "Смертный, чью волю ты согнул с помощью «Принудить смертного». Он выполнит для тебя один приказ: действуй от его имени, чтобы отдать его. Подчинение заканчивается с этим приказом и само рассеивается через месяц, если ты его не отдашь."
 spn_compel_puppet_concept_desc:0 "Когда срабатывает твоё «Принудить смертного», смертный становится твоей подчинённой [puppet|E] на один приказ. Это стоит 25 [Concept('vampire','Vampirism')|E], или 15, если ты Истинный вампир.\n\nЩёлкни правой кнопкой по себе и действуй от его имени, чтобы он вступил в твою войну, присоединился к твоему двору, стал твоим любовником, дал тебе сильный [hook|E] на себя, рассказал тебе все известные ему тайны, стал твоим покровителем или прислал тебе своё [gold|E]. Щёлкни правой кнопкой по кому-то другому, чтобы он освободил одного из своих пленников, схватил, избил или запугал этого человека, составил ему компанию, соблазнил его или завёл с ним роман, замыслил его убийство или что-то ему передал. «Покончить с собой» и «Отпустить» — на этой карточке.\n\nНеиспользованное подчинение рассеивается через месяц. Через несколько дней после его окончания он понимает, что был не в себе — обычно потому, что так говорит кто-то из близких, — и его нельзя подчинить снова в течение трёх лет. Он узнаёт, что это был ты, только если уже знает, кто ты такой."
 spn_compel_take_hold_tt:0 "[recipient.GetShortUIName|U] становится твоей подчинённой [puppet|E] на один приказ. Действуй от имени [recipient.GetHerHim], чтобы отдать его. Неиспользованное подчинение рассеивается через месяц."
 spn_compel_cost_tt:0 "Тебе нужно 25 [Concept('vampire','Vampirism')|E], или 15 как Истинному вампиру"
 spn_compel_holding_one_tt:0 "У тебя уже есть подчинённый: отдай ему приказ или отпусти его из списка марионеток"
 spn_compel_player_tt:0 "[recipient.GetShortUIName|U] управляется другим игроком, и его воля принадлежит ему"
 spn_compel_wary_tt:0 "[recipient.GetShortUIName|U] насторожен: [recipient.GetSheHe] знает, что [recipient.GetSheHe] какое-то время был не в себе ([recipient.GetHerHim]), и [recipient.GetHerHis] разум начеку"
 spn_compel_recent_tt:0 "[recipient.GetShortUIName|U] был подчинён совсем недавно, а разум нельзя согнуть снова так скоро"
 spn_compel_spent_tt:0 "Подчинение заканчивается с этим приказом."
 spn_compel_join_war_interaction:0 "Вступи в мою войну"
 spn_compel_join_war_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] вступит во все войны, которые ты ведёшь, на твоей стороне."
 puppet_action_description_puppet_action_spn_compel_join_war:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_join_war_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] вступила в ваши войны"
 spn_compel_needs_your_war_tt:0 "Ты должен вести войну"
 spn_compel_own_war_tt:0 "[puppet_or_actor.GetShortUIName|U] уже ведёт войну"
 spn_compel_war_ties_tt:0 "У [puppet_or_actor.GetShortUIName|U] есть сюзерен или вассал, воюющий с тобой"
 spn_compel_join_court_interaction:0 "Присоединись к моему двору"
 spn_compel_join_court_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] покинет место, где [puppet_or_actor.GetSheHe] живёт, и присоединится к твоему двору вместе с семьёй, которая путешествует с [puppet_or_actor.GetHerHim]."
 puppet_action_description_puppet_action_spn_compel_join_court:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_join_court_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] присоединилась к вашему двору"
 spn_compel_lover_interaction:0 "Стань моим любовником"
 spn_compel_lover_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] станет твоим любовником. Это не роман, и ничто, что учитывает романы, не засчитает его."
 puppet_action_description_puppet_action_spn_compel_lover:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_lover_interaction')]#! на себе, чтобы ваша подчинённая [puppet|E] стала вашим любовником"
 spn_compel_not_family_tt:0 "[puppet_or_actor.GetShortUIName|U] — твой близкий родственник"
 spn_compel_obey_interaction:0 "Делай, что я говорю"
 spn_compel_obey_interaction_desc:0 "Согни волю своей подчинённой [puppet|E] навсегда: ты получаешь сильный [hook|E] на [puppet_or_actor.GetHerHim]. Стоит ещё 10 [Concept('vampire','Vampirism')|E]."
 puppet_action_description_puppet_action_spn_compel_obey:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_obey_interaction')]#! на себе, чтобы получить сильный [hook|E] на вашу подчинённую [puppet|E]"
 spn_compel_extra_10_tt:0 "Тебе нужно ещё 10 [Concept('vampire','Vampirism')|E]"
 spn_compel_has_hook_tt:0 "У тебя уже есть сильный [hook|E] на [puppet_or_actor.GetShortUIName]"
 spn_compel_secrets_interaction:0 "Расскажи мне свои тайны"
 spn_compel_secrets_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] расскажет тебе каждый [secret|E], который [puppet_or_actor.GetSheHe] хранит, и каждую тайну о других, которую [puppet_or_actor.GetSheHe] знает."
 puppet_action_description_puppet_action_spn_compel_secrets:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_secrets_interaction')]#! на себе, чтобы узнать каждый [secret|E], известный вашей подчинённой [puppet|E]"
 spn_compel_secrets_tt:0 "Он расскажет тебе каждый [secret|E], который хранит, и каждую тайну о других, которую знает."
 spn_compel_secrets_told_tt:0 "Он рассказал тебе всё, что знал, и кое-что было тебе в новинку."
 spn_compel_secrets_none_tt:0 "Он рассказал тебе всё, что знал. Ничего нового для тебя там не было."
 spn_compel_patron_interaction:0 "Стань моим покровителем"
 spn_compel_patron_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] станет одним из твоих контактов — тем, к кому может обратиться твой лагерь."
 puppet_action_description_puppet_action_spn_compel_patron:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_patron_interaction')]#! на себе, чтобы сделать вашу подчинённую [puppet|E] вашим контактом"
 spn_compel_already_contact_tt:0 "[puppet_or_actor.GetShortUIName|U] уже твой контакт"
 spn_compel_release_interaction:0 "Освободи его"
 spn_compel_release_interaction_desc:0 "Пусть твоя подчинённая [puppet|E] откроет камеру и отпустит [recipient.GetShortUIName]."
 puppet_action_description_puppet_action_spn_compel_release:0 "Используйте [interaction|E] #V [GetPlayer.GetPlayerInteractionName('spn_compel_release_interaction')]#! на одном из пленников вашей подчинённой [puppet|E], чтобы освободить его"
 spn_compel_end_life_decision:0 "Покончить с собой"
 spn_compel_end_life_decision_desc:0 "Вели [ROOT.Char.GetShortUIName] покончить с [ROOT.Char.GetHerHis] собственной жизнью. Останется тело, и утром ты решишь, что графство об этом подумает."
 spn_compel_end_life_decision_tooltip:0 "Твоя подчинённая [puppet|E] кончает с [ROOT.Char.GetHerHis] собственной жизнью. Стоит ещё 60 [Concept('vampire','Vampirism')|E]."
 spn_compel_end_life_decision_confirm:0 "Велеть"
 spn_compel_extra_60_tt:0 "Тебе нужно ещё 60 [Concept('vampire','Vampirism')|E]"
 spn_compel_end_life_mp_tt:0 "Правила игры запрещают смерть в семье другого игрока"
 spn_compel_end_life_tt:0 "[ROOT.Char.GetShortUIName|U] кончает с [ROOT.Char.GetHerHis] собственной жизнью."
 spn_compel_end_life_toast_tt:0 "[spn_compel_victim.GetShortUIName|U] сделал, как ты велел."
 spn_compel_let_go_decision:0 "Отпустить"
 spn_compel_let_go_decision_desc:0 "Освободи [ROOT.Char.GetShortUIName] от подчинения без приказа. Потраченный вампиризм не возвращается."
 spn_compel_let_go_decision_tooltip:0 "Подчинение [ROOT.Char.GetShortUIName] заканчивается."
 spn_compel_let_go_decision_confirm:0 "Отпустить"
 spn_compel_let_go_toast_tt:0 "[spn_compel_victim.GetShortUIName|U] больше не подчинён."
 spn_compel.0001.t:0 "Не в себе"
 spn_compel.0001.desc_told:0 "[spn_compel_teller.GetShortUIName|U] дожидается, пока мы останемся одни, и спрашивает, что со мной творилось.\n\n[spn_compel_teller.GetSheHe|U] наблюдал за мной последние недели: что я говорил, как смотрел сквозь людей. Я был не в себе.\n\nКогда я пытаюсь вспомнить, там лишь пробел, гладкий и пустой, на месте моих собственных причин."
 spn_compel.0001.desc_alone:0 "Я нахожу в памяти пробел, гладкий и пустой, на месте моих собственных причин.\n\nЧто-то в эти последние недели делал не я сам, и я не могу сказать почему. Я был не в себе."
 spn_compel.0001.desc_named:0 "\n\nНо одно я помню: [spn_compel_master.GetShortUIName] смотрит мне в глаза. И я знаю, кто [spn_compel_master.GetSheHe] такой."
 spn_compel.0001.desc_unnamed:0 "\n\nКто-то сделал это со мной. Я не позволю этому повториться."
 spn_compel.0001.a:0 "Я буду начеку."
 spn_compel.0002.t:0 "Подчинение рассеивается"
 spn_compel.0002.tt:0 "Ты не отдал [ROOT.Char.GetShortUIName] приказа, и твоя власть над [ROOT.Char.GetHerHim] рассеялась."
 spn_compel_wary_modifier:0 "Насторожен"
 spn_compel_wary_modifier_desc:0 "Этот персонаж знает, что какое-то время был не в себе. Его разум начеку: пока это длится, его нельзя подчинить, а интриги против него идут немного хуже."
 spn_compel_used_me_opinion:0 "Подчинил меня"
