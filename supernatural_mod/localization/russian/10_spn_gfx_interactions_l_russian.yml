l_russian:
#Disable VAL Muscle Display
 spn_disable_muscle_display:0 "Отключить определение мышц"
 spn_disable_muscle_display_interaction_desc:0 "Отключить визуальное определение мышц от доблести."
 spn_msg_tooltip_disable_muscle_display:0 "[THIS.GetCharacter.GetFirstName] больше не показывает определение мышц от доблести."

#Enable VAL Muscle Display
 spn_enable_muscle_display:0 "Включить определение мышц"
 spn_enable_muscle_display_interaction_desc:0 "Включить визуальное определение мышц от доблести."
 spn_msg_tooltip_enable_muscle_display:0 "[THIS.GetCharacter.GetFirstName] будет показывать определение мышц от доблести."

#Disable VAL Weight Display
 spn_disable_weight_display:0 "Отключить видимость веса"
 spn_disable_weight_display_interaction_desc:0 "Отключить визуальное определение веса от доблести."
 spn_msg_tooltip_disable_weight_display:0 "[THIS.GetCharacter.GetFirstName] больше не показывает определение веса от доблести."

#Enable VAL Weight Display
 spn_enable_weight_display:0 "Включить видимость возраста"
 spn_enable_weight_display_interaction_desc:0 "Включить визуальное определение возраста от доблести."
 spn_msg_tooltip_enable_weight_display:0 "[THIS.GetCharacter.GetFirstName] будет показывать определение возраста от доблести."

#Set Visual Age
 spn_assign_visual_age:0 "Установить визуальный возраст"
 spn_assign_visual_age_interaction_desc:0 "Установите, на сколько лет этот персонаж выглядит."
 spn_msg_tooltip_assign_visual_age:0 "[THIS.GetCharacter.GetFirstName] будет выглядеть на столько лет, сколько вы им визуально придадите."

 spn_miscellaneous_events.0001.t:0 "Установить визуальный возраст"
 spn_miscellaneous_events.0001has.desc:0 "[recipient.GetFirstName] имеет визуальный возраст [recipient.MakeScope.Var('spn_current_visual_age').GetValue]."
 spn_miscellaneous_events.0001nohas.desc:0 "[recipient.GetFirstName] в настоящее время не отслеживает свой визуально назначенный возраст. Используйте опцию Инициализировать, чтобы начать отслеживание."
 spn_miscellaneous_events.0001.a:0 "+1"
 spn_miscellaneous_events.0001.a.tt:0 "Добавить 1 к визуальному возрасту."
 spn_miscellaneous_events.0001.b:0 "+5"
 spn_miscellaneous_events.0001.b.tt:0 "Добавить 5 к визуальному возрасту."
 spn_miscellaneous_events.0001.c:0 "+10"
 spn_miscellaneous_events.0001.c.tt:0 "Добавить 10 к визуальному возрасту."
 spn_miscellaneous_events.0001.d:0 "-1"
 spn_miscellaneous_events.0001.d.tt:0 "Вычесть 1 из визуального возраста."
 spn_miscellaneous_events.0001.e:0 "-5"
 spn_miscellaneous_events.0001.e.tt:0 "Вычесть 5 из визуального возраста."
 spn_miscellaneous_events.0001.f:0 "-10"
 spn_miscellaneous_events.0001.f.tt:0 "Вычесть 10 из визуального возраста."
 spn_miscellaneous_events.0001.g:0 "Инициализировать"
 spn_miscellaneous_events.0001.g.tt:0 "Инициализирует этого персонажа, чтобы он начал отслеживать свой визуальный возраст. Это должно появиться только для старых сохранений, где это не было установлено при превращении в бессмертного."
 spn_miscellaneous_events.0001.h:0 "Готово"
 spn_miscellaneous_events.0001.h.tt:0 "Завершить настройку визуального возраста персонажа."
 spn_miscellaneous_events.0001.i:0 "+20"
 spn_miscellaneous_events.0001.i.tt:0 "Добавить 20 к визуальному возрасту."
 spn_miscellaneous_events.0001.j:0 "-20"
 spn_miscellaneous_events.0001.j.tt:0 "Вычесть 20 из визуального возраста."
 spn_miscellaneous_events.0001.k:0 "Остановить перезапись"
 spn_miscellaneous_events.0001.k.tt:0 "Останавливает перезапись автоматического старения. Автоматическое старение начнётся с текущего визуального возраста."
