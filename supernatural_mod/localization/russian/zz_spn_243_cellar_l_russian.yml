l_russian:
 # Supernatural 2.43 -- The Man From the Cellar (spn_cellar.0001, .0002)
 spn_cellar.0001.t:0 "Человек из подвала"
 spn_cellar.0001.desc:0 "В зале ждёт человек, и никто не может сказать, как он вошёл. Он худ и очень бледен, и у него вид того, кто долго шёл ночами.\n\n«Ты меня не помнишь, — говорит он. — Винный погреб, несколько лет назад. Я истекал кровью, и кто-то дал мне что-то выпить. Потом я умер и очнулся в земле». Он смотрит на тебя так, как заблудившийся смотрит на единственное освещённое окно на улице. «С тех пор я иду за этим вкусом. Он привёл меня сюда».\n\n[Glossary('#spn_thirst Noster.#!','spn_gloss_thirst_noster')]"
 spn_cellar.0001.a:0 "Останься. Я научу тебя, кто ты такой."
 spn_cellar.0001.a.tt:0 "[spn_cellar_man.GetFirstName] присоединяется к твоему двору."
 spn_cellar.0001.b:0 "Это я с тобой сделал. Прости."
 spn_cellar.0001.c:0 "Это было милосердие. Ступай."
 spn_cellar.0001.d:0 "Будь благодарен, что вообще проснулся."
 spn_cellar.0002.t:0 "Где остановиться"
 spn_cellar.0002.desc:0 "[spn_cellar_man.GetFirstName] больше не вздрагивает у окон. Сегодня он приходит к тебе с кровью на манжете и вопросом, который явно репетировал.\n\n«Как ты останавливаешься? — спрашивает он. — Пока для них не стало слишком поздно. Я пытался. Не могу найти это место».\n\n[Glossary('#spn_thirst Nusquam.#!','spn_gloss_thirst_nusquam')]"
 spn_cellar.0002.a:0 "Медленно. Я покажу."
 spn_cellar.0002.b:0 "Останавливаешься, когда останавливаются они."
 spn_cellar.0002.c:0 "Учись так же, как я. В одиночку."
