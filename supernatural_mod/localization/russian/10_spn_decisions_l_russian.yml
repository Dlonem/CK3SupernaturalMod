 #Vampire Gain Power Decision
 spn_satiate_bloodlust_decision:0 "Утолить Жажду"
 spn_satiate_bloodlust_decision_desc:0 "Вампиры могут пойти на кормление и утолить свой голод, даже увеличив свою силу. Эти охоты помогают контролировать импульсы вашего персонажа и вероятность улучшить свой вампирский статус, кормясь. Однако они сопряжены с дополнительными рисками и наградами."
 spn_satiate_bloodlust_decision_tooltip:0 "Найти Смертного для Кормления"
 spn_msg_tooltip_satiate_bloodlust_desc:0 "Вы можете увеличить свою силу, рискуя быть обнаруженным."
 spn_satiate_bloodlust_decision_confirm:0 "Начать Поиск"
 spn_satiate_bloodlust_decision_cancel:0 "Отмена"
 
 #Werewolf Gain Power Decision
 spn_satiate_hunger_decision:0 "Утолить Голод"
 spn_satiate_hunger_decision_desc:0 "Оборотни могут пойти на кормление и утолить свой голод, даже увеличив свою силу. Эти охоты помогают контролировать импульсы вашего персонажа и возможность улучшить свой ликантропический статус, кормясь. Однако они сопряжены с дополнительными рисками и наградами."
 spn_satiate_hunger_decision_tooltip:0 "Найдите сердце, чтобы насытиться"
 spn_msg_tooltip_satiate_hunger_desc:0 "Вы можете увеличить свою силу, рискуя быть обнаруженным."
 spn_satiate_hunger_decision_confirm:0 "Начать Поиск"
 spn_satiate_hunger_decision_cancel:0 "Отмена"
 
 #Hybrid Gain Power Decision
 spn_satiate_bloodhunger_decision:0 "Утолить голод/жажду"
 spn_satiate_bloodhunger_decision_desc:0 "Гибриды могут идти кормиться и/или пить, чтобы утолить свой голод и даже увеличить свою силу. Эти охоты помогают контролировать импульсы вашего персонажа и увеличивают шансы на улучшение вашего вампирского и ликантропического ранга, удовлетворяя ваши нужды. Однако они сопряжены с дополнительными рисками и наградами."
 spn_satiate_bloodhunger_decision_tooltip:0 "Найдите что-то живое, чтобы насытиться"
 spn_satiate_bloodhunger.a.tt:0 "Укус Ночи: Вампир"
 spn_satiate_bloodhunger.b.tt:0 "Здоровое Сердце: Оборотень"
 spn_msg_tooltip_satiate_bloodhunger_desc:0 "Вы можете увеличить свою силу, рискуя быть раскрытым или убив кого-то."
 spn_satiate_bloodhunger_decision_confirm:0 "Начать Поиск"
 spn_satiate_bloodhunger_decision_cancel:0 "Отмена"
