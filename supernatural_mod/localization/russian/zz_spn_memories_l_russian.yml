# Supernatural 2.34 -- character memories. Design standard (vanilla _character_memories.info): the name key
 # has no perspective; descs are past tense, lower-case, no trailing period -- the memory window uppercases
 # and punctuates. Participants are addressed by their tag (maker, clawer, trainer, progeny, turned, asked, feller).

 ############ TIER 1 -- IDENTITY ############

 # Made a vampire by [maker]
 spn_became_vampire_memory:0 "был обращён в вампира"
 spn_became_vampire_memory_desc:0 "[maker.GetTitledFirstName] дал мне [maker.GetHerHis] кровь, и я умер с ней во мне. Я не остался мёртвым"
 spn_became_vampire_memory_desc_second_perspective:0 "[maker.GetTitledFirstName] дал тебе [maker.GetHerHis] кровь, и ты умер с ней в тебе. Ты не остался мёртвым"
 spn_became_vampire_memory_desc_third_perspective:0 "[maker.GetTitledFirstName] дал [owner.GetName] кровь, и [owner.GetSheHe] умер с ней в [owner.GetHerHim]. [owner.GetSheHe|U] не остался мёртвым"
 spn_became_vampire_memory_desc_forced:0 "[maker.GetTitledFirstName] давил на меня, и я пил, потому что не было выбора. Потом я умер, и я не остался мёртвым"
 spn_became_vampire_memory_desc_forced_second_perspective:0 "[maker.GetTitledFirstName] давил на тебя, и ты пил, потому что у тебя не было выбора. Потом ты умер, и ты не остался мёртвым"
 spn_became_vampire_memory_desc_forced_third_perspective:0 "[maker.GetTitledFirstName] давил на [owner.GetName], и [owner.GetSheHe] пил, потому что [owner.GetSheHe] не имел выбора. Потом [owner.GetSheHe] умер, и не остался мёртвым"

 # Woke a vampire, maker unknown
 spn_woke_a_vampire_memory:0 "пробудился вампиром"
 spn_woke_a_vampire_memory_desc_1:0 "я умер, и я пробудился, и жажда уже была рядом. Я никогда не узнал, чья это была кровь"
 spn_woke_a_vampire_memory_desc_2:0 "последнее, что я помню — это тьма. Первое после неё — голод. Никто никогда не рассказал мне, как"
 spn_woke_a_vampire_memory_desc_3:0 "я пробудился холодный, с остановленным сердцем и чувствами в огне. Кто бы это ни сделал со мной, не остался, чтобы объяснить"
 spn_woke_a_vampire_memory_desc_1_second_perspective:0 "ты умер, и ты пробудился, и жажда уже была рядом. Ты никогда не узнал, чья это была кровь"
 spn_woke_a_vampire_memory_desc_2_second_perspective:0 "последнее, что ты помнишь — это тьма. Первое после неё — голод. Никто никогда не рассказал тебе, как"
 spn_woke_a_vampire_memory_desc_3_second_perspective:0 "ты пробудился холодный, с остановленным сердцем и чувствами в огне. Кто бы это ни сделал с тобой, не остался, чтобы объяснить"
 spn_woke_a_vampire_memory_desc_1_third_perspective:0 "[owner.GetName] умер, и пробудился, и жажда уже была рядом. [owner.GetSheHe|U] никогда не узнал, чья это была кровь"
 spn_woke_a_vampire_memory_desc_2_third_perspective:0 "последнее, что помнит [owner.GetName] — это тьма. Первое после неё — голод. Никто никогда не рассказал [owner.GetHerHim], как"
 spn_woke_a_vampire_memory_desc_3_third_perspective:0 "[owner.GetName] пробудился холодный, с остановленным сердцем и чувствами в огне. Кто бы это ни сделал, не остался, чтобы объяснить"

 # Rose in battle -- maker and feller each optional
 spn_rose_in_battle_memory:0 "упал в битве и восстал"
 spn_rose_in_battle_maker_memory:0 "упал в битве и восстал"
 spn_rose_in_battle_feller_memory:0 "упал в битве и восстал"
 spn_rose_in_battle_both_memory:0 "упал в битве и восстал"
 spn_rose_in_battle_memory_desc:0 "я пал на поле с кровью вампира во мне. Они унесли меня как труп. Три дня спустя я открыл глаза"
 spn_rose_in_battle_memory_desc_second_perspective:0 "ты пал на поле с кровью вампира в тебе. Они унесли тебя как труп. Три дня спустя ты открыл глаза"
 spn_rose_in_battle_memory_desc_third_perspective:0 "[owner.GetName] пал на поле с кровью вампира в [owner.GetHerHim]. Они унесли [owner.GetHerHim] как труп. Три дня спустя [owner.GetSheHe] открыл [owner.GetHerHis] глаза"
 spn_rose_in_battle_maker_memory_desc:0 "я пал на поле с кровью [maker.GetTitledFirstName] во мне. Они унесли меня как труп. Три дня спустя я открыл глаза"
 spn_rose_in_battle_maker_memory_desc_second_perspective:0 "ты пал на поле с кровью [maker.GetTitledFirstName] в тебе. Они унесли тебя как труп. Три дня спустя ты открыл глаза"
 spn_rose_in_battle_maker_memory_desc_third_perspective:0 "[owner.GetName] пал на поле с кровью [maker.GetTitledFirstName] в [owner.GetHerHim]. Они унесли [owner.GetHerHim] как труп. Три дня спустя [owner.GetSheHe] открыл [owner.GetHerHis] глаза"
 spn_rose_in_battle_feller_memory_desc:0 "[feller.GetTitledFirstName] положил меня на поле, и я имел вампирскую кровь во мне. Они унесли меня как труп. Три дня спустя я открыл глаза"
 spn_rose_in_battle_feller_memory_desc_second_perspective:0 "[feller.GetTitledFirstName] положил тебя на поле, и ты имел вампирскую кровь в тебе. Они унесли тебя как труп. Три дня спустя ты открыл глаза"
 spn_rose_in_battle_feller_memory_desc_third_perspective:0 "[feller.GetTitledFirstName] положил [owner.GetName] на поле, и [owner.GetSheHe] имел вампирскую кровь в [owner.GetHerHim]. Три дня спустя [owner.GetSheHe] открыл [owner.GetHerHis] глаза"
 spn_rose_in_battle_both_memory_desc:0 "[feller.GetTitledFirstName] положил меня на поле, и я имел кровь [maker.GetTitledFirstName] во мне. Они унесли меня как труп. Три дня спустя я открыл глаза"
 spn_rose_in_battle_both_memory_desc_second_perspective:0 "[feller.GetTitledFirstName] положил тебя на поле, и ты имел кровь [maker.GetTitledFirstName] в тебе. Они унесли тебя как труп. Три дня спустя ты открыл глаза"
 spn_rose_in_battle_both_memory_desc_third_perspective:0 "[feller.GetTitledFirstName] положил [owner.GetName] на поле, и [owner.GetSheHe] имел кровь [maker.GetTitledFirstName] в [owner.GetHerHim]. Три дня спустя [owner.GetSheHe] открыл [owner.GetHerHis] глаза"

 # Clawed by [clawer]
 spn_became_werewolf_memory:0 "был оцарапан и обращён"
 spn_became_werewolf_memory_desc:0 "[clawer.GetTitledFirstName] вскрыл мне руку своими когтями, и я позволил [clawer.GetHerHim]. Рана закрылась. Волк нет"
 spn_became_werewolf_memory_desc_second_perspective:0 "[clawer.GetTitledFirstName] вскрыл тебе руку своими когтями, и ты позволил [clawer.GetHerHim]. Рана закрылась. Волк нет"
 spn_became_werewolf_memory_desc_third_perspective:0 "[clawer.GetTitledFirstName] вскрыл руку [owner.GetNamePossessive] своими когтями, и [owner.GetSheHe] позволил [clawer.GetHerHim]. Рана закрылась. Волк нет"
 spn_became_werewolf_memory_desc_forced:0 "[clawer.GetTitledFirstName] прижал меня и вскрыл мне руку своими когтями. Я сопротивлялся. Это не имело значения. Рана закрылась. Волк нет"
 spn_became_werewolf_memory_desc_forced_second_perspective:0 "[clawer.GetTitledFirstName] прижал тебя и вскрыл тебе руку своими когтями. Ты сопротивлялся. Это не имело значения. Рана закрылась. Волк нет"
 spn_became_werewolf_memory_desc_forced_third_perspective:0 "[clawer.GetTitledFirstName] прижал [owner.GetName] и вскрыл [owner.GetHerHis] руку своими когтями. [owner.GetSheHe|U] сопротивлялся. Это не имело значения. Рана закрылась. Волк нет"

 # The wolf woke, clawer unknown / born
 spn_woke_a_werewolf_memory:0 "волк пробудился"
 spn_woke_a_werewolf_memory_desc_born:0 "я родился с волком уже в моей крови. Никогда не было ночи, когда бы он там не был"
 spn_woke_a_werewolf_memory_desc_born_second_perspective:0 "ты родился с волком уже в твоей крови. Никогда не было ночи, когда бы он там не был"
 spn_woke_a_werewolf_memory_desc_born_third_perspective:0 "[owner.GetName] родился с волком уже в [owner.GetHerHis] крови. Никогда не было ночи, когда бы он там не был"
 spn_woke_a_werewolf_memory_desc_1:0 "волк пробудился во мне одной ночью, и я никогда не узнал, кто его туда поместил"
 spn_woke_a_werewolf_memory_desc_2:0 "я пришёл в себя на полу с порванной одеждой и ртом полным крови, которая была не моя. Никому не нужно было мне говорить, кто я"
 spn_woke_a_werewolf_memory_desc_3:0 "это пришло с лихорадкой и никогда не ушло. Я не мог сказать, кто дал мне это"
 spn_woke_a_werewolf_memory_desc_1_second_perspective:0 "волк пробудился в тебе одной ночью, и ты никогда не узнал, кто его туда поместил"
 spn_woke_a_werewolf_memory_desc_2_second_perspective:0 "ты пришёл в себя на полу с порванной одеждой и ртом полным крови, которая была не твоя. Никому не нужно было тебе говорить, кто ты"
 spn_woke_a_werewolf_memory_desc_3_second_perspective:0 "это пришло с лихорадкой и никогда не ушло. Ты не мог сказать, кто дал тебе это"
 spn_woke_a_werewolf_memory_desc_1_third_perspective:0 "волк пробудился в [owner.GetName] одной ночью, и [owner.GetSheHe] никогда не узнал, кто его туда поместил"
 spn_woke_a_werewolf_memory_desc_2_third_perspective:0 "[owner.GetName] пришёл в себя на полу с порванной одеждой и ртом полным крови, которая была не [owner.GetHerHis] собственная. Никому не нужно было [owner.GetHerHim] говорить, кто [owner.GetSheHe] был"
 spn_woke_a_werewolf_memory_desc_3_third_perspective:0 "это пришло с лихорадкой и никогда не ушло. [owner.GetName] не мог сказать, кто дал ему это"

 # Made a hybrid by [maker]
 spn_became_hybrid_memory:0 "был обращён в гибрида"
 spn_became_hybrid_memory_desc:0 "[maker.GetTitledFirstName] дал мне [maker.GetHerHis] кровь, пока волк ещё был во мне. Я умер с обоими и восстал с обоими"
 spn_became_hybrid_memory_desc_second_perspective:0 "[maker.GetTitledFirstName] дал тебе [maker.GetHerHis] кровь, пока волк ещё был в тебе. Ты умер с обоими и восстал с обоими"
 spn_became_hybrid_memory_desc_third_perspective:0 "[maker.GetTitledFirstName] дал [owner.GetName] кровь, пока волк ещё был в [owner.GetHerHim]. [owner.GetSheHe|U] умер с обоими и восстал с обоими"
 spn_became_hybrid_memory_desc_forced:0 "[maker.GetTitledFirstName] давил на меня, и я пил, когда волк ещё был во мне. Я умер с обоими и восстал с обоими"
 spn_became_hybrid_memory_desc_forced_second_perspective:0 "[maker.GetTitledFirstName] давил на тебя, и ты пил, когда волк ещё был в тебе. Ты умер с обоими и восстал с обоими"
 spn_became_hybrid_memory_desc_forced_third_perspective:0 "[maker.GetTitledFirstName] давил на [owner.GetName], и [owner.GetSheHe] пил, когда волк ещё был в [owner.GetHerHim]. [owner.GetSheHe|U] умер с обоими и восстал с обоими"

 # Woke a hybrid, maker unknown
 spn_woke_a_hybrid_memory:0 "пробудился с двумя кровями"
 spn_woke_a_hybrid_memory_desc_1:0 "я умер с волком во мне и ещё кое с чем вдобавок, и пробудился с обоими. Я так и не узнал, чья это была кровь"
 spn_woke_a_hybrid_memory_desc_2:0 "волк должен был умереть вместе со мной. Он не умер, и я тоже, а рядом с ним появилась новая жажда"
 spn_woke_a_hybrid_memory_desc_3:0 "я пробудился с остановленным сердцем, а волк всё ещё ходил кругами внутри меня. Тот, кто дал мне кровь, не остался объяснять"
 spn_woke_a_hybrid_memory_desc_1_second_perspective:0 "ты умер с волком в тебе и ещё кое с чем вдобавок, и пробудился с обоими. Ты так и не узнал, чья это была кровь"
 spn_woke_a_hybrid_memory_desc_2_second_perspective:0 "волк должен был умереть вместе с тобой. Он не умер, и ты тоже, а рядом с ним появилась новая жажда"
 spn_woke_a_hybrid_memory_desc_3_second_perspective:0 "ты пробудился с остановленным сердцем, а волк всё ещё ходил кругами внутри тебя. Тот, кто дал тебе кровь, не остался объяснять"
 spn_woke_a_hybrid_memory_desc_1_third_perspective:0 "[owner.GetName] умер с волком в [owner.GetHerHim] и ещё кое с чем вдобавок, и пробудился с обоими. [owner.GetSheHe|U] так и не узнал, чья это была кровь"
 spn_woke_a_hybrid_memory_desc_2_third_perspective:0 "волк должен был умереть тогда же, когда и [owner.GetName]. Он не умер, и [owner.GetSheHe] тоже, а рядом с ним появилась новая жажда"
 spn_woke_a_hybrid_memory_desc_3_third_perspective:0 "[owner.GetName] пробудился с остановленным сердцем, а волк всё ещё ходил кругами внутри [owner.GetHerHim]. Тот, кто дал [owner.GetHerHim] кровь, не остался объяснять"

 # Trained by [trainer]
 spn_became_hunter_memory:0 "выучился на охотника"
 spn_became_hunter_memory_desc:0 "[trainer.GetTitledFirstName] показал мне, что ходит среди нас по ночам, и как это упокоить. С тех пор я сплю плохо"
 spn_became_hunter_memory_desc_second_perspective:0 "[trainer.GetTitledFirstName] показал тебе, что ходит среди нас по ночам, и как это упокоить. С тех пор ты спишь плохо"
 spn_became_hunter_memory_desc_third_perspective:0 "[trainer.GetTitledFirstName] показал [owner.GetName], что ходит среди нас по ночам, и как это упокоить. С тех пор [owner.GetSheHe|U] спит плохо"

 # Took up the hunt, trainer unknown
 spn_woke_a_hunter_memory:0 "взялся за охоту"
 spn_woke_a_hunter_memory_desc_1:0 "в ту ночь я увидел то, чего не должно существовать, и решил, что существовать оно будет недолго. Остальному я выучился сам"
 spn_woke_a_hunter_memory_desc_2:0 "меня никто не учил. Я узнал, что такое чудовища, на своей шкуре — и так же узнал, как их убивать"
 spn_woke_a_hunter_memory_desc_3:0 "я взялся за охоту сам. Серебро, огонь, заострённый кол и терпение дождаться темноты"
 spn_woke_a_hunter_memory_desc_1_second_perspective:0 "в ту ночь ты увидел то, чего не должно существовать, и решил, что существовать оно будет недолго. Остальному ты выучился сам"
 spn_woke_a_hunter_memory_desc_2_second_perspective:0 "тебя никто не учил. Ты узнал, что такое чудовища, на своей шкуре — и так же узнал, как их убивать"
 spn_woke_a_hunter_memory_desc_3_second_perspective:0 "ты взялся за охоту сам. Серебро, огонь, заострённый кол и терпение дождаться темноты"
 spn_woke_a_hunter_memory_desc_1_third_perspective:0 "в ту ночь [owner.GetName] увидел то, чего не должно существовать, и решил, что существовать оно будет недолго. Остальному [owner.GetSheHe|U] обучил [owner.GetHerselfHimself]"
 spn_woke_a_hunter_memory_desc_2_third_perspective:0 "[owner.GetName] никто не учил. [owner.GetSheHe|U] узнал, что такое чудовища, на своей шкуре — и так же узнал, как их убивать"
 spn_woke_a_hunter_memory_desc_3_third_perspective:0 "[owner.GetName] взялся за охоту сам. Серебро, огонь, заострённый кол и терпение дождаться темноты"

 ############ TIER 2 -- THE BONDS ############

 # The maker's side. _named carries the relationship word (vanilla's RelationToMeShort, as relative_died uses it).
 spn_made_a_vampire_memory:0 "обратил вампира"
 spn_made_a_vampire_memory_desc_named:0 "я вскрыл себе вену ради [owner.Custom2('RelationToMeShort', progeny)], [progeny.GetTitledFirstName], и довершил то, что начала кровь"
 spn_made_a_vampire_memory_desc_named_second_perspective:0 "ты вскрыл себе вену ради [owner.Custom2('RelationToMeShort', progeny)], [progeny.GetTitledFirstName], и довершил то, что начала кровь"
 spn_made_a_vampire_memory_desc_named_third_perspective:0 "[owner.GetName] вскрыл себе вену ради [owner.GetHerHis] [owner.Custom2('RelationToMeShort', progeny)], [progeny.GetTitledFirstName], и довершил то, что начала кровь"
 spn_made_a_vampire_memory_desc:0 "я вскрыл себе вену ради [progeny.GetTitledFirstName] и довершил то, что начала кровь"
 spn_made_a_vampire_memory_desc_second_perspective:0 "ты вскрыл себе вену ради [progeny.GetTitledFirstName] и довершил то, что начала кровь"
 spn_made_a_vampire_memory_desc_third_perspective:0 "[owner.GetName] вскрыл себе вену ради [progeny.GetTitledFirstName] и довершил то, что начала кровь"

 # The clawer's side
 spn_clawed_someone_memory:0 "подарил дар"
 spn_clawed_someone_memory_desc:0 "я вонзил когти в [turned.GetTitledFirstName], и волк взял своё. Теперь [turned.GetSheHe|U] несёт его из-за меня"
 spn_clawed_someone_memory_desc_second_perspective:0 "ты вонзил когти в [turned.GetTitledFirstName], и волк взял своё. Теперь [turned.GetSheHe|U] несёт его из-за тебя"
 spn_clawed_someone_memory_desc_third_perspective:0 "[owner.GetName] вонзил когти в [turned.GetTitledFirstName], и волк взял своё. Теперь [turned.GetSheHe|U] несёт его из-за [owner.GetHerHim]"

 # Asked for it
 spn_asked_for_the_gift_memory:0 "попросил об обращении"
 spn_asked_for_the_gift_memory_desc:0 "я пришёл к [asked.GetTitledFirstName], зная, что [asked.GetSheHe] такое, и попросил [asked.GetHerHim] сделать меня таким же"
 spn_asked_for_the_gift_memory_desc_second_perspective:0 "ты пришёл к [asked.GetTitledFirstName], зная, что [asked.GetSheHe] такое, и попросил [asked.GetHerHim] сделать тебя таким же"
 spn_asked_for_the_gift_memory_desc_third_perspective:0 "[owner.GetName] пришёл к [asked.GetTitledFirstName], зная, что [asked.GetSheHe] такое, и попросил сделать [owner.GetHerHim] таким же"

 ############ TIER 3 -- THE CONFRONTATION (first time only) ############

 spn_killed_the_hunter_memory:0 "убил охотника"
 spn_killed_the_hunter_memory_desc:0 "кто-то пришёл за мной с колом и твёрдой рукой. Я убил его прежде, чем он успел пустить в ход хоть одно из двух. Первый из них, полагаю, — но не последний"
 spn_killed_the_hunter_memory_desc_second_perspective:0 "кто-то пришёл за тобой с колом и твёрдой рукой. Ты убил его прежде, чем он успел пустить в ход хоть одно из двух. Первый из них, полагаешь ты, — но не последний"
 spn_killed_the_hunter_memory_desc_third_perspective:0 "кто-то пришёл за [owner.GetName] с колом и твёрдой рукой. [owner.GetSheHe|U] убил его прежде, чем он успел пустить в ход хоть одно из двух"

 spn_escaped_the_hunter_memory:0 "убежал от охотника"
 spn_escaped_the_hunter_memory_desc:0 "кто-то пришёл за мной с колом и твёрдой рукой. Я побежал и не остался узнать его имя. Кто-то знает, кто я"
