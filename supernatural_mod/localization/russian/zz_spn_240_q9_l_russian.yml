l_russian:
 spn_trails:0 "$situation_type_spn_trails$"
 situation_type_spn_trails:0 "Сверхъестественные следы"
 situation_type_spn_trails_desc:0 "Каждое графство, где нечто противоестественное оставило [spn_trail|E]. На каждом лежит #high Здесь что-то охотится#!, что видно любому на самом графстве; эта карта собирает их в одном месте.\n\nЦвет показывает, насколько плох след: [spn_trail_faint|E], [spn_trail_strong|E] или [spn_trail_blood|E]. След исчезает с карты, когда остывает — через пять лет после последнего случая — или когда его зачищают.\n\nКак у графства вообще появляется след: [spn_trails_watch|E]."
 situation_spn_trails:0 "$situation_type_spn_trails$"
 situation_spn_trails_desc:0 "$situation_type_spn_trails_desc$"
 spn_trails_watch:0 "Округа говорит"
 spn_trails_watch_desc:0 "$game_concept_spn_trails_watch_desc$"
 spn_trails_spn_trails_watch_situation_phase:0 "$spn_trails_watch$"
 spn_trails_spn_trails_watch_situation_phase_desc:0 "$game_concept_spn_trails_watch_desc$"
 spn_trails_sub_region_spn_trail_faint:0 "Слухи"
 spn_trails_sub_region_spn_trail_faint_desc:0 "$game_concept_spn_trail_faint_desc$\n\nГрафства: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_sub_region_spn_trail_strong:0 "Тревога"
 spn_trails_sub_region_spn_trail_strong_desc:0 "$game_concept_spn_trail_strong_desc$\n\nГрафства: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_sub_region_spn_trail_blood:0 "Кровь"
 spn_trails_sub_region_spn_trail_blood_desc:0 "$game_concept_spn_trail_blood_desc$\n\nГрафства: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_participant_group_spn_trail_watchers:0 "Наблюдатели"
 spn_trails_participant_group_spn_trail_watchers_desc:0 "В следах никто не участвует. Это запись того, что заметила округа."
 game_concept_spn_trail_faint:0 "Слухи"
 game_concept_spn_trail_faint_desc:0 "[spn_trail|E] с одним-двумя записанными случаями и без смертей среди них. Люди судачат, но господину графства весть отправляют только на третьем случае."
 game_concept_spn_trail_strong:0 "Тревога"
 game_concept_spn_trail_strong_desc:0 "[spn_trail|E] с тремя и более записанными случаями и без смертей среди них. На третьем господину графства отправляют весть, если только виновник сам не владеет графством. Чем больше случаев на следе, тем сильнее он притягивает находящегося поблизости [spn_hunter|E]."
 game_concept_spn_trail_blood:0 "Кровь"
 game_concept_spn_trail_blood_desc:0 "[spn_trail|E] с записанной смертью: убийством, пока след был открыт, или в год слухов, что к нему привёл. Она остаётся в записи, пока существует след. Убийство, которое остаётся лишь слухом, без чего-либо ещё в пределах года, в запись никогда не попадает."
 game_concept_spn_trails_watch:0 "Как начинается след"
 game_concept_spn_trails_watch_desc:0 "Первый случай на чистой земле обычно лишь слух, который никто не может ни к чему привязать, и он угасает в течение года. Второй случай в пределах того же года открывает [spn_trail|E], а иногда первый замечают сразу. Каждый последующий случай добавляется к следу и сохраняет его тёплым ещё на пять лет. След зачищается раньше срока, когда его виновник умирает и винить больше некого, или способами, которыми существа и охотники умеют зачищать следы."
 game_concept_spn_trail_watchers:0 "Те, кто наблюдает"
 game_concept_spn_trail_watchers_desc:0 "Ночные существа, ведьмы, Маги, члены Ордена и охотники ведут счёт следам, и только у них на экране есть кнопка «Следы». Сами следы не тайна: каждое перечисленное графство показывает #high Здесь что-то охотится#! любому, кто посмотрит. Что оставило след и когда его видели в последний раз, читает $spn_trailsman_court_position$ у тебя на службе. Без него ты можешь распознать только собственные следы и следы того из твоей стаи, ковена или храма, чью природу ты знаешь."
 spn_hud_trails_tt:0 "#T Сверхъестественные следы#!\nПеречисляет каждое графство, где нечто противоестественное оставило [spn_trail|E]: насколько он плох и сколько случаев записано. $spn_trailsman_court_position$ у тебя на службе также скажет, что оставило каждый след и когда его видели в последний раз. [spn_hunter|E] может отсюда спланировать охоту.\n\nПоказывается для: [spn_trail_watchers|E]."
 spn_trails_window_title:0 "Сверхъестественные следы"
 spn_trails_window_intro:0 "Каждое графство, где заметили нечто противоестественное и на котором теперь лежит #high Здесь что-то охотится#!. [spn_trail|E] остаётся открытым пять лет после последнего случая, если его не зачистят раньше."
 spn_trails_plan_hunt:0 "Спланировать сверхъестественную охоту"
 spn_trails_plan_hunt_tt:0 "#T [ActivityType.GetNameNoTooltip]#!\n[ActivityType.GetCanPlanActivityTooltip( GetPlayer )]\n\nОткрывает охоту. Когда ты выбираешь, куда ехать, можно выбрать графства со следами, на которые ты можешь охотиться, а самые многообещающие отмечены на карте."
 spn_trails_not_a_hunter:0 "Идти по следу может только взрослый [spn_hunter|E], который владеет землёй или возглавляет отряд искателей приключений."
 spn_trails_none:0 "Нигде нет открытых следов. Когда графство начнёт говорить о чём-то противоестественном, оно появится здесь."
 spn_trails_band_blood:0 "[spn_trail_blood|E]: записана смерть."
 spn_trails_band_strong:0 "[spn_trail_strong|E]: записано три и более случаев, смертей нет."
 spn_trails_band_faint:0 "[spn_trail_faint|E]: записано один-два случая, смертей нет."
 spn_trails_row_name:0 "[Title.GetName], владелец: [Title.GetHolder.GetShortUIName]"
 spn_trails_row_kind_unknown:0 "Оставил: #weak неизвестно#!"
 spn_trails_row_kind_self:0 "Оставил: ты"
 spn_trails_row_kind_vampire:0 "Оставил: вампир"
 spn_trails_row_kind_werewolf:0 "Оставил: оборотень"
 spn_trails_row_kind_demon:0 "Оставил: демон"
 spn_trails_row_kind_witch:0 "Оставила: ведьма"
 spn_trails_row_count:0 "Случаев: [Title.MakeScope.Var('spn_menace_count').GetValue|0]"
 spn_trails_row_seen:0 "Последний раз видели: [Title.MakeScope.Var('spn_trail_seen_year').GetValue|0]"
 spn_trails_row_seen_unknown:0 "Последний раз видели: #weak неизвестно#!"
 spn_trails_trailsman_yes:0 "Твой $spn_trailsman_court_position$ читает эти следы за тебя: что оставило каждый и когда его видели в последний раз."
 spn_trails_trailsman_no:0 "$spn_trailsman_court_position$ при твоём дворе или в лагере читает следы: что оставило каждый и когда его видели в последний раз. Без него ты можешь распознать только собственные следы и следы того из твоей стаи, ковена или храма, чью природу ты знаешь."
