 ### 2.33 -- The blood remembers: dying in battle with vampire blood in you
 ### Three beats. 0001 you do not know, 0002 you work it out, 0003 the argument ends.
 ### 0001 must never name the blood or the hunger -- the recognition in 0002 is the payoff.
 ### VOICE: second person, plain and concrete, same as the embrace and wound-incubation chains.

 spn_transition.0001.t:0 "Ты должен был(а) умереть"
 spn_transition.0001.desc:0 "Ты помнишь, как пришёлся удар и как небо перевернулось, — а потом ничего.\n\nТы приходишь в себя в шатре, в трёх днях пути от того боя. Лекарь уже приходил и ушёл. Повязки он оставил потому, что не хотел спорить с лордом, — но под ними ничего нет: рана затянулась чисто, ни струпа, ни шрама, будто заживала не три дня, а целый сезон.\n\nНичего не болит. Ты прижимаешь два пальца к собственному горлу и держишь их так долго, а потом убираешь и больше не пробуешь."
 spn_transition.0001.desc_felled:0 "Ты помнишь, как [spn_the_one_who_felled_me.GetTitledFirstName] прорвался(прорвалась) сквозь давку, как пришёлся удар и как небо перевернулось. А потом — ничего.\n\nТы приходишь в себя в шатре, в трёх днях пути от того боя. Лекарь уже приходил и ушёл. Повязки он оставил потому, что не хотел спорить с лордом, — но под ними ничего нет: рана затянулась чисто, ни струпа, ни шрама, будто заживала не три дня, а целый сезон.\n\nНичего не болит. Ты прижимаешь два пальца к собственному горлу и держишь их так долго, а потом убираешь и больше не пробуешь."
 spn_transition.0001.a:0 "Подняться — что бы это ни было, я разберусь на ногах"

 spn_transition.0002.t:0 "Чего хочет кровь"
 spn_transition.0002.desc:0 "Вот уже две недели с тобой что-то не так, и сегодня это перестаёт быть странным и становится проблемой.\n\nТы ощущаешь голод. Не по еде — ты ел, и это ничего не изменило. Из своего шатра ты слышишь весь лагерь: сколько в нём людей, кто пьян, кто истекает кровью через повязку, которую не сменил. Ты знаешь это так же, как знаешь своё имя.\n\nИ ты помнишь чашу. Кто-то вложил её тебе в руку несколько месяцев назад и почти не придал этому значения, — а не выпить было бы невежливо.\n\nТеперь ты понимаешь, что в ней было — и чего она просит."
 spn_transition.0002.desc_donor:0 "Вот уже две недели с тобой что-то не так, и сегодня это перестаёт быть странным и становится проблемой.\n\nТы ощущаешь голод. Не по еде — ты ел, и это ничего не изменило. Из своего шатра ты слышишь весь лагерь: сколько в нём людей, кто пьян, кто истекает кровью через повязку, которую не сменил.\n\nИ ты помнишь чашу. Месяцы назад [spn_the_donor.GetTitledFirstName] дал(а) тебе её в руки, а тогда это выглядело пустяком.\n\n[spn_the_donor.GetSheHe|U] сидит у твоего шатра, когда ты выходишь, и ничуть не удивляется, увидев тебя на ногах. «У тебя есть вопросы, — говорит [spn_the_donor.GetSheHe]. — Я отвечу на них. Но сначала ответь на мой: насколько велик твой голод?»"
 spn_transition.0002.a:0 "Здесь есть человек, которого никто не хватится"
 spn_transition.0002.a_tt:0 "Покормиться — и закончить то, что начала кровь."
 spn_transition.0002.b:0 "Тебе было известно, что так и будет, — проведи меня через это"
 spn_transition.0002.b_tt:0 "Позволь провести себя через это. Ради этого умирать никому не нужно."
 spn_transition.0002.c:0 "Я отказываюсь — пусть всё кончится, как кончится"
 spn_transition.0002.c_tt:0 "Отказ. Во второй раз голод вежливо не спросит."

 spn_transition.0003.t:0 "Последнее"
 spn_transition.0003.desc:0 "Ещё две недели, а поесть так и не довелось.\n\nИ поспать тоже: то, что ты делаешь ночью, — не сон. Ты лежишь неподвижно, слушаешь лагерь, считаешь в нём удары сердец и уже умеешь их различать.\n\nТебе холодно так, что к погоде это отношения не имеет, руки начали дрожать, а сегодня утром слуга вздрогнул под твоим взглядом.\n\nЭто конец спора. Либо ты выходишь и берёшь то, что тебе нужно, либо лежишь здесь и узнаёшь, что такое другое."
 spn_transition.0003.a:0 "Хватит — дважды я не умру"
 spn_transition.0003.a_tt:0 "Покормиться. Дольше ждать незачем."
 spn_transition.0003.b:0 "Пусть всё закончится как следует"
 spn_transition.0003.b_tt:0 "Отказаться во второй раз. Третьего не будет."

 ### death reason
 spn_death_transition_refused:0 "погиб(ла) в бою с вампирской кровью в жилах, не стал(а) кормиться и умер(ла) снова"
 spn_death_transition_refused_desc:0 "[ROOT.Char.GetShortUIName] погиб(ла) в бою, уже имея вампирскую кровь в жилах, и очнулся(очнулась) между жизнью и смертью. Кормиться [ROOT.Char.GetSheHe] отказывается, и переход так и не завершается."

 ### the combat entry, for the value breakdown
 spn_sc_blood_took_the_blow:0 "Кровь ответила"

