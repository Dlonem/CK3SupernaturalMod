 spn_debug_events.0200.t:0 "Перепись"
### English until the translator resends it (the line was cut off mid-value; console-only census event)
 spn_debug_events.0200.desc:0 "#high На чём на самом деле работает охотничий слой.#!\n\n#high Следы#! (графства с «Здесь что-то охотится»): #P [spn_census.MakeScope.Var('spn_dbg_trails').GetValue|0]#!\n#high Тёплые#! (виновник ещё жив: только их может использовать охота): #P [spn_census.MakeScope.Var('spn_dbg_warm').GetValue|0]#!\n#high Ведьмины следы#! (на что можно направить Охоту на ведьм): #P [spn_census.MakeScope.Var('spn_dbg_witch').GetValue|0]#!\n\n#high Охотников в мире#!: #P [spn_census.MakeScope.Var('spn_dbg_hunters').GetValue|0]#!\n#high Существа#! (вампир, оборотень, гибрид, демон): #P [spn_census.MakeScope.Var('spn_dbg_creature').GetValue|0]#!\n#high Ведьмы#! (черта, у правителя): #P [spn_census.MakeScope.Var('spn_dbg_witches').GetValue|0]#!\n\n#high Ты сам#! -- дверь записи on_death открывается для существа или для ведьмы по черте ИЛИ по тайне. 1 означает да.\n#high  ... существо#!: #P [spn_census.MakeScope.Var('spn_dbg_self_creature').GetValue|0]#!\n#high  ... ведьма, открыто или тайно#!: #P [spn_census.MakeScope.Var('spn_dbg_self_witch').GetValue|0]#!\n\n#high Охот идёт прямо сейчас#! (предел в мире — 6): #P [spn_census.MakeScope.Var('spn_dbg_running').GetValue|0]#!\n\nСледы на 0 после многих лет игры значат, что ничто не оставляет меток, и никакой бросок нигде не поможет. Тёплых намного меньше, чем Следов, — значит, виновники умирают от других причин. Ведьмины следы на 0 при Ведьмах выше 0 значат, что ведьмы не убивают никого, кого графство может найти."
 spn_debug_events.0200.a:0 "Закрыть"
