 spn_debug_events.0001.ParentsSire.desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет двух бессмертных суверенных родителей. \n\n [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] \n [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName]"
 spn_debug_events.0001.FatherSire.desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет двух бессмертных суверенных родителей. \n\n [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName]"
