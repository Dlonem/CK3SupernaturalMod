l_russian:
spn_confrontation.9000.tt:0 "Победи своего нападающего"
spn_confrontation.9001.tt:0 "Попробуй сбежать"

#-------------------------------------------------------------------------- 
# A Surprise You Could Die For
#-------------------------------------------------------------------------- 
#A Surprise You Could Die For
 spn_confrontation.0001.t:0 "Сюрприз, за который можно погибнуть"
 spn_confrontation.0001.desc:0 "Когда ты сидишь в своем кабинете поздней ночью, дверь внезапно открывается. Перед тобой стоит [spn_new_created_hunter.GetWomanMan], вооружённый до зубов. \n\n "Я поймал тебя теперь, ублюдок!" — кричит [spn_new_created_hunter.GetSheHe|U], бросаясь на тебя."
 spn_confrontation.0001.a:0 "На вас!"
 spn_confrontation.0001.a.tt:0 "Вы принимаете вызов и вступаете в схватку с нападающим незнакомцем."
 spn_confrontation.0001.b:0 "Попытаться сбежать."
 spn_confrontation.0001.b.tt:0 "Вы бросаете всё, что можете найти, в незнакомца в безумном стремлении найти способ сбежать."

#Bravery or Stupidity?
 spn_confrontation.0002.t:0 "Храбрость или глупость?"
 spn_confrontation.0002.desc:0 "После ожесточенной битвы вы убили своего нападающего. [spn_new_created_hunter.GetSheHe|U] мертв на полу у ваших ног. Вы находите на нём записки о бессмертных существах этого мира. Придется ли вам иметь дело с другими Охотниками?"
 spn_confrontation.0002.a:0 "Это была смелая, но бесполезная попытка."
 spn_confrontation.0002.a.tt:0 "По крайней мере, на свете стало на одного врага меньше."

#Narrow Escape
 spn_confrontation.0003.t:0 "Узкое спасение"
 spn_confrontation.0003.desc:0 "Хорошо брошенное кресло дало вам достаточно времени, чтобы избежать своего нападающего. Вы召вали своих стражников и thoroughly все обыскали. Ваши стражники сообщают, что не смогли найти никаких следов."
 spn_confrontation.0003.a:0 "Увы"
 spn_confrontation.0003.a.tt:0 "За что я, собственно, плачу этим стражникам?"

#-------------------------------------------------------------------------- 
# A Walk In The Garden
#-------------------------------------------------------------------------- 
#A Walk In The Garden
 spn_confrontation.0011.t:0 "Прогулка в саду"
 spn_confrontation.0011.desc:0 "Прогуливаясь поздним послеобеденным временем по садам, вы слышите шорох в кустах. Некий [spn_new_created_hunter.GetWomanMan] выскакивает на вас с оглушительным боевым криком."
 spn_confrontation.0011.a:0 "Вы получите больше, чем рассчитывали!"
 spn_confrontation.0011.a.tt:0 "Вы боретесь со странником."
 spn_confrontation.0011.b:0 "Попытаться сбежать."
 spn_confrontation.0011.b.tt:0 "Вы пытаетесь уклониться от нападающего и ищете помощи у своих стражников."

#A Tiring Ordeal
 spn_confrontation.0012.t:0 "Утомительное испытание"
 spn_confrontation.0012.desc:0 "После борьбы вы одерживаете победу. Упав в кровь, вы смотрите вниз на нападающего. Этот [spn_new_created_hunter.GetWomanMan] несет оружие, предназначенное для бессмертных. Придут ли еще эти Охотники за вами?"
 spn_confrontation.0012.a:0 "Они меня не достанут"
 spn_confrontation.0012.a.tt:0 "Пусть пробуют, сколько хотят..."

#As Fast As You Can
 spn_confrontation.0013.t:0 "Как можно быстрее"
 spn_confrontation.0013.desc:0 "Вам удалось уклониться от нападающего благодаря удивительному проявлению выносливости. Наконец, найдя одного из своих стражников, вы просите обыскать сады, но безрезультатно. Нападающий жив, чтобы сражаться в другой день."
 spn_confrontation.0013.a:0 "Подожди, что? Как?!"
 spn_confrontation.0013.a.tt:0 "Мои стражники действительно такие бесполезные?"

#-------------------------------------------------------------------------- 
# A Not So Peaceful Sleep
#-------------------------------------------------------------------------- 
#A Not So Peaceful Sleep
 spn_confrontation.0021.t:0 "Не так уж мирный сон"
 spn_confrontation.0021.desc:0 "Вы просыпаетесь от громкого удара и видите темную фигуру, которая только что вошла через ваше окно.\n\n"Какого черта!?" — кричите вы.\n"Чтобы отправить монстра в загробную жизнь. Теперь умри!" — говорит нападающий, издавая крик и бросаясь на вас."
 spn_confrontation.0021.a:0 "Ты смеешь входить в мой дом!"
 spn_confrontation.0021.a.tt:0 "Встреть нападающего лицом к лицу."
 spn_confrontation.0021.b:0 "Ах! Почему именно я!?"
 spn_confrontation.0021.b.tt:0 "Бросьте свое постельное белье в нападающего и попытайтесь уклониться от него."

#Not In My House
 spn_confrontation.0022.t:0 "Не в моем доме"
 spn_confrontation.0022.desc:0 "С победой в битве вы зажигаете свечу, чтобы рассмотреть нападающего. [spn_new_created_hunter.GetSheHe|U] готовилась к этой встрече. Просто не так, как ей стоило бы. Надеюсь, вы больше не встретите этих Охотников."
 spn_confrontation.0022.a:0 "Рад, что с этим покончено."
 spn_confrontation.0022.a.tt:0 "Может, это последний из них?"

#Skillful Use of Bedding
 spn_confrontation.0023.t:0 "Умелое использование постельного белья"
 spn_confrontation.0023.desc:0 "Хорошо расположенное одеяло смогло временно обездвижить вашего нападающего. Вы используете эту возможность, чтобы выйти из зоны опасности и найти стражей. После обыска ваших покоев они возвращаются ни с чем."
 spn_confrontation.0023.a:0 "Чёрт возьми!"
 spn_confrontation.0023.a.tt:0 "Надеюсь, они никогда не вернутся."
