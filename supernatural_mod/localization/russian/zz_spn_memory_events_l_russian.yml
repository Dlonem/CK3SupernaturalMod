l_russian:
 # Supernatural 2.34 -- the memory-triggered flavour events (zz_spn_memory_events.txt)

 ############ ① HUNTER -- The One Who Started It ############
 spn_memory.0001.t:0 "Тот, с кого всё началось"
 spn_memory.0001.desc:0 "Прошёл год, а работа всё ещё здесь.\n\nТы чистишь клинок за тем же столом, где [spn_dead_trainer.GetTitledFirstName] впервые показал тебе, как это делается, и ловишь себя на том, что прислушиваешься к [spn_dead_trainer.GetHerHis] шагам в коридоре.\n\n[spn_dead_trainer.GetTitledFirstName] научил тебя не всему, что ты знаешь. [spn_dead_trainer.GetSheHe|U] научил тебя всему, что [spn_dead_trainer.GetSheHe] знал сам, и указал тебе путь к остальному. Без [spn_dead_trainer.GetHerHim] ты не был бы тем, кто ты есть."
 spn_memory.0001.a:0 "Произнести слова над [spn_dead_trainer.GetHerHis] могилой"
 spn_memory.0001.b:0 "Работа не прекращается"

 ############ ② VAMPIRE -- A Hundred Years ############
 spn_memory.0002.t:0 "Сто лет"
 spn_memory.0002.desc.intro:0 "Ты считаешь на пальцах, прежде чем поверить. Сегодня ровно сто лет с той ночи, когда ты умер и не остался мёртвым.\n\nСвеча догорает. Твоё лицо в стекле не изменилось. "
 spn_memory.0002.desc.maker_alive:0 "Где-то там всё ещё ходит по земле [spn_old_maker.GetTitledFirstName] — тот, кто дал тебе кровь. [spn_old_maker.GetSheHe|U] помнит твоё лицо таким, каким оно было, пока не перестало меняться. Больше никто из живых этого не скажет."
 spn_memory.0002.desc.alone:0 "Не осталось никого, кто видел твоё лицо до крови. Все, кто знал о тебе правду в ту первую ночь, лежат в земле. Память — всё, что осталось, и держишь её только ты."
 spn_memory.0002.a:0 "Перечитать эту память"
 spn_memory.0002.b:0 "Пойти и найти [spn_old_maker.GetTitledFirstName]"
 spn_memory.0002.c:0 "Насытиться и перестать считать"

 ############ ③ WEREWOLF -- It Went Into Them ############
 spn_memory.0003.t:0 "Оно вошло в них"
 spn_memory.0003.desc:0 "Ты смотришь на [spn_born_child.GetTitledFirstName] через сад. [spn_born_child.GetSheHe|U] замирает на полушаге и поворачивает [spn_born_child.GetHerHis] голову на звук, которого больше никто не слышит. Ты знаешь этот взгляд. Он у тебя самого.\n\nКто-то вложил в тебя волка своими когтями. В [spn_born_child.GetHerHim] его никто не вкладывал. [spn_born_child.GetSheHe|U] родился с ним, и [spn_born_child.GetSheHe] ничего не выбирал.\n\n[spn_born_child.GetSheHe|U] не знает, кто ты такой. Пока не знает."
 spn_memory.0003.a:0 "Сказать [spn_born_child.GetHerHim], кто я"
 spn_memory.0003.b:0 "Пусть [spn_born_child.GetHerHim] узнает сам"

 ############ ④ HYBRID -- Two Bloods ############
 spn_memory.0004.t:0 "Две крови"
 spn_memory.0004.desc.intro:0 "Ты стоишь в переулке, ночь напирает со всех сторон, и два голода тянут в разные стороны.\n\n"
 spn_memory.0004.desc.blood_ahead:0 "Кровь берёт своё уже много лет. Жажда остра и натренирована и откликается, стоит её позвать. Волк же тощ. Он ходит где-то далеко позади, полуголодный, и иными ночами ты вовсе забываешь, что он есть.\n\nТы — и то и другое. А живёшь как одно."
 spn_memory.0004.desc.wolf_ahead:0 "Волк берёт своё уже много лет. Он силён и близок и откликается, стоит его позвать. Жажда же тонка. Она скребётся где-то далеко позади, полуголодная, и иными ночами ты вовсе забываешь, что она есть.\n\nТы — и то и другое. А живёшь как одно."
 spn_memory.0004.a:0 "Отдаться той половине, что берёт верх"
 spn_memory.0004.b:0 "Накормить ту половину, что голодает"

 ############ ⑤ DEMON -- Something in the Blood ############
 spn_memory.0005.t:0 "Что-то в крови"
 spn_memory.0005.desc.intro:0 "Сегодня тебе четырнадцать. Ты лежишь без сна, когда свечи уже погасли, и слушаешь собственное сердцебиение, потому что в последнее время оно стучит не так, как у других.\n\n"
 spn_memory.0005.desc.both:0 "Тебе всегда было известно, кто твои родители. Об этом рассказали ещё до первого шага. Знать это и чувствовать, как оно пробуждается внутри, — не одно и то же. Сегодня ночью оно не спит, и оно тёплое, и оно терпеливое."
 spn_memory.0005.desc.half:0 "Одна половина тебя — от чего-то, что не было человеком. Другая — человеческая. Сегодня ночью ты чувствуешь черту между ними, как шов на ткани, и не можешь понять, на какой стороне стоишь."
 spn_memory.0005.a:0 "Что бы это ни было, оно моё"
 spn_memory.0005.b:0 "Никому не говорить"
 spn_memory.0005.c:0 "Спросить [spn_demon_parent.GetTitledFirstName], кто я"

 spn_memory.0006.t:0 "Что-то в крови у ребёнка"
 spn_memory.0006.desc.intro:0 "Сегодня [spn_demon_child.GetTitledFirstName] исполняется четырнадцать. Ты находишь [spn_demon_child.GetHerHim] не спящим, хотя свечи давно погашены: сидит совершенно неподвижно, прижав ладонь к [spn_demon_child.GetHerHis] груди.\n\n"
 spn_memory.0006.desc.both:0 "[spn_demon_child.GetSheHe|U] с самого начала знает, кто [spn_demon_child.GetHerHis] родители. Сегодня ночью [spn_demon_child.GetSheHe] узнаёт, что это значит — изнутри. Ты помнишь ту ночь, когда оно проснулось в тебе."
 spn_memory.0006.desc.half:0 "Половина [spn_demon_child.GetHerHim] — твоя. Половина [spn_demon_child.GetHerHim] — нет. Этой ночью [spn_demon_child.GetSheHe] чувствует черту между ними, и [spn_demon_child.GetSheHe] не знает, на какой стороне [spn_demon_child.GetSheHe] стоит. Ты знаешь."
 spn_memory.0006.a:0 "Сказать [spn_demon_child.GetHerHim], кто [spn_demon_child.GetSheHe] есть"
 spn_memory.0006.b:0 "Пусть оно ещё немного помолчит"

 ############ ⑥ MAGE -- What the Word Meant ############
 spn_memory.0007.t:0 "Что значило это слово"
 spn_memory.0007.desc.intro:0 "Тридцать лет назад ты прочёл последнюю страницу и закрыл книгу, и слово для того, чем ты был, переменилось.\n\n"
 spn_memory.0007.desc.mage:0 "Сегодня ночью ты открываешь ту же книгу и обнаруживаешь, что по-прежнему не понимаешь и половины. Маг. Тебе казалось, что это слово — конец пути. А оно было лишь первым верстовым столбом."
 spn_memory.0007.desc.legendary:0 "Сегодня ночью ты открываешь ту же книгу и видишь, что большинство пометок на полях написано твоей рукой. С тех пор слово переменилось снова. Люди произносят его о тебе в комнатах, где тебя никогда не бывало. Тебе казалось, что «Маг» — конец пути. А это был лишь первый верстовой столб, и ты давно уже прошёл мимо него."
 spn_memory.0007.a:0 "Есть что читать дальше"
 spn_memory.0007.b:0 "Закрыть книгу"
