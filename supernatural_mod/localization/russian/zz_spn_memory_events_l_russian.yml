l_russian:
 spn_memory.0001.t:0 "The One Who Started It"
 spn_memory.0001.desc:0 "A year gone, and the work is still here.\n\nYou clean the blade at the table where [spn_dead_trainer.GetTitledFirstName] first showed you how, and you catch yourself listening for [spn_dead_trainer.GetHerHis] step in the hall.\n\n[spn_dead_trainer.GetTitledFirstName] did not teach you everything you know. [spn_dead_trainer.GetSheHe|U] taught you everything [spn_dead_trainer.GetSheHe] knew, and pointed you at the rest. Without [spn_dead_trainer.GetHerHim] you would not be what you are."
 spn_memory.0001.a:0 "Say the words over [spn_dead_trainer.GetHerHis] grave"
 spn_memory.0001.b:0 "The work does not stop"
 spn_memory.0002.t:0 "A Hundred Years"
 spn_memory.0002.desc.intro:0 "You count it out on your fingers before you believe it. A hundred years tonight since you died and did not stay dead.\n\nThe candle burns down. Your face in the glass has not changed. "
 spn_memory.0002.desc.maker_alive:0 "Somewhere out there [spn_old_maker.GetTitledFirstName] is still walking, the one who gave you the blood. [spn_old_maker.GetSheHe|U] saw your face before it stopped changing. Nobody else alive can say that."
 spn_memory.0002.desc.alone:0 "There is no one left who saw your face before the blood. Everyone who knew what you were that first night is in the ground. The memory is all that remains, and you are the only one holding it."
 spn_memory.0002.a:0 "Read the memory again"
 spn_memory.0002.b:0 "Go and find [spn_old_maker.GetTitledFirstName]"
 spn_memory.0002.c:0 "Feed, and stop counting"
 spn_memory.0003.t:0 "It Went Into Them"
 spn_memory.0003.desc:0 "You watch [spn_born_child.GetTitledFirstName] from across the garden. [spn_born_child.GetSheHe|U] stops mid-step and turns [spn_born_child.GetHerHis] head toward a sound no one else hears. You know that look. You wear it.\n\nSomeone put the wolf into you with their claws. Nobody put it into [spn_born_child.GetHerHim]. [spn_born_child.GetSheHe|U] was born with it, and [spn_born_child.GetSheHe] chose nothing.\n\n[spn_born_child.GetSheHe|U] does not know what you are. Not yet."
 spn_memory.0003.a:0 "Tell [spn_born_child.GetHerHim] what I am"
 spn_memory.0003.b:0 "Let [spn_born_child.GetHerHim] find out alone"
 spn_memory.0004.t:0 "Two Bloods"
 spn_memory.0004.desc.intro:0 "You stand in the alley with the night pressing in and two hungers pulling in different directions.\n\n"
 spn_memory.0004.desc.blood_ahead:0 "The blood has had its way for years now. The thirst is sharp and practised and answers when you call it. The wolf is thin. It paces somewhere far back, half-starved, and some nights you forget it is there at all.\n\nYou were made both. You have been living as one."
 spn_memory.0004.desc.wolf_ahead:0 "The wolf has had its way for years now. It is strong and close and answers when you call it. The thirst is thin. It scratches somewhere far back, half-starved, and some nights you forget it is there at all.\n\nYou were made both. You have been living as one."
 spn_memory.0004.a:0 "Lean into the half that is winning"
 spn_memory.0004.b:0 "Feed the half that is starving"
 spn_memory.0005.t:0 "Something in the Blood"
 spn_memory.0005.desc.intro:0 "You are fourteen today. You lie awake after the candles are out and listen to your own heartbeat, because lately it does not sound the way other people's do.\n\n"
 spn_memory.0005.desc.both:0 "You have always known what your parents are. You were told before you could walk. Knowing it and feeling it wake up inside you are not the same thing. Tonight it is awake, and it is warm, and it is patient."
 spn_memory.0005.desc.half:0 "Half of you came from something that is not human. The other half is. You can feel the line between them tonight, like a seam in cloth, and you cannot tell which side you are standing on."
 spn_memory.0005.a:0 "Whatever this is, it is mine"
 spn_memory.0005.b:0 "Tell no one"
 spn_memory.0005.c:0 "Ask [spn_demon_parent.GetTitledFirstName] what I am"
 spn_memory.0006.t:0 "Something in Their Blood"
 spn_memory.0006.desc.intro:0 "[spn_demon_child.GetTitledFirstName] is fourteen today. You find [spn_demon_child.GetHerHim] awake long after the candles are out, sitting very still, one hand flat against [spn_demon_child.GetHerHis] chest.\n\n"
 spn_memory.0006.desc.both:0 "[spn_demon_child.GetSheHe|U] has always known what [spn_demon_child.GetHerHis] parents are. Tonight [spn_demon_child.GetSheHe] is learning what that means from the inside. You remember the night it woke in you."
 spn_memory.0006.desc.half:0 "Half of [spn_demon_child.GetHerHim] is yours. Half of [spn_demon_child.GetHerHim] is not. Tonight [spn_demon_child.GetSheHe] can feel the line between them, and [spn_demon_child.GetSheHe] does not know which side [spn_demon_child.GetSheHe] is standing on. You do."
 spn_memory.0006.a:0 "Tell [spn_demon_child.GetHerHim] what [spn_demon_child.GetSheHe] is"
 spn_memory.0006.b:0 "Let it stay quiet a while longer"
 spn_memory.0007.t:0 "What the Word Meant"
 spn_memory.0007.desc.intro:0 "Thirty years ago you read the last page and closed the book, and the word for what you were changed.\n\n"
 spn_memory.0007.desc.mage:0 "You open the same book tonight and find that you still do not understand half of it. Mage. You thought the word was the end of the road. It was the first mile-marker."
 spn_memory.0007.desc.legendary:0 "You open the same book tonight and find that you wrote most of the notes in its margins. The word has changed again since then. People say it about you in rooms you have never entered. You thought Mage was the end of the road. It was the first mile-marker, and you are a long way past it now."
 spn_memory.0007.a:0 "There is more to read"
 spn_memory.0007.b:0 "Close the book"
