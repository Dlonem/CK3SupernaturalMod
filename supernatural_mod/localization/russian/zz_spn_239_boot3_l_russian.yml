l_russian:
 # Supernatural 2.39 -- Boot 3 (16 Oct; tool/pkgs/PB/HANDOFF.md §9). English first; the build copies these to the other
 # seven languages until they are translated.

 # The Hide Remembers (spn_vade.0099): a champion who has never heard of the book is told what it is.
 spn_vade.0099.t:0 "Шкура помнит"
 spn_vade.0099.desc:0 "Шкура будит тебя перед рассветом воспоминанием, которое тебе не принадлежит. Книга, переплетённая в то, что когда-то было живым, переходящая из рук в руки во тьме: справочник демона, [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')].\n\nКогда-то давно кто-то разорвал её на четыре части и разбросал страницы, чтобы никто и никогда не держал её целиком. Страницы всё ещё где-то там. Шкура знает их запах, и теперь знаешь и ты."
 spn_vade.0099.a:0 "Тогда мы не дадим ей попасть ни в чьи руки."

 # The Most Secret Spell (spn_order.0840), for a Magistratus whose own research found the edge of it.
 spn_order.0840.desc_research:0 "Твоя работа над глубинными искусствами завела тебя туда, куда [spn_order|E] никогда не собирался тебя пускать. Ты нашёл край заклинания, которому тебя никто не учил.\n\nСтарейший член [spn_gnostic_council|E] находит тебя прежде, чем ты его завершаешь. «Значит, ты сам нашёл [Glossary('Fors Factorum','spn_gloss_fors_factorum')]. Тогда уж произнеси его как следует. Несколько лет оно позволяет творить магию, не платя за неё».\n\n«А потом оно берёт свою цену с твоего тела, как рак. Ты всё ещё этого хочешь?»"

 # Invite into the Order (spn_order_invite_interaction).
 spn_order_invite_interaction:0 "Пригласить в Орден"
 spn_order_invite_interaction_desc:0 "Назови этого человека сам. Записка Ордена найдёт его, без подписи, так же, как находит всякого, кого выбирают храмы."
 spn_order_invite_interaction_tt:0 "Записка Ордена найдёт [recipient.GetFirstName]. Если [recipient.GetSheHe] ответит, то [recipient.GetSheHe] придёт в твой храм как [Glossary('Neophyte','spn_gloss_neophyte')]. Если нет, ты ничего не услышишь."
 spn_order_invite_free_tt:0 "[recipient.GetFirstName] должен быть свободен, чтобы ответить."

 # A Tale on the Road (spn_hide.0311): a player wolf near a shrine that keeps a hide.
 spn_hide.0311.t:0 "Сказ в дороге"
 spn_hide.0311.desc:0 "Трактирщик рассказывает эту историю всякому, кто поставит ему выпивку. [spn_shrine_faith.PriestNeuterPlural] из [spn_shrine_county.GetName] хранят за алтарём старую волчью шкуру, и в святые дни верующих пускают к ней прикоснуться. Некоторые клянутся, что она тёплая.\n\nОн смеётся, когда это говорит. Ты — нет."
 spn_hide.0311.a:0 "Запомнить это место."
 spn_hide.0311.a.tt:0 "Ты знаешь, где хранится шкура."

 # Zecchia's work, as the one she robbed sees it (spn_zecchia_rob_effect).
 spn_zecchia_victim_tt:0 "Это забрали ночью. Никто не видел, кто."
