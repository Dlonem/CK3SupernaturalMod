#Version Info Main
 spn_versioninfo.1000.t:0 "Supernatural: Version 2.42 Info"

 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.42#!\nFor CK3 1.21. Silk & Silver is not required. To support the mod, search #high "Dlonem"#! on YouTube\nand subscribe. Questions about the mod? Read the wiki:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.42: Merchants of the Night#!\n$BULLET_WITH_TAB$Demon merchants can settle a bad debt for the debtor's soul.\n$BULLET_WITH_TAB$New mansion rooms: The Second Ledger (demons), the Alchemist's Still (mages).\n$BULLET_WITH_TAB$Creature and hunter perks now give trade bonuses to merchants and republics.\n$BULLET_WITH_TAB$Adventurers get camp bonuses where a perk used to give them nothing.\n$BULLET_WITH_TAB$A werewolf's or hybrid's own trade routes ignore dangerous roads.\n$BULLET_WITH_TAB$Merchants can host the Feeding, the Gathering and the Hunt.\n$BULLET_WITH_TAB$Warlocks have their own pool of power and can Perform Magic Ritual.\n$BULLET_WITH_TAB$Blood for Blood: find the hunter who killed your kin, and answer it.\n$BULLET_WITH_TAB$A hunter's kills are no longer public. His renown now grows with each kill.\n$BULLET_WITH_TAB$Fifteen new events for vampires and hybrids, with choices for your traits.\n$BULLET_WITH_TAB$Fixes: Black Grimoire for Warlocks, aging traits and potions, Magic Triangulation."

 spn_versioninfo.1000.a:0 "Begin"
 spn_versioninfo.1000.a.tt:0 "Close this prompt and begin the game."
