l_english:
#Feed your blood to a Non-Vampire
 spn_offer_vampire_blood:0 "Offer Blood"
 spn_offer_vampire_blood_interaction_desc:0 "Attempt to offer your blood. If a Human were to consume your blood, they would experience some of it's many healing properties. This is the first step in creating a new Vampire."
 spn_msg_tooltip_confer_blood_vampirism_desc:0 "[THIS.GetCharacter.GetFirstName] will drink some of your blood, benefiting from its healing properties. However, there could be unforeseen consequences..."
 spn_offer_vampire_blood_hybrid_interaction_desc:0 "Attempt to offer your blood. Those who consume vampire blood will immediately experience its healing properties. However, non-humans may react differently, with results varying based on their nature."

#Turn Another Into a Vampire
 spn_turn_into_vampire:0 "Turn Vampire"
 spn_turn_into_vampire_interaction_desc:0 "Attempt to turn this person into a Vampire. The final step in creating a new Vampire is to end their life with the blood in their system."
 spn_msg_tooltip_confer_vampirism_desc:0 "[THIS.GetCharacter.GetFirstName]'s human life will end and they will become a [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 SPN_OFFER_VAMPIRISM_INTERACTION_NOTIFICATION:0 "I offer to my Blood unto you."

#Ask to be turned into Vampire
 SPN_ASK_FOR_VAMPIRISM_INTERACTION_NOTIFICATION:0 "I humbly ask that you turn me into a Vampire."
 spn_ask_to_turn_into_vampire:0 "Ask to be Turned"
 spn_ask_to_turn_into_vampire_interaction_desc:0 "Ask [recipient.GetShortUIName] to turn you into a [GetTrait('supernatural_vampire').GetName( recipient )]."
 spn_msg_tooltip_ask_vampirism_desc:0 "[recipient.GetShortUIName] will give [THIS.GetCharacter.GetFirstName] their blood, in the first step to becoming a [GetTrait('supernatural_vampire').GetName( THIS.Char )]. For the next step, [THIS.GetCharacter.GetFirstName] will be killed by [recipient.GetShortUIName] and become a [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 
#Ask to Not Be Turned Into Vampire
 SPN_ASK_FOR_NOT_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Please, I have changed my mind and don't wish to become a Vampire."
 spn_ask_to_not_turn_into_vampire:0 "Ask to Not be Turned"
 spn_msg_tooltip_ask_not_vampirism_desc:0 "[recipient.GetShortUIName] will not turn you into a [GetTrait('supernatural_vampire').GetName( THIS.Char )]. However, their blood is still in your body..."
 spn_ask_to_not_turn_into_vampire_interaction_desc:0 "You have changed your mind on this whole 'dying and coming back' proposition.. Maybe you can ask they don't kill you?"

#Offer Gift (begins werewolf turning incubation)
 spn_offer_gift:0 "Offer Gift"
 spn_offer_gift_interaction_desc:0 "Offer the gift of the curse - a deliberate wound from your claws - and begin their turning. Surviving the change is far from certain - a long, gruelling ordeal with no certain end - but those who endure it emerge as a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )]."
 spn_msg_tooltip_offer_gift_desc:0 "[THIS.GetCharacter.GetFirstName] accepts the gift and begins the long, dangerous turning into a [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."
 SPN_OFFER_GIFT_INTERACTION_NOTIFICATION:0 "I offer you my gift, and the change it brings."
 spn_msg_tooltip_confer_lycanthropy_desc:0 "[THIS.GetCharacter.GetFirstName] takes the risk and attempts to become a [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."

#Force Gift (forcibly begins werewolf turning incubation)
 spn_force_gift:0 "Force Gift"
 spn_force_gift_interaction_desc:0 "Rake your claws across them against their will. A werewolf's claws carry a deadly curse - many never survive the wound - yet it is also how the curse spreads, willing or not. Forced upon them, the change takes hold deep in the sickness, so their odds are grim and the ordeal drags on with no certain end. Should they survive, they emerge a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] - and they will not soon forgive the one who did this to them."
 spn_msg_tooltip_force_gift_desc:0 "[THIS.GetCharacter.GetFirstName] is clawed by force, and a violent, uncertain turning into a [GetTrait('supernatural_werewolf').GetName( THIS.Char )] takes hold."
 spn_physical_contact_custom:0 "This option requires physical contact"
 spn_target_not_already_wounded_custom:0 "They are not already enduring an infected wound"
 spn_force_gift_not_on_cooldown_custom:0 "You have not forced the gift too recently"

#Werewolf wound lineage relations & opinions
 ww_clawed_by:0 "Clawed By"
 ww_clawed:0 "Clawed"
 spn_grateful_for_gift:0 "Granted me the gift of the curse"
 spn_resents_forced_gift:0 "Forced the curse upon me"
 spn_forcibly_clawed_opinion:0 "Clawed me against my will"

#Offer Gift acceptance reasons (do they want it / risk death)
 spn_ai_accept_bold_tt:0 "They are bold enough to want this: $VALUE|=+0$"
 spn_ai_accept_ambitious_tt:0 "They hunger for the power it would bring: $VALUE|=+0$"
 spn_ai_accept_reveler_tt:0 "They are reckless enough to be tempted: $VALUE|=+0$"
 spn_ai_accept_craven_tt:0 "They are far too fearful to risk death: $VALUE|=+0$"
 spn_ai_accept_content_tt:0 "They are content with the life they already have: $VALUE|=+0$"
 spn_ai_accept_paranoid_tt:0 "They are too suspicious to trust such an offer: $VALUE|=+0$"
