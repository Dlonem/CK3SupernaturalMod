l_english:
 # Supernatural 2.39 -- the Boot 1 fixes (16 Oct; tool/pkgs/PB/HANDOFF.md).
 # A requirement written with custom_description is printed in its NOT_ form when it fails in a failures-only list
 # (vanilla does the same: pam_character_interactions_l_english.yml, NOT_buy_ecclesiastical_title_...). These nine (seven
 # interactions, two decisions) had no NOT_ form, so a failing one printed "BUG: missing localization" (Thomas's 16 Oct
 # log, Compel Mortal's reach). Those that read the same either way point at their own text, so every language shows its
 # own translation.
 NOT_invoke_bond_requires_vampiric_strength:0 "$invoke_bond_requires_vampiric_strength$"
 NOT_spn_already_in_hunter_training_custom:0 "$spn_already_in_hunter_training_custom$"
 NOT_spn_compel_range_gate_tt:0 "$spn_compel_range_gate_tt$"
 NOT_spn_force_gift_not_on_cooldown_custom:0 "You have forced the gift too recently"
 NOT_spn_hunter_too_young_custom:0 "$spn_hunter_too_young_custom$"
 NOT_spn_mind_guarded_custom:0 "$spn_mind_guarded_custom$"
 NOT_spn_refused_hunter_training_custom:0 "$spn_refused_hunter_training_custom$"
 # The same in two decisions' failures-only lists (Call a secret Gnostic Council meeting; Break the Chains).
 NOT_spn_council_seats_distinct_tt:0 "Someone on the Gnostic Council holds two seats"
 NOT_spn_held_in_chains_custom:0 "$spn_held_in_chains_custom$"
 # And twelve more found by the morning sweep (16 Oct): the requirements of Compel Mortal's orders (a send option's
 # is_valid fails the same way, as vanilla's own NOT_ keys for its send options show) and the Hunt's start window.
