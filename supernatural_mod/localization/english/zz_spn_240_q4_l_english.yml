l_english:
 # Supernatural 2.40 (WORK-ORDER-2.40, package Q4): the Fors Factorum, the Elemental Transference, the page hunt, the Ringing.

 # ---- G5 the Fors Factorum ----
 spn_order_fors_relic_tt:0 "The Fors Factorum letter is yours, or kept in your temple's Reliquary"
 spn_order_fors_no_cancer_tt:0 "The spell will not take a body that already carries its price"
 spn_order_fors_recast_cd_tt:0 "You have not cast it in the last five years"
 spn_order_fors_broken_tt:0 "The Fors Factorum ends with the cancer."
 spn_order.0840.a.tt:0 "For two to five years your spells cost you no power. Then the cancer comes, once. While it is in your body your spells stay free, and if it is ever cured, the spell ends with it."
 spn_order.2201.t:0 "The Spell Is Broken"
 spn_order.2201.desc:0 "The cancer is gone, and the [spn_order_fors_factorum|E] went with it. Your spells will cost you again.\n\nYou could cast it again, and pay again."
 spn_order.2201.a:0 "So be it"
 spn_order.2201.a.tt:0 "You may cast it again five years after you last cast it."
 spn_order.0824.desc_fors:0 "\n\nThe cancer was the price of the [spn_order_fors_factorum|E]. It is gone, and the spell went with it."
 spn_order.0828.desc_fors:0 "\n\nThe cancer is back. The [spn_order_fors_factorum|E] is not."

 # ---- B7 + G6 the Elemental Transference ----
 spn_order.0815.t_sister:0 "A Sister Is Dying"
 spn_order.0815.b.tt:0 "[spn_tr_asker.GetFirstName] will not ask the temple again for five years."
 spn_order_toast_masks_heal:0 "The Masks Began a Working"
 spn_order_transference_refused_tt:0 "Your Temple Magus has not refused you in the last five years"
 spn_order.0820.a.tt:0 "You carry it this time. The temple will not ask you again."
 spn_order.0820.willing:0 "Take my blood, and ask me whenever the temple needs it"
 spn_order.0820.willing.tt:0 "You carry it this time, and the temple will ask you again whenever it needs blood."
 spn_order.0820.c.tt:0 "The temple will not ask you again."
 spn_order.0823.desc_town:0 "\n\nNot all of them are of the temple. Some are townsfolk who came for their families' sake, and their families have been paid."
 spn_order.0824.desc_paid:0 "\n\nSome of the five are townsfolk. You paid their families for what they carry."
 spn_transference_paid_opinion:0 "Paid for a Kinsman's Part"
 spn_transference_string:0 "The people named below carry a part of your [Story.Custom('spn_TransferenceDisease')] for you, a fifth each. If one of them is killed before the year [Story.MakeScope.Var('spn_tr_until').GetValue|0], it comes back to you."
 spn_transference_mirror_string:0 "You moved an illness, [Story.Custom('spn_TransferenceDisease')], into the people named below. If one of them is killed before the year [Story.MakeScope.Var('spn_tr_until').GetValue|0], the Working unravels and the illness goes back."
 SPN_TR_CASTER:0 "Worked By"
 SPN_TR_CARRIERS:0 "They Carry It"
 SPN_TR_PATIENT:0 "Healed"
 spn_tr_disease_cancer:0 "cancer"
 spn_tr_disease_consumption:0 "consumption"
 spn_tr_disease_leper:0 "leprosy"
 spn_tr_disease_great_pox:0 "great pox"
 spn_tr_disease_blue_fever:0 "Blue Fever"
 spn_tr_disease_infirm:0 "infirmity"
 spn_tr_disease_fragile_bones:0 "fragile bones"
 spn_tr_disease_typhus:0 "typhus"
 spn_tr_disease_bubonic_plague:0 "plague"
 spn_tr_disease_smallpox:0 "smallpox"
 spn_tr_disease_pneumonic:0 "pneumonia"
 spn_tr_disease_dysentery:0 "bloody flux"
 spn_tr_disease_measles:0 "measles"
 spn_tr_disease_ill:0 "illness"

 # ---- B3 + B4 + G10 the page hunt ----
 spn_vade.0100.desc_oath:0 "\n\nThe wolves who wore this skin before you swore that the book would never be used again. The hide still keeps that oath, and now it is asking you to keep it."
 spn_vade.0100.desc_silverback:0 "\n\nSilverback has guarded a page before. It remembers what the book did to the people who read it."
 spn_vade.0100.desc_timber:0 "\n\nTimber wants the page buried in the deep woods, where no one will ever dig it up."
 spn_vade.0100.desc_tundra:0 "\n\nTundra is patient. It will wait as long as it takes, but it will not let the page go."
 spn_vade.0100.desc_graybeard:0 "\n\nGraybeard has seen what people become when they hold the book, and it will not see it again."
 spn_vade.0100.desc_midnight:0 "\n\nMidnight hates the book more than it hates hunters."
 spn_vade.0100.desc_alpha:0 "\n\nAlpha wants the pack to find it before anyone else does."
 spn_vade.0100.a.tt:0 "You now hold a claim on what [spn_vade_heard_holder.GetFirstName] keeps of the book. The hide will lead you to [spn_vade_heard_holder.GetHerHim]."
 spn_vade.2000.t:0 "A Name in Your Notes"
 spn_vade.2000.desc:0 "Your research has taken you somewhere you did not mean to go. Three old sources, in three different hands, describe the same book: the [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')], a demon's handbook torn apart long ago.\n\nThe newest of them names who has part of it now: [spn_named_holder.GetTitledFirstName]."
 spn_vade.2000.desc_none:0 "Your research has taken you somewhere you did not mean to go. Three old sources, in three different hands, describe the same book: the [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')], a demon's handbook torn apart long ago.\n\nNone of them can tell you where any part of it is now."
 spn_vade.2000.a:0 "Now I know where it is"
 spn_vade.2000.a.tt:0 "You hold a claim on what [spn_named_holder.GetFirstName] keeps of the book. You can try to steal it back or go to war for it."
 spn_vade.2000.b:0 "Now I know what it is"
 spn_vade.2001.t:0 "The Trail Ends at [spn_vade_heard_holder.GetFirstName]'s Door"
 spn_vade.2001.desc:0 "The hide has led you as far as it can. [spn_vade_heard_holder.GetTitledFirstName] keeps what [spn_vade_heard_holder.GetSheHe] has of the book behind locked doors, and does not know that a wolf has been watching the house for a week.\n\nThe hide wants it out of [spn_vade_heard_holder.GetHerHis] hands. How is up to you."
 spn_vade.2001.a:0 "We will watch it"
 spn_vade.2001.a.tt:0 "You keep your claim on it. You can try to steal it back or go to war for it."
 spn_vade.2001.b:0 "Take it tonight"
 spn_vade.2001.b.tt:0 "You go yourself, by night, with the wolf close under your skin. If you are seen, [spn_vade_heard_holder.GetFirstName] will know someone came for it, and the county will remember a wolf."
 spn_vade.2001.b.success:0 "You came out of the dark with it, and nobody saw you go."
 spn_vade.2001.b.failure:0 "Someone saw you. You ran, and it stayed where it was."
 spn_vade.2001.c:0 "Send the pack"
 spn_vade.2001.c.tt:0 "[spn_vt_wolf.GetFirstName] goes in your place. If it goes wrong, [spn_vt_wolf.GetSheHe] pays for it, not you."
 spn_vade.2001.c.success:0 "The pack brings it to you before dawn."
 spn_vade.2001.c.failure:0 "[spn_vt_wolf.GetFirstName] comes back bleeding and empty-handed."
 spn_vade.2001.d:0 "Tell the temple"
 spn_vade.2001.d.tt:0 "Your [spn_temple_magus|E] learns who holds it, and remembers who told."
 spn_relic_war_page_tt:0 "Holds part of the [spn_vade_maecum|E]"

 # ---- B8 the Ringing ----
 spn_ev4.0.desc_book:0 "\n\nUnder the ringing there is something else, faint and old: the smell of the book. Whoever is casting holds part of the [spn_vade_maecum|E]."
 spn_ev4.0.silence:0 "Let it ring for [magic_user.GetShortUIName] no more."
 spn_ev4.0.silence.tt:0 "You will no longer hear magic worked by [magic_user.GetShortUIName]. The hide does not forget them, and you can choose to listen again."
 spn_ringing_listen_decision:0 "Listen Again"
 spn_ringing_listen_decision_desc:0 "You told the hide to let the Ringing go quiet for some of those who cast near you. You can open your ears to them again."
 spn_ringing_listen_decision_tooltip:0 "Hear the Ringing again for everyone you silenced."
 spn_ringing_listen_decision_confirm:0 "Listen"
 spn_ringing_listen_decision_effect_tt:0 "You will hear the Ringing again for everyone you silenced."
 spn_vade_claim_given_tt:0 "You will hold a claim on what they keep of the book, and can try to steal it back or go to war for it."
 spn_vade.0512.relic_claim_tt:0 "You will hold a claim on the relic, and can try to steal it back or go to war for it."
 spn_ev4.0.ring.book.tt:0 "You will know who holds part of the book, and hold a claim on it."
