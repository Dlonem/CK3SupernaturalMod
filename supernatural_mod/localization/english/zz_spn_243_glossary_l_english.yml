l_english:
 # Supernatural 2.43 -- the voice in the blood. The thirst speaks Latin and the wolf Old Norse, each in its own colour
 # (gui/preload/zz_spn_textformatting.gui), with the meaning on hover as the Order's Latin has it (zz_spn_239_glossary).
 # Thomas, 23 Nov: real old tongues, nothing invented.
 spn_gloss_thirst_paulum:0 "#bold Tam paulum. Nemo desiderabit.#! - Latin, #EMP So little. Nobody will miss it.#!"
 spn_gloss_thirst_bibe:0 "#bold Bibe.#! - Latin, #EMP Drink.#!"
 spn_gloss_wolf_hlaup:0 "#bold Hlaup.#! - Old Norse, #EMP Run.#!"
 spn_gloss_thirst_omnes:0 "#bold Omnes. Quemlibet.#! - Latin, #EMP All of them. Any of them.#!"
 spn_gloss_thirst_haustus:0 "#bold Haustus unus. Ne expergisceretur quidem.#! - Latin, #EMP One mouthful. They would not even wake.#!"
 spn_gloss_thirst_gustum:0 "#bold Gustum modo.#! - Latin, #EMP Just a taste.#!"
 spn_gloss_thirst_nunc:0 "#bold Nunc.#! - Latin, #EMP Now.#!"
 spn_gloss_thirst_noster:0 "#bold Noster.#! - Latin, #EMP Ours.#!"
 spn_gloss_thirst_nusquam:0 "#bold Nusquam.#! - Latin, #EMP Nowhere.#!"
 spn_gloss_wolf_bratt:0 "#bold Brátt.#! - Old Norse, #EMP Soon.#!"
 spn_gloss_wolf_einn:0 "#bold Eigi einn.#! - Old Norse, #EMP Not alone.#!"
 spn_gloss_wolf_that:0 "#bold Eigi þat.#! - Old Norse, #EMP Not that.#!"
