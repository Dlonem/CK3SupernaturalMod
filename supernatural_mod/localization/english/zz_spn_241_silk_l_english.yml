l_english:
 # Supernatural 2.41 -- Silk & Silver (CK3 1.21).

 # Fear (zz_spn_241_fear_modifiers.txt)
 spn_menace_fear_1_modifier:0 "Uneasy Nights"
 spn_menace_fear_1_modifier_desc:0 "Something took someone here. People keep to their homes after dark and listen less to their lord. It fades a year after the last time, sooner if a hunter ends it."
 spn_menace_fear_2_modifier:0 "Afraid of the Dark"
 spn_menace_fear_2_modifier_desc:0 "It has happened more than once now. Doors are barred at sundown and the watch finds excuses. It fades a year after the last time, sooner if a hunter ends it."
 spn_menace_fear_3_modifier:0 "A Town Living in Fear"
 spn_menace_fear_3_modifier_desc:0 "Whatever is hunting here keeps coming back, and the county has stopped believing its lord can stop it. It fades a year after the last time, sooner if a hunter ends it."

 # The menace in the market (zz_spn_241_silk_modifiers.txt)
 spn_menace_market_vampire_modifier:0 "Empty Streets After Dark"
 spn_menace_market_vampire_modifier_desc:0 "Nobody stays out late in a town where people go missing at night. The taverns and the finer shops feel it first."
 spn_menace_market_werewolf_modifier:0 "Wolves on the Roads"
 spn_menace_market_werewolf_modifier_desc:0 "Carters are being found in pieces on the roads around this market. Fewer come, and those who do charge more."
 spn_menace_market_demon_modifier:0 "Spoiled Stores"
 spn_menace_market_demon_modifier_desc:0 "Grain rots in sealed bins and milk turns in the pail. Whatever is loose here spoils what people live on."
 spn_menace_market_witch_modifier:0 "A Failed Harvest"
 spn_menace_market_witch_modifier_desc:0 "The fields around this market came up thin and blighted, and the farmers say they know why."
 spn_menace_road_modifier:0 "Dangerous Road"
 spn_menace_road_modifier_desc:0 "This route runs through country where something has been killing travellers. Fewer caravans make the trip."
 spn_doge_rumours_modifier:0 "The Ruler Who Does Not Age"
 spn_doge_rumours_modifier_desc:0 "The city talks about a ruler who looks no older than the day he took power."

 # A trader feeds on the road (zz_spn_241_silk_effects.txt)
 spn_silk_trader_fed_toast:0 "Fed on the Road"
 spn_silk_trader_fed_toast_tt:0 "Far from home and from anyone who knows your face, you found someone in the market town."

 # Collect in Blood (zz_spn_241_silk_interactions.txt)
 spn_collect_in_blood_interaction:0 "Collect in Blood"
 spn_collect_in_blood_interaction_desc:0 "[recipient.GetShortUIName] has already refused to pay what [recipient.GetSheHe] owes you. There are other ways to settle a debt."
 spn_collect_in_blood_refused_tt:0 "[recipient.GetShortUIName] must have refused to repay you at least once"
 spn_collect_in_blood_interaction_tt:0 "You will decide how the debt is settled"

 # Compelled commands (zz_spn_241_silk_interactions.txt)
 spn_compel_charter_interaction:0 "Grant Me a Charter"
 spn_compel_charter_interaction_desc:0 "Have your Compelled [puppet|E], who is your patron, grant your company a charter."
 spn_compel_charter_already_tt:0 "You already hold a charter from your patron"
 puppet_action_description_puppet_action_spn_compel_charter:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_charter_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] grant you a charter"
 spn_compel_vote_interaction:0 "Vote As I Do"
 spn_compel_vote_interaction_desc:0 "Your Compelled [puppet|E] will vote as you do for the next year."
 spn_compel_vote_already_tt:0 "Someone else already decides how they vote"
 puppet_action_description_puppet_action_spn_compel_vote:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_vote_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] vote as you do"

 # The vault (zz_spn_241_vault_buildings.txt)
 spn_merchant_vault_01_domicile_building:0 "Old Vault"
 spn_merchant_vault_01_domicile_building_desc:0 "A strongroom below the house, older than the house above it. Some of what is down here was bought with coin nobody has minted in a long time."
 spn_merchant_vault_02_domicile_building:0 "Deep Vault"
 spn_merchant_vault_02_domicile_building_desc:0 "A second room behind the first, and a stair few of the household know about."
 spn_merchant_vault_03_domicile_building:0 "Hoard of Ages"
 spn_merchant_vault_03_domicile_building_desc:0 "What one patient family can put away over a very long time."
 spn_merchant_vault_age_70_tt:0 "Must be at least 70 years old"
 spn_merchant_vault_age_120_tt:0 "Must be at least 120 years old"

 # The hunt's silver (supernatural_hunt.txt)
 spn_hunt_prep_silver_plentiful:0 "Silver is plentiful in the local market"
 spn_hunt_prep_silver_scarce:0 "Silver is scarce in the local market"

 # Events (zz_spn_241_silk_events.txt)
 spn_silk.0001.t:0 "The Doge Who Does Not Age"
 spn_silk.0001.desc:0 "A clerk who has served the house for thirty years remarked today, in front of others, that I look exactly as I did when he was hired. Someone laughed. Then nobody did.\n\nPeople have started counting."
 spn_silk.0001.a:0 "I will speak to each of them myself."
 spn_silk.0001.b:0 "Commission a portrait of my late father. The likeness will settle it."
 spn_silk.0001.c:0 "Let them talk. Talk is cheap."
 spn_silk.0030.t:0 "Behind the Volto"
 spn_silk.0030.desc:0 "Every face in the square is painted, gilded or hidden. Nobody knows who anyone is tonight, and nobody wants to.\n\nA reveller in a white mask has been at my elbow for an hour. Now [spn_cv_meal.GetSheHe] takes my hand and nods toward the dark of a side street."
 spn_silk.0030.a:0 "Follow [spn_cv_meal.GetHerHim]."
 spn_silk.0030.b:0 "Not tonight. I came to dance."
 spn_wolf_pelt_curio_name:0 "Pelt of [spn_pelt_wolf.GetFirstName]"
 spn_wolf_pelt_curio_desc:0 "The hide of the wolf that was [spn_pelt_wolf.GetFullName]. Guests ask about it, then stop asking and stand a little further from the wall."
 spn_wolf_pelt_curio_modifier:0 "A Wolf on the Wall"
 spn_hunt_delivered_modifier:0 "The Hunt Delivered"
 spn_hunt_delivered_modifier_desc:0 "Something was taking people here, and it was hunted down. The county knows who sent the hunter."
 spn_silk.0010.t:0 "Collect in Blood"
 spn_silk.0010.desc:0 "[spn_cib_debtor.GetFirstName] has had every chance to pay. Letters, reminders, patience. Tonight I am done being patient, and [spn_cib_debtor.GetSheHe] is about to learn that I take payment in more than one currency."
 spn_silk.0010.a:0 "From [spn_cib_debtor.GetHerHis] own veins."
 spn_silk.0010.b:0 "Someone in [spn_cib_debtor.GetHerHis] household will do."
 spn_silk.0010.c:0 "Look at me. You will pay what you owe."
 spn_silk.0010.d:0 "Not tonight."
 spn_silk.0020.t:0 "Something Old in the Vault"
 spn_silk.0020.desc:0 "Our artisans were cataloguing the deep vault when one of them brought me a piece I had not looked at in a very long time. I bought it from a man whose name I have forgotten, in a city that has since burned.\n\nThe symbols on it are the Order's. I am sure of it now."
 spn_silk.0020.a:0 "I always knew it was worth keeping."
