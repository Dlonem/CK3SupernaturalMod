l_english:
 # Supernatural 2.38a: the mod names vanilla's first interaction menu (moved here from 10_spn_character_interactions_l_english.yml,
 # because vanilla defines the same key and a replace file is the way to change it without a duplicate).
 interaction_category_favorites:0 "Supernatural"
 # Supernatural 2.39 (WORK-ORDER-2.39 F12, D-I1): Witchcraft's council support is Imperium, whichever road gave it (a vote of
 # the council, or Extraordinary Measures in a world crisis). The Ultimate Spell's council line reads this key too.
 mage_council_support_modifier:0 "Imperium"
 mage_council_support_modifier_desc:0 "Emergency authority, given by the Gnostic Council. While it lasts, the Grand Magus acts without waiting for the council's word."
 # Supernatural 2.40 (WORK-ORDER-2.40 G2): the Chancellor only recommends the reveal; the Grand Magus decides.
 ev10.90.b:0 "I recommend that the Council reveal itself to the world."
 # Supernatural 2.40 (WORK-ORDER-2.40 B10): Witchcraft's marker that an act counts as black magic. It never meant the
 # Black Grimoire was needed; it is printed by mark_as_black_magic_caster_effect and at 17 option sites.
 use_magic_custom_tooltip:0 "This is black magic"
