 spn_debug_events.0200.t:0 "The Census"
 spn_debug_events.0200.desc:0 "#high What the hunting layer is actually running on.#!\n\n#high Trails#! (counties carrying Something Stalks Here): #P [spn_census.MakeScope.Var('spn_dbg_trails').GetValue|0]#!\n#high Warm#! (culprit still alive – the only ones a hunt can use): #P [spn_census.MakeScope.Var('spn_dbg_warm').GetValue|0]#!\n#high Witch trails#! (what a Witch Hunt can be pointed at): #P [spn_census.MakeScope.Var('spn_dbg_witch').GetValue|0]#!\n\n#high Hunters in the world#!: #P [spn_census.MakeScope.Var('spn_dbg_hunters').GetValue|0]#!\n#high Creatures#! (vampire, werewolf, hybrid, demon): #P [spn_census.MakeScope.Var('spn_dbg_creature').GetValue|0]#!\n#high Witches#! (the trait, on a ruler): #P [spn_census.MakeScope.Var('spn_dbg_witches').GetValue|0]#!\n\n#high You yourself#! -- the on_death writer's door opens for a creature, or a witch by trait OR by secret. 1 means yes.\n#high  ... a creature#!: #P [spn_census.MakeScope.Var('spn_dbg_self_creature').GetValue|0]#!\n#high  ... a witch, openly or in secret#!: #P [spn_census.MakeScope.Var('spn_dbg_self_witch').GetValue|0]#!\n\n#high Hunts running right now#! (world cap is 6): #P [spn_census.MakeScope.Var('spn_dbg_running').GetValue|0]#!\n\nTrails at 0 after years of play means nothing is writing marks, and no roll anywhere will help. Warm well below Trails means the culprits are dying of other things. Witch trails at 0 with Witches above 0 means witches are not killing anyone the county can find."
 spn_debug_events.0200.a:0 "Close"
