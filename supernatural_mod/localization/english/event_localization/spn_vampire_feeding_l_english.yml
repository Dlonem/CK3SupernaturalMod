l_english:
 vampire_feeding:0 "Feeding"
 vampire_feeding_desc:0 "It has been awhile since the last time you have fed, go out into a local town and find someone to feed upon."
 vampire_feeding_host_desc:0 "$BULLET_WITH_TAB$Vampires may gain [prestige|E]\n$BULLET_WITH_TAB$Vampires may gain [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Vampires may gain [gold|E]\n$BULLET_WITH_TAB$Vampires may gain knowledge and skills\n"
 vampire_feeding_guest_desc:0 "$BULLET_WITH_TAB$Vampires may gain [prestige|E]\n$BULLET_WITH_TAB$Vampires may gain [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Vampires may gain [gold|E]\n$BULLET_WITH_TAB$Vampires may gain knowledge and skills\n"
 vampire_feeding_selection_tooltip:0 "Go and find a human to feed upon and increase your strength."
 vampire_feeding_destination_selection:0 ""
 vampire_feeding_province_desc:0 "This is a suitable place to find someone to feed upon."
 vampire_feeding_predicted_cost:0 "You will need to spend some gold in order to blend in."
 vampire_feeding_guest_help_text:0 "Feeding alone will be more satiating, but feeding with other Vampires can increase safety."
 vampire_feeding_host_an_a:0 "a Vampire"
 known_vampire_feed:0 "You will have a more difficult time feeding as a [GetTrait('spn_known_vampire').GetName( GetNullCharacter )]"
 known_hybrid_feed:0 "You will have a more difficult time feeding as a [GetTrait('spn_known_hybrid').GetName( GetNullCharacter )]"
 
 #Activity Intents
 strengthen_the_blood_intent:0 "Strengthen the Blood"
 strengthen_the_blood_intent_desc:0 "Feed with the intent of enhancing your vampiric powers, advancing your [Concept('vampire','Vampirism')|E] to unlock greater strength and control over your abilities."
 satiate_thirst_intent:0 "Satiate Thirst"
 satiate_thirst_intent_desc:0 "Feed to maintain balance and control over your volatile state, easing the [stress|E] that gnawing hunger inflicts on your mind and body."
 embrace_the_night_intent:0 "Embrace the Night"
 embrace_the_night_intent_desc:0 "Feed with the intent to revel in the thrill of the night. Indulge in your immortality, lose yourself in the moment, and let the night's wild energy wash away your [stress|E], earning [prestige|E] for your indulgence."

 #Phases
 searching_phase:0 "Search"
 searching_phase_desc:0 "Hunt for the perfect prey in the shadows."
 feeding_phase:0 "Feeding"
 feeding_phase_desc:0 "Satisfy your hunger and embrace the night."
 
 #Guest Invites
 activity_invite_rule_vampires:0 "Vampires"
 activity_invite_rule_vampires_desc:0 "Vampires you could plausibly know for what they are: those who carry it openly, those whose secret you keep, your spouse and close family, and your own sire or progeny."
 activity_invite_rule_supernatural_mp:0 "Supernatural Players"
 activity_invite_rule_supernatural_mp_desc:0 "Other players who share your condition, filtered by the same test: you must have some way of knowing what they are."
 activity_invite_rule_hybrids:0 "Hybrids"
 activity_invite_rule_hybrids_desc:0 "Hybrids under the same rule — known to you by trait, by secret, by blood, or by having made you what you are."
 
 #Activity Options
 options_preparations:0 "Preparations"
 preparations_option_instinct:0 "Vampire Instincts"
 preparations_option_instinct_desc:0 "Rely on your instincts and prowl the area in search of an easy, isolated target.\n\nYou make no special preparations and spend no [gold|E]—you simply improvise when the moment to feed arrives."
 preparations_option_scout:0 "Scout the City"
 preparations_option_scout_desc:0 "Spend time reconnoitering to find the safest and most suitable locations for feeding.\n\nReveals a safer, more deliberate approach to use during the feeding, for a cleaner kill and steadier growth in power." 
 preparations_option_trap:0 "Ambush"
 preparations_option_trap_desc:0 "Use subterfuge to lure prime targets to your chosen feeding ground, ensuring everything is perfectly set for your needs.\n\n#high Greatly#! improves your approach during the feeding—the surest path to a clean, rewarding kill—though it costs [gold|E]."
 options_spoils:0 "Spoils"
 spoils_option_dead_respect:0 "Respect the Dead"
 spoils_option_dead_respect_desc:0 "Show reverence for those who have perished by refusing to rob them of their possessions.\n\nGain [piety|E] for your restraint and honor among those who value such principles."
 spoils_option_robbing:0 "Take What You Need"
 spoils_option_robbing_desc:0 "Disguise your feeding as an unfortunate robbery. \n\nBy pilfering the pockets of your victim, you gain a little extra [gold|E] to help you endure the centuries ahead. \n\nShould things go awry, it might even appear as a simple robbery gone wrong. \n\nThe spoils are claimed when you close in for the feed."
 spoils_option_casing:0 "Target the Wealthy"
 spoils_option_casing_desc:0 "Carefully target your victims to identify a high-value target. Their blood promises to be flavorful, and their pockets even more full.\n\nTheir fuller purse yields far more [gold|E]—claimed when you finally close in for the kill."

 #Activity Conclusion
 vampire_feeding_conclusion_desc:0 "The [GetActivityType( 'vampire_feeding' ).GetName] has concluded."
 supernatural_ev1.24.title:0 "Reveling in the Night"
 supernatural_ev1.24.desc:0 "The city comes alive after dark—music, laughter, and the warm press of mortal crowds. For one night you are not a monster stalking the shadows, but a creature of appetite reveling in them. You could lose yourself entirely, or savor the thrill while keeping your guard."
 supernatural_ev1.24.a:0 "Lose yourself in the revelry."
 supernatural_ev1.24.a_tt:0 "Gain [prestige|E] and shed [stress|E]. The arrogant revel hardest; the temperate are unsettled by such indulgence."
 supernatural_ev1.24.b:0 "Indulge, but keep your wits about you."
 supernatural_ev1.24.b_tt:0 "Enjoy the night while staying watchful. Gain a little [prestige|E] and ease your [stress|E]; the paranoid rest easier for the caution."

 supernatural_ev1.23.botched:0 "Slip away into the night."
 supernatural_ev1.23.botched_tt:0 "The feeding went wrong and a witness survives. Take the stress, vanish, and pray word of what you are does not spread."
 supernatural_ev1.23.desc_botched:0 "It goes wrong. A scream, a dropped lantern, a face that saw too much before you could finish. The street is waking and you still stand over the body — you must get away, and hope word of what you are does not outlive the night."
 supernatural_ev1.23.botched_silence:0 "Silence the witness — permanently."
 supernatural_ev1.23.botched_silence_tt:0 "Kill the one who saw you. No exposure — but a body in the street and blood on your hands, and a real Hunter may still take notice. The callous barely flinch; the kind are haunted."
 supernatural_ev1.23.botched_flee:0 "Flee into the night."
 supernatural_ev1.23.botched_flee_tt:0 "Vanish now and let them babble. You escape, but a living witness means word of your nature is likely to spread — and a Hunter in the city may hear it."
 supernatural_ev1.23.botched_compel:0 "Compel them to forget."
 supernatural_ev1.23.botched_compel_tt:0 "Seize their mind and wipe the memory clean. Far more reliable with true mastery (the Compulsion perk or deep track XP); should it fail, they slip away — and your secret with them."
