l_english:

 #################################################
 # Supernatural 2.36 -- the Trailsman
 #################################################

 spn_trailsman_court_position:0 "Trailsman"
 spn_trailsman_court_position_desc:0 "The $spn_trailsman_court_position$ walks your counties and reads what has been left in them. Bodies found at the edge of a village, herds taken in a way no wolf takes them, a road nobody will use after dark - he goes and looks, and he comes back and tells you where. A good one comes back with a name."
 spn_trailsman_camp_officer:0 "Trailsman"
 spn_trailsman_camp_officer_desc:0 "The $spn_trailsman_camp_officer$ walks ahead of the camp and reads the ground you are about to sleep on. He has no lands to patrol and no priest to ask, only the county you are standing in and the ones beside it - which is usually enough, because a creature that has been feeding does not hide it well."

 spn_trailsman_aptitude_hunter:0 "#D Has hunted one before#!"
 spn_trailsman_aptitude_witch_hunter:0 "#D Has hunted witches#!"
 spn_trailsman_aptitude_lifestyle_hunter:0 "#D Hunter#!"
 spn_trailsman_aptitude_patient:0 "#D Patient#!"
 spn_trailsman_aptitude_athletic:0 "#D Athletic#!"
 spn_trailsman_aptitude_creature:0 "#D Is one of them#!"

 spn_trailsman_task_read_the_countryside:0 "Read the Countryside"
 spn_trailsman_task_read_the_countryside_desc:0 "Your $spn_trailsman_court_position$ walks the ground looking for a [spn_menace|E] you have not been told about yet. Your own priests will only write to you once a county has lost three people; he goes before that."
 spn_trailsman_task_read_the_countryside_tt:0 "Every year your $spn_trailsman_court_position$ has a chance of finding a county that carries a [spn_menace|E] and telling you which one.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_follow_the_trail:0 "Follow the Trail"
 spn_trailsman_task_follow_the_trail_desc:0 "Your $spn_trailsman_court_position$ stops looking for places and starts looking for the thing that made them. Slower, dearer, and the only way to put a face to a [spn_menace|E] short of hunting it yourself."
 spn_trailsman_task_follow_the_trail_tt:0 "Every year your $spn_trailsman_court_position$ has a chance of naming the creature behind a [spn_menace|E] in your lands, revealing its secret to you.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_beat_the_bounds:0 "Beat the Bounds"
 spn_trailsman_task_beat_the_bounds_desc:0 "Your $spn_trailsman_court_position$ stops hunting and starts patrolling. The roads are watched, the woods are walked, and the villages calm down - which is worth more than a report in a year when nothing is out there."
 spn_trailsman_task_beat_the_bounds_tt:0 "Your counties gain [county_opinion|E] and recover [county_control|E] faster. Finds nothing.\n$spn_trailsman_task_generic_tt$"

 spn_trailsman_task_generic_tt:0 "How often he succeeds rises with his [aptitude|E]."

 #################################################
 # Word from the Trailsman
 #################################################
 spn_hunt.0400.t:0 "Word from the Trailsman"
 spn_hunt.0400.desc:0 "[spn_trailsman.GetTitledFirstName] has been gone eleven days and comes back muddy to the knee. He does not sit down. \"[spn_menace_county.GetName],\" he says. \"They have lost people. They are not saying how many, and they will not go out past the last house after dark.\" He waits, because he knows you will ask, and then he tells you he does not know what it is - only that something is there and it has not finished."
 spn_hunt.0400.desc_vampire:0 "[spn_trailsman.GetTitledFirstName] has been gone eleven days and comes back muddy to the knee. He does not sit down. \"[spn_menace_county.GetName],\" he says. \"Two found at the treeline, one in his own yard. No blood in any of them and no blood on the ground either.\" He does not know what that means. You do. It is feeding there, and it is being careful about where it leaves them."
 spn_hunt.0400.desc_werewolf:0 "[spn_trailsman.GetTitledFirstName] has been gone eleven days and comes back muddy to the knee. He does not sit down. \"[spn_menace_county.GetName],\" he says. \"Sheep gone out of a closed fold. A man torn open in the road and not eaten.\" He calls it a bad winter for wolves. You have seen what a wolf does to a fold, and it does not look like that."
 spn_hunt.0400.a:0 "So that is where it is"
 spn_hunt.0400.a.tt:0 "[spn_menace_county.GetName] carries a [spn_menace|E]. You know where to look now."
 spn_hunt.0400.b:0 "Then I will go and see it myself"
 spn_hunt.0400.b.tt:0 "[spn_menace_county.GetName] is a valid county for a $supernatural_hunt$ while the trail is warm."
 spn_hunt.0400.c:0 "He is paid to walk - let him keep walking"
 spn_hunt.0400.c.tt:0 "Nothing is done. [spn_menace_county.GetName] keeps losing [county_control|E] for as long as the creature keeps at it."

 #################################################
 # A Name for the Trail
 #################################################
 spn_hunt.0401.t:0 "A Name for the Trail"
 spn_hunt.0401.desc:0 "[spn_trailsman.GetTitledFirstName] has been on it since the thaw. He does not tell you where he has been. He tells you that the deaths in [spn_menace_county.GetName] stop when one person is away and start again when they come back, and that he has watched long enough to be sure of it. Then he says the name: [spn_menace_culprit.GetTitledFirstName]."
 spn_hunt.0401.desc_vampire:0 "[spn_trailsman.GetTitledFirstName] has been on it since the thaw. \"They are always found in the morning,\" he says, \"and always within a night's walk of wherever [spn_menace_culprit.GetTitledFirstName] slept.\" He has counted it four times. He has never once seen [spn_menace_culprit.GetTitledFirstName] eat at a table. He is frightened, and he is right to be."
 spn_hunt.0401.desc_werewolf:0 "[spn_trailsman.GetTitledFirstName] has been on it since the thaw. \"The killing runs to the moon,\" he says, \"and so does [spn_menace_culprit.GetTitledFirstName]. Gone three nights, back on the fourth, and never a word about where.\" He found a print at the fold in [spn_menace_county.GetName] and he will not describe it. He does not have to."
 spn_hunt.0401.a:0 "Now I know his face"
 spn_hunt.0401.a.tt:0 "You learn [spn_menace_culprit.GetTitledFirstName]'s secret. Imprisonment, execution and the [supernatural_hunt|E] are all open to you now."
 spn_hunt.0401.b:0 "Say nothing - let him think he is unseen"
 spn_hunt.0401.b.tt:0 "You learn [spn_menace_culprit.GetTitledFirstName]'s secret and keep it. Knowing what walks your lands and doing nothing about it is its own kind of reputation."
