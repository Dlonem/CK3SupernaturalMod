l_english:
 TRAVEL_NAME_FOR_mages_summit:0 "Your arrival at the Mage Summit"
 mages_summit_activity:0 "$mages_summit$"
 game_concept_md_elements:0 "Magic Elements"
 game_concept_md_elements_desc:0 "Combat spells consist of Elements, which are the source of damage and other spell effects. Better mastery of the Elements makes spells using them more powerful."
 game_concept_md_power:0 " @power_element_icon!$game_concept_power_element$"
 game_concept_md_fire:0 " @fire_element_icon!$game_concept_fire_element$"
 game_concept_md_kinetic:0 " @kinetic_element_icon!$game_concept_kinetic_element$"
 game_concept_md_shadow:0 " @shadow_element_icon!$game_concept_shadow_element$"
 game_concept_md_necrotic:0 " @necrotic_element_icon!$game_concept_necrosis$"
 game_concept_power_element:0 "Power"
 game_concept_power_element_i:0 "@power_element_icon!"
 game_concept_power_element_i2:0 "@no_power_element_icon!"
 game_concept_power_element_desc:0 "Power damage is a simple and often effective way to overwhelm an opponent.\n$EFFECT_LIST_BULLET$Power damage has no additional effects."
 power_element_tooltip:0 "@power_element_icon! #t $game_concept_power_element$#!\n$game_concept_power_element_desc$"
 power_element_icon_with_desc:0 "[power_element_i|E]"
 no_power_element_icon_with_desc:0 "[power_element_i2|E]"
 game_concept_fire_element:0 "Fire"
 game_concept_fire_element_i:0 "@fire_element_icon!"
 game_concept_fire_element_i2:0 "@no_fire_element_icon!"
 game_concept_fire_element_desc:0 "Fire-based spells are highly valued by any battle mage.\n$EFFECT_LIST_BULLET$When you successfully deal fire damage, your opponent may lose #N 1#! [endurance|E] (20% chance for each fire damage point inflicted)."
 fire_element_tooltip:0 "@fire_element_icon! #t $game_concept_fire_element$#!\n$game_concept_fire_element_desc$"
 fire_element_icon_with_desc:0 "[fire_element_i|E]"
 no_fire_element_icon_with_desc:0 "[fire_element_i2|E]"
 game_concept_kinetic_element:0 "Kinetic"
 game_concept_kinetic_element_i:0 "@kinetic_element_icon!"
 game_concept_kinetic_element_i2:0 "@no_kinetic_element_icon!"
 game_concept_kinetic_element_desc:0 "Kinetic spells are a good choice if you want to completely crush your opponent.\n$EFFECT_LIST_BULLET$Every time you deal more kinetic damage than your opponent, your opponent loses #N 1#! [endurance|E]."
 kinetic_element_tooltip:0 "@kinetic_element_icon! #t $game_concept_kinetic_element$#!\n$game_concept_kinetic_element_desc$"
 kinetic_element_icon_with_desc:0 "[kinetic_element_i|E]"
 no_kinetic_element_icon_with_desc:0 "[kinetic_element_i2|E]"
 game_concept_shadow_element:0 "Shadow"
 game_concept_shadow_element_i:0 "@shadow_element_icon!"
 game_concept_shadow_element_i2:0 "@no_shadow_element_icon!"
 game_concept_shadow_element_desc:0 "Shadow spells are tricky, although they take time to reach their full potential.\n$EFFECT_LIST_BULLET$Each time you use the shadow element, your shadow level increases by #P 1#!. This effect can stack.\n$EFFECT_LIST_BULLET$Each time an opponent uses double [power_element_i|E][power_element|E] or double [fire_element_i|E][fire_element|E] elements, your shadow level is reduced by #N 2#!. This effect can stack."
 shadow_element_tooltip:0 "@shadow_element_icon! #t $game_concept_shadow_element$#!\n$game_concept_shadow_element_desc$"
 shadow_element_icon_with_desc:0 "[shadow_element_i|E]"
 no_shadow_element_icon_with_desc:0 "[shadow_element_i2|E]"
 game_concept_necrotic_element:0 "Necrotic"
 game_concept_necrosis:0 "Necrosis"
 game_concept_necrotic_element_i:0 "@necrotic_element_icon!"
 game_concept_necrotic_element_i2:0 "@no_necrotic_element_icon!"
 game_concept_necrotic_element_desc:0 "Few creatures are powerful or evil enough to use necrotic magic.\n$EFFECT_LIST_BULLET$Necrotic damage affects [power_clash|E] and the opponent's [endurance|E] at the same time."
 necrotic_element_tooltip:0 "@necrotic_element_icon! #t $game_concept_necrosis$#!\n$game_concept_necrotic_element_desc$"
 necrotic_element_icon_with_desc:0 "[necrotic_element_i|E]"
 no_necrotic_element_icon_with_desc:0 "[necrotic_element_i2|E]"
 game_concept_magic_shield:0 "Magic Shield"
 game_concept_magic_shield_i:0 "@magic_shield_icon!"
 game_concept_magic_shield_desc:0 "Magical Shield is a spell component that blocks pure and secondary damage from the opponent, thereby reducing the chance of losing [endurance|E] and the opponent's progress on the Power Clash track.\nUsing a magic shield often comes at a cost in [power_element_i|E][power_element|E]."
 magic_shield_tooltip:0 "@magic_shield_icon! #t $game_concept_magic_shield$#!\n$game_concept_magic_shield_desc$"
 magic_shield_icon_with_desc:0 "[magic_shield_i|E]"
 game_concept_endurance:0 "Endurance"
 game_concept_endurance_i:0 "@endurance_icon!"
 game_concept_endurance_desc:0 "When a character's endurance drops to zero, that character is unable to continue the duel - the other side wins."
 endurance_tooltip:0 "@endurance_icon! #t $game_concept_endurance$#!\n$game_concept_endurance_desc$"
 endurance_icon_with_desc:0 "[endurance_i|E]"
 game_concept_magic_special_effect:0 "Special Effect"
 game_concept_magic_special_effect_i:0 "@magic_special_icon!"
 game_concept_magic_special_effect_desc:0 "Some spells have additional effects that can affect the duel in multiple ways."
 magic_special_effect_tooltip:0 "@magic_special_icon! #t $game_concept_endurance$#!\n$game_concept_endurance_desc$"
 magic_special_effect_icon_with_desc:0 "[magic_special_effect_i|E]"
 game_concept_magic_damage:0 "Damage"
 game_concept_magic_damage1:0 "main damage"
 game_concept_magic_damage2:0 "side damage"
 game_concept_magic_damage3:0 "pure damage"
 game_concept_magic_damage_desc:0 "Damage is inflicted through spells and the amount of damage is based on the level of the associated elements. If a spell uses damage of one type, such damage is classified as pure. If a spell contains a combination of two types of damage, one will be treated as main damage and the other as side damage. This damage classification may be relevant if one of the sides uses [magic_shield|E]."
 magic_element_tooltip:0 "#t Element level#!\nElement level affects the amount of damage associated with that element."
