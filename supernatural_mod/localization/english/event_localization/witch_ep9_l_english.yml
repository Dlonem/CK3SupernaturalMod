 laamp_magic_1013_contract:0 "The Secret Library"
 laamp_magic_1013_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and using [diplomacy|E] or [intrigue|E] skill."
 laamp_magic_1013_desc_title:0 "$laamp_magic_1013_contract$"
 laamp_magic_1013_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] is in possession of a library that may contain a lot of useful information. Perhaps a bit of persuasion will make [TaskContract.GetEmployer.GetTitledFirstName] share [TaskContract.GetEmployer.GetHerHis] books for review."
 laamp_magic_1013_desc_ct:0 "You can get a perk point or upgrade your skills."
 ev10.150.desc:0 "[employer.GetTitledFirstName] makes sure that no unauthorised person gets near his books, but sometimes [employer.GetSheHe] makes them available to friends or respected scholars. You have to figure out a way to get into these books."
 ev10.150.a:0 "I will talk to [employer.GetHerHim] about it."
 ev10.150.b:0 "I sneak in there at night."
 ev10.150.c:0 "I will pay."
 ev10.150.d:0 "These books are probably nothing interesting."
 laamp_magic_1014_contract:0 "Evaluation of the Court Mage"
 laamp_magic_1014_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and assessing the skills of the local court mage."
 laamp_magic_1014_desc_title:0 "$laamp_magic_1014_contract$"
 laamp_magic_1014_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] employs the services of a court magician who supposedly conducts research and supports [TaskContract.GetEmployer.GetTitledFirstName] with his knowledge. However, [TaskContract.GetEmployer.GetTitledFirstName] is not sure if [TaskContract.GetEmployer.GetHerHis] mage possesses real skills. Could he be just a fraud and a swindler? An independent expert who could assess this would be useful."
 ev10.151.desc:0 "'Apparently, you are an expert in arcane knowledge and sorcery, which is why I would like to ask for your evaluation of my court mage, [cmage.GetTitledFirstName]. [cmage.GetSheHe|U] claims that [cmage.GetHerHis] spells are effective, but I see no results. I am not well-versed in magic, so perhaps this is normal. However, if [cmage.GetTitledFirstName] is a fraud, I would like to know.'"
 ev10.151.a:0 "I will talk to [cmage.GetHerHim]; perhaps I will uncover the truth."
 ev10.152.desc:0 "You spoke to [cmage.GetTitledFirstName] for a while. [cmage.GetSheHe|U]'s reluctant to talk about [cmage.GetHerHis] work as a court mage, but that doesn't mean anything. Wizards and witches don't usually share their secrets and knowledge."
 ev10.152.a:0 "I will ask some trick questions."
 ev10.152.b:0 "I will use magic sense."
 ev10.152.c:0 "I read [cmage.GetHerHis] aura."
 ev10.152.d:0 "Well, I guess I have to rely on my intuition."
 ev10.153.desc1:0 "You have succeeded beyond any doubt in determining that [cmage.GetTitledFirstName] is a fraud. Now you must deliver your judgment to [employer.GetTitledFirstName]."
 ev10.153.desc2:0 "It seems that [cmage.GetTitledFirstName] is just a mediocre witch who knows nothing about real magic and spellcasting. Now, the only thing left is to deliver this news to [employer.GetTitledFirstName]."
 ev10.153.desc3:0 "You have determined that [cmage.GetTitledFirstName] is an experienced witch. [cmage.GetSheHe|U] possesses knowledge and certain skills, though it is far from true magic. Nevertheless, having such a court mage is better than having none. All that remains is to present your observations to [employer.GetTitledFirstName]."
 ev10.153.desc4:0 "Your findings indicate that [cmage.GetTitledFirstName] is an advanced practitioner of magic with exceptional skills. [cmage.GetSheHe|U] clearly knows what [cmage.GetSheHe] is doing and is the right person for the position of court mage. All that remains is to present your observations to [employer.GetTitledFirstName]."
 ev10.153.desc5:0 "You are not able to assess [cmage.GetTitledFirstName]'s skills. The question remains, what will you say to [employer.GetTitledFirstName]?"
 ev10.153.a:0 "[cmage.GetTitledFirstName] is undoubtedly a proficient wizard."
 ev10.153.b:0 "[cmage.GetTitledFirstName] is at most an average court mage."
 ev10.153.c:0 "[cmage.GetSheHe|U] is not fit for the job."
 ev10.153.d:0 "[cmage.GetTitledFirstName] is a fraud."
 ev10.153.e:0 "I cannot help here."
 ev10.153.f:0 "I would be a better court magician than [cmage.GetSheHe] is."
 laamp_magic_1014_desc_success_critical_ct:0 "#P You can become a court mage and vassal.#!"
 join_mages_summit:0 "Join the Mage Summit"
 join_mages_summit_desc:0 "Your invitation must have gotten lost somewhere - nonetheless, you can still attend the Mage Summit."
 ev10.154.title:0 "Breaking the Barrier"
 ev10.154.desc:0 "The barrier you placed around the Earth, which was meant to block all external forces, broke last night. Some powerful intruder has entered your world. Whatever it is, you are all in danger."
 ev10.154.a:0 "It must be something very powerful!"
 ev10.154.a_ct:0 "#N The magic barrier around the Earth has been destroyed!#!"
