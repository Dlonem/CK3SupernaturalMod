 demonic_rage_decision_ct2:0 "#N Many people may be injured or die#!"
 demonic_rage_decision_ct4:0 "You slaughtered the inhabitants of the surrounding village - no witnesses survived."
 ev10.19.desc:0 "Every demon is unique, but their personality and traits usually place them into one of the main categories or factions. In the end, what truly matters is your goal and the path you choose to reach it."
 succubus_modifier:0 "Succubus"
 succubus_modifier_desc:0 "Succubi and Incubi are concerned with tempting mortals, arousing physical lust on the path to perdition. Some of them wish to gain new souls or - through manipulation - other benefits in this way, but most demons like to spread corruption simply for fun.\n"
 incubus_modifier:0 "Incubus"
 incubus_modifier_desc:0 "$succubus_modifier_desc$"
 bloodlust_modifier:0 "Bloodlust"
 bloodlust_modifier_desc:0 "Demons usually prefer violence as a way of solving problems and satisfying their ambitions. However, there are some that have elevated brutality and destruction to the level of art, which is an end in itself.\n"
 bloodlust_special_terrain_cancel_negative_supply:0 "Loses stress when winning battles"
 diabolist_modifier:0 "Diabolist"
 diabolist_modifier_desc:0 "Among the demons, there are also more calculating and subtle beings who favour cunning and knowledge over brute force.\n"
 succubus_terrain_cancel_negative_supply:0 "Allows you to use $command_minion_interaction$ [interaction|E] against your lovers"
