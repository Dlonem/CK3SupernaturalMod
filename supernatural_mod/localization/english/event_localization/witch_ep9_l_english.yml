 samael_self_modifier:0 "$samael_name$"
 SECOND_CIRCLE_OF_HELL:0 "The Second Circle of Hell"
 HAS_APOCALYPSE_PROTECTORS:0 "This target is well protected by demonic allies."
 ev3.6.h:0 "Because I'll send you back to hell in pieces?"
 expose_yourself_as_witch_decision_name:0 "Reveal Yourself as a Witch"
 expose_yourself_as_witch_decision_desc:0 "Keeping your interests secret makes it very difficult to conduct your research and practice witchcraft. Perhaps it is not worth worrying about the criticism of superstitious rulers and clergy?"
 openly_practising_witchcraft_modifier:0 "Openly Practises Witchcraft"
