 mc_archmage_special1_terrain_cancel_negative_supply:0 "May appoint new members of the Council"
 mc_archmage_special2_terrain_cancel_negative_supply:0 "Has access to Call a Secret Meeting [decision|E]"
 mc_black_mage_special1_terrain_cancel_negative_supply:0 "Can force Mage Duel without reputation penalties"
