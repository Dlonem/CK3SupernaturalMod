 remove_from_high_council_interaction_title:0 "$mc_full_name$"
 ev10.62.title:0 "Election"
 ev10.62.desc:0 "This Mage Summit will be different from the others - instead of electing a Speaker and voting on resolutions, there will be an election for the new leader of the High Council of Mages. All the congregation are excited - a new leader could mean change for the entire magical society."
 ev10.62.a:0 "I will put forward my candidacy."
 ev10.62.a_ct:0 "You will be vying for the position of archmage."
 ev10.63.desc:0 "After some heated debates and speeches, it is already clear which magicians have enough support to run for the office of archmage. They are:"
 ev10.63.cand1:0 "\n$EFFECT_LIST_BULLET$[ms_cand1.GetTitledFirstName]"
 ev10.63.cand2:0 "\n$EFFECT_LIST_BULLET$[ms_cand2.GetTitledFirstName]"
 ev10.63.cand3:0 "\n$EFFECT_LIST_BULLET$[ms_cand3.GetTitledFirstName]"
 ev10.63.cand4:0 "\n$EFFECT_LIST_BULLET$[ms_cand4.GetTitledFirstName]"
 ev10.63.a:0 "The race to power has just begun."
 ev10.64.desc:0 "It is now time for the vote - each summit participant can write one name on a piece of parchment, and place it in the ballot box. The mage with the most votes will win the election."
 ev10.64.a:0 "[ms_cand1.GetTitledFirstName] has my vote."
 ev10.64.b:0 "I will vote for [ms_cand2.GetTitledFirstName]."
 ev10.64.c:0 "[ms_cand3.GetTitledFirstName] must be supported."
 ev10.64.d:0 "[ms_cand4.GetTitledFirstName] is the best candidate."
 ev10.64.e:0 "I vote for myself, of course."
 ms_cand1_votes_counter:0 "Votes for [ms_cand1.GetTitledFirstName]: [ms_cand1.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand2_votes_counter:0 "Votes for [ms_cand2.GetTitledFirstName]: [ms_cand2.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand3_votes_counter:0 "Votes for [ms_cand3.GetTitledFirstName]: [ms_cand3.MakeScope.Var('my_arch_votes').GetValue]"
 ms_cand4_votes_counter:0 "Votes for [ms_cand4.GetTitledFirstName]: [ms_cand4.MakeScope.Var('my_arch_votes').GetValue]"
 mage_summit_archmage_elected_title:0 "The new Archmage has been elected!"
 ev7.111.b_ct:0 "[mage0.GetTitledFirstName] will be voting for you."
 ev10.65.a:0 "I accept this honour."
 ev10.65.b:0 "I am not interested in politics."
 ev10.66.desc:0 "You need to find as many supporters as possible if you seriously plan to become an archmage. [guest0.GetTitledFirstName] seems a person susceptible to your influence."
 ev10.66.a:0 "I will offer a favour in the future."
 ev10.66.a_ct:0 "[guest0.GetTitledFirstName] will vote for you."
 ev10.67.a_ct:0 "[guest1.GetTitledFirstName] will vote for you."
 ev10.66.b:0 "I just want to gain [guest0.GetHerHis] goodwill."
 ev10.67.desc:0 "You're not sure you've managed to gather enough supporters to be elected as an archmagus. Fortunately, there are still a few people you may be able to convince."
 ev10.67.a:0 "Time to hand out bribes."
 ev10.67.b:0 "I will try to make a good impression."
 ev10.67.c:0 "If they are smart, they will vote for me."
 ev10.68.title:0 "Agitation"
 ev10.68.desc:0 "You can see [guest0.GetTitledFirstName] talking to the other witches - you think [guest0.GetSheHe]'s trying to convince them to vote for [guest0.GetHerHim]. The witches show polite interest, but don't look convinced."
 ev10.68.a:0 "I also have something to say."
 ev10.68.b:0 "I will point out [guest0.GetHerHis] lack of competence."
 ev10.68.c:0 "I will express my approval of [guest0.GetHerHis] candidacy."
 ev10.68.d:0 "I will remain neutral here."
 ev10.68.e:0 "I would be a much better archmage, obviously."
 ev10.69.desc:0 "At some point, [guest0.GetTitledFirstName] approaches you and starts a cautious conversation. You can see [guest0.GetSheHe]'s trying to find out if you intend to vote for [guest0.GetHerHim]."
 ev10.69.a:0 "My support is not cheap."
 ev10.69.a_ct:0 "You promise to vote for [guest0.GetHerHim]."
 ev10.69.b:0 "Perhaps quid pro quo?"
 ev10.69.c:0 "I like you, you have my vote."
 ev10.69.d:0 "There are many better candidates here than you."
 transfer_to_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] transfers [gold_i]$VALUE|+0$ to the [mc_funds|E]"
 take_from_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] receives [gold_i]$VALUE|+0$ from the [mc_funds|E]"
 increase_mc_funds_effect_ct:0 "The [mc_funds|E] are increased by [gold_i]$VALUE|+0$ gold"
 decrease_mc_funds_effect_ct:0 "The [mc_funds|E] are decreased by [gold_i]$VALUE|-0$ gold"
 ev10.70.desc:0 "The Council needs money to operate. Fortunately, there are several ways to get it - cooperation with Venetian bankers, merchant operations, more or less risky investments. Sometimes magic or donations from other wizards can also bolster the budget."
 ev10.70.a:0 "I will look for opportunities on the market."
 ev10.70.b:0 "We will make money from usury."
 ev10.70.c:0 "I have a few ideas."
 ev10.70.d:0 "This will be a risky investment."
 ev10.70.e:0 "No one will notice if some gold disappears."
 mc_donate_funds_decision_name:0 "Make a donation to the High Council"
 mc_donate_funds_decision_desc:0 "Although the council bases its power on magic, gold is also an important pillar. Financial support is therefore always welcome."
 mc_donate_funds_decision_ct:0 "Any donor can ask the Archmage for support."
 decision_group_type_mc_decisions:0 "$mc_full_name$"
 ev7.105.dx:0 "The High Council needs funds to operate efficiently."
 ev10.71.desc:0 "Being an archmage is sometimes a difficult responsibility. From the very beginning of the summit, you are surrounded by many witches who want to win your sympathy or want to discuss not-so-important matters. However, there are benefits - the congregation listens to you attentively and are open to your suggestions."
 ev10.71.a:0 "Let's have a big debate about magic!"
 ev10.71.b:0 "They know that I am the most powerful mage."
 ev10.71.c:0 "I'll use this to make new friends."
 ev10.71.d:0 "I'm already fed up with this crowd."
 ev10.71.e:0 "I'll make it clear that it is not safe to bother me with bullshit."
 ev10.72.title:0 "Duties of the High Council"
 ev10.72.desc:0 "Due to your special position in the High Council, many people wish to discuss issues they consider important with you. Among them is [guest0.GetTitledFirstName], who has complained to you about witch hunters - [guest0.GetSheHe] barely escaped with [guest0.GetHerHis] life when one of them recently tried to kill [guest0.GetHerHim]. In [guest0.GetHerHis] opinion, the High Council should do something about it."
 ev10.72.a:0 "I will raise this issue at the High Council meeting."
 ev10.72.d:0 "I will discuss this with the Archmage."
 ev10.72.b:0 "The council has too little finance to effectively fight the hunters."
 ev10.72.c:0 "You will receive funding for private security."
 sponsor_demon_fighting_modifier:0 "Sponsor of Fighting Demons"
 ev10.73.title:0 "Conspiracy"
 ev10.73.desc:0 "[guest0.GetTitledFirstName] insisted on a private conversation in which he revealed to you [guest0.GetHerHis] doubts about the current archmage, [amage.GetShortUIName]. [guest0.GetHerHis|U] view was that [amage.GetShortUIName] should be removed - at all costs, for the good of the whole congregation. [guest0.GetShortUIName] is counting on your support..."
 ev10.73.a:0 "You can count on me."
 ev10.73.b:0 "Right, but your way is too radical."
 ev10.73.c:0 "You are wrong, the archmage is the right leader."
 ev10.74.desc:0 "As a member of the High Council, you have the right to reimbursement for part of the costs of organizing the Mage Summit. Do you intend to take advantage of this privilege?"
 ev10.74.a:0 "No, the council needs this money."
 ev7.105.k:0 "The Archmage should be granted extraordinary privileges to act effectively."
 ev7.105.k_ct:0 "Archmage can Demand Submision from witches and mages"
 MAGE_DUEL_O1A:0 "Duel in the target location"
 MAGE_DUEL_O3b:0 "Force a duel (in the target location)"
 MAGE_DUEL_O5:0 "Promise not to use the Singularity"
 MAGE_DUEL_O5_ct:0 "The use of Ancient Singularities will not be allowed"
 md_duel_in_my_location_ct:0 "The Mage Duel will take place in [actor.GetCurrentLocation.GetName]"
 md_duel_in_your_location_ct:0 "The Mage Duel will take place in [recipient.GetCurrentLocation.GetName]"
 demand_submission_archmage_interaction:0 "$demand_submission_cgm_interaction$"
 demand_submission_archmage_interaction_desc:0 "Every member of the magical community owes you obedience."
 ARCH_DEM_O1:0 "Be obedient" 
 ARCH_DEM_O2:0 "End your wars"
 ARCH_DEM_O2_ct:0 "Will try to negotiate a white peace."
 ev10.76.title:0 "Peace Negotiations"
 ev10.76.desc:0 "The Archmage demanded that you end your wars immediately. In accordance with this wish, you prepared letters offering a white peace to your opponents."
 ev10.76.a:0 "We will see what the answer is."
 ev10.76.a_ct:0 "[THIS.Char.GetTitledFirstName] will consider the white peace proposal."
 ev10.77.desc:0 "Our war is pointless and it is best to end it as soon as possible. I propose a white peace."
 ev10.77.a:0 "There will be no status quo."
 ev10.77.a_ct:0 "Your proposal was rejected."
 demand_submission_archmage_reaction:0 "#N The High Council may wish to punish insubordination#!"
 ev10.78.title:0 "Rejected Demand"
 ev10.78.desc:0 "[recipient.GetTitledFirstName] refused to comply with your will. This is a blatant violation of the existing rules."
 ev10.78.a:0 "[recipient.GetSheHe|U] will be excluded from the community."
 ev10.78.b:0 "The incident will be forgotten for now."
 ev10.78.c:0 "The black mage should arrest [recipient.GetHerHim]."
 ev10.78.c_ct:0 "The black mage will attempt to arrest the target."
 ev10.78.c_ct2:0 "This could lead to a mage duel and the death of one of the mages."
 ev10.79.desc:0 "[recipient.GetTitledFirstName] broke the rules and must be punished. As a Black Mage, you have the duty to arrest [recipient.GetHerHim]."
 ev10.79.a:0 "As you wish, archmage."
 ev10.79.b:0 "You know what, I'm giving up my position as Black Mage..."
 ev10.79.b_ct:0 "Black Mage refuses"
 ev10.79.a_ct:0 "You set out to arrest [recipient.GetTitledFirstName]"
 ev10.79.a_ct1:0 "Target will surrender without a fight"
 ev10.79.a_ct2:0 "Target will resist"
 ev10.80.desc:0 "[bmage.GetTitledFirstName] appeared before you. [bmage.GetSheHe|U] said he comes as a representative of the High Council of Mages to arrest you for breaking the rules. If you do not surrender immediately, a duel awaits you."
 ev10.80.a:0 "Calmly, I surrender."
 ev10.81.title:0 "Secret Meeting"
 ev10.81.desc1:0 "A secret meeting of the High Council of Mages has begun. Each member of the Council appears before you as an illusion; you can hear and see each other as if you were all in the same chamber. It's amazing that magic enables smooth communication over any distance - ordinary people will never have similar capabilities to you."
 ev10.81.desc0:0 "The members of the High Council appeared as illusions, as usual. It looks like you can start the meeting."
 ev10.81.desc2:0 "To start, the archmage wants to hear the reports of all the members of the High Council."
 ev10.81.a:0 "I want to hear your reports."
 ev10.81.b:0 "So who's first?"
 ev10.81.c:0 "I will present an accurate report."
 ev10.82.desc0:0 "First, [admin.GetTitledFirstNameNoTooltip] briefly summarized the current situation.\n"
 ev10.82.desc1:0 "In a few words, you presented the current situation to the High Council.\n"
 ev10.82.desc2:0 "\n$mc_gold_desc$: $mc_gold$"
 ev10.82.desc3:0 "\nSecured magical artifacts: [admin.MakeScope.Var('art_counter').GetValue]"
 ev10.82.desc4:0 "\nControlled places of power: [admin.MakeScope.Var('ppower_counter').GetValue]"
 ev10.82.desc5:0 "\nKnown mages: [admin.MakeScope.Var('mages_counter').GetValue]"
 ev10.82.desc6:0 "\nDetected demons: [admin.MakeScope.Var('demons_counter').GetValue]"
 ev10.82.desc7:0 "\n\nIt is now your turn to present the report."
 ev10.82.a:0 "I have nothing more to add."
 ev10.82.b:0 "Some of the numbers are concerning."
 ev10.82.c:0 "[loremaster.GetShortUINameNotMe], now it's your turn."
 ev10.82.d:0 "We will discuss the results of my research."
 ev10.82.e:0 "For now, I have nothing to say."
 ev10.83.desc0:0 "[loremaster.GetTitledFirstNameNoTooltip] spoke up. [loremaster.GetSheHe|U] presented his research findings to you, which look promising. [loremaster.GetTitledFirstNameNoTooltip] declared that [loremaster.GetSheHe] will continue his work."
 ev10.83.desc1:0 "[loremaster.GetTitledFirstNameNoTooltip] spoke up. [loremaster.GetSheHe|U] said that [loremaster.GetSheHe] is conducting some research, but for now, [loremaster.GetSheHe] is not ready to share the results of [loremaster.GetHerHis] work."
 ev10.83.desc2:0 "It seems it is now your turn to report."
 ev10.83.a:0 "Good. [bmage.GetShortUINameNotMe]?"
 ev10.83.b:0 "I see. [bmage.GetShortUINameNotMe]?"
 ev10.83.c:0 "Hm..."
 ev10.83.d:0 "Hunters have increased their activity recently."
 ev10.83.d_ct:0 "The Archmage can make a decision on the matter."
 ev10.83.e:0 "Demons are now the main threat."
 ev10.83.f:0 "For now, there are no threats."
 ev10.83.g:0 "My spies have gained useful information."
 ev10.84.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] reported that the activity of witch hunters has recently increased significantly. [bmage.GetSheHe|U] declared that [bmage.GetSheHe] will be monitoring the situation closely."
 ev10.84.a:0 "Find them and kill them."
 ev10.84.a_ct:0 "[bmage.GetShortUINameNotMe] will try to eliminate some hunters using magic or schemes."
 ev10.84.b:0 "I will deal with this personally."
 ev10.84.c:0 "The Council will set bounties on the heads of hunters."
 ev10.84.c_ct:0 "The number of hunters may be reduced slightly."
 ev10.84.d:0 "Yes, keep an eye on them for now."
 ev10.84.desc1:0 "[bmage.GetTitledFirstNameNoTooltip] reported that the demons are making some problems. Perhaps efforts should be coordinated to stop them."
 ev10.84.e:0 "I expect you all to take some action."
 ev10.84.e_ct:0 "Council members will use the banishment spell more frequently."
 ev10.84.desc2:0 "[bmage.GetTitledFirstNameNoTooltip] reports that [bmage.GetHerHis] spies have intercepted some information, perhaps it will be useful."
 ev10.84.desc3:0 "[bmage.GetTitledFirstNameNoTooltip] reports no problems - there is currently no serious threat to the Council, the situation is under control."
 ev10.84.desc4:0 "The Archmage decided that [bmage.GetTitledFirstNameNoTooltip] had to solve the problem with brute force."
 ev10.84.desc5:0 "The Archmage decided to tackle the problem personally."
 ev10.84.desc6:0 "The Archmage decided that the Council would put a bounty on the head of the witch hunters."
 ev10.84.desc7:0 "The Archmage decided that the Council will wait for the situation to develop."
 ev10.84.f:0 "Waiting can be risky..."
 ev10.84.desc8:0 "The Archmage decided that the whole council needed to focus on this problem."
 ev10.85.desc0:0 "It is now time for the second part of the meeting - discussing the remaining matters and considering any proposals from council members."
 ev10.85.a:0 "Do you have any issues to discuss?"
 ev10.85.b:0 "We need to discuss the current crisis."
 ev10.86.desc0:0 "Are there any topics you want to address?"
 ev10.86.title:0 "Your proposals"
 ev10.86.a:0 "I have heard of a source that may need care."
 sm_archmage_rejection_ct:0 "#N The Archmage rejected this proposal.#!"
 sm_archmage_rejection_ct1:0 "#N The Archmage rejects your petition.#!"
 sm_archmage_rejection_ct0:0 "#N You reject the proposal.#!"
 ev10.86.b:0 "I need funds for my research."
 ev10.86.c:0 "We should implement a development program."
 mc_development_modifier:0 "Coordinated Development"
 ev10.86.d:0 "I have no proposals."
 ev10.86.e:0 "I could produce a squad of battle golems for the Council."
 ev10.86.e_ct:0 "Each Council member will get a small squad of golems."
 ev10.86.f:0 "We should elect a rector of the magic academy."
 rector_magic_academy_modifier:0 "Rector of the Magic Academy"
 ev10.86.f_ct:0 "Someone else will be elected rector."
 ev10.87.title:0 "Response of the Archmage"
 ev10.87.desc0:0 "'There is a child with a special aptitude for magic' - [loremaster.GetTitledFirstNameNoTooltip] said - 'Without the care of an experienced mage, [source_child.GetTitledFirstName] is a danger to bystanders - perhaps one of us should take care of this?'"
 ev10.87.desc1:0 "'My research requires significant funding' - [loremaster.GetTitledFirstNameNoTooltip] said - 'Can I count on financial support?'"
 ev10.87.desc2:0 "'I have developed some scientific procedures that can be helpful for research and management' - [loremaster.GetTitledFirstNameNoTooltip] said - 'Unfortunately, their implementation may require some gold.'"
 ev10.87.desc4:0 "'Well, if the Council provides me with the right materials, I will be able to produce a squad of battle golems for each of us' - [loremaster.GetTitledFirstNameNoTooltip] said - 'This will strengthen our potential.'"
 ev10.87.desc5:0 "'Since we control the Academy of Magic, we should appoint a competent rector to oversee it. I volunteer for this role.'"
 ev10.87.a:0 "Take care of it."
 ev10.87.b:0 "I am happy to take on a disciple."
 ev10.87.c:0 "This is a task for [bmage.GetShortUINameNotMe]."
 ev10.87.d:0 "Perhaps [admin.GetShortUINameNotMe] will find the time to do so."
 ev10.87.e:0 "You will receive funding."
 ev10.87.f:0 "This is not our business."
 ev10.87.g:0 "We have more important expenses."
 ev10.87.desc3:0 "The Archmage has made a decision on the matter."
 ev10.87.desc3x:0 "The Archmage has made a decision."
 ev10.87.h:0 "This is the right decision."
 ev10.87.i:0 "You are obvious for this role."
 ev10.87.j:0 "I will take on this duty."
 ev10.87.k:0 "[bmage.GetShortUINameNotMe] will make a good rector."
 ev10.87.l:0 "I know someone who is suitable."
 ev10.88.desc0:0 "The questioning gaze of the archmage shifts to you."
 ev10.88.desc:0 "$ev10.88.desc0$ $ev10.86.desc0$"
 ev10.88.a:0 "[magic_art.GetName] should be held by the council."
 ev10.88.b:0 "The Council should support [war_ruler.GetTitledFirstName]."
 ev10.88.c:0 "I need some gold for potions."
 ev10.88.d:0 "[troublemaker.GetTitledFirstName] is causing problems, something needs to be done about it."
 ev10.88.d_ct:0 "[bmage.GetShortUIName|U] will be sent to arrest the target."
 ev10.88.d_ct2:0 "#N A mage duel may occur.#!"
 ev10.89.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] has now taken the floor.\n"
 ev10.89.desc1:0 "'[magic_art.GetName] should be held by the council. I believe I am best qualified to secure this artefact.'"
 ev10.89.desc2:0 "'[war_ruler.GetTitledFirstName] is a ruler whose interests in certain matters align with ours. I believe we should discreetly support [war_ruler.GetHerHim] to maintain stability in the region.'"
 ev10.89.desc3:0 "'As the Black Mage, I must always be ready for action. I would like the Council to cover the cost of purchasing potions that will help me maintain this readiness.'"
 ev10.89.desc4:0 "'[troublemaker.GetTitledFirstName] is causing problems, carelessly casting spells on random people like a madman. [troublemaker.GetSheHe|U] is ruining the reputation of all respectable mages and undermining our authority. We should do something about it.'"
 ev10.89.a:0 "The Council supports your claims."
 ev10.89.b:0 "Well... no."
 ev10.89.c:0 "I agree with this proposal."
 ev10.89.d:0 "I prefer to support [war_ruler.GetHerHis] enemies."
 ev10.89.e:0 "I don't see any benefit to the Council here."
 ev10.89.f:0 "Buy one for me too."
 ev10.89.g:0 "Well, I'll do the shopping with my own money."
 ev10.89.h:0 "Fine, deal with [troublemaker.GetHerHim]."
 ev10.89.i:0 "I don't see this as a problem."
 troublemaker_arrested:0 "Troublemaker has been arrested"
 ev10.90.a:0 "We should shore up our budget."
 ev10.90.b:0 "The Council should reveal its existence to the rest of the world."
 ev10.90.b_ct:0 "The world will know about the existence of the High Council."
 ev10.90.b_ct2:0 "Each ruler will be able to fund the Council (and perhaps count on its support)."
 ev10.90.b_ct3:0 "Witch Hunters might take an interest in the members of the Council."
 mc_approval:0 "Approval"
 mc_rejection:0 "Refusal"
 ev10.90.c:0 "We need to consolidate our influence in [target.GetName]."
 ev10.90.d:0 "[pvassal.GetTitledFirstName] will become our puppet if we support [pvassal.GetHerHim]."
 ev10.90.e:0 "We should strike at [admin_rival.GetTitledFirstName]."
 ev10.91.desc0:0 "$mc_admin_modifier$, [admin.GetTitledFirstNameNoTooltip], decided to make [admin.GetHerHis] own proposal.\n"
 ev10.91.desc1:0 "'Our treasury is in a dire state. I propose that each of us contribute 20% of our funds to the Council.'"
 ev10.91.desc2:0 "'$ev10.90.b$ This will make it easier for us to influence other rulers - sometimes certain matters are easier to handle in an official and diplomatic manner, rather than through manipulation and shady methods.'"
 ev10.91.desc3:0 "'$ev10.90.c$ Handing out a few bribes will make many important people more obedient to our suggestions.'"
 ev10.91.desc4:0 "'I have recently made contact with [pvassal.GetTitledFirstName]. [pvassal.GetSheHe|U] seems a good candidate to be our puppet. Perhaps it would be possible to install [pvassal.GetHerHim] on the throne?'"
 ev10.91.desc5:0 "'There is one person who is disrupting our interests - [admin_rival.GetTitledFirstName]. We should strike at this troublemaker. Let us use our influence to destroy [admin_rival.GetHerHis] reputation.'"
 ev10.91.a:0 "This is not the right moment."
 ev10.91.b:0 "Sounds good to me."
 ev10.91.c:0 "Yes, we will pull the right strings."
 ev10.91.d:0 "[admin_rival.GetTitledFirstName] is not our enemy."
 amage_rep1_admin_rep6_ct:0 "The council used its influence to sabotage the ruler's reputation."
 ev10.92.title:0 "End of the Meeting"
 ev10.92.desc:0 "It looks like all the important topics have already been discussed. It's time to return to regular duties."
 ev10.92.a:0 "I adjourn the meeting."
 ev10.92.a_ct:0 "The secret meeting is coming to an end."
 ev10.92.b:0 "It's time to return to everyday life."
 ev10.93.title:0 "From the Shadows"
 ev10.93.desc:0 "For some time, there have been speculations about the existence of a secret organization that manipulates rulers and subtly influences the course of events. These rumors have been denied by the greats of this world, until today. The secret organization calling itself the High Council of Mages has decided to reveal its existence. It is unknown how long its machinations have been steering geopolitics or how far its influence extends – many people, however, claim that the power of the High Council surpasses that of many empires. Certainly, this organization will find many supporters as well as opponents."
 ev10.93.a:0 "This is just the beginning."
 ev10.93.b:0 "The Council is making a bold move."
 ev10.93.c:0 "This changes everything."
 ev10.94.title:0 "Extraordinary Measures"
 ev10.94.desc0:0 "The Archmage touched on the current crisis - the situation is very serious.\n"
 ev10.94.desc1:0 "The Council agreed that extraordinary steps must be taken to ensure that the threat is completely removed."
 ev10.94.a:0 "I need your unconditional support."
 ev10.94.b:0 "I will use all resources to stop the threat."
 ev10.94.c:0 "Let's hope this is enough."
 ask_mc_for_support_interaction:0 "Ask for the High Council's support"
 ask_mc_for_support_interaction_desc:0 "The [high_mage_council|E] can support its sympathisers in many ways."
 ask_mc_for_support_interaction_ct:0 "The Archmage will consider your petition."
 ARCHMAGE_BUSY_TEXT:0 "The Archmag is not currently accepting any petitions."
 MC_NO_FUNDS_TEXT:0 "The High Council has no funds to support anyone."
 MC_YOU_ARE_EXC_TEXT:0 "You are excluded from the magic society."
 mc_support_o1:0 "Ask for protection"
 mc_support_o2:0 "Ask for research funding"
 mc_support_o3:0 "Ask for access to the Place of Power"
 mc_support_o4:0 "Ask for a court mage"
 mc_support_o5:0 "Ask for support in the war"
 mc_protection_modifier:0 "Under the protection of the High Council"
 mc_place_of_power_modifier:0 "Access to the Place of Power"
 mc_support_o4_ct:0 "#P A proficient sorcerer will join your court.#!"
 mc_support_o5_ct:0 "#P The Archmage will weaken your enemies with a spell or join the war.#!"
 ev10.95.desc:0 "I am writing to you as a learned student of magic and a member of the witch and wizard community.\n"
 ev10.95.desc1:0 "I am writing to you as a loyal sympathiser of the High Council of Mages, I recognise your influence and know that you are an organisation to be reckoned with. I hope you will appreciate my support and in return help me with one thing.\n"
 ev10.95.desc2:0 "I fear for my life - my enemies want my death. I would like to ask that the Council use magical or conventional means to protect its ally."
 ev10.95.a:0 "We will send some agents."
 ev10.95.b:0 "...to be our eyes in the region."
 ev10.95.c:0 "No, we're not allies."
 ev10.95.d:0 "I don't have time for bullshit."
 ev10.95.d_ct:0 "For the next five years, all similar petitions will be automatically rejected."
 ev10.96.desc:0 "The research I am currently conducting requires significant funding. Can I count on the support of the High Council?"
 ev10.97.desc:0 "Practising witchcraft will be much easier for me when I have access to a place of power. Could I use yours?"
 ev10.98.desc:0 "I urgently need a competent court mage. Can the Council designate someone? I will gladly repay you with gold."
 ev10.98.a:0 "I will undertake this myself."
 ev10.98.b:0 "I will convince [c1.GetTitledFirstName]."
 ev10.98.c:0 "[c2.GetTitledFirstName] may be interested."
 ev10.98.d:0 "I'll talk to [c3.GetTitledFirstName]."
 ev10.98.e:0 "We have no mages available."
 ev10.99.desc:0 "I need support in my war efforts. Surely the Council can help me in some way in my war campaigns?"
 ev10.99.a:0 "We can offer financial support."
 ev10.99.b:0 "I will use a tornado spell."
 ev10.99.c:0 "I will simply join this war."
 ev10.99.d:0 "We cannot help you."
 ev10.100.desc:0 "Your power is immense and reaches far. Many people believe that you are the most powerful being in this world."
 ev10.100.a:0 "I think so too."
 ev10.100.b:0 "My power is considerable, but I am not a god."
 trait_track_necromancer2:0 "Dark Powers"
 trait_track_necromancer2_desc:0 "Powers grow passively over time."
 necromancer2_special1_terrain_cancel_negative_supply:0 "[necrotic_element_i|E][necrotic_element|E] damage doesn't affect your endurance"
 necromancer2_special2_terrain_cancel_negative_supply:0 "Unlocks #italic $death_wish$ spell#!"
 magic_inception_interaction:0 "Inception"
 magic_inception_interaction_desc:0 "Magical Inception allows you to place a thought in the target's head that the target will recognise as their own view. It is the highest form of magical manipulation."
 magic_inception_terrain_cancel_negative_supply:0 "Unlocks #italic $magic_inception_interaction$ spell#!"
 magic_inception_option_title:0 "Incepted Thought"
 magic_inception_o1:0 "'Violence is not the solution.'"
 magic_inception_o2:0 "'I am tired of ruling, so tired...'"
 magic_inception_o3:0 "'I will achieve true greatness!'"
 magic_inception_o4:0 "'I am so lost.'"
 magic_inception_o5:0 "'I should be more understanding of others.'"
 magic_inception_o6:0 "'I should confess my sins.'"
 magic_inception_o7:0 "'I think I owe someone a favour.'"
 magic_inception_o6_ct:0 "Reveals all personal secrets"
 magic_inception_o4_ct:0 "Ends all schemes"
 magic_inception_effect_ct:0 "The target of the spell may change personality or make unexpected decisions."
 antimagic_seal:0 "Antimagic Seal"
 antimagic_seal_desc:0 "This spell replaces the normal aura with an antimagic aura, which completely nullifies spells in the immediate vicinity."
 antimagic_seal_modifier:0 "$antimagic_seal$"
 antimagic_seal_modifier_desc:0 "$antimagic_seal_desc$"
 HAVE_ANTIMAGIC_SEAL:0 "You are bound by the Antimagic Seal!"
 HAS_ANTIMAGIC_SEAL:0 "Target is bound by the Antimagic Seal!"
 antimagic_seal_terrain_cancel_negative_supply:0 "Unlocks #italic $antimagic_seal$ spell#!"
 antimagic_seal_terrain2_cancel_negative_supply:0 "[magic_immunity2|E] to #P all spells#!"
 antimagic_seal_terrain3_cancel_negative_supply:0 "Immediately stabilises the source"
 antimagic_seal_terrain4_cancel_negative_supply:0 "Cannot cast spells"
 antimagic_seal_terrain5_cancel_negative_supply:0 "Cannot participate in mage duels"
 ev10.101.desc:0 "This morning, [golem.GetTitledFirstName] asked you for a conversation. [golem.GetSheHe|U] said [golem.GetSheHe] would like to see the world and find [golem.GetHerHis] destiny and purpose in life - [golem.GetSheHe] would like to embark on a journey and experience life as people do."
 ev10.101.a:0 "No, you are my servant and you are needed here."
 ev10.101.b:0 "If so, good luck."
 ev10.101.c:0 "Farewell, my thoughts will be with you."
 ev10.9.c:0 "The Antimagic Seal will protect me, but the others..."
 ev10.104.desc:0 "As a spellweaver, you participate in the ritual of the ultimate spell, which can have enormous, global consequences. [sowner.GetTitledFirstName] controls the ritual and [sowner.GetSheHe] will receive any benefits that come from it. However, is [sowner.GetSheHe] the right person to control such power? You could subtly introduce a few modifications to the ritual that would allow you to take over and control its effects. Others might see it as betrayal, but perhaps the prize is worth the risk."
 ev10.104.0.a:0 "I have to do it."
 ev10.104.0.a_ct:0 "If the ritual is successful, you will control the results."
 ev10.104.0.a_ct2:0 "Other mages will consider your action a betrayal."
 ev10.104.0.b:0 "No, I care about my reputation."
 ev10.105.title:0 "The Ultimate Spell - Traitor"
 ev10.105.desc:0 "The Ritual of the Ultimate Spell is complicated, so you didn't immediately notice that something was wrong. Someone has secretly introduced a modification to the incantation. If the ritual is completed, you will lose control over the spell - someone else will seize it and use it for their own purposes. It must be one of your spellweavers. There is no way to determine which one is the traitor, but the only way to thwart their plans is to exclude them from the ritual before it's too late."
 ev10.105.0.a:0 "I don't trust [sw1.GetTitledFirstName]."
 ev10.105.0.b:0 "[sw2.GetTitledFirstName] will be excluded."
 ev10.105.0.c:0 "We can manage without [sw3.GetTitledFirstName]."
 ev10.106.desc:0 "The spell succeeded, but the traitor took control of it. It was [straitor.GetTitledFirstName]! Now the power of the Ultimate Spell will serve [straitor.GetHerHis] purposes."
 ev10.106.0.a:0 "It was devious."
 ev10.106.0.b:0 "[straitor.GetSheHe|U] will pay for it."
 ev10.107.desc:0 "Your dreams today were filled with brutality, blood and violence. Upon waking, you discovered that there was blood on your hands. You don't remember anything, but in the morning everyone only talks about the brutal murders that took place in the area. Apparently some wild beast did it, because the bodies are torn apart."
 ev10.107.a:0 "Anyway, I feel a lot better than I did yesterday."
 ev10.108.desc:0 "The news of the death of two people shocked the area. It is unknown who is responsible for this, perhaps wild animals, because the bodies are in poor condition. However, the rumor says that it was done by a monster... or a demon."
 ev10.108.a:0 "I'd better let the guards know to stay alert."
 ev10.108.b:0 "The injuries indeed suggest a demon."
 harmonius_name:0 "Harmonius"
 ev10.109.desc:0 "A demon appeared in the summoning circle. His scaly face lit up at the sight of you with an unhealthy enthusiasm.\n'Hello, hello! It is I, Harmonius the Magnificent, who has come at your summons!'"
 ev10.109.a:0 "Excellent, what can you offer me, demon?"
 ev10.110.desc:0 "Today, you're in luck, for you have encountered a master. I am the vanquisher of silence, the carver of rhythm, the enchanter of sound, the king of the stage, and a humble musician all in one! My art is known in all circles of hell; every demon knows my name and musical talents! I am delighted to present to you my signature song, called: 'Song of the Lark'."
 ev10.110.a:0 "Why not, I will listen."
 ev10.110.b:0 "No, you are to grant my wish."
 ev10.111.desc0:0 "The demon completely ignored your words - and started 'singing'.\n"
 ev10.111.desc:0 "At first, you thought it was an earthquake, but it was just a cacophony of terrible sounds that hit you with the force of a blacksmith's hammer. It's hard to call it music, but it certainly moves the listener! You have no idea how a single being can produce such noises, nor do you understand any words, if there are any. All you know is that the main theme consists of the sounds of a slaughtered pig. In fact, many pigs."
 ev10.111.a:0 "No... stop..."
 ev10.112.desc:0 "The 'music' started to pick up pace. You feel like your brain is about to ooze out of your ears, you're nauseous, and you're trembling all over. Suddenly, the demon stopped making sounds, a deathly silence fell, and the 'artist' bowed before you."
 ev10.112.a:0 "This is the worst thing I have heard. Ever."
 ev10.112.b:0 "Inspiring."
 ev10.112.c:0 "Beautiful."
 ev10.113.desc:0 "'Well, thank you. I feared that humanity wasn't ready for true art, but I see I underestimated you. Ready for the next piece? I called it 'Snowflake', but in hell, they call it 'Exploding Head'. You know, there have been casualties at my performances... but essentially, it's a great song, a bit stronger than the previous one. Ready?'"
 ev10.113.a:0 "No, disappear!"
 ev10.113.b:0 "You will become my court musician."
 ev10.113.c:0 "Surely [riv.GetTitledFirstName] will want to listen to this!"
 ev10.113.c_ct:0 "The demon will be sent to your rival."
 ev10.113.d:0 "Later. For now, you will stay in my court."
 ev10.114.opening:0 "[riv.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ev10.114.desc:0 "Apparently, you sent that damn demon to me. If that's true, know that you are the worst scum of this world. I will destroy you."
 ev10.114.a:0 "I would like to get letters like this more often."
 ev10.116.title:0 "Destroyed Village"
 ev10.116.desc:0 "News has reached you that one of the villages under your authority has been completely destroyed. The huts look like they have been hit by a hurricane, no one has survived. People say it is the wrath of God directed against sinners."
 ev10.116.a:0 "Let us pray for forgiveness."
 ev10.116.b:0 "Supernatural forces may be involved."
 ev10.116.c:0 "I will look for answers in the Orb of Truth."
 ev10.117.desc:0 "You were able to use the Orb of Truth to look into the past. You can clearly see that [demon1.GetTitledFirstName] is responsible for the destruction of the village. [demon1.GetSheHe|U] went into a demonic rage, transformed into a real monster that wiped the village off the face of the earth."
 ev10.117.a:0 "I expected something like this."
 ev10.118.title:0 "Bloodthirsty Vassal"
 ev10.118.desc:0 "Bad rumours are swirling around [demon1.GetTitledFirstName]. Apparently, very bad things are happening in [demon1.GetHerHis] lands, the area has become depopulated, temples are burning in mysterious fires and monsters come out of the forests at night. It is [demon1.GetTitledFirstName], however, who [demon1.GetHerHis] subjects fear the most."
 ev10.118.a:0 "There is probably some truth in these rumours."
 ev10.118.b:0 "After all, [demon1.GetSheHe] is a demon."
 ev10.119.title:0 "$trait_demon$"
 ev10.119.desc:0 "Recently, you had a problem with disappearing servants. There were suspicions that they didn't like the job and left without saying goodbye, but the matter was accidentally clarified. One of the servants (who had not yet disappeared) found a lot of human remains in [demon1.GetTitledFirstName]'s chamber."
 ev10.119.a:0 "The evidence is unequivocal."
 ev10.119.b:0 "There's no need to make a fuss about it."
 ev10.119.a1:0 "The arrest was successful"
 ev10.119.a2:0 "The perpetrator escaped"
 ultimate_spell_place_of_power1_modifier:0 "$building_witch_house$"
 ultimate_spell_place_of_power2_modifier:0 "$building_mage_house$"
 ultimate_spell_place_of_power3_modifier:0 "$building_horned_god_house$"
 di_mammon_support_modifier:0 "Supported by Mammon"
 di_abraxas_support_modifier:0 "Supported by Abraxas"
 di_astaroth_support_modifier:0 "Supported by Astaroth"
 ev10.121.title:0 "The Apocalypse"
 ev10.121.desc:0 "You have heard terrible news about [evil_seed.GetName]. It is said that the ruler there was overthrown and murdered during a palace coup. An unknown knight now reigns there - along with a small group of supporters, he swiftly took power and established a bloody order in the realm. He is supposedly called Bael, although it is unclear whether that is a nickname or his real name. It is said that he is not human, that steel cannot harm him, that he can kill with a glance, and read minds. Many people believe that this is the fulfillment of a prophecy and the harbinger of the imminent end of the world. No matter how much truth there is in it, Bael's ambitions are great, as his armies grow larger every day."
 ev10.121.a:0 "He may be a threat."
 di_supports_title:0 "Bael loses an ally!"
 di_supports_ct:0 "Bael becomes weaker without supporters."
 ev10.122.desc:0 "In front of you, in a magical flash, appeared Hecate.\n'Uh, you have no idea how hard it is to get to Earth if no mage is summoning you. It's a challenge even for a master of magic.'"
 ev10.122.a:0 "What are you doing here?"
 ev10.123.desc:0 "'I have come to warn you. Bael has arrived.'"
 ev10.123.a:0 "I have heard some rumours."
 ev10.124.desc:0 "'This is a full-scale invasion. Bael intends to conquer this world and turn humans into his slaves - at least those who survive. He has the resources to accomplish this.'"
 ev10.124.a:0 "He must be stopped."
 ev10.124.b:0 "Why is that my problem?"
 ev10.125.desc:0 "'Bael will sooner or later begin exterminating the local mages. Essentially, you are the only threat to him. However, he also has enemies outside who send you their regards. You are in a difficult situation, but - although I cannot openly intervene - I can pass on helpful information to you.'"
 ev10.125.a:0 "Fine. Who is this Bael?"
 ev10.126.title:0 "Preparing for the Apocalypse"
 ev10.126.desc:0 "He is one of the demonic princes, an ambitious bloodlust. He is a warrior and a leader, once ruling one of the circles of Hell. Now he wants to regain his prestige and rank. But that's not the problem. According to an old rule, the Apocalypse is done in fours. Bael has been joined by Abraxas, Mammon, and Astaroth. Together, they can easily crush any enemy."
 ev10.126.a:0 "Tell me about Mammon."
 ev10.126.b:0 "Who is Abraxas?"
 ev10.126.c:0 "What do you know about Astaroth?"
 ev10.127.a:0 "Thanks for the information."
 ev10.127.desc:0 "Haven't you met Mammon? He pretends to be naive, but he's a seasoned player. He preys on human greed and has a knack for transmutation. As long as he's on the board, Bael will not lack gold or allies."
 ev10.128.desc:0 "Abraxas is my eternal rival. He would very much like to take my position at Lucifer's court as his court mage, but he is not even half as good as I am. Although, I must admit he knows a few good spells. He will certainly protect Bael from any magical attack and he can be dangerous to the ordinary mage as well."
 ev10.129.desc:0 "Astaroth 'The Hellhound'. He is the chief huntsman of Hell, a headhunter and an executor sent after the souls of particularly stubborn mortals. He is also Lucifer's great champion, probably the most effective since Kali 'The God-Slayer'. He... We were once close. Very close. That's why I know the secret of his power."
 ev10.129.a:0 "I understand that you will share this secret with me?"
 ev10.130.desc:0 "'Yes, but it won't change anything. Astaroth is an anti-mage, able to suppress magic around him with his will. He never said where he got this power from; perhaps it is a gift from some deity. So, you won't defeat him with a spell. You won't defeat him with a sword either, as he is a master swordsman with a thousand years of experience. You won't surprise him because you won't find him - he will find you. And that will be your end. He is unbeatable and unstoppable, without any weaknesses.'\nIn Hecate's voice, you hear an unhealthy fascination and admiration. Perhaps not all old feelings have been forgotten."
 ev10.130.a:0 "Sounds like a formidable opponent."
 ev10.131.desc:0 "Let's hope that Bael doesn't send him after you. I think even he fears him. In fact, probably everyone except Lucifer and Asmodeus fears Astaroth."
 ev10.132.desc:0 "'That's all I can do for you. Your chances are not great, but... I hope you have an ace up your sleeve. Good luck.' - after these words the demoness disappeared."
 ev10.132.a:0 "Thanks for believing in me..."
 ev10.134.desc:0 "That night, you couldn't sleep. You tossed and turned, filled with foreboding. Finally, in the middle of the night, you decided to take a short walk to clear your mind. As you were getting out of bed, the door to your bedroom exploded. An intruder entered like death itself. Instinctively, you tried to cast any spell, but your power had left you. Anti-magic! This was the demon Hecate had spoken of. The hellhound had come for you."
 ev10.134.a:0 "I'll grab my sword!"
 ev10.134.b:0 "Quickly, to the window!"
 ev10.134.vamp_escape:0 "Blow past him and take the door!"
 ev10.134.vamp_escape_tt:0 "You speed forward — by the time their steel flashes, you’re already through the threshold due to your supernatural speed."
 ev10.134.wolf_escape:0 "Leap through the window!"
 ev10.134.wolf_escape_tt:0 "You drive your shoulder through frame and glass, hitting the ground hard but thankfully you have supernatural healing, and you don't look back."
 ev10.134.hunter_escape:0 "Toss the bedsheets and disappear!"
 ev10.134.hunter_escape_tt:0 "You toss the bed sheets over them, break line of sight, and slip out the exit. Training beats bravado."
 ev10.134.demon_escape:0 "Disapparate out."
 ev10.134.demon_escape_tt:0 "One heartbeat here, the next… somewhere else. It’s the apocalypse — anything goes, including demons."
 ev10.1344.desc:0 "You put distance between yourself and the intruder—fast.\n\nThe night swallows your footfalls as you slip through a side door and into the alley’s gloom. Without your supernatural edge, you would be dead. Not tonight."
 ev10.1344.a:0 "You live to fight another day. So starts the Apocalypse."
 ev10.1344.a.tt:0 "'Astaroth loses your trail, for now.' So starts the Apocalypse."
 ev10.135.desc:0 "Your actions were to no avail. The demon is inhumanly fast; one moment it was at the door, and the next it had grabbed your arm and thrown you against the wall. Were it not for the paralyzing fear, the pain of your broken ribs would likely overshadow everything else. Astaroth stood over you, ready to crush you with one move. This is the end."
 ev10.135.a:0 "No one can resist my power!"
 ev10.135.a_ct:0 "#P You are breaking Astaroth's anti-magic power!#!"
 ev10.135.b:0 "Wait! Hecate... Hecate misses you!"
 ev10.136.desc:0 "The demon froze in place. 'What?' - he asked, surprised. You feel that your confession has distracted him, his anti-magic momentarily disappeared. You can cast a spell!"
 ev10.137.desc:0 "Your spell turned the surprised demon into a pile of ashes. You don't know whether it was completely destroyed or merely sent back to hell, but it certainly no longer poses a threat."
 ev10.137.a:0 "So, he did have a weakness after all."
 astaroth_self_modifier:0 "$astaroth_name$"
 abraxas_self_modifier:0 "$abraxas_name$"
 ev10.138.desc:0 "Hecate suddenly appeared before you, surprising you once again. The demoness looks excited.\n'Astaroth returned to hell, if I understand correctly, not of his own will. But of his own will, he immediately came to talk to me. I don't know what you told him, but things between us have changed for the better. With him, I feel like I am a thousand years old again!'"
 ev10.138.a:0 "Well, I am pleased to hear that..."
 ev10.139.desc:0 "I don't like to owe anyone anything. Take this ring, and we'll be even. Let's never speak of this again. Farewell."
 ev10.139.a:0 "Farewell."
 DS_YOU_HAVE_AS:0 "Fears your Ancient Singularity: $VALUE|=+0$"
 demon_text:0 "demon"
 mortal_text:0 "mortal"
 mortal_or_demon:0 "[ROOT.Char.Custom('GetMortalDemon')]"
 ev10.140.desc:0 "The room grew hot, and the smell of sulfur intensified. Suddenly, you heard the crack of lightning, and a demon's silhouette appeared in the summoning circle.\n'So you are a fool after all' - said Asmodeus."
 ev10.140.a:0 "I want to challenge you!"
 ev10.140.b:0 "Sorry, my mistake! Disappear..."
 ev10.140.c:0 "I'll kill you, you bastard!"
 ev10.141.desc:0 "'I just arrived, and you're already kicking me out? That's not how you treat guests. But I have a great idea! You probably lack a role model. I'll show you what hospitality looks like in hell. After you.'\nAsmodeus snapped his fingers, and your life was extinguished in an instant."
 ev10.142.desc:0 "'Can you repeat that? I think I misunderstood you.'"
 ev10.142.a:0 "Y... Yo... Y..."
 ev10.143.desc:0 "'Hmm, for a moment I thought you were going to ask me not to kill your family. That would have been a nice wish. Very fitting.'"
 ev10.143.a:0 "$ev10.142.a$!"
 ev10.144.desc:0 "'I still don't understand. Oh well, never mind. It's time to go back to hell. I think I'll take a few people with me for company.'\nAfter those words, the demon snapped his fingers and disappeared. You feel that something very bad has happened."
 ev10.145.desc:0 "'Humans are born fools, and it seems that most of them also die fools. Fine, I accept your challenge. Let's do this quickly, I have a busy schedule today.'"
 HAS_COUNTERMEASURE_WITHDRAW:0 "The target has $scheme_countermeasure_type_withdraw_from_view$ [scheme_countermeasure_countermeasure|E]."
 ev10.146.desc:0 "The banishment spell worked - the demon is gone. Looks like you won this clash..."
 ev10.146.a:0 "I need a bigger challenge."
 hells_envoy_modifier:0 "Hell's Envoy"
