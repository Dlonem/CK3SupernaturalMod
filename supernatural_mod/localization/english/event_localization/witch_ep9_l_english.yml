 ev7.105.l:0 "Ancient Singularity should be sealed."
 ev7.105.l_ct:0 "Ancient Singularity will be deactivated."
 ev7.105.l_flav:0 "No single person should wield such power."
 ev10.158.title:0 "Will of the Congregation"
 ev10.158.desc:0 "The Congregation of Mages has decided that the Ancient Singularity must be destroyed or deactivated. There is no appeal against this decision; you must do it immediately. Of course, you can oppose it, but the consequences will be significant."
 ev10.158.a:0 "I will fulfill their will."
 ev10.158.b:0 "I will never agree to this!"
 asmodeus_beaten:0 "Asmodeus Defeated!"
 ev10.159.desc:0 "You are now the rector of the Academy of Magic. The operations and policy of the institution are now entirely subject to your will."
 ev10.159.a:0 "My school will be open to everyone!"
 ev10.159.a_ct:0 "Unlocks Arcane Focus for every true witch."
 ev10.159.a_ct2:0 "The next rector will be able to revoke this decision."
 ev10.159.b:0 "The Academy will be available for my House."
 house_magic_academy_modifier:0 "$building_mage_house$"
 ev10.159.c:0 "I will introduce a strict selection of students."
 ev10.159.c_ct:0 "From time to time, a new mage may appear in your court."
 ev10.159.d:0 "The academy will only serve my own research."
 ev10.160.title:0 "Academy trained mage"
 spell_will_be_cast_ct:0 "The spell will be cast."
 magic_target_confirmed_ct:0 "Your enemies have been attacked by a spell!"
 ev2.5.g:0 "I will sabotage [enemy.GetHerHis] research."
 ev2.5.g_ct:0 "Your research has been sabotaged!"
 ev10.161.title:0 "Singularity Malfunction"
 ev10.161.desc:0 "Recently, you've noticed that the Ancient Singularity exhibits some abnormal behavior. It sometimes emits strange sounds or trembles when you try to use it. And when you do, its power seems to be more chaotic, resulting in reduced accuracy (which doesn't matter much due to its massive blast radius, but is still concerning). You've managed to access the indicators hidden in the glove, but you don't understand them - except that they all light up red, which probably isn't a good sign."
 ev10.161.a:0 "I will try to recalibrate the glove."
 ev10.161.b:0 "Probably nothing to worry about, right?"
 ev10.162.desc:0 "Over the past few days, you've conducted numerous measurements and studies on the Singularity, but you have no idea how to fix the malfunction — if it even is a malfunction. All you've managed to determine is that the device is overloaded — each subsequent use could lead to a massive explosion."
 ev10.162.a:0 "Maybe I should get rid of it?"
 ev10.163.desc:0 "Today, you noticed that the Singularity is emitting a slight smoke. You can also sense that the device has started to emit strong radiation, which is likely very harmful to health."
 ev10.163.a:0 "This artifact is cursed!"
 ev10.164.title:0 "Ancient Singularity Explodes!"
