 mc_no_position_tooltip:0 "#N No one currently holds this position#!"
 mc_archmage_name:0 "[GetGlobalVariable( 'current_archmage_global' ).Char.GetShortUINameNotMeNoTooltip]"
 mc_loremaster_name:0 "[GetGlobalVariable( 'current_loremaster_global' ).Char.GetShortUINameNotMeNoTooltip]"
 mc_black_mage_name:0 "[GetGlobalVariable( 'current_black_mage_global' ).Char.GetShortUINameNotMeNoTooltip]"
 mc_admin_name:0 "[GetGlobalVariable( 'current_admin_global' ).Char.GetShortUINameNotMeNoTooltip]"
 mc_test_test:0 "[GetModifier('dchamp_secret_protection_modifier').GetNameWithTooltip]"
 mc_gold:0 "@gold_icon![GetGlobalVariable( 'mc_gold_global' ).GetValue]"
 mc_gold_desc:0 "High Council funds"
 mc_archmage_modifier:0 "Archmage"
 mc_archmage_modifier_desc:0 "Archmage heads the High Council of Mages - no important decision of the Council can be made without his approval. He is usually the most powerful or influential of the mages."
 mc_loremaster_modifier:0 "Lore Master"
 mc_loremaster_modifier_desc:0 "Lore Master is a mage of unquestionable knowledge and high magical skills. In the council, he acts as an expert on extreme magical phenomena and is also involved in all kinds of magical research."
 mc_black_mage_modifier:0 "Black Mage"
 mc_black_mage_modifier_desc:0 "Black Mage deals with security issues, and can act as an investigator or executor if the situation requires it."
 mc_admin_modifier:0 "Council Administrator"
 mc_admin_modifier_desc:0 "Administrator deals with financial and bureaucratic matters and is authorised to manage the $mc_gold_desc$. This is usually someone who is proficient in stewardship and familiar with politics."
 mc_supporter_modifier:0 "High Council Supporter"
 mc_supporter_modifier_desc:0 "Some support the High Council out of fear, while others hope for the Archmage's favor."
 game_concept_high_mage_council:0 "$mc_full_name$"
 game_concept_high_mage_council_desc:0 "The High Council consists of the Archmage and three other mages appointed by them. The Council possesses resources and influence that would be envied by many emperors - the decisions of the council significantly impact the fate of the world. Outside the circle of mages, the existence of the Council is a secret — until the Council decides to reveal its existence to the rest of the world."
 game_concept_mc_funds:0 "$mc_gold_desc$"
 game_concept_mc_funds_desc0:0 "The High Council can dispose of a special fund to cover its activities or provide grants."
 game_concept_mc_funds_desc1:0 "$game_concept_mc_funds_desc0$\nThe fund currently contains $mc_gold$ gold."
 game_concept_mc_funds_desc:0 "[GetPlayer.Custom('MC_FUNDS_DESC')]"
 mc_archmage_may_appoint_tooltip:0 "You can appoint a new council member using the Invite to High Council [interaction|E]."
 IS_MC_MEMBER:0 "Target is a member of the High Council."
 invite_to_high_council_interaction:0 "Invite to High Council"
 invite_to_high_council_interaction_desc:0 "You can fill the empty position in the [high_mage_council|E]."
 MC_IS_FULL:0 "There are no vacant positions on the High Council."
