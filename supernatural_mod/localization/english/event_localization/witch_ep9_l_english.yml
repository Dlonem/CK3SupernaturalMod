 ev10.9.title:0 "Magic Cataclysm"
 ev10.9.desc:0 "You can feel the influx of immense energy - a very powerful spell, too powerful to counter. A stream of destructive power has struck from the sky, and you feel the tremors intensifying with each passing moment. A shockwave is coming..."
 ev10.9.a:0 "I will conjure up a magic shield!"
 ev10.9.a_ct:0 "#N Many characters in your location will die or suffer injuries#!."
 ev10.9.b:0 "I need to find shelter!"
 ev10.9.d:0 "I will endure."
