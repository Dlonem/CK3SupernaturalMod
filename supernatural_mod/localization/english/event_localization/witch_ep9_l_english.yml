 ev10.147.desc:0 "The elevated atmosphere of the Grand Rite has inspired you to take action. You feel that you are able to slightly improve your protective amulet."
 ev10.147.a:0 "I will add a rune to strengthen the amulet."
 ev10.147.b:0 "I will imbue the amulet with my magic."
 ev10.148.desc:0 "Despite the chaos of the battle, you spot [ecommander.GetTitledFirstName]. Reaching him shouldn't pose a problem for you - it's the perfect opportunity to eliminate [ecommander.GetHerHim]. Assuming you can handle [ecommander.GetHerHim]..."
 ev10.148.a:0 "It's time for a mage duel."
 ev10.148.b:0 "For now, I prefer to avoid direct confrontation."
 ev10.149.desc:0 "You see [ecommander2.GetTitledFirstName] breaking through to your position, using spells and [ecommander2.GetHerHis] personal guard. [ecommander2.GetSheHe|U] is heading straight for you, intending to challenge you!"
