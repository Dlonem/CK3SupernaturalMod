 appoint_me_to_high_council_interaction:0 "Request High Council appointment"
 appoint_me_to_high_council_interaction_desc:0 "$appoint_me_to_high_council_interaction$"
 MC_APP_PROPOSAL1:0 "I wish to request a nomination to the High Council of Mages for the position of $mc_loremaster_modifier$. I believe I am an excellent candidate and will contribute significantly to the Council's work."
 MC_APP_PROPOSAL2:0 "I wish to request a nomination to the High Council of Mages for the position of $mc_black_mage_modifier$. I believe I am an excellent candidate and will contribute significantly to the Council's work."
 MC_APP_PROPOSAL3:0 "I wish to request a nomination to the High Council of Mages for the position of $mc_admin_modifier$. I believe I am an excellent candidate and will contribute significantly to the Council's work."
 mc_meeting_decision_confirm:0 "Call a meeting"
 mc_meeting_decision_name:0 "Call a secret High Council meeting"
 mc_meeting_decision_desc:0 "The Council will meet to discuss the current situation."
 mc_meeting_decision_ct:0 "The High Council will begin its meeting immediately."
 MC_HAS_FREE_SLOTS:0 "Not all positions on the Council are filled."
 MC_HAS_IMPRISONED_MEMBER:0 "Not all council members can attend the meeting."
 MC_HAS_INTERNAL_WAR:0 "You are at war with a council member."
 mc_admin_special1_terrain_cancel_negative_supply:0 "Has access to $mc_manage_funds_decision_name$ [decision|E]"
 mc_manage_funds_decision_name:0 "Manage of Council Funds"
 mc_manage_funds_decision_desc:0 "Magic and gold are the main tools with which the Council can influence the world. The Council Administrator is responsible for managing financial resources."
 mc_manage_funds_decision_ct:0 "You will be able to increase (or decrease) the [mc_funds|E]."
 mc_resign_position_decision_name:0 "Quit the High Council of Mages"
 ms_path_to_mc_ct:0 "The [high_mage_council|E] will be formed!"
 YOU_NEED_5000_PREST:0 "You need 5000 prestige!"
 remove_from_high_council_interaction:0 "Recall from the High Council"
 remove_from_high_council_interaction_desc:0 "$remove_from_high_council_interaction$"
