 ev10.17.desc:0 "You can see that the artifact has changed its structure, adapting to the shape of your hand. It is armed and ready for use."
 magic_catalyst_desc2:0 "A mysterious stone that, according to legends, fell from the sky many eons ago."
 cut_schemes_decision_title:0 "Fight the Schemes"
 cut_schemes_decision_desc:0 "You are aware of the conspiracies against you - all resources should be used to fight them before it is too late."
 cut_schemes_decision_ct:0 "You will attempt to thwart the plans of the conspirators."
 ev10.18.desc:0 "Conspirators are plotting against you and could strike at any time. You need to give orders to your guards, start interrogations and set rewards in exchange for information on traitors. Let them feel that their actions will not go unpunished!"
 ev10.18.a:0 "I will shake up my entire court."
 ev10.18.b:0 "This is a job for my spy master."
 ev10.18.b_ct:0 "Spy Master failed"
 ev10.18.a_ct1:0 "One hostile scheme will be terminated"
 ev10.18.a_ct2:0 "One of the conspirators may be arrested"
 ev10.18.a_ct3:0 "#N Your scheme has been interrupted!#!"
 ev10.18.a_ct4:0 "Other schemes may be revealed"
 ev10.18.c:0 "I will read the thoughts of my courtiers."
 ev10.18.c_ct:0 "You will use the $mind_scan$ spell"
