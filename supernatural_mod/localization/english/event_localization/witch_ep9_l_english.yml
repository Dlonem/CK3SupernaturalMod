 ev10.24.desc:0 "You have arrived at the place where [recipient.GetTitledFirstName] used to stay until recently, but it looks like [recipient.GetSheHe] is no longer here. Perhaps someone warned [recipient.GetHerHim], or maybe [recipient.GetSheHe] just got lucky."
 ev10.24.a:0 "I will not return empty-handed."
 ev10.25.desc:0 "You have effortlessly tracked down your target. [recipient.GetTitledFirstName] tried to escape, but you were ready for that too. One blow crushed [recipient.GetHerHis] chest, killing [recipient.GetHerHim] on the spot."
 ev10.26.desc:0 "You have managed to find [recipient.GetTitledFirstName], however, [recipient.GetSheHe] is ready to fight. It looks like one of you is going to die soon."
 ev10.26.a:0 "Like a lamb to the slaughter."
 ev10.26.b:0 "Well, I'll spare [recipient.GetHerHis] this time."
 ev10.26.b_ct:0 "You give up on confrontation."
 ev10.27.desc:0 "You hear a disturbing noise. At the same moment, one of your men appears with important information - it's [actor.GetTitledFirstName], [actor.GetSheHe] has broken through your guards, breaking your knights like matchsticks. [actor.GetSheHe|U]'s not human, [actor.GetSheHe]'s a bloodthirsty demon!"
 ev10.27.a:0 "I will face [actor.GetHerHim]!"
 ev10.27.b:0 "Cover my escape!"
 ev10.27.b_ct:0 "You have failed to escape!"
 ev10.27.c:0 "Summon the court mage, quickly!"
 ev10.27.d:0 "Tell [actor.GetHerHim]... that I surrender."
 ev10.27.d_ct:0 "You can lose the [my_war.GetName]."
 ev10.28.desc1:0 "Guards at the castle gate tried to stop you - you killed them. The portcullis quickly closed - you snatched it with a strong jerk and threw it into the moat. Several knights tried to confront you in the courtyard - you massacred them."
 ev10.28.desc2:0 "The camp guard tried to stop you, so you snapped his head off with one hand. Two more rushed at you, but you simply tore them to pieces. A commotion broke out in the camp, people started shouting and running away."
 ev10.28.desc3:0 "\n[aprotector.GetTitledFirstName] appeared in front of you, ready to fight. Clearly [recipient.GetTitledFirstName] has found a defender for [recipient.GetHerHim]self. Well, one more corpse won't make a difference today."
 ev10.28.a:0 "Die, [aprotector.GetName]."
 ev10.29.desc1:0 "Now that the warm-up is behind you, it's time to deal with [recipient.GetTitledFirstName]. You had to kill a few more soldiers along the way, but eventually you found [recipient.GetHerHim]. [recipient.GetSheHe|U] seems to want to defend [recipient.GetHerHim]self. Pathetic."
 ev10.29.desc2:0 "\nFinally, [recipient.GetTitledFirstName] appeared."
 ev10.31.desc:0 "[recipient.GetSheHe|U] has made you an offer - [recipient.GetSheHe] is prepared to capitulate in the war in exchange for [recipient.GetHerHis] pathetic life."
 ev10.29.a:0 "Here is your end."
 ev10.29.a_it:0 "A clash ensued!"
 ev10.29.a_ct:0 "You have been slaughtered."
 ev10.29.b:0 "I have changed my mind. Goodbye."
 ev10.29.b_it:0 "The demon is gone, but many have died."
 ev10.30.desc:0 "Your liege summoned you immediately - [liege0.GetHerHis] court is under attack by [actor.GetTitledFirstName]. You are ordered to defeat the demon before it is too late. You see that [liege0.GetTitledFirstName] is desperate and fears for [liege0.GetHerHis] life."
 ev10.30.a:0 "I will face the demon."
 ev10.30.a_ct:0 "You will have to fight."
 ev10.30.b:0 "[liege0.GetTitledFirstName] has got what [liege0.GetSheHe] deserves."
 ev10.30.b_ct:0 "Your court mage has refused to help!"
 extra_output_event_ct:0 "Your court mage failed"
 ev10.31.a:0 "No... you will die here and now."
 ev10.31.a_ct:0 "The demon has rejected your surrender."
 ev10.31.b_ct:0 "The demon has accepted your surrender."
 trait_track_hell_powers:0 "$trait_track_demon$"
 trait_track_hell_powers_desc:0 "Your Hell's Powers develop when you consume the souls of mortals (via cyrographs)."
 trait_track_demon_reputation:0 "Reputation"
 trait_track_demon_reputation_desc:0 "Your reputation increases when you kill mages or greater demons."
 demonic_reputation_title:0 "Demonic Reputation"
 greater_demon:0 "$ev6.5.0.a$"
 action_lifestyle_demonic:0 "$action_can_spend_perk_point_label$"
 action_lifestyle_demonic_desc:0 "$action_can_spend_perk_point_desc$"
 action_lifestyle_demonic_click:0 "$action_can_spend_perk_point_click$"
 demonic_knights_max_size_add:0 "$demonic_knights$ [regiment|E] size"
 archmage_flavourization:0 "Archmagess"
 archmage_flavourization2:0 "Archmage"
 mage_duel_warnings_ct1:0 "You estimate that the duel may be evenly matched."
 mage_duel_warnings_ct2:0 "Estimated winner: [recipient.GetShortUIName]"
 mage_duel_warnings_ct3:0 "Estimated winner: [actor.GetShortUIName]"
 ev10.32.title:0 "Being a Demon"
 ev10.32.desc:0 "Every day you learn something new about your nature and heritage. You are probably able to accelerate the process of developing your skills, but this may come with some side effects. Or perhaps it's better to call it an additional benefit? You have to judge for yourself."
 ev10.32.a:0 "I will do what I can." 
 ev10.32.a_ct:0 "You will gain Demonic [lifestyle|E] perk point"
 ev10.32.b:0 "There is no rush..."
 ev10.33.desc:0 "Your observations of the diplomatic and political manoeuvres of the surrounding rulers gave you an idea. A few simple machinations would be enough for this region to experience serious conflicts. The implementation of this plan could be enlightening.... and entertaining."
 ev10.33.a:0 "I'll do it!"
 ev10.33.b:0 "I will refrain from action for the time being."
 ev10.34.desc:0 "Your nature demands to be set free. The lust for blood and destruction must be released. Your instinct tells you that this is the fastest way to achieve greatness."
 magic_slaughterer_modifier:0 "Slaughterer"
 ev10.34.a:0 "Yes, I need this."
 ev10.34.b:0 "I will refrain this time..."
 demonic_courtier_name:0 "Recruit a Demonic Courtier"
 demonic_courtier_name_desc:0 "Demons are treacherous, but they are usually more competent than mortals."
 demonic_courtier_desc:0 "$demonic_courtier_name_desc$"
 demonic_courtier_ct:0 "A minor demon will join your court"
 demon_courtier_terrain_cancel_negative_supply:0 "Unlocks $demonic_courtier_name$ [decision|E]"
 ev6.71.desc3:0 "Every sorcerer should have a place where they can practise their magic and develop their powers. Building a suitable building seems a sensible move - but where should it be built?"
 ev6.71.0.g:0 "[place0.GetName] is the obvious choice."
 liar_liar_modifier:0 "$fraudster_opinion$"
 fraudster_opinion:0 "Fraudster"
 secret_false_mage:0 "False Mage"
 secret_false_mage_desc:0 "You pretend to be a mage"
 secret_false_mage_tooltip_desc:0 "$secret_false_mage$"
 secret_false_mage_type_desc:0 "Pretending to be a mage can sometimes bring additional influence and respect, although it can also attract witch hunters."
 YOU_ARE_FALSE_MAGE:0 "You are a false mage!"
 ev5.28.desc0:0 "Your opponent gestures with [char2.GetHerHis] hands and mumbles some words, but you see no effect from [char2.GetHerHis] spells."
 secret_witch_hunter:0 "Witch Hunter"
 secret_witch_hunter_desc:0 "You are an undercover witch hunter"
 secret_witch_hunter_tooltip_desc:0 "$secret_witch_hunter$"
 secret_witch_hunter_type_desc:0 "A witch-hunter can operate more effectively if his identity and skills remain a secret."
 ev10.35.desc:0 "A brilliant idea came to your mind - you can use the cunning and skills you have gathered so far to slightly exaggerate your competencies in the eyes of others. Pretending to be an expert in black magic, a proficient adept of the arcane arts, could bring you many benefits, including recognition and perhaps gold. There are many gullible rulers who would fall for simple tricks."
 ev10.35.a:0 "Sure, I am a mighty [just_me.Custom('GetSorcererBySex')]!"
 ev10.35.b:0 "This is too risky."
 ev10.36.desc:0 "It seems that many people have come to believe that you possess secret, magical powers. Some think these are gifts from God, the result of fervent prayers and meditation, but others gossip that it is the outcome of dealings with the devil. This aura of mystery around you certainly unsettles your enemies, but it may also attract new friends."
 laamp_magic_1012_contract:0 "Lifting the Curse"
 laamp_magic_1012_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and solving a problem using the magic or deception and the [intrigue|E] skill."
 laamp_magic_1012_desc_title:0 "$laamp_magic_1012_contract$"
 laamp_magic_1012_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] believes there is a curse on [TaskContract.GetEmployer.GetHerHim]. [TaskContract.GetEmployer.GetSheHe|U] is willing to pay a specialist to help [TaskContract.GetEmployer.GetHerHim] break it."
 ev10.37.desc:0 "You can see that [employer.GetTitledFirstName] is treating your visit with suspicion - [employer.GetSheHe] probably doesn't want to appear as a superstitious ruler, nor does [employer.GetSheHe] want anyone to associate them with 'supernatural' matters and witchcraft."
 ev10.37.a:0 "I promise to keep it confidential."
 ev10.38.desc:0 "For the past year, [employer.GetTitledFirstName] has been plagued by bad luck; many of [employer.GetHerHis] ventures have failed. It seems this misfortune also affects those around [employer.GetHerHim]. [employer.GetTitledFirstName] tried to appease God with fervent prayers and offerings, but the church altar fell on [employer.GetHerHim], nearly killing [employer.GetHerHim]. Eventually, a fortune teller said that [employer.GetTitledFirstName] is cursed. In his opinion, only a skilled adept of magic will be able to solve this problem."
 ev10.38.a:0 "I'll see what I can do."
 ev10.38.b:0 "I am not competent enough in these matters."
 ev10.39.desc2:0 "You did some quick tests - it looks like [employer.GetTitledFirstName] is indeed cursed. Fortunately, it's a simple minor curse. It should expire on its own within a few years, but an proficient sorcerer could accelerate the process considerably."
 ev10.39.desc1:0 "You have no idea whether it's a curse, a punishment from God, or just bad luck, but [employer.GetTitledFirstName] apparently expects some support from you, perhaps just a word of encouragement. Maybe you could simply pretend that you've lifted the curse?"
 ev10.39.a:0 "I will simply clear [employer.GetHerHis] aura."
 ev10.39.b:0 "I cannot help but think it's indeed a curse."
 ev10.39.c:0 "I pretend to cast a 'counter-spell'."
 ev10.40.opening:0 "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ev10.40.desc:0 "I am very interested in the subject of sorcery and magic, and I have heard that you are an expert in these fields. Perhaps you would like to tell me more about these secret arts? I am curious if they can be used to improve the situation in my realm, for the good of my subjects, of course."
 ev10.40.a:0 "I am an expert! But knowledge comes at a price..."
 ev10.40.a_ct:0 "This will certainly fuel curiosity."
 ev10.40.b:0 "I will reply politely, but in general terms."
 ev10.40.c:0 "I will ignore this letter."
 ev10.41.desc:0 "Thank you for your response. It looks like you are someone who knows their stuff - exactly the kind of person I need. I wanted to offer you the position of court mage, and in return, you will receive protection as my vassal. I eagerly await your response."
 ev10.41.a:0 "Of course, I accept!"
 ev10.41.b:0 "I am not interested."
 mage_court_alchemy:0 "Alchemical Research"
 mage_court_alchemy_desc:0 "The court mage will focus on potion production and transmutation of lead into gold."
 mage_court_black_magic:0 "Casting Spells"
 mage_court_black_magic_desc:0 "The court mage will attempt to cast spells that can harm your enemies or positively affect your realm."
 mage_court_rituals:0 "Assisting in Rituals"
 mage_court_rituals_desc:0 "The court mage will support your efforts to study magic."
 cm_task_1_terrain_cancel_negative_supply:0 "You can obtain magic potions or gold"
 cm_task_2_terrain_cancel_negative_supply:0 "The court mage can harm your rivals and war enemies with magic"
 ev10.42.title:0 "Duties of the Court Mage"
 ev10.42.desc:0 "Your liege is expecting results in the field of alchemical research. It would be good to give [liege0.GetHerHim] some gold as proof of your progress, this should satisfy [liege0.GetHerHim] for a while."
 ev10.42.a:0 "I will say that I have turned lead into gold."
 ev10.42.b:0 "There will be more of this in the future, much more!"
 ev10.42.b_ct2:0 "You promise a lot to gain some time."
 ev10.42.c:0 "I will ask for more time."
 ev10.42.d:0 "I will present my research notes."
 ev10.42.e:0 "Actually, I can turn lead into gold."
 ev10.42.title_ct:0 "Court Mage's efforts"
 cm_research_notes_modifier:0 "Notes of the Court Mage"
 ev10.43.desc1:0 "Your court mage, [cmage.GetTitledFirstName], has a simple goal - to produce gold from lead. [cmage.GetSheHe|U] claims it's possible, but so far [cmage.GetSheHe]'s not fulfilling [cmage.GetHerHis] duties. When you ask [cmage.GetHerHim] to present the results of [cmage.GetHerHis] work, [cmage.GetSheHe] claims [cmage.GetSheHe] still needs more time."
 ev10.43.desc2:0 "Your court mage, [cmage.GetTitledFirstName], has a simple goal - to produce gold from lead. [cmage.GetSheHe|U] claims it is possible, but when you checked the progress of [cmage.GetHerHis] work you found that [cmage.GetSheHe] had produced a small lump of gold worth 5 coins. That's not very much, although [cmage.GetTitledFirstName] promises that this is just the beginning and there will be more in the future."
 ev10.43.desc3:0 "Your court mage says there is no guarantee that the curse [cmage.GetSheHe] is preparing will work - and that the incantation requires a lot of time. You must be patient."
 ev10.43.desc:0 "Your court mage, [cmage.GetTitledFirstName], consumes a lot of resources, but [cmage.GetHerHis] work has not yielded any results lately. To your urgings and questions, [cmage.GetSheHe] responds that [cmage.GetSheHe] needs more time."
 ev10.43.a:0 "You have all the time you need."
 ev10.43.a_ct:0 "The court mage will not be in a hurry with his tasks."
 ev10.42.b_ct:0 "Your liege may be losing patience."
 ev2.65.a_ct:0 "Your liege is starting to lose patience."
 ev10.42.a_ct:0 "Liege is satisfied"
 ev10.44.desc:0 "You have managed to produce significant amounts of gold. In fact, such a transmutation would certainly have pleased your liege. Perhaps it is worth repeating the process, as part of your duties as a court mage?"
 ev10.44.a:0 "Yes, my liege will appreciate it."
 ev10.44.c:0 "Yes, but I expect something in return."
 ev10.44.b:0 "I need to save my power for later."
 ev10.45.desc:0 "You have managed to produce the potion, however, one thought does not give you peace of mind. As a court mage who deals with alchemy, you should give some of what you produce to your liege. Perhaps you should not keep this potion for yourself."
 ev10.45.a:0 "I will hand over this elixir to my liege."
 ev10.45.b:0 "For liege, I will prepare an additional concoction."
 ev10.45.c:0 "My liege will get the potion next time."
 ev10.46.title:0 "Lilith's Dilemma"
 ev10.46.desc:0 "Lilith summoned you in connection with some sort of emergency, apparently a matter of life and death - you had to interrupt a meeting with your councillors for this reason. When you asked what had happened, Lilith showed you two dresses. \n'I don't know which one I should wear today! The red one is nice, but I look like a goddess in the other one! What should I do, darling?'"
 ev10.46.a:0 "The red one is good."
 ev10.46.b:0 "The latter is definitely better."
 ev10.46.c:0 "I don't have time for that, woman."
 ev10.46.d:0 "I prefer you without clothes."
 ev10.47.title:0 "Lilith's Desires"
 ev10.47.desc:0 "Lilith came to you today with a very peculiar idea.\n'Let's have some fun in the dungeons! I'll play the frightened virgin accused of witchcraft, and you'll be the horny inquisitor! Sounds great, doesn't it?'"
 ev10.47.a:0 "If this is what you need..."
 ev10.47.b:0 "Actually, that's a great idea!"
 ev10.47.c:0 "Maybe another time."
 ev10.48.desc:0 "You have made your way to the dungeons. Lilith has chosen a place for you to play, but the problem is that it's right opposite the cell that [vic1.GetTitledFirstName] is in. [vic1.GetSheHe|U] will no doubt be watching closely everything you do, and knowing Lilith, there will be a lot to see. The demoness, however, was very pleased that you will have a spectator to this spectacle. 'Now I'm very horny! - she said - 'Chain me up!'"
 ev10.48.a:0 "Anything for you, my love..."
 ev10.48.b:0 "I can't do it, sorry."
 ev10.49.desc:0 "Once you had finished, Lilith approached the cell from which [vic1.GetTitledFirstName] was looking at you. [vic1.GetTitledFirstName] stared at her like in a trance as her hand slid between the bars to begin stroking [vic1.GetHerHis] chest. Suddenly Lilith abruptly withdrew her hand - the hand containing [vic1.GetName]'s still-beating heart. 'What? - she asked seeing your shocked look - 'I wanted [vic1.GetHerHim] to watch, but I didn't want [vic1.GetHerHim] to spread rumours.' - she made a mischievous grin."
 ev10.49.a:0 "Yes... right..."
 ev10.49.b:0 "..."
 ev10.49.c:0 "I love you, Lilith."
 ev10.49.d:0 "What a twist."
 ev10.50.desc:0 "Your liege, [liege0.GetTitledFirstName], expects you to fulfill the duties of the court mage and use magic to support [liege0.GetHerHim]. If you delay too long, [liege0.GetTitledFirstName] may lose [liege0.GetHerHis] patience."
 ev10.50.a:0 "I will cast a curse on [tchar1.GetTitledFirstName]."
 ev10.50.b:0 "[tchar2.GetTitledFirstName] will be cursed."
 ev10.50.c:0 "[tchar3.GetTitledFirstName] is a priority target."
 ev10.50.d:0 "I can enchant [tcounty.GetName]."
 ev10.50.e:0 "I know a useful incantation."
 ev10.50.f:0 "For now, I will refrain from taking action."
 ev10.50.g:0 "I pretend to cast a curse on [tchar1.GetTitledFirstName]."
 ev10.50.h:0 "Liege will appreciate a healing spell."
 ev10.50.i:0 "I've got something to slow down enemy armies."
 ev10.51.title:0 "Task for the Court Mage"
 ev10.51.desc:0 "This is probably a good time to point out a suitable target for your court mage. Let [cmage.GetHerHim] focus [cmage.GetHerHis] efforts on one of your enemies."
 ev10.51.a:0 "[tchar1.GetTitledFirstName] must be destroyed."
 ev10.51.b:0 "[tchar2.GetTitledFirstName] requires attention."
 ev10.51.c:0 "Something needs to be done about [tchar3.GetTitledFirstName]."
 ev10.51.d:0 "[tchar4.GetTitledFirstName] is an appropriate target."
 ev10.51.a_ct:0 "Your court mage will be encouraged to cast a spell on the chosen target."
 ev10.51.e:0 "Let's wait for a better moment."
 ev10.52.desc:0 "Your liege has set you a goal - with your magic you must destroy [tchar0.GetTitledFirstName], or at least harm [tchar0.GetHerHim] in some way."
 ev10.52.a:0 "Classically - I will use a curse."
 ev10.52.b:0 "This is the time for a powerful curse."
 ev10.52.c:0 "I'm going to try the plague spell."
 ev10.52.d:0 "Well... Firestorm."
 ev10.52.e:0 "I'm going to strike with Ancient Singularity."
 ev10.52.f:0 "It will take months to prepare such a spell..."
 ev10.52.f_ct:0 "Liege may get suspicious."
 ev10.52.g:0 "Today is my day off."
 ev10.52.x_ct:0 "Your court mage cast a spell: [cmage.Custom('LastSpellCast')]"
 ev10.53.desc:0 "You can see that your liege is very interested in secret knowledge, but lacks the elementary information to understand the theory of magic. Perhaps you should tell [liege.GetHerHim] some mysteries?"
 ev10.53.a:0 "[liege.GetSheHe|U] deserves it."
 ev10.53.a_ct:0 "Liege will become a witch."
 ev10.53.a_ct2:0 "Liege will not be interested."
 ev10.53.b:0 "[liege.GetSheHe|U]'s not ready."
 ev10.53.c:0 "I will sabotage [liege.GetHerHim]."
 ev10.54.desc:0 "Your court mage, [cmage.GetTitledFirstName], sees your interest in secret knowledge. [cmage.GetSheHe|U]'s ready to initiate you into some things if you want."
 ev10.54.a:0 "I am open to [cmage.GetHerHis] teachings."
 ev10.54.a_title:0 "Liege has accepted your teachings"
 ev10.54.b:0 "I prefer to stay away from it."
 something_has_gone_wrong_modifier:0 "Something has gone wrong"
 something_has_gone_wrong_modifier_desc:0 "Perhaps someone is sabotaging you or accidentally misleading you - it seems that some of the information you have gathered about magic is not true."
 ev10.55.title:0 "The ritual has failed"
 ev10.55.desc:0 "Despite meticulous preparations, the ritual of gaining power failed, with problems arising at the very first stage. It is difficult to say what the cause is, it is probably some miscalculation."
 ev10.55.a:0 "I'm certainly overtired."
 ev10.55.b_ct1:0 "You discover the cause of the problem"
 ev10.55.b_ct2:0 "You don't discover anything"
 ev10.56.desc:0 "Your investigation revealed that the ritual failed due to the gross incompetence of your court mage, [cmage.GetTitledFirstName]. It seems [cmage.GetSheHe] doesn't know anything at all about magic, [cmage.GetSheHe]'s a mere fraud!"
 ev10.56.a:0 "I can't believe it..."
 ev10.56.b:0 "Get [cmage.GetHerHim] to the dungeon!"
 ev10.56.desc_title:0 "Liege has discovered the truth!"
 ev10.57.title:0 "Expensive Magic"
 ev10.57.desc:0 "It is clear that the work of a court magician requires a lot of investment and expensive components. Perhaps it is worth asking [liege0.GetTitledFirstName] for additional funds?"
 ev10.57.a:0 "I will discuss this with [liege0.GetHerHim]."
 ev10.57.b:0 "My resources are sufficient."
 additional_magic_funds_modifier:0 "Research Fund"
 ev10.58.desc:0 "Your court mage, [cmage.GetTitledFirstName], has approached you with a request for additional funds for the magical research [cmage.GetSheHe] is conducting. [cmage.GetSheHe|U]  claims it's an investment that is sure to pay off."
 ev10.58.a:0 "[cmage.GetSheHe|U] will receive additional funding."
 ev10.58.b:0 "No."
 ev10.59.desc:0 "Your position as court mage and the trust [liege0.GetTitledFirstName] has in you makes you an important figure on the political chessboard. You are convinced that you can use this to your advantage."
 ev10.59.a:0 "This makes me more influential."
 ev10.59.b:0 "I expect a lot of bribes."
 ev10.59.c:0 "I am a welcome friend..."
 ev10.59.d:0 "...or a dangerous enemy."
 CM_MUST_HAS_ASSIGNED_TASK:0 "First you need to assign a task to the court mage."
 CM_HELPS_YOU_RITUALS:0 "Your court mage is actively helping you ($mage_court_rituals$)."
 press_court_mage1:0 "The court mage will be motivated."
 press_court_mage_decision_ct1:0 "The court mage will increase efforts."
 press_court_mage2:0 "The court mage takes the pressure badly."
 ev2.18.e:0 "You have no idea how screwed you are."
 DS_CYRO_HATES_U:0 "#N Target hates you#!: $VALUE|=+0$"
 ev10.61.desc:0 "It seems that the demon has retreated - perhaps it has already achieved its goal and satiated its terror? Perhaps it was just meant to be a message?"
 ev10.61.a:0 "Protection must be strengthened... for the future."
 ev10.61.b:0 "Something needs to be done about it."
 mc_disabled_tooltip:0 "#N High Council can only be formed by an Archmage.#!"
