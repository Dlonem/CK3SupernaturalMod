 magic_orb:0 "Orb of Truth"
 magic_orb_desc:0 "In the orb one can see the past or the present, and sometimes a foreshadowing of future events. The orb shows the truth, no more and no less."
 ev91.1.title:0 "Crystal Ball"
 ev91.1.desc:0 "A mysterious parcel was delivered to you today. A very indistinct inscription was engraved on the box, which you think meant 'Greetings from a friend'. You have no idea who this friend is, but inside the box you find an unusual, shimmering coloured sphere - no doubt a sorcerous artefact."
 magic_orb_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ exposes hostile schemes"
 magic_orb3_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ is more effective"
 magic_orb_terrain_advantage:0 "$prepare_scrying_decision$ cooldown"
 ev10.10.desc:0 "The orb shows you images that indicate that your life may be in danger. The visions are not entirely clear, but you are able to deduce the nature of the danger and prepare for it."
 ev10.10.a:0 "The conspirators will face punishment."
 ev10.10.a_ct:0 "Scrying will continue."
 ev10.11.desc:0 "You have gazed into the Orb of Truth seeking information and answers. You are able to view distant places and times, but many of the visions are random, and you have only partial control over what you observe."
 ev10.11.a:0 "Show me my court."
 ev10.11.a_ct:0 "You may discover new secrets"
 ev10.11.b:0 "Show me the neighbouring realms."
 ev10.11.c:0 "Show me the future."
 ev10.11.c_ct:0 "You can experience additional vision"
 ev10.11.d:0 "Show movements of enemy armies."
 war_intel_modifier:0 "War Intel"
 ev10.11.e:0 "Show me [starget.GetTitledFirstName]."
 useful_intel_modifier:0 "Useful Information"
 ev10.12.desc:0 "You see your castle from a bird's-eye view. The image zooms in and blurs, only to regain sharpness after a moment - you see your servants, guards, and courtiers going about their daily affairs. You spend a moment on these instructive observations..."
 ev10.13.desc:0 "In the orb you see the court of [ref.GetTitledFirstName], as well as [ref.GetHerHis] knights, courtiers and advisors. These observations bring some interesting conclusions."
 ev10.14.desc:0 "A series of blurred images appear in the orb. You see fire, you see people screaming in suffering. The orb shows you violence and pain, a burnt city and dead people, but you cannot see what the cause is, or when these events are coming. Maybe tomorrow, maybe a hundred years from now?"
 ev10.14.a:0 "War is coming, obviously."
 ev10.14.b:0 "This is some kind of natural disaster."
 ev10.14.c:0 "This is armageddon."
 ev10.14.d:0 "I'm the one who will do this."
 war_preparation_modifier:0 "Preparations for war"
 ev10.15.desc:0 "You try to tune the orb to the places you want to see, but you only see blurred images, coloured spirals and flashes of light."
 ev10.15.a:0 "I'll tap the orb, maybe that will help?"
 ev10.15.b:0 "I'll shake the orb..."
 ev10.16.desc:0 "Suddenly, the image sharpened. You see what appears to be a library, filled with an enormous number of books. Right in the middle of it, you see a creature with a deformed face and many arms, swiftly sorting and arranging the books. The creature suddenly freezes, and its face slowly turns towards you. It sees you! Suddenly, a sharp, terrifying sound hits you, a scream from the creature, possibly a spell. The image vanished, apparently the 'connection' was severed."
 ev10.16.a:0 "What the hell was that!"
