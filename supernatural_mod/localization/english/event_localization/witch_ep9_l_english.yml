 DS_IS_INDEPENDENT_RULER:0 "The target is an independent ruler: $VALUE|=+0$"
 COMMAND_MINION_10:0 "Be obedient"
 COMMAND_MINION_11:0 "Marry me"
 COMMAND_MINION_12:0 "Be a fallen hunter"
 COMMAND_MINION_13:0 "Support my influences"
 COMMAND_MINION_14:0 "Join me"
 COMMAND_MINION_15:0 "Tell me your secrets"
 command_minion_secrets_ct:0 "You will learn new secrets."
 ev10.19.a:0 "I delight in toying with mortal hearts"
 ev10.19.b:0 "Violence shall be my language."
 ev10.19.c:0 "Knowledge and subtlety shall be my weapons."
 ev10.20.desc:0 "In the morning you wake up in a great mood, but with a huge gap in your memory. You have no idea what happened during the night, but the servants are clearly afraid of you. The atmosphere around you seems strangely tense, but it doesn't bother you - you feel like a huge weight has been lifted off your shoulders."
 ev10.20.a:0 "What a lovely morning."
 ev10.21.desc:0 "Staying in a cell quickly got boring for you - it even started to get on your nerves. So you broke the chains, smashed the door and killed some of the guards loitering around. You immediately felt better."
 ev10.21.a:0 "Time to go home."
 ev10.21.a_cct:0 "Your guards have been massacred and the prisoner has escaped!"
 ev10.22.desc:0 "You don't remember much about the last few hours, but you woke up covered in blood. The entire castle reeks of sulphur, and you can also see traces of destruction. Human bodies have been found in one of the chambers, in parts - it is difficult to identify them, but several guards and servants have disappeared without a trace. Witnesses claim that a creature the height of two men, with flaming wings and huge claws entered the castle at night to wreak destruction."
 ev10.22.a:0 "Let the guards look for the perpetrator."
 ev10.22.b:0 "Well, it was me."
