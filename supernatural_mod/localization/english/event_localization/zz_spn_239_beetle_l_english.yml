l_english:
 # Supernatural 2.39 -- the Homunculus Beetle and its plague (WORK-ORDER-2.39 F4)
 spn_relic_beetle_name:0 "The Homunculus Beetle"
 spn_relic_beetle_desc:0 "A beetle the length of a thumb, its shell a deep, oily blue, sealed in a stoppered jar. It came out of a dead man. Nobody in the Order has been willing to say what it does to a living one.\n\nSealed, it sleeps. It wakes only inside someone.\n\nSwallow the Beetle: right-click yourself, under Supernatural.\nSlip the Beetle: right-click someone at your court, your guest, your spouse or anyone where you are, under Hostile.\nFeed It to the Prisoner: right-click your prisoner, under Hostile."
 spn_relic_beetle_modifier:0 "The Homunculus Beetle"
 spn_relic_beetle_modifier_desc:0 "People keep their distance from whoever keeps the jar."
 epidemic_spn_blue_beetle:0 "Blue Plague"
 trait_spn_blue_fever:0 "Blue Fever"
 trait_spn_blue_fever_desc:0 "This character burns with a fever that leaves a blue tinge under the nails and a taste of copper in the mouth."
 spn_death_blue_fever:0 "died of [GetTrait('spn_blue_fever').GetName( CHARACTER.Self )]"
 spn_loosed_the_beetle_opinion:0 "Loosed the Beetle"

 # The three uses
 spn_beetle_swallow_interaction:0 "Swallow the Beetle"
 spn_beetle_swallow_interaction_desc:0 "Swallow the Homunculus Beetle and carry it yourself."
 spn_beetle_swallow_interaction_tt:0 "You carry the beetle. In 3 to 10 days it wakes, and its fever breaks out wherever you are standing then."
 spn_beetle_slip_interaction:0 "Slip the Beetle"
 spn_beetle_slip_interaction_desc:0 "Put the Homunculus Beetle where [recipient.GetFirstName] will swallow it without knowing."
 spn_beetle_slip_interaction_tt:0 "If no one sees you, [recipient.GetFirstName] carries the beetle without knowing it, and when it wakes, its fever breaks out wherever [recipient.GetSheHe] is. If you are seen, [recipient.GetSheHe] will know you tried to kill [recipient.GetHerHim], and the beetle stays with you."
 spn_beetle_prisoner_interaction:0 "Feed It to the Prisoner"
 spn_beetle_prisoner_interaction_desc:0 "Have the Homunculus Beetle forced down [recipient.GetFirstName]'s throat in [recipient.GetHerHis] cell."
 spn_beetle_prisoner_interaction_tt:0 "[recipient.GetFirstName] carries the beetle. When it wakes, its fever breaks out wherever [recipient.GetSheHe] is held."
 spn_beetle_sealed_tt:0 "The beetle is sealed in a [spn_reliquary|E]. Take it back first."
 spn_beetle_plague_running_tt:0 "The beetle's plague is not already running."
 spn_beetle_actor_free_tt:0 "You are not in prison."
 spn_beetle_slip_reach_tt:0 "[recipient.GetFirstName] is at your court, is your guest or your spouse, or is where you are."
 spn_beetle_breaks_rules_tt:0 "This breaks the rules of the [spn_order|E]: you lose 20 [spn_order_standing|E], and your Temple Magus will not forget it."
 spn_beetle_slip_breaks_rules_tt:0 "If it works, this breaks the rules of the [spn_order|E]: you lose 20 [spn_order_standing|E], and your Temple Magus will not forget it."

 # Toasts
 spn_beetle_toast_fever:0 "You Have Caught the Blue Fever"
 spn_beetle_toast_contained:0 "The Order Has Contained the Blue Plague"
 spn_beetle_toast_claim:0 "The Beetle Has Come Back"
 spn_beetle_toast_crawled:0 "It Crawled Out of the Body"
 spn_beetle_toast_drawn:0 "The Beetle Came Out with the Fever"
 spn_beetle_toast_returned:0 "The Beetle Is Back in Its Jar"
 spn_beetle_toast_no_chance:0 "The Moment Passed"
 spn_beetle_toast_slipped:0 "It Is Done"
 spn_beetle_toast_attempt:0 "Someone Tried to Poison You"
 spn_beetle_toast_seen:0 "You Were Seen"
 spn_beetle_toast_carrier:0 "This Is Who Carries It"

 # .0700 -- The Beetle Wakes
 spn_relic.0700.t:0 "The Beetle Wakes"
 spn_relic.0700.desc_swallowed:0 "For days something has been moving under your ribs. Tonight it woke, and you woke with it, burning."
 spn_relic.0700.desc_forced:0 "Whatever they forced down your throat in the cell has woken. You woke with it, burning, with a taste of copper in your mouth."
 spn_relic.0700.desc_slipped:0 "You woke burning, with a taste of copper in your mouth and the feeling that something under your ribs had turned over in its sleep."
 spn_relic.0700.desc_outbreak:0 "\n\nBy morning the fever was in the house. By the end of the week it was in every house around you."
 spn_relic.0700.desc_few:0 "\n\nBy morning the fever had spread to the people closest to you."
 spn_relic.0700.a:0 "So it begins."
 spn_relic.0700.b:0 "What is happening to me?"

 # .0710 -- The Blue Plague
 spn_relic.0710.t:0 "The Blue Plague"
 spn_relic.0710.desc:0 "A fever is spreading that leaves a blue tinge under the nails. Only one thing does that. Someone has loosed the beetle.\n\nIt can be held. Wards around the town where it broke out, and a quarantine, would slow it, at a cost in your own power."
 spn_relic.0710.a:0 "Contain it."
 spn_relic.0710.b:0 "Find out who carries it."
 spn_relic.0710.b_tt:0 "You learn who carries the beetle."
 spn_relic.0710.c:0 "It is not the Order's affair."

 # .0720 -- The Blue Fever Passes
 spn_relic.0720.t:0 "The Blue Fever Passes"
 spn_relic.0720.desc:0 "The fever broke in the night. The blue has gone from under your nails, and the taste of copper with it."
 spn_relic.0720.a:0 "I am still here."

 # Debug only (console: event spn_relic.0790)
 spn_relic.0790.t:0 "Debug: The Homunculus Beetle"
 spn_relic.0790.desc:0 "Hand yourself the beetle, force the roll after Slip the Beetle, or bring the beetle back now."
 spn_relic.0790.a:0 "Give me the beetle, out of any Reliquary."
 spn_relic.0790.b:0 "Every slip works (for a year)."
 spn_relic.0790.c:0 "Every slip is seen (for a year)."
 spn_relic.0790.d:0 "Back to the true odds."
 spn_relic.0790.e:0 "Bring the beetle back now."
