l_english:
 ############################################################
 # Supernatural 2.35 -- The Hunt. English.
 ############################################################

 # --- The activity ---
 supernatural_hunt:0 "Supernatural Hunt"
 supernatural_hunt_desc:0 "Somewhere a county is losing people to something that is not a man. Ride there, learn what it is and who it is, and put an end to it."
 supernatural_hunt_host_desc:0 "$BULLET_WITH_TAB$Track the creature preying on a county\n$BULLET_WITH_TAB$Restore the county's [county_control|E] — or its [development|E] — when it dies\n$BULLET_WITH_TAB$Gain [prestige|E] and $trait_track_monster_hunting$ [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Bring an apprentice and finish their training\n"
 supernatural_hunt_guest_desc:0 "$BULLET_WITH_TAB$Ride with a fellow hunter\n$BULLET_WITH_TAB$Gain $trait_track_monster_hunting$ [trait_level_track_xp|E] when the hunt succeeds\n$BULLET_WITH_TAB$An apprentice who rides with their trainer completes their training\n"
 supernatural_hunt_selection_tooltip:0 "Track down the creature preying on a county."
 supernatural_hunt_destination_selection:0 ""
 supernatural_hunt_province_desc:0 "Something has been preying on this county."
 supernatural_hunt_predicted_cost:0 "Horses, lodging, and a few coins in the right hands."
 supernatural_hunt_guest_help_text:0 "A hunter can ride alone. Every hunter who rides with you makes the trail easier to follow, and one more blade when it is found."
 supernatural_hunt_host_an_a:0 "a"
 spn_hunt_cannot_start_recovering_tt:0 "You are still recovering from your last hunt"
 spn_hunt_cannot_start_no_quarry_tt:0 "Nothing is being hunted anywhere you could reach"
 spn_hunt_activity_conclusion_title:0 "The Supernatural Hunt has ended."
 spn_hunt_activity_conclusion_desc:0 "The [GetActivityType( 'supernatural_hunt' ).GetName] has ended."
 supernatural_hunt_conclusion_desc:0 "The [GetActivityType( 'supernatural_hunt' ).GetName] has ended."

 # Game concepts
 game_concept_supernatural_hunt:0 "Supernatural Hunt"
 game_concept_supernatural_hunts:0 "Supernatural Hunts"
 game_concept_monster_hunt:0 "Monster Hunt"
 game_concept_monster_hunts:0 "Monster Hunts"
 game_concept_supernatural_hunt_desc:0 "An [activity|E] for a [spn_hunter|E]. A Monster Hunt can only be held in a county that carries a [spn_menace|E] — a creature did something there. The hunter tracks it for three weeks, works out what it is and who it is, and then confronts it. The creature is warned, and it gets to answer.\n\nBelow $trait_track_monster_hunting$ 50 the hunter cannot read what kind of creature left the trail; the choice of Stakes or Silver is a guess."
 game_concept_spn_menace:0 "Trail"
 game_concept_spn_menaces:0 "Trails"
 game_concept_spn_trail:0 "Trail"
 game_concept_spn_trails:0 "Trails"
 game_concept_spn_menace_desc:0 "A county remembers what a creature did to it. Every kill or feed by a vampire or a werewolf leaves a mark: the county's [county_control|E] falls (a werewolf's kill also costs [development|E]), the modifier #high Something Stalks Here#! stands for five years, and on the third incident the county's lord is told. A [spn_hunter|E] can hold a [supernatural_hunt|E] wherever a trail is warm, and a slain creature gives back part of what it took."

 # Kinds
 # (the special option category is special_type, shared with every activity that has one; no key of its own)
 spn_hunt_kind_monster:0 "Monster Hunt"
 spn_hunt_kind_monster_desc:0 "$EFFECT_LIST_BULLET$ Track the creature preying on a county\n$EFFECT_LIST_BULLET$ Only counties that carry a [spn_menace|E] are valid\n$EFFECT_LIST_BULLET$ Increases $trait_track_monster_hunting$ [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ A slain creature restores the county\n#weak The county's dead tell you a creature is there. They do not tell you what it is.#!"
 spn_hunt_kind_witch:0 "Witch Hunt"
 spn_hunt_kind_witch_desc:0 "$EFFECT_LIST_BULLET$ Root out witchcraft in your own lands\n$EFFECT_LIST_BULLET$ Any county held by you, your vassals or your liege\n$EFFECT_LIST_BULLET$ Increases $trait_track_witch_hunting$ [trait_level_track_xp|E]\n#weak The old way, run as a hunt: the same questions, the same suspects, the same knock at the door.#!"
 spn_hunt_location_needs_trail_tt:0 "A Monster Hunt needs a county that carries a [spn_menace|E] left by a living creature"
 spn_hunt_kind_witch_needs_tt:0 "Open to any [spn_hunter|E]. Your $trait_track_witch_hunting$ track decides how well it goes, not whether you may ride"
 spn_hunt_location_witch_tt:0 "A Witch Hunt is held in your own lands, a vassal's, or your liege's"

 # Preparations
 spn_hunt_preparations:0 "Kit"
 spn_hunt_prep_light:0 "Travel Light"
 spn_hunt_prep_light_desc:0 "A blade, a bow, and whatever the road provides.\n\nNo [gold|E] spent, and nothing to answer the creature with but what you already carry."
 spn_hunt_prep_stakes:0 "Stakes"
 spn_hunt_prep_stakes_desc:0 "Ash, sharpened. And a sprig of something the old women swear by.\n\n#positive_value +15 Confrontation#! against a vampire — and it cannot look you in the eye.\n#negative_value −10 Confrontation#! against a wolf.\nEither way against a hybrid."
 spn_hunt_prep_silver:0 "Silver"
 spn_hunt_prep_silver_desc:0 "Blades and arrowheads that cost more than they should. You have heard why.\n\n#positive_value +15 Confrontation#! against a werewolf.\n#negative_value −10 Confrontation#! against a vampire — and one that finds you carrying the wrong kit may look you in the eye.\nEither way against a hybrid."
 spn_hunt_prep_guides:0 "Hire Local Guides"
 spn_hunt_prep_guides_desc:0 "Pay the people who walk these roads every day to walk them with you.\n\n#positive_value +15 Tracking#!"
 spn_hunt_prep_kit_cost:0 "Kit"
 spn_hunt_prep_guides_cost:0 "Guides"

 # Approach
 spn_hunt_approach:0 "Approach"
 spn_hunt_approach_quiet:0 "Ask Quietly"
 spn_hunt_approach_quiet_desc:0 "Buy drinks, ask about the dead, give no name.\n\nNo change to the tracking.\nThe creatures in the county may still hear that a stranger is asking."
 spn_hunt_approach_open:0 "Ride In Openly"
 spn_hunt_approach_open_desc:0 "Let the county know a hunter has come.\n\n#positive_value +10 Tracking#!\n#negative_value Every creature in the county will hear of you.#!"
 spn_hunt_approach_signs:0 "Read the Signs"
 spn_hunt_approach_signs_desc:0 "Look at the wounds, the tracks, the nights it happened on.\n\n#positive_value +5 Tracking#!\n#positive_value +5 Confrontation#!"

 # Phases
 spn_tracking_phase:0 "Tracking"
 spn_tracking_phase_desc:0 "Three weeks of questions, graves, and the county's fear."
 spn_confrontation_phase:0 "Confrontation"
 spn_confrontation_phase_desc:0 "The trail ends at a door."

 # Intents
 spn_cleanse_the_land_intent:0 "Cleanse the Land"
 spn_cleanse_the_land_intent_desc:0 "End what is preying on this county and give the people back their nights."
 spn_train_the_apprentice_intent:0 "Train the Apprentice"
 spn_train_the_apprentice_intent_desc:0 "Bring your apprentice and finish the lesson the training could not. An apprentice who rides with you on a hunt that finds its creature, or drives it away, becomes a [spn_hunter|E]."
 spn_earn_my_spurs_intent:0 "Earn My Spurs"
 spn_earn_my_spurs_intent_desc:0 "Ride with an older hunter and learn the trade where it is taught."
 spn_root_out_witchcraft_intent:0 "Root Out Witchcraft"
 spn_root_out_witchcraft_intent_desc:0 "Ask the questions, name the suspects, knock on the door."

 # Invite rules
 activity_invite_rule_spn_hunters:0 "Hunters"
 activity_invite_rule_spn_hunters_desc:0 "Hunters you know: friends, family, your court, and those whose secret you keep."
 activity_invite_rule_spn_hunter_players:0 "Hunter Players"
 activity_invite_rule_spn_hunter_players_desc:0 "Other players who are hunters."
 activity_invite_rule_spn_apprentices:0 "Apprentices"
 activity_invite_rule_spn_apprentices_desc:0 "Your apprentices — those the training could not finish, and those the wound chain deferred to you."
 spn_hunt_join_brave:0 "Brave"
 spn_hunt_join_craven:0 "Craven"
 spn_hunt_join_friend:0 "Friend of the host"
 spn_hunt_join_renown:0 "They have heard of you"
 spn_hunt_join_apprentice:0 "Apprentice of the host"

