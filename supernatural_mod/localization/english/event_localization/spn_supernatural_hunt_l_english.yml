 spn_hunt_tag_ride_very_long:0 "#negative_value -- Very Long Ride#! (Distance)\n"

 # The bar
 spn_hunt_success_bar:0 "Tracking"
 spn_hunt_success_pct:0 "[Activity.MakeScope.Var('spn_hunt_success_chance').GetValue|0]%"
 spn_hunt_chance_change_tt:0 "This shifts your chance of finding the creature."
 spn_hunt_sc_track:0 "Your $trait_track_monster_hunting$"
 spn_hunt_sc_guests:0 "Hunters riding with you"
 spn_hunt_sc_guides:0 "Local guides"
 spn_hunt_sc_approach:0 "Your approach"
 spn_hunt_sc_known:0 "You know what the creature is"
 spn_hunt_sc_culprit_track:0 "The creature's power"
 spn_hunt_sc_gone:0 "The trail has gone quiet"
 spn_hunt_sc_silence:0 "A county that remembers too little"
 spn_hunt_sc_renown:0 "A name the county already knows"
 spn_hunt_sc_legend:0 "A name the county will not say"
 spn_hunt_sc_partner:0 "A local hunter riding with you"
 spn_hunt_sc_events:0 "What you have learned"

 # Duels
 spn_hunt_ledger_duel:0 "Finding the killer"
 spn_hunt_press_duel:0 "Pressing the survivor"
 spn_hunt_lead_duel:0 "Weighing the name you were given"
 spn_hunt_lead_duel_success_tt:0 "You see through the name you were given"
 spn_hunt_lead_duel_failure_tt:0 "You take the name you were given at its word"
 spn_hunt_hide_duel:0 "Going to ground"
 spn_hunt_fight_duel:0 "The fight"
 spn_hunt_fight_defender_wins_tt:0 "The creature wins"
 spn_hunt_fight_hunter_wins_tt:0 "The hunter wins"
 spn_hunt_list_duel:0 "Reading the list"
 spn_hunt_counting_duel:0 "Counting what is in this county"
 spn_compel_investigate_duel:0 "Asking a town what it did last winter"

 # --- Modifiers ---
 spn_menace_modifier:0 "Something Stalks Here"
 spn_menace_modifier_desc:0 "Bodies have been found. A lord who looks hard enough may learn why — and a hunter who knows his trade may learn what."
 spn_hunt_mob_justice_modifier:0 "The Mob Had Its Way"
 spn_hunt_mob_justice_modifier_desc:0 "A hunter let the county's people take an innocent man. They remember which of them it was."
 spn_gone_to_ground_modifier:0 "Gone to Ground"
 spn_gone_to_ground_modifier_desc:0 "A hunter came asking. You are elsewhere until it is safe to feed again."
 spn_compelled_modifier:0 "Nobody Here Remembers"
 spn_compelled_modifier_desc:0 "Too many people here are certain that nothing happened. None of them can tell you what they were doing that week, and none of them finds that strange."
 spn_hunter_recovering_modifier:0 "Recovering from the Hunt"
 spn_hunter_recovering_modifier_desc:0 "You fell back from a fight you were losing. No new hunt until the wounds close."
 spn_on_the_payroll_modifier:0 "On the Payroll"
 spn_on_the_payroll_modifier_desc:0 "A creature pays you to look the other way. It also holds your word."

 # --- Opinions ---
 spn_slew_the_menace_opinion:0 "Ended what preyed on my people"
 spn_false_witness_opinion:0 "Gave me a name that led nowhere"
 spn_named_to_the_hunter_opinion:0 "Gave my name to a hunter"
 spn_hunter_wrong_door_opinion:0 "Dragged an innocent from his house"
 spn_rode_together_opinion:0 "We worked the same county and did not make it a quarrel"
 spn_warned_off_opinion:0 "Told me to find my own trail"
 spn_careful_witch_hunter_opinion:0 "Asked questions before lighting fires"

 # --- Memories ---
 spn_slew_the_beast_memory:0 "put down a creature"
 spn_bested_the_hunter_memory:0 "bested a hunter"
 spn_lost_the_thread_memory:0 "lost the thread"
 spn_progeny_slain_by_hunter_memory:0 "lost my progeny to a hunter"
 spn_took_the_vampires_coin_memory:0 "took a creature's coin"
 spn_slew_the_beast_memory_desc:0 "put down [creature.GetFirstName], the creature that preyed on a county"
 spn_slew_the_beast_memory_desc_second_perspective:0 "put down [creature.GetFirstName], the creature that preyed on a county"
 spn_slew_the_beast_memory_desc_third_perspective:0 "put down [creature.GetFirstName], the creature that preyed on a county"
 spn_bested_the_hunter_memory_desc:0 "beat the hunter [hunter.GetFirstName] who came for me, and let [hunter.GetHerHim] crawl away"
 spn_bested_the_hunter_memory_desc_second_perspective:0 "beat the hunter [hunter.GetFirstName] who came for you, and let [hunter.GetHerHim] crawl away"
 spn_bested_the_hunter_memory_desc_third_perspective:0 "beat the hunter [hunter.GetFirstName] who came for [owner.GetHerHim], and let [hunter.GetHerHim] crawl away"
 spn_lost_the_thread_memory_desc:0 "followed a trail to a door I cannot remember, and rode home"
 spn_lost_the_thread_memory_desc_second_perspective:0 "followed a trail to a door you cannot remember, and rode home"
 spn_lost_the_thread_memory_desc_third_perspective:0 "followed a trail to a door [owner.GetSheHe] cannot remember, and rode home"
 spn_progeny_slain_by_hunter_memory_desc:0 "lost [progeny.GetFirstName], whom I made, to the hunter [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_second_perspective:0 "lost [progeny.GetFirstName], whom you made, to the hunter [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_third_perspective:0 "lost [progeny.GetFirstName], whom [owner.GetSheHe] made, to the hunter [hunter.GetFirstName]"
 spn_took_the_vampires_coin_memory_desc:0 "took [creature.GetFirstName]'s gold and rode home with the hunt unfinished"
 spn_took_the_vampires_coin_memory_desc_second_perspective:0 "took [creature.GetFirstName]'s gold and rode home with the hunt unfinished"
 spn_took_the_vampires_coin_memory_desc_third_perspective:0 "took [creature.GetFirstName]'s gold and rode home with the hunt unfinished"

 # --- The contract (D9) ---
 laamp_hunter_1001_contract:0 "The Menace of [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName]"
 laamp_hunter_1001_desc_title:0 "$laamp_hunter_1001_contract$"
 laamp_hunter_1001_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] has been burying people. Something is preying on [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName], and the lord wants it found and ended by someone who knows how."
 laamp_hunter_1001_request:0 "This [task_contract|E] pays a hunter to hold a [supernatural_hunt|E] in [TaskContract.MakeScope.Var('spn_contract_county').Title.GetName] and kill the creature preying on it. The hunt costs nothing while the contract stands. It is paid when the creature is dead."

 # ============================================================
 # EVENTS
 # ============================================================

 # Something Stalks [county]
 spn_hunt.0001.t:0 "Something Stalks [spn_menace_county.GetName]"
 spn_hunt.0001.desc:0 "The priest of [spn_menace_county.GetName] will not say what is killing people, only that it is. Three times now the bodies have come to him — pale, or torn, he will not say which — and the county has started locking its doors at dusk. Whatever it is, it is not finished."
 spn_hunt.0001.desc_vampire:0 "The priest of [spn_menace_county.GetName] will not say what is killing people. You do not need him to. Three bodies, all of them drained, all of them found at the edge of town after a night nobody remembers clearly. You have hunted this before. The county has started locking its doors at dusk, and it is right to."
 spn_hunt.0001.desc_werewolf:0 "The priest of [spn_menace_county.GetName] will not say what is killing people. You do not need him to. Three bodies, torn the way no wolf tears, and herds missing from the pastures the way no wolf takes them. You have hunted this before. The county has started locking its doors at dusk, and it is right to."
 spn_hunt.0001.a:0 "I will look into this myself."
 spn_hunt.0001.b:0 "Put my Spymaster on it."
 spn_hunt.0001.c:0 "Post a bounty."
 spn_hunt.0001.c.tt:0 "A contract is posted in [spn_menace_county.GetName] for a hunter. An adventurer with the trade may take it; the hunt is free for them there, and they are paid when the creature is dead."
 spn_hunt.0001.d:0 "Superstition and bad luck."
 spn_hunt.0001.d.tt:0 "Nothing is done. The county keeps losing [county_control|E] as long as the creature keeps at it."

 # The Ledger of the Dead
 spn_hunt.0002.t:0 "The Ledger of the Dead"
 spn_hunt.0002.desc:0 "You have the priest's list, the steward's list, and the gravedigger's. Who died, where they were found, who saw them last. Somewhere in the three ledgers is a name that appears too often near the dead and never among them."
 spn_hunt.0002.a:0 "Read them again."
 spn_hunt.0002.success_tt:0 "You find the name"
 spn_hunt.0002.failure_tt:0 "The trail goes cold"
 spn_hunt.0002.known_tt:0 "Everyone already knows what [spn_menace_culprit.GetTitledFirstName] is. The ledgers only confirm who has been hungry."
 spn_hunt.0002.cold_tt:0 "The names lead nowhere. The county keeps its dead and its secret."

 # The Spymaster's Report
 spn_hunt.0003.t:0 "The Spymaster's Report"
 spn_hunt.0003.desc:0 "[spn_spymaster.GetTitledFirstName] has spent a month in [spn_menace_county.GetName] asking questions that sound like other questions. The report is short. Either it has a name in it, or it explains why it does not."
 spn_hunt.0003.a:0 "Well?"
 spn_hunt.0003.success_tt:0 "[spn_spymaster.GetFirstName] found the name"
 spn_hunt.0003.failure_tt:0 "[spn_spymaster.GetFirstName] found nothing"

 # A Bounty Posted
 spn_hunt.0004.t:0 "A Bounty Posted"
 spn_hunt.0004.desc:0 "A contract for a hunter now stands in [spn_menace_county.GetName]. If an adventurer with the trade takes it, the hunt is free for them there and they are paid when the creature is dead."

 # A Lord's Coin
 spn_hunt.0010.t:0 "A Lord's Coin"
 spn_hunt.0010.desc:0 "[spn_contract_employer.GetTitledFirstName] does not want to know what you do or how. [spn_contract_employer.GetSheHe] wants the burials in [spn_contract_county.GetName] to stop, and will pay when they do. The hunt there costs you nothing while the paper stands."
 spn_hunt.0010.a:0 "Consider it done."
 spn_hunt.0010.a.tt:0 "Hold a [supernatural_hunt|E] in [spn_contract_county.GetName]. The contract is paid when the creature preying on it is dead."

 # Whispers of a Hunter
 spn_hunt.0020.t:0 "Whispers of a Hunter"
 spn_hunt.0020.desc:0 "A stranger is buying drinks in [spn_hunt_county.GetName] and asking about the dead. Not the way a grieving relative asks. The way someone asks who already knows the answer and wants to know the address.\n\nYou have been careful. You could be more careful still."
 spn_hunt.0020.a:0 "I'll keep an eye out."
 spn_hunt.0020.a.tt:0 "You are forewarned for six months: if the hunter finds you, you meet [spn_hunter.GetHerHim] ready (#high +10#! to every answer you give)."
 spn_hunt.0020.b:0 "Time I was elsewhere."
 spn_hunt.0020.b.tt:0 "You leave the county. A hunt that comes looking finds nobody — and you do not feed for a year."
 spn_hunt.0020.c:0 "Let him ask."

 # The Trail
 spn_hunt.0100.t:0 "The Trail"
 spn_hunt.0100.desc:0 "[spn_hunt_county.GetName] has been burying people, and the people know it. They will talk to you, once they are sure you are not the thing they are afraid of. What they cannot tell you is what it is. The bodies are in the ground; the priest describes them the way priests do, which is to say not at all.\n\nThree weeks. Then you will know, or you will not."
 spn_hunt.0100.desc_vampire:0 "[spn_hunt_county.GetName] has been burying people, and the people know it. The gravedigger does not need to describe the bodies for you to know what did this: drained, at the edge of town, after nights nobody remembers clearly. A vampire. You brought what you brought.\n\nThree weeks to find out who."
 spn_hunt.0100.desc_werewolf:0 "[spn_hunt_county.GetName] has been burying people, and the people know it. The gravedigger does not need to describe the bodies for you to know what did this: torn the way no wolf tears, and the herds thinned the way no wolf thins them. A werewolf. You brought what you brought.\n\nThree weeks to find out who."
 spn_hunt.0100.a:0 "Begin."
 spn_hunt.0100.a.tt:0 "The tracking begins. Every creature in the county may hear that a hunter is asking questions."

 # The Survivor
 spn_hunt.0101.t:0 "The Survivor"
 spn_hunt.0101.desc:0 "[spn_survivor.GetTitledFirstName] was found one morning on the wrong side of town with a headache and a story nobody believed. [spn_survivor.GetSheHe] has not slept well since. [spn_survivor.GetSheHe] remembers a face, or thinks [spn_survivor.GetSheHe] does."
 spn_hunt.0101.a:0 "Listen."
 spn_hunt.0101.b:0 "Press [spn_survivor.GetHerHim]."
 spn_hunt.0101.b.success_tt:0 "[spn_survivor.GetFirstName] remembers more than [spn_survivor.GetSheHe] wanted to"
 spn_hunt.0101.b.failure_tt:0 "[spn_survivor.GetFirstName] shuts the door on you"

 # What the Graves Say
 spn_hunt.0102.t:0 "What the Graves Say"
 spn_hunt.0102.desc_few:0 "Two graves, new. The gravedigger dug them himself and did not look long. A hunter looks longer. The dead were not old and not sick, and the county has stopped asking why."
 spn_hunt.0102.desc_many:0 "A row of new graves, and room left at the end of it. The gravedigger has stopped asking who and started asking how many. Whatever is doing this has found a county that suits it."
 spn_hunt.0102.desc_vampire:0 "The gravedigger lets you look. You have seen it before: the throat, the pallor, the absence of the blood that should have been everywhere. A vampire, and one that is not hurrying."
 spn_hunt.0102.desc_werewolf:0 "The gravedigger lets you look. You have seen it before: the wounds no wolf leaves, the strength it took to make them. A werewolf, and one that does not fear being found."
 spn_hunt.0102.a:0 "Cover them again."

 # The Wrong Man
 spn_hunt.0103.t:0 "The Wrong Man"
 spn_hunt.0103.desc:0 "The county has decided. [spn_accused.GetTitledFirstName] keeps odd hours, has no family to speak for [spn_accused.GetHerHim], and was seen near the last body. That is enough for the men with the rope. It is not enough for you — nothing about [spn_accused.GetFirstName] is what you are hunting — but they are not asking you."
 spn_hunt.0103.a:0 "Let [spn_accused.GetHerHim] go."
 spn_hunt.0103.a.tt:0 "You send the mob home. [spn_accused.GetFirstName] is not what you are hunting."
 spn_hunt.0103.b:0 "Let the mob have [spn_accused.GetHerHim]."

 # Lessons in the Dark
 spn_hunt.0104.t:0 "Lessons in the Dark"
 spn_hunt.0104.desc:0 "[spn_apprentice.GetFirstName] watches you work: which questions you ask, which answers you ignore, what you look at in a wound. This is the part of the trade the training could not teach, because it needs a county that is actually afraid."
 spn_hunt.0104.a:0 "Watch. Then do it yourself."

 # A Fellow Hunter's Tale
 spn_hunt.0105.t:0 "A Fellow Hunter's Tale"
 spn_hunt.0105.desc:0 "Over the second drink [spn_fellow.GetFirstName] tells you about a county like this one, years ago, and what it turned out to be. Not the same thing — but the way it hid was the same, and the way it was found."
 spn_hunt.0105.a:0 "That helps."

 # A Word with [name]
 spn_hunt.0106.t:0 "A Word with [spn_informer.GetFirstName]"
 spn_hunt.0106.desc:0 "Everyone in [spn_hunt_county.GetName] knows what [spn_informer.GetTitledFirstName] is, and nobody has done anything about it, which tells you something about [spn_informer.GetHerHim]. [spn_informer.GetSheHe] is not the only one of [spn_informer.GetHerHis] kind in the county, or [spn_informer.GetSheHe] would have been dealt with by now. [spn_informer.GetSheHe] may know who is. [spn_informer.GetSheHe] may be who is."
 spn_hunt.0106.a:0 "Go and ask."
 spn_hunt.0106.a.tt:0 "[spn_informer.GetFirstName] decides what to tell you — the truth, a lie, nothing, or [spn_informer.GetHerHis] teeth."
 spn_hunt.0106.b:0 "Leave it be."

 # A Name That Led Nowhere
 spn_hunt.0107.t:0 "A Name That Led Nowhere"
 spn_hunt.0107.desc:0 "The name [spn_hunt_informer.GetFirstName] gave you does not fit. The nights do not fit, the graves do not fit, and when you ask about [spn_hunt_lead.GetFirstName] the county looks at you like you have been drinking with the wrong people. You have. The real trail is still there."
 spn_hunt.0107.a:0 "Back to the graves."

 # The Wrong Door
 spn_hunt.0108.t:0 "The Wrong Door"
 spn_hunt.0108.desc:0 "You went where the name sent you. [spn_hunt_lead.GetTitledFirstName] was there, and was afraid, and bled, and was nothing you were hunting — a man, only a man, and the county watched you drag him out. The thing that has been killing people is still in [spn_hunt_county.GetName]. It will have heard about tonight."
 spn_hunt.0108.a:0 "I was given a name."

 # Cornered
 spn_hunt.0110.t:0 "Cornered"
 spn_hunt.0110.desc:0 "The trail ends at a door. Everything the county told you agrees, and so do the graves. Whatever is behind it knows what you are, or will the moment you knock. How you go in is the last choice that is entirely yours."
 spn_hunt.0110.desc_known:0 "The trail ends at [spn_culprit.GetTitledFirstName]'s door. You knew what [spn_culprit.GetSheHe] was; now you know it was [spn_culprit.GetHerHim]. [spn_culprit.GetSheHe] knows what you are, or will the moment you knock. How you go in is the last choice that is entirely yours."
 spn_hunt.0110.desc_crowded:0 "The trail ends at a door, and the door is not the problem. You have counted the shapes that came and went from this hall since the sun dropped, and you have stopped liking the number. Whatever is behind that wood does not look to be alone in [spn_hunt_county.GetName], and whatever else is here is close enough to hear it shout.\n\nHow you go in matters more than it has ever mattered."
 spn_hunt.0110.a:0 "Strike now."
 spn_hunt.0110.a.tt:0 "You go in as you are. The creature answers."
 spn_hunt.0110.b:0 "Wait for daylight."
 spn_hunt.0110.b.tt:0 "#positive_value +15 Confrontation#! if the creature is a vampire.\nNothing if it is a wolf.\nThe creature answers."
 spn_hunt.0110.c:0 "Bring the county's men."
 spn_hunt.0110.c.tt:0 "#positive_value +10 Confrontation#!\nThe creature answers."
 spn_hunt.0110.d:0 "This is practically a nest. I cannot handle this."
 spn_hunt.0110.d.tt:0 "#negative_value The hunt ends here.#!\nYou leave the county with your life and not much else. The trail stays where it is, and so, most likely, does whatever left it."

 # The Trail Goes Cold
 spn_hunt.0111.t:0 "The Trail Goes Cold"
 spn_hunt.0111.desc:0 "Three weeks, and the county has told you everything it knows, which turns out to be less than it thinks. The nights have been quiet since you arrived. That is not the same as over. Whatever it is, it has learned to wait."
 spn_hunt.0111.desc_gone:0 "Three weeks, and the county has told you everything it knows. The bodies were real. The trail is real. But the nights went quiet before you rode in, not after. Whatever did this fed here and slept somewhere else, as far as anyone in this county can tell you, and you have spent three weeks searching ground it had already left."
 spn_hunt.0111.a:0 "Next time."

 # Someone Is Asking Questions
 spn_hunt.0200.t:0 "Someone Is Asking Questions"
 spn_hunt.0200.desc:0 "[spn_hunter.GetTitledFirstName] is at your door, and [spn_hunter.GetSheHe] did not come to ask. Three weeks in [spn_hunt_county.GetName] and [spn_hunter.GetSheHe] has your name, your nights, and something in [spn_hunter.GetHerHis] hands that was not bought for men.\n\nYou have a moment. Not long."
 spn_hunt.0200.desc_forewarned:0 "You knew. You have known for weeks that a stranger was buying drinks and asking about the dead, and now [spn_hunter.GetTitledFirstName] is at your door with your name and something in [spn_hunter.GetHerHis] hands that was not bought for men.\n\nYou are ready for this. That is worth something."
 spn_hunt.0200.desc_caught:0 "The door opens while your mouth is still on the wrist.\n\n[spn_hunter.GetTitledFirstName] does not shout and does not run, and does not look surprised — [spn_hunter.GetSheHe] looks like someone who has finally seen the thing [spn_hunter.GetSheHe] came a long way to see. There is nothing to explain. There is nowhere in this room to be.\n\nWhatever you do now, you do it with the blood still on you."
 spn_hunt.0200.a:0 "Let them come."
 spn_hunt.0200.a.tt:0 "The fight. Your $spn_hunt_creature_track_word$ and [prowess|E] against [spn_hunter.GetHerHis] $trait_track_monster_hunting$ and [prowess|E], and whatever [spn_hunter.GetSheHe] brought."
 spn_hunt.0200.b:0 "Go to ground."
 spn_hunt.0200.b.tt:0 "Your [intrigue|E] against [spn_hunter.GetHerHis]. Hidden: the hunt finds an empty house, and you do not feed for two years. Found: the fight, at a disadvantage."
 spn_hunt.0200.b.hidden_tt:0 "You are gone before [spn_hunter.GetFirstName] reaches the door"
 spn_hunt.0200.b.found_tt:0 "[spn_hunter.GetFirstName] finds you first"
 spn_hunt.0200.c:0 "Look them in the eye."
 spn_hunt.0200.c.tt:0 "[spn_hunter.GetFirstName] came unprepared for what you are. Spend 20 $spn_hunt_creature_track_word$ [trait_level_track_xp|E] and send [spn_hunter.GetHerHim] home not remembering the door."
 spn_hunt.0200.d:0 "Send [spn_proxy.GetFirstName]."
 spn_hunt.0200.d.tt:0 "[spn_proxy.GetTitledFirstName] answers the door in your place. If [spn_proxy.GetSheHe] is a player, [spn_proxy.GetSheHe] may refuse."
 spn_hunt.0200.e:0 "Make them an offer."
 spn_hunt.0200.e.tt:0 "Fifty [gold|E] now, a stipend for five years, and a strong [hook|E] on [spn_hunter.GetHerHim] if [spn_hunter.GetSheHe] takes it. If [spn_hunter.GetSheHe] refuses, the insult goes into the fight."
 spn_hunt.0200.f:0 "Let it out."
 spn_hunt.0200.f.tt:0 "You stop holding it. #high The strongest answer you have#!: the change is worth [prowess|E] and more in the fight. Every hunter at that door sees what you are, and they will not forget it."

 # Overmatched
 spn_hunt.0210.t:0 "Overmatched"
 spn_hunt.0210.desc:0 "It is stronger than you. Not by a little. You are on the floor and [spn_defender.GetTitledFirstName] is standing over you and has not finished, and there is a door behind you that you could still reach."
 spn_hunt.0210.a:0 "Fall back."
 spn_hunt.0210.a.tt:0 "You get out. Wounded, and no new hunt for a year."
 spn_hunt.0210.b:0 "Press on."
 spn_hunt.0210.b.tt:0 "One more exchange, with the creature at #high +20#!. Lose it and you do not leave."

 # Gone
 spn_hunt.0211.t:0 "Gone"
 spn_hunt.0211.desc:0 "The house is empty. Not fled-in-a-hurry empty — chosen empty, the fire cold a day, nothing left that would tell you anything. It knew you were coming and it decided not to be here.\n\nWhatever else it is, it is careful, and it thought of this well before you did. A thing that clever does not get caught by being followed. [spn_hunt_county.GetName] will sleep better for a while. That is all you got."
 spn_hunt.0211.a:0 "It will be back."

 # Turned Back
 spn_hunt.0212.t:0 "Turned Back"
 spn_hunt.0212.desc:0 "You are on the road out of [spn_hunt_county.GetName] and you cannot remember why. There was a door. There was a face. You had it — you are certain you had it — and it is gone the way a dream goes, and your hands are empty, and you are riding home."
 spn_hunt.0212.a:0 "…what was I doing?"

 # Sent in Your Place
 spn_hunt.0220.t:0 "Sent in Your Place"
 spn_hunt.0220.desc:0 "[spn_culprit.GetTitledFirstName] has a hunter at the door, and has decided that the door is yours. It is not a request. It is not quite an order either; [spn_culprit.GetSheHe] made you, and [spn_culprit.GetSheHe] is reminding you of it."
 spn_hunt.0220.a:0 "I will answer it."
 spn_hunt.0220.a.tt:0 "The fight, with you standing for [spn_culprit.GetFirstName]."
 spn_hunt.0220.b:0 "Answer it yourself."
 spn_hunt.0220.b.tt:0 "[spn_culprit.GetFirstName] is not pleased, and must face the hunter alone."

 # The Hunter at Your Door
 spn_hunt.0230.t:0 "The Hunter at Your Door"
 spn_hunt.0230.desc:0 "[spn_hunter.GetTitledFirstName] is polite about it. Everyone knows what you are; [spn_hunter.GetSheHe] is not here about that. [spn_hunter.GetSheHe] is here about the graves in [spn_hunt_county.GetName], and [spn_hunter.GetSheHe] thinks you might know whose they are.\n\nYou might."
 spn_hunt.0230.desc_culprit:0 "[spn_hunter.GetTitledFirstName] is polite about it. Everyone knows what you are; [spn_hunter.GetSheHe] is not here about that — not yet. [spn_hunter.GetSheHe] is here about the graves in [spn_hunt_county.GetName], and [spn_hunter.GetSheHe] thinks you might know whose they are.\n\nThey are yours. [spn_hunter.GetSheHe] does not know that. Yet."
 spn_hunt.0230.a:0 "It was [spn_hunt_other.GetFirstName]."
 spn_hunt.0230.a.tt:0 "You give the hunter another creature's name. If [spn_hunt_other.GetFirstName] has left a trail on this county or one beside it, the hunter turns to [spn_hunt_other.GetHerHim]. If not, a good hunter will see through it in time, and a poor one will not."
 spn_hunt.0230.a.toast:0 "A Name"
 spn_hunt.0230.a.toast_tt:0 "[ROOT.Char.GetFirstName] gave you a name. Whether it is the right one, the trail will tell."
 spn_hunt.0230.f:0 "It was [spn_hunt_false_lead.GetFirstName]."
 spn_hunt.0230.f.tt:0 "You give the hunter a name you would like to see hanged. [spn_hunt_false_lead.GetFirstName] is no creature. A good hunter will see through it in time, and a poor one will drag an innocent from his house."
 spn_hunt.0230.f.toast_tt:0 "[ROOT.Char.GetFirstName] gave you a name. Whether it is the right one, the trail will tell."
 spn_hunt.0230.b:0 "Yes. It was [spn_culprit.GetFirstName]."
 spn_hunt.0230.b.tt:0 "The truth. The hunter turns to [spn_culprit.GetFirstName], and [spn_culprit.GetFirstName] will know who told."
 spn_hunt.0230.b.toast:0 "The Name"
 spn_hunt.0230.b.toast_tt:0 "[ROOT.Char.GetFirstName] gave you the name. The trail is warm."
 spn_hunt.0230.c:0 "I know nothing."
 spn_hunt.0230.c.toast:0 "Nothing"
 spn_hunt.0230.c.toast_tt:0 "[ROOT.Char.GetFirstName] knows nothing, or says so."
 spn_hunt.0230.d:0 "Get out of my hall."
 spn_hunt.0230.d.tt:0 "The hunter leaves with less than [spn_hunter.GetSheHe] came with, and a reason to remember you."
 spn_hunt.0230.d.toast:0 "The Door"
 spn_hunt.0230.d.toast_tt:0 "[ROOT.Char.GetFirstName] showed you the door. The trail cools."
 spn_hunt.0230.e:0 "Let me show you what I am."
 spn_hunt.0230.e.tt:0 "The fight, here, now. The hunter came ready for something; whether it was you, [spn_hunter.GetSheHe] is about to find out."

 # The Price of Silence
 spn_hunt.0240.t:0 "The Price of Silence"
 spn_hunt.0240.desc:0 "[spn_culprit.GetTitledFirstName] does not run and does not fight. [spn_culprit.GetSheHe] puts a purse on the table between you — fifty in gold, and the promise of more each month — and asks, quite reasonably, what a county's dead are worth to a hunter who has to eat."
 spn_hunt.0240.a:0 "Take the gold."
 spn_hunt.0240.a.tt:0 "Fifty [gold|E] now and a stipend for five years. [spn_culprit.GetFirstName] holds a strong [hook|E] on you. The hunt ends here."
 spn_hunt.0240.b:0 "Refuse."
 spn_hunt.0240.b.tt:0 "[prestige|E], and the insult is worth #high +5#! in the fight that follows."

 # Accused
 spn_hunt.0250.t:0 "Accused"
 spn_hunt.0250.desc:0 "[spn_hunter.GetTitledFirstName] came through your door with something in [spn_hunter.GetHerHis] hands that was not bought for men, and used it before [spn_hunter.GetSheHe] looked at you properly. You are a man. You bled like one. [spn_hunter.GetSheHe] left without a word, and the county watched."
 spn_hunt.0250.a:0 "I have done nothing."

 # What the Hunt Was Worth
 spn_hunt.0300.t:0 "What the Hunt Was Worth"
 spn_hunt.0300.desc_slain:0 "It is done. [spn_hunt_county.GetName] will bury one more and then, for the first time in a long while, nobody. The people do not know what you did. They know the nights are quiet."
 spn_hunt.0300.desc_proxy_slain:0 "Something died at that door, but it was not the thing you were hunting — it was the thing that was sent in its place. [spn_hunt_county.GetName] is a little safer. The creature that made it still is."
 spn_hunt.0300.desc_fled:0 "The house was empty. [spn_hunt_county.GetName] will sleep better while it stays that way, and you know the name of the thing that will decide when it does not."
 spn_hunt.0300.desc_compelled:0 "You rode home. You are not entirely sure from what."
 spn_hunt.0300.desc_bought:0 "You rode home with a heavier purse and a lighter conscience than you expected. [spn_hunt_county.GetName] will go on burying people. That is not your concern any more; you have been paid to make sure of it."
 spn_hunt.0300.desc_hunter_beaten:0 "You got out. That is the most that can be said. [spn_hunt_county.GetName] knows what came to help it and what it looked like leaving."
 spn_hunt.0300.desc_witch:0 "The questions were asked, the suspects named, and a door was knocked on. Whether the county is cleaner for it is a matter for the priest."
 spn_hunt.0300.desc_cold:0 "Three weeks, and nothing to show for it but a county that is quieter than it was and no wiser."
 spn_hunt.0300.a:0 "Home."

 # The Hunter's Verdict
 spn_hunt.0301.t:0 "The Hunter's Verdict"
 spn_hunt.0301.desc_fled:0 "[spn_hunter.GetTitledFirstName] has left [spn_hunt_county.GetName]. [spn_hunter.GetSheHe] found an empty house, and [spn_hunter.GetSheHe] knows what that means, and [spn_hunter.GetSheHe] knows your name. Two years, and you will be hungry again."
 spn_hunt.0301.desc_bought:0 "[spn_hunter.GetTitledFirstName] has left [spn_hunt_county.GetName] with your gold. You own a hunter now — for as long as the gold lasts, and the hook holds."
 spn_hunt.0301.desc_hunter_beaten:0 "[spn_hunter.GetTitledFirstName] has left [spn_hunt_county.GetName], slowly, and will be a while healing. [spn_hunter.GetSheHe] will remember you. So will anyone [spn_hunter.GetSheHe] tells."
 spn_hunt.0301.a:0 "Good."

 # Shared words
 spn_hunt_creature_track_word:0 "creature track"
 spn_hunt_location_too_far_tt:0 "Within reach of your court \u2014 or anywhere under your own liege, however far"
 spn_hunt_location_legend_tt:0 "You are hunter enough for what is in this county"
 spn_hunt_location_recently_hunted_tt:0 "This county has not been hunted in the last four years"
 spn_hunt_tag_legend:0 "#negative_value -- Hunters Have Come Here Before#! (Reputation)\n"
 spn_hunt_tag_legend_high:0 "#negative_value --- Hunters Came Here And Did Not Leave#! (Reputation)\n"
 # 2.35a -- one selectable place per county, so the map pins stop stacking. See supernatural_hunt.txt.
 spn_hunt_location_capital_tt:0 "The county seat — a trail is followed from the place the county is run from"

 ############################################################
 # 2.35 -- THE WITCH HUNT. The Witch kind's own week.
 ############################################################
 spn_hunt.0120.t:0 "A List of Names"
 spn_hunt.0120.desc:0 "[spn_hunt_chaplain.GetTitledFirstName] has been waiting for somebody like you for a long time.\n\nThe list is four pages and the ink is not all the same age. Some of the names have a line of explanation beside them — a stillbirth, a soured well, a woman who was seen walking before dawn. Others have nothing beside them at all.\n\n\"They are all of them guilty of something,\" [spn_hunt_chaplain.GetSheHe] says. \"You will know which.\""
 spn_hunt.0120.desc_nochaplain:0 "The list has been pushed under your door and nobody will say by whom.\n\nIt is four pages and the ink does not all look the same age. Some of the names have a line of explanation beside them — a stillbirth, a soured well, a woman who was seen walking before dawn. Others have nothing beside them at all.\n\nSomebody in this county wants somebody else dead, and has decided you are the instrument."
 spn_hunt.0120.a:0 "Read it properly."
 spn_hunt.0120.a.tt:0 "Your [learning|E] against the malice in it. Read it right and one of those names may be worth something; read it wrong and you have spent a week on somebody's grudge."
 spn_hunt.0120.a.success_tt:0 "You think you find the name under the names"
 spn_hunt.0120.a.failure_tt:0 "You spend the week on somebody's grudge"
 spn_hunt.0120.b:0 "Ask who put each name on it."
 spn_hunt.0120.b.tt:0 "Slower, and it costs you the week. The lord of this county would rather keep his midwives."
 spn_hunt.0120.c:0 "Burn it."
 spn_hunt.0120.c.tt:0 "Nothing on those pages is evidence. You will find her yourself or not at all."
 spn_hunt.0121.t:0 "The Woman They Talk About"
 spn_hunt.0121.desc:0 "They do not say her name in the street. They say #EMP her #!, and everyone knows who is meant, and then they look at their hands.\n\n[spn_hunt_witch.GetTitledFirstName] lives where she has always lived. She has buried two husbands and has never once been ill, and the second thing frightens them more than the first.\n\nWhen you stand where you can see her door, she does not look up."
 spn_hunt.0121.a:0 "Take her."
 spn_hunt.0121.a.tt:0 "[spn_hunt_witch.GetTitledFirstName] is brought out. What happens to her after that is your decision to make, and yours to carry."
 spn_hunt.0121.b:0 "Watch her."
 spn_hunt.0121.b.tt:0 "You leave knowing exactly what she is, and she does not know that you know. That is worth more than a fire."
 spn_hunt.0121.c:0 "Leave her be."
 spn_hunt.0121.c.tt:0 "She has buried two husbands and harmed nobody you can name. You ride on."

 # 2.35 -- You Are Being Counted (the pack, during tracking)
 spn_hunt.0112.t:0 "You Are Being Counted"
 spn_hunt.0112.desc:0 "It takes eleven days to work out what has been wrong since you got here.\n\nIt is not that people will not talk to you. It is that the same four faces have been present for every conversation, in four different parts of [spn_hunt_county.GetName], and none of them has ever spoken.\n\nThere is more than one of them here. You do not know how many, or whether they hunt together."
 spn_hunt.0112.a:0 "Find out how many."
 spn_hunt.0112.a.tt:0 "Your [learning|E] against a careful count. Get it right and you have a fair idea what is waiting; get it wrong and they know you were counting."
 spn_hunt.0112.a.success_tt:0 "You get a number you half believe, and it is worse than you hoped"
 spn_hunt.0112.a.failure_tt:0 "You get nothing, and they get your face"
 spn_hunt.0112.b:0 "Tell the lord what his county is."
 spn_hunt.0112.b.tt:0 "[spn_hunt_county.GetName]'s lord will lend you men when you need them. He will also talk, and this county listens."
 spn_hunt.0112.c:0 "You came for one."
 spn_hunt.0112.c.tt:0 "Whatever else lives here is not your business tonight. You keep walking and you keep quiet."

 # 2.35 -- Nobody Here Remembers (the compulsion's own trail)
 spn_hunt.0130.t:0 "Nobody Here Remembers"
 spn_hunt.0130.desc:0 "Your reeve has been in [spn_compel_hole_county.GetName] a fortnight and has come back uneasy about something he cannot name.\n\nNobody is frightened. That is the part he keeps returning to. A carter cannot account for four days in the spring and does not think he needs to. A widow gave away a field and remembers agreeing, but not to whom.\n\n\"They're not lying to me, my lord. That's what I can't get past.\""
 spn_hunt.0130.a:0 "Have it looked into."
 spn_hunt.0130.a.tt:0 "Your [learning|E] against however carefully it was done. Find the shape of it and you may come away with a name, and a county that knows to watch for it."
 spn_hunt.0130.a.success_tt:0 "You find the shape of it, and the shape looks a great deal like a name"
 spn_hunt.0130.a.failure_tt:0 "Every thread you pull comes away in your hand"
 spn_hunt.0130.b:0 "Put the Trailsman on it."
 spn_hunt.0130.b.tt:0 "He reads ground for a living, and a county that has mislaid a week is ground. #high Better odds#!."
 spn_hunt.0130.c:0 "Bad air, bad harvest, bad year."
 spn_hunt.0130.c.tt:0 "Towns go strange. You have a realm to run and no evidence of anything at all."

 # 2.35 -- earned names
 nick_the_beastbane:0 "the Beastbane"
 nick_the_unhunted:0 "the Unhunted"

 # 2.35 -- Another Man's Trail (hunter meets hunter)
 spn_hunt.0113.t:0 "Another Man's Trail"
 spn_hunt.0113.desc:0 "The man in the corner has been nursing the same cup for an hour and has asked the landlord two questions you were going to ask.\n\n[spn_hunt_rival.GetTitledFirstName] does not pretend otherwise when you sit down. [spn_hunt_rival.GetSheHe] has been in [spn_hunt_county.GetName] nine days, [spn_hunt_rival.GetSheHe] has walked the same three streets you walked this morning, and [spn_hunt_rival.GetSheHe] knows what the graves look like.\n\nThere is one trail here and two of you standing on it."
 spn_hunt.0113.a:0 "Ride together."
 spn_hunt.0113.a.tt:0 "#high +10#! on the bar and #high +12#! in the fight — he has been asking these questions longer than you have. You will both remember it."
 spn_hunt.0113.b:0 "Ask what he knows."
 spn_hunt.0113.b.tt:0 "Nine days of somebody else's work, for the price of admitting you want it. #high +5#! on the bar."
 spn_hunt.0113.c:0 "Tell him it is your trail."
 spn_hunt.0113.c.tt:0 "He will find another county. He will also remember which one of you said it first."

 ############################################################
 # 2.35 -- What They Will Find (the morning after a compelled death)
 ############################################################
 spn_hunt.0140.t:0 "What They Will Find"
 spn_hunt.0140.desc:0 "It is done, and it is quiet, and it will not stay quiet.\n\nSomebody will come down this street before the bells. They will find what is lying in it, and whatever they decide happened here is what [spn_body_county.GetName] will believe for the next five years — and what the next man with a stake in his saddlebag will be told when he asks.\n\nYou have until first light to decide what that is."
 spn_hunt.0140.desc_someone:0 "It is done, and it is quiet, and it will not stay quiet.\n\nSomebody will come down this street before the bells, and whatever they decide happened here is what [spn_body_county.GetName] will believe for the next five years.\n\n[spn_body_frame.GetTitledFirstName] sleeps four streets from here, and is no more human than you are. Nobody in this county knows that. They could, by morning, if you were careless in the right direction."
 spn_hunt.0140.a:0 "Make it look like nothing."
 spn_hunt.0140.a.tt:0 "Your strength and your talent for lying against a street that will be busy in three hours. Get it right and there is no trail at all. Get it wrong and there is one, and it is yours."
 spn_hunt.0140.b:0 "Let them look at [spn_body_frame.GetFirstName]."
 spn_hunt.0140.b.tt:0 "Harder than hiding it — a lie has to survive being checked. Get it right and the trail points at [spn_body_frame.GetTitledFirstName], and it reads as [spn_body_frame.GetHerHis] kind of work. Get it wrong and it is yours."
 spn_hunt.0140.c:0 "Let them know it was me."
 spn_hunt.0140.c.tt:0 "No hiding, so nothing to fail at. The trail is yours and it is #high loud#! — three times over — and [spn_body_county.GetName]'s lord and every soul in his hall will be told exactly what walked through here.\n\nHunters will come. That is the idea."
 
 ############################################################
 # 2.35g -- SEND FOR A HUNTER (spn_hunt.0006-0012), the cascade (0030-0031), the redirect (0200.g)
 ############################################################
 spn_hunt.0001.e:0 "Send for a hunter."
 spn_hunt.0001.e.tt:0 "Write to the men who do this work. Three names will come back, and you choose which of them gets the road into [spn_menace_county.GetName]."

 spn_hunt.0006.t:0 "Three Men Who Do This Work"
 spn_hunt.0006.desc:0 "The letters went out in the second week and the answers came back over the next month, which is faster than you expected and slower than you wanted.\n\nThree of them are near enough to matter. Your steward has laid the replies out on the table in the order he thinks best, which is to say in the order of what they are asking for.\n\nOne of these men rides to [spn_menace_county.GetName]. The other two hear nothing further from you, and will remember it."
 spn_hunt.0006.desc_nobody:0 "The letters went out. Over the following weeks they came back, or did not.\n\nThe men who do this work are few, and the few there are happen to be elsewhere — in another lord's pay, in another lord's gaol, or somewhere between the two. There is no one to send to [spn_menace_county.GetName] but the men you already have.\n\nYour steward gathers the papers without being asked."
 spn_hunt.0006.a:0 "[spn_summons_a.GetShortUIName] — send to [spn_summons_a.GetHerHim]."
 spn_hunt.0006.b:0 "[spn_summons_b.GetShortUIName] — send to [spn_summons_b.GetHerHim]."
 spn_hunt.0006.c:0 "[spn_summons_c.GetShortUIName] — send to [spn_summons_c.GetHerHim]."
 spn_hunt.0006.d:0 "None of them."
 spn_hunt.0006.d.tt:0 "No one is sent for. The trail in [spn_menace_county.GetName] stays where it is, and so does whatever made it. You may write again in a year."

 spn_hunt.0007.t:0 "A Lord Has Written to You"
 spn_hunt.0007.desc:0 "The letter is short and the hand is a clerk's, but the seal is [spn_summons_lord.GetTitledFirstName]'s own and the money is named in it, which is not always true of letters like this.\n\nSomething is killing people in [spn_summons_county.GetName]. He does not say what. He says he has asked, and that the asking is how he came to your name.\n\n[spn_summons_purse|V] gold when it is done."
 spn_hunt.0007.a:0 "I'll ride."
 spn_hunt.0007.a.tt:0 "You are expected in [spn_summons_county.GetName]. The purse — [spn_summons_purse|V] gold — is paid when the thing that made that trail is dead, and not before."
 spn_hunt.0007.b:0 "It will cost [spn_summons_lord.GetHerHim] more than that."
 spn_hunt.0007.b.tt:0 "Write back with a higher figure and see what [spn_summons_lord.GetTitledFirstName] does about it. If [spn_summons_lord.GetSheHe] pays, the purse doubles. If [spn_summons_lord.GetSheHe] does not, there is no work and no purse."
 spn_hunt.0007.c:0 "Find somebody else."
 spn_hunt.0007.c.tt:0 "You do not answer. [spn_summons_lord.GetTitledFirstName] will hear as much, and will not forget which name [spn_summons_lord.GetSheHe] wasted a letter on."

 spn_hunt.0008.t:0 "The Hunter Names His Price"
 spn_hunt.0008.desc:0 "[spn_summons_target.GetTitledFirstName] writes back in his own hand, which is worse than a clerk's and considerably plainer.\n\nHe knows what is in [spn_summons_county.GetName]. He knows roughly what it will take. And he knows, because he has done this before, that a lord who has already written one letter will usually write a second.\n\nDouble, or he stays where he is."
 spn_hunt.0008.a:0 "Pay him."
 spn_hunt.0008.a.tt:0 "The purse doubles, to [spn_summons_purse|V] gold — and he comes."
 spn_hunt.0008.b:0 "He can starve."
 spn_hunt.0008.b.tt:0 "No second letter. The work is unfilled, and the county keeps its trail."

 spn_hunt.0009.t:0 "He Is Coming"
 spn_hunt.0009.desc:0 "Word from the road: he took the work.\n\nHe did not ask what it was, which your steward thinks is a good sign and your chaplain does not."
 spn_hunt.0009.a:0 "Good."
 spn_hunt.0009.a.tt:0 "He will make his own way to the county. What he does there is his business until it is finished — and then the purse is yours to pay."

 spn_hunt.0011.t:0 "He Is Not Coming"
 spn_hunt.0011.desc:0 "The answer, when it comes, is two lines long and does not explain itself.\n\nWhatever is in that county is still in that county, and now one more man knows about it."
 spn_hunt.0011.a:0 "Then it will have to be somebody else."
 spn_hunt.0011.a.tt:0 "You may write again within the year."

 spn_hunt.0012.t:0 "The Purse"
 spn_hunt.0012.desc:0 "It arrives without ceremony — a bag, a clerk, and a line in a ledger somewhere that will outlast everyone who was in that county.\n\nThe clerk waits to see whether you count it. You do not, which he will report."
 spn_hunt.0012.a:0 "Paid is paid."

 spn_hunt.0030.t:0 "Send Word"
 spn_hunt.0030.desc:0 "You are three days gone and still not sleeping.\n\nHe was not a fool and he was not alone, and men like that do not stop at one name. Whatever he has written down, he has written it somewhere — and the others of your blood do not know that the writing exists.\n\nA letter tonight would reach them before he does."
 spn_hunt.0030.a:0 "Warn my get."
 spn_hunt.0030.a.tt:0 "Everyone you made hears what came for you. They will be watching the road for a year, and they will know who told them."
 spn_hunt.0030.b:0 "Warn the one who made me."
 spn_hunt.0030.b.tt:0 "The letter goes upward instead. Your maker watches the road for a year — and remembers that you thought of [spn_kin_maker.GetHerHim]."
 spn_hunt.0030.c:0 "Warn all of them."
 spn_hunt.0030.c.tt:0 "Every name in your blood, in one night, by whatever hands you can trust. All of them watch the road for a year. Keeping the story straight across that many letters costs you."
 spn_hunt.0030.d:0 "Better they look somewhere else."
 spn_hunt.0030.d.tt:0 "A word in the right ear in [spn_kin_get.GetTitledFirstName]'s county — nothing that names you, only something that gets noticed. It will draw exactly what came for you, and it will land on [spn_kin_get.GetHerHim]."
 spn_hunt.0030.e:0 "Say nothing."
 spn_hunt.0030.e.tt:0 "A letter is a thing that can be found. No one hears anything from you."

 spn_hunt.0031.t:0 "Somebody Gave You Up"
 spn_hunt.0031.desc:0 "There is a man asking after you by name.\n\nNot after the deaths, not after the county — after you, and he started in the right place and with the right questions, which means he did not begin at the beginning. Somebody handed him the middle of it.\n\nThe question is who, and the answer is worth more to you than the running would be."
 spn_hunt.0031.a:0 "Who talked?"
 spn_hunt.0031.a.found_tt:0 "You find the shape of it: whose county, whose room, whose neck was on the line that week. You know."
 spn_hunt.0031.a.lost_tt:0 "The trail back goes cold two men from you. Somebody was careful."
 spn_hunt.0031.b:0 "It hardly matters who. Watch the road."
 spn_hunt.0031.b.tt:0 "You will be watching for a year, which is the only part of this you can control."

 spn_hunt.0200.g:0 "There is worse than me in this land."
 spn_hunt.0200.g.tt:0 "Your [diplomacy|E] against [spn_hunter.GetHerHis]. You do not deny what you are — you tell [spn_hunter.GetHerHim] where the bodies are stacking up higher, and it is true. Taken: [spn_hunter.GetSheHe] leaves, and rides for that county instead. Refused: you have just told a hunter you keep count. The fight is harder."
 spn_hunt.0200.g.taken_tt:0 "[spn_hunter.GetSheHe] listens longer than [spn_hunter.GetSheHe] means to, and then [spn_hunter.GetSheHe] is gone. Not far. Just not here."
 spn_hunt.0200.g.refused_tt:0 "[spn_hunter.GetSheHe] does not care how many there are elsewhere. [spn_hunter.GetSheHe] came for one."

 spn_hunt_redirect_duel:0 "Pointing him elsewhere"
 spn_hunt_whotalked_duel:0 "Finding out who talked"
 
 # 2.35h -- the beat between the door and the fight, when what comes through it is the wrong man
 spn_hunt.0221.t:0 "This Is Not The Man"
 spn_hunt.0221.desc:0 "You have the door and you have the hour and you have, at last, the right house — and what comes out of it is [spn_proxy.GetShortUIName], who is forty years too young for the killings you have been reading about.\n\n[spn_proxy.GetSheHe] is armed. [spn_proxy.GetSheHe] is also terrified, and not of you: [spn_proxy.GetSheHe] keeps glancing back at the dark behind [spn_proxy.GetHerHim], which tells you everything about who is standing in it and what was said before the bolt was drawn.\n\nSomebody sent [spn_proxy.GetHerHim] out here to be killed instead. That worked, in the sense that [spn_proxy.GetSheHe] is the one in front of you."
 spn_hunt.0221.a:0 "Then [spn_proxy.GetSheHe] dies first."
 spn_hunt.0221.a.tt:0 "You take the fight you were given. It is the same blood and the same trail, and the one who sent [spn_proxy.GetHerHim] keeps the night."
 spn_hunt.0221.b:0 "Stand aside. I came for the one who made you."
 spn_hunt.0221.b.tt:0 "[spn_proxy.GetSheHe] lives, and walks. You go back to the door — and this time there is no one left to send out through it."
