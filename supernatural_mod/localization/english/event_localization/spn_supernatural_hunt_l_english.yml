 # journey_activity_l_english.yml:40 -- "\n#positive_value ++ Short Distance#!"
 spn_hunt_prov_base:0 "A hunter reads a county by what it has lost.\n"
 # The trail
 spn_hunt_tag_trail_1:0 "#positive_value + Recent Killings#! (Trail)\n"
 spn_hunt_tag_trail_2:0 "#positive_value ++ A String of Them#! (Trail)\n"
 spn_hunt_tag_trail_3:0 "#positive_value +++ The County Is Losing People#! (Trail)\n"
 # What left it
 spn_hunt_tag_kind_vampire:0 "#positive_value + Drained#! (Sign)\n"
 spn_hunt_tag_kind_werewolf:0 "#positive_value + Torn#! (Sign)\n"
 spn_hunt_tag_kind_unknown:0 "#negative_value - You Cannot Read It#! (Sign)\n"
 # The county
 spn_hunt_tag_control_low:0 "#positive_value + Nobody Is Keeping Order#! (Control)\n"
 spn_hunt_tag_control_none:0 "#positive_value ++ The County Has Lost Its Grip#! (Control)\n"
 spn_hunt_tag_compelled:0 "#negative_value - Nobody Here Remembers#! (Witnesses)\n"
 spn_hunt_tag_no_one_comes:0 "#negative_value -- No Hunter Will Take It#! (Reputation)\n"
 # The ride
 spn_hunt_tag_ride_very_short:0 "#positive_value +++ Very Short Ride#! (Distance)\n"
 spn_hunt_tag_ride_short:0 "#positive_value ++ Short Ride#! (Distance)\n"
