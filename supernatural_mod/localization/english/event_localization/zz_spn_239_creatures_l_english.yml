l_english:
 # 2.39 (WORK-ORDER-2.39 F7): vampires, wolves and witches inside the Order.

 # The Coin (spn_order.0110), the cage: a wolf.
 spn_order.0110.scent:0 "Let it catch my scent"
 spn_order.0110.scent.tt:0 "The beast knows its own kind. Whatever happens, it will not take your hand."

 # The Observance (spn_order.0120): a vampire or hybrid neophyte.
 spn_order.0120.forget:0 "Make him forget he saw me"
 spn_order.0120.forget.tt:0 "He will forget you were ever here. But this was the test, and the masks were watching: your Temple Magus learns what you are."

 # An Outsider Asks Questions (spn_order.0160): a vampire or hybrid member.
 spn_order.0160.look:0 "Look [spn_os_who.GetHerHim] in the eye"
 spn_order.0160.look.tt:0 "You hold [spn_os_who.GetHerHis] gaze and tell [spn_os_who.GetHerHim] to forget the chapel and go home."
 spn_order.0160.look_hunter.tt:0 "#N Against a hunter it takes all your strength: twice the usual blood, and it can drop you a tier until you earn it back.#!"

 # The Relic That Would Not Sleep (spn_order.0161): a Champion, or anyone with Magical Senses.
 spn_order.0161.listen:0 "Listen to what it wants"
 spn_order.0161.listen.tt:0 "You sit with it through the night and listen. By morning it is quiet, and the acolytes have seen who quieted it."

 # They Came for What You Know (spn_order.0193): a wolf who left the Order.
 spn_order.0193.wolf:0 "Let the wolf out"
 spn_order.0193.wolf.tt:0 "A fight in the dark. The better your [prowess|E], the likelier they are to run and leave you alone for good. If you lose, you forget."

 # The Temple Asks for Your Blood (spn_order.0820): any creature.
 spn_order.0820.a_creature:0 "My blood has carried worse than this"

 # The Wolves Have Teeth (spn_order.0829): a wolf Temple Magus.
 spn_order.0829.scent:0 "I know that scent"
 spn_order.0829.scent.tt:0 "You would know that scent anywhere. You learn [spn_wolf_killer.GetHerHis] secret."
 spn_order.0829.scent_known.tt:0 "You already know what [spn_wolf_killer.GetSheHe] is. Now you know [spn_wolf_killer.GetHerHis] scent as well."

 # A Mask Knows Too Much (spn_conclave.0120): a wolf.
 spn_conclave.0120.scent:0 "Follow the scent"
 spn_conclave.0120.scent.desc:0 "You followed the grey mask's scent through the crowd and found them alone. They meant it as a test, and you passed."
