l_english:
 ############################################################
 # Supernatural 2.35b -- the Supernatural Hunt's field events. English.
 ############################################################

 # Duels
 spn_hunt_wounds_duel:0 "Reading the wounds"
 spn_hunt_dogs_duel:0 "Walking the stretch the dogs will not"
 spn_hunt_misdirect_duel:0 "Giving him somewhere else to look"

 # --- Two Different Animals (hybrid) ---
 spn_hunt.0150.t:0 "Two Different Animals"
 spn_hunt.0150.desc:0 "Six of them now, and they do not agree with each other.\n\nTwo were opened at the throat and left empty. No pooling, nothing on the walls. The other four were taken apart by something with weight behind it.\n\nEveryone in [spn_hunt_county.GetName] with an opinion says the same thing. Two of them. There are two of them."
 spn_hunt.0150.a:0 "Two of them, then."
 spn_hunt.0150.a.tt:0 "You prepare for both. #weak Your kit is half right whichever it turns out to be#! — worth #high -8#! in the fight — and #weak -5#! on the bar."
 spn_hunt.0150.b:0 "One of them. It is both."
 spn_hunt.0150.b.tt:0 "You have seen this before, or been told about it by somebody who had. #high +15#! on the bar."
 spn_hunt.0150.c:0 "Open one of them up and find out."
 spn_hunt.0150.c.tt:0 "Your [learning|E] against six days of gravedigger's hearsay. It is not pleasant work and it is the only work that answers this."
 spn_hunt.0150.c.success_tt:0 "The same hands did all six"
 spn_hunt.0150.c.failure_tt:0 "You spend a night learning nothing you did not already suspect"

 # --- By the Moon (werewolf) ---
 spn_hunt.0151.t:0 "By the Moon"
 spn_hunt.0151.desc:0 "The parish keeps its dead by the feast days. Close enough to a calendar.\n\nYou lay them out on a table with a candle and it comes apart in front of you. They cluster. Three in one week, a month of nothing, then two.\n\nWhatever this is, it is not hungry all the time. It is hungry on a schedule. So you know roughly when the next one is."
 spn_hunt.0151.a:0 "Be where it will be."
 spn_hunt.0151.a.tt:0 "You stop asking questions and spend the weeks waiting instead. #high +20#! on the bar, and nobody hears you coming, because you have stopped talking."
 spn_hunt.0151.b:0 "Tell the county which night to bolt its doors."
 spn_hunt.0151.b.tt:0 "Fewer of them die. #weak -10#! on the bar — a street that is watching is a street it will not walk down — and everything living in [spn_hunt_county.GetName] hears why."

 # --- Not a Drop (vampire) ---
 spn_hunt.0152.t:0 "Not a Drop"
 spn_hunt.0152.desc:0 "The sexton has buried four and wants to talk about the same thing every time. There was no mess.\n\nNothing in the room, nothing on the road, nothing on their clothes. A man opened at the throat leaves half of himself where he falls. These did not.\n\nWhatever came for them did not come to kill. Killing was how it ended, not what it was for."
 spn_hunt.0152.a:0 "Then look for the ones who lived."
 spn_hunt.0152.a.tt:0 "Four died. Something that feeds like this does not stop at four. #high +12#! on the bar."
 spn_hunt.0152.b:0 "Watch the ground it has to cross."
 spn_hunt.0152.b.tt:0 "It comes on foot and it comes at night and there are three ways into this quarter. #high +8#! on the bar and #high +5#! in the fight."

 # --- They Are All Very Sure (compelled county) ---
 spn_hunt.0153.t:0 "They Are All Very Sure"
 spn_hunt.0153.desc:0 "You have asked forty people in [spn_hunt_county.GetName] about that week and got forty clean answers.\n\nThat is the problem. Not one of them scratches his head. Not one names the wrong day and corrects himself. They tell you, they all tell you the same, and then they look at you as though you have been rude.\n\nNobody remembers a week that well."
 spn_hunt.0153.a:0 "Stop asking what happened."
 spn_hunt.0153.a.tt:0 "Ask what they cannot tell you instead. The holes are the shape of it. #high +15#! on the bar."
 spn_hunt.0153.b:0 "Whatever does this can reach into a man's head."
 spn_hunt.0153.b.tt:0 "Which means it can reach into yours. You send for men, and you are slower for it — #weak -5#! on the bar, and the county's swords when you need them."

 # --- What the Dogs Will Not Pass ---
 spn_hunt.0154.t:0 "What the Dogs Will Not Pass"
 spn_hunt.0154.desc:0 "There is forty yards of the low road that the dogs will not walk.\n\nNot bark at. Not shy from. Will not walk. The drover takes them the long way round and has done for a year and could not tell you when he started, and when you ask him to take them through he laughs at you and then, when he understands you are serious, he stops laughing.\n\nWhatever is there is there in daylight too. It simply does nothing in daylight."
 spn_hunt.0154.desc_reader:0 "There is forty yards of the low road that the dogs will not walk, and [spn_hunt_reader.GetTitledFirstName] found it before you did.\n\nNot bark at. Not shy from. Will not walk. \"A year, near enough,\" [spn_hunt_reader.GetSheHe] says, crouched over nothing you can see. \"Ground's wrong here. It's wrong in a line.\"\n\nWhatever is there is there in daylight too. It simply does nothing in daylight."
 spn_hunt.0154.a:0 "Walk it at night."
 spn_hunt.0154.a.tt:0 "Your [prowess|E] against whatever the dogs already worked out. #high +15#! on the bar if you are still standing at the end of it."
 spn_hunt.0154.a.success_tt:0 "You find where it goes to ground"
 spn_hunt.0154.a.failure_tt:0 "Something reaches you before you reach it"
 spn_hunt.0154.b:0 "Walk it in daylight and read it properly."
 spn_hunt.0154.b.tt:0 "Slower and safer. #high +6#! on the bar, and #high +6#! more if you brought somebody who reads ground for a living."

 # --- He Asked About You By Name (the creature's side) ---
 spn_hunt.0155.t:0 "He Asked About You By Name"
 spn_hunt.0155.desc:0 "Your cook's sister works the tavern on the low road and she came up the hill herself to tell you, which is how you know it frightened her.\n\n[spn_hunter.GetTitledFirstName] has been in [spn_hunt_county.GetName] a fortnight and until this week [spn_hunter.GetSheHe] was asking about the dead. Now [spn_hunter.GetSheHe] is asking about you. Not about a creature. About you, by name, and where you were on nights [spn_hunter.GetSheHe] can list.\n\nThere is still time to be somewhere else. There is not much of it."
 spn_hunt.0155.a:0 "Go now."
 spn_hunt.0155.a.tt:0 "You are gone before [spn_hunter.GetSheHe] reaches the door and the hunt ends with nothing. It also costs you two years of feeding, and [spn_hunter.GetSheHe] will know exactly what that means."
 spn_hunt.0155.b:0 "Give him somewhere else to look."
 spn_hunt.0155.b.tt:0 "Your [intrigue|E] against [spn_hunter.GetHerHis]. Done well it is #high -20#! off everything [spn_hunter.GetSheHe] has put together. Done badly you have just confirmed the week [spn_hunter.GetSheHe] was asking about."
 spn_hunt.0155.b.success_tt:0 "The trail bends away from your door"
 spn_hunt.0155.b.failure_tt:0 "You answer a question [spn_hunter.GetSheHe] had not asked yet"
 spn_hunt.0155.c:0 "Let him come."
 spn_hunt.0155.c.tt:0 "You will be ready, and being ready is worth something when the door opens."

 # --- The Ones Who Helped ---
 spn_hunt.0156.t:0 "The Ones Who Helped"
 spn_hunt.0156.desc:0 "[spn_hunt_helper.GetTitledFirstName] told you about the low road, and the dates, and which of the dead had been drinking with which of the living. [spn_hunt_helper.GetSheHe] told you gladly. Nobody had asked before.\n\nSomebody has been standing across from [spn_hunt_helper.GetHerHis] door at night. [spn_hunt_helper.GetSheHe] has not seen who, and [spn_hunt_helper.GetSheHe] is not sleeping, and [spn_hunt_helper.GetSheHe] came to you about it because you are the only person in [spn_hunt_county.GetName] who would believe [spn_hunt_helper.GetHerHim].\n\nYou did this. Not on purpose, and you still did it."
 spn_hunt.0156.a:0 "Put [spn_hunt_helper.GetFirstName] somewhere it cannot reach."
 spn_hunt.0156.a.tt:0 "You lose [spn_hunt_helper.GetHerHis] eyes and ears for the rest of it — #weak -8#! on the bar — and [spn_hunt_helper.GetSheHe] lives."
 spn_hunt.0156.b:0 "Use him. Frightened men remember more."
 spn_hunt.0156.b.tt:0 "#high +12#! on the bar. [spn_hunt_helper.GetTitledFirstName] will not thank you, and [spn_hunt_helper.GetSheHe] will not come through it whole."
