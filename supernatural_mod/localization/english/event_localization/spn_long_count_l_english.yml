l_english:
 ############################################################
 # Supernatural 2.35 -- The Long Count. English.
 # Milestones on how long a creature has been what it is.
 ############################################################

 spn_long_count_perk_point_tt:0 "#high A perk point#! in your own tree"
 spn_long_count_perk_points_tt:0 "#high Two perk points#! in your own tree"
 spn_long_count_kept_opinion:0 "Still here, after all of it"

 spn_long_count.0001.t:0 "A Hundred Years"
 spn_long_count.0001.desc:0 "You worked it out on a road you have walked a hundred times, over something that was not important.\n\nA century. The child who held your horse the week it happened has been dead sixty years, and so has the child who held his. The town you remember has a different name and the river has moved.\n\nYou have not been counting. That is the part that stops you: you have not been counting, and it went anyway."
 spn_long_count.0001.desc_wolf:0 "You worked it out on a road you have walked a hundred times, over something that was not important.\n\nA century of moons. The child who held your horse the week it happened has been dead sixty years, and so has the child who held his. You have buried people who were born long after you stopped being able to die of anything ordinary.\n\nThe wolf does not count. You did not either, until now."
 spn_long_count.0001.desc_both:0 "You worked it out on a road you have walked a hundred times, over something that was not important.\n\nA century, and both of the things in you have had it. Neither has ever agreed about anything else. The town you remember has a different name and the river has moved, and every year of it went into your hands whether you were watching or not.\n\nYou have not been counting. It went anyway."
 spn_long_count.0001.a:0 "Take stock of it."
 spn_long_count.0001.b:0 "Count what it cost."

 spn_long_count.0002.t:0 "Two Hundred Years"
 spn_long_count.0002.desc:0 "Two hundred, and you notice it the way you notice weather.\n\nThere is nobody left who can tell you a thing about yourself that you did not tell them first. The families you knew have thinned out into names on walls. Twice you have gone back to a place to find it gone, and once to find it there and wrong.\n\nWhat you have instead is practice. There is very little left in the world that can surprise your hands."
 spn_long_count.0002.desc_wolf:0 "Two hundred, and you notice it the way you notice weather.\n\nThe families you knew have thinned out into names on walls. Twice you have gone back to a place to find it gone, and once to find it there and wrong. Nothing that hunts you has ever hunted you twice.\n\nWhat you have instead is practice. There is very little left in the world that can surprise your hands."
 spn_long_count.0002.a:0 "One of us still remembers the beginning."
 spn_long_count.0002.b:0 "Nobody is left to contradict me."

 spn_long_count.0003.t:0 "Three Hundred Years"
 spn_long_count.0003.desc:0 "Three hundred years, and the arithmetic has stopped meaning anything.\n\nNobody alive saw you arrive. Nobody alive was told about it by somebody who did. Whatever you were before is a story now, and it is a story you are the only surviving source for, which means it is whatever you say it is.\n\nThat should be freeing. Most nights it is."
 spn_long_count.0003.a:0 "Whatever I say it is."
