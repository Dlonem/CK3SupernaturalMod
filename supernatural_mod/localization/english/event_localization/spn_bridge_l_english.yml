l_english:
 ############################################################
 # Supernatural 2.35, part two -- "The Bridge". English.
 #
 # Demons and witches leave the same county trail vampires and werewolves already left, and a hunter has an
 # answer to a demon that is not a mage's spell. Register: folklore, lightly worn. A demon is smoke that
 # wears a person. Nobody says "elder".
 ############################################################

 # ==========================================================
 # THE TRAIL -- new tags, modifiers and the death reason
 # ==========================================================
 spn_hunt_tag_kind_demon:0 "#positive_value + Nothing Taken, Everything Ruined#! (Sign)\n"
 spn_hunt_tag_kind_witch:0 "#positive_value + Done Deliberately#! (Sign)\n"

 spn_no_one_will_come_modifier:0 "No One Will Come"
 spn_no_one_will_come_modifier_desc:0 "Three men rode here after it and none of them rode back with anything. The trade talks, and the county has stopped being a place anyone will take work in. What is left governs itself, badly."
 spn_they_stopped_coming_modifier:0 "They Stopped Coming"
 spn_they_stopped_coming_modifier_desc:0 "Whatever is in that county, men who hunt things for a living have decided it is not worth what it pays."
 spn_driven_off_modifier:0 "Driven Off"
 spn_driven_off_modifier_desc:0 "Somebody nearly had you, and made you leave. It is not a wound and it does not heal like one."
 spn_brought_back_modifier:0 "Brought Back"
 spn_brought_back_modifier_desc:0 "You were somewhere else for a long time and something else was here. Your hands do not quite feel like your hands yet."
 spn_took_the_bargain_modifier:0 "Signed"
 spn_took_the_bargain_modifier_desc:0 "Healed, sharpened, and thirty years lighter. There is a date on it and you know roughly when."

 spn_death_exorcised:0 "[CHARACTER.GetSheHe] fell where [CHARACTER.GetSheHe] stood, and whatever had been holding [CHARACTER.GetHerHim] up was gone"

 spn_bought_my_silence_opinion:0 "Bought my silence, and it did not hold"
 spn_took_my_coin_opinion:0 "Was generous when it mattered"
 spn_gave_me_back_opinion:0 "Gave me back my own life"
 spn_drove_me_off_opinion:0 "Put me out of a county"

 spn_exorcism_soul_returned_toast:0 "A Contract Ends"
 spn_exorcism_soul_returned_tt:0 "The thing that held your name is gone, and so is what it held. Whatever you signed away, nobody is coming for it."

 # ==========================================================
 # MEMORIES
 # ==========================================================
 spn_sent_it_home_memory:0 "sent one home"
 spn_sent_it_home_memory_desc:0 "sent whatever was wearing [demon.GetFirstName] back where it came from, and watched what it left behind fall down"
 spn_sent_it_home_memory_desc_second_perspective:0 "sent whatever was wearing [demon.GetFirstName] back where it came from, and watched what it left behind fall down"
 spn_sent_it_home_memory_desc_third_perspective:0 "sent whatever was wearing [demon.GetFirstName] back where it came from, and watched what it left behind fall down"
 spn_brought_one_back_memory:0 "brought one back"
 spn_brought_one_back_memory_desc:0 "found a person still in there, and got [person.GetHerHim] out"
 spn_brought_one_back_memory_desc_second_perspective:0 "found a person still in there, and got [person.GetHerHim] out"
 spn_brought_one_back_memory_desc_third_perspective:0 "found a person still in there, and got [person.GetHerHim] out"
 spn_remembers_the_exorcist_memory:0 "the one who nearly had me"
 spn_remembers_the_exorcist_memory_desc:0 "remember [hunter.GetFirstName], who said the words properly and very nearly finished them"
 spn_remembers_the_exorcist_memory_desc_second_perspective:0 "remember [hunter.GetFirstName], who said the words properly and very nearly finished them"
 spn_remembers_the_exorcist_memory_desc_third_perspective:0 "remembers [hunter.GetFirstName], who said the words properly and very nearly finished them"
 spn_took_the_demons_bargain_memory:0 "signed"
 spn_took_the_demons_bargain_memory_desc:0 "stopped hunting [demon.GetFirstName] and signed what [demon.GetSheHe] put in front of me instead"
 spn_took_the_demons_bargain_memory_desc_second_perspective:0 "stopped hunting [demon.GetFirstName] and signed what [demon.GetSheHe] put in front of you instead"
 spn_took_the_demons_bargain_memory_desc_third_perspective:0 "stopped hunting [demon.GetFirstName] and signed what [demon.GetSheHe] put in front of [owner.GetHerHim] instead"

 # ==========================================================
 # GATE TOOLTIPS
 # ==========================================================
 spn_hunt_exorcise_needs_tt:0 "Requires #high witch hunting 25#!. You have to know the words."
 spn_hunt_exorcise_named_tt:0 "This one has a name older than the words do. It is not going anywhere it does not want to go."
 spn_hunt_banish_needs_tt:0 "Requires #high witch hunting 100#!, or the banishing spell itself."
 spn_hunt_banish_greater_tt:0 "Nothing that can be banished is standing here."
 spn_hunt_coven_needs_tt:0 "Requires #high witch hunting 60#!, or a name the house has already heard."

 # ==========================================================
 # THE TRAIL (spn_hunt.0100) -- two new kind reads and the first off-ramp
 # ==========================================================
 spn_hunt.0100.desc_demon:0 "You have seen a house a wolf went through. You have seen a room a vampire worked in. This is neither.\n\nThe man is on his own floor with his hands at his sides. No wound. Nothing missing. The fire is out, the milk has turned, and the dog will not come in off the step.\n\nHis wife says he sat down halfway through a sentence and did not finish it."
 spn_hunt.0100.desc_witch:0 "Nobody here has been killed, and that is the problem.\n\nThe barley went black in one field and not the two beside it. A woman's milk stopped. The reeve's son has been talking in someone else's voice for eleven days and the priest has stopped visiting.\n\nNone of it is a crime. All of it is deliberate. You only see the shape of it if you stand well back and count."
 spn_hunt.0100.b:0 "This is not my fight."
 spn_hunt.0100.b.tt:0 "Turn around. Whatever is here, it is here for somebody better prepared, or somebody with less to lose.\n\nThe trail stays on the county. Somebody can come back for it."

 # ==========================================================
 # WHAT THEY WILL FIND -- Pay It Away
 # ==========================================================
 spn_hunt.0140.pay:0 "Find whoever would have had to write this down."
 spn_hunt.0140.pay.tt:0 "Costs #high [spn_body_hush_money|V] gold#!. No roll and no lie: the man who would have had to answer for this is handed enough not to, and the county's books stay short by one.\n\nHe will take it. He will also remember taking it, and if a hunter ever proves what was living here, so will everybody else."

 # ==========================================================
 # NOTHING WAS TAKEN (spn_hunt.0160)
 # ==========================================================
 spn_hunt.0160.t:0 "Nothing Was Taken"
 spn_hunt.0160.desc:0 "Four now, in three weeks, and you still cannot say what you are looking at.\n\nA vampire's work is missing something. A wolf's is torn. These are whole, and cold, and every one was found somewhere they had no reason to be.\n\nThe cooper's wife walked into her own well. The reeve held his hand in the fire. Nobody screamed. The neighbours keep saying that as though it helps."
 spn_hunt.0160.desc_reads:0 "Four now, in three weeks, and you have finally stopped trying to make them fit.\n\nYou were looking for damage. There is no damage. The cooper's wife walked into her own well and the reeve held his hand in the fire, and they both did it themselves.\n\nSomething stood in those rooms and never touched anybody. It only had to be there and talk."
 spn_hunt.0160.a:0 "Stop looking at what is missing. Look at what was left."
 spn_hunt.0160.a.tt:0 "The wrong question was costing you three weeks. Nothing was taken from any of them, so the thing to follow is not a wound — it is what each of them was doing when they stopped being themselves, and who was standing near enough to say a word to them.\n\n#high +14#! to the hunt. Some monster hunting experience."
 spn_hunt.0160.b:0 "Go and ask the priest what he is leaving out of the register."
 spn_hunt.0160.b.tt:0 "He has written four deaths and a cause for none of them, and he has been sleeping in the church. He knows a word for this. He would rather not use it in front of a stranger with a sword.\n\n#high +8#! to the hunt. Some witch hunting experience."

 # ==========================================================
 # THE ONES WHO SIGNED (spn_hunt.0161)
 # ==========================================================
 spn_hunt.0161.t:0 "The Ones Who Signed"
 spn_hunt.0161.desc:0 "You notice [spn_hunt_signatory.GetTitledFirstName] because [spn_hunt_signatory.GetSheHe] is the only person in the hall having a good year.\n\nThe harvest was poor and half the county is sick. [spn_hunt_signatory.GetSheHe] has new boots, a new position, and a wife twenty years younger than the one [spn_hunt_signatory.GetSheHe] buried. [spn_hunt_signatory.GetSheHe] has not been to church since spring.\n\nYou have seen this before. Men do not get lucky four times."
 spn_hunt.0161.a:0 "Whoever wrote the contract came here to write it."
 spn_hunt.0161.a.tt:0 "Somebody stood in this county and made a bargain with a man in it, and bargains are made in person. Follow the good fortune backwards to the night it started and you are standing where the thing stood.\n\n#high +16#! to the hunt. Some witch hunting experience."
 spn_hunt.0161.b:0 "Tell [spn_hunt_signatory.GetFirstName] what is coming, and roughly when."
 spn_hunt.0161.b.tt:0 "[spn_hunt_signatory.GetSheHe] does not know the terms. Almost none of them ever do. You can tell [spn_hunt_signatory.GetHerHim] what [spn_hunt_signatory.GetSheHe] signed and what turns up to collect it, and [spn_hunt_signatory.GetSheHe] will hate you for the rest of a shorter life than [spn_hunt_signatory.GetSheHe] thinks [spn_hunt_signatory.GetSheHe] has — and [spn_hunt_signatory.GetSheHe] will tell you everything.\n\n#high +6#! to the hunt."
 spn_hunt.0161.c:0 "Leave them to it. Whatever they signed, they signed."
 spn_hunt.0161.c.tt:0 "You are here for the thing that wrote it, not the fools who put their marks on it."

 # ==========================================================
 # IT KNOWS YOUR NAME (spn_hunt.0162)
 # ==========================================================
 spn_hunt.0162.t:0 "It Knows Your Name"
 spn_hunt.0162.desc:0 "There is a man in the county asking questions. By the third day you have his name, his trade, and the inn he is at.\n\nA wolf would be in the next valley by now. A vampire would be thinking about cellars. You find you are thinking about him: what he is owed, what he is short of, what nobody has ever offered him.\n\nEverybody wants something."
 spn_hunt.0162.a:0 "Let him come. Let him find out what he has been following."
 spn_hunt.0162.a.tt:0 "You will not be surprised, which is most of it. #high +10#! against him when he finds the door."
 spn_hunt.0162.b:0 "Find out what he wants first."
 spn_hunt.0162.b.tt:0 "A man three weeks into a job he is not being paid enough for is a man in the middle of a conversation he does not know he is having.\n\nHe will be offered terms when he gets here."
 spn_hunt.0162.c:0 "Give the county a quiet fortnight before he gets to the good part."
 spn_hunt.0162.c.tt:0 "Nothing happens for two weeks. Nobody notices anything. There is one fewer thing for him to find.\n\n#high -12#! to his hunt, and one incident off the county's books."

 # ==========================================================
 # WHAT IS STANDING THERE (spn_hunt.0163) -- the demon confrontation
 # ==========================================================
 spn_hunt.0163.t:0 "What Is Standing There"
 spn_hunt.0163.desc:0 "The door is open and the thing on the other side of it is wearing a man.\n\nIt is not a good fit. The face works and the hands work and the weight is slightly wrong, as though somebody had been given the shape without the habit of it.\n\n\"You are the one who has been asking,\" it says, in his voice. \"Come in. I am not going anywhere.\""
 spn_hunt.0163.desc_named:0 "The door is open and the thing on the other side of it does not stand up.\n\nIt has answered to that name longer than the county has had one, and it wears the body the way a hand wears a glove. It looks at the salt in your fist and waits for you to finish.\n\n\"Say them,\" it says. \"I want to hear how you were taught it.\""
 spn_hunt.0163.desc_greater:0 "The door is open and the room is wrong before you are through it.\n\nThe fire is burning and giving nothing off. Every dog within a street has gone quiet. The thing in the chair has not blinked since you came in, and does not look like it has decided not to.\n\n\"Sit down,\" it says. \"Nobody has got this far in a hundred years.\""
 spn_hunt.0163.desc_made:0 "The door is open, and the thing behind it is standing in somebody who is still in there.\n\nYou can tell and you could not explain how. The eyes go to the window and come back too fast. The hands keep starting a gesture that belongs to someone else and stopping halfway.\n\n\"Don't,\" it says, pleasantly. \"He can hear you.\""
 spn_hunt.0163.a:0 "Try to drive it out of him."
 spn_hunt.0163.a.tt:0 "No power needed. You need to hold it still long enough to finish, and you need to have been taught properly.\n\nMostly your #high monster hunting#!, partly your #high witch hunting#!. You gain witch hunting experience either way.\n\nIf it was ever a person, that person comes back. If it was not, the body it borrowed does not survive."
 spn_hunt.0163.b:0 "Banish it outright."
 spn_hunt.0163.b.tt:0 "Very few men alive can do this and you are one of them. No roll and no fight. It is simply gone."
 spn_hunt.0163.c:0 "Go at it with what you brought."
 spn_hunt.0163.c.tt:0 "It bleeds, in the sense that the body it is wearing bleeds."
 spn_hunt.0163.d:0 "Hear it out."
 spn_hunt.0163.d.tt:0 "It has an offer. They always have an offer, and the offer is always better than what you came here on."
 spn_hunt.0163.e:0 "Close the door and get on your horse."
 spn_hunt.0163.e.tt:0 "You have been doing this long enough to know the difference between a bad night and the last one.\n\nPrestige #low -25#!. The trail stays where it is."

 # ==========================================================
 # THE BARGAIN IN THE FIELD (spn_hunt.0164)
 # ==========================================================
 spn_hunt.0164.t:0 "The Bargain in the Field"
 spn_hunt.0164.desc:0 "It walks out into the yard with you and stands in the open, where you could take a swing at it.\n\n\"You are forty-one,\" it says. \"Your knee has been wrong since the winter before last. You are owed money in two counties.\" Every number is right. \"Stop doing this and you would be thirty again by spring. I collect in thirty years. That is all of it.\"\n\nIt sets the paper on the wall and steps back from it."
 spn_hunt.0164.a:0 "Read it, and put your mark on it."
 spn_hunt.0164.a.tt:0 "Healed. Sharpened. Thirty years lighter, and better at everything than you have ever been."
 spn_hunt.0164.a.tt2:0 "You give up the hunt, and your soul, on a timer. Something will come for it in ten to thirty years, and it will be exactly as polite about it as this one is being now."
 spn_hunt.0164.b:0 "Pick the paper up and hand it back."
 spn_hunt.0164.b.tt:0 "You have been offered less by worse. Prestige and piety — and it is genuinely put out, which is worth #high +5#! in what happens next."

 # ==========================================================
 # THE ONE YOU BROUGHT BACK (spn_hunt.0165)
 # ==========================================================
 spn_hunt.0165.t:0 "The One You Brought Back"
 spn_hunt.0165.desc:0 "[spn_freed_person.GetTitledFirstName] is at the gate and has been since before light.\n\nThere is nothing to go back to. Somebody else lives in the house. The family finished grieving eleven years ago. The parish roll has a date under that name.\n\n\"I don't want anything,\" [spn_freed_person.GetSheHe] says, and then stands there."
 spn_hunt.0165.a:0 "There is room. Come in."
 spn_hunt.0165.a.tt:0 "A courtier who owes you the whole of the rest of their life, and knows it."
 spn_hunt.0165.b:0 "Give [spn_freed_person.GetHerHim] money for the road."
 spn_hunt.0165.b.tt:0 "[spn_freed_person.GetSheHe] goes into the world owing you one. That is not nothing, and both of you know where the other one is."

 # ==========================================================
 # IT DID NOT GO (spn_hunt.0166)
 # ==========================================================
 spn_hunt.0166.t:0 "It Did Not Go"
 spn_hunt.0166.desc:0 "You got most of the way. You are fairly sure you got most of the way.\n\nSomething went thin in the room for about four heartbeats. The fire pulled sideways. The man's face came apart into somebody frightened and then closed again.\n\nThen it was back, and laughing, and your mouth had stopped working. It is not laughing now. It has put the chair down and it is crossing the floor, and it is not hurrying."
 spn_hunt.0166.a:0 "Get up and put a blade in it."
 spn_hunt.0166.a.tt:0 "You are at #low -20#!. You knew that when you tried the other thing."
 spn_hunt.0166.b:0 "Hit it hard enough to get out of the doorway."
 spn_hunt.0166.b.tt:0 "Beat it back, put it out of the county, and ride home to a year of not being able to lift your arm.\n\nIt does not die. It goes somewhere else, it takes your name with it, and the county's trail is finished.\n\nYou will each know exactly who the other one is."

 # ==========================================================
 # THEY ARE NOT WORKING ALONE (spn_hunt.0170)
 # ==========================================================
 spn_hunt.0170.t:0 "They Are Not Working Alone"
 spn_hunt.0170.desc:0 "You had one name and you were three days from her door. Then the alewife says the wrong thing without meaning to.\n\nShe is complaining about the family. Not the woman, the family. The brother who came back from somewhere and does not work. The aunt nobody sees in daylight. The cousin who buried two husbands and did well out of both.\n\nOne of them is what you came for. You are no longer sure it matters which."
 spn_hunt.0170.a:0 "Count the house before you knock on it."
 spn_hunt.0170.a.tt:0 "Names, ages, which of them are under that roof tonight and which are three valleys away. You will want to have done this.\n\n#high +12#! to the hunt. Some witch hunting experience."
 spn_hunt.0170.b:0 "Send to the lord for men before you go anywhere near it."
 spn_hunt.0170.b.tt:0 "It costs you a week of surprise and buys you people at the doors.\n\n#low -5#! to the hunt, and the county's men when it comes to it."

 # ==========================================================
 # WHERE THE WORK WAS DONE (spn_hunt.0171)
 # ==========================================================
 spn_hunt.0171.t:0 "Where the Work Was Done"
 spn_hunt.0171.desc:0 "The room under the house is dry, swept, and better lit than the kitchen above it. That is what tells you.\n\nJars, labelled. A ledger. Bundles hung up in the order they were cut. A stool worn shiny on one side. Nobody raves down here. Somebody works.\n\n[spn_defender.GetTitledFirstName] is at the bottom of the steps with the lamp, and is neither surprised nor sorry."
 spn_hunt.0171.desc_coven:0 "The room under the house is dry, swept, well lit, and there are four stools.\n\nJars labelled in two hands. A ledger with entries older than [spn_defender.GetTitledFirstName] is. Bundles hung by somebody taller.\n\n[spn_defender.GetSheHe] is at the bottom of the steps with the lamp and is not surprised to see you. Above your head, in a house you have your back to, somebody has just stopped walking."
 spn_hunt.0171.a:0 "Take [spn_defender.GetHerHim], and let a court do the rest."
 spn_hunt.0171.a.tt:0 "Properly, with a reason on the warrant and the reason written down. That is not how this is usually done in these counties and that is rather the point.\n\nThe trail on the county ends. Witch hunting experience."
 spn_hunt.0171.b:0 "Finish it here."
 spn_hunt.0171.b.tt:0 "No warrant, no court, no ledger read out to anybody."
 spn_hunt.0171.c:0 "Go through the house."
 spn_hunt.0171.c.tt:0 "Every adult under this roof, one door at a time, until you run out of doors or out of blood.\n\nEach one is its own fight and its own decision. From the second door on, winning still costs you. Men have finished this and men have been carried out of it."
 spn_hunt.0171.d:0 "You have what you came to confirm. Go."
 spn_hunt.0171.d.tt:0 "Somebody who is not on their own in a house they know, at night, is a job for a different day.\n\nPrestige #low -25#!. The trail stays on the county."

 # ==========================================================
 # ANOTHER ONE IN THE HOUSE (spn_hunt.0172)
 # ==========================================================
 spn_hunt.0172.t:0 "Another One in the House"
 spn_hunt.0172.desc:0 "There is another door and there is somebody behind it.\n\n[spn_defender.GetTitledFirstName] has heard everything that has happened in the last few minutes and has not run, which tells you which sort this one is. The lamp is out. You can hear breathing and you can hear the small sound of something being taken down off a shelf."
 spn_hunt.0172.desc_late:0 "There is another door.\n\nYou are holding the frame to stay upright, there is blood in your boot, and you have lost count of which floor you are on. [spn_defender.GetTitledFirstName] has had several minutes to get ready. You have had several minutes of the opposite.\n\nThere is a version of tonight where you go back down the stairs."
 spn_hunt.0172.a:0 "This one too."
 spn_hunt.0172.a.tt:0 "The same fight as the last one, against somebody who has been listening to it."
 spn_hunt.0172.b:0 "Take this one alive."
 spn_hunt.0172.b.tt:0 "Hands, rope, and a name for the warrant. Witch hunting experience."
 spn_hunt.0172.c:0 "Stand aside and let [spn_defender.GetHerHim] past."
 spn_hunt.0172.c.tt:0 "[spn_defender.GetSheHe] goes, and keeps going, and is not in this county by morning."
 spn_hunt.0172.d:0 "Stop. Go down the stairs and out."
 spn_hunt.0172.d.tt:0 "There is a point at which a house full of them stops being work and starts being how you die, and a man who cannot find that point does not get old.\n\nIf what you came for is still upstairs, this is a withdrawal, and the county will remember that too."

 # ==========================================================
 # THE TEACHING EVENTS -- one rule each, taught by consequence
 # ==========================================================
 spn_hunt.0500.t:0 "The First Body"
 spn_hunt.0500.desc:0 "The girl who does your fires waits until she has finished before she says it, and says it to the grate rather than to you.\n\nA man was found in the lane behind the tannery. Nobody knows him. The priest has been down there twice, and has been asking around after, which he does not usually do.\n\n\"They say there'll be more.\" She stands up and does not look at you on the way out."
 spn_hunt.0500.desc_wolf:0 "The girl who does your fires waits until she has finished before she says it, and says it to the grate rather than to you.\n\nSomething took a man in the lane behind the tannery. Dogs, they are saying. The priest has been down there twice and has been asking around after, which he does not usually do.\n\n\"There's no dogs that size.\" She stands up and does not look at you on the way out."
 spn_hunt.0500.desc_demon:0 "The girl who does your fires waits until she has finished before she says it, and says it to the grate rather than to you.\n\nA man was found in the lane behind the tannery. Whole, and cold, and sitting down. The priest has been there twice. The reeve has started a book, and begun it with a date rather than a name.\n\n\"They say there'll be more.\" She leaves without looking at you."
 spn_hunt.0500.a:0 "Let them count."
 spn_hunt.0500.a.tt:0 "A county keeps a memory of what happens in it, and it keeps it for about five years. Enough of them in one place and its lord is written to."
 spn_hunt.0501.t:0 "Nobody Saw Anything"
 spn_hunt.0501.desc:0 "You walk back through the market on the third day, which is either stupid or exactly right.\n\nThere is no story. A carter fell in the river. A man went to his brother's without saying goodbye, which was very like him. Two women are arguing about a hen.\n\nNothing you did is anywhere in it."
 spn_hunt.0501.a:0 "So it can be done."
 spn_hunt.0501.a.tt:0 "It can. Not always, and not by everybody — how well it goes is mostly what you are, and partly what you are like.\n\nThere are other ways: a purse to the man who would have written it down, or a neighbour of your own kind with a name already worth suspecting."
 spn_hunt.0502.t:0 "The Man Asking Questions"
 spn_hunt.0502.desc:0 "It is the third one that changes things.\n\nOne is weather. Two is a bad month. Three, and there is a man going door to door with a wax tablet, doing it street by street, since before dawn. He is not from the parish.\n\nHe has not asked about you. He has asked about the lane, and the dogs, and who keeps late hours. He is still there at dusk."
 spn_hunt.0502.a:0 "Let him ask."
 spn_hunt.0502.a.tt:0 "Three incidents in one county is when its lord is written to. What he does about it is up to him — and what comes next may not be this man."
 spn_hunt.0502.b:0 "Be somewhere else for a while."
 spn_hunt.0502.b.tt:0 "You are not here. A hunt that comes looking finds a lane and a story and nobody to put in it — and the county's memory of you gets one shorter.\n\nNo feeding for the year."
 spn_hunt.0503.t:0 "What the Old Woman Told You"
 spn_hunt.0503.desc:0 "An old woman catches your sleeve outside the almshouse and does not let go.\n\n\"Eat before you're hungry. That's the first thing. Hungry is when it stops being you deciding.\"\n\nYou have no idea who she is. \"Nobody told you any of it, did they. They never do. They make you and then they're gone.\" She pats your arm twice. \"Sit down. It won't take long.\""
 spn_hunt.0503.desc_wolf:0 "An old woman catches your sleeve outside the almshouse and does not let go.\n\n\"Go out to it. Don't wait for it to come to you in a house with people in it. That's the first thing and it's most of them.\"\n\nYou have no idea who she is. \"Nobody told you any of it, did they. They claw you and then they're gone, and it's you and a lot of dead sheep.\" She pats your arm. \"Sit down.\""
 spn_hunt.0503.a:0 "Sit down."
 spn_hunt.0503.a.tt:0 "It is the first useful hour anybody has given you."
 spn_hunt.0503.b:0 "She is a frightened old woman who has never seen one of you."
 spn_hunt.0503.b.tt:0 "She has, though. That is rather the point of her."

 # ==========================================================
 # WHAT WAS LEFT IN THE HOUSE (spn_hunt.0600-0602)
 # ==========================================================
 spn_hunt.0600.t:0 "What Was Left in the House"
 spn_hunt.0600.desc:0 "You go back for your knife and find the house is not empty.\n\n[spn_hunt_orphan_child.GetTitledFirstName] is under the table and has been there the whole time. No sound then, no sound now. There is nobody else, and nobody in the next house either.\n\nToo young to run. Too young to have been told. [spn_hunt_orphan_child.GetSheHe] looks up at you and waits to find out which sort of man you are."
 spn_hunt.0600.a:0 "Pick the child up."
 spn_hunt.0600.a.tt:0 "Raise [spn_hunt_orphan_child.GetHerHim] yourself. In sixteen years [spn_hunt_orphan_child.GetSheHe] will decide what to be, and what [spn_hunt_orphan_child.GetSheHe] decides will have rather a lot to do with what you turned out to be."
 spn_hunt.0600.b:0 "The child is not your business. Leave [spn_hunt_orphan_child.GetHerHim]."
 spn_hunt.0600.b.tt:0 "[spn_hunt_orphan_child.GetSheHe] survives. Children mostly do.\n\nIn sixteen years [spn_hunt_orphan_child.GetSheHe] will know exactly whose face was in that doorway, and whether you are still alive to be found."
 spn_hunt.0600.c:0 "Finish it."
 spn_hunt.0600.c.tt:0 "It is what the lineage is. It is also a child under a table.\n\nThe county will not thank you and will not forget."
 spn_hunt.0601.t:0 "Sixteen"
 spn_hunt.0601.desc_raised:0 "You were four when [spn_orphan_raiser.GetTitledFirstName] carried you out of that house, and you have known the truth of it since you were old enough to ask.\n\nYou know what your father was. What nobody has ever asked you, in all this time, is which half of that night you intend to be."
 spn_hunt.0601.desc_left:0 "You were four, and you were under a table, and you remember the boots and the doorway and one side of a face.\n\nYou have spent twelve years finding out the rest of it: who he was, what he did for a living, what he called it, and where he is now. It was not difficult. Men like that are proud of the work and the work is written down.\n\nYou are sixteen today. Nobody has celebrated it."
 spn_hunt.0601.a:0 "Take up the trade."
 spn_hunt.0601.a.tt:0 "[spn_orphan_raiser.GetTitledFirstName] made a hunter out of you. It was not certain that [spn_orphan_raiser.GetSheHe] would."
 spn_hunt.0601.b:0 "You are not going to be what he is."
 spn_hunt.0601.b.tt:0 "He raised you and he did not reach you, and there is a great deal of your father in you that he never asked about.\n\nYou leave, and he becomes somebody you have a quarrel with."
 spn_hunt.0601.c:0 "Find out where he is now."
 spn_hunt.0601.c.tt:0 "It has taken twelve years and it was never in doubt."
 spn_hunt.0602.t:0 "Somebody Has Been Asking After You"
 spn_hunt.0602.desc:0 "There is a young one going round the counties asking where you drink, and has been for a month, and has been careful and polite and unhurried about it in a way that people remember afterwards.\n\nYou cannot place the name. You are fairly sure you would remember the face.\n\nThat is the trouble with the work: you remember the ones that fought you, and it is never those ones."
 spn_hunt.0602.a:0 "You always knew one of them would."

 # ==========================================================
 # THE THING IN THE CRADLE (spn_hunt.0610)
 # ==========================================================
 spn_hunt.0610.t:0 "The Thing in the Cradle"
 spn_hunt.0610.desc:0 "The child is in the back room, in a proper cradle, fed and looked after by somebody who is now dead in the yard.\n\nThree years old, maybe. Awake, and not crying. Just lying there waiting for the noise to be over.\n\n[spn_hunt_cradle_child.GetSheHe] is not a demon yet. You have been close enough to one tonight to know the difference. But something in [spn_hunt_cradle_child.GetHerHim] is going to finish on its own in about twenty years, and it will not ask first."
 spn_hunt.0610.a:0 "Drive it out of [spn_hunt_cradle_child.GetHerHim], before there is anything to drive."
 spn_hunt.0610.a.tt:0 "It is easier now than it will ever be again, because there is almost nothing in there to argue with.\n\nWhatever was going to happen in twenty years does not. [spn_hunt_cradle_child.GetSheHe] is an ordinary child with a dead family, which is a thing the world knows what to do with."
 spn_hunt.0610.b:0 "Take [spn_hunt_cradle_child.GetHerHim] home and watch [spn_hunt_cradle_child.GetHerHim]."
 spn_hunt.0610.b.tt:0 "Nothing is removed. Nothing is stopped."
 spn_hunt.0610.b.tt2:0 "In twenty years you will have raised one, and it will be in your court, and it will know exactly who fed it."
 spn_hunt.0610.c:0 "It is not a child."
 spn_hunt.0610.c.tt:0 "It is, though, for another twenty years, and everybody who hears about this will be very clear on that point."
 spn_hunt.0610.d:0 "Close the door behind you."
 spn_hunt.0610.d.tt:0 "Somebody will find [spn_hunt_cradle_child.GetHerHim]. Somebody always does. It will be somebody else's twenty years."


 # ==========================================================
 # 2.35a -- the first boot pass. The kill screen, the conclusion's
 # log lines, and the three outcomes that had no description.
 # ==========================================================
 spn_hunt.0205.t:0 "It Is Done"
 spn_hunt.0205.desc:0 "It is over quicker than you expected.\n\n[spn_defender.GetTitledFirstName] is on the floor and not getting up. The room is very quiet. Your hands are shaking, which they always do afterwards and never do during."
 spn_hunt.0205.desc_vampire:0 "You put the stake where you were taught to put it.\n\n[spn_defender.GetTitledFirstName] does not fall the way a man falls. [spn_defender.GetSheHe] looks at you the whole time, and then stops looking at anything."
 spn_hunt.0205.desc_werewolf:0 "The shape goes out of it while you are still standing over it.\n\nWhat is on the floor now is [spn_defender.GetTitledFirstName], and much smaller than the thing that came at you. The silver did that."
 spn_hunt.0205.desc_hybrid:0 "It came at you as two things and it is dying as neither.\n\n[spn_defender.GetTitledFirstName] is on the floor and the shape keeps starting to change and cannot finish. You wait until it stops trying."
 spn_hunt.0205.desc_demon:0 "The body gives out well before the thing inside it does.\n\n[spn_defender.GetTitledFirstName] stops moving. Something is still in the room for a moment after that, and you stand very still until it is not."
 spn_hunt.0205.a:0 "Finish it."
 spn_hunt.0205.a.tt:0 "The county's books close on this one."
 spn_hunt.0205.b:0 "Take [spn_defender.GetHerHim] alive."
 spn_hunt.0205.b.tt:0 "Rope and a cell instead of a grave. Less for you out of it, and the decision keeps until morning."
 spn_hunt_log_slain:0 "Put down the thing that was preying on the county"
 spn_hunt_log_slain_title:0 "The Kill"
 spn_hunt_log_bounty:0 "Collected the lord's bounty"
 spn_hunt_log_bounty_title:0 "The Bounty"
 spn_hunt_log_fled:0 "It went to ground before you reached it"
 spn_hunt_log_fled_title:0 "Gone to Ground"
 spn_hunt_log_cold:0 "The trail ran out"
 spn_hunt_log_cold_title:0 "A Cold Trail"
 spn_hunt_log_witch:0 "Put a stop to the witchcraft here"
 spn_hunt_log_witch_title:0 "The Witch"
 spn_hunt.0300.desc_exorcised:0 "It is gone, and there is no body to show anyone.\n\nThat will be a problem with the lord and it is not a problem with you. You know what was here and you know it is not here now."
 spn_hunt.0300.desc_withdrew:0 "You came home.\n\nThe trail is still on the county and so is whatever left it. You have a fair idea what people will say about that, and a fairer idea what would have happened if you had stayed."
 spn_hunt.0300.desc_bargained:0 "You are not hunting any more.\n\nYou feel better than you have in twenty years and you cannot look at the paper you signed. There is a date on it. You know roughly when."


 # ==========================================================
 # 2.35a -- the conclusion screen's own text (the activity had
 # no conclusion_description at all), and the age gate.
 # ==========================================================
 spn_hunt_conclusion_slain:0 "Three weeks of asking, one door, and the thing that was taking people out of this county is on a cart under a sheet. The lord will want to see it. Most of them do, once."
 spn_hunt_conclusion_exorcised:0 "It is gone and there is nothing to put on a cart. That will be awkward with the lord and it is not awkward with you: you know what was here, and you know it is not here now."
 spn_hunt_conclusion_proxy:0 "You killed something. You did not kill the thing you came for, and it knows your face now, which is a worse position than the one you rode in with."
 spn_hunt_conclusion_fled:0 "It heard you coming and it went to ground. The trail stays on the county and so does whatever left it. Somebody will be back."
 spn_hunt_conclusion_withdrew:0 "You turned around. The people who tell stories about this trade do not tell many about the men who turned around, which is most of why the trade keeps burying people."
 spn_hunt_conclusion_bargained:0 "You are not hunting any more. You feel better than you have in twenty years, and you cannot look at the paper you signed."
 spn_hunt_conclusion_beaten:0 "You got as far as the door. What was on the other side of it put you on the floor, and let you leave, which you will think about for a while."
 spn_hunt_conclusion_witch:0 "You came to root out witchcraft and you have something to show for it. Whether it was the right somebody is a question for whoever writes this down."
 spn_hunt_conclusion_cold:0 "Nothing. Three weeks, a good deal of your own money, and a county that is very sorry it could not be more help. It happens more often than anybody admits."

 spn_hunter_too_young_custom:0 "Must be at least #high 13#! years old"

 # 2.35a -- the two gates that were missing entirely. See 10_spn_confer_interactions.txt.
 spn_already_in_hunter_training_custom:0 "Is already partway through training"
 spn_refused_hunter_training_custom:0 "Turned this down within the last #high 5#! years"
