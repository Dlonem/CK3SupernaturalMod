l_english:
 # Supernatural 2.42 -- Blood for Blood (zz_spn_242_kin_*.txt).
 spn_bfb.0100.t:0 "One of Ours"
 spn_bfb.0100.desc:0 "[spn_bfb_dead.GetFirstName] is dead. Not sickness, and not age. Someone who knew what [spn_bfb_dead.GetSheHe] was went looking for [spn_bfb_dead.GetHerHim], and found [spn_bfb_dead.GetHerHim], and was good at it.\n\nNobody can tell me who. People who do that work do not leave their names."
 spn_bfb.0100.desc_two:0 "[spn_bfb_dead.GetFirstName] is dead, and not by sickness or age. It is the second of mine to go this way.\n\nOnce is a hunter passing through. Twice is someone who has our names."
 spn_bfb.0100.desc_three:0 "[spn_bfb_dead.GetFirstName] is dead. That is three now, the same way each time, clean and practised.\n\nThis is not bad luck. Someone is working down a list, and I am on it."
 spn_bfb.0100.known:0 "I already know whose hand it was."
 spn_bfb.0100.known.tt:0 "You know the hunter's name. You can answer [spn_bfb_slayer.GetHerHim] with Blood for Blood."
 spn_bfb.0100.a:0 "Find who did this."
 spn_bfb.0100.a.tt:0 "You begin asking after the one who did it"
 spn_bfb.0100.b:0 "Whoever it was will wish it had been anyone else's kin."
 spn_bfb.0100.c:0 "I will grieve. That is all I can do tonight."
 spn_bfb.0100.d:0 "The dead are at rest. I will not send more after them."
 spn_bfb.0110.t:0 "The Asking"
 spn_bfb.0110.desc:0 "A killing like [spn_bfb_dead.GetFirstNamePossessive] leaves little behind, but not nothing. Someone lent a horse. Someone sold silver and did not ask why. Someone was thanked by the lord of the place and rode on.\n\nThere are a few ways to pull on that thread, and none of them is certain."
 spn_bfb.0110.a:0 "My spymaster has people in that country. Let them earn their keep."
 spn_bfb.0110.b:0 "Someone there saw it. They will tell me, whether they mean to or not."
 spn_bfb.0110.b.tt:0 "You will learn the hunter's name"
 spn_bfb.0110.c:0 "I will go and ask myself."
 spn_bfb.0110.d:0 "Enough. Knowing would change nothing."
 spn_bfb_name_found_toast:0 "You Have a Name"
 spn_bfb_name_not_found_toast:0 "Nothing This Year"
 spn_bfb.0200.t:0 "Someone Has Come for You"
 spn_bfb.0200.desc:0 "I have done this work long enough to know when I am the one being followed. [spn_bfb_avenger.GetFirstName] did not try to hide it. [spn_bfb_avenger.GetSheHe|U] wanted me to know.\n\n[spn_bfb_avenger.GetSheHe|U] stands in the road now, alone, and says a name. I remember it. I remember all of them. "That one was mine," [spn_bfb_avenger.GetSheHe] says."
 spn_bfb.0200.a:0 "Then let it be settled here."
 spn_bfb.0200.b:0 "A life has a price. I will pay it, and we are done."
 spn_bfb.0200.b.tt:0 "[spn_bfb_avenger.GetShortUIName] takes the blood price and lets it lie"
 spn_blood_for_blood_interaction:0 "Blood for Blood"
 spn_blood_for_blood_interaction_desc:0 "[recipient.GetShortUIName] killed one of yours. You know [recipient.GetHerHis] name now. Decide what it costs [recipient.GetHerHim]."
 spn_bfb_heading:0 "How it is answered"
 SPN_BFB_FACE:0 "Face [recipient.GetHerHim]"
 SPN_BFB_RUIN:0 "Ruin [recipient.GetHerHim] slowly"
 SPN_BFB_LIE:0 "Let it lie"
 spn_bfb_face_tt:0 "[recipient.GetShortUIName] will be found, and may fight you or offer the blood price"
 spn_bfb_lie_tt:0 "You strike [recipient.GetHerHis] name out. This cannot be taken back."
 spn_hunted_modifier:0 "Hunted"
 spn_hunted_modifier_desc:0 "This hunter has killed too many of one family. They know it, and they are not the only ones looking."
 spn_bfb_fury_modifier:0 "Three Graves"
 spn_bfb_fury_modifier_desc:0 "Three of this character's own are dead by the same hand."
 spn_bfb_vendetta_modifier:0 "A Slow Answer"
 spn_bfb_vendetta_modifier_desc:0 "This character has chosen to take a hunter apart piece by piece."
 # The hunter death reasons, when the killer is known to the reader
 spn_death_beheaded_as_hybrid_killer:0 "had [CHARACTER.GetHerHis] head severed from [CHARACTER.GetHerHis] body"
 spn_death_silver_arrow_by_hunter_as_werewolf_killer:0 "had a silver arrow embedded in [CHARACTER.GetHerHis] chest"
 spn_death_killed_by_hunter_killer:0 "was hunted down and killed"
 # 2.42 review (20 Nov 2026)
 spn_bfb.0200.b.offer.tt:0 "[spn_bfb_avenger.GetShortUIName] is offered the blood price, and may refuse it"
 spn_bfb.0200.c:0 "I bar the door and let [spn_bfb_avenger.GetHerHim] shout. Nobody dies today."
 spn_bfb.0200.c.tt:0 "You do not come out. [spn_bfb_avenger.GetShortUIName] still has your name."
 spn_bfb.0220.t:0 "The Blood Price"
 spn_bfb.0220.desc:0 "[spn_bfb_slayer.GetFirstName] does not reach for a weapon. [spn_bfb_slayer.GetSheHe|U] sets a purse down in the road between us and steps back from it.\n\n"For the one who was yours," [spn_bfb_slayer.GetSheHe] says. "It is what a life is held to be worth, and it is all here. Take it, and let this end.""
 spn_bfb.0220.a:0 "I take it. It is not forgiveness. It is finished."
 spn_bfb.0220.a.tt:0 "You take the blood price and strike [spn_bfb_slayer.GetHerHis] name out"
 spn_bfb.0220.b:0 "Pick it up. I did not come here for gold."
 spn_bfb.0220.c:0 "Keep it. And keep looking over your shoulder."
 spn_bfb_refused_toast:0 "They Would Not Come Out"
 spn_bfb_duel_won_toast:0 "It Is Settled"
 spn_bfb_duel_off_toast:0 "The Meeting Did Not Happen"
 spn_bfb_hunted_toast:0 "You Are Being Hunted"
 spn_death_killed_as_culprit:0 "was killed by a hunter"
 spn_death_killed_as_culprit_killer:0 "was killed by [TARGET_CHARACTER.GetUIName], who took [CHARACTER.GetHerHim] for a monster"
