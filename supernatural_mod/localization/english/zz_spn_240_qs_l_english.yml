l_english:
 # Supernatural 2.40 boot 2 -- package QS, the Sire Bond (Thomas's report item h). Boot 3: the bond forms by itself and
 # lasts; new favours; the verbs shared with the golem puppet.

 # The puppet type
 spn_sire_puppet:0 "Sire Bond"
 spn_sire_puppet_desc:0 "Your [pprogeny|E], bound to you by your blood and by love. They act for you as your [puppet|E], and nothing you ask wears on them. The bond lasts until one of you dies or stops being a [vampire|E] or [hybrid|E], or you let them go."
 spn_sire_puppet_concept_desc:0 "A [hybrid|E], or a [vampire|E] who has learned Vampire's Kiss, holds the Sire Bond over a [pprogeny|E] who loves them: someone they turned who became their lover or soulmate. It forms by itself, and it lasts even if the love does not.\n\nThe bound one is your [puppet|E]. Right-click someone and act as them for the bond's own favors, the deeds a golem would do, or, if they hold land, a ruler's own justice. Right-click yourself to have them send you gold, or open their card to call them to you. Nothing you ask wears on them, but a favor done carelessly can leave a hole in a county's memory, and enough of those set its lord looking for a [spn_menace|E]."

 # Sense the Sire Bond (the type's own interaction)
 spn_sire_bond_interaction:0 "Sense the Sire Bond"
 spn_sire_bond_interaction_desc:0 "Your blood made [recipient.GetShortUIName] what [recipient.GetSheHe] is, and [recipient.GetSheHe] loves you, or once did. Take [recipient.GetHerHim] up through the Sire Bond as your [puppet|E]: you can then act as [recipient.GetHerHim], and ask favors of your own.\n\nThe bond lasts until one of you dies, stops being a vampire, or you let [recipient.GetHerHim] go."
 spn_sire_bond_interaction_tt:0 "[recipient.GetShortUIName] becomes your Sire Bond [puppet|E]."
 spn_sire_bond_replaces_tt:0 "Your current Sire Bond [puppet|E] steps aside; the bond with them stays, and you can sense it again."
 spn_sire_bond_player_tt:0 "[recipient.GetShortUIName] is not played by a person"
 spn_sire_bond_still_vampire_tt:0 "[recipient.GetShortUIName] is still a vampire"
 spn_sire_bond_perk_effect:0 "A [vampire|E] needs this to hold the Sire Bond over someone they turned who loves them"

 # The bond forms
 spn_sire.0002.t:0 "The Sire Bond"
 spn_sire.0002.desc:0 "It is in the way [spn_sire_bond_puppet.GetShortUIName] watches the door when you are out of the room, and the way [spn_sire_bond_puppet.GetSheHe] stops talking when you start. Your blood made [spn_sire_bond_puppet.GetHerHim] what [spn_sire_bond_puppet.GetSheHe] is, and [spn_sire_bond_puppet.GetSheHe] loves you. Between the two, something has taken hold.\n\nWhatever you ask of [spn_sire_bond_puppet.GetHerHim] now, [spn_sire_bond_puppet.GetSheHe] will do. If the love ever fades, the bond will not."
 spn_sire.0002.desc_soulmate:0 "[spn_sire_bond_puppet.GetShortUIName] has never needed you to finish a sentence. Your blood made [spn_sire_bond_puppet.GetHerHim] what [spn_sire_bond_puppet.GetSheHe] is, and [spn_sire_bond_puppet.GetSheHe] is your soulmate. Between the two, something has taken hold.\n\nWhatever you ask of [spn_sire_bond_puppet.GetHerHim] now, [spn_sire_bond_puppet.GetSheHe] will do. If the love ever fades, the bond will not."
 spn_sire.0002.a:0 "Then [spn_sire_bond_puppet.GetSheHe] is mine."
 spn_sire.0002.a.tt:0 "[spn_sire_bond_puppet.GetShortUIName] is now your Sire Bond [puppet|E]."
 spn_sire.0002.b.tt:0 "The bond holds [spn_sire_bond_puppet.GetShortUIName]. You already act through someone else; use Sense the Sire Bond on [spn_sire_bond_puppet.GetHerHim] to take [spn_sire_bond_puppet.GetHerHim] up instead."
 spn_sire.0002.c:0 "I will not hold [spn_sire_bond_puppet.GetHerHim] like that."
 spn_sire.0002.c.tt:0 "You let the bond go. It will not take hold again by itself; while [spn_sire_bond_puppet.GetSheHe] still loves you, Sense the Sire Bond can bring it back."

 # The romance ends, the bond holds
 spn_sire.0001.t:0 "The Bond Holds"
 spn_sire.0001.tt:0 "[spn_sire_bond_puppet.GetShortUIName] no longer loves you as [spn_sire_bond_puppet.GetSheHe] did. Your blood still holds [spn_sire_bond_puppet.GetHerHim]."

 # Favors
 spn_sire_bond_cooldown_tt:0 "You have not leaned on the bond for this favor too recently"
 spn_sire_bond_reach_tt:0 "[puppet_or_actor.GetShortUIName] can reach [recipient.GetHerHim]: the same court, family, a spouse, a vassal or liege, or the same place"
 puppet_action_description_puppet_action_spn_sire_speak:0 "Have your sire-bound lover speak well of you to someone close to them"
 puppet_action_description_puppet_action_spn_sire_secrets:0 "Have your sire-bound lover draw a secret out of someone who trusts them"
 puppet_action_description_puppet_action_spn_sire_cover:0 "Have your sire-bound lover talk a lord out of one mark of your trail in the county they stand in"
 puppet_action_description_puppet_action_spn_puppet_seduce:0 "Have your puppet seduce someone, or you"
 puppet_action_description_puppet_action_spn_puppet_court:0 "Have your puppet romance someone, or you"
 puppet_action_description_puppet_action_spn_puppet_befriend:0 "Have your puppet keep someone company until they become friends"
 spn_puppet_befriend_interaction:0 "Keep Them Company"
 spn_puppet_befriend_interaction_desc:0 "Your puppet spends time with [recipient.GetShortUIName]. The first time, they may take a liking to each other; the next time, they become friends."
 spn_puppet_befriend_already_tt:0 "Your puppet and [recipient.GetShortUIName] are not already friends"
 spn_friend_puppet_company:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] kept each other company."
 puppet_action_description_puppet_action_spn_sire_blood:0 "Have your sire-bound lover give someone vampire blood"
 puppet_action_description_puppet_action_spn_puppet_murder:0 "Have your puppet plot someone's murder"
 puppet_action_description_puppet_action_spn_puppet_give_artifact:0 "Have your puppet give one of the items it carries to someone"

 spn_sire_bond_speak_interaction:0 "Speak for Me"
 spn_sire_bond_speak_interaction_desc:0 "Your sire-bound lover speaks well of you to [recipient.GetShortUIName], who will think better of you for some years.\n\nDone carelessly, it can leave a hole in the county's memory."
 spn_sire_bond_speak_already_tt:0 "[recipient.GetShortUIName] has not already been spoken to on your behalf"
 spn_sire_bond_speak_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] has spoken for you."

 spn_sire_bond_secrets_interaction:0 "Draw Out Their Secrets"
 spn_sire_bond_secrets_interaction_desc:0 "Your sire-bound lover will try to draw something out of [recipient.GetShortUIName], who must trust them, and bring it to you.\n\nIf it goes badly, [recipient.GetShortUIName] will trust your lover less. Done carelessly, it can leave a hole in the county's memory."
 spn_sire_bond_trust_tt:0 "[recipient.GetShortUIName] trusts your sire-bound lover (a good opinion of them, a friend, a spouse or close family)"
 spn_sire_bond_secrets_effect_tt:0 "Your sire-bound lover may learn one of [recipient.GetShortUINamePossessive] secrets for you"
 spn_sire_bond_secrets_found_tt:0 "[spn_sire_bond_puppet.GetShortUIName] has brought you something [recipient.GetShortUIName] would rather no one knew."
 spn_sire_bond_secrets_none_tt:0 "[recipient.GetShortUIName] talked freely, but had nothing to tell that you did not already know."
 spn_sire_bond_secrets_failed_tt:0 "[recipient.GetShortUIName] noticed the questions and said nothing. [recipient.GetSheHe|U] trusts [spn_sire_bond_puppet.GetShortUIName] less now."

 spn_sire_bond_cover_interaction:0 "Cover My Tracks"
 spn_sire_bond_cover_interaction_desc:0 "Your sire-bound lover stands in [recipient.GetShortUINamePossessive] county. If the county carries a trail that leads to you, your lover will try to talk [recipient.GetHerHim] into putting one mark of it down to something else.\n\nIf it goes badly, [recipient.GetShortUIName] will trust your lover less. Done carelessly, it can leave a hole in the county's memory."
 spn_sire_bond_cover_player_tt:0 "[recipient.GetShortUIName] is not played by a person"
 spn_sire_bond_cover_no_trail_tt:0 "The county your sire-bound lover is in carries a trail"
 spn_sire_bond_cover_effect_tt:0 "If the trail leads to you, your sire-bound lover may talk [recipient.GetShortUIName] out of one mark of it"
 spn_sire_bond_cover_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] gave [recipient.GetShortUIName] a better story than the truth. The trail in the county is one mark fainter."
 spn_sire_bond_cover_failed_tt:0 "[recipient.GetShortUIName] listened, and did not believe a word. The trail stays as it was, and [recipient.GetSheHe] trusts [spn_sire_bond_puppet.GetShortUIName] less now."
 spn_sire_bond_cover_not_yours_tt:0 "[spn_sire_bond_puppet.GetShortUIName] listened to what the county says, and none of it leads to you. There was nothing to explain away."

 spn_puppet_seduce_interaction:0 "Seduce"
 spn_puppet_seduce_interaction_desc:0 "Your puppet sets out to seduce [recipient.GetShortUIName], as a seduction scheme of its own. You are told how it ends."
 spn_puppet_court_interaction:0 "Romance"
 spn_puppet_court_interaction_desc:0 "Your puppet sets out to win [recipient.GetShortUIName]'s heart, as a romance scheme of its own. You are told how it ends."

 spn_sire_blood_interaction:0 "Give Them Your Blood"
 spn_sire_blood_interaction_desc:0 "Your sire-bound lover gives [recipient.GetShortUIName] vampire blood. It heals [recipient.GetHerHim] now. If [recipient.GetSheHe] dies with it still in [recipient.GetHerHim], or asks to be turned, [recipient.GetSheHe] rises a vampire, and your lover is [recipient.GetHerHis] [mmaker|E].\n\n[recipient.GetShortUIName] must trust your lover. Done carelessly, it can leave a hole in the county's memory."
 spn_sire_blood_has_some_tt:0 "[recipient.GetShortUIName] does not already have vampire blood in [recipient.GetHerHim]"
 spn_sire_blood_will_not_take_tt:0 "Vampire blood would take in [recipient.GetShortUIName]"
 spn_sire_blood_done_tt:0 "[spn_sire_bond_puppet.GetShortUIName] has given [recipient.GetShortUIName] [spn_sire_bond_puppet.GetHerHis] blood."

 # Shared with the golem puppet
 spn_puppet_murder_interaction:0 "Order a Murder"
 spn_puppet_murder_interaction_desc:0 "Your puppet plots the death of [recipient.GetShortUIName] as a murder scheme of its own, with its own agents. You are told how it ends.\n\nIf it is found out, the murder is your puppet's, and through it, yours."
 spn_puppet_give_artifact_interaction:0 "Hand It Over"
 spn_puppet_give_artifact_interaction_desc:0 "Your puppet gives [recipient.GetShortUIName] one of the items it carries. You choose which."
 spn_puppet_give_artifact_tt:0 "You choose one of your puppet's items, and it goes to [recipient.GetShortUIName]"
 spn_puppet_carries_nothing_tt:0 "Your puppet carries an item it can give [recipient.GetShortUIName] (not worn, and not one that cannot change hands)"
 spn_puppet.0001.t:0 "Hand It Over"
 spn_puppet.0001.desc:0 "[spn_pa_puppet.GetShortUIName] waits, and lays out what [spn_pa_puppet.GetSheHe] carries. Which of it goes to [spn_pa_target.GetShortUIName]?"
 spn_puppet.0001.a:0 "[spn_pa_item_1.GetNameNoTooltip]."
 spn_puppet.0001.b:0 "[spn_pa_item_2.GetNameNoTooltip]."
 spn_puppet.0001.c:0 "[spn_pa_item_3.GetNameNoTooltip]."
 spn_puppet.0001.d:0 "None of it, after all."
 spn_puppet.0001.d.tt:0 "Everything stays where it is."
 spn_puppet_gift_msg:0 "A Gift Is Handed Over"
 spn_puppet_gift_msg_tt:0 "[spn_pa_puppet.GetShortUIName] has given you [spn_pa_item.GetNameNoTooltip]."

 # Seduce Me and Release the Sire Bond (on the puppet card)
 spn_sire_seduce_me_decision:0 "Seduce Me"
 spn_sire_seduce_me_decision_desc:0 "Ask your sire-bound lover to come to you."
 spn_sire_seduce_me_decision_tooltip:0 "If you are still lovers, they come to you, and your stress eases. If the romance has ended, they set out to seduce you again. Once a year."
 spn_sire_seduce_me_decision_confirm:0 "Come to me"
 spn_sire_seduce_me_lovers_tt:0 "Your sire-bound lover comes to you tonight"
 spn_sire_seduce_me_scheme_tt:0 "Your sire-bound lover starts a seduction scheme against you"
 spn_sire_release_decision:0 "Release the Sire Bond"
 spn_sire_release_decision_desc:0 "Let your sire-bound lover go."
 spn_sire_release_decision_tooltip:0 "They stop being your Sire Bond [puppet|E], and the bond does not take hold again by itself. While they still love you, Sense the Sire Bond can bring it back."
 spn_sire_release_decision_confirm:0 "Go"
 spn_sire_release_tt:0 "The Sire Bond is released"
 spn_sire_release_toast_tt:0 "[spn_sire_bond_puppet.GetShortUIName] is free of the Sire Bond."

 # Opinions (boot 4: the strain opinion is no longer given; kept for running saves)
 spn_sire_bond_strain_opinion:0 "Leaned On Through the Sire Bond"
 spn_sire_bond_good_word_opinion:0 "Heard Good Things"

