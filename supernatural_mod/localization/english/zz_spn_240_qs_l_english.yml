 set_relation_mmaker_global_past:0 "$set_relation_mmaker_third_past$"
 set_relation_pprogeny_first:0 "You gain [pprogeny|E], someone your blood turned"
 set_relation_pprogeny_third:0 "Gains [pprogeny|E], someone their blood turned"
 set_relation_pprogeny_global:0 "$set_relation_pprogeny_third$"
 set_relation_pprogeny_first_past:0 "You gained [pprogeny|E], someone your blood turned"
 set_relation_pprogeny_third_past:0 "Gained [pprogeny|E], someone their blood turned"
 set_relation_pprogeny_global_past:0 "$set_relation_pprogeny_third_past$"

 # Boot 4: Send Me Your Gold (shared by every puppet type)
 spn_puppet_send_gold_interaction:0 "Send Me Your Gold"
 spn_puppet_send_gold_interaction_desc:0 "[puppet_or_actor.GetShortUIName] sends you gold from [puppet_or_actor.GetHerHis] own purse. Choose how much."
 puppet_action_description_puppet_action_spn_puppet_send_gold:0 "Have your puppet send you gold from its own purse"
 spn_puppet_no_gold_tt:0 "[puppet_or_actor.GetShortUIName] has gold to send"
 spn_puppet_send_gold_100:0 "100 gold"
 spn_puppet_send_gold_500:0 "500 gold"
 spn_puppet_send_gold_1000:0 "1,000 gold"
 spn_puppet_send_gold_all:0 "All of it"

 # Boot 4: the deeds any puppet may do (zz_spn_240_puppet_verb_triggers.txt)
 spn_puppet_busy_tt:0 "[puppet_or_actor.GetShortUIName] is not away searching or on another errand"
 spn_puppet_deed_reach_tt:0 "[puppet_or_actor.GetShortUIName] can reach [recipient.GetHerHim]: [recipient.GetSheHe] is where [puppet_or_actor.GetSheHe] is, lives in your realm or [puppet_or_actor.GetHerHis], or is of [puppet_or_actor.GetHerHis] court or family"
