 # 10_spn_confer_interactions.txt Turn Into Vampire). The engine's effect-tooltip keys for the maker relation pair
 # (the _global/_third/_first forms and their _past, as vanilla writes them for set_house_relation,
 # effects/house_relation_effects_l_english.yml).
 set_relation_mmaker_first:0 "You gain a [mmaker|E], the one whose blood turned you"
