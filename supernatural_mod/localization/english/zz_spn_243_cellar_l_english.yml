l_english:
 # Supernatural 2.43 -- The Man From the Cellar (spn_cellar.0001, .0002)
 spn_cellar.0001.t:0 "The Man From the Cellar"
 spn_cellar.0001.desc:0 "A man is waiting in the hall, and nobody can say how he got in. He is thin and very pale, and he has the look of someone who has walked a long way at night.\n\n\"You will not remember me,\" he says. \"A wine cellar, a few years ago. I was bleeding, and someone gave me something to drink. Then I died, and I woke up in the ground.\" He looks at you the way a lost man looks at the only lit window in the street. \"I have followed the taste of it ever since. It led me here.\"\n\n[Glossary('#spn_thirst Noster.#!','spn_gloss_thirst_noster')]"
 spn_cellar.0001.a:0 "Stay. I will teach you what you are."
 spn_cellar.0001.a.tt:0 "[spn_cellar_man.GetFirstName] joins your court."
 spn_cellar.0001.b:0 "I did this to you. I am sorry."
 spn_cellar.0001.c:0 "It was a kindness. Go."
 spn_cellar.0001.d:0 "Be grateful you woke at all."
 spn_cellar.0002.t:0 "Where to Stop"
 spn_cellar.0002.desc:0 "[spn_cellar_man.GetFirstName] no longer flinches at the windows. Tonight he comes to you with blood on his cuff and a question he has clearly been rehearsing.\n\n\"How do you stop?\" he asks. \"Before it is too late for them. I have tried. I cannot find the place.\"\n\n[Glossary('#spn_thirst Nusquam.#!','spn_gloss_thirst_nusquam')]"
 spn_cellar.0002.a:0 "Slowly. I will show you."
 spn_cellar.0002.b:0 "You stop when they do."
 spn_cellar.0002.c:0 "Learn it the way I did. Alone."
