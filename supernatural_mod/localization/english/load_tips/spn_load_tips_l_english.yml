 # Supernatural mod loading-screen tips. Vanilla uses LOADING_TIP_0..150 (CK3 1.20; it was 0..142
 # before), so we start at 151 and run contiguously (no gap, no key collision).
 # Each tip just points at a game-concept's name + description.
 LOADING_TIP_151:0 "#T $game_concept_vampire$#!\n\n$game_concept_vampire_desc$"
 LOADING_TIP_152:0 "#T $game_concept_werewolf$#!\n\n$game_concept_werewolf_desc$"
 LOADING_TIP_153:0 "#T $game_concept_hybrid$#!\n\n$game_concept_hybrid_desc$"
 LOADING_TIP_154:0 "#T $game_concept_spn_hunter$#!\n\n$game_concept_spn_hunter_desc$"
 LOADING_TIP_155:0 "#T $game_concept_vampire_feeding$#!\n\n$game_concept_vampire_feeding_desc$"
 LOADING_TIP_156:0 "#T $game_concept_feeding_success_chance$#!\n\n$game_concept_feeding_success_chance_desc$"
 LOADING_TIP_157:0 "#T $game_concept_mmaker$#!\n\n$game_concept_mmaker_desc$"
