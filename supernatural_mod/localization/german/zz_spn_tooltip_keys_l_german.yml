l_german:

# Supernatural -- TOOLTIP KEYS THAT HAD NO LOCALISATION.
#
# CK3 resolves `custom_description = { text = X }` by looking X up as a LOCALISATION KEY.
# common/trigger_localization is a DIFFERENT system: it supplies text when a scripted trigger is
# rendered into an auto-generated tooltip. The magic half of this mod wires its custom_description
# keys through trigger_localization only, with the actual string stored under an UPPERCASE name --
# so every one of them printed "<key> has no localization" in a live tooltip. 113 of them.
#
# Each line below points the lowercase key at the uppercase string that was already written. That is
# vanilla's own idiom (game/localization/english/achievements_l_english.yml:288). The text stays in
# one place, and every language picks up its own translation of it automatically.
#
# Regenerate with mod/_tools/spntooltips.py after any Supernatural or witchcraft-mod update.

