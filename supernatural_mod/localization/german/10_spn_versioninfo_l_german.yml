 spn_versioninfo.1000.t:0 "Supernatural: Version 2.43 Info"

 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.43#!\nFor CK3 1.21. Silk & Silver is not required. To support the mod, search #high \"Dlonem\"#! on YouTube\nand subscribe. Questions about the mod? Read the wiki:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.43: The Voice in the Blood#!\n$BULLET_WITH_TAB$A hunter with a warm trail in reach goes after it, and the Hunt is free.\n$BULLET_WITH_TAB$A lord's Trailsman can ride out after a trail.\n$BULLET_WITH_TAB$Vampire, werewolf and hybrid merchants start ahead in trade.\n$BULLET_WITH_TAB$Eight new yearly moments for werewolves.\n$BULLET_WITH_TAB$Now and then the thirst speaks Latin and the wolf Old Norse. Hover for the meaning.\n$BULLET_WITH_TAB$The strongest lone wolf can found a pack.\n$BULLET_WITH_TAB$A man you save with your blood may come looking for you.\n$BULLET_WITH_TAB$Shorter options in the 2.42 events; romance moments a little rarer.\n$BULLET_WITH_TAB$All-new loading screens in the vanilla art style.\n$BULLET_WITH_TAB$Fixes from a long co-op session."

