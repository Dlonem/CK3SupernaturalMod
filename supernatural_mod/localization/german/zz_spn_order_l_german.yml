 game_concept_spn_order:0 "Order of the Blue Rose"
 game_concept_spn_order_desc:0 "The Hermetic Order of the Blue Rose: a secret society of Mages, older than any kingdom, organized in temples (chapters) under a [spn_temple_magus|E]. Its members find each other by a blue rose, wear masks to their rites, and keep three words: Silence, Subservience, Observance.\n\nThe Order chooses its own: every year each temple sends a note and a rose to a few people with the gift. Members rise through the [spn_order_ranks|E], pledge relics to the temple's [spn_reliquary|E], and serve the Order's [spn_order_prerogative|E]."
 game_concept_spn_order_chapter:0 "Chapter"
 game_concept_spn_order_chapter_desc:0 "One temple of the [spn_order|E], led by its [spn_temple_magus|E]. A chapter holds between thirty and sixty members, grows over the years, and keeps a [spn_reliquary|E]. You can see yours in your Situations."
 game_concept_spn_temple_magus:0 "Temple Magus"
 game_concept_spn_temple_magus_desc:0 "The head of a chapter of the [spn_order|E]. The Temple Magus raises members in rank, keeps the temple's way, and judges those who break its rules."
 game_concept_spn_order_ranks:0 "Ranks of the Order"
 game_concept_spn_order_ranks_desc:0 "Neophyte (being tested), Acolyte (being taught), Medicum, Magistratus, [spn_temple_magus|E], a seat on the [spn_gnostic_council|E], and at the top the Grand Magus, who leads the whole Order. The [spn_order_adepti|E] are Magistrati who work outside their temples.\n\nEvery year the Order teaches each of its Mages a little: one point on one of the four Mage paths, drawn at random. The temple's way makes its own path twice as likely: Alchemy for Silence, Combat Magic for Subservience, Secret Knowledge for Observance."
 game_concept_spn_order_standing:0 "Standing"
 game_concept_spn_order_standing_desc:0 "How the [spn_order|E] values you, from 0 to 100. It grows every year you belong, and with deeds that serve the [spn_order_prerogative|E]. At 25 an Acolyte can be raised to Medicum; at 50 a Medicum to Magistratus."
 game_concept_spn_gnostic_council:0 "Gnostic Council"
 game_concept_spn_gnostic_council_desc:0 "The council of the [spn_order|E]: the Grand Magus in the chair, the Keeper of the Reliquary, the Adeptus Major and the Chancellor. Only members of the Order sit on it. The temples choose the Grand Magus at a [spn_conclave|E], and the seats are filled there too."
 game_concept_spn_reliquary:0 "Reliquary"
 game_concept_spn_reliquary_desc:0 "The magical items a chapter's or coven's members have pledged. The more it holds, the stronger every member is. A pledged item still belongs to its owner, and cannot be taken in a siege or a raid; a war, a thief or a demon can still take it."
 game_concept_spn_relic:0 "Relic"
 game_concept_spn_relic_desc:0 "A lesser magical item: the Glove, the Necrophone, the Enchanted Blade, the Echo Pendant, Obfuscation Powder, the Mirror Shard and the Bell of the Dead Hour. Each does one thing. The [spn_seal_of_solomon|E] is the greatest of them."
 game_concept_spn_coven_panel:0 "Coven"
 game_concept_spn_coven_panel_desc:0 "A house whose witches know each other for what they are. A coven keeps a [spn_reliquary|E], and you can see yours in your Situations."
 game_concept_spn_zecchia:0 "Zecchia"
 game_concept_spn_zecchia_desc:0 "A minor demon who steals for a fee. Summon her, tell her whose house to rob, and she brings back what she takes. She will not go near the [spn_seal_of_solomon|E]."
 game_concept_spn_vade_maecum:0 "Vade Maecum Infernal"
 game_concept_spn_vade_maecum_desc:0 "A demon's handbook, torn into four pages long ago. Put back together, it can be bound with a [spn_vade_contract|E]: power without price, for a terrible one. The souls of those who failed are still inside it."
 game_concept_spn_vade_contract:0 "Contract"
 game_concept_spn_vade_contract_desc:0 "The bargain of the [spn_vade_maecum|E]. Within three years, name a witness, give a finger, and pay the last price: your first son by blood. Pay, and you are bound to the book for life. Fail, and it takes you."
 game_concept_spn_vade_bound:0 "Bound to the Book"
 game_concept_spn_vade_bound_desc:0 "One who paid the [spn_vade_contract|E]. Magic costs them nothing, demons obey them, and they are very hard to kill. A hunter needs the Enchanted Blade; the [spn_gnostic_council|E] can unmake them; a champion of the six hides can kill them."
 game_concept_spn_respondeo:0 "Respondeo"
 game_concept_spn_respondeo_desc:0 "The [spn_order|E]'s spell of forgetting. A whole county forgets what it saw, and a hunter's trail there goes cold. It costs a great deal of power, or a chapter's."
 game_concept_spn_pulveris_memoria:0 "Pulveris Memoria"
 game_concept_spn_pulveris_memoria_desc:0 "The dust of memory. What the [spn_order|E] does to anyone who fails its tests or leaves it: they forget the Order, and a member who leaves loses the magic he was taught."
 game_concept_spn_order_ladder:0 "The Ladder"
 game_concept_spn_order_ladder_desc:0 "The road from Neophyte to Grand Magus. See [spn_order_ranks|E]."
 game_concept_spn_order_prerogative:0 "Prerogative"
 game_concept_spn_order_prerogative_desc:0 "What the [spn_order|E] is working toward for the next ten years, set by its master: Recover What Was Lost, Silence, The Book Must Be Found, More Hands, or Treat with the Pit. Members gain [spn_order_standing|E] for deeds that serve it."
 game_concept_spn_order_old_law:0 "The Old Law"
 game_concept_spn_order_old_law_desc:0 "The [spn_order|E] does not take necromancers, and a member who becomes one is judged. It has been the law since two sisters nearly ended the Order."
 game_concept_spn_order_rule_one:0 "Rule One"
 game_concept_spn_order_rule_one_desc:0 "With demons, don't. A member who summons a demon or makes a [spn_order_compact|E] loses [spn_order_standing|E], unless the Order is treating with the Pit."
 game_concept_spn_order_compact:0 "Compact"
 game_concept_spn_order_compact_desc:0 "A deal between a demon and the [spn_order|E]. For twenty years the demon may borrow from the Order's [spn_reliquary|E], and owes a favor for each loan."
 game_concept_spn_order_transference:0 "Elemental Transference"
 game_concept_spn_order_transference_desc:0 ""Ex tenebris lux": from the darkness, into the light. A ritual of the [spn_order|E] that moves a deadly illness out of one person into five volunteers, a fifth each. If any of the five is killed before five years pass, the illness goes back."
 game_concept_spn_order_fors_factorum:0 "Fors Factorum"
 game_concept_spn_order_fors_factorum_desc:0 "The [spn_order|E]'s most secret spell. Magic costs you nothing, but the price comes later, as a cancer, again and again."
 game_concept_spn_order_adepti:0 "Adepti"
 game_concept_spn_order_adepti_desc:0 "Magistrati of the [spn_order|E] who work outside their temples, under the Adeptus Major. An Adeptus may borrow from any temple whose members he knows."
 game_concept_spn_seal_of_solomon:0 "Seal of Solomon"
 game_concept_spn_seal_of_solomon_desc:0 "The ring of the king who bound demons. It starts in a shrine. Whoever wears it cannot be magically dominated, demons fear it, and the [spn_order|E] wants it."
 spn_hud_pack_tt:0 "Your Pack\nOpens your Situations, where your pack is listed."
 spn_hud_order_tt:0 "Your Chapter of the Order\nOpens your Situations, where your chapter is listed."
 spn_hud_coven_tt:0 "Your Coven\nOpens your Situations, where your coven is listed."
 spn_hide.0103.desc_page:0 "\n\nThere is a weight in the hide that is not yours. It was here before you."
 spn_hunt.0171.temple:0 "They answer to a temple"
 spn_hunt.0171.temple.tt:0 "Go through the members of [spn_culprit.GetHerHis] temple, one door at a time."
 spn_hunt_sc_bound:0 "Bound to the book"
 spn_vade_free_tt:0 "Costs you nothing."
 spn_ev4.82.pages:0 "Seek the pages of the book"
 spn_order_toast_prerogative_recover:0 "The Order's Prerogative: Recover What Was Lost"
 spn_order_toast_prerogative_silence:0 "The Order's Prerogative: Silence"
 spn_order_toast_prerogative_book:0 "The Order's Prerogative: The Book Must Be Found"
 spn_order_toast_prerogative_grow:0 "The Order's Prerogative: More Hands"
 spn_order_toast_prerogative_pit:0 "The Order's Prerogative: Treat with the Pit"
 spn_order_way_silence_modifier:0 "Silent Habits"
 spn_order_way_silence_modifier_desc:0 "You never say more than you must. People who plot against you find little to work with."
 spn_order_way_observance_modifier:0 "Kept Rites"
 spn_order_way_observance_modifier_desc:0 "Every rite kept exactly as it was written."
 spn_order_council_members_only_tt:0 "Only a member of the Order of the Blue Rose can sit on the Gnostic Council"
 spn_order_toast_chair_vacated:0 "The Chair Stands Empty"
 spn_order_toast_new_grand_magus:0 "A New Grand Magus"
 spn_order_toast_new_grand_magus_desc:0 "The temples of the [spn_order|E] have a new Grand Magus."
 spn_order_dissolve_council_decision:0 "Dissolve the Gnostic Council"
 spn_order_dissolve_council_decision_desc:0 "Send the Keeper, the Adeptus Major and the Chancellor home. The temples will fill their seats again."
 spn_order_dissolve_council_decision_tooltip:0 "Clear every seat on the council."
 spn_order_dissolve_council_decision_confirm:0 "Dissolve it"
 spn_order_dissolve_council_seats_tt:0 "Someone holds a seat on the [spn_gnostic_council|E]"
 spn_order_dissolve_council_decision_effect_tt:0 "Every seat on the [spn_gnostic_council|E] falls empty. Those you send home will not thank you."
 spn_order_choose_candidates_decision:0 "Choose the Temple's Candidates"
 spn_order_choose_candidates_decision_desc:0 "You left it to the masks to decide who your temple calls. Take the choice back."
 spn_order_choose_candidates_decision_tooltip:0 "Decide yourself who your temple calls."
 spn_order_choose_candidates_decision_confirm:0 "I will choose"
 spn_order_choose_candidates_decision_effect_tt:0 "Each time the Selection names someone for your temple, you decide whether the note goes out."
 spn_order_expel_friends_tt:0 "Members of your temple who were close to them will think less of you"
 spn_order_expelled_friend_opinion:0 "Cast Out My Friend"
 spn_order_ask_about_rose_interaction:0 "Ask About the Blue Rose"
 spn_order_ask_about_rose_interaction_desc:0 "Your prisoner belongs to the Hermetic Order of the Blue Rose. Make them talk."
 spn_order_ask_about_rose_interaction_tt:0 "They name up to two others of their temple. They will have broken the Order's Silence."
 spn_order_ask_about_rose_asked_tt:0 "They have already told you what they know"
 game_concept_spn_conclave:0 "Conclave"
 game_concept_spn_conclave_desc:0 "The masked gathering of the [spn_order|E]. Every member in reach is invited. Deeds are counted, rule-breakers judged and new members take their oath. When the chair is empty, the Temple Magi and the holders of council seats elect the Grand Magus, and the Grand Magus fills the empty seats."
 spn_order_research_help_decision:0 "Ask the Temple for Help with Your Research"
 spn_order_research_help_decision_desc:0 "Your research has stalled. A Magistratus of your temple could look over your notes."
 spn_order_research_help_decision_tooltip:0 "Ask your temple for help with your Magical Research."
 spn_order_research_help_decision_confirm:0 "Ask them"
 spn_order_research_help_decision_effect_tt:0 "Your current Magical Research needs one breakthrough fewer. It costs you 10 [spn_order_standing|E]."
 spn_order_research_help_in_research_tt:0 "You are doing Magical Research"
 spn_order_research_help_standing_tt:0 "Your [spn_order_standing|E] is at least 10"
 spn_order_research_help_magistratus_tt:0 "Your temple has a Magistratus besides you"
 spn_order_clay_working_decision:0 "Make a Golem"
 spn_order_clay_working_decision_desc:0 "The [spn_order|E] knows how to make a golem: a servant shaped from clay, wood or iron, that obeys whoever made it. It takes the help of your temple and a great deal of power."
 spn_order_clay_working_decision_tooltip:0 "Make a golem the Order's way."
 spn_order_clay_working_decision_confirm:0 "Begin"
 spn_order_clay_working_decision_effect_tt:0 "You spend a great deal of power, and choose what the golem is made of. In a few months you may have a golem who serves you. Your temple cannot try again for twenty years."
 spn_order_clay_power_tt:0 "You have 20 Power Saturation to spend (none if magic costs you nothing)"
 spn_order_clay_temple_size_tt:0 "Your temple has at least five members"
 spn_order_clay_cd_tt:0 "Your temple has not made a golem in the last twenty years"
