l_german:
 trait_spn_vade_bound:0 "Bound to the Book"
 trait_spn_vade_bound_desc:0 "This character paid the [spn_vade_maecum|E]'s last price and was bound to it for life. Magic costs them nothing, demons obey them, and very little can kill them."
 trait_spn_vade_bound_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] paid the [spn_vade_maecum|E]'s last price and was bound to it for life. Magic costs [ROOT.Char.GetHerHim] nothing, demons obey [ROOT.Char.GetHerHim], and very little can kill [ROOT.Char.GetHerHim]."
 story_spn_order_chapter:0 "Chapter of the Blue Rose"
 story_spn_order_mirror:0 "Chapter of the Blue Rose"
 story_spn_coven:0 "Coven"
 story_spn_coven_mirror:0 "Coven"
 story_spn_vade_contract:0 "The Contract"
 story_spn_vade_book:0 "The Vade Maecum Infernal"
 story_spn_order_chapter_desc:0 "A temple of the [spn_order|E] and the members it keeps."
 story_spn_order_mirror_desc:0 "Your temple of the [spn_order|E] and the members it keeps."
 story_spn_coven_desc:0 "A house whose witches know each other for what they are."
 story_spn_coven_mirror_desc:0 "Your coven: the witches of your house who know each other for what they are."
 story_spn_vade_contract_desc:0 "The bargain you made with the [spn_vade_maecum|E], and what is still owed."
 story_spn_vade_book_desc:0 "The [spn_vade_maecum|E], bound and whole, and the souls it has taken."
 spn_order_has_room_tt:0 "The temple has room for another member"
 spn_order_chapter_string:0 "A temple of the [spn_order|E], at [Story.MakeScope.Var('spn_order_seat').GetLandedTitle.GetName]. It has [Story.MakeScope.Var('spn_order_size').GetValue|0] members of a possible [Story.MakeScope.Var('spn_order_cap').GetValue|0].[Story.Custom('spn_OrderCouncilSeat')][Story.Custom('spn_OrderWay')]\n\n[Story.Custom('spn_OrderNextRank')]\n[Story.Custom('spn_OrderPrerogative')]"
 SPN_ORDER_HEAD:0 "Temple Magus"
 SPN_ORDER_MAGISTRATI:0 "Magistrati (the rank below Temple Magus)"
 SPN_ORDER_MEDICI:0 "Medici (the rank below Magistratus)"
 SPN_ORDER_ACOLYTES:0 "Acolytes (members still being taught)"
 SPN_ORDER_NEOPHYTES:0 "Neophytes (still being tested)"
 SPN_ORDER_RELIQUARY:0 "Reliquary"
 spn_coven_string:0 "The witches of one house, who know each other for what they are. It has [Story.MakeScope.Var('spn_coven_size').GetValue|0] members. What they pledge to the [spn_reliquary|E] strengthens them all."
 SPN_COVEN_HEAD:0 "Grand Master"
 SPN_COVEN_MEMBERS:0 "Members"
 SPN_COVEN_RELIQUARY:0 "Reliquary"
 spn_vade_contract_string:0 "You bound the [spn_vade_maecum|E]. To keep it, you must name a witness, give a finger, and pay the last price: your first son. If the time runs out first, the book takes you.\n\n[Story.MakeScope.Var('spn_vade_days_left').GetValue|0] days remain.\n[Story.Custom('spn_VadeWitnessLine')]\n[Story.Custom('spn_VadeSonLine')]"
 SPN_VADE_WITNESS:0 "Witness"
 SPN_VADE_SON:0 "The Price"
 SPN_VADE_BOOK:0 "The Book"
 spn_vade_book_string:0 "Every soul the book has taken is still in it. [GetGlobalVariable( 'spn_vade_soul_count' ).GetValue|0] are bound there now.[Story.Custom('spn_VadeLastSoulLine')]"
 SPN_VADE_SOULS:0 "The Souls"
 spn_order_line_council_seat:0 " Its Temple Magus holds the chair of the [spn_gnostic_council|E]."
 spn_order_line_empty:0 ""
 spn_order_line_way_silence:0 " This temple keeps Silence."
 spn_order_line_way_subservience:0 " This temple keeps Subservience."
 spn_order_line_way_observance:0 " This temple keeps Observance."
 spn_order_line_rank_neophyte:0 "You are a Neophyte, still being tested."
 spn_order_line_rank_acolyte_mage:0 "You are an Acolyte. Next: Medicum, at 25 [spn_order_standing|E]."
 spn_order_line_rank_acolyte:0 "You are an Acolyte. Your tutor will make you a Mage first; then Medicum, at 25 [spn_order_standing|E]."
 spn_order_line_rank_acolyte_craft:0 "You are an Acolyte. Your tutor will teach you the Order's craft first; then Medicum, at 25 [spn_order_standing|E]."
 spn_order_line_rank_medicum:0 "You are a Medicum. Next: Magistratus, at 50 [spn_order_standing|E]."
 spn_order_line_rank_adeptus:0 "You are a Magistratus and an Adeptus. Next: a temple of your own, or a seat on the [spn_gnostic_council|E]."
 spn_order_line_rank_magistratus:0 "You are a Magistratus. Next: a temple of your own, or a seat on the [spn_gnostic_council|E]."
 spn_order_line_rank_temple_magus:0 "You are the [spn_temple_magus|E]. Next: a seat on the [spn_gnostic_council|E]."
 spn_order_line_rank_councilor:0 "You sit on the [spn_gnostic_council|E]. Next: the chair of the Grand Magus."
 spn_order_line_rank_grand_magus:0 "You are the Grand Magus, and the master of the [spn_order|E]."
 spn_order_line_prerogative_recover:0 "The Order's [spn_order_prerogative|E]: Recover What Was Lost."
 spn_order_line_prerogative_silence:0 "The Order's [spn_order_prerogative|E]: Silence."
 spn_order_line_prerogative_book:0 "The Order's [spn_order_prerogative|E]: The Book Must Be Found."
 spn_order_line_prerogative_grow:0 "The Order's [spn_order_prerogative|E]: More Hands."
 spn_order_line_prerogative_pit:0 "The Order's [spn_order_prerogative|E]: Treat with the Pit."
 spn_order_line_prerogative_none:0 "The Order has set no [spn_order_prerogative|E] yet."
