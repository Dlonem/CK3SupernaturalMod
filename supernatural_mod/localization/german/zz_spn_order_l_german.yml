 spn_vade_line_witness_named:0 "A witness is named."
 spn_vade_line_witness_none:0 "No witness yet."
 spn_vade_line_son_named:0 "The book has named your son."
 spn_vade_line_son_none:0 "You have no son of your blood. The book cannot be paid."
 spn_vade_line_last_soul:0 " The last was [GetGlobalVariable( 'spn_vade_soul_last' ).Char.GetFirstName]."
 spn_vade_line_no_soul:0 ""
 spn_secret_blue_rose:0 "Member of the Hermetic Order"
 spn_secret_blue_rose_desc:0 "Belongs to the Hermetic Order of the Blue Rose"
 spn_secret_blue_rose_tooltip_desc:0 "This character belongs to the Hermetic Order of the Blue Rose."
 spn_secret_blue_rose_type_desc:0 "$spn_secret_blue_rose_tooltip_desc$"
 SecretDescription_spn_blue_rose:0 "belongs to the Hermetic Order of the Blue Rose"
 SecretDescription_spn_blue_rose_first_person:0 "belong to the Hermetic Order of the Blue Rose"
 spn_order_studies_modifier:0 "Esoteric Studies"
 spn_order_studies_modifier_desc:0 "Quiet nights of study with people who know more than you. It grows with your [spn_order_standing|E]."
 spn_order_studies_silence_modifier:0 "Esoteric Studies"
 spn_order_studies_silence_modifier_desc:0 "Quiet nights of study with people who know more than you, and who never talk about it. It grows with your [spn_order_standing|E]."
 spn_order_studies_subservience_modifier:0 "Esoteric Studies"
 spn_order_studies_subservience_modifier_desc:0 "Quiet nights of study, in good order, each in their place. It grows with your [spn_order_standing|E]."
 spn_order_studies_observance_modifier:0 "Esoteric Studies"
 spn_order_studies_observance_modifier_desc:0 "Quiet nights of study, every rite kept as it was written. It grows with your [spn_order_standing|E]."
 spn_order_studies_modifier_scale_desc:0 "Your [spn_order_standing|E]"
 spn_order_tutor_modifier:0 "Under a Tutor"
 spn_order_tutor_modifier_desc:0 "Someone older is teaching you, every night, whether you like it or not."
 spn_order_respondeo_modifier:0 "Spent on Respondeo"
 spn_order_respondeo_modifier_desc:0 "You made a county forget. It took something out of you."
 spn_reliquary_modifier:0 "The Reliquary"
 spn_reliquary_modifier_desc:0 "What your temple's members have pledged to its [spn_reliquary|E] makes all of you stronger."
 spn_reliquary_modifier_scale_desc:0 "Items in the reliquary"
 spn_coven_reliquary_modifier:0 "The Coven's Reliquary"
 spn_coven_reliquary_modifier_desc:0 "What your coven has pledged to its [spn_reliquary|E] makes all of you stronger."
 spn_coven_reliquary_modifier_scale_desc:0 "Items in the reliquary"
 spn_fates_bound_modifier:0 "Fates Bound"
 spn_fates_bound_modifier_desc:0 "Your life is tied to someone else's by a mirror shard. If either of you is killed, the other dies within a day."
 spn_missing_finger_modifier:0 "A Finger Short"
 spn_missing_finger_modifier_desc:0 "You gave a finger to the book."
 spn_vade_humanity_modifier:0 "Less Than Human"
 spn_vade_humanity_modifier_desc:0 "Something left you when the book took its price. People can tell."
 spn_golem_away_modifier:0 "Searching"
 spn_golem_away_modifier_desc:0 "This golem has been sent to look for the pages of the book."
 spn_vade_witness_bond_modifier:0 "Bound as Witness"
 spn_vade_witness_bond_modifier_desc:0 "You witnessed a contract with the [spn_vade_maecum|E]. Your magic has not been right since. While any part of the book survives, your spells may go wrong."
 spn_vade_echoes_modifier:0 "Echoes of the Book"
 spn_vade_echoes_modifier_desc:0 "The voices in the book are teaching you. You learn fast, and you sleep badly."
 spn_vade_sleeper_modifier:0 "Dreams Not His Own"
 spn_vade_sleeper_modifier_desc:0 "You dream in a tongue you never learned."
 spn_transference_carrier_modifier:0 "Carrying Another's Illness"
 spn_transference_carrier_modifier_desc:0 "A fifth of someone else's sickness lives in you for a while."
 spn_fors_factorum_modifier:0 "Magic Without Price"
 spn_fors_factorum_modifier_desc:0 "Your spells cost you nothing. Something else is paying."
 spn_vade_page_modifier:0 "A Page of the Book"
 spn_vade_page_modifier_desc:0 "One of the four pages of the [spn_vade_maecum|E]."
 spn_vade_book_modifier:0 "The Vade Maecum Infernal"
 spn_vade_book_modifier_desc:0 "The whole book, bound again."
 spn_seal_kept_modifier:0 "The Seal of Solomon Is Kept Here"
 spn_seal_kept_modifier_desc:0 "The priests here keep an old brass ring in a box of lead. Pilgrims come to touch the box."
 spn_relic_glove_modifier:0 "The Glove"
 spn_relic_glove_modifier_desc:0 "Whoever wears it reads people well. Laid on a prisoner, it burns a liar."
 spn_relic_necrophone_modifier:0 "The Necrophone"
 spn_relic_necrophone_modifier_desc:0 "It lets you talk to the dead."
 spn_relic_blade_modifier:0 "The Enchanted Blade"
 spn_relic_blade_modifier_desc:0 "It cuts a wolf like silver does."
 spn_relic_powder_modifier:0 "Obfuscation Powder"
 spn_relic_powder_modifier_desc:0 "Thrown in the air, it makes a place forget."
 spn_relic_mirror_modifier:0 "The Mirror Shard"
 spn_relic_mirror_modifier_desc:0 "It can bind two lives together."
 spn_relic_bell_modifier:0 "The Bell of the Dead Hour"
 spn_relic_bell_modifier_desc:0 "It rings before a hunter comes."
 spn_relic_seal_modifier:0 "The Seal of Solomon"
 spn_relic_seal_modifier_desc:0 "The king's ring. It commands; it is not commanded."
 spn_brother_of_the_order_opinion:0 "Brother of the Rose"
 spn_betrayed_the_order_opinion:0 "Broke Faith"
 spn_order_council_dissolved_opinion:0 "Sent Home from the Council"
 spn_robbed_by_zecchia_opinion:0 "Hired a Thief Against Me"
 spn_stinks_of_the_book_opinion:0 "Stinks of the Book"
 spn_burned_under_the_glove_opinion:0 "Burned Under the Glove"
 spn_tutor_opinion:0 "My Tutor"
 spn_seal_thief_opinion:0 "Tried to Rob the Shrine"
 spn_order_hard_tutor_opinion:0 "Hard Teacher"
 spn_order_patient_tutor_opinion:0 "Patient Teacher"
 spn_order_spurned_opinion:0 "Turned Me Away"
 spn_gave_blood_opinion:0 "Carries My Illness"
 spn_blood_debt_opinion:0 "Blood Debt"
 spn_order_carried_me_opinion:0 "Spoke for Me"
 spn_order_compact_opinion:0 "A Compact"
 spn_order_oathbreaker_opinion:0 "Broke a Compact"
 spn_coven_trusted_opinion:0 "Told Us the Truth"
 spn_coven_lied_to_opinion:0 "Lied to the Coven"
 spn_order_tutor_of:0 "Tutor"
 spn_order_tutee_of:0 "Acolyte"
 spn_rel_order_tutor:0 "[CHARACTER.GetShortUIName|U] taught [TARGET_CHARACTER.GetShortUIName] for years."
 artifact_spn_relic:0 "Relic"
 spn_relic_glove_name:0 "The Glove"
 spn_relic_glove_desc:0 "A black leather glove, stiff with age. Lay it on someone's skin and ask a question: if they lie, it burns them. Interrogators of the Order used it for centuries."
 spn_relic_necrophone_name:0 "The Necrophone"
 spn_relic_necrophone_desc:0 "A brass box with a dial and a horn. Turn the dial far enough and someone dead answers. It cracks a little with every call."
 spn_relic_blade_name:0 "The Enchanted Blade"
 spn_relic_blade_desc:0 "A plain-looking dagger that cuts a wolf as silver does. Hunters have wanted it for a long time."
 spn_relic_pendant_name:0 "The Echo Pendant"
 spn_relic_pendant_desc:0 "A silver pendant with a hollow stone. A curse aimed at whoever wears it comes back to the one who cast it."
 spn_relic_powder_name:0 "Obfuscation Powder"
 spn_relic_powder_desc:0 "A pouch of grey powder that smells of burnt hair. Thrown into the air, it makes the people of a place forget what they saw. It is used up when thrown."
 spn_relic_mirror_name:0 "The Mirror Shard"
 spn_relic_mirror_desc:0 "A piece of a broken mirror that never shows your own face. Two people who look into it together are bound: if one is killed, the other follows."
 spn_relic_bell_name:0 "The Bell of the Dead Hour"
 spn_relic_bell_desc:0 "A small iron bell. It rings by itself when a hunter is close."
 spn_relic_seal_name:0 "The Seal of Solomon"
 spn_relic_seal_desc:0 "A brass ring cut with the seal of the king who bound demons. Known in Jerusalem, Constantinople and Baghdad long before anyone now alive. No demon will come near it willingly, and whoever wears it cannot be magically dominated."
 spn_vade_page_1_name:0 "The Black Stone Page"
 spn_vade_page_1_desc:0 "A page of the [spn_vade_maecum|E], sealed in obsidian under a spell that turns magic back on whoever casts it."
 spn_vade_page_2_name:0 "The Sleeper's Page"
 spn_vade_page_2_desc:0 "A page of the [spn_vade_maecum|E]. Whoever keeps it dreams in a tongue they never learned."
 spn_vade_page_3_name:0 "The Strongbox Page"
 spn_vade_page_3_desc:0 "A page of the [spn_vade_maecum|E], kept for a long time in an iron strongbox by people who did not know what it was."
 spn_vade_page_4_name:0 "Silverback's Page"
 spn_vade_page_4_desc:0 "A page of the [spn_vade_maecum|E]. For years it was hidden in a wolf's hide, and it still smells of one."
 spn_vade_book_name:0 "The Vade Maecum Infernal"
 spn_vade_book_desc:0 "The demon's handbook, whole again. Whoever binds it gets power without price, and pays with a finger, a witness and a son."
 spn_vade_book_desc_souls:0 "The demon's handbook, whole again. Every soul it took is still inside. The last was [GetGlobalVariable( 'spn_vade_soul_last' ).Char.GetFirstName]."
 spn_relic_war:0 "Seize Their Relics"
 SPN_RELIC_WAR_NAME:0 "[ATTACKER.GetShortUIName]'s War for [DEFENDER.GetShortUINamePossessive] Relics"
 SPN_RELIC_WAR_NAME_FALLBACK:0 "War for Relics"
 spn_relic_war_victory_desc:0 "The attacker takes every relic and magical item the defender owns."
 spn_relic_war_victory_desc_defender:0 "You lose every relic and magical item you own to the attacker."
 spn_relic_war_white_peace_desc:0 "Nothing changes hands. The attacker loses a little prestige."
 spn_relic_war_defeat_desc:0 "The attacker pays reparations and loses prestige. Nobody loses a claim over this war."
 spn_relic_war_invalidated_desc:0 "The defender no longer holds anything worth taking."
 spn_vade_blow_turned_aside_friendly:0 "A blow that should have killed our [CHARACTER.GetShortUINameNoTooltip] found the man beside [CHARACTER.GetHerHim] instead."
 spn_vade_blow_turned_aside_enemy:0 "A blow that should have killed [CHARACTER.GetShortUINameNoTooltip] found the man beside [CHARACTER.GetHerHim] instead."
 spn_meet_in_the_masks_intent:0 "Seek Kindred Minds"
 spn_meet_in_the_masks_intent_desc:0 "You came for the people in masks, not the speeches."
 spn_speak_for_the_order_intent:0 "Speak for My Circle"
 spn_speak_for_the_order_intent_desc:0 "Your circle wants a voice at this Summit. You will be it."
 spn_bring_coven_to_order_intent:0 "Bring the Coven to the Order"
 spn_bring_coven_to_order_intent_desc:0 "Every Mage of your coven who is not yet of the [spn_order|E] will be offered the rose."
 spn_order_leave_decision:0 "Leave the Order"
 spn_order_leave_decision_desc:0 "Walk away from the [spn_order|E]. It does not let anyone leave with what they learned."
 spn_order_leave_decision_tooltip:0 "Leave the Order of the Blue Rose."
 spn_order_leave_decision_confirm:0 "I am leaving"
 spn_order_leave_decision_effect_tt:0 "The Order will ask you to give back what you learned, or to keep it and be remembered."
 spn_order_respondeo_decision:0 "Respondeo"
 spn_order_respondeo_decision_desc:0 "[Glossary('Respondeo','spn_gloss_respondeo')]: the [spn_order|E]'s spell of forgetting. The county where you stand forgets what it saw, and any trail a hunter was following here goes cold. It takes a great deal of power, and it hurts."
 spn_order_respondeo_decision_tooltip:0 "Make a county forget."
 spn_order_respondeo_decision_confirm:0 "Speak the words"
 spn_order_respondeo_can_pay_tt:0 "You have the power to pay for it, or two members of your chapter in your realm can pay with you."
 spn_order_respondeo_decision_effect_tt:0 "You choose who pays."
 spn_order_powder_decision:0 "Prepare the Powder"
 spn_order_powder_decision_desc:0 "Make a pouch of Obfuscation Powder. Thrown into the air, it makes a place forget what it saw."
 spn_order_powder_decision_tooltip:0 "Make a pouch of Obfuscation Powder."
 spn_order_powder_decision_confirm:0 "Prepare it"
 spn_order_seek_decision:0 "Seek Out the Order"
 spn_order_seek_decision_desc:0 "You leave a blue rose on the library steps and wait. Someone will notice, if anyone is watching."
 spn_order_seek_decision_tooltip:0 "Let the Order know you want to join."
 spn_order_seek_decision_confirm:0 "Leave the rose"
 spn_order_seek_decision_effect_tt:0 "If a temple near you has room and will take you, you will be near the top of its next Selection."
 spn_order_transference_ask_decision:0 "Ask the Temple to Heal You"
 spn_order_transference_ask_decision_desc:0 "Ask your [spn_temple_magus|E] for the [spn_order_transference|E]: five members carry your illness so you can live."
 spn_order_transference_ask_decision_tooltip:0 "Ask your temple to heal you."
 spn_order_transference_ask_decision_confirm:0 "Ask"
 spn_order_transference_ask_head_tt:0 "Your Temple Magus is alive and free."
 spn_order_transference_ask_decision_effect_tt:0 "Your Temple Magus decides."
 spn_order_toast_heal_refused:0 "The Temple Cannot Heal You"
 spn_order_set_prerogative_decision:0 "Set the Order's Prerogative"
 spn_order_set_prerogative_decision_desc:0 "As master of the [spn_order|E], decide what the temples work toward. Members who serve it gain [spn_order_standing|E]."
 spn_order_set_prerogative_decision_tooltip:0 "Choose what the Order works toward."
 spn_order_set_prerogative_decision_confirm:0 "Decide"
 spn_order_set_prerogative_choices_tt:0 "You choose one of five, for ten years:\n• Recover What Was Lost: $spn_order_prerogative_recover_tt$\n• Silence: $spn_order_prerogative_silence_tt$\n• The Book Must Be Found: $spn_order_prerogative_book_tt$\n• More Hands: $spn_order_prerogative_grow_tt$\n• Treat with the Pit: $spn_order_prerogative_pit_tt$"
 spn_order_fors_decision:0 "Learn the Fors Factorum"
 spn_order_fors_decision_desc:0 "The [spn_order|E]'s most secret spell: magic that costs you nothing, until it costs you everything."
 spn_order_fors_decision_tooltip:0 "Ask for the Order's most secret spell."
 spn_order_fors_decision_confirm:0 "Ask"
 spn_order_compact_seek_decision:0 "Seek a Compact with the Order"
 spn_order_compact_seek_decision_desc:0 "Demons are old. They know where the temples are. Go to the master of the [spn_order|E] and offer to deal."
 spn_order_compact_seek_decision_tooltip:0 "Knock on the Order's door."
 spn_order_compact_seek_decision_confirm:0 "Knock"
 spn_order_compact_knock_tt:0 "Only one demon a year may knock on the master's door."
 spn_order_compact_seek_decision_effect_tt:0 "The master of the Order decides whether to hear you."
 spn_order_charter_decision:0 "Petition for a Charter"
 spn_order_charter_decision_desc:0 "Ask the [spn_gnostic_council|E] for leave to found a temple of your own, at your seat, with you as its [spn_temple_magus|E]."
 spn_order_charter_decision_tooltip:0 "Ask to found a temple of your own."
 spn_order_charter_decision_confirm:0 "Petition"
 spn_order_charter_standing_tt:0 "You have 75 [spn_order_standing|E] (60 while the Order wants More Hands)."
 spn_order_charter_chair_tt:0 "Someone else holds the chair of the Gnostic Council."
 spn_order_charter_room_tt:0 "The Order has room for another temple."
 spn_order_charter_decision_effect_tt:0 "The Grand Magus decides. If it is granted, you leave your old chapter and found a new one."
 spn_order_daughter_decision:0 "Found a Daughter Chapter"
 spn_order_daughter_decision_desc:0 "Your temple is full. Take up to five members who will follow you, and found a new temple at your seat."
 spn_order_daughter_decision_tooltip:0 "Found a new temple from a full one."
 spn_order_daughter_decision_confirm:0 "Found it"
 spn_order_daughter_full_tt:0 "Your chapter is full."
 spn_order_daughter_cd_tt:0 "Your chapter has not founded a daughter in the last 50 years."
 spn_order_daughter_spaced_tt:0 "No other temple is close to your seat."
 spn_order_refound_decision:0 "Found the Order Anew"
 spn_order_refound_decision_desc:0 "No temple of the [spn_order|E] stands anywhere. You know two other Mages for what they are. Start one."
 spn_order_refound_decision_tooltip:0 "Found the Order again."
 spn_order_refound_decision_confirm:0 "Begin"
 spn_order_refound_two_tt:0 "You know two other Mages in your reach who could join: at your court, among your vassals, your liege, or Mages whose secret you know"
 spn_order_refound_effect_temple_tt:0 "You become the [spn_temple_magus|E] of a new temple of the [spn_order|E], seated in your capital"
 spn_order_refound_effect_master_tt:0 "With fewer than three temples standing, the [spn_temple_magus|E] of the oldest temple is Grand Magus. With no other temple, that is you: you lead the [spn_order|E]."
 spn_order_refound_effect_invite_tt:0 "Every Mage you know who could join is asked to"
 spn_order_rule_on_tt:0 "The Order of the Blue Rose is on in the game rules"
 spn_vade_rule_on_tt:0 "The Vade Maecum Infernal is on in the game rules"
 spn_order_join_not_creature_tt:0 "You are not a hunter, a demon, a golem, or bound to the book"
