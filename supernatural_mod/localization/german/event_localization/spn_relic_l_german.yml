l_german:
 spn_relic.0050.t:0 "Where Will You Pledge It?"
 spn_relic.0050.desc:0 "You belong to a temple of the [spn_order|E] and to your house's coven. [spn_pp_art.GetName] can go to one [spn_reliquary|E] or the other, not both."
 spn_relic.0050.a:0 "To my chapter"
 spn_relic.0050.b:0 "To my coven"
 spn_relic.0050.c:0 "I will keep it for now"
 spn_relic.0100.t:0 "Under the Glove"
 spn_relic.0100.desc:0 "[spn_gl_asker.GetTitledFirstName] puts on a black glove and lays [spn_gl_asker.GetHerHis] hand on your chest. It burns like a brand.\n\n"While I wear this, you cannot lie to me without burning. Talk.""
 spn_relic.0100.a:0 "I will tell you the truth"
 spn_relic.0100.a_nothing:0 "You have nothing left to tell."
 spn_relic.0100.b:0 "I will lie"
 spn_relic.0100.c:0 "Endure it"
 spn_relic_toast_glove_word:0 "Burned Under the Glove"
 spn_relic.0200.t:0 "Call the Dead"
 spn_relic.0200.desc:0 "You turn the dial on the Necrophone. Through the hiss, a voice answers. It belongs to someone who has been dead a long time.\n\n"Ask. Quickly.""
 spn_relic.0200.desc_cracking:0 "\n\nThere is a crack in the glass you did not see before. It will not take another call."
 spn_relic.0200.a:0 "Where is a page of the book?"
 spn_relic.0200.a_tt:0 "The dead name someone who holds a page of the [spn_vade_maecum|E]. You will remember who for ten years."
 spn_relic.0200.b:0 "Where is the lost hide?"
 spn_relic.0200.b_tt:0 ""It sleeps. It will wake in about [ROOT.Char.MakeScope.Var('spn_nc_wake').GetValue|0] years.""
 spn_relic.0200.c:0 "Where is the Seal of Solomon?"
 spn_relic.0200.c_tt:0 "The dead tell you where the [spn_seal_of_solomon|E] rests now. You will remember for ten years."
 spn_relic.0200.d:0 "Hang up"
 spn_relic_necrophone_cracks_tt:0 "The Necrophone cracks and is gone."
 spn_relic.0400.t:0 "A Lesser Thing"
 spn_relic.0400.desc:0 "At the bottom of a box nobody has opened in a hundred years, under rags, you find something that is still warm to the touch.\n\nIt is not one of the great artifacts. It is a [spn_relic|E], and it still works."
 spn_relic.0400.a:0 "Mine now"
 spn_relic.0600.t:0 "The Ring Beneath the Altar"
 spn_relic.0600.desc:0 "Your soldiers have the temple. Under the altar of [spn_seal_siege_county.GetName], in a box of lead, is a brass ring cut with a six-pointed seal.\n\nThe [spn_seal_of_solomon|E]. The priests are watching you."
 spn_relic.0600.a:0 "Take it"
 spn_relic.0600.b:0 "Leave it to the priests"
 spn_relic.0610.t:0 "The Ring at the Shrine"
 spn_relic.0610.desc:0 "You came as a pilgrim, but you know what is kept here. The [spn_seal_of_solomon|E] is behind a grille in the shrine of [spn_seal_pilgrim_county.GetName], and the guard is half asleep."
 spn_relic.0610.a:0 "Take it"
 spn_relic.0610.a_tt:0 "The better your [intrigue|E], the likelier you walk out with it. If you are caught, the lord of this place will not forget."
 spn_relic.0610.b:0 "I came to pray"
 spn_relic_toast_seal_taken:0 "You Have the Seal of Solomon"
 spn_relic_toast_seal_caught:0 "Caught at the Shrine"
