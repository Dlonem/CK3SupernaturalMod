l_german:
 spn_order.0001.t:0 "A Temple Without a Master"
 spn_order.0001.desc:0 "A letter is waiting on your desk. It has no name on it, only a blue rose pressed into the wax.\n\n"There are six temples of the [spn_order|E]. One of them stands near you, and it has no master. You have the gift. Will you lead it as its [spn_temple_magus|E]?""
 spn_order.0001.desc_late:0 "A letter is waiting on your desk. It has no name on it, only a blue rose pressed into the wax.\n\n"The six temples of the [spn_order|E] have their masters now. The Council may grant you a charter later. Until then, we will be watching.""
 spn_order.0001.a:0 "I will be its Temple Magus"
 spn_order.0001.b:0 "Let the Order find someone else"
 spn_order.0001.c:0 "Then I will wait"
 spn_order.0003.t:0 "The Temple Is Closed to You"
 spn_order.0003.desc:0 "There were six temples tonight. You felt every one of them open its doors to someone. None of them would open for you.\n\nThe [spn_order|E] has a law about what you do with the dead. It has kept that law for a long time."
 spn_order.0003.a:0 "Then I will find another door"
 spn_order.0003.b:0 "They will need me one day"
 spn_order.0101.t:0 "A Note and a Blue Rose"
 spn_order.0101.desc_pillow:0 "When you go to bed, there is a folded note on your pillow, sealed with blue wax, and a blue rose beside it. Nobody in the house saw who left them.\n\n"We have watched you for a long time. You see what others miss, and you want to know more than the world will teach you. We can show you. Come to the old chapel at the next new moon. Come alone, and tell no one."\n\nThere is no name at the bottom. Only a small blue rose, drawn in ink."
 spn_order.0101.desc_market:0 "In the market a woman in a grey hood presses a note into your hand and is gone before you can look at her. A blue rose is pinned to the paper.\n\n"We have watched you for a long time. You see what others miss, and you want to know more than the world will teach you. We can show you. Come to the old chapel at the next new moon. Come alone, and tell no one."\n\nThere is no name at the bottom. Only a small blue rose, drawn in ink."
 spn_order.0101.desc_book:0 "You open the book you were reading last night. Between the pages is a note you did not put there, and a pressed blue rose. The ink is still fresh.\n\n"We have watched you for a long time. You see what others miss, and you want to know more than the world will teach you. We can show you. Come to the old chapel at the next new moon. Come alone, and tell no one."\n\nThere is no name at the bottom. Only a small blue rose, drawn in ink."
 spn_order.0101.a:0 "I will come"
 spn_order.0101.b:0 "Not for me"
 spn_order.0101.a.tt:0 "You go to the old chapel at the next new moon. What you find there decides whether they keep you."
 spn_order.0096.t:0 "A Rose Among the Things"
 spn_order.0096.desc:0 "Going through [spn_dying.GetTitledFirstName]'s things, you find a small box no one else knew about. Inside are a pressed blue rose, an old coin with a rose stamped on it, and a page written in a language you cannot read.\n\nYou have heard that rose mentioned before, somewhere. You are almost sure of it."
 spn_order.0096.a:0 "Keep them"
 spn_order.0096.a.tt:0 "If anyone ever comes asking for [spn_dying.GetFirstName]'s child, you will know them."
 spn_order.0096.b:0 "Put them away"
 spn_order.0096.b.tt:0 "Nothing changes. They may come for you anyway."
 spn_order.0102.t:0 "The Old Chapel"
 spn_order.0102.desc_open:0 "The chapel is dark when you arrive. Then every candle lights at once, and you see them: a ring of people in plain cloaks and white masks. One of them steps forward. You cannot see a face, but you know this is the one in charge.\n\n"
 spn_order.0102.desc_gifted:0 ""You have touched the Source on your own, with no one to teach you. That is dangerous, and it is a waste. We are the [spn_order|E]. We have taught people like you for longer than anyone remembers."\n\n"
 spn_order.0102.desc_new:0 ""You have no gift yet. Most of us had none when we first came here. What you have is a mind that wants to know how the world really works. We are the [spn_order|E], and we can show you."\n\n"
 spn_order.0102.desc_rules:0 ""Three words keep us alive. Silence: what you see here, you never speak of. Subservience: you do what your elders ask. Observance: you watch, and you learn. We will test you on all three. If you fail, you will simply forget you were ever here. Until then you are a [Glossary('Neophyte','spn_gloss_neophyte')], and nothing more.""
 spn_order.0102.a:0 "I will take the tests"
 spn_order.0102.a.tt:0 "The first test comes within two months."
 spn_order.0102.b:0 "I will walk out now"
 spn_order.0102.b.tt:0 "They let you go. By morning you will not remember the chapel, and the Order will not call you again for a long time."
 spn_order.0110.t:0 "The Coin"
 spn_order.0110.desc_tomb:0 "The masks give you one task. Somewhere in the old tomb under the chapel is a coin with a rose on it. Bring it back before dawn.\n\nThe tomb is dark, the stairs are broken, and you are not the only one looking."
 spn_order.0110.desc_tower:0 "The people in masks give you one task. A coin with a rose on it has been left on the roof of the bell tower. Bring it back before dawn.\n\nThe tower door is locked, the wall is high, and you are not the only one looking."
 spn_order.0110.desc_mill:0 "The people in masks give you one task. A coin with a rose on it is nailed to the old mill wheel. Bring it back before dawn.\n\nThe wheel is turning, the water is fast, and you are not the only one looking."
 spn_order.0110.desc_cage:0 "The masks lead you down to a cellar under the chapel. At the far end stands an iron cage, and something large is breathing inside it. A coin with a rose on it lies in the straw by its feet. Bring it back before dawn.\n\nThere is dried blood on the bars. Whoever tried before you did not stop to think."
 spn_order.0110.a:0 "Climb for it"
 spn_order.0110.b:0 "Find the trick in it"
 spn_order.0110.c:0 "Ask the right person"
 spn_order.0110.d:0 "Give my coin to another neophyte"
 spn_order.0110.a_cage:0 "Reach in and grab it"
 spn_order.0110.a_cage.tt:0 "If the beast wakes, you will lose a hand."
 spn_order.0110.b_cage:0 "Learn what it is first"
 spn_order.0110.c_cage:0 "Get the keeper to tell me its habits"
 spn_order.0110.e_cage:0 "Let someone else try first"
 spn_order.0110.e_cage.tt:0 "You watch another neophyte try, and learn from what happens to them. The better your [learning|E], the likelier you are to bring it back."
 spn_order_coin_lean_prowess_tt:0 "A test of strength. The better your [prowess|E], the likelier you are to bring it back."
 spn_order_coin_lean_learning_tt:0 "A test of wits. The better your [learning|E], the likelier you are to bring it back."
 spn_order_coin_lean_intrigue_tt:0 "A test of nerve. The better your [intrigue|E], the likelier you are to bring it back."
 spn_order_coin_given_tt:0 "The coin was the test. You were never meant to give it away."
 spn_order.0120.t:0 "The Observance"
 spn_order.0120.desc_1:0 "This is the second test, though no one tells you so. You are sweeping the floor of an old house at night, as you were told to. A man steps in out of the rain and asks what you are doing here so late.\n\nHe looks like he will remember your answer."
 spn_order.0120.desc_2:0 "This is the second test, though no one tells you so. You are lighting candles in an empty house, as you were told to. The watchman sees the light and comes to the door. He asks what you are doing here at this hour.\n\nHe looks like he will remember your answer."
 spn_order.0120.desc_3:0 "This is the second test, though no one tells you so. You are waiting in a dark house, as you were told to. A stranger finds you there and asks who you are waiting for.\n\nHe looks like he will remember your answer."
 spn_order.0120.a:0 "Say nothing"
 spn_order.0120.b:0 "Lie well"
 spn_order.0120.c:0 "Tell him"
 spn_order.0130.t:0 "Will You Heed the Call?"
 spn_order.0130.desc_1:0 "They bring you into a room full of candles. Everyone wears a mask. One of them, the [spn_temple_magus|E], holds out a blue rose.\n\n"
 spn_order.0130.desc_2:0 "The masks are waiting for you in the crypt. The [spn_temple_magus|E] steps forward with a blue rose. "[Glossary('Ex tenebris lux','spn_gloss_ex_tenebris_lux')]," says the voice behind the mask.\n\n"
 spn_order.0130.desc_3:0 "Someone takes off your blindfold. You are standing in a circle of masks under a painted ceiling. The [spn_temple_magus|E] holds out a blue rose. "Everything you did was watched," says the voice behind the mask.\n\n"
 spn_order.0130.desc_conclave:0 "Tonight it is not one temple watching you, but all of them. The masks of every temple of the [spn_order|E] fill the hall of the [spn_conclave|E], and the rose is held out to you in front of them all.\n\n"
 spn_order.0130.desc_story:0 ""We keep what the world would burn: the old learning, and the gift that comes with it. Kings have hunted us, and every one of them is dust. Take the rose and you will be taught our magic, and be one of us for the rest of your life. Leave us or betray us, and you will forget all of it. Will you heed the call?"\n\nTake it, and the masks will come off. You will see who has been watching you."
 spn_order.0130.a:0 "I heed the call"
 spn_order.0130.b:0 "I will not"
 spn_order.0190.t:0 "Pulveris Memoria"
 spn_order.0190.desc:0 "You wake in your own bed. Your head aches and your mouth tastes of ash.\n\nThere was a night you cannot remember. You try for a long time, and nothing comes."
 spn_order.0190.a:0 "..."
 spn_order.0191.t:0 "The Order Does Not Let You Walk Away"
 spn_order.0191.desc:0 "You tell your [spn_temple_magus|E] you are leaving the [spn_order|E]. Nobody argues.\n\n"No one leaves with what they learned here. Let us take it, and you will forget us. Or keep it, and we will remember you.""
 spn_order.0191.desc_head:0 "You tell the masks of your temple that you are leaving the [spn_order|E], and that they will need a new [spn_temple_magus|E]. Nobody argues.\n\n"No one leaves with what they learned here, not even you. Let us take it, and you will forget us. Or keep it, and we will remember you.""
 spn_order.0191.a:0 "Let them take it"
 spn_order.0191.b:0 "I will keep what I know"
 spn_order.0192.t:0 "Cast Out"
 spn_order.0192.desc:0 "The masks have decided. You are no longer one of them.\n\n"No one leaves with what they learned here. Let us take it, and you will forget us. Or keep it, and we will remember you.""
 spn_order.0192.a:0 "Let them take it"
 spn_order.0192.b:0 "I will keep what I know"
 spn_order.0193.t:0 "They Came for What You Know"
 spn_order.0193.desc:0 "Someone is in your room. You know the voice before you see the mask. It is someone from the [spn_order|E].\n\n"You kept what you learned. We have come to take it back." The words start, low and old, and you feel your memory begin to slip."
 spn_order.0193.a:0 "Hold on to it"
 spn_order_defector_lean_tt:0 "A battle of wills. The better your [learning|E], the likelier you are to keep your memories, and they will leave you alone for good. If you lose, you forget."
 spn_order_toast_sought:0 "The Rose Is Gone"
 spn_order_toast_not_sought:0 "No One Took the Rose"
 spn_order_toast_sought_desc:0 "Three days later the rose is gone from the library steps. Nobody saw who took it."
 spn_order_toast_not_sought_none_desc:0 "The rose lies on the steps until it withers. No temple of the [spn_order|E] stands anywhere. A landed Mage who knows two others can found one."
 spn_order_toast_not_sought_far_desc:0 "The rose lies on the steps for a week until the rain takes it. No temple in your reach has room for you. Try again in a few years."
 spn_order_toast_not_sought_barred_desc:0 "The next morning the rose is on your own doorstep, cut in two. The [spn_order|E] will not take you as you are."
 spn_order.0105.t:0 "The Door Stays Shut"
 spn_order.0105.desc:0 "The answer comes on black paper.\n\n"Necromancy is forbidden. It has been since two sisters nearly ended the [spn_order|E]. There is no place among us for what you do.""
 spn_order.0105.a:0 "Then I will find my own way"
 spn_order.0105.b:0 "I could give it up"
 spn_order.0106.t:0 "The Forbidden Art"
 spn_order.0106.desc:0 "Word has reached your temple about what you have learned to do with the dead.\n\nThe [spn_order|E] has a law against it. Your [spn_temple_magus|E] wants an answer."
 spn_order.0106.desc_head:0 "Word has spread through the [spn_order|E] about what you have learned to do with the dead.\n\nThe Order has a law against it, and a [spn_temple_magus|E] is meant to keep that law, not break it. The other temples want an answer."
 spn_order.0106.a:0 "Renounce it"
 spn_order.0106.b:0 "Let them judge me"
 spn_order.0106.c:0 "Leave before they cast me out"
 spn_order.0107.t:0 "A Necromancer Among Us"
 spn_order.0107.desc:0 "[spn_nj_member.GetTitledFirstName] has taken up necromancy. [spn_nj_member.GetSheHe|U] will not give it up, and asks you to judge.\n\nThe law of the [spn_order|E] is clear. You are the one who must keep it."
 spn_order.0107.a:0 "Cast them out"
 spn_order.0107.b:0 "The law can bend once"
 spn_order.0140.t:0 "The First Real Spell"
 spn_order.0140.desc:0 "Your tutor has made you repeat the same words every night for years. Tonight, when you say them, the candle in front of you goes out.\n\nThen every candle in the room goes out. When they light again, you can feel the power still in your hands."
 spn_order.0140.desc_craft:0 "You knew your own craft before you came to the Order. For years your tutor has made you repeat theirs, every night, word for word. Tonight, when you say the words, every candle in the room goes out.\n\nWhen they light again, you understand how the Order works its magic. It is not your way, but you know it now."
 spn_order.0140.a:0 "I am a Mage now"
 spn_order.0140.b:0 "I have learned what the Order can teach me"
 spn_order.0141.t:0 "Raised to Medicum"
 spn_order.0141.desc:0 "Your [spn_temple_magus|E] names you [Glossary('Medicum','spn_gloss_medicum')] before the whole chapter. From now on you will teach the acolytes.\n\nThe question is how."
 spn_order.0141.a:0 "Hard, as I was taught"
 spn_order.0141.b:0 "Patiently"
 spn_order.0143.t:0 "The Mask of the Temple"
 spn_order.0143.desc:0 "You are the [spn_temple_magus|E] now. The mask on the wall is yours.\n\nThe motto of the [spn_order|E] has three words: Silence, Subservience, Observance. Every temple chooses which it keeps above the others."
 spn_order.0143.a:0 "Silence"
 spn_order.0143.b:0 "Subservience"
 spn_order.0143.c:0 "Observance"
 spn_order_way_silence_tt:0 "Your members carry Esoteric Studies with a guard against schemes. Nobody here talks."
 spn_order_way_subservience_tt:0 "Your members gain +2 [spn_order_standing|E] more every year. Rank is respected here."
 spn_order_way_observance_tt:0 "Your members carry Esoteric Studies with +1 [learning|E], and your rituals go better. Every rite is kept."
 spn_order.0144.t:0 "A Seat Among the Masks"
 spn_order.0144.desc:0 "You hold a seat on the [spn_gnostic_council|E] now. The masks around the table notice people like you.\n\nSome serve them quietly. Some want the chair at the head of the table."
 spn_order.0144.a:0 "I will serve"
 spn_order.0144.b:0 "One day, the chair will be mine"
 spn_order.0150.t:0 "The Rite of the Chapter"
 spn_order.0150.desc:0 "Once a year the chapter gathers behind closed doors to raise those who are ready. The masks stand in a ring, the names are read out, and the room waits for you.\n\n"
 spn_order.0150.desc_medicum:0 "[spn_yr_to_medicum.GetTitledFirstName] has served long enough to be raised to Medicum. [spn_yr_to_medicum.GetSheHe|U] has kept every word so far.\n\n"
 spn_order.0150.desc_magistratus:0 "[spn_yr_to_magistratus.GetTitledFirstName] is ready to become a [Glossary('Magistratus','spn_gloss_magistratus')], one of the few who speak for the temple when you are away.\n\n"
 spn_order.0150.desc_end:0 "As [spn_temple_magus|E], the choice is yours. Whoever you pass over is put forward again at next year's Rite."
 spn_order.0150.a:0 "Raise [spn_yr_to_medicum.GetFirstName] to Medicum"
 spn_order.0150.b:0 "Raise [spn_yr_to_magistratus.GetFirstName] to Magistratus"
 spn_order.0150.c:0 "Raise them both"
 spn_order.0150.d:0 "Not this year"
 spn_order.0160.t:0 "An Outsider Asks Questions"
 spn_order.0160.desc_open:0 "A traveller in the tavern has been asking about the old chapel, and about the people who go there at night. Someone pointed [spn_os_who.GetHerHim] at you.\n\n"
 spn_order.0160.desc_hunter:0 "You know the name: [spn_os_who.GetTitledFirstName]. [spn_os_who.GetSheHe|U] hunts witches, and [spn_os_who.GetSheHe] is good at it."
 spn_order.0160.desc_stranger:0 "[spn_os_who.GetTitledFirstName] says [spn_os_who.GetSheHe] is a scholar who only wants to hear the old stories. You are not sure you believe it."
 spn_order.0160.fail.tt:0 "If you fail and [spn_os_who.GetFirstName] is a hunter, [spn_os_who.GetSheHe] learns who you are and where your temple meets."
 spn_order.0160.c:0 "Have [spn_os_who.GetHerHim] followed"
 spn_order.0160.c.tt:0 "If it works, you learn enough about [spn_os_who.GetFirstName] to hold over [spn_os_who.GetHerHim]."
 spn_order.0160.d:0 "Set the Adeptus Major on [spn_os_who.GetHerHim]"
 spn_order.0160.d.tt:0 "[spn_os_who.GetFirstName] is never seen again. The Adeptus Major will expect a favour in return."
 spn_order.0160.e:0 "Let [spn_os_who.GetHerHim] find nothing"
 spn_order.0160.e.tt:0 "There is nothing for [spn_os_who.GetHerHim] to find if no one goes to the chapel for a while."
 spn_order.0160.a:0 "Send [spn_os_who.GetHerHim] the wrong way"
 spn_order.0160.b:0 "Warn my Temple Magus"
 spn_order.0161.t:0 "The Relic That Would Not Sleep"
 spn_order.0161.desc:0 "One of the things in the temple's [spn_reliquary|E] has started to hum at night. The acolytes will not go near it."
 spn_order.0161.a:0 "I will quiet it"
 spn_order.0161.b:0 "Leave it be"
 spn_order.0162.t:0 "A Neophyte's Test Gone Wrong"
 spn_order.0162.desc:0 "One of the neophytes fell during the test of the coin. Nobody came for him, because nobody is supposed to help. You are the one who found him."
 spn_order.0162.a:0 "Carry him back"
 spn_order.0162.b:0 "The test is the test"
 spn_order.0163.t:0 "The Tutor's Quarrel"
 spn_order.0163.desc:0 "[spn_q_tutee.GetFirstName], the acolyte you have been teaching, has argued with you in front of the whole chapter. [spn_q_tutee.GetSheHe|U] thinks you are teaching [spn_q_tutee.GetHerHim] the wrong way."
 spn_order.0163.a:0 "Hear [spn_q_tutee.GetHerHim] out"
 spn_order.0163.b:0 "Put [spn_q_tutee.GetHerHim] in [spn_q_tutee.GetHerHis] place"
 spn_order.0170.t:0 "One of Us Is Known"
 spn_order.0170.desc:0 "Someone has learned that [spn_ex_who.GetTitledFirstName] wears the Blue Rose, and word is already moving.\n\n[spn_respondeo|E] spoken where it happened would make them forget."
 spn_order.0170.a:0 "I will go there myself"
 spn_order.0180.t:0 "Respondeo"
 spn_order.0180.desc:0 "[Glossary('Respondeo','spn_gloss_respondeo')]: the [spn_order|E]'s spell of forgetting. Said right, a whole county forgets what it saw, any hunter's trail here goes cold, and a member who was exposed here is forgotten again.\n\nIt takes power. An Obfuscation Powder can pay for it, your temple can share it with you, or you can pay it alone."
 spn_order.0180.a:0 "I will pay it alone"
 spn_order.0180.b:0 "The temple will pay it with me"
 spn_order.0180.c:0 "Not now"
 spn_order.0181.t:0 "The Chapter Calls on You"
 spn_order.0181.desc:0 "[spn_rs_caller.GetTitledFirstName] is casting [spn_respondeo|E] and needs the chapter's power to do it. Will you give yours?"
 spn_order.0181.a:0 "I give it"
 spn_order.0181.b:0 "Not this time"
 spn_order.0600.t:0 "A Petition for a Charter"
 spn_order.0600.desc:0 "[spn_ch_petitioner.GetTitledFirstName] asks the [spn_gnostic_council|E] for a charter: leave to found a new temple of the [spn_order|E] at [spn_ch_petitioner.GetHerHis] own seat, with [spn_ch_petitioner.GetHerHim] as its [spn_temple_magus|E]."
 spn_order.0600.a:0 "Grant it"
 spn_order.0600.b:0 "Refuse"
 spn_order.0610.t:0 "The Order Again"
 spn_order.0610.desc:0 "[spn_oa_founder.GetTitledFirstName] knows what you are. [spn_oa_founder.GetSheHe|U] has founded the [spn_order|E] again and wants you in it.\n\n"The temples are empty. We can fill them.""
 spn_order.0610.a:0 "I will join you"
 spn_order.0610.b:0 "No"
 spn_order.0700.t:0 "Tell Me About the Rose"
 spn_order.0700.desc:0 "Before the end, [spn_rose_member.GetTitledFirstName] said one thing you did not expect: a name for a temple, and a blue rose.\n\nThis was not one witch. [spn_rose_member.GetSheHe|U] belonged to something."
 spn_order.0700.a:0 "Then I will find the rest of them"
 spn_order.0710.t:0 "The Adeptus Major Moves"
 spn_order.0710.desc:0 "A stranger in a plain coat is waiting by your horse. [spn_am_agent.GetSheHe|U] knows your name, and the temple you have been asking about.\n\n"Take the gold and forget the house. Or stay, and we will make you forget it.""
 spn_order.0710.a:0 "Take the gold and forget the house"
 spn_order.0710.b:0 "Make me"
 spn_order.0800.t:0 "The Temple Sends You"
 spn_order.0800.desc:0 "A note with a blue rose: "The masks will be at the Summit. Go for us.""
 spn_order.0800.errand_recover:0 "\n\nThe [spn_order_prerogative|E] is to recover what was lost. Keep your eyes on who carries what."
 spn_order.0800.errand_silence:0 "\n\nThe [spn_order_prerogative|E] is silence. Say nothing that could be repeated."
 spn_order.0800.errand_book:0 "\n\nThe [spn_order_prerogative|E] is the book. Listen for anyone who talks about pages."
 spn_order.0800.errand_grow:0 "\n\nThe [spn_order_prerogative|E] is more hands. Find the young ones with the gift."
 spn_order.0800.errand_pit:0 "\n\nThe [spn_order_prerogative|E] is to treat with the Pit. If a demon comes to the Summit, be polite."
 spn_order.0800.errand_none:0 "\n\nBe seen by the right people."
 spn_order.0800.a:0 "I will go for the Order"
 spn_order.0800.b:0 "I have my own affairs"
 spn_order.0815.t:0 "A Brother Is Dying"
 spn_order.0815.desc:0 "[spn_tr_asker.GetTitledFirstName] is gravely ill, and has come to the temple to ask for the [spn_order_transference|E]. Five would have to carry the illness with [spn_tr_asker.GetHerHim]: members of the temple who are willing, or townsfolk paid for their part."
 spn_order.0815.a:0 "We will find the blood"
 spn_order.0815.b:0 "The temple cannot spare it"
 spn_order.0820.t:0 "The Temple Asks for Your Blood"
 spn_order.0820.desc:0 "[spn_tb_patient.GetTitledFirstName] is dying. The temple needs five to carry what is killing [spn_tb_patient.GetHerHim], each a fifth of it, for five years.\n\nIf anyone who carries it is killed before then, the illness goes back where it came from."
 spn_order.0820.a:0 "Take my blood"
 spn_order.0820.b:0 "The temple has its five"
 spn_order.0820.c:0 "Not mine"
 spn_order.0822.t:0 "Not Enough Blood"
 spn_order.0822.desc:0 "The ritual cannot go ahead. Fewer than five came, or the one it was for is beyond its help now. You send them home."
 spn_order.0822.desc_spent:0 "Five came, but you have no power left to spend. The temple is spent, and the [spn_order_transference|E] cannot be done."
 spn_order.0822.a:0 "Another time"
 spn_order.0823.t:0 "Ex Tenebris Lux"
 spn_order.0823.desc:0 "From the darkness, into the light. The five stand in a circle around [spn_tw_patient.GetTitledFirstName], joined by chains of mercury. You begin the words.\n\nThe illness has to go somewhere. Tonight it goes into them."
 spn_order.0823.a:0 "Begin the ritual"
 spn_order.0823.b:0 "I have nothing left to give it"
 spn_transference_lean_tt:0 "The better your [learning|E], the likelier it holds. A [spn_temple_magus|E] does better, and so does a temple that keeps Observance. If it fails, something may come through."
 spn_order.0824.t:0 "The Fever Breaks"
 spn_order.0824.desc:0 "You wake up and the pain is gone. Five people you hardly know are carrying it now, a little each.\n\nIf one of them is killed, it comes back."
 spn_order.0824.a:0 "I owe them my life"
 spn_order.0825.t:0 "The Flow Breaks"
 spn_order.0825.desc:0 "Halfway through the words, the mercury snaps. Something hits you in the chest and throws you across the room.\n\nThe patient is still sick. You are hurt."
 spn_order.0825.a:0 "It did not hold"
 spn_order.0826.t:0 "A Rift Opens"
 spn_order.0826.desc:0 "Where the circle was, the floor is burned black, and the air smells of sulphur.\n\nSomething came through. It knows your name, and it is hunting you."
 spn_order.0826.a:0 "God help me"
 spn_order.0828.t:0 "The Transference Unravels"
 spn_order.0828.desc:0 "One of the five who carried the illness has been killed. Everything they carried comes back at once."
 spn_order.0828.desc_wolf:0 "\n\nThey found the body in the morning. Its heart was gone."
 spn_order.0828.a:0 "It is back"
 spn_order.0829.t:0 "The Wolves Have Teeth"
 spn_order.0829.desc:0 "A wolf killed one of the five who carried a ritual of your temple. The [spn_order_transference|E] is undone."
 spn_order.0829.desc_member:0 "A wolf killed one of your temple. The [spn_order|E] and the packs have been at war before."
 spn_order.0829.a:0 "Let the hunters find it"
 spn_order.0829.b:0 "I will remember"
 spn_order.0831.t:0 "The Necromancer Comes Back"
 spn_order.0831.desc:0 "[spn_bg_necro.GetTitledFirstName] was cast out for what [spn_bg_necro.GetSheHe] does with the dead. Now [spn_bg_necro.GetSheHe] is dying, and has brought [spn_bg_item.GetName] to pay for a [spn_order_transference|E].\n\nThe [spn_order_old_law|E] says no."
 spn_order.0831.a:0 "Find five who will carry it"
 spn_order.0831.c:0 "We cannot do it now"
 spn_order.0831.b:0 "The law is the law"
 spn_order.0832.t:0 "The Old Law Was Broken"
 spn_order.0832.desc:0 "[spn_ol_breaker.GetTitledFirstName] healed a necromancer, and took payment for it. It is against the [spn_order_old_law|E], and you are the one who must answer it."
 spn_order.0832.a:0 "Cast [spn_ol_breaker.GetHerHim] out"
 spn_order.0832.b:0 "Let it pass"
 spn_order.0840.t:0 "The Most Secret Spell"
 spn_order.0840.desc:0 "The oldest member of the [spn_gnostic_council|E] takes you aside. He has brought the letter, the [Glossary('Fors Factorum','spn_gloss_fors_factorum')] in the founders' own hand. "There is one spell we do not teach. It lets you work magic without paying for it, for a few years."\n\n"Then it takes its price from your body, like a cancer. Do you still want it?""
 spn_order.0840.a:0 "Cast it"
 spn_order.0840.b:0 "Some prices are too high"
 spn_order.0842.t:0 "It Was Always the Price"
 spn_order.0842.desc:0 "The physician finds the lump and does not meet your eyes.\n\nThe [spn_order_fors_factorum|E] was never free. It was only late. The spell does not leave you. Neither will this."
 spn_order.0842.a:0 "I knew"
 spn_order.0850.t:0 "The Adepti Call You"
 spn_order.0850.desc:0 "The [spn_order_adepti|E] work outside the temples, for the whole [spn_order|E]. They want you.\n\nYou would still belong to your chapter, but you would answer to more than one master."
 spn_order.0850.a:0 "I will work outside the temple"
 spn_order.0850.b:0 "My place is in my chapter"
 spn_order.0900.t:0 "A Demon at the Temple Door"
 spn_order.0900.desc:0 "[spn_dm_demon.GetTitledFirstName] is standing at the door of the temple, and the candles have all turned toward [spn_dm_demon.GetHerHim].\n\n"Demons are old. We know where the temples are. I came to talk.""
 spn_order.0900.a:0 "We will hear your terms"
 spn_order.0900.b:0 "Rule One. Go"
 spn_order.0900.c:0 "Kneel before the ring"
 spn_order.0901.t:0 "Bound by the Ring"
 spn_order.0901.desc:0 "The ring on the master's hand is older than you are. You knew it the moment you saw it.\n\nYou kneel. You do not choose to."
 spn_order.0901.a:0 "..."
 spn_order.0910.t:0 "The Favor Is Called"
 spn_order.0910.desc:0 "The [spn_order|E] lent you something. Now it wants something back. [spn_fv_lender.GetTitledFirstName] has sent word."
 spn_order.0910.task_recover:0 "\n\n"Bring us a thing of power from someone who is not ours.""
 spn_order.0910.task_silence:0 "\n\n"A county remembers one of ours. Make it forget.""
 spn_order.0910.task_book:0 "\n\n"Tell us where a page is.""
 spn_order.0910.task_grow:0 "\n\n"Bring us a child who has the Source.""
 spn_order.0910.task_pit:0 "\n\n"Teach us something only the Pit knows.""
 spn_order.0910.a:0 "It is done"
 spn_order.0910.b:0 "I owe the Order nothing"
 spn_order.0940.t:0 "The Order's Prerogative"
 spn_order.0940.desc:0 "As master of the [spn_order|E], you decide what the temples work toward for the next ten years. Members who serve it gain [spn_order_standing|E]."
 spn_order.0940.a:0 "Recover what was lost"
 spn_order.0940.b:0 "Silence"
 spn_order.0940.c:0 "The book must be found"
 spn_order.0940.d:0 "More hands"
 spn_order.0940.e:0 "Treat with the Pit"
 spn_order_prerogative_recover_tt:0 "Pledging a relic, winning one in war, taking the Seal of Solomon or drawing a page earns standing."
 spn_order_prerogative_silence_tt:0 "Casting Respondeo, throwing the Powder and a year with no member exposed earn standing. An exposed member loses more."
 spn_order_prerogative_book_tt:0 "Hearing where a page is, drawing a page or opening the Black Stone earns standing."
 spn_order_prerogative_grow_tt:0 "Tutors earn more, every chapter makes four Selection picks a year, and a charter can be asked for sooner."
 spn_order_prerogative_pit_tt:0 "Rule One is lifted. A Compact costs the master nothing, and a demon's favor pays its lender."
 spn_order.0960.t:0 "The Masks Bow to You"
 spn_order.0960.desc:0 "You hold the chair of the [spn_gnostic_council|E] now. A few of the people around the table wear masks you have not seen before, and one of them leaves a blue rose by your hand.\n\n"We would like you to be one of us.""
 spn_order.0960.a:0 "Then I will wear the mask"
 spn_order.0960.b:0 "I will not wear the mask"
 spn_order.0963.t:0 "The Chair of the Grand Magus"
 spn_order.0963.desc:0 "You are the Grand Magus, and you belong to the [spn_order|E]. For as long as you hold the chair, you are its master.\n\nThe temples will ask you what they are working toward."
 spn_order.0963.a:0 "Let me tell them"
 spn_order.0971.t:0 "The Council Calls You"
 spn_order.0971.desc:0 "A seat on the [spn_gnostic_council|E] is empty, and the Grand Magus has offered it to you."
 spn_order.0971.a:0 "I will take the seat"
 spn_order.0971.b:0 "Not now"
 spn_order.0141.a_tt:0 "Your acolytes gain more [spn_order_standing|E] each year, and like you less."
 spn_order.0141.b_tt:0 "Your acolytes like you more."
 spn_order.0960.b.tt:0 "You give up the chair. The temples of the Order will choose a Grand Magus of their own."
 spn_order.0975.t:0 "Dissolve the Gnostic Council"
 spn_order.0975.desc:0 "You call the council together and tell them plainly: you are dissolving the Gnostic Council.\n\nThe Chancellor goes white. Someone's cup stops halfway to his mouth. "Dissolve, Grand Magus?"\n\nYou let the silence go on a moment longer than you need to. "The council. Not the councillors.""
 spn_order.0975.a:0 "The council. Only the council."
 spn_order.0975.a.tt:0 "Every seat on the [spn_gnostic_council|E] falls empty. The next Conclave fills them."
 spn_order.0975.b:0 "On second thought, leave it be"
 spn_order.0108.t:0 "A Name for the Rose"
 spn_order.0108.desc:0 "The masks bring you a name: [spn_sel_pick.GetTitledFirstName]. They have watched [spn_sel_pick.GetHerHim] for a year. They think [spn_sel_pick.GetSheHe] has what the [spn_order|E] looks for.\n\nThe note and the rose are ready. Only you can send them."
 spn_order.0108.a:0 "Send the rose"
 spn_order.0108.a.tt:0 "The Order reaches out to [spn_sel_pick.GetFirstName]. If [spn_sel_pick.GetSheHe] answers, the tests begin."
 spn_order.0108.b:0 "Not this one"
 spn_order.0108.b.tt:0 "[spn_sel_pick.GetFirstName] will not be called for five years."
 spn_order.0108.c:0 "Send it, and let the masks choose from now on"
 spn_order.0108.c.tt:0 "Notes go out without asking you. You can take the choice back with a decision."
 spn_order.0090.t:0 "A Name You Have Heard Before"
 spn_order.0090.desc_scholar:0 "Two old scholars are arguing over their wine about something one of them once read. He says a name: the [Glossary('Hermetic','spn_gloss_hermetic')] Order of the Blue Rose. The other laughs at him, a little too loudly, and changes the subject.\n\nYou are sure you have heard that name before. You cannot remember where."
 spn_order.0090.desc_merchant:0 "A merchant who sells rare books mentions a customer who only buys very old ones. "Pays in good silver and never haggles. Wears a little blue rose pinned inside his coat. Some kind of order, he said. The Hermetic something."\n\nThe name stays with you all evening. You have heard it somewhere before."
 spn_order.0090.desc_priest:0 "Your confessor is uneasy tonight. Someone asked him about you: whether you read, what you read, whether you can keep a secret. "They left this," he says, and puts a blue rose on the table between you. "I hope I did nothing wrong."\n\nYou have seen a rose like that before. You are almost sure of it."
 spn_order.0090.a:0 "Remember the name"
 spn_order.0090.a.tt:0 "If they ever come for you, you will know them, and you will know how their tests go."
 spn_order.0090.b:0 "It means nothing"
 spn_order.0090.b.tt:0 "Nothing changes. They may come anyway."
 spn_order.0090.c:0 "Ask around about it"
 spn_order.0090.c.tt:0 "With a careful hand, someone will notice the right kind of curiosity. With a clumsy one, nothing comes of it."
 spn_order.0090.c.success:0 "Someone Noticed"
 spn_order.0090.c.success_desc:0 "A stranger thanks you for your interest. You will be hearing from friends."
 spn_order.0090.c.failure:0 "The Trail Goes Cold"
 spn_order.0090.c.failure_desc:0 "Nobody will talk about it, and the people you asked swear they never heard the name."
 spn_order.0095.t:0 "The Rose Talks"
 spn_order.0095.desc:0 "It takes longer than you expected. [recipient.GetFirstName] is more afraid of the people in masks than of you.\n\nIn the end [recipient.GetSheHe] gives you the names [recipient.GetSheHe] knows, and there are not many. "Every temple keeps its own. Nobody knows more than a few faces. I swear it.""
 spn_order.0095.a:0 "Then you will name me to them"
 spn_order.0095.a.tt:0 "[recipient.GetFirstName] goes free and speaks for you. Your name will be near the top of the temple's next Selection."
 spn_order.0095.b:0 "Let [recipient.GetHerHim] go"
 spn_order.0095.b.tt:0 "[recipient.GetFirstName] goes free. The [spn_order|E] will learn what [recipient.GetSheHe] said."
 spn_order.0095.c:0 "Keep [recipient.GetHerHim] where [recipient.GetSheHe] is"
 spn_order.0310.t:0 "The Words"
 spn_order.0310.desc:0 "Your tutor gives you a page of words in a language nobody speaks any more, and tells you to say them every night until they stop sounding strange.\n\n"They will not work for a long time," your tutor says. "That is not the point. The point is that you keep saying them.""
 spn_order.0310.a:0 "Every night, without fail"
 spn_order.0310.a.tt:0 "You come a year closer to the end of your teaching, at some cost to your sleep."
 spn_order.0310.b:0 "Ask what they mean"
 spn_order.0310.b.tt:0 "You learn what the words mean, but you come no closer to the end of your teaching."
 spn_order.0311.t:0 "The Candle That Would Not Go Out"
 spn_order.0311.desc:0 "Tonight, when you finish the words, the candle in front of you does not go out. It burns brighter, then green, then normal again.\n\nYour hands are shaking. Nobody else saw it."
 spn_order.0311.a:0 "Try again at once"
 spn_order.0311.a.tt:0 "You may come closer to the end of your teaching."
 spn_order.0311.b:0 "Tell my tutor"
 spn_order.0311.b.tt:0 "Your tutor will be pleased you said so."
 spn_order.0320.t:0 "The First Lesson"
 spn_order.0320.desc_tutee:0 "Your tutor is [spn_tp_tutor.GetTitledFirstName]. The first thing [spn_tp_tutor.GetSheHe] does is take your books away.\n\n"You will have them back when you can tell me why you wanted them. Until then you listen, you watch, and you say nothing. Those are the three words. Learn them first.""
 spn_order.0320.desc_tutor:0 "The temple has given you an acolyte: [spn_tp_tutee.GetTitledFirstName]. Eager, and a little afraid of you, which is right.\n\nWhat kind of teacher will you be?"
 spn_order.0320.a:0 "I will listen"
 spn_order.0320.a.tt:0 "Your tutor will think well of you."
 spn_order.0320.b:0 "I will read in secret"
 spn_order.0320.b.tt:0 "You learn something. Your tutor need not know."
 spn_order.0320.c:0 "Hard, as I was taught"
 spn_order.0320.d:0 "Patiently"
 spn_order.0321.t:0 "The Errand"
 spn_order.0321.desc:0 "[spn_tp_tutor.GetTitledFirstName] hands you a sealed letter and an address on the wrong side of the city. "Deliver it into the hand of the man who opens the door. Do not read it. Do not be seen."\n\nYou get there after dark. The house is watched."
 spn_order.0321.a:0 "Go round by the roofs"
 spn_order.0321.b:0 "Walk straight past the watchers"
 spn_order.0321.c:0 "Bring the letter back"
 spn_order.0321.c.tt:0 "Your tutor will be disappointed."
 spn_order.0321.success:0 "Delivered"
 spn_order.0321.success_desc:0 "The letter is in the right hands, and nobody saw you. Your tutor nods, which is high praise."
 spn_order.0321.failure:0 "Seen"
 spn_order.0321.failure_desc:0 "You got the letter through, but someone saw your face. You will not sleep well for a while."
 spn_order.0321.failure_hurt:0 "Caught"
 spn_order.0321.failure_hurt_desc:0 "The watchers caught you in the alley. You got the letter through, but not without a beating."
 spn_order.0322.t:0 "Two Heads Over One Problem"
 spn_order.0322.desc:0 "One of you is deep in a piece of magical research that will not come right. The other has been reading over a shoulder for a week.\n\nSomething in the margins catches your eye."
 spn_order.0322.a:0 "Work on it together"
 spn_order.0322.a.tt:0 "The research in progress gains a breakthrough's worth of progress at once. The acolyte gains [spn_order_standing|E] and learning."
 spn_order.0322.b:0 "It is not my work"
 spn_order.0322.b.tt:0 "Nothing changes."
 spn_order.0323.t:0 "The Lesson Returned"
 spn_order.0323.desc_tutee:0 "You show [spn_tp_tutor.GetTitledFirstName] a way of saying the third line that you worked out alone. [spn_tp_tutor.GetSheHe|U] is quiet for a long time.\n\n"I was taught it wrong," [spn_tp_tutor.GetSheHe] says at last. "And I have been teaching it wrong for twenty years.""
 spn_order.0323.desc_tutor:0 "Your acolyte, [spn_tp_tutee.GetTitledFirstName], shows you a way of saying the third line that you were never taught. It is better than yours.\n\nYou are quiet for a long time."
 spn_order.0323.a:0 "We learn from each other"
 spn_order.0323.a.tt:0 "Both of you learn something. The acolyte gains [spn_order_standing|E]."
 spn_order.0324.t:0 "Late Lessons"
 spn_order.0324.desc:0 "The lessons run later and later. Tonight neither of you has looked at the book for an hour.\n\nThe Order has rules about many things. This is not one of them."
 spn_order.0324.a:0 "Let it happen"
 spn_order.0324.a.tt:0 "You become lovers."
 spn_order.0324.b:0 "Keep it to the lessons"
 spn_order.0324.b.tt:0 "You keep to the lessons, and respect each other more for it."
 spn_order.0330.t:0 "The Temple Helps"
 spn_order.0330.desc:0 "A Magistratus of your temple comes to your study with a lantern and no questions. By morning your notes are covered in a second hand.\n\n"You were close," they say. "Closer now.""
 spn_order.0330.a:0 "I owe you"
 spn_order.0330.a.tt:0 "Your current Magical Research gains a breakthrough's worth of progress."
 spn_order.0860.t:0 "The Making"
 spn_order.0860.desc:0 "The Magistrati of your temple gather in the cellar. A golem can be shaped from clay, carved from wood or forged from iron. Clay costs nothing more and makes the weakest servant. Iron costs a fortune and makes the strongest.\n\nThe words for this are older than the Order. Whatever you choose, it will take months."
 spn_order.0860.a:0 "Shape it from clay"
 spn_order.0860.a.tt:0 "It costs nothing more. The making ends in a few months."
 spn_order.0860.b:0 "Carve it from wood"
 spn_order.0860.b.tt:0 "Costs 100 gold. The golem will be a better fighter than one of clay."
 spn_order.0860.c:0 "Forge it from iron"
 spn_order.0860.c.tt:0 "Costs 300 gold, and takes longer. The golem will be the best fighter the Order knows how to make."
 spn_order.0861.t:0 "The Golem Wakes"
 spn_order.0861.desc_success:0 "On the last night it sits up.\n\nIt looks at you with eyes you shaped, and waits to be told what to do."
 spn_order.0861.desc_failure:0 "On the last night it cracks from top to bottom. Months of work, and nothing to show for it."
 spn_order.0861.a:0 "It serves me"
 spn_order.0861.a.tt:0 "The golem is yours. It obeys you and no one else."
 spn_order.0861.c:0 "It serves the temple"
 spn_order.0861.c.tt:0 "You give it to your [spn_temple_magus|E], to guard the temple and to send where the Order needs it. The temple will remember the gift."
 spn_order.0861.b:0 "Sweep it up"
