l_german:
 spn_zecchia.0001.t:0 "A Thief Answers"
 spn_zecchia.0001.desc:0 "The circle flares and a woman steps out of it, brushing ash off her sleeves. She looks around your room like she is pricing it.\n\n"I'm Zecchia. I take things. You called, so you want something taken.""
 spn_zecchia.0001.desc_seal:0 "\n\nHer eyes go to the ring on your hand, and stay there. "Nice ring," she says, and takes a step back."
 spn_zecchia.0001.a:0 "Name your price"
 spn_zecchia.0001.b:0 "Go back where you came from"
 spn_zecchia.0005.t:0 "A Name in the Margin"
 spn_zecchia.0005.desc:0 "Someone wrote in the margin of the grimoire, in a small, careful hand: a name, and how to call her.\n\n"Zecchia. She takes things. Pay her what she asks.""
 spn_zecchia.0005.a:0 "I will remember it"
 spn_zecchia.0010.t:0 "How Much Will You Take?"
 spn_zecchia.0010.desc:0 "Zecchia sits on the edge of your table. "One thing, or five. The more you want, the more you pay. A hundred gold for each thing now, and more if what I bring is fine.""
 spn_zecchia.0010.price_wine:0 "\n\n"And I want a drink with you after. A long one.""
 spn_zecchia.0010.price_cloak:0 "\n\n"And I want something of yours. Something you like.""
 spn_zecchia.0010.price_hair:0 "\n\n"And I want a lock of your hair." She smiles. "Don't ask.""
 spn_zecchia.0010.desc_seal:0 "\n\nShe keeps glancing at your ring."
 spn_zecchia.0010.desc_seal_told:0 "\n\n"Something for free. There's a ring in [spn_zt_seal.GetName] I won't go near. Thought you should know what I'm afraid of.""
 spn_zecchia.0010.desc_council:0 "\n\nThe [spn_gnostic_council|E] will pay her fee."
 spn_zecchia.0010.a:0 "One thing"
 spn_zecchia.0010.b:0 "Two things"
 spn_zecchia.0010.c:0 "Three things"
 spn_zecchia.0010.d:0 "Four things"
 spn_zecchia.0010.e:0 "Five things"
 spn_zecchia.0010.f:0 "The Council will pay"
 spn_zecchia.0010.g:0 "Who hired you against me?"
 spn_zecchia.0010.h:0 "Forget it"
 spn_zecchia_job_tt:0 "Send her after someone's treasures with the interaction Send Zecchia After Their Treasures. She comes back in ninety days."
 spn_zecchia.0020.t:0 "Zecchia Delivers"
 spn_zecchia.0020.desc:0 "Zecchia drops a sack on your table and takes her fee. "[spn_zd_target.GetFirstName] won't miss them for a day or two.""
 spn_zecchia.0020.desc_council:0 "\n\nThe [spn_gnostic_council|E]'s treasury paid her."
 spn_zecchia.0020.a:0 "Good work"
 spn_zecchia.0030.t:0 "Zecchia Is Getting Bored"
 spn_zecchia.0030.desc:0 "Zecchia has been lying on your bed for three months, eating your food. "You haven't told me whose house to rob. I'm getting bored.""
 spn_zecchia.0030.a:0 "I will name them now"
 spn_zecchia.0030.b:0 "Forget it"
 spn_zecchia.0030.c:0 "I want more than we agreed"
 spn_zecchia.0030.c_tt:0 "She takes what she wants from you instead, and leaves."
 spn_zecchia.0030.c_seal_tt:0 "She looks at your ring, and grins, and agrees."
 spn_zecchia.0040.t:0 "The Ledger Does Not Lie"
 spn_zecchia.0040.desc:0 "The Chancellor's ledger shows a payment from the [spn_gnostic_council|E]'s treasury to someone with no name. [spn_zd_hirer.GetTitledFirstName] made it, and the money paid a demon to steal."
 spn_zecchia.0040.a:0 "Take [spn_zd_hirer.GetHerHis] seat"
 spn_zecchia.0040.b:0 "I will remember this"
 spn_zecchia.0040.c:0 "Let it go"
 spn_zecchia.0030.c_seal_leave_tt:0 "She looks at your ring again, shrugs, and goes back where she came from with nothing."
