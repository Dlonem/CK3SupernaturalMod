l_german:
 ev11.80.desc:0 "You sense that you've crossed some kind of boundary - a form of camouflage spell combined with various protective enchantments that likely guard this place. Yet the spells haven't reacted to you in any way, so it seems you're not being treated as an intruder. In the distance, you see a peculiar landscape and the silhouette of a monumental castle. This must be the academy you've been searching for."
 ev11.80.0.a:0 "I'll go on alone from here."
 almanach_name:0 "Almanach"
 ev11.81.desc:0 "It seemed the academy was still some distance away, yet before long you reached a gate that opened before you. Inside, in the antechamber, a figure was waiting - it opened its eyes as you approached.\n'Welcome, [ROOT.Char.Custom('GetProperWitchDesc')]' - the figure bowed stiffly, its voice striking you as completely devoid of emotion - 'I am Almanach, the caretaker of this place.'"
 ev11.81.desc2:0 "It's a pleasure to meet you."
 ev11.81.desc2a:0 "'$ev11.81.desc2$'"
 ev11.81.desc2b:0 "'Hm, the archmage in person - I've heard of you. $ev11.81.desc2$'"
 ev11.81.desc2c:0 "'[ROOT.Char.GetTitledFirstNameNoTooltip], a member of the High Council of Mages? I've heard of you. $ev11.81.desc2$'"
 ev11.81.desc3:0 "'It used to be an academy, though we still call it that. Today it is more of a library and an archive - a place where a mage may seek answers to their questions or develop their skills, though mostly on their own. We haven't trained adepts in a long time, although some mages do arrive with their apprentices to make use of the... conditions here, and the scholarly resources. But in truth, this place is abandoned for the most part, and we rarely have visitors.'"
 ev11.81.desc4:0 "'I don't work for anyone. I am here because my creators gave me this purpose. Yes, it may be hard to believe, but I am not human. I am a construct, tasked with maintaining order in this place. You could say I gain nothing from it except a sense of satisfaction - but that is more than enough for me.'"
 ev11.81.desc5:0 "'There once existed an advanced civilization whose development was built upon magic. The place we stand in was an important outpost of that civilization, and it even managed to survive its downfall. Later, there were attempts to turn it into a school for mages - an effort to preserve knowledge that would otherwise have been lost. And in truth, most of it was lost. Over time, the few mages who tended to the Academy turned against one another. Now the complex is no longer in use, though much of the old knowledge can still be found here.'"
 ev11.81.desc6:0 "'My information is incomplete, but it appears that someone summoned a powerful demon that destroyed Erum, the capital of the Great Magocracy. At the same time, many wonders of that era's magical engineering were lost, and most of the mages who existed then perished. As I said, I do not know the full circumstances of those events, though I have heard many speculations. You may find some of them in our libraries.'"
 ev11.81.0.a:0 "So this is the Academy of Magic?"
 ev11.81.0.b:0 "Actually, who do you work for?"
 ev11.81.0.c:0 "I'll look around a bit."
 ev11.81.0.d:0 "Who built this place?"
 ev11.81.0.e:0 "Why did that civilization fall?"
 ev11.82.desc:0 "'Of course, our collections are at your disposal. We have no formal rules or statutes, but I must warn you that any attempt to damage objects, steal them, or use violence in any form will trigger the defensive spells in this place. Additionally, for your own safety, I advise against trying to force open any doors that are locked, warded with runes, invisible, bricked up, or otherwise sealed. Many sections are closed off, as they may contain still-active unstable spells or unfinished experiments. That is all, I believe. Have a pleasant day.'\nThe construct closed its eyes - evidently, the conversation was over."
 ev11.82.0.a:0 "Well, I'll be careful."
 ev11.83.desc:0 "As you wander through the castle's corridors, you quickly lose your way. The complex is vast, filled with strange exhibits that might be works of art or some kind of devices, though most of them are not magical. Yet magic can be felt everywhere - both as an aura lingering from ancient spells and as raw power, of which there seems to be an abundance in this place. From time to time, various sounds and faint noises reach your ears; once or twice you could have sworn you heard the echo of distant footsteps. It's possible you're not the only mage around."
 ev11.83.0.a:0 "Maybe I should follow those sounds."
 ev11.84.title:0 "History of Earth"
 ev11.84.desc:0 "At last you found a room that caught your interest. It wasn't the actual library yet, but there were many scrolls here, mostly maps. A few of them drew your attention: without a doubt you recognized the familiar outline of Eurasia and Africa - the latter larger than you expected. But that wasn't all: beyond the ocean lay other vast continents, as well as several sizable islands. With growing enthusiasm, you began sifting through the maps, arranging them - or so you believed - in chronological order. The lower the map's number, the more it differed from what you know. Could these maps depict other worlds? Alternate realities? Or perhaps Earth itself changed the shape of its continents so drastically over the ages?"
 ev11.84.0.a:0 "Fascinating!"
 ev11.85.desc:0 ""You've found a room that immediately caught your attention. It's a laboratory, long unused, yet filled with alchemical substances - including Aether! You could take a bit for yourself… assuming the protective spells in this place don't reduce you to ash for attempting theft."
 ev11.85.0.a:0 "I'll take so little that no one will notice."
 ev11.85.0.b:0 "No, but I'll examine this place."
 ev11.86.desc:0 "You've found a room marked as a workshop, filled with chaotic notes and a few tomes. One of them bears the title: Spells for Every Occasion. Curious, you began leafing through it and saw that the author had indeed compiled a great number of spells - though most of them seemed rather useless or outright absurd. Among them, you discovered one labeled: Will open any jar! Since there happened to be a sealed container in the room, you decided to give it a try."
 ev11.86.0.a:0 "Okay, here goes!"
 ev11.87.desc:0 "At first you thought the spell had no effect at all, but moments later a two-meter-tall beast materialized before you. Its stench hit you, followed by a menacing roar that forced you to leap back. The creature grabbed the jar with one of its limbs and, with a single jerk, opened it - then vanished just as quickly as it had appeared."
 ev11.87.0.a:0 "This... could be... quite useful."
 ev11.87.0.b:0 "No jar can resist my power!"
 ev11.88.title:0 "The Grand Library"
 ev11.88.desc:0 "You've finally managed to find the proper library. The sheer number of books is impressive, but you were truly shocked to discover that this is only one of many library corridors! At its far end lies a junction leading to more - interwoven with chambers, storage rooms, archives, and scriptoria. Admittedly, most of these books are unreadable to you, written in various, often forgotten languages. Yet many of them you can recognize and understand."
 ev11.88.0.a:0 "Those are the Pnakotic Manuscripts!"
 ev11.88.0.b:0 "I've always wanted to read The Revelations of Glaaki."
 ev11.88.0.c:0 "The Books of Hsan? Time to start reading."
 ev11.88.0.d:0 "Ars Notoria and the Book of Enoch! Which one should I start with?"
 ev11.89.desc:0 "You've spent long hours poring over the books, and fatigue is starting to set in, yet your enthusiasm hasn't faded. Still, you need to focus and look for what you truly need."
 ev11.89.0.a:0 "I could use something on magical theory."
 ev11.89.0.b:0 "I need more materials on demonology."
 ev11.89.0.c:0 "Maybe I'll pick an alchemical treatise."
 ev11.89.0.d:0 "I saw a book on battle magic around here somewhere..."
 ev11.90.desc:0 "You spent the entire night in the library and part of the following day - you even had to use invigorating spells just to stay awake. Eventually, though, you decided you had gathered what you came here for. A seasoned scholar could easily spend half a lifetime in this place, but you believe you now know enough to put the knowledge you've gained to use."
 mr_visited_academy_modifier:0 "Visited the $building_mage_house$"
 mr_visited_academy_modifier_log_title:0 "$mr_visited_academy_modifier$"
 ev11.92.desc:0 "The final leg of your journey had to be made alone - this place exudes such an unsettling aura that your companions chose to stay at a safe distance. From the locals, you've learned that the temple is essentially abandoned, though several times a year strange sounds echo from within - chants or prayers, perhaps - and occasionally a suspicious priest or pilgrim is seen nearby. Well, today you are that pilgrim. If this place of power hides a secret, you are surely the one to uncover it."
 ev11.92.0.a:0 "I'll take a look around."
 ev11.93.desc:0 "The interior looks majestic, though somewhat unsettling. It doesn't resemble any other temple you've seen, though perhaps that's because of the silence here and the sense of isolation… or the aura of power that this place radiates. You get the impression that the reliefs on the walls follow you with their gaze - each one depicting one of three figures: the warrior, the father, and the sage. These are the three aspects of the Horned God. The ornate inscriptions surrounding the images look intriguing, as do the decorated doors leading to the main part of the temple."
 ev11.93.0.a:0 "I'll try to translate these inscriptions."
 ev11.93.1.a_ct:0 "You managed to decipher the inscriptions."
 ev11.93.2.a_ct:0 "You failed to decipher the inscriptions."
 ev11.93.0.b:0 "I'll take a closer look at these doors."
 ev11.94.desc:0 "You managed to decipher a few words. They speak of three trials: the Trial of Reason, the Trial of Courage, and the Trial of Bond. You're not entirely sure about the last one, since in an alchemical context 'bond' can also be understood as synthesis or synergy. Interesting - could that ambiguity be intentional? It seems these trials are connected to some kind of initiation or rite of passage, but you can't determine anything more specific."
 ev11.94.0.a:0 "Interesting. I'll check the door now."
 ev11.95.desc:0 "After several attempts to make sense of the text, you conclude that you can't extract anything meaningful from it. Perhaps it's a prayer? A description of the aspects of the Horned God? Or some kind of warning? You have no idea."
 ev11.95.0.a:0 "Hopefully I'll have better luck with the doors."
 ev11.96.title:0 "The First Trial"
 ev11.96.desc:0 "The doors appear to be locked, but there is a text upon them that you can read, as it is in fact a single passage repeated multiple times in different languages.\n\n"
 ev11.96.desc2:0 "#italic I have no mouth, yet my hunger is endless.\nI have no legs, yet I dance in finesse.\nI hold no life within me, yet I can grow.\nI have no shape, yet I'm instantly known.\nTell me: What am I?#!"
 ev11.96.0.a:0 "You are emptiness."
 ev11.96.0.b:0 "Hm, a plague."
 ev11.96.0.c:0 "Fire? You are fire."
 ev11.96.0.d:0 "My answer is: a storm."
 ev11.96.0.e:0 "Are you a dancing crippled beggar?"
 ev11.97.desc:0 "For a moment nothing happened, and then a spike shot up from the floor with a soft hiss, driving straight through your foot. Had you been standing exactly in the center instead of slightly to the side, it would have skewered you like a pig on a spit - though the pain is immense regardless. The spike retracts back into the floor, but you can't shake the feeling that the gate is now closed to you forever."
 ev11.97.0.a:0 "My... my leg..."
 ev11.97.0.a_ct:0 "#N The expedition is over.#!"
 ev11.97.0.b:0 "I'll blast these doors open with magic!"
 ev11.98.desc:0 "Though you did not find the knowledge or power you had hoped for, the expedition was not a complete waste of time. At the very least, you've learned that some places can be dangerous even for a mighty mage."
 ev11.98.0.a:0 "I will never come back here."
 mr_visited_horned_temple1_modifier:0 "Visited the $building_horned_god_house$"
 mr_visited_horned_temple2_modifier:0 "$mr_visited_horned_temple1_modifier$"
 mr_visited_horned_temple_modifier_log_title:0 "$mr_visited_horned_temple1_modifier$"
 ev11.99.desc:0 "Your spell struck the gate with tremendous force, only to rebound off it and come hurtling back at you! At the last moment you managed to raise a magical shield to block part of the energy, but the spell's power still slammed you to the ground."
 ev11.99.0.a:0 "Stupid riddles! Stupid doors!"
 ev11.100.desc:0 "For a moment nothing happened, and then the doors began to open slowly with a soft scrape, revealing what lay beyond. There was a corridor and two side chambers, though you found nothing of interest in either. You have to move on."
 ev11.100.0.a:0 "I sense something in this corridor."
 ev11.101.title:0 "The Second Trial"
 ev11.101.desc:0 "A knight appeared in the corridor. The figure did not respond to your words, but when you took a step forward, he drew his sword and advanced toward you. From the way he moves, you can tell he is an experienced - and potentially deadly - warrior. There is also something inhuman and relentless in his motions; you feel as though death itself has come for you."
 ev11.101.0.a:0 "Then let us cross blades!"
 ev11.101.0.a_ct:0 "You defeat the knight."
 ev11.101.0.b:0 "No, I'd better run!"
 ev11.103.desc:0 "It's hard to believe, but the warrior parried your spell with his sword! You're not entirely sure, but it seems your attempt at a magical attack only enraged him. You feel the chill of approaching death."
 ev11.103.0.a:0 "Hm, time to run!"
 ev11.104.desc:0 "Just as your swords were about to clash, the knight dissolved into a swirl of smoke and vanished without a trace. The force of your own swing nearly toppled you when the blade met no expected resistance, but you felt a wave of relief - and a kind of understanding. Clearly, the trial wasn't about winning the fight, but about accepting the challenge itself. The trial of courage! The path ahead now lies open before you."
 ev11.104.0.a:0 "I wonder what else awaits me here."
 ev11.106.title:0 "The Final Trial"
 ev11.106.desc:0 "Further on, you found something resembling an altar, but it turned out to be a cleverly concealed passage leading deeper inside. Behind the altar lay a strangely empty chamber - almost empty, as it held a pedestal with a chalice and two urns filled with some kind of liquids: one green, one red. There is no path beyond this point; could this be the end of your journey? The final trial?"
 ev11.106.0.a:0 "I'll take a closer look at it."
 ev11.107.desc:0 "You lean over the green liquid and immediately feel the fumes rising from it irritate your throat. There's no doubt it's some kind of poison - perhaps even an acid. You perform a quick test using the components you have on hand, and your suspicions are confirmed. This substance is deadly."
 ev11.107.0.a:0 "This is definitely not fit for drinking."
 ev11.108.desc:0 "From the second urn you catch a sweetish scent, and the liquid itself has a beautiful, deep red color. It looks a bit like blood, but it's definitely not - there's a faint phosphorescent glow to it."
 ev11.108.0.a:0 "I have no idea what this could be."
 ev11.108.0.b:0 "I know this! It's Scarlet Blight, a deadly poison."
 ev11.109.desc:0 "The chalice appears to be an ordinary drinking vessel. It seems that this is exactly what you're meant to do to complete the trial - take a drink. Unfortunately, you have a bad feeling about both liquids. But is it really worth risking your life for... well, for something you don't even truly understand?"
 ev11.109.0.a:0 "I'll drink the green liquid."
 ev11.109.0.b:0 "I'll drink the red liquid."
 ev11.109.0.c:0 "Uh... I'll drink both."
 ev11.109.0.d:0 "No, that's enough. I'm going home."
 ev11.109.0.e:0 "I'll fill this chalice with water from my waterskin!"
 ev11.109.0.a_ct:0 "The poison kills you."
 ev11.109.1.a_ct:0 "...or maybe it doesn't?"
 ev11.109.2.a_ct:0 "You survived, somehow."
 ev11.110.title:0 "Fatal Mistake"
 ev11.110.desc:0 "You take the first sip, and at first nothing happens. But soon you feel a wave of sickness; pain spreads through your body, and you collapse to the ground. All you can wish for is for the suffering to finally end."
 ev11.111.desc:0 "\nAfter a few moments - moments that feel like an eternity - the pain begins to fade. One poison has neutralized the other! It seems you will survive, though you're as weak as a child. Suddenly, a mighty voice echoes inside your mind: 'RISE, CHAMPION!'"
 ev11.111.0.a:0 "You honor me, my lord."
 ev11.111.0.b:0 "I serve no one, whoever or whatever you are."
 ev11.112.desc:0 "'YOU HAVE PASSED MY TRIALS' - the voice boomed like a lightning strike - 'YOU HAVE PROVEN YOUR WORTH. I BLESS YOU, CHAMPION. GO FORTH INTO THE WORLD AND BRING GLORY TO MY NAME.'\nYou feel a surge of unfamiliar energy wash over you, and with it comes knowledge - fragments of countless secrets woven into the fabric of the universe."
 ev11.112.0.a:0 "As you wish, my lord!"
 ev11.112.0.b:0 "I deserve more!"
 ev11.113.desc:0 "You leave the temple with a sense of triumph. You faced this place and survived. You have grown stronger and wiser."
 ev11.113.0.a:0 "My trials are over, but my story is far from finished."
 ev11.114.desc:0 "You feel a strange sensation, and suddenly a wave of pain tears through you - as if some trace of the toxin still lingered in your body. You grit your teeth, and after a moment the pain fades.\n'SO BE IT' - the voice roars with the force of a lightning strike - 'YOU STILL DESERVE MY REWARD, MY BLESSING.'\n$ev11.114.desc2$"
 ev11.114.desc2:0 "A strange power surges through your body, and in the next instant you realize you're standing before the riddle-gate again, speaking the word 'fire'. This time, however, nothing happens. You wonder whether what you experienced was some kind of vision or dream... yet the power you now feel within you seems undeniably real."
 ev11.114.0.a:0 "I have what I came for."
 ev11.115.desc:0 "You filled the chalice with water and drank it to the last drop, then set the vessel down with some hesitation. The ground trembled, and the liquid in both vats began to shudder ominously. Suddenly, a voice thundered inside your mind: 'IMPRESSIVE. AND THEY SAID YOUR KIND WAS RATHER DIM.'\nThe shaking slowly faded. Then you realized it hadn't been an earthquake at all-it was laughter. It seemed the deity dwelling here found you amusing.\n'YOUR CLEVERNESS WILL BE REWARDED' - the voice boomed with the force of a lightning strike - 'TAKE THIS POWER AND REMAKE THE WORLD. I WILL BE WATCHING.'"
 ev11.115.0.a:0 "Huff..."
 horned_god_favor_modifier:0 "Favor of the Horned God"
 horned_god_favor_modifier_desc:0 "The Horned God has anointed you as His favored champion, and His will shall be carried out through your hands - even when you are not aware of it."
 ev11.118.desc:0 "You examine the entrance gate carefully. It is sealed and appears utterly indestructible. Faint traces of some inscriptions linger on its surface, but time has eroded them far too deeply to make anything legible. A pity - it might have been an invocation, or perhaps instructions on how to open the gate. It seems that most of the temple is beyond your reach, and may remain so forever.\nEven so, the chamber you stand in feels saturated with an aura of power, and the hieroglyphs beneath several of the reliefs draw your attention. It is also a rather fitting place to rest, reflect, or meditate."
 ev11.118.0.a:0 "I will pray."
 ev11.118.0.b:0 "I will meditate."
 ev11.118.0.c:0 "I will examine the hieroglyphs."
 ev11.119.desc:0 "You spent some time in the temple and found that the atmosphere of this place helped you sort out a few things in your mind. You had hoped for something more, true, but it was not time wasted. You concluded that some hidden powers are indeed at work here, yet they lie dormant and hold no influence over you or the rest of the world."
 ev11.119.0.a:0 "It's time to move on."
 ev11.153.title:0 "The Seat of Baba Yaga"
 ev11.153.desc:0 "You've reached the area where the legendary hut on chicken legs is said to be located. The land is wild, desolate, and unwelcoming; it seems most travelers give this place a wide berth. It turned out you didn't need any local guide, as the aura of power surrounding this place was easy for you to sense. Pushing your way through bushes and thickets, the sight you had been expecting suddenly appeared before your eyes."
 ev11.153.0.a:0 "So the legends were true."
 ev11.153.0.b:0 "I thought it would be... more spectacular."
 ev11.154.desc:0 "You get the impression that the closer you approach, the more the leg supporting the hut bends, lowering it toward the ground. A good sign - climbing up a rope would have been troublesome. Up close, you notice that the hut's walls are covered in almost imperceptible runes, seemingly meant for protection or perhaps even offense. You can't decipher all of them, but the place itself radiates a very unusual aura, as if it didn't fully belong to this world. There's light inside - could Baba Yaga be home?"
 ev11.154.0.a:0 "I'll just knock on the door."
 ev11.155.desc:0 "'It's open!' - you hear a woman's voice as the door swings smoothly before you. A strong scent of herbs and a meal being prepared hits you immediately. A young woman bustles around the room - and you have to admit, she's quite attractive.\n'Good timing, dinner is almost ready' - she says, throwing you a quick glance."
 ev11.155.0.a:0 "They say Baba Yaga can take the form of a beautiful woman."
 sefia_name:0 "Sefia"
 ev11.156.desc:0 "'I've heard that rumor too' - the woman smiled mysteriously - 'If you wanted to design a spell to change your appearance, what kind of magical mechanism would you use?'"
 ev11.156.0.a:0 "The simplest way would be to create an illusion."
 ev11.156.0.b:0 "I'd use polymorphy."
 ev11.156.0.c:0 "Honestly, I have no idea."
 ev11.157.desc1:0 "'Not bad, but illusions are unstable and easy to see through' - the woman fell into thought.\n"
 ev11.157.desc2:0 "'Ah yes, polymorphy. That would be practical, but spells of that kind are very difficult, and if you mess something up, you might end up stuck in your new form longer than you'd like' - the woman fell into thought.\n"
 ev11.157.desc3:0 "'Yeah, if it were that simple, every sorcerer would change their appearance as often as their socks' - the woman fell into thought.\n"
 ev11.157.desc:0 "'If I wanted to change my appearance, I think I'd try to influence the thoughts of the people who see me. Distort their perception so they'd perceive me as someone else. But right now, you're seeing the real me. I'm not Baba Yaga - she's my grandmother. My name is Sefia.'"
 ev11.158.desc:0 "'Nice to meet you. Sit down, I'm serving dinner - I made it using my grandmother's recipe. She calls it 'Hansel and Gretel'. I think it's some kind of joke, but I have no idea what it means. Grandma can be so strange sometimes...'\nAfter a moment, a steaming platter lands in front of you, radiating an irresistible aroma."
 ev11.158.0.a:0 "It looks delicious!"
 ev11.158.0.b:0 "Actually... what kind of meat is this?"
 ev11.159.desc:0 "'A master of high gastromancy never reveals their secrets - well, except to their own granddaughter' - Sefia laughed - 'But everything here comes only from what can be found in this forest. I'm on good terms with the locals; they sometimes bring me this and that. Now then, enjoy your meal!'"
 ev11.160.desc:0 "The food is excellent, and the whole dinner passes in a rather carefree atmosphere. Sefia asks you for news from the outside world, and in return she shares a few local rumors. You do notice, however, that she avoids the topic of Baba Yaga; she only mentions that the old woman is rarely home, and Sefia takes care of the place in her absence. When you start asking more detailed questions, Sefia declares that she's tired. 'We'll talk tomorrow. You'll spend the night in the guest room - I'll show you the way.'"
 ev11.160.0.a:0 "Hmm, sure."
 ev11.161.desc:0 "Sefia wished you good night and left you in a large bedroom. It looks quite luxurious - in fact, it's strange that such a chamber fits inside a cottage that didn't seem nearly this big from the outside. The local magic must bend space somehow. You don't notice any magical traps here, though the whole hut radiates a power you don't fully understand. The bed looks inviting, but beside it stands a display case holding a small collection of books. Judging by the titles, merely owning some of them could get you burned at the stake."
 ev11.161.0.a:0 "No, I want to get a good night's sleep."
 ev11.161.0.b:0 "Looks like I'll be pulling an all-nighter with these books."
 ev11.162.desc:0 "The next day, right after breakfast, Sefia took you for a walk around the area. This time, the woman was ready to answer all of your questions.\n'Baba Yaga once entered a very complicated relationship with a certain deity. She believes that this deity placed some kind of curse on her, though on a good day she speaks of it as if it were a blessing. Still, I'm not sure whether it's truly a curse or simply an accidental consequence of getting involved with gods.'"
 ev11.162.0.a:0 "What deity is it?"
 ev11.162.0.b:0 "What does this 'curse' involve?"
 ev11.163.desc:0 "'His name is Cernunnos, though his followers call him the Horned God. He is a deity of light and darkness, day and night, animals and trees, though he has many other aspects as well. The local witches often consider him their patron, but the druids respect him too. Unlike my grandmother, who frequently calls him a bastard. She probably knows what she's talking about.'"
 ev11.163.0.a:0 "And the hut? Where did it come from?"
 ev11.164.desc:0 "'Grandmother possesses tremendous power, even though she never practiced sorcery in the usual way, though she does know some advanced spells. The forest and the hut obey her, and some of her wishes simply come true. And she doesn't die - she was already very old when I was born. It doesn't sound so bad, but the mark of the Horned God has a mental and emotional side as well. My grandmother is not the most stable person under the sun; she can be cruel, and I think that deep down she suffers greatly. I don't know whether it's because of the 'curse' or because of her memories. Or perhaps, on some level, those two things are the same.'"
 ev11.165.desc:0 "'You see, the deity's magic didn't affect only my grandmother, but also - though to a lesser degree - her entire family, as well as this place itself. Whatever happened to her either began or ended at the spot where the hut now stands. The whole area became saturated with a power that shaped Baba Yaga. A power that forged her into the being we know today.'"
 ev11.165.0.a:0 "Can the hut move?"
 ev11.165.0.b:0 "So the curse affects you as well?"
 ev11.166.desc:0 "'Grandmother can move the hut, but it always ends up returning here anyway. In some way, it's bound to this place.'"
 ev11.167.desc:0 "'Yes. The male descendants of Baba Yaga are usually either weaklings or brutes. The women, on the other hand, are magically gifted and long-lived. Sometimes they're not entirely right in the head, either. It's also said that every member of my family is damned, and that after death their souls wander the Earth instead of passing on to the afterlife. But perhaps that's only a rumor...' - you get the sense that Sefia grew sad as she said this."
 ev11.168.desc:0 "That evening, dinner was just as delicious as the night before, but Sefia also treated you to some spirits from Baba Yaga's cellar (yes, it turned out the hut doesn't need to touch the ground to have a spacious basement).\nMeanwhile, your conversation began to gather pace. Sefia is a skilled sorceress whose knowledge is downright astonishing, considering her age. You're convinced that the two of you have much to learn from one another."
 ev11.168.0.a:0 "What can you tell me about demons?"
 ev11.168.0.b:0 "Let's talk about alchemy!"
 ev11.169.desc:0 "As the two of you empty more and more bottles of wine, your conversations drift into increasingly absurd or abstract topics, but you're both having a wonderful time. It seems the alcohol is affecting you far more than it affects Sefia - that woman must have an iron constitution!"
 ev11.170.desc:0 "The next day, you wake up at some indeterminate hour with a pounding headache. In fact, you don't remember much from the previous evening at all. Wait - did Sefia try to teach you how to fly on a broom? That would explain why you're so bruised. But what happened afterward? You have the feeling Sefia told you something very important, yet you just can't recall it."
 ev11.170.0.a:0 "Did anything happen between us?"
 ev11.171.desc:0 "Suddenly you realize that Baba Yaga herself is standing in the doorway to the bedroom, glaring daggers at you.\n'I'm sure you have an excellent reason for sleeping in my bed, don't you?' - she said in an icy voice."
 ev11.171.0.a:0 "Sefia told me this was the guest room!"
 ev11.172.desc:0 "You realized your mistake the moment the words left your mouth. This bedroom looks similar, but it isn't the one Sefia showed you. Clearly, you didn't make it to the right room last night. Before you manage to stammer out an apology, one of Baba Yaga's spells hurls you straight out the window. It's a miracle you didn't break anything, though the landing was painful. You only hear her shout: 'Stay away from my granddaughter, you drunkard!'"
 ev11.172.0.a:0 "I don't think I'm going back for my pants..."
 ev11.172.0.b:0 "I think I'd better get out of here."
 ev11.173.desc:0 "As you walk away from the hut, you can't shake the feeling that something inside you has changed. As if a fragment of the power in this place has somehow seeped into your body. It probably isn't anything bad - or at least, that's what you hope."
 ev11.173.0.a:0 "Staying here was an interesting experience."
 mr_visited_yaga_hut_modifier:0 "Visited the $building_witch_house$"
 mr_visited_yaga_hut_modifier_log_title:0 "$mr_visited_yaga_hut_modifier$"
 ev11.174.desc:0 "As you approach the hut, it seems to slowly turn its front toward you. You sense a strange kind of magic you don't understand. There's no doubt you've found the right place. On the hut's walls you notice nearly invisible protective and offensive runes. You get the feeling that trying to break in could end very badly for you."
 ev11.174.0.a:0 "I'll examine this place."
 ev11.174.0.b:0 "I'll find a way to get inside."
 ev11.175.desc:0 "You cast a few diagnostic spells, which gave you some answers. The power circulating in the air doesn't come from the hut, but from this place - from the very ground itself. Something must have happened here long ago... So the hut is here because of the power, not the power because of the hut. Baba Yaga clearly chose this spot as her home on purpose. You also managed to determine that you are the only wizard in the area. But then why is there light inside? Perhaps the magical illumination is always left on or maybe it's something else entirely."
 ev11.176.desc:0 "The entire area is saturated with magic, but the farther you move from the hut, the weaker it becomes. This power doesn't come from any sorcerer, yet it isn't natural either. Perhaps it's the work of some demon or deity? Still, you notice several other magical traces, one of which definitely belongs to Baba Yaga. The old witch has cast her own spells around here, though none of them seem fresh."
 ev11.176.0.a:0 "Hmm, I'll follow this trail."
 ev11.177.desc:0 "In the area you found a cave that Baba Yaga must have visited regularly to cast her spells. You lit the prepared fire and decided to take a closer look at the place. There are several chests filled with alchemical materials, but also everyday items — it looks a bit like offerings the locals might bring to the witch to earn her favor. There's also a demon-summoning circle here, more complex and sturdy than any you've ever seen. Maybe Baba Yaga doesn't want to summon demons in a place of power... or she simply doesn't want them in her home?"
 ev11.177.0.a:0 "I'll study how this circle is constructed."
 ev11.177.0.b:0 "These alchemical substances might be useful."
 ev11.177.0.b_ct:0 "Baba Yaga might be angry if she ever finds out you stole from her."
 ev11.178.desc:0 "After visiting the cave, you decided to return to the hut. The longer you stay here, the better you understand the magic of this place — or rather, it seems to seep into you, as if something were examining you or trying to make contact. Could it be that the hut has a consciousness of its own? Suddenly, trying to enter it no longer feels like a good idea. You can sense that even your short stay here has changed you in some way; you can only hope it's a change for the better."
 ev11.178.0.a:0 "I'm getting out of here."
 ev11.179.desc:0 "The hut's magical defenses look solid, but there must be a way to break through them. A few spells come to mind that could force such protections. But if anything goes wrong, the consequences would be hard to predict."
 ev11.179.0.a:0 "I'll try to disable the magical defenses."
 ev11.179.0.a_ct:0 "The hut stands open before you."
 ev11.179.1.a_ct:0 "The hut is not accessible to you."
 ev11.180.desc:0 "Despite several attempts, you weren't able to break through the magical defenses. They turned out to be far more complex than you expected - in fact, no ordinary sorcerer could have created something like this. The spells protecting this place are quite literally inhuman. It seems the hut on chicken legs is not accessible to you."
 ev11.181.desc:0 "You managed to enter the main chamber, which looks as though it's prepared to receive guests. The whole place is filled with a faint herbal scent, mixed with a barely noticeable mustiness. It seems no one has been here for a long time. You quickly realize that the interior is much larger than it appeared from the outside. There are many rooms and hidden corners worth exploring."
 ev11.182.desc:0 "You've found many mysterious elixirs, magical instruments, books filled with forbidden secrets, and other items—though at a glance it's hard to tell which of them hold real value. More importantly, the longer you stay here, the more clearly you feel that someone or something is trying to communicate with you. This hut... you sense that it is, to some extent, aware, and it apparently wants something from you. Or... it wants you."
 ev11.182.0.a:0 "I think I could live here."
 mr_became_yaga_log_title:0 "You have become the new Yaga."
 ev11.182.0.b:0 "I'll grab a few books and get out of here."
