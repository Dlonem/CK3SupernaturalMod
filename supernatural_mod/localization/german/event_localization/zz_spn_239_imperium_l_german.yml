l_german:
 spn_ev10_85_motion:0 "I bring a motion before the council."
 spn_order.1000.t:0 "The Council's Business"
 spn_order.1000.desc:0 "The second part of the meeting is yours. Whatever you bring before the council now, the seats will have to answer."
 spn_order.1000.desc_work:0 "\n\nWord has come out of [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier]. In county after county people are talking about the deaths, and one of ours lives among them. Respondeo can quiet one county. A whole realm would take the whole council."
 spn_order.1000.a:0 "I ask the council for Imperium."
 spn_order.1000.a.tt:0 "The three seats vote. If more of them grant it than refuse it, you hold [Glossary('Imperium','spn_gloss_imperium')] for five years: Invocare cannot be called against you, you may demand submission from witches and Mages, you manage the council's funds yourself, and you may proclaim a new Prerogative at once."
 spn_order.1000.b:0 "The memory of [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] must be shifted."
 spn_order.1000.b.tt:0 "The seats vote, and each may pledge its part. If the council carries it, you cast the Great Respondeo and pay its price. The more seats pledge, the more the realm forgets."
 spn_order.1000.c:0 "Then let us hear the others."
 spn_rm_target_ok_tt:0 "Five or more counties of that realm are still talking, and one of the [spn_order|E] still lives there"
 spn_rm_gm_pays_tt:0 "You have the power to cast it"
 spn_order.1001.t:0 "Before the Council Votes"
 spn_order.1001.desc:0 "The seats will vote on whether to grant you Imperium. Before they do, you have a moment with each of them."
 spn_order.1001.desc_lapsed:0 "The seats waited for your word, then went back to their own business. The motion has lapsed."
 spn_order.1001.a:0 "They will remember what they owe me."
 spn_order.1001.a.tt:0 "You call in the hook you hold on each seat holder who owes you. They are bound to grant it, unless they hold something over you in turn."
 spn_order.1001.b:0 "Each of you will have my favour."
 spn_order.1001.b.tt:0 "Each seat holder gains a favour hook on you."
 spn_order.1001.c:0 "Gold opens doors."
 spn_order.1001.c.tt:0 "You pay each seat holder 100 gold."
 spn_order.1001.d:0 "Let me tell you what we are up against."
 spn_order.1001.d.tt:0 "You make your case to them. If it lands, every seat holder is moved by it."
 spn_order.1001.e:0 "Let them decide."
 spn_order.1001.lapsed:0 "Another time, then."
 spn_imperium_counted_opt:0 "The council has already counted."
 spn_imperium_gm_dead_opt:0 "There is nothing left to vote on."
 spn_order.1002.t:0 "The Grand Magus Asks for Imperium"
 spn_order.1002.desc:0 "[spn_imp_gm.GetTitledFirstName] asks the council for [Glossary('Imperium','spn_gloss_imperium')]: five years in which [spn_imp_gm.GetSheHe] answers to no vote of ours."
 spn_order.1002.desc_crisis:0 "\n\nAfter what happened, the room is quieter than it was."
 spn_order.1002.desc_bound:0 "\n\n[spn_imp_gm.GetSheHe|U] has called in what you owe [spn_imp_gm.GetHerHim]."
 spn_order.1002.desc_favour:0 "\n\n[spn_imp_gm.GetSheHe|U] has promised each of you a favour."
 spn_order.1002.desc_paid:0 "\n\nThere is a purse on the table in front of you."
 spn_order.1002.desc_spoke:0 "\n\n[spn_imp_gm.GetSheHe|U] spoke well about what the [spn_order|E] is up against."
 spn_order.1002.desc_rift:0 "\n\nYou know what [spn_imp_gm.GetSheHe] did the last time the council refused [spn_imp_gm.GetHerHim]."
 spn_order.1002.desc_count:0 "\n\nSo far: [spn_imp_gm.MakeScope.Var('spn_imp_yes').GetValue|0] for, [spn_imp_gm.MakeScope.Var('spn_imp_no').GetValue|0] against."
 spn_order.1002.a:0 "Grant it"
 spn_order.1002.b:0 "Refuse it"
 spn_order.1002.c:0 "Leave it to the others"
 spn_imp_bound_tt:0 "[spn_imp_gm.GetFirstName] has called in what you owe [spn_imp_gm.GetHerHim]"
 spn_order.1003.t:0 "The Council Has Spoken"
 spn_order.1003.desc_crisis:0 "After what happened, the council met again in haste, and the room was quieter than it had been.\n\n"
 spn_order.1003.desc_granted:0 "The count is [spn_imp_ayes.GetValue|0] for and [spn_imp_nays_n.GetValue|0] against. The council grants you Imperium.\n\nFor five years you answer to no vote of theirs."
 spn_order.1003.desc_refused:0 "The count is [spn_imp_ayes.GetValue|0] for and [spn_imp_nays_n.GetValue|0] against. The council refuses you Imperium."
 spn_order.1003.desc_dissenter:0 "\n\n[spn_imp_dissenter.GetTitledFirstName] argued hardest against it."
 spn_order.1003.a:0 "Then we begin."
 spn_order.1003.a.tt:0 "You hold Imperium for five years."
 spn_order.1003.b:0 "So be it."
 spn_order.1003.c:0 "Then the danger will come to them."
 spn_order.1003.c.tt:0 "Something will break open where [spn_imp_dissenter.GetFirstName] stands. If it is ever traced to you, it counts as breaking the rules of the [spn_order|E]."
 spn_order.1003.c.tt_fors:0 "The Fors Factorum pays for it now. You will pay later."
 spn_imp_means_tt:0 "You can work it without price, or spend a great deal of power"
 spn_order.1004.t:0 "The Council Pledges"
 spn_order.1004.desc:0 "[spn_imp_gm.GetTitledFirstName] asks the council to shift the memory of [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier]. Too many people there are talking about the deaths, and one of ours lives among them.\n\nThe Grand Magus will cast it. The more seats give their part, the more the realm forgets: first the talk, then who we are, then what its hunters have learned."
 spn_order.1004.desc_funds:0 "\n\nYour part, as Chancellor, is 200 gold from the council's funds."
 spn_order.1004.desc_power:0 "\n\nYour part is your own power."
 spn_order.1004.desc_count:0 "\n\nSo far: [spn_imp_gm.MakeScope.Var('spn_imp_yes').GetValue|0] for, [spn_imp_gm.MakeScope.Var('spn_imp_pledge_slips').GetValue|0] of them pledged, and [spn_imp_gm.MakeScope.Var('spn_imp_no').GetValue|0] against."
 spn_order.1004.a:0 "I give my part."
 spn_order.1004.a.tt_funds:0 "If the council carries it, 200 gold is taken from the council's funds. Your pledge counts for it."
 spn_order.1004.a.tt_power:0 "If the council carries it, you spend power. Your pledge counts for it."
 spn_order.1004.b:0 "I am for it, but I give nothing."
 spn_order.1004.c:0 "I am against it."
 spn_order.1004.d:0 "Leave it to the others."
 spn_rm_can_pledge_tt:0 "You can pay your part"
 spn_order.1005.t:0 "The Ground Splits"
 spn_order.1005.desc:0 "The floor opens without a sound. Light pours up out of the crack, right where you are standing, and the air turns to sulphur.\n\nSomething on the other side is pushing to come through."
 spn_order.1005.desc_sensed:0 "\n\nThe working had a signature you have felt before."
 spn_order.1005.a:0 "Close it"
 spn_order.1005.a.tt:0 "Nothing comes through."
 spn_order.1005.b:0 "Drive it back"
 spn_order.1005.b.tt:0 "You put yourself between the rift and everyone else."
 spn_order.1005.c:0 "Get everyone out"
 spn_order.1005.c.tt:0 "Something comes through behind you, and it will remember you."
 spn_order.1005.d:0 "Run"
 spn_order.1006.t:0 "A Realm Forgets"
 spn_order.1006.desc_passed:0 "The working is done. In [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] the talk stops. Nobody there can say any more what frightened them so."
 spn_order.1006.desc_two:0 "\n\nThose there who knew who belongs to the [spn_order|E] no longer do, unless their minds were guarded."
 spn_order.1006.desc_three:0 "\n\nThe hunters there who had found the way to a temple have lost it too."
 spn_order.1006.desc_member:0 "\n\nThe council did this for every one of us who lives there."
 spn_order.1006.desc_failed:0 "The council carried the motion, but the working never began. [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] still remembers."
 spn_order.1006.desc_refused:0 "The council would not do it. [spn_rm_ruler.GetPrimaryTitle.GetNameNoTier] will have to forget on its own, if it ever does."
 spn_order.1006.a:0 "It is done."
 spn_order.1006.b:0 "So be it."
 spn_conclave.0210.t:0 "What the Grand Magus Did"
 spn_conclave.0210.desc:0 "The masks are still arriving. Across the hall, [spn_cv_gm.GetTitledFirstName] is talking quietly with a Temple Magus, as if nothing were wrong.\n\nYou know that the rift which opened under one of the council was [spn_cv_gm.GetHerHis] own work. Said here, before every temple, it could not be taken back."
 spn_conclave.0210.a:0 "Say it, here, before them all."
 spn_conclave.0210.a.tt:0 "Every temple hears what [spn_cv_gm.GetFirstName] did. [spn_cv_gm.GetSheHe|U] has broken the rules of the [spn_order|E], and if [spn_cv_gm.GetSheHe] holds Imperium, it is void."
 spn_conclave.0210.b:0 "Not yet."
 spn_conclave.0210.b.tt:0 "You keep what you know, and what it is worth."
 spn_conclave.0210.c:0 "Someone has already said it."
 spn_order_toast_imperium_granted:0 "The Grand Magus Holds Imperium"
 spn_order_toast_imperium_void:0 "The Grand Magus's Imperium Is Void"
 spn_imperium_toast_refused:0 "The Council Refuses Imperium"
 spn_imperium_toast_spoke_well:0 "They Heard You"
 spn_imperium_toast_spoke_badly:0 "They Were Not Moved"
 spn_imperium_toast_staged:0 "The Ground Splits"
 spn_imperium_toast_rift_held:0 "It Closes"
 spn_imperium_toast_rift_failed:0 "Something Came Through"
 spn_secret_staged_rift:0 "Staged a Rift"
 spn_secret_staged_rift_desc:0 "Opened the rift that struck [TARGET_CHARACTER.GetShortUIName]"
 spn_secret_staged_rift_tooltip_desc:0 "This character opened a rift on purpose, where someone else was standing."
 spn_secret_staged_rift_type_desc:0 "$spn_secret_staged_rift_tooltip_desc$"
 spn_debug_events.0470.t:0 "Imperium and the Council's Works (Debug)"
 spn_debug_events.0470.desc:0 "Boot-test tools for 2.39's Imperium and the Great Respondeo (WORK-ORDER-2.39 F12, F13)."
 spn_debug_events.0470.a:0 "Open the council's works now (skip the 50 years) and look for a realm"
 spn_debug_events.0470.b:0 "Bring a motion before the council now (I am the Grand Magus)"
 spn_debug_events.0470.c:0 "Clear the records: refusal, renewal fatigue, the Great Respondeo's cooldown"
