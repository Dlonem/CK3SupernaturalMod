l_german:
 spn_mind_guarded_custom:0 "Their mind is guarded against domination."
 spn_compel_did_not_take_actor:0 "Compulsion: It Did Not Take"
 spn_msg_compel_did_not_take_actor:0 "[recipient.GetShortUIName|U] met your eyes and nothing took hold. [recipient.GetSheHe|U] is a witch, and [recipient.GetSheHe] knows what you tried."
 spn_compel_did_not_take_recipient:0 "It Did Not Take"
 spn_msg_compel_did_not_take_recipient:0 "Something pressed at your mind and found nothing to hold. You know what [actor.GetShortUIName] is now."
 COMPEL_MORTAL_FREE_ME:0 "Release Me"
 spn_compel_free_me_tt:0 "Your gaoler unlocks the cell and lets you walk out."
 spn_held_in_chains_custom:0 "Your gaoler holds the Warded Chains, and they hold the wolf."
 spn_held_in_chains_other_custom:0 "Their gaoler holds the Warded Chains, and the chains hold the wolf."
 spn_relic_chains_name:0 "The Warded Chains"
 spn_relic_chains_desc:0 "Iron chains worked over by a Mage until the links carry a warding. A wolf held in them cannot take its other shape, and without it cannot break out. To a vampire they are only chains."
 spn_relic_chains_modifier:0 "The Warded Chains"
 spn_relic_chains_modifier_desc:0 "A wolf whose gaoler owns them cannot take its other shape."
 spn_ward_chains_decision:0 "Ward the Chains"
 spn_ward_chains_decision_desc:0 "Work a warding into a set of iron chains. A wolf held in them cannot take its other shape, and without it cannot break out of a cell."
 spn_ward_chains_decision_tooltip:0 "Make a set of Warded Chains."
 spn_ward_chains_decision_confirm:0 "Ward them"
 spn_ward_chains_ring_tt:0 "Anyone nearby who can hear magic will hear you working."
 spn_commission_chains_interaction:0 "Commission Warded Chains"
 spn_commission_chains_interaction_desc:0 "Pay a Mage 150 gold to ward a set of iron chains for you. A wolf held in them cannot take its other shape, and without it cannot break out of a cell."
 spn_commission_chains_interaction_notification:0 "[actor.GetShortUIName|U] offers you 150 gold to ward a set of chains for [actor.GetHerHim]."
 spn_commission_chains_effect_tt:0 "You receive the Warded Chains"
 spn_ai_swept_chapter:0 "Burned out a hall of Mages"
 spn_break_the_chains_decision:0 "Break the Chains"
 spn_break_the_chains_decision_desc:0 "The hide has waited long enough. Give the wolf the door."
 spn_break_the_chains_decision_tooltip:0 "Try to break out of prison as the wolf."
 spn_break_the_chains_decision_confirm:0 "Break out"
 spn_break_the_chains_decision_effect_tt:0 "If anyone sees it, they will know what you are. The further along your wolf and the deeper your [spn_hide_bond|E], the less likely anyone is to see it."
 spn_break_the_chains_success_tt:0 "You break out"
 spn_break_the_chains_success_outcome_tt:0 "You are free"
 spn_break_the_chains_failure_tt:0 "You are caught"
 spn_break_the_chains_failure_outcome_tt:0 "You are wounded and moved to the [dungeon|E]"
 spn_hide.0401.t:0 "The Door Gives Way"
 spn_hide.0401.desc_seen:0 "You let the wolf come up, and the door does not hold it. The bolt tears out of the stone. A guard runs at you in the passage and goes down hard, and the others stand back against the wall and watch you go.\n\nThey saw what you are, and by morning [imprisoner.GetShortUIName] will be telling anyone who will listen."
 spn_hide.0401.desc_seen_midnight:0 "The wolf wants to be seen, and tonight you let it. The door comes off its hinges. Two guards try to stop you in the passage, and neither of them gets up quickly.\n\nThey saw what you are, and by morning [imprisoner.GetShortUIName] will be telling anyone who will listen."
 spn_hide.0401.desc_seen_unhurt:0 "You let the wolf come up, and the door does not hold it. The guards in the passage do not try to stop you. They press back against the wall as you pass, and you leave them there unhurt.\n\nThey saw what you are, and by morning [imprisoner.GetShortUIName] will be telling anyone who will listen."
 spn_hide.0401.desc_seen_timber:0 "You let the wolf come up only as far as you need it. The bolt gives. A guard steps into the dark of the passage and goes down before he sees what hit him.\n\nAt the far end, holding a lamp, [imprisoner.GetShortUIName] sees all of it. [imprisoner.GetSheHe|U] knows what you are now. Nobody else does."
 spn_hide.0401.desc_unseen_a:0 "Nobody sees you go. By morning the cell stands open with the bolt drawn, and the guards are on their feet at their posts. Each of them swears he never slept. None of them can say what he saw."
 spn_hide.0401.desc_unseen_b:0 "The guards will remember a long, quiet stretch of the night and nothing in it. By the time anyone thinks to look in on you, the door is open and you are gone."
 spn_hide.0401.a:0 "Keep running."
 spn_hide.0402.t:0 "Caught at the Bars"
 spn_hide.0402.desc_seen:0 "The wolf comes up too slowly. The guards are on you before the door gives, and they see enough before they get you down: the eyes, the teeth, the shape you were halfway into.\n\nYou wake in a worse cell than the one you left, hurt, and [imprisoner.GetShortUIName] knows what you are."
 spn_hide.0402.desc_unseen:0 "You are at the bars when the guards come, and all they find is a prisoner pulling at a door. They beat you for it, and the cell they put you in afterwards is worse.\n\nThey think you tried the door. None of them knows what you are."
 spn_hide.0402.a:0 "Not yet."
 spn_hide.0402.gaoler_toast:0 "A Prisoner Tried to Escape"
 spn_hide.0402.gaoler_toast_seen_tt:0 "[spn_btc_wolf.GetShortUIName|U] tried to break out of your prison and was caught. Your guards saw what [spn_btc_wolf.GetSheHe] is."
 spn_hide.0402.gaoler_toast_unseen_tt:0 "[spn_btc_wolf.GetShortUIName|U] tried to break out of your prison and was caught at the bars."
 spn_hide.0403.t:0 "The Empty Cell"
 spn_hide.0403.desc_seen:0 "The cell door hangs from one hinge with the bolt still in it. The guards who reached it first all tell the same story about what came out, and none of them will say the word.\n\n[spn_btc_wolf.GetShortUIName|U] is gone. Warded chains would have held [spn_btc_wolf.GetHerHim]."
 spn_hide.0403.desc_seen_timber:0 "You were at the end of the passage with a lamp when it came out of the cell, and you saw all of it. Your guards saw nothing they can describe.\n\n[spn_btc_wolf.GetShortUIName|U] is gone. Warded chains would have held [spn_btc_wolf.GetHerHim]."
 spn_hide.0403.desc_unseen:0 "The cell was found open at dawn. The guards were awake at their posts and swear nobody passed them. Not one of them can say when he last looked in."
 spn_hide.0403.a:0 "Find [spn_btc_wolf.GetHerHim]!"
 spn_hide.0403.b:0 "Let [spn_btc_wolf.GetHerHim] run."
