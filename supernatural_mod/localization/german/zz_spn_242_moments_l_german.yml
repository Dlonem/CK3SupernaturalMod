l_german:
 spn_moment.0011.t:0 "Fates Intertwined: The Coat"
 spn_moment.0011.desc:0 "[spn_mo_forever.GetFirstName] is at the window with a needle, letting out the seams of [spn_mo_forever.GetHerHis] own good clothes for the second time since spring. My coat hangs on its peg behind [spn_mo_forever.GetHerHim], the one I wore the winter we met.\n\n"Still fits you," [spn_mo_forever.GetSheHe] says, and bites off the thread. [spn_mo_forever.GetSheHe|U] does not look up. [spn_mo_forever.GetSheHe|U] does not need to. I can hear what [spn_mo_forever.GetSheHe] has not asked sitting in the room with us, patient as a cat."
 spn_moment.0011.desc_knows:0 "[spn_mo_forever.GetFirstName] is at the window with a needle, letting out the seams of [spn_mo_forever.GetHerHis] own good clothes for the second time since spring. My coat hangs on its peg behind [spn_mo_forever.GetHerHim], the one I wore the winter we met.\n\n[spn_mo_forever.GetSheHe|U] knows what I am. [spn_mo_forever.GetSheHe|U] has known for years and has never once asked for anything. "Still fits you," [spn_mo_forever.GetSheHe] says tonight, and this time [spn_mo_forever.GetSheHe] looks up, and holds the look."
 spn_moment.0011.a:0 "Put the needle down. Ask me."
 spn_moment.0011.b:0 "Come here. See what else has not changed."
 spn_moment.0011.c:0 "I laugh. You simply chose well."
 spn_moment.0011.d:0 "I say nothing."
 spn_moment.0011.e:0 "Look at me. You never wondered."
 spn_moment.0011.e.tt:0 "[spn_mo_forever.GetShortUIName] will not think of this again, and it will not come up between you"
 spn_moment.0012.t:0 "Fates Intertwined: What Was Counted"
 spn_moment.0012.desc:0 ""I found a grey hair this morning," [spn_mo_forever.GetFirstName] says. The candle is nearly out and [spn_mo_forever.GetSheHe] has not moved to light another. "I counted the years last night. Ours. You were awake while I did it. You are always awake."\n\n[spn_mo_forever.GetSheHe|U] takes my hand and turns it over, as if the answer might be written on the palm. It is the same hand [spn_mo_forever.GetSheHe] took the first night. That is the trouble with it."
 spn_moment.0012.a:0 "The truth, all of it."
 spn_moment.0012.b:0 "Words will not do. I show [spn_mo_forever.GetHerHim]."
 spn_moment.0012.c:0 "My family wears its years lightly."
 spn_moment.0012.d:0 "I hold [spn_mo_forever.GetHerHim] and say nothing."
 spn_moment.0012.e:0 "It is no gift. Do not ask me for it."
 spn_moment.0012.told.tt:0 "[spn_mo_forever.GetShortUIName] learns what you are"
 spn_moment.0013.t:0 "Fates Intertwined: Before Dawn"
 spn_moment.0013.desc_wants:0 "[spn_mo_forever.GetFirstName] has had time to think, and has used none of it to change [spn_mo_forever.GetHerHis] mind. [spn_mo_forever.GetSheHe|U] comes to me unpinning [spn_mo_forever.GetHerHis] hair.\n\n"I have stood at enough gravesides," [spn_mo_forever.GetSheHe] says. "I do not intend to make you bury me. I want every year you have. I want to be there when you are tired of them." [spn_mo_forever.GetHerHis|U] pulse is quick under my thumb, and it is not fear."
 spn_moment.0013.desc_afraid:0 "[spn_mo_forever.GetFirstName] stands close enough to touch and does not touch. "I want it," [spn_mo_forever.GetSheHe] says. "I lie awake wanting it. And then I think of the dark, and of what I would have to do to stay in it, and I cannot breathe."\n\n[spn_mo_forever.GetSheHe|U] laughs at [spn_mo_forever.GetHerselfHimself], badly. "Tell me I am a coward. It would be easier.""
 spn_moment.0013.desc_time:0 ""Not this year," [spn_mo_forever.GetFirstName] says, before I can ask. [spn_mo_forever.GetSheHe|U] has clearly rehearsed it. "There are things I want to finish as what I am. People who need me to be ordinary a little longer."\n\n[spn_mo_forever.GetSheHe|U] kisses the corner of my mouth, lightly, the way one seals a letter. "But do not go anywhere. I am not saying no.""
 spn_moment.0013.desc_none:0 ""I know what you are going to offer me," [spn_mo_forever.GetFirstName] says, "and I love you for wanting to. The answer is no."\n\n[spn_mo_forever.GetSheHe|U] says it gently and without any doubt at all. "I want to grow old. I want you to watch me do it and love me anyway. That is the whole of what I am asking you for.""
 spn_moment.0013.a:0 "Then stay. Every night there is."
 spn_moment.0013.b:0 "Bar the door. I am done being careful."
 spn_moment.0013.c:0 "Not yet. But drink a little of me."
 spn_moment.0013.d:0 "Sit with me. I will tell you what it is like."
 spn_moment.0013.e:0 "You will thank me in a hundred years."
 spn_moment.0013.f:0 "Then grow old. I will be here."
 spn_moment.0013.g:0 "[spn_mo_forever.GetSheHe|U] will remember none of this."
 spn_moment.0013.turn.tt:0 "[spn_mo_forever.GetShortUIName] is given your blood and turned. A lover or soulmate you turn may become sire-bound to you."
 spn_moment.0013.blood.tt:0 "[spn_mo_forever.GetShortUIName] carries your blood for three years: [spn_mo_forever.GetSheHe] heals, and if [spn_mo_forever.GetSheHe] dies in that time, [spn_mo_forever.GetSheHe] may rise"
 spn_moment.0014.t:0 "The One Who Followed You Home"
 spn_moment.0014.desc:0 "Three weeks now. The same face at the edge of the market, at the back of the church, under the lamp across the street when I closed the shutters. Tonight there is a knock, and [spn_mo_admirer.GetFirstName] is standing in my doorway with rain in [spn_mo_admirer.GetHerHis] hair.\n\n"I know it is late," [spn_mo_admirer.GetSheHe] says. "I know I should not be here. I have told myself so every night this month." [spn_mo_admirer.GetSheHe|U] looks at my mouth when [spn_mo_admirer.GetSheHe] says it, and then, deliberately, at my eyes. "I am done telling myself.""
 spn_moment.0014.a:0 "Come in out of the cold."
 spn_moment.0014.b:0 "Come in. Neither of us will sleep."
 spn_moment.0014.c:0 "You came for what I am."
 spn_moment.0014.c.tt:0 "[spn_mo_admirer.GetShortUIName] joins your court, is given your blood, and is turned"
 spn_moment.0014.d:0 "You look half frozen. And I have not eaten."
 spn_moment.0014.e:0 "Who sent you?"
 spn_moment.0014.e.nobody:0 "Nobody sent [spn_mo_admirer.GetHerHim]. [spn_mo_admirer.GetSheHe|U] left in tears."
 spn_moment.0014.e.spy:0 "A hunter paid [spn_mo_admirer.GetHerHim] to watch your door. You know they are coming."
 spn_moment.0014.f:0 "Go home. You are mistaken."
 spn_moment.0015.t:0 "Three in the Dark"
 spn_moment.0015.desc:0 "I knew the step on the stair before the door opened. [spn_mo_partner.GetFirstName] stands in it with a lamp, looking at the bed, and at [spn_mo_admirer.GetFirstName] in it, and then for a long moment at me.\n\nNobody speaks. [spn_mo_admirer.GetFirstName] pulls the sheet up and then, thinking better of it, does not. [spn_mo_partner.GetFirstName] sets the lamp down on the table with great care, the way [spn_mo_partner.GetSheHe] does when [spn_mo_partner.GetSheHe] has not yet decided whether to throw something."
 spn_moment.0015.a:0 "Nobody needs to leave this room."
 spn_moment.0015.a.tt:0 "[spn_mo_partner.GetShortUIName] will decide for [spn_mo_partner.GetHerselfHimself]"
 spn_moment.0015.a.yes:0 "[spn_mo_partner.GetFirstName] closed the door behind [spn_mo_partner.GetHerHim] and put out the lamp. Nobody in the house was seen before noon."
 spn_moment.0015.a.no:0 "[spn_mo_partner.GetFirstName] looked at your hand as if it were something left on a plate, and went out."
 spn_moment.0015.b:0 "A mistake. It was always you."
 spn_moment.0015.c:0 "I will not lie. I want you both."
 spn_moment.0015.d:0 "I send them both to bed. Alone."
 spn_moment.0016.t:0 "The Portrait"
 spn_moment.0016.desc:0 "The painter has come about the commission, and stands in the hall with his hat in his hands, looking from me to the wall and back.\n\nThe portrait there is of my grandfather. So the household has always been told. The old steward, who has dusted its frame since before the painter was born, clears his throat. "A strong family likeness," he says to no one. "Always remarked upon. The same scar, even. On the same hand.""
 spn_moment.0016.a:0 "Paint me as I am. Let them wonder."
 spn_moment.0016.b:0 "No portrait. Burn the old one."
 spn_moment.0016.c:0 "My grandfather. A fine likeness."
 spn_moment.0016.d:0 "Paint me older. Grey at the temples."
 spn_moment.0016.e:0 "You never once looked at that frame."
 spn_moment.0017.t:0 "A Hunter at Your Table"
 spn_moment.0017.desc:0 "[spn_mo_hunter.GetFirstName] is on [spn_mo_hunter.GetHerHis] third cup and [spn_mo_hunter.GetHerHis] second story. This one is about a thing [spn_mo_hunter.GetSheHe] put down in a cellar, and how it begged at the end. The table laughs where it is meant to.\n\n[spn_mo_hunter.GetSheHe|U] has eaten my bread for a season. [spn_mo_hunter.GetSheHe|U] has sharpened [spn_mo_hunter.GetHerHis] stakes at my hearth. [spn_mo_hunter.GetSheHe|U] raises [spn_mo_hunter.GetHerHis] cup to me now, warmly, across my own table, and has no idea at all."
 spn_moment.0017.a:0 "I fill [spn_mo_hunter.GetHerHis] cup. Tell me another."
 spn_moment.0017.b:0 "Later, alone: tell me every kill."
 spn_moment.0017.b.tt:0 "If any of your own are among them, you will know [spn_mo_hunter.GetHerHis] name for what it is"
 spn_moment.0017.c:0 "I eat nothing and count the doors."
 spn_moment.0017.d:0 "I slip out to the kitchens to feed."
 spn_moment.0017.e:0 "A pleasant dinner. For one of us."


### added by sync_localizations.py -- untranslated, 49 keys
 spn_moment.0018.t:0 "The Morning After"
 spn_moment.0018.desc:0 "I wake to voices, low and easy, and for a moment do not place them. [spn_mo_partner.GetFirstName] is sitting cross-legged at the foot of the bed in my shirt, eating an apple. [spn_mo_admirer.GetFirstName] is braiding [spn_mo_partner.GetHerHis] hair, badly, and being laughed at for it.\n\nThey stop when they see I am awake. Neither of them looks sorry. [spn_mo_partner.GetFirstName] holds out the apple to me, bitten side first, and raises an eyebrow that asks a perfectly reasonable question: well, and what now?"
 spn_moment.0018.desc_edge:0 "I wake to silence, the careful kind. [spn_mo_partner.GetFirstName] is already dressed and at the window. [spn_mo_admirer.GetFirstName] is still in the bed beside me, warm and unhurried, one arm thrown over my chest as if it had always belonged there.\n\n[spn_mo_partner.GetFirstName] turns. [spn_mo_partner.GetSheHe|U] is smiling, and it is a real smile, and there is a little steel in it. "I do not regret a moment of it," [spn_mo_partner.GetSheHe] says. "I would only like to know where I stand, now that the bed has a third side.""
 spn_moment.0018.a:0 "Lay a third place at my table."
 spn_moment.0018.b:0 "There will be an order to this."
 spn_moment.0018.c:0 "Let them arrange it themselves."
 spn_moment.0018.d:0 "One good night. Not a habit."
 spn_moment.0019.t:0 "The Household It Becomes"
 spn_moment.0019.desc:0 "It has been years, and the house runs on the three of us the way a clock runs on its weights. They finish each other's quarrels now. They come to me tonight together, which they have not done in some time, and close the door, and [spn_mo_admirer.GetFirstName] sits on the arm of my chair while [spn_mo_partner.GetFirstName] stands in front of me with [spn_mo_partner.GetHerHis] hands folded like a petitioner.\n\n"We have talked," [spn_mo_partner.GetSheHe] says. "For months, so do not think this is a whim. [spn_mo_admirer.GetFirstName] wants what you are. To be beside you in it, for all of it." [spn_mo_admirer.GetFirstNamePossessive|U] fingers find the back of my neck. "And I want to stay as I am," [spn_mo_partner.GetFirstName] says. "Somebody in this house should see the sun. Somebody should grow old and be loved anyway. I would like it to be me.""
 spn_moment.0019.a:0 "As you agreed. One by night, one by day."
 spn_moment.0019.a.tt:0 "[spn_mo_admirer.GetShortUIName] is given your blood and turned. [spn_mo_partner.GetShortUIName] stays mortal, as [spn_mo_partner.GetSheHe] asked."
 spn_moment.0019.b:0 "Both of you. Tonight."
 spn_moment.0019.b.tt:0 "Both are given your blood and turned. [spn_mo_partner.GetShortUIName] asked to stay as [spn_mo_partner.GetSheHe] is."
 spn_moment.0019.c:0 "I will hear each of you alone first."
 spn_moment.0019.c.tt:0 "You will speak with [spn_mo_partner.GetShortUIName] alone, and hear what [spn_mo_partner.GetSheHe] truly wants"
 spn_moment.0019.d:0 "We are happy as we are."
 spn_moment.0020.t:0 "A Guest for Supper"
 spn_moment.0020.desc:0 "There is a third cup on the table, and wine I did not order, and [spn_mo_partner.GetFirstName] is wearing the look [spn_mo_partner.GetSheHe] wears when [spn_mo_partner.GetSheHe] has done something [spn_mo_partner.GetSheHe] is rather pleased with.\n\n"This is [spn_mo_guest.GetFirstName]," [spn_mo_partner.GetSheHe] says. "We met at the market. We have been talking about you." The stranger meets my eyes without any shyness at all, and [spn_mo_partner.GetFirstName] comes round the table, slides a hand inside my collar, and puts [spn_mo_partner.GetHerHis] mouth close to my ear. "I know what you look at," [spn_mo_partner.GetSheHe] says, very quietly. "I thought, for once, you might be given it. If you want. Only if you want.""
 spn_moment.0020.a:0 "Close the door. Leave one candle."
 spn_moment.0020.b:0 "Slowly. We have all night."
 spn_moment.0020.c:0 "Send your friend home. I want only you."
 spn_moment.0020.suspect:0 "And how long have the two of you been arranging this behind my back?"
 spn_moment.0020.e:0 "This is not who I am."
 spn_moment.0021.t:0 "The Door She Closed"
 spn_moment.0021.desc:0 "[spn_mo_partner.GetFirstName] has not shouted. I could have borne shouting. [spn_mo_partner.GetSheHe|U] is civil at table and absent everywhere else, and the door of [spn_mo_partner.GetHerHis] room has been shut to me for a month.\n\nTonight there is a line of light under it. I stand in the corridor like a boy, knowing [spn_mo_partner.GetSheHe] can hear me breathing, knowing [spn_mo_partner.GetSheHe] is deciding, on the other side of two inches of oak, what I am worth to [spn_mo_partner.GetHerHim] now."
 spn_moment.0021.a:0 "I knock until [spn_mo_partner.GetSheHe] opens."
 spn_moment.0021.b:0 "I write to [spn_mo_partner.GetHerHim], plainly."
 spn_moment.0021.c:0 "I do not beg."
 spn_moment.0021.d:0 "Look at me. That night never happened."
 spn_moment.0021.d.tt:0 "[spn_mo_partner.GetShortUIName] forgets what [spn_mo_partner.GetSheHe] saw"
 spn_moment.0022.t:0 "What Your Spouse Knows"
 spn_moment.0022.desc:0 "[spn_mo_wife.GetFirstName] waits until the servants have gone, and then sets [spn_mo_wife.GetHerHis] cup down exactly in the middle of its saucer.\n\n"[spn_mo_other.GetFirstName]," [spn_mo_wife.GetSheHe] says. Only the name. [spn_mo_wife.GetSheHe|U] lets it sit on the table between us. "I am not a fool, and I have never asked you to treat me as a saint. I would simply like to hear it from you before I hear it again from the laundress.""
 spn_moment.0022.desc_lustful:0 "[spn_mo_wife.GetFirstName] waits until the servants have gone, and then, instead of sitting, comes and perches on the edge of my desk.\n\n"[spn_mo_other.GetFirstName]," [spn_mo_wife.GetSheHe] says, and to my surprise [spn_mo_wife.GetSheHe] is almost laughing. "Oh, do not look so stricken. I have seen [spn_mo_other.GetHerHim]. I am not angry that you looked." [spn_mo_wife.GetSheHe|U] tilts [spn_mo_wife.GetHerHis] head. "I am a little angry that you did not think to share.""
 spn_moment.0022.desc_zealous:0 "[spn_mo_wife.GetFirstName] is on [spn_mo_wife.GetHerHis] knees when I come in, and does not rise. The candles are all lit.\n\n"I have been praying for you," [spn_mo_wife.GetSheHe] says. "And for [spn_mo_other.GetFirstName], who may not know better. I have not yet prayed for myself. I wanted to ask you first what, exactly, I am to forgive.""
 spn_moment.0022.a:0 "It is true. I will not deny it."
 spn_moment.0022.b:0 "Servants' talk. There is nothing to know."
 spn_moment.0022.c:0 "Come and meet [spn_mo_other.GetFirstName]."
 spn_moment.0022.c.tt:0 "[spn_mo_wife.GetShortUIName] will decide for [spn_mo_wife.GetHerselfHimself]"
 spn_moment.0022.c.yes:0 "[spn_mo_wife.GetFirstName] sent for a second bottle. The three of you were not seen again that evening."
 spn_moment.0022.c.no:0 "[spn_mo_wife.GetFirstName] looked at you for a long moment, and then asked you to leave the room."
 spn_moment.0022.d:0 "Name your terms. The marriage stands."
 spn_moment.0022.d.tt:0 "[spn_mo_wife.GetShortUIName] names a price for [spn_mo_wife.GetHerHis] silence and [spn_mo_wife.GetHerHis] good grace, and you pay it"
 spn_moment.0022.e:0 "It ends today. You have my word."
 spn_moment.0023.t:0 "Older Than You"
 spn_moment.0023.desc:0 "I had thought I was the one with something to hide. [spn_mo_admirer.GetFirstName] lies propped on one elbow in my bed, watching me work it out, and when I finally do [spn_mo_admirer.GetSheHe] laughs, low and delighted, and lets me see [spn_mo_admirer.GetHerHis] teeth.\n\n"A month under your lamp in the rain," [spn_mo_admirer.GetSheHe] says, "and you never once wondered why I was not cold." [spn_mo_admirer.GetSheHe|U] traces a line down my throat with one fingernail, exactly where I would have. "I was old when your grandfather's grandfather was in the cradle. I wanted to see what you were before I let you see me. You will do. You are careless, and you are greedy, and you are lovely, and you will do.""
 spn_moment.0023.a:0 "Then teach me."
 spn_moment.0023.b:0 "Come here and finish finding out."
 spn_moment.0023.c:0 "You lied your way into my house."
 spn_moment.0023.d:0 "I say nothing. Two can keep a secret."


### added by sync_localizations.py -- untranslated, 18 keys
 spn_moment.0013.h:0 "Not the change. Only the good part of it."
 spn_moment.0013.h.tt:0 "You drink a little from [spn_mo_forever.GetShortUIName]. [spn_mo_forever.GetSheHe|U] stays as [spn_mo_forever.GetSheHe] is, and may choose again another time."
 spn_moment.0024.t:0 "Fates Intertwined: The First Night"
 spn_moment.0024.desc:0 "[spn_mo_forever.GetFirstName] wakes at dusk for the first time and lies very still, listening. I know what [spn_mo_forever.GetSheHe] is hearing. The cook's heart, two floors down. The stable boy's. Mine, which is slower than it ought to be.\n\n"I can smell the rain in the street," [spn_mo_forever.GetSheHe] says. "I can smell who walked through it." [spn_mo_forever.GetSheHe|U] turns to me, and they are the same eyes, and they are not. "I am so hungry I could weep. Show me what to do about it.""
 spn_moment.0024.desc_unwilling:0 "[spn_mo_forever.GetFirstName] has not spoken to me since. [spn_mo_forever.GetSheHe|U] wakes at dusk and sits on the edge of the bed with [spn_mo_forever.GetHerHis] back to me, hands flat on [spn_mo_forever.GetHerHis] knees, holding still against it.\n\n"I can hear the cook's heart," [spn_mo_forever.GetSheHe] says at last, to the wall. "From here. Did you know that is how it would be?" [spn_mo_forever.GetSheHe|U] does not wait for an answer. "I did not ask for this. But I will not starve to spite you. Show me.""
 spn_moment.0024.a:0 "Slowly. A little, from the wrist."
 spn_moment.0024.b:0 "Tonight we hunt as a pair."
 spn_moment.0024.c:0 "Only those who offer."
 spn_moment.0024.d:0 "Take whoever you like."
 spn_moment.0024.e:0 "This part is yours to learn."
 spn_moment.0024.f:0 "I did this to you. What do you need?"
 spn_moment.0025.t:0 "The Night You Do Not Come Home"
 spn_moment.0025.desc:0 "The moon was full, and I was not careful. I come back over the garden wall at first light with mud to the knee and blood drying on my shirt that is not mine, and [spn_mo_forever.GetFirstName] is sitting on the well cover with a blanket around [spn_mo_forever.GetHerHis] shoulders. [spn_mo_forever.GetSheHe|U] has been there all night.\n\n"Every month," [spn_mo_forever.GetSheHe] says. "I thought there was someone else. Last night I followed you as far as the tree line to find out who." [spn_mo_forever.GetSheHe|U] looks at my hands, and then at my mouth. "There is nobody else, is there. There is only whatever I heard in those trees.""
 spn_moment.0025.a:0 "Come here. It would never hurt you."
 spn_moment.0025.b:0 "There was never anyone else. Come inside."
 spn_moment.0025.c:0 "Poachers. They ran. Go back to bed."
 spn_moment.0025.d:0 "Not here. Ask me tonight."
 spn_moment.0025.e:0 "Look at me. You slept the whole night through."


### added by sync_localizations.py -- untranslated, 1 keys
 spn_moment.0012.later.tt:0 "[spn_mo_forever.GetShortUIName] will come to [spn_mo_forever.GetHerHis] own answer in time"
