l_german:
 spn_settle_in_souls_interaction:0 "Settle in Souls"
 spn_settle_in_souls_interaction_desc:0 "[recipient.GetShortUIName] has already refused to pay what [recipient.GetSheHe] owes you. Offer to forgive the debt for something [recipient.GetSheHe] will not miss until the day it is due."
 SPN_SETTLE_IN_SOULS_PROPOSAL:0 "[actor.GetShortUIName] offers to forgive your debt. All [actor.GetSheHe] asks in return is your soul, to be collected when the term is up."
 spn_settle_in_souls_taken_tt:0 "The debt is forgiven. When the term ends, the soul is yours to collect."
 SPN_SETTLE_DEBT_SIZE:0 "The size of the debt: $VALUE|=+0$"
 SPN_SETTLE_CANNOT_PAY:0 "Cannot pay: $VALUE|=+0$"
 SPN_SETTLE_SECOND_LEDGER:0 "Your books are in order: $VALUE|=+0$"
 spn_cash_in_soul_interaction:0 "Cash In a Soul"
 spn_cash_in_soul_interaction_desc:0 "You hold [recipient.GetShortUINamePossessive] soul. Tear up the contract today and take what it is worth now. [recipient.GetSheHe|U] will be whole again, and nothing will come for [recipient.GetHerHim]."
 spn_cash_in_soul_heading:0 "What the contract buys"
 SPN_SOUL_FOR_GOLD:0 "Coin"
 SPN_SOUL_FOR_NAME:0 "A name"
 SPN_SOUL_FOR_STANDING:0 "The company's standing"
 spn_cash_in_soul_freed_tt:0 "The contract is torn up. [recipient.GetShortUIName] has [recipient.GetHerHis] soul back."
 spn_soul_spent_standing_modifier:0 "A Contract Well Spent"
 spn_soul_spent_standing_modifier_desc:0 "People who were unsure of this house have made up their minds in its favour. Nobody can quite say why."
 spn_ev8.15.coin:0 "Keep your magic. I will take it in coin."
 spn_merchant_second_ledger_01_domicile_building:0 "The Second Ledger"
 spn_merchant_second_ledger_01_domicile_building_desc:0 "A small room off the Ledger Room, with one desk and one book. The clerks have never been asked to keep it, and have never asked what is in it."
 spn_merchant_second_ledger_02_domicile_building:0 "The Closed Ledger"
 spn_merchant_second_ledger_02_domicile_building_desc:0 "The book has grown to several. Every entry is a name and a date, and every date is still to come."
 spn_second_ledger_needs_ledger_tt:0 "Your house has a Ledger Room"
 spn_second_ledger_needs_dealmaker_tt:0 "You are a Crossroad Dealmaker"
 spn_merchant_still_01_domicile_building:0 "Alchemist's Still"
 spn_merchant_still_01_domicile_building_desc:0 "A back room with good light, a still and a great many labelled jars. What the house sells from it works better than what the apothecary down the street sells, and costs the same."
 spn_merchant_still_02_domicile_building:0 "Alchemist's Workroom"
 spn_merchant_still_02_domicile_building_desc:0 "Three stills now, and a waiting list. The house's remedies are asked for by name in markets it has never sent a caravan to."
 spn_still_needs_medicines_tt:0 "Your house has Medicament Traders or an Apothecaries' Hall"
 spn_potion_brewed_market_modifier:0 "Remedies That Work"
 spn_potion_brewed_market_modifier_desc:0 "Someone in this market is selling medicines that do what they promise. Every seller of medicines here does a little better for it."
 spn_potion_brewed_market_tt:0 "Medicines from your home market sell for more for two years. Every merchant there gains from it, your rivals included."
 spn_compel_insights_interaction:0 "Tell Me What You Know"
 spn_compel_insights_interaction_desc:0 "Have your Compelled [puppet|E] tell you what [puppet_or_actor.GetSheHe] knows of the trades [puppet_or_actor.GetSheHe] understands better than you do."
 spn_compel_insights_nothing_tt:0 "[puppet_or_actor.GetShortUIName] knows a trade better than you do"
 puppet_action_description_puppet_action_spn_compel_insights:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_insights_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] share what they know of their trades"
 spn_compel_tolls_interaction:0 "Let My Goods Pass"
 spn_compel_tolls_interaction_desc:0 "Have your Compelled [puppet|E], who holds a market, let your goods through it without tolls."
 spn_compel_tolls_interaction_tt:0 "Your goods pass [puppet_or_actor.GetShortUINamePossessive] markets without tolls for ten years"
 puppet_action_description_puppet_action_spn_compel_tolls:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_compel_tolls_interaction')]#! [interaction|E] on yourself to have your Compelled [puppet|E] exempt you from their tolls"
 spn_silk.0040.t:0 "The Heir Inherits the Ledger"
 spn_silk.0040.desc:0 "[spn_ll_father.GetFirstName] is dead. I lent to [spn_ll_father.GetHerHim] when [spn_ll_father.GetSheHe] was young, and I was told no when I asked for it back. Now the debt has a new name beside it: [spn_ll_heir.GetFirstName]. This is not the first time I have watched a debt change hands across a grave. I have the book open, and all the time [spn_ll_heir.GetSheHe] does not."
 spn_silk.0040.a:0 "Your house refused me once. You inherit that."
 spn_silk.0040.a.tt:0 "[spn_ll_heir.GetShortUIName] is treated as having refused you once already"
 spn_silk.0040.b:0 "A debt this old has earned its interest."
 spn_silk.0040.b.tt:0 "The debt grows by a tenth"
 spn_silk.0040.c:0 "[spn_ll_heir.GetSheHe|U] never signed it. Half will do."
 spn_silk.0040.c.tt:0 "The debt is halved"
 spn_silk.0040.d:0 "The debt died with [spn_ll_father.GetHerHim]."
 spn_silk.0040.e:0 "The books can wait. They always have."


