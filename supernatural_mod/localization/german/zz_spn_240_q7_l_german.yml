l_german:
 spn_golem_puppet:0 "Golem"
 spn_golem_puppet_desc:0 "Your golem acts for you. Right-click someone and act as your golem to have it seize them for your [prison|E], strike them down, loom over them, guard them, plot their murder, seduce, romance or befriend them, learn their language, or give them what it carries. If it holds land, it can also imprison, release and pardon as a ruler does. Right-click yourself to have it guard you or send you its gold. Its own orders are on this card."
 spn_golem_puppet_concept_desc:0 "A golem bound to you can be your [puppet|E]. It is made of clay and magic, it is far stronger than a man, and it obeys only its master.\n\nThrough it you can seize someone and carry them to your [prison|E], have someone beaten, frighten someone into giving in to you, or set the golem to guard someone for a year, you among them. Someone who escapes it, or is beaten by it, does not always learn who sent it; someone it frightens always does. It can also plot a murder of its own, seduce, romance and befriend people, learn a language, hand over what it carries, send you its gold, and share or expose the secrets it has seen. A golem that holds land can imprison, release and pardon as a ruler does.\n\nYou can also order it to hand over what it carries, come home, tell you what it has seen, guard you, or return to clay, and, when the [spn_vade_maecum|E] is in play, to search for its pages.\n\nA new golem becomes your puppet when it is made. A golem you already had becomes one through Make Your Golem a Puppet. You can hold one golem puppet at a time. A golem whose master is gone answers to no one; any Mage can take it up with Bind the Masterless Golem."
 spn_bind_golem_interaction:0 "Make Your Golem a Puppet"
 spn_bind_golem_interaction_desc:0 "Make [recipient.GetFirstName] your golem [puppet|E]. You can then act through it, and give it orders from your list of puppets."
 spn_bind_golem_interaction_tt:0 "[recipient.GetFirstName] becomes your golem [puppet|E]."
 spn_bind_golem_replaces_tt:0 "Your current golem [puppet|E] is set aside. It stays bound to you and still answers to Command your minion."
 spn_golem_return_to_clay_decision:0 "Return to Clay"
 spn_golem_return_to_clay_decision_desc:0 "Order your golem to unmake itself."
 spn_golem_return_to_clay_decision_tooltip:0 "Everything your golem carries comes to you. Then it is only clay."
 spn_golem_return_to_clay_decision_confirm:0 "Unmake it"
 spn_golem_return_to_clay_tt:0 "Everything your golem carries, its gold and its possessions, comes to you. Then it is only clay."
 spn_golem_return_to_clay_toast_tt:0 "Your golem gave you what it carried. Then it was only clay."
 spn_golem_hand_over_decision:0 "Hand Over What You Carry"
 spn_golem_hand_over_decision_desc:0 "Order your golem to give you everything it carries."
 spn_golem_hand_over_decision_tooltip:0 "Your golem gives you its gold and its possessions."
 spn_golem_hand_over_decision_confirm:0 "Give it to me"
 spn_golem_hand_over_tt:0 "Your golem gives you all its gold and every possession it can give."
 spn_golem_carries_nothing_tt:0 "Your golem carries gold or a possession it can give"
 spn_golem_come_home_decision:0 "Come Home"
 spn_golem_come_home_decision_desc:0 "Call your golem back to your court."
 spn_golem_come_home_decision_tooltip:0 "Your golem returns to your court. If it is out searching, the search ends."
 spn_golem_come_home_decision_confirm:0 "Come home"
 spn_golem_already_home_tt:0 "Your golem is away from your court, or out searching"
 spn_golem_come_home_search_tt:0 "The search ends. Your golem brings nothing back."
 spn_golem_what_you_saw_decision:0 "What Did You See?"
 spn_golem_what_you_saw_decision_desc:0 "Ask your golem what it has seen and heard."
 spn_golem_what_you_saw_decision_tooltip:0 "Your golem tells you every secret it knows that you do not."
 spn_golem_what_you_saw_decision_confirm:0 "Tell me"
 spn_golem_what_you_saw_tt:0 "Your golem tells you every secret it knows that you do not."
 spn_golem_saw_nothing_tt:0 "It has seen nothing you do not already know."
 spn_golem_search_decision:0 "Send the Golem to Search"
 spn_golem_search_decision_desc:0 "Send your golem to look for the pages of the [spn_vade_maecum|E]."
 spn_golem_search_decision_tooltip:0 "Your golem goes looking for the pages. It will be gone two to five years."
 spn_golem_search_decision_confirm:0 "Go"
 spn_death_golem_unmade:0 "was returned to clay"
 spn_golem_cracked_modifier:0 "Cracked"
 spn_golem_cracked_modifier_desc:0 "Something broke it. It will mend, slowly."
 spn_golem.0001.t:0 "Last Instructions"
 spn_golem.0001.desc:0 "Before the end, [spn_golem_old_master.GetFirstName] gave [spn_golem.GetFirstName] one last order: serve my heir as you served me.\n\nThe golem is waiting for you to take it up."
 spn_golem.0001.a:0 "Then serve me"
 spn_golem.0001.a.tt:0 "[spn_golem.GetFirstName] is bound to you, as it was to [spn_golem_old_master.GetFirstName]."
 spn_golem.0001.b:0 "I have no use for it"
 spn_golem.0001.b.tt:0 "[spn_golem.GetFirstName] stays where it is, but it answers to no one."
 spn_golem.0002.t:0 "Take Up the Golem's Instructions"
 spn_golem.0002.desc:0 "No one holds [spn_golem.GetFirstName]'s bond any more. The one who made it is gone, and it still waits to be told what to do. It looks to you."
 spn_golem.0002.a:0 "Take up its instructions"
 spn_golem.0002.a.tt:0 "[spn_golem.GetFirstName] is bound to you."
 spn_golem.0002.b:0 "Leave it be"
 spn_golem_rebound_toast:0 "The Golem Answers to You"
 spn_golem_rebound_toast_tt:0 "[spn_golem.GetFirstName] was left without a master. It is bound to you now."
 spn_order.2300.t:0 "The Golem's Shape"
 spn_order.2300.desc:0 "Before the Magistrati gather, one thing has to be settled. The golem can be made a man or a woman, or it can be made in your own image."
 spn_order.2300.a.tt:0 "The golem will be a man, and a handsome one."
 spn_order.2300.b.tt:0 "The golem will be a woman, and a beautiful one."
 spn_order.2300.c.tt:0 "The golem will look like you."
 spn_order.2301.t:0 "Finishing the Golem"
 spn_order.2301.desc:0 "The golem stands in the cellar and waits. It needs a name, and there is still time to improve it before the work is done."
 puppet_action_description_puppet_action_spn_puppet_seize:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_golem_seize_interaction')]#! [interaction|E] to have your puppet carry someone to your [prison|E]"
 puppet_action_description_puppet_action_spn_puppet_strike:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_golem_strike_interaction')]#! [interaction|E] to have your puppet beat someone"
 puppet_action_description_puppet_action_spn_puppet_loom:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_golem_loom_interaction')]#! [interaction|E] to have your puppet frighten someone"
 puppet_action_description_puppet_action_spn_golem_guard:0 "Use #V [GetPlayer.GetPlayerInteractionName('spn_golem_guard_interaction')]#! [interaction|E] to have your golem guard someone for a year"
 spn_golem_busy_tt:0 "Your golem is not away searching or on another errand"
 spn_golem_reach_tt:0 "Your golem can reach them: they are where it is, or they live in your [realm|E]"
 spn_golem_hostile_pause_tt:0 "You have not sent a puppet against anyone in recent months"
 spn_golem_needs_prison_tt:0 "You hold land or an administrative seat, and so a [prison|E] to keep them in"
 spn_golem_errand_toast:0 "[spn_golem.GetShortUIName] Sets Out"
 spn_golem_seize_interaction:0 "Seize and Imprison"
 spn_golem_seize_interaction_desc:0 "Send [puppet_or_actor.GetShortUIName] to take [recipient.GetShortUIName] and carry [recipient.GetHerHim] to your [prison|E]. If [recipient.GetSheHe] gets away, [recipient.GetSheHe] may or may not learn who sent [puppet_or_actor.GetHerHim]."
 spn_golem_seize_interaction_tt:0 "[puppet_or_actor.GetShortUIName] goes after [recipient.GetShortUIName]. You will hear how it went within a few weeks."
 spn_golem_strike_interaction:0 "Strike Them Down"
 spn_golem_strike_interaction_desc:0 "Send [puppet_or_actor.GetShortUIName] to beat [recipient.GetShortUIName]. Blows like these can kill. [recipient.GetSheHe|U] may or may not learn who sent [puppet_or_actor.GetHerHim]."
 spn_golem_strike_interaction_tt:0 "[puppet_or_actor.GetShortUIName] goes after [recipient.GetShortUIName]. You will hear how it went within a few weeks."
 spn_golem_loom_interaction:0 "Loom Over Them"
 spn_golem_loom_interaction_desc:0 "Have [puppet_or_actor.GetShortUIName] stand over [recipient.GetShortUIName] and say nothing. [recipient.GetSheHe|U] will know who sent [puppet_or_actor.GetHerHim]; that is the point of it."
 spn_golem_loom_interaction_tt:0 "[recipient.GetShortUIName] is frightened, and may give in to you."
 spn_golem_loom_gave_in_tt:0 "[spn_golem_target.GetShortUIName] gave in. You have a [hook|E] on [spn_golem_target.GetHerHim]."
 spn_golem_loom_held_tt:0 "[spn_golem_target.GetShortUIName] was frightened, but did not give in."
 spn_golem_loom_msg:0 "A Golem at the Door"
 spn_golem_loom_msg_tt:0 "[spn_golem.GetShortUIName] stood over you and said nothing. It belongs to [spn_golem_master.GetShortUIName]."
 spn_golem_guard_interaction:0 "Stand Guard Over Them"
 spn_golem_guard_interaction_desc:0 "Set your golem to guard [recipient.GetShortUIName] for a year. It guards one person at a time."
 spn_golem_guard_toast_tt:0 "[spn_golem.GetShortUIName] guards [spn_golem_target.GetShortUIName] for a year."
 spn_golem_guards_already_tt:0 "Your golem is not already guarding them"
 spn_golem_guards_you_already_tt:0 "Your golem is not already guarding you"
 spn_golem_guard_ends_tt:0 "Your golem stops guarding the one it guards now."
 spn_golem_guarded_modifier:0 "Guarded by a Golem"
 spn_golem_guarded_modifier_desc:0 "A golem keeps watch. Plots against this character go worse, and another golem will find it hard to get near."
 spn_golem_guard_me_decision:0 "Guard Me"
 spn_golem_guard_me_decision_desc:0 "Order your golem to keep watch over you for a year."
 spn_golem_guard_me_decision_tooltip:0 "Your golem guards you for a year. Plots against you go worse."
 spn_golem_guard_me_decision_confirm:0 "Stay close"
 spn_golem_come_home_errand_tt:0 "Its errand is called off."
 spn_golem_seized_msg:0 "Seized and Imprisoned"
 spn_golem_seized_msg_tt:0 "[spn_golem.GetShortUIName] took you and carried you to the [prison|E] of [spn_golem_master.GetShortUIName]."
 spn_golem_seize_failed_msg:0 "Someone Came for You"
 spn_golem_seize_failed_msg_tt:0 "[spn_golem.GetShortUIName] tried to carry you off, and you got away. [spn_golem_master.GetShortUIName] sent [spn_golem.GetHerHim]."
 spn_golem_struck_msg:0 "Beaten by a Golem"
 spn_golem_struck_msg_tt:0 "[spn_golem.GetShortUIName] found you and beat you. It belongs to [spn_golem_master.GetShortUIName]."
 spn_golem_strike_failed_msg:0 "Someone Came for You"
 spn_golem_strike_failed_msg_tt:0 "[spn_golem.GetShortUIName] came for you, and you escaped. [spn_golem_master.GetShortUIName] sent [spn_golem.GetHerHim]."
 spn_golem_attacked_me_opinion:0 "Sent a Golem Against Me"
 spn_death_golem_struck:0 "was struck down by [TARGET_CHARACTER.GetShortUINamePossessive] golem"
 spn_golem.0010.t:0 "The Golem Returns"
 spn_golem.0010.desc_success:0 "[spn_golem.GetFirstName] comes back the way it left, without a word, with [spn_golem_target.GetShortUIName] over its shoulder. It sets [spn_golem_target.GetHerHim] down in your [prison|E] and waits for its next order."
 spn_golem.0010.desc_failure:0 "[spn_golem.GetFirstName] comes back alone. [spn_golem_target.GetShortUIName] saw it coming and got away, and now knows who sent it."
 spn_golem.0010.a:0 "Good. Lock the door."
 spn_golem.0010.b:0 "Next time, then."
 spn_golem.0011.t:0 "The Golem Returns"
 spn_golem.0011.desc_wound:0 "[spn_golem.GetFirstName] found [spn_golem_target.GetShortUIName] and beat [spn_golem_target.GetHerHim] badly. It did not hurry, and it did not hide whose golem it was."
 spn_golem.0011.desc_death:0 "[spn_golem.GetFirstName] found [spn_golem_target.GetShortUIName] and struck [spn_golem_target.GetHerHim] down. [spn_golem_target.GetSheHe|U] did not get up again. Everyone knows whose golem it was."
 spn_golem.0011.desc_failure:0 "[spn_golem.GetFirstName] comes back without having landed a blow. [spn_golem_target.GetShortUIName] escaped it, and now knows who sent it."
 spn_golem.0011.a:0 "That will teach [spn_golem_target.GetHerHim]."
 spn_golem.0011.b:0 "So be it."
 spn_golem.0011.c:0 "Next time, then."
 spn_bind_masterless_golem_interaction:0 "Bind the Masterless Golem"
 spn_bind_masterless_golem_interaction_desc:0 "[recipient.GetFirstName] answers to no one. Bind it to yourself with your magic: it will serve you as it served its maker, and become your golem [puppet|E] if you have none.\n\nIt costs the power of a spell."
 spn_bind_masterless_golem_tt:0 "[recipient.GetFirstName] is bound to you."
 spn_bind_masterless_golem_reach_tt:0 "[recipient.GetFirstName] stands where you stand, or is at your court, a guest of yours, or in your realm"
 spn_puppet_deed_unknown_tt:0 "[spn_golem_target.GetShortUIName] never learned who sent [spn_golem.GetShortUIName]"
 spn_puppet_seize_failed_unknown_msg_tt:0 "[spn_golem.GetShortUIName] tried to carry you off, and you got away. [spn_golem.GetSheHe|U] bore no master's mark, and you could not learn who sent [spn_golem.GetHerHim]."
 spn_puppet_struck_msg:0 "Beaten"
 spn_puppet_struck_msg_tt:0 "[spn_golem.GetShortUIName] found you and beat you, on the orders of [spn_golem_master.GetShortUIName]."
 spn_puppet_struck_unknown_msg_tt:0 "[spn_golem.GetShortUIName] found you and beat you. [spn_golem.GetSheHe|U] bore no master's mark, and you could not learn who sent [spn_golem.GetHerHim]."
 spn_puppet_strike_failed_unknown_msg_tt:0 "[spn_golem.GetShortUIName] came for you, and you escaped. [spn_golem.GetSheHe|U] bore no master's mark, and you could not learn who sent [spn_golem.GetHerHim]."
 spn_puppet_seize_failed_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] tried to carry you off, and you got away. [spn_golem.GetSheHe|U] never said who sent [spn_golem.GetHerHim], and you could not learn it."
 spn_puppet_struck_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] found you and beat you. [spn_golem.GetSheHe|U] never said who sent [spn_golem.GetHerHim], and you could not learn it."
 spn_puppet_strike_failed_unknown_person_msg_tt:0 "[spn_golem.GetShortUIName] came for you, and you escaped. [spn_golem.GetSheHe|U] never said who sent [spn_golem.GetHerHim], and you could not learn it."
 spn_puppet.0010.t:0 "[spn_golem.GetFirstName] Returns"
 spn_puppet.0011.t:0 "[spn_golem.GetFirstName] Returns"
 spn_puppet_loom_msg:0 "Stood Over"
 spn_puppet_loom_msg_tt:0 "[spn_golem.GetShortUIName] stood over you and said nothing. [spn_golem_master.GetShortUIName] sent [spn_golem.GetHerHim]."
 spn_puppet_sent_against_me_opinion:0 "Sent Someone Against Me"
 spn_puppet_struck_me_opinion:0 "Attacked Me"
 spn_death_puppet_struck_ordered:0 "was beaten to death on [TARGET_CHARACTER.GetShortUINamePossessive] orders"
 spn_death_puppet_struck:0 "was beaten to death by [TARGET_CHARACTER.GetShortUIName]"
 spn_puppet.0010.desc_success:0 "[spn_golem.GetShortUIName] comes back with [spn_golem_target.GetShortUIName], held fast, and hands [spn_golem_target.GetHerHim] over to your jailer. [spn_golem_target.GetSheHe|U] is in your [prison|E]."
 spn_puppet.0010.desc_failure:0 "[spn_golem.GetShortUIName] comes back alone. [spn_golem_target.GetShortUIName] saw [spn_golem.GetHerHim] coming and got away, and now knows who sent [spn_golem.GetHerHim]."
 spn_puppet.0010.desc_failure_unknown:0 "[spn_golem.GetShortUIName] comes back alone. [spn_golem_target.GetShortUIName] got away, but never saw who was behind it. Your name was not spoken."
 spn_puppet.0011.desc_wound:0 "[spn_golem.GetShortUIName] found [spn_golem_target.GetShortUIName] and beat [spn_golem_target.GetHerHim] badly. [spn_golem_target.GetSheHe|U] knows who sent [spn_golem.GetHerHim]."
 spn_puppet.0011.desc_wound_unknown:0 "[spn_golem.GetShortUIName] found [spn_golem_target.GetShortUIName] and beat [spn_golem_target.GetHerHim] badly, and was gone before anyone could ask who sent [spn_golem.GetHerHim]. Your name was not spoken."
 spn_puppet.0011.desc_death:0 "[spn_golem.GetShortUIName] found [spn_golem_target.GetShortUIName] and struck [spn_golem_target.GetHerHim] down. [spn_golem_target.GetSheHe|U] did not get up again. Everyone knows who gave the order."
 spn_puppet.0011.desc_death_unknown:0 "[spn_golem.GetShortUIName] found [spn_golem_target.GetShortUIName] and struck [spn_golem_target.GetHerHim] down. [spn_golem_target.GetSheHe|U] did not get up again. They blame [spn_golem.GetShortUIName]; no one has spoken your name."
 spn_puppet.0011.desc_failure:0 "[spn_golem.GetShortUIName] comes back without having landed a blow. [spn_golem_target.GetShortUIName] escaped, and now knows who sent [spn_golem.GetHerHim]."
 spn_puppet.0011.desc_failure_unknown:0 "[spn_golem.GetShortUIName] comes back without having landed a blow. [spn_golem_target.GetShortUIName] escaped, but never learned who sent [spn_golem.GetHerHim]."
