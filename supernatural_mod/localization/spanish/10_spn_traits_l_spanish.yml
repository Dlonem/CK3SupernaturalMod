# Vampire Traits
trait_supernatural_vampire:0 "Vampiro"
supernatural_vampire:0 "Vampiro"
trait_supernatural_vampire_desc:0 "Este personaje es un vampiro.\nEs una condición que muchos consideran incurable."
trait_supernatural_vampire_character_desc:0 ""
trait_supernatural_vampire_1:0 "Vampiro neófito"
trait_supernatural_vampire_2:0 "Vampiro"
trait_supernatural_vampire_3:0 "Vampiro reverenciado"
trait_supernatural_vampire_4:0 "Vampiro anciano"
trait_track_vampirism:0 "Vampirismo"
trait_track_vampirism_desc:0 "Una sangre ancestral que concede poderes y dones sobrenaturales a quienes se alimentan de la sangre ajena."
trait_track_blood_magic:0 "Magia de sangre"
trait_track_blood_magic_desc:0 "En lo más profundo de la sangre de un vampiro inmortal yace un poder oculto, capaz de someter voluntades y perfeccionar las propias capacidades."

trait_spn_vampire_1_progeny_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un vampiro.\nPosee juventud eterna, una fuerza y una velocidad inconmensurables, y es capaz de influir en la mente de los demás.\nTen cuidado.\n\n#high [pprogeny|E]: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_progeny').GetCharacter.GetName] #!"
trait_spn_vampire_1_sire_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un vampiro.\nPosee juventud eterna, una fuerza y una velocidad inconmensurables, y es capaz de influir en la mente de los demás.\nTen cuidado.\n\n#high [mmaker|E]: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!"
trait_spn_vampire_1_both_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un vampiro.\nPosee juventud eterna, una fuerza y una velocidad inconmensurables, y es capaz de influir en la mente de los demás.\nTen cuidado.\n\n#high [mmaker|E]: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!\n#high [pprogeny|E] reciente: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_progeny').GetCharacter.GetName] #!"

trait_spn_true_vampire:0 "Vampiro verdadero"
trait_spn_true_vampire_desc:0 "Es un vampiro poderoso con acceso a una amplia variedad de habilidades."

# Known Vampire
trait_spn_known_vampire:0 "Vampiro conocido"
trait_spn_known_vampire_desc:0 "Es de dominio público que [ROOT.GetCharacter.GetFirstNameNoTooltip] es un vampiro."

# Lycan Traits
trait_supernatural_werewolf:0 "Hombre lobo"
trait_supernatural_werewolf_desc:0 "Este personaje es un hombre lobo.\nSe trata de un rasgo genético que puede mejorarse."
trait_supernatural_werewolf_character_desc:0 ""
trait_track_lycanthropy:0 "Licantropía"
trait_track_lycanthropy_desc:0 "Quien padece esta condición se transforma en lobo y devora animales, personas o cadáveres, aunque después recupera la forma humana."
trait_track_wolf_pack:0 "Manada"
trait_track_wolf_pack_desc:0 "Para los hombres lobo, la familia, la lealtad y los beneficios de poner la manada en primer lugar lo son todo."

trait_spn_werewolf_3_confer_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un hombre lobo.\nSe trata de un rasgo genético que ya no puede mejorarse. Sus hijos pueden heredar versiones superiores de estos rasgos.\n\n#high [mmaker|E]: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!"
trait_spn_werewolf_3_both_parents_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un hombre lobo.\nSe trata de un rasgo genético que ya no puede mejorarse. Sus hijos pueden heredar versiones superiores de estos rasgos.\n\n#high Madre: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!\n#high Padre: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"
trait_spn_werewolf_3_mother_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un hombre lobo.\nSe trata de un rasgo genético que ya no puede mejorarse. Sus hijos pueden heredar versiones superiores de estos rasgos.\n\n#high Madre: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!"
trait_spn_werewolf_3_father_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un hombre lobo.\nSe trata de un rasgo genético que ya no puede mejorarse. Sus hijos pueden heredar versiones superiores de estos rasgos.\n\n#high Padre: #! #P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"

trait_spn_true_werewolf:0 "Hombre lobo verdadero"
trait_spn_true_werewolf_desc:0 "Es un hombre lobo poderoso, dotado de una fuerza extraordinaria."

# Known Lycan
