# Títulos de notificación
spn_compel_success_actor:0 "Compulsión: éxito"
spn_compel_success_recipient:0 "La niebla se disipa…"
spn_compel_failed_actor:0 "Compulsión: resistida"
spn_compel_failed_recipient:0 "Asalto mental frustrado"

# Líneas de cuerpo
spn_msg_compel_success_actor:0 "[recipient.GetShortUIName] fue sometido a la compulsión con éxito."
spn_msg_compel_success_recipient:0 "Un tramo de tiempo se desvanece en blanco. Algo tiró de tu voluntad… y después desapareció."
spn_msg_compel_failed_actor:0 "[recipient.GetShortUIName] resistió la compulsión y descubrió tu verdadera naturaleza."
spn_msg_compel_failed_recipient:0 "Te sacudes una voluntad ajena y reconoces la verdadera naturaleza de [actor.GetShortUIName]."

