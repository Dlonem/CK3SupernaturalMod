l_spanish:
 #### Vampire Feeding Event ###
spn_gain_power.4010.t:0 "Noche de mordida"
spn_gain_power.4010.desc:0 "Mientras me escabullo por el castillo, encuentro a uno de mis cortesanos a solas junto a una ventana abierta, respirando el aire fresco de la noche. Aguardo tras una arcada y observo dónde se encuentran los guardias y si mi cortesano tiene intención de marcharse. \n\nHe decidido hacerlo de forma rápida y silenciosa. Mi plan es agarrarlo, mirarle directamente a los ojos, obligarlo a guardar silencio y borrar de su memoria lo ocurrido esta noche."
spn_gain_power.4010.a:0 "Agarrar, beber y borrar. Entendido."
spn_gain_power.4010.a.tt:0 "Por fin saciaré mi sed de sangre."
 
spn_gain_power.4010.ab.t:0 "Probabilidad de éxito"
spn_gain_power.4010.ac.t:0 "Probabilidad de ser descubierto"
spn_gain_power.4010.ad.t:0 "Probabilidad de matar al cortesano"
 
 
spn_gain_power.4010.b:0 "Pensándolo mejor... iré a desangrar a un animal."
spn_gain_power.4010.b.tt:0 "Caza un animal en el bosque; no es posible ganar poder."
 
 
 ### Vampire Bite Night: Success ###
spn_gain_power.4011.t:0 "Noche de mordida: éxito"
spn_gain_power.4011.desc:0 "Mi cortesano ni siquiera me vio venir. Pude mirarlo a los ojos y decirle: «Guardarás silencio, y explicarás las marcas del cuello diciendo que tuviste un mal encuentro con un perro».\n\nMi hambre se calma y regreso a mis aposentos. Nadie me ha visto esta noche."
spn_gain_power.4011.a:0 "Siento renovada mi fuerza."
spn_gain_power.4011.a.tt:0 "Hay algo distinto en esta alimentación. Siento que mi fuerza crece... o quizá simplemente estoy saciado."
 
 ### Vampire Bite Night: Discovered ###
spn_gain_power.4012.t:0 "Noche de mordida: descubierto"
spn_gain_power.4012.desc:0 "¡Antes siquiera de que pudiese empezar a hablar, mi cortesano soltó un grito espeluznante!\n\nLe hundo los colmillos en el cuello y empiezo a desangrarlo. Pero ya da igual: el cortesano me ha reconocido y mis guardias han visto mis colmillos. Como su señor, les ordeno que no intervengan, y obedecen con evidente vacilación.\n\nAhora todo el mundo conoce mi secreto... pero sigo siendo yo quien manda."
spn_gain_power.4012.a:0 "No he sido tan rápido como creía..."
spn_gain_power.4012.a.tt:0 "Aunque mis súbditos conocen mi naturaleza, sigo siendo su señor."
 
 ### Vampire Bite Night: Killed ###
spn_gain_power.4013.t:0 "Noche de mordida: muerte"
spn_gain_power.4013.desc:0 "Todo marchaba según lo previsto. Me acerqué sigilosamente a mi cortesano y lo compelí a permanecer en silencio y sin moverse. Pero... mi hambre ha podido conmigo y, mientras bebía su sangre, perdí la noción del tiempo. No advertí cuánto hacía que su cuerpo había quedado inerte."
spn_gain_power.4013.a:0 "Parece que mi sed pudo más que yo..."
spn_gain_power.4013.a.tt:0 "Dejé que mi sed de sangre me dominara y maté a mi pobre cortesano."
 
 #### Heart Eating Event ###
spn_gain_power.4020.t:0 "Corazón sano"
spn_gain_power.4020.desc:0 "Siento una oleada de fuerza y un deseo animal que me recorre el cuerpo. Esta noche es una oportunidad magnífica para adentrarme en el bosque y encontrar un animal del que alimentarme, ya que es menos probable que haya campesinos o gente del castillo deambulando por allí.\n\nHace ya tiempo que no me alimento del corazón de un animal, pues procuro evitar a los humanos para no levantar sospechas ni convertirme en presa de los cazadores. No es que los lugareños sean lo bastante sagaces como para ver en ello algo más que el ataque de una bestia..."
spn_gain_power.4020.a:0 "La noche ha caído. Me adentraré en el bosque."
spn_gain_power.4020.a.tt:0 "Por fin podré dar rienda suelta a mi hambre."
 
spn_gain_power.4020.ab.t:0 "Probabilidad de éxito en la caza"
spn_gain_power.4020.ac.t:0 "Probabilidad de ser descubierto"
spn_gain_power.4020.ad.t:0 "Probabilidad de matar a un humano"
spn_gain_power.4020.ae.t:0 "Probabilidad de morir"
 
 ### Heart Eating Event: Success ###
spn_gain_power.4021.t:0 "Corazón sano: caza exitosa"
spn_gain_power.4021.desc:0 "El poder palpita por mis venas en la soledad del bosque, donde no hay nadie salvo yo y los demás animales.\n\nHasta ahora solo he encontrado presas pequeñas, como conejos y zorros, pero percibo algo mayor en el viento justo antes de oír una rama quebrarse a mi espalda.\n\nMe vuelvo y veo un alce hermoso y majestuoso, con la carne tensada por músculos poderosos. En cuestión de instantes me lanzo al ataque; nuestros cuerpos chocan y su piel se desgarra bajo mis garras. Caigo sobre él como una fuerza de la naturaleza, abriéndome paso a dentelladas hasta alcanzar su corazón.\n\nCon el sabor de ese corazón aún en la lengua y la sangre empapándome casi de pies a cabeza, regreso desnudo a mi castillo."
spn_gain_power.4021.a:0 "Esta noche, mi fuerza ha crecido."
spn_gain_power.4021.a.tt:0 "Emprendo el regreso al castillo y me limpio."
 
 ### Heart Eating Event: Discovered ###
spn_gain_power.4022.t:0 "Corazón sano: descubierto"
spn_gain_power.4022.desc:0 "La caza de esta noche ha ido tan bien como cabía esperar. He logrado abatir un gran ciervo y también he dado alcance a un par de zorros cuyos corazones he devorado.\n\nCuando decido dar por terminada la noche y volver al castillo, recupero mi forma humana para limpiarme... y entonces comprendo que debería haber vigilado mejor los alrededores. Allí, sobre una loma y a lomos de un caballo, se encuentra uno de mis mensajeros, que regresa de ver al conde al que lo había enviado. Me mira con incredulidad y, acto seguido, espolea a su caballo hacia la aldea gritando: «¡Nuestro señor es un hombre lobo!».\n\nSupongo que el secreto ha salido a la luz."
spn_gain_power.4022.a:0 "¿Cómo no advertí que estaba tan cerca?"
spn_gain_power.4022.a.tt:0 "Llegaría al pueblo antes de que pudiera alcanzarlo; y si lo persiguiera, me verían aún más como el monstruo que soy."
 
 ### Heart Eating Event: Killed ###
spn_gain_power.4023.t:0 "Corazón sano: vasallo muerto"
spn_gain_power.4023.desc:0 "Mientras terminaba de esconder mi ropa y mi armadura, escuché un ruido lejano en el bosque y decidí adoptar mi forma de lobo y marcharme en dirección contraria. Solo necesito saciar mi hambre y volver; no tiene sentido meterme en problemas aquí fuera.\n\nLogré encontrar un alce magnífico a cierta distancia entre los árboles, y pensé que la suerte iba a sonreírme aún más cuando me abalancé sobre otra presa que se ocultaba tras una roca. Pero, en cuanto mis dientes se hundieron en su cuello, lo comprendí demasiado tarde...\n\nAcababa de arrancarle la garganta a uno de mis vasallos, y ahora recuerdo que tenía previsto salir de caza la próxima semana."
spn_gain_power.4023.a:0 "Parece que decidió empezar la cacería antes de lo previsto."
spn_gain_power.4023.a.tt:0 "Parece que no era un cazador cualquiera, sino uno de mis vasallos, que había salido a cazar en noche de luna llena."
 
 ### Heart Eating Event: Killed By Hunter ###
spn_gain_power.4024.t:0 "Corazón sano: muerte a manos de un cazador"
spn_gain_power.4024.desc:0 "Mi cacería ha ido bien. He podido alimentarme de un grupo de ciervos a los que logré acercarme sin ser visto, y eso me ha satisfecho enormemente.\n\nPlaneo cobrar una última presa antes de dar la noche por terminada y volver al castillo, aunque el crujido de aquellas ramas de antes me ha dejado algo intranquilo.\n\nConsigo localizar un último conejo cuando oigo otra rama partirse cerca de mí. En la misma dirección distingo un rostro conocido, justo en el instante en que una flecha brota de mi pecho.\n\nSolo lo había visto en mi corte, cuando vino a plantear un problema con bestias y criaturas de la noche. Parece que ha decidido tomarse la justicia por su mano..."
spn_gain_power.4024.a:0 "Derrotado por un cazador..."
spn_gain_power.4024.a.tt:0 "Bajo la vista y veo una flecha clavada en mi pecho."
