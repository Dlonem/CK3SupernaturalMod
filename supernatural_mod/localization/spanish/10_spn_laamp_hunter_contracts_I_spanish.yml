 laamp_hunter_contracts_title:0 "Caza de brujas"
 laamp_hunter_contracts_desc:0 "Un señor local ha emitido un contrato para capturar o eliminar a una presunta bruja que se oculta en la zona. Se rumorea que el objetivo posee poderes oscuros, pero por lo demás no es más que una plebeya sin sangre noble ni vínculos importantes."
