l_spanish:
 spn_wound_incubation.0010.t:0 "The Wound Festers"
 spn_wound_incubation.0010.desc:0 "The wound will not close. It weeps and burns, and a fever simmers beneath your skin. Something is taking root in you - and your body knows it does not belong."
 spn_wound_incubation.0010.a:0 "Rest and fight it off"
 spn_wound_incubation.0010.a.tt:0 "Wage war on the sickness. The infection recedes sharply - but the effort wears on you (#weak gain Stress#!)."
 spn_wound_incubation.0010.b:0 "Push through my duties"
 spn_wound_incubation.0010.b.tt:0 "No time to lie abed while you rule. The infection worsens, but you spare yourself the stress of idleness."
 spn_wound_incubation.0010.c:0 "Drown the fever in wine"
 spn_wound_incubation.0010.c.tt:0 "The infection worsens, but the drink dulls the fear (#high lose Stress#!)."
 spn_wound_incubation.0010.d:0 "Trust my body"
 spn_wound_incubation.0010.d.tt:0 "Your hardy frame throws off a great deal of the sickness."
 spn_wound_incubation.0010.e:0 "Cower and pray it passes"
 spn_wound_incubation.0010.e.tt:0 "Fear wins out. The infection digs deeper, but your nerves settle a little."
 spn_wound_incubation.0011.t:0 "Fevered Nights"
 spn_wound_incubation.0011.desc:0 "Sleep brings no rest. You wake drenched in sweat, copper on your tongue, your dreams thick with running and howling and the warm weight of the hunt. Each night, the dreams feel a little less like dreams."
 spn_wound_incubation.0011.a:0 "Endure it, night after night"
 spn_wound_incubation.0011.a.tt:0 "Grit your teeth and ride it out. The infection recedes, at the cost of Stress."
 spn_wound_incubation.0011.b:0 "Master the fever by will"
 spn_wound_incubation.0011.b.tt:0 "Your courage drives much of the sickness back, and steadies you besides."
 spn_wound_incubation.0011.f:0 "Study the sickness"
 spn_wound_incubation.0011.f.tt:0 "Turn a scholar's eye on your own affliction and find ways to blunt it."
 spn_wound_incubation.0011.c:0 "Surrender to the dark dreams"
 spn_wound_incubation.0011.c.tt:0 "Let the dreams take you. The infection surges, but the surrender eases your stress."
 spn_wound_incubation.0011.d:0 "My body has no fight left"
 spn_wound_incubation.0011.d.tt:0 "Your frail body gives ground and the infection surges."
 spn_wound_incubation.0030.t:0 "The Wound Worsens"
 spn_wound_incubation.0030.desc:0 "The wound has blackened at its edges, and dark threads of rot now climb the limb beneath the skin, hot and tight and stinking of something gone wrong deep inside. The surgeons mutter and will not meet your eye. If it is left to spread it will reach your heart, and no fever-cure in the world will matter then. There may be a way to save the limb yet - or you may have to give it up to keep your life."
 spn_wound_incubation.0030.a:0 "Fight to save the limb"
 spn_wound_incubation.0030.a.tt:0 "Risk keeping it. The strong of body and brave of heart are far likelier to win through; failure costs you the limb and worsens the infection."
 spn_wound_incubation.0030.b:0 "Give up the limb to save myself"
 spn_wound_incubation.0030.b.tt:0 "Lose the limb for certain - but cut a great deal of the infection away with it."
 spn_wound_incubation.0030.c:0 "Tend it with a healer's knowledge of my own"
 spn_wound_incubation.0030.c.tt:0 "Bring your own learning to bear on the rot. The skilled have a strong chance to save the limb and drive back the infection besides; and even should the limb be lost, you will have stemmed the worst of the spread."
 spn_wound_incubation.0012.t:0 "A Healer's Hands"
 spn_wound_incubation.0012.desc:0 "Your personal physician has tended every manner of sickness in their years of service, though never, they admit, one quite like this. They offer their craft freely - poultices steeped through the night, careful bleedings, cool cloths and a quiet vigil at your bedside - and ask only that you let them work. Yet a healer's eyes miss little, and the longer they linger over you, the more they may come to understand of what truly festers in your blood."
 spn_wound_incubation.0012.a:0 "Accept their full care"
 spn_wound_incubation.0012.a.tt:0 "A great deal of the infection is drawn out - but there is a #weak small chance#! they piece together what truly ails you."
 spn_wound_incubation.0012.b:0 "A cautious treatment only"
 spn_wound_incubation.0012.b.tt:0 "A modest improvement, with nothing given away."
 spn_wound_incubation.0012.c:0 "Refuse their meddling"
 spn_wound_incubation.0012.c.tt:0 "Send them off. The infection creeps on unchecked."
 spn_wound_incubation.0040.t:0 "A Hunter Grows Suspicious"
 spn_wound_incubation.0040.desc:0 "One of your own has the eyes of a monster-hunter, and they have been watching you. They corner you quietly: they have seen a sickness like this before, in those touched by the beast. 'Who did this to you?' they ask."
 spn_wound_incubation.0040.a:0 "Name the one who clawed me"
 spn_wound_incubation.0040.a.tt:0 "Give up the one who turned you. The hunter will mark them as prey - and if you are loyal or trusting, the betrayal will weigh on you."
 spn_wound_incubation.0040.b:0 "Deny everything"
 spn_wound_incubation.0040.b.tt:0 "Hold to the lie. If you are honest, keeping it will gnaw at you."
 spn_wound_incubation.0040.c:0 "Cow them into silence"
 spn_wound_incubation.0040.c.tt:0 "Frighten them off. They will not soon forgive the threat."
 spn_wound_incubation.0020.t:0 "The Wolf Stirs"
 spn_wound_incubation.0020.desc:0 "The change is taking hold. In the depths of the fever you feel the beast pressing at the edges of your mind, waiting. You sense, plainly, that you can give in to it - or fight to keep it out. The choice will shape how this ends."
 spn_wound_incubation.0020.a:0 "I want this - let it in"
 spn_wound_incubation.0020.a.tt:0 "Embrace the change. The infection eases and your stress lifts - the surest path to becoming a werewolf."
 spn_wound_incubation.0020.b:0 "I refuse to become a monster"
 spn_wound_incubation.0020.b.tt:0 "Fight the beast off. The strain raises the infection and your stress - but it is the only road to surviving #high without#! turning."
 spn_wound_incubation.0020.c:0 "Hold steady - not yet"
 spn_wound_incubation.0020.c.tt:0 "Decide nothing tonight. A small step back from the brink."
 spn_wound_incubation.0021.t:0 "The One Who Clawed You"
 spn_wound_incubation.0021.desc:0 "Word could be sent to [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] - the one whose teeth began all this. They know this sickness as no healer ever could, having walked its road themselves. But to ask for their help is to let them back into your life."
 spn_wound_incubation.0021.a:0 "Seek them out - I want to live"
 spn_wound_incubation.0021.a.tt:0 "Their guidance eases the infection, and opens a door between the two of you."
 spn_wound_incubation.0021.b:0 "Face this alone"
 spn_wound_incubation.0021.b.tt:0 "Refuse their help. If they forced this upon you, the bitterness will harden into a rivalry."
 spn_wound_incubation.0021.c:0 "Take their help now - and remember who owes whom"
 spn_wound_incubation.0021.c.tt:0 "Let them guide you through the worst of it (#weak lowers Infection#!) and let the bond form - but keep your own counsel. A wound forced upon you is a debt unpaid, and may yet sour into open rivalry once you no longer need them."
 spn_wound_incubation.0022.t:0 "Growing Closer"
 spn_wound_incubation.0022.desc:0 "[ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] has stayed near through the worst of it - holding the fever at bay, talking you through the long nights. Something has shifted between you. What it becomes is yours to decide."
 spn_wound_incubation.0022.a:0 "Let us be friends"
 spn_wound_incubation.0022.a.tt:0 "Bind yourselves as friends; the kinship steadies you against the infection."
 spn_wound_incubation.0022.b:0 "Let something kindle"
 spn_wound_incubation.0022.b.tt:0 "Let it become more than friendship - and see where the nights ahead lead."
 spn_wound_incubation.0022.c:0 "Keep them at a distance"
 spn_wound_incubation.0022.c.tt:0 "Hold them at arm's length."
 spn_wound_incubation.0023.t:0 "A Dangerous Closeness"
 spn_wound_incubation.0023.desc:0 "The nights with [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] have grown heavy with more than fever. They have held you through the dark, and the wanting between you is plain. There may not be many nights left - so how will you spend this one?"
 spn_wound_incubation.0023.a:0 "Lie with them - be my lover"
 spn_wound_incubation.0023.a.tt:0 "Take them as your lover. What follows, follows."
 spn_wound_incubation.0023.b:0 "Give them my whole heart"
 spn_wound_incubation.0023.b.tt:0 "Bind yourself to them utterly - there is a real chance you become soulmates."
 spn_wound_incubation.0023.c:0 "One reckless night, nothing more"
 spn_wound_incubation.0023.c.tt:0 "A single night, no promises - though nature may have other plans."
 spn_wound_incubation.0023.d:0 "Step back from the edge"
 spn_wound_incubation.0023.d.tt:0 "Pull away before it goes too far."
 spn_wound_incubation.9000.t:0 "The Fever Breaks"
 spn_wound_incubation.9000.desc:0 "It comes all at once - the fever cresting like a wave, your heart thundering, your very bones aching as though they mean to reshape themselves. This is the turning point, and you know it. Whatever you are when the night ends, you will not be what you were. There remains only the choice of how to meet it."
 spn_wound_incubation.9000.a:0 "Fight to live"
 spn_wound_incubation.9000.a.tt:0 "Throw your whole will into surviving. #weak Your fate rests mostly on how the ordeal has gone.#!"
 spn_wound_incubation.9000.b:0 "Surrender to the wolf"
 spn_wound_incubation.9000.b.tt:0 "Give yourself fully to the beast. #weak Leans hardest toward becoming a werewolf - if your body survives it.#!"
 spn_wound_incubation.9000.c:0 "Refuse to become a monster"
 spn_wound_incubation.9000.c.tt:0 "Resist to the bitter end. #weak The best hope of living without turning - but to fail this way is to die.#!"
 spn_wound_incubation.9000.d:0 "Trust my body's strength"
 spn_wound_incubation.9000.d.tt:0 "#weak A strong frame greatly improves your odds of surviving the turning.#!"
 spn_wound_incubation.9000.e:0 "Lean on the one who saw me through"
 spn_wound_incubation.9000.e.tt:0 "#weak Their steadying presence improves your chances - but in your weakness they gain a hook over you.#!"
 spn_wound_incubation.9010.t:0 "Something More"
 spn_wound_incubation.9010.desc:0 "The pain breaks - and what floods in to replace it is glorious. Strength like you have never known sings through every limb. You did not merely survive the change; you have mastered it.\n\nYou rise a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] - and something more besides."
 spn_wound_incubation.9010.a:0 "I am remade"
 spn_wound_incubation.9011.t:0 "The Change Takes Hold"
 spn_wound_incubation.9011.desc:0 "The fever ebbs, and a strange clarity settles in its place. The ache fades, the wound closes clean, and you feel the wolf settle into you as though it had always been there.\n\nYou have come through whole. You are a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] now."
 spn_wound_incubation.9011.a:0 "So be it"
 spn_wound_incubation.9012.t:0 "A Hard Turning"
 spn_wound_incubation.9012.desc:0 "You live. Barely. The change clawed its way through you and left its marks - nerves rubbed raw, a body wrung out and slow to mend.\n\nBut you live, and the wolf lives in you: a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], bought at a steep price."
 spn_wound_incubation.9012.a:0 "It was worth the cost... I think"
 spn_wound_incubation.9020.t:0 "The Curse Loosens Its Grip"
 spn_wound_incubation.9020.desc:0 "You fought it, night after night, and somehow - impossibly - you won. The fever breaks at last and does not return. The wolf never came for you.\n\nYou are no werewolf... but neither are you the one who was clawed. You are harder now, tempered by an ordeal few ever survive."
 spn_wound_incubation.9020.a:0 "I endured"
 spn_wound_incubation.9021.t:0 "A Bitter Reprieve"
 spn_wound_incubation.9021.desc:0 "The sickness releases you at last — but it does not leave you as it found you. The wolf never took; the fighting it did. You are torn open where the fever worked hardest, and it will be a long season before you can put weight on it without thinking.\n\nStill: you are alive, and you are yourself."
 spn_wound_incubation.9021.a:0 "I am still here"
 spn_wound_incubation.9030.t:0 "The Change Consumes You"
 spn_wound_incubation.9030.desc:0 "There is no fight left to give. The fever takes the last of your strength, and the thing struggling to be born in you cannot be born at all - it only burns through what little remains.\n\nThe curse has claimed another soul. This is where it ends."
 spn_wound_incubation.9030.a:0 "..."
 spn_wound_incubation.0050.t:0 "A Crisis of Faith"
 spn_wound_incubation.0050.desc:0 "In the long hours before dawn it is not the fever that torments you, but the question beneath it. What is this thing taking root in your flesh - a punishment, a trial, or a gift wearing the mask of a curse? You have prayed until the words lost their shape in your mouth. The priests name the beasts that walk as men abominations before God; and yet here you remain, His creature still, and something else besides. When you close your eyes you can no longer tell whether the howling you hear is the Devil at the door or your own soul learning a new and terrible tongue. However you mean to face your God through this, you must face Him alone."
 spn_wound_incubation.0050.a:0 "If God shapes all things, He shaped this too"
 spn_wound_incubation.0050.a.tt:0 "Make your peace with what you are becoming. The acceptance quiets both flesh and spirit (#weak lowers Infection, lose Stress, gain a little Piety#!) and sets you on the path of #EMP yielding#! to the change."
 spn_wound_incubation.0050.b:0 "Pray to be delivered from this damnation"
 spn_wound_incubation.0050.b.tt:0 "Beg Heaven to burn the curse out of you. The struggle wars on your body (#weak raises Infection, gain Stress#!) but tempers your faith (#weak gain Piety#!), and sets you on the path of #EMP resisting#! the change."
 spn_wound_incubation.0050.c:0 "Confess everything, and submit to His judgment"
 spn_wound_incubation.0050.c.tt:0 "Unburden your soul entirely and place what remains of your fate in holy hands. A profound act of faith (#high gain Piety, lose Stress#!)."
 spn_wound_incubation.0050.d:0 "Search the scriptures for the truth of what I am"
 spn_wound_incubation.0050.d.tt:0 "Turn a scholar's discipline upon your own damnation, and take some cold comfort in understanding it (#weak lowers Infection, gain a little Piety#!)."
 spn_wound_incubation.0050.e:0 "No just god would do this - I am done with prayer"
 spn_wound_incubation.0050.e.tt:0 "Turn your back on Heaven and meet the change on your own terms (#weak lowers Infection, lose Stress, lose Piety#!). Sets you on the path of #EMP yielding#! to the change."