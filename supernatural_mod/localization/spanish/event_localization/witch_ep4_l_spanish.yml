ev5.1.desc:0 "Tu investigación sobre la magia ha dado sus frutos. ¡Ya estás preparado para desarrollar tu siguiente hechizo!"
ev5.1.0.a:0 "Eso debe resultar útil para mis súbditos."
ev5.1.0.a_ct:0 "Obtienes el hechizo #italic Bendecir la tierra#! (interacción sobre ti mismo [interaction|E])."
bless_land:0 "Bendecir la tierra"
bless_land_desc:0 "Este hechizo mejora el bienestar de la provincia designada."
blessed_land_modifier:0 "Tierra bendecida"
ev5.1.0.b:0 "En realidad, me centraré en el desarrollo general."
