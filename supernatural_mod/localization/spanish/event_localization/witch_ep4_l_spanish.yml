ev5.28.desc:0 "Ambos os enfrentáis, midiéndoos con la mirada y preparándoos mentalmente para la batalla. De pronto tu oponente empieza a entonar un hechizo. Ves cómo su figura comienza a emanar la energía del poder que crece dentro de [char2.GetHerHim]. Tienes poco tiempo para reaccionar..."
ev5.28.desc_won1:0 "Has logrado contener los ataques del enemigo el tiempo suficiente para preparar el hechizo de destrucción definitiva. Una corriente de poder golpea a [char2.GetTitledFirstName] y desgarra a [char2.GetHerHim] hasta reducirlo a átomos..."
ev5.28.desc_won2:0 "Tus hechizos golpean a tu oponente con tanta fuerza y durante tanto tiempo que [char2.GetSheHe] acaba por caer de rodillas ante ti. [char2.GetSheHe|U] ya no tiene fuerzas para defenderse más: [char2.GetSheHe] está a tu merced."
ev5.28.desc_lost1:0 "Estás intentando defenderte con destreza de los hechizos de tu oponente cuando, de pronto, el ataque cesa por completo. Ves que tu adversario está en mitad de un hechizo muy complicado. Intentas lanzar uno propio para detener a [char2.GetHerHim], pero ya es demasiado tarde. El enemigo ha invocado una corriente de energía que te desgarra."
ev5.28.desc_lost2:0 "Intentas defenderte hábilmente de los hechizos enemigos, pero tu oponente es demasiado poderoso. Pierdes rápidamente las fuerzas y caes de rodillas, indefenso. Otro hechizo enemigo te destroza sin más."
ev5.28.desc_lost3:0 "Intentas defenderte con destreza de los hechizos enemigos, pero tu oponente es demasiado poderoso. Pierdes las fuerzas con rapidez y caes de rodillas, indefenso. Tu rival interpreta con generosidad aquello como una rendición y decide perdonarte."
ev5.28.desc_lost4:0 "Intentas defenderte con destreza de los hechizos enemigos, pero tu oponente es demasiado poderoso. Pierdes las fuerzas con rapidez y caes de rodillas, indefenso. Tu rival decide perdonarte, pero se lleva tus objetos mágicos como trofeo."
ev5.28.desc_lost5:0 "Intentas defenderte con destreza de los hechizos enemigos, pero tu oponente es demasiado poderoso. Pierdes las fuerzas con rapidez y caes de rodillas, indefenso. Tu rival decide perdonarte, pero te ves obligado a rendirte en la guerra."
ev5.28.desc1:0 "Tu oponente presiona sin cesar con sus hechizos. El espacio entre ambos vibra por el poder creciente."
ev5.28.desc2:0 "Por un instante, tu oponente deja de lanzar hechizos en tu dirección. Parece estar tramando algo."
ev5.28.desc3:0 "[char2.GetTitledFirstName] te lanza más hechizos; la magia estalla en el aire. Retrocedes con la sensación de que te estás quedando sin fuerzas..."
ev5.28.desc4:0 "[char2.GetTitledFirstName] retrocede bajo el asalto de tus hechizos. Ves que [char2.GetSheHe] se debilita cada vez más. ¡La victoria está cerca!"
ev5.28.desc5:0 "El duelo de magos continúa, pero percibes algo inquietante. Tu oponente está intentando repeler tus ataques mientras prepara un hechizo complejo. ¡El Hechizo de Perdición! Debes detener a [char2.GetHerHim]..."
ev5.28.desc6:0 "Los hechizos de tu oponente rebotan en su mayoría contra tus escudos mágicos, o logras contrarrestarlos, pero [char2.GetSheHe] también se está defendiendo bien, al menos por ahora."
ev5.28.desc7:0 "Tu oponente lanza un hechizo extremadamente complejo; nunca habías visto algo tan sofisticado. ¡Por poco consigues desviarlo! Empiezas a pensar que [char2.GetSheHe] llega tan lejos porque [char2.GetSheHe] no es un simple mortal."
ev5.30.desc:0 "Tu oponente no logró desviar uno de tus hechizos: el impacto fue letal y lo partió en dos. Parece que has vencido."
ev5.30.0.a:0 "Bien, ¿quién es el siguiente?"
ev5.30.0.b:0 "Nadie puede detenerme."
ev5.30.0.c:0 "¡Te tengo!"
game_concept_power_clash:0 "Choque de poder"
game_concept_power_clash_desc:0 "Durante un duelo de magos, el Choque de poder representa la ventaja o el equilibrio en el enfrentamiento mágico entre ambos participantes. Dominar al oponente mediante el Choque de poder es una forma de derrotarlo."
game_concept_doom_spell:0 "Hechizo de Perdición"
game_concept_doom_spell_desc:0 "El Hechizo de Perdición representa un conjuro lo bastante poderoso como para atravesar cualquier escudo mágico y borrar de la faz del mundo a cualquier oponente. Es una de las formas de vencer en un duelo de magos. Sin embargo, un hechizo así requiere tiempo para prepararse..."
