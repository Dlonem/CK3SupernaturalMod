ev5.1.0.c:0 "Un hechizo curativo será de gran ayuda."
ev5.1.0.d:0 "Deseo más magia."
greedy_power_modifier:0 "Ansia de poder"
use_boosted_spell:0 "Lanzas una versión amplificada del hechizo."
shadowstep_spell:0 "Paso sombrío"
shadowstep_spell_desc:0 "Este hechizo permite viajar con rapidez y seguridad o escapar de un encarcelamiento no mágico."
shadow_step_modifier:0 "Paso sombrío"
shadow_step_modifier2:0 "Paso sombrío"
shadow_step_prison_ct:0 "Este hechizo también puede liberarte de una prisión no mágica."
PRISON_MAGIC_SECURE_CUSTOM:0 "Esta prisión está protegida contra el uso de cualquier magia."
ev5.1.0.e:0 "¡La seguridad es lo primero!"
ev5.1.0.e_ct:0 "Obtienes el hechizo #italic Paso sombrío#! (interacción sobre ti mismo [interaction|E])."
ev5.1.0.e2:0 "Necesito algo para evitar las multitudes."
plague_spell_modifier:0 "Foco de peste"
plague_spell:0 "Hechizo de peste"
ev5.1.0.f:0 "Mis enemigos sentirán el dolor."
ev5.1.0.f_ct:0 "Obtienes el hechizo #italic Hechizo de peste#!."
ev5.1.0.k:0 "¡Que ardan! ¡Que ardan todos!"
ev5.1.0.k_ct:0 "Obtienes el hechizo #italic Tormenta de fuego#!."
ev5.1.0.healing_ct:0 "Obtienes el hechizo #italic Curación#!."
plague_spell_ct:0 "¡La mayoría de los personajes de la misma ubicación también enfermarán!"
ev5.2.title:0 "Plaga"
ev5.2.desc:0 "Sin razón aparente, de pronto te sentiste muy mal. El sirviente que intentó llevarte a la cama perdió el conocimiento: está enfermo, igual que tú. Parece que todo el mundo está enfermo, ¡todo tu reino! Sin embargo, nunca habías oído hablar de una enfermedad que golpeara tan de repente y a todos a la vez."
ev5.2.0.a:0 "¡Es una maldición!"
ev5.1.0.g:0 "¡Tengo una idea mejor!"
ev5.1.0.g_ct:0 "Obtienes acceso inmediato a la [decision|E] #italic Realizar investigación mágica#!."
mage_magic_research_terrain_cancel_negative_supply:0 "Acceso a la [decision|E] Realizar investigación mágica"
IS_SCHOLAR_CUSTOM:0 "Necesitas el rasgo Erudito o al menos 25 de conocimiento secreto para realizar investigación mágica."
ev5.1.0.g1:0 "¡Puedo permitirme más!"
ev5.1.0.h:0 "Podría usar la magia para acelerar mi mente."
ev5.1.0.h_ct:0 "Obtienes el hechizo #italic Hipercognición#! (interacción sobre ti mismo [interaction|E])."
hipercognition:0 "Hipercognición"
hipercognition_option_title:0 "Tipo de amplificación"
hipercognition_desc:0 "Un hechizo que incrementa enormemente la eficacia de tu mente."
hipercognition_modifier1:0 "Hipercognición (diplomacia)"
hipercognition_modifier2:0 "Hipercognición (marcial)"
hipercognition_modifier3:0 "Hipercognición (administración)"
hipercognition_modifier4:0 "Hipercognición (intriga)"
ev5.4.title:0 "¡Magia negra!"
ev5.4.desc:0 "Me encontré con [actor.GetTitledFirstName] y los rumores acerca de [actor.GetHerHim] resultaron ser ciertos. [actor.GetSheHe|U] dominaba los poderes del diablo. [actor.GetTitledFirstName] alzó las manos y de pronto me vi rodeado de fuego; apenas escapé con vida. Tengo la sensación de que, si [actor.GetSheHe] lo hubiera querido, [actor.GetSheHe] podría haberme reducido sin más a cenizas."
ev5.4.0.a:0 "Será mejor no buscar pelea con [actor.GetHerHim]."
ev5.4.0.b:0 "Lo tendré en cuenta."
ev5.5.title:0 "Reacción ante tu magia"
ev5.5.desc:0 "El hechizo funcionó y se produjo un gran revuelo. La gente empezó a gritar o a huir; algunos se quedaron paralizados por el terror. De pronto ves a unos cuantos guardias abrirse paso hacia ti, y desde luego no parecen venir con buenas intenciones."
ev5.5.0.a:0 "Intentaré escabullirme."
ev5.5.0.b:0 "¿De verdad quieren meterse con un mago? Idiotas."
ev5.5.0.b2:0 "¿De verdad quieren meterse con un demonio? Idiotas."
ev5.5.0.b_ct:0 "Quemas a los guardias hasta reducirlos a cenizas."
ev5.5.0.c:0 "Muy bien, me rindo."
ev5.5.0.a_ct:0 "Logras esquivar a los guardias."
ev5.6.desc:0 "¡[actor.GetTitledFirstName] es un verdadero mago! Cuando [actor.GetSheHe] empezó a lanzar hechizos y enviaron guardias tras [actor.GetHerHim], [actor.GetSheHe] simplemente los redujo a cenizas!"
ev5.6.0.a:0 "¡[actor.GetSheHe|U] es imparable!"
ev5.5.title2:0 "Intento de arresto"
ev5.1.0.i:0 "Déjame pensar..."
ev5.1.0.i_ct:0 "Ganarás un hechizo aleatorio."
ev5.1.0.j:0 "Debo pensarlo con cuidado."
ev5.1.0.j_ct:0 "Dentro de unos años reconsiderarás tu elección."
ev5.1.0.j_ct2:0 "Tendrás la posibilidad de elegir entre un repertorio de hechizos más amplio."
ev5.8.desc:0 "[actor.GetTitledFirstName] alzó las manos ante tus ojos, invocando una corriente de energía mágica que golpeó a [recipient.GetTitledFirstName]. [actor.GetSheHe|U] no solo es un auténtico mago, sino también lo bastante despiadado como para atacar a sus enemigos incluso delante de testigos."
ev5.8.0.a:0 "Increíble..."
artifacts_searching:0 "Buscar artefactos mágicos"
