artifacts_searching_intent_desc:0 "Céntrate en obtener información sobre artefactos mágicos."
artifacts_searching_desc:0 "Usa todos los recursos a tu alcance para obtener información sobre la ubicación de artefactos mágicos. Con suerte, también podrás preparar las circunstancias para hacerte con ellos."
artifacts_searching_host_desc:0 "Intentas obtener información o reclamaciones sobre artefactos mágicos."
