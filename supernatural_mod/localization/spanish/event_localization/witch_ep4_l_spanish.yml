ev7.0.d12:0 "Probaré un antiguo ritual."
ev81.0.desc:0 "¡La posición de las estrellas es perfecta! En un día como este, un acto de crueldad debería liberar el poder necesario para cumplir tus ambiciones."
ev81.0.a:0 "Saquearé una de las aldeas; nadie lo sabrá."
ev81.0.b:0 "¿Y si degüello a algunos mercaderes visitantes?"
ev81.0.c:0 "Una ejecución larga y dolorosa servirá."
ev5.58.title:0 "El poder del Gran Rito"
ev5.58.desc:0 "La ceremonia de tu aquelarre está surtiendo efecto: puedes sentir la magia flotando en el aire. Todo lo que tienes que hacer es tomarla..."
ev5.58.0.a:0 "Me estoy haciendo más fuerte."
ev8.0.e:0 "Hijo mío."
abraxas_name:0 "Abraxas"
DEMON_ARMY_NAME:0 "Carnicería"
ev5.60.opening:0 "[demon.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
ev5.60.desc:0 "He venido a conquistar este mundo. Los mortales son patéticos, pero los magos a veces causan problemas. Pareces ser el mayor desafío de los alrededores, así que empezaré contigo. ¡Que tu muerte sea el heraldo de un nuevo comienzo!"
ev5.60.0.a:0 "¿Qué demonios?!"
demon_conquest:0 "Invasión demoníaca"
NOT_IN_TRAVEL_0:0 "Este hechizo no se puede lanzar mientras viajas."
ev2.11.e:0 "No lo creo."
ev2.11.f:0 "¿Seguro que quieres meterte con un mago?"
