ev5.9.title:0 "Comienzos"
ev5.9.desc:0 "Has completado los preparativos preliminares, pero por ahora solo cuentas con unos pocos libros y rumores reunidos en tu corte. Necesitas analizar el material disponible y reunir más información. Te espera un trabajo arduo."
asp_witch_hunters_key_title:0 "¿Observado por cazadores de brujas?"
asp_witch_hunters_title:0 "¿Observado por cazadores de brujas?"
asp_breakthrough_key_title:0 "¡Avance!"
asp_breakthrough_title:0 "¡Avance!"
artifacts_searching_tt_positive_tiny:0 "Tu búsqueda #P avanza ligeramente#!."
artifacts_searching_tt_positive_medium:0 "Tu búsqueda #P avanza de forma notable#!."
artifacts_searching_tt_positive_major:0 "Tu búsqueda #P progresa de forma extraordinaria#!."
artifacts_searching_tt_negative_medium:0 "Tu búsqueda #N pierde bastante progreso#!."
asp_night_on_books_title:0 "Una noche entre libros"
asp_procrastination_title:0 "Un breve descanso"
ev5.10.title:0 "Oportunidad"
ev5.10.desc:0 "Ha surgido la oportunidad de comprar unos manuscritos que podrían contener información interesante. Parecen los diarios de algún viajero que presenció fenómenos inexplicables: la magia podría estar implicada."
ev5.10.0.a:0 "Esto es un callejón sin salida."
ev5.11.title:0 "Recursos humanos"
ev5.11.desc:0 "Debes utilizar a tu gente para ayudarte en la búsqueda. Deja que reúnan información, escuchen rumores y hablen con mercaderes y miembros del clero."
ev5.11.0.a:0 "Sí, deben implicarse más."
ev5.11.0.b:0 "Tienen que dar lo mejor de sí."
ev5.11.0.b_ct:0 "#N Poca probabilidad#! de atraer la atención de los cazadores de brujas."
ev5.11.0.c:0 "Sé perfectamente cómo conseguir que ayuden."
ev5.11.0.c_ct:0 "#N Probabilidad media#! de atraer la atención de los cazadores de brujas."
ev5.12.desc:0 "Puedes aprender muchas cosas limitándote a recopilar rumores. Deberías delegar esta tarea en tu maestro de espías; quién sabe cuántas cosas podrías descubrir así."
additional_tasks_modifier:0 "Tareas adicionales"
ev5.12.0.a:0 "Mi maestro de espías tiene tareas más importantes."
ev5.12.0.b:0 "Sí, es una buena idea."
ev5.13.title:0 "El Libro"
ev5.13.desc:0 "Un libro interesante ha caído en tus manos. Por desgracia, no hablas el idioma en que está escrito, aunque con un poco de suerte podrás traducir sus pasajes más importantes. Parece tratar sobre un objeto mágico."
ev5.13.0.a:0 "Lo intentaré."
ev5.13.0.b:0 "No habrá ningún problema con eso."
ev5.13.0.c:0 "Llevará tiempo, pero puedo hacerlo."
ev5.13.0.d:0 "Debería contratar a un traductor."
ev5.14.desc:0 "Han llegado hasta ti rumores de que alguien se interesa mucho por tus investigaciones. Esa persona parece muy preocupada por mantener el anonimato. Merodea por tu corte, pero consigue esquivar a los guardias. Podría tratarse de un espía... o de cazadores de brujas."
ev5.14.0.a:0 "Será mejor que deje mi búsqueda en suspenso un tiempo."
ev5.14.0.b:0 "Lo ignoraré."
ev5.15.desc:0 "He descubierto un ritual capaz de provocar sueños proféticos. Gracias a él, podría hallar algunas respuestas a cuestiones que me interesan. Sin embargo, hay un problema: tendría que sacrificar a mi familiar."
ev5.15.0.a:0 "Por supuesto que lo haré."
ev5.15.0.b:0 "Buscaré otra forma."
ev5.16.title:0 "Sin avances"
ev5.16.desc:0 "Tu búsqueda no te ha llevado a ninguna parte hasta ahora. Esta falta de avances no le hace ningún bien a tu estado de ánimo."
ev5.16.0.a:0 "Quizá necesite un descanso."
ev5.16.0.b:0 "Debo seguir trabajando..."
ev5.16.0.c:0 "Probaré con otro enfoque."
ev5.17.title:0 "Responsabilidades con el reino"
ev5.17.desc:0 "Tu búsqueda te deja sin tiempo para cumplir tus obligaciones habituales. Necesitas encontrar una manera de dividir tu atención."
ev5.17.0.a:0 "Mi trabajo actual es más importante."
ev5.17.0.b:0 "Mi reino es más importante."
ev5.17.0.c:0 "Si alguien tiene objeciones, estaré encantado de aclararlo."
ev5.18.desc:0 "Tu búsqueda está cobrando impulso: cada vez hay más fuentes y más gente implicada. Parte de la información que has reunido resulta prometedora..."
ev5.18.0.a:0 "¡No voy a bajar el ritmo!"
ev5.18.0.b:0 "Es hora de prepararse para la siguiente fase."
ev5.19.desc:0 "Lograste comprar un mapa supuestamente elaborado por una poderosa bruja. En él aparece marcado un lugar que podría contener algún tipo de anomalía mágica..."
ev5.19.0.a:0 "Este mapa es otra pieza del rompecabezas."
ev5.19.0.b_ct:0 "Aprenderás la ubicación del Lugar de Poder."
ev5.20.desc:0 "Según el mapa, el lugar de la anomalía mágica se encuentra en [magic_p.GetName], donde el aura arcana es especialmente intensa. Esta provincia pertenece a [owner_p.GetTitledFirstName]."
artifacts_searching_studies_completed_log_title:0 "Tu búsqueda no tuvo éxito."
artifacts_searching_studies_completed_log2_title:0 "Tu búsqueda fue un éxito."
ev5.21.desc:0 "Tu búsqueda no ha dado demasiado fruto. Sin duda existen artefactos mágicos en el mundo, pero sus poseedores guardan bien el secreto. Eso no cambia el hecho de que te invade una enorme decepción."
ev5.21.desc2:0 "Tras una investigación minuciosa, por fin has conseguido una pista concreta sobre [final_arti.GetName]. ¡Parece estar en posesión de [owner_a.GetTitledFirstName]!"
ev5.21.0.a:0 "¡Maldición!"
ev5.21.0.b:0 "He hecho un buen trabajo."
artifacts_searching_concluded:0 "Has descubierto la ubicación del artefacto mágico."
artifacts_searching_concluded2:0 "Has obtenido una reclamación sobre el artefacto mágico."
artifacts_searching_concluded3:0 "No has conseguido obtener esa reclamación."
artifacts_searching_concluded4:0 "Has obtenido una reclamación."
artifacts_searching_conclusion_desc:0 "Has llevado a cabo una búsqueda de artefactos mágicos..."
artifacts_searching_province_desc:0 ""
artifacts_searching_guest_desc:0 ""
ev5.22.title:0 "Búsqueda a gran escala"
ev5.22.desc:0 "Buscar artefactos mágicos no es una tarea sencilla, pero dispones de varias formas de reunir información. Es hora de elegir el enfoque inicial de tus esfuerzos."
ev5.22.0.a:0 "Usaré a mis espías."
ev5.22.0.b:0 "Usaré mis libros."
ev5.22.0.c:0 "Usaré mis contactos."
ev5.22.0.d:0 "Usaré mi aquelarre."
ev5.23.title:0 "Selección del objetivo"
ev5.23.desc:0 "Has encontrado menciones de varios artefactos mágicos. Algunos pueden ser más difíciles de localizar que otros. Debes decidir qué pista seguir."
ev5.23.0.a:0 "[arti1.GetNameNoTooltip]"
ev5.23.0.b:0 "[arti2.GetNameNoTooltip]"
ev5.23.0.c:0 "[arti3.GetNameNoTooltip]"
unlocks_artifacts_search_ct:0 "Desbloqueas la [activity|E] Buscar artefactos mágicos"
game_concept_magic_protection_desc:0 "La protección mágica básica bloquea la mayoría de los hechizos enemigos, pero puede romperse con un catalizador mágico o por obra de un mago lo bastante hábil. Algunos hechizos poderosos, como Deseo de muerte, Desterrar demonio o Golpe de poder, atraviesan la protección mágica básica por defecto. En cambio, la protección mágica completa, otorgada por hechizos poderosos, ciertos artefactos o efectos demoníacos, protege contra casi cualquier hechizo."
minor_demon:0 "Demonio menor"
major_demon:0 "Demonio"
prince_demon:0 "Príncipe del Infierno"
prince_demon2:0 "Princesa demoníaca"
