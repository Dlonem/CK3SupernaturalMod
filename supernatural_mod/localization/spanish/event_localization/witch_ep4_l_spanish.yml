ev5.32.desc:0 "De forma inesperada, [actor.GetTitledFirstName] decidió atacarte con un poderoso hechizo, que lograste desviar en el último instante. ¡Esto no puede quedar sin respuesta!"
ev5.33.title:0 "Estudiar magia"
ev5.33.desc:0 "Conseguiste hacerte con un pergamino que contiene mucha información interesante sobre magia. No trata directamente de artefactos mágicos, pero aun así puede ser útil."
ev5.33.0.a:0 "Merece la pena investigarlo."
ev5.33.0.b:0 "Prefiero centrarme en artefactos mágicos."
trait_source3:0 "Elegido"
trait_source3_desc:0 "Una vez cada pocos siglos llega al mundo un individuo excepcionalmente dotado, un obrador de milagros que comprende de forma intuitiva los matices de la magia mejor que nadie. Con el entrenamiento adecuado, tendrá potencial para alcanzar un poder capaz de igualar al de príncipes demoníacos o incluso dioses menores."
ev5.34.desc:0 "Hoy te has encerrado en tus aposentos para ponerte al día con algunas de las tareas burocráticas habituales cuando, de pronto, te has dado cuenta de que no estabas solo en la habitación. Un hombre ha aparecido de la nada; de algún modo ha conseguido engañar a tus guardias. No parece un asesino, aunque sientes que es alguien a quien conviene tomarse muy en serio."
ev5.34.0.a:0 "¿Quién demonios eres?"
ev5.35.desc:0 "Me llamo Merlín y, bueno, soy un hechicero. No pongas esa cara: sé que tienes cierto interés por la magia. Perdona la intrusión, pero vengo por negocios. Hay cierto demonio escondido en tus dominios con quien tengo una cuenta pendiente. Sin embargo, necesito ayuda para encontrarlo y capturarlo."
ev5.35.0.a:0 "¿Un demonio? Suena serio."
ev5.35.0.b:0 "Continúa."
ev5.36.desc:0 "Eso es, en resumen. Este demonio causó mucho daño a la humanidad y preferiría que no volviera a ocurrir. No te preocupes: en una confrontación directa no es tan amenazadora; de lo contrario, no te involucraría."
ev5.36.0.a:0 "'Ella'?"
ev5.37.desc:0 "Pandora, así se llama. Es posible que no sea el único que la esté buscando, así que deberíamos darnos prisa. ¿Me ayudarás? Serás recompensado, por supuesto."
ev5.37.0.a:0 "Déjalo estar. Prefiero no tener a un demonio cerca."
ev5.37.0.b:0 "Te ayudaré, pero no gratis..."
ev5.37.0.c:0 "Creo que no me lo estás contando todo."
ev5.37.0.d:0 "No, no quiero tener nada que ver con esto."
ev5.37.0.d_ct:0 "Merlín buscará la ayuda de otra persona."
ev5.38.desc:0 "Cuanto menos sepas, más tiempo conservarás la felicidad y la paz mental. Entonces, ¿qué dices, me ayudarás?"
ev5.39.desc:0 "Excelente. Tengo una idea de por dónde podemos empezar la búsqueda. La demonia es demasiado astuta para que pueda rastrearla con magia, pero una búsqueda convencional podría dar resultados, siempre que te dé algunas pistas..."
ev5.39.0.a:0 "Haré que mi gente investigue."
ev5.39.0.a_ct:0 "Siguiendo el consejo de Merlín, enviarás a tus espías."
ev5.39.0.a_ct2:0 "Tendrás que esperar los resultados."
ev5.40.title:0 "La búsqueda de Pandora"
ev5.40.desc:0 "Tus agentes han conseguido un dibujo de la mujer a la que buscan; al parecer, Pandora se disfrazó de mujer corriente. Sin embargo, por ahora no han descubierto ninguna pista sólida. La búsqueda empieza a salir cara, y Merlín no ha reaparecido desde vuestra última conversación."
ev5.40.0.a:0 "Enviaré a más agentes a buscar."
ev5.40.0.b:0 "Delegaré esto en mi hombre de confianza."
ev5.40.0.c:0 "Es hora de poner fin a esta locura."
ev5.40.0.c_ct:0 "Interrumpes la búsqueda de Pandora."
ev5.41.opening:0 "[yaga0.Custom2('AppropriateGreeting', ROOT.Char)]"
ev5.41.desc:0 "Mis espías informan de que estás realizando cierta tarea para Merlín; sospecho que implica capturar a un demonio llamado Pandora. No sé qué te habrá prometido ese embaucador, pero yo te daré el doble. Espero que me entregues a Pandora en cuanto la captures."
ev5.41.0.a:0 "Mmm, esto se está poniendo interesante."
mefisto_name:0 "Mefistófeles"
ev5.41.0.b:0 "Quizá reanude la búsqueda."
ev5.41.0.b_ct:0 "La búsqueda de Pandora continuará."
ev5.41.0.c:0 "Esto no me interesa."
ev5.42.title:0 "Mefisto"
ev5.42.desc:0 "Un hombre aparece de pronto frente a ti... O quizá no sea un hombre: percibes en él un leve olor a azufre y magia. Otro visitante inesperado, este con aspecto muy despreocupado. \"Permíteme presentarme: Mefistófeles, a tu servicio.\""
ev5.42.0.a:0 "¡Demonio!"
ev5.43.desc:0 "Tranquilo, soy un demonio civilizado; he vivido entre humanos durante mucho tiempo. De hecho, he venido a ayudar: al parecer buscas a alguien. Oh, sí, Pandora... Sé dónde se esconde."
ev5.43.0.a:0 "¿Por qué quieres ayudarme?"
ev5.44.desc:0 "Por diversión. Tengo curiosidad por ver cómo acabará la historia: ¿te convertirás en el títere de Merlín o en el esbirro de Yaga? ¿O seguirás tu propio camino? ¡Los mortales podéis ser divertidísimos! En cualquier caso, Pandora se esconde en el castillo de [rrrcounty.GetName]; ha engañado a [rrruler.GetTitledFirstName] y se siente a salvo allí. Creo que la muerte violenta de [rrruler.GetTitledFirstName] la hará salir de su escondite y después ayudaré a tu maestro de espías a tender la trampa. Por supuesto, también podéis limitaros a asaltar los muros del castillo..."
ev5.44.0.a:0 "Gracias por la sugerencia... ¿Por qué es tan importante esta Pandora?"
ev5.45.desc:0 "\"Excelente pregunta, ¿no crees?\" —rió el demonio—. \"Si lo supieras, no tendría tanta gracia. Ocúpate de [rrruler.GetTitledFirstName], y Pandora quedará a tu alcance. Quizá volvamos a vernos.\" El demonio desapareció."
ev5.45.0.a:0 "Estupendo..."
ev5.45.0.a_ct:0 "Debes conquistar un condado o asesinar al protector de Pandora."
pandora_name:0 "Pandora"
ev5.47.desc:0 "Tu gente logró encontrar a una mujer que encajaba con la descripción. No opuso resistencia, pero sin duda era la persona que buscabas. Es demasiado hermosa para ser una mujer mortal..."
ev5.47.0.a:0 "¿Qué tienes de especial, demonio? Habla."
ev5.47.desc2:0 "La carta firmada por Mefistófeles contenía el lugar y la hora exactos en que estaría Pandora. Al parecer, intentaba escabullirse para buscar un nuevo escondite. Tu gente la interceptó; sin duda es la persona que buscabas. Es demasiado hermosa para ser una mujer mortal."
ev5.49.desc:0 "Cualquier otro demonio en mi lugar os habría despedazado a ti y a tus hombres, ¿lo sabías? Pero yo siempre he tenido demasiado respeto por la vida; por eso me escondo. Se profetizó que yo sería quien trajera la perdición a este mundo. Una vez, por culpa de mi descuido, usé un artefacto que provocó un gran cataclismo. Algunos creyeron que entonces se había cumplido la profecía, pero también hay quienes creen que la verdadera perdición aún está por llegar gracias a mí."
ev5.49.0.a:0 "Parece increíble."
ev5.49.0.b:0 "¿Un artefacto?"
ev5.50.desc:0 "El artefacto desapareció hace mucho, pero existen muchos poderes antiguos que pueden amenazar este mundo, y quizá yo sea la clave de ello. Tal vez. No voy a permitir que eso ocurra, pero tampoco voy a luchar contra ti. Sé razonable... y déjame marchar. Encontraré un lugar seguro para mí y me mantendré alejada de los problemas, como he hecho durante los últimos siglos."
ev5.50.0.a:0 "Si todo esto es cierto... entonces debes morir."
ev5.50.0.b:0 "Que así sea, puedes irte."
ev5.50.0.b_ct:0 "Pandora se marchará y probablemente nunca volveréis a veros."
ev5.50.0.c:0 "Te quedarás conmigo; aquí estarás a salvo."
ev5.50.0.c_ct:0 "Pandora se quedará en tu corte."
ev5.50.0.d:0 "Eres un problema de Merlín; él se ocupará de ti."
ev5.50.0.d_ct:0 "#P Merlín te recompensará.#!"
ev5.50.0.e:0 "Creo que simplemente te entregaré a Baba Yaga."
ev5.50.0.e_ct:0 "#P Baba Yaga te recompensará.#!"
ev5.51.desc:0 "\"Ha llevado mucho tiempo, pero veo que mereció la pena\" —dijo Merlín—. \"No estaba seguro de poder confiar en ti, pero dudé de ti sin motivo. Te has ganado mi gratitud y, por supuesto, tu recompensa.\""
ev5.51.0.a:0 "¿Qué pasará con Pandora?"
ev5.51.0.b:0 "Sí, mi pago. Hablemos de ello."
ev5.52.desc:0 "Según las profecías, Pandora contribuirá al apocalipsis. Todo debe terminar algún día, incluso este mundo, pero preferiría que no sucediera pronto. Conozco un hechizo de viaje temporal muy inestable. Enviaré a Pandora a... ¿2012? ¿Quizá 2024? Aún no estoy seguro. Será mejor que hablemos de tu recompensa."
ev5.52.0.a:0 "¿Sí?"
ev5.53.desc:0 "Te interesa la magia, así que podría contarte algunos secretos mágicos. O simplemente podría darte unas cuantas gemas..."
ev5.53.0.a:0 "En realidad, no esperaba compensación alguna de mi amigo."
ev5.53.0.b:0 "Sí, enséñame magia."
ev5.53.0.c:0 "Aceptaré dinero."
ev5.54.desc:0 "\"Buena elección\" —dijo Yaga—. \"Quién sabe qué habría hecho Merlín con Pandora. Así la situación está bajo control, y cuentas con mi gratitud.\""
ev5.54.0.a:0 "¿Tu gratitud tiene alguna consecuencia material?"
ev5.55.desc:0 "La profecía dice que Pandora traerá la destrucción al mundo. El significado exacto debe de ser que el hijo de Pandora podría tener la capacidad de destruirlo. Es posible: el mestizaje entre humanos y demonios a veces provoca mutaciones peculiares, y así nacen los magos más poderosos. Lanzaré una maldición para que Pandora nunca tenga hijos; eso resolverá el problema. Después, ella seguirá su camino. Maldecir a los demonios es difícil, pero encontraré la forma."
ev5.56.desc:0 "Sí, ha llegado el momento de tu recompensa. Soy demasiado vieja para tomar otro aprendiz, pero puedo darte algunos consejos sobre cómo conseguir el artefacto mágico. También añadiré unas cuantas pociones que podrían resultarte útiles. Además, tengo otra hija, aunque la mantengo en secreto. Es joven y capaz, y podría entregártela... si prometes cuidar de ella."
ev5.56.0.a:0 "Me interesan los artefactos mágicos."
ev5.56.0.b:0 "Me encantaría conocer a tu hija."
ev5.57.desc:0 "\"¡Vaya giro tan estupendo!\" —Mefistófeles apareció de la nada—. \"No estoy decepcionado contigo. Tus acciones merecen algún tipo de premio. ¿Magia? ¿Oro? ¿Un apretón de manos? Solo tienes que decirlo.\""
ev5.57.0.a:0 "El oro siempre viene bien."
ev5.57.0.b:0 "Simplemente vete."
trait_cyrographer:0 "Pactista"
trait_cyrographer_desc:0 "A este demonio le encanta hacer tratos con mortales."
as_art_may_be_out_of_reach_ct:0 "#N Este artefacto puede estar fuera de tu alcance diplomático.#!"
