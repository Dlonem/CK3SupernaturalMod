ev5.31.desc:0 "De pronto te das cuenta de que tus guardias han sido atacados por varias personas, y justo junto a tu cabeza pasa disparado un virote. Parece una emboscada de gente bastante bien entrenada: son cazadores de brujas. Pronto volarán más virotes hacia ti, y tus guardias no resistirán mucho."
