rival_my_master_opinion_modifier:0 "Enemigo de mi maestro"
magic_warning_modifier:0 "Intercambio de información"
hell_dynasty:0 "Infierno"
hell_house:0 "Infernal"
ev16.t.a:0 "Las enseñanzas del demonio"
mammon_name:0 "Mammon"
ev30.0.title:0 "Desconocido"
ev30.0.desc:0 "Una figura humanoide aparece en tus aposentos. No parece una criatura de este mundo. El extraño te observa en silencio."
ev30.0.a:0 "Eh... ¿eres un demonio?"
ev31.0.desc:0 "\"No, soy Carlomagno, de vuelta para la segunda ronda. Claro que soy un demonio. Y tú, ¿eres mortal o simplemente idiota?\""
ev31.0.a:0 "Sí, soy un brujo."
ev31.0.b:0 "¡No, claro que no! Yo también soy un demonio."
ev31.0.c:0 "No, yo soy... otra cosa."
ev31.0.d:0 "No es asunto tuyo."
ev32.0.desc:0 "\"Estupendo. ¿Y por qué estoy aquí?\""
ev32.0.a:0 "Quiero que hagas algo por mí."
ev32.0.b:0 "No estoy seguro."
ev32.0.c:0 "Vale, ya basta. Desaparece."
ev33.0.desc:0 "No se me da muy bien hacer \"algo\". Yo solo entiendo de números."
ev33.0.a:0 "¿Qué cifras?"
ev34.0.desc:0 "Aritmética, ganancias, pérdidas, ingresos, rendimientos, intereses, impuestos..."
ev34.0.a:0 "Espera un segundo. Eso significa que puedes darme oro, ¿verdad?"
ev34.0.b:0 "¿Ganancias? ¿Ves el futuro? Muéstramelo."
ev35.0.desc:0 "Sí, puedo. Lo cierto es que tengo montones de lingotes de oro, monedas y joyas. ¿Quieres un poco?"
ev35.0.a:0 "Claro."
ev35.0.b:0 "Preferiría que me enseñaras esa... aritmética."
ev35.0.c:0 "Dame... ¡más!"
financial_knowledge_modifier:0 "Conocimiento financiero"
cursed_gold_modifier:0 "Oro maldito de Mammon"
ev36.0.desc:0 "\"Interesante. Veamos... Estoy dentro del círculo de invocación, por eso estoy retenido. Esta cámara parece el laboratorio primitivo de una bruja, y en el aire flota un olor reciente a magia. Parece que has lanzado un hechizo que me ha invocado. ¿A propósito? Eso creo. Probablemente buscas conocimiento o poder. Poseo ambos. Libérame y los compartiré contigo...\""
ev36.0.a:0 "Así sea. Te libero."
ev36.0.b:0 "Buen intento."
ev37.0.title:0 "Premio Darwin"
ev37.0.desc:0 "\"Necio\" —el demonio ha salido del círculo—. \"Como te prometí, te mostraré mi poder...\""
ev37.0.a:0 "¡Nooooooo...!"
ev38.0.desc:0 "No eres ningún necio, bien. Entonces, ¿qué deseas, brujo? Ten cuidado con lo que pides..."
ev38.0.a:0 "Desata mi potencial."
ev38.0.b:0 "Conocimiento secreto."
ev38.0.c:0 "Quiero riqueza."
ev38.0.d:0 "¡Quiero riqueza! Arcones llenos de objetos valiosos..."
mammons_knowledge_modifier:0 "Conocimiento de Mammon"
lilith_name:0 "Lilith"
ev39.0.title:0 "Lilith"
ev39.0.desc:0 "Un súbito destello de luz inunda el lugar y entonces ves... al demonio más hermoso imaginable. \"Hola, guapo\"; en su voz percibes algo... dominante."
ev39.1.desc:0 "Un súbito destello de luz inunda el lugar y entonces ves... a un ángel. \"Hola, belleza\"; en su voz percibes algo... dominante."
ev39.0.a:0 "Bienvenida, mi señora..."
ev40.0.desc:0 "Hacía tiempo que no recorría este reino. Es un lugar agradable, por cierto; me gusta. Aunque cambiaría unas cuantas cosas... Verás, me alegra estar aquí. Allá abajo todo es tan aburrido que no lo echaré de menos en absoluto."
ev40.0.a:0 "En realidad, yo..."
ev41.0.desc:0 "En realidad, tienes pinta de necesitar un poco de diversión. Creo que puedo hacer algo al respecto..."
ev41.0.a:0 "¿...sí?"
ev41.0.b:0 "Silencio. Yo te he invocado y ahora debes concederme mi deseo."
ev42.0.desc:0 "Un deseo... enséñame tu alcoba. Tengo la sensación de que allí estaremos más cómodos. Confía en mí: puedo hacer realidad tu deseo."
ev42.0.a_not_used:0 "Excelente idea, ven."
ev42.0.a:0 "Como desees, mi señora."
ev43.0.desc:0 "Adoro los deseos. Dime qué anhelas. ¿Placer? ¿Fama? ¿Honores y respeto? O... ¿leer la mente? A veces resulta útil."
ev43.0.a:0 "Placer."
ev43.0.b:0 "Fama y respeto."
ev43.0.c:0 "¿Lectura mental? Desde luego."
ev43.0.d:0 "Belleza."
ev43.0.e:0 "Una vida larga y feliz."
lilith_blessing:0 "Bendición de Lilith"
ev46.0.title:0 "Las necesidades de Lilith"
ev46.0.desc:0 "Esta mañana Lilith vino a verte con gesto avinagrado. \"¡Me aburro! Vamos a hacer algo divertido. Tienes que organizar un festín cuanto antes.\""
ev46.0.a:0 "Claro, cariño. Pronto, lo prometo."
ev46.0.b:0 "No, quiero mantenerme concentrado."
ev46.0.c:0 "Tengo una idea mejor."
ev48.0.title:0 "Los planes de Lilith"
ev48.0.desc:0 "Hoy Lilith vino a verme con una idea disparatada. \"Se me ha ocurrido un plan\" —dijo alegremente—. \"Iré a ver a [riv.GetTitledFirstName] y averiguaré qué está tramando. Debería ser fácil.\" Miras sus ojos fascinantes y sabes que no será fácil negarle nada."
ev48.0.a:0 "Eh... sí, cariño, gran idea."
ev48.0.b:0 "Creo que es demasiado arriesgado."
ev48.0.c:0 "Te necesito aquí y tengo pruebas de sobra para demostrarlo."
ev49.0.title:0 "Visitante nocturna"
ev49.0.desc:0 "Te despiertan en plena noche unos golpes en la puerta. Qué extraño; debe de tratarse de algo urgente. Al abrir, ves a una de tus nuevas cortesanas. ¿Y adónde han ido los guardias? Deberían estar aquí... Aunque, por otro lado, ella tiene un aspecto fascinante; quizá sea una suerte que estéis solos. Solo hay un motivo por el que ha venido."
ev49.0.a:0 "Entra."
ev49.0.b:0 "Fingiré que no te he visto. Déjame en paz."
ev50.0.desc:0 "\"¿Cómo te atreves, mortal?\" Te partió el cuello de un tirón, más rápido de lo que parecía posible."
ev50.0.a:0 "¿Qué...?"
ev51.0.title:0 "Ella regresa"
ev51.0.desc:0 "Parece avergonzada. \"No todo salió según lo previsto\" —dice Lilith—. \"No preguntes; fui impulsiva. ¡Pero te eché de menos!\""
ev51.0.a:0 "Yo también te eché de menos, cariño."
ev52.0.desc:0 "\"¡Me lo contó todo!\" —dice ella—. \"Fue demasiado fácil. Tendré que buscar un desafío mayor.\""
ev52.0.a:0 "Buen trabajo, cariño."
ev53.0.desc:0 "Lilith parece... distinta. ¿Evita tu mirada? Tras un momento incómodo dice: \"[riv.GetTitledFirstName] es una persona bastante encantadora... Me quedaré con [owner.GetHerHim]. Te dejo. Adiós.\""
ev53.0.a:0 "Mierda..."
ev54.0.title:0 "Los deseos de Lilith"
ev54.0.desc:0 "\"Quiero ser tu reina\" —dijo Lilith un día—. \"Tus súbditos también deben ser los míos. Me tomarás por esposa, según tu absurda religión.\"\n\"Pero, cariño, ¡ya tengo esposa!\" —respondes desesperado.\n\"No te preocupes\" —replica con tono inocente—. \"Simplemente le cortaré la cabeza y te la regalaré como recuerdo.\""
ev54.0.a:0 "Así sea."
ev54.0.b:0 "Está bien como está ahora."
ev54.0.c:0 "Hablaremos de ello más tarde."
ev55.0.title:0 "La naturaleza de Lilith"
ev55.0.desc:0 "Lilith ha venido a tus aposentos cubierta de sangre. Resulta que ha asesinado a uno de tus consejeros.\n \"Estaba de mal humor\" —dice—. \"No te enfades conmigo.\" Lilith sonríe como una niña pequeña."
ev55.0.a:0 "Claro, cariño, no pasa nada."
ev55.0.b:0 "¡No puedes matar a mis consejeros como si nada!"
ev56.0.desc:0 "Lilith ha hecho hoy una petición inusual. \n\"Necesito algo de oro, ya sabes; tengo que comprar unas cuantas cosas. Vestidos nuevos, joyas... Creo que 200 monedas serán suficientes.\""
ev56.0.a:0 "Claro, cariño."
ev56.0.b:0 "¿200 de oro para... vestidos? Ni hablar."
ev2.2.title:0 "¿Artefacto mágico?"
ev2.2.desc:0 "Ha surgido una oportunidad interesante en tu corte: uno de los forasteros quiere venderte un artefacto mágico. \n\"El precio no es excesivo: solo 100 monedas\", asegura el vendedor."
ev2.2.a:0 "¡Me lo quedo!"
ev2.2.b:0 "Parece falso."
ev2.2.c:0 "La magia no existe."
ev2.2.d:0 "Quizá en otro momento."
fake_magic_artifact:0 "Espada \"mágica\" falsa"
fake_magic_artifact_desc:0 "Chatarra corriente que pretende pasar por un objeto mágico."
ev2.2.a_ct:0 "Obtendrás una \"espada mágica\"."
NOT_WAR_AGAINST:0 "No mientras estés en guerra contra el objetivo."
ev2.3.title:0 "¿Nuevo enemigo?"
ev2.3.desc:0 "Todo indica que [enemy.GetTitledFirstName] también practica magia avanzada. [enemy.GetSheHe|U] podría causarte problemas en el futuro."
ev2.3.a:0 "Me ocuparé de [enemy.GetHerHim]."
ev2.3.b:0 "Confío en [enemy.GetHerHim]; [enemy.GetSheHe] no me traicionará."
ev2.3.c:0 "No supone una amenaza."
ev2.3.d:0 "No hay nada de lo que preocuparse."
ev2.4.title:0 "Nuevo enemigo"
ev2.4.desc:0 "Todo indica que [this0.GetTitledFirstName] también practica magia avanzada. [this0.GetSheHe|U] podría causarte problemas en el futuro."
ev2.4.a:0 "Ya veremos."
ev2.5.title:0 "¡Ha llegado la hora de actuar!"
ev2.5.desc:0 "[enemy.GetTitledFirstName] probablemente ya esté conspirando contra ti. Quizá deberías plantearte un ataque preventivo."
ev2.5.a:0 "Difundiré rumores dañinos sobre [enemy.GetHerHim]."
ev2.5.b:0 "Aún no."
ev2.5.c:0 "Haré que mi esbirro se encargue."
ev2.5.d:0 "Acabaré con [enemy.GetHerHim] de una vez por todas."
ev2.5.f:0 "Maldeciré sus tierras."
strike_duel_mages_ct:0 "Atacarás a [this0.GetTitledFirstName] directamente en un duelo a muerte."
ev2.5.e:0 "Tengo asuntos más urgentes."
harmful_rumors_modifier:0 "Rumores dañinos"
preparation_for_strike_modifier:0 "Preparación para un golpe"
ev2.6.title:0 "¡El enemigo ataca!"
ev2.6.desc:0 "Tu enemigo ha decidido desafiarte en tu propio castillo. Engañó a tus guardias con algún hechizo y te atacó espada en mano."
ev2.6.a:0 "¡Por fin!"
game_concept_mminion:0 "Esbirro"
game_concept_mmaster:0 "Maestro"
game_concept_mminion_desc:0 "Un simple sirviente."
game_concept_mmaster_desc:0 "Un señor con sus propios esbirros."
ev2.7.title:0 "Experimentación mágica"
ev2.7.desc:0 "Tu nivel de iniciación te permite llevar a cabo una investigación que abrirá el camino hacia el verdadero poder. Pero, ¿te atreverás a correr el riesgo?"
ev2.7.a:0 "Estoy preparado para ello."
ev2.7.b:0 "Es demasiado peligroso."
minion_starts_scheme_ct:0 "[minion.GetTitledFirstName] tramará la venganza y planeará el asesinato de [enemy.GetTitledFirstName]."
masters_orders_modifier:0 "Órdenes del maestro"
ev2.8.title:0 "Aún más poderoso"
ev2.8.desc:0 "La práctica prolongada de la magia te ha vuelto más poderoso. Has llegado a la conclusión de que no existen límites."
ev2.8.a:0 "¡Soy el dios del nuevo mundo!"
ev2.9.title:0 "Órdenes del maestro"
ev2.9.desc:0 "Mi maestro, [this0.GetTitledFirstName], me ha ordenado matar a su enemigo: [enemy.GetTitledFirstName]. Lo haré lo mejor que pueda."
ev2.9.a:0 "Como desees, maestro."
ev2.10.title:0 "Camino hacia el verdadero poder"
ev2.10.desc:0 "En una visión viste que [target.GetTitledFirstName] posee un objeto de poder increíble. Hacerte con él te abriría nuevas oportunidades."
ev2.10.a:0 "¡Esta es mi oportunidad!"
ev2.10.b:0 "Es demasiado arriesgado."
NOT_HAVE_MAGE_TOWER:0 "Ya tienes una Torre del mago."
looked_to_the_future:0 "Miró hacia el futuro"
ev2.11.title:0 "Dame tu alma"
ev2.11.desc:0 "Esta noche, en tu cámara, se manifiesta un ser que no procede de este mundo. Percibes un intenso olor a azufre... y sientes un frío glacial.\n\"Vendiste tu alma hace mucho. Hoy me la llevaré al infierno, mortal\", dice el demonio."
ev2.11.a:0 "De acuerdo. Voy contigo."
ev2.11.b:0 "Espera, ¿no hay otra forma?"
ev2.11.c:0 "Quizá seas inmune a la magia, pero mi hoja te enviará de vuelta al infierno."
ev2.11.d:0 "¡Usaré un simple hechizo de destierro del Libro de las Sombras, zorra de ojos negros!"
banish_demon_ct:0 "El demonio será desterrado de este mundo."
ev2.12.desc:0 "La criatura se queda pensativa un instante.\n\"Puedo darte más tiempo, si me dejas saborear tu cuerpo.\""
ev2.12.a:0 "Elijo la muerte."
ev2.12.b:0 "Así. Sea."
fucked_by_demon_modifier:0 "Amante de un demonio"
ev2.13.title:0 "Regreso al infierno"
ev2.13.desc:0 "Ha llegado la hora de volver al infierno."
ev2.13.a:0 "Vale."
ev2.14.title:0 "¡El humano debe morir!"
ev2.14.desc:0 "Ningún mortal debería suponer una amenaza para ti, pero la existencia de brujos resulta preocupante."
ev2.14.a:0 "Rrrrr... magos... Los odio a todos."
ev2.16.title:0 "Hora de cazar"
ev2.16.desc:0 "Has encontrado tu vocación: toda bruja, demonio, brujo o monstruo debe morir. Esa es tu misión."
ev2.16.a:0 "Estoy preparado."
ev2.17.title:0 "Caza de brujas"
ev2.17.desc:0 "Según tu investigación, [witch.GetTitledFirstName] practica magia oscura. Debes juzgar a [witch.GetHerHim]."
ev2.17.a:0 "Empezaré los preparativos."
ev2.17.b:0 "Aún no."
ev2.17.c:0 "Enviaré a mis cazadores."
ev2.17.c_ct:0 "Se enviará a un cazador."
ev2.18.title:0 "Juicio de brujería"
ev2.18.desc:0 "\"Se te acusa de practicar brujería\" —dice [imprisoner.GetTitledFirstName]—. \"Confiesa tu culpa y reza por el perdón de tu alma... si aún tienes una.\""
ev2.18b.desc:0 "\"¡Confiesa!\" —grita [imprisoner.GetTitledFirstName]—. \"Puedo tenerte aquí el resto de tu miserable vida.\""
ev2.18.a:0 "¡Soy inocente!"
ev2.18.a_ct:0 "Probablemente te torturen."
ev2.18.b:0 "Practico la brujería, pobre hombre."
ev2.18.b_ct:0 "Eso probablemente tampoco acabará bien."
ev2.18.c:0 "¡Te arrepentirás de esto!"
ev2.18.d:0 "¡Puedo explicarlo todo!"
ev2.18.d_ct:0 "Probablemente te liberen."
ev2.19.desc:0 "Iniciaste de inmediato un juicio por brujería, pero el acusado se declara inocente."
ev2.19.a:0 "¡Hora de torturar!"
ev2.19.b:0 "Creo que es inocente."
you_were_torture:0 "¡Te torturaron!"
ev2.20.desc:0 "¡[prisoner.GetHerHim|U] lo ha confesado! ¡[prisoner.GetSheHe|U] es amante del diablo!"
ev2.20.a:0 "¡Encended la pira!"
ev2.20.b:0 "Mmm..."
mages_target:0 "Cazador de brujas vs. Bruja #P +30%#!"
released_prison_toast:0 "Has sido absuelto"
ev2.21.title:0 "¿Seguido?"
ev2.21.desc:0 "Sospechas que alguien te está vigilando. No importa de quién sean esos espías: tendrás que actuar con cautela."
ev2.21.a:0 "Permaneceré vigilante."
ev2.21.b:0 "No puedo confiar en nadie."
ev2.22.title:0 "Fin de la cacería"
ev2.22.desc:0 "La caza termina sin resultados."
ev2.22.a:0 "Hora de despedirse."
ev2.23.title:0 "¿Fuente de magia?"
ev2.23.desc:0 "Esta cosa, un catalizador mágico, puede darte poder secreto. ¿Quieres poseerla?"
ev2.23.a:0 "Claro."
ev2.23.b:0 "Sería un pecado."
ev2.24.title:0 "El caballero errante"
ev2.24.desc:0 "Un caballero andante llega a tu torre y te desafía.\n\"¡Ven y lucha conmigo, mago! ¡Tu depravación debe terminar!\""
ev2.24.a:0 "Acepto tu desafío. ¡Luchemos!"
ev2.24.b:0 "Me rindo, pero quiero un juicio."
ev2.24.c:0 "¿Y si simplemente te quemo con mi poder?"
imprison_and_trial_ct:0 "Fuiste encarcelado en el cuartel general de los cazadores de brujas y el juicio comenzará."
ev2.24.d:0 "No soy hechicero, pero conozco a uno."
sent_wh_2_rival_ct:0 "El caballero errante será enviado a tu enemigo, [potential_target2.GetTitledFirstName]"
cursed_land_modifier:0 "Tierra maldita"
ev2.25.title:0 "Rumores sobre... ¿magia?"
ev2.25.desc:0 "Últimamente has oído extraños rumores sobre [mmage.GetTitledFirstName]. Al parecer, esta persona practica magia avanzada."
ev2.25.a:0 "¿Qué significa eso siquiera?"
ev2.25.b:0 "Parece que [mmage.GetSheHe] sabe más que yo. Por ahora."
ev2.26.title:0 "¿Un niño?"
ev2.26.desc:0 "En el círculo de invocación se materializó... un niño. Parece un niño corriente: normal y sano."
ev2.26.a:0 "Criaré a este niño como si fuera mío."
ev2.26.b:0 "Me lo quedaré."
ev2.26.b_ct:0 "El niño permanecerá en tu corte."
ev2.26.c:0 "Lo enviaré de vuelta."
ev2.26.c_ct:0 "Enviarás al niño de vuelta a otra dimensión."
not_empty_demon_name:0 "Abaddon"
ev2.27.title:0 "El niño necesita un nombre"
ev2.27.desc:0 "Primero debería escoger un nombre."
ev2.27.a:0 "Bienvenido a nuestro mundo."
ev2.28.title:0 "Un mundo grande y extraño"
ev2.28.desc:0 "Esta dama tan hermosa... ¿puedo tocarla?"
ev2.28.a:0 "¿Mamá?"
ev2.29.title:0 "¿Suicidio?"
ev2.29.desc:0 "Caso extraño: la niñera de [demon_child.GetTitledFirstName], [nanny.GetTitledFirstName], se suicidó anoche. Se arrojó desde la torre más alta. Antes de eso, gritaba de forma terrible."
ev2.29.a:0 "Mmm..."
ev2.310.a:0 "Aquí está ocurriendo algo extraño"
ev2.30.title:0 "Sentimientos intensos"
ev2.30.desc:0 "[potential_vict.GetTitledFirstName] suele tratarme con condescendencia. Siento..."
ev2.30.a:0 "Rabia..."
ev2.30.b:0 "Asco."
ev2.30.c:0 "Nada."
ev2.31.title:0 "Voces en mi cabeza"
ev2.31.desc:0 "Oigo susurros en mi cabeza. Me dicen cosas útiles, pero a veces también exigen algo. Hoy quieren sentir sangre."
 ev2.31.a:0 "Solo dime qué tengo que hacer."
ev2.32.title:0 "Muerte en Corte"
ev2.32.desc:0 "Parece que uno de tus cortesanos, [potential_vict.GetTitledFirstName], se cayó por las escaleras y se partió el cuello."
ev2.32.a:0 "Los accidentes ocurren todo el tiempo..."
ev2.33.desc:0 "Otra vez quieren que mate a alguien. Es fácil; una mirada, un toque, un pensamiento pueden causar la muerte. Pero siento una resistencia interior..."
ev2.33.a:0 "Haré lo que decís."
ev2.33.b:0 "¡Silencio! Yo decido quién muere."
ev2.34.desc:0 "Uno de tus cortesanos, [potential_vict.GetTitledFirstName], tropezó y cayó por la ventana. Al menos eso crees, porque no hay testigos."
ev2.34.a:0 "¿Otro accidente...?"
ev2.35.title:0 "Persona odiada"
ev2.35.desc:0 "Hay una persona a la que odio por encima de todas. Voy a usar mis dones para acabar con su vida."
ev2.35.a:0 "Esto es una buena práctica."
ev2.35.b:0 "Esto no es más que una parte del plan."
ev2.35.c:0 "Esto es justicia."
ev2.35.d:0 "Lo necesito."
ev2.36.desc:0 "Esta mañana los sirvientes encontraron el cuerpo de uno de tus cortesanos. Causa de la muerte: desconocida."
ev2.36.a:0 "Últimamente hemos tenido demasiados muertos."
ev2.36.b:0 "Lo investigaré."
ev2.36.b1_ct:0 "Asesino encontrado"
ev2.36.b2:0 "La investigación ha fracasado."
ev2.36.b2_ct:0 "No se encontró nada."
ev2.37.title:0 "Fuente"
ev2.37.desc:0 "Siento que algo despierta en mi interior."
ev2.37.a:0 "Siguiente regalo, siguiente oportunidad."
ev2.38.title:0 "La verdad sobre mí"
ev2.38.desc:0 "Siento una nueva fuerza dentro de mí. Ahora conozco la verdad: no soy normal. No soy solo un ser humano."
ev2.38.a:0 "Comienza una nueva era."
ev2.39.title:0 "¿Asesino encontrado?"
ev2.39.desc:0 "La investigación mostró que se vio a [demon_child.GetTitledFirstName] con todas las víctimas poco antes de que murieran. No tienes pruebas, pero la coincidencia resulta perturbadora."
ev2.39.a:0 "Será vigilado."
ev2.39.b:0 "Las mazmorras son un buen lugar para [demon_child.GetHerHim]."
ev2.39.c:0 "Organizaré la ejecución discretamente."
ONLY_SPECIFIED_CHILD:0 "El objetivo debe ser tu huésped, cortesano, pupilo o prisionero."
ONLY_SPECIFIED_CHILD2:0 "No puedes comerte a tus propios hijos (a menos que seas sádico)."
ic_pure_meal:0 "Presa de sangre pura"
consume_child:0 "Consumir"
absorb_good_traits_ct:0 "Otorga una probabilidad de absorber un rasgo físico positivo (si el niño tiene alguno)"
consume_child_ct:0 "Será devorado."
ev2.40.title:0 "Niño desaparecido"
ev2.40.desc:0 "En la corte de [sender.GetTitledFirstName], un niño desaparece sin dejar rastro en circunstancias misteriosas."
ev2.40.a:0 "Ni siquiera los niños están a salvo últimamente."
ev2.40.b:0 "El rastro conduce hasta [actor.GetTitledFirstName]."
