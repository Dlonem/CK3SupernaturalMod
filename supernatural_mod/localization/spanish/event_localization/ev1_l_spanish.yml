 #Events
ev2.1.title:0 "Especialización de bruja"
ev2.1.desc:0 "Ha llegado el momento de elegir en qué se centrarán tus estudios."
ev2.1.a:0 "Buscar la verdad."
ev2.1.a_ct:0 "Otorga una pequeña probabilidad de aprender algo sobre la auténtica hechicería en el futuro."
ev2.1.c:0 "Preparar pociones y estudiar herboristería."
ev2.1.c_ct:0 "Desbloquea la decisión Crear poción."
ev2.1.d:0 "Ningún estudio en concreto; prefiero ver mundo."
ev2.1.e:0 "¿Y si simplemente me como a unos niños?"
ev2.1.e_ct:0 "Desbloquea la interacción \"Consumir niño\""
ev2.1.f:0 "Lo pensaré más adelante."
ev2.1.f_ct:0 "Podrás reconsiderar tu elección dentro de diez años"
ev3.0.title:0 "Malos presentimientos"
ev3.0.desc:0 "Hoy me siento distinto por algún motivo. Es como si una fuerza invisible tratara de influirme."
ev3.0.a:0 "Mantendré la calma; por supuesto que no puede pasar nada malo."
ev3.0.b:0 "Esto huele a magia. Será mejor que busque mis amuletos."
ev3.1.a:0 "El hechizo ha fracasado."
ev3.2.a:0 "Estoy maldito."
ev3.2.a_repelled:0 "El hechizo ha fracasado."
ev3.2.a_cursed:0 "El objetivo ha sido maldecido."
ev4.0.title:0 "Sentidos mágicos"
ev4.0.desc:0 "El aura está inestable hoy. La energía mágica palpita en todo el mundo; puedo sentirla."
ev4.0.a:0 "Parece que alguien está jugando con la magia."
ev4.0.b:0 "Quizá debería usar la triangulación mágica para identificar la fuente de la magia."
ev4.0.b_ct:0 "Encuentras a un mago o una bruja en tu zona."
ev4.0.c:0 "Vamos a rastrearlo."
ev4.0.d:0 "Debería decírselo a mi señor."
ev4b.0.title:0 "Rastreo mágico"
ev4b.0.desc:0 "He descubierto que [magic_user.GetTitledFirstName] es una bruja, ¡o incluso un mago!"
ev4b.0.a:0 "Tendré que ser prudente."
ev4b.0.b:0 "Debo matar a [magic_user.GetHerHim]."
ev4b.0.c:0 "Debería decírselo a mi señor."
ev7.0.title:0 "Ritual de poder"
ev7.0.desc:0 "Los preparativos han concluido. Las reglas son simples: poder a cambio de una vida humana. En una visión vi un sacrificio adecuado..."
ev7.0.a:0 "Es un sacrificio que estoy dispuesto a hacer."
ev7.0.b:0 "El precio es demasiado alto."
ev7.0.c:0 "Ya no te necesito."
ev8.0.desc:0 "Los preparativos han concluido. Ahora puedo obtener poder a cambio de..."
ev8.0.a:0 "Mi salud."
ev8.0.b:0 "Mi mente."
ev8.0.c:0 "Mi alma."
ev8.cost_magic:0 "Tu sacrificio"
ev5.0.title:0 "Ritual de vida"
ev5.0.desc:0 "Durante la preparación del ritual te das cuenta de que debes elegir el sacrificio adecuado. Tras horas de meditación y de analizar las constelaciones en el cielo, sientes que la respuesta está cada vez más cerca. Solo hay una persona apropiada."
ev5.0.a:0 "Tomaré solo un poco..."
ev5.0.b:0 "El precio es demasiado alto."
ev9.0.title:0 "Triangulación mágica"
ev9.0.desc:0 "La triangulación mágica se ha completado con éxito. El escaneo ha revelado que [potential_magician.GetTitledFirstName] está rodeado por un aura mágica. Puede que incluso posea un artefacto mágico..."
ev9.0.a:0 "Debería vigilar a [potential_magician.GetHerHim]."
ev9.0.b:0 "Reclamaré este artefacto."
ev9.0.c:0 "[potential_magician.GetSheHe|U] es una amenaza."
ev9.0.d:0 "Debería reunirme con [potential_magician.GetHerHim]."
ev10.0.title:0 "Maldición poderosa"
ev10.0.desc:0 "Estás preparando un poderoso hechizo contra [reci.GetTitledFirstName]. Ha llegado el momento de elegir qué clase de maldición..."
ev10.0.a:0 "[reci.GetSheHe|U] debe morir."
ev10.0.b:0 "Que [reci.GetHerHim] sufra."
ev10.0.c:0 "Lo quebraré."
ev10.0.d:0 "[reci.GetSheHe|U] no tendrá hijos."
ev10.0.e:0 "Da igual."
ev11.0.title:0 "El retorno de la magia"
ev11.0.desc:0 "Siento una oleada de energía, siento... poder."
ev11.0.a:0 "Se siente bien ser yo."
ev12.0.title:0 "Preparativos para la invocación"
ev12.0.desc:0 "Reúnes los componentes, inscribes runas protectoras y preparas contrahechizos. Aun así, el riesgo es enorme: no basta con invocar a un demonio, también debes someterlo. Muchas cosas pueden salir mal..."
ev12.0.a:0 "Comienza la invocación."
ev12.0.b:0 "Abandonar el intento."
ev12.1.a:0 "Un demonio responde a la llamada..."
ev12.1.a_ct:0 "Enfréntate al demonio"
ev12.2.a:0 "La invocación fracasa."
ev12.3.a:0 "La invocación sale bien, pero el demonio escapa del círculo."
ev12.3.a_ct:0 "Un demonio anda suelto"
ev12.4.a:0 "La invocación tiene éxito, pero el vínculo falla: el demonio te despedaza."
ev13.0.title:0 "Demonio furioso"
ev13.0.desc:0 "Un demonio se alza dentro del círculo, envuelto en luz y sombras giratorias. No tiene el menor interés en parlamentar. Sus garras arañan tus protecciones, arrancando lluvias de chispas; si el círculo se rompe, morirás sin remedio."
ev13.0.a:0 "Mantén el círculo; confía en las runas."
ev13.1.a:0 "Las runas resisten."
ev13.1.a_ct:0 "El ritual continúa"
ev13.2.a:0 "El círculo se rompe y el demonio te despedaza."
ev13.0.b:0 "Recitar una invocación vinculante."
ev13.1.b:0 "El demonio queda sometido."
ev13.0.c:0 "Destiérralo de inmediato."
ev13.0.c_ct:0 "El ritual termina"
ev15.0.title:0 "Demonio"
ev15.0.desc:0 "El demonio ha poseído a un cortesano cercano y te mira fijamente. \"Di de una vez qué quieres, bruja\" —dice [demon.GetSheHe]—. \"No tengo tiempo para ti.\""
ev15.0.a:0 "Quiero poder."
ev15.0.b:0 "Quiero riqueza."
ev15.0.c:0 "No quiero nada. Ha llegado tu hora: desaparece."
ev15.0.d:0 "Seamos amigos. Te dejaré libre."
ev15.1.d:0 "El demonio se convierte en tu aliado."
ev15.2.d:0 "El demonio te asesina."
ev16.0.title:0 "Camino hacia el poder"
ev16.0.desc:0 "Poder... siempre has deseado poder. Pero ¿qué significa para ti, humano? Puedo darte conocimientos secretos... o invocar un ejército de no muertos a tus órdenes."
ev16.0.a:0 "Enséñame algo útil."
ev16.0.a_ct:0 "También puedes ganar un punto de ventaja aleatorio."
ev16.0.b:0 "Los no muertos suenan bien."
ev17.0.title:0 "Camino hacia la riqueza"
ev17.0.desc:0 "Oro, por supuesto. Puedo crear un poco si quieres. O darte algún objeto valioso..."
ev17.0.a:0 "Escogeré monedas."
ev17.0.b:0 "Un nuevo artefacto podría resultar útil."
ev17.0.b_ct:0 "Ganas un nuevo artefacto."
ev17.0.c:0 "¿Por qué no ambas cosas?"
ev18.0.title:0 "Adiós, criatura"
ev18.0.desc:0 "La luz se atenúa y el demonio desaparece. Sigues con vida..."
ev18.0.a:0 "Qué alivio..."
ev20.0.desc:0 "\"Te encuentras ante Belial, un señor del infierno\" —dice el demonio—. \"Soy uno de los cuatro señores del infierno. Habla, mortal.\""
ev20.0.a:0 "¿El propio Belial?... Lamento molestarte. Busco sabiduría y poder."
ev20.0.b:0 "Debes cumplir mi deseo, demonio patético."
ev20.0.c:0 "Eh... olvídalo, desaparece."
ev21.0.desc:0 "¿Patético? Vigila tus palabras, mortal. Hoy tus runas protectoras nos separan, pero la situación puede cambiar en el futuro. Y cambiará, te lo aseguro."
ev21.0.a:0 "Lo dudo, demonio. Y ahora, tengo un deseo..."
ev21.0.b:0 "Cálmate, no pretendía ofenderte."
ev21.0.c:0 "Vuelve al infierno, zorra de ojos negros."
ev22.0.desc:0 "Ya que me has invocado, he de darte algo. ¿Un ejército invencible? ¿Una fuerza inmensa? ¿El respeto de otros gobernantes?"
ev22.0.a:0 "Ejército."
ev22.0.a_ct:0 "Las negociaciones continuarán"
ev22.0.b:0 "Fuerza."
ev22.0.c:0 "Respeto."
ev23.0.desc:0 "Mmm... sí. Tu ejército será invencible si me conviertes en su general. Puedo servirte durante diez años a cambio de mi libertad. Me dejarás libre en este mundo."
ev23.0.a:0 "Trato."
ev23.0.b:0 "¿En este mundo? Ni hablar. Limítate a fortalecer mi ejército."
ev23.0.c:0 "No te hagas el tonto conmigo. Limítate a fortalecer mi ejército y dame unos cuantos caballeros competentes."
ev24.0.desc:0 "Dilo, necio."
ev24.0.a:0 "Mata a mi enemigo."
ev24.0.b:0 "Dame conocimiento."
ev24.0.c:0 "Purifica mi cuerpo."
ev24.0.d:0 "Fortalece mi cuerpo."
ev24.0.d_ct:0 "Se reforzará tu rasgo físico positivo."
ev27.0.desc:0 "Han pasado diez años desde que firmamos el contrato. Me prometiste libertad, pero estoy harto de este reino. Regreso al infierno, mortal."
ev27.0.a:0 "Adiós, demonio."
ev28.0.desc:0 "Han pasado diez años desde que firmamos el contrato. Me prometiste libertad, así que ahora soy libre. Este mundo sentirá mi ira, pero tú serás el primero de la lista. Puedes vivir si me sirves. Arrodíllate, mortal, o muere."
ev28.0.a:0 "Por supuesto que te serviré, Maestro..."
ev28.0.b:0 "¡Ningún demonio me dará órdenes!"
