building_type_horned_god_house:0 "Templo del Dios Astado"
building_type_horned_god_house_desc:0 "Templo oscuro infame y poderoso lugar de poder."
building_mage_house:0 "Academia de magia"
building_mage_house_desc:0 "Es un lugar de poder donde las brujas pueden desarrollar sus talentos mágicos."
building_type_mage_house:0 "Academia de magia"
building_type_mage_house_desc:0 "Es un lugar de poder donde las brujas pueden desarrollar sus talentos mágicos."
ev4.82.desc:0 "Primero debes calibrar los instrumentos y fijar los parámetros del hechizo. ¿Qué tipo de anomalías mágicas estás buscando?"
ev4.82.0.a:0 "Artefactos mágicos."
ev4.82.0.b:0 "Lugares de poder."
ev4.83.desc:0 "La triangulación mágica se ha completado con éxito. El rastreo mágico indica que [magic_p.GetName] posee un aura mágica. Esta provincia pertenece a [owner_p.GetTitledFirstName]."
ev4.83.0.a:0 "Aquí está mi próximo objetivo."
pot5:0 "Elixir de juventud"
pot5_desc:0 "Esta poción hará que te sientas más joven."
drink_pot5_decision:0 "Usar elixir de juventud"
drink_pot5_decision_tooltip:0 "Puedes recuperar unos años de vida gracias a esta poción."
drink_pot5_decision_desc:0 "Puedes recuperar unos años de vida gracias a esta poción."
drink_pot5_decision_confirm:0 "Beber la poción."
gain_pot5_ct:0 "Obtienes un elixir de juventud."
YOU_ARE_TOO_YOUNG:0 "Aún eres demasiado joven."
ev4.84.title:0 "Rumores sobre magia"
ev4.84.desc:0 "Has oído hablar de un lugar extraño donde ocurren fenómenos inexplicables. Es una estructura misteriosa en [magic_p.GetName] que pertenece a [owner_p.GetTitledFirstName]."
hecate_name:0 "Hécate"
gift_from_hecate_modifier:0 "Regalo de Hécate"
ev4.85.title:0 "Maestra de magia"
ev4.85.desc:0 "Un demonio se materializa ante ti. Parece una anciana deformada, pero está rodeado por un aura mágica de un poder extraordinario. Por un instante temes que el círculo rúnico no resista el embate de su poder. \"Estás ante una diosa, mortal\" —sus labios no se mueven, pero oyes las palabras dentro de tu cabeza—. \"Llevo tiempo observándote y sé lo que deseas. Poder. Cada vez más poder...\""
ev4.85.0.a:0 "Sí, exactamente. Dame más poder."
ev4.85.0.b:0 "Inmortalidad. Quiero vivir para siempre."
ev4.85.0.c:0 "Solo quiero poder para defenderme de mis enemigos."
ev4.85.0.d:0 "Solo me interesa el poder del conocimiento."
ev4.86.desc:0 "Oh, sí, puedo dártelo. Pero no gratis. No soy un demonio subordinado cualquiera al que puedas obligar a cooperar. Si quieres mis dones, debes entregarme tu alma, ni más ni menos. Dentro de 30 años enviaré a alguien para llevarte a las puertas del infierno."
ev4.86.desc2:0 "Importa la calidad, no la duración. Puedo concederte una segunda juventud... y 30 años de vida despreocupada. Después tu alma será mía. No te daré nada sin un 'pago'."
ev4.86.0.a:0 "Que así sea; mi alma es tuya."
ev4.86.0.b:0 "Mi alma a cambio de poder."
ev4.86.0.c:0 "Entonces prefiero protección."
ev4.86.0.d:0 "En realidad, puedo obligarte a cooperar..."
ev4.86.0.d_ct:0 "Lanzas un poderoso hechizo de atadura."
ev4.86.0.d1:0 "El demonio cumplirá tu voluntad sin pedir nada a cambio."
ev4.86.0.d2:0 "El hechizo no surtió efecto..."
ev4.86.0.e:0 "No me gusta tu oferta. Desaparece."
ev4.87.title:0 "Se ha designado la ubicación de la Torre de Magos."
drink_pot5_decision_ct:0 "Puedes recuperar unos años de vida."
ev4.85.0.b_ct:0 "El demonio estudiará tu petición."
hecate_option2_ct:0 "Rejuvenecerás."
teach_sorcery_terrain_cancel_negative_supply:0 "Desbloquea la [interaction|E] Enseñar hechicería con brujas"
ev8.0.d:0 "Quiero más... ¡MÁS!"
smitem_intercepted:0 "Artefacto mágico capturado"
ev4.88.title:0 "Aliento de magia"
ev4.88.desc:0 "Crees que ya estás cerca de descubrir el secreto de la magia. Un paso más y al menos una pequeña partícula de poder estará a tu disposición. Pero ¿encontrarás el valor para alcanzar ese poder?"
ev4.88.0.a:0 "Estoy listo para cualquier riesgo."
ev4.88.0.a_ct:0 "Ganarás un uso del hechizo Maldición Poderosa."
ev4.88.0.b:0 "Será mejor que vuelva a una investigación más segura."
