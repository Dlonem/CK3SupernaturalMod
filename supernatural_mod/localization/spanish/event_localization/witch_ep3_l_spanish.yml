game_concept_magic_protection:0 "Protección mágica"
 #game_concept_magic_protection_desc:0 "La Protección mágica básica la proporcionan las runas protectoras usadas por brujas y cazadores de brujas. Los demonios también poseen Protección mágica básica de forma natural. Algunos hechizos, como Deseo de muerte o Desterrar al demonio, atraviesan por defecto la Protección mágica básica. Los hechizos normales también pueden penetrar este tipo de protección si el mago es lo bastante poderoso o cuenta con un catalizador mágico. Además de la Protección mágica básica, existe una Protección mágica completa proporcionada por anillos mágicos, magia avanzada y algunos efectos demoníacos."
ev3.22.a1_ct:0 "Escribirás un libro magnífico."
ev3.22.a2_ct:0 "Puedes obtener una gran bonificación a Conocimiento secreto."
ev3.22.b1_ct:0 "Inventarás un nuevo hechizo o poder."
ev3.22.b2_ct:0 "Puedes obtener una bonificación media a Conocimiento secreto."
ev2.41.e:0 "Continuaré mi investigación alquímica."
ev2.41.d_ct2:0 "100% de probabilidad de éxito por tener tanto el rasgo #italic Herborista#! como la ventaja #italic Alquimia avanzada#!."
