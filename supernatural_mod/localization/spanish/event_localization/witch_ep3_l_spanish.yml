l_spanish:
witchcraft_legacy_1_ct2:0 "Puedes capturar un artefacto mágico encarcelando a su dueño."
mage_trait_required:0 "#N Se requiere un foco arcano o un rasgo de mago para desbloquear esta ventaja#!"
trait_track_witch_hunter:0 "Caza de brujas"
trait_track_witch_hunter_desc:0 "Especializado en enfrentarse a brujas y otras amenazas sobrenaturales."
witch_hunter_ct0:0 "Probado"
wh_spec1_terrain_cancel_negative_supply:0 "Desbloquea la [interaction|E] de Juicio de Bruja con los prisioneros"
wh_spec2_terrain_cancel_negative_supply:0 "Desbloquea la [interaction|E] Detener a la Bruja con las brujas"
wh_spec3_terrain_cancel_negative_supply:0 "Este rasgo lo heredará tu heredero."
wh_spec_BH_terrain_cancel_negative_supply:0 "Desbloquea la [decision|E] Iniciar caza de brujas."
one_less_witch_title:0 "La bruja ha muerto"
inq_modifier:0 "Gran Inquisidor"
stop_the_witch:0 "Detener a la bruja"
stop_the_witch_desc:0 "Toma las medidas necesarias para detener a la bruja."
stop_the_witch_ct:0 "La operación contra la bruja se pondrá en marcha."
stop_the_witch_ct2:0 "[recipient.GetSheHe|U] puede ser asesinado, capturado o saboteado"
ev4.1.title:0 "Asistente a sueldo"
ev4.1.desc:0 "Ha llegado un hombre a tu corte; [sidek.GetSheHe] parece ser un experto en la caza de brujas. Dirías que [sidek.GetSheHe] busca trabajo."
ev4.1.0.a:0 "La ayuda siempre es bienvenida."
ev4.1.0.b:0 "No quiero que [sidek.GetHerHim] esté aquí."
ev4.2.title:0 "El martillo de las brujas"
ev4.2.desc:0 "Otra bruja ha aparecido en el horizonte y te corresponde a ti hacer algo al respecto. Una vez más, el deber te llama a enfrentarte a esta amenaza."
ev4.2.0.a:0 "¡Quiero a [recipient.GetHerHim] en mi mazmorra, ahora!"
ev4.2.0.a1:0 "La bruja ha sido capturada."
ev4.2.0.a2:0 "La bruja ha escapado."
ev4.2.0.b:0 "Enviaré a [helper.GetTitledFirstName]."
ev4.2.0.c:0 "Me ocuparé personalmente."
ev4.2.0.ct:0 "Continúas tus esfuerzos por detener a la bruja."
ev4.2.0.d:0 "Ofreceré una recompensa por capturar a la bruja."
ev4.2.0.d1:0 "Has encontrado a un cazarrecompensas competente."
ev4.2.0.d2:0 "Has encontrado a un cazarrecompensas torpe."
ev4.2.0.d_ct:0 "Comenzará la caza"
ev4.2.0.e:0 "Pido a [wliege.GetTitledFirstName] que me entregue a la bruja."
ev4.2.0.e_ct:0 "Tu petición será considerada"
ev4.2.0.e_ct1:0 "Eres persuasivo"
ev4.2.0.e_ct2:0 "Es probable que tu petición sea rechazada"
ev4.4.desc:0 "El cazarrecompensas contratado ha vuelto. Parece que ha tenido éxito."
ev4.4.0.a:0 "Lo hizo bien."
ev4.5.desc:0 "Tus agentes informan de que el cazarrecompensas contratado no pudo con la bruja. Su cuerpo mutilado fue hallado en el camino."
ev4.5.0.a:0 "Algún día te atraparé, maldita bruja."
ev4.5.0.a_ct:0 "La bruja seguirá libre... por ahora."
ev4.5.0.b:0 "¡Enviad a mis caballeros!"
ev4.6.title:0 "Petición del cazador de brujas"
ev4.6.desc:0 "[whunter.GetTitledFirstName] me ha pedido que entregue a [recipient.GetTitledFirstName] en sus manos. Mi cortesano ha sido acusado formalmente de practicar brujería. Déjame pensarlo..."
ev4.6.0.a:0 "Pues... no."
ev4.6.0.b:0 "Claro."
ev4.7.title:0 "Petición rechazada"
ev4.7.desc:0 "[wliege.GetTitledFirstName] se ha negado a entregarme a la bruja. También es posible que se prepare para mis próximos movimientos."
ev4.7.0.a:0 "Necesito un nuevo plan."
ev4.7.0.b:0 "Quizás no deberías gobernar en absoluto."
ev4.7.0.c:0 "¿O acaso tú también eres bruja?"
ev4.8.desc:0 "Has pasado varios días planeando meticulosamente. La bruja no parece sospechar nada. Ha llegado la hora de actuar."
ev4.8.0.a:0 "Usaré el método clásico."
witch_hunter_hunts_modifier:0 "Plan perfecto"
ev4.8.0.a_ct:0 "Tu plan gana una probabilidad adicional de éxito."
ev4.8.0.b:0 "Me acercaré sigilosamente a la bruja y haré lo que deba hacerse."
ev4.8.0.b1:0 "La bruja cayó en la trampa"
ev4.8.0.b2:0 "La bruja no mordió el anzuelo"
ev4.8.0.c:0 "Por ahora, me limitaré a observar."
ev4.8.0.c_ct:0 "Las observaciones te darán una probabilidad de obtener información adicional."
ev4.9.title:0 "La bruja bajo vigilancia"
ev4.9.desc:0 "Por fin, tus observaciones y el seguimiento de la bruja han dado algunos resultados. Has obtenido información valiosa."
ev4.9.0.a:0 "Eso puede ser útil."
ev4.9.0.b:0 "Aún queda más trabajo por hacer."
ev4.10.0.a:0 "Me reuniré oficialmente con [recipient.GetHerHim]."
ev4.10.0.a_ct:0 "Esta acción es #N arriesgada#!."
hunt_witch_lord_ps:0 "Tu operación gana #P progreso#!."
ev4.10.0.b:0 "Que [helper.GetTitledFirstName] se ocupe de [recipient.GetHerHim]."
ev4.10.0.b_ct:0 "Tu agente prosigue la misión contra la bruja."
ev4.10.0.c:0 "Hay que preparar un plan adecuado."
ev4.11.title:0 "Visita inesperada"
ev4.11.desc:0 "[whunter.GetTitledFirstName] ha aparecido a las puertas de tu propiedad. Por lo visto, quiere hablar de algún asunto."
ev4.11.0.a:0 "Haz pasar a [whunter.GetHerHim]."
ev4.11.0.b:0 "Hoy no tengo tiempo para [whunter.GetHerHim]."
ev4.11.0.c:0 "¡El cazador de brujas! Que pase [whunter.GetHerHim]; estoy listo."
prepared_for_hunter_modifier:0 "Preparado para el cazador de brujas"
ev4.12.desc:0 "¡[recipient.GetTitledFirstName] se negó a recibirme! Quizá fue una coincidencia, o quizá [recipient.GetSheHe] adivinó que era una trampa."
ev4.12.desc2:0 "[recipient.GetTitledFirstName] es sin duda una bruja. Hay que tomar nuevas medidas al respecto."
ev4.12.0.a:0 "Basta, otros asuntos requieren mi atención."
ev4.13.title:0 "Encuentro con la bruja"
ev4.13.desc:0 "[recipient.GetTitledFirstName] te recibió en la entrada de su residencia. Insististe en hablar en privado, pero hay sirvientes cerca y viste algunos guardias. [recipient.GetTitledFirstName] intenta claramente averiguar el propósito de tu visita."
ev4.13.0.a:0 "Así que... sé que eres una bruja"
ev4.13.0.b:0 "Creo que tenemos intereses comunes..."
ev4.13.0.c:0 "No importa, ahora tengo que marcharme."
ev4.13.0.c_ct:0 "Das por concluida la reunión."
ev4.14.desc:0 "\"Sé que eres una bruja\", dijo [whunter.GetTitledFirstName]. De pronto recuerdas los rumores de que [whunter.GetSheHe] podría ser un cazador de brujas."
ev4.14.desc2:0 "\"Sé que eres una bruja\" —dijo [whunter.GetTitledFirstName]—. Así que no es una coincidencia: [whunter.GetSheHe] ha venido a por ti."
ev4.14.0.a:0 "¿Y qué?"
ev4.14.0.b:0 "¡Guardias! Arrestad a este hombre."
ev4.14.0.b_ct:0 "El cazador de brujas derrotó a tus guardias"
ev4.15.desc:0 "\"¿Y qué?\" La bruja te mira fijamente. Sientes que el ambiente de la conversación ha cambiado de forma drástica."
ev4.15.0.a:0 "Probablemente ya hayas oído que soy un cazador. Un poco incómodo, ¿eh?"
ev4.15.0.b:0 "Te desafío a un duelo."
ev4.15.0.b_ct:0 "La bruja considerará tu propuesta."
ev4.16.desc:0 "\"Probablemente ya hayas oído que soy un cazador. Un cazador de brujas. Un poco incómodo, ¿eh?\" Ves un brillo peligroso en sus ojos."
ev4.16.0.a:0 "Además, también eres un necio por venir aquí."
ev4.16.0.b:0 "¡Espera, no me mates! ¡Cooperaré!"
ev4.17.desc:0 "«Además, también eres un necio por venir aquí» —la bruja parece segura de sí misma—. «¿Qué pretendes conseguir exactamente con esto? ¿Aparte de tu propia muerte?»"
ev4.17.0.a:0 "Quería conocerte antes de ocuparme de ti."
ev4.17.0.b:0 "Ríndete y salvarás la vida. Quizá."
ev4.17.0.c:0 "Tú serás quien muera."
ev4.17.0.c1:0 "Consigues atrancar la puerta de la cámara"
ev4.17.0.c2:0 "No logras atrancar la puerta de la cámara"
ev4.17.0.c2_ct:0 "Tendrás que enfrentarte a los guardias"
ev4.18.desc:0 "«Quería conocerte antes de ocuparme de ti» —dijo [whunter.GetSheHe]. Concluyes que [whunter.GetSheHe] es alguien muy estúpido o muy valiente."
ev4.18.0.a:0 "Lárgate de aquí, cazador."
ev4.18.0.b:0 "Basta. ¡Arde, malnacido!"
ev4.18.0.b_ct:0 "Golpeas al cazador con un torrente de poder mágico."
ev4.19.desc:0 "\"Lárgate de aquí, cazador; lárgate antes de que llame a los guardias\". La bruja posó la mano sobre la empuñadura de la espada."
ev4.19.0.a:0 "Ya nos veremos, bruja."
ev4.19.0.a_ctx:0 "El cazador abandona tu morada"
ev4.19.0.b:0 "Creo que te mataré primero."
ev4.20.desc:0 "Abandonas a la bruja y regresas a casa. Por desgracia, esperabas sacar algo más en claro."
ev4.20.desc2:0 "La bruja no se presentó a la reunión secreta. Es obvio que [recipient.GetSheHe] ha descubierto tus intenciones."
ev4.20.desc3:0 "Así que [recipient.GetTitledFirstName] es un mago de verdad. Eso cambia muchas cosas. [recipient.GetSheHe|U] podría ser el oponente más peligroso al que te hayas enfrentado hasta ahora."
ev4.20.0.a:0 "Necesito pensar cuál será mi próximo movimiento."
ev4.20.0.b:0 "Aun así, he aprendido algo."
ev4.21.desc:0 "«Creo que tenemos intereses en común» —dijo tras una larga pausa—. «Es un asunto discreto; ¿podemos hablar con más privacidad?»"
ev4.21.0.a:0 "Nadie nos escucha. Habla."
ev4.21.0.b:0 "Buen intento, cazador. ¡Guardias!"
ev4.22.desc:0 "«¿Intereses comunes? Habla.»"
ev4.22.0.a:0 "Se trata de [riv1.GetTitledFirstName]. [riv1.GetSheHe|U] es nuestro enemigo común."
ev4.22.0.b:0 "Brujería. Enséñame a ser una bruja."
ev4.23.desc:0 "\"Brujería. Enséñame a ser una bruja\" —su voz tembló."
ev4.23.desc2:0 "«Se trata de [riv1.GetTitledFirstName]. [riv1.GetSheHe|U] es nuestro enemigo común. Podemos unir fuerzas para detener a [riv1.GetHerHim].»"
ev4.23.0.a:0 "Ya veo..."
ev4.23.0.a_ct:0 "Aceptar una invitación a una reunión secreta"
ev4.23.0.a_ct2:0 "Aceptar una invitación a una reunión secreta... aunque en realidad no piensas asistir"
ev4.24.desc:0 "Parece que la bruja ha mordido el anzuelo. Has invitado a [recipient.GetTitledFirstName] a una reunión secreta en la que discutiréis los detalles. Ahora solo queda esperar a que la bruja acuda a su propio funeral."
ev4.24.0.a:0 "La trampa está preparada."
ev4.25.desc:0 "Tu objetivo ha acudido a la 'reunión' secreta. La bruja ha venido sola. Parece que [recipient.GetSheHe] está a tu merced."
ev4.25.0.a:0 "Guardias, llevad a la bruja a la celda."
ev4.25.0.b:0 "Le cortaré la cabeza sin más."
ev4.25.0.a_tit:0 "Capturado durante la reunión secreta"
ev4.26.title:0 "Derrotado por la bruja"
ev4.26.desc:0 "De repente, aparecen guardias de la nada. Antes de que puedas darte cuenta, te reducen y te desarman. Ahora estás a merced de la bruja."
ev4.26.0.a:0 "¡Maldita bruja!"
ev4.27.desc:0 "De repente, unos guardias aparecen de la nada. Apenas consigues repeler su ataque. Estás herido, pero la bruja parece estar a tu alcance."
ev4.27.0.a:0 "¡Enfréntate a mí, bruja!"
ev4.27.0.b:0 "Te atraparé... la próxima vez."
ev4.27.0.b_ct:0 "Huyes"
ev4.27.0.b_tit:0 "Tus guardias han sido derrotados"
ev4.27.0.b_ct2:0 "El cazador escapó"
ev4.28.desc:0 "«¡Como cazador de brujas, te desafío a un honorable duelo a muerte!» —[whunter.GetSheHe] desenvaina su espada."
ev4.28.0.a:0 "Que así sea."
ev4.28.0.b:0 "Eso es ridículo. ¡Guardias!"
ev4.29.desc:0 "[recipient.GetTitledFirstName] alza las manos y una esfera de energía mágica aparece entre ellas. \"¡Arde, entrometido cazador!\", grita [recipient.GetSheHe] cuando el torrente de poder impacta en ti."
ev4.29.0.a:0 "¡Hora de una retirada táctica!"
ev4.30.desc:0 "La corriente de poder alcanza al cazador, pero este cuenta con algún tipo de protección mágica que dispersa parte de la energía del hechizo. Queda herido, aunque consigue darse a la fuga."
ev4.30.0.a:0 "Impresionante. La próxima vez usaré un hechizo más poderoso."
ev4.31.desc:0 "Una operación compleja exige elaborar un plan sofisticado. Las brujas especialmente influyentes pueden quedar fuera del alcance de un ataque directo. Debes decidir cómo quieres influir sobre tu objetivo."
ev4.31.0.a:0 "Emplearé la vía diplomática."
ev4.31.0.b:0 "La confrontación física es la mejor opción. Mataré a [recipient.GetHerHim]."
ev4.31.0.c:0 "Golpearé sus finanzas."
ev4.31.0.c1:0 "Logras interceptar fondos importantes."
ev4.31.0.c2:0 "Lograste causar problemas a los mercaderes"
ev4.31.0.d:0 "Me limitaré a observar a [recipient.GetHerHim] con atención."
ev4.31.0.d_ct:0 "Enviarás a tus espías"
ev4.31.0.d_ct2:0 "Puede que descubras si el objetivo es miembro del aquelarre"
ev4.31.0.e:0 "Las brujas no deberían gobernar en absoluto."
special_task_modifier:0 "Misión especial"
problems_with_merchants_modifier:0 "Problemas con los comerciantes"
ev4.32.desc:0 "Tus espías informan de que tu objetivo está asistiendo a reuniones secretas. Lo más probable es que te enfrentes a un aquelarre de brujas organizado."
ev4.33.desc:0 "Unas cuantas cartas bien dirigidas y conversaciones con las personas adecuadas pueden hacer que la bruja pierda apoyos y reputación. Puede ser la mejor forma de debilitarla antes del próximo golpe."
ev4.33.0.a:0 "Hablaré con su señor."
ev4.33.0.a_tit:0 "Sabotaje diplomático"
ev4.33.0.b:0 "Pediré al cabeza de fe que intervenga."
ev4.33.0.c:0 "Financiaré a sus oponentes."
ev4.33.0.d:0 "Sembraré el descontento en su reino."
ev4.34.desc:0 "\"¡Espera, no me mates! ¡Cooperaré! ¡Te lo contaré todo! Escucha...\" La bruja comparte contigo muchos secretos."
ev4.34.0.a:0 "Te perdonaré por ahora."
ev4.34.0.b:0 "Un acto de contrición no basta para salvar tu vida."
ev4.35.desc:0 "¡Ríndete, bruja! Puede que te perdonen si confiesas tus pecados y entregas a tus cómplices. De lo contrario, te enviaré directo al infierno."
ev4.35.0.a:0 "Está bien, me rindo."
ev4.36.desc:0 "[whunter.GetTitledFirstName] corrió hacia la puerta y la cerró con llave. Después se lanzó contra ti con su espada."
ev4.36.0.a:0 "Así que vamos a luchar."
ev4.37.desc:0 "La decisión está tomada. La bruja morirá por tu mano. El propósito es noble, pero el camino para lograrlo puede no ser tan fácil. Si matar brujas fuese sencillo, no harían falta cazadores en absoluto."
ev4.37.0.a:0 "Intentaré provocar un duelo."
ev4.37.0.a_ct:0 "La bruja será desafiada a un duelo"
ev4.37.0.b:0 "Un solo tajo resolverá el problema."
ev4.37.0.b_ct:0 "Partes en una misión nocturna"
ev4.37.0.c:0 "Haré que parezca un accidente."
ev4.38.desc:0 "Has recibido una carta de [whunter.GetTitledFirstName]. Parece una invitación oficial a un duelo a muerte. [whunter.GetTitledFirstName] se proclama cazador de brujas y da la impresión de que eres su próximo objetivo."
ev4.38.0.b:0 "Quizá en otra ocasión..."
ev4.39.desc:0 "[recipient.GetTitledFirstName] rechazó tu propuesta; por lo visto, [recipient.GetSheHe] es un cobarde. Necesitas idear otro plan."
ev4.40.desc:0 "Recogiendo tus herramientas y echándote la capucha sobre la cabeza, sales al amparo de la noche dispuesto a empapar con sangre la tierra de la bruja. Tras llegar al refugio de [recipient.GetTitledFirstName], te das cuenta de que está bien protegido. Necesitas encontrar una forma de entrar."
ev4.40.0.a:0 "Neutralizaré al guardia con discreción."
ev4.40.0.a_ct:0 "Lograrás infiltrarte."
ev4.40.0.a_ct2:0 "Necesitas huir"
ev4.40.0.b:0 "Sobornaré al guardia."
ev4.40.0.c:0 "Creo que puedo trepar por el muro."
ev4.40.0.d:0 "He cambiado de opinión; lo haré en otra ocasión."
ev4.40.0.d_ct:0 "Abandonas la operación."
ev4.41.desc:0 "Has logrado entrar. A lo lejos ves las siluetas adormiladas de más guardias, pero consigues evitarlos con eficacia. Te aproximas al lugar donde, según tu información, se encuentra el dormitorio de tu objetivo. De repente te das cuenta de que quizá te hayas perdido."
ev4.41.0.a:0 "Bajaré por el corredor oscuro."
ev4.41.0.b:0 "Usaré las escaleras."
ev4.41.0.c:0 "Simplemente revisaré la puerta más cercana."
ev4.42.desc:0 "Has encontrado el dormitorio de tu objetivo. Sin embargo, debes tener cuidado, pues hay un guardia dormido en la entrada. Frente a él hay una enorme cama, y la figura oculta bajo las mantas probablemente sea tu objetivo."
ev4.42.0.a:0 "Me acercaré sigilosamente y acabaré con su vida."
ev4.42.0.a_ct:0 "La bruja se despertó y llamó a los guardias"
ev4.43.desc:0 "Te acercas y compruebas que, en efecto, es la persona que buscabas. La bruja duerme despreocupadamente, como una niña. Le arrebatas la vida a [recipient.GetTitledFirstName] con una estocada silenciosa. Sientes que ha llegado el momento de volver a casa; escabullirte no debería ser un problema."
witch_hunter_burgler:0 "Han atrapado al intruso."
ev2.1.g:0 "Guiaré a mi casa como sacerdote de [ROOT.Char.GetFaith.WitchGodName]."
ev2.1.g_ct:0 "Parte de tu familia puede convertirse en brujas"
ev2.1.g_ct2:0 "Obtienes beneficios adicionales al venerar a [THIS.Char.GetFaith.WitchGodName]"
oneiromancy_perk_scrying_ct:0 "Desbloquea la [decision|E] Usar videncia"
prepare_scrying_decision:0 "Usar videncia"
prepare_scrying_decision_tooltip:0 "Usar videncia"
prepare_scrying_decision_confirm:0 "Comenzar la videncia"
prepare_scrying_decision_desc:0 "Usando técnicas adivinatorias de brujería, entras en un trance narcótico que te permite arrancar fragmentos de conocimiento de distintos lugares y tiempos."
prepare_scrying_decision_ct:0 "Existe la posibilidad de descubrir el secreto de otra persona u obtener otra información útil."
ev4.44.title:0 "Adivinación"
ev4.44.desc:0 "Entras lentamente en trance y sientes cómo la sangre te late en las sienes. Por un momento el mundo se llena de una luz cegadora que se extingue de inmediato. Cuando te das cuenta, estás tendido en el suelo; no sabes cuánto ha durado, has perdido la noción del tiempo. Sin embargo, han aparecido nuevos conocimientos en tu mente."
ev4.44.a:0 "Necesito practicar más con esto."
ev4.45.desc:0 "Entras lentamente en trance y sientes cómo la sangre te late en las sienes. Te abruman visiones de personas distintas, algunas de las cuales logras reconocer. De repente, uno de esos personajes, [scrying_target.GetTitledFirstName], aparece rodeado por un aura de luz. La imagen cambia y ahora ves el mundo a través de los ojos de [scrying_target.GetTitledFirstName]. Contemplas una escena concreta del pasado que [scrying_target.GetSheHe] sin duda querría mantener en secreto."
ev4.45.a:0 "Aquello fue una visión realmente poderosa."
ev4.46.desc:0 "Entras lentamente en trance y sientes cómo la sangre te late en las sienes. Ves un caleidoscopio de colores giratorios; una serie de imágenes pasa fugazmente ante tus ojos. Sin embargo, una de ellas vuelve una y otra vez: [rruler.GetTitledFirstName]. Hay algo extraño en ello. Sientes que las visiones intentan transmitirte algo importante."
ev4.46.a:0 "Debería vigilar a [rruler.GetHerHim]."
dark_blade:0 "Hoja Oscura"
dark_blade_desc:0 "Cuando empuñas la espada, oyes susurros quedos que te incitan a matar y destruir. La hoja parece perfecta tanto para el combate como para los sacrificios humanos."
ev95.1.title:0 "Espada misteriosa"
ev95.1.desc:0 "Después de regresar a tus aposentos, ves una vieja espada sobre la mesa. La hoja parece absorber la luz, y la empuñadura está adornada con antiguas inscripciones rúnicas."
dark_blade_fed:0 "La Hoja Oscura ha sido alimentada"
dark_blade_fed_ct:0 "La espada se vuelve más poderosa."
HAS_HOOK_ON_YOU_CM:0 "¡El objetivo tiene un anzuelo sobre ti!"
fed_dark_blade_interaction:0 "Alimentar la Hoja Oscura"
fed_dark_blade_interaction_desc:0 "El sacrificio ritual de un prisionero puede aumentar tus poderes"
fed_dark_blade_interaction_ct:0 "Realizarás una ejecución silenciosa."
converted2witch:0 "¡[tttarget.GetTitledFirstName] se ha convertido en bruja!"
rule_magic_witches:0 "Brujería: ser bruja"
setting_nope_magic_witches:0 "Predeterminado (No)"
setting_nope_magic_witches_desc:0 "Empiezas la partida como una persona normal."
setting_yep_magic_witches:0 "Sí"
setting_yep_magic_witches_desc:0 "Empiezas la partida como bruja."
rule_magic_witches_info:0 "Ser bruja"
ev4.51.title:0 "Malos presentimientos"
ev4.51.desc:0 "Últimamente te sientes observado. Tienes la sensación de que puede estar relacionado con tu anillo. Alguien quiere robarlo, ¡eso seguro! Deben tomarse precauciones adicionales."
ev4.51.a:0 "Mi... tesoro..."
ev3.5.g:0 "[main_inq.GetTitledFirstName] debe ser detenido."
ev4.52.desc:0 "Hoja Oscura... hay algo asombroso en esta espada. Sostenerla en la mano te hace sentir invencible, y con cada muerte que infliges tu poder crece. Sin embargo, te preocupa que tu deseo de matar haya aumentado desde que llegó a tus manos."
ev4.52.a:0 "Me resistiré."
ev4.52.b:0 "Esta espada libera mi potencial."
ev4.52.c:0 "No pensaré en ello."
ev4.53.desc:0 "Durante un paseo te encuentras con [rvic.GetTitledFirstName] y decides conversar un rato. En mitad de la charla, de pronto sientes un deseo incontrolable de matar. Entonces te das cuenta de que empuñas la Hoja Oscura. Ves el terror reflejado en el rostro de [rvic.GetTitledFirstName]."
ev4.53.a:0 "No puedo... resistirme..."
ev4.53.b:0 "Respiraré hondo y esconderé esta maldita espada."
ev4.53.c:0 "La espada me está trastornando, necesito controlarme."
ev4.53.d:0 "¡JAJAJAJA!"
ev4.54.desc:0 "Sientes que cada día pierdes un poco más el control sobre ti mismo. Esta espada... te está haciendo algo muy malo. Empiezas a sospechar que la Hoja Oscura tiene sus propios planes e intenciones para contigo."
ev4.54.a:0 "¡Obedéceme, Hoja Oscura!"
ev4.54.a_ct:0 "Parece que puedes controlar la espada."
ev4.54.a1:0 "La espada se ha sometido a tu voluntad."
ev4.54.a2:0 "La espada toma el control de ti."
ev4.54.b:0 "Conozco un hechizo que puede ayudar."
ev4.55.desc:0 "Hoy he oído la voz de mi maestro en mi cabeza. \"Mátalos a todos\" —ordenó—. Así que desenvainé la Hoja Oscura y me puse manos a la obra."
ev4.55.a:0 "¡Esta furia me da poder!"
ev4.56.title:0 "Servidor devoto"
ev4.56.desc:0 "Un desconocido pidió audiencia. Decidiste recibir a [created_witch.GetHerHim] y descubriste enseguida que era una bruja. \"He oído que eres sacerdote de [ROOT.Char.GetFaith.WitchGodName]\" —dijo [created_witch.GetSheHe]—. \"Quiero servirte; por favor, muéstrame el camino.\""
ev4.56.a:0 "Sírveme bien."
ev4.56.b:0 "¿Eres espía? ¡Fuera!"
ev4.56.c:0 "Tengo una idea mejor."
ev4.57.desc:0 "Gran parte del Grimorio Negro sigue siendo un misterio para mí, pero he conseguido descifrar un capítulo con un hechizo intrigante. Me pregunto si debería probarlo con [riv0.GetTitledFirstName]."
ev4.57.a:0 "...sí, vamos a probarlo."
ev4.57.b:0 "Mejor no."
ev4.58.desc:0 "Tras lanzar el hechizo, este desapareció del libro. En su lugar apareció una imagen que representaba a [riv0.GetTitledFirstName]. Su rostro inmóvil muestra terror y desconcierto."
ev4.58.a:0 "Te quedarás aquí para siempre."
seek_for_power_intent:0 "Buscar el verdadero poder"
seek_for_power_intent_desc:0 "Junto con otras brujas, trata de descubrir algo sobre la verdadera magia."
choose_grandmaster_intent:0 "Presentarte como gran maestre"
choose_grandmaster_intent_desc:0 "Reclama tu candidatura a gran maestre del aquelarre y busca el apoyo de los demás miembros."
magic_dup_evs.3010.z1:0 "Les contaré unas cuantas cosas sobre la magia verdadera."
ev4.59.title:0 "Bendición oscura"
ev4.59.desc:0 "Como sacerdote de [ROOT.Char.GetFaith.WitchGodName], decides bendecir a los miembros reunidos del Sabbat. Alzas las manos al cielo e invocas el nombre de tu señor oscuro."
ev4.59.a:0 "¡Arrodillaos ante él, hermanos y hermanas!"
ev4.60.title:0 "Meditación oscura"
ev4.60.desc:0 "Decides pasar una parte del ritual a solas. Los efectos de tu meditación resultan muy inspiradores. Te parece que [ROOT.Char.GetFaith.WitchGodName] te dispensa un favor especial."
ev4.60.a:0 "No te fallaré, mi señor oscuro."
horned_god_blessing_modifier:0 "La bendición del Dios Astado"
ev4.61.title:0 "Nuevo familiar"
ev4.61.desc:0 "Durante la plegaria sentiste que alguien te observaba. Cuando te levantaste para mirar a tu alrededor, oíste algo entre los arbustos. Un pequeño animal salió de entre la maleza y comprendiste de inmediato que era un mensajero. Sientes la marca de [ROOT.Char.GetFaith.WitchGodName] en la mente de esa criatura."
ev4.61.a:0 "Cuidaré de ti."
ev4.62.title:0 "Poder oscuro"
ev4.62.desc:0 "Una noche colmada de plegarias da fruto. Cuando te levantas de rodillas tras muchas horas, ves que el aire que te rodea brilla ligeramente. Sientes poder en tu interior: es una recompensa de [ROOT.Char.GetFaith.WitchGodName]."
ev4.63.title:0 "Impregnación impía"
ev4.63.desc:0 "Tras muchas horas de oración, tus ojos se cierran y te quedas dormido. Sueñas con un demonio que te ofrece su bendición. Te despiertas de golpe, abrasado por el deseo. Te das cuenta de que tu ropa está rasgada y de que respiras con dificultad. Además, algo ha cambiado en tu cuerpo..."
ev4.63.a:0 "He recibido la llamada."
ev4.64.title:0 "Demonio"
ev4.64.desc:0 "Un repentino estallido de energía interrumpe tus plegarias. Una criatura infernal aparece ante ti. El demonio te observa y dice: \"He escuchado tus rezos, mortales. Os traigo un don... y a cambio me cobraré lo que me corresponde.\""
ev4.64.a:0 "¡Toma mi alma!"
ev4.64.b:0 "...toma el alma de [sssac.GetTitledFirstName]."
ev4.64.c:0 "Rechazo tu oferta, demonio."
ev4.64.c_ct:0 "El demonio desaparecerá... o al menos eso esperas."
ev4.64.d:0 "Obedéceme, demonio."
touched_magic_modifier:0 "Marcado"
gift_from_hell_modifier:0 "Regalo del infierno"
ev16.0.c:0 "Dame tu bendición."
grandmaster_coven:0 "Gran maestre del aquelarre"
grandmaster_coven_desc:0 "Líder formal del aquelarre"
trait_grandmaster_coven:0 "Gran maestre del aquelarre"
trait_track_grandmaster_coven:0 "Autoridad"
trait_track_grandmaster_coven_desc:0 "Un liderazgo firme es esencial para el desarrollo y el poder del aquelarre."
trait_grandmaster_coven_desc:0 "Líder formal del aquelarre"
ev4.65.title:0 "Buscando apoyos"
ev4.65.desc:0 "Has conseguido convencer a unas cuantas personas de que el título de Gran Maestre debería pertenecerte. Sin embargo, todavía te falta apoyo suficiente."
ev4.65.a:0 "Conseguiré más partidarios, cueste lo que cueste."
ev4.65.b:0 "Pediré apoyo."
ev4.65.c:0 "No importa..."
progress4magicintent:0 "Tu intención gana #P progreso#!."
ev4.66.desc:0 "Se acerca el momento decisivo. Sigues sin tener claro si suficiente gente te considera un candidato adecuado para Gran Maestre. Aún puedes intentar convencer a los indecisos..."
ev4.66.a:0 "El oro resolverá este problema, como siempre."
ev4.66.b:0 "Mis argumentos son incontestables."
ev4.66.c:0 "Daré un discurso."
ev4.66.d:0 "Soy el candidato evidente."
ev4.66.e:0 "Será lo que tenga que ser."
cgrandmaster_chosen_title:0 "Has sido elegido Gran Maestre del Aquelarre."
ev4.68.title:0 "El Gran Maestre"
ev4.68.desc:0 "El aquelarre ha decidido. El título de Gran Maestre te pertenece."
ev4.68.a:0 "Me lo merecía."
ev4.69.desc:0 "La mayoría de los miembros del aquelarre ha decidido que debe elegirse a un nuevo Gran Maestre. El título ha recaído en [new_cgm.GetTitledFirstName]."
ev4.69.a:0 "[new_cgm.GetSheHe|U] se lo merecía."
ev4.69.b:0 "Ese puesto debería ser mío."
ev4.70.desc:0 "Has reunido el apoyo suficiente para poder reclamar el título de Gran Maestre. Sin embargo, primero debes desafiar y derrotar al anterior."
ev4.70.a:0 "¡Estoy listo!"
ev4.70.a_ct:0 "El gran maestre actual responderá a tu desafío."
ev4.70.b:0 "Probablemente no esta vez."
ev4.70.b_ct:0 "Tu intención #N fracasa#!."
ev4.71.desc:0 "[new_cgm.GetTitledFirstName] se ha atrevido a desafiarte a duelo. Será una lucha por el título de Gran Maestre. ¿Cómo se atreve [new_cgm.GetSheHe]?"
ev4.71.b:0 "No quiero luchar. Me rindo."
ev4.71.c:0 "Soy el Gran Maestre y seguirá siendo así."
ev4.72.desc:0 "Ese cobarde se rindió sin luchar. Ahora eres el nuevo Gran Maestre del Aquelarre."
ev4.72.0.a:0 "Excelente."
ev4.73.desc:0 "Has ganado la pelea y conservas el título de Gran Maestre. Esto dará mucho en qué pensar a las demás brujas."
ev4.73.desc2:0 "Has perdido la pelea y el título de Gran Maestre del aquelarre. Es una gran humillación."
ev4.73.desc3:0 "Has ganado la pelea y recibido el título de Gran Maestre. Ahora eres el líder del aquelarre."
ev4.73.desc4:0 "Has perdido la pelea. Por desgracia, no has logrado convertirte en Gran Maestre."
ev4.72.0.b:0 "Maldita sea."
ev4.72.0.b_tit:0 "Has defendido tu liderazgo"
ev4.75.title:0 "Textos antiguos"
ev4.75.desc:0 "Junto con otras brujas, has decidido rebuscar entre las colecciones reunidas por el aquelarre. Estudiar textos antiguos da sus frutos."
ancient_tomes_modifier:0 "Tomos antiguos"
ev4.76.title:0 "Sacrificio"
ev4.76.desc:0 "Junto con otras brujas, has decidido realizar una serie de experimentos y estudiar los resultados. Algunas de las conclusiones son prometedoras."
ev4.76.0.a:0 "Creo que tengo una idea."
ev4.76.0.a_ct:0 "Este asesinato puede ser descubierto por otros miembros del aquelarre."
ev4.76.0.a_ct2:0 "Como Gran Maestro del Aquelarre, no sufrirás consecuencias."
ev4.77.title:0 "Debate"
ev4.77.desc:0 "Has entablado un debate con otras brujas sobre los principios de la magia y los misterios del universo. Gracias a ello, has empezado a contemplar algunas cosas desde una perspectiva nueva."
ev4.77.0.a:0 "Un gran debate."
ev4.78.0.a:0 "¡Ese artefacto será mío!"
ev4.78.0.a1:0 "Has falsificado una reclamación."
