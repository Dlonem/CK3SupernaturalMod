ev4.79.desc:0 "Hace mucho tiempo que tienes tu propia opinión sobre las tradiciones de tu dinastía. Hoy es el momento perfecto para compartir tus ideas con los demás."
ev4.79.a:0 "Esta es la dirección correcta."
