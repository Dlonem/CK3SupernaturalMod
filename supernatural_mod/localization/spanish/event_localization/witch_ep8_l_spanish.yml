ev9.67.desc:0 "Tu dominio de la alquimia te permite elaborar cualquier brebaje que quieras."
ev9.67.0.a:0 "Quizá otra cosa..."
ev9.68.0.a:0 "Sin embargo, haré algo ordinario."
