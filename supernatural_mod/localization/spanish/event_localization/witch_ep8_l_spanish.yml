 cult_caravan_01_domicile_building_desc:0 "Los cultistas de [GetPlayer.GetFaith.WitchGodName] viajan en este carruaje; solo unos pocos conocen los secretos que guarda."
cult_caravan_02_domicile_building:0 "$cult_caravan_01_domicile_building$"
cult_caravan_02_domicile_building_desc:0 "$cult_caravan_01_domicile_building_desc$"
