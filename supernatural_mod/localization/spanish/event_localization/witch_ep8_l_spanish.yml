witchcraft_legacy_1_ct3:0 "Los miembros de la dinastía tienen mejor [aptitude|e] como magos de la corte"
ev6.71.desc2:0 "Actualmente no posees tierras, así que construir una torre de magos no es posible. Habrá que resolverlo de otra manera."
ev6.71.0.f:0 "En realidad, no necesito nada de eso."
