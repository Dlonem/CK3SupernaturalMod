ev7.117.g:0 "Un nuevo poder está en auge."
ev7.117.g_ct:0 "¡Desbloqueas un regimiento de $golems_army$!"
ev7.118.c:0 "Lo crearé a mi imagen."
ev9.69.title:0 "¿Más gólems?"
ev9.69.desc:0 "Si simplificases el proceso de creación de un gólem y no prestaras tanta atención a los detalles, en teoría podrías crear todo un ejército de esas construcciones. Tales soldados no se cansarían, no exigirían paga y probablemente serían invencibles."
ev9.69.0.a:0 "Lo meditaré cuando tenga tiempo."
ev9.70.title:0 "Ajustando el gólem"
ev9.70.desc:0 "Tu gólem sigue proporcionándote nueva inspiración. Piensas en adaptar su comportamiento humanoide..."
ev9.70.0.a:0 "Revisaré sus funciones conductuales."
ev9.70.0.b:0 "Su inteligencia será mejorada."
ev9.70.0.c:0 "¿Y si lo hiciera así...?"
ev9.70.0.d:0 "Sería mejor si [golem.GetSheHe] fuera menos humano."
golems_army:0 "Gólems de batalla"
golems_army_flavor:0 "#F El mayor logro de la ingeniería mágica: un ejército de constructos especializado en derribar toda resistencia.#!"
