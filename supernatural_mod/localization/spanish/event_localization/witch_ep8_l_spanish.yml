scheme_agent_aptitude.choosen:0 "$trait_source3$"
 agent_spellweaver:0 "Tejedor de hechizos"
 agent_spellweaver_i:0 "[success_chance_max_i]"
 agent_spellweaver_desc:0 "#weak Los magos experimentados son la pieza clave para lanzar hechizos grupales. Deben poseer habilidades incuestionables, pero también una lealtad absoluta: cualquiera de ellos podría sabotear fácilmente el hechizo o aprovechar sus efectos en beneficio propio.#!\n$EFFECT_LIST_BULLET$ Otorga [success_chance_max_i] de [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Los magos con un alto nivel de conocimiento secreto rendirán mejor en este papel"
 agent_magic_source:0 "Reservorio"
 agent_magic_source_i:0 "[success_chance_max_i]"
 agent_magic_source_desc:0 "#weak Una fuente de energía mágica de reserva puede ser muy útil para estabilizar el proceso. Cualquier persona saturada de poder puede cumplir esta función.#!\n$EFFECT_LIST_BULLET$ Otorga [success_chance_max_i] de [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requiere el rasgo de fuente y/o saturación de poder"
 agent_magic_assistant:0 "Asistente"
 agent_magic_assistant_i:0 "[scheme_speed_i]"
 agent_magic_assistant_desc:0 "#weak El asistente se asegura de que el ritual transcurra sin contratiempos y de que todos los componentes importantes estén siempre a mano. No necesita poseer habilidades mágicas.#!\n$EFFECT_LIST_BULLET$ Otorga [scheme_speed_i] de [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Una bruja competente o una persona con alta erudición será la mejor elección"
ultimate_spell_cast:0 "$grand_spell_decision_title$"
ultimate_spell_cast_action:0 "$grand_spell_decision_title$ dirigido por"
ultimate_spell_cast_desc:0 "La magia poderosa a veces requiere el esfuerzo conjunto de varios magos. Si el ritual tiene éxito, podrás provocar un efecto a escala global. Sin embargo, el fracaso podría significar la muerte de los participantes en el ritual, incluida la tuya."
ultimate_spell_cast_desc_general:0 "$ultimate_spell_cast_desc$"
ultimate_spell_cast_start_ct:0 "Comienzas el ritual"
ultimate_spell_blackgrimoire_modifier:0 "$blackgrimoire$"
ultimate_spell_catalyst_modifier:0 "$magic_catalyst$"
ultimate_spell_master_modifier:0 "$master_magic_modifier$"
ultimate_spell_chosen_modifier:0 "$trait_source3$"
