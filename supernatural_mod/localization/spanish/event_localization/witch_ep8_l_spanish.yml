 domicile_building_parameter_camp_may_host_grand_rites:0 "Desbloquea la [activity|E] #high $activity_witch_ritual$#!"
domicile_building_parameter_camp_cult_priest_more_effective:0 "El sacerdote del culto tiene mayor aptitud"
cult_caravan_chapel_domicile_building:0 "Capilla portátil"
cult_caravan_chapel_domicile_building_desc:0 "Un lugar práctico para que los sacerdotes del culto celebren sus ritos oscuros."
 domicile_building_parameter_camp_unlocks_cult_priest:0 "Desbloquea el [officer|E] [GetCourtPositionType('cult_priest_camp_officer').GetName()]"
 domicile_building_parameter_camp_unlocks_spread_cult:0 "Desbloquea la [decision|E] $spread_the_cult_decision_title$"
cult_priest_camp_officer:0 "Sacerdote del culto"
cult_priest_camp_officer_desc:0 "El sacerdote alaba el nombre de los dioses oscuros y recoge ofrendas de los campesinos convertidos."
spread_the_cult_decision_title:0 "Expandir el culto"
spread_the_cult_decision_desc:0 "Ha llegado la hora de que los cultistas hablen un poco con los lugareños."
spread_the_cult_decision_ct1:0 "Puedes establecer una rama del culto o convertir a los lugareños."
spread_the_cult_decision_ct2:0 "Esta acción puede beneficiarte en el futuro, pero también puede despertar la reticencia de las autoridades locales."
ev2.1.g_ct3:0 "$spread_the_cult_decision_title$ [decision|E] será más efectiva"
NOT_IS_A_WITCH:0 "Debes ser una bruja."
cult_caravan_arms_domicile_building:0 "Equipo de combate"
cult_caravan_arms_domicile_building_desc:0 "Cultistas armados con devoción fanática, listos para lanzarse contra cualquier enemigo que les señales."
 domicile_building_parameter_camp_unlocks_cultists_maa:0 "$culture_parameter_coven_rule2$"
cult_caravan_convertion_domicile_building:0 "Misioneros oscuros"
cult_caravan_convertion_domicile_building_desc:0 "Entre los cultistas hay oradores carismáticos y observadores perspicaces. Se les concederán recursos adicionales para actuar."
 domicile_building_parameter_camp_unlocks_witch_convertion:0 "Convierte a un seguidor al año en bruja"
cult_caravan_archive_domicile_building:0 "Archivos del culto"
cult_caravan_archive_domicile_building_desc:0 "Solo unos pocos tienen acceso a los archivos del culto."
witch_dark_cult_modifier:0 "Actividades de un culto oscuro"
witch_dark_cult_custom_tooltip:0 "Has establecido una rama del culto."
DARK_CULT_ALREADY_EXISTS_CUSTOM:0 "Ya existe una rama del culto en esta provincia."
trait_track_cultist:0 "Cultista"
 trait_track_cultist_desc:0 "El misticismo y la religión siempre han sido herramientas excelentes para manipular y controlar a los demás."
ev9.2.desc:0 "Tus cultistas han convertido a unos pocos lugareños, pero esto no ha escapado a la atención de las autoridades. Tal vez convenga detener tus actividades si no quieres llamar la atención sobre ti."
ev9.2.0.a:0 "Solo importa la voluntad de [ROOT.Char.GetFaith.WitchGodName]."
ev9.2.0.b:0 "[cpriest.GetTitledFirstName] cargará con la culpa."
ev9.2.0.c:0 "En ese caso, esperaremos a un momento mejor."
ev9.3.desc:0 "Los lugareños no muestran interés por tu culto, pero su gobernante, [lruler.GetTitledFirstName], parece una persona de mente abierta. Quizá puedas transmitirle algunos secretos a cambio de su apoyo."
ev9.3.0.a:0 "Hablaré con [lruler.GetHerHim]."
ev9.3.0.b:0 "Es un riesgo innecesario."
ev9.4.desc:0 "La conversión de los lugareños ha transcurrido sin problemas, en gran parte gracias al sacerdote del culto, [cpriest.GetTitledFirstName]. Es cierto que campesinos y mercaderes pobres no son dignos de experimentar la verdadera sabiduría, pero incluso esos títeres pueden ser útiles en el gran plan de [ROOT.Char.GetFaith.WitchGodName]."
ev9.4.0.a:0 "Nombraré sumo sacerdote a [cpriest.GetTitledFirstName]."
ev9.4.0.b:0 "[cpriest.GetSheHe|U] hace un buen trabajo, pero yo soy el líder del culto."
ev9.5.title:0 "Contactos oscuros"
ev9.5.desc:0 "La rama del culto de [cbranch.GetName] te envía regalos... un detalle muy considerado por su parte."
ev9.6.desc:0 "Parece que el culto que estableciste en [cbranch.GetName] prospera. Es hora de pedirles tributo."
ev9.6.0.a:0 "Que envíen suministros."
ev9.6.0.b:0 "Que compartan el oro."
ev9.6.0.c:0 "Unas cuantas personas más vendrían bien."
ev9.7.desc:0 "Ha llegado un joven acólito procedente de la rama de tu culto en [cbranch.GetName] que desea unirse a tu séquito. Es posible que [created_witch.GetSheHe] tenga potencial para convertirse en un buen cultista."
ev9.7.0.a:0 "Excelente, dejemos que [created_witch.GetHerHim] se una a nosotros."
ev9.7.0.b:0 "Será mejor que [created_witch.GetSheHe] siga ayudando en [cbranch.GetName]."
ev9.7.0.b_ct:0 "Esta rama del culto existirá durante 10 años más."
ev9.8.desc:0 "Te han llegado noticias de que la rama de tu culto en [cbranch.GetName] ya no existe: fue destruida durante una redada de cazadores de brujas."
ev9.8.0.a:0 "Espero que no queden rastros que conduzcan hasta nosotros."
ev9.9.desc:0 "Los agentes cultistas de [cbranch.GetName] han obtenido información que puede resultarte útil. Han decidido compartirla contigo."
ev9.9.0.a:0 "Esto es exactamente lo que necesitaba."
ev9.9.0.b:0 "Lo añadiré a mi lista de secretos."
ev9.10.desc:0 "Tu culto en [cbranch.GetName] ha superado tus expectativas. Los cultistas han reclutado tanto a los sirvientes del señor local como a varios clérigos y a muchos lugareños. Todos adoran en secreto a [ROOT.Char.GetFaith.WitchGodName] y te consideran un santo."
ev9.10.0.a:0 "No soy un santo; soy un profeta."
darkprophet_nickname:0 "el Profeta Oscuro"
ev9.10.0.b:0 "¡Alabado sea [ROOT.Char.GetFaith.WitchGodName]!"
ev9.10.0.c:0 "Merecen reconocimiento, pero que sigan alerta."
ev9.11.desc:0 "Los cultistas de [cbranch.GetName] informan de que están reclutando nuevos creyentes entre la población. El culto crece poco a poco. Te han enviado un mensajero para pedir nuevas instrucciones."
ev9.11.0.a:0 "Que difundan la noticia entre todos: el Profeta se acerca."
ev9.11.0.b:0 "Deberían redoblar sus esfuerzos."
ev9.11.0.c:0 "Este es el momento de que envíen tributo."
ev9.11.0.d:0 "Que enfrenten a los lugareños contra su señor."
command_minion_interaction_unlocked_ct:0 "Desbloquea la [interaction|E] $command_minion_interaction$ con el objetivo."
COMMAND_MINION_O9:0 "Conviértete en mi patrón"
laamp_magic_1001_contract:0 "Bruja inoportuna"
laamp_magic_1001_request:0 "Este [task_contract|E] requiere que viajes a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y te ocupes de la bruja usando [intrigue|E], [martial|E] o [diplomacy|E]."
laamp_magic_1001_desc_title:0 "$laamp_magic_1001_contract$"
laamp_magic_1001_desc:0 "El gobernante local mantiene un conflicto con una bruja. No sería especialmente interesante de no ser porque esa bruja podría poseer información útil. Tal vez sea posible matar dos pájaros de un tiro."
ev9.12.desc:0 "Al parecer, hay una bruja viviendo en la zona que incita a los campesinos. [employer.GetTitledFirstName] quiere que la bruja desaparezca por cualquier medio, siempre que sea rápido."
ev9.12.0.a:0 "Convenceré a la bruja para que se marche."
ev9.12.0.a_ct:0 "La bruja fue expulsada."
ev9.12.0.a_ct2:0 "La bruja se niega"
ev9.12.0.b:0 "Convenceré a los lugareños para que se pongan manos a la obra."
ev9.12.0.c:0 "Este es un trabajo para mis sicarios."
ev9.12.0.c_ct2:0 "La bruja logró esconderse"
ev9.12.0.d:0 "Esta bruja sería útil como nueva incorporación para el culto."
ev9.13.desc:0 "Pese a tus esfuerzos, la bruja sigue aquí. Es hora del plan B..."
ev9.13.0.a:0 "Quizá un soborno ayude."
ev9.13.0.a_ct:0 "La bruja acepta la oferta"
ev9.14.desc:0 "El caso de la bruja se ha cerrado y [employer.GetTitledFirstName] está satisfecho, pero esa es solo una cara de la moneda. Ahora tienes acceso a las notas y materiales de la bruja, que contienen mucha información útil."
laamp_magic_1002_contract:0 "Buscando ingredientes"
laamp_magic_1002_request:0 "Este [task_contract|E] requiere la entrega de ingredientes alquímicos; puede que hagan falta [learning|E] o rasgos apropiados."
laamp_magic_1002_desc_title:0 "$laamp_magic_1002_contract$"
laamp_magic_1002_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] necesita un ingrediente concreto para preparar una mezcla. Conseguirlo o comprarlo no debería ser difícil."
ev9.15.desc:0 "Tu empleador necesita una planta especial para elaborar un brebaje. Quizá crezca en algún rincón de la zona o pueda comprarse a mercaderes locales."
ev9.15.0.a:0 "Bien, vamos de compras."
ev9.15.0.b:0 "Sé dónde encontrar esta planta."
ev9.15.0.c:0 "Creo que ya tengo el ingrediente adecuado entre mis provisiones."
ev9.15.0.d:0 "Seguro que las brujas locales saben dónde buscarlo."
ev9.15.0.e:0 "No creo que este contrato me interese."
laamp_magic_1003_contract:0 "Posesión demoníaca"
laamp_magic_1003_request:0 "Este [task_contract|E] requiere la pericia de una auténtica bruja."
laamp_magic_1003_desc_title:0 "$laamp_magic_1003_contract$"
laamp_magic_1003_desc:0 "Uno de los cortesanos de [TaskContract.GetEmployer.GetTitledFirstName] da la impresión de estar poseído. Las oraciones y los sacerdotes han fracasado, así que [TaskContract.GetEmployer.GetTitledFirstName] está dispuesto a recurrir a la ayuda de una bruja para resolver el problema. Podría ser un caso esclarecedor..."
ev9.16.desc:0 "Todo indica que [cpossessed.GetTitledFirstName] está realmente poseído o, al menos, gravemente enfermo. Lo único que has podido determinar es que el caso es serio y no se trata de ningún engaño. Sin embargo, te faltan los conocimientos necesarios para resolver este misterio."
ev9.17.desc:0 "En cuanto llegaste al castillo de [employer.GetTitledFirstName], te dirigiste de inmediato a los aposentos de [cpossessed.GetTitledFirstName]. Estar cerca de [cpossessed.GetHerHim] es peligroso, pero hay algo aún peor: percibes magia a su alrededor. Sin duda intervienen fuerzas sobrenaturales."
ev9.17.0.a:0 "Debo examinar a [cpossessed.GetHerHim]; sujetadlo."
ev9.17.0.b:0 "Prepararé una infusión para calmar a [cpossessed.GetHerHim]."
ev9.17.0.c:0 "Empezaré con una sencilla plegaria."
ev9.17.0.d:0 "Tengo algunas ideas, pero necesito pensarlo un momento."
ev9.18.desc:0 "Concluyes que [cpossessed.GetTitledFirstName] no está realmente poseído, desde luego no por un demonio. Sin embargo, no cabe duda de que su estado tiene causas mágicas."
ev9.18.0.a:0 "Interesante... observaré a [cpossessed.GetHerHim] durante unos días."
ev9.18.0.b:0 "Un hechizo de lectura del aura resolverá este enigma."
ev9.19.desc:0 "Has descubierto que alguien lanzó un hechizo sobre [cpossessed.GetTitledFirstName]. Probablemente pretendía controlarlo, pero la bruja que lo lanzó no tenía el conocimiento ni el poder adecuados, y el hechizo no funcionó como se esperaba."
ev9.19.0.a:0 "Prepararé un ritual para neutralizar el hechizo."
ev9.19.0.a_ct:0 "El hechizo se romperá."
ev9.19.0.b:0 "Lanzaré un contrahechizo."
ev9.19.0.c:0 "Intentaré usar un exorcismo."
ev9.19.0.d:0 "Romper este hechizo supera mis capacidades."
ev9.20.desc:0 "Tus esfuerzos han dado fruto: [cpossessed.GetTitledFirstName] parece haberse recuperado por completo y el hechizo ha desaparecido. Tu empleador está satisfecho con el resultado, pero aún queda una cuestión: ¿quién lanzó el hechizo y por qué?"
ev9.20.0.a:0 "Eso no es asunto mío; ya he cumplido mi parte."
ev9.20.0.b:0 "Puedo buscar al culpable por una tarifa adicional."
ev9.20.0.b_ct:0 "El contrato continuará: debes encontrar a la bruja."
ev9.21.title:0 "En busca de la bruja"
ev9.21.desc:0 "La hechicera no es excepcionalmente poderosa, pero demuestra cierta habilidad. Debes averiguar cómo encontrar a esa persona."
ev9.21.desc2:0 "Parece un callejón sin salida. Necesitas probar algo distinto."
ev9.21.0.a:0 "Hablaré con los sirvientes."
ev9.21.0.a_ct1:0 "Encuentras el escondite de la bruja."
ev9.21.0.a_ct2:0 "No hay rastro de la bruja."
ev9.21.0.b:0 "Quizá los campesinos de la zona sepan algo."
ev9.21.0.c:0 "Preguntaré a los informadores locales."
ev9.21.0.d:0 "Usaré triangulación mágica."
ev9.22.title:0 "$ev9.21.title$ - $board_games.0001.tt.failure$"
ev9.22.desc:0 "No has logrado encontrar a la bruja. Probablemente quien lanzó el hechizo ya se haya marchado de la zona. Aun así, has cumplido la parte básica del contrato."
ev9.22.0.a:0 "He hecho cuanto he podido."
ev9.23.desc:0 "Has logrado encontrar la choza de la bruja y te diriges allí de inmediato. Al verte, la bruja no puede ocultar su sorpresa."
ev9.23.0.a:0 "Sé que fuiste tú quien lanzó el hechizo sobre [cpossessed.GetTitledFirstName]."
ev9.24.desc:0 "En lugar de responder, oyes unas palabras ininteligibles salir de la boca de la bruja. Es un hechizo."
ev9.24.0.a:0 "La mataré sin más con mi espada."
ev9.24.0.b:0 "¿Cómo te atreves? ¡Golpe de poder!"
ev9.24.0.a_ct:0 "La bruja logra completar el hechizo."
ev9.25.desc:0 "La bruja terminó el hechizo antes de que pudieras alcanzarla. El conjuro no era fuerte, pero te cegó por un instante. Fue suficiente para que escapara, y probablemente no vuelvas a verla. Aun así, eso no cambia el hecho de que has cumplido la parte básica del contrato."
ev9.26.desc:0 "Mataste a la bruja antes de que pudiera completar el hechizo."
ev9.26.desc2:0 "Tu hechizo desgarró a la bruja; solo quedaron una mancha negra y jirones de carne chamuscada."
ev9.26.desc3:0 "\nSus motivos no están claros, pero por las notas que has encontrado se aprecia que la bruja estuvo cerca de descubrir el secreto de la magia verdadera. Ya vislumbras cómo podrás aprovechar parte de ese conocimiento. Tu empleador también se alegrará de que el problema haya quedado resuelto."
ev9.26.0.a:0 "Sí, necesito estudiar estas notas."
laamp_magic_1004_contract:0 "Rivalidad despiadada"
laamp_magic_1004_request:0 "Este [task_contract|E] requiere aptitudes mágicas o engaño ([intrigue|E])."
laamp_magic_1004_desc_title:0 "$laamp_magic_1004_contract$"
laamp_magic_1004_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] está dispuesto a usar cualquier medio disponible para dañar a su rival, incluso medios mágicos."
ev9.27.desc:0 "«Siéntate y escucha. Hay una persona que me resulta insoportable; no la soporto, sin más. Quiero verla morir y sufrir... He oído rumores de que posees ciertas habilidades especiales. Si puedes hacer daño a [nrival.GetTitledFirstName], te pagaré en oro.»"
ev9.27.0.a:0 "Claro, sí, lanzaré... eh... una maldición."
ev9.27.0.a_ct:0 "Vas de farol"
ev9.27.0.b:0 "Lo haré."
ev9.27.0.c:0 "No me ocupo de esa clase de asuntos."
ev9.27.0.c_ct:0 "Renuncias al contrato"
ev9.28.desc:0 "Tu objetivo es [nrival.GetTitledFirstName]. [employer.GetTitledFirstName|U] por lo visto espera que lances un hechizo que hiera o mate a su rival."
ev9.28.0.a:0 "Prepararé una maldición."
ev9.28.0.b:0 "Una maldición poderosa dará resultados espectaculares."
ev9.28.0.c:0 "Fingiré lanzar un hechizo."
ev9.27.0.c1:0 "El empleador cree que has lanzado un hechizo."
ev9.27.0.c2:0 "El empleador ha descubierto tu fraude."
ev9.28.0.d:0 "Renuncio a este trabajo."
laamp_magic_1005_contract:0 "Tarea para el sanador"
laamp_magic_1005_request:0 "Este [task_contract|E] requiere aptitudes mágicas o rasgos especiales."
laamp_magic_1005_desc_title:0 "$laamp_magic_1005_contract$"
laamp_magic_1005_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] padece una enfermedad grave contra la que su médico de la corte no puede hacer nada. Tal vez la magia pueda ayudar en este caso."
ev9.29.desc:0 "[employer.GetTitledFirstName|U] está gravemente enfermo y nadie sabe cuántos días le quedan. [employer.GetSheHe|U] está dispuesto a pagar por cualquier tratamiento, incluso uno poco convencional, siempre que demuestre ser eficaz."
ev9.29.0.a:0 "Intentaré ayudar a [employer.GetHerHim]."
ev9.29.0.a1:0 "El tratamiento es eficaz."
ev9.29.0.a2:0 "El tratamiento no es eficaz."
ev9.29.0.b:0 "Puedo reforzar su aura."
ev9.29.0.c:0 "Un hechizo curativo resolverá el problema."
ev9.29.0.d:0 "No creo que pueda hacer nada."
laamp_magic_1006_contract:0 "Anomalía mágica"
laamp_magic_1006_request:0 "Este [task_contract|E] requiere aptitudes mágicas y una [learning|E] elevada."
laamp_magic_1006_desc_title:0 "$laamp_magic_1006_contract$"
laamp_magic_1006_desc:0 "Percibes una fuente de emanaciones mágicas en las tierras de [TaskContract.GetEmployer.GetTitledFirstName]. Merece la pena acudir allí e investigarla."
laamp_magic_1006_ct:0 "Recibes una recompensa desconocida"
ev9.30.desc:0 "Percibes una magia relativamente intensa en la zona. La triangulación mágica señalaba un túmulo corriente que, a primera vista, no tiene nada de especial."
ev9.30.0.a:0 "¿Qué tiene este lugar de especial?"
ev9.30.0.a_ct:0 "Decides examinarlo más de cerca."
ev9.31.desc:0 "Has realizado algunos experimentos mágicos, pero no has obtenido respuestas claras, salvo que los rastros mágicos son muy antiguos. Aquí ocurrió algo hace mucho tiempo..."
ev9.31.0.a:0 "Llevaré a cabo más investigaciones."
ev9.31.0.a1:0 "Estás más cerca de comprender este fenómeno"
ev9.31.0.a2:0 "El misterio seguirá sin resolverse"
ev9.31.0.b:0 "Tal vez valga la pena abordarlo desde otra perspectiva."
ev9.31.0.c:0 "Creo haber leído alguna vez sobre algo parecido..."
ev9.31.0.d:0 "Tengo una hipótesis."
ev9.32.title:0 "$laamp_magic_1006_contract$ - $board_games.0001.tt.failure$"
ev9.32.desc:0 "Has probado varias vías, pero no has logrado descubrir la naturaleza de este extraño fenómeno. Lo único que sabes es que se originó hace mucho tiempo y que probablemente sea inocuo para su entorno. Quizá algún día logres resolver este misterio."
ev9.32.0.a:0 "Aun así, ha sido instructivo."
ev9.33.desc:0 "Parece que en este lugar se lanzó un hechizo poderoso hace mucho tiempo. Has logrado deducir que se trataba de un conjuro de teletransporte, aunque hoy resulta difícil determinar si este punto fue el inicio o el final del viaje de alguien. Quienquiera que estuviera aquí empuñaba un poder inmenso, y sus restos todavía perviven en el aura de este lugar."
ev9.33.0.a:0 "Creo que puedo absorber parte de la magia de aquí."
ev9.33.0.b:0 "Ha sido un experimento interesante."
ev9.33.0.c:0 "Tendré que tener esto en cuenta en futuras investigaciones."
ev9.33.0.a_ct:0 "La investigación de la anomalía ha concluido"
ev9.34.desc:0 "Hace poco, uno de los caminantes con los que me crucé mencionó un rumor interesante: al parecer, [rumors_target.GetTitledFirstName] posee un objeto inusual. Es posible que se refieran a un artefacto mágico."
laamp_magic_1007_contract:0 "El pergamino secreto"
laamp_magic_1007_request:0 "Este [task_contract|E] requiere pagar mucho oro... o recurrir al robo ([intrigue|E])."
laamp_magic_1007_desc_title:0 "$laamp_magic_1007_contract$"
laamp_magic_1007_desc:0 "Parece que [TaskContract.GetEmployer.GetTitledFirstName] posee un pergamino especial que podría resultar inestimable para alguien como tú. Tal vez puedas convencer a [TaskContract.GetEmployer.GetTitledFirstName] de que te lo venda... y, si no, siempre quedan métodos menos legales para obtenerlo."
laamp_magic_1007_desc_ct:0 "#P Te convertirás en el dueño del artefacto.#!"
msscroll:0 "Pergamino antiguo"
msscroll_desc:0 "Este pergamino contiene las instrucciones para operar la llamada Singularidad. Es completamente incomprensible para cualquiera que no sea un adepto avanzado de la magia."
msscrol_additional_desc_cancel_negative_supply:0 "Desbloquea la Activación de la Singularidad [magic_special_project|E] para el dueño de la Singularidad Antigua."
ev9.35.desc:0 "[employer.GetTitledFirstName] se alegró de ver que te interesaba el pergamino; le encantaría venderlo, y está claro que necesita oro. Sin embargo, el precio que pide parece excesivo."
ev9.35.0.a:0 "¿Mil monedas? ¿Es una broma?"
ev9.35.0.b:0 "Está bien, sea."
ev9.35.0.a1:0 "Negocias un precio mejor"
ev9.35.0.a_ct:0 "Obtienes un descuento"
ev9.35.0.a2:0 "[employer.GetTitledFirstName] se enfadará"
ev9.36.desc:0 "[employer.GetTitledFirstName] no se ha dejado convencer. Ve que te importa el pergamino, así que quiere sacarte tanto oro como pueda."
ev9.36.desc2:0 "Lograste persuadir a [employer.GetTitledFirstName] para que rebajara un poco su ridículo precio, pero sigue siendo muchísimo oro."
ev9.36.0.a:0 "Está bien, lo aceptaré."
ev9.36.0.b:0 "Buscaré otra forma..."
ev9.36.0.b_ct:0 "Usarás métodos criminales para obtener el pergamino"
ev9.36.0.c:0 "En realidad, no necesito este pergamino."
ev9.36.0.c_ct:0 "Renuncias por completo a intentar conseguir el pergamino"
ev9.37.desc:0 "Como comprarlo no es una opción, solo queda planear un robo. La propiedad de [employer.GetTitledFirstName] no parece estar demasiado bien protegida; podría funcionar."
ev9.37.0.a:0 "Vamos a idear un plan."
ev9.37.0.b:0 "Mi hombre se encargará de ello."
ev9.37.0.b_ct:0 "Envías a tu maestro ladrón."
ev9.37.0.c:0 "Está bien, lo dejo."
ev9.37.0.d:0 "Simplemente usaré un hechizo de dominación."
ev2.73C.desc:0 "\nSin embargo, aún no sabes cómo hacerlo funcionar."
ev2.73.c:0 "Alguien debe saber algo."
ev2.73.c_ct:0 "Enviarás a tus hombres en busca de información."
ev2.73.c1_ct:0 "Encuentras una pista útil."
ev2.73.c2_ct:0 "La búsqueda no conduce a ninguna pista."
ev2.73.d:0 "Resolveré este problema a su debido tiempo."
as_special_project:0 "Activación de la Singularidad Antigua"
me_as_project_ct:0 "Desbloqueas #italic Activación de la Singularidad Antigua#! [magic_special_project|E]"
me_as_project_ct2:0 "$as_special_project$ [magic_special_project|E] podría desbloquearse aleatoriamente en el futuro."
me_as_project_done_ct:0 "La Singularidad Antigua está activa"
ev9.38.desc:0 "A pesar de tus esfuerzos, no has logrado obtener más pistas sobre la Singularidad Antigua. Si esa información existe, de momento está fuera de tu alcance."
ev9.39.desc:0 "Uno de tus agentes ha oído un rumor interesante: al parecer, [aowner.GetTitledFirstName] posee un pergamino que menciona la Singularidad Antigua. ¡Podría ser exactamente lo que estabas buscando!"
ev9.39.0.a:0 "Encontraré la manera de conseguir ese pergamino."
use_ac_inter_mod_cancel_negative_supply:0 "$ev2.73.a_ct$"
use_singularity_agains_army_ct:0 "Los ejércitos de esta provincia quedarán #N devastados#!."
laamp_magic_1008_contract:0 "Misión secreta"
laamp_magic_1008_request:0 "No tienes ni idea de qué esperar de este [task_contract|E]."
laamp_magic_1008_desc_title:0 "$laamp_magic_1008_contract$"
laamp_magic_1008_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] busca una bruja discreta para llevar a cabo una misión especial. Por ahora, lo único que sabes es que se trata de una tarea muy importante que solo una bruja experimentada puede manejar."
ev9.40.desc:0 "Tú y tus hombres habéis llegado al castillo de [employer.GetTitledFirstName]. El sirviente os ha indicado que esperéis en el patio; [employer.GetTitledFirstName] acudirá enseguida. Reparas en que hay muchos guardias alrededor, y sus movimientos desprenden tensión. Están en la puerta, en las ventanas, en las murallas; a cada instante parecen más numerosos. «Aquí pasa algo raro», oyes susurrar a [rcourt.GetFirstName].\nPor fin aparece [employer.GetTitledFirstName], escoltado por más guardias. «[this0.GetTitledFirstName], ¡al fin nos conocemos!», dice [employer.GetSheHe]. La puerta del castillo se cierra de golpe, cortándote la ruta de escape."
ev9.40.0.a:0 "¿Qué demonios se supone que significa esto?"
ev9.41.title:0 "La trampa"
ev9.41.desc:0 "\"Llevo tiempo cazándote, bruja. Al final resulta que los métodos más simples son los mejores, ¿verdad? ¡Matadlos, matad a todas las brujas!\"\nLos guardias se lanzan al ataque mientras una lluvia de flechas cae desde arriba."
ev9.41.0.a:0 "¡A las armas!"
ev9.41.0.a_ct1:0 "Rechazas el primer ataque"
ev9.41.0.a_ct2:0 "Te han aplastado"
mass_followers_dying:0 "#N Tus seguidores están siendo masacrados#!"
ev9.41.0.b:0 "¡Formación defensiva!"
ev9.41.0.c:0 "¡Esperad! Yo también soy un cazador infiltrado."
ev9.41.0.c_ct1:0 "Tu farol ha funcionado"
ev9.41.0.c_ct1A:0 "Evitas el derramamiento de sangre"
ev9.41.0.d:0 "Esto será más fácil cuando use Golpe de Poder."
ev2.48.d_ct1:0 "Muchos enemigos mueren."
ev9.41.0.e:0 "Estos necios probarán la Tormenta de Fuego."
ev9.41.0.e_ct:0 "Los enemigos serán destruidos"
ev9.41.0.f:0 "Este es el momento adecuado para usar la Singularidad."
ev9.41.0.g:0 "Escaparé con ayuda de Paso Sombrío."
ev9.41.0.g_ct:0 "#N Escaparás, pero tus seguidores estarán condenados#!"
ev9.41.0.h:0 "¡Si voy a morir, ellos morirán conmigo!"
ev9.41.0.h_ct:0 "¡Estás invocando un tornado!"
ev9.41.0.h_ct2:0 "La mayoría de las personas del castillo morirán."
ev9.41.0.i:0 "¡Los mataré uno por uno!"
ev9.41.0.j:0 "[demon.GetTitledFirstName], ¡mátalos!"
ev9.41.0.j_ct:0 "Tu demonio sembrará la matanza y tú tendrás la oportunidad de retirarte"
ev9.41.0.k:0 "Mi poder los aplastará."
ev9.42.desc:0 "«Qué sorpresa; hasta a mí me has engañado. Supongo que tú eras el listo, ¿eh? Perdona por la intriga: cada cual se las apaña como puede. Avísame si algún día puedo ayudarte en algo.»"
ev9.42.0.a:0 "Ha estado cerca..."
ev9.43.title:0 "Fuerza destructiva"
ev9.43.desc:0 "El paisaje ha cambiado en un instante: hay humo y fuego por todas partes. Los cuerpos de los atacantes han quedado calcinados y, con ellos, seguramente haya muerto también el cazador. Tu poder es inmenso."
ev9.43.0.a:0 "Los aplasté como a insectos."
ev9.43.0.b:0 "No me dejaron elección."
ev9.44.desc0:0 "Con gran dificultad, lograste rechazar el primer ataque y alcanzar la torre cercana."
ev9.44.desc1:0 "Tu hechizo abrasó a unos cuantos enemigos, pero otros ocuparon enseguida su lugar. Por suerte, eso te dio tiempo para abrirte paso hasta una torre cercana."
ev9.44.desc2:0 "\nOs habéis atrincherado dentro y, por un momento, disfrutáis de cierta calma; seguramente el enemigo esté reorganizándose. La torre comunica con las murallas, que llevan hasta la puerta, pero es probable que los arqueros enemigos estén vigilando ese paso. La buena noticia es que el lugar donde os encontráis resulta favorable para la defensa."
ev9.44.0.a:0 "Rápido, hacia la puerta antes de que se reagrupen."
ev9.44.0.a_ct:0 "Tu huida #P progresa#!"
ev9.44.1.a:0 "Has conseguido llegar a la puerta"
ev9.44.2.a:0 "Los arqueros enemigos os abatieron como a patos de feria"
ev9.44.0.b:0 "Necesito tiempo para pensar."
ev9.44.0.b_ct:0 "Intentas elaborar un plan"
suffering_casualties:0 "¡Estáis sufriendo bajas!"
ev9.45.desc:0 "Sin embargo, los enemigos no te dan tiempo a actuar. Oyes que están preparando un asalto a la torre. Algunos de tus hombres están heridos, pero la mayoría aún puede luchar."
ev9.45.0.a:0 "Que vengan; estamos preparados."
ev9.45.0.a_ct:0 "Rechazáis un segundo ataque"
ev9.45.0.b:0 "Puedo esparcir hierbas que cieguen a los atacantes."
ev9.45.0.c:0 "Quemaré con un hechizo a cualquiera que intente entrar."
ev9.46.desc:0 "El asalto ha sido rechazado y a la entrada de la torre se amontonan los cadáveres de los atacantes. Dispones de un momento para trazar un plan y curarte las heridas. Mientras tanto, oyes la voz de [employer.GetTitledFirstName] retumbar en el exterior."
ev9.46.desc2:0 "\"Impresionante, bruja. Pero aún podemos rendiros por hambre o prender fuego a la torre. Tengo una propuesta: ríndete y perdonaré a tus compañeros; podrán marcharse libres. Tú recibirás una muerte rápida.\""
ev9.46.0.a:0 "Tenemos que rendirnos."
ev9.46.0.a_ct:0 "Tus seguidores serán perdonados"
ev9.46.0.b:0 "Intentaré negociar mejores condiciones de rendición."
ev9.46.0.b_ct:0 "Se te perdonará la vida (por ahora...)."
ev9.46.0.c:0 "Seguiremos defendiéndonos."
ev9.47.desc:0 "El tiempo pasa y se acerca el anochecer. Los enemigos parecen prepararse para otro asalto, pero no tienen prisa. Tú, en cambio, no dejas de pensar en cómo salir de esta trampa. Se te ocurre algo..."
ev9.47.desc2:0 "\"¡Eh, tú! —es de nuevo [employer.GetTitledFirstName]—. Hemos capturado a tu hombre. ¿Crees que soy idiota? Nadie vendrá a ayudarte, ¡ríndete!\"\nEstá claro que necesitas un nuevo plan..."
ev9.47.0.a:0 "Tenemos muchas flechas y aceite aquí. Bien..."
ev9.47.0.a_fl:0 "¿Alguien ha mencionado el incendio?"
ev9.47.0.a_ct:0 "Disparar flechas incendiarias contra otras partes del castillo podría sembrar el caos y facilitar la huida."
ev9.47.0.a_ct2:0 "Aprovecharás la distracción para correr por las murallas hasta la puerta."
ev9.47.0.b:0 "Tenemos que enviar un mensaje al campamento."
ev9.47.0.b_fl:0 "Un solo hombre tiene posibilidades de escapar sin ser visto y llamar a nuestras tropas."
ev9.47.0.b_ct:0 "Debes resistir hasta que lleguen los refuerzos"
ev9.47.1.b:0 "El mensaje será entregado"
ev9.47.2.b:0 "El mensajero será capturado"
ev9.47.0.c:0 "Invocaré a un demonio."
ev9.47.0.c_fl:0 "El demonio sembrará confusión en las filas enemigas... siempre que no se vuelva contra ti."
ev9.47.0.c_ct:0 "El resultado será impredecible"
ev9.47.0.d:0 "Desintegraré el muro para que podamos escapar."
ev9.47.0.d_fl:0 "$master_alteration_modifier$ convertirá sin esfuerzo la roca sólida en aire."
ev9.47.0.e:0 "Prepararé un hechizo de Dominación Masiva."
ev9.47.0.e_fl:0 "$master_psionic_modifier$ puede volver a algunos enemigos unos contra otros si las circunstancias son favorables."
ev9.47.0.e_ct:0 "¡Esto creará una oportunidad para escapar!"
ev9.47.0.f:0 "Creo que un hechizo de tornado distraerá a los enemigos."
ev9.47.0.f_fl:0 "El hechizo de tornado es imprevisible, pero salvo que la tormenta golpee directamente la torre, deberías estar a salvo."
ev9.47.0.f_ct:0 "¡Esto creará una oportunidad para escapar!"
ev9.47.0.g_fl:0 "A veces rendirse es la única opción."
ev9.48.desc:0 "Has conseguido llegar a la puerta, que estaba vigilada, pero te deshiciste rápidamente de los guardias. Dañaste la reja de la puerta para que no pudiera levantarse —dificultando así la persecución— y luego os descolgasteis al otro lado con cuerdas. Estáis libres."
ev9.48.0.a:0 "Desaparezcamos antes de que se organicen."
ev9.48.0.b:0 "Algún día me vengaré por esto."
ev9.49.desc:0 "Un demonio apareció en la estancia acompañado por el intenso hedor del azufre. No parece precisamente de buen humor.\n\"Has interrumpido mi comida, mortal. ¿Por qué me molestas?\""
ev9.49.0.a:0 "Tengo comida mejor para ti. Fuera."
ev9.50.desc:0 "\"¿De qué estás hablando? ¿Cuál es la trampa?\" El demonio parece interesado."
ev9.50.0.a:0 "Puedo liberarte si matas a unos cuantos soldados por mí."
ev9.51.desc:0 "«Mortal, antes me picaba la curiosidad; ahora ya tienes toda mi atención.»\nExplicaste tu situación al demonio y parece que habéis llegado a un entendimiento. Aunque semejante número de soldados podría abatir incluso a una criatura así, su ataque sin duda causará suficiente caos como para que podáis romper el cerco. Tras unos instantes, liberas al demonio del círculo de invocación improvisado y este abandona la torre. Fuera, oyes gritos de terror y dolor, ¡como si hubieras desatado todo el infierno, y no a un solo demonio!"
ev9.51.0.a:0 "¡Rápido! ¡A la puerta!"
MAGIC_HEALING_SCARS:0 "Eliminar cicatrices."
rol_special1_terrain_cancel_negative_supply:0 "Permite el hechizo de sanación para magos"
rol_special2_terrain_cancel_negative_supply:0 "La sanación elimina defectos genéticos"
visited_place_of_power:0 "¡Has visitado un lugar de poder!"
laamp_magic_1009_contract:0 "Caza del monstruo"
laamp_magic_1009_request:0 "Este [task_contract|E] requiere aptitudes mágicas y una saturación de poder elevada."
laamp_magic_1009_desc_title:0 "$laamp_magic_1009_contract$"
laamp_magic_1009_desc:0 "Hay un monstruo merodeando por el reino de [TaskContract.GetEmployer.GetTitledFirstName], o al menos eso dicen los rumores. Sea lo que sea, está matando a la gente y nadie ha sido capaz de detenerlo. [TaskContract.GetEmployer.GetTitledFirstName] está dispuesto a pagar en oro a quien resuelva el problema."
ev9.52.desc:0 "Has mantenido una conversación con [employer.GetTitledFirstName] para recabar la información básica sobre tu misión. Desde hacía tiempo, campesinos locales estaban desapareciendo sin dejar rastro, pero a nadie le importaba porque solo eran campesinos. Sin embargo, recientemente apareció en el borde del bosque el cadáver de uno de los cortesanos, [dead_courtier.GetTitledFirstName]. Parecía que [dead_courtier.GetSheHe] había sido despedazado por algún animal salvaje, pero cuando los cazadores fueron a seguir el rastro, ninguno regresó. También se envió una patrulla militar y los soldados desaparecieron sin dejar rastro. Entonces [employer.GetTitledFirstName] decidió llamar a un profesional... a alguien como tú."
ev9.52.0.a:0 "Quiero ver el cuerpo."
ev9.53.desc:0 "[dead_courtier.GetTitledFirstName] fue hallado hace unos días, así que el cuerpo ya está en estado de descomposición, pero aun así reparas en las marcas de garras en su cuerpo. No son arañazos superficiales; algo destripó a [dead_courtier.GetHerHim]. Debió de ser una muerte dolorosa."
ev9.53.0.a:0 "Quiero ver dónde encontraron a [dead_courtier.GetHerHim]."
ev9.53.0.b:0 "Haré una disección."
ev9.53.0.c:0 "Buscaré señales de magia."
ev9.53.0.d:0 "Examinaré las marcas de garras."
ev9.53.0.e:0 "Intentaré leer el aura."
ev9.53.0.f:0 "Tengo un mal presentimiento; lo dejaré."
ev9.53.desc1:0 "El cortesano sufrió heridas gravísimas y una muerte lenta y agónica. De hecho, la disposición y el tamaño de las heridas sugieren que el dolor se prolongó durante mucho tiempo, como si aquello que mató a [dead_courtier.GetHerHim] hubiera querido mantenerle con vida tanto como fuese posible. Los animales no actúan así. También adviertes que le faltan el hígado y el corazón."
ev9.53.desc2:0 "Percibes débiles restos de un aura mágica en el cadáver, pero no puedes decir mucho más. Tal vez sea una coincidencia o alguna clase de eco mágico."
ev9.53.desc3:0 "Has examinado las heridas, pero lo único que puedes asegurar es que jamás has oído hablar de un animal que inflija daños de este tipo."
ev9.53.desc4:0 "El aura es demasiado tenue para leerla con claridad, pero has logrado determinar que [dead_courtier.GetTitledFirstName] no era un mago ni tampoco fue objetivo de un hechizo. Sin embargo, la cosa que lo mató quizá poseía algún tipo de magia."
ev9.54.desc:0 "Has llegado al lugar donde encontraron el cuerpo. No hay marcas aquí, salvo que el suelo está algo más oscuro en un punto, empapado con la sangre del difunto. Probablemente no encuentres nada de interés."
ev9.54.0.a:0 "Creo que echaré un vistazo por la zona."
ev9.54.0.a_ct:0 "Seguirás el camino que pudieron tomar antes los cazadores y los soldados."
ev9.55.desc:0 "La zona se vuelve pantanosa y hay un olor extraño en el aire. También tienes la desagradable sensación de que alguien o algo te observa. Quizá esta expedición en solitario no haya sido buena idea."
ev9.55.0.a:0 "Seguiré adelante; la respuesta debe de estar cerca."
ev9.55.0.a1:0 "Encuentras el rastro."
ev9.55.0.a1_ct:0 "Te estás acercando a resolver el misterio"
ev9.55.0.a2:0 "Te has extraviado."
ev9.55.0.a2_ct:0 "No tienes ni idea de dónde estás."
ev9.55.0.b:0 "Buscaré rastros."
ev9.55.0.c:0 "Vuelvo al castillo; está a punto de anochecer."
ev9.55.0.c_ct:0 "Decides regresar al castillo con tus acompañantes"
ev9.56.desc1:0 "Cuando te volvías hacia el castillo descubriste que alguien estaba detrás de ti...\n"
ev9.56.desc0:0 "Has logrado encontrar el camino correcto; está claro que mucha gente ha pasado por aquí recientemente. Estabas tan concentrado en seguir el rastro que no te diste cuenta de que no estabas solo.\n"
ev9.56.desc:0 "«¿Te has perdido, [this0.Custom('GetProperWitchDesc')]?»\nUna figura ha salido de las sombras. A primera vista se asemeja a un ser humano, pero hueles el azufre y la magia, y la maldad que desprende su mirada basta para helarte la sangre. Es un demonio."
ev9.56.0.a:0 "$ev53.0.a$"
ev9.56.0.b:0 "Así que probablemente te estaba buscando a ti."
behemoth_name:0 "Behemot"
mage_small_letter:0 "mago"
witch_small_letter:0 "bruja"
ev9.57.desc:0 "\"Bien dicho. Supongo que el señor local tiene un pequeño problema con que vaya matando a sus súbditos uno por uno. Y ahora me envía otro sabroso bocado. Qué delicia.\""
ev9.57.0.a:0 "¡Muere, demonio!"
ev9.57.0.b:0 "No busco problemas..."
ev9.58.desc:0 "\"¡Pues los problemas te han encontrado!\" El demonio se lanza al ataque."
ev9.58.0.a:0 "Te arrepentirás de esto."
ev9.57.1.a:0 "Derrotas al demonio"
ev9.57.2.a:0 "El demonio te hace pedazos"
ev9.59.desc:0 "Te costó derrotar al demonio; nunca antes te habías enfrentado a un adversario tan rápido y fuerte. Un trofeo así impresionará sin duda a tu empleador."
ev9.59.0.a:0 "Caso cerrado."
ev9.60.desc:0 "«Así que el gobernante local ha enviado a un mago para ocuparse del problema. Una determinación admirable.»"
ev9.60.0.a:0 "¿Quién te invocó?"
ev9.61.desc:0 "\"Algún mago mal instruido. Me liberé de su control y empecé a explorar vuestro hermoso mundo. Está lleno de bocados sabrosos... y de sorpresas.\""
ev9.61.0.a:0 "Te enviaré al abismo."
ev9.62.desc:0 "\"No quiero volver allí. Pero tampoco quiero luchar contigo; percibo que eres fuerte. ¿Qué te parece una especie de compromiso? Me uniré a ti como tu sirviente.\""
ev9.62.0.a:0 "¿Confiar en un demonio? Jamás."
ev9.62.0.b:0 "Está bien. Volvamos al campamento."
ev9.63.desc:0 "«Buen planteamiento, pero aun así morirás», gruñe el demonio antes de abalanzarse sobre ti."
ev9.63.0.a:0 "Quemaré a [demon2.GetHerHim] con mi poder."
ev9.63.0.b:0 "Lo haré pedazos."
ev9.64.desc:0 "Tú y el demonio os dirigís hacia el campamento. Mientras piensas qué decirle a [employer.GetTitledFirstName], un golpe brutal te derriba de improviso. Te das cuenta de que yaces aturdido en un charco de tu propia sangre, incapaz de hacer nada.\n«Así que los humanos son necios después de todo. Al menos estás sabroso. Me pregunto a qué sabrá el hígado de un mago. Veo que tú también te mueres de curiosidad...»."
ev9.64.0.a:0 "No...!"
ev3.29.n:0 "Destrucción."
ev3.34.i:0 "Esto hará que las guerras sean mucho más sencillas."
ev3.34.i_ct:0 "Obtienes acceso a la [interaction|E] #italic Hechizo de tornado#!"
tornado_spell:0 "Tornado"
tornado_spell_desc:0 "Es un hechizo diseñado para destruir ejércitos enemigos, aunque sus efectos a veces pueden descontrolarse."
tornado_spell_ct:0 "El tornado golpeará al ejército objetivo o a su reino."
ev9.65.desc:0 "El hechizo de Tornado está preparado. Ahora solo necesitas elegir el objetivo exacto del golpe..."
ev9.65.0.a:0 "Enviaré un tornado allí donde esté [recipient.GetTitledFirstName]."
ev9.65.0.b:0 "Un tornado golpeará la capital de [recipient.GetTitledFirstName]."
