CHANCE_IS_TOO_LOW_CUSTOM:0 "La probabilidad de éxito es demasiado baja"
ADVANTAGES_ARE_TOO_LOW_CUSTOM:0 "Necesitas al menos cinco ventajas"
ev9.91.desc:0 "Tus preparativos para el ritual del Hechizo definitivo avanzan. Pronto un poder inmenso estará en tus manos, listo para amoldarse a tu voluntad."
ev9.91.0.a:0 "¡Lancemos el hechizo!"
ev9.91.0.b:0 "Esperaremos un poco más."
ev9.91.1.a_ct:0 "#P Lanzas con éxito el Hechizo definitivo.#!"
ev9.91.2.a_ct:0 "#N El hechizo ha fracasado.#!"
ev9.91.3.a_ct:0 "#N Podría ocurrir una catástrofe.#!"
ev9.91.4.a_ct:0 "#N Los participantes en el ritual podrían morir.#!"
ev9.92.desc:0 "Estás listo para realizar el ritual que te permitirá lanzar el Hechizo definitivo. Probablemente sea uno de los conjuros más poderosos que un hechicero puede lanzar, así que seguramente necesitarás la ayuda de otros magos, además de enormes cantidades de energía mágica."
ev9.92.0.a:0 "Aceleraré los preparativos."
ev9.92.0.b:0 "$ev2.2.d$"
ev9.92.0.c:0 "Puedo lanzar el hechizo sin más."
ev9.92.0.c_ct:0 "El Hechizo definitivo se lanzará de inmediato."
ev9.92.0.a_ct:0 "Inicias [GetScheme('ultimate_spell_cast').GetTypeName] [scheme|E]"
ev9.93.title:0 "El Hechizo definitivo: fallo crítico"
ev9.93.desc:0 "Cuando intentaste lanzar el hechizo, el poder que habías acumulado estalló fuera de control. Una enorme erupción de energía provocó una explosión que se oyó incluso en los reinos vecinos."
ev9.94.title:0 "El Hechizo definitivo: fracaso"
ev9.94.desc:0 "Cuando intentaste lanzar el hechizo, el poder que habías acumulado estalló fuera de control. Si no haces algo, todos moriréis."
ev9.94.0.a:0 "¡Contendré el hechizo!"
ev9.94.0.b:0 "Sacrificaré a [p1.GetTitledFirstName]."
grand_spell_decision_desc2:0 "El Hechizo definitivo es muy poderoso y tiene muchos usos, pero es complicado y arriesgado: el más mínimo error al lanzarlo puede tener resultados desastrosos."
ev9.95.title:0 "El Hechizo definitivo: estabilización"
ev9.95.desc:0 "El ritual concentra un poder cada vez más difícil de controlar. Debes encontrar la manera de mantener a salvo tanto a tus tejedores de hechizos como a ti mismo."
ev9.95.0.a:0 "Recalcularé los parámetros del hechizo."
ev9.95.0.b:0 "No hay de qué preocuparse..."
ultimate_spell_unstable_modifier:0 "Hechizo inestable"
ultimate_spell_stable_modifier:0 "Hechizo estable"
ev9.96.title:0 "El Hechizo definitivo: concentración de poder"
ev9.96.desc:0 "El ritual necesita poder adicional para sostener sus efectos; de lo contrario, el hechizo podría debilitarse o volverse inestable."
ev9.96.0.a:0 "Cargaremos el hechizo."
ev9.96.0.b:0 "No creo que sea necesario."
ev9.96.0.b_ct:0 "#N El hechizo podría surtir efectos debilitados.#!"
ev9.97.title:0 "El Hechizo definitivo: experimento"
ev9.97.desc:0 "Tratar con una magia tan poderosa ofrece oportunidades para muchas observaciones interesantes. Te parece que ya podrías usar parte del poder del hechizo en esta fase."
ev9.97.0.a:0 "Intentaré absorber algo de poder."
ev7.105.j:0 "Exijo el apoyo del consejo."
ev7.105.j_ct:0 "Los participantes en la Cumbre de Magos pueden unirse al [scheme|E] [GetScheme('ultimate_spell_cast').GetTypeName]"
mage_council_support_modifier:0 "Apoyo del Consejo de Magos"
ultimate_spell_council_modifier:0 "$mage_council_support_modifier$"
ev9.98.title:0 "Dones oscuros"
ev9.98.desc:0 "Caes en un sueño agitado. En él ves a un ser de sombra y luz observándote. Le oyes decir: \"Tengo algo para ti, mortal. ¿Lo sientes? Estos son mis dones.\""
ev9.98.0.a:0 "Mis manos... ¿qué me está pasando?"
ev9.98.0.b:0 "Ya veo... de algún modo distinto."
ev9.98.0.c:0 "¡No quiero tus dones, los rechazo!"
ev9.99.desc:0 "El sueño ha terminado. Te despiertas y te levantas tambaleante. Te sientes diferente, como si algo hubiera cambiado."
ev9.99.0.a:0 "¡No era un sueño!"
ev9.99.0.b:0 "¡Mis ojos!"
ev9.99.0.c:0 "Fue inspirador."
