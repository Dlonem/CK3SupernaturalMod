camp_purpose_seekers:0 "Buscadores de secretos"
camp_purpose_seekers_effects:0 "$EFFECT_LIST_BULLET$Encuentra más [task_contracts|E] de [learning|E] e [intrigue|E]\n$EFFECT_LIST_BULLET$Puede encontrar [task_contracts|E] especiales de brujería\n$EFFECT_LIST_BULLET$Habilita la [GetTravelOption('adventurers_search_for_secrets_option').GetName] [travel_option|E]\n$EFFECT_LIST_BULLET$Desbloquea [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('fortune_tellers_tent_01').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('cult_caravan_01').GetName]#!\n$EFFECT_LIST_BULLET$Puede acceder a ciertos [officers|E] especiales:\n$BULLET_WITH_TAB$[GetCourtPositionType('cult_priest_camp_officer').GetName()] #weak (Se desbloquea mediante $cult_caravan_01_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Se desbloquea mediante $supply_tent_subdued_gear_domicile_building$)#!\n\n#weak Ya seas una bruja sedienta de poder, un sacerdote de un culto prohibido o un mero oportunista, el conocimiento secreto y los misterios olvidados son el camino hacia el poder y la comprensión del universo.#!"
camp_requirement_unlocked_by_purpose_seekers:0 "Tu $camp_purpose$ debe ser [GetLaw('camp_purpose_seekers').GetName]"
fortune_tellers_tent_01_domicile_building:0 "Tienda del adivino"
fortune_tellers_tent_01_domicile_building_desc:0 "Puede que no sean más que trucos de feria o quizá encierren un toque de magia real. Sea como fuere, el adivino estará encantado de compartir sus ganancias."
