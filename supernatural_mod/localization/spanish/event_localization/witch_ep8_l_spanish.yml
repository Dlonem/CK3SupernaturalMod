setting_yep2_magic_witches_desc:0 "Empiezas la partida como una bruja con el rasgo Fuente."
decision_group_type_magic_decisions:0 "Hechizos y rituales"
trait_demon0:0 "Herencia demoníaca"
trait_demon0_desc:0 "En el futuro, la verdadera naturaleza de esta persona podría quedar al descubierto..."
demon0_terrain_cancel_negative_supply:0 "Puede convertirse en un demonio en el futuro"
ev2.38.b:0 "Rechazo mi... herencia."
ev8.2.desc.puppet:0 "[recipient.GetSheHe|U] está #N dominado#! por [my_mmaster.GetTitledFirstName]."
ev9.0.e:0 "El artefacto debe ser mío."
ev9.0.f:0 "Mi esbirro me entregará el artefacto."
ev9.0.g:0 "Intentaré comprar este artefacto."
ev9.1.g:0 "El trato sale adelante."
ev9.2.g:0 "El objetivo rechaza tu oferta."
ev9.71.desc:0 "Por desgracia, [second_mage.GetTitledFirstName] rechazó tu generosa oferta."
ev9.71.0.a:0 "[second_mage.GetSheHe|U] lo lamentará."
alchemy_archmage_terrain_advantage:0 "Ganancia de XP de alquimia para magos"
ev9.72.title:0 "Gastrónomo"
ev9.72.desc:0 "Últimamente sientes una insatisfacción creciente, cuya causa probablemente sea una dieta pobre. Sería agradable picar algo realmente bueno; al fin y al cabo, ser una bruja también consiste en entregarse a ciertos placeres. [victim.GetTitledFirstName] parece un candidato adecuado para una cena exquisita. Será delicioso..."
ev9.72.0.a:0 "La carne debe volver al menú."
ev9.72.0.b:0 "Ahora no tengo tiempo para eso."
ev9.73.title:0 "Respeto y reconocimiento"
ev9.73.desc:0 "Uno de los hechiceros se acercó para felicitarte por tu victoria en el duelo de magos contra [defeated.GetTitledFirstName]. Parece que cada vez más gente respeta tus habilidades y el poder que empuñas."
ev9.73.0.a:0 "Es agradable..."
ev9.73.0.b:0 "La reputación es importante."
ev9.73.0.c:0 "No me importa."
ev9.73.0.d:0 "No deberían felicitarme; deberían temerme."
ev9.74.desc:0 "Las circunstancias son favorables para un ritual especial: puedes extraer poder directamente de tu reino y de tus tierras. Tus súbditos se volverán algo menos productivos, pero también más dóciles."
power_extraction_modifier:0 "Extracción de poder"
ev9.74.desc2:0 "Las circunstancias son propicias para un ritual especial: puedes drenar poder directamente de esta zona."
ev9.74.0.a:0 "Lo llevaré a cabo."
ev9.74.0.b:0 "Sacrificaré a mi heredero."
ev9.74.0.c:0 "Usaré mi propia vitalidad."
ev2.56.c:0 "Necesito comprender mejor el proceso."
ev2.56.c_ct:0 "Recibirás XP adicional de alquimia cuando te conviertas en mago."
mage_duel_terrain_cancel_negative_supply:0 "Desbloquea el [interaction|E] #italic Duelo de magos#!"
search_artifacts_terrain_cancel_negative_supply:0 "Desbloquea la [activity|E] Buscar artefactos mágicos para brujas"
ev9.75.desc:0 "Algunos capítulos hablan en términos velados de depredadores eternos que se alimentan de la propia vida, de linajes malditos deformados por el instinto y la furia, y de una rara y blasfema unión entre ambos. Las implicaciones son aterradoras. Si tan solo una parte es cierta, nuestra realidad no es más que un velo tenue que oculta algo más antiguo, más cruel y mucho más astuto. Y lo peor es que no puede descartarse la posibilidad de que algunos sigan entre nosotros, ocultos, observando."
ev9.75.0.a:0 "Esto es increíble."
ev6.5.0.b:0 "Hace mucho que no le doy una paliza a Moloch."
ev9.76.desc:0 "Moloch ha aparecido en el círculo de invocación. En cuanto te vio, se enfureció aún más: ¡te recuerda! En un frenesí, cargó contra el círculo, mientras las chispas saltaban por el aire."
ev9.76.0.a:0 "¿Listo para otra ronda?"
ev9.76.0.b:0 "Qué aburrido eres; desaparece."
ev9.77.desc:0 "«Te doy la bienvenida, [this0.GetTitledFirstName]», dice la demonia, complacida de verte. «Es una suerte que me hayas invocado; podemos hacer un pequeño intercambio. Necesito llevarme al infierno a uno de tus cortesanos: [rcourtier.GetTitledFirstName].»"
ev9.77.0.a:0 "¿Por qué quieres llevarte a [rcourtier.GetHerHim]?"
ev9.78.desc:0 "«No lo entenderías; son asuntos infernales. Digamos que lo necesito para mi experimento. A cambio, puedo contarte algunos secretos mágicos.»"
ev9.78.0.a:0 "Prefiero más poder."
abduct_enemy_scheme_phase_duration_add:0 "Enemigo $murder_scheme_phase_duration_add$"
murder_enemy_scheme_phase_duration_add:0 "Enemigo $abduct_scheme_phase_duration_add$"
laamp_magic_1010_contract:0 "Mansión encantada"
laamp_magic_1010_request:0 "Este [task_contract|E] requiere que viajes a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y resuelvas un problema usando la habilidad de [learning|E]."
laamp_magic_1010_desc_title:0 "$laamp_magic_1010_contract$"
laamp_magic_1010_desc:0 "Se dice que el castillo de [TaskContract.GetEmployer.GetTitledFirstName] está embrujado. [TaskContract.GetEmployer.GetTitledFirstName] busca a un especialista capaz de librarlo de esos huéspedes indeseados."
ev9.80.desc:0 "\"Me alegra que hayas venido. Creo que puedes ayudarme. Por la noche se oyen ruidos extraños en el castillo, las luces parpadean y las paredes parecen moverse. La gente de aquí duerme mal, y yo también tengo sueños extraños. Algunos oyen voces en sus cabezas... ¿es posible que haya algo sobrenatural detrás de todo esto?\""
ev9.80.0.a:0 "No creo en fantasmas."
ev9.80.0.b:0 "Todo es posible."
ev9.81.desc:0 "\"Sea lo que sea, quiero que resuelvas este problema. La situación actual está dañando mi reputación, mis cortesanos empiezan a inquietarse y mis enemigos seguro que intentarán aprovecharse. Pasa la noche en el castillo y podrás valorar la situación por ti mismo.\""
ev9.81.0.a:0 "No tengo tiempo para estas necedades. Adiós."
ev9.81.0.b_ct:0 "Te quedarás en el castillo una temporada."
ev9.82.desc:0 "Pasas unos cuantos días en el castillo, pero no ocurre nada sospechoso. Hasta que, a la noche siguiente, te despiertan unos sonidos extraños... Te incorporas y notas mareo. Nunca te habías sentido así. Tienes la impresión de oír susurros procedentes del pasillo."
ev9.82.0.a:0 "Tengo que investigarlo."
ev9.83.desc:0 "El corredor está en calma y en silencio. Por un instante crees haber visto algo moverse en la oscuridad, pero al acercarte no encuentras a nadie. ¿Habrán sido fantasmas? Y ahí está de nuevo esa extraña sensación de no estar solo."
ev9.83.desc2:0 "No encuentras señales de magia en la zona. Tal vez se trate de algo desconocido para ti... o quizá los fantasmas no dejen rastros mágicos."
ev9.83.0.a:0 "Necesito pensar en esto."
ev9.83.1.a:0 "Se te ocurre una idea."
ev9.83.2.a:0 "No tienes ni idea de qué ocurre aquí."
ev9.83.0.b:0 "Buscaré rastros de magia."
ev9.83.0.b_ct:0 "Investigarás la zona en busca de señales mágicas."
ev9.84.desc:0 "Has realizado algunos experimentos y revisado las paredes y los suelos, pero no has encontrado nada interesante. No tienes ni idea de qué está ocurriendo aquí."
ev9.84.0.a:0 "Me quedaré aquí un poco más."
ev9.84.0.b:0 "Me largo de aquí."
ev9.85.desc:0 "La noche siguiente tuviste una pesadilla. Te despertaste de golpe y tardaste un buen rato en recordar dónde estabas. De nuevo te pareció oír susurros, quizá del corredor o quizá de las paredes. Cuando te levantaste para mirar a tu alrededor, descubriste que apenas podías mantenerte en pie. ¿Tal vez estés enfermo?"
ev9.85.0.a:0 "Será mejor que vuelva a la cama..."
ev9.85.0.b:0 "Mi enfermedad no es casualidad."
ev9.85.0.b_ct:0 "Decides realizar un experimento."
ev9.86.desc:0 "Al día siguiente sigues sin encontrarte bien. Quizá no haya fantasmas en absoluto, sino alguna enfermedad; los demás habitantes del castillo tampoco tienen buen aspecto. Llegas a la conclusión de que lo mejor sería abandonar este lugar cuanto antes."
ev9.86.0.a:0 "De vuelta al campamento."
ev9.87.desc:0 "Usando algunas hierbas y herramientas que tenías a mano, lograste realizar un experimento. El resultado es claro: el aire está contaminado. Parece que permanecer unos días en el castillo puede provocar enfermedad, alucinaciones o pesadillas. Eso explica el problema de esos supuestos \"fantasmas\"."
ev9.87.0.a:0 "¿Pero cuál podría ser la causa?"
ev9.88.desc:0 "Al día siguiente decidiste explorar otras zonas del castillo y hablar con el personal. Ahora sabes qué buscar y qué preguntar. De ese modo, acabas llegando a las mazmorras, parcialmente inundadas. En las paredes descubres la causa del problema: un tipo exótico de hongo cuyas esporas estaban provocándolo todo. Secar o sellar las mazmorras eliminará a los \"fantasmas\"."
ev9.88.0.a:0 "[employer.GetTitledFirstName] se alegrará de conocer mis hallazgos."
laamp_magic_1011_ct1:0 "Descubrirás la ubicación del artefacto mágico"
laamp_magic_1011_ct2:0 "Obtendrás un derecho sobre el artefacto mágico"
laamp_magic_1011_contract:0 "$ev2.55.title$"
laamp_magic_1011_request:0 "Este [task_contract|E] requiere viajar a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y usar oro o [intrigue|E] para obtener información."
laamp_magic_1011_desc_title:0 "$laamp_magic_1011_contract$"
laamp_magic_1011_desc:0 "Según los rumores, [TaskContract.GetEmployer.GetTitledFirstName] podría saber algo sobre uno de los artefactos mágicos. Tal vez un poco de astucia o de oro baste para sonsacarle información a [TaskContract.GetEmployer.GetHerHim]."
ev9.89.desc:0 "Has logrado confirmar que [employer.GetTitledFirstName] podría saber algo sobre artefactos mágicos. Un poco de oro o de persuasión quizá baste para hacer que [employer.GetHerHim] hable."
ev9.89.0.a:0 "Le ofreceré oro."
ev9.89.0.b:0 "Obtendré la información mediante engaño."
ev9.89.0.c:0 "Creo que podremos llegar a un acuerdo."
ev9.89.0.e:0 "Examinaré la mente de [employer.GetHerHim]."
ev9.89.0.d:0 "Es una pérdida de tiempo; [employer.GetSheHe] no sabe nada."
ev9.89.0.d_ct:0 "Abandonas la búsqueda de información."
ev9.90.desc:0 "Por la información que has reunido, parece que el artefacto mágico está en posesión de [maowner.GetTitledFirstName]. Tendrás que tenerlo en cuenta al trazar tus planes."
ev9.90.0.a:0 "$ev4.23.0.a$"
ev9.90.0.b:0 "Esto debería ser mío."
ev9.90.0.c:0 "Este es el próximo objetivo de mi maestro ladrón."
