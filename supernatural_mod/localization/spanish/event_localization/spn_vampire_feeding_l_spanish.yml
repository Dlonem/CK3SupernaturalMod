l_spanish:
 vampire_feeding:0 "Alimentación"
 vampire_feeding_desc:0 "Ha pasado un tiempo desde la última vez que te alimentaste. Sal a una localidad cercana y encuentra a alguien de quien alimentarte."
 vampire_feeding_host_desc:0 "$BULLET_WITH_TAB$Los vampiros pueden ganar [prestige|E]\n$BULLET_WITH_TAB$Los vampiros pueden ganar [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Los vampiros pueden ganar [gold|E]\n$BULLET_WITH_TAB$Los vampiros pueden adquirir conocimientos y habilidades\n"
 vampire_feeding_guest_desc:0 "$BULLET_WITH_TAB$Los vampiros pueden ganar [prestige|E]\n$BULLET_WITH_TAB$Los vampiros pueden ganar [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Los vampiros pueden ganar [gold|E]\n$BULLET_WITH_TAB$Los vampiros pueden adquirir conocimientos y habilidades\n"
 vampire_feeding_selection_tooltip:0 "Sal a buscar a un humano del que alimentarte y aumenta tu fuerza."
 vampire_feeding_destination_selection:0 ""
 vampire_feeding_province_desc:0 "Este es un lugar adecuado para encontrar a alguien de quien alimentarte."
 vampire_feeding_predicted_cost:0 "Necesitarás gastar algo de oro para pasar desapercibido."
 vampire_feeding_guest_help_text:0 "Alimentarse a solas sacia más, pero hacerlo junto a otros vampiros puede aumentar la seguridad."
 vampire_feeding_host_an_a:0 "un vampiro"
 known_vampire_feed:0 "Te resultará más difícil alimentarte siendo un [GetTrait('spn_known_vampire').GetName( GetNullCharacter )]"
 known_hybrid_feed:0 "Te resultará más difícil alimentarte siendo un [GetTrait('spn_known_hybrid').GetName( GetNullCharacter )]"

 # Intenciones de la actividad
 strengthen_the_blood_intent:0 "Fortalecer la sangre"
 strengthen_the_blood_intent_desc:0 "Aliméntate con la intención de potenciar tus poderes vampíricos, buscando desbloquear una fuerza mayor y un control más firme sobre tus capacidades."
 satiate_thirst_intent:0 "Saciar la sed"
 satiate_thirst_intent_desc:0 "Aliméntate para mantener el equilibrio y controlar tu estado volátil, reduciendo el desgaste que el hambre causa en tu mente y en tu cuerpo."
 embrace_the_night_intent:0 "Abrazar la noche"
 embrace_the_night_intent_desc:0 "Aliméntate con la intención de recrearte en la emoción de la noche. Entrégate a tu inmortalidad, piérdete en el momento y deja que la energía salvaje de la noche arrastre tus preocupaciones."

 # Fases
 searching_phase:0 "Búsqueda"
 searching_phase_desc:0 "Caza entre las sombras en busca de la presa perfecta."
 feeding_phase:0 "Alimentación"
 feeding_phase_desc:0 "Sacia tu hambre y abraza la noche."

 # Invitaciones
 activity_invite_rule_vampires:0 "Vampiros"
 activity_invite_rule_supernatural_mp:0 "Jugadores sobrenaturales"
 activity_invite_rule_hybrids:0 "Híbridos"

 # Opciones de la actividad
 options_preparations:0 "Preparativos"
 preparations_option_instinct:0 "Instintos vampíricos"
 preparations_option_instinct_desc:0 "Confía en tus instintos y merodea por la zona en busca de un objetivo fácil y aislado.\n\nNo aporta beneficios adicionales a la [feeding_success_chance_no_prefix|E], pero evita tener que preparar nada o gastar [gold|E]."
 preparations_option_scout:0 "Explorar la ciudad"
 preparations_option_scout_desc:0 "Dedica tiempo a reconocer el terreno para encontrar los lugares más seguros y adecuados donde alimentarte.\n\nAumenta la [feeding_success_chance_no_prefix|E] al reducir el riesgo de exposición o complicaciones."
 preparations_option_trap:0 "Tender una trampa"
 preparations_option_trap_desc:0 "Usa el engaño para atraer a presas prometedoras hasta el terreno de caza que hayas elegido, asegurándote de que todo esté dispuesto para tus necesidades.\n\n#high Aumenta mucho#! la [feeding_success_chance_no_prefix|E] al acumular varias ventajas, pero cuesta [gold|E]."
 options_spoils:0 "Botín"
 spoils_option_dead_respect:0 "Respetar a los muertos"
 spoils_option_dead_respect_desc:0 "Muestra reverencia por quienes han perecido negándote a despojarlos de sus pertenencias.\n\nObtienes [piety|E] por tu contención y por el honor que reconocen quienes valoran esos principios."
 spoils_option_robbing:0 "Tomar lo necesario"
 spoils_option_robbing_desc:0 "Disfraza tu alimentación como un desafortunado robo.\n\nAl registrar los bolsillos de tu víctima, obtienes algo de [gold|E] extra que te ayudará a soportar los siglos venideros.\n\nSi algo sale mal, incluso podría parecer un simple robo que acabó en tragedia."
 spoils_option_casing:0 "Elegir presas ricas"
 spoils_option_casing_desc:0 "Selecciona cuidadosamente a tus víctimas para identificar un objetivo de gran valor. Su sangre promete ser exquisita y sus bolsillos, aún más generosos.\n\nAunque el [gold|E] obtenido aumenta considerablemente, este enfoque meticuloso conlleva el riesgo de reducir tu [feeding_success_chance_no_prefix|E]."

 # Conclusión de la actividad
 vampire_feeding_conclusion_desc:0 "La actividad [GetActivityType( 'vampire_feeding' ).GetName] ha concluido."
