l_spanish:
# Invitation to Satiate Thirst Activity - Ev1.01
supernatural_ev1.01:0 "Una carta sellada"
supernatural_ev1.01.desc:0 "Un mensajero ha llegado con una carta sellada y órdenes explícitas: debe entregártela a ti, y solo a ti, y destruirla en cuanto termines de leerla.\n\nReconoces al mensajero: trabaja al servicio de [host.GetName], alguien que comparte tu particular... apetito.\n\nAl leer la carta descubres que [host.GetName] te invita a acompañarle en su próxima salida para alimentarse de un humano, convencido de que tu presencia ayudará a que todo transcurra sin contratiempos.\n\nPodría ser una magnífica oportunidad para saciar tu sed y, de paso, aumentar tu fuerza."
supernatural_ev1.01.a:0 "Lo meditaré."
supernatural_ev1.01.a.tt:0 "Puedes unirte a ellos en su actividad de alimentación."

# No Other Vampires Arrived - Ev1.02
supernatural_ev1.02.t:0 "Una noche tranquila"
supernatural_ev1.02.desc:0 "Cuando cae la noche señalada, ningún otro vampiro acude al encuentro. No lo interpretas como un desaire, sino como una confirmación de tu propia prudencia: entre los tuyos, la confianza se concede con cuentagotas y, esta noche, tu hambre pasará desapercibida para ojos indiscretos.\n\nA falta de compañía, saboreas la soledad y la libertad de entregarte al placer sin interferencias. No hay susurros de rivalidades ni de alianzas; solo la silenciosa satisfacción que brinda una presa elegida con esmero."
supernatural_ev1.02.a:0 "Es mejor así."
 
# Host Event - Ev1.03
supernatural_ev1.03.t:0 "Comienza la reunión"
supernatural_ev1.03.desc:0 "Los vampiros asistentes llegan en silencio a la taberna apartada, con movimientos medidos y deliberados. El aire está cargado de expectación mientras cada invitado reconoce al anfitrión con una leve inclinación antes de acomodarse entre las sombras. La noche promete oportunidades, sustento y alianzas discretas."
supernatural_ev1.03.a:0 "Saludar a los invitados con calidez y camaradería."
supernatural_ev1.03.b:0 "Irradiar un aura de autoridad serena."
supernatural_ev1.03.c:0 "Evaluar la sala en busca de posibles amenazas."
supernatural_ev1.03.c_ct:0 "Pueden surgir imprevistos."
 
# Monster Hunter Appears At Activity - Ev1.04
supernatural_ev1.04.t:0 "Una intrusión no deseada"
supernatural_ev1.04.desc:0 "Cuando la reunión apenas comienza, la puerta de la taberna se abre y entra una figura solitaria. El ambiente se tensa en cuanto resulta evidente: un hábil cazador de monstruos se ha infiltrado en el encuentro. Tal osadía es a la vez peligrosa e insultante, y exige una respuesta rápida y silenciosa para preservar el secreto de todos los presentes."
supernatural_ev1.04.a:0 "Captura al cazador y ocúpate de él discretamente."
supernatural_ev1.04.b:0 "Drena en silencio la vida del cazador y deshazte del cadáver."
 
# Guest's Reaction to Hunter's Death - Ev1.05
supernatural_ev1.05.t:0 "El final del cazador"
supernatural_ev1.05.desc:0 "La vida del cazador se extingue con precisión silenciosa, y el anfitrión drena su sangre mientras los demás vampiros observan. No hay compasión para quien se atrevió a infiltrarse en una reunión así. En cambio, la sala se llena de un respeto frío por la eficacia del anfitrión, templado por el recordatorio de que incluso aquí acechan peligros."
supernatural_ev1.05.a:0 "Un final apropiado para tal insolencia."
supernatural_ev1.05.b:0 "Un acto necesario para garantizar la seguridad de todos."
supernatural_ev1.05.c:0 "Que esto sirva de lección a los demás."

#Mikaelson Attending Activity - Ev1.06, Ev1.07
supernatural_ev1.06.title:0 "Un nombre que susurran las sombras"
supernatural_ev1.06.desc:0 "La reunión ya está muy avanzada y una mezcla de expectación y hambre impregna el ambiente. Mientras el anfitrión se dispone a abrir la velada, una figura entra en la sala con un aura de poder ancestral. Los susurros se propagan entre los invitados.\n\nSe dice que esa figura pertenece a los Mikaelson, un nombre envuelto en misterio y temor, del que algunos aseguran que procede el origen mismo del vampirismo. Sea cierto o no, la presencia de un Mikaelson es innegable, y su reputación de venganza fulminante y hambre insaciable le precede."
supernatural_ev1.06.a:0 "Recibirles con cautela."
supernatural_ev1.07.title:0 "El primero de su especie"
supernatural_ev1.07.desc:0 "A medida que prosigue la reunión, el vampiro Mikaelson empieza a hablar con una voz autoritaria y, al mismo tiempo, extrañamente contenida. Relata fragmentos de una historia, cada detalle pronunciado con una precisión que deja entrever tanto orgullo como cautela.\n\n«Puede que no conozcáis a mi familia, pero la sangre que bebéis todavía susurra el eco de nuestro legado. Mucho antes de reyes e imperios, nosotros fuimos cazadores que se convirtieron en algo más. No buscamos gloria ni reconocimiento, solo lo que se nos debe: el respeto de nuestros iguales y la emoción de la caza.»\n\nLa sala queda en silencio, y cada invitado asimila el peso de sus palabras. ¿Es esta historia una advertencia, una declaración o un simple momento de indulgencia? La intención del Mikaelson sigue siendo tan esquiva como la verdad sobre sus orígenes."
supernatural_ev1.07.a:0 "Respetar su presencia."
supernatural_ev1.07.b:0 "Observar su comportamiento en silencio."
supernatural_ev1.07.b.tt:0 "Decides permanecer en las sombras, observando al vampiro Mikaelson y su relato con cauteloso interés. Quizá sus motivos se revelen a su debido tiempo."
 
# An Unexpected Dinner Guest Activity - Ev1.08
supernatural_ev1.08.title:0 "Un comensal inesperado"
supernatural_ev1.08.desc:0 "Mientras el grupo se reúne en la taberna tenuemente iluminada, la puerta cruje al abrirse y deja ver a un hombre herido que entra tambaleándose. Uno de los asistentes acude a ayudarle por instinto, para inquietud del tabernero. Con unas monedas de más para garantizar su discreción, el grupo asegura la bodega con la excusa de «atender» al hombre... aunque su verdadero destino queda en manos de sus enigmáticos anfitriones."
supernatural_ev1.08.a:0 "Aliméntate de él: su vida nos sustentará."
supernatural_ev1.08.b:0 "Cúrale: esta noche no debe haber complicaciones."
supernatural_ev1.08.c:0 "Controla tu hambre: aliméntate y cúrale, asegurándote de no dejar rastro."
 
# Tavern Game of Wits - Ev1.09
supernatural_ev1.09.title:0 "Un juego de ingenio"
supernatural_ev1.09.desc:0 "Tras una larga noche registrando las calles en penumbra, buscas refugio en una taberna apenas iluminada. El aire está cargado de humo de pipa y cerveza rancia.\n\nEn un rincón, un grupo de parroquianos alborotados juega a acertijos y desafíos de ingenio. Uno de ellos, con los ojos brillantes de picardía, te llama desde su mesa: «¿Te atreves a poner a prueba tu mente, forastero?». Su sonrisa delata un desafío... o quizá una oportunidad.\n\nSientes el tirón del momento: una ocasión para entregarte a juegos sutiles o demostrar el poder discreto que solo un depredador puede ejercer."
supernatural_ev1.09.a:0 "Aceptar el desafío."
supernatural_ev1.09.a_tt:0 "Pones a prueba tu ingenio en el juego de acertijos e intelecto."
supernatural_ev1.09.a_win_tt:0 "Tu mente ágil y tu aguda perspicacia te permiten dominar el juego."
supernatural_ev1.09.a_draw_tt:0 "Te defiendes bien, pero el desafío termina en empate."
supernatural_ev1.09.a_lose_tt:0 "Tu ingenio flaquea y la multitud se ríe a tu costa."
supernatural_ev1.09.b:0 "Compeler al rival."
supernatural_ev1.09.b_tt:0 "Usas tus habilidades vampíricas para influir sutilmente en el rival, ganando fuerza y confianza."
supernatural_ev1.09.c:0 "Declinar educadamente."
supernatural_ev1.09.c_tt:0 "Pierdes prestigio entre los presentes; tu negativa se interpreta como debilidad."
 
# The Catacombs Below - Ev1.10
supernatural_ev1.10.title:0 "Las catacumbas de abajo"
supernatural_ev1.10.desc:0 "A medida que la noche se adentra, el tabernero se inclina hacia ti con una sonrisa ladina y un brillo travieso en los ojos. \n\n\"¿Has oído alguna vez las voces de abajo?\", susurra, mirando de reojo hacia una puerta en la esquina. \"Hay una vieja entrada a las catacumbas ahí abajo. La gente dice que, si escuchas con atención, puedes oír los susurros de quienes se perdieron y jamás regresaron.\" Suelta una risita, claramente complacido por el escalofrío que recorre a la concurrencia. \n\nPero para ti, la idea de un pasadizo oscuro y olvidado bajo la ciudad encierra un atractivo distinto: uno en el que las sombras ofrecen secreto y las presas deambulan sin vigilancia."
supernatural_ev1.10.a:0 "Explorar las catacumbas."
supernatural_ev1.10.a_tt:0 "Oscuridad y silencio... el terreno de caza perfecto."
supernatural_ev1.10.ab_tt:0 "Podría ocurrir algo."
supernatural_ev1.10.b:0 "Pagar por un guía."
supernatural_ev1.10.b_tt:0 "Un poco de oro puede evitar que te conviertas en uno de esos susurros."
supernatural_ev1.10.c:0 "Quedarse en la taberna."
supernatural_ev1.10.c_tt:0 "No hace falta perseguir historias de fantasmas."
supernatural_ev1.10.d:0 "Aceptar a un 'voluntario' dispuesto."
supernatural_ev1.10.d_tt:0 "Parece demasiado fácil: los humanos rara vez ayudan a los vampiros por pura bondad."

# Ambush in the Catacombs - Ev1.11
supernatural_ev1.11.title:0 "Emboscada en las catacumbas"
supernatural_ev1.11.desc:0 "Mientras exploras las catacumbas, percibes el peligro demasiado tarde. Un cazador curtido emerge de las sombras, arma en mano. Debes actuar con rapidez."
supernatural_ev1.11.a:0 "Luchar contra el cazador"
supernatural_ev1.11.a_tt:0 "Te preparas para luchar por tu vida."
supernatural_ev1.11.a_win_tt:0 "Derrotas al cazador y bebes su vida."
supernatural_ev1.11.a_lose_tt:0 "El arma del cazador encuentra su blanco y la oscuridad te reclama."
supernatural_ev1.11.b:0 "Reducir al cazador"
supernatural_ev1.11.b_tt:0 "Te preparas para luchar contra el cazador e intentas someterlo."
supernatural_ev1.11.b_success_tt:0 "Consigues reducir y encarcelar al cazador."
supernatural_ev1.11.b_fail_tt:0 "El cazador escapa de tu alcance y desaparece entre las sombras."
supernatural_ev1.11.c:0 "Retroceder y huir."
supernatural_ev1.11.c_tt:0 "Escapas, pero tu orgullo queda herido."
 
# A Moment of Desire - Ev1.12
supernatural_ev1.12.title:0 "Un momento de deseo"
supernatural_ev1.12.desc:0 "[lover_participant.GetTitledFirstName] se acerca, con ojos brillantes de picardía. «Esta cacería, la emoción... me enardece. ¿Y a ti?»"
supernatural_ev1.12.a:0 "Alquilar una habitación y dejarse llevar."
supernatural_ev1.12.a_tt:0 "La caza puede esperar; algunos deseos no."
supernatural_ev1.12.b:0 "Centrarse en la cacería."
supernatural_ev1.12.b_tt:0 "Mantén el foco; hay presa que encontrar."
 
# Additional Entries - Ev1.12
supernatural_lovers_sneak_key:0 "[ROOT.Char.GetFirstName|U] y [lover_participant.GetFirstName] desaparecieron un tiempo..."
supernatural_lovers_focus_key:0 "[ROOT.Char.GetFirstName|U] se centró en la cacería, resistiendo la tentación de [lover_participant.GetFirstName]."
supernatural_fresh_air_and_exercise_modifier:0 "Aire fresco y ejercicio"
supernatural_focused_attention_modifier:0 "Atención concentrada"
 
# Prepared for the Night - Ev1.13
supernatural_ev1.13.title:0 "Preparado para la noche"
supernatural_ev1.13.desc:0 "Antes de la cacería de esta noche, el anfitrión se tomó su tiempo para acechar entre las sombras, escuchar los susurros de los lugareños y anotar cualquier actividad sospechosa. Nada de lo oído sugería la presencia de un cazador. Confías en los preparativos y el ambiente se llena de seguridad mientras te dispones a salir."
supernatural_ev1.13.a:0 "No debería haber problemas esta noche."
supernatural_ev1.13.a_tt:0 "Reconocer la zona reduce las probabilidades de encontrarte con cazadores."
 
# The Trap - Ev1.14
supernatural_ev1.14.title:0 "La trampa"
supernatural_ev1.14.desc:0 "Los preparativos han sido meticulosos. La trampa está colocada, oculta entre las sombras del callejón. Has previsto cada paso y reducido cada riesgo. Ahora solo queda esperar a que el humano adecuado caiga en la red."
supernatural_ev1.14.a:0 "El plan es perfecto."
supernatural_ev1.14.a_tt:0 "Con la trampa colocada, no habrá interrupciones no deseadas durante la alimentación."

# Tavern Gossip - Ev1.15
supernatural_ev1.15.title:0 "Cotilleos de taberna"
supernatural_ev1.15.desc:0 "Un parroquiano borracho narra a voz en cuello historias de misteriosas desapariciones en otras ciudades. La concurrencia de la taberna escucha entre el miedo y la fascinación. El hombre culpa de esas desapariciones a criaturas que acechan en la noche, aunque otros se burlan de la idea. No puedes evitar sentir el sutil poder que hay en moldear el rumbo de ese relato."
supernatural_ev1.15.a:0 "Fui yo quien rechazó a esas criaturas."
supernatural_ev1.15.a_tt:0 "Hablas con verdad sobre tus batallas secretas, insinuando tu fuerza oculta."
supernatural_ev1.15.b:0 "Son solo crímenes y robos, no leyendas."
supernatural_ev1.15.b_tt:0 "Defiendes una explicación racional y ganas piedad por tu convicción."
supernatural_ev1.15.c:0 "Puede que yo conozca la causa de esas desapariciones..."
supernatural_ev1.15.c_tt:0 "Una sonrisa astuta se dibuja en tu rostro. La ironía de tus palabras no se te escapa."

# Hidden Passageway - Ev1.16
supernatural_ev1.16.title:0 "Un pasaje oculto en la bodega"
supernatural_ev1.16.desc:0 "Mientras exploras la bodega de vinos bajo la taberna, tropiezas con un pasaje secreto hábilmente oculto tras unos barriles polvorientos. Por la estrecha abertura llegan el olor húmedo de la tierra y el frío del aire estancado, señal de una ruta hacia el exterior olvidada desde hace tiempo.\n\nEl pasadizo parece serpentear más allá de los muros de la taberna, y sus sombras prometen secreto y seguridad. Si la alimentación de esta noche se torciera, esta vía de escape podría marcar la diferencia entre la vida y la muerte. Casi puedes oír los ecos de pasos desesperados de quienes quizá usaron este mismo camino para desvanecerse en la noche.\n\nUn plan de reserva siempre es sensato, sobre todo para una criatura nocturna."
supernatural_ev1.16.a:0 "Guardármelo para mí."
supernatural_ev1.16.a_tt:0 "Todo vampiro conoce la importancia de contar con un plan de huida."
supernatural_ev1.16.b:0 "Compartirlo con los demás."
supernatural_ev1.16.b_tt:0 "Debería informar a los invitados de esta vía de escape, por si las cosas se tuercen."

# A Moment of Solace - Ev1.17
supernatural_ev1.17.title:0 "Un momento de solaz"
supernatural_ev1.17.desc:0 "Mientras te deslizas por el estrecho callejón tras la taberna, el fresco aire nocturno te envuelve. Los sonidos amortiguados de la juerga quedan atrás hasta convertirse en un murmullo lejano, y solo permanece el roce discreto de las sombras.\n\nInhalas hondo y notas cómo la tensión se afloja mientras piensas en lo que está por venir: la promesa de la caza y la satisfacción de la alimentación inminente."
supernatural_ev1.17.a:0 "Saborear la anticipación de la cacería."
supernatural_ev1.17.a_tt:0 "Dejas que la emoción de la inminente alimentación te invada, despojándote de tus cargas."
supernatural_ev1.17.b:0 "Fortalecer tu determinación para la noche que se avecina."
supernatural_ev1.17.b_tt:0 "Te armas de un control mesurado, listo para lo que depare la noche."
 
# A Test of Restraint - Ev1.18
supernatural_ev1.18.title:0 "Una prueba de autocontrol"
supernatural_ev1.18.desc:0 "Un grito repentino atraviesa el murmullo de la taberna. Un hombre se lleva las manos a la cara mientras la sangre le brota de la nariz, con un olor intenso y embriagador.\n\nLa tentación te golpea como un rayo. Tus instintos se desbocan, pero una determinación más profunda te mantiene firme. Esta es una prueba, una oportunidad para demostrar que tu fuerza no reside en entregarte al impulso, sino en dominarlo."
supernatural_ev1.18.a:0 "Resistir el impulso."
supernatural_ev1.18.a_tt:0 "Sientes que la potencia de tu sangre se profundiza al dominar el hambre."
supernatural_ev1.18.b:0 "Fortalecer tu determinación."
supernatural_ev1.18.b_tt:0 "Tu naturaleza dual se fortalece al resistir la tentación de la sangre."

# A Moment of Respect - Ev1.19
supernatural_ev1.19.title:0 "Un momento de respeto"
supernatural_ev1.19.desc:0 "Mientras registras los callejones sombríos, tropiezas con un cadáver apoyado contra un muro. El olor a sangre aún es reciente y un destello de oro asoma entre los pliegues de su ropa.\n\nEsta noche has venido a alimentarte, pero una extraña solemnidad se apodera de ti. Esa alma ya ha encontrado su final; quizá lo mejor sea dejarla descansar en paz."
supernatural_ev1.19.a:0 "Mostrar respeto y seguir adelante."
supernatural_ev1.19.a_tt:0 "Resistes la tentación de saquear a los muertos, sintiendo una solemne dignidad."
 
# Whispers In The Dark - Ev1.20
supernatural_ev1.20.title:0 "Susurros en la oscuridad"
supernatural_ev1.20.desc:0 "El último rayo del sol poniente se desvanece mientras te adentras en un callejón sombrío. El ruido de la ciudad bulliciosa te rodea: carros que chirrían, mercaderes que gritan y pasos que resuenan sobre los adoquines.\n\nEntre el clamor, distingues las voces apagadas de dos figuras. Se inclinan una hacia la otra y hablan con urgencia de hombres que se transforman en bestias cuando sale la luna. Sus palabras casi se pierden entre el estrépito, pero tal vez puedas aislarlas y averiguar algo más."
supernatural_ev1.20.a:0 "Concentrarse y escuchar con atención."
supernatural_ev1.20.a_tt:0 "Intentas aislar su conversación del ruido de fondo."
supernatural_ev1.20.a_success_tt:0 "Logras escuchar sus susurros y obtienes información valiosa sobre posibles amenazas."
supernatural_ev1.20.a_fail_tt:0 "No consigues entender su conversación y tu esfuerzo atrae atención no deseada."
supernatural_ev1.20.b:0 "Ignorarlos y continuar."
supernatural_ev1.20.b_tt:0 "Decides no perder tiempo y sigues tu camino."
 
# Wary Citizens - Ev1.21
supernatural_ev1.21.title:0 "Ciudadanos en guardia"
supernatural_ev1.21.desc:0 "Al desvanecerse el último rayo del sol poniente, las sombras se alargan en el estrecho callejón. Los sonidos habituales de la ciudad bulliciosa se apagan hasta dejar una quietud inquietante, rota solo por el correteo de las ratas y el lejano bullicio de la juerga.\n\nUna figura atrae tu atención: un ciudadano receloso que camina deprisa y mira por encima del hombro. Hay algo distinto en él, casi como si supiera que esta noche hay algo ahí fuera."
supernatural_ev1.21.a:0 "Usar tus instintos y seguir en silencio."
supernatural_ev1.21.a_tt:0 "Confías en tus sentidos sobrenaturales para permanecer oculto en las sombras."
supernatural_ev1.21.b:0 "Usar tu conocimiento del entorno."
supernatural_ev1.21.b_tt:0 "Gracias al reconocimiento previo del anfitrión, conoces los ángulos ciegos y los caminos ocultos de esta zona. Analizas cuidadosamente tus opciones."
supernatural_ev1.21.c:0 "Por suerte, tu trampa ya está tendida."
supernatural_ev1.21.c_tt:0 "Preparas una emboscada, dificultando la huida de tu presa."
supernatural_ev1.21.d:0 "Esta noche no hay criaturas por aquí, amigo, solo ratas."
supernatural_ev1.21.d_tt:0 "Caminas con confianza, disipando cualquier sospecha con tu seguridad."

# Whispers of Danger - Ev1.22
supernatural_ev1.22.title:0 "Susurros de peligro"
supernatural_ev1.22.desc:0 "El objetivo se tensa como si un escalofrío le advirtiera del peligro inminente. Los rincones mal iluminados del callejón parecen oscurecerse aún más y un silencio intranquilo se extiende por la zona. Los ojos del humano se mueven de un lado a otro y sus músculos se tensan, preparado para echar a correr al menor indicio de amenaza."
supernatural_ev1.22.a:0 "Acorta la distancia con un estallido de velocidad vampírica."
supernatural_ev1.22.a_tt:0 "Tu nivel de pericia afila tus reflejos."
supernatural_ev1.22.b:0 "Explota la debilidad que has identificado."
supernatural_ev1.22.b_tt:0 "Sabes exactamente cómo acorralarlo."
supernatural_ev1.22.c:0 "Activa la trampa y no le dejes escapatoria."
supernatural_ev1.22.c_tt:0 "La trampa se cierra y sella su destino."
supernatural_ev1.22.d:0 "Avanza con audacia; su miedo es palpable."
supernatural_ev1.22.d_tt:0 "Saboreas la confrontación, seguro de tu poder."

# The Crimson Decision - Ev1.23
supernatural_ev1.23.title:0 "La decisión carmesí"
supernatural_ev1.23.desc:0 "El humano tiembla ante ti, y el latido de su corazón retumba frenético en tus oídos. El miedo que recorre sus venas es casi palpable; cada golpe de su pecho se alza ante tus sentidos como un faro intenso.\n\nLlega el momento de la verdad: ¿cómo saciarás tu hambre esta noche?"
supernatural_ev1.23.a:0 "Desángralo por completo, saboreando cada gota."
supernatural_ev1.23.a_tt:0 "Te entregas por completo, sin importar las consecuencias."
supernatural_ev1.23.b:0 "Toma solo lo justo para saciarte."
supernatural_ev1.23.b_tt:0 "Lo dejas con vida, apenas consciente de lo ocurrido."
supernatural_ev1.23.c:0 "Prueba un poco y aléjate."
supernatural_ev1.23.c_tt:0 "Practicas la disciplina y te alimentas con cuidado."
supernatural_ev1.23.d:0 "Usa la ruta de escape oculta."
supernatural_ev1.23.d_tt:0 "Te desvaneces en la noche sin dejar rastro."
supernatural_ev1.23.e:0 "Aliméntate y luego desvalíjalo."
supernatural_ev1.23.e_tt:0 "Encuentras unas cuantas monedas en sus bolsillos."
supernatural_ev1.23.f:0 "Una presa adinerada ofrece más que sangre."
supernatural_ev1.23.f_tt:0 "Le arrebatas una suma considerable."
