corruption_chance_terrain_advantage:0 "Corrupción [scheme|E] [success_chance|E]"
ev7.17.desc:0 "Tus intrigas han surtido efecto: [target.GetTitledFirstName] se ha reunido contigo y parece vulnerable a tu influencia. Sientes que podrías manipularlo con facilidad."
ev7.17.0.a:0 "Mis palabras envenenarán su mente."
ev7.17.0.b:0 "Podría usar un nuevo títere."
ev7.17.0.b_ct:0 "Se convierte en tu esbirro."
ev7.17.0.c:0 "Provocaré su caída."
ev7.17.0.d:0 "Solo espero un poco... de amabilidad."
HAS_POWERFUL_MAGIC_PROTECTION:0 "El objetivo es inmune a la corrupción."
ev7.18.0.a:0 "Aceptaré su juramento de lealtad."
ev7.18.0.b:0 "Lo usaré de otra manera."
ev7.19.0.a:0 "[target.GetSheHe|U] se convertirá en mi sirviente."
ev7.19.0.b:0 "Compartiré mi conocimiento con [target.GetHerHim]."
ev7.19.0.c:0 "Solo quiero su afecto."
ev7.19.0.d:0 "Acércate, voy a mostrarte algo."
ev7.19.0.e:0 "Tengo otra idea."
ev7.20.desc:0 "Pese a tus numerosos intentos, no has conseguido influir en [target.GetTitledFirstName]. Tal vez tenga suerte, quizá posea una voluntad de hierro, o tal vez alguien le advirtió sobre ti. Sea como fuere, parece inmune a tus manipulaciones."
ev7.21.desc:0 "Has decidido que [target.GetTitledFirstName] sucumbirá a tu influencia. Mediante persuasión sutil, manipulación y magia, puedes conducirlo a la ruina... o elevarlo como tu leal sirviente."
ev7.21.0.a:0 "Ha llegado el momento de actuar."
ev7.22.desc:0 "Aún no puedes contactar con [target.GetTitledFirstName] directamente. Primero debes prepararlo, ablandarlo. Estás redactando una carta anónima y enigmática que servirá de cebo, pero necesitas un argumento capaz de tentarlo."
ev7.22.0.a:0 "Una promesa de poder debería bastar."
ev7.22.0.b:0 "Sus deseos son sus debilidades."
ev7.22.0.c:0 "Oro y riqueza; eso siempre funciona."
ev7.22.0.d:0 "Es orgulloso y noble; aprovecharé eso."
ev7.22.0.e:0 "Le ofreceré magia y conocimiento secreto."
corruption_scheme_good_bait_modifier:0 "El objetivo mordió el anzuelo"
corruption_scheme_bad_bait_modifier:0 "El objetivo no está interesado"
ev7.23.title:0 "Carta anónima"
ev7.23.desc:0 "Esta mañana un mensajero te entregó una carta. No iba firmada, pero su contenido llamó tu atención. Está escrita de forma muy enigmática, aunque entiendes que el remitente tiene algún tipo de oferta para ti. Escribe que pronto volverá a ponerse en contacto contigo."
ev7.23.0.a:0 "No sé qué pensar al respecto."
ev7.24.desc:0 "Tu plan respecto a [target.GetTitledFirstName] va cobrando fuerza. Ahora debes esforzarte en ganarte su confianza."
ev7.24.0.a:0 "Le daré la información."
ev7.24.0.b:0 "Lo manipularé."
ev7.24.0.c:0 "Un pequeño regalo demostrará mis buenas intenciones."
ev7.24.0.d:0 "Por ahora, me limitaré a observar."
ev7.25.desc:0 "Ha llegado otra carta anónima, esta vez con información más concreta. Puede resultar útil."
ev7.26.desc:0 "Ha llegado otra carta anónima. Sigue sin contener información concreta, pero venía acompañada de una bolsa de oro."
ev7.27.desc:0 "Tu intriga requiere información adicional sobre [target.GetTitledFirstName]. Debes usar todos los recursos disponibles para encontrar sus debilidades."
ev7.27.0.a:0 "Esta es tarea para mis espías."
ev7.27.0.b:0 "Averiguaré algo por los cauces oficiales."
ev7.27.0.c:0 "Tengo una idea."
ev7.27.0.d:0 "Puedo confiar en mi aquelarre."
ev7.27.0.e:0 "Ya tengo toda la información que necesito."
ev7.28.desc:0 "La siguiente fase del plan requiere más implicación por tu parte. Necesitas algo lo bastante convincente como para hacer ver a [target.GetTitledFirstName] que colaborar contigo le beneficiará."
ev7.28.0.a:0 "Es un buen momento para una sugerencia mágica."
magical_suggestion_modifier:0 "Sugerencia mágica"
ev7.28.0.b:0 "Le mostraré algunos trucos."
ev7.28.0.c:0 "No me arriesgaré."
ev7.28.0.d:0 "[target.GetSheHe|U] recibirá una bendición oscura."
limited_risk_modifier:0 "Riesgo limitado"
ev7.29.desc:0 "Parece que tus acciones están surtiendo efecto. Tus espías informan de que [target.GetTitledFirstName] se comporta de forma más extraña de lo habitual últimamente, y parece más distraído e imprudente."
ev7.29.0.a_ct:0 "El objetivo puede cambiar de personalidad o ganar estrés."
ev7.30.title:0 "Pensamientos extraños"
ev7.30.desc:0 "Últimamente te sientes extraño, te cuesta dormir y concentrarte. Quizá se deba a esas cartas anónimas que has estado recibiendo, o quizá simplemente estés sobrecargado de responsabilidades."
ev7.30.0.a:0 "Mejoraré dentro de un tiempo."
ev7.30.0.b:0 "Esto me ayudará a conocerme mejor."
ev7.30.0.c:0 "¿Ah, sí?"
