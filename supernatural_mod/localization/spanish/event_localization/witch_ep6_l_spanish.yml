ev2.24.f_2:0 "Campeón victorioso"
ev2.24.desc2:0 "'Derroté a tu campeón; ahora debes rendirte!'"
grand_spell_decision_title:0 "Lanzar el Hechizo Supremo"
grand_spell_decision_desc:0 "Usa el poder que recibiste en la Cumbre de Magos para lanzar un hechizo poderoso."
grand_spell_decision_ct:0 "Intentarás usar magia poderosa."
POWER_NEEDED_CUSTOM2:0 "Requiere 100 puntos de saturación de poder."
ev7.129.desc:0 "Has conseguido reunir enormes cantidades de poder, que se evaporan lentamente de tu cuerpo. Ahora debes darle forma y utilizarlo. Para ti o para otros..."
ev7.129.a:0 "Para otros, por supuesto. Lanzaré un hechizo de curación masiva."
ev7.129.a_ct:0 "#P Los personajes de todo el mundo serán sanados #!."
ev7.129.b:0 "Tanto poder me permitirá invocar y controlar un gran ejército de demonios."
ev7.129.c:0 "Conservaré este poder para mí."
ev7.129.d:0 "Conservaré el Hechizo Supremo para el duelo de magos."
ev7.129.e:0 "Puedo seguir desarrollando mis habilidades."
ultimate_spell_modifier:0 "El Hechizo Supremo"
source3_terrain_cancel_negative_supply:0 "Desbloquea la [decision|E] #italic Lanzar el Hechizo Supremo#!"
ev6.9.0.e:0 "¿Puede la gente olvidar mis pecados?"
ev2.26.a2:0 "Pasará a formar parte de nuestra familia."
