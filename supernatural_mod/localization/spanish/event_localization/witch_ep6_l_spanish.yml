l_spanish:
ev7.1.title:0 "Visiones oscuras"
ev7.1.desc:0 "Últimamente has tenido sueños extraños. En ellos flotas sobre tierras desconocidas y observas criaturas que se parecen a los humanos, aunque está claro que no lo son. En esos sueños te sientes inmensamente poderoso, como si hasta las montañas pudieran moverse a una orden tuya. Sin embargo, ese poder viene acompañado de una oscuridad abrumadora que intenta alcanzarte. Entonces el sueño termina de golpe y despiertas empapado en sudor."
ev7.1.0.a:0 "Qué sueño tan horrible; lo odio."
trait_source4:0 "Fuente inestable"
trait_source0_desc:0 "Parece haber algo notable en esta persona..."
ev7.2.title:0 "Alguien especial"
ev7.2.desc:0 "Percibes algo inusual en ti. A veces puedes oír los pensamientos de otros o anticipar cambios bruscos del tiempo. Notas más cosas que los demás, como si poseyeras un sentido adicional. Por encima de todo, sientes un poder latente en tu interior. Aún no lo comprendes, pero quizá algún día aprendas a dominarlo."
ev7.2.0.a:0 "Soy especial."
ev7.2.0.b:0 "Me pregunto qué más soy capaz de hacer."
ev7.2.0.c:0 "Mmm..."
ev7.3.title:0 "Magia imparable"
ev7.3.desc:0 "Hace poco has descubierto habilidades extraordinarias. Si te concentras, puedes encender velas con solo mirarlas y, una vez, incluso levantaste un juguete en el aire usando únicamente tu voluntad. Sin embargo, esas habilidades ya no son solo algo fascinante: hiciste desaparecer a una criada en el aire, y nunca volvió a ser encontrada. Para empeorar las cosas, tus pesadillas se han intensificado y los objetos a tu alrededor prenden fuego sin explicación."
ev7.3.0.a:0 "¿Qué me está pasando?"
ev7.4.title:0 "Niño extraño"
ev7.4.desc:0 "[schild.GetTitledFirstName] es un niño fuera de lo común. Los sirvientes están aterrados de [schild.GetHerHim] y parecen ocurrir fenómenos extraños a su alrededor. Los objetos se mueven solos, resuenan ruidos inquietantes y hace poco se declaró un incendio. Cada vez que [schild.GetTitledFirstName] se acerca, la temperatura cambia sin explicación. Hay que hacer algo..."
ev7.4.0.a:0 "Necesito encontrar un cuidador adecuado."
ev7.4.0.b:0 "Ese niño está maldito y no tiene lugar aquí."
ev7.4.0.c:0 "Que decidan los sacerdotes."
ev7.4.0.d:0 "Conozco un hechizo de atadura que puede ayudar."
ev7.6.title:0 "Erupción mágica"
ev7.6.desc:0 "Sientes una oleada de poder en tu interior que exige ser liberada. Lo único que puedes hacer es dirigir el estallido..."
ev7.6.0.a:0 "No puedo... detener... esto..."
ev7.6.0.b:0 "¡Ya llega...!"
ev7.6.0.c:0 "Apuntaré... allí..."
ev7.7.desc:0 "Sientes en tu interior un poder que no encuentra salida. El dolor aumenta a cada instante; ves destellos de luz a tu alrededor y descargas de energía mágica. No sabes qué hacer. Te sientes perdido."
ev7.7.0.a:0 "¡[resper.GetTitledFirstName], ayúdame!"
ev7.7.0.b:0 "¡No quiero morir así!"
ev7.7.0.a_ct:0 "Puede producirse una erupción mágica."
ev7.8.desc:0 "Oyes gritos que resuenan por el castillo. Alguien grita tu nombre y te conduce hasta [mchild.GetTitledFirstName]. A su alrededor, los objetos flotan en el aire y la luz parpadea sin control. La intensidad aumenta por momentos y percibes que algo terrible está a punto de suceder."
ev7.8.0.a:0 "¡Intentaré calmar a [mchild.GetHerHim]!"
ev7.8.0.b:0 "¡Saldré corriendo!"
ev7.8.0.c:0 "¿Quizá haya una forma?"
ev7.8.0.d:0 "Sé cómo hacerlo; saldremos adelante juntos."
ev7.8.0.e:0 "Solo dame ese poder."
ev7.8.0.f:0 "Te mostraré cómo controlarlo."
ev7.8.0.g:0 "Te daré parte de mi esencia."
ev7.8.0.g_ct:0 "En el futuro podría convertirse en un demonio."
meruption_avoided:0 "Se evitó una erupción mágica."
ev7.9.desc:0 "De pronto te ves desbordado por el poder. La magia intenta escapar por tus ojos y tu boca en forma de torrentes de luz cegadora, y sientes un dolor que te impide pensar. El poder te eleva del suelo: estás a punto de estallar..."
ev7.9.0.a:0 "¡Puedo soportarlo!"
ev7.10.desc:0 "Entras en la estancia de [mchild.GetTitledFirstName] y le ves suspendido en el aire, arqueado, con chorros de luz brotando de sus ojos y de su boca. Oyes un zumbido creciente en tus oídos y sientes que el poder está a punto de desatarse. Debes hacer algo..."
ev7.11.desc:0 "Sientes que una oleada de poder se te echa encima y quizá no puedas soportarla. Descargas de energía mágica estallan a tu alrededor, el aire se vuelve abrasador y los objetos empiezan a levitar. Se avecina una erupción mágica."
ev7.11.0.a:0 "Sé cómo encargarme de esto."
magic_resonance:0 "Resonancia mágica"
ev7.11.0.b:0 "Estabilizaré mi fuente."
ev7.11.0.c:0 "Usaré pociones para sofocarlo."
ev7.11.0.d:0 "Debo dominar este poder cueste lo que cueste."
ev7.11.0.d_ct:0 "¿Quién sabe qué podría ocurrir?"
ev7.11.0.d_title:0 "La fuente se ha estabilizado."
ev7.11.0.e:0 "Dios me protegerá."
source4_terrain_cancel_negative_supply:0 "Probabilidad de #N [magic_eruption|E]#!"
source4B_terrain_cancel_negative_supply:0 "Permite la [interaction|E] #italic Usar magia en bruto#!"
reduce_eruption_terrain_cancel_negative_supply:0 "Reduce la probabilidad de #N [magic_eruption|E]#! en fuentes inestables"
game_concept_magic_eruption:0 "Erupción mágica"
game_concept_magic_eruption_desc:0 "Los personajes saturados de energía mágica inestable pueden sufrir una erupción mágica: una descarga descontrolada de poder. Este fenómeno suele manifestarse como una explosión mágica capaz de matar a cualquiera que se encuentre cerca. Los personajes versados en magia, o guiados por una bruja competente, tienen menos probabilidades de sufrirlo."
use_raw_magic:0 "Usar magia en bruto"
use_raw_magic_desc:0 "Intenta influir en otro personaje con tu poder mágico innato."
use_raw_magic_ct0:0 "#N Usar poder en bruto puede ser peligroso.#!"
use_raw_magic_ct1:0 "Se aplicará un efecto mágico aleatorio."
ev7.12.title:0 "Magia en bruto"
ev7.12.desc:0 "Has conseguido enviar un impulso mágico que se ha adherido al aura de [recipient.GetTitledFirstName]. Tienes la corazonada de que podría perjudicarle de algún modo."
ev7.12.0.a:0 "Estupendo."
ev7.12.0.b:0 "Intentaré amplificar esta magia."
ev7.12.0.c:0 "No, no... ¡No quiero hacer nada malo!"
ev7.13.desc1:0 "Has intentado usar el poder, pero solo has logrado provocar un pequeño incendio en tus aposentos. Por suerte, los sirvientes lo apagaron enseguida..."
ev7.13.desc2:0 "Por desgracia, tu intento de emplear el poder ha fracasado. Hoy la magia no quiere escucharte."
ev7.13.desc3:0 "Como resultado de tu poder, uno de los muebles de tu aposento se elevó en el aire, pero al cabo de un momento cayó sin causar daño. Desde luego, esto no ha afectado a [recipient.GetTitledFirstName]..."
ev7.14.desc:0 "Has usado tu poder contra [recipient.GetTitledFirstName] y, aunque no puedes ver los efectos, sientes que algo ha cambiado."
ev7.15.desc:0 "Sientes que el poder toma forma en tus manos. ¿Cómo quieres usarlo?"
ev7.15.0.a:0 "Probablemente no sea buena idea."
ev7.15.0.b:0 "Obedéceme."
ev7.15.0.c:0 "Tienes que agradarme."
bewitched_opinion:0 "Hechizado"
ev7.15.0.d:0 "Muéstrame tus secretos."
ev7.15.0.e:0 "Vamos a charlar... dentro de tu mente."
ev7.15.0.f:0 "¡Será divertido!"
ev7.15.0.g:0 "[recipient.GetSheHe|U] nunca sabrá que fui yo."
terrible_stench:0 "Hedor terrible"
ev7.16.desc:0 "Intentas usar la magia, pero descubres que hay demasiada, que es demasiado poderosa. El poder empieza a desbordarse y tratas desesperadamente de hacer algo antes de que se produzca una erupción mágica..."
ev7.16.0.a:0 "Tengo que contenerla."
ev7.16.0.b:0 "¡La dominaré!"
ev92.1.title:0 "Corona misteriosa"
ev92.1.desc:0 "Ha llegado un paquete anónimo: un cofrecillo que escondía una corona misteriosa. No tienes idea de quién pudo enviártelo."
crown_shadows:0 "Corona de las Sombras"
crown_shadows_desc:0 "Esta corona inquietante parece atraer las sombras y confundir a quienes la miran durante demasiado tiempo. Hay algo extraño en ella, algo autoritario y esquivo."
crown1_terrain_cancel_negative_supply:0 "Desbloquea el hechizo #italic Paso sombrío#! para magos"
crown2_terrain_cancel_negative_supply:0 "Desbloquea Corrupción [scheme|E]"
crown3_terrain_cancel_negative_supply:0 "#italic Paso sombrío#! se refuerza"
crown4_terrain_cancel_negative_supply:0 "Desbloquea la [court_position|E] de Campeón Oscuro"
start_corruption_interaction:0 "Corrupción #weak (Complot)#!"
start_corruption_interaction_notification:0 "Corrupción"
scheme_interaction_tt_corruption_approved:0 "Intentar corromper a [recipient.GetShortUINameNoTooltip]"
trait_corrupted:0 "Corrupto"
trait_corrupted_desc:0 "Según los rumores, esta persona ha firmado un pacto con un demonio o ha sido tocada de algún otro modo por poderes oscuros. Sea cierto o no, los demás se sienten incómodos en su presencia."
corruption:0 "Corrupción"
corruption_action:0 "Corromper"
corruption_desc:0 "$corruption_desc_general$"
corruption_desc_general:0 "La corrupción es un [hostile_scheme|E] cuyo objetivo es corromper o influir en la víctima."
corruption_successful_roll_tt:0 "¡[target.GetShortUIName] se corrompe!"
corruption_become_discovered_roll_tt:0 "#N Se descubre mi implicación#!"
CORRUPTION_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] se corrompe"
CORRUPTION_DISCOVERY_DESC:0 "No quedas expuesto por la corrupción"
