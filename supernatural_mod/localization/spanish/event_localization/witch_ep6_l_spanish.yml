court_position_demon_trait:0 "[GetTrait('demon').GetName( ROOT.Char )]"
dark_champion_court_position:0 "Campeón oscuro"
dark_champion_court_position_desc:0 "Los hechiceros malvados suelen reclutar caballeros caídos, cortesanos corruptos o magos menos experimentados como agentes personales. El más fiable y despiadado de entre ellos puede convertirse en un Campeón Oscuro: un comandante militar ideal, un servidor siniestro o simplemente el ejecutor de los trabajos más sucios de su señor."
dark_champion_special_tasks:0 "Misión especial"
dark_champion_special_tasks_desc:0 "El Campeón Oscuro permanecerá alerta para emprender misiones especiales de sabotaje o asesinato contra un objetivo designado."
dark_champion_training:0 "Entrenamiento constante"
dark_champion_training_desc:0 "El Campeón Oscuro se centrará en desarrollar sus propias habilidades, establecer nuevos contactos y reunir recursos útiles para sus cometidos."
dark_champion_domain_supervision:0 "Supervisión del dominio"
dark_champion_domain_supervision_desc:0 "El Campeón Oscuro se ocupará de los habitantes conflictivos de las villas, de los colonos y de los nobles menores, así como de los problemas de seguridad en tu dominio."
dark_champion_train_terrain_cancel_negative_supply:0 "Tu Campeón Oscuro puede mejorar sus habilidades o adquirir nuevos rasgos"
dark_champion_special_terrain_cancel_negative_supply:0 "Desbloquea Misión especial [interaction|E]"
special_champion_mission:0 "Misión especial"
special_champion_mission_failure:0 "Misión especial - Fracaso"
special_champion_mission_success:0 "Misión especial - Éxito"
special_champion_mission_desc:0 "Envía a tu Campeón Oscuro a una misión secreta."
DARK_CHAMPION_IS_ON_MISSION:0 "Tu Campeón Oscuro ya está en una misión."
DARK_CHAMPION_ONLY_DURING_PEACE:0 "Tu Campeón Oscuro está ocupado con asuntos de guerra."
special_champion_mission_o1a:0 "Tu Campeón Oscuro iniciará un plan de asesinato o actuará directamente contra el objetivo."
special_champion_mission_o1b:0 "Puede ser asesinado."
special_champion_mission_option_title:0 "Seleccionar tarea"
special_champion_mission_o1:0 "Asesinato"
special_champion_mission_o2:0 "Saqueo de aldeas"
special_champion_mission_o2a:0 "Tu Campeón Oscuro reunirá un grupo para saquear el dominio del objetivo."
special_champion_mission_o2b:0 "El dominio quedará sumido en el caos."
special_champion_mission_o3:0 "Secuestro"
special_champion_mission_o3a:0 "Tu Campeón Oscuro intentará secuestrar al objetivo."
special_champion_mission_o3b:0 "Puede ser secuestrado."
special_champion_mission_o4:0 "Misión de rescate"
special_champion_mission_o4a:0 "Tu Campeón Oscuro partirá en una misión de rescate."
special_champion_mission_o4b:0 "Puede ser liberado."
ev7.31.desc:0 "Tu señor te ha llamado hoy para asignarte una misión especial. Tu objetivo es [recipient.GetTitledFirstName]."
ev7.31.desc1:0 "\n[recipient.GetSheHe|U] debe morir."
ev7.31.desc2:0 "\nToma a unos pocos hombres de confianza y saquea sus aldeas, una tras otra."
ev7.31.desc3:0 "\nDebes capturarlo a cualquier precio. Quiero verlo en mis mazmorras."
ev7.31.desc4:0 "\nDebes organizar una operación de rescate para liberarlo."
ev7.31.descX:0 "Tienes total libertad para completar la tarea."
ev7.31.0.a:0 "Como deseéis, mi [actor.GetLadyLord]."
ev7.32.desc:0 "Tras unos días de preparación, has logrado perfilar tu siguiente movimiento respecto a [recipient.GetTitledFirstName]."
ev7.32.0.a:0 "Lo desafiaré a un duelo."
ev7.32.0.a_ct:0 "Enviarás una invitación para un duelo."
ev7.32.0.b:0 "Lo haré con sutileza."
ev7.32.0.c:0 "Lideraré el escuadrón de la muerte."
ev7.32.0.c_ct:0 "Prepararás al grupo de ataque para un asalto nocturno."
ev7.32.0.d:0 "Vamos a saquear."
ev7.32.0.d_ct:0 "Te pondrás al frente del equipo para sembrar el caos en los dominios del objetivo."
ev7.32.0.e:0 "Es hora de cazar."
ev7.32.0.e_ct:0 "Estás preparando un plan para secuestrar al objetivo."
ev7.32.0.f:0 "Necesito prepararme."
ev7.32.0.f_ct:0 "Prepararás un plan para liberar al objetivo."
ev7.32.0.g:0 "Esta tarea me supera; la abandono."
ev7.32.0.g_ct:0 "Tu superior considerará tu petición."
ev7.32.0.h:0 "Primero pediré fondos adicionales."
ev7.32.0.h_ct:0 "Prepararás un plan para liberar al objetivo."
ev7.33.desc:0 "Tu Campeón Oscuro ha caído mientras cumplía su misión. Esto podría retrasar tus planes."
ev7.33.0.a:0 "Parece que necesitaré un nuevo sirviente."
special_mission_dco_ends_ct:0 "La misión especial ha sido abortada."
special_mission_dco_ends_ct2:0 "Misión especial cumplida."
ev7.34.desc:0 "Tu Campeón Oscuro informa de que la persona señalada ha muerto."
ev7.34.0.a:0 "Que [dchampion.GetHerHim] espere nuevas órdenes."
ev7.35.desc:0 "Te ha llegado la noticia de que tu Campeón Oscuro ha sido encarcelado. En estas circunstancias, no puedes esperar que continúe con su misión."
ev7.35.0.a:0 "Es un contratiempo."
ev7.37.desc:0 "Tu Campeón Oscuro ha regresado con buenas noticias: su misión se ha cumplido y [recipient.GetTitledFirstName] ha muerto a manos suyas."
ev7.38.desc:0 "Tu señor recibió con agrado las noticias sobre el resultado de tu misión. Sin embargo, [dchampion.GetSheHe] te hizo saber que aún queda mucho por hacer y que pronto podrías recibir nuevas órdenes."
ev7.38.0.a:0 "Vivo para servir."
ev7.40.desc:0 "[dchampion.GetTitledFirstName] te ha desafiado a un duelo a muerte. Sus motivos no están claros, pero tu respuesta debería ser tajante."
ev7.40.0.a:0 "¿Espadas o hachas?"
ev7.40.0.b:0 "No tengo motivo para luchar contra [dchampion.GetHerHim]."
ev7.40.0.b_ct:0 "Rechazas el desafío a duelo."
ev7.41.desc:0 "Has recibido la respuesta de [recipient.GetTitledFirstName]: [recipient.GetSheHe] no luchará contra ti. Está claro que [recipient.GetSheHe|U] tiene miedo..."
ev7.41.0.a:0 "Diré a mi señor que necesito más tiempo."
ev7.41.0.b:0 "Se me ocurrirá otro plan."
ev7.42.desc:0 "'Mi [actor.GetLadyLord], he desafiado a [recipient.GetTitledFirstName] a un duelo a muerte, pero ese cobarde se negó. Necesito más tiempo para completar la tarea.'"
ev7.42.0.a:0 "¿Excusas...? ¡Acaba con [recipient.GetHerHim] de una vez!"
ev7.42.0.b:0 "Quiero verlo muerto; hazlo."
ev7.42.0.c:0 "Ya veo, continúa."
ev7.42.0.d:0 "Cambio de planes; tengo otras órdenes para ti."
ev7.43.desc:0 "Tu señor te ha enviado un mensaje: debes abortar la misión de inmediato. Pronto recibirás nuevas órdenes."
ev7.45.desc:0 "Tu Campeón Oscuro informa de que [dchampion.GetSheHe] ha encontrado algunos problemas durante su misión. [dchampion.GetSheHe|U] necesita más tiempo."
ev7.45.0.a:0 "Más le vale ponerse a trabajar."
ev7.45.0.b:0 "O [dchampion.GetSheHe] termina la tarea, o terminaré con [dchampion.GetHerHim]."
ev7.45.0.c:0 "Ya basta; prepararé otro encargo para ti."
ev7.45.0.d:0 "Esta es la última vez que me fallas."
ev7.45.0.d_ct:0 "Estás lanzando un Golpe de poder."
ev7.46.desc:0 "Necesitas gente: guerreros competentes y asesinos capaces de alcanzar sus objetivos sin ser detectados y eliminar guardias en silencio."
ev7.46.0.a:0 "No necesito demasiado apoyo."
ev7.46.0.b:0 "Contratar mercenarios."
ev7.46.0.b_ct:0 "Tu operación aumentará las probabilidades de éxito."
ev7.46.0.c:0 "Reclutaré a los mejores."
ev7.46.0.c_ct:0 "Tu operación aumentará #P notablemente#! las probabilidades de éxito."
ev7.46.0.d:0 "Conozco a unas cuantas personas adecuadas."
ev7.47.desc:0 "Para trazar un plan de ataque necesitas más información. Tus espías deberían infiltrarse en el lugar objetivo y en sus alrededores."
ev7.47.0.a:0 "Enviaré a mis mejores hombres."
ev7.47.0.b:0 "Mis espías ya están dentro."
ev7.47.0.c:0 "Un soborno debería ayudar."
ev7.47.0.d:0 "No hay tiempo para reunir más información."
ev7.48.desc:0 "Es hora de desarrollar la fase final del plan. La estrategia adecuada me permitirá asegurar la zona, eliminar al objetivo y retirarme antes de que pueda organizarse cualquier defensa."
ev7.48.0.a:0 "Debemos evitar activar la alarma a toda costa."
ev7.48.0.b:0 "El Equipo Rojo atacará desde el este cuando el Equipo Azul despeje las murallas."
ev7.48.0.c:0 "Mi espía distraerá a los guardias."
ev7.48.0.d:0 "La fuerza bruta es todo lo que necesitamos."
ev7.49.title:0 "Asalto nocturno"
ev7.49.desc:0 "En mitad de la noche te despiertan unos gritos. Sales corriendo de tu alcoba y te das cuenta de que el castillo ha sido atacado. Intentas encontrar una vía de escape, pero oyes sonidos de batalla por todas partes."
ev7.49.0.a:0 "¡Tenemos que rechazarlos!"
ev7.49.0.b:0 "Serán destruidos."
ev7.49.0.c:0 "Les demostraré que no merece la pena buscar pelea con un mago."
ev7.50.desc:0 "Lideraste a tus hombres, pero desde el principio nada salió según lo previsto. Se desató una batalla feroz, con más y más guardias llegando a cada instante. No te quedó más opción que retirarte."
ev7.50.0.a:0 "¡Retirada!"
ev7.51.desc:0 "Los atacantes fueron aplastados, aunque algunos lograron escapar. Has averiguado que estaban dirigidos por [dchampion.GetTitledFirstName] y, por las palabras de los cautivos, todo indica que tú eras el objetivo de este asalto."
ev7.51.1.a:0 "[dchampion.GetSheHe|U] pagará por ello."
ev7.52.desc:0 "Irrumpiste en el castillo donde se ocultaba tu objetivo. Los guardias fueron cogidos completamente por sorpresa y lograste derrotarlos casi sin sufrir bajas. Sin demasiada dificultad, alcanzaste a [recipient.GetTitledFirstName], que ahora está a tu merced."
ev7.52.0.a:0 "[actor.GetTitledFirstName] te envía sus saludos."
ev7.53.desc:0 "Tú y tus hombres atacasteis una aldea perteneciente a [recipient.GetTitledFirstName]. Sus habitantes fueron exterminados y todo el asentamiento ardió en llamas. También conseguiste saquear algunos bienes."
ev7.53.0.a:0 "Esto no ha hecho más que empezar."
ev7.54.desc:0 "[dchampion.GetTitledFirstName], tu Campeón Oscuro, condujo a una pequeña escuadra hasta una de las aldeas de [recipient.GetTitledFirstName]. El asentamiento fue reducido a cenizas y sus habitantes, pasados a cuchillo, todo ello siguiendo tus órdenes."
ev7.54.0.a_ct:0 "Tu Campeón Oscuro continuará la tarea."
ev7.55.desc:0 "Ha llegado a tus oídos que una de tus aldeas fue saqueada y destruida recientemente por bandidos. Es un asunto que debe resolverse."
ev7.55.0.a:0 "Destinaré guardias a esta tarea."
ev7.55.0.b:0 "Mis caballeros se encargarán de ello."
ev7.55.0.b_ct:0 "Tus caballeros saldrán tras los bandidos."
ev7.55.0.c:0 "Pondré una recompensa por sus cabezas."
ev7.56.desc:0 "En respuesta a los ataques de tu Campeón Oscuro, [recipient.GetTitledFirstName] decidió enviar guardias para interceptar a [dchampion.GetHerHim]. Esto debilitará su protección personal."
ev7.56.0.a:0 "Excelente, misión cumplida."
ev7.56.0.b:0 "Creo que unas cuantas aldeas más deberían arder."
ev7.57.desc:0 "Te estás convirtiendo lentamente en el terror del reino de [recipient.GetTitledFirstName]. Tus hombres arrasan más aldeas y caravanas, y a su paso solo dejan ruinas y árboles llenos de cadáveres. El único problema es que [recipient.GetTitledFirstName] casi seguro ya sabe que tú estás detrás de todo."
ev7.57.0.a:0 "Informaré a mi señor de mis progresos."
ev7.58.desc:0 "Tu Campeón Oscuro ha sumido el reino de [recipient.GetTitledFirstName] en el caos. La muerte y el fuego son ahora el pan de cada día allí. Estos ataques también han causado problemas económicos a [recipient.GetHerHim]."
ev7.59.desc:0 "Tu reino está siendo devastado por una tropa desconocida. Actúan con demasiada ferocidad y están demasiado bien organizados para ser simples bandidos. Tus espías informan de que están dirigidos por [dchampion.GetTitledFirstName]. [dchampion.GetSheHe|U] es responsable de los numerosos saqueos y de la destrucción que está llevando tu reino a la ruina."
ev7.59.0.a:0 "Quiero su cabeza."
ev7.59.0.b:0 "No actuaré con precipitación."
magic_epic_cooldown_terrain_advantage:0 "Tiempo de reutilización de la investigación mágica (en años)"
hells_scepter4_terrain_advantage:0 "Tiempo de reutilización de Invocar ejército demoníaco (en años)"
NOT_CHARACTER_ARE_IS_INCAPABLE:0 "No es incapaz"
ev7.60.desc:0 "El momento oportuno y la elección del modo de actuar son cruciales. Debes tener en cuenta varios factores y considerar la posibilidad de recurrir a un enfoque más sutil."
ev7.60.0.a:0 "Usaré una estratagema."
ev7.60.0.b:0 "No seremos discretos; seremos rápidos y decisivos."
ev7.60.0.a_ct:0 "Has trazado un buen plan."
ev7.60.1.a_ct:0 "Tu plan tiene fallos graves."
ev7.61.desc:0 "Estás listo para comenzar la operación. Si todo va bien, interceptarás a [recipient.GetTitledFirstName] esta noche. Sin duda, tu señor estará complacido..."
ev7.61.0.a:0 "¡Que empiece el espectáculo!"
ev7.62.desc:0 "Un estruendo en tu puerta te despertó. Antes de que pudieras hacer nada, la echaron abajo y varias personas armadas irrumpieron en la estancia. No traen buenas intenciones, aunque parece que quieren capturarte con vida."
ev7.62.0.a:0 "¡Guardias! ¡Estoy bajo ataque!"
ev7.62.0.b:0 "¡Me defenderé!"
ev7.63.desc:0 "Tu intento de interceptar a [recipient.GetTitledFirstName] terminó en un fracaso espectacular. Todo salió en contra del plan y apenas lograste escapar con vida. Peor aún: ahora tienes que informar de esto a tu señor..."
ev7.64.desc:0 "Tu intento de interceptar a [recipient.GetTitledFirstName] tuvo éxito; todo salió según lo previsto. Lograste retirarte sin peligro antes de que se armase un gran alboroto. Misión cumplida."
ev7.64.0.a:0 "Esperaré nuevas órdenes."
ev7.65.desc:0 "Tu Campeón Oscuro ha llegado. [dchampion.GetSheHe|U] informa de que la misión especial ha fracasado. [dchampion.GetSheHe|U] no pudo hacer nada contra [recipient.GetTitledFirstName]."
ev7.65.0.a:0 "¡Eres un fracaso! ¡Fuera de mi vista!"
ev7.65.0.b:0 "Sufrirás las consecuencias."
ev7.66.desc:0 "Tu Campeón Oscuro ha llegado. [dchampion.GetSheHe|U] informa de que la misión especial se completó con éxito."
ev7.66.0.a:0 "Buen trabajo, mi Campeón Oscuro."
ev7.66.0.b:0 "Estupendo. Encierra a [recipient.GetHerHim] en una celda."
ev7.67.desc:0 "Tu grupo se ha internado en la zona del castillo donde [recipient.GetTitledFirstName] está encarcelado. Los guardias parecen perezosos y somnolientos, pero cualquier error podría alertarlos."
ev7.67.0.a:0 "Actuamos según el plan."
ev7.67.0.b:0 "Primero vamos a distraerlos."
ev7.67.0.a_ct:0 "La operación ha fracasado."
ev7.68.desc:0 "Te despertó en mitad de la noche [dchampion.GetTitledFirstName]. [dchampion.GetSheHe|U] y su grupo han venido a liberarte. Han conseguido apaciguar a los guardias, pero debéis daros prisa..."
ev7.68.0.a:0 "¿Soy libre?"
ev7.69.desc:0 "Tu Campeón Oscuro ha acudido a ti con una petición. [dchampion.GetSheHe|U] te pide fondos adicionales para una misión especial que está llevando a cabo en tu nombre."
ev7.69.0.a:0 "¿Está bromeando [dchampion.GetSheHe]?"
ev7.69.0.a_ct:0 "Tu petición ha sido denegada."
IS_YOUR_MMINION:0 "Es tu esbirro"
ev7.70.desc:0 "Sientes cómo [target.GetTitledFirstName] va quedando poco a poco atrapado por tu magia. No sabes si llegarás a controlarlo por completo, pero la corrupción ya lo ha tocado. Sientes que puedes orientar sutilmente ese proceso."
ev7.70.0.a:0 "Dejaré una marca en su cuerpo."
ev7.70.0.b:0 "Debilitaré su mente."
ev7.70.0.b_ct:0 "Pesadillas"
ev7.70.0.c:0 "Que una bendición oscura descienda sobre [target.GetHerHim]."
ev7.70.0.d:0 "Despertaré el potencial de [target.GetHerHim]."
ev7.70.0.e:0 "Haré un experimento."
ev7.70.0.f:0 "De hecho, podría fortalecer a [target.GetHerHim]."
ev7.71.desc:0 "Tu eficacia y tu poder aumentan de forma constante, y con ello también tu comprensión de las debilidades y flaquezas humanas. Pero, cuando diriges a los mortales, pueden alcanzar su verdadero potencial... o hundirse hasta el fondo."
ev7.71.0.a:0 "Los mortales son fascinantes."
ev7.72.title:0 "Entrenamiento del Campeón oscuro"
ev7.72.0.a_ct:0 "El Campeón Oscuro gana habilidades"
ev7.73.desc:0 "Tu Campeón Oscuro entrena con ahínco para convertirse en el mayor de tus servidores. Aun así, conviene orientar sus pasos para que sus habilidades encajen con tus objetivos."
ev7.73.0.a:0 "Necesito un comandante experto."
ev7.73.0.b:0 "Necesito una herramienta discreta."
ev7.74.0.a:0 "[dchampion.GetSheHe|U] debe convertirse en un luchador competente."
ev7.74.0.b:0 "Estimularé su creatividad."
ev7.74.0.c:0 "[dchampion.GetSheHe|U] debe demostrar su valía en el campo de batalla."
ev7.74.0.d:0 "Álzate, mi campeón."
trait_track_demonology:0 "Demonología"
trait_track_demonology_desc:0 "Invocar y controlar demonios requiere gran habilidad, pero los beneficios potenciales son aún mayores."
ev6.5.desc2:0 "Gracias a tu dominio de la demonología, casi cualquier demonio puede responder a tu llamada. Puedes invocar a un tipo específico de demonio, o llamar por su nombre a uno que ya hayas conocido."
blackgrimoire_demonology_terrain_advantage:0 "Ganancia de EXP de demonología para magos"
summoning_demonology_terrain_cancel_negative_supply:0 "Reduce la probabilidad de complicaciones durante la invocación"
summoning_demonology2_terrain_cancel_negative_supply:0 "Invocar demonios no aumenta el estrés"
summoning_demonology3_terrain_cancel_negative_supply:0 "Desbloquea el hechizo #italic Desterrar demonio#!"
witchcraft_legacy_3_ct:0 "Los nuevos magos recibirán #P 10#! puntos de Conocimiento secreto como bonificación inicial"
hells_scepter4_terrain_cancel_negative_supply:0 "Puede reclutar demonios durante la invocación"
ev15.0.e:0 "Me servirás."
ev2.11.d2:0 "¡Simplemente usaré un hechizo de destierro, bastardo!"
ev3.6.c2:0 "¿Y por qué no iba a usar mis hechizos para desterrarte?"
additional_sc_for_mage_ct:0 "Recibirás #P 5#! puntos de Conocimiento secreto al convertirte en mago."
ev7.75.title:0 "Magia y moralidad"
ev7.75.desc:0 "Tu comprensión de las leyes de la magia se profundiza sin cesar; sin embargo, algunas de tus observaciones resultan inquietantes. Usar poderes mágicos tiene un precio, y a menudo obliga a los magos a actuar contra las leyes de Dios. ¿Significa eso que la brujería es obra de Satanás? ¿Solo la gente malvada puede convertirse en maga?"
ev7.75.0.a:0 "Dejaré eso en manos de filósofos y teólogos."
ev7.75.0.b:0 "Si existe, es porque Dios lo permite."
ev7.75.0.c:0 "El fin justifica los medios."
ev7.75.0.d:0 "¿Y qué?"
ev7.75.0.e:0 "El bien y el mal son solo conceptos filosóficos."
ev7.75.0.f:0 "Encontraré la forma de obrar bien."
ev7.75.0.f_ct:0 "La [decision|E] #italic Realizar un ritual mágico#! queda desactivada permanentemente."
ev7.75.0.f_ct2:0 "La [decision|E] #italic Celebrar comunión mística#! puede restaurar la saturación de poder."
ev7.75.0.g:0 "Soy el villano de esta historia."
ev7.75.0.h:0 "La magia es una bendición de [ROOT.Char.GetFaith.WitchGodName]."
plague_spell_ct2:0 "La plaga comenzará."
mages_summit:0 "Cumbre de Magos"
mages_summit_host_an_a:0 "una"
mages_summit_desc:0 "Magos y brujas de todo el mundo se reunirán aquí para deliberar."
MAY_CALL_MAGE_SUMMIT:0 "Debes tener un nivel de fama elevado o ser un mago legendario."
mages_summit_host_desc:0 "$BULLET_WITH_TAB$Los participantes pueden ganar [prestige|E]\n$BULLET_WITH_TAB$Los participantes pueden adquirir conocimientos y habilidades\n$BULLET_WITH_TAB$Puede dar lugar a un duelo de magos\n$BULLET_WITH_TAB$Los participantes asistirán a un consejo de magos"
mages_summit_guest_desc:0 "$BULLET_WITH_TAB$Los participantes pueden ganar [prestige|E]\n$BULLET_WITH_TAB$Los participantes pueden adquirir conocimientos y habilidades\n$BULLET_WITH_TAB$Puede dar lugar a un duelo de magos\n$BULLET_WITH_TAB$Los participantes asistirán a un consejo de magos"
mages_summit_province_desc:0 "Este es un lugar apropiado para celebrar la Cumbre de Magos."
mages_summit_destination_selection:0 ""
mages_summit_selection_tooltip:0 "Convoca un consejo de magos."
mages_summit_guest_help_text:0 "Desde luego, los magos deberían ser invitados, pero quizá también convenga que asistan algunas otras brujas."
activity_invite_rule_mages:0 "Usuarios de magia poderosos"
activity_invite_rule_true_witches:0 "Brujas verdaderas"
activity_invite_rule_other_magic:0 "'Magos' de la corte y otros teóricos"
mages_summit_conclusion_desc:0 "La [GetActivityType( 'mages_summit' ).GetName] ha concluido"
sharing_knowledge_intent:0 "Compartir conocimiento"
sharing_knowledge_intent_desc:0 "Céntrate en compartir conocimiento e información sobre magia. Busca alianzas, mentores o discípulos."
political_matters_intent:0 "Asuntos diplomáticos"
political_matters_intent_desc:0 "Intenta ampliar tu influencia, obtener ganchos y conocer a posibles aliados."
show_superiority_intent:0 "Mostrar superioridad"
show_superiority_intent_desc:0 "Eres el mago más poderoso del mundo y los demás deben aceptarlo. Encuentra una forma de demostrarles tu poder y tu genialidad."
prelude_phase:0 "Banquete"
prelude_phase_desc:0 "Es una oportunidad para hablar y relajarse un poco."
meeting_phase:0 "Consejo de Magos"
meeting_phase_desc:0 "La parte oficial de la Cumbre de Magos."
options_security:0 "Medidas de seguridad"
options_security_desc:0 "Un evento como este debería contar con medidas de seguridad reforzadas."
option_security_1:0 "Mínimas"
option_security_1_desc:0 "Tus guardias deberían bastar."
option_security_2:0 "Extraordinarias"
option_security_2_desc:0 "Deberían reclutarse guardias adicionales, incluidas brujas cualificadas y matones; por supuesto, tendrán que ser hombres de confianza."
funds_for_searching_options:0 "Fondos para la búsqueda"
funds_for_searching_options_desc:0 "Invertir más oro puede proporcionar información adicional."
funds_for_searching_option1:0 "Opción económica"
funds_for_searching_option1_desc:0 "Sin financiación adicional."
funds_for_searching_option2:0 "Financiación ampliada"
funds_for_searching_option2_desc:0 "Recibes progreso adicional como bonificación inicial."
ev7.76.desc:0 "Comienza la parte menos oficial de la reunión. Los invitados pueden conversar un poco y relajarse tras el viaje. Muchos han venido con todo su séquito, y el castillo está repleto de gente. No se trata solo de usuarios de magia y sus acompañantes, sino también de brujas corrientes y místicos con distintos niveles de iniciación, aunque probablemente no todos merezcan contarse entre los verdaderos magos."
ev7.76.a:0 "Todos los interesados son bienvenidos."
ev7.76.b:0 "Los banquetes y el entretenimiento ocultarán la verdadera naturaleza de esta reunión."
ev7.76.c:0 "Que los guardias comprueben que todo el mundo tiene invitación."
ev7.76.c_ct:0 "Los invitados podrían reaccionar..."
ev7.77.desc:0 "Ves a tus guardias expulsando a un invitado no deseado. El hombre protesta, asegurando que es un alquimista respetado y que tiene derecho a estar aquí."
ev7.77.a:0 "Está bien, dejadlo quedarse."
ev7.77.b:0 "Solo los usuarios de magia tienen derecho a estar aquí."
ev7.77.c:0 "El lugar para gente como él está en las mazmorras."
ev7.77.d:0 "De hecho, podríamos empezar el banquete con una tortura pública."
ev7.78.desc:0 "Cuando los guardias empezaron a comprobar a los invitados, uno de ellos echó a correr y logró herir a dos antes de ser capturado. Es un cazador de brujas..."
ev7.78.a:0 "Arrestad a [whunter0.GetHerHim]."
ev7.78.b:0 "Así que empezaremos con la ejecución."
ev7.79.desc:0 "Ves que los guardias han llevado a un hombre, probablemente uno de los invitados, ante [aowner.GetTitledFirstName]. A tu alrededor oyes susurros: al parecer se trata de un cazador de brujas que consiguió colarse aquí. Al cabo de un momento, [aowner.GetTitledFirstName] murmuró algo y un torrente de poder salió disparado de su mano, abrasando al cazador. Algunos invitados rompieron a aplaudir, mientras otros contemplaban la escena con miedo."
ev7.79.a:0 "¡Increíble!"
ev7.79.b:0 "Hasta aquí la inauguración oficial."
ev7.79.c:0 "Eso es terrible..."
ev7.80.a:0 "Voy a divertirme un poco."
ev7.80.b:0 "Esperaba mejor compañía."
ev7.80.c:0 "Voy a echar un vistazo por aquí."
ev7.81.desc:0 "Te ha llegado la noticia de que [host.GetTitledFirstName] está organizando un gran acontecimiento: una cumbre de magos. Magos y brujas de todo el mundo acudirán para hablar de magia y de política. No puedes perderte un evento así."
ev7.81.a:0 "Lo pensaré."
ev7.81.a_ct:0 "Puedes asistir a la Cumbre de Magos."
ev7.82.title:0 "¿Un gran rito?"
ev7.82.desc:0 "En cierto momento, el capitán de la guardia informó de que estaba ocurriendo algo extraño bajo los muros del castillo. Cuando saliste a comprobarlo, descubriste que un grupo de brujas había decidido aprovechar la ocasión para celebrar un gran rito."
ev7.82.a:0 "¡Alabado sea [ROOT.Char.GetFaith.WitchGodName]!"
ev7.82.b:0 "¿Puedo unirme?"
ev7.82.c:0 "Necias primitivas; no volveré a invitarlas."
ev7.82.d:0 "Idiotas, atraerán a los cazadores de brujas. ¡Guardias!"
ev7.83.desc:0 "Ves que unas cuantas brujas se han reunido en torno a Baba Yaga para escuchar una historia. Decides acercarte y escuchar también lo que tiene que decir la vieja bruja."
ev7.83.desc2:0 "\n'...¿el Dios Cornudo? Sí, lo conocí una vez, hace mucho, cuando yo era una bruja novicia. Fue durante un gran rito. Mi aquelarre decidió hacer una ofrenda extraordinaria: el sacrificio de un ser humano. Me eligieron a mí. El Dios Cornudo apareció en persona y me llevó a su reino.'"
ev7.83.a:0 "¿Y qué venía después?"
ev7.84.desc:0 "'He conocido a muchos hombres malvados y a muchos demonios en mi vida, pero el Dios Cornudo es un auténtico monstruo. Han pasado años, y todavía sueño con lo que me hizo. Al final se cansó de mí y me devolvió a la tierra. Antes de eso, sin embargo, me reveló muchos secretos y me concedió su \"bendición\". A mi regreso, pude purgar el aquelarre y empezar de nuevo. Algún día volveré a encontrarme con el Dios Cornudo, y esta vez será él quien sufra. Estoy preparada para ello.'"
ev7.84.a:0 "Bueno... menuda historia."
ev7.84.b:0 "Yo he vivido aventuras parecidas..."
ev7.84.b_1:0 "Contó una buena historia."
ev7.84.b_2:0 "Tus alardes no impresionaron."
ms_guest_important_event:0 "Es un acontecimiento muy importante: $VALUE|=+0$"
ev7.85.title:0 "Fondo para combatir demonios"
ev7.85.desc:0 "Uno de los magos se te acerca; parece que tiene un asunto que tratar.\n'Los demonios se están convirtiendo en un problema cada vez mayor en todo el mundo. Por eso he decidido crear un Fondo para Combatir Demonios. Cualquiera puede aportar oro y financiar así la lucha contra ellos. El fondo también pagará recompensas a cualquiera que logre matar o desterrar a un demonio.'"
ev7.85.a:0 "Apoyo esta iniciativa."
ev7.85.a_ct:0 "Recibirás oro cada vez que mates a un demonio."
ev7.85.b:0 "¿Podrías contarme más sobre los demonios?"
ev7.85.c:0 "No me interesa."
ev7.85.d:0 "Como futuro archimago, debo involucrarme en esto."
ev7.85.d2:0 "Como archimago, debo involucrarme en esto."
ev7.85.e:0 "Una cosa por otra."
ev7.85.f:0 "Dirección equivocada."
ev7.85.f_ct:0 "Lanzarás al bastardo contra la pared."
ev7.87.title:0 "Magia en venta"
ev7.87.desc:0 "De pronto, uno de los invitados abre discretamente su abrigo ante ti y deja ver toda una colección de pociones y elixires variados. \"¿Te interesa?\", pregunta la bruja. \"Son mezclas auténticas, elaboradas por mí\"."
ev7.87.a:0 "¿Quizá tengas libros o pergaminos interesantes?"
ev7.87.b:0 "No, gracias."
ev7.88.title:0 "El peso de la fama"
ev7.88.desc:0 "Mientras te movías entre los invitados, dos jóvenes brujas te rodearon de pronto. Parece que están fascinadas por tener la oportunidad de conocer a un verdadero mago. Sientes que te concederían cualquier capricho."
ev7.88.a:0 "Creo que una de vosotras podría ser mi ayudante..."
ev7.88.b:0 "Señoras, dejad que os muestre la verdadera magia."
ev7.88.c:0 "Desde luego podéis hacerme un favor."
ev7.88.d:0 "¿Quién os ha dejado entrar? Este no es lugar para brujas corrientes."
ev7.89.title:0 "Nuevos conocimientos"
ev7.89.desc:0 "Escuchando conversaciones entre magos y brujas, aprendes muchas cosas nuevas. El mundo está lleno de misterios, y ahora conoces un poco más de ellos."
ev7.89.a:0 "Puedo aprovecharlo."
ev7.90.desc:0 "Una reunión de magos es un momento excelente para buscar un mentor. [actor.GetTitledFirstName] parece un candidato ideal como maestro. Sin embargo, ¿estará [actor.GetSheHe] dispuesto a compartir su conocimiento?"
ev7.90.a:0 "Después de todo, pagaré..."
ev7.90.a_ct:0 "El mago considerará tu propuesta."
ev7.90.b:0 "Quizá una suma mayor convenza a [actor.GetHerHim]."
ev7.90.c:0 "Si [actor.GetSheHe] acepta, cubriré [actor.GetHerHim] de oro."
ev7.91.desc:0 "Durante un banquete, [recipient.GetTitledFirstName] se te acerca. Parece querer aprender magia y te ve como su maestro. [recipient.GetSheHe|U] te ofrece mucho oro a cambio de que compartas con [recipient.GetHerHim] los secretos de la magia."
ev7.91.a:0 "Bien, [recipient.GetSheHe] se convertirá en mi discípulo."
ev7.91.a_ct:0 "Aceptas ser mentor."
ev7.91.a_ct2:0 "Empiezas a practicar magia."
ev7.91.b:0 "No, ya tengo demasiado trabajo."
ev7.91.c:0 "No veo potencial de aprendizaje aquí."
ev7.91.a_ct3:0 "El mago se ha negado."
ev7.92.desc:0 "Tú y algunos invitados organizasteis un debate sobre la teoría de la magia. Aprendisteis cosas nuevas y lograsteis contemplar las ya conocidas desde una perspectiva distinta."
ev7.92.a:0 "Ha sido un debate esclarecedor."
ev7.92.b:0 "Esta información también me será útil en otros asuntos."
ev7.93.title:0 "Charla informal"
ev7.93.desc:0 "Tú y [guest0.GetTitledFirstName] habéis mantenido una charla agradable. Cuando orientaste la conversación hacia asuntos políticos, resultó que ambos compartíais intereses comunes. Quizá podáis ayudaros mutuamente."
ev7.93.a:0 "Este es el comienzo de una cooperación fructífera."
ev7.93.b:0 "Deberíamos llegar a un acuerdo cuanto antes."
ev7.93.c:0 "Convenceré a [guest0.GetHerHim] de que me apoye."
ev7.94.title:0 "Está a punto de empezar..."
ev7.94.desc:0 "Entre los asistentes se perciben expectación e interés por la sesión que va a comenzar. Muchos se preguntan cuál será el tema principal de la reunión."
ev7.94.a:0 "Aseguraré a los asistentes que plantearé asuntos importantes."
ev7.94.b:0 "Aún tengo algo de tiempo para conseguir apoyos para mis propuestas."
gathered_supporters:0 "Partidarios reunidos"
ev7.94.c:0 "Difundiré algunos rumores."
ev7.94.d:0 "Es una oportunidad para hablar con [guest0.GetTitledFirstName]."
ev7.95.title:0 "Magia y política"
ev7.95.desc:0 "Te acercaste a un grupo de magos que estaba discutiendo de política y de la situación general del mundo. Parece que cada hechicero tiene sus propias ideas, pero aquí también están formándose facciones y grupos de intereses comunes."
ev7.95.a:0 "Tomaré partido."
ev7.95.b:0 "Me mantendré neutral."
ev7.95.c:0 "Los magos deberían unirse... bajo mi liderazgo."
ev7.95.d:0 "Usaré estas tensiones en mi propio beneficio."
ev7.95.e:0 "Puedo actuar como mediador si hace falta."
ev7.96.title:0 "Demostración de poder mágico"
ev7.96.desc:0 "Algunos de los invitados apenas poseen habilidades mágicas, mientras que los pocos que dominan de verdad la magia dudan de tus capacidades. Ha llegado el momento de mostrarles a todos tu verdadero poder."
ev7.96.a:0 "Es hora de una demostración de mis hechizos."
ev7.96.b:0 "Presentaré mi artefacto mágico."
ev7.96.c:0 "Les hablaré a todos de mis logros."
ev7.96.d:0 "La compañía de mis siervos no muertos bastará."
ev7.96.e:0 "Este no es el momento adecuado."
ev7.96.f:0 "Les mostraré de lo que es capaz un demonio."
ev7.97.desc:0 "Tu reputación podría crecer si derrotas a otro mago en un duelo ante todos. [mage0.GetTitledFirstName] parece un objetivo adecuado. Si [mage0.GetSheHe] se niega frente a tantos testigos, los demás magos dejarán de respetar a [mage0.GetHerHim]."
ev7.97.a:0 "Desafiaré a [mage0.GetHerHim]."
ev7.97.a_ct:0 "El mago responderá a tu desafío... o no."
ev7.97.b:0 "Empezaré a insultar a [mage0.GetHerHim]."
ev7.98.desc:0 "[challenger.GetTitledFirstName] ha decidido desafiarte. [challenger.GetSheHe|U] exige un duelo de magos, un combate a muerte. Si te niegas ante tantos testigos, tu reputación se resentirá."
ev7.98.a:0 "No creo estar para duelos hoy."
ev7.99.desc:0 "Hablas con uno de los invitados sobre demonios. En cierto momento, tu interlocutor bromea con que discutir el tema sería mucho más fácil si invocaras a un demonio. Claro que una invocación así, sin un círculo protector, sería muy arriesgada..."
ev7.99.a:0 "Puedo invocarlo y devolverlo de inmediato."
ev7.99.a_1:0 "Envías al demonio de vuelta justo después de invocarlo."
ev7.99.a_ct:0 "El demonio te atacará antes de que puedas devolverlo."
ev7.99.b:0 "Buena broma; me caes bien."
ev7.100.desc:0 "En cierto momento, un hombre se te acerca... no, ¡no es un hombre! Lo reconoces: es Mammon. Tiene un aspecto algo distinto, pero sin duda se trata de él.\n\"Algún necio me invocó\", declara el demonio. \"Lo perdoné para no arruinar tu fiesta. ¿Puedo unirme? Prometo comportarme\"."
ev7.100.a:0 "Claro, ¿qué podría salir mal?"
ev7.100.b:0 "Creo que te enviaré al infierno."
ev7.101.desc:0 "Comienza la parte oficial. Primero, la asamblea debe elegir al portavoz que dirigirá las deliberaciones."
ev7.101.a:0 "Por supuesto, me nominaré como candidato."
ev7.101.b:0 "Me pregunto quién será el portavoz."
ev7.101.b_ct:0 "No serás el portavoz"
ev7.101.c:0 "Parece que nadie me está teniendo en cuenta."
ev7.101.a_ct1:0 "Tienes una probabilidad #P alta#! de convertirte en portavoz."
ev7.101.a_ct2:0 "Tienes una probabilidad media de convertirte en portavoz."
ev7.101.a_ct3:0 "Tienes una probabilidad #N baja#! de convertirte en portavoz."
ev7.102.title:0 "El portavoz"
ev7.102.desc:0 "La asamblea te ha elegido como portavoz de esta cumbre. Es un gran honor y una gran responsabilidad."
ev7.102.a:0 "Declaro solemnemente abierta la reunión del consejo de magos."
ev7.102.b:0 "Este acontecimiento pasará a la historia."
ev7.103.desc:0 "La asamblea ha elegido a [speaker0.GetTitledFirstName] como portavoz. [speaker0.GetSheHe|U] será quien dirija la reunión del consejo de este año."
ev7.103.a:0 "Una elección interesante."
ev7.104.title:0 "El discurso"
ev7.104.desc:0 "Ha llegado el momento de tu discurso. También es una buena ocasión para aludir a los asuntos que más te interesan."
ev7.104.a:0 "La magia. ¿Qué es en realidad? ¿Qué leyes la rigen?"
ev7.104.b:0 "Debemos reforzar la cooperación; es algo crucial para nuestra sociedad."
ev7.104.c:0 "Nos reunimos aquí porque tenemos intereses... y enemigos comunes."
ev7.104.d:0 "Estoy ante vosotros como el mejor entre vosotros..."
ev7.104.e:0 "Amigos, nos enfrentamos a muchos problemas que ya no podemos seguir ignorando."
ev7.104.f:0 "La historia de toda sociedad existente es la historia de la lucha de clases..."
ev7.104.g:0 "Empecemos por el hecho de que sois una panda de idiotas..."
ev7.105.desc:0 "Las sesiones ya han comenzado. Algunos participantes están abordando asuntos importantes, mientras que otros sacan temas que parecen totalmente fuera de lugar. Al final, como portavoz, decidirás sobre qué se votará. Sin embargo, que la propuesta salga adelante dependerá del apoyo que logre reunir."
ev7.105.a:0 "Desarrollaremos un programa conjunto de investigación mágica."
research_cooperation:0 "Cooperación en investigación"
ev7.105.b:0 "Todos firmaremos un pacto mutuo de defensa."
ev7.105.b_ct:0 "Se unirán al pacto mutuo de defensa."
ev7.105.b_ct3:0 "Te unirás al pacto mutuo de defensa."
ev7.105.b_ct2:0 "Los participantes podrán apoyarse entre sí en guerras defensivas."
ev7.109.title:0 "Pacto defensivo"
ev7.105.c:0 "Necesitamos un archimago; me presento para ese importante cargo."
ev7.105.c_ct:0 "El archimago tendrá más probabilidades de convertirse en portavoz en el futuro."
ev7.105.c_ct2:0 "El archimago tendrá acceso a opciones adicionales como portavoz."
ev7.105.d:0 "Como archimago, necesito recaudar fondos para garantizar vuestra seguridad."
ev7.105.e:0 "Debemos prohibir el uso de la magia negra."
ev7.105.e_ct:0 "Las maldiciones, las maldiciones poderosas y los hechizos de dominación están #N prohibidos#!."
ev7.105.e_ct2:0 "Si se detecta su uso, la reputación del responsable se resentirá, y otros magos podrán obtener reclamaciones y un motivo para encarcelarlo."
ev7.105.f:0 "Los gobernantes corrientes se convertirán en nuestros títeres. Elaboremos un plan..."
joint_intrigues:0 "Red de espionaje conjunta"
ev7.105.g:0 "[target1.GetTitledFirstName] es una amenaza y debe ser eliminado."
ev7.105.g_ct:0 "La asamblea empleará magia o intrigas para eliminar al objetivo."
death_sentence:0 "Sentencia de muerte"
ev7.105.h:0 "[target2.GetTitledFirstName] debería ser excluido de nuestra comunidad."
ev7.105.i:0 "Necesito vuestro poder para preparar un hechizo poderoso. Por el bien mayor..."
ev7.105.i_ct:0 "El portavoz podrá lanzar #italic el Hechizo Supremo#! una vez ([decision|E])."
ev7.105.i_ct2:0 "La asamblea transferirá su saturación de poder o su vitalidad al portavoz."
excluded_from_magic_community:0 "Paria"
mage_summit_excluded_terrain_cancel_negative_supply:0 "No puede ser invitado a la Cumbre de Magos"
ev4b.0.d:0 "Percibo que [magic_user.GetSheHe] ha lanzado un hechizo prohibido."
use_black_magic_opinion:0 "Usó hechizos prohibidos"
ms_if_succeded_desc:0 "Si la votación resulta #P favorable#!:"
ev7.106.desc:0 "La asamblea está a punto de votar tu propuesta. Por desgracia, no todo el mundo parece convencido."
ev7.106.a:0 "Aun así, espero que me apoyen."
ev7.106.b:0 "Recordaré a los demás sus obligaciones."
ev7.106.b_ct:0 "Puedes ganar apoyo adicional a costa de los ganchos que posees."
ev7.107.desc:0 "Las deliberaciones se han alargado durante mucho tiempo, y muchas personas han expresado su opinión sobre diversos asuntos. No todos te parecían interesantes, pero algo captó tu atención. La sesión toca a su fin, así que el portavoz ha decidido someter una de las ideas a votación."
ev7.107.b:0 "Es una mala idea."
ev7.107.c:0 "No soy un mago ni siquiera una verdadera bruja; de todos modos, no puedo votar."
ms_vote_yes_ct:0 "Votarás #P SÍ#!"
ms_vote_no_ct:0 "Votarás #N NO#!"
mage_summit_log_yes_title:0 "La votación ha sido #P favorable#!."
mage_summit_log_no_title:0 "La votación ha #N fracasado#!."
mage_summit_log_yes_count:0 "Votos #P SÍ#!: #P [speaker0.MakeScope.Var('ms_vote_yes').GetValue]#!"
mage_summit_log_no_count:0 "Votos #N NO#!: #N [speaker0.MakeScope.Var('ms_vote_no').GetValue]#!"
ev7.109.desc:0 "Has recibido información de que [defender.GetTitledFirstName] ha sido atacado. Tu pacto mutuo de defensa te obliga a apoyar a [defender.GetHerHim]."
ev7.109.a:0 "Por supuesto, ayudaré a [defender.GetHerHim]."
ev7.109.b:0 "No se especificó qué clase de apoyo debo prestar."
ev7.109.c:0 "Tengo que negarme."
ev7.109.c_ct:0 "Rompes el pacto mutuo de defensa."
ev7.109.c_ct2:0 "Obligaciones rotas."
empty1_desc:0 ""
ev6.75.title:0 "¡Al-Hazred detenido!"
ev6.75.ct:0 "Ahora eres el mago más poderoso del mundo..."
ev7.110.desc:0 "La asamblea ha dictado sentencia sobre [target1.GetTitledFirstName]. Según la orden, todo el mundo debe intentar eliminar al objetivo."
ev7.110.a:0 "Bien, recurriré a la magia..."
ev7.110.b:0 "Lo haremos por la vía clásica."
ev7.110.c:0 "Obligaré a [target1.GetHerHim] a batirse en un duelo de magos."
ev7.111.title:0 "Buscar apoyos"
ev7.111.desc:0 "De cara a la próxima reunión, tienes varias ideas que la asamblea debería abordar. Sin embargo, tus propuestas necesitarán el respaldo de otros participantes para convertirse en algo más que simples deseos. [mage0.GetTitledFirstName] parece alguien a quien podrías convencer de tu punto de vista."
ev7.111.a:0 "Hay una forma sencilla de convencer a [mage0.GetHerHim]."
ev7.111.a_ct:0 "Si te conviertes en portavoz, tu proyecto recibirá apoyo adicional."
ev7.111.b:0 "¿Quizá [mage0.GetSheHe] pueda ayudarme a cambio de un favor?"
ev7.111.c:0 "El oro es la respuesta."
ev7.111.d:0 "Creo que encontraré la forma de lograrlo."
ev7.111.e:0 "Es una pérdida de tiempo."
ev7.111.f:0 "Bah, hablemos de magia."
ev3.22.d:0 "Proyecto especial."
ev3.22.d_ct:0 "Se desarrollará un [magic_special_project|E]."
ME_YOU_HAVE_THEM_ALL:0 "Has llevado a cabo toda la investigación posible."
ME_DONT_HAVE_SPECIAL_PROJECTS:0 "Actualmente no tienes ningún proyecto especial que desarrollar."
ev3.22.a3_ct:0 "puede desbloquear un [magic_special_project|E] aleatorio."
ev3.22.a4_ct:0 "tiene una probabilidad #P alta#! de desbloquear un [magic_special_project|E]."
ev3.22.a5_ct:0 "tiene una probabilidad #N baja#! de desbloquear un [magic_special_project|E]."
trait_golem:0 "Gólem"
trait_golem_desc:0 "Un producto de la ingeniería mágica avanzada. Una imitación perfecta de un ser humano, pero desprovista de un alma auténtica."
trait_immortal1:0 "Inmortal"
trait_immortal1_desc:0 "Mediante una poderosa magia, este mago logró detener su proceso de envejecimiento."
trait_immortal2:0 "Maldito para siempre"
trait_immortal2_desc:0 "Como resultado de la poderosa maldición de Yaga, este personaje no puede morir de forma natural."
ev10.0.g:0 "Que [reci.GetSheHe] quede maldito para siempre."
immune_for_illness_terrain_cancel_negative_supply:0 "Inmune a la enfermedad"
ev7.112.desc:0 "Ha llegado el momento de considerar tu proyecto especial."
ev7.113.desc:0 "Mientras avanzabas en tu investigación, se te ocurrieron algunas ideas nuevas. Tal vez merezca la pena explorar alguna de ellas."
ev7.113.a:0 "Lo estudiaré en el futuro."
ev7.113.b:0 "No es más que una teoría abstracta."
game_concept_magic_special_project:0 "Proyecto especial"
game_concept_magic_special_project_desc:0 "Los magos pueden desarrollar proyectos especiales como parte de su investigación mágica. Un nuevo proyecto especial puede desbloquearse al redactar una elaboración o como resultado de eventos aleatorios. Algunos proyectos especiales exigen requisitos adicionales para desbloquearse."
me_golem_project_ct:0 "Desbloqueas #italic Humano artificial#! como [magic_special_project|E]"
me_golem_option:0 "Humano artificial"
me_immortality_project_ct:0 "Desbloqueas #italic Vida eterna#! como [magic_special_project|E]"
legendary_mage_terrain_cancel_negative_supply:0 "Desbloquea #italic Vida eterna#! como [magic_special_project|E]"
me_immortality_option:0 "Vida eterna"
me_death_project_ct:0 "Desbloqueas #italic Burlar a la muerte#! como [magic_special_project|E]"
me_death_option:0 "Burlar a la muerte"
me_ascendency_project_ct:0 "Desbloqueas #italic Ascendencia#! como [magic_special_project|E]"
me_ascendency_option:0 "Ascendencia"
me_soul_project_ct:0 "Desbloqueas #italic Transferencia de alma#! como [magic_special_project|E]"
me_soul_option:0 "Transferencia de alma"
me_castle_project_ct:0 "Desbloqueas #italic Castillo volador#! como [magic_special_project|E]"
flying_castle_modifier:0 "Castillo volador"
me_sing_project_ct:0 "Desbloqueas #italic Mejora de la Singularidad Antigua#! como [magic_special_project|E]"
me_sing_option:0 "Mejora de la Singularidad Antigua"
devils_servant_modifier:0 "Siervo del diablo"
ev7.114.desc:0 "Primero debes trazar un plan, buscar fuentes y hacer los cálculos necesarios. De momento ni siquiera estás seguro de por dónde empezar, aunque avanzar parece solo cuestión de tiempo."
ev7.114.a:0 "Seré meticuloso."
ev7.114.b:0 "No dormiré hasta terminarlo."
ev7.115.desc:0 "Durante el curso de tu trabajo te has topado con un problema serio. Según tus últimos cálculos, tal vez no sea posible completar el proyecto. Quizá hayas cometido algún error... o quizá, sencillamente, no sea viable."
ev7.115.a:0 "Volveré a hacer los cálculos."
ev7.115.b:0 "Bien, continuaré de todos modos."
ev7.115.c:0 "Sí, es un error; ya lo veo."
ev7.115.a_ct:0 "Tu trabajo puede #N fracasar#!"
ev7.116.desc:0 "Por desgracia, tu proyecto especial resultó ser un callejón sin salida. No puedes llevarlo a cabo según tu plan; quizá sea, sencillamente, imposible."
ev7.116.a:0 "Aún me queda mucho por aprender."
ev7.116.a_ct:0 "Tu [magic_special_project|E] ha #N fracasado#!."
ev7.117.desc:0 "¡Por fin! Tu trabajo en"
ev7.117.desc2:0 "ha llegado a su fin. Otro misterio ha sido resuelto, otra obra maestra ha sido culminada."
ev7.117.a:0 "Este es mi destino."
ev7.117.b:0 "No puede morir lo que ya está muerto."
ev7.117.c:0 "Es hora de ponerme a dieta."
ev7.117.c_ct:0 "Cada niño consumido prolongará tu vida 10 años."
ev7.117.d:0 "Ningún ejército puede conquistar un castillo volante."
ev7.117.e:0 "Creo que seré... aún más invencible."
ev7.117.f:0 "Puedo ser... nadie."
ev7.117.f_ct:0 "Desbloqueas el hechizo #italic Transferencia de alma#! ([interaction|E])."
ev7.117.z:0 "No, no puedo hacer eso."
ev7.118.desc:0 "Esta es la fase final de la creación del gólem. Sin embargo, aún hay que resolver un pequeño \"problema\" de diseño."
ev7.118.a:0 "Crearé un hombre."
ev7.118.b:0 "Crearé una mujer."
ev7.119.desc:0 "¡Por fin! ¡Tu creación está terminada! Es magnífica..."
ev7.119.a:0 "¡Está vivo!"
golem_name:0 "Titán"
golem_name2:0 "Cristal"
HAS_NO_SOUL_CUSTOM:0 "Vendiste tu alma, así que no puedes transferirla..."
soul_transfer_spell:0 "Transferencia de alma"
soul_transfer_spell_desc:0 "Enviar tu alma a otro cuerpo..."
soul_transfer_spell_ct:0 "Tu alma y tu mente serán transferidas al cuerpo del objetivo."
soul_transfer_spell_ct2:0 "Transferirás tu personalidad, pero no tus rasgos físicos."
ST_ALSO_ARTIFACTS:0 "Transferir artefactos"
ev7.120.title:0 "Mejorando el gólem"
ev7.120.desc:0 "Estás razonablemente satisfecho con tu gólem, pero ves que aún hay cosas que podrían mejorarse."
ev7.120.a:0 "Trabajaré en mejorar su inteligencia."
ev7.120.b:0 "Necesito mejorar su función de combate."
ev7.120.c:0 "¿Qué tal si instalamos un generador mágico? ¿Tiene sentido?"
ev7.120.d:0 "No me pondré límites."
ev7.121.desc:0 "En el sueño ves acercarse una figura en llamas. Sientes que es la propia muerte reclamándote, una monstruosidad a la que ningún mortal puede enfrentarse. Lo último que recuerdas es aquella voz aterradora diciendo: 'Voy a por ti.'"
ev7.121.a:0 "Solo es un sueño..."
triangulation_terrain_cancel_negative_supply:0 "La triangulación mágica muestra el artefacto de tu elección."
ev7.122.desc:0 "Tu dominio de la magia es lo bastante alto como para calibrar con precisión tu hechizo de rastreo."
necro_chapter1:0 "Grimorio Negro - Capítulo 1."
necro_chapter2:0 "Grimorio Negro - Capítulo 2."
necro_chapter3:0 "Grimorio Negro - Capítulo 3."
necro_chapter4:0 "Grimorio Negro - Capítulo 4."
necro_chapter5:0 "Grimorio Negro - Capítulo 5."
necro_chapter_desc1:0 "«Mi nombre es Abdul Al-Hazred y soy el mago más poderoso de este mundo. Dicen que estoy loco, pero, aun siendo cierto, no es un precio demasiado alto por el poder que poseo. Otros han entregado mucho más a cambio de mucho menos. Si estás leyendo estas palabras, significa que he abandonado este mundo, como tantos antes que yo. No sé si regresaré. Que este libro sirva de guía a las generaciones futuras de magos.»"
necro_chapter_desc2:0 "'La magia tiene su precio. No es un estado natural: los humanos fueron diseñados de una forma que dificulta el uso del poder. Tal vez fuimos creados como un experimento, o quizá como una raza de sirvientes destinada a las tareas más simples y al trabajo esclavo. No he logrado contactar con nuestro creador, pero quizá mi próximo viaje me aporte nuevas respuestas.'"
necro_chapter_desc3:0 "«En el universo existen al menos tres estrellas donde nacen los dioses. Esas estrellas son también la fuente de la magia: cada mundo situado dentro de su alcance permite a sus habitantes emplear poderes mágicos. Nuestro mundo se encuentra bajo la influencia de una de ellas, pero, según mis cálculos, dentro de unos 600 años nos alejaremos demasiado y la magia desaparecerá durante muchísimo tiempo, quizá para siempre. Esa es otra buena razón para abandonar este mundo.»"
necro_chapter_desc4:0 "\"Los demonios fueron creados como siervos de los dioses, pero muchos de ellos son rebeldes y se han proclamado dioses a sí mismos. Por supuesto, no poseen el verdadero poder de la Creación y la Destrucción, pero para la gente corriente, en su mayoría desprovista de capacidades mágicas, pueden parecer dioses. Sin embargo, la mayoría no puede viajar libremente entre mundos: deben ser invocados mediante un hechizo o por el poder de un contrato firmado con un mortal.\""
necro_chapter_desc5:0 "'Los dioses son seres extraños. Sus motivaciones nunca se parecen a las humanas, ni siquiera a las demoníacas. Resulta aterrador incluso para mí. Puedo mover montañas y someter demonios, pero no sé si me atrevería siquiera a tratar con una deidad menor. Por fortuna, no están interesados en nuestro mundo; tienen sus propios asuntos y sus propios secretos. Aunque uno de ellos está aquí, yace sumido en un letargo en algún lugar del fondo del océano. Por ahora no supone una amenaza.'"
ev7.124.a:0 "Más misterios en mis manos."
pot8:0 "Poción de poderío"
pot8_desc:0 "Esta poción aumenta temporalmente los poderes mágicos y físicos."
gain_pot8_ct:0 "Obtienes una poción de poderío"
