drink_pot8_decision_desc:0 "Esta poción aumenta temporalmente los poderes mágicos y físicos."
drink_pot8_decision_confirm:0 "Beber la poción"
alchemical_enhancement:0 "Mejora alquímica"
return_to_witchcraft_decision_title:0 "Volver a la brujería"
return_to_witchcraft_decision_desc:0 "Abandonar la brujería fue un error que debes corregir."
ev6.4.0.a:0 "Cuéntame algo sobre la magia."
ev6.4.0.b:0 "Necesito tu apoyo en mis intrigas."
ev6.9.desc3:0 "Entonces, ¿qué quieres, mago?"
ev7.125.desc:0 "Ves que la demonia ha aparecido ante ti, pero no tiene buen aspecto. Apenas se sostiene en pie."
ev7.125.a:0 "¿Nyx? ¿Qué ha pasado?"
ev7.126.desc:0 "'Mi maestro... no está satisfecho con nuestras reuniones. Tengo una propuesta que hacerte: si te inclinas ante él, podrás usar mis servicios. De lo contrario, tendré que matarte.'"
ev7.126.a:0 "Espera un momento..."
ev7.127.desc:0 "\"Debes aceptar. Jura lealtad aquí y ahora, y nada salvo tu orgullo sufrirá. Es poco probable que mi maestro quiera nada de ti durante los próximos mil años, aunque a veces es impredecible. Si no aceptas, lucharemos.\""
ev7.127.a:0 "Que así sea; serviré a tu maestro."
ev7.127.b:0 "Lo siento, no acepto órdenes de nadie."
ev7.127.c:0 "Hay una tercera opción. Únete a mí y sé libre."
ev7.128.desc:0 "'Buena elección. Nos has ahorrado mucho dolor a mí y a ti. Si mi... nuestro maestro te necesita, te lo haré saber.'"
ev7.128.a:0 "Bien, vayamos al grano."
legend_chronicle_legendary_mage:0 "La leyenda de [ancestor.GetNameNoTooltip|U]"
legend_chronicle_legendary_mage_desc:0 "Las hazañas y el poder de [ancestor.GetNameNoTooltip|U] se han vuelto legendarios; el mundo debe aceptar a [ancestor.GetHerHim] como uno de los magos y gobernantes más poderosos."
legend_chapter_opening_mage:0 "En su juventud, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] era una persona fuera de lo común, claramente distinta de los demás. Solo quienes estaban más cerca de [ROOT.Legend.GetProtagonist.GetHerHim] conocían sus intereses peculiares, pero ni siquiera ellos comprendían qué motivaciones y obsesiones guiaban a [ROOT.Legend.GetProtagonist.GetNameNoTooltip]."
legend_chapter_motivation_mage:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] buscaba conocimiento, verdad y sabiduría. Pero no solo eso. El poder auténtico, la magia, la capacidad de doblegar las leyes de la física a su voluntad: eso era lo que más fascinaba a [ROOT.Legend.GetProtagonist.GetHerHim]. O al menos eso decían los rumores."
legend_chapter_discovery_mage:0 "Se decía que [ROOT.Legend.GetProtagonist.GetNameNoTooltip] invocaba demonios, hablaba con espíritus y blandía las poderosas fuerzas de la naturaleza. [ROOT.Legend.GetProtagonist.GetSheHe|U] estaba rodeado por un aura de temor y poder. Pocos en el mundo podían igualar a [ROOT.Legend.GetProtagonist.GetHerHim], y eso ocurría incluso antes de que alcanzara la cumbre de su poder."
legend_chapter_conclusion_mage:0 "Al final, al menos algunos de los rumores sobre [ROOT.Legend.GetProtagonist.GetNameNoTooltip] resultaron ser ciertos. Ni siquiera los escépticos pueden poner en duda su poder ni el lugar en la historia que le corresponde."
