ev3.16.b:0 "...sin embargo, a veces las reglas pueden doblarse."
is_a_threat_opinion:0 "Es una amenaza"
ev3.6.f:0 "Toma mi alma..."
ev7.132.desc:0 "Es una historia de magia y demonios, de la pugna entre grandes poderes y de secretos inimaginables que se ocultan a los ojos de la gente corriente e incluso de los gobernantes. Quizá las generaciones futuras cuestionen este relato, pero las verdaderas brujas y los verdaderos magos siempre temerán el nombre de [legend_protagonist.GetTitledFirstName]."
ev7.133.title:0 "Calibración final"
ev7.133.desc:0 "Tu gólem funciona casi como un ser humano normal, pero tiene potencial para mucho más. Ha llegado el momento de hacer los ajustes finales y decidir cuál será su propósito. ¿Qué papel debería desempeñar?"
ev7.133.a:0 "Este es mi heraldo."
ev7.133.b:0 "Mi caballero."
ev7.133.c:0 "Mi secretario."
ev7.133.d:0 "Mi ayudante."
ev7.133.e:0 "Mi... sombra."
ev7.134.desc:0 "Después de lanzar hechizos de protección, se te ocurre que quizá tus seres queridos también necesiten protección adicional. Tienes suficiente poder para otro hechizo..."
ev7.134.a:0 "Tengo que proteger a mi heredero."
ev7.134.b:0 "Tengo que pensar en mi cónyuge."
ev7.134.c:0 "[target0.GetTitledFirstName] necesita protección..."
ev7.134.d:0 "No hace falta otro hechizo."
ev7.135.title:0 "Conocimiento en venta"
ev7.135.desc:0 "[wmage0.GetTitledFirstName] ha aparecido en tu corte. Sabes que [wmage0.GetSheHe] también es mago y has oído varios rumores sobre [wmage0.GetHerHim]. Parece que [wmage0.GetSheHe] tiene una oferta para ti: quiere venderte libros con conocimientos mágicos. Tras una inspección superficial, ves que podrían contener información valiosa."
ev7.135.a:0 "No vale lo que cuesta."
ev7.136.opening:0 "[new_mage.Custom2('AppropriateGreeting', ROOT.Char)]"
ev7.136.desc:0 "Ha llegado a mis oídos que posees un objeto que despierta un gran interés en mí. Estoy dispuesto a ofrecer una gran suma de oro a cambio de ese objeto. Espero una respuesta rápida antes de que cambie de opinión."
ev7.136.a:0 "¡Vendido!"
ev7.136.b:0 "Este objeto no tiene precio."
ev3.69.c2:0 "Es hora de un hechizo de destierro."
ev7.139.desc:0 "Has logrado reunir una gran cantidad de poder que obedece tu voluntad. Crees que puedes influir en la mente de tu objetivo, aunque también podrías emplear esta magia de una forma mucho más destructiva..."
ev7.139.a:0 "Probemos esto."
ev7.139.b:0 "¿Y si lo hacemos de otra manera?"
ev7.139.c:0 "Deseo la muerte de [recipient.GetHerHim]."
