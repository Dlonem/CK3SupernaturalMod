ev10.24.desc:0 "Has llegado al lugar donde [recipient.GetTitledFirstName] se alojaba hasta hace poco, pero parece que [recipient.GetSheHe] ya no está aquí. Quizá alguien le advirtió, o quizá simplemente tuvo suerte."
ev10.24.a:0 "No regresaré con las manos vacías."
ev10.25.desc:0 "Has dado caza a tu objetivo sin esfuerzo. [recipient.GetTitledFirstName] intentó huir, pero estabas preparado para ello. Un solo golpe le aplastó el pecho y lo mató en el acto."
ev10.26.desc:0 "Has logrado encontrar a [recipient.GetTitledFirstName]; sin embargo, [recipient.GetSheHe] está dispuesto a luchar. Parece que uno de los dos morirá hoy."
ev10.26.a:0 "Como un cordero camino del matadero."
ev10.26.b:0 "Bien, le perdonaré esta vez."
ev10.26.b_ct:0 "Renuncias a la confrontación."
ev10.27.desc:0 "Oyes un ruido inquietante. En ese mismo instante, uno de tus hombres irrumpe con noticias urgentes: es [actor.GetTitledFirstName], que ha atravesado a tus guardias y ha quebrado a tus caballeros como si fueran ramitas. [actor.GetSheHe|U] no es humano; ¡es un demonio sediento de sangre!"
ev10.27.a:0 "¡Me enfrentaré a [actor.GetHerHim]!"
ev10.27.b:0 "¡Cubrid mi retirada!"
ev10.27.b_ct:0 "¡Has fallado al intentar escapar!"
ev10.27.c:0 "¡Llamad al mago de la corte, deprisa!"
ev10.27.d:0 "Decidle... que me rindo."
ev10.27.d_ct:0 "Puedes perder la guerra [my_war.GetName]."
ev10.28.desc1:0 "Los guardias apostados en la puerta del castillo intentaron detenerte, pero los mataste. El rastrillo se cerró con rapidez, aunque lo arrancaste de un fuerte tirón y lo arrojaste al foso. Varios necios trataron de enfrentarse a ti en el patio, y los masacraste."
ev10.28.desc2:0 "El guardia del campamento trató de detenerte, así que le arrancaste la cabeza con una sola mano. Otros dos se abalanzaron sobre ti, pero los despedazaste sin esfuerzo. El campamento estalló en un tumulto y la gente empezó a gritar y a huir."
ev10.28.desc3:0 "\n[aprotector.GetTitledFirstName] apareció ante ti, listo para luchar. Está claro que [recipient.GetTitledFirstName] ha encontrado a alguien que [recipient.GetHerHim] defienda. En fin, un cadáver más no marcará la diferencia hoy."
ev10.28.a:0 "Muere, [aprotector.GetName]."
ev10.29.desc1:0 "Ahora que el calentamiento ha quedado atrás, es hora de ocuparte de [recipient.GetTitledFirstName]. Tuviste que matar a unos cuantos soldados más por el camino, pero al final encontraste a [recipient.GetHerHim]. [recipient.GetSheHe|U] parece querer defenderse. Patético."
 ev10.29.desc2:0 "\nPor fin apareció [recipient.GetTitledFirstName]."
ev10.31.desc:0 "[recipient.GetSheHe|U] te ha hecho una oferta: está dispuesto a capitular en la guerra a cambio de su miserable vida."
ev10.29.a:0 "Aquí termina todo para ti."
ev10.29.a_it:0 "¡Se desata el choque!"
ev10.29.a_ct:0 "Ha sido masacrado."
ev10.29.b:0 "He cambiado de idea. Adiós."
ev10.29.b_it:0 "El demonio se ha ido, pero muchos han muerto."
ev10.30.desc:0 "Tu señor te ha convocado de inmediato: su corte está siendo atacada por [actor.GetTitledFirstName]. Te ordena derrotar al demonio antes de que sea demasiado tarde. Ves que [liege0.GetTitledFirstName] está desesperado y teme por su vida."
ev10.30.a:0 "Me enfrentaré al demonio."
ev10.30.a_ct:0 "Tendrás que luchar."
ev10.30.b:0 "[liege0.GetTitledFirstName] ha recibido lo que [liege0.GetSheHe] se merecía."
ev10.30.b_ct:0 "¡Tu mago de la corte se ha negado a ayudar!"
extra_output_event_ct:0 "Tu mago de la corte fracasó"
ev10.31.a:0 "No... morirás aquí y ahora."
ev10.31.a_ct:0 "El demonio ha rechazado tu rendición."
ev10.31.b_ct:0 "El demonio ha aceptado tu rendición."
