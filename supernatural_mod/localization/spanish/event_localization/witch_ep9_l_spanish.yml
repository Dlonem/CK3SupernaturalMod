expose_yourself_as_witch_decision_name:0 "Revelarte como bruja"
expose_yourself_as_witch_decision_desc:0 "Mantener en secreto tus intereses dificulta mucho llevar a cabo tus investigaciones y practicar la brujería. Tal vez no merezca la pena preocuparse por las críticas de gobernantes supersticiosos y del clero."
