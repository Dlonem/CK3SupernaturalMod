laamp_magic_1013_contract:0 "La biblioteca secreta"
laamp_magic_1013_request:0 "Este [task_contract|E] requiere viajar a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y usar [diplomacy|E] o [intrigue|E] para resolverlo."
laamp_magic_1013_desc_title:0 "$laamp_magic_1013_contract$"
laamp_magic_1013_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] posee una biblioteca que podría contener mucha información útil. Quizá un poco de persuasión baste para que [TaskContract.GetEmployer.GetTitledFirstName] te permita revisar sus libros."
laamp_magic_1013_desc_ct:0 "Puedes obtener un punto de ventaja o mejorar tus habilidades."
ev10.150.desc:0 "[employer.GetTitledFirstName] se asegura de que ninguna persona no autorizada se acerque a sus libros, aunque a veces los pone a disposición de amigos o eruditos respetados. Tendrás que encontrar la manera de acceder a ellos."
ev10.150.a:0 "Hablaré con [employer.GetHerHim] sobre ello."
ev10.150.b:0 "Me colaré allí por la noche."
ev10.150.c:0 "Pagaré."
ev10.150.d:0 "Probablemente estos libros no contengan nada interesante."
laamp_magic_1014_contract:0 "Evaluación del mago de la corte"
laamp_magic_1014_request:0 "Este [task_contract|E] requiere viajar a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y evaluar las aptitudes del mago de la corte local."
laamp_magic_1014_desc_title:0 "$laamp_magic_1014_contract$"
laamp_magic_1014_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] cuenta con los servicios de un mago de corte que supuestamente realiza investigaciones y apoya a [TaskContract.GetEmployer.GetTitledFirstName] con sus conocimientos. Sin embargo, [TaskContract.GetEmployer.GetTitledFirstName] no está seguro de que su mago posea habilidades reales. ¿Podría tratarse de un simple farsante y estafador? La opinión de un experto independiente sería de gran utilidad."
ev10.151.desc:0 "\"Por lo visto, eres un experto en conocimientos arcanos y hechicería; por eso me gustaría pedirte que evalúes a mi mago de la corte, [cmage.GetTitledFirstName]. [cmage.GetSheHe|U] afirma que sus hechizos son eficaces, pero yo no veo resultados. No estoy versado en magia, así que quizá esto sea normal. Sin embargo, si [cmage.GetTitledFirstName] es un farsante, me gustaría saberlo.\""
ev10.151.a:0 "Hablaré con [cmage.GetHerHim]; quizá descubra la verdad."
ev10.152.desc:0 "Has hablado un buen rato con [cmage.GetTitledFirstName]. [cmage.GetSheHe|U] se muestra reacio a hablar de su labor como mago de corte, pero eso no significa nada por sí mismo. Los magos y las brujas no suelen compartir sus secretos ni sus conocimientos."
ev10.152.a:0 "Haré algunas preguntas capciosas."
ev10.152.b:0 "Usaré sentido mágico."
ev10.152.c:0 "Leeré el aura de [cmage.GetHerHim]."
ev10.152.d:0 "Bien, supongo que tendré que confiar en mi intuición."
ev10.153.desc1:0 "Has conseguido determinar sin ninguna duda que [cmage.GetTitledFirstName] es un farsante. Ahora debes transmitir tu veredicto a [employer.GetTitledFirstName]."
ev10.153.desc2:0 "Parece que [cmage.GetTitledFirstName] no es más que una bruja mediocre que no sabe nada de verdadera magia ni de lanzamiento de hechizos. Ahora solo queda comunicarle esta noticia a [employer.GetTitledFirstName]."
ev10.153.desc3:0 "Has determinado que [cmage.GetTitledFirstName] es una bruja experimentada. [cmage.GetSheHe|U] posee conocimientos y ciertas aptitudes, aunque están lejos de la verdadera magia. Aun así, tener un mago de corte así es mejor que no tener ninguno. Ya solo queda presentar tus observaciones a [employer.GetTitledFirstName]."
ev10.153.desc4:0 "Tus conclusiones indican que [cmage.GetTitledFirstName] es un practicante avanzado de la magia con aptitudes extraordinarias. [cmage.GetSheHe|U] sabe claramente lo que hace y es la persona adecuada para el puesto de mago de la corte. Lo único que queda es presentar tus observaciones a [employer.GetTitledFirstName]."
ev10.153.desc5:0 "No eres capaz de evaluar las aptitudes de [cmage.GetTitledFirstName]. La cuestión es: ¿qué le dirás a [employer.GetTitledFirstName]?"
ev10.153.a:0 "[cmage.GetTitledFirstName] es, sin duda, un mago competente."
ev10.153.b:0 "[cmage.GetTitledFirstName] no pasa de ser un mago de corte corriente."
ev10.153.c:0 "[cmage.GetSheHe|U] no sirve para el puesto."
ev10.153.d:0 "[cmage.GetTitledFirstName] es un farsante."
ev10.153.e:0 "No puedo ayudar aquí."
ev10.153.f:0 "Yo sería mejor mago de la corte que [cmage.GetSheHe]."
laamp_magic_1014_desc_success_critical_ct:0 "#P Puedes convertirte en mago de la corte y vasallo.#!"
join_mages_summit:0 "Unirse a la Cumbre de Magos"
join_mages_summit_desc:0 "Tu invitación debió de perderse por el camino, pero aun así puedes asistir a la Cumbre de Magos."
ev10.154.title:0 "Romper la barrera"
ev10.154.desc:0 "La barrera que colocaste alrededor de la Tierra, destinada a bloquear toda fuerza externa, se rompió anoche. Algún intruso poderoso ha entrado en tu mundo. Sea lo que sea, todos estáis en peligro."
ev10.154.a:0 "¡Debe de ser algo muy poderoso!"
ev10.154.a_ct:0 "#N ¡La barrera mágica que rodea la Tierra ha sido destruida!#!"
