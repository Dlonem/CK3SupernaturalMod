thorn_walls_modifier:0 "Muros espinosos"
thorn_walls_modifier_desc:0 "A lo largo de las fortificaciones locales crecen plantas gigantes deformadas por la magia y cubiertas de espinas afiladas. Esta barrera dificulta considerablemente el desarrollo de un asedio y también afecta a la moral de las tropas enemigas."
