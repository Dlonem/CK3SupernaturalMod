remove_from_high_council_interaction_title:0 "$mc_full_name$"
ev10.62.title:0 "Elección"
ev10.62.desc:0 "Esta Cumbre de Magos será distinta de las demás: en lugar de elegir a un Portavoz y votar resoluciones, se celebrará una elección para designar al nuevo líder del Alto Consejo de Magos. Toda la congregación está expectante: un nuevo líder podría traer cambios para toda la sociedad mágica."
ev10.62.a:0 "Presentaré mi candidatura."
ev10.62.a_ct:0 "Competirás por el puesto de Archimago."
ev10.63.desc:0 "Tras algunos debates encendidos y varios discursos, ya está claro qué magos cuentan con apoyo suficiente para presentarse al cargo de archimago. Son los siguientes:"
ev10.63.cand1:0 "\n$EFFECT_LIST_BULLET$[ms_cand1.GetTitledFirstName]"
ev10.63.cand2:0 "\n$EFFECT_LIST_BULLET$[ms_cand2.GetTitledFirstName]"
ev10.63.cand3:0 "\n$EFFECT_LIST_BULLET$[ms_cand3.GetTitledFirstName]"
ev10.63.cand4:0 "\n$EFFECT_LIST_BULLET$[ms_cand4.GetTitledFirstName]"
ev10.63.a:0 "La carrera por el poder no ha hecho más que empezar."
ev10.64.desc:0 "Ha llegado el momento de la votación: cada participante de la cumbre puede escribir un nombre en un trozo de pergamino y depositarlo en la urna. El mago que reúna más votos ganará la elección."
ev10.64.a:0 "[ms_cand1.GetTitledFirstName] tiene mi voto."
ev10.64.b:0 "Votaré por [ms_cand2.GetTitledFirstName]."
ev10.64.c:0 "[ms_cand3.GetTitledFirstName] debe recibir apoyo."
ev10.64.d:0 "[ms_cand4.GetTitledFirstName] es el mejor candidato."
ev10.64.e:0 "Voto por mí mismo, por supuesto."
ms_cand1_votes_counter:0 "Votos para [ms_cand1.GetTitledFirstName]: [ms_cand1.MakeScope.Var('my_arch_votes').GetValue]"
ms_cand2_votes_counter:0 "Votos para [ms_cand2.GetTitledFirstName]: [ms_cand2.MakeScope.Var('my_arch_votes').GetValue]"
ms_cand3_votes_counter:0 "Votos para [ms_cand3.GetTitledFirstName]: [ms_cand3.MakeScope.Var('my_arch_votes').GetValue]"
ms_cand4_votes_counter:0 "Votos para [ms_cand4.GetTitledFirstName]: [ms_cand4.MakeScope.Var('my_arch_votes').GetValue]"
mage_summit_archmage_elected_title:0 "¡El nuevo Archimago ha sido elegido!"
ev7.111.b_ct:0 "[mage0.GetTitledFirstName] votará por ti."
ev10.65.a:0 "Acepto este honor."
ev10.65.b:0 "La política no me interesa."
ev10.66.desc:0 "Necesitas encontrar tantos apoyos como sea posible si de verdad piensas convertirte en archimago. [guest0.GetTitledFirstName] parece una persona susceptible a tu influencia."
ev10.66.a:0 "Ofreceré un favor en el futuro."
ev10.66.a_ct:0 "[guest0.GetTitledFirstName] votará por ti."
ev10.67.a_ct:0 "[guest1.GetTitledFirstName] votará por ti."
ev10.66.b:0 "Solo quiero ganarme su buena voluntad."
ev10.67.desc:0 "No estás seguro de haber reunido apoyos suficientes para ser elegido archimago. Por suerte, aún queda alguna gente a la que quizá puedas convencer."
ev10.67.a:0 "Es hora de repartir sobornos."
ev10.67.b:0 "Intentaré causar una buena impresión."
ev10.67.c:0 "Si son listos, votarán por mí."
ev10.68.title:0 "Agitación"
ev10.68.desc:0 "Puedes ver a [guest0.GetTitledFirstName] hablando con las otras brujas; crees que [guest0.GetSheHe] intenta convencerlas para que voten por [guest0.GetHerHim]. Las brujas muestran un interés cortés, pero no parecen convencidas."
ev10.68.a:0 "También tengo algo que decir."
ev10.68.b:0 "Señalaré su falta de competencia."
ev10.68.c:0 "Expresaré mi aprobación de su candidatura."
ev10.68.d:0 "Permaneceré neutral aquí."
ev10.68.e:0 "Yo sería un archimago mucho mejor, obviamente."
ev10.69.desc:0 "En algún momento, [guest0.GetTitledFirstName] se acerca a ti e inicia una conversación cautelosa. Puedes ver que [guest0.GetSheHe] intenta averiguar si tienes intención de votar por [guest0.GetHerHim]."
ev10.69.a:0 "Mi apoyo no es barato."
ev10.69.a_ct:0 "Prometes votar por [guest0.GetHerHim]."
ev10.69.b:0 "Quizá podamos llegar a un quid pro quo."
ev10.69.c:0 "Me caes bien; tienes mi voto."
ev10.69.d:0 "Aquí hay muchos candidatos mejores que tú."
transfer_to_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] transfiere [gold_i]$VALUE|+0$ a los [mc_funds|E]"
take_from_mc_funds_ct:0 "[CHARACTER.GetShortUINameNotMe] recibe [gold_i]$VALUE|+0$ de los [mc_funds|E]"
increase_mc_funds_effect_ct:0 "Los [mc_funds|E] aumentan en [gold_i]$VALUE|+0$ de oro"
decrease_mc_funds_effect_ct:0 "Los [mc_funds|E] disminuyen en [gold_i]$VALUE|-0$ de oro"
ev10.70.desc:0 "El Consejo necesita dinero para funcionar. Por suerte, hay varias formas de conseguirlo: cooperación con banqueros venecianos, operaciones mercantiles, inversiones más o menos arriesgadas. A veces la magia o las donaciones de otros magos también pueden reforzar el presupuesto."
ev10.70.a:0 "Buscaré oportunidades en el mercado."
ev10.70.b:0 "Ganaremos dinero con préstamos usurarios."
ev10.70.c:0 "Tengo algunas ideas."
ev10.70.d:0 "Será una inversión arriesgada."
ev10.70.e:0 "Nadie se dará cuenta si desaparece algo de oro."
mc_donate_funds_decision_name:0 "Hacer una donación al Alto Consejo"
mc_donate_funds_decision_desc:0 "Aunque el Consejo basa su poder en la magia, el oro también es un pilar importante. Por tanto, el apoyo financiero siempre es bienvenido."
mc_donate_funds_decision_ct:0 "Cualquier donante puede pedir el apoyo del Archimago."
decision_group_type_mc_decisions:0 "$mc_full_name$"
ev7.105.dx:0 "El Alto Consejo necesita fondos para funcionar con eficacia."
ev10.71.desc:0 "Ser archimago es, a veces, una responsabilidad difícil. Desde el mismo inicio de la cumbre te ves rodeado de muchas brujas que quieren ganarse tu simpatía o discutir asuntos poco importantes. Sin embargo, también hay ventajas: la congregación te escucha con atención y se muestra abierta a tus sugerencias."
ev10.71.a:0 "Tengamos un gran debate sobre magia."
ev10.71.b:0 "Saben que soy el mago más poderoso."
ev10.71.c:0 "Usaré esto para hacer nuevos amigos."
ev10.71.d:0 "Esta multitud ya me tiene harto."
ev10.71.e:0 "Dejaré claro que no es buena idea molestarme con tonterías."
ev10.72.title:0 "Deberes del Alto Consejo"
ev10.72.desc:0 "Debido a tu posición especial dentro del Alto Consejo, mucha gente quiere discutir contigo asuntos que considera importantes. Entre ellos se encuentra [guest0.GetTitledFirstName], quien se ha quejado de los cazadores de brujas: [guest0.GetSheHe] apenas escapó con vida cuando uno de ellos intentó matar a [guest0.GetHerHim] hace poco. En su opinión, el Alto Consejo debería hacer algo al respecto."
ev10.72.a:0 "Plantearé este asunto en la reunión del Alto Consejo."
ev10.72.d:0 "Discutiré esto con el Archimago."
ev10.72.b:0 "El consejo tiene muy pocos fondos para combatir eficazmente a los cazadores."
ev10.72.c:0 "Recibirás financiación para seguridad privada."
sponsor_demon_fighting_modifier:0 "Patrocinador de la lucha contra los demonios"
ev10.73.title:0 "Conspiración"
ev10.73.desc:0 "[guest0.GetTitledFirstName] insistió en mantener una conversación privada en la que te reveló sus dudas sobre el actual archimago, [amage.GetShortUIName]. Su opinión era que [amage.GetShortUIName] debería ser apartado, cueste lo que cueste, por el bien de toda la congregación. [guest0.GetShortUIName] cuenta con tu apoyo..."
ev10.73.a:0 "Puedes contar conmigo."
ev10.73.b:0 "De acuerdo, pero tu método es demasiado radical."
ev10.73.c:0 "Te equivocas; el archimago es el líder adecuado."
ev10.74.desc:0 "Como miembro del Alto Consejo, tienes derecho a un reembolso por parte de los costes de organizar la Cumbre de Magos. ¿Piensas aprovechar ese privilegio?"
ev10.74.a:0 "No, el consejo necesita ese dinero."
ev7.105.k:0 "El Archimago debería recibir privilegios extraordinarios para actuar con eficacia."
ev7.105.k_ct:0 "El Archimago puede exigir sumisión a brujas y magos"
MAGE_DUEL_O1A:0 "Duelo en la ubicación del objetivo"
MAGE_DUEL_O3b:0 "Forzar un duelo (en la ubicación del objetivo)"
MAGE_DUEL_O5:0 "Prometer no usar la Singularidad"
MAGE_DUEL_O5_ct:0 "No se permitirá el uso de Singularidades antiguas"
md_duel_in_my_location_ct:0 "El duelo de magos tendrá lugar en [actor.GetCurrentLocation.GetName]"
md_duel_in_your_location_ct:0 "El duelo de magos tendrá lugar en [recipient.GetCurrentLocation.GetName]"
demand_submission_archmage_interaction:0 "$demand_submission_cgm_interaction$"
demand_submission_archmage_interaction_desc:0 "Todos los miembros de la comunidad mágica te deben obediencia."
ARCH_DEM_O1:0 "Sé obediente"
ARCH_DEM_O2:0 "Pon fin a tus guerras"
ARCH_DEM_O2_ct:0 "Intentará negociar una paz blanca."
ev10.76.title:0 "Negociaciones de paz"
ev10.76.desc:0 "El Archimago exigió que pusieras fin a tus guerras de inmediato. De acuerdo con ese deseo, preparaste cartas ofreciendo una paz blanca a tus oponentes."
ev10.76.a:0 "Veremos cuál es la respuesta."
ev10.76.a_ct:0 "[THIS.Char.GetTitledFirstName] considerará la propuesta de paz blanca."
ev10.77.desc:0 "Nuestra guerra no tiene sentido, y lo mejor es ponerle fin cuanto antes. Propongo una paz blanca."
ev10.77.a:0 "No habrá paz de compromiso."
ev10.77.a_ct:0 "Tu propuesta fue rechazada."
demand_submission_archmage_reaction:0 "#N El Alto Consejo puede querer castigar la insubordinación#!"
ev10.78.title:0 "Exigencia rechazada"
ev10.78.desc:0 "[recipient.GetTitledFirstName] se negó a acatar tu voluntad. Es una violación flagrante de las normas vigentes."
ev10.78.a:0 "[recipient.GetSheHe|U] quedará fuera de la comunidad."
ev10.78.b:0 "El incidente quedará olvidado por ahora."
ev10.78.c:0 "El mago negro debería arrestar a [recipient.GetHerHim]."
ev10.78.c_ct:0 "El mago negro intentará arrestar al objetivo."
ev10.78.c_ct2:0 "Esto podría conducir a un duelo de magos y a la muerte de uno de los magos."
ev10.79.desc:0 "[recipient.GetTitledFirstName] rompió las normas y debe ser castigado. Como Mago Negro, tienes el deber de arrestar a [recipient.GetHerHim]."
ev10.79.a:0 "Como desees, Archimago."
ev10.79.b:0 "¿Sabes qué? Renuncio a mi puesto de Mago Negro..."
ev10.79.b_ct:0 "El mago negro se niega"
ev10.79.a_ct:0 "Partirás para arrestar a [recipient.GetTitledFirstName]."
ev10.79.a_ct1:0 "El objetivo se rendirá sin luchar."
ev10.79.a_ct2:0 "El objetivo se resistirá"
ev10.80.desc:0 "[bmage.GetTitledFirstName] apareció ante ti. [bmage.GetSheHe|U] dijo que venía como representante del Alto Consejo de Magos para arrestarte por quebrantar las normas. Si no te rindes de inmediato, te espera un duelo."
ev10.80.a:0 "Me rendiré con calma."
ev10.81.title:0 "Reunión secreta"
ev10.81.desc1:0 "Ha comenzado una reunión secreta del Alto Consejo de Magos. Cada miembro del Consejo aparece ante ti como una ilusión; podéis veros y oíros entre vosotros como si todos estuvierais en la misma cámara. Resulta asombroso que la magia permita una comunicación tan fluida a cualquier distancia: la gente corriente jamás tendrá capacidades semejantes."
ev10.81.desc0:0 "Los miembros del Alto Consejo aparecen como ilusiones, como de costumbre. Parece que ya puedes comenzar la reunión."
ev10.81.desc2:0 "Para empezar, el archimago quiere escuchar los informes de todos los miembros del Alto Consejo."
ev10.81.a:0 "Quiero oír vuestros informes."
ev10.81.b:0 "Bien, ¿quién va primero?"
ev10.81.c:0 "Presentaré un informe preciso."
ev10.82.desc0:0 "Primero, [admin.GetTitledFirstNameNoTooltip] resumió brevemente la situación actual.\n"
ev10.82.desc1:0 "En pocas palabras, expuso la situación actual ante el Alto Consejo.\n"
ev10.82.desc2:0 "\n$mc_gold_desc$: $mc_gold$"
ev10.82.desc3:0 "\nArtefactos mágicos asegurados: [admin.MakeScope.Var('art_counter').GetValue]"
ev10.82.desc4:0 "\nLugares de poder controlados: [admin.MakeScope.Var('ppower_counter').GetValue]"
ev10.82.desc5:0 "\nMagos conocidos: [admin.MakeScope.Var('mages_counter').GetValue]"
ev10.82.desc6:0 "\nDemonios detectados: [admin.MakeScope.Var('demons_counter').GetValue]"
ev10.82.desc7:0 "\n\nAhora te toca presentar el informe."
ev10.82.a:0 "No tengo nada más que añadir."
ev10.82.b:0 "Algunas de las cifras son preocupantes."
ev10.82.c:0 "[loremaster.GetShortUINameNotMe], ahora es tu turno."
ev10.82.d:0 "Comentaremos los resultados de mi investigación."
ev10.82.e:0 "Por ahora, no tengo nada que decir."
ev10.83.desc0:0 "[loremaster.GetTitledFirstNameNoTooltip] tomó la palabra. [loremaster.GetSheHe|U] te presentó los resultados de su investigación, que parecen prometedores. [loremaster.GetTitledFirstNameNoTooltip] declaró que continuará con su trabajo."
ev10.83.desc1:0 "[loremaster.GetTitledFirstNameNoTooltip] habló a continuación. [loremaster.GetSheHe|U] dijo que está llevando a cabo cierta investigación, pero que por ahora no está preparado para compartir sus resultados."
ev10.83.desc2:0 "Parece que ahora te toca informar."
ev10.83.a:0 "Bueno. ¿[bmage.GetShortUINameNotMe]?"
ev10.83.b:0 "Ya veo. ¿[bmage.GetShortUINameNotMe]?"
ev10.83.c:0 "Hm..."
ev10.83.d:0 "Los cazadores han incrementado su actividad recientemente."
ev10.83.d_ct:0 "El Archimago puede tomar una decisión al respecto."
ev10.83.e:0 "Los demonios son ahora la principal amenaza."
ev10.83.f:0 "Por ahora no hay amenazas."
ev10.83.g:0 "Mis espías han obtenido información útil."
ev10.84.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] informó de que la actividad de los cazadores de brujas ha aumentado notablemente en las últimas fechas. [bmage.GetSheHe|U] declaró que vigilará la situación de cerca."
ev10.84.a:0 "Encuéntralos y mátalos."
ev10.84.a_ct:0 "[bmage.GetShortUINameNotMe] intentará eliminar a algunos cazadores usando magia o intrigas."
ev10.84.b:0 "Yo me encargaré personalmente."
ev10.84.c:0 "El Consejo pondrá precio a las cabezas de los cazadores."
ev10.84.c_ct:0 "El número de cazadores puede reducirse ligeramente."
ev10.84.d:0 "Sí, mantenedlos vigilados por ahora."
ev10.84.desc1:0 "[bmage.GetTitledFirstNameNoTooltip] informó de que los demonios están causando algunos problemas. Tal vez convendría coordinar esfuerzos para detenerlos."
ev10.84.e:0 "Espero que todos toméis medidas."
ev10.84.e_ct:0 "Los miembros del Consejo usarán el hechizo de destierro con más frecuencia."
ev10.84.desc2:0 "[bmage.GetTitledFirstNameNoTooltip] informa de que sus espías han interceptado cierta información; quizá resulte útil."
ev10.84.desc3:0 "[bmage.GetTitledFirstNameNoTooltip] informa de que no hay problemas: actualmente no existe ninguna amenaza seria para el Consejo y la situación está bajo control."
ev10.84.desc4:0 "El Archimago decidió que [bmage.GetTitledFirstNameNoTooltip] debía resolver el problema por la fuerza bruta."
ev10.84.desc5:0 "El Archimago decidió abordar el problema personalmente."
ev10.84.desc6:0 "El Archimago decidió que el Consejo pondría precio a la cabeza de los cazadores de brujas."
ev10.84.desc7:0 "El Archimago decidió que el Consejo esperaría a ver cómo evoluciona la situación."
ev10.84.f:0 "Esperar puede ser arriesgado..."
ev10.84.desc8:0 "El Archimago decidió que todo el consejo debía centrarse en este problema."
ev10.85.desc0:0 "Ha llegado el momento de la segunda parte de la reunión: debatir los asuntos pendientes y considerar cualquier propuesta de los miembros del consejo."
ev10.85.a:0 "¿Tienes algún asunto que debatir?"
ev10.85.b:0 "Tenemos que debatir la crisis actual."
ev10.86.desc0:0 "¿Hay algún tema que quieras tratar?"
ev10.86.title:0 "Tus propuestas"
ev10.86.a:0 "He oído hablar de una fuente que quizá necesite cuidados."
sm_archmage_rejection_ct:0 "#N El archimago rechazó esta propuesta.#!"
sm_archmage_rejection_ct1:0 "#N El Archimago rechaza tu petición.#!"
sm_archmage_rejection_ct0:0 "#N Rechazas la propuesta.#!"
ev10.86.b:0 "Necesito fondos para mi investigación."
ev10.86.c:0 "Deberíamos aplicar un programa de desarrollo."
mc_development_modifier:0 "Desarrollo coordinado"
ev10.86.d:0 "No tengo propuestas."
ev10.86.e:0 "Podría producir una escuadra de gólems de combate para el Consejo."
ev10.86.e_ct:0 "Cada miembro del Consejo recibirá una pequeña escuadra de gólems."
ev10.86.f:0 "Deberíamos elegir un rector para la academia de magia."
rector_magic_academy_modifier:0 "Rector de la Academia de Magia"
ev10.86.f_ct:0 "Otra persona será elegida rectora."
ev10.87.title:0 "Respuesta del Archimago"
ev10.87.desc0:0 "«Hay un niño con una aptitud especial para la magia» —dijo [loremaster.GetTitledFirstNameNoTooltip]—. «Sin la tutela de un mago experimentado, [source_child.GetTitledFirstName] supone un peligro para quienes lo rodean. Quizá alguno de nosotros debería ocuparse de este asunto.»"
ev10.87.desc1:0 "«Mi investigación requiere una financiación considerable» —dijo [loremaster.GetTitledFirstNameNoTooltip]—. «¿Puedo contar con apoyo económico?»"
ev10.87.desc2:0 "«He desarrollado algunos procedimientos científicos que pueden ser útiles para la investigación y la administración» —dijo [loremaster.GetTitledFirstNameNoTooltip]—. «Por desgracia, aplicarlos puede requerir algo de oro.»"
ev10.87.desc4:0 "«Bien, si el Consejo me proporciona los materiales adecuados, podré producir una escuadra de gólems de combate para cada uno de nosotros» —dijo [loremaster.GetTitledFirstNameNoTooltip]—. «Esto reforzará nuestro potencial.»"
ev10.87.desc5:0 "«Ya que controlamos la Academia de Magia, deberíamos nombrar a un rector competente para supervisarla. Me ofrezco voluntario para el cargo.»"
ev10.87.a:0 "Ocúpate de ello."
ev10.87.b:0 "Me alegrará tomar un discípulo."
ev10.87.c:0 "Esta tarea es para [bmage.GetShortUINameNotMe]."
ev10.87.d:0 "Quizá [admin.GetShortUINameNotMe] encuentre tiempo para hacerlo."
ev10.87.e:0 "Recibes financiación."
ev10.87.f:0 "Esto no es asunto nuestro."
ev10.87.g:0 "Tenemos gastos más importantes."
ev10.87.desc3:0 "El Archimago ya ha tomado una decisión al respecto."
ev10.87.desc3x:0 "El Archimago ya ha tomado una decisión."
ev10.87.h:0 "Es la decisión correcta."
ev10.87.i:0 "Es la persona idónea para ese puesto."
ev10.87.j:0 "Asumiré esta responsabilidad."
ev10.87.k:0 "[bmage.GetShortUINameNotMe] será un buen rector."
ev10.87.l:0 "Sé quién es la persona adecuada."
ev10.88.desc0:0 "La mirada inquisitiva del archimago se posa sobre ti."
ev10.88.desc:0 "$ev10.88.desc0$ $ev10.86.desc0$"
ev10.88.a:0 "[magic_art.GetName] debería quedar en manos del Consejo."
ev10.88.b:0 "El Consejo debería apoyar a [war_ruler.GetTitledFirstName]."
ev10.88.c:0 "Necesito algo de oro para pociones."
ev10.88.d:0 "[troublemaker.GetTitledFirstName] está causando problemas; hay que hacer algo al respecto."
ev10.88.d_ct:0 "[bmage.GetShortUIName|U] recibirá la orden de arrestar al objetivo."
ev10.88.d_ct2:0 "#N Puede producirse un duelo de magos.#!"
ev10.89.desc0:0 "[bmage.GetTitledFirstNameNoTooltip] toma ahora la palabra.\n"
ev10.89.desc1:0 "«[magic_art.GetName] debería quedar en manos del Consejo. Creo que soy quien está mejor cualificado para custodiar este artefacto.»"
ev10.89.desc2:0 "«[war_ruler.GetTitledFirstName] es un gobernante cuyos intereses, en ciertos asuntos, coinciden con los nuestros. Creo que deberíamos apoyar discretamente a [war_ruler.GetHerHim] para mantener la estabilidad en la región.»"
ev10.89.desc3:0 "«Como Mago Negro, debo estar siempre preparado para actuar. Me gustaría que el Consejo cubriera el coste de adquirir pociones que me ayuden a mantener este estado de alerta.»"
ev10.89.desc4:0 "«[troublemaker.GetTitledFirstName] está causando problemas: lanza hechizos sin cuidado sobre gente al azar como un demente. [troublemaker.GetSheHe|U] está arruinando la reputación de todos los magos.»"
ev10.89.a:0 "El Consejo custodiará el artefacto."
ev10.89.b:0 "No puedes quedártelo para ti."
ev10.89.c:0 "[magic_art.GetName] permanecerá donde está."
ev10.89.d:0 "Apoyaremos a [war_ruler.GetHerHim]."
ev10.89.e:0 "No nos inmiscuiremos en política local."
ev10.89.f:0 "Recibirás oro para pociones."
ev10.89.g:0 "Arréglatelas con tus propios recursos."
ev10.89.h:0 "Arrestad a [troublemaker.GetHerHim]."
ev10.89.i:0 "No veo que esto sea un problema."
troublemaker_arrested:0 "El alborotador ha sido arrestado"
ev10.90.a:0 "Deberíamos reforzar nuestro presupuesto."
ev10.90.b:0 "El Consejo debería revelar su existencia al resto del mundo."
ev10.90.b_ct:0 "El mundo conocerá la existencia del Alto Consejo."
ev10.90.b_ct2:0 "Cada gobernante podrá financiar al Consejo, y quizá contar con su apoyo."
ev10.90.b_ct3:0 "Los cazadores de brujas podrían interesarse por los miembros del Consejo."
mc_approval:0 "Aprobación"
mc_rejection:0 "Rechazo"
ev10.90.c:0 "Necesitamos consolidar nuestra influencia en [target.GetName]."
ev10.90.d:0 "[pvassal.GetTitledFirstName] se convertirá en nuestro títere si apoyamos a [pvassal.GetHerHim]."
ev10.90.e:0 "Deberíamos golpear a [admin_rival.GetTitledFirstName]."
ev10.91.desc0:0 "$mc_admin_modifier$, [admin.GetTitledFirstNameNoTooltip], ha decidido presentar su propia propuesta.\n"
ev10.91.desc1:0 "«Nuestra tesorería está en una situación terrible. Propongo que cada uno de nosotros contribuya con el 20 % de sus fondos al Consejo.»"
ev10.91.desc2:0 "«$ev10.90.b$ Esto nos facilitará influir en otros gobernantes: a veces ciertos asuntos se gestionan mejor de forma oficial y diplomática que mediante manipulación y métodos turbios.»"
ev10.91.desc3:0 "«$ev10.90.c$ Repartir unos cuantos sobornos hará que muchas personas importantes sean más receptivas a nuestras sugerencias.»"
ev10.91.desc4:0 "«Hace poco he contactado con [pvassal.GetTitledFirstName]. [pvassal.GetSheHe|U] parece un buen candidato para convertirse en nuestro títere. Quizá sería posible instalar a [pvassal.GetHerHim] en el trono.»"
ev10.91.desc5:0 "«Hay una persona que está perturbando nuestros intereses: [admin_rival.GetTitledFirstName]. Deberíamos actuar contra este alborotador. Usemos nuestra influencia para destruir su reputación.»"
ev10.91.a:0 "No es el momento adecuado."
ev10.91.b:0 "Me parece bien."
ev10.91.c:0 "Sí, moveremos los hilos adecuados."
ev10.91.d:0 "[admin_rival.GetTitledFirstName] no es nuestro enemigo."
amage_rep1_admin_rep6_ct:0 "El consejo usó su influencia para sabotear la reputación del gobernante."
ev10.92.title:0 "Fin de la reunión"
ev10.92.desc:0 "Parece que ya se han tratado todos los temas importantes. Es hora de volver a los deberes habituales."
ev10.92.a:0 "Levanto la sesión."
ev10.92.a_ct:0 "La reunión secreta está llegando a su fin."
ev10.92.b:0 "Es hora de volver a la vida cotidiana."
ev10.93.title:0 "Desde las sombras"
ev10.93.desc:0 "Desde hace tiempo circulan especulaciones sobre la existencia de una organización secreta que manipula a los gobernantes e influye sutilmente en el curso de los acontecimientos. Los poderosos de este mundo siempre habían negado esos rumores... hasta hoy. La organización secreta que se hace llamar el Alto Consejo de Magos ha decidido revelar su existencia. Se desconoce desde hace cuánto tiempo sus maquinaciones guían la geopolítica o hasta dónde alcanza su influencia; sin embargo, muchos aseguran que el poder del Alto Consejo supera al de numerosos imperios. Sin duda, esta organización encontrará tantos partidarios como enemigos."
ev10.93.a:0 "Esto es solo el comienzo."
ev10.93.b:0 "El Consejo está dando un paso audaz."
ev10.93.c:0 "Esto lo cambia todo."
ev10.94.title:0 "Medidas extraordinarias"
ev10.94.desc0:0 "El Archimago se refirió a la crisis actual: la situación es muy grave.\n"
ev10.94.desc1:0 "El Consejo acordó que deben tomarse medidas extraordinarias para garantizar que la amenaza sea eliminada por completo."
ev10.94.a:0 "Necesito vuestro apoyo incondicional."
ev10.94.b:0 "Usaré todos los recursos para detener la amenaza."
ev10.94.c:0 "Esperemos que esto baste."
ask_mc_for_support_interaction:0 "Pedir apoyo al Alto Consejo"
ask_mc_for_support_interaction_desc:0 "El [high_mage_council|E] puede apoyar a sus simpatizantes de muchas formas."
ask_mc_for_support_interaction_ct:0 "El Archimago considerará tu petición."
ARCHMAGE_BUSY_TEXT:0 "El archimago no acepta peticiones en este momento."
MC_NO_FUNDS_TEXT:0 "El Alto Consejo no tiene fondos para apoyar a nadie."
MC_YOU_ARE_EXC_TEXT:0 "Estás excluido de la sociedad mágica."
mc_support_o1:0 "Pedir protección"
mc_support_o2:0 "Pedir financiación para investigación"
mc_support_o3:0 "Pedir acceso al Lugar de Poder"
mc_support_o4:0 "Pedir un mago de la corte"
mc_support_o5:0 "Pedir apoyo en la guerra"
mc_protection_modifier:0 "Bajo la protección del Alto Consejo"
mc_place_of_power_modifier:0 "Acceso al Lugar de Poder"
mc_support_o4_ct:0 "#P Un hechicero competente se unirá a tu corte.#!"
mc_support_o5_ct:0 "#P El Archimago debilitará a tus enemigos con un hechizo o se unirá a la guerra.#!"
ev10.95.desc:0 "Te escribo como estudioso instruido de la magia y miembro de la comunidad de brujas y magos.\n"
ev10.95.desc1:0 "Te escribo como leal simpatizante del Alto Consejo de Magos. Reconozco tu influencia y sé que sois una organización a tener en cuenta. Espero que aprecies mi apoyo y, a cambio, me ayudes con un asunto.\n"
ev10.95.desc2:0 "Temo por mi vida; mis enemigos quieren verme muerto. Quisiera pedir que el Consejo use medios mágicos o convencionales para proteger a su aliado."
ev10.95.a:0 "Enviaremos algunos agentes."
ev10.95.b:0 "...para que sean nuestros ojos en la región."
ev10.95.c:0 "No, no somos aliados."
ev10.95.d:0 "No tengo tiempo para tonterías."
ev10.95.d_ct:0 "Durante los próximos cinco años, todas las peticiones similares serán rechazadas automáticamente."
ev10.96.desc:0 "La investigación que estoy llevando a cabo requiere una financiación considerable. ¿Puedo contar con el apoyo del Alto Consejo?"
ev10.97.desc:0 "Practicar la brujería me resultaría mucho más fácil si tuviera acceso a un lugar de poder. ¿Podría usar el tuyo?"
ev10.98.desc:0 "Necesito urgentemente un mago de la corte competente. ¿Puede el Consejo designar a alguien? Estaré encantado de pagar en oro."
ev10.98.a:0 "Me ocuparé de esto personalmente."
ev10.98.b:0 "Convenceré a [c1.GetTitledFirstName]."
ev10.98.c:0 "[c2.GetTitledFirstName] podría aceptar."
ev10.98.d:0 "Hablaré con [c3.GetTitledFirstName]."
ev10.98.e:0 "No tenemos magos disponibles."
ev10.99.desc:0 "Necesito apoyo en mi esfuerzo bélico. Seguro que el Consejo puede ayudarme de algún modo en mis campañas de guerra."
ev10.99.a:0 "Podemos ofrecer apoyo económico."
ev10.99.b:0 "Usaré un hechizo de tornado."
ev10.99.c:0 "Me uniré a esta guerra sin más."
ev10.99.d:0 "No podemos ayudarte."
ev10.100.desc:0 "Tu poder es inmenso y su alcance llega muy lejos. Muchos creen que eres el ser más poderoso de este mundo."
ev10.100.a:0 "Yo también lo creo."
ev10.100.b:0 "Mi poder es considerable, pero no soy un dios."
trait_track_necromancer2:0 "Poderes oscuros"
trait_track_necromancer2_desc:0 "Los poderes aumentan pasivamente con el tiempo."
necromancer2_special1_terrain_cancel_negative_supply:0 "El daño de [necrotic_element_i|E][necrotic_element|E] no afecta a tu resistencia"
necromancer2_special2_terrain_cancel_negative_supply:0 "Desbloquea #italic $death_wish$ hechizo#!"
magic_inception_interaction:0 "Implantación mental"
magic_inception_interaction_desc:0 "La implantación mental permite introducir un pensamiento en la mente del objetivo, de modo que este lo reconocerá como si fuera suyo. Es la forma suprema de manipulación mágica."
magic_inception_terrain_cancel_negative_supply:0 "Desbloquea #italic $magic_inception_interaction$ hechizo#!"
magic_inception_option_title:0 "Pensamiento implantado"
magic_inception_o1:0 "«La violencia no es la solución.»"
magic_inception_o2:0 "«Estoy cansado de gobernar, tan cansado...»"
magic_inception_o3:0 "«¡Alcanzaré la verdadera grandeza!»"
magic_inception_o4:0 "«Estoy completamente perdido.»"
magic_inception_o5:0 "«Debería ser más comprensivo con los demás.»"
magic_inception_o6:0 "«Debería confesar mis pecados.»"
magic_inception_o7:0 "«Creo que le debo un favor a alguien.»"
magic_inception_o6_ct:0 "Revela todos los secretos personales"
magic_inception_o4_ct:0 "Termina todos los planes"
magic_inception_effect_ct:0 "El objetivo del hechizo puede cambiar de personalidad o tomar decisiones inesperadas."
antimagic_seal:0 "Sello antimagia"
antimagic_seal_desc:0 "Este hechizo sustituye el aura normal por un aura antimagia que anula por completo los hechizos en las inmediaciones."
antimagic_seal_modifier:0 "$antimagic_seal$"
antimagic_seal_modifier_desc:0 "$antimagic_seal_desc$"
HAVE_ANTIMAGIC_SEAL:0 "¡Estás sometido al Sello antimagia!"
HAS_ANTIMAGIC_SEAL:0 "¡El objetivo está sometido al Sello antimagia!"
antimagic_seal_terrain_cancel_negative_supply:0 "Desbloquea #italic $antimagic_seal$ hechizo#!"
antimagic_seal_terrain2_cancel_negative_supply:0 "[magic_immunity2|E] a #P todos los hechizos#!"
antimagic_seal_terrain3_cancel_negative_supply:0 "Estabiliza inmediatamente la fuente"
antimagic_seal_terrain4_cancel_negative_supply:0 "No puede lanzar hechizos"
antimagic_seal_terrain5_cancel_negative_supply:0 "No puede participar en duelos de magos"
ev10.101.desc:0 "Esta mañana, [golem.GetTitledFirstName] te pidió hablar contigo. [golem.GetSheHe|U] te dijo que le gustaría ver el mundo y encontrar su destino y su propósito en la vida; desea emprender un viaje y experimentar la vida como lo hace la gente."
ev10.101.a:0 "No, eres mi sirviente y se te necesita aquí."
ev10.101.b:0 "Si es así, buena suerte."
ev10.101.c:0 "Adiós, mis pensamientos estarán contigo."
ev10.9.c:0 "El sello antimagia me protegerá, pero los demás..."
ev10.104.desc:0 "Como tejedor de hechizos, participas en el ritual del Hechizo Supremo, que puede tener consecuencias enormes a escala global. [sowner.GetTitledFirstName] controla el ritual y [sowner.GetSheHe] recibirá cualquier beneficio que surja de él. Sin embargo, ¿es [sowner.GetSheHe] la persona adecuada para controlar semejante poder? Podrías introducir sutilmente algunas modificaciones en el ritual que te permitieran tomar el control de sus efectos. Otros lo verían como una traición, pero quizá el premio merezca el riesgo."
ev10.104.0.a:0 "Tengo que hacerlo."
ev10.104.0.a_ct:0 "Si el ritual tiene éxito, controlarás el resultado."
ev10.104.0.a_ct2:0 "Los demás magos considerarán tu acto una traición."
ev10.104.0.b:0 "No, me importa mi reputación."
ev10.105.title:0 "El Hechizo Supremo - El traidor"
ev10.105.desc:0 "El Ritual del Hechizo Supremo es complejo, así que no advertiste de inmediato que algo iba mal. Alguien ha introducido en secreto una modificación en la invocación. Si el ritual se completa, perderás el control del hechizo: otra persona se apoderará de él y lo usará para sus propios fines. Debe de ser uno de tus tejedores de hechizos. No hay manera de saber cuál de ellos es el traidor, pero la única forma de frustrar sus planes es excluirlo del ritual antes de que sea demasiado tarde."
ev10.105.0.a:0 "No confío en [sw1.GetTitledFirstName]."
ev10.105.0.b:0 "[sw2.GetTitledFirstName] quedará excluido."
ev10.105.0.c:0 "Podemos arreglárnoslas sin [sw3.GetTitledFirstName]."
ev10.106.desc:0 "El hechizo tuvo éxito, pero el traidor se hizo con el control. ¡Era [straitor.GetTitledFirstName]! Ahora el poder del Hechizo Supremo servirá a sus propósitos."
ev10.106.0.a:0 "Ha sido retorcido."
ev10.106.0.b:0 "[straitor.GetSheHe|U] pagará por ello."
ev10.107.desc:0 "Tus sueños de hoy estaban llenos de brutalidad, sangre y violencia. Al despertar, descubriste que tenías sangre en las manos. No recuerdas nada, pero por la mañana todo el mundo habla de los brutales asesinatos ocurridos en la zona. Al parecer, los cometió una bestia salvaje, porque los cuerpos están despedazados."
ev10.107.a:0 "En cualquier caso, me siento mucho mejor que ayer."
ev10.108.desc:0 "La noticia de la muerte de dos personas conmocionó la zona. Se desconoce quién es el responsable, quizá animales salvajes, pues los cuerpos están en muy mal estado. Sin embargo, el rumor dice que lo hizo un monstruo... o un demonio."
ev10.108.a:0 "Será mejor avisar a los guardias para que permanezcan alerta."
ev10.108.b:0 "Las heridas apuntan claramente a un demonio."
harmonius_name:0 "Harmonius"
ev10.109.desc:0 "Un demonio apareció en el círculo de invocación. Su rostro escamoso se iluminó al verte con un entusiasmo malsano.\n\"¡Hola, hola! ¡Soy yo, Harmonius el Magnífico, que acude a tu llamada!\""
ev10.109.a:0 "Excelente, ¿qué puedes ofrecerme, demonio?"
ev10.110.desc:0 "Hoy estás de suerte, porque te has cruzado con un maestro. ¡Yo soy el vencedor del silencio, el tallador del ritmo, el encantador del sonido, el rey del escenario y un humilde músico, todo en uno! Mi arte es conocido en todos los círculos del Infierno; cada demonio conoce mi nombre y mis talentos musicales. Estoy encantado de presentarte mi canción insignia, titulada: 'Canción de la alondra'."
ev10.110.a:0 "Por qué no. Escucharé."
ev10.110.b:0 "No, estás aquí para conceder mi deseo."
ev10.111.desc0:0 "El demonio ignoró por completo tus palabras y empezó a \"cantar\".\n"
ev10.111.desc:0 "Al principio pensaste que era un terremoto, pero no era más que una cacofonía de sonidos horribles que te golpeó con la fuerza del martillo de un herrero. Cuesta llamarlo música, pero desde luego sacude al oyente. No tienes idea de cómo un solo ser puede producir semejantes ruidos, ni entiendes palabra alguna, si es que realmente las hay. Lo único que sabes es que el tema principal parece compuesto por los chillidos de un cerdo degollado. En realidad, de muchos cerdos."
ev10.111.a:0 "No... para..."
ev10.112.desc:0 "La \"música\" fue cobrando intensidad. Sientes como si el cerebro estuviera a punto de salirte por los oídos, te invade la náusea y tiemblas de arriba abajo. De pronto, el demonio dejó de emitir sonidos, cayó un silencio sepulcral y el \"artista\" hizo una reverencia ante ti."
ev10.112.a:0 "Esto es lo peor que he oído en mi vida."
ev10.112.b:0 "Inspirador."
ev10.112.c:0 "Hermoso."
ev10.113.desc:0 "«Bueno, gracias. Temía que la humanidad no estuviera preparada para el verdadero arte, pero veo que te subestimé. ¿Listo para la siguiente pieza? La llamé 'Copo de nieve', aunque en el Infierno la llaman 'Cabeza explosiva'. Ya sabes, ha habido víctimas en mis actuaciones... pero, en esencia, es una gran canción, un poco más potente que la anterior. ¿Preparado?»"
ev10.113.a:0 "¡No, desaparece!"
ev10.113.b:0 "Te convertirás en mi músico de corte."
ev10.113.c:0 "Seguro que [riv.GetTitledFirstName] querrá escuchar esto."
ev10.113.c_ct:0 "El demonio será enviado a tu rival."
ev10.113.d:0 "Más tarde. Por ahora, te quedarás en mi corte."
ev10.114.opening:0 "[riv.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
ev10.114.desc:0 "Al parecer, me enviaste a ese maldito demonio. Si es cierto, debes saber que eres la peor escoria de este mundo. Te destruiré."
ev10.114.a:0 "Me gustaría recibir cartas como esta más a menudo."
ev10.116.title:0 "Aldea destruida"
ev10.116.desc:0 "Han llegado noticias de que una de las aldeas bajo tu autoridad ha sido completamente destruida. Las chozas parecen haber sido arrasadas por un huracán y no ha sobrevivido nadie. La gente dice que es la ira de Dios desatada contra los pecadores."
ev10.116.a:0 "Recemos por el perdón."
ev10.116.b:0 "Puede que haya fuerzas sobrenaturales implicadas."
ev10.116.c:0 "Buscaré respuestas en el Orbe de la Verdad."
ev10.117.desc:0 "Has logrado usar el Orbe de la Verdad para mirar al pasado. Ves con claridad que [demon1.GetTitledFirstName] es responsable de la destrucción de la aldea. [demon1.GetSheHe|U] cayó en una furia demoníaca, se transformó en un auténtico monstruo y borró la aldea de la faz de la tierra."
ev10.117.a:0 "Esperaba algo así."
ev10.118.title:0 "Vasallo sanguinario"
ev10.118.desc:0 "Corren rumores inquietantes sobre [demon1.GetTitledFirstName]. Al parecer, en sus tierras están ocurriendo cosas espantosas: la región se está despoblando, los templos arden en incendios misteriosos y por la noche emergen monstruos de los bosques. Sin embargo, es a [demon1.GetTitledFirstName] a quien más temen sus súbditos."
ev10.118.a:0 "Probablemente haya algo de verdad en estos rumores."
ev10.118.b:0 "Al fin y al cabo, [demon1.GetSheHe] es un demonio."
ev10.119.title:0 "$trait_demon$"
ev10.119.desc:0 "Últimamente tenías un problema con la desaparición de sirvientes. Se sospechaba que no les gustaba el trabajo y que se marchaban sin despedirse, pero el asunto se aclaró por accidente. Uno de los sirvientes, que todavía no había desaparecido, encontró numerosos restos humanos en los aposentos de [demon1.GetTitledFirstName]."
ev10.119.a:0 "Las pruebas son inequívocas."
ev10.119.b:0 "No hace falta montar un escándalo por esto."
ev10.119.a1:0 "El arresto tuvo éxito"
ev10.119.a2:0 "El culpable escapó"
