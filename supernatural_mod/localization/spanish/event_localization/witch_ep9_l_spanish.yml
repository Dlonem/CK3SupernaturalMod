l_spanish:
TRAVEL_NAME_FOR_mages_summit:0 "Tu llegada a la Cumbre de Magos"
mages_summit_activity:0 "$mages_summit$"
game_concept_md_elements:0 "Elementos mágicos"
game_concept_md_elements_desc:0 "Los hechizos de combate se componen de Elementos, que son la fuente del daño y otros efectos del hechizo."
game_concept_md_power:0 "@power_element_icon!$game_concept_power_element$"
game_concept_md_fire:0 "@fire_element_icon!$game_concept_fire_element$"
game_concept_md_kinetic:0 "@kinetic_element_icon!$game_concept_kinetic_element$"
game_concept_md_shadow:0 "@shadow_element_icon!$game_concept_shadow_element$"
game_concept_md_necrotic:0 "@necrotic_element_icon!$game_concept_necrosis$"
game_concept_power_element:0 "Poder"
game_concept_power_element_i:0 "@power_element_icon!"
game_concept_power_element_i2:0 "@no_power_element_icon!"
game_concept_power_element_desc:0 "El daño de Poder es una forma sencilla y a menudo eficaz de avasallar a un oponente.\n$EFFECT_LIST_BULLET$El daño de Poder no tiene efectos adicionales."
power_element_tooltip:0 "@power_element_icon! #t $game_concept_power_element$#!\n$game_concept_power_element_desc$"
power_element_icon_with_desc:0 "[power_element_i|E]"
no_power_element_icon_with_desc:0 "[power_element_i2|E]"
game_concept_fire_element:0 "Fuego"
game_concept_fire_element_i:0 "@fire_element_icon!"
game_concept_fire_element_i2:0 "@no_fire_element_icon!"
game_concept_fire_element_desc:0 "Los hechizos de fuego están muy valorados por cualquier mago de batalla.\n$EFFECT_LIST_BULLET$Cuando infliges daño de fuego con éxito, tu oponente puede perder #N 1#! [endurance|E] (% de probabilidad por cada punto de daño de fuego infligido)."
fire_element_tooltip:0 "@fire_element_icon! #t $game_concept_fire_element$#!\n$game_concept_fire_element_desc$"
fire_element_icon_with_desc:0 "[fire_element_i|E]"
no_fire_element_icon_with_desc:0 "[fire_element_i2|E]"
game_concept_kinetic_element:0 "Cinético"
game_concept_kinetic_element_i:0 "@kinetic_element_icon!"
game_concept_kinetic_element_i2:0 "@no_kinetic_element_icon!"
game_concept_kinetic_element_desc:0 "Los hechizos cinéticos son una gran opción si quieres aplastar por completo a tu oponente.\n$EFFECT_LIST_BULLET$Cada vez que infliges más daño cinético que tu oponente, este pierde #N 1#! [endurance|E]."
kinetic_element_tooltip:0 "@kinetic_element_icon! #t $game_concept_kinetic_element$#!\n$game_concept_kinetic_element_desc$"
kinetic_element_icon_with_desc:0 "[kinetic_element_i|E]"
no_kinetic_element_icon_with_desc:0 "[kinetic_element_i2|E]"
game_concept_shadow_element:0 "Sombra"
game_concept_shadow_element_i:0 "@shadow_element_icon!"
game_concept_shadow_element_i2:0 "@no_shadow_element_icon!"
game_concept_shadow_element_desc:0 "Los hechizos de sombra son escurridizos, aunque tardan en alcanzar todo su potencial.\n$EFFECT_LIST_BULLET$Cada vez que usas el elemento de sombra, tu nivel de sombra aumenta en #P 1#!. Este efecto puede acumularse.\n$EFFECT_LIST_BULLET$Cada vez que un oponente usa un doble elemento de [power_element_i|E][power_element|E] o de [fire_element_i|E][fire_element|E], tu nivel de sombra se reduce en #N 2#!. Este efecto puede acumularse."
shadow_element_tooltip:0 "@shadow_element_icon! #t $game_concept_shadow_element$#!\n$game_concept_shadow_element_desc$"
shadow_element_icon_with_desc:0 "[shadow_element_i|E]"
no_shadow_element_icon_with_desc:0 "[shadow_element_i2|E]"
game_concept_necrotic_element:0 "Necrótica"
game_concept_necrosis:0 "Necrosis"
game_concept_necrotic_element_i:0 "@necrotic_element_icon!"
game_concept_necrotic_element_i2:0 "@no_necrotic_element_icon!"
game_concept_necrotic_element_desc:0 "Pocas criaturas son lo bastante poderosas o malignas como para emplear magia necrótica.\n$EFFECT_LIST_BULLET$El daño necrótico afecta al [power_clash|E] y a la [endurance|E] del oponente al mismo tiempo."
necrotic_element_tooltip:0 "@necrotic_element_icon! #t $game_concept_necrosis$#!\n$game_concept_necrotic_element_desc$"
necrotic_element_icon_with_desc:0 "[necrotic_element_i|E]"
no_necrotic_element_icon_with_desc:0 "[necrotic_element_i2|E]"
game_concept_magic_shield:0 "Escudo mágico"
game_concept_magic_shield_i:0 "@magic_shield_icon!"
game_concept_magic_shield_desc:0 "El escudo mágico es un componente de hechizo que bloquea el daño puro y secundario del oponente, reduciendo así la probabilidad de perder [endurance|E] y el progreso del adversario en la pista de Choque de Poder.\nUsar un escudo mágico suele tener un coste en [power_element_i|E][power_element|E]."
magic_shield_tooltip:0 "@magic_shield_icon! #t $game_concept_magic_shield$#!\n$game_concept_magic_shield_desc$"
magic_shield_icon_with_desc:0 "[magic_shield_i|E]"
game_concept_endurance:0 "Resistencia"
game_concept_endurance_i:0 "@endurance_icon!"
game_concept_endurance_desc:0 "Cuando la resistencia de un personaje cae a cero, ese personaje ya no puede continuar el duelo: la otra parte se impone."
endurance_tooltip:0 "@endurance_icon! #t $game_concept_endurance$#!\n$game_concept_endurance_desc$"
endurance_icon_with_desc:0 "[endurance_i|E]"
game_concept_magic_special_effect:0 "Efecto especial"
game_concept_magic_special_effect_i:0 "@magic_special_icon!"
game_concept_magic_special_effect_desc:0 "Algunos hechizos tienen efectos adicionales que pueden alterar el duelo de múltiples maneras."
magic_special_effect_tooltip:0 "@magic_special_icon! #t $game_concept_magic_special_effect$#!\n$game_concept_magic_special_effect_desc$"
magic_special_effect_icon_with_desc:0 "[magic_special_effect_i|E]"
game_concept_magic_damage:0 "Daño"
game_concept_magic_damage1:0 "daño principal"
game_concept_magic_damage2:0 "daño secundario"
game_concept_magic_damage3:0 "daño puro"
game_concept_magic_damage_desc:0 "El daño se inflige mediante hechizos, y su cantidad depende del nivel de los elementos asociados. Si un hechizo usa daño de un solo tipo, ese daño se clasifica como puro. Si contiene una combinación de dos tipos de daño, uno se trata como daño principal y el otro como daño secundario. Esta clasificación puede ser relevante si una de las partes usa [magic_shield|E]."
magic_element_tooltip:0 "#t Nivel del elemento#!\nEl nivel del elemento afecta a la cantidad de daño asociada a dicho elemento."
