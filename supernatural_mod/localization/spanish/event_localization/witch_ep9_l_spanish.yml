ev10.147.desc:0 "La atmósfera elevada del Gran Rito te ha inspirado a actuar. Sientes que puedes mejorar ligeramente tu amuleto protector."
ev10.147.a:0 "Añadiré una runa para reforzar el amuleto."
ev10.147.b:0 "Imbuiré el amuleto con mi magia."
ev10.148.desc:0 "A pesar del caos de la batalla, ves a [ecommander.GetTitledFirstName]. Llegar hasta allí no debería ser un problema para ti: es la oportunidad perfecta para eliminar [ecommander.GetHerHim]. Suponiendo que puedas encargarte de [ecommander.GetHerHim]..."
ev10.148.a:0 "Ha llegado la hora de un duelo de magos."
ev10.148.b:0 "Por ahora, prefiero evitar una confrontación directa."
ev10.149.desc:0 "Ves a [ecommander2.GetTitledFirstName] abrirse paso hasta tu posición, usando hechizos y su guardia personal. ¡[ecommander2.GetSheHe|U] se dirige directamente hacia ti, con intención de desafiarte!"
threaten_with_magic_interaction:0 "Amenazar con magia"
threaten_with_magic_interaction_desc:0 "Deja claro que usarás magia negra si no se cumplen tus exigencias. Por supuesto, tu amenaza puede ser un farol, sobre todo si no posees ningún poder mágico."
