magic_orb:0 "Orbe de la Verdad"
magic_orb_desc:0 "En el orbe puede contemplarse el pasado o el presente y, a veces, un atisbo de acontecimientos futuros. El orbe muestra la verdad, ni más ni menos."
ev91.1.title:0 "Bola de cristal"
ev91.1.desc:0 "Hoy te han entregado un misterioso paquete. En la caja había grabada una inscripción borrosa que, según crees, decía «Saludos de un amigo». No tienes idea de quién es ese amigo, pero dentro de la caja encuentras una esfera inusual de colores temblorosos; sin duda, un artefacto hechicero."
magic_orb_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ revela planes hostiles"
magic_orb3_terrain_cancel_negative_supply:0 "$prepare_scrying_decision$ es más efectiva"
magic_orb_terrain_advantage:0 "$prepare_scrying_decision$ tiempo de reutilización"
ev10.10.desc:0 "El orbe muestra imágenes que indican que tu vida podría correr peligro. Las visiones no son del todo claras, pero logras deducir la naturaleza de la amenaza y prepararte para ella."
ev10.10.a:0 "Los conspiradores recibirán su castigo."
ev10.10.a_ct:0 "La visión continuará."
ev10.11.desc:0 "Has contemplado el Orbe de la Verdad en busca de información y respuestas. Eres capaz de ver lugares y tiempos lejanos, pero muchas de las visiones son aleatorias y solo ejerces un control parcial sobre lo que observas."
ev10.11.a:0 "Muéstrame mi corte."
ev10.11.a_ct:0 "Puedes descubrir nuevos secretos."
ev10.11.b:0 "Muéstrame los reinos vecinos."
ev10.11.c:0 "Muéstrame el futuro."
ev10.11.c_ct:0 "Puedes experimentar una visión adicional."
ev10.11.d:0 "Muéstrame los movimientos de los ejércitos enemigos."
war_intel_modifier:0 "Información de guerra"
ev10.11.e:0 "Muéstrame a [starget.GetTitledFirstName]."
useful_intel_modifier:0 "Útil Información"
ev10.12.desc:0 "Ves tu castillo a vista de pájaro. La imagen se acerca y se emborrona, solo para recuperar la nitidez un instante después. Contemplas a tus sirvientes, guardias y cortesanos ocupados en sus asuntos cotidianos. Pasas un rato entregado a estas observaciones instructivas..."
ev10.13.desc:0 "En el orbe ves la corte de [ref.GetTitledFirstName], así como sus caballeros, cortesanos y consejeros. Estas observaciones te permiten sacar conclusiones interesantes."
ev10.14.desc:0 "Una serie de imágenes borrosas aparece en el orbe. Ves fuego, gente gritando de dolor. El orbe te muestra violencia y sufrimiento, una ciudad en llamas y cadáveres, pero no alcanzas a ver la causa ni cuándo sucederán estos hechos. ¿Mañana? ¿Dentro de cien años?"
ev10.14.a:0 "Se acerca una guerra, sin duda."
ev10.14.b:0 "Debe de tratarse de algún desastre natural."
ev10.14.c:0 "Esto es el armagedón."
ev10.14.d:0 "Seré yo quien haga esto."
war_preparation_modifier:0 "Preparativos para la guerra"
ev10.15.desc:0 "Intentas ajustar el orbe a los lugares que deseas contemplar, pero solo ves imágenes borrosas, espirales de colores y destellos de luz."
ev10.15.a:0 "Golpearé el orbe; quizá ayude."
ev10.15.b:0 "Agitaré el orbe..."
ev10.16.desc:0 "De pronto, la imagen se volvió nítida. Ves lo que parece ser una biblioteca, repleta de una cantidad enorme de libros. Justo en medio de ella ves a una criatura de rostro deforme y muchos brazos, ordenando y recolocando los libros con rapidez. La criatura se queda inmóvil de repente y su rostro se vuelve lentamente hacia ti. ¡Te ve! De pronto, un sonido agudo y aterrador te golpea: un chillido de la criatura, quizá un hechizo. La imagen se desvaneció; por lo visto, la «conexión» se había roto."
ev10.16.a:0 "¿Qué demonios ha sido eso?"
elixir_fertility_modifier:0 "Poción de fertilidad"
pot10_desc:0 "Una mezcla que puede ayudar a asegurar la sucesión."
gain_pot10_ct:0 "Obtienes $elixir_fertility_modifier$"
use_pot10a_loc:0 "Poción de fertilidad (para mí)"
use_pot10b_loc:0 "Poción de fertilidad (para mi consorte)"
ev10.17.desc:0 "Ves que el artefacto ha cambiado su estructura, adaptándose a la forma de tu mano. Está listo y preparado para usarse."
magic_catalyst_desc2:0 "Una piedra misteriosa que, según las leyendas, cayó del cielo hace eones."
cut_schemes_decision_title:0 "Combatir las intrigas"
cut_schemes_decision_desc:0 "Eres consciente de las conspiraciones que se traman contra ti: todos los recursos deben emplearse en combatirlas antes de que sea demasiado tarde."
cut_schemes_decision_ct:0 "Intentarás frustrar los planes de los conspiradores."
ev10.18.desc:0 "Hay conspiradores tramando algo contra ti y podrían actuar en cualquier momento. Debes dar órdenes a tus guardias, iniciar interrogatorios y ofrecer recompensas a cambio de información sobre los traidores. Que sientan que sus actos no quedarán impunes."
ev10.18.a:0 "Pondré patas arriba toda mi corte."
ev10.18.b:0 "Este trabajo es para mi maestro de espías."
ev10.18.b_ct:0 "El maestro de espías fracasa."
ev10.18.a_ct1:0 "Un plan hostil será desbaratado."
ev10.18.a_ct2:0 "Uno de los conspiradores puede ser arrestado."
ev10.18.a_ct3:0 "#N Tu plan ha sido interrumpido.#!"
ev10.18.a_ct4:0 "Pueden revelarse otros planes."
ev10.18.c:0 "Leeré los pensamientos de mis cortesanos."
ev10.18.c_ct:0 "Usarás el hechizo $mind_scan$"
