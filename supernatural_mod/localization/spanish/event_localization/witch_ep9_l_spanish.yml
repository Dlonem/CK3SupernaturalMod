ev10.19.a:0 "Me deleito jugueteando con corazones mortales"
ev10.19.b:0 "La violencia será mi lenguaje."
ev10.19.c:0 "El conocimiento y la sutileza serán mis armas."
ev10.20.desc:0 "Te despiertas por la mañana de un humor excelente, pero con un enorme vacío en la memoria. No tienes idea de qué ocurrió durante la noche, aunque los sirvientes están claramente asustados de ti. El ambiente parece extrañamente tenso, pero no te importa; sientes como si te hubieras quitado un peso enorme de encima."
ev10.20.a:0 "Qué mañana tan encantadora."
ev10.21.desc:0 "Permanecer en una celda se volvió aburrido muy deprisa, y hasta empezó a sacarte de quicio. Así que rompiste las cadenas, destrozaste la puerta y mataste a algunos de los guardias que merodeaban por allí. Al instante te sentiste mejor."
ev10.21.a:0 "Es hora de volver a casa."
ev10.21.a_cct:0 "Tus guardias han sido masacrados y el prisionero ha escapado."
ev10.22.desc:0 "No recuerdas gran cosa de las últimas horas, pero te despertaste cubierta de sangre. Todo el castillo apesta a azufre y también ves huellas de destrucción. Han aparecido cuerpos humanos despedazados en una de las estancias; cuesta identificarlos, pero varios guardias y sirvientes han desaparecido sin dejar rastro. Los testigos aseguran que una criatura de la altura de dos hombres, con alas en llamas y enormes garras, entró en el castillo durante la noche sembrando la destrucción."
ev10.22.a:0 "Que los guardias busquen al culpable."
ev10.22.b:0 "Bueno, fui yo."
