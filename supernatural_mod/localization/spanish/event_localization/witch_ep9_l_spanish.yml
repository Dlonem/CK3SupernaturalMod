appoint_me_to_high_council_interaction_desc:0 "$appoint_me_to_high_council_interaction$"
MC_APP_PROPOSAL1:0 "Deseo solicitar una nominación al Alto Consejo de Magos para el puesto de $mc_loremaster_modifier$. Creo que soy un candidato excelente y que contribuiré mucho a la labor del Consejo."
MC_APP_PROPOSAL2:0 "Deseo solicitar una nominación al Alto Consejo de Magos para el puesto de $mc_black_mage_modifier$. Creo que soy un candidato excelente y que contribuiré mucho a la labor del Consejo."
MC_APP_PROPOSAL3:0 "Deseo solicitar una nominación al Alto Consejo de Magos para el puesto de $mc_admin_modifier$. Creo que soy un candidato excelente y que contribuiré mucho a la labor del Consejo."
mc_meeting_decision_confirm:0 "Llamar a reunión"
mc_meeting_decision_name:0 "Convocar reunión secreta del Alto Consejo"
mc_meeting_decision_desc:0 "El Consejo se reunirá para debatir la situación actual."
mc_meeting_decision_ct:0 "El Alto Consejo comenzará su reunión de inmediato."
MC_HAS_FREE_SLOTS:0 "No todos los puestos del Consejo están ocupados."
MC_HAS_IMPRISONED_MEMBER:0 "No todos los miembros del consejo pueden asistir a la reunión."
MC_HAS_INTERNAL_WAR:0 "Estás en guerra con un miembro del consejo."
mc_admin_special1_terrain_cancel_negative_supply:0 "Obtienes acceso a la [decision|E] $mc_manage_funds_decision_name$"
mc_manage_funds_decision_name:0 "Gestionar los fondos del Consejo"
mc_manage_funds_decision_desc:0 "La magia y el oro son las principales herramientas con las que el Consejo puede influir en el mundo. El Administrador del Consejo es responsable de gestionar los recursos financieros."
mc_manage_funds_decision_ct:0 "Podrás aumentar o reducir los [mc_funds|E]."
