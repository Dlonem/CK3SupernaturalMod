ev7.105.l:0 "La Singularidad Antigua debería ser sellada."
ev7.105.l_ct:0 "La Singularidad Antigua será desactivada."
ev7.105.l_flav:0 "Nadie debería blandir semejante poder en solitario."
ev10.158.title:0 "Voluntad de la Congregación"
ev10.158.desc:0 "La Congregación de Magos ha decidido que la Singularidad Antigua debe ser destruida o desactivada. No existe apelación contra esta decisión; debes hacerlo de inmediato. Por supuesto, puedes oponerte, pero las consecuencias serán importantes."
ev10.158.a:0 "Cumpliré su voluntad."
ev10.158.b:0 "¡Jamás aceptaré esto!"
asmodeus_beaten:0 "¡Asmodeo derrotado!"
ev10.159.desc:0 "Ahora eres el rector de la Academia de Magia. El funcionamiento y la política de la institución quedan por completo sometidos a tu voluntad."
ev10.159.a:0 "¡Mi escuela estará abierta a todo el mundo!"
ev10.159.a_ct:0 "Desbloquea el Enfoque Arcano para cada verdadera bruja."
ev10.159.a_ct2:0 "El próximo rector podrá revocar esta decisión."
ev10.159.b:0 "La Academia estará disponible para mi Casa."
house_magic_academy_modifier:0 "$building_mage_house$"
ev10.159.c:0 "Implantaré una selección estricta de estudiantes."
ev10.159.c_ct:0 "De vez en cuando, puede aparecer un nuevo mago en tu corte."
ev10.159.d:0 "La academia servirá únicamente a mis propias investigaciones."
ev10.160.title:0 "Mago formado en la academia"
spell_will_be_cast_ct:0 "El hechizo será lanzado."
magic_target_confirmed_ct:0 "¡Tus enemigos han sido atacados con un hechizo!"
ev2.5.g:0 "Sabotearé su investigación."
ev2.5.g_ct:0 "¡Tu investigación ha sido saboteada!"
ev10.161.title:0 "Fallo en la Singularidad"
ev10.161.desc:0 "Últimamente has notado que la Singularidad Antigua presenta un comportamiento anómalo. A veces emite sonidos extraños o tiembla cuando intentas usarla. Y cuando lo haces, su poder parece más caótico, lo que reduce su precisión. Eso no importa demasiado dado su enorme radio de explosión, pero sigue siendo preocupante. Has conseguido acceder a los indicadores ocultos en el guante, aunque no los entiendes; salvo por un detalle: todos se iluminan en rojo, y eso probablemente no sea buena señal."
ev10.161.a:0 "Intentaré recalibrar el guante."
ev10.161.b:0 "Seguramente no haya nada de qué preocuparse, ¿verdad?"
ev10.162.desc:0 "Durante los últimos días has realizado numerosas mediciones y estudios sobre la Singularidad, pero no tienes ni idea de cómo reparar el fallo, suponiendo que de verdad se trate de un fallo. Lo único que has logrado averiguar es que el artefacto está sobrecargado, y que cada uso adicional podría provocar una explosión masiva."
ev10.162.a:0 "Quizá debería deshacerme de ella."
ev10.163.desc:0 "Hoy has notado que la Singularidad emite un ligero humo. También percibes que el artefacto ha empezado a desprender una intensa radiación, probablemente muy perjudicial para la salud."
ev10.163.a:0 "¡Este artefacto está maldito!"
ev10.164.title:0 "¡La Singularidad Antigua explota!"
