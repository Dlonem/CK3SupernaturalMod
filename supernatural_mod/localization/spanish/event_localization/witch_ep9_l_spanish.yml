game_concept_undetectable_spells_desc:0 "Los hechizos indetectables no pueden ser percibidos por personajes con sentido mágico. Sin embargo:\n$EFFECT_LIST_BULLET$Los magos legendarios con sentido mágico aún pueden detectar tus hechizos.\n$EFFECT_LIST_BULLET$Tu hechizo será detectado por el hechicero que lo contrarreste, pero no será posible determinar quién lo lanzó."
