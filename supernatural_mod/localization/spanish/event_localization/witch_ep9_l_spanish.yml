di_mammon_support_modifier:0 "Apoyado por Mammon"
di_abraxas_support_modifier:0 "Apoyado por Abraxas"
di_astaroth_support_modifier:0 "Apoyado por Astaroth"
ev10.121.title:0 "El Apocalipsis"
ev10.121.desc:0 "Han llegado noticias terribles desde [evil_seed.GetName]. Se dice que el gobernante de esas tierras fue derrocado y asesinado durante un golpe palaciego. Ahora reina allí un caballero desconocido que, acompañado por un pequeño grupo de partidarios, tomó el poder con rapidez e impuso un orden sangriento en el reino. Supuestamente se hace llamar Bael, aunque no está claro si ese es un apodo o su verdadero nombre. Dicen que no es humano, que el acero no puede herirlo, que mata con una mirada y que puede leer la mente. Muchos creen que esto es el cumplimiento de una profecía y el presagio del inminente fin del mundo. Sea cierta o no toda esa historia, las ambiciones de Bael son enormes, y sus ejércitos crecen cada día."
ev10.121.a:0 "Puede ser una amenaza."
di_supports_title:0 "¡Bael pierde un aliado!"
di_supports_ct:0 "Bael se debilita al perder apoyos."
ev10.122.desc:0 "Ante ti apareció Hécate en un destello mágico.\n«Ah, no tienes ni idea de lo difícil que es llegar a la Tierra si ningún mago te está invocando. Es todo un reto, incluso para una maestra de la magia.»"
ev10.122.a:0 "¿Qué haces aquí?"
ev10.123.desc:0 "«He venido a advertirte. Bael ha llegado.»"
ev10.123.a:0 "He oído algunos rumores."
ev10.124.desc:0 "«Esto es una invasión en toda regla. Bael pretende conquistar este mundo y convertir a los humanos en sus esclavos; al menos, a los que sobrevivan. Tiene los recursos necesarios para lograrlo.»"
ev10.124.a:0 "Debe ser detenido."
ev10.124.b:0 "¿Por qué es eso mi problema?"
ev10.125.desc:0 "«Bael acabará antes o después por empezar a exterminar a los magos locales. En esencia, tú eres la única amenaza para él. Sin embargo, también tiene enemigos fuera que te envían sus saludos. Estás en una situación difícil, pero —aunque no puedo intervenir abiertamente— sí puedo transmitirte información útil.»"
ev10.125.a:0 "Bien. ¿Quién es ese Bael?"
ev10.126.title:0 "Preparativos para el Apocalipsis"
ev10.126.desc:0 "Es uno de los príncipes demoníacos: un ser ambicioso y sediento de sangre. Es guerrero y líder, y en otro tiempo gobernó uno de los círculos del Infierno. Ahora quiere recuperar su prestigio y su rango. Pero ese no es el verdadero problema. Según una antigua regla, el Apocalipsis llega de cuatro en cuatro. A Bael se le han unido Abraxas, Mammon y Astaroth. Juntos podrían aplastar con facilidad a cualquier enemigo."
ev10.126.a:0 "Háblame de Mammon."
ev10.126.b:0 "¿Quién es Abraxas?"
ev10.126.c:0 "¿Qué sabes de Astaroth?"
ev10.127.a:0 "Gracias por la información."
ev10.127.desc:0 "¿No has conocido a Mammon? Finge ser ingenuo, pero es un jugador veterano. Se alimenta de la codicia humana y posee un talento especial para la transmutación. Mientras siga en juego, a Bael no le faltarán ni oro ni aliados."
ev10.128.desc:0 "Abraxas es mi rival eterno. Le encantaría ocupar mi puesto en la corte de Lucifer como su mago de cámara, pero no llega ni a la mitad de lo que soy yo. Aun así, debo admitir que conoce unos cuantos buenos hechizos. Sin duda protegerá a Bael contra cualquier ataque mágico y puede ser peligroso incluso para un mago competente."
ev10.129.desc:0 "Astaroth, el «Sabueso Infernal». Es el principal cazador del Infierno, un cazarrecompensas y ejecutor enviado tras las almas de los mortales especialmente obstinados. También es el gran campeón de Lucifer, probablemente el más eficaz desde Kali, la «Matadioses». Él... nosotros estuvimos muy unidos. Mucho. Por eso conozco el secreto de su poder."
ev10.129.a:0 "Entiendo que compartirás ese secreto conmigo, ¿verdad?"
 ev10.130.desc:0 "«Sí, pero eso no cambiará nada. Astaroth es un antimago, capaz de suprimir la magia a su alrededor con solo su voluntad. Nunca dijo de dónde obtuvo ese poder; quizá sea un don de alguna deidad. Así que no lo derrotarás con un hechizo. Tampoco lo derrotarás con una espada, pues es un maestro de la espada con mil años de experiencia. No lograrás sorprenderlo porque no lo encontrarás: él te encontrará a ti. Y ese será tu fin. Es imbatible e imparable, sin debilidades.»\nEn la voz de Hécate oyes una fascinación malsana y una admiración evidente. Quizá no todos los viejos sentimientos se hayan desvanecido."
ev10.130.a:0 "Suena como un adversario formidable."
ev10.131.desc:0 "Esperemos que Bael no lo envíe contra ti. Creo que hasta él le teme. De hecho, probablemente todos, salvo Lucifer y Asmodeus, temen a Astaroth."
ev10.132.desc:0 "«Eso es todo lo que puedo hacer por ti. Tus posibilidades no son grandes, pero... espero que guardes un as en la manga. Buena suerte.» Tras aquellas palabras, la demonia desapareció."
ev10.132.a:0 "Gracias por creer en mí..."
ev10.134.desc:0 "Aquella noche no podías dormir. No hacías más que dar vueltas en la cama, lleno de malos presentimientos. Finalmente, en mitad de la noche, decidiste dar un breve paseo para despejarte. Cuando te estabas levantando de la cama, la puerta de tu alcoba explotó. Un intruso entró como la propia muerte. Por instinto, intentaste lanzar algún hechizo, pero tu poder te había abandonado. ¡Antimagia! De eso había hablado la demonia Hécate. El sabueso infernal había venido a por ti."
ev10.134.a:0 "¡Cogeré mi espada!"
ev10.134.b:0 "¡Rápido, a la ventana!"
ev10.134.vamp_escape:0 "¡Pasa a su lado a toda velocidad y toma la puerta!"
ev10.134.vamp_escape_tt:0 "Sales disparado hacia delante: para cuando su acero reluce, ya has cruzado el umbral gracias a tu velocidad sobrenatural."
ev10.134.wolf_escape:0 "¡Salta a través de la ventana!"
ev10.134.wolf_escape_tt:0 "Arremetes con el hombro contra el marco y los cristales, golpeas con fuerza el suelo, pero por fortuna tu curación sobrenatural te permite seguir adelante sin mirar atrás."
ev10.134.hunter_escape:0 "¡Arrójale las sábanas y desaparece!"
ev10.134.hunter_escape_tt:0 "Les arrojas las sábanas por encima, rompes la línea de visión y te escabulles hacia la salida. El entrenamiento vale más que la bravuconería."
ev10.134.demon_escape:0 "¡Desaparece de aquí!"
ev10.134.demon_escape_tt:0 "Un latido aquí; al siguiente... en otra parte. Es el Apocalipsis: todo vale, incluso para los demonios."
ev10.1344.desc:0 "Pones distancia entre tú y el intruso, rápido.\n\nLa noche engulle tus pasos mientras te cuelas por una puerta lateral y te adentras en la penumbra del callejón. Sin tu ventaja sobrenatural, estarías muerto. Pero no esta noche."
ev10.1344.a:0 "Vives para luchar otro día. Así comienza el Apocalipsis."
ev10.1344.a.tt:0 "«Astaroth pierde tu rastro... por ahora.» Así comienza el Apocalipsis."
ev10.135.desc:0 "Tus acciones no sirvieron de nada. El demonio es inhumanamente rápido; un instante estaba junto a la puerta y al siguiente ya te había agarrado del brazo y te había arrojado contra la pared. De no ser por el miedo paralizante, el dolor de las costillas rotas eclipsaría todo lo demás. Astaroth se alzaba sobre ti, listo para aplastarte con un solo movimiento. Este es el final."
ev10.135.a:0 "¡Nadie puede resistir mi poder!"
ev10.135.a_ct:0 "#P ¡Estás rompiendo el poder antimagia de Astaroth!#!"
ev10.135.b:0 "¡Espera! Hécate... Hécate te echa de menos."
ev10.136.desc:0 "El demonio se quedó inmóvil. «¿Qué?», preguntó, sorprendido. Sientes que tu confesión lo ha distraído; su antimagia ha desaparecido por un instante. Puedes lanzar un hechizo."
ev10.137.desc:0 "Tu hechizo convirtió al demonio, sorprendido, en un montón de cenizas. No sabes si fue destruido por completo o simplemente enviado de vuelta al Infierno, pero desde luego ya no supone una amenaza."
ev10.137.a:0 "Así que, después de todo, sí tenía una debilidad."
astaroth_self_modifier:0 "$astaroth_name$"
abraxas_self_modifier:0 "$abraxas_name$"
ev10.138.desc:0 "Hécate apareció de repente ante ti, sorprendiéndote una vez más. La demonia parece emocionada.\n«Astaroth regresó al Infierno, si lo he entendido bien, no por voluntad propia. Pero, por iniciativa propia, vino de inmediato a hablar conmigo. No sé qué le dijiste, pero las cosas entre nosotros han cambiado para mejor. ¡Con él me siento mil años más joven!»"
ev10.138.a:0 "Bien, me alegra oír eso..."
ev10.139.desc:0 "No me gusta deberle nada a nadie. Toma este anillo y quedaremos en paz. No volvamos a hablar de esto. Adiós."
ev10.139.a:0 "Adiós."
DS_YOU_HAVE_AS:0 "Teme tu Singularidad Antigua: $VALUE|=+0$"
demon_text:0 "demonio"
mortal_text:0 "mortal"
mortal_or_demon:0 "[ROOT.Char.Custom('GetMortalDemon')]"
ev10.140.desc:0 "La estancia se volvió sofocante y el olor a azufre se intensificó. De pronto oíste el chasquido de un relámpago y la silueta de un demonio apareció en el círculo de invocación.\n«Así que al final sí eras un necio» —dijo Asmodeo."
ev10.140.a:0 "¡Quiero desafiarte!"
ev10.140.b:0 "¡Lo siento, ha sido un error! Desaparece..."
ev10.140.c:0 "¡Te mataré, cabrón!"
ev10.141.desc:0 "«Acabo de llegar y ya quieres echarme. Así no se trata a los invitados. Pero tengo una idea magnífica. Seguramente te falta un modelo a seguir. Te enseñaré cómo es la hospitalidad en el Infierno. Después de ti.»\nAsmodeo chasqueó los dedos y tu vida se extinguió en un instante."
ev10.142.desc:0 "«¿Puedes repetir eso? Creo que te he entendido mal.»"
ev10.142.a:0 "Y... yo..."
ev10.143.desc:0 "«Mmm, por un momento pensé que ibas a pedirme que no matara a tu familia. Habría sido un buen deseo. Muy apropiado.»"
ev10.143.a:0 "$ev10.142.a$!"
ev10.144.desc:0 "«Todavía no lo entiendo. En fin, da igual. Es hora de volver al Infierno. Creo que me llevaré a unas cuantas personas para hacerme compañía.»\nTras esas palabras, el demonio chasqueó los dedos y desapareció. Sientes que algo muy malo acaba de suceder."
ev10.145.desc:0 "«Los humanos nacen necios y parece que la mayoría también muere necia. Bien, acepto tu desafío. Hagámoslo deprisa; hoy tengo la agenda ocupada.»"
