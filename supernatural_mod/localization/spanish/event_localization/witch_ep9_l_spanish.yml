ev10.32.title:0 "Ser un demonio"
ev10.32.desc:0 "Cada día aprendes algo nuevo sobre tu naturaleza y tu herencia. Probablemente puedas acelerar el proceso de desarrollar tus habilidades, aunque eso podría acarrear ciertos efectos secundarios. O quizá sea mejor llamarlos beneficios adicionales. Tendrás que juzgarlo por ti mismo."
ev10.32.a:0 "Haré cuanto pueda."
ev10.32.a_ct:0 "Obtienes un punto de ventaja del [lifestyle|E] demoníaco"
ev10.32.b:0 "No hay prisa..."
ev10.33.desc:0 "Tus observaciones de las maniobras diplomáticas y políticas de los gobernantes vecinos te han dado una idea. Unas pocas intrigas simples bastarían para que esta región se viera envuelta en conflictos graves. Llevar a cabo este plan podría resultar... instructivo y entretenido."
ev10.33.a:0 "Lo haré."
ev10.33.b:0 "Me abstendré por ahora."
ev10.34.desc:0 "Tu naturaleza exige ser liberada. La sed de sangre y destrucción debe desatarse. Tu instinto te dice que este es el camino más rápido hacia la grandeza."
magic_slaughterer_modifier:0 "Carnicero"
ev10.34.a:0 "Sí, necesito esto."
ev10.34.b:0 "Esta vez me contendré..."
demonic_courtier_name:0 "Reclutar cortesano demoníaco"
demonic_courtier_name_desc:0 "Los demonios son traicioneros, pero suelen ser más competentes que los mortales."
demonic_courtier_desc:0 "$demonic_courtier_name_desc$"
demonic_courtier_ct:0 "Un demonio menor se unirá a tu corte"
demon_courtier_terrain_cancel_negative_supply:0 "Desbloquea $demonic_courtier_name$ [decision|E]"
ev6.71.desc3:0 "Todo hechicero debería tener un lugar donde practicar su magia y desarrollar sus poderes. Construir un edificio adecuado parece una decisión sensata, pero ¿dónde debería levantarse?"
ev6.71.0.g:0 "[place0.GetName] es la elección más obvia."
liar_liar_modifier:0 "$fraudster_opinion$"
fraudster_opinion:0 "Estafador"
secret_false_mage:0 "Falso mago"
secret_false_mage_desc:0 "Finges ser un mago"
secret_false_mage_tooltip_desc:0 "$secret_false_mage$"
secret_false_mage_type_desc:0 "Fingir ser un mago puede aportar influencia y respeto adicionales, aunque también puede atraer a cazadores de brujas."
YOU_ARE_FALSE_MAGE:0 "¡Eres un falso mago!"
ev5.28.desc0:0 "Tu oponente hace gestos con las manos y murmura unas palabras, pero no percibes efecto alguno en sus hechizos."
secret_witch_hunter:0 "Cazador de brujas"
secret_witch_hunter_desc:0 "Eres un cazador de brujas encubierto"
secret_witch_hunter_tooltip_desc:0 "$secret_witch_hunter$"
secret_witch_hunter_type_desc:0 "Un cazador de brujas puede actuar con mayor eficacia si su identidad y sus habilidades permanecen en secreto."
ev10.35.desc:0 "Una idea brillante acudió a tu mente: podrías usar la astucia y las habilidades que has reunido hasta ahora para exagerar un poco tus competencias a ojos de los demás. Fingir ser un experto en magia negra, un adepto consumado de las artes arcanas, podría reportarte muchos beneficios, incluido reconocimiento y quizá oro. Hay muchos gobernantes crédulos que caerían en trucos sencillos."
ev10.35.a:0 "Claro, soy un poderoso [just_me.Custom('GetSorcererBySex')]!"
ev10.35.b:0 "Es demasiado arriesgado."
ev10.36.desc:0 "Parece que mucha gente ha llegado a creer que posees poderes mágicos secretos. Algunos piensan que son dones de Dios, fruto de oraciones fervorosas y de la meditación; otros, en cambio, murmuran que son el resultado de tratos con el diablo. Esta aura de misterio en torno a tu figura inquieta sin duda a tus enemigos, pero también puede atraerte nuevos aliados."
laamp_magic_1012_contract:0 "Levantar la maldición"
laamp_magic_1012_request:0 "Este [task_contract|E] requiere viajar a las tierras de [TaskContract.GetEmployer.GetTitledFirstName] y resolver un problema usando magia, engaño y [intrigue|E]."
laamp_magic_1012_desc_title:0 "$laamp_magic_1012_contract$"
laamp_magic_1012_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] cree que pesa una maldición sobre [TaskContract.GetEmployer.GetHerHim]. [TaskContract.GetEmployer.GetSheHe|U] está dispuesto a pagar a un especialista que ayude a romperla."
ev10.37.desc:0 "Ves que [employer.GetTitledFirstName] recibe tu visita con cierta suspicacia. Probablemente no quiera parecer un gobernante supersticioso ni desea que nadie lo relacione con asuntos \"sobrenaturales\" y brujería."
ev10.37.a:0 "Prometo tratarlo con discreción."
ev10.38.desc:0 "Durante el último año, [employer.GetTitledFirstName] se ha visto acosado por la mala suerte; muchas de sus empresas han fracasado. Parece que esa desgracia también afecta a quienes lo rodean. [employer.GetTitledFirstName] intentó aplacar a Dios con oraciones fervorosas y ofrendas, pero el altar de la iglesia le cayó encima y estuvo a punto de matarlo. Finalmente, un adivino aseguró que [employer.GetTitledFirstName] estaba maldito. En su opinión, solo un adepto hábil de la magia podría resolver este problema."
ev10.38.a:0 "Veré qué puedo hacer."
ev10.38.b:0 "No soy lo bastante competente en estos asuntos."
ev10.39.desc2:0 "Has hecho unas pruebas rápidas y parece que [employer.GetTitledFirstName] está realmente maldito. Por fortuna, se trata de una maldición simple y menor. Debería desaparecer por sí sola en unos pocos años, pero un hechicero competente podría acelerar mucho el proceso."
ev10.39.desc1:0 "No tienes claro si se trata de una maldición, de un castigo divino o solo de mala suerte, pero [employer.GetTitledFirstName] espera algún tipo de ayuda por tu parte, aunque sea una simple palabra de consuelo. Tal vez podrías fingir que has levantado la maldición."
ev10.39.a:0 "Simplemente despejaré su aura."
ev10.39.b:0 "No puedo evitar pensar que se trata de una maldición real."
ev10.39.c:0 "Fingiré lanzar un \"contrahechizo\"."
ev10.40.opening:0 "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
ev10.40.desc:0 "Me interesa mucho el tema de la hechicería y la magia, y he oído que sois un experto en estos campos. ¿Os importaría hablarme más de estas artes secretas? Siento curiosidad por saber si podrían emplearse para mejorar la situación de mi reino, por el bien de mis súbditos, claro está."
ev10.40.a:0 "Soy un experto, pero el conocimiento tiene un precio..."
ev10.40.a_ct:0 "Esto alimentará sin duda su curiosidad."
ev10.40.b:0 "Responderé con cortesía, pero en términos generales."
ev10.40.c:0 "Ignoraré esta carta."
ev10.41.desc:0 "Gracias por tu respuesta. Parece que eres alguien que sabe de lo que habla, justo la clase de persona que necesito. Quisiera ofrecerte el puesto de mago de la corte y, a cambio, recibirás protección como mi vasallo. Espero tu respuesta con interés."
ev10.41.a:0 "Por supuesto, acepto."
ev10.41.b:0 "No me interesa."
mage_court_alchemy:0 "Investigación alquímica"
mage_court_alchemy_desc:0 "El mago de la corte se centrará en la producción de pociones y en la transmutación del plomo en oro."
mage_court_black_magic:0 "Lanzamiento de hechizos"
mage_court_black_magic_desc:0 "El mago de la corte intentará lanzar hechizos que perjudiquen a tus enemigos o beneficien a tu reino."
mage_court_rituals:0 "Asistencia en rituales"
mage_court_rituals_desc:0 "El mago de la corte apoyará tus esfuerzos por estudiar la magia."
cm_task_1_terrain_cancel_negative_supply:0 "Puedes obtener pociones mágicas u oro"
cm_task_2_terrain_cancel_negative_supply:0 "El mago de la corte puede dañar a tus rivales y enemigos de guerra con magia"
ev10.42.title:0 "Deberes del mago de la corte"
ev10.42.desc:0 "Tu señor espera resultados en el terreno de la investigación alquímica. Sería buena idea entregarle algo de oro como prueba de tus progresos; eso debería satisfacerlo durante un tiempo."
ev10.42.a:0 "Diré que he convertido plomo en oro."
ev10.42.b:0 "Habrá mucho más de esto en el futuro, muchísimo más."
ev10.42.b_ct2:0 "Prometes mucho para ganar algo de tiempo."
ev10.42.c:0 "Pediré más tiempo."
ev10.42.d:0 "Presentaré mis notas de investigación."
ev10.42.e:0 "En realidad, puedo convertir plomo en oro."
ev10.42.title_ct:0 "Esfuerzos del mago de la corte"
cm_research_notes_modifier:0 "Notas del mago de la corte"
ev10.43.desc1:0 "Tu mago de la corte, [cmage.GetTitledFirstName], tiene un objetivo sencillo: producir oro a partir de plomo. [cmage.GetSheHe|U] asegura que es posible, pero hasta ahora no ha cumplido con sus obligaciones. Cuando le pides que te muestre los resultados de su trabajo, afirma que aún necesita más tiempo."
ev10.43.desc2:0 "Tu mago de la corte, [cmage.GetTitledFirstName], tiene un objetivo sencillo: producir oro a partir de plomo. [cmage.GetSheHe|U] asegura que es posible, pero cuando revisaste el progreso de su trabajo descubriste que [cmage.GetSheHe] había producido una pequeña pepita de oro por valor de 5 monedas. No es gran cosa, aunque [cmage.GetTitledFirstName] promete que esto es solo el comienzo y que habrá más en el futuro."
ev10.43.desc3:0 "Tu mago de la corte dice que no hay garantía de que la maldición que [cmage.GetSheHe] está preparando vaya a funcionar, y que la invocación requiere mucho tiempo. Debes ser paciente."
ev10.43.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], consume muchos recursos, pero últimamente su trabajo no ha dado resultado alguno. Ante tus apremios y preguntas, responde que necesita más tiempo."
ev10.43.a:0 "Tienes todo el tiempo que necesites."
ev10.43.a_ct:0 "El mago de la corte no tendrá prisa con sus tareas."
ev10.42.b_ct:0 "Tu señor podría estar perdiendo la paciencia."
ev2.65.a_ct:0 "Tu señor está empezando a perder la paciencia."
ev10.42.a_ct:0 "Tu señor queda satisfecho"
ev10.44.desc:0 "Has logrado producir cantidades significativas de oro. De hecho, una transmutación así sin duda complacería a tu señor. Quizá merezca la pena repetir el proceso como parte de tus deberes como mago de la corte."
ev10.44.a:0 "Sí, mi señor lo agradecerá."
ev10.44.c:0 "Sí, pero espero algo a cambio."
ev10.44.b:0 "Necesito reservar mi poder para más adelante."
ev10.45.desc:0 "Has logrado producir la poción, pero una idea no deja de inquietarte. Como mago de la corte entregado a la alquimia, quizá deberías ofrecer a tu señor parte de lo que produces. Tal vez no debieras quedarte esta poción para ti."
ev10.45.a:0 "Entregaré este elixir a mi señor."
ev10.45.b:0 "Prepararé una mezcla adicional para mi señor."
ev10.45.c:0 "Mi señor recibirá la poción la próxima vez."
ev10.46.title:0 "El dilema de Lilith"
ev10.46.desc:0 "Lilith te ha invocado por una supuesta emergencia, al parecer una cuestión de vida o muerte, tanto que has tenido que interrumpir una reunión con tus consejeros. Cuando le preguntas qué ha ocurrido, Lilith te muestra dos vestidos.\n\"No sé cuál debería ponerme hoy. El rojo está bien, pero con el otro parezco una diosa. ¿Qué debería hacer, cariño?\""
ev10.46.a:0 "El rojo está bien."
ev10.46.b:0 "El otro es claramente mejor."
ev10.46.c:0 "No tengo tiempo para esto."
ev10.46.d:0 "Te prefiero sin ropa."
ev10.47.title:0 "Los deseos de Lilith"
ev10.47.desc:0 "Lilith se presentó hoy con una idea muy peculiar.\n\"Vamos a divertirnos un poco en las mazmorras. Yo haré de virgen asustada acusada de brujería y tú serás el inquisidor lujurioso. Suena estupendo, ¿no crees?\""
ev10.47.a:0 "Si esto es lo que necesitas..."
ev10.47.b:0 "La verdad es que es una gran idea."
ev10.47.c:0 "Quizá en otro momento."
ev10.48.desc:0 "Te has dirigido a las mazmorras. Lilith ha escogido un lugar para su juego, pero el problema es que está justo enfrente de la celda donde se encuentra [vic1.GetTitledFirstName]. Sin duda [vic1.GetSheHe] observará atentamente todo lo que hagáis y, conociendo a Lilith, habrá bastante que ver. La demonia, en cambio, parecía encantada de tener un espectador para aquel espectáculo. \"Ahora estoy muy excitada\", dijo. \"Encadéname.\""
ev10.48.a:0 "Lo que tú quieras, amor mío..."
ev10.48.b:0 "No puedo hacer eso, lo siento."
ev10.49.desc:0 "Cuando todo terminó, Lilith se acercó a la celda desde la que [vic1.GetTitledFirstName] os observaba. [vic1.GetTitledFirstName] la miraba como hipnotizado mientras la mano de ella se deslizaba entre los barrotes para acariciarle el pecho. De pronto, Lilith retiró la mano de golpe... sosteniendo en ella el corazón todavía palpitante de [vic1.GetName]. \"¿Qué?\", preguntó al ver tu gesto de espanto. \"Quería que [vic1.GetHerHim] mirara, pero no quería que luego [vic1.GetHerHim] fuera contando rumores.\" Después esbozó una sonrisa traviesa."
ev10.49.a:0 "Sí... correcto..."
ev10.49.b:0 "..."
ev10.49.c:0 "Te amo, Lilith."
ev10.49.d:0 "Vaya giro."
ev10.50.desc:0 "Tu señor, [liege0.GetTitledFirstName], espera que cumplas con los deberes de un mago de la corte y uses tu magia para apoyarle. Si tardas demasiado, [liege0.GetTitledFirstName] podría perder la paciencia."
ev10.50.a:0 "Lanzaré una maldición sobre [tchar1.GetTitledFirstName]."
ev10.50.b:0 "[tchar2.GetTitledFirstName] recibirá una maldición."
ev10.50.c:0 "[tchar3.GetTitledFirstName] es un objetivo prioritario."
ev10.50.d:0 "Puedo encantar [tcounty.GetName]."
ev10.50.e:0 "Conozco un encantamiento útil."
ev10.50.f:0 "Por ahora, me abstendré de actuar."
ev10.50.g:0 "Fingiré lanzar una maldición sobre [tchar1.GetTitledFirstName]."
ev10.50.h:0 "Mi señor agradecerá un hechizo de sanación."
ev10.50.i:0 "Tengo algo para frenar a los ejércitos enemigos."
ev10.51.title:0 "Tarea para el mago de la corte"
ev10.51.desc:0 "Este es probablemente un buen momento para señalar un objetivo adecuado para tu mago de la corte. Haz que [cmage.GetHerHim] concentre sus esfuerzos en uno de tus enemigos."
ev10.51.a:0 "[tchar1.GetTitledFirstName] debe ser destruido."
ev10.51.b:0 "[tchar2.GetTitledFirstName] requiere atención."
ev10.51.c:0 "Hay que hacer algo con [tchar3.GetTitledFirstName]."
ev10.51.d:0 "[tchar4.GetTitledFirstName] es un objetivo adecuado."
ev10.51.a_ct:0 "Tu mago de la corte será animado a lanzar un hechizo sobre el objetivo elegido."
ev10.51.e:0 "Esperemos a un momento mejor."
ev10.52.desc:0 "Tu señor te ha impuesto una meta: con tu magia debes destruir a [tchar0.GetTitledFirstName], o al menos herir a [tchar0.GetHerHim] de algún modo."
ev10.52.a:0 "Como siempre: usaré una maldición."
ev10.52.b:0 "Este es el momento para una maldición poderosa."
ev10.52.c:0 "Voy a probar el hechizo de peste."
ev10.52.d:0 "Bien... Tormenta de fuego."
ev10.52.e:0 "Golpearé con la Singularidad Antigua."
ev10.52.f:0 "Preparar un hechizo así llevará meses..."
ev10.52.f_ct:0 "Tu señor podría sospechar."
ev10.52.g:0 "Hoy tengo el día libre."
ev10.52.x_ct:0 "Tu mago de la corte lanza un hechizo: [cmage.Custom('LastSpellCast')]"
ev10.53.desc:0 "Ves que tu señor está muy interesado en el conocimiento secreto, pero carece de la base elemental necesaria para comprender la teoría de la magia. Quizá deberías revelarle algunos misterios."
ev10.53.a:0 "[liege.GetSheHe|U] se lo merece."
ev10.53.a_ct:0 "Tu señor se convertirá en bruja."
ev10.53.a_ct2:0 "Tu señor no mostrará interés."
ev10.53.b:0 "[liege.GetSheHe|U] aún no está a la altura."
ev10.53.c:0 "Sabotearé a [liege.GetHerHim]."
ev10.54.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], percibe tu interés por el conocimiento secreto. [cmage.GetSheHe|U] está dispuesto a iniciarte en algunas materias si así lo deseas."
ev10.54.a:0 "Estoy abierto a sus enseñanzas."
ev10.54.a_title:0 "Tu señor ha aceptado tus enseñanzas"
ev10.54.b:0 "Prefiero mantenerme alejado de ello."
something_has_gone_wrong_modifier:0 "Algo ha salido mal"
something_has_gone_wrong_modifier_desc:0 "Quizá alguien te está saboteando o te está desorientando sin querer: parece que parte de la información que has reunido sobre magia no es cierta."
ev10.55.title:0 "El ritual ha fracasado"
ev10.55.desc:0 "Pese a unos preparativos meticulosos, el ritual para obtener poder ha fracasado y los problemas han surgido desde la primera fase. Resulta difícil decir cuál ha sido la causa, pero seguramente se trate de algún error de cálculo."
ev10.55.a:0 "Sin duda estoy agotado."
ev10.55.b_ct1:0 "Descubres la causa del problema"
ev10.55.b_ct2:0 "No descubres nada"
ev10.56.desc:0 "Tu investigación ha revelado que el ritual fracasó por la absoluta incompetencia de tu mago de la corte, [cmage.GetTitledFirstName]. Parece que [cmage.GetSheHe] no sabe absolutamente nada de magia: no es más que un farsante."
ev10.56.a:0 "No puedo creerlo..."
ev10.56.b:0 "¡Llevad a [cmage.GetHerHim] a la mazmorra!"
ev10.56.desc_title:0 "¡Tu señor ha descubierto la verdad!"
ev10.57.title:0 "Magia costosa"
ev10.57.desc:0 "Está claro que el trabajo de un mago de la corte exige mucha inversión y componentes costosos. Quizá merezca la pena pedir a [liege0.GetTitledFirstName] fondos adicionales."
ev10.57.a:0 "Hablaré de esto con [liege0.GetHerHim]."
ev10.57.b:0 "Mis recursos son suficientes."
additional_magic_funds_modifier:0 "Fondo de investigación"
ev10.58.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], se te ha acercado con una petición de fondos adicionales para la investigación mágica que está llevando a cabo. [cmage.GetSheHe|U] asegura que es una inversión que dará frutos."
ev10.58.a:0 "[cmage.GetSheHe|U] recibirá financiación adicional."
ev10.58.b:0 "No."
ev10.59.desc:0 "Tu posición como mago de la corte y la confianza que [liege0.GetTitledFirstName] deposita en ti te convierten en una figura importante en el tablero político. Estás convencido de que puedes usar eso en tu beneficio."
ev10.59.a:0 "Esto me hace más influyente."
ev10.59.b:0 "Espero muchos sobornos."
ev10.59.c:0 "Soy un amigo bienvenido..."
ev10.59.d:0 "...o un enemigo peligroso."
CM_MUST_HAS_ASSIGNED_TASK:0 "Primero debes asignar una tarea al mago de la corte."
CM_HELPS_YOU_RITUALS:0 "Tu mago de la corte te está ayudando activamente ($mage_court_rituals$)."
press_court_mage1:0 "El mago de la corte estará motivado."
press_court_mage_decision_ct1:0 "El mago de la corte redoblará sus esfuerzos."
press_court_mage2:0 "El mago de la corte encaja mal la presión."
ev2.18.e:0 "No tienes ni idea de lo jodido que estás."
DS_CYRO_HATES_U:0 "#N El objetivo te odia#!: $VALUE|=+0$"
ev10.61.desc:0 "Parece que el demonio se ha retirado. Quizá ya ha cumplido su objetivo y ha saciado su sed de terror. Tal vez solo pretendía enviarte un mensaje."
ev10.61.a:0 "La protección debe reforzarse... para el futuro."
ev10.61.b:0 "Hay que hacer algo al respecto."
