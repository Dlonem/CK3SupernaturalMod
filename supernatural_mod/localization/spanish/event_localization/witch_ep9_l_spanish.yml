ev10.9.desc:0 "Sientes una oleada de energía inmensa: un hechizo demasiado poderoso para ser contrarrestado. Un torrente de fuerza destructiva cae del cielo y notas cómo los temblores se intensifican a cada instante. Una onda expansiva se aproxima..."
