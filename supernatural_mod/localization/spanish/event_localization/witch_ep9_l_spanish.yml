magical_creature_perk_name:0 "Criatura mágica"
demonic_rage_decision_desc:0 "A veces necesitas desatar tus oscuros impulsos y mostrarle al mundo tu verdadera naturaleza."
HIGH_STRESS_OR_IMPRISONED:0 "Debes tener un nivel de estrés más alto o estar encarcelado."
demonic_rage_decision_ct:0 "Durante una noche perderás el control de tus acciones"
demonic_rage_decision_ct3:0 "Rompes los barrotes, aplastas a los guardias y recuperas la libertad."
demonic_rage_decision_ct2:0 "#N Mucha gente puede resultar herida o morir#!"
demonic_rage_decision_ct4:0 "Has masacrado a los habitantes de la aldea cercana; no ha sobrevivido ningún testigo."
ev10.19.desc:0 "Cada demonio es único, pero su personalidad y sus rasgos suelen encuadrarlo en una de las categorías o facciones principales. Al final, lo que de verdad importa es tu objetivo y el camino que elijas para alcanzarlo."
succubus_modifier:0 "Súcubo"
succubus_modifier_desc:0 "Los súcubos y los íncubos se dedican a tentar a los mortales, despertando el deseo carnal en el camino hacia la perdición. Algunos buscan ganar nuevas almas o, mediante la manipulación, obtener otros beneficios por esta vía, pero la mayoría de los demonios difunden la corrupción simplemente por diversión.\n"
incubus_modifier:0 "Íncubo"
incubus_modifier_desc:0 "$succubus_modifier_desc$"
bloodlust_modifier:0 "Ansia de sangre"
bloodlust_modifier_desc:0 "Los demonios suelen preferir la violencia como medio para resolver problemas y satisfacer sus ambiciones. Sin embargo, algunos han elevado la brutalidad y la destrucción al rango de arte, convirtiéndolas en un fin en sí mismas.\n"
bloodlust_special_terrain_cancel_negative_supply:0 "Pierde estrés al ganar batallas"
diabolist_modifier:0 "Diabolista"
diabolist_modifier_desc:0 "Entre los demonios también hay seres más calculadores y sutiles, que prefieren la astucia y el conocimiento a la fuerza bruta.\n"
succubus_terrain_cancel_negative_supply:0 "Te permite usar la [interaction|E] $command_minion_interaction$ contra tus amantes"
