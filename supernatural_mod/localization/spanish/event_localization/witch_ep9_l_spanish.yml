ev10.1.0.a:0 "¡Tengo algo para ti!"
ev10.1.0.b:0 "¿Qué tal un escudo de fuego?"
ev10.1.0.c:0 "[char2.GetSheHe|U] va a sentir este golpe."
ev10.1.0.d:0 "La oscuridad consumirá a [char2.GetHerHim]."
ev10.1.0.e:0 "¡Toma esto!"
ev10.1.0.f:0 "Invocaré flechas sombrías."
ev10.1.0.g:0 "Me centraré en una defensa total."
ev10.1.0.h:0 "Un hechizo explosivo bastará."
ev10.1.0.i:0 "Este será un golpe sólido."
ev10.1.0.j:0 "Me ocultaré en las sombras."
ev10.1.0.k:0 "Crearé un vórtice de cuchillas."
ev10.1.0.l:0 "Es hora de un escudo ligero."
ev10.1.0.m:0 "Usaré la séptima alteración del flujo de poder."
ev10.1.0.n:0 "Voy a intentar una cinta de flujo inverso."
ev10.1.0.o:0 "Una progresión cinética de varias fases jugará a mi favor."
ev10.1.0.p:0 "Esta será una buena apertura."
ev10.1.0.r:0 "...¿quizá una simple bola de fuego?"
ev10.1.0.s:0 "Progresión doble de orden superior con amplificación."
ev10.1.0.t:0 "Atacaré y me defenderé al mismo tiempo."
ev10.1.0.u:0 "Así es como luce el final."
ev10.1.0.w:0 "No podrás resistir mi poder."
ev10.1.0.x:0 "Me gusta contemplar tu impotencia."
ev10.1.0.y:0 "Usaré pura energía necrótica."
ev10.1.0.z:0 "Prueba el fuego disforme."
ev10.1.0.z1:0 "Es hora de un proyectil mortífero."
ev10.1.0.z2:0 "Esto debilitará a [char2.GetHerHim]."
ev10.1.0.z3:0 "Confundiré a [char2.GetHerHim] con una ilusión."
ev10.1.0.z4:0 "No tienes ni idea de lo que soy capaz de hacer."
ev10.1.0.z5a:0 "$my_custom_spell_final_name$!"
ev10.1.0.z5b:0 "[my_custom_spell.GetLocalizedText( 'my_custom_spell_name' )]!"
ev10.1.0.z6a:0 "$not_my_custom_spell_final_name$!"
ev10.1.0.z6b:0 "[my_custom_spell2.GetLocalizedText( 'my_custom_spell_name' )]!"
ev10.1.0.z7:0 "Probaré esto."
ev10.1.0.z8:0 "Fingiré lanzar un hechizo."
ev10.1.0.z9:0 "Abracadabra..."
