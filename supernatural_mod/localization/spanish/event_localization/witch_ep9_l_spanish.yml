mc_archmage_modifier:0 "Archimago"
mc_archmage_modifier_desc:0 "El Archimago encabeza el Alto Consejo de Magos: ninguna decisión importante del Consejo puede tomarse sin su aprobación. Suele ser el más poderoso o influyente de todos los magos."
mc_loremaster_modifier:0 "Maestro del Saber"
mc_loremaster_modifier_desc:0 "El Maestro del Saber es un mago de conocimientos incuestionables y gran pericia mágica. En el consejo actúa como experto en fenómenos mágicos extremos y también participa en todo tipo de investigaciones mágicas."
mc_black_mage_modifier:0 "Mago negro"
mc_black_mage_modifier_desc:0 "El Mago Negro se ocupa de los asuntos de seguridad y puede actuar como investigador o ejecutor si la situación lo requiere."
mc_admin_modifier:0 "Administrador del Consejo"
mc_admin_modifier_desc:0 "El Administrador se ocupa de los asuntos financieros y burocráticos y está autorizado a gestionar los $mc_gold_desc$. Suele ser alguien competente en administración y familiarizado con la política."
mc_supporter_modifier:0 "Partidario del Alto Consejo"
mc_supporter_modifier_desc:0 "Algunos apoyan al Alto Consejo por miedo, mientras otros esperan ganarse el favor del Archimago."
game_concept_high_mage_council:0 "$mc_full_name$"
game_concept_high_mage_council_desc:0 "El Alto Consejo está compuesto por el Archimago y otros tres magos nombrados por él. El Consejo posee recursos e influencia que muchos emperadores envidiarían; sus decisiones afectan de forma decisiva al destino del mundo. Fuera del círculo de los magos, la existencia del Consejo es un secreto... hasta que el propio Consejo decide revelarse al resto del mundo."
game_concept_mc_funds:0 "$mc_gold_desc$"
game_concept_mc_funds_desc0:0 "El Alto Consejo puede disponer de un fondo especial para cubrir sus actividades o conceder subvenciones."
game_concept_mc_funds_desc1:0 "$game_concept_mc_funds_desc0$\nEl fondo contiene actualmente $mc_gold$ de oro."
game_concept_mc_funds_desc:0 "[GetPlayer.Custom('MC_FUNDS_DESC')]"
