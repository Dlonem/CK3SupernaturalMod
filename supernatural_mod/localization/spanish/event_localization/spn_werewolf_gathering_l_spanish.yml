l_spanish:
 werewolf_gathering:0 "Werewolf Gathering"
 werewolf_gathering_desc:0 "Call the wolves you know to run together, and to sit in council around a fire."
 werewolf_gathering_host_desc:0 "$BULLET_WITH_TAB$Wolves gain [spn_pack_standing|E] and lycanthropy\n$BULLET_WITH_TAB$A hide brought to the circle may choose one of you\n$BULLET_WITH_TAB$News of the hides travels around the fire\n"
 werewolf_gathering_guest_desc:0 "$BULLET_WITH_TAB$Wolves gain [spn_pack_standing|E] and lycanthropy\n$BULLET_WITH_TAB$A hide brought to the circle may choose one of you\n$BULLET_WITH_TAB$News of the hides travels around the fire\n"
 werewolf_gathering_selection_tooltip:0 "Run with the wolves you know, and sit with them in council."
 werewolf_gathering_destination_selection:0 ""
 werewolf_gathering_province_desc:0 "A place to run."
 werewolf_gathering_predicted_cost:0 "Feeding a pack for a month is not cheap."
 werewolf_gathering_guest_help_text:0 "Wolves who come earn their place in the pack."
 werewolf_gathering_conclusion_desc:0 "The [GetActivityType( 'werewolf_gathering' ).GetName] has concluded."
 werewolf_gathering_host_an_a:0 "a Werewolf"
 spn_gathering_calling_phase:0 "The Calling"
 spn_gathering_calling_phase_desc:0 "The wolves arrive and take each other's measure."
 spn_gathering_run_phase:0 "The Run"
 spn_gathering_run_phase_desc:0 "The pack runs together. The county will notice."
 spn_gathering_circle_phase:0 "The Circle"
 spn_gathering_circle_phase_desc:0 "The council at the fire, where hides choose and news travels."
 spn_lead_the_pack_intent:0 "Lead the Pack"
 spn_lead_the_pack_intent_desc:0 "Run at the head of the pack and remind every wolf who leads it."
 spn_run_a_rivals_land_intent:0 "Run a Rival's Land"
 spn_run_a_rivals_land_intent_desc:0 "Hold the Gathering in someone else's realm and let your pack run there. Pays only abroad: in your own realm it earns nothing more."
 spn_seek_the_old_ways_intent:0 "Seek the Old Ways"
 spn_seek_the_old_ways_intent_desc:0 "Sit with the oldest wolves and listen. They may tell you of a lost hide that would take you, or where the hide that suits you best is kept."
 spn_hold_the_unification_intent:0 "Hold the Unification"
 spn_hold_the_unification_intent_desc:0 "Bring your spouse's pack into yours in the old rite, if there are no secrets between you."
 spn_earn_my_place_intent:0 "Earn My Place"
 spn_earn_my_place_intent_desc:0 "Run hard and be seen to. You gain more [spn_pack_standing|E]."
 spn_challenge_the_alpha_intent:0 "Challenge the Alpha"
 spn_challenge_the_alpha_intent_desc:0 "Come to test the one who leads. Only for a wolf of the host's own [spn_pack|E] who is its [spn_second|E], or any of them once the Second has lost to the alpha."
 spn_seek_another_pack_intent:0 "Seek Another Pack"
 spn_seek_another_pack_intent_desc:0 "Look for a pack that will take you, and ask to run with the host's."
 spn_hold_the_unification_spouse_tt:0 "Your spouse leads another pack"
 spn_challenge_the_alpha_standing_tt:0 "Your [spn_pack_standing|E] is at least 50"
 activity_invite_rule_werewolves:0 "Werewolves"
 activity_invite_rule_werewolves_desc:0 "Werewolves you could plausibly know for what they are: those who carry it openly, those whose secret you keep, your family, and those you clawed or who clawed you."
 activity_invite_rule_pack:0 "The Pack"
 activity_invite_rule_pack_desc:0 "The wolves of your own pack, and the alphas of packs near you that you know of."
 activity_invite_rule_fevered:0 "The Fevered"
 activity_invite_rule_fevered_desc:0 "People still in the wound's fever whom you know: those you or your pack gave it to, your close family and your court."
 spn_wg_location_too_far_tt:0 "Within a ride of your home, or anywhere in your liege's realm"
 spn_wg_location_capital_tt:0 "A county seat"
 spn_wg_prov_base:0 "A place to run.\n"
 spn_wg_tag_forest:0 "#positive_value + Deep Woods#! (Terrain)\n"
 spn_wg_tag_own:0 "#positive_value + Your Own Land#!\n"
 spn_wg_tag_far:0 "#negative_value - A Long Ride#!\n"
 spn_wg_join_host_paranoid:0 "The host is paranoid"
 spn_wg_join_host_gregarious:0 "The host is gregarious"
 spn_wg_join_my_alpha:0 "My own alpha calls"
 spn_wg_join_guest_eager:0 "Eager to run"
 spn_wg_join_guest_wary:0 "Wary of company"
 spn_gathering.0001.t:0 "The Call Goes Out"
 spn_gathering.0001.desc:0 "You have called the wolves to run together. Some will come because they know you. Some will come because they are curious. A few will come because they mean to test you. Every wolf who comes could be yours, if the week goes well.\n\nThe woods will be loud for a while."
 spn_gathering.0001.a:0 "Let them come."
 spn_gathering.0110.t:0 "The Pack Bows"
 spn_gathering.0110.desc:0 "[spn_bow_champ.GetShortUIName] walks into the clearing and every wolf there goes still. Nobody told them what [spn_bow_champ.GetSheHe] wears. Nobody needed to.\n\nOne by one, without being asked, they lower their heads. Even the old ones, who have not bowed to anyone in years."
 spn_gathering.0110.a:0 "So do I."
 spn_gathering.0200.t:0 "The Run"
 spn_gathering.0200.desc:0 "Tonight you run with all of them at once - through the trees, over the river, up the long hill and down. For a few hours there is nothing to decide and nothing to hide. The pack moves like one animal, and you are part of it.\n\nIt is the best you have felt in years."
 spn_gathering.0200.a:0 "Again tomorrow."
 spn_gathering.0201.t:0 "A Farmer's Flock"
 spn_gathering.0201.desc:0 "The pack comes out of the trees above a farm with its sheep penned for the night. The farmer is asleep. The dogs are not, and they are terrified. It would be easy. It would also be talked about for a year.\n\nEvery wolf is looking at you."
 spn_gathering.0201.a:0 "Take them."
 spn_gathering.0201.a.tt:0 "The county will talk about this."
 spn_gathering.0201.b:0 "Leave them."
 spn_gathering.0202.t:0 "A Hunter's Dog"
 spn_gathering.0202.desc:0 "A hound has followed the pack for two nights, keeping its distance, baying. Somewhere behind it there will be a man with a crossbow.\n\nKill the dog and he will know something killed it. Let it go and it may lead him straight to you."
 spn_gathering.0202.a:0 "Kill it."
 spn_gathering.0202.b:0 "Let it run home."
 spn_gathering.0203.t:0 "A Young Wolf Who Will Not Stop"
 spn_gathering.0203.desc:0 "[spn_young_wolf.GetShortUIName] is young and has never run with this many wolves before. [spn_young_wolf.GetSheHe|U] will not stop - snapping at the old ones, racing ahead, howling at nothing.\n\nThe others are waiting to see if you will put [spn_young_wolf.GetHerHim] in [spn_young_wolf.GetHerHis] place."
 spn_gathering.0203.a:0 "Bring [spn_young_wolf.GetHerHim] to heel."
 spn_gathering.0203.b:0 "Let [spn_young_wolf.GetHerHim] run."
 spn_gathering.0204.t:0 "A Kill"
 spn_gathering.0204.desc:0 "The pack has found a man alone on the road at night. Nobody will miss him for a day or two. He has a bundle on his back and a lantern he has not lit, and he has not seen you yet.\n\nThe wolves wait for you."
 spn_gathering.0204.a:0 "Let them eat."
 spn_gathering.0204.a.tt:0 "The county will find what is left."
 spn_gathering.0204.b:0 "Not him. Not tonight."
 spn_gathering.0205.t:0 "The Moon on the Water"
 spn_gathering.0205.desc:0 "You stop at a lake to drink and the whole pack stops with you. The moon is on the water, and for a while nobody moves. Even the young ones are still. Somewhere across the water another wolf howls, and none of yours answer.\n\nIt is very old, this. Older than any of you."
 spn_gathering.0205.a:0 "Stay a little longer."
 spn_gathering.0206.t:0 "The Hunters' Camp"
 spn_gathering.0206.desc:0 "Below the ridge there is a camp: three tents, a fire burned down to embers, dogs asleep in a heap. Crossbows stacked against a cart. Somebody in this county is paying men to look for wolves.\n\nThe pack is already spreading out along the ridge, waiting for you."
 spn_gathering.0206.a:0 "Run them off before they wake."
 spn_gathering.0206.a.tt:0 "The county will hear that something ran the hunters off."
 spn_gathering.0206.b:0 "Leave them sleeping."
 spn_gathering.0207.t:0 "The Old Wolf"
 spn_gathering.0207.desc:0 "Halfway up the long hill the oldest wolf in the pack slows, then stops. The others look back at it, and then at you.\n\nIt was running with packs before your grandfather was born. It will not make the top of the hill tonight."
 spn_gathering.0207.a:0 "We wait for it."
 spn_gathering.0207.b:0 "The pack does not wait."
 spn_gathering.0208.t:0 "Another Pack's Ground"
 spn_gathering.0208.desc:0 "At the river the scent changes. Another pack runs on this side of the water: old marks on the trees, fresh ones on the stones.\n\nThey are not here tonight. They will know you were."
 spn_gathering.0208.a:0 "Leave our mark over theirs."
 spn_gathering.0208.b:0 "Turn back at the water."
 spn_gathering.0209.t:0 "The Shepherd's Girl"
 spn_gathering.0209.desc:0 "A shepherd's girl is sitting on the wall of her father's fold, wide awake, watching the whole pack go by in the moonlight. She does not scream. She does not run.\n\nIn the morning she will tell someone what she saw."
 spn_gathering.0209.a:0 "Let her tell it. Nobody will believe her."
 spn_gathering.0209.a.tt:0 "The county will hear of it."
 spn_gathering.0209.b:0 "Give her something to be afraid of."
 spn_gathering.0210.t:0 "Only Wolves"
 spn_gathering.0210.desc:0 "A pack of ordinary wolves comes out of the dark and runs alongside you for a while, grey shapes keeping pace at the edge of the trees. They do not come close. They do not leave either.\n\nThey know what you are. They seem to think it an honour."
 spn_gathering.0210.a:0 "Run with them."
 spn_gathering.0210.b:0 "Drive them off. This is our night."
 spn_gathering.0211.t:0 "No Moon"
 spn_gathering.0211.desc:0 "There is no moon tonight. Without it the pack is restless, snapping at each other and starting at every sound. Two of the young ones are already at each other's throats.\n\nThey are waiting to see whether you can hold them together in the dark."
 spn_gathering.0211.a:0 "Hold them."
 spn_gathering.0211.b:0 "Let them sort it out themselves."
 spn_gathering.0212.t:0 "The Old Stones"
 spn_gathering.0212.desc:0 "Deep in the woods the pack comes on a ring of standing stones, half sunk in moss. Every wolf stops at the edge of it. Wolves met here once, a long time ago. You can smell it in the stones.\n\nNobody wants to go in first."
 spn_gathering.0212.a:0 "I will go in first."
 spn_gathering.0212.b:0 "Leave the old place alone."
 spn_gathering.0213.t:0 "A Fight Over a Kill"
 spn_gathering.0213.desc:0 "Two wolves have brought down the same deer, and neither will give it up. They are circling the carcass with their hackles up, and the rest of the pack has drawn back to watch.\n\nIt is your kill to give."
 spn_gathering.0213.a:0 "Give it to the stronger."
 spn_gathering.0213.b:0 "They share it, side by side."
 spn_gathering.0300.t:0 "The Choosing"
 spn_gathering.0300.desc_me:0 "You brought [spn_ch_hide.GetName] to the circle. You did not wear it. Tonight, by the fire, it moved on its own - turned, the way a sleeping dog turns - and you knew it had chosen.\n\nIt chose you. The whole circle saw it, and nobody says a word."
 spn_gathering.0300.desc_other:0 "You brought [spn_ch_hide.GetName] to the circle. You did not wear it. Tonight, by the fire, it moved on its own - turned, the way a sleeping dog turns - and you knew it had chosen.\n\nIt did not choose you. It chose [spn_ch_chosen.GetShortUIName]. The whole circle saw it, and now they are watching you."
 spn_gathering.0300.a:0 "So be it."
 spn_gathering.0300.a.tt:0 "You become its [spn_champion|E]."
 spn_gathering.0300.b:0 "Then it is [spn_ch_chosen.GetHerHis]."
 spn_gathering.0300.b.tt:0 "You give it up. It takes [spn_ch_chosen.GetShortUIName] as its [spn_champion|E]."
 spn_gathering.0300.c:0 "Then [spn_ch_chosen.GetSheHe] will have to take it from me."
 spn_gathering.0300.c.tt:0 "A brawl in the circle, no swords. The winner keeps the hide, but it still chooses whom it serves."
 spn_gathering.0301.t:0 "Word at the Fire"
 spn_gathering.0301.desc:0 "Late in the night the talk around the fire turns to the hides, as it always does. Most of it is old stories, told the same way every year, and you listen for anything new."
 spn_gathering.0301.shrine:0 "\n\n[spn_waf_hide.GetName] is kept as a holy relic in [spn_waf_county.GetName], and the faithful there think it belonged to someone blessed."
 spn_gathering.0301.held_mine:0 "\n\nThey are talking about the hide in your own keeping. Word of it has got out."
 spn_gathering.0301.held:0 "\n\n[spn_waf_holder.GetShortUIName] has [spn_waf_hide.GetName]. Whoever wants it will have to take it."
 spn_gathering.0301.lost_silverback:0 "\n\nSilverback is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.lost_timber:0 "\n\nTimber is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.lost_tundra:0 "\n\nTundra is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.lost_graybeard:0 "\n\nGraybeard is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.lost_midnight:0 "\n\nMidnight is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.lost_alpha:0 "\n\nAlpha is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_gathering.0301.true_alpha:0 "\n\nThere is a wolf with red eyes, [spn_waf_ta.GetShortUIName], who became an alpha without killing anyone for it. The old ones say that has not happened in a hundred years."
 spn_gathering.0301.nothing:0 "\n\nYou hear nothing you did not already know."
 spn_gathering.0301.a:0 "Remember it."
 spn_gathering.0302.t:0 "Two Packs, One Fire"
 spn_gathering.0302.desc:0 "[spn_tp_other.GetShortUIName] brought a pack to your fire, and the two packs have spent the week circling each other. There have been two fights already, both broken up before anyone was badly hurt.\n\nTonight [spn_tp_other.GetShortUIName] sits down across the flames from you. Everybody else goes quiet."
 spn_gathering.0302.a:0 "Swear the Blood Pact."
 spn_gathering.0302.a.tt:0 "You and [spn_tp_other.GetShortUIName] will think well of each other for twenty years, and your houses grow closer. If you are both rulers, it is a true alliance."
 spn_gathering.0302.b:0 "Settle who is stronger."
 spn_gathering.0302.b.tt:0 "A Challenge between the two alphas, here and now."
 spn_gathering.0302.c:0 "Keep our distance."
 spn_gathering.0303.desc_silverback:0 "The oldest wolf at the fire tells a story nobody else remembers - about Silverback, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.desc_timber:0 "The oldest wolf at the fire tells a story nobody else remembers - about Timber, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.desc_tundra:0 "The oldest wolf at the fire tells a story nobody else remembers - about Tundra, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.desc_graybeard:0 "The oldest wolf at the fire tells a story nobody else remembers - about Graybeard, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.desc_midnight:0 "The oldest wolf at the fire tells a story nobody else remembers - about Midnight, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.desc_alpha:0 "The oldest wolf at the fire tells a story nobody else remembers - about Alpha, and where it went, and what it is waiting for. Half the wolves here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old wolf looks straight at you."
 spn_gathering.0303.t:0 "The Old Wolf's Tale"
 spn_gathering.0308.t:0 "A Challenge at the Fire"
 spn_gathering.0308.desc:0 "[spn_gc_challenger.GetShortUIName|U] stands up in the firelight and says your name, loud enough for every wolf in the circle to hear. It is a challenge, the old way: no swords. "
 spn_gathering.0308.desc_cruel:0 "'This pack deserves a better alpha than you,' [spn_gc_challenger.GetSheHe] says."
 spn_gathering.0308.desc_weak:0 "'You are not strong enough to lead us any more,' [spn_gc_challenger.GetSheHe] says."
 spn_gathering.0308.desc_long:0 "[spn_gc_challenger.GetSheHe|U] has wanted this for a long time. You can see it."
 spn_gathering.0308.desc_end:0 "\n\nEvery wolf at the fire is watching to see what you do."
 spn_gathering.0308.a:0 "Then we settle it."
 spn_gathering.0309.t:0 "A Wolf at Your Fire"
 spn_gathering.0309.desc_lone:0 "[spn_seek_ask.GetShortUIName|U] has come to your fire alone. Before the night is out [spn_seek_ask.GetSheHe] comes to you and asks to run with your pack."
 spn_gathering.0309.desc_pack:0 "[spn_seek_ask.GetShortUIName|U] runs with another pack, but before the night is out [spn_seek_ask.GetSheHe] comes to you at the fire and asks to run with yours instead."
 spn_gathering.0309.a:0 "Run with us."
 spn_gathering.0309.a.tt:0 "[spn_seek_ask.GetShortUIName] joins your [spn_pack|E]."
 spn_gathering.0309.b:0 "Not this one."
 spn_gathering.0308.b:0 "Not tonight."
 spn_gathering.0401.t:0 "They Will Not Leave You"
 spn_gathering.0401.desc:0 "You came to the Gathering sick with the wound, and the wolves knew it the moment you walked in. They let you run as far as you could. When you could not, they stayed with you.\n\nThe fever is not finished with you. When it comes to its end, they mean to be there."
 spn_gathering.0401.a:0 "I will not face it alone."
 spn_gathering.0401.a.tt:0 "When the fever comes to its end you can let the pack carry you through it: you are likelier to come out a wolf and less likely to die. If you turn and [spn_gc_host.GetShortUIName] runs with a [spn_pack|E] that has room, you wake in it."
 spn_gathering.0307.t:0 "Where It Is Kept"
 spn_gathering.0307.desc:0 "Late, when the fire is low, the oldest wolf at the circle sits down beside you. He has been watching you all night.\n\nHe tells you that [spn_tale_shrine_hide.GetName] is in [spn_tale_shrine_county.GetName]. The people there keep it as a holy thing and have no idea what it is."
 spn_gathering.0307.takes:0 " He looks you over once more. It would know you, he says."
 spn_gathering.0307.not_yet:0 " He looks you over once more. It would not have you yet, he says, but of the hides kept in shrines it is the nearest to what you are."
 spn_gathering.0307.a:0 "Then I know where to go."
 spn_gathering.0307.a.tt:0 "You know where [spn_tale_shrine_hide.GetName] is kept. Take the county, or go there on pilgrimage if the place is holy to your faith."
 spn_gathering.0303.a:0 "I will remember it."
 spn_gathering.0303.a.tt:0 "The lost hide wakes at the turn of the year, and you are first in line if it will have you."
 spn_gathering.0304.t:0 "Two Hides in One Room"
 spn_gathering.0304.desc_silverback:0 "[spn_th_other.GetShortUIName] wears Midnight. You knew it the moment [spn_th_other.GetSheHe] walked into the clearing. Silverback has hated Midnight since before either of you was born. You can feel it pulling at you from across the fire, the way a dog pulls at a leash.\n\nIt hates it now."
 spn_gathering.0304.desc_midnight:0 "[spn_th_other.GetShortUIName] wears Silverback. You knew it the moment [spn_th_other.GetSheHe] walked into the clearing. Midnight has hated Silverback since before either of you was born. You can feel it pulling at you from across the fire, the way a dog pulls at a leash.\n\nIt hates it now."
 spn_gathering.0304.a:0 "Old hatreds."
 spn_gathering.0305.t:0 "The Unification"
 spn_gathering.0305.desc:0 "[spn_un_elder.GetShortUIName] binds your hand to [spn_un_spouse.GetShortUIName]'s with a strip of hide and speaks the old words over you both.\n\nTwo alphas. Two packs. If there are no secrets between you, they will be one, and every wolf in them will be more than it was."
 spn_gathering.0305.a:0 "We are one pack."
 spn_gathering.0305.a.tt:0 "[spn_un_spouse.GetShortUIName]'s pack joins yours and [spn_un_spouse.GetSheHe] leads it beside you. Every wolf in it is [spn_evolved|E]."
 spn_gathering.0305.b:0 "Not yet."
 spn_gathering.0306.t:0 "The Rite Does Not Take"
 spn_gathering.0306.desc:0 "The elder speaks the words, and nothing happens. The strip of hide falls off your wrist and [spn_un_other.GetShortUIName]'s.\n\nThere is something one of you has not told the other. The rite knows it, even if you do not. The elder will not meet your eyes."
 spn_gathering.0306.a:0 "Not yet, then."
 spn_gathering.0400.t:0 "The Gathering Ends"
 spn_gathering.0400.desc:0 "The wolves go home in twos and threes, tired and quieter than they came. Some leave with new friends, and a few with new grudges. For a day or two after, the dogs in the villages will not stop barking."
 spn_gathering.0400.desc_home:0 " Your own woods will be quiet again in a week or two."
 spn_gathering.0400.desc_away:0 " These woods will be quiet again in a week or two."
 spn_gathering.0400.desc_rival_land:0 " Somebody else's woods will be talking about this for a year."
 spn_gathering.0400.a:0 "Until next time."
