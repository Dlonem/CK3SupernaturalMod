l_spanish:
ev6.1.desc:0 "Te conozco, mortal. ¿Por qué me molestas de nuevo?"
ev6.1.0.a:0 "Necesito tu apoyo."
ev6.1.0.b:0 "Debes concederme mi deseo, demonio."
ev6.2.desc:0 "En el centro del círculo de invocación aparece una figura envuelta en luz mágica, que se va apagando poco a poco. El corazón se te acelera cuando Lilith te sonríe. «¿Me has echado de menos, querido?». La voz de la demonio resulta aún más seductora de lo que recordabas."
ev6.2.0.a:0 "Sí, quédate conmigo, amor mío."
ev6.2.0.b:0 "Quiero que cumplas mi deseo."
ev6.3.desc:0 "El demonio aparece de inmediato en el círculo de invocación. No parece precisamente encantado de verte. «Tú...», dice el demonio. «¿Qué quieres esta vez, brujo?»"
ev3.2.desc2:0 "«Nos encontramos de nuevo, brujo. ¿Qué necesitas?»"
ev6.4.desc:0 "«[this0.GetTitledFirstName] en persona. Bienvenido. No tengo ninguna oferta especial para ti, pero, ya que estoy aquí, puedo enseñarte un hechizo nuevo. Considéralo un regalo.»"
hells_scepter:0 "Cetro del Infierno"
hells_scepter_desc:0 "Se dice que este artefacto perteneció al mismísimo Lucifer. No está claro cómo acabó fuera del Infierno."
ev93.1.title:0 "Cetro misterioso"
ev93.1.desc:0 "Tus sirvientes han encontrado un objeto valioso oculto en las mazmorras del castillo. Es un cetro elaborado con gran maestría a partir de una aleación desconocida, y su superficie parece irradiar un calor agradable. No sabes qué es, pero podría resultar útil."
hells_scepter1_terrain_cancel_negative_supply:0 "Permite a los magos invocar demonios por tipo o por nombre"
hells_scepter2_terrain_cancel_negative_supply:0 "Inmunidad al hechizo de destierro para demonios"
hells_scepter3_terrain_advantage:0 "Experiencia anual de Poder Infernal para demonios"
ev12.0.c:0 "¡Ha llegado el momento de invocar algo realmente poderoso!"
ev12.0.c_ct:0 "Esta opción está disponible porque tienes el Cetro del Infierno."
ev6.5.desc:0 "Con la ayuda del Cetro del Infierno, casi cualquier demonio responderá a tu llamada. Puedes invocar un tipo específico de demonio o invocar por su nombre a uno que ya hayas conocido."
ev6.5.0.a:0 "Demonio mayor"
trait_track_combat_magic:0 "Magia de combate"
trait_track_combat_magic_desc:0 "La destreza en el uso de hechizos de combate puede resultar útil tanto en el campo de batalla como en un duelo contra otros adeptos de la magia."
pot6:0 "Elixir de carisma"
pot6_modifier:0 "Elixir de carisma"
pot6_desc:0 "Beber esta mezcla te dará mayor influencia sobre otros gobernantes, al menos durante un tiempo."
gain_pot6_ct:0 "Obtienes Elixir de carisma"
drink_pot6_decision:0 "Usar elixir de carisma"
drink_pot6_decision_tooltip:0 "Beber esta mezcla te dará mayor influencia sobre otros gobernantes."
drink_pot6_decision_desc:0 "Beber esta mezcla te dará mayor influencia sobre otros gobernantes."
drink_pot6_decision_confirm:0 "Beber la poción"
pot7:0 "Poción de lectura mental"
pot7_desc:0 "Usar este brebaje te permite leer la mente de otros personajes."
gain_pot7_ct:0 "Obtienes Poción de lectura mental"
drink_pot7_decision:0 "Usar poción de lectura mental"
drink_pot7_decision_tooltip:0 "Usar este brebaje te permite leer la mente de otros personajes."
drink_pot7_decision_desc:0 "Usar este brebaje te permite leer la mente de otros personajes."
drink_pot7_decision_ct:0 "Durante 6 meses, el hechizo #italic Lectura mental#! no consumirá saturación de poder."
drink_pot7_decision_confirm:0 "Beber la poción"
setting_high_whunters:0 "Alto"
setting_high_whunters_desc:0 "Los cazadores aparecerán con mayor frecuencia y el cazador principal de brujas recibirá recursos adicionales."
nyx_name:0 "Nyx"
ev6.6.title:0 "Dama de los Sueños"
ev6.6.desc:0 "En el círculo de invocación aparece una mujer. Sientes que de ella emana un aura mágica como ninguna que hayas experimentado antes. No se trata de un demonio corriente. \n«Hace mucho tiempo que no piso este mundo», dice la demonio, «y aún más desde que alguien logró atraparme con un hechizo de invocación. No eres un practicante cualquiera.»"
ev6.6.0.a:0 "¿Quién eres y qué poderes puedes concederme, demonio?"
ev6.7.desc:0 "«Me llaman Nyx. Puedo observar y manipular los sueños de mortales y de otros seres. Es un poder muy especial que recibí de mi maestro. Puede que no le agrade enterarse de nuestro encuentro... oh, y puedes estar seguro de que se enterará.»"
ev6.7.0.a:0 "¿Quién es tu maestro?"
ev6.7.0.b:0 "¿Influir en los sueños? Eso podría ser útil."
ev6.7.0.c:0 "No quiero tratar con tu maestro, sea quien sea. Márchate."
ev6.8.desc:0 "«No tiene nombre, aunque sus enemigos a veces lo llaman la Maldad Eterna. Es tan antiguo como tu dios. Por suerte, rara vez se interesa por vuestro mundo; tiene metas mucho más ambiciosas.»"
ev6.8.0.a:0 "Ya veo... Dime qué puedes hacer por mí."
ev6.8.0.b:0 "En ese caso, no quiero meterme con tu maestro. Márchate."
ev6.9.desc:0 "«Poseo el poder de influir en los sueños. Eso abre posibilidades ilimitadas para la manipulación o la obtención de información. ¿Qué deseas?»"
ev6.9.desc2:0 "«Invocarme nunca es del todo seguro para ti, mago. ¿Qué quieres esta vez?»"
ev6.9.0.a:0 "Haz que la gente crea que mis pretensiones son legítimas."
ev6.9.0.b:0 "Haz que la gente me muestre más respeto y obediencia."
ev6.9.0.c:0 "¿Puedes decirme si alguien conspira contra mí?"
ev6.9.0.c_ct:0 "Descubrirás si eres el objetivo de alguna conspiración."
ev6.9.0.d:0 "Me gustaría tener buenos sueños, nada más."
nyx_blessing_modifier:0 "Bendición de Nyx"
peaceful_dreams_modifier:0 "Sueños apacibles"
ev6.10.desc:0 "No. Conozco los sueños de la mayoría de la gente y no he visto en ellos ninguna señal de que alguien esté conspirando contra ti. Aunque sí hay personas que te odian... En fin, hice lo que me pediste. Adiós."
ev6.10.desc2:0 "Sí, conozco al menos una conspiración contra ti: [mscheme.GetFullActionName]. [sowner.GetTitledFirstName] está detrás, por supuesto. Eso es todo lo que sé por ahora."
ev6.10.0.a:0 "Lo expondré de inmediato."
you_are_cursed:0 "¡Estás bajo una maldición!"
IS_MAGICAL_ARTIFACT:0 "Este artefacto está bien protegido: $VALUE|+0=$"
mind_scan_terrain_cancel_negative_supply:0 "Desbloquea el hechizo #italic Lectura mental#!"
mind_scan_ct1:0 "Descubrirás si el objetivo forma parte de un complot"
mind_scan_ct2:0 "Puedes aprender un secreto aleatorio del objetivo"
mind_scan_ct3:0 "El objetivo no será consciente de tu hechizo"
mind_scan:0 "Lectura mental"
mind_scan_desc:0 "Usa el poder de la lectura mental para asomarte a la mente de otra persona."
ev6.11.desc:0 "Parece que [recipient.GetTitledFirstName] no está implicado en ninguna conspiración, y tampoco has encontrado ningún secreto importante en su mente."
ev6.11.desc2:0 "En la mente de [recipient.GetTitledFirstName] ves con claridad que [recipient.GetSheHe] conspira contra [mstarget.GetTitledFirstName]. El complot es [mscheme.GetFullActionName]."
ev6.11.desc3:0 "En la mente de [recipient.GetTitledFirstName] ves con claridad que [recipient.GetSheHe] es agente de una conjura dirigida por [mschemeowner2.GetTitledFirstName] contra [mstarget.GetTitledFirstName]. Se trata de [mscheme2.GetFullActionName]."
ev6.11.desc4:0 "En la mente de [recipient.GetTitledFirstName] ves con claridad que [recipient.GetSheHe] no participa ahora mismo en ninguna intriga, aunque [recipient.GetSheHe] sí guarda sus propios secretos..."
DS_WANT_NOT_LOSS_MAGIC:0 "Teme perder artefactos mágicos: $VALUE|=+0$"
DS_HAS_MAGE_RULERSHIP:0 "#P Gobierno de magos#!: $VALUE|=+0$"
asmodeus_name:0 "Asmodeus"
ev6.12.title:0 "El Señor del Infierno"
ev6.12.desc:0 "Una figura que emana una fuerza inmensa se materializa en la cámara. Comprendes al instante que probablemente se trata del ser más poderoso con el que te has cruzado jamás. Quizá invocar a esta criatura no haya sido tu mejor idea...\n«Soy Asmodeo, príncipe del Infierno». El demonio te observa fijamente."
ev6.12.0.a:0 "He oído ese nombre en alguna parte..."
ev6.13.desc:0 "«Deberías conocerlo. Soy la mano derecha del propio Lucifer y el señor del Sexto Círculo del Infierno. Has tenido la mala suerte de que tu hechizo me invocara, mortal». Sientes el poder del demonio penetrando en tu mente y repasando tus recuerdos. Esto no debería ser posible; el círculo de invocación tendría que aislarte..."
ev6.13.0.a:0 "¿Cómo...?"
ev6.13.0.b:0 "¡Desaparece, ahora!"
ev6.14.desc:0 "El demonio se echa a reír. «No me estás escuchando, mortal. Soy casi el demonio más poderoso que existe, y tú, por descuido, me has invocado». Chasquea los dedos y el círculo protector de invocación se desvanece por completo. Ahora nada impide que el demonio te golpee con todo su poder.\n«Mi propuesta es sencilla: sirve o muere.»"
ev6.14.0.a:0 "Ningún demonio me dará órdenes."
ev6.14.0.b:0 "No hacen falta amenazas..."
ev6.14.0.c:0 "Que así sea. Te serviré."
ev6.15.desc:0 "Esperabas el ataque, pero aun así no logras detenerlo. El hechizo del demonio te derriba al instante. ¡Su poder es inimaginable!\n«Sírveme... o muere.»"
ev6.15.0.a:0 "¡Jamás!"
ev6.15.0.a_ct:0 "Intentas atacar al demonio con un golpe poderoso."
ev6.15.0.a_ct2:0 "Atacas al demonio con todo tu poder."
ev6.15.0.b:0 "Que así sea. Me rindo; soy tuyo."
ev6.16.desc:0 "Tu hechizo rebota inofensivamente contra el demonio. Él, sin embargo, parece satisfecho.\n«Impresionante. No te faltan coraje ni perseverancia. Tu magia es débil, pero quizá algún día alcances la grandeza, al menos para un ser humano. Cuando llegue ese día, volveré para enfrentarme a ti. Que te vaya bien, mortal.»"
ev6.16.desc2:0 "Tu hechizo rebota inofensivamente contra el demonio. Él, sin embargo, parece satisfecho.\n«Impresionante. No te faltan coraje ni perseverancia. Tu magia es débil, pero quizá algún día alcances la grandeza. Cuando llegue ese día, volveré para enfrentarme a ti. Que te vaya bien, [ROOT.Char.Custom('GetMortalDemon')].»"
ev6.17.desc:0 "«Buena elección. Aunque la cuestión es si un gusano como tú me servirá de algo. Primero, una pequeña prueba. Llama a tu heredero; quiero que lo atravieses con una espada.»"
ev6.17.0.a:0 "Pensándolo mejor... no."
ev6.18.desc:0 "«Era una prueba, pero no de lealtad. Has fracasado. No necesito a un sirviente tan patético. Adiós, mortal. Y, si vuelves a invocarme, dejaré de ser amable.»"
ev6.19.desc:0 "Tu hechizo alcanza al demonio y lo sacude con fuerza. Parece sorprendido, pero al cabo de un instante sonríe.\n«No está mal para un humano. Sería una pena matarte antes de que alcances todo tu potencial. Quizá volvamos a vernos, brujo.»"
achoris_name:0 "Achoris"
ev6.20.title:0 "Visita inesperada"
ev6.20.desc:0 "Esta mañana un hombre ha exigido una audiencia. Aunque nadie lo conoce, se ha mostrado tan persuasivo que tus guardias le han dejado pasar. Decides concederle unos instantes de tu valioso tiempo."
ev6.20.0.a:0 "¿Quién eres, forastero?"
ev6.21.desc:0 "«Me llaman Achoris. Soy miembro de un antiguo aquelarre que se ocupa de asuntos importantes de este mundo. Uno de ellos es la protección del Anillo de la Vida. Ese artefacto nos fue robado hace mucho tiempo, pero hemos descubierto que ahora está en tu poder. Nos gustaría recuperarlo.»"
ev6.21.0.a:0 "Creo que el anillo estará más seguro conmigo."
ev6.21.0.b:0 "Hablemos del precio."
ev6.22.desc:0 "«Eres un necio. ¿Crees que el anillo solo da y no exige nada a cambio? No tienes ni idea de cuántos lo buscan. El Anillo solo estará seguro en manos de mi aquelarre.»"
ev6.22.0.a:0 "No te creo. Vete antes de que llame a los guardias."
ev6.22.0.b:0 "Bueno, en ese caso puedo darte el Anillo, pero no gratis."
ev6.23.desc:0 "«¡Te arrepentirás!». Tras esas palabras, Achoris abandona la cámara. Tienes la sensación de que aún dará más problemas."
ev6.23.0.a:0 "Ordeno a los guardias que no le quiten ojo de encima."
ev6.24.desc:0 "«Por supuesto, pagaré en oro. También te entregaré algunos pergaminos de los archivos de mi aquelarre como gesto amistoso.»"
ev6.25.desc:0 "Pocos instantes después de que Achoris se marche, te das cuenta de que algo malo le ha ocurrido al Anillo. ¡Su poder ha sido suprimido! Aún puedes percibirlo, pero el artefacto no funciona correctamente; algo lo ha bloqueado. Debe de tratarse de algún truco de ese Achoris. Quizá una investigación mágica pueda arreglarlo, o tal vez tengas que encontrar otra solución."
ev6.25.0.a_ct1:0 "Realizar investigaciones mágicas puede restaurar el poder del anillo."
ev6.25.0.a_ct2:0 "Encarcelar e interrogar a Achoris también puede resolver el problema."
artifact_ring_of_life_modifier0:0 "Poder suprimido"
artifact_ring_of_life_modifier:0 "El poder pleno del Anillo de la Vida."
ev6.25.0.a:0 "Una pequeña reconfiguración del aura debería bastar."
ev6.25.0.b:0 "Puedo saturar el anillo con mi propia magia."
ev6.25.0.c:0 "Achoris y yo deberíamos tener una charla."
ev3.22.c:0 "Tengo que restaurar el poder del Anillo de la Vida."
ev3.22.c_ct:0 "Intentarás reparar el artefacto."
ev6.26.desc:0 "Primero debes comprender el principio del anillo. ¿De dónde procede realmente su poder? ¿Cómo y por qué fue creado? Son muchas las preguntas que deben hallar respuesta."
ev6.26.0.a:0 "Empezaré hojeando mis libros."
ev6.26.0.b:0 "Quizá convenga hacer algunos experimentos aquí."
ev6.26.0.c:0 "Que mi aquelarre busque información útil."
ev6.27.desc:0 "Has encontrado información útil, pero todavía te queda mucho trabajo por delante. Parece que el anillo es un artefacto más complicado de lo que pensabas."
ev6.27.0.a_ct:0 "Necesitas más tiempo para averiguarlo."
ev6.27.0.b_ct:0 "Pones fin a tu investigación mágica sin resultados."
ev6.28.0.b:0 "En realidad, mis conocimientos alquímicos me permitirán hacerlo más barato."
ev6.29.desc:0 "Has logrado un gran avance: has descubierto cómo funciona el anillo. El artefacto contiene a un demonio, o al menos fragmentos de su poder. La conexión con ese poder se ha roto, pero puedes lanzar un hechizo que la restablezca."
ev6.30.desc:0 "Achoris está a tu merced. No tardas en quebrarlo y acaba revelándote el método que usó para reparar el anillo. Sin embargo, no consigues arrancarle nada más.\n«¡Vendrán otros a detenerte!». Esas fueron sus últimas palabras antes de tomar el veneno que ocultaba. No tuviste tiempo de impedírselo."
ev6.30.0.a:0 "Al menos el anillo vuelve a funcionar."
ev6.31.title:0 "Gestión del aquelarre"
ev6.31.desc:0 "Has llegado a la conclusión de que el aquelarre necesita más recursos para alcanzar sus objetivos. Tal vez valga la pena cobrar una pequeña cuota de afiliación."
ev6.31.0.a:0 "Sí, hagámoslo."
ev6.31.0.b:0 "Podría hacerlo, pero antes será mejor consolidar mi posición."
ev6.32.desc:0 "Parece que uno de los miembros de tu aquelarre, [hunter_vict.GetTitledFirstName], ha caído víctima de unos cazadores de brujas. Su cuerpo apareció decapitado, con una bala incrustada en su corazón. La cuestión es si [hunter_vict.GetSheHe] fue interrogado antes de su muerte; si fue así, todo el aquelarre está en peligro."
ev6.32.0.a:0 "¡Malditos cazadores!"
ev6.32.0.b:0 "Será mejor no celebrar ningún Gran Rito durante un tiempo."
ev6.32.0.c:0 "Pondré precio a la cabeza de esos cabrones."
ev6.32.0.c_ct:0 "Los cazadores podrían reducir su actividad durante un tiempo."
ev6.32.0.d:0 "Encontraré la forma de distraerlos de nuestro aquelarre."
ev6.33.title:0 "Rivalidad entre aquelarres"
ev6.33.desc:0 "Desde hace tiempo sabes que otro aquelarre también actúa en tu reino. Nunca le prestaste demasiada atención porque, hasta donde sabes, sus miembros son en su mayoría campesinos. Sin embargo, últimamente ese aquelarre ha ido ganando fuerza, y su gran maestre parece haber aprendido de verdad algunas cosas sobre magia. Quizá haya que hacer algo antes de que se convierta en un problema."
ev6.33.0.a:0 "Varias ejecuciones de campesinos les recordarán cuál es su lugar."
ev6.33.0.b:0 "Enviaré mercenarios para encargarse del asunto discretamente."
ev6.33.0.c:0 "Mis espías desmantelarán ese aquelarre desde dentro."
MUST_ACCEPTS_WITCHCRAFT:0 "Tu fe debe aceptar la brujería"
mage_rulership_tradition:0 "Gobierno de magos"
mage_rulership_tradition_name:0 "Gobierno de magos"
mage_rulership_tradition_desc:0 "Esta tradición considera que tener afinidad mágica es un atributo natural de un verdadero gobernante. Tu poder y tus aptitudes mágicas determinan tu lugar en la sociedad."
ALREADY_HAS_GE_PALACE:0 "Solo puedes tener una construcción de este tipo."
MAGE_RULERSHIP_REQUIRED:0 "Debes tener la tradición cultural Gobierno de magos."
culture_parameter_mage_rulership_rule:0 "Desbloquea la cadena de edificios de la Torre de magos."
culture_parameter_mage_rulership_rule2:0 "La [interaction|E] Enseñar hechicería tiene un tiempo de reutilización reducido y te otorga renombre dinástico."
culture_parameter_mage_rulership_rule3:0 "Las ejecuciones restauran niveles de saturación de poder."
mage_rulership_execution:0 "¡Tu poder está creciendo!"
culture_parameter_mage_rulership_rule4:0 "Los magos son más propensos a participar en duelos de magos."
culture_parameter_mage_rulership_rule5:0 "El vencedor del Duelo de Magos puede exigir las reclamaciones del perdedor o el título principal de su señor."
culture_parameter_mage_rulership_rule6:0 "Los magos ganan prestigio adicional y mayor opinión de los vasallos."
culture_parameter_mage_rulership_rule7:0 "Revocar el título de un vasallo no practicante no provoca tiranía."
ev5.28.0.z3bb:0 "Te perdonaré, pero has demostrado que no mereces tus títulos."
ev5.28.desc_lost6:0 "Intentas defenderte hábilmente de los hechizos enemigos, pero tu oponente es demasiado poderoso. Pierdes rápidamente las fuerzas y caes de rodillas, indefenso. Tu oponente decide perdonarte, pero debes entregar algunos de tus títulos."
ev6.36.title:0 "El poder no es para los débiles"
ev6.36.desc:0 "Tu señor, [liege0.GetTitledFirstName], a diferencia de ti, no posee grandes habilidades mágicas. ¿Debería seguir gobernando un gobernante tan débil? Quizá esta sea una buena oportunidad para pensar en ocupar su lugar."
ev6.36.0.a:0 "Hablaré de esto con otros vasallos."
ev6.36.0.b:0 "Merece la pena recordarle a [liege0.GetHerHim] que sus habilidades son inferiores a las mías."
ev6.38.title:0 "Gripe mágica"
ev6.38.desc:0 "Llevas un tiempo sintiéndote peor y parece que padeces alguna enfermedad. Sin embargo, no es nada corriente: este mal afecta de algún modo a tu aura mágica y, como resultado, bloquea tu flujo de poder. Todo indica que, mientras sigas enfermo, no podrás restaurar tu saturación de poder."
ev6.38.0.a:0 "Espero recuperarme pronto."
magic_flu_modifier:0 "Gripe mágica"
HAS_MAGIC_FLU:0 "No puedes restaurar poder mientras padezcas gripe mágica."
ev6.39.title:0 "¿Marioneta?"
ev6.39.desc:0 "Hace poco percibiste un ligero cambio en tu aura mágica. Podría tratarse de una perturbación aleatoria... o quizá alguien te lanzó un hechizo. Si fue así, es difícil saber cuándo ocurrió o qué efectos podría tener sobre ti. Has intentado investigarlo, pero no has encontrado pruebas concluyentes. Si realmente se trata de un hechizo, los rastros de tu aura indican que podría ser un hechizo de dominación. Por otro lado, un hechizo así no debería atravesar tu protección mágica... ¿verdad?"
ev6.39.0.a:0 "¿¡Alguien me está controlando!?"
ev6.40.title:0 "Corrupción"
ev6.40.desc:0 "La exposición prolongada a una magia poderosa deja marcas en tu cuerpo y en tu mente. Los cambios que has experimentado pronto podrían volverse irreversibles."
ev6.40.0.a:0 "Los tratamientos alquímicos pueden ayudar."
ev6.40.0.a_ct:0 "El problema puede volver en el futuro."
ev6.40.0.b:0 "Uso la magia solo con fines nobles; la corrupción no supone una amenaza para mí."
ev6.41.title:0 "Fuente agotada"
ev6.41.desc:0 "Tras muchos años usando magia, sientes que tu poder se está marchitando. Quizá la vejez no afecte solo al cuerpo, sino también al espíritu y a la capacidad de procesar el poder mágico."
ev6.41.0.a:0 "La edad es una pesada carga."
ev6.41.0.b:0 "Conozco formas de impedirlo."
ev6.41.0.c:0 "Encontraré la solución en el Grimorio Negro."
alhazred_dynasty:0 "Al-Hazred"
alhazred_house:0 "Al-Hazred"
alhazred_house_adj:0 "Al-Hazred"
mad_arab_nickname:0 "Árabe loco"
singularity2_name:0 "Singularidad Antigua Mk.II"
singularity2_desc:0 "Un antiguo artefacto concebido para la destrucción. Esta versión mejorada posee un núcleo de energía reforzado, además de numerosas medidas de seguridad adicionales, y el propio artefacto está protegido por un hechizo de indetectabilidad."
rule_magic_endings:0 "Brujería: regreso del archimago"
setting_normal_magic_endings:0 "Puede aparecer"
setting_normal_magic_endings_desc:0 "Tendrás que enfrentarte a un antiguo adversario de poder increíble. Recomendado solo para jugadores experimentados que busquen un desafío adicional al final de la partida."
setting_never_magic_endings:0 "No puede aparecer"
setting_never_magic_endings_desc:0 "El antiguo archimago no te molestará."
domination_range_terrain_cancel_negative_supply:0 "#italic Dominación#! tiene mayor alcance"
mind_scan_range_terrain_cancel_negative_supply:0 "#italic Lectura mental#! tiene mayor alcance"
setting_eu_magic_arts:0 "Zona del jugador"
setting_eu_magic_arts_desc:0 "Los artefactos se distribuirán dentro del alcance diplomático del jugador."
ev6.42.title:0 "Invitado misterioso"
 ev6.42.desc:0 "De pronto te das cuenta de que la sala del trono se ha quedado antinaturalmente silenciosa: los cortesanos han desaparecido y no hay sirvientes ni guardias. En su lugar, en mitad de la estancia, se alza él: un hombre con máscara, rodeado por un aura mágica apenas perceptible.\n«Saludos, mago. He venido a ofrecerte un regalo maravilloso: mi amistad.»"
ev6.42.0.a:0 "Nunca se tienen demasiados amigos..."
ev6.43.title:0 "El Archimago"
ev6.43.desc:0 "«Pienso lo mismo. Me llamo Abdul Al-Hazred y soy archimago. Puede que hayas oído hablar de mí. Puede que incluso hayas leído mi Al Azif. Al parecer lo han traducido como Grimorio Negro.»"
ev6.43.0.a:0 "¿El autor del Grimorio Negro? Encantado de conocerte."
ev6.44.desc:0 "«¿Qué iba a decir...? Ah, ya lo recuerdo. La amistad. En mis tiempos, los amigos se hacían regalos como prueba de su devoción. Creo que tus artefactos mágicos serían un magnífico obsequio. Para mí.»"
ev6.44.0.a:0 "Entiendo que el regalo que me ofrecerás a cambio será igual de valioso, ¿verdad?"
ev6.45.desc:0 "«Te ofrezco mi amistad a cambio. Créeme, no es poca cosa. Es algo que puede salvarte, al menos por un tiempo.»"
ev6.45.0.a:0 "Eso no suena muy amistoso."
ev6.46.desc:0 "No puedes ver el rostro del mago, pero reconoces por su voz que está sonriendo.\n«En efecto. Pero es mejor retorcer un poco el significado de la palabra \"amistad\" que acabar convertido en cadáver. Yo soy un archimago ancestral, y tú no eres nadie. Un poco de suerte y unos cuantos trucos de feria bastaron para que la gente te mirara con admiración. Patético. Solo hizo falta que abandonara este mundo durante unos siglos para que apareciera algún necio incompetente intentando ocupar mi lugar.»"
ev6.46.0.a:0 "Este mundo es lo bastante grande para los dos."
ev6.46.0.b:0 "Ya veremos quién es el necio cuando termine contigo."
ev6.47.desc:0 "«Bueno, en este mundo solo puede haber un archimago verdadero. Fui cortés y decidí hablar primero en vez de reducir tu castillo a escombros de inmediato. Pero ahora veo que tu dinastía debe ser destruida; servirá de ejemplo para otros magos. Te concederé un mes más de vida. Al fin y al cabo, no tengo prisa por ir a ninguna parte, y ya he apostado sobre si intentarás huir. Adiós.» El mago desaparece."
ev6.47.0.a:0 "Puede que sea mi enemigo más peligroso."
mage_nickname:0 "el Mago"
mage2_nickname:0 "el Guardián de los Secretos"
mage3_nickname:0 "el Maestro del Saber"
mage4m_nickname:0 "el Rey Imperecedero"
mage5m_nickname:0 "el Encantador"
mage6m_nickname:0 "el Dios Emperador"
mage4f_nickname:0 "la Reina de las Sombras"
mage5f_nickname:0 "la Encantadora"
demonslayer_nickname:0 "el Azote de Demonios"
archmage_nickname:0 "el Archimago"
ev6.48.desc:0 "En cierto momento sentiste una oleada de energía mágica elevarse a tu alrededor. Un portal mágico se abrió a tu lado y... un demonio salió de él."
ev6.49.desc:0 "'Abdul Al-Hazred me ha invocado para matarte. Ninguno de los dos puede elegir, mago.'"
ev6.49.0.a:0 "En ese caso, luchemos."
ev6.49.0.b:0 "¡Te destierro!"
ev6.49.0.b_ct:0 "Intentas usar el hechizo de destierro de demonios."
ev6.50.desc:0 "'Por desgracia, Al-Hazred lo previó y lanzó un hechizo de protección adecuado. Tenemos que luchar.'"
ev6.53.opening:0 "[abdul.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
ev6.53.desc:0 "He oído que sigues con vida. Me alegra que mi demonio no te matara; habría sido demasiado fácil. Prefiero verte suplicando misericordia, y cuanto más te resistes, más feliz me hace. He estado bastante ocupado últimamente —ya sabes, política—, pero te he preparado algunas sorpresas. Quizá nos veamos pronto..."
ev6.53.0.a:0 "Ese canalla está tramando algo."
ev6.54.desc:0 "He descubierto tu complot contra mí. Un intento bastante patético. Espero que la próxima vez te esfuerces más."
ev6.55.desc:0 "Tu percepción mágica detectó que se había lanzado un hechizo poderoso. Pudiste determinar que era una maldición formidable dirigida contra tu heredero. Por desgracia, el conjuro causó grandes estragos. Crees saber quién pudo lanzarlo."
ev6.55.0.a:0 "¡Al-Hazred, malnacido!"
ev6.56.title:0 "Duplicado"
 ev6.56.desc:0 "Mientras recorres los pasillos de tu castillo, te encuentras con [rconc.GetTitledFirstName]. [rconc.GetSheHe|U] se sorprende mucho al verte.\n«Mi señor, acabamos de reunirnos. Con vos. Pero no podíais ser vos, porque estáis aquí. Entonces, ¿quién es el hombre que está en la sala del consejo?»"
ev6.56.0.a:0 "¡Es una pregunta excelente!"
ev6.56.0.a_ct:0 "Te apresuras a comprobar la sala del consejo."
 ev6.57.desc:0 "En la sala del consejo ves... a ti mismo. Tu reflejo te devuelve la mirada con una sonrisa burlona.\n«Esto se ha vuelto incómodo, ¿no crees?»"
ev6.58.desc:0 "Entonces el hechizo de ilusión se desvanece y ves a Abdul Al-Hazred ante ti.\n«Hoy tenía un rato libre y he pensado que quizá podría ayudarte un poco con el gobierno. Verás, he tenido una mañana ajetreada. Es decir, la has tenido tú.»"
ev6.59.desc:0 "«Bueno, he enviado unas cartas muy conmovedoras a tus vasallos...»"
ev6.60.desc:0 "«...he gastado parte de tu dinero; el gremio criminal local necesitaba un rescate...»"
ev6.60.0.a:0 "...!"
ev6.61.desc:0 "«...y es posible que haya condenado a muerte a varias personas al azar en tu nombre.»"
ev6.61.0.a:0 "Tú... tú..."
ev6.61.0.b:0 "Ya basta. ¡Muere!"
ev6.61.0.b_ct:0 "Atacarás al mago con un hechizo."
ev6.62.desc:0 "«Ah, y conocí a [target.GetTitledFirstName]. ¡Nos lo pasamos muy bien!»"
ev6.63.desc:0 "Quizá el odio te dio fuerzas, o tal vez Al-Hazred estaba demasiado concentrado en su discurso, pero tu hechizo lo alcanzó. No logró atravesar por completo su protección mágica, pero sí conseguiste herirlo. Durante un instante pareció sorprendido, y entonces desapareció. Debió de teletransportarse a un lugar seguro."
ev6.63.0.a:0 "¡Pagará por todo!"
ev6.64.title:0 "Represalia"
ev6.64.desc:0 "Se suponía que iba a ser un día como cualquier otro cuando, de pronto, un rayo de energía mortal cayó del cielo y se estrelló de lleno contra tu castillo. Todo se incendió; solo alcanzas a oír los gritos y alaridos de los supervivientes. Debe de ser la represalia de Al-Hazred: ¡él también posee la Singularidad Antigua!"
ev6.65.title:0 "Malas noticias"
ev6.65.desc:0 "Te han llegado malas noticias. [rconc.GetTitledFirstName] acaba de informarte de que se ha puesto precio a tu cabeza y a la de tu familia. Al-Hazred paga 1000 monedas por cada una. Es una suma lo bastante alta como para atraer no solo a asesinos a sueldo, sino también a gobernantes locales."
ev6.65.0.a:0 "Tengo que detenerlo antes de que nos mate a todos."
madman_modifier:0 "Demente"
madman_modifier_desc:0 "Esta persona tiene fama de ser un demente peligroso."
ev2.61.g:0 "Puedo enseñarle magia a [lliege.GetHerHim]."
ev6.66.title:0 "Devoraniños"
ev6.66.desc:0 "Tu dieta a base de niños está perjudicando tu reputación. Es cierto que no hay pruebas de tus actividades, pero mucha gente empieza a relacionarte con la desaparición de menores."
ev6.66.0.a:0 "Bien..."
ev6.66.0.a_ct:0 "La desaparición de menores puede dañar tu reputación."
fed_dark_blade_interaction_ct2:0 "#N Puede haber consecuencias si alguien descubre este acto.#!"
ev6.67.desc:0 "Por desgracia, esta vez tu visita a las mazmorras no ha pasado desapercibida. Hay varios cortesanos merodeando y, si te ven con la Hoja Oscura goteando sangre, no tardarán en imaginar lo que has hecho."
ev6.67.0.a:0 "Si empiezan a hacer preguntas, también los mataré."
ev6.67.0.b:0 "No pienso mantenerlo en secreto de todos modos."
ev6.67.0.c:0 "Es asunto mío lo que haga en mis mazmorras."
ev6.67.0.a_ct:0 "El ruido puede atraer a más gente."
ev6.68.desc:0 "Los ruidos atrajeron a aún más cortesanos. Ahora mantenerlo todo en secreto será aún más difícil..."
ev6.68.0.a:0 "Bien, ellos también morirán."
ev6.68.0.b:0 "Que así sea, lo confesaré todo."
ev3.5.h:0 "¡Matar a Al-Hazred!"
ev6.70.desc:0 "«El Árabe Loco» es demasiado poderoso incluso para mí. Tendrás que pedirme otra cosa."
ev6.70.0.a:0 "Entonces tengo una petición diferente."
MAGIC_DOMINATION_O1:0 "Imponer un cambio de fe y cultura"
ev6.71.desc:0 "Parece que no hay un buen lugar en la zona para levantar una Torre del Mago. Será necesario resolver este problema de algún modo."
ev6.71.0.b:0 "[place1.GetName] podría ser un buen lugar."
ev6.71.0.c:0 "Construiremos una torre en [place2.GetName]."
ev6.71.0.d:0 "No necesito una torre; un pequeño laboratorio bastará."
magic_lab_modifier:0 "Laboratorio mágico"
ev6.71.0.e:0 "Tengo que considerar todas las opciones."
ev6.71.0.e_ct:0 "Reconsiderarás la ubicación de la torre en 10 años."
ev2.24.e:0 "Calmaos, caballero."
ev2.24.e_ct:0 "Convencerás al caballero de que no eres una amenaza."
ev28.0.c:0 "El portador del Cetro del Infierno no tiene por qué arrodillarse ante ningún demonio."
ev6.72.desc:0 "Ah, sí, el cetro. Incluso yo temo ponerle la mano encima y, por lo que sé, a Lucifer le gustaría recuperarlo. Prefiero no interponerme en tu camino. Adiós, mago."
ev6.73.desc:0 "Últimamente tus consejeros han observado que permaneces absorto en un proyecto muy particular. Al parecer esperan que lo reveles o, cuando menos, que hagas una declaración al respecto."
ev6.73.0.a:0 "Esto es asunto de magos."
ev6.73.0.b:0 "Cuanto menos sepáis, más viviréis."
ev6.73.0.c:0 "Puedo mostraros los detalles."
ev6.73.0.d:0 "Es un proyecto magnífico, pero no necesitáis saber más."
ALREADY_HAS_STRONG_HOOK:0 "Ya tienes un gancho fuerte sobre este personaje."
ev3.21.a_ctct:0 "¡Se ha desbloqueado Enfoque Arcano!"
md_doom_spell3_terrain_advantage:0 "Progreso del [doom_spell|E] del oponente"
