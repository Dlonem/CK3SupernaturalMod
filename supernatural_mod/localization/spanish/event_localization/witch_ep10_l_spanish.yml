 witch_hunter_crossbow_desc:0 "This is an advanced weapon, capable in skilled hands of launching projectiles far beyond any other device - perhaps with the exception of siege engines. Only an outstanding innovator-inventor or a secret workshop of witch hunters could have created such technology."
