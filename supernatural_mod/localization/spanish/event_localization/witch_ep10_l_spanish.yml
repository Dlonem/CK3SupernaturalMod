 ev11.191.desc:0 "The spell is stable; you have full access to [recipient.GetTitledFirstName]'s mind. Many things can be altered here, though caution is advised - it's easy to break something...\nAs you contemplate designing a new personality, several ideas come to mind."
 ev11.191.0.a:0 "Aggressive warrior."
