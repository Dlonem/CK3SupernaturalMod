 mr_pop_magic_academy:0 "#t $building_type_mage_house$#!\n$building_type_mage_house_desc$"
 mr_pop_horned_temple:0 "#t $building_horned_god_house$#!\n$building_horned_god_house_desc$"
 ev11.42.title:0 "Risky Experiment"
 ev11.42.desc:0 "You've managed to devise a plan for a series of experiments whose results should yield a wealth of crucial information. It could be vital to the success of the entire project. The problem is that if you made even a small mistake in your calculations, the consequences might turn out not only enlightening, but deadly..."
 ev11.42.0.a:0 "Let's get to it."
 ev11.42.0.b:0 "I'd better abandon this idea."
 ev11.42.0.c:0 "I'll work on a safer version."
 ev11.42.0.d:0 "I'll introduce a few improvements to the process."
 curse_expert_txt:0 "Improved curses."
 mr_curse_expert_modifier:0 "Mastery in Curses"
 mr_curse_expert_spec1_terrain_cancel_negative_supply:0 "A death curse always causes death"
 mr_curse_expert_spec2_terrain_cancel_negative_supply:0 "A mental curse always causes [GetTrait('incapable').GetName( GetNullCharacter )|L]"
 magical_plants_modifier:0 "Magical Plants"
 magical_plants2_modifier:0 "$magical_plants_modifier$"
 ev11.43.desc:0 "Your research has led you into unexpected territory. The magical mechanism you intend to use in your work needs to be tested in practice, and the best approach would be to infuse organic matter with magic. Plants seem like the obvious subjects for such experiments..."
 ev11.43.0.a:0 "Enchanting plants sounds intriguing."
 ev11.43.0.a_ct1:0 "The results of this action will be unpredictable."
 ev11.43.0.b:0 "I prefer to stick to conventional research methods."
 ev11.44.desc:0 "Your research into magical plants turned out to be a dead end for your project, but working on them allowed you to uncover several important insights about integrating raw magical energy with organic matter. This knowledge may prove useful in the future."
 ev11.44.0.a:0 "Well, it was worth a try."
 ev11.45.desc:0 "Your botanical experiment has served its purpose - it allowed you to test and refine the magical process you can now apply to your main research. But there's more - you realize that enchanting plants may have various useful applications worth exploring. Besides, leaving those enchanted plants unattended could lead to unpredictable results..."
 ev11.45.0.a:0 "These plants require further study and care."
 ev11.45.0.b:0 "It's time to return to the main research."
 ev11.45.0.c:0 "I think I know how to use these plants."
 ev11.46.desc:0 "The current stage of your research requires analyzing how different types of energy clash with one another. This effect often appears when two magical forces collide, making it a typical phenomenon accompanying duels between mages or magical beings. The simplest approach would be to summon a demon and face it in combat while your diagnostic spells gather the necessary data. Of course, fighting a demon always carries a certain degree of risk."
 ev11.46.0.a:0 "Then I'll fight the demon."
 ev11.46.0.a_ct:0 "You will summon a demon."
 ev11.46.0.b:0 "I'll look for a safer method."
 ev11.47.title:0 "Magical Practice"
 ev11.47.desc:0 "Your research is still ongoing, but you already know that what you're working on is only the tip of an iceberg filled with magical mysteries - a narrow branch of a single discipline of magical science, while there are countless other branches... perhaps even other trees, or entire forests. This universe hides secrets, and you hold the key to uncovering them. Unfortunately, you can't do everything at once; a day has the same number of hours for an ordinary person as it does for a mage (though perhaps one day you'll find a way to solve that problem as well)."
 ev11.47.0.a:0 "I'll prepare to broaden my research."
 ev11.47.0.b:0 "Only some applications interest me."
 ev11.47.0.c:0 "I'll start with alchemy."
 ev11.47.0.d:0 "No! I must stay focused on my current project."
 ev11.48.title:0 "Casting Spells"
 ev11.48.desc:0 "Your research requires not only mental and physical effort, but also significant amounts of magical energy. This issue needs to be addressed."
 ev11.48.0.a:0 "I'll use as much power as needed."
 ev11.48.0.b:0 "I'll be economical."
 ev11.48.0.c:0 "I'll limit myself to intellectual work."
 ev11.49.title:0 "Experiments on Humans"
 ev11.49.desc:0 "Further research requires… greater dedication. You must discover how specific magical aspects affect the human body. This calls for suitable test subjects, and fortunately, your dungeons already contain individuals you can experiment on."
 ev11.49.0.a:0 "We'll start with [p1.GetTitledFirstName]."
 ev11.49.0.b:0 "Let's see what [p2.GetTitledFirstName] looks like from the inside."
 ev11.49.0.c:0 "No, I can't do that."
 ev11.50.desc:0 "This morning, Lilith surprised you with a question: 'But do you truly love me? If you love me, you'll do anything for me, right? I want you to prove it. Give me your soul. Now.'"
 ev11.50.0.a:0 "But... what?"
 ev11.51.desc:0 "'I'm just kidding! Too bad you didn't see your face... You know I'm far more interested in your body than your soul' - Lilith winked at you cheerfully."
 ev11.51.0.a:0 "My body belongs to you."
 ev11.52.title:0 "Precious Book"
 ev11.52.desc:0 "You've heard of a certain forbidden book that contains information related to the field you are studying. Possessing it would undoubtedly make your further research much easier. Unfortunately, its current owner is well aware of the book's value, so the price he has named for selling it seems excessive."
 ev11.52.0.a:0 "The price is irrelevant."
 ev11.52.0.b:0 "I'll try to steal the book."
 ev11.52.0.c:0 "I'll find a way to persuade him."
 ev11.52.0.d:0 "I'll promise him a favor."
 ev11.53.title:0 "Not for Mere Mortals"
 ev11.53.desc:0 "You managed to craft a magnificent runic seal to control the flow of power in the arcane cylinders, and you also created an impressive magical-inversion accelerator along with temporal couplings to stabilize the entire process, allowing you to combine all these components into a single system. The problem is that the damn thing refuses to work. Either the idea itself is flawed, or the parameters are poorly calibrated, or perhaps it's the result of an unfortunate planetary alignment… hard to say."
 ev11.53.0.a:0 "The accelerator requires optimization."
 ev11.53.0.b:0 "I'll recalculate the parameters."
 ev11.53.0.c:0 "I'll look for a workaround."
 ev11.53.0.d:0 "I can stabilize the process manually."
 ev11.53.0.e:0 "Adding Aether may solve the problem."
 ev11.54.title:0 "Excess Breakthroughs"
 ev11.54.desc:0 "Your research not only ended in complete success, but also allowed you to draw many additional conclusions that may prove useful in the future."
 ev11.54.0.a:0 "Yes, I will certainly make use of it."
 ev11.54.0.b:0 "It's worth recording this in the chronicles."
 ev11.54.0.b_ct:0 "Unlocks the [GetDecisionWithKey('magic_epic_book_decision').GetName] [decision|E]"
 ev11.54.0.c:0 "I shall spread the word of my achievement."
 magic_epic_book_decision:0 "Write a Magical Elaborate"
 magic_epic_book_desc:0 "You can transfer your knowledge of magic onto the pages of a book, for your own convenience or to serve future generations."
 magic_epic_book_decision_desc:0 "$magic_epic_book_desc$"
 magic_epic_book_decision_confirm:0 "$magic_epic_book_decision$"
 magic_epic_book_decision_tooltip:0 "$magic_epic_book_decision_desc$"
 ev11.55.title:0 "Mysterious Emanation"
 ev11.55.desc:0 "The result of one unassuming experiment took you completely by surprise. Quite by accident, you managed to create an unusual energy structure radiating pure power. Reproducing this process will be difficult, but the very fact that such a phenomenon is possible is rather inspiring."
 ev11.55.0.a:0 "I will absorb this power."
 ev11.55.0.b:0 "I will use it for further experiments."
 ev11.56.title:0 "Kidnap the Princess"
 ev11.56.desc:0 "Every person differs in both their magical and biological signature, and the two are often subtly connected. Some people are more exceptional than others, and as a result, their signatures are exceptional as well: they conceal many secrets of the natural world and of magic. [princess.GetTitledFirstName] appears to be one of these remarkable individuals - you've concluded that examining a few drops of her blood might allow you to uncover a certain magical principle that you could later use in your research. The problem is that hardly anyone would willingly give their blood for something that inevitably brings to mind a sorcerous ritual."
 ev11.56.0.a:0 "I need to lure her into the laboratory."
 ev11.56.0.b:0 "I'll pay professionals to kidnap her."
 ev11.56.0.c:0 "My champion will bring her to me."
 ev11.56.0.d:0 "No, I'm not going to kidnap people!"
 ev11.57.desc:0 "As a result of your actions, [princess.GetTitledFirstName] has become your… guest. Naturally, she wasn't thrilled about it, but thanks to a drop of her blood, your research was able to move forward. One question remains: what should be done with the princess?"
 ev11.57.0.a:0 "I'll release her; she's no longer needed."
 ev11.57.0.b:0 "Kill her; she's no longer needed."
 ev11.57.0.c:0 "Let her stay in the tower for now."
 ev11.57.0.d:0 "I'll decide later."
 ev11.57.0.e:0 "I think we'll get along well."
 witch_hunters_vacations_ct:0 "The witch hunters will reduce their activity for a while."
 ev10.88.e:0 "The Council should have its own army."
 ev10.89.desc5:0 "'The High Council should have an army in order to protect its interests and exert pressure. I'm thinking of small in number but highly trained, elite units. Naturally, this army should be directly under my command.'"
 hc_army_name:0 "The High Council's army."
 amage_rep1_bmage_rep9_ct:0 "$mc_black_mage_modifier$ will command the army."
 amage_rep2_bmage_rep9_ct:0 "$mc_archmage_modifier$ will command the army."
 amage_rep3_bmage_rep9_ct:0 "$mc_admin_modifier$ will command the army."
 ev10.89.j:0 "The army will be under my command."
 ev10.89.k:0 "All right, but [admin.GetTitledFirstNameNoTooltip] will be our general."
 ev10.89.l:0 "Armed conflicts are not within the High Council's domain."
 pot11_pure_name:0 "Aether"
 pot11_name:0 "Liquid Aether"
 pot11_desc:0 "Liquid Aether is a precious alchemical agent used in complex alchemical processes as well as a component in certain spells and rituals. It is an extremely exotic substance, and creating it is considered nearly impossible."
 gain_pot11_ct:0 "You gain Liquid Aether"
 valuable_magic_component_terrain_cancel_negative_supply:0 "Valuable [useful_magic_component|E]"
 ev11.58.desc:0 "You are in the process of developing a spell that will likely push your research forward. Unfortunately, the spell requires rather exotic alchemical ingredients, including Aether. You could try to obtain or purchase a cheaper substitute, but the spell will not function optimally."
 ev11.58.0.a:0 "I'll use my supply of Aether."
 ev11.58.0.b:0 "I could use mutagens as a substitute."
 ev11.58.0.c:0 "I'll look for a replacement nearby."
 ev11.58.0.d:0 "I'll try to buy a substitute."
 ev11.58.0.e:0 "I don't need this spell."
 ultimate_spell_aether_modifier:0 "Exotic Components"
 ev11.59.desc:0 "The Ritual of the Ultimate Spell is progressing successfully, but the process is not stable enough. This is the right moment to use the Aether."
 ev11.59.0.a:0 "No, Aether is too valuable."
 ev2.5.h:0 "[enemy.GetSheHe|U] has the Aether. Hm..."
 ev5.53.0.d:0 "Actually, I could use some Aether."
 monkey_demon_name:0 "Eshu"
 maledictio_demon_name:0 "Maledictio"
 the_paw_nickname_name:0 "the Paw"
 just_a_paw_name:0 "Paw"
 ev11.60.title:0 "[monkey_demon_target.GetTitledFirstNameNoTooltip]?"
 ev11.60.desc:0 "Light burst forth, and then in the summoning circle appeared... [monkey_demon_target.GetTitledFirstName]! On [monkey_demon_target.GetHerHis] face you see fear and desperation.\n'Quick, free me before hell pulls me back in!'"
 ev11.60.0.a:0 "I'm freeing you now!"
 ev11.60.0.b:0 "Wait a moment..."
 ev11.61.desc:0 "You quickly deactivated the protective spells, and the summoning circle cracked apart at once. [monkey_demon_target.GetTitledFirstName] turned into smoke and shot out through the window in an instant. You realized it couldn't have been [monkey_demon_target.GetHerHim]. Whatever it was - it has been released."
 ev11.62.desc:0 "After a moment of thought, you decided that this situation made no sense. This spell should have summoned an inhabitant of hell, not [monkey_demon_target.GetTitledFirstName]. Besides, the protective circle shouldn't affect a being born on Earth. There is only one conclusion..."
 ev11.62.0.a:0 "This is some kind of trick."
 ev11.63.desc:0 "'I bow to your insight' - the entity said, then shifted into a new form. 'Oh, that's better. Now, where was I... ah, I am the Gift Giver, the Lord of Revelations, the One Who Shows the Way... though some spiteful souls insist on calling me Paw.'"
 ev11.63.0.a:0 "I'm [ROOT.Char.GetTitledFirstNameNoTooltip]."
 ev11.63.0.b:0 "I didn't summon you for small talk."
 ev11.63.0.c:0 "You tried to trick me!"
 ev11.64.desc:0 "'So, to what do I owe the pleasure of finding myself within this summoning circle?'"
 ev11.64.desc2:0 "'It's merely innocent mischief. I'm sure we can still be friends' - You can hear the mockery in the demon's voice."
 ev11.64.0.a:0 "I summoned you, and now you must obey me."
 ev11.65.desc:0 "'Of course, I'll do whatever you wish. Demons are known for their good intentions, aren't they?'\nThe demon smiled - you get the feeling he has far more teeth than any ordinary human.\n'You desire power and wealth, no doubt? Then how about the ability to turn anything you touch into gold? The richest man alive, the Golden Mage... that has a nice ring to it.'"
 ev11.65.0.a:0 "King Midas didn't exactly have a happy ending."
 ev11.66.desc:0 "'Now that I think about it, he really did try to file a complaint afterward... Alright, how about immortality then? Interested?'"
 ev11.66.0.a:0 "I can smell a catch here."
 ev11.67.desc:0 "'Well, if I turned you into stone, death would never find you. I'm not sure whether stones 'live', but they do look content. They certainly don't complain. Not like that Midas fellow, right?'\nThe demon sighed. 'I see I've ended up with a demanding client. Alright, I know! I'll give you a sword with which you will never lose a single duel."
 ev11.67.0.a:0 "Because I will die before any duel?"
 ev11.68.title:0 "Paw's Gift"
 ev11.68.desc:0 "'I see you're starting to catch on. Though I was actually thinking of a sword that always forces a draw... but your idea is even better.'\nYou get an unpleasant feeling that this demon might interpret your commands very broadly."
 ev11.68.0.a:0 "Just give me the gold."
 ev11.68.0.a_ct:0 "There may be additional consequences..."
 ev11.68.0.b:0 "I want knowledge."
 ev11.68.0.c:0 "I want to be adored."
 ev11.68.0.d:0 "I don't want anything, go back to hell."
 blessng_from_monkey_demon_modifier:0 "Beloved and Admired"
 ev11.69.desc:0 "Demon vanished, and in its place a chest filled with gold coins appeared. Yet you can't shake the strange feeling that this gold might bring more harm than good."
 ev11.69.0.a:0 "I'll make use of it anyway."
 ev11.69.0.d:0 "I'd better get rid of it."
 ev11.69.0.b:0 "I'll give the gold to [riv0.GetTitledFirstName]."
 ev11.69.0.c:0 "I'll break the curse."
 ev11.70.desc:0 "Demon vanished, and you feel new knowledge blooming inside your mind. Terrifying knowledge. Horrible knowledge. Knowledge of things you would rather never have learned. It might still prove useful, but you feel deeply shaken."
 ev11.70.0.a:0 "I walk a world built on paradox."
 distracted_by_monkey_demon_modifier:0 "Distracted"
 distracted_by_monkey_demon_modifier_desc:0 "You've uncovered terrifying secrets of the universe that refuse to let you rest, and sinister flashes and echoes of that dark knowledge have a way of returning at the worst possible moments - especially when you're trying to focus on something productive."
 ev11.71.desc:0 "The demon returned to the hell, yet you feel that something has changed. In the days that follow, it becomes clear that people truly look at you with more admiration and warmth than before. In fact, some of them might even like you a little too much."
 ev11.71.0.a:0 "That's probably not a bad thing... right?"
 ev11.74.desc:0 "Terrible news reaches you: it seems that [person_win.GetTitledFirstName] and [person_lose.GetTitledFirstName] fought a duel to the death! Worse still, the cause of the duel was you. Apparently, each of them believed he deserved your favor more than the other, and this led to a bitter conflict between them. [person_lose.GetTitledFirstName] did not survive the duel."
 ev11.74.0.a:0 "This is absurd."
 ev11.74.0.b:0 "[person_win.GetTitledFirstName] must face the consequences."
 ev11.75.desc:0 "'Oh, my beloved mage. Have you perhaps missed me? Or is there a wish I might fulfill for you with the greatest delight?'"
 ev11.75.0.a:0 "This time, no tricks, demon."
 ev11.76.desc:0 "'Of course, I always give only what I am asked for' - the demon looked at you playfully."
 ev11.76.0.a:0 "I can hurt you..."
 ev11.76.0.b:0 "I'm serious."
 ev11.77.desc:0 "'Fine! Have it your way. Well then, what do you need?'\nYou decided, just to be safe, that all your commands would be phrased with great precision."
 ev11.77.0.a:0 "I'd like an army... a loyal army."
 ev11.77.0.b:0 "Have him stop the witch hunters."
 ev11.77.0.c:0 "I need a few favors."
 ev11.77.0.d:0 "Maybe he could gather some Aether?"
 ev11.79.desc:0 "'Yes, I suppose I could get you some Aether... but first you'd have to set me free. Unfortunately, that's the only way.'\nThe demon looks absolutely delighted by the prospect."
 ev11.79.0.a_ct:0 "The demon will be released and will remain in the material world."
 earthquake_spell:0 "Earthquake"
 earthquake_spell_desc:0 "This spell can chaotically amplify tectonic pressure, triggering uncontrolled and potentially catastrophic tremors."
 earthquake_spell_ct:0 "An earthquake will soon hit [reci.GetLocationDesc|l]."
 get_earthquake_spell_ct:0 "You get access to #italic the $earthquake_spell$ spell#! [interaction|E]"
 stop_the_cataclysm_spell:0 "Stop the Cataclysm"
 stop_the_cataclysm_spell_desc:0 "This spell calms the forces of nature and halts extreme phenomena such as earthquakes or floods."
 NO_CATACLYSM_TXT:0 "No natural disaster threatens this person."
 stop_the_cataclysm_spell_ct:0 "[situation.GetName] will be stopped."
 stop_the_cataclysm_spell_info:0 "Disaster Averted!"
 mr_master_nature_modifier:0 "Mastery over Nature"
 master_nature_spec1_terrain_cancel_negative_supply:0 "Unlocks #italic $earthquake_spell$ spell#!"
 master_nature_spec2_terrain_cancel_negative_supply:0 "Unlocks #italic $stop_the_cataclysm_spell$ spell#!"
 mr_nature_txt:0 "Taming nature."
 mr_master_destruction_modifier:0 "Master of Destruction"
 master_destruction_spec1_terrain_cancel_negative_supply:0 "Unlocks #italic $tornado_spell$ spell#!"
 master_destruction_spec1_terrain_advantage:0 "#italic $tornado_spell$ spell#! cooldown"
 tornado_spell_info:0 "Military applications."
 ev11.91.title:0 "Dead End"
 ev11.91.desc:0 "Your research initially seemed promising, but it has now reached a standstill. Perhaps the goal you set for yourself was too ambitious. At this moment, you see no way to move things forward."
 ev11.91.0.a:0 "Well, tomorrow I'll start again."
 ev11.102.title:0 "The Boundless Pain"
 ev11.102.desc:0 "You've begun transforming your body, but the process has turned out to be terribly painful. You're not sure how much longer you can endure it. Perhaps it would be better to take a break or think of another way."
 ev11.102.0.a:0 "I can endure it!"
 ev11.102.0.b:0 "I can't go on..."
 ev11.105.title:0 "Magical Recycling"
 ev11.105.desc:0 "You've still got plenty of components and by-products left over from the previous experiment. At first you planned to simply get rid of them, but a few better ideas came to mind."
 ev11.105.0.a:0 "This will come in handy for brewing elixirs."
 ev11.105.0.b:0 "I'll make use of it when summoning demons."
 ev11.105.0.c:0 "Maybe I could sell it?"
 funds_for_research_options:0 "Research Budget"
 funds_for_research_options_desc:0 "$funds_for_searching_options_desc$"
 teleportation_spell:0 "Teleportation"
 teleportation_spell_desc:0 "This spell can temporarily distort space, resulting in the instantaneous translation of an object over vast distances."
 magic_teleportation_effect_txt:0 "You teleport to [tprov.GetName]."
 CURRENT_TRAVEL_PLAN_EXISTS:0 "You are not traveling anywhere at the moment."
 universal_self_interaction:0 "self-[interaction|E]"
 gain_magic_teleportation_spell_txt:0 "Unlocks #italic $teleportation_spell$ spell#! ($universal_self_interaction$)"
 gain_magic_teleportation_spell_txt_dot:0 "$gain_magic_teleportation_spell_txt$."
 ev11.120.desc:0 "During one of your experiments, you managed to trigger an extraordinary phenomenon: you bent space so profoundly that, once it was 'straightened' again, the object at its center shifted all the way to its edge. In other words, you achieved teleportation. If you were to refine this process, you might well create a spell that would prove invaluable on any journey."
 ev11.120.0.a:0 "Yes, I absolutely need to look into this."
 ev11.120.0.b:0 "No, my main project requires all of my attention."
 mage_countering_spec1_terrain_cancel_negative_supply:0 "Can counter spells by spending power saturation"
 ev7.129.h:0 "This spell will let me live for thousands of years!"
 ev5.28.0.z0:0 "I will take your life and your lands."
 mc_black_mage_special2_terrain_cancel_negative_supply:0 "Combat Magic research requires one fewer [mr_breakthrough|E]"
 laamp_magic_1015_contract:0 "Carnivorous Plants"
 laamp_magic_1015_request:0 "This [task_contract|E] requires you travel to [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands and resolving the issue through magical or specialized skills."
 laamp_magic_1015_desc_title:0 "$laamp_magic_1015_contract$"
 laamp_magic_1015_desc:0 "[TaskContract.GetEmployer.GetTitledFirstName] is troubled by dangerous flora - and if the rumors are to be believed, these are no ordinary plants. It's possible that the cause of these disturbances is of a supernatural kind."
 ev11.121.desc:0 "[employer.GetTitledFirstName] explained to you in a few words that the problem with the local vegetation is serious: several people have vanished without a trace, and two died in front of witnesses, seized by the strange plants that grow here. Attempts have been made to fight them - with fire and with exorcisms - but with little success. [employer.GetTitledFirstName] fears that if the issue isn't resolved, unrest may break out in the area, or the locals might try to deal with it themselves, inevitably bringing about their own doom."
 ev11.121.a:0 "Let's take a closer look at these plants."
 ev11.122.desc:0 "You hadn't expected a sight like this. The local vegetation truly is unusual, and at first glance it even seems exotic. You decided to take a short, cautious walk, but it turned into an ordeal - every few steps you were tripping over some root or getting tangled in wild vines. You also kept having the feeling that something was moving at the edge of your vision, yet whenever you looked that way, the jungle remained perfectly still."
 ev11.122.a:0 "Maybe Aura Reading will give me more insight into this place."
 ev11.122.b:0 "I'll examine this jungle with my magical senses."
 ev11.122.c:0 "All right then, time to get to work."
 ev11.123.desc:0 "You've managed to determine beyond any doubt that this place bears traces of magic, and the vegetation is the result of a magical mutation. It's hard to say whether it's the effect of a deliberate spell or the remnants of some experiment. These plants may be extremely dangerous."
 ev11.124.desc:0 "Watching the maps [employer.GetTitledFirstName] provided, you realized that the jungle - seen from above - forms a perfect circle. Perhaps the reason for its existence lies at its very center. You set out to investigate, but the farther you travel, the more aggressive the vegetation becomes. Some plants lash out with branch-like tendrils, others release toxic fumes. This expedition carries real danger."
 ev11.124.a:0 "We push forward - no stopping!"
 ev11.124.a_ct:0 "#N Someone will be injured or lose their life.#!"
 ev11.124.b:0 "I'll burn us a path with fire spells."
 ev11.124.b_ct:0 "#P Your group will reach the destination safely.#!"
 ev11.124.c:0 "I know a ritual that may calm the jungle."
 ev11.124.d:0 "I'll find the safest route."
 ev11.124.e:0 "This contract isn't worth the risk."
 ev11.125.title:0 "Secret Lab"
 ev11.125.desc:0 "You managed to reach your destination - an overgrown hut filled with clear signs of magical practice. Alchemical retorts and arcane instruments lie scattered about, still in good enough condition for you to assemble a portable laboratory of your own."
 ev11.125.a:0 "These items will certainly be useful to me."
 ev11.126.desc:0 "You also found the owner of this place - or rather, what remains of him. The body is in an advanced state of decay, and thick vines sprout from his chest, their ends trailing out through the window. From the notes you discovered beside him, you deduced that he had been studying the effects of magic on organic matter. Clearly, his experiment did not go as planned. More importantly, the notes contain instructions for a simple ritual that can reverse the effects of the experiment and likely destroy the jungle altogether. Unfortunately, performing it will consume the valuable alchemical substances you found here."
 ev11.126.a:0 "So we're getting rid of the jungle, then."
 ev11.126.b:0 "These reagents are worth more than this contract."
 ev11.127.title:0 "The Mysterious Voice"
 ev11.127.desc:0 "At night, you are visited by a dream… or something akin to a dream. A shiver runs through your body, and your mind fills with a strange Presence. Inside your own skull you hear a disturbing whisper, and only after a moment do you realize it is a voice speaking words you can barely comprehend.\n\n#italic You defied my master's will. You stole Nyx from us. You've crossed forces you do not understand. Your foolishness carries a price.#!"
 ev11.127.a:0 "What? Who are you?! Show yourself!"
 ev11.128.desc:0 "You feel weak, as if maintaining contact with the strange Presence itself were an immense effort. It seems as though the walls of the chamber tremble ever so slightly, and you catch odd flashes of light that surely cannot be real. It's as if you were in a trance or under the influence of some intoxicating substance.\n\n#italic They call me Nyarlathotep. I answer directly to the one you know as the Eternal Evil.#!"
 ev11.128.a:0 "What do you want from me?"
 ev11.128.b:0 "Great, then tell him to screw himself!"
 ev11.129.desc:0 "A sudden wave of pain crashes over you, and you feel the malevolent Presence pressing in on you.\n\n#italic I will deliver your words to him... along with your corpse.#!"
 ev11.129.a:0 "No... you can't... kill me...!"
 ev11.129.b:0 "I don't think so."
 ev11.130.desc:0 "You feel the Presence withdraw slightly, and the pain fades.\n\n#italic You are powerful, for a lesser being. Destroying you would indeed cost me some effort. Instead, I will turn your own power against you. Farewell, wretch.#!"
 ev11.130.a:0 "I feel... I feel strange."
 nyarlathotep_curse_modifier:0 "The Touch of Nyarlathotep"
 nyarlathotep_curse2_modifier:0 "$nyarlathotep_curse_modifier$ (reduced)"
 modifier_definition_nyarlathotep_curse_modifier_modifier:0 "\t#weak Grows every time you cast a spell#!"
 ev7.129.i:0 "Nyarlathotep, screw you!"
 ev7.129.j:0 "I'll reverse the magnetic poles!"
 ev7.129.j_ct:0 "The Earth's magnetic poles will be reversed."
 ev7.129.j_ct2:0 "There will be no visible effect."
 ev7.129.j_ct3:0 "There is no visible effect."
 ev11.131.desc:0 "#italic Give me a reason. One reason why thy existence should not be extinguished.#!"
 ev11.131.a:0 "I will serve you! Nyx and I will serve you."
 ev11.131.b:0 "I will give you my soul."
 ev11.131.c:0 "Get out of my head and let me sleep."
 ev11.131.d:0 "Your empty threats mean nothing to me."
 ev11.132.desc:0 "#italic Death would be a mercy to you. I, Nyarlathotep, reshape your fate: you will bring ruin upon yourself and your bloodline. Farewell, wretch.#!\n\nYou feel the malevolent Presence vanish abruptly. Yet something of it lingers..."
 ev11.133.desc:0 "An echo of a sinister laugh reverberates from within your skull.\n\n#italic I am no minor demon, nor some collector of curiosities. If I wanted your soul, I would simply take it - along with your body.#!"
 ev11.133.a:0 "Then you will get nothing from me."
 ev11.134.desc:0 "#italic Yesss. You will serve. You will keep your pitiful life only until the moment you can be of use. Nyx will return with me; I have... much to discuss with her.#!\n\nYou feel the malevolent presence withdraw. The brief exchange has drained you; you can barely stay on your feet, trembling uncontrollably."
 ev11.134.a:0 "Whatever that was... I hope it stays gone."
 no_soul_modifier:0 "Soul Forfeit"
 no_soul_modifier_desc:0 "Because of a demonic pact or black magic, your soul has fallen under the dominion of dark powers. It cannot be fully consumed until your body dies - which is why the demons will make sure you never live to see a peaceful old age."
 ultimate_spell_control_terrain_cancel_negative_supply:0 "You always retain control over your Ultimate Spell [scheme|E]"
 ev11.135.title:0 "$nyx_name$"
 ev11.135.desc:0 "You have been informed that someone wishes to receive your audience. The description of this person matches someone you know, so you immediately decide to meet with her. Nyx looks tired, but a subtle aura of energy surrounds her, letting you know that it is truly her."
 ev11.135.a:0 "Nyx, what are you doing here?"
 ev11.136.title:0 "Eternal Servant"
 ev11.136.desc:0 "'I come on behalf of our lord, to whom you swore loyalty. The Eternal Evil has orders for you.'"
 ev11.136.a:0 "What could the Eternal Evil want from me?"
 ev11.136.b:0 "Good to see you too..."
 ev11.137.desc:0 "'Forgive me, I just feel the pressure weighing on me. I also didn't expect that orders would one day come for you, and I feel guilty for dragging you into this. If you do not carry out the will of the Eternal Evil, the consequences will be immense - for me and for you.'"
 ev11.137.a:0 "So what does your lord expect of me?"
 ev11.138.desc:0 "Nyx sighed, clearly relieved to see that you were at least considering the possibility of carrying out her master's command.\n'It's about Earth. The Eternal Evil wishes you to bring about its magnetic inversion.'"
 ev11.138.a:0 "Wait, what?"
 ev11.139.desc:0 "'Your world works like a piece of magnetite. It has its magnetic poles, which sometimes switch places. Your task is to accelerate that reversal. I don't know much about these matters myself, which is probably why you're the one meant to handle it.'"
 ev11.139.a:0 "How the hell am I supposed to do that?"
 ev11.140.desc:0 "'You're the powerful mage here, I'm sure you'll come up with something. The Eternal Evil wouldn't give you an impossible task' - Nyx hesitated - 'At least... I think so.'"
 ev11.140.a:0 "Why would he even care about that?"
 ev11.141.desc:0 "'The plans of the Eternal Evil span countless worlds and many millennia. It can move a single small stone only so that, in some distant future, it triggers an avalanche - a cascade of events that will serve its designs, whatever they may be. Perhaps it seeks a specific outcome, or perhaps it is merely testing your loyalty. I have no idea. But do everything in your power - it does not tolerate failure or defiance.'"
 ev11.141.a:0 "I'll think this over."
 ev11.142.title:0 "The Poles of Fate"
 ev11.142.desc:0 "Nyx left, leaving you alone with a problem that had no solution. Youd heard of magnets, but they had always been nothing more than an alchemical trick to you, with little real use. Could it be that the Earth itself is one enormous piece of magnetite? Does that mean magnetic forces act upon it? If so, why aren't all iron objects - armor, swords - pulled toward one of the poles? And what would happen if those poles were to switch places?"
 ev11.142.a:0 "I need to run some calculations."
 ev11.143.desc:0 "Over the past few days, you've studied every book on magnetism and ferro-alchemy you could get your hands on. It wasn't much, but you managed to organize your knowledge a little. You deduced that magnetic forces have a subtle influence on the world, yet their significance may be greater than it seems. The behavior of some animals may be somehow related to magnetism, just like certain weather phenomena. Would a pole reversal affect the climate, or cause birds to stop migrating? And why would the Eternal Evil care about any of this?"
 ev11.143.a:0 "There has to be more to this."
 ev11.144.desc:0 "However, you did manage to understand certain connections between magic and magnetism. In theory, a sufficiently powerful spell could accelerate the inversion of the magnetic poles, provided the conditions were favorable. You believe that the power of the Ultimate Spell might be capable of such a feat, if you modify its final stage a little."
 ev11.144.a:0 "It might be worth a try."
 ev11.144.a_ct:0 "Perhaps you should consider casting the Ultimate Spell. Or perhaps it's better to forget the whole matter."
 ev11.145.desc:0 "'You did it! I wasn't sure you'd manage this task, but it looks like you're growing into your own legend.'"
 ev11.145.a:0 "Alright, so what now?"
 ev11.146.desc:0 "'That's all. You've done your part, and the Eternal Evil is pleased. You've been promoted to its lead representative on Earth, and I am to remain at your disposal. From today on, I work for you.'"
 ev11.146.a:0 "Know what the poles were about?"
 ev11.146.b:0 "What exactly does my new role involve?"
 ev11.147.desc:0 "'I have no idea - we'll probably never find out. Though it did occur to me that maybe it wasn't about Earth's magnetism at all. Maybe the Eternal Evil wanted you to use the Ultimate Spell for some reason. Or perhaps it was testing your abilities to see whether you were worthy.'"
 ev11.147.a:0 "So what do I do as lead representative?"
 ev11.148.desc:0 "'For now, you don't have to do anything, unless new orders come - and that probably won't happen anytime soon. You're now the champion of the Eternal Evil, which means that most likely no god will want to cross your path, at least as long as you remain here. You could say that, for the moment, you've become the curator of this world.'"
 ev11.148.a:0 "Good. That's all I needed to hear."
 ev11.148.a_ct2:0 "You get access to Use Nyx's powers [interaction|E] with Nyx."
 eternal_champion_modifier:0 "Eternal Champion"
 eternal_champion_modifier_desc:0 "The Eternal Evil sees you as its champion, or even its chosen one. Its blessing strengthens your powers for as long as you remain loyal to it."
 use_nyx_powers_interaction:0 "Use Nyx's powers"
 use_nyx_powers_interaction_desc:0 "Nyx carries a special blessing from the Eternal Evil, granting her extraordinary abilities."
 use_nyx_powers_interaction_info:0 "Nyx will use her special powers according to your commands."
 ev11.149.desc:0 "'[ROOT.Char.GetTitledFirstNameNoTooltip]! What can I do for you?'"
 necro_chapter6:0 "Necronomicon - Chapter 6."
 ev11.150.desc:0 "'My last star-faring journey brought me the answers I'd been seeking. I discovered how to solve the problem of magic fading from Earth - I created a vast magical lens around our planet, one that will maintain a constant influx of arcane energy. To do that, I had to wield powers before which the Ultimate Spell is child's play; I burned almost all the magical catalysts I had, and I used up a sea of aether... but it works! Abdul Al-Hazred saves the day once again and bends the universe to his will! Granted, the magical lens is anchored to Earth by magnetic forces, so it will be destroyed if the magnetic poles ever reverse, but that shouldn't matter, since it won't happen for the next several thousand years...'"
 ev11.150.0.a:0 "What have I done!"
 ev11.151.title:0 "Ancient Singularity Mk.III"
 ev11.151.desc:0 "[thief.GetTitledFirstName] paid you an unannounced visit today, and he arrived alone, without an entourage, keeping a low profile. [thief.GetSheHe|U] quickly explained that [thief.GetHerHis] main specialty is magical artifacts and that [thief.GetSheHe] knows the mechanism of the Ancient Singularity you possess extremely well. [thief.GetSheHe|U] asked for the opportunity to examine the artifact, and if [thief.GetHerHis] hypotheses prove correct, [thief.GetSheHe] will be able to enhance the Singularity. You may not fully understand all the theories [thief.GetSheHe] presents, but there is no doubt that [thief.GetTitledFirstName] possesses immense knowledge regarding the Ancient Singularity."
 ev11.151.0.a:0 "Alright, you have twenty-four hours."
 ev11.151.0.a_ct:0 "The Singularity will be improved... perhaps?"
 ev11.151.0.b:0 "No. No one is going to touch my Singularity."
 ev11.152.title:0 "The Singularity Heist"
 ev11.152.desc:0 "The next morning, you discovered that the chambers you had assigned to [thief.GetTitledFirstName] for the night were empty. They had been perfectly guarded by your sentries, but the scoundrel must have used a teleportation spell and escaped! Naturally, [thief.GetSheHe] took your Singularity with [thief.GetHerHim] - the one [thief.GetSheHe] was supposedly improving all night."
 ev11.152.0.a:0 "[thief.GetTitledFirstNameNoTooltip] will pay for this!"
 expects_attack_from_player_modifier:0 "Expects an attack"
 ev5.28.0.x2_ct:0 "#P This spell is more powerful because you are indeed a master of magic!#!"
 magic_inception_o8:0 "'Some people deserve a serious lesson.'"
 magic_inception_o9:0 "'My liege must be stopped.'"
 can_use_teach_sorcery_action:0 "You can teach someone sorcery."
 can_use_teach_sorcery_action_label:0 "Teach Sorcery [interaction|E] is available."
 can_use_teach_sorcery_action_desc:0 "$can_use_teach_sorcery_action_label$"
 can_use_teach_sorcery_action_click:0 ""
 ev11.183.title:0 "Scientific Method"
 ev11.183.desc:0 "While working on your current project, you had to systematize your approach and look for efficient methods to analyze the results of your experiments. It took some time before you managed to develop the right techniques, but now you feel that your research will move forward smoothly."
 ev11.183.0.a:0 "I'm getting better at this."
 ev11.183.0.b:0 "Maybe I'll be able to use this in the future as well."
 mr_seasoned_scholar_modifier:0 "Seasoned Scholar"
 mr_sixth_sense_modifier:0 "Sixth Sense"
 ev11.184.desc:0 "During the tests of the spell you've been working on, something went wrong. The spell affected you in a strange way, but it doesn't seem to be anything harmful. You suddenly became very perceptive and aware of your surroundings, and when you heard a knock on the door, you somehow knew it was your servant bringing a meal. As if you were perceiving the world with an additional sense. You can't recreate the spell, but you managed to extend its duration. Besides that, this discovery should help with further research."
 ev11.184.0.a:0 "Strange... but undeniably promising."
 ev6.4.0.d:0 "Do you know how to break the curse of Nyarlathotep?"
 ev11.185.desc:0 "I see you've made some serious enemies. What did you do to offend Nyarlathotep? Actually, I'd rather not know - especially if the rumors about whom he serves now are true. Let me take a look at this curse... It could be worse, but it still doesn't look pleasant. I can weaken it, but fully removing it would require greater power. Perhaps the Ultimate Spell could deal with it."
 ev11.185.0.a:0 "Hm, thanks."
 me_golem_option_with_dot:0 "$me_golem_option$."
 ev11.186.title:0 "Hostile Mercenaries"
 ev11.186.desc:0 "Your camp has been surrounded by a group of well-armed men. Their demands are clear: they have come for an artifact known as the [artifact.GetName], which they believe is in your possession. It's obvious they are mercenaries hired by someone who desperately wants this item. The situation is serious, and if you don't respond to their ultimatum, blood may soon be shed."
 ev11.186.0.a:0 "Fine. [artifact.GetName] is yours."
 ev11.186.0.a_ct:0 "#N The artifact is gone.#!"
 ev11.186.0.b:0 "I'll say that I don't have such an artifact."
 ev11.186.0.b_ct:0 "The mercenaries leave empty-handed."
 ev11.186.1.b_ct:0 "The mercenaries didn't believe your bluff."
 ev11.186.0.c:0 "Power Strike will cool their enthusiasm."
 ev11.186.0.d_ct:0 "The mercenaries have been repelled."
 ev11.187.desc:0 "The mercenaries didn't believe your assurances for even a moment. They're clearly well-informed and absolutely confident in their intel. You can see them preparing to attack."
 ev11.188.desc:0 "Your spell tore several of the mercenaries to shreds, and although they clearly hesitated - they probably didn't expect to face a real mage - they ultimately proved disciplined enough to launch a charge."
 ev11.188.0.a:0 "I can do this all day!"
 ev11.189.desc:0 "The battle ended as quickly as it began. You have few wounded on your side, which is more than can be said for the mercenaries, whose remaining survivors are already retreating in haste. You doubt they'll pose any threat to you in the future."
 ev11.189.0.a:0 "I wonder who hired them."
 ev11.190.title:0 "The mercenaries have failed"
 ev11.190.desc:0 "The attempt to seize the artifact ended in spectacular failure - the mercenaries were unable to recover it and returned decimated. To make matters worse, they have no intention of giving back the gold you paid them, claiming they deserve it for the effort alone."
 ev11.190.0.a:0 "Power Strike will convince them to return the gold."
 ev9.0.i:0 "I'll hire mercenaries to intercept the artifact."
 ev9.0.i_ct0:0 "This action is possible because the target is neither a ruler nor protected by one."
 ev9.0.i_ct:0 "The mercenaries have intercepted the artifact"
