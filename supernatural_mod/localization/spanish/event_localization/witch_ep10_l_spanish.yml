 surviving_chance_tooltip:0 "#t Survival Chance#!\nSurvival Chance is a parameter that can change depending on a series of decisions made during the hunters' attack. It is used during the final stage to determine whether you have survived the assault."
 ev11.14.title:0 "The Hunters Are Coming"
 ev11.14.desc:0 "For some time now, your scouts have been reporting that a heavily armed force is trailing your caravan. You've managed to confirm they are witch hunters - well-equipped, numerous, and steadily closing the distance. A confrontation seems inevitable."
 ev11.14.0.a:0 "We'll try to slip past them."
 ev11.14.0.a_ct:0 "The hunters are losing your trail."
 ev11.14.0.a_ct2:0 "The hunters launch their attack."
 ev11.14.0.b:0 "Let's look for a good defensive position."
 ev11.14.0.b_ct:0 "#P The initial survival chance will be increased by the value of your travel safety.#!"
 ev11.14.0.c:0 "I'll burn them with my Singularity."
 ev11.14.0.c_ct:0 "#P The pursuit group will be annihilated.#!"
 ev11.14.0.d:0 "Even hunters have their price."
 ev11.14.0.d_ct:0 "A huge bribe may persuade the hunters to abandon the chase."
 ev11.14.0.e:0 "We'll escape using teleportation."
 ev11.15.title:0 "The Hunters' Attack"
 ev11.15.desc:0 "A group of armed warriors charges at you without warning. It seems they have no interest in your surrender - they want only blood."
 ev11.15.0.a:0 "I shall greet them with a Power Strike."
 ev11.15.0.b:0 "Wait until they enter the archers' range."
