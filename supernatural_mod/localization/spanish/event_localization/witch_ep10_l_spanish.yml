 ev11.16.title:0 "$ev11.15.title$ - Regrouping"
 ev11.16.desc:0 "You've managed to repel the first assault, but it's clear the band of hunters is regrouping with alarming speed and preparing for another."
 ev11.16.0.a:0 "Those wretched vermin don't yet realize this is suicide."
 ev11.16.0.b:0 "Let's regroup as well."
 ev11.16.0.c:0 "Let's prepare a few surprises for them."
 ev11.16.0.d:0 "The Thorns Wall spell will help with defence."
 ev11.17.title:0 "$ev11.15.title$ - Constant Pushing"
 ev11.17.desc:0 "The hunters' assault faltered for a moment, yet it soon became clear this was only the beginning. Their tactics may be crude, but in their eyes you see blind fanaticism - breaking their fighting spirit will not be easy."
 ev11.17.0.a:0 "Even so, we will endure."
 ev11.17.0.b:0 "Warriors... together!"
 ev11.17.0.c:0 "My Darkblade shall be fed."
 ev11.17.0.d:0 "We'll crush them!"
 ev11.17.0.e:0 "We'll see whose fanaticism is greater."
 ev11.18.title:0 "$ev11.15.title$ - Another Assault"
 ev11.18.desc:0 "The hunters' next attack came faster than you expected, and its ferocity caught you off guard. Now you notice they are following a kind of tactic - this wave is made up of different foes than the last. That means some of them are resting... or attempting to flank your position."
 ev11.18.0.a:0 "I should think of something quickly."
 ev11.18.0.b:0 "[en1.GetTitledFirstName] will buy me some time."
 ev11.18.0.c:0 "I will lead the pre-emptive strike!"
 ev11.18.0.d:0 "A bit of gold will lift our spirits."
 ev11.19.title:0 "The Eye of the Storm"
 ev11.19.desc:0 "The next attack has been repelled, but there are many wounded on both sides. Still, that's probably not why the hunters have stopped their furious advance - it seems they're preparing something special. In any case, you now have a brief moment of calm."
 ev11.19.0.a:0 "All I can do is pray for survival."
 ev11.19.0.b:0 "I won't go down without a fight."
 ev11.19.0.c:0 "I'll cast a curse on them - maybe it will help."
 ev11.19.0.d:0 "Then it's time for some devastating spells."
 ev11.19.0.e:0 "Enough! I'll burn them with a Firestorm."
 ev11.19.0.f:0 "A tornado spell will blow them off the face of the earth."
 ev11.19.0.g:0 "They're giving me time to use the Singularity."
 ev11.19.0.h:0 "We have a moment to prepare our defence."
 ev11.19.0.i:0 "I will treat the wounded."
 ev11.21.title:0 "$ev11.15.title$ - Death and Destruction"
 ev11.21.desc:0 "Your formidable magic has wrought devastation across the battlefield. This may be the first moment when the hunters realized what they are truly dealing with - and surely many of those who survived your arcane fury now doubt the sense of launching any further attacks."
 ev11.21.0.a:0 "I've got plenty more where that came from!"
 ev11.21.0.b:0 "I hope this is only the warm-up."
 ev11.21.0.c:0 "They cannot kill what is already dead."
 ev11.21.0.d:0 "My power is unstoppable."
 ev11.20.title:0 "$ev11.15.title$ - The Last Stand"
 ev11.20.desc:0 "Despite your efforts, the hunters keep pressing forward, seeming to surround you from every side. There are far more of them than you expected! The morale of your people is beginning to falter, even though the hunters pay a terrible price for every step they manage to take toward you."
 ev11.20.0.a:0 "We must rally all our strength!"
 ev11.20.0.b:0 "Perhaps I should hand command to someone more competent."
 ev11.20.0.c:0 "I still have a few tricks up my sleeve."
 ev11.20.0.d:0 "Our positions still give us the advantage."
 ev11.20.0.e:0 "Prepare barrels of explosive powder!"
 ev11.20.0.f:0 "It's time for them to know my strength."
 ev11.22.title:0 "$ev11.15.title$ - $bp3_survey.0010.t$"
 ev11.22.desc:0 "The hunters launch their final assault. Their ranks are wavering and many of them are wounded, yet they seem determined to sacrifice their lives if it gives them even the slightest chance to reach you."
 ev11.22.0.a:0 "Let them try."
 ev11.22.1.a:0 "We will fight to the last soldier!"
 ev11.22.0.a_ct:0 "The hunters are crushed"
 ev11.22.0.x_info:0 "Killed by hunters"
 ev11.23.title:0 "$ep2_wedding.0204.a.tt.success$"
 ev11.23.desc:0 "Many people died that day, mostly hunters - only a few managed to retreat. Perhaps that is for the best. This defeat should give them something to think about, and news of it may well make your other enemies think twice before deciding to stand against you."
 ev11.23.0.a:0 "I hope the rest of the journey will be peaceful."
 ev11.23.0.b:0 "Excellent. So, what's for dinner today?"
 ev11.23.0.c:0 "That was great fun!"
 shot_from_cover_interaction:0 "Shot from cover"
 shot_from_cover_interaction_desc:0 "A crossbow with an optical sight is capable of firing an accurate shot at a considerable distance - this can be used when attempting to eliminate a target."
