 magical_research_standard:0 "$magical_research$"
 magical_research_standard_desc:0 "Developing new theories, conducting experiments, constructing new magical inventions - all of this can lead to many breakthroughs in understanding and using magic."
 magical_research_exp:0 "Research Expedition"
 magical_research_exp_desc:0 "There are several places in the world full of ancient magic, undiscovered knowledge and terrifying powers. It is worth visiting them and seeing what secrets can be discovered there."
 TRAVEL_NAME_FOR_magical_research:0 "Your arrival at the $magical_research$"
 funds_for_searching_option3:0 "Exhaustive Funding"
 funds_for_searching_option3_desc:0 "You will receive significant additional progression as a starting bonus."
 magical_research_guest_desc:0 ""
 magical_research_conclusion_desc:0 "Conclusion"
