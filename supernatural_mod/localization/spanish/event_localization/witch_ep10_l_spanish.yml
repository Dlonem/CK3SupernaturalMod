 magical_research_desc:0 "Conduct magical research to uncover powerful abilities, new spells, and further mysteries of the universe."
 magical_research_host_desc:0 "$BULLET_WITH_TAB$You may gain knowledge and skills\n$BULLET_WITH_TAB$You may develop new spells\n$BULLET_WITH_TAB$You can receive [GetTrait('archmage').GetName( GetNullCharacter )|L] XP"
