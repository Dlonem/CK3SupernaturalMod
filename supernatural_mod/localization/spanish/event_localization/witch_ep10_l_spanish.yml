 ev11.198.title:0 "Back to Basics"
 ev11.198.desc:0 "During the next stage of your research work, it occurred to you that you're missing some basic knowledge. Although it doesn't directly affect the research project you're working on, it might matter in future studies and other undertakings. Perhaps it's worth catching up, polishing certain skills, and expanding your arsenal of practical spells?"
 ev11.198.0.a:0 "I'll devote resources to developing a new spell."
 ev11.198.0.a_ct:0 "You will learn a random basic spell."
 ev11.198.0.b:0 "My current research remains the priority."
 ev2.17.b2:0 "I will finance [witch.GetHerHis] enemies."
 active_sing_dial_info:0 "I will activate Singularity."
 upgrade_sing_dial_info:0 "I will improve Singularity."
 ev11.200.title:0 "Magic is Chaos"
 ev11.200.desc:0 "The spells you cast and the powers you try to master do not leave the surroundings unaffected. The ground trembles, strange weather phenomena appear, and some claim the area is haunted. There are also those who connect all of this to you and your secret research."
 ev11.200.0.a:0 "Progress comes at a price."
 ev11.200.0.b:0 "I'm just getting started."
 ev11.200.0.c:0 "Perhaps I ought to limit some of my experiments."
 ev11.200.0.d:0 "I am entering the next phase."
 ev11.201.title:0 "Words from Another World"
 ev11.201.desc:0 "Upon waking this morning, you discovered a mysterious casket. Peering inside, you found it filled with precious jewels, along with a vial of some elixir, a bundle of documents, and a letter. Strangely, the letter bears [stars_traveler.GetTitledFirstName]'s personal seal - though [stars_traveler.GetSheHe] has been presumed dead a few years ago, ever since [stars_traveler.GetSheHe] vanished during one of [stars_traveler.GetHerHis] secretive expeditions."
 ev11.201.0.a:0 "Let's get reading!"
 ev11.202.desc:0 "#italic My dear [ROOT.Char.GetFirstNameNoTooltip],\nI trust this parcel has found its way to you; in these realms, a dependable courier willing to journey as far as Earth is a rare treasure indeed. I travel through distant lands and stranger worlds, uncovering secrets so shadowed and so labyrinthine that no human tongue holds words fit to capture them. More than once death brushed against me, and only fortune and wit kept me alive through every trial. Know only this: gods and demons are but a fraction of the perils that stalk my road.\nStill, the knowledge and power I gather are worth every danger. I cannot say whether another letter will follow, for my path now leads into a place of exceptional peril. Should I not return, let it be known that I regret nothing. May prosperity be yours, and may our lineage remain safe beneath your vigilant care.\nRegards\n[stars_traveler.GetFirstNameNoTooltip]\nP.S. Together with the trinkets and the vial of aether, I send you several notes from my travels. I believe they will be priceless to any seeker of arcane wisdom.#!"
 ev11.202.0.a:0 "These notes are truly remarkable!"
 IS_AMBITIOUS_OR_LEARNING_EDU:0 "You must be ambitious or have a learning education."
