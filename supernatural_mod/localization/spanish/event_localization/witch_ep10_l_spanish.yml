 ev11.24.title:0 "$shot_from_cover_interaction$"
 ev11.24.desc:0 "It was supposed to be just another ordinary day, but clearly someone had different plans. While going about your usual errands, you suddenly heard the hiss of air and a dull thud. A masked shooter had fired a crossbow bolt straight at you!"
 ev11.24.0.a:0 "It won't hurt me, you bastard."
 ev11.24.0.b:0 "It's good that I have Dragonscale."
 ev11.24.0.c:0 "My protective spells will stop the bolt."
 ev11.26.desc:0 "The projectile wounded you, but it's the poison that poses the real danger. The shooter vanished without a trace. You have no proof, yet these methods fit the witch hunters all too well."
 ev11.27.desc:0 "You managed to secure a good firing position, and at last [recipient.GetTitledFirstName] moved into your range. Your shot struck true, wounding [recipient.GetHerHim]. [recipient.GetSheHe|U] survived the hit, but the poison on the bolt may yet finish the job."
 ev11.27.0.a:0 "Not bad at all."
 ev11.28.desc:0 "You secured a solid firing position to take [recipient.GetTitledFirstName] out. At last, when he stepped into your kill zone, you released the long-awaited shot, striking [recipient.GetHerHim] straight in the heart. [recipient.GetTitledFirstName] died on the spot, and you managed to withdraw safely. Clean work."
 ev11.28.0.a:0 "That was a good shot."
 ev11.29.desc:0 "The projectile missed you by a hair - and luckily so, as later inspection revealed it had been coated in poison. The shooter, whoever they were, fled and vanished without a trace. You have a feeling it was one of the witch hunters."
 ev11.29.0.a:0 "I should double the guards."
 ev11.30.desc:0 "You managed to secure a good firing position to take [recipient.GetTitledFirstName] down. When [recipient.GetSheHe] finally entered your line of sight, your crossbow fired - but chance or a gust of wind sent the bolt off course. You got away, but that's the only good news."
 ev11.30.0.a:0 "I need to work on my accuracy."
 ev11.31.desc:0 "The bolt turned out to be harmless to you, but an attempted murder is no small matter. The shooter vanished without a trace, yet the precision of the shot, the poison on the bolt, and the overall method all point toward the witch hunters."
 wc_poisoned_bolt_modifier:0 "Hit by a poisoned bolt"
