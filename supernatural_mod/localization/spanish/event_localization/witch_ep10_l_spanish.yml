 gain_magical_research_progress_15_txt:0 "You gain #P 15#! research progress"
 gain_magical_research_progress_20_txt:0 "You gain #P 20#! research progress"
 gain_magical_research_progress_100_txt:0 "You gain #P 100#! research progress"
 general_research_intent:0 "General Research"
 general_research_intent_desc:0 "Magic conceals many mysteries that defy simple classification, yet may prove crucial in any attempt to manipulate the fabric of reality. Such research can open the path to mastering the forces of nature and metamagic, influencing the human mind, and uncovering the secrets of places of power."
 life_extension_intent:0 "Life Extension"
 life_extension_intent_desc:0 "Achieving immortality - or at least longevity - is possible through complex bodily transformations, yet research of this kind is considered extremely difficult and perilous."
 combat_magic_intent:0 "Combat Magic"
 combat_magic_intent_desc:0 "A mage's power sometimes comes down simply to the ability to effectively eliminate their enemies. Developing combat spells - whether aimed at hostile armies or other adepts - is an inseparable part of magical tradition."
 creation_magic_intent:0 "Creation and Artifacts"
 creation_magic_intent_desc:0 "Magical transmutation, the crafting of runes, and the creation of artifacts or constructs - all of this falls within the domain of a specialized mage's expertise."
 game_concept_mr_breakthrough:0 "Breakthrough"
 game_concept_mr_breakthrough_desc:0 "Completing any research project requires achieving a certain number of breakthroughs. The number of breakthroughs you make depends on the research progress you manage to achieve while conducting it."
 game_concept_mr_advanced_project:0 "Advanced Research Project"
 game_concept_mr_advanced_project_desc:0 "An advanced project yields a one-time, permanent effect. If it has been completed successfully, it cannot be undertaken again by the same character.\nAvailable advanced projects are drawn from the pool of projects assigned to that intent."
 game_concept_mr_basic_project:0 "Basic Research Project"
 game_concept_mr_basic_project_desc:0 "Each intent has a single basic research project that is always available and can be performed repeatedly, providing specific or temporary effects."
 mr_basic_project_info2:0 "This project can be completed multiple times."
 game_concept_mr_unique_project:0 "Unique Research Project"
 game_concept_mr_unique_project_desc:0 "Unique projects are exceptional and one-of-a-kind; if completed successfully, they cease to be available to anyone else in the world."
 game_concept_useful_magic_component:0 "Magical Component"
 game_concept_useful_magic_component_desc:0 "Magical Components are a valuable alchemical product sought after by every mage. They can be useful in rituals such as the [GetScheme('ultimate_spell_cast').GetTypeName] or when conducting certain kinds of [GetActivityType('magical_research').GetName]."
 magical_research_special_type_bar_segment_tt_0:0 "#t Foundational Insight#!\n$EFFECT_LIST_BULLET$You achieve 1 [mr_breakthrough|E]."
 magical_research_special_type_bar_segment_tt_1:0 "#t Promising Results#!\n$EFFECT_LIST_BULLET$You achieve 2 [mr_breakthrough|E]s.\n$EFFECT_LIST_BULLET$Excess breakthroughs may grant additional XP or other minor benefits."
 magical_research_special_type_bar_segment_tt_2:0 "#t Comprehensive Analysis#!\n$EFFECT_LIST_BULLET$You achieve 3 [mr_breakthrough|E]s.\n$EFFECT_LIST_BULLET$Excess breakthroughs may grant additional XP or other minor benefits."
 magical_research_special_type_bar_segment_tt_3:0 "#t A New Magical Theory#!\n$EFFECT_LIST_BULLET$You achieve 4 [mr_breakthrough|E]s.\n$EFFECT_LIST_BULLET$Excess breakthroughs may grant additional XP or other minor benefits."
 magical_research_phase:0 "$magical_research$"
 magical_research_phase_desc:0 "$magical_research_desc$"
 magical_research_calibration_phase:0 "Calibration"
 magical_research_calibration_phase_desc:0 "If your magical project requires calibration, now is the right time to do it!"
 ev11.33.title:0 "Extra Support"
 ev11.33.desc:0 "Your research preparations are nearly complete; you've managed to gather most of the materials and useful components - the rest can wait for later. Still, you could use some additional support, someone competent who could assist you in your research."
 ev11.33.0.a:0 "I'll ask [assistant.GetTitledFirstName]."
 ev11.33.0.b:0 "Or maybe [assistant2.GetTitledFirstName]?"
 ev11.33.0.c:0 "[assistant3.GetTitledFirstName] is the right person."
 ev11.33.0.d:0 "I don't need anyone."
 mr_magic_assistant_modifier:0 "Assisted in Magical Research"
 ev11.34.title:0 "Research Focus"
 ev11.34.desc:0 "The final preparations depend on the field you intend to delve into. A few ideas come to mind - ones worth investigating or developing further. The current circumstances also seem suitable for testing certain theories you once read about in old tomes."
 ev11.34.0.a:0 "[ROOT.Char.Custom('MyFirstMResearchOption')]"
 ev11.34.0.b:0 "[ROOT.Char.Custom('MySecondMResearchOption')]"
 ev11.34.0.c:0 "[ROOT.Char.Custom('MyThirdMResearchOption')]"
 ev11.34.0.d:0 "[ROOT.Char.Custom('MyFourthMResearchOption')]"
 ev11.34.0.c1:0 "Preparing the ritual."
 ev11.34.0.c2:0 "Slowed Aging."
 ev11.34.0.c3:0 "Strengthening combat spells."
 ev11.34.0.c4:0 "Defensive Measures."
 ev11.34.0.f:0 "Magic Ring!"
 mr_ring_of_power_info:0 "You will create a unique magical item."
 ev11.34.0.e:0 "I will consider something else."
 ev11.34.0.d_ct:0 "You have a few days to change your intent."
 mr_advanced_project_info:0 "This is an [mr_advanced_project|E]."
 mr_basic_project_info:0 "This is a [mr_basic_project|E]."
 mr_unique_project_info:0 "This is a [mr_unique_project|E]."
 mr_requires_1_breakthrough_info:0 "To complete this research project successfully, you need to achieve 1 [mr_breakthrough|E]."
 mr_requires_2_breakthrough_info:0 "To complete this research project successfully, you need to achieve 2 [mr_breakthrough|E]s."
 mr_requires_3_breakthrough_info:0 "To complete this research project successfully, you need to achieve 3 [mr_breakthrough|E]s."
 mr_requires_4_breakthrough_info:0 "To complete this research project successfully, you need to achieve 4 [mr_breakthrough|E]s."
