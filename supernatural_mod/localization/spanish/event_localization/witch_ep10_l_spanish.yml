 ev11.1a.title:0 "The Cost of Love"
 ev11.1b.title:0 "The Cost of Friendship"
 ev11.1.desc:0 "[new_mage.GetTitledFirstName] approached you, invoking the bond of friendship and all that unites you, to request one of your artifacts. [new_mage.GetSheHe|U] asserts [new_mage.GetHerHis] worthiness as its guardian and pledges to wield its power in defense of your mutual interests."
 ev11.1.0.a:0 "So be it, [new_mage.GetSheHe] is worthy."
 ev11.1.0.b:0 "I shall honor [new_mage.GetHerHis] right to the artifact, though only upon my demise."
 ev11.1.0.c:0 "A true friend would not ask for such a thing."
 ev11.2.title:0 "Recognition"
 ev11.2.desc:0 "Your progress in mastering true power is unmistakable; you can already call yourself a fully fledged mage. Such abilities may draw the attention of the mighty of this world, perhaps granting you even greater advantages, for the right reputation will surely further strengthen your standing in the world."
 ev11.2.0.a:0 "Let them fear the truth of what I have become."
 ev11.2.0.a_ct0:0 "Your next Mage Summit will have a 50% discount."
 ev11.2.0.a_ct:0 "#P $ev11.2.0.a_ct0$#!"
 ev11.2.0.b:0 "My name shall echo across the ages."
 ev11.2.0.c:0 "I won't flaunt it."
 ev11.2.0.d:0 "I prefer to keep my abilities secret."
 ev11.2.0.d_ct:0 "#P This action will reduce the attention of witch hunters.#!"
 ev2.1.a_fl:0 "Meditation and mystical practices should bring me new answers."
 ev2.1.c_fl:0 "If witches are good at anything, it's certainly herbs, decoctions, and elixirs."
 ev2.1.g_fl:0 "I have uncovered certain secrets, and I intend to share them with those I deem worthy."
 ev2.1.e_fl:0 "You're not you when you're hungry..."
 ev2.1.f_fl:0 "This decision can wait."
 ev2.1.x:0 "I am interested in technology and advancement."
 ev2.1.x_fl:0 "Fools and ignoramuses call it sorcery - I call it science."
 ev2.1.x_ct:0 "You may receive additional benefits in the future."
 wc_innovator_modifier:0 "Innovator"
 wc_innovator_full:0 "The Innovator"
 ev11.3.title:0 "$wc_innovator_full$ - Way of Thinking"
 ev11.3.desc:0 "You have several ideas worth pursuing, but they require refinement, effort, and time. Even if they're only theoretical for now, you're able to find in them a new perspective and inspiration for the future. Above all, however, you need better work organization and a more deliberate approach."
 ev11.3.0.a:0 "I'll look for useful information in the tomes."
 ev11.3.0.b:0 "I'll develop my own methods."
 ev11.5.title:0 "$wc_innovator_full$ - Constructions"
 ev11.5.desc:0 "Lately, you've been particularly interested in architecture, and you decided to take a closer look at building construction methods. What caught your attention most was the fact that a well-prepared structural design can save a significant amount of materials-and therefore money and time."
 ev11.5.0.a:0 "It is something we can use in practice."
 ev11.5.0.b:0 "Maybe I can monetise this idea somehow."
 ev11.5.0.c:0 "One doesn't exclude the other."
 wc_innovator_constructor_modifier:0 "Architectural Innovations"
 ev11.6.title:0 "$wc_innovator_full$ - Logistics"
 ev11.6.desc:0 "People and goods are constantly on the move. Even an ordinary peasant regularly travels between his homestead and his fields, while nobles, merchants, and soldiers sometimes cover truly vast distances. You've spent a great deal of time contemplating these phenomena, and several new ideas related to them have come to mind."
 ev11.6.0.a:0 "Travel could be faster."
 wc_innovator_fast_travel_modifier:0 "Fast Travels"
 ev11.6.0.b:0 "Travel could be safer."
 wc_innovator_safe_travel_modifier:0 "Safe Travels"
 ev11.6.0.c:0 "This topic is worth deeper analysis."
 ev11.7.title:0 "$wc_innovator_full$ - Agriculture"
 ev11.7.desc:0 "Recently, you came across a group of travelers who mentioned the farming methods used in the place they come from. It occurred to you that the same methods might prove useful on the steppes as well."
 ev11.7.0.a:0 "I prefer to focus on serious work."
 ev11.8.title:0 "$wc_innovator_full$ - Warfare"
 ev11.8.desc:0 "People have always engaged in conflicts using violence. The weak yield to the strong, and the strong yield to the cunning, that's how the world works. The moral of this story is simple: one must be cunning, or at least strong. For some time now, you have been analyzing the ways in which local rulers conduct their war campaigns, and you have come to the conclusion that the number and quality of troops are not the only factors determining victory in war. Beyond strategy and tactics, the very manner of command and management of the army, along with the ability to make swift and accurate decisions, are indispensable components of victory."
 ev11.8.0.a:0 "Proper organization is the key to victory."
 ev11.8.0.b:0 "And yet, strategy and tactics cannot be underestimated."
 ev11.8.0.c:0 "I will take every factor into account."
 ev11.9.desc:0 "Your efforts to improve your surroundings have so far yielded certain results. Many of your ideas required unconventional thinking, and some were inspired by practices that some might consider forbidden or dubious, but ultimately what matters is the final outcome. This stands as proof of the effectiveness of a scientific approach in every field of life, even if some regard such methods as inappropriate or eccentric."
 ev11.9.0.a:0 "I've got more work to do."
 ev11.9.0.a_ct:0 "Your efforts will continue."
 wc_personal_innovator_notes_modifier:0 "Personal Notes"
 ev11.10.title:0 "$wc_innovator_full$ - Armorer"
 ev11.10.desc:0 "Lately, you have become interested in the subject of armor construction. You believe you are capable of modifying the joints of the armor you use so that it becomes more reliable and durable."
 ev11.10.0.a:0 "It's worth a try."
 wc_innovator_armor_modifier:0 "Improvement"
 ev11.11.title:0 "$wc_innovator_full$ - Governance"
 ev11.11.desc:0 "Lately, craftsmen and manufactories have captured your attention. It is clear to you that, alongside agriculture, it is artisanal production and economic development that determine the strength of the kingdom. Yes, some may say that strength lies in the army, but you know better than anyone that an efficient army requires efficient funding, and that comes from a strong economy. This is precisely what all efforts should be focused on."
 ev11.11.0.a:0 "I have a few ideas for immediate implementation."
 ev11.11.0.b:0 "I prefer to focus on other matters."
 ev11.12.title:0 "$wc_innovator_full$ - Black Powder"
 ev11.12.desc:0 "Nature holds many mysteries, and one of them is a mixture of charcoal, sulfur, and saltpeter, which, when ignited, can produce a flash and a bang. In some circles, these substances are regarded as a godless tool of the devil, while others are skeptical of the very existence of such a compound. Yet there are those who recognize its potential, and you are among them. However, discovering the exact recipe will require time and the gathering of the proper ingredients."
 ev11.12.0.a:0 "Perhaps the local merchants will have the necessary ingredients."
 ev11.12.0.b:0 "I am able to produce these ingredients."
 ev11.12.0.c:0 "I'd rather devote my resources to something that won't blow me up."
 ev11.12.0.c_ct:0 "You are abandoning this idea."
 ev11.13.desc:0 "Your experiments with black powder have exceeded all expectations. The flashes of light are blinding, and the roar is deafening. The energy of the explosion can also destroy nearby objects and hurl their fragments over long distances. Many uses for such materials come to mind: from harmless fireworks, through mining work, to military applications. The mere sound of the blast can scare horses and spread confusion in enemy ranks, and of course, one could also drop such charges from the walls straight onto a besieging army... or, conversely, blow such walls into the air."
 ev11.13.0.a:0 "I'll give it a try as soon as I get the chance."
 wc_innovator_pyrotechnician_modifier:0 "Pyrotechnician"
 wc_innovator_pyrotechnician_modifier_desc:0 "The ability to create noise, smoke, or even explosions can have many applications on the battlefield - both offensive and defensive."
 ev2.41.f:0 "I will prepare the black powder charges."
 wc_innovator_bomb_modifier:0 "Black Powder Explosive Charge"
