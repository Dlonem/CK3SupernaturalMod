 ultimate_spell_preparation_modifier:0 "Preparations for the Ultimate Spell"
 mr_if_succeded_desc:0 "If successful:"
 mr_research_gains_progress_title:0 "Magical Research Is Progressing"
 mr_completed_successful_title:0 "Magical Research Successfully Completed!"
 mr_completed_successful_more_rewards_title:0 "$ev11.54.title$"
 mr_completed_failed_title:0 "Magical Research Ended in Failure"
 mr_learning_from_mistakes_modifier:0 "Learning from Mistakes"
 mr_progress_boost_terrain_advantage:0 "[GetActivityType('magical_research').GetName] Initial Progress"
 ev11.36.desc:0 "At last! Your research has yielded the results you expected. It seems you've grown richer in new knowledge, and another step on your path toward enlightenment and the acquisition of new powers has been taken."
 ev11.36.0.a:0 "I have become perfect."
 ev11.36.0.b:0 "Glorious, isn't it?"
 ev11.36.0.c:0 "My power grows."
 ev11.37.desc:0 "Despite many attempts and considerable effort, your research has reached a dead end. Perhaps what you were trying to achieve simply isn't possible, or maybe the problem lies in the wrong approach. Nevertheless, you've still managed to gather many valuable insights that may prove useful in the future."
 ev11.37.0.a:0 "I'll take this as a valuable lesson for the future."
 slowed_aging_process_modifier:0 "Slowed Aging Process"
 NOT_NECRO_NOT_CORRUPT:0 "You do #bold not#! have the Trait: [GetTrait('necromancer').GetName( GetNullCharacter )|L] or [GetTrait('corrupted').GetName( GetNullCharacter )|L]"
 LEGENDARY_MAGE_WITH_A_SOUL:0 "You must be a legendary mage (with an unsold soul)"
 mr_elemental_focus_modifier:0 "Elemental Focus"
 mr_custom_spell_info:0 "You will be able to develop a special dueling spell."
 mr_defence_spell_info:0 "You will gain access to the [GetDecisionWithKey('magic_defence_decision').GetName] [decision|E]."
 mr_upgrade_singularity_info:0 "Ancient Singularity will be upgraded."
 mr_upgrade_singularity_info2:0 "Ancient Singularity will be resistant to malfunctions."
 mr_runic_fortifications_modifier:0 "Runic Fortifications"
 mr_golem1_info:0 "You will construct a golem!"
 spec_master_alteration_terrain_advantage:0 "Gold from [GetDecisionWithKey('magic_transmutation_decision').GetName]"
 ring_of_power_name:0 "Enchanted Ring"
 ring_of_power_desc:0 "This undoubtedly magical ring radiates power and seems to possess something hypnotic. Only its original creator knows its true nature and purpose."
 ev11.38.desc:0 "You have given the ring its proper shape and prepared its magical structure so it can contain powerful magic. The time has come for the final stage of the work..."
 ev11.38.0.a:0 "The ring will be a tool of manipulation."
 ev11.38.0.b:0 "I will place a part of my essence within it."
 ev11.38.0.c:0 "Both ideas are good."
 ev11.38.0.a_ct1:0 "The item will gain a secret property: the creator of the ring will be able to use the $command_minion_interaction$ [interaction|E] against its owner."
 ev11.38.0.a_ct2:0 "Some powerful beings, such as demons or legendary mages, will be resistant to this effect."
 mr_ring_of_power_power_modifier:0 "Enbound Power"
 mr_sacrificed_power_modifier:0 "Sacrificed Power"
 ev11.39.title:0 "Laborious Progress"
 ev11.39.0.a:0 "Looks like I'm in for another sleepless night."
 ev11.39.0.b:0 "Hmm, the solution is actually simple!"
 ev11.39.0.c:0 "Tomato!"
 odd_behaviour_eccentric_modifier:0 "Odd Behaviour"
 ev11.40.title:0 "Total Commitment"
 ev11.40.desc:0 "Your research is moving forward, but you realize that if you expect spectacular results, you should involve even more resources and people. Of course, the more people know about it, the harder it becomes to keep your work secret..."
 ev11.40.0.a:0 "I'm not going to keep this a secret!"
 ev11.40.0.b:0 "I'll bring in a few discreet people to help."
 ev11.40.0.c:0 "I need to rely more on my assistant."
 ev11.41.title:0 "Complications"
 mr_immortal_child_consumer_modifier:0 "Eternal Hunger"
 modifier_definition_mr_immortal_child_consumer_modifier: "\t#weak Grows every time you consume a child#!"
 eternal_hunger_txt:0 "Consuming life force."
 mr_add_option_terrain_advantage:0 "[GetActivityType('magical_research').GetName] options"
