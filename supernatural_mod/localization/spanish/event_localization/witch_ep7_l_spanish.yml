against_the_witch_war_desc:0 "La bruja será quemada en la hoguera."
against_the_witch_war_defender:0 "Serás quemado en la hoguera."
against_the_witch_war_defender2:0 "Serás encarcelado."
ev8.41.opening:0 "[attacker.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
ev8.41.desc:0 "Nos estamos preparando para una gran guerra contra la influyente bruja [defender.GetTitledFirstName]. Te ofrezco la oportunidad de unirte a nuestra noble causa, algo que agradará a tu dios y escribirá tu nombre en las páginas de la historia."
ev8.41.0.a:0 "Por supuesto, cuentas con todo mi apoyo."
ev8.41.0.b:0 "Este no es mi asunto."
ev4.10.0.d:0 "Formaré una gran coalición contra la bruja."
ev4.10.0.d_ct:0 "#N Puedes usar esta opción una vez por vida.#!"
ev8.42.title:0 "Gran coalición"
ev8.42.desc:0 "Comienzas los preparativos para la Gran Guerra contra [recipient.GetTitledFirstName]. Muchos gobernantes parecen interesados en apoyar esta noble idea. Sin embargo, quizá no haga falta una guerra: empieza por enviar un ultimátum a [recipient.GetTitledFirstName]. Tal vez [recipient.GetSheHe] se rinda sin luchar."
ev8.43.opening:0 "[actor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
ev8.43.desc:0 "Te escribo para darte un ultimátum. Debes entregarte a mis manos y permitir que seas juzgado en un proceso por brujería, o yo y otros gobernantes piadosos te declararemos bruja, aplastaremos tus ejércitos y acabarás ardiendo en la hoguera. ¿Cuál es tu respuesta?"
ev8.43.0.a:0 "Entonces habrá guerra."
ev8.43.0.a_ct:0 "Puede que pronto te ataque una gran coalición."
ev8.43.0.b:0 "Puesto que esta es la única manera de evitar la guerra, me rendiré."
ev8.43.0.b_title:0 "Se rindió sin luchar"
ev8.43.0.c:0 "Mi respuesta es: que te den, cazador."
ev8.44.desc:0 "Tal como podías imaginar, [recipient.GetTitledFirstName] se niega a rendirse. Debes continuar con tus preparativos para la guerra, que avanzan sin problemas. Es cierto que por ahora no has logrado convencer a todos los gobernantes importantes para que participen, pero algunos están dispuestos a enviarte voluntarios, tropas de élite y caballeros veteranos, siempre que cubras el coste de su avituallamiento."
ev8.44.0.a:0 "Las tropas adicionales podrían ser útiles."
ev8.44.0.b:0 "No necesitamos soldados adicionales."
ev8.45.desc:0 "Tus fuerzas están listas para la guerra. Al menos algunos de los gobernantes que no combaten ahora mismo en otros conflictos pueden prestarte su apoyo."
ev8.45.0.a:0 "Bien, ¡es hora de la guerra!"
ev8.45.0.b_ct:0 "Volverás a considerar esto dentro de tres meses."
