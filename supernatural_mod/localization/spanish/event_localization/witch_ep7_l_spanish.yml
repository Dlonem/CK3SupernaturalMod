cyro_proposal_interaction_desc:0 "Puedes conferir poder mágico a un mortal si te promete su alma a cambio."
DEMON_CYRO_PROPOSAL:0 "Tengo una oferta para vosotros, mortales. ¿Estáis dispuestos a vender vuestra alma a cambio de un poder inmenso?"
magic_cyro_ct1:0 "Una vez que el contrato se complete, o que el objetivo muera, podrás consumir su alma."
magic_cyro_ct2:0 "El objetivo recibirá acceso a la magia u otros beneficios a cambio de su alma."
