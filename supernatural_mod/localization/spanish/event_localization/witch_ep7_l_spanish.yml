ev8.46.title:0 "Curación masiva"
ev8.46.desc:0 "La noche ha traído buenas noticias. Muchas personas heridas o aquejadas de diversas enfermedades despertaron completamente curadas, sin rastro alguno de sus dolencias. Es cierto que las enfermedades no han desaparecido del mundo, pero mucha gente da gracias a Dios por la gracia que se les ha concedido."
ev8.46.0.a:0 "Esto es un milagro."
ev8.46.0.b:0 "Deberían darme las gracias."
ev8.47.desc:0 "Una bruja está muy interesada en tu Singularidad Antigua. A [witch0.GetTitledFirstName] le encantaría poder examinar el artefacto más de cerca. Por un lado, ganarte la simpatía de [witch0.GetTitledFirstName] podría serte beneficioso; por otro, te inquieta entregar tu artefacto a otra persona, aunque solo sea por un instante."
ev8.47.0.a:0 "Está bien; al fin y al cabo, no dejaré que se aparte de mi vista."
ev8.48.desc:0 "[witch0.GetTitledFirstName] examinó el objeto y te hizo algunas preguntas. En un momento dado [witch0.GetSheHe] sujetó mal el dispositivo y este se activó. El artefacto emitió un torrente de energía poderosa que impactó contra el muro y lo atravesó de parte a parte. Un invitado y varios sirvientes que estaban allí se evaporaron sin dejar rastro. A través del agujero puedes ver que el rayo también causó daños fuera, destruyendo el muro y prendiendo fuego a varios edificios..."
ev8.48.0.a:0 "Por suerte, el nivel de potencia estaba al 10 %..."
ev8.49.desc:0 "Percibes que el objetivo se te resiste. Manipular a [target.GetHerHim] puede ser mucho más difícil de lo que pensabas."
ev8.49.0.a:0 "Necesito pensar en nuevas tácticas."
ev8.49.0.b:0 "Solo requiere más tiempo."
