ev8.15.title:0 "El quirógrafo"
ev8.15.desc:0 "[actor.GetTitledFirstName] ha acudido a ti con una oferta: [actor.GetSheHe] puede concederte poder a cambio de tu alma. Eso significa que dentro de [actor.Custom('CYRU_DURATION')] vendrá un demonio u otro a llevarte al infierno. Pero, ¿a quién le importa lo que ocurra dentro de [actor.Custom('CYRU_DURATION')]? Además, quizá de algún modo puedas engañar a los demonios..."
ev8.15.0.a:0 "Rechazo tu oferta, demonio."
ev8.15.0.b:0 "Acepto este acuerdo."
ev8.15.0.c:0 "Negociaré unas condiciones aún mejores."
ev8.16.desc:0 "Parece que [recipient.GetTitledFirstName] ha rechazado tu generosa oferta..."
ev8.17.desc:0 "[recipient.GetTitledFirstName] ha aceptado tu oferta: se ha firmado el quirógrafo. Según el acuerdo, dentro de [actor.Custom('CYRU_DURATION')] [recipient.GetTitledFirstName] irá al infierno y podrás consumir su alma."
arcane_focus_unlocked_ct:0 "¡$arcane_focus$ ha sido #P desbloqueado#!"
ev8.18.desc:0 "El tiempo de tu contrato con el demonio ha terminado. Según el quirógrafo, ahora deberías ir al infierno para dejar que el demonio consuma tu alma."
ev8.18.0.a:0 "No me voy a ninguna parte."
ev8.18.0.a_ct:0 "Los demonios probablemente intentarán matarte."
ev8.18.0.b:0 "Bien... Estoy preparado, vamos."
ev8.19.desc:0 "Tras muchos años de espera, el contrato por fin llega a término, y puedes llevarte a [recipient.GetTitledFirstName] al infierno. [recipient.GetSheHe|U] no se resiste, de modo que cuando su cuerpo finalmente muera podrás arrancar con facilidad la energía que necesitas de su alma."
ev8.20.desc:0 "El contrato se ha cumplido y, según lo pactado, [recipient.GetTitledFirstName] debería ir al infierno, dejándote su alma. Sin embargo, [recipient.GetTitledFirstName] no tiene intención alguna de morir voluntariamente. [recipient.GetSheHe|U] cree que [recipient.GetSheHe] puede desafiarte..."
ev8.20.0.a:0 "Mataré a este necio."
ev8.20.0.b:0 "Esperaré; algún día [recipient.GetSheHe] morirá de todos modos."
ev8.20.0.c:0 "Venderé este contrato a otro demonio."
ev8.20.0.c_ct:0 "Entregarás el contrato a otro demonio, quedándote una pequeña comisión."
cyro_prematurly_completed_toast:0 "El objetivo del quirógrafo murió antes de que se completara el contrato."
cyro_completed_toast:0 "Estás consumiendo el alma"
cyrographer_terrain_advantage:0 "Tiempo de reutilización de Proponer un quirógrafo (en años)"
cyrographer_terrain_cancel_negative_supply:0 "Acceso a la [interaction|E] Proponer un quirógrafo"
cyro_proposal_cooldown_reset:0 "Se ha eliminado el tiempo de reutilización de la [interaction|E] Proponer un quirógrafo."
magic_art_hide_ct:0 "Has fracasado al interceptar los artefactos mágicos"
magic_art_hide_ct2:0 "Tu prisionero logró ocultar o entregar sus objetos antes de ser capturado."
ev8.21.desc:0 "Tu búsqueda se enfrenta a obstáculos constantes. Un sirviente enviado a obtener información ha desaparecido. La colección de libros que querías comprar fue adquirida de pronto por otra persona. Además, varios incidentes extraños te apartan continuamente de tu trabajo. Te preguntas si se trata de una coincidencia, o si quizá uno de tus rivales te está saboteando sutilmente."
ev8.21.0.a:0 "Necesito concentrarme en mi trabajo."
ev2.10.c:0 "Esto se resolverá en el campo de batalla."
touched_divinity_modifier:0 "Poderes místicos"
blob_name:0 "Masa informe"
blob_name2:0 "Leviatán"
ev8.22.title:0 "Proscrito"
ev8.22.desc:0 "Un pequeño demonio apareció en el círculo mágico. La criatura parece abatida, pero se aprecia un claro alivio en su rostro.\n'¡Gracias a Lucifer! Has salvado al pobre Blob en el último momento...'"
ev8.22.0.a:0 "¿Quééé?"
ev8.23.desc:0 "¡Perdóname, maestro! Sé que esperabas a un demonio más poderoso, pero tenía que aprovechar la oportunidad para escapar del infierno. Los otros demonios quieren asesinar al pobre Blob, sin motivo alguno, claro... Sí, mi nombre es Bloboarisivilas, pero todo el mundo me llama Blob. A tu servicio, maestro."
ev8.23.0.a:0 "¿Qué puedes ofrecerme... Blob?"
ev8.24.desc:0 "[this0.GetLadyLord|U], Blob no posee talentos mágicos como otros demonios. Por eso los demás lo desprecian... No puedo ofrecerte nada salvo mi devoción, pero por favor, ¡no me envíes de vuelta! ¡Blob puede servirte! ¡Es el mejor sirviente de todos los mundos, ya lo verás! ¡Por favor!"
ev8.24.0.a:0 "Que así sea. Serás mi sirviente personal."
ev8.24.0.b:0 "No liberaré a un demonio, ni siquiera a uno tan patético. Adiós."
ev8.25.desc:0 "¡Maestro, gracias por llamarme! ¿Has cambiado de idea? ¿Puedo servirte? Cada instante en el infierno es doloroso para el pobre Blob."
ev8.25.0.a:0 "No, solo quería verte sufrir. Adiós."
ev8.26.desc:0 "Desde que fue invocado, Blob te ha servido a cada paso. Está a tu lado cuando puedes necesitarlo, cerca o lejos, pero siempre listo para cumplir cualquier orden. Es un mayordomo notable y un excelente mensajero, y además mantiene todo en orden a tu alrededor."
ev8.26.0.a:0 "Por fin tengo un sirviente competente."
ev8.27.desc:0 "Últimamente ves a Blob con menos frecuencia, pero sigue acudiendo cada vez que lo llamas. Su presencia, sin embargo, se deja sentir en todo el castillo. Los suelos relucen, todo parece ordenado y hermoso. Hasta tus consejeros han comentado hace poco que tu mansión nunca había tenido mejor aspecto."
ev8.27.0.a:0 "Blob merece una recompensa."
ev8.27.0.b:0 "Mantengámoslo así."
shining_mansion_modifier:0 "Castillo resplandeciente"
ev8.29.desc:0 "La triangulación mágica indicó que la fuente del hechizo era... tu castillo o sus alrededores. Por razones desconocidas, no puedes rastrear con precisión a tu objetivo."
ev8.29.0.a:0 "Algo malo parece estar ocurriendo justo bajo mis narices."
ev8.30.opening:0 "[mefistoX.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
ev8.30.desc:0 "Por lo general no me inmiscuyo en los asuntos de demonios y mortales, pero esta vez haré una pequeña excepción. El demonio que conoces como \"Blob\" es mi enemigo. Por eso quiero decirte que no es quien dice ser. Una vez logró engañarme incluso a mí; es un gran actor y un maestro de la manipulación. Será mejor que andes con cuidado."
ev8.30.0.a:0 "Mefisto intenta arrastrarme a alguna intriga demoníaca retorcida."
ev8.30.0.b:0 "Será mejor que vigile de cerca a Blob, por si acaso."
ev8.31.title:0 "Malos presentimientos"
ev8.31.desc:0 "Te despiertas por la noche con una sensación extraña. Al cabo de un rato te das cuenta de que puedes percibir magia en la zona; debe de haber sido eso lo que te despertó. El aire está electrizado por el exceso de poder. Alguien muy cerca está lanzando hechizos poderosos; crees que la fuente se encuentra bajo el castillo, en tus mazmorras."
ev8.31.0.a:0 "Iré a comprobarlo."
ev8.32.desc:0 "A esta hora el castillo está muy silencioso, y un poco inquietante. Lo extraño es que no te cruzas con una sola persona por el camino, ni siquiera con los guardias. Después de todo, incluso por la noche deberían estar patrullando los corredores y las murallas, ¿no?"
ev8.32.0.a:0 "Mañana tendré una charla seria con el comandante de la guardia."
ev8.32.0.a_ct:0 "Sigues caminando hacia las mazmorras."
ev8.33.desc:0 "Descubres el primer cadáver cerca de la entrada del calabozo, y poco después otro más: el comandante de la guardia con el que pensabas hablar mañana. A medida que avanzas encuentras más guardias y sirvientes, y las mazmorras empiezan a parecer un matadero. ¿Es esta alguna pesadilla retorcida? En la cámara central encuentras a Blob de pie entre la carnicería, con una leve sonrisa en el rostro. Irradia la energía mágica que percibiste antes."
ev8.33.0.a:0 "¿Por qué, Blob? Si ese es de verdad tu nombre..."
ev8.34.desc:0 "El hechizo ilusorio se difumina y revela la verdadera forma de Blob. Ya no se parece al demonio discreto que conocías antes.\n\"Mi verdadero nombre es $blob_name2$. Llevo mucho tiempo intentando entrar en tu mundo. Mi mundo. El mundo de mi verdadero amo, uno de los Grandes Primigenios que ahora duerme en algún lugar del fondo de tus océanos.\""
ev8.34.0.a:0 "¿Por qué has matado a mis hombres?"
ev8.35.desc:0 "'Llevo un tiempo matándolos. Necesito estas vidas para despertar a mi señor, aunque la muerte de la gente corriente aporta poco poder. La tuya, en cambio, podría ser algo que mi amo sí apreciara, algo capaz de despertarlo. Sabía que acabarías apareciendo aquí. Yo estoy listo. Nosotros estamos listos.'"
ev8.35.0.a:0 "'Nosotros'?"
ev8.36.desc:0 "Otros dos demonios emergen de la oscuridad. No parecen tan poderosos como Leviatán, pero aun así... siguen siendo demonios.\n'Sigues siendo un mago poderoso, un desafío incluso para un demonio. Y a mí no me gusta correr riesgos... Matadlo.'\nAmbos demonios se abalanzan sobre ti."
ev8.36.0.a:0 "¡Responderé con mi espada!"
ev8.36.0.a_ct:0 "#P Rechazarás#! un ataque demoníaco"
ev8.36.0.a_ct2:0 "Puedes resultar #N herido#!"
ev8.36.0.a_ct3:0 "Ambos demonios serán desterrados"
ev8.36.0.b:0 "Intentaré lanzar un hechizo de doble destierro."
ev8.36.0.c:0 "El hechizo Paso Sombrío los confundirá."
ev8.36.0.d:0 "La Singularidad Antigua simplemente los abrasará."
magic_damaged_walls_modifier:0 "Muros dañados"
ev8.37.desc:0 "'¡Dijiste que [this0.GetSheHe] era solo un mortal corriente!' gritó uno de los demonios a Leviatán. Los dos demonios menores retrocedieron, claramente poco dispuestos a enfrentarse a un mago. Instantes después, Leviatán y tú quedasteis solos en la mazmorra."
ev8.37.desc2:0 "Lograste abatir y aniquilar a ambos demonios con tu poder. Solo queda Leviatán."
ev8.37.0.a:0 "¿Te queda algún as bajo la manga, demonio?"
ev8.38.desc:0 "«Sabes bien que, en estos tiempos, cuesta encontrar sirvientes leales. Pero hicieron su trabajo: quería que gastaras parte de tu energía con ellos. Ahora ha llegado tu final.» Ves cómo el demonio empieza a lanzar un hechizo de batalla."
ev8.39.title:0 "El pequeño compañero"
ev8.39.desc:0 "En general, estás satisfecho con tu familiar, aunque a veces te preguntas si otro no serviría mejor a tus propósitos."
ev8.39.0.a:0 "Creo que prefiero uno."
ev8.39.0.b:0 "Cualquier otra opción será mejor."
ev8.39.0.c:0 "Conservaré a mi pequeño compañero."
