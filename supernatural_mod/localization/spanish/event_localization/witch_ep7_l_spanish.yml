ev8.2.desc05:0 "Padre real: [rfather.GetTitledFirstName]"
ev8.2.desc05a:0 "Padre real: Desconocido"
ev8.2.desc06:0 "Último hechizo lanzado: [recipient.Custom('LastSpellCast')]"
ev8.2.desc07:0 "Tiene alma: [recipient.Custom('DoesHaveSoul')]"
demon_has_no_soul:0 "No ($trait_demon$)"
illusion_spells:0 "Hechizo de ilusión desconocido"
ev8.2.0.a:0 "Esto podría dar pie a muchos rumores."
ev8.2.0.b:0 "Anunciaré quién es el verdadero padre."
ev8.2.0.c:0 "¡[recipient.GetSheHe|U] estaba lanzando un hechizo prohibido!"
ev8.3.title:0 "Comprender a las brujas"
ev8.3.desc:0 "Como resultado de tu reciente caza de brujas, has encontrado notas de una de ellas. Sus escritos describen rituales que una persona corriente tacharía de repugnantes, pero tú sabes que esta información podría resultar crucial para comprender cómo piensan y actúan las brujas."
ev8.3.0.a:0 "No correré riesgos; quemaré las notas."
ev8.3.0.b:0 "Estudiaré estos documentos."
ev8.4.desc:0 "Has descifrado las notas interceptadas de la bruja. Parece que la brujería es solo el primer paso hacia secretos oscuros y un poder que escapa a la comprensión humana."
ev8.4.0.a:0 "Usaré este conocimiento en la lucha contra las brujas."
ev8.4.0.b:0 "Mi misión parece inútil frente a un poder semejante."
ev6.11.desc4B:0 "Este secreto concreto que has descubierto está relacionado con [rstarget.GetTitledFirstName]."
ev6.11.desc4M:0 "$ev6.11.desc4$\n$ev6.11.desc4B$"
ev6.11.desc5:0 "En la mente de [recipient.GetTitledFirstName], puedes ver claramente que [recipient.GetSheHe] no participa actualmente en ninguna intriga, pero [recipient.GetSheHe] sabe algo sobre [rsecret2.GetName], propiedad de [rsowner.GetTitledFirstName]."
ev6.11.desc6:0 "Es extraño, pero tu hechizo es incapaz de penetrar en la mente de [recipient.GetTitledFirstName], como si una barrera mágica especial rodeara a [recipient.GetHerHim]."
me_time_travel_project_ct:0 "Desbloqueas el [magic_special_project|E] #italic Viaje en el tiempo#!."
me_time_travel_option:0 "Viaje en el tiempo"
ev8.5.desc:0 "Tu hechizo de viaje temporal está listo. Lo has calibrado para desplazarte hacia el futuro, pues viajar en otra dirección podría provocar una paradoja. ¿Seguirá existiendo tu dinastía dentro de varios siglos? ¿Se habrá vuelto la magia algo común entre la nobleza corriente? Ha llegado el momento de averiguarlo."
ev8.5.0.a:0 "¡Lanzaré el hechizo!"
ev8.5.0.a_ct:0 "Pones rumbo al futuro, aunque estás preparado para regresar de inmediato si surgen problemas."
ev8.6.title:0 "El futuro es ahora"
ev8.6.desc:0 "Te golpea una ola de ruido ensordecedor. No tienes ni idea de qué ocurre aquí, ¡pero no es seguro!"
ev8.6.0.a:0 "¡Rápido, voy a romper el hechizo!"
ev8.7.desc:0 "¡Lo has logrado, has sobrevivido! Aunque está claro que este hechizo es demasiado peligroso para usarlo sin un motivo de peso. El futuro parece inquietante. Al parecer, el mundo está gobernado por inmensos... dragones de acero. Si la humanidad aún existe, probablemente sea su alimento o su esclava. ¿De dónde han salido esas bestias de metal? ¿Serán derrotados por ellos los magos del futuro? Una cosa está clara..."
ev8.7.0.a:0 "¡Tengo que detener esto!"
ev8.7.0.a_ct:0 "Considerarás opciones para detener a los «dragones de acero»."
ev8.7.0.b:0 "Este futuro es inevitable."
ev8.8.title:0 "Cambiar el futuro"
ev8.8.desc:0 "Has reflexionado largo y tendido sobre cómo evitar el futuro que has presenciado. Al darte cuenta de que te faltan datos —y de que quizá ni siquiera sea seguro alterar la línea temporal— concluyes que necesitas la guía de un experto. Tal vez Merlín o Baba Yaga tengan respuestas, si es que quieren ayudarte. Otra posibilidad es recurrir a un demonio poderoso y versado en magia."
ev8.8.0.a_ct:0 "Deberías hablar con Hécate"
ev6.4.0.c:0 "¿Puedes decirme cómo cambiar el futuro?"
ev8.9.desc:0 "'Pregunta interesante. Has visto algo, ¿verdad?'"
ev8.9.0.a:0 "He visto la perdición de los míos en el futuro. O eso creo."
ev8.9.0.a_ct:0 "Relatas la historia de tu viaje en el tiempo."
ev8.10.desc:0 "«Los humanos... hacéis cosas incluso cuando no las entendéis. Hasta los dioses manipulan el tiempo en contadas ocasiones; las entidades menores jamás deberían hacerlo», musita la demonio. «Si has visto el futuro, probablemente sea imposible cambiarlo. Eso sería una paradoja. Quizá tu propio viaje haya contribuido a fijar la línea temporal, y esos dragones llegarán de todos modos.»"
ev8.10.0.a:0 "¿Así que no se puede hacer nada?"
ev8.11.desc:0 "«Puedes intentar unir al mundo bajo un liderazgo fuerte para resistir a los dragones de acero. O desarrollar armas con las que destruirlos. Probablemente no llegarás muy lejos, porque estarás luchando contra el destino. Otra vía es combatir a los dragones en su propio tiempo. Eso podría quebrar la integridad de la línea temporal, pero... en fin. Una vez desarrollé un hechizo para luchar contra dragones, o al menos contra sus equivalentes en mi mundo.»"
ev8.11.0.a:0 "¿Me enseñarás ese hechizo?"
ev8.12.desc:0 "«Después de todo, soy un demonio. Nada me complacería más que ver cómo se deshace la línea temporal de tu mundo. Pero este hechizo es complejo y solo puede lanzarse una vez. Crea una trampa vorticial masiva que atrae objetos de gran tamaño en un amplio radio y los pulveriza hasta reducirlos a átomos, a partículas diminutas. Lánzalo hacia el futuro y algunos de los dragones perecerán, sin duda.»"
ev8.12.0.a:0 "Lo pensaré, pero aun así quiero conocer el hechizo."
ev8.12.0.a_ct:0 "Has aprendido el hechizo especial de Hécate."
ev8.12.0.a_ct2:0 "Desbloqueas la [decision|E] Detener a los dragones."
change_the_future_title:0 "Detener a los dragones"
change_the_future_desc:0 "Ya que no puedes impedir que lleguen los dragones, al menos puedes vengarte de ellos. Puedes crear una brecha temporal y lanzar a través de ella el hechizo de Hécate... si es que eso tiene algún sentido."
ev8.13.desc:0 "No sabes cómo detener la llegada de los \"dragones de acero\" —si es que eso es posible—, pero sí puedes intentar dañarlos en su propio tiempo. El hechizo de Hécate sembrará el caos entre ellos. Para reducir el riesgo, decides abrir una brecha temporal por la que lanzarás el hechizo. Lanzar dos hechizos complejos casi al mismo tiempo fue un desafío enorme, pero parece que lo has conseguido... Aunque, siendo sinceros, no estás seguro de haber elegido el momento y el lugar adecuados; eso sí, los dragones sin duda sentirán el impacto."
ev8.13.0.a:0 "No puedo hacer nada más por ahora."
ev8.13.0.a_ct:0 "El hechizo de Hécate ha sido lanzado"
ev8.14.title:0 "Mientras tanto, en el futuro..."
ev8.14.desc:0 "En el año 1880, a finales de enero, el buque británico HMS Atalanta emprende su último viaje a través del Atlántico, rumbo a Falmouth, en Inglaterra. El barco, junto con toda su tripulación, desaparece sin dejar rastro. Cuatro años más tarde, la goleta italiana 'Miramon' corre la misma suerte.\nEn tiempos en los que no existe la magia, incluso los hechizos más poderosos no son más que ecos de antiguos poderes, y aun así bastan para que muchos barcos y aviones se desvanezcan en este lugar conocido como..."
ev8.14.0.a:0 "El Triángulo de las Bermudas"
ev8.14.0.a_ct:0 "Tu trabajo ha terminado (esta vez de verdad)"
