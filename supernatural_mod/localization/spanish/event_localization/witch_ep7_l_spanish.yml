l_spanish:
ev8.1.desc:0 "Te das cuenta de que eres diferente de tus semejantes. A veces sabes lo que va a ocurrir antes de que suceda, aciertas con sorprendente precisión los pensamientos e intenciones de los demás, y el viento y el fuego parecen obedecer ocasionalmente tu voluntad."
ev8.1.0.a:0 "¡Será muy divertido!"
ev8.1.0.b:0 "¡Desarrollaré mi talento!"
ev8.1.0.c:0 "Mejor me pongo con otra cosa."
