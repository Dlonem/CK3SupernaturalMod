l_spanish:
samael_name:0 "Samael"
ev3.1.title:0 "El arcángel"
ev3.1.desc:0 "Una figura luminosa se alza frente a ti. El ser te observa a ti y luego a las runas que os separan. «Buen círculo de invocación», dice el demonio."
ev3.101.a:0 "Gracias. Vayamos al grano."
ev3.101.b:0 "Podría liberarte. ¿Te gustaría eso?"
ev3.101.c:0 "No te necesito. Vuelve al infierno."
ev3.2.desc:0 "«Supongo que quieres algo, Brujo. Habla.»"
ev3.102.a:0 "¿Qué puedes ofrecerme?"
ev3.102.b:0 "Debes cumplir mi voluntad, demonio."
ev3.3.desc:0 "Un deseo de muerte, brujo. Pronuncia mi nombre y piensa en alguien. Le arrebataré la vida... salvo que sea inmortal o cuente con una protección mágica realmente poderosa, por supuesto. También puedo bendecir a tu heredero..."
ev3.3.desc2:0 "Un deseo de muerte, brujo. Pronuncia mi nombre y piensa en alguien. Le arrebataré la vida... salvo que sea inmortal o cuente con una protección mágica realmente poderosa, por supuesto. También puedo bendecir a tu heredero o forzar a tus enemigos a rendirse."
ev3.103.a:0 "Acepto el deseo de muerte."
ev3.103.a_ct:0 "Obtienes un uso del hechizo de deseo de muerte."
ev3.103.b:0 "Entonces protege a mi heredero."
samael_blessing:0 "Protección de Samael"
ev3.103.c:0 "¡Demuestra a mis enemigos que no tienen ninguna posibilidad contra mí!"
death_wish:0 "Deseo de muerte"
death_wish_title:0 "Deseo de muerte"
death_wish_ct:0 "Agotarás el hechizo Deseo de muerte."
ev3.4.desc:0 "Brujos... sois tan predecibles. ¿Qué queréis?"
ev3.4.a:0 "Despeja mi mente."
ev3.4.b:0 "Purifica mi alma."
ev3.4.c:0 "¡Dame protección mágica absoluta!"
amp_modifier:0 "Protección mágica absoluta"
ev3.4.d:0 "Dame conocimiento secreto."
ev3.4.e:0 "Fortalece mi mente."
ev3.4.f:0 "Enséñame a combatir."
ev3.5.desc:0 "¿Cuál es la pega, brujo?"
ev3.5.a:0 "Bael. Quiero su muerte."
ev3.5.b:0 "Matarás a Belial."
ev3.5.c:0 "Envía a Astaroth de vuelta al infierno."
ev3.5.d:0 "Lilith debe morir."
ev3.5.f:0 "Mata a Moloch."
ev3.5.e:0 "He cambiado de opinión. ¿Qué puedes ofrecerme?"
ev3.5_ct:0 "Liberaste a Samael."
ev3.6.desc:0 "«He cumplido tu deseo, brujo. Y ahora, ¿por qué debería perdonarte la vida?»"
ev3.6.a:0 "Toma a mis cortesanos, haz lo que quieras con ellos."
ev3.6.b:0 "Te daré mi artefacto..."
ev3.6.c:0 "¿Porque no usaré el Grimorio Negro para desterrarte?"
ev3.6.d:0 "¡Te destierro, demonio!"
ev3.6.e:0 "Puedo darte algo mejor..."
ev3.7.desc:0 "«Ha sido un placer hacer negocios contigo, mago. Adiós.»"
ev3.7.a:0 "Adiós, demonio."
ev3.8.desc:0 "Me parece justo. Adiós, brujo."
ev3.9.a:0 "Ojalá no volvamos a vernos."
coven_rule_tradition:0 "Autoridad del aquelarre"
coven_rule_tradition_name:0 "Autoridad del aquelarre"
coven_rule_tradition_desc:0 "En esta comunidad el aquelarre tiene la última palabra en asuntos importantes."
culture_parameter_coven_rule:0 "Desheredar a personajes adultos que no sean brujos no tiene coste."
culture_parameter_coven_rule2:0 "Desbloquea el regimiento de cultistas."
culture_parameter_coven_rule3:0 "Los rasgos Bruja y Bruja verdadera obtienen beneficios adicionales."
cultists:0 "Cultistas"
cultists_flavor:0 "#F Seguidores demoníacos y grupos fanáticos liderados por brujas experimentadas.#!"
COVEN_NEEDED:0 "Debes tener un Aquelarre de Brujas."
teach_sorcery:0 "Enseñar hechicería"
MUST_BE_WITCH_CUSTOM:0 "El objetivo debe ser una bruja."
IS_SORCER_CUSTOM:0 "El objetivo ya practica magia."
teach_sorcery_desc:0 "Puedes ofrecer tu tutela y entrenamiento arcano."
teach_sorcery_custom_tooltip:0 "Ofrecer entrenamiento arcano."
teach_sorcery_custom_tooltip3:0 "Puedes obtener un anzuelo fuerte sobre el objetivo."
teach_sorcery_custom_tooltip2:0 "El objetivo tendrá la oportunidad de desbloquear el enfoque arcano en el futuro, dependiendo de su habilidad de aprendizaje."
ev3.10.title:0 "Entrenamiento arcano"
ev3.10.desc:0 "[actor.GetFullName] te ofrece entrenamiento en las artes arcanas. Tendrás la oportunidad de comprender la verdadera magia."
ev3.10.a:0 "¡Sí, enséñame!"
ev3.10.b:0 "No necesito tu «tutela»."
refuse_sorcery_training_modifier:0 "Oferta rechazada"
ev3.10.a_ct:0 "El entrenamiento arcano comenzará."
ev3.11.desc:0 "[disciple.GetFullName] aceptó tu generosa oferta. [disciple.GetSheHe|U] está listo para comenzar a aprender."
ev3.11.a:0 "Comencemos, mi discípulo."
sorcery_training_modifier:0 "Entrenamiento arcano"
ev3.12.desc:0 "¡[disciple.GetFullName] rechazó tu generosa oferta!"
ev3.12.a:0 "Necio..."
ev3.13.title:0 "Entrenamiento arcano: primera lección"
ev3.13.desc:0 "Ha llegado la hora de estudiar en serio. Debo decidir por dónde empezar."
ev3.13.a:0 "Primero, la teoría. Te enseñaré mis notas."
mage_guidance:0 "Guía del mago"
ev3.13.b:0 "Haremos algo práctico. Te enseñaré cómo funciona la magia."
ev3.13.b_ct:0 "El entrenamiento arcano obtiene #P progreso#!"
ev3.14.desc:0 "Mi maestro, [mteacher.GetFullName], me enseña sus notas. Pueden resultarme muy útiles."
ev3.14.a:0 "Lo leeré inmediatamente."
ev3.15.desc:0 "Hoy enseñaré a mi discípulo a lanzar hechizos menores. Creo que [disciple.GetSheHe] ya está preparado."
ev3.15.a:0 "Escúchame con atención, mi aprendiz..."
ev3.16.title:0 "Entrenamiento arcano: las reglas de la magia"
ev3.16.desc:0 "Hoy explicaré a mi alumno la regla más importante de la magia. [disciple.GetSheHe|U] debe saber que la verdadera magia siempre exige un precio."
ev3.16.a:0 "Recuerda esto, aprendiz: siempre hay un precio que pagar."
ev3.17.desc:0 "Hoy mi maestro, [mteacher.GetFullName], me ha hablado de las reglas más importantes de la magia. Parece que la magia necesita algún tipo de energía para funcionar. Pero mi maestro no me ha explicado cómo puedo obtenerla."
ev3.17.a:0 "Interesante."
ev3.18.title:0 "Entrenamiento arcano: lección práctica"
ev3.18.desc:0 "Debo introducir a mi alumno en los aspectos prácticos de la magia. Usaré..."
ev3.18.a:0 "...mi artefacto mágico."
ev3.18.b:0 "...la forma en que lanzo hechizos poderosos."
ev3.18.c:0 "...aún no lo sé, pero se me ocurrirá algo."
ev3.19.desc:0 "Mi maestro, [mteacher.GetFullName], me dio muchos consejos prácticos. Estoy progresando mucho."
ev3.19.a:0 "¡Puedo encender una antorcha con mi fuerza de voluntad!"
ev3.20.title:0 "Entrenamiento arcano: fin de los estudios"
ev3.20.desc:0 "Mi aprendiz, [disciple.GetFullName], ya ha visto todo cuanto podía enseñar a [disciple.GetHerHim]. A partir de ahora, el resto queda en sus manos."
ev3.20.a:0 "Buena suerte, mi alumno."
ev3.20.a_ct:0 "El entrenamiento se ha completado."
ev3.21.desc:0 "Hoy mi maestro, [mteacher.GetFullName], ha declarado que ya sé lo suficiente para continuar mi entrenamiento por mi cuenta. [mteacher.GetSheHe|U] dejará de ser mi maestro."
ev3.21.a:0 "Ahora toca comprobar qué he aprendido."
ev3.21.a_1:0 "Estás llevando a cabo experimentos mágicos."
ev3.21.a_2:0 "Tus experimentos han fallado."
ev3.21.a_ct:0 "No vas a convertirte en mago de la noche a la mañana..."
magic_epic_decision:0 "Realizar investigación mágica"
magic_epic_decision_desc:0 "Puedes escribir un tratado que reúna todo tu conocimiento de las artes arcanas, o intentar inventar un nuevo hechizo."
magic_epic_decision_tooltip:0 "Realizar investigación arcana"
magic_epic_decision_confirm:0 "Comenzar"
magic_epic_decision_ct:0 "Tu investigación comenzará."
ev3.22.title:0 "Investigación arcana"
ev3.22.desc:0 "Puedes poner por escrito tus conocimientos actuales o explorar nuevas disciplinas mágicas."
ev3.22.a:0 "Escribiré un tratado de magia."
ev3.22.b:0 "Intentaré desarrollar mi poder."
ev3.23.desc:0 "Primero, debes elegir un tema para tu libro."
ev3.23.a:0 "Rituales mágicos."
ev3.23.b:0 "Artefactos mágicos."
ev3.23.c:0 "Los no muertos."
ev3.23.d:0 "Conductos de poder."
ev3.23.e:0 "Demonios."
ev3.23.f:0 "[ROOT.Char.GetFaith.WitchGodName|U]."
ev3.24.desc:0 "Escribir avanza despacio. Necesito inspiración."
ev3.24.a:0 "Me obligaré a seguir trabajando."
ev3.24.b:0 "Me tomaré un descanso..."
ev3.24.b_ct:0 "El trabajo en el libro se ralentiza."
ev3.24.c:0 "La meditación debería ayudar."
ev3.25.desc:0 "He llegado al punto en que necesito realizar experimentos adicionales. Serán caros..."
ev3.25.a:0 "Puede que con eso baste."
ev3.25.b:0 "Lo haré bien."
ev3.25.c:0 "Es un gasto prioritario."
ev3.25.a_ct:0 "Tu obra obtiene #P progreso#!"
ev3.25.b_ct:0 "La calidad de tu obra #P mejora#!"
ev3.26.desc:0 "Ahora mismo trabajo en una parte crucial del libro. Necesito mantener la concentración."
ev3.26.a:0 "Puedo con ello."
ev3.26.a_1:0 "El trabajo va bien."
ev3.26.a_2:0 "El trabajo no va bien."
ev3.26.b:0 "Insuflaré un poco de magia en las páginas."
ev3.26.c:0 "Añadiré citas del Grimorio Negro."
ev3.27.desc:0 "Así pues, la conclusión final de mi libro será..."
ev3.27.a:0 "Algunas cosas no pueden explicarse."
ev3.27.b:0 "Los rituales se usan para robar poder a los dioses."
ev3.27.c:0 "Solo los dioses o los demonios pueden crear artefactos mágicos."
ev3.27.d:0 "Solo quienes comprenden los artefactos pueden utilizarlos."
ev3.27.e:0 "No existe forma de resucitar por completo a los muertos."
ev3.27.f:0 "Los no muertos son guerreros incansables."
ev3.27.f_ct:0 "Desbloqueas un regimiento de esqueletos."
skeletons:0 "Guerreros esqueléticos"
skeletons_flavor:0 "#F Este ejército no se preocupa por la paga.#!"
ev3.27.g:0 "Los humanos no fueron hechos para usar la magia."
ev3.27.h:0 "Con este poder, soy una especie de dios."
ev3.27.i:0 "No hay diferencias entre demonios y dioses. Son lo mismo."
ev3.27.j:0 "Puedes aprender mucho de los demonios."
ev3.27.k:0 "Nunca comprenderemos el gran plan de [ROOT.Char.GetFaith.WitchGodName]."
ev3.27.l:0 "¡Yo soy [ROOT.Char.GetFaith.WitchGodName]...!"
ev3.27.m:0 "[ROOT.Char.GetFaith.WitchGodName|U] no existe."
horned_nickname:0 "El Dios Cornudo"
ev3.28.title:0 "Investigación mágica: finalización del libro"
ev3.28.desc:0 "¡Por fin! El libro está terminado."
ev3.28.a:0 "Las generaciones venideras lo apreciarán."
mbook1_name:0 "Secretos de la magia"
mbook2_name:0 "Guía de rituales mágicos"
mbook1_desc:0 "El tomo describe ritos mágicos y aspectos prácticos de la brujería."
mbook3_name:0 "Guía de artefactos mágicos"
mbook4_name:0 "Artefactos encantados"
mbook3_desc:0 "El libro describe los artefactos mágicos y cómo usarlos."
mbook5_name:0 "Libro de los muertos"
mbook6_name:0 "Manual del sepulturero"
mbook5_desc:0 "Libro sobre necromancia y experimentos relacionados."
mbook7_name:0 "Fuente de poder"
mbook8_name:0 "Fluctuaciones mágicas y cómo utilizarlas"
mbook7_desc:0 "Libro sobre los poderes mágicos y el uso de hechicería avanzada."
mbook9_name:0 "Demonología"
mbook10_name:0 "Daemonium"
mbook9_desc:0 "Una guía sobre demonios y otros planos de la realidad."
mbook11_name:0 "El Cornudo"
mbook12_name:0 "El Dios de los dioses"
mbook13_name:0 "Llamada de [ROOT.Char.GetFaith.WitchGodName]"
mbook11_desc:0 "Introducción al misterio de [ROOT.Char.GetFaith.WitchGodName] y a los fundamentos de la brujería."
ev3.28.a_ct:0 "¡Tu trabajo está terminado!"
ev3.29.desc:0 "Primero debes elegir un tema para tu investigación. Crees que tienes una buena idea..."
ev3.29.a:0 "Alteración."
ev3.29.b:0 "Adivinación."
ev3.29.c:0 "Necromancia."
ev3.29.d:0 "Psiónica."
ev3.29.e:0 "Metamagia."
ev3.29.f:0 "Mejora del cuerpo."
ev3.29.g:0 "Otros mundos."
ev3.30.desc:0 "Tu investigación avanza lentamente, pero los resultados no son satisfactorios. Tendrás que probar otro enfoque."
ev3.30.a:0 "Empezaré de cero."
ev3.30.b:0 "Necesito concentrarme. ¡Lo resolveré!"
ev3.30.b_ct:0 "Tu investigación avanza."
ev3.30.c:0 "Pediré ayuda a otra bruja."
ev3.30.d:0 "Le dedicaré más tiempo."
ev3.31.desc:0 "Durante tu investigación has descubierto algo inesperado. Has aprendido a moldear el poder de una forma que puede usarse para la defensa. Al menos eso crees."
ev3.31.a:0 "No importa. Debo ceñirme al plan original."
ev3.31.b:0 "Entonces me centraré en la magia defensiva."
ev3.31.b_ct:0 "Cambias el tema de tu investigación."
ev3.32.desc:0 "Estás cada vez más cerca del gran avance; puedes sentirlo. Sin embargo, notas que aún te falta algo importante."
ev3.32.a:0 "Necesito más experimentos."
ev3.32.b:0 "¡Energía! Usaré un catalizador mágico como fuente de poder."
ev3.32.c:0 "Sé exactamente lo que debo hacer."
ev3.33.desc:0 "Tu investigación está a punto de concluir. Es hora del experimento final."
ev3.33.a:0 "¡Estoy listo!"
ev3.33.a_1:0 "¡Éxito!"
ev3.33.a_2:0 "Podría haber salido mejor..."
ev3.34.title:0 "Finalización de la investigación mágica"
ev3.34.desc:0 "Hecho. Lo he conseguido. Mi investigación ha concluido y mi poder ha aumentado."
ev3.34.desc2:0 "Así que... no he descubierto nada nuevo, pero he confirmado algunas teorías anteriores y ahora sé más."
ev3.34.desc3:0 "Has establecido una conexión mágica con un ser de otro mundo. No es un demonio, sino algo... distinto. La criatura se mostró amistosa y te reveló muchos secretos. Parece que el mundo es muy diferente de lo que creías."
ev3.34.z:0 "Un paso adelante..."
ev3.34.a:0 "La piedra en aire. El plomo en oro."
ev3.34.a2:0 "Plomo en oro..."
ev3.34.a2_ct:0 "Desbloquea la [decision|E] «Hechizo de transmutación»"
master_alteration_modifier:0 "Maestro de alteración"
magic_transmutation_decision:0 "Hechizo de transmutación mágica"
magic_transmutation_decision_desc:0 "Usa tu poder para convertir algo de plomo en oro puro."
magic_transmutation_decision_tooltip:0 "Hechizo de transmutación mágica"
magic_transmutation_decision_confirm:0 "Lanzar el hechizo"
ev3.34.b:0 "Por fin tendré sirvientes en los que puedo confiar."
master_necromancer_modifier:0 "Maestro Nigromante"
ev3.34.c:0 "«Maestro de marionetas, soy yo quien mueve tus hilos...»"
ev3.34.c_ct:0 "Tu hechizo de dominación mágica ahora puede cambiar la fe y la cultura del objetivo."
ev3.34.d:0 "Creo que ahora puedo llamarme mago."
ev3.34.d_ct:0 "Tienes un 50 % de probabilidad de restaurar tu saturación de poder después de lanzar un hechizo."
metamagic_title:0 "Metamagia"
master_metamagic_modifier:0 "Maestro de metamagia"
ev3.34.e:0 "¡Soy sobrehumano!"
upgraded_body_modifier:0 "Cuerpo mejorado"
ev3.34.f:0 "Mi hechizo defensivo está listo."
ev3.34.f_ct:0 "Obtienes acceso al Ritual de mayor protección."
master_defence_modifier:0 "Hechizos de protección"
magic_defence_decision:0 "Ritual de mayor protección"
magic_defence_decision_desc:0 "Lanzarás un poderoso hechizo protector que te resguardará de la magia hostil."
magic_defence_decision_tooltip:0 "Ritual de mayor protección"
magic_defence_decision_confirm:0 "Lanzar el hechizo"
ev3.34.g:0 "Aún me pregunto qué significa exactamente la palabra 'Blorg'."
contact_other_worlds_modifier:0 "Contacto con otros mundos"
ev3.34.g_ct:0 "Obtienes acceso al hechizo Viajar a otro mundo."
travel_to_stars_decision:0 "Viajar a otro mundo"
travel_to_stars_decision_desc:0 "Puedes abrir un portal mágico inestable a otro mundo. Probablemente será un viaje sin retorno, así que dejarás tu reino a tus herederos."
travel_to_stars_decision_tooltip:0 "Viajar a otro mundo"
travel_to_stars_decision_confirm:0 "Es hora de partir."
travel_to_stars_decision_ct:0 "Abandonarás este mundo para siempre."
ev2.61.f:0 "Puedo curar a [lliege.GetHerHim]."
ev2.81.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], acudió ante ti y empezó a realizar un ritual mágico. «Ahora estáis sano», dijo [cmage.GetSheHe]."
witch_familiar_modifier5:0 "Familiar alado"
call_witch_hunter_decision:0 "Llamar a un cazador de brujas"
call_witch_hunter_decision_desc:0 "Los rumores dicen que han aparecido brujas y practicantes de magia oscura en el reino. Deberías plantearte llamar a un especialista para solucionar el problema."
call_witch_hunter_decision_tooltip:0 "Llamar a un cazador de brujas"
call_witch_hunter_decision_confirm:0 "Enviar el aviso."
call_witch_hunter_decision_ct:0 "Un cazador de brujas llegará a tu corte y te ofrecerá sus servicios."
ev3.341.title:0 "El cazador de brujas"
ev3.341.desc:0 "Un cazador de brujas, o al menos alguien que afirma serlo, ha llegado a tu corte y se ha reunido contigo de inmediato. «He oído que tenéis un problema. Si también tenéis dinero, quizá pueda encontraros una solución», dijo [whunter.GetSheHe]."
ev3.341.a:0 "Por supuesto que pagaré."
ev3.341.b:0 "He cambiado de opinión. No te necesito."
ev3.35.desc:0 "Entonces tenemos un trato. Rastrear a una bruja puede llevar tiempo, pero podéis contar conmigo."
ev3.35.a:0 "Buena caza."
ev3.35.a_ct:0 "El cazador inicia su búsqueda."
ev3.35.b:0 "¿Puedo acompañarte?"
ev3.37.desc:0 "«No encontré nada. Puede que no haya brujas por aquí.»"
ev3.37.a:0 "Entiendo. Entonces ya no necesito tus servicios."
ev3.37.b:0 "Sigue buscando. Quizá se te haya pasado algo."
ev3.37.b_ct:0 "El cazador continúa buscando."
ev3.38.desc:0 "Tus sirvientes han encontrado el cuerpo esta mañana. Era tu cazador de brujas. No hay heridas visibles: ¡debieron matarlo con magia!"
ev3.38.desc2:0 "Tus sirvientes han encontrado el cuerpo esta mañana. Era tu cazador de brujas. El cadáver estaba completamente destrozado."
ev3.38.a:0 "Así que [whunter.GetSheHe] encontró brujas..."
ev3.39.desc:0 "Tu cazador ha regresado y parece que ha encontrado a la bruja. «¡Un servidor de demonios menos!», dijo [whunter.GetSheHe]. El cazador también te habló de su investigación y de cómo descubrió que [htarget.GetTitledFirstName] era una bruja."
ev3.39.a:0 "Gracias por tu servicio."
ev3.39.b:0 "Puede que haya más brujas. Sigue buscando."
ev3.40.desc:0 "Tu cazador ha regresado y ha traído un prisionero. «¿Queríais una bruja? Pues aquí la tenéis», dijo [whunter.GetSheHe]. El cazador también te habló de su investigación y de cómo descubrió que [htarget.GetTitledFirstName] era una bruja."
ev3.41.desc:0 "Veo que queréis aprender algo útil. Normalmente trabajo solo, pero no diré que no al señor de estas tierras."
ev3.41.a:0 "Excelente. Manos a la obra."
ev3.42.title:0 "Caza de brujas"
ev3.42.desc:0 "El cazador ha contactado con sus informantes. A partir de rumores turbios, pasáis todo el día vigilando una casa, disfrazados de mendigos. No esperabas que la caza de brujas fuese tan aburrida."
ev3.42.a:0 "Aguantaré... de algún modo."
ev3.42.b:0 "Puedo soportarlo."
ev3.42.c:0 "..."
ev3.42.d:0 "Suficiente. Puedes hacerlo sin mí."
ev3.42.d_ct:0 "El cazador continúa buscando... sin tu ayuda."
ev3.43.desc:0 "Descubrís que la casa que vigilabais estaba abandonada. Sin embargo, el cazador no parece decepcionado. [whunter.GetSheHe|U] registra el edificio a fondo, pero no encuentra nada. «Aún nos quedan algunos lugares que comprobar», dijo [whunter.GetSheHe]."
ev3.43.a:0 "Si tú lo dices..."
ev3.43.a_ct:0 "Continuáis la búsqueda."
ev3.43.b:0 "Puedes encargarte de esto por tu cuenta."
ev3.44.desc:0 "Al cabo de unos días habéis localizado la probable sede de las brujas. La cuestión es cómo intentaréis interceptarlas."
ev3.44.a:0 "Las reduciremos por la fuerza."
ev3.44.b:0 "Las convenceré para que se rindan."
ev3.44.c:0 "Usaré a mis caballeros."
ev3.44.d:0 "Usaré a mis agentes."
ev3.44.a_1:0 "Las brujas han sido sometidas."
ev3.44.a_1_ct:0 "Encierras a las brujas en las mazmorras."
ev3.44.a_2:0 "Las brujas han escapado."
ev3.44.a_2_ct:0 "Las brujas desaparecen sin dejar rastro."
ev3.45.desc:0 "«A veces falla», dijo el cazador de brujas. «Aunque creo que podré hacerlo sin vuestra ayuda.»"
ev3.45.a:0 "Que así sea..."
ev3.46.desc:0 "La líder del aquelarre de brujas está en tu mazmorra, pero aún no es momento de celebrar. Puede haber más brujas."
ev3.46.a:0 "Lo hicimos bien. Continúa sin mí."
ev3.46.b:0 "¿Crees que podría ser un cazador?"
ev3.47.desc:0 "«Combatir brujas es una vocación. Sin embargo, con vuestros recursos os resultará más fácil que a mí. Puedo enseñaros algunas cosas.»"
ev3.47.a:0 "¡En realidad, siento esa vocación!"
ev3.47.b:0 "Tengo otras cosas en mente. Sigue buscando a las brujas."
novice_witch_hunter_modifier:0 "Cazador de brujas novato"
ev3.48.title:0 "Senda del cazador"
ev3.48.desc:0 "Un cazador lleva un tiempo dándome lecciones sobre brujas. Hoy he aprendido a protegerme de sus maldiciones."
ev3.48.a:0 "¡Información de valor incalculable!"
ev3.49.desc:0 "Hoy [whunter.GetTitledFirstName] me ha dicho que necesito algunas lecciones prácticas para combatir brujas."
ev3.49.a:0 "Sí, practiquemos esgrima."
ev3.49.b:0 "Háblame más de los hábitos de las brujas."
ev3.50.desc:0 "[whunter.GetTitledFirstName] me ha enseñado hoy algunas formas de rastrear brujas. He aprendido una técnica de meditación que me permite percibir la magia de la zona."
ev3.50.a:0 "¡Brujas, voy a por vosotras!"
ev3.51.a:0 "Las brujas tienen que ser responsables de esto..."
ev3.51.a_ct:0 "Empiezas a rastrear a las brujas."
ev3.51.b:0 "Será mejor que me mantenga alejado de esto."
ev3.52.desc:0 "Has reunido muchas pistas sobre la muerte del cazador. Ahora debes atar todos los cabos."
ev3.52.a:0 "Es hora de la fase final."
ev3.52.b:0 "Creo que ya lo sé todo."
ev3.52.c:0 "¡Alguien tiene que saber la verdad!"
ev3.52.d:0 "Será mejor dejarlo pasar."
ev3.52.a_1:0 "Has tenido éxito."
ev3.52.a_2:0 "Has fracasado."
ev3.52.a_1_ct:0 "Encuentras a la bruja."
ev3.52.a_2_ct:0 "El rastro no te lleva a ninguna parte."
ev3.53.desc:0 "Las pruebas demuestran que [wwwitch.GetTitledFirstName] ha cometido un asesinato y practica brujería. Ordenaste arrestar a [wwwitch.GetHerHim] de inmediato."
ev3.53.a:0 "Creo que ahora puedo llamarme cazador de brujas."
rival_magic_modifier:0 "Brujo hostil"
not_accepted_witchcraft_faith_desc:0 "Tu fe no acepta la brujería."
TRUE_WITCH_NEEDED:0 "Debes ser una bruja verdadera."
secret_knowledge_modifier:0 "Conocimiento secreto"
witch_trial:0 "Juicio por brujería"
witch_trial_desc:0 "Llevar a cabo un juicio por brujería"
witch_trial_ct:0 "Comenzar el juicio por brujería."
witch_trial_ct2:0 "Puede sufrir tortura, morir... o incluso ser absuelta."
witch_trial_ct3:0 "Tienes la oportunidad de ganar o perder prestigio o piedad."
ev3.54.desc:0 "La persona acusada está lista para el interrogatorio. ¿Por dónde empezarás?"
ev3.54.desc2:0 "«¡No soy culpable, por favor!», suplica entre sollozos."
ev3.54.desc3:0 "La persona acusada se limita a observarte en silencio."
ev3.54.a:0 "Entonces, [accused.GetTitledFirstName], ¿eres una bruja?"
ev3.54.b:0 "Primero mostraré mis instrumentos a [accused.GetHerHim]."
ev3.54.c:0 "No perdamos el tiempo."
ev3.54.c_ct:0 "Comienzas la tortura."
ev3.55.desc:0 "Tu perseguidor llega al calabozo y comienza el interrogatorio. «¿Eres una bruja?», pregunta [whunter.GetSheHe]."
ev3.55.a:0 "¡No, no lo soy!"
ev3.55.b:0 "De todos modos, no lo entenderás."
ev3.55.c:0 "¡Sí, lo soy!"
ev3.56.desc:0 "«¡No, no lo soy!», dijo [accused.GetSheHe] con desesperación. «¡No soy culpable!»"
ev3.56.desc2:0 "«De todos modos, no lo entenderás», dijo [accused.GetSheHe]. Lo tomas como una confesión de culpabilidad."
ev3.56.desc3:0 "«¡Sí, lo soy, gusano patético!», dijo [accused.GetSheHe]."
ev3.56.desc4:0 "«¡No soy una bruja! ¿Cuántas veces tengo que repetirlo?»"
ev3.56.desc5:0 "«¡No soy una bruja, por favor, creedme!»"
ev3.56.desc6:0 "«¡No he hecho nada malo, solo intento ser buena persona!»"
ev3.56.desc7:0 "«Que así sea. Quizá sí sea una bruja.»"
ev3.56.desc8:0 "«¡Sí, soy una devota servidora de [accused.Char.GetFaith.WitchGodName]!»"
ev3.56.desc9:0 "«¡Parad, os lo ruego... no he hecho nada malo!»"
ev3.56.desc10:0 "«¡Espera! No sé nada, ¡pero haré cualquier cosa!»"
ev3.56.desc11:0 "«¡Espera! ¡Soy una bruja! ¡Lo confieso!»"
ev3.56.desc12:0 "«¡Espera! ¡Puedo contarte algo!»"
ev3.56.a:0 "Insinuaré que tengo pruebas de su culpabilidad."
ev3.56.b:0 "Le presionaré."
ev3.56.c:0 "¡Hora de la tortura!"
ev3.56.d:0 "Entonces eres inocente."
ev3.56.d_ct:0 "El juicio ha terminado."
ev3.56.e:0 "Revela a los miembros de tu aquelarre, bruja."
ev3.56.f:0 "Creo que ya basta. ¡Prended la pira!"
ev3.56.g:0 "No juegues conmigo. ¡Confiesa lo que eres!"
ev3.56.h:0 "Por ahora te quedarás en mis mazmorras."
ev3.57.desc:0 "[whunter.GetTitledFirstName] afirma que [whunter.GetSheHe] tiene pruebas de tu culpabilidad. «Confesar puede atenuar la condena», dijo [whunter.GetSheHe]."
ev3.57.a:0 "¡No soy una bruja! ¿Cuántas veces tengo que repetirlo?"
ev3.57.b:0 "¡No soy una bruja, por favor, creedme!"
ev3.57.c:0 "¡No he hecho nada malo, solo intento ser buena persona!"
ev3.57.d:0 "Que así sea. Quizá sí sea una bruja."
ev3.57.e:0 "¡Sí, soy una devota servidora de [ROOT.Char.GetFaith.WitchGodName]!"
ev3.58.desc:0 "El cazador de brujas dijo que, por ahora, tu lugar está en la mazmorra. Tu juicio ha sido aplazado."
ev3.58.a:0 "Que así sea..."
ev3.58.b:0 "¡No soy culpable!"
ev3.59.desc:0 "En completo silencio, tu perseguidor te mostró los instrumentos de tortura. Tu imaginación evoca imágenes macabras de lo que podría ocurrir."
ev3.60.desc:0 "Preparas los instrumentos y te arremangas."
ev3.60.a:0 "Seré suave."
ev3.60.b:0 "¡No te muevas mientras trabajo!"
ev3.61.desc:0 "¡Ese loco me ha torturado! De pronto comprendí que la persona que gritaba con tanta fuerza era yo... Entonces vi a [whunter.GetSheHe] coger otra hoja."
ev3.61.desc2:0 "«Revela a los miembros de tu aquelarre, bruja», dijo el cazador con firmeza."
ev3.61.a:0 "Para, te lo ruego..."
ev3.61.b:0 "¡Espera! No sé nada, ¡pero haré cualquier cosa!"
ev3.61.c:0 "¡Espera! Soy una bruja..."
ev3.61.d:0 "¡Espera! ¡Puedo contarte algo!"
ev3.62.desc:0 "La pira arde y contemplas el resultado de tu obra."
ev3.62.a:0 "Otro día de duro trabajo."
ev3.62.b:0 "No estoy seguro de que [accused.GetSheHe] fuera realmente una bruja."
witch_hunting_decision:0 "Iniciar caza de brujas"
witch_hunting_decision_desc:0 "Puedes usar tus habilidades para rastrear brujas cercanas."
witch_hunting_decision_tooltip:0 "Iniciar caza de brujas"
witch_hunting_decision_confirm:0 "Iniciar una caza de brujas"
witch_hunting_decision_ct:0 "Iniciarás una caza de brujas."
ev3.63.desc:0 "Las brujas necesitan ingredientes mágicos para llevar a cabo sus rituales. Si encuentras esos ingredientes, también podrás encontrar a las brujas."
ev3.63.a:0 "Buscaré gastos sospechosos."
ev3.63.b:0 "Sé exactamente qué buscar."
ev3.63.a_1:0 "Encuentras pistas."
ev3.63.a_1_ct:0 "Tienes un sospechoso."
ev3.63.a_2_ct:0 "No encuentras nada."
ev3.64.desc:0 "Todo indica que [htarget.GetTitledFirstName] es una bruja."
ev3.64.a:0 "Apresaré al sospechoso."
ev3.64.b:0 "Por ahora, solo observaré."
ev3.64.c:0 "Tenderé una trampa y acabaré con [htarget.GetHerHim] personalmente."
ev3.65.desc:0 "Las brujas pueden estar en cualquier parte. Debo usar todas mis habilidades para sacarlas a la luz."
ev3.65.b:0 "Recompensaré cualquier información sobre brujas."
ev3.65.c:0 "Nada puede ocultarse de mí."
ev3.65.d:0 "Usaré mis contactos familiares."
witchhunter_weapons_modifier:0 "Armamento del cazador de brujas"
moloch_name:0 "Moloch"
ev3.66.desc:0 "Una bestia horrible aparece en el círculo de invocación. La criatura te mira y golpea las runas con una fuerza increíble, sin más efecto que una nube de chispas."
ev3.66.a:0 "Así que, demonio, estás obligado a obedecer mis órdenes."
ev3.67.desc:0 "«¡Destruir... Destruir... DESTRUIR!», ruge mientras golpea las runas y hace temblar toda la torre. Instintivamente das un paso atrás."
ev3.67.a:0 "¡Te invoqué, obedéceme!"
ev3.68.desc:0 "El demonio se abalanza contra las runas y ves que quizá no puedan resistir su fuerza. ¡Es poderoso!"
ev3.68.a:0 "Ejem... ¡desaparece ahora mismo!"
ev3.69.desc:0 "El demonio ignora tu orden; está claro que has perdido el control del hechizo de invocación. Las runas empiezan a romperse..."
ev3.69.a:0 "¡Bien, te liberaré!"
ev3.69.b:0 "Usaré hechizos antiguos para desterrarlo..."
ev3.69.c:0 "Usaré el Grimorio Negro para desterrarlo..."
ev3.69.d:0 "Lo mataré por medios convencionales."
ev3.69.a_ct:0 "Moloch está libre"
ev3.69.b_ct1:0 "Has enviado a Moloch de vuelta."
ev3.70.desc:0 "El demonio te lanzó contra la pared con una fuerza increíble. «¡Matar! ¡Matar! ¡MATAR!» Pero, en lugar de matarte, bajó a las estancias."
ev3.70.a:0 "No... puedo... moverme..."
ev3.70.a_ct:0 "Moloch está masacrando tu corte."
ev3.70.a_ct2:0 "Moloch viajará por el mundo y causará estragos."
ev3.71.title:0 "Se acerca Moloch"
full_protection_decision:0 "Doblar la guardia"
full_protection_decision_desc:0 "En respuesta a la amenaza, puedes reforzar la guardia y asignar fondos adicionales a la protección."
full_protection_decision_tooltip:0 "Doblar la guardia"
full_protection_decision_confirm:0 "Asignar el doble de guardias"
double_guards_modifier:0 "Guardia doble"
ev3.72.title:0 "Ser mago de la corte"
ev3.72.desc:0 "Ser mago de la corte conlleva responsabilidades y deberes. Debes decidir cómo utilizar tus capacidades."
ev3.72.a:0 "Primero demostraré que soy digno."
ev3.72.b:0 "Infundiré miedo."
ev3.72.c:0 "Me centraré en aprender."
ev3.72.d:0 "Buscaré la magia verdadera."
ev3.72.d_ct:0 "Puedes obtener una pista sobre un artefacto mágico."
ev3.73.desc:0 "Tu investigación ha revelado que [mmmowner.GetTitledFirstName] posee un artefacto mágico."
ev3.73.b:0 "Ese objeto debería ser mío. Lo demostraré."
ev3.73.b_1:0 "Has hecho valer tus reclamaciones."
archmage2:0 "Mago legendario"
trait_archmage2:0 "Mago legendario"
trait_archmage2_desc:0 "Una leyenda viviente."
merlins_name:0 "Merlín"
rival_random_m1:0 "Rivalidad mágica"
friend_random_m1:0 "Intereses comunes"
lover_random_m1:0 "Seducido"
