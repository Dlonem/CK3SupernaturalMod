l_spanish:
 rule_magic_arts:0 "Brujería: artefactos mágicos"
 setting_normal_magic_arts:0 "Distribución aleatoria"
 setting_normal_magic_arts_desc:0 "La distribución de los artefactos mágicos es completamente aleatoria."
 setting_user_magic_arts:0 "Garantizado para el jugador"
 setting_user_magic_arts_desc:0 "El jugador recibirá un artefacto mágico al comienzo de la partida."
 rule_magic_whunters:0 "Brujería: actividad de los cazadores de brujas"
 setting_normal_whunters:0 "Normal"
 setting_normal_whunters_desc:0 "Los cazadores de brujas y el cazador de brujas principal pueden aparecer en cualquier momento."
 setting_low_whunters:0 "Baja"
 setting_low_whunters_desc:0 "Solo pueden aparecer cazadores de brujas comunes."
 rule_magic_bael:0 "Brujería: Bael (demonio)"
 setting_normal_magic_bael:0 "Puede aparecer"
 setting_normal_magic_bael_desc:0 "Es probable que Bael aparezca si acumulas demasiado poder."
 setting_never_magic_bael:0 "No puede aparecer"
 setting_never_magic_bael_desc:0 "Bael permanecerá en el Infierno..."
 press_court_mage_decision:0 "Presionar al mago de la corte"
 press_court_mage_decision_toast:0 "Presionar al mago de la corte"
 press_court_mage_decision_desc:0 "Ha llegado el momento: tu mago de la corte debe demostrar su utilidad. Que su magia sirva de algún modo a tu señorío."
 press_court_mage_decision_tooltip:0 "Presiona a tu mago de la corte para que te proporcione ayuda."
 press_court_mage_decision_confirm:0 "Pedir apoyo mágico"
 press_court_mage_decision_ct:0 "Tu mago de la corte atenderá tu llamada."
 ev2.61.title:0 "Órdenes del señor"
 ev2.61.desc:0 "Tu señor, [lliege.GetTitledFirstName], te exige una prueba de tus habilidades mágicas. «Debes hacer algo útil por nuestro señorío», dijo [lliege.GetSheHe]."
 ev2.61.a:0 "Le daré algo de oro a [lliege.GetHerHim]..."
 ev2.61.b:0 "Le mostraré mi investigación a [lliege.GetHerHim]."
 court_mage_support:0 "Apoyo de un mago de la corte"
 ev2.61.c:0 "Maldeciré a su enemigo."
 ev2.61.d:0 "¡Destruiré a su enemigo!"
 ev2.61.d_ct:0 "Se lanzará una poderosa maldición"
 ev2.61.e:0 "Mi magia requiere tiempo; no puedo ayudarte ahora."
 lazy_court_mage_modifier:0 "Mago de la corte holgazán"
 ev2.61.e_ct:0 "Podrían destituirte"
 ev2.62.title:0 "Respuesta del mago de la corte"
 ev2.62.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], acude a ti con noticias. «Mi señor, he conseguido convertir algo de plomo en oro. Aceptadlo como mi regalo.»"
 ev2.62.a:0 "¡Buen trabajo, mago mío!"
 ev2.63.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], acude a ti con noticias. «Mi señor, he lanzado una maldición sobre vuestro enemigo, [potential_tar.GetTitledFirstName]. Espero que lo toméis como prueba de mi lealtad.»"
 ev2.63.a_ct:0 "[potential_tar.GetTitledFirstName] ha recibido una maldición... al menos en teoría"
 ev2.64.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], acude a ti con un montón de manuscritos y pergaminos. «No puedo mostraros ningún truco mágico, pero quizá mis conocimientos os ayuden a alcanzar vuestros objetivos.»"
 ev2.64.a:0 "Interesante."
 ev2.65.desc:0 "Tu mago de la corte, [cmage.GetTitledFirstName], se presenta ante ti y anuncia: «Mi señor, mi magia requiere tiempo; no puedo ayudaros ahora.»"
 ev2.65.a:0 "Entonces te daré más tiempo."
 ev2.65.b:0 "No sirves para nada."
 ev2.65.c:0 "Te utilizaré de todos modos."
 ev7.0.d:0 "¡Entonces sacrificaré a mis prisioneros, a todos ellos!"
 singularity_name:0 "Singularidad Antigua"
 singularity_desc:0 "Dispositivo antiguo de propósito desconocido. Posee un aura mágica muy intensa, tanto que incluso una persona corriente puede percibirla."
 ev96.1.title:0 "Dispositivo misterioso"
 ev96.1.desc:0 "Al volver a tus aposentos, ves un objeto extraño sobre la mesa. ¿Quién lo ha dejado ahí? Y, sobre todo, ¿qué es exactamente?"
 ev96.1.a:0 "Debería investigarlo."
 study_singularity_decision:0 "Estudiar la Singularidad Antigua"
 study_singularity_decision_toast:0 "Estudiar la Singularidad Antigua"
 study_singularity_decision_desc:0 "La Singularidad Antigua es el dispositivo más sofisticado que has visto jamás. Debes descubrir cuál es su verdadero propósito."
 study_singularity_decision_tooltip:0 "Estudia la Singularidad Antigua."
 study_singularity_decision_confirm:0 "Examinar el dispositivo"
 IS_SCHOLAR_MAGE_CUSTOM:0 "Necesitas tener el rasgo de mago, erudito o hacedor de milagros"
 ev2.66.title:0 "Singularidad Antigua"
 ev2.66.desc:0 "El artefacto está formado por numerosas piezas mecánicas; algunas cambian lentamente de posición. Puedes intentar manipularlas o examinar las runas de la carcasa."
 ev2.66.a:0 "Improvisaré."
 ev2.66.b:0 "Primero revisaré las runas."
 ev2.67.desc:0 "Tus acciones han dado resultado y la Singularidad Antigua se ha activado. De algún modo... el artefacto aumenta claramente tu capacidad mental, aunque su radiación mágica podría resultar perjudicial a largo plazo. Parece que algo se ha atascado y no hay forma de modificar la configuración del dispositivo."
 ev2.67.a:0 "Aun así, podría ser útil."
 ev2.68.desc:0 "Las runas son inscripciones en una lengua antigua: hechizos y advertencias de naturaleza mágica. Puedes intentar descifrarlas."
 ev2.68.a:0 "Empezaré la traducción."
 ev2.68.a_ct:0 "Tus estudios continuarán"
 ev2.68.b:0 "Esto es una pérdida de tiempo."
 ev2.68.b_ct:0 "Tus estudios se interrumpirán"
 ev2.69.desc:0 "Has conseguido traducir algunas de las runas. Parecen una especie de manual de instrucciones. Sin embargo, aún no sabes para qué puede utilizarse el dispositivo."
 ev2.69.a:0 "Basta. Ya encontraré una aplicación para estas runas."
 ev2.69.b:0 "Continuaré con mi trabajo."
 ev2.70.desc:0 "Crees que ya puedes utilizar el dispositivo. Sospechas que podría servir para procesar poder mágico."
 ev2.70.a:0 "¡Entonces ha llegado la hora de experimentar!"
 ev2.70.a_ct1:0 "Estás más cerca de comprender la verdadera naturaleza del artefacto"
 ev2.70.a2:0 "La Singularidad Antigua se ha activado."
 ev2.70.a3:0 "La Singularidad Antigua se ha activado... más o menos."
 ev2.70.a_ct3:0 "Éxito parcial..."
 ev2.72.desc:0 "El extraño artefacto parece estar ahora en estado latente. Quizá investigarlo te ayude a comprender su naturaleza."
 ev2.72.a:0 "Quizá..."
 ev2.73.desc:0 "Crees haber averiguado por fin para qué sirve el artefacto. Emite una radiación mágica letal; tal vez los antiguos magos lo usaban como arma."
 ev2.73.a:0 "¡Ahora seré invencible!"
 ev2.73.b:0 "¡También puedo usar este poder para transformar mi cuerpo!"
 ev2.73B.desc:0 "Crees haber averiguado por fin para qué sirve el artefacto. Emite una radiación mágica letal; tal vez los antiguos magos lo usaban como arma. Pero hay algo más: no solo resulta útil en el campo de batalla. Actúa a distancias inmensas y puede alcanzar cualquier lugar del mundo."
 NOT_TITLE_TIER_TRIGGER:0 "Solo los condados pueden ser objetivos válidos"
 use_singularity_ct:0 "La mayoría de los personajes de la provincia seleccionada morirán"
 use_singularity_ct2:0 "Perderás el estado de saturación de poder"
 use_singularity:0 "Usar la Singularidad Antigua"
 use_singularity_desc:0 "Usa la Singularidad Antigua como un arma terrorífica"
 magical_radiation_modifier:0 "Radiación mágica"
 ev2.73.a_ct:0 "Desbloquea la [interaction|E] Usar la Singularidad Antigua"
 ev2.74.title:0 "Gran calamidad"
 ev2.74.desc:0 "Algo terrible ha ocurrido en [ttile.GetName]. Una explosión enorme ha sacudido todas las tierras cercanas. Muchas personas han muerto y el resto están heridas o enfermas. Dios ha abandonado este lugar."
 ev2.74.a:0 "Es aterrador."
 ev2.74.b:0 "¿Qué clase de poder podría hacer algo así?"
 ev2.74.c:0 "¡Poder ilimitado!"
 ev2.75.title:0 "Fuente del verdadero poder"
 ev2.75.desc:0 "Uno de los invitados de tu corte parece ser un místico experimentado. [wwitch.GetSheHe|U] asegura que puede venderte información sobre un objeto mágico."
 ev2.75.a:0 "Que hable [wwitch.GetSheHe]; pagaré."
 ev2.75.b:0 "Otro farsante..."
 ev2.75.a_ct:0 "Podrás conocer la ubicación de un artefacto mágico"
 ev2.76.desc:0 "Según las palabras de tu invitado, [mowner.GetTitledFirstName] posee un artefacto mágico."
 ev2.76.a:0 "Debería reunirme con [mowner.GetHerHim]..."
 artifact_hunter:0 "Cazador de artefactos"
 ev2.78.title:0 "Proyección de poder"
 ev2.78.desc:0 "[hholder.GetTitledFirstName] ha venido a rendirse. «No podemos oponernos a semejante poder», dijo [hholder.GetSheHe]."
 ev2.78.a:0 "Así que, después de todo, no eres idiota."
 dead_ring:0 "Anillo de la Muerte"
 dead_ring_desc:0 "Forjado en el Infierno, instrumento de muerte y destrucción, oscuro reflejo del Anillo de la Vida."
 astaroth_name:0 "Astaroth"
 astaroth_nickname:0 "el Sabueso del Infierno"
 astaroth_nickname_desc:0 "el Sabueso del Infierno"
