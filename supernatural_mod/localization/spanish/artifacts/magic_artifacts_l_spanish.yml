l_spanish:
 immortality_ring:0 "Anillo de la Eternidad"
 immortality_ring_desc:0 "De origen desconocido; se sabe muy poco de él, salvo que prolonga la vida de forma antinatural y protege contra la magia hostil."
 magic_catalyst:0 "Catalizador mágico"
 magic_catalyst_desc:0 "Se rumorea que esta piedra cayó del cielo hace muchos siglos. Permite a su portador atravesar runas protectoras y la protección de los demonios."
 magic_catalyst_tooltip:0 "Puedes lanzar hechizos aunque el objetivo tenga protección mágica, salvo la protección del Anillo de la Vida."
