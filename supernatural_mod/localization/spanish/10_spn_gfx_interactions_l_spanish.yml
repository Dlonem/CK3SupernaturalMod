l_spanish:
# Desactivar visualización de musculatura de SPN
spn_disable_muscle_display:0 "Desactivar definición muscular"
spn_disable_muscle_display_interaction_desc:0 "Oculta la definición muscular visual derivada de la destreza."
spn_msg_tooltip_disable_muscle_display:0 "[THIS.GetCharacter.GetFirstName] ya no mostrará definición muscular derivada de la destreza."

# Activar visualización de musculatura de SPN
spn_enable_muscle_display:0 "Activar definición muscular"
spn_enable_muscle_display_interaction_desc:0 "Muestra la definición muscular visual derivada de la destreza."
spn_msg_tooltip_enable_muscle_display:0 "[THIS.GetCharacter.GetFirstName] mostrará definición muscular derivada de la destreza."

# Desactivar visualización del peso de SPN
spn_disable_weight_display:0 "Desactivar visibilidad del peso"
spn_disable_weight_display_interaction_desc:0 "Oculta los cambios visuales de peso derivados de la destreza."
spn_msg_tooltip_disable_weight_display:0 "[THIS.GetCharacter.GetFirstName] ya no mostrará cambios visuales de peso derivados de la destreza."

# Activar visualización del peso de SPN
spn_enable_weight_display:0 "Activar visibilidad del peso"
spn_enable_weight_display_interaction_desc:0 "Muestra los cambios visuales de peso derivados de la destreza."
spn_msg_tooltip_enable_weight_display:0 "[THIS.GetCharacter.GetFirstName] mostrará cambios visuales de peso derivados de la destreza."

# Establecer edad aparente
spn_assign_visual_age:0 "Establecer edad aparente"
spn_assign_visual_age_interaction_desc:0 "Fija la edad que aparenta visualmente este personaje."
spn_msg_tooltip_assign_visual_age:0 "[THIS.GetCharacter.GetFirstName] aparentará la edad que le asignes."

spn_miscellaneous_events.0001.t:0 "Establecer edad aparente"
spn_miscellaneous_events.0001has.desc:0 "La edad aparente de [recipient.GetFirstName] es de [recipient.MakeScope.Var('spn_current_visual_age').GetValue]."
spn_miscellaneous_events.0001nohas.desc:0 "No se está registrando actualmente la edad aparente de [recipient.GetFirstName]. Usa la opción «Inicializar» para empezar a registrarla."
spn_miscellaneous_events.0001.a:0 "+1"
spn_miscellaneous_events.0001.a.tt:0 "Sumar 1 a la edad aparente."
spn_miscellaneous_events.0001.b:0 "+5"
spn_miscellaneous_events.0001.b.tt:0 "Sumar 5 a la edad aparente."
spn_miscellaneous_events.0001.c:0 "+10"
spn_miscellaneous_events.0001.c.tt:0 "Sumar 10 a la edad aparente."
spn_miscellaneous_events.0001.d:0 "-1"
spn_miscellaneous_events.0001.d.tt:0 "Restar 1 a la edad aparente."
spn_miscellaneous_events.0001.e:0 "-5"
spn_miscellaneous_events.0001.e.tt:0 "Restar 5 a la edad aparente."
spn_miscellaneous_events.0001.f:0 "-10"
spn_miscellaneous_events.0001.f.tt:0 "Restar 10 a la edad aparente."
spn_miscellaneous_events.0001.g:0 "Inicializar"
spn_miscellaneous_events.0001.g.tt:0 "Inicializa a este personaje para empezar a registrar su edad aparente. Solo debería aparecer en partidas guardadas antiguas en las que no se configuró al convertirlo en inmortal."
spn_miscellaneous_events.0001.h:0 "Listo"
spn_miscellaneous_events.0001.h.tt:0 "Termina el ajuste de la edad aparente del personaje."
spn_miscellaneous_events.0001.i:0 "+20"
spn_miscellaneous_events.0001.i.tt:0 "Sumar 20 a la edad aparente."
spn_miscellaneous_events.0001.j:0 "-20"
spn_miscellaneous_events.0001.j.tt:0 "Restar 20 a la edad aparente."
spn_miscellaneous_events.0001.k:0 "Dejar de sobrescribir"
spn_miscellaneous_events.0001.k.tt:0 "Deja de sobrescribir cualquier envejecimiento automático. El envejecimiento automático continuará desde la edad aparente configurada en ese momento."
