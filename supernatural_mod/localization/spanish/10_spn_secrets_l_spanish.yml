# El maestro de espías descubre a un vampiro
spn_spymaster_task.0001.t:0 "Espionaje: vampirismo"
spn_spymaster_task.0001.spn_secret_vampire.shared:0 "\n\nParece que [secret_holder.GetSheHe] también es un vampiro. Cuántas cosas habrá vivido... Ojalá pudiéramos hablar abiertamente de nuestra inmortalidad."
spn_spymaster_task.0001.spn_secret_vampire:0 "\n\nHay indicios de que [secret_holder.GetSheHe] podría estar bebiendo la sangre de otros. ¿Qué otra explicación podría haber para algo así? ¡Tiene que ser un vampiro!"
spn_spymaster_task.0001.a:0 "¿Qué hará esa criatura?"

# El maestro de espías descubre a un licántropo
spn_spymaster_task.0002.t:0 "Espionaje: licantropía"
spn_spymaster_task.0002.spn_secret_werewolf.shared:0 "\n\nParece que [secret_holder.GetSheHe] también es un hombre lobo. Cuántas cosas habrá vivido... Ojalá pudiéramos hablar abiertamente de nuestra inmortalidad."
spn_spymaster_task.0002.spn_secret_werewolf:0 "\n\nHay indicios de que [secret_holder.GetSheHe] podría transformarse en una criatura semejante a un lobo. ¿Qué otra explicación podría haber para algo así? ¡Tiene que ser un hombre lobo!"
spn_spymaster_task.0002.a:0 "¿Qué hará esa criatura?"

# El maestro de espías descubre a un híbrido
spn_spymaster_task.0003.t:0 "Espionaje: híbrido"
spn_spymaster_task.0003.spn_secret_hybrid.shared:0 "\n\nParece que [secret_holder.GetSheHe] también es un híbrido. Cuántas cosas habrá vivido... Ojalá pudiéramos hablar abiertamente de nuestra inmortalidad."
spn_spymaster_task.0003.spn_secret_hybrid:0 "\n\nHay indicios de que [secret_holder.GetSheHe] podría estar bebiendo sangre y transformándose en algún tipo de bestia. ¿Qué otra explicación podría haber para algo así? ¡Tiene que ser un híbrido!"
spn_spymaster_task.0003.a:0 "¿Qué hará esa criatura?"

# El maestro de espías descubre a un cazador
spn_spymaster_task.0004.t:0 "Espionaje: cazador"
spn_spymaster_task.0004.spn_secret_hunter.shared:0 "\n\nParece que [secret_holder.GetSheHe] también es un cazador. Cuántas hazañas habrá presenciado... Ojalá pudiéramos hablar abiertamente de nuestras cacerías."
spn_spymaster_task.0004.spn_secret_hunter:0 "\n\nHay indicios de que [secret_holder.GetSheHe] podría estar dando caza a criaturas sobrenaturales. ¿Qué otra explicación podría haber para algo así? ¡Tiene que ser un cazador de monstruos!"
spn_spymaster_task.0004.a:0 "¿Qué hará ese cazador de monstruos?"
