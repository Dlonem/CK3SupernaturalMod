# Eventos de secreto: vampiro
spn_secret_exposed_notification_effect_message_vampire:0 "¡[secret_exposer.GetTitledFirstName] ha revelado el vampirismo de [owner.GetTitledFirstName]!"
spn_secret_exposed_notification_effect_message_vampire.i_exposed:0 "¡He revelado el vampirismo de [owner.GetTitledFirstName]!"

spn_secrets.0001.t:0 "Secreto revelado"
spn_secrets.0001.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me ha denunciado como una abominación impía. Ahora todos me señalan como vampiro y enemigo de [ROOT.Char.GetFaith.HighGodName]."
spn_secrets.0001.a:0 "¿Acaso no ven el poder que ostento?"

spn_secrets.0002.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ha acusado a [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de ser un vampiro. ¡Ese vil [owner.GetWomanMan] es una criatura abyecta! Sin duda es una creación de [ROOT.Char.GetFaith.DevilName]. ¡Que [ROOT.Char.GetFaith.HighGodName|U] nos libre de semejantes monstruos!"
spn_secrets.0002.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ha acusado públicamente a [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] de vampirismo."
spn_secrets.0002.positive_2.desc:0 "Ese mentecato de [secret_exposer.GetWomanMan] va pregonando por todas partes la condición de [owner.GetTitledFirstNameNoTooltip]. ¿Acaso no comprende el poder que posee [owner.GetTitledFirstNameNoTooltip]?"
spn_secrets.0002.worried.desc:0 "\n\n¡Debería mostrarles a todos el poder que concede el vampirismo! Pero... temo que después se vuelvan contra mí."
spn_secrets.0002.dislikes_negative:0 "¡Matad al vampiro!"
spn_secrets.0002.b:0 "¡Ese vampiro pagará por ello!"
spn_secrets.0002.c:0 "No son más que acusaciones nacidas de la malicia y la mentira."

spn_secrets.1001.t:0 "Secreto revelado"
spn_secrets.1001.desc:0 "Un acusador anónimo ha descubierto mi secreto y me ha denunciado como una abominación impía. Ahora todos me ven como enemigo de [ROOT.Char.GetFaith.HighGodName]."
spn_secrets.1001.a:0 "¿Acaso no ven el poder que ostento?"

