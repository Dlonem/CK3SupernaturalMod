l_spanish:
 ############################
 ### Conceptos principales ###
 ############################

game_concept_vampire:0 "Vampiro"
game_concept_vampires:0 "Vampiros"
game_concept_vampire_desc:0 "Los vampiros son seres sobrenaturales inmortales, malditos con una sed constante de sangre. Caminan entre los humanos ocultando su verdadera naturaleza. Su fuerza supera la de cualquier mortal, poseen una velocidad inhumana y pueden someter la voluntad de otros. Pese a su inmenso poder, viven atrapados en una lucha eterna entre sus instintos depredadores y los restos de su humanidad."

game_concept_werewolf:0 "Hombre lobo"
game_concept_werewolves:0 "Hombres lobo"
game_concept_werewolf_desc:0 "Los hombres lobo son seres sobrenaturales dotados de una fuerza inmensa, gran agilidad y sentidos agudizados. Su maldición les empuja a aceptar su doble naturaleza y a transformarse en bestias temibles. Aunque sus instintos son primitivos, suelen formar manadas sólidas y vivir entre humanos, tratando de equilibrar su humanidad con la llamada de lo salvaje."

game_concept_hybrid:0 "Híbrido"
game_concept_hybrids:0 "Híbridos"
game_concept_hybrid_desc:0 "Los híbridos son criaturas casi míticas nacidas de la unión de linajes vampíricos y licántropos. Su mera existencia desafía las leyes naturales y les concede las fortalezas de ambos mundos: inmortalidad, un poder excepcional y la capacidad de moverse entre ellos sin muchas de las limitaciones que pesan sobre sus congéneres. Son leyendas vivientes, capaces de inspirar asombro y terror a partes iguales."

game_concept_spn_hunter:0 "Cazador"
game_concept_spn_hunters:0 "Cazadores"
game_concept_spn_hunter_desc:0 "Los cazadores son guerreros hábiles y decididos, dedicados a proteger el mundo de las amenazas sobrenaturales. Se especializan en dos disciplinas: la caza de monstruos, centrada en vampiros, hombres lobo y otras criaturas, y la caza de brujas, dirigida contra usuarios de magia descontrolados o peligrosos. Su temple y entrenamiento los convierten en la primera línea de defensa de la humanidad frente a lo desconocido."

game_concept_mmaker:0 "Creador"
game_concept_mmaker_plural:0 "Creadores"
game_concept_mmaker_desc:0 "Un [Concept('vampire','vampiro')|E] que ha creado a otro vampiro. El creador comparte con su [Concept('pprogeny','progenie')|E] un lazo sobrenatural que puede despertar lealtad, intuiciones compartidas e incluso una influencia directa. Algunos poderes e interacciones hacen referencia a este vínculo, lo que permite al creador imponer su voluntad cuando se cumplen las condiciones adecuadas."

game_concept_pprogeny:0 "Progenie"
game_concept_pprogeny_plural:0 "Progenies"
game_concept_pprogeny_desc:0 "Un vampiro creado por un [Concept('mmaker','creador')|E]. La progenie suele sentir la llamada de la sangre de quien la creó, un vínculo persistente que puede inclinar sus emociones o decisiones. Ciertos eventos e interacciones pueden aprovechar esta conexión, aunque la fuerza de voluntad, la distancia y las circunstancias pueden debilitarla."

game_concept_sire_bond:0 "Vínculo con el creador"
game_concept_sire_bond_desc:0 "El lazo oculto entre un [Concept('mmaker','creador')|E] y su [Concept('pprogeny','progenie')|E]. En la práctica se manifiesta como deferencia, instintos compartidos y, en ocasiones, compulsión. Las mecánicas del mod pueden aprovecharlo para desbloquear opciones únicas —por ejemplo, #bold Invocar el vínculo#!— o modificar las probabilidades de aceptación."


 ######################
 ### Hombres de armas ###
 ######################
game_concept_supernatural_animals:0 "Animales"
game_concept_supernatural_animal:0 "Animal"
game_concept_animal:0 "Animal"
game_concept_supernatural_animal_desc:0 "Los animales son [men_at_arms|E] dirigidos por monstruos sobrenaturales, eficaces a la hora de hostigar al enemigo.\n\nAunque su calidad puede ser baja, lo compensan con su número; por lo general, hacen [counter|E] a los [archers|E]."

game_concept_supernatural_monsters:0 "Monstruos"
game_concept_supernatural_monster:0 "Monstruo"
game_concept_monster:0 "Monstruo"
game_concept_supernatural_monster_desc:0 "Los monstruos son [men_at_arms|E] comandados por otros monstruos sobrenaturales más poderosos, expertos en destrozar a enemigos sin entrenamiento.\n\nAunque suelen ser pocos, su gran calidad destaca en combate. Por lo general, hacen [counter|E] a los [archers|E]."

game_concept_were-wolves:0 "Hombres lobo"
game_concept_werewolves_desc:0 "Los hombres lobo son [men_at_arms|E] comandados por otros monstruos sobrenaturales más poderosos, expertos en destrozar a enemigos sin entrenamiento.\n\nAunque suelen ser pocos, su gran calidad destaca en combate."

game_concept_feeding_success_chance_no_prefix:0 "Probabilidad de alimentarse con éxito"
game_concept_feeding_success_chance:0 "Probabilidad de alimentarse con éxito"
game_concept_feeding_success_chance_desc:0 "Al participar en [GetActivityType('vampire_feeding').GetName], el éxito no está garantizado. Los principales factores que influyen en tu probabilidad de alimentarte con éxito son:\n$BULLET_WITH_TAB$la [trait_level_track_xp|E] de [GetTrait('supernatural_vampire').GetName( GetNullCharacter )] o [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$el [development|E] de la zona objetivo\n$BULLET_WITH_TAB$la preparación elegida y la [intent|E] durante la actividad\n\n$game_concept_feeding_success_chance$ nunca puede superar #V 95#!.\n\n#weak Alimentarte con éxito aumenta tu fuerza vampírica. La discreción es fundamental: fracasar puede revelar tu verdadera naturaleza al mundo.#!"
game_concept_feeding_success_chance_no_prefix_desc:0 "$game_concept_feeding_success_chance_desc$"
