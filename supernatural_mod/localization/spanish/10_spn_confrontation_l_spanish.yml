l_spanish:
spn_confrontation.9000.tt:0 "Derrota a tu atacante"
spn_confrontation.9001.tt:0 "Intenta escapar"

#-------------------------------------------------------------------------- 
# A Surprise You Could Die For
#-------------------------------------------------------------------------- 
#A Surprise You Could Die For
spn_confrontation.0001.t:0 "Una sorpresa que podría costarte la vida"
spn_confrontation.0001.desc:0 "Estás sentado en tu estudio una noche cualquiera cuando la puerta se abre de golpe. Un [spn_new_created_hunter.GetWomanMan] aparece ante ti, armado hasta los dientes.\n\n\"¡Te tengo, bastardo!\", grita [spn_new_created_hunter.GetSheHe] antes de abalanzarse sobre ti."
spn_confrontation.0001.a:0 "¡Ven, si te atreves!"
spn_confrontation.0001.a.tt:0 "Aceptas el desafío y te enfrentas al desconocido atacante."
spn_confrontation.0001.b:0 "Intentar escapar."
spn_confrontation.0001.b.tt:0 "Arrojas todo lo que tienes a mano contra el desconocido en un intento desesperado por encontrar una vía de escape."

#Bravery or Stupidity?
spn_confrontation.0002.t:0 "¿Valentía o estupidez?"
spn_confrontation.0002.desc:0 "Tras una dura batalla, has matado a tu atacante. [spn_new_created_hunter.GetSheHe|U] yace sin vida a tus pies. Entre sus pertenencias encuentras notas sobre los seres inmortales de este mundo. ¿Tendrás que vértelas con más cazadores como este?"
spn_confrontation.0002.a:0 "Ha sido un intento valiente, pero insensato."
spn_confrontation.0002.a.tt:0 "Al menos queda un enemigo menos en el mundo."

#Narrow Escape
spn_confrontation.0003.t:0 "Escapada por los pelos"
spn_confrontation.0003.desc:0 "Una silla lanzada con acierto te ha dado el tiempo justo para esquivar a tu atacante. Has llamado a tus guardias y ordenado registrar el lugar de arriba abajo. Según informan, no han encontrado ni rastro de quien te atacó."
spn_confrontation.0003.a:0 "Qué contrariedad."
spn_confrontation.0003.a.tt:0 "¿Para qué pago a estos guardias?"

#-------------------------------------------------------------------------- 
# A Walk In The Garden
#-------------------------------------------------------------------------- 
#A Walk In The Garden
spn_confrontation.0011.t:0 "Un paseo por el jardín"
spn_confrontation.0011.desc:0 "Mientras das un paseo al caer la tarde por los jardines, oyes un crujido entre los arbustos. Un [spn_new_created_hunter.GetWomanMan] salta sobre ti con un atronador grito de guerra."
spn_confrontation.0011.a:0 "¡Vas a encontrar más de lo que buscabas!"
spn_confrontation.0011.a.tt:0 "Forcejeas con el desconocido."
spn_confrontation.0011.b:0 "Intentar escapar."
spn_confrontation.0011.b.tt:0 "Intentas esquivar a tu atacante y buscar ayuda entre tus guardias."

#A Tiring Ordeal
spn_confrontation.0012.t:0 "Una prueba agotadora"
spn_confrontation.0012.desc:0 "Tras la lucha, te alzas con la victoria. Cubierto de sangre, miras al atacante tendido en el suelo. Este [spn_new_created_hunter.GetWomanMan] llevaba armas pensadas para matar inmortales. ¿Vendrán más cazadores a por ti?"
spn_confrontation.0012.a:0 "No conseguirán atraparme."
spn_confrontation.0012.a.tt:0 "Que lo intenten cuanto quieran..."

#As Fast As You Can
spn_confrontation.0013.t:0 "Corre todo lo que puedas"
spn_confrontation.0013.desc:0 "Has logrado esquivar a tu atacante con una demostración extraordinaria de resistencia. Cuando por fin encuentras a uno de tus guardias, ordenas registrar los jardines, pero no sirve de nada. El atacante vivirá para luchar otro día."
spn_confrontation.0013.a:0 "Espera, ¿qué? ¡¿Cómo?!"
spn_confrontation.0013.a.tt:0 "¿De verdad son tan inútiles mis guardias?"

#-------------------------------------------------------------------------- 
# A Not So Peaceful Sleep
#-------------------------------------------------------------------------- 
#A Not So Peaceful Sleep
spn_confrontation.0021.t:0 "Un sueño nada tranquilo"
spn_confrontation.0021.desc:0 "Te despiertas con un fuerte estrépito y ves ante ti una figura sombría que acaba de entrar por la ventana.\n\n\"¡¿Qué significa esto?!\", gritas.\n\"Mandar a un monstruo al otro mundo. ¡Ahora muere!\", responde el atacante mientras lanza un alarido y carga contra ti."
spn_confrontation.0021.a:0 "¡¿Cómo te atreves a entrar en mi casa?!"
spn_confrontation.0021.a.tt:0 "Desafías al atacante de frente."
spn_confrontation.0021.b:0 "¡Ah! ¡¿Por qué a mí?!"
spn_confrontation.0021.b.tt:0 "Arrojas la ropa de cama contra el atacante e intentas esquivarlo."

#Not In My House
spn_confrontation.0022.t:0 "En mi casa, no"
spn_confrontation.0022.desc:0 "Con la batalla ganada, enciendes una vela para ver mejor a tu atacante. [spn_new_created_hunter.GetSheHe|U] se había preparado para este encuentro, aunque no lo suficiente. Con suerte, no volverás a ver a más cazadores como este."
spn_confrontation.0022.a:0 "Me alegro de que haya terminado."
spn_confrontation.0022.a.tt:0 "¿Será el último?"

#Skillful Use of Bedding
spn_confrontation.0023.t:0 "Uso magistral de la ropa de cama"
spn_confrontation.0023.desc:0 "Una manta bien lanzada ha logrado incapacitar momentáneamente a tu atacante. Aprovechas la ocasión para alejarte del peligro y buscar a los guardias. Tras registrar tus aposentos, regresan con las manos vacías."
spn_confrontation.0023.a:0 "¡Maldita sea!"
spn_confrontation.0023.a.tt:0 "Esperemos que no vuelva nunca."


### added by sync_localizations.py -- untranslated, 18 keys
 spn_confrontation.0001.c:0 "Look [spn_new_created_hunter.GetHerHim] in the eye."
 spn_confrontation.0001.c.tt:0 "Your blood is at its peak and the stranger's hands are shaking. You compel [spn_new_created_hunter.GetHerHim] to go home and forget this door.\n\n#N Costs 20 Vampirism. At 100 this drops you a tier until you earn it back.#!"
 spn_confrontation.0004.t:0 "Sent Home"
 spn_confrontation.0004.desc:0 "You do not move from your chair. You look the stranger in the eye and speak, low and even, and the words go in.\n\n"You are tired. You have made a mistake. You will go home now, and you will not remember this house."\n\n[spn_new_created_hunter.GetSheHe|U] lowers the weapon, turns, and walks out of the study. [spn_new_created_hunter.GetSheHe|U] will wake tomorrow with a headache and no idea why."
 spn_confrontation.0004.a:0 "Nobody has to die tonight."
 spn_confrontation.0004.a.tt:0 "The hunter lives, and remembers nothing. That took something out of you."
 spn_confrontation.0011.c:0 "Look [spn_new_created_hunter.GetHerHim] in the eye."
 spn_confrontation.0011.c.tt:0 "Your blood is at its peak and the stranger's aim is unsteady. You compel [spn_new_created_hunter.GetHerHim] to go home and forget this garden.\n\n#N Costs 20 Vampirism. At 100 this drops you a tier until you earn it back.#!"
 spn_confrontation.0014.t:0 "Sent Home"
 spn_confrontation.0014.desc:0 "You stop walking. You turn, and you look the stranger in the eye, and you speak, low and even.\n\n"You are tired. You have made a mistake. You will go home now, and you will not remember these gardens."\n\n[spn_new_created_hunter.GetSheHe|U] lowers the weapon, turns, and walks back down the path the way [spn_new_created_hunter.GetSheHe] came. [spn_new_created_hunter.GetSheHe|U] will wake tomorrow with a headache and no idea why."
 spn_confrontation.0014.a:0 "Nobody has to die tonight."
 spn_confrontation.0014.a.tt:0 "The hunter lives, and remembers nothing. That took something out of you."
 spn_confrontation.0021.c:0 "Look [spn_new_created_hunter.GetHerHim] in the eye."
 spn_confrontation.0021.c.tt:0 "Your blood is at its peak and the stranger hesitated at your bedside. You compel [spn_new_created_hunter.GetHerHim] to go home and forget this room.\n\n#N Costs 20 Vampirism. At 100 this drops you a tier until you earn it back.#!"
 spn_confrontation.0024.t:0 "Sent Home"
 spn_confrontation.0024.desc:0 "You sit up in the bed. You do not reach for a weapon. You look the stranger in the eye and speak, low and even, and the words go in.\n\n"You are tired. You have made a mistake. You will go home now, and you will not remember this room."\n\n[spn_new_created_hunter.GetSheHe|U] lowers the weapon, turns, and lets [spn_new_created_hunter.GetHerselfHimself] out. [spn_new_created_hunter.GetSheHe|U] will wake tomorrow with a headache and no idea why."
 spn_confrontation.0024.a:0 "Nobody has to die tonight."
 spn_confrontation.0024.a.tt:0 "The hunter lives, and remembers nothing. That took something out of you."
