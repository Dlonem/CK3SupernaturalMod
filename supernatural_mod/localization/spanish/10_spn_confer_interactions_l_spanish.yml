l_spanish:
#Ofrecer sangre a un no vampiro
spn_offer_vampire_blood:0 "Ofrecer sangre"
spn_offer_vampire_blood_interaction_desc:0 "Ofrece tu sangre. Si un humano la bebiera, experimentaría algunas de sus muchas propiedades curativas. Es el primer paso para crear un nuevo vampiro."
spn_msg_tooltip_confer_blood_vampirism_desc:0 "[THIS.GetCharacter.GetFirstName] beberá parte de tu sangre y se beneficiará de sus propiedades curativas. Sin embargo, podría haber consecuencias imprevistas..."
spn_offer_vampire_blood_hybrid_interaction_desc:0 "Ofrece tu sangre. Quienes beban sangre vampírica notarán al instante sus propiedades curativas. Sin embargo, los no humanos pueden reaccionar de otra manera, con resultados que varían según su naturaleza."

#Convertir a alguien en vampiro
spn_turn_into_vampire:0 "Convertir en vampiro"
spn_turn_into_vampire_interaction_desc:0 "Intenta convertir a esta persona en vampiro. El último paso para crear un nuevo vampiro consiste en poner fin a su vida mientras la sangre aún corre por sus venas."
spn_msg_tooltip_confer_vampirism_desc:0 "La vida humana de [THIS.GetCharacter.GetFirstName] llegará a su fin y se convertirá en [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
SPN_OFFER_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Te ofrezco mi sangre."

#Pedir ser convertido en vampiro
SPN_ASK_FOR_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Te pido humildemente que me conviertas en vampiro."
spn_ask_to_turn_into_vampire:0 "Pedir conversión"
spn_ask_to_turn_into_vampire_interaction_desc:0 "Pide a [recipient.GetShortUIName] que te convierta en [GetTrait('supernatural_vampire').GetName( recipient )]."
spn_msg_tooltip_ask_vampirism_desc:0 "[recipient.GetShortUIName] dará su sangre a [THIS.GetCharacter.GetFirstName], como primer paso para convertirse en [GetTrait('supernatural_vampire').GetName( THIS.Char )]. Después, [THIS.GetCharacter.GetFirstName] morirá a manos de [recipient.GetShortUIName] y renacerá como [GetTrait('supernatural_vampire').GetName( THIS.Char )]."
 
#Pedir no ser convertido en vampiro
SPN_ASK_FOR_NOT_VAMPIRISM_INTERACTION_NOTIFICATION:0 "Por favor, he cambiado de opinión y no deseo convertirme en vampiro."
spn_ask_to_not_turn_into_vampire:0 "Pedir que no te conviertan"
spn_msg_tooltip_ask_not_vampirism_desc:0 "[recipient.GetShortUIName] no te convertirá en [GetTrait('supernatural_vampire').GetName( THIS.Char )]. Sin embargo, su sangre sigue dentro de tu cuerpo..."
spn_ask_to_not_turn_into_vampire_interaction_desc:0 "Has cambiado de opinión con todo esto de «morir y volver». ¿Quizá puedas pedir que no te maten?"

#Convertir a alguien en licántropo
spn_turn_into_lycan:0 "Transmitir licantropía"
spn_turn_into_lycan_interaction_desc:0 "Transmitir licantropía"
spn_msg_tooltip_confer_lycanthropy_desc:0 "[THIS.GetCharacter.GetFirstName] asumirá el riesgo e intentará convertirse en [GetTrait('supernatural_werewolf').GetName( THIS.Char )]."
SPN_OFFER_LYCANTHROPY_INTERACTION_NOTIFICATION:0 "Te ofrezco transmitirte la licantropía."

#Pedir ser convertido en licántropo
SPN_ASK_FOR_LYCANTHROPY_INTERACTION_NOTIFICATION:0 "Te pido humildemente que me conviertas en hombre lobo."
spn_ask_to_turn_into_lycan:0 "Pedir conversión"
spn_ask_to_turn_into_lycan_interaction_desc:0 "Pide a [recipient.GetShortUIName] que te convierta en [GetTrait('supernatural_werewolf').GetName( recipient )]."
spn_msg_tooltip_ask_lycanthropy_desc:0 "[recipient.GetShortUIName] convertirá a [THIS.GetCharacter.GetFirstName] en [GetTrait('supernatural_werewolf').GetName( THIS.Char )].\n[recipient.GetShortUIName] tendrá un gancho secreto sobre [THIS.GetCharacter.GetFirstName] si se acepta la licantropía."

#Convertir a alguien en híbrido
spn_turn_into_hybrid:0 "Crear híbrido"
spn_turn_into_hybrid_interaction_desc:0 "Ofrece la oportunidad de convertirse en híbrido, una abominación que combina la fuerza del vampiro y del hombre lobo. La transición es peligrosa y está llena de riesgos, pero a quienes sobrevivan les aguarda un poder inimaginable."
spn_msg_tooltip_confer_hybrid_desc:0 "[THIS.GetCharacter.GetFirstName] asumirá el riesgo e intentará convertirse en [GetTrait('supernatural_hybrid').GetName( THIS.Char )]."
SPN_OFFER_HYBRID_INTERACTION_NOTIFICATION:0 "Te ofrezco convertirte tanto en vampiro como en hombre lobo."

#Pedir ser convertido en híbrido
SPN_ASK_FOR_HYBRID_INTERACTION_NOTIFICATION:0 "Te pido humildemente que me conviertas en híbrido."
spn_ask_to_turn_into_hybrid:0 "Pedir conversión"
spn_ask_to_turn_into_hybrid_interaction_desc:0 "Pide a [recipient.GetShortUIName] que te convierta en [GetTrait('supernatural_hybrid').GetName( recipient )]."
spn_msg_tooltip_ask_hybrid_desc:0 "[recipient.GetShortUIName] convertirá a [THIS.GetCharacter.GetFirstName] en [GetTrait('supernatural_hybrid').GetName( THIS.Char )].\n[recipient.GetShortUIName] tendrá un gancho secreto sobre [THIS.GetCharacter.GetFirstName] si no se aceptan los híbridos."

#Entrenar a alguien como cazador
spn_turn_into_hunter:0 "Entrenar como cazador"
spn_turn_into_hunter_interaction_desc:0 "Ofrecerás tus conocimientos como cazador y la persona elegida se someterá a pruebas que podrían convertirla en cazadora, dejarla herida o incluso causarle la muerte."
spn_msg_tooltip_confer_hunter_desc:0 "[THIS.GetCharacter.GetFirstName] asumirá el riesgo e intentará convertirse en [GetTrait('supernatural_hunter').GetName( THIS.Char )]."
spn_msg_tooltip_hunter_desc:0 "[THIS.GetCharacter.GetFirstName] se someterá a varios meses de entrenamiento."
SPN_OFFER_HUNTER_INTERACTION_NOTIFICATION:0 "Te ofrezco entrenarte como cazador."

#Pedir ser entrenado como cazador
SPN_ASK_FOR_HUNTER_INTERACTION_NOTIFICATION:0 "Te pido humildemente que me entrenes como cazador."
spn_ask_to_turn_into_hunter:0 "Pedir entrenamiento como cazador"
spn_ask_to_turn_into_hunter_interaction_desc:0 "Pide a [recipient.GetShortUIName] que te entrene como [GetTrait('supernatural_hunter').GetName( recipient )]."
spn_msg_tooltip_ask_hunter_desc:0 "[recipient.GetShortUIName] entrenará a [THIS.GetCharacter.GetFirstName] para convertirse en [GetTrait('supernatural_hunter').GetName( THIS.Char )].\n[recipient.GetShortUIName] tendrá un gancho secreto sobre [THIS.GetCharacter.GetFirstName] si se acepta el entrenamiento."

#Mensajes sobre la probabilidad de sobrevivir
spn_msg_tooltip_confer_live_desc:0 "[THIS.GetCharacter.GetFirstName] sobrevivirá al proceso."
spn_msg_tooltip_train_live_desc:0 "[THIS.GetCharacter.GetFirstName] sobrevivirá al entrenamiento."
spn_msg_tooltip_train_die_desc:0 "[THIS.GetCharacter.GetFirstName] no sobrevivirá al entrenamiento."
 
#Eventos para convertirse en vampiro
spn_miscellaneous_events.0004.t:0 "Convertirse en vampiro: pérdida de la noción del tiempo"
spn_miscellaneous_events.0004.desc:0 "El aire está inmóvil; el único sonido es el leve susurro de las hojas cuando una figura envuelta en sombras se acerca. La reconoces, aunque su rostro permanece oculto bajo una capucha oscura. Es el ser al que buscabas: el vampiro cuya sangre corrió una vez por tus venas, ahora de pie ante ti.\n \n «Perdóname», dice la figura con una voz suave, aunque teñida de un extraño desapego. «El tiempo se nos escapa con demasiada facilidad. He estado... ocupado. Pero ya estoy aquí, y debemos actuar deprisa. El riesgo de que la sangre abandone tu organismo es... mínimo». \n \nAntes de que puedas pronunciar palabra, su mano se cierra sobre tu garganta, fría e implacable. El pánico te invade al comprenderlo: cualquier esperanza que te quedara se desvanece, tan inexorablemente como se estrecha la presa del vampiro."
spn_miscellaneous_events.0004.a:0 "¡No, espera!"
spn_miscellaneous_events.0004.a.tt:0 "Ya es demasiado tarde. Empezaste buscando la inmortalidad, y has acabado encontrando la muerte."
 
spn_miscellaneous_events.0005.t:0 "Vampiro: conversión"
spn_miscellaneous_events.0005.desc:0 "El mundo se funde en negro cuando los colmillos del vampiro se hunden en tu cuello. Sientes cómo la vida abandona tu cuerpo y, con ella, tu humanidad. Al despertar, la noche parece más luminosa, tus sentidos más agudos, y una fuerza nueva recorre tus venas. \n \n Pero con ese poder llega un hambre voraz: un hambre que solo la sangre puede saciar. La transformación ha concluido; ahora eres uno de ellos."
spn_miscellaneous_events.0005.a:0 "Comienza mi nueva vida."
spn_miscellaneous_events.0005.a.tt:0 "Te has convertido en vampiro y, por ello, te has curado de cualquier dolencia curable que padecieras anteriormente."
 
