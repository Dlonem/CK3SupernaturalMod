spn_versioninfo.1000.desc:0 "#high Supernatural – Versión#! #P 2.28#!\n¡Bienvenido al mod #high Supernatural#! Si quieres apoyar el desarrollo del mod, plantéate suscribirte a mi canal de YouTube. #high Busca «Dlonem» y suscríbete#!.\n\n#high 2.28 – Cambios destacados:#!\n$BULLET_WITH_TAB$ Corregido el árbol de talentos de vampiro: Maestro de las Sombras y Nido de Vampiros vuelven a poder seleccionarse, con un diseño más limpio en forma de «gota de sangre»\n$BULLET_WITH_TAB$ La compulsión ahora avisa a ambas partes: tanto el compelido como quienes resisten por fin saben lo que ha ocurrido\n$BULLET_WITH_TAB$ Nuevos consejos en la pantalla de carga y un nuevo concepto informativo de «Alimentación vampírica»\n$BULLET_WITH_TAB$ Amplia limpieza del registro de errores, sin cambios en la jugabilidad\n\n#high Gracias por el apoyo,#!\nDlonem"

