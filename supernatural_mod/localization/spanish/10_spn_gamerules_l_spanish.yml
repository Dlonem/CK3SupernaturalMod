l_spanish:
#Game Rule Category, Supernatural
game_rule_category_SPN:0 "Sobrenatural"
game_rule_category_WC:0 "Brujería"

#Game Rule, Supernatural - Embrace Decision
rule_spn_enable_embrace_decision:0 "Sobrenatural: decisiones de conversión"
setting_spn_yes_embrace_decision:0 "Activado"
setting_spn_yes_embrace_decision_desc:0 "Activa las opciones del menú de decisiones para obtener rasgos sobrenaturales y de cazador."
setting_spn_no_embrace_decision:0 "Predeterminado (desactivado)"
setting_spn_no_embrace_decision_desc:0 "Desactiva las opciones del menú de decisiones para obtener rasgos sobrenaturales y de cazador."

#Game Rule, Supernatural - Events
rule_spn_enable_embrace_events:0 "Sobrenatural: eventos"
setting_spn_yes_embrace_events:0 "Predeterminado (activado)"
setting_spn_yes_embrace_events_desc:0 "Activa los eventos relacionados con la conversión y con otros sucesos sobrenaturales."
setting_spn_no_embrace_events:0 "Desactivado"
setting_spn_no_embrace_events_desc:0 "Desactiva los eventos relacionados con la conversión y con otros sucesos sobrenaturales."
setting_spn_only_embrace_events:0 "Solo conversión"
setting_spn_only_embrace_events_desc:0 "Activa únicamente los eventos de conversión y desactiva el resto de eventos sobrenaturales."
setting_spn_only_super_events:0 "Sin conversión"
setting_spn_only_super_events_desc:0 "Desactiva los eventos de conversión, pero mantiene activos los demás eventos sobrenaturales."

#Game Rule, Supernatural - Visual Fangs
rule_spn_enable_visual_fangs:0 "Sobrenatural: colmillos visibles"
setting_spn_both_visual_fangs:0 "Predeterminado (activado)"
setting_spn_both_visual_fangs_desc:0 "Tanto los vampiros como los híbridos tendrán colmillos visibles."
setting_spn_no_visual_fangs:0 "Desactivado"
setting_spn_no_visual_fangs_desc:0 "No se añadirán colmillos visibles a los personajes vampíricos."
setting_spn_vampire_visual_fangs:0 "Solo vampiros"
setting_spn_vampire_visual_fangs_desc:0 "Solo los vampiros tendrán colmillos visibles."

#Game Rule, Supernatural - Paleness
rule_spn_enable_lighter_skin:0 "Sobrenatural: palidez"
setting_spn_both_lighter_skin:0 "Vampiros e híbridos"
setting_spn_both_lighter_skin_desc:0 "Tanto los vampiros como los híbridos tendrán un tono de piel más pálido tras la transformación."
setting_spn_no_lighter_skin:0 "Desactivado"
setting_spn_no_lighter_skin_desc:0 "Los personajes no tendrán un tono de piel más pálido tras la transformación."
setting_spn_vampire_lighter_skin:0 "Predeterminado (solo vampiros)"
setting_spn_vampire_lighter_skin_desc:0 "Solo los vampiros tendrán un tono de piel más pálido tras la transformación; los híbridos conservarán su tono normal."

#Game Rule, Supernatural - RCV Changes
rule_spn_enable_right_click_visuals:0 "Sobrenatural: cambios visuales"
setting_spn_yes_right_click_visuals:0 "Activado"
setting_spn_yes_right_click_visuals_desc:0 "Permite usar opciones del menú de clic derecho para activar o desactivar ciertos elementos visuales de los personajes."
setting_spn_no_right_click_visuals:0 "Predeterminado (desactivado)"
setting_spn_no_right_click_visuals_desc:0 "No estarán disponibles las opciones de clic derecho para modificar elementos visuales."
 
#Game Rule, Supernatural - Confer Death
rule_spn_enable_confer_death:0 "Sobrenatural: riesgo mortal al transmitir"
setting_spn_yes_confer_death:0 "Predeterminado (activado)"
setting_spn_yes_confer_death_desc:0 "Los personajes que sean convertidos o entrenados tendrán cierta probabilidad de morir durante el proceso."
setting_spn_yes_higher_confer_death:0 "Más riesgo"
setting_spn_yes_higher_confer_death_desc:0 "Aumenta la probabilidad de que los personajes convertidos o entrenados mueran durante el proceso."
setting_spn_yes_lower_confer_death:0 "Menos riesgo"
setting_spn_yes_lower_confer_death_desc:0 "Reduce la probabilidad de que los personajes convertidos o entrenados mueran durante el proceso."
setting_spn_no_confer_death:0 "Desactivado"
setting_spn_no_confer_death_desc:0 "Los personajes convertidos o entrenados no podrán morir durante el proceso."
setting_spn_ai_only_confer_death:0 "Solo PNJ"
setting_spn_ai_only_confer_death_desc:0 "Solo los PNJ que sean convertidos o entrenados tendrán probabilidad de morir durante el proceso."
setting_spn_ai_only_higher_confer_death:0 "Solo PNJ, más riesgo"
setting_spn_ai_only_higher_confer_death_desc:0 "Aumenta la probabilidad de que los PNJ convertidos o entrenados mueran durante el proceso."
setting_spn_ai_only_lower_confer_death:0 "Solo PNJ, menos riesgo"
setting_spn_ai_only_lower_confer_death_desc:0 "Reduce la probabilidad de que los PNJ convertidos o entrenados mueran durante el proceso."

#Game Rule, Supernatural - AI Confer
rule_spn_enable_ai_can_confer:0 "Sobrenatural: transmisión por IA"
setting_spn_yes_ai_can_confer:0 "Predeterminado (activado)"
setting_spn_yes_ai_can_confer_desc:0 "Los personajes con rasgos sobrenaturales podrán convertir o entrenar a otros personajes."
setting_spn_no_ai_can_confer:0 "Desactivado"
setting_spn_no_ai_can_confer_desc:0 "Los personajes con rasgos sobrenaturales no convertirán ni entrenarán a otros personajes."
setting_spn_non_hybrid_ai_can_confer:0 "Solo no híbridos"
setting_spn_non_hybrid_ai_can_confer_desc:0 "Solo los vampiros y los hombres lobo podrán convertir a otros personajes."
setting_spn_only_vampire_ai_can_confer:0 "Solo vampiros"
setting_spn_only_vampire_ai_can_confer_desc:0 "Solo los vampiros podrán convertir a otros personajes."
setting_spn_only_lycan_ai_can_confer:0 "Solo hombres lobo"
setting_spn_only_lycan_ai_can_confer_desc:0 "Solo los hombres lobo podrán convertir a otros personajes."
setting_spn_only_hunter_ai_can_confer:0 "Solo cazadores"
setting_spn_only_hunter_ai_can_confer_desc:0 "Solo los cazadores podrán entrenar a otros personajes."

#Game Rule, Supernatural - Trait Distribution
rule_spn_enable_npc_trait_dist:0 "Sobrenatural: distribución de rasgos"
setting_spn_yes_npc_trait_dist:0 "Activado"
setting_spn_yes_npc_trait_dist_desc:0 "Todos los PNJ tendrán una probabilidad de obtener rasgos sobrenaturales al azar."
setting_spn_no_npc_trait_dist:0 "Desactivado"
setting_spn_no_npc_trait_dist_desc:0 "Ningún PNJ podrá obtener rasgos sobrenaturales al azar."
setting_spn_kings_npc_trait_dist:0 "Reyes e inferiores"
setting_spn_kings_npc_trait_dist_desc:0 "Solo los PNJ con títulos de rango de reino o inferior tendrán una probabilidad de obtener rasgos sobrenaturales al azar."
setting_spn_dukes_npc_trait_dist:0 "Duques e inferiores"
setting_spn_dukes_npc_trait_dist_desc:0 "Solo los PNJ con títulos de rango de ducado o inferior tendrán una probabilidad de obtener rasgos sobrenaturales al azar."
setting_spn_counts_npc_trait_dist:0 "Predeterminado (condes e inferiores)"
setting_spn_counts_npc_trait_dist_desc:0 "Solo los PNJ con títulos de rango de condado o inferior tendrán una probabilidad de obtener rasgos sobrenaturales al azar."
setting_spn_barons_npc_trait_dist:0 "Barones e inferiores"
setting_spn_barons_npc_trait_dist_desc:0 "Solo los PNJ con títulos de rango de baronía o inferior tendrán una probabilidad de obtener rasgos sobrenaturales al azar."
setting_spn_no_ruler_npc_trait_dist:0 "Sin gobernantes"
setting_spn_no_ruler_npc_trait_dist_desc:0 "Solo los PNJ sin títulos tendrán una probabilidad de obtener rasgos sobrenaturales al azar."

#Game Rule, Supernatural - Reset Lifetime Events
rule_spn_enable_periodic_lifetime_events_reset:0 "Sobrenatural: reinicio de eventos únicos"
setting_no_spn_lifetime_events_reset:0 "Desactivado"
setting_no_spn_lifetime_events_reset_desc:0 "Los eventos únicos no se reiniciarán."
setting_1_spn_lifetime_events_reset:0 "Cada año"
setting_1_spn_lifetime_events_reset_desc:0 "Cada año se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."
setting_10_spn_lifetime_events_reset:0 "Cada 10 años"
setting_10_spn_lifetime_events_reset_desc:0 "Cada 10 años se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."
setting_25_spn_lifetime_events_reset:0 "Cada 25 años"
setting_25_spn_lifetime_events_reset_desc:0 "Cada 25 años se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."
setting_50_spn_lifetime_events_reset:0 "Predeterminado (cada 50 años)"
setting_50_spn_lifetime_events_reset_desc:0 "Cada 50 años se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."
setting_75_spn_lifetime_events_reset:0 "Cada 75 años"
setting_75_spn_lifetime_events_reset_desc:0 "Cada 75 años se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."
setting_100_spn_lifetime_events_reset:0 "Cada 100 años"
setting_100_spn_lifetime_events_reset_desc:0 "Cada 100 años se restablecen los marcadores vitalicios de ventajas reembolsadas, gran guerra religiosa, fe creada, cultura convertida, invasión y subyugación."

#Game Rule, Supernatural - Inheritance
rule_spn_enable_trait_inheritance:0 "Sobrenatural: herencia y embarazo"
setting_spn_yes_trait_inheritance:0 "Activado"
setting_spn_yes_trait_inheritance_desc:0 "Los híbridos pueden engendrar descendencia licántropa entre sí. Los padres licántropos con madres humanas engendran hijos humanos. Los padres humanos con madres inmortales engendran hijos licántropos."
setting_spn_no_trait_inheritance:0 "Desactivado"
setting_spn_no_trait_inheritance_desc:0 "Los vampiros, híbridos y hombres lobo no podrán procrear y dependerán de la adopción."
setting_spn_immortal_only_trait_inheritance:0 "Solo hombres lobo e híbridos"
setting_spn_immortal_only_trait_inheritance_desc:0 "Los hombres lobo y los híbridos pueden engendrar descendencia licántropa entre sí, pero NO con humanos."
setting_spn_human_no_immortal_trait_inheritance:0 "Hombres lobo e híbridos engendran humanos"
setting_spn_human_no_immortal_trait_inheritance_desc:0 "Los hombres lobo y los híbridos engendran descendencia humana, tanto si su pareja es licántropa como si es humana."
setting_spn_human_only_trait_inheritance:0 "Solo con humanos"
setting_spn_human_only_trait_inheritance_desc:0 "Los hombres lobo y los híbridos pueden engendrar descendencia humana con parejas humanas."
setting_spn_vampire_trait_inheritance:0 "Omitir este ajuste"
setting_spn_vampire_trait_inheritance_desc:0 "En serio, omítelo."
setting_spn_werewolf_trait_inheritance:0 "Predeterminado (solo rasgo de hombre lobo)"
setting_spn_werewolf_trait_inheritance_desc:0 "Los hombres lobo y los híbridos engendran hijos hombres lobo entre sí. Los hombres lobo que procreen con humanos podrán engendrar descendencia humana de vez en cuando."
setting_spn_no_hybrid_trait_inheritance:0 "Sin híbridos"
setting_spn_no_hybrid_trait_inheritance_desc:0 "Los sobrenaturales no híbridos engendran descendencia sobrenatural dentro de su propia especie. Los padres no híbridos con madres humanas engendran hijos humanos. Los padres humanos con madres no híbridas engendran hijos licántropos."

#Game Rule, Supernatural - Ageing
rule_spn_portrait_aging:0 "Sobrenatural: envejecimiento"
setting_spn_stops_at_portrait_maturity:0 "Predeterminado (madurez del retrato)"
setting_spn_stops_at_portrait_maturity_desc:0 "Todos los personajes convertidos o nacidos antes de los 25 años envejecerán visualmente hasta esa edad. Esta es la edad predeterminada de madurez del retrato."
setting_spn_no_automatic_ageing:0 "Sin envejecimiento"
setting_spn_no_automatic_ageing_desc:0 "Desactiva el envejecimiento visual para todos los personajes. Al ser convertidos, conservarán la apariencia de esa edad. Si usas este ajuste junto con la herencia inmortal, los personajes inmortales podrían conservar aspecto infantil para siempre... Quedas avisado."
setting_spn_gradual_ageing:0 "Envejecimiento gradual"
setting_spn_gradual_ageing_desc:0 "Los personajes con inmortalidad envejecerán a un ritmo normal hasta los 16 años. A partir de entonces, envejecerán visualmente cinco veces más despacio. Ten en cuenta que la edad visual sí afecta a la fertilidad."


### added by sync_localizations.py -- untranslated, 9 keys
 rule_spn_enable_demon_inheritance:0 "Supernatural: Demon Inheritance/Pregnancy"
 setting_spn_demon_yes_inheritance:0 "Default (On)"
 setting_spn_demon_yes_inheritance_desc:0 "Demons can father and bear children. Two Demons have a chance of producing a demon-blooded (Demon Spawn) child. A Demon and a Human have a 50% chance of a demon-blooded child, otherwise a normal Human is born."
 setting_spn_demon_no_inheritance:0 "Off"
 setting_spn_demon_no_inheritance_desc:0 "Demons cannot procreate at all and instead rely upon adoption. This is the original, pre-fix behaviour where Demon pregnancies were always lost."
 setting_spn_demon_immortal_only_inheritance:0 "Demons Only"
 setting_spn_demon_immortal_only_inheritance_desc:0 "Demons only conceive with other Demons, producing a chance of a demon-blooded child. A Demon and a Human produce no pregnancy."
 setting_spn_demon_human_only_inheritance:0 "Only Via Humans"
 setting_spn_demon_human_only_inheritance_desc:0 "Demons only conceive with Humans, with a 50% chance of a demon-blooded child. Two Demons produce no pregnancy."
