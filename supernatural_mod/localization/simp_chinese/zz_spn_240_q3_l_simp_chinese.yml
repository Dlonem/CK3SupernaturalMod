l_simp_chinese:
 spn_conclave.0300.desc_host_item:0 "Before the oaths are done you rise from the chair and lay [spn_cv_proof_art.GetName] on the table in front of everyone.\n\nThe room goes very quiet."
 spn_conclave.0300.desc_host_kill:0 "Before the oaths are done you rise from the chair and roll what is left of your kill across the floor. It comes to rest at the feet of the Temple Magi.\n\nThe room goes very quiet."
 spn_order_toast_tutee_taught:0 "[spn_tf_tutee.GetFirstName] Has Learned the Words"
 spn_order_toast_tutee_taught_desc:0 "Your acolyte has finished the teaching. You rest now, and the temple will not give you another acolyte to teach to the end for five years."
 spn_order_no_acolytes_decision:0 "I Will Not Take Acolytes"
 spn_order_no_acolytes_decision_desc:0 "Teaching an acolyte takes years of nights. You may tell your temple that you will not take one."
 spn_order_no_acolytes_decision_tooltip:0 "Stop being given acolytes to teach."
 spn_order_no_acolytes_decision_confirm:0 "I will not teach"
 spn_order_no_acolytes_decision_effect_tt:0 "You will not be given acolytes to teach. Those you teach now go to another tutor at the next chapter year. You lose the [spn_order_standing|E] a tutor earns."
 spn_order_take_acolytes_decision:0 "Take Acolytes Again"
 spn_order_take_acolytes_decision_desc:0 "You told your temple you would not teach. You may tell it you will."
 spn_order_take_acolytes_decision_tooltip:0 "Be given acolytes to teach again."
 spn_order_take_acolytes_decision_confirm:0 "I will teach"
 spn_order_take_acolytes_decision_effect_tt:0 "The temple may give you acolytes to teach again, from the next chapter year."
 spn_order.0163.c:0 "Then show me"
 spn_order.0163.c.tt:0 "You spend a little of your power to show [spn_q_tutee.GetHerHim] how it is done. Nobody argues after that."
 spn_order.0163.d:0 "Try it your way, then"
 spn_order.0163.d.tt:0 "You let [spn_q_tutee.GetHerHim] try. The chapter thinks you soft, but [spn_q_tutee.GetSheHe] may learn faster for it."
 spn_order.0163.e:0 "Not in front of the chapter"
 spn_order.0163.e.tt:0 "You take it outside and settle it between the two of you. Both of you keep face."
 spn_order.0163.f:0 "Remind [spn_q_tutee.GetHerHim] who teaches whom"
 spn_order.0163.f.tt:0 "Nobody in the chapter will argue with you again soon, [spn_q_tutee.GetFirstName] least of all. [spn_q_tutee.GetSheHe|U] will not forget it."
 spn_order_lean_learning_tt:0 "The better your [learning|E] against theirs, the likelier it goes your way."
 spn_order_lean_intrigue_tt:0 "The better your [intrigue|E] against theirs, the likelier it goes your way."
 spn_order.2100.t:0 "The Other Road"
 spn_order.2100.desc:0 "[spn_tp_tutee.GetTitledFirstName] has a witch's gift, and the words come easily to [spn_tp_tutee.GetHerHim]. There is another road to the Source than the temple's years: the training one Mage gives one pupil, the way it was done before there were temples.\n\nIt is hard work, and you could not teach another this way for many years."
 spn_order.2100.a:0 "Teach [spn_tp_tutee.GetHerHim] sorcery"
 spn_order.2100.a.tt:0 "The Teach Sorcery window opens. If [spn_tp_tutee.GetSheHe] accepts, [spn_tp_tutee.GetHerHis] Arcane Training begins, and finishing it shortens [spn_tp_tutee.GetHerHis] years in the temple."
 spn_order.2100.b:0 "The temple's road is enough"
 spn_order.2100.b.tt:0 "Nothing changes. [spn_tp_tutee.GetSheHe|U] goes on as before."
 spn_order.2101.t:0 "The Wrong Word"
 spn_order.2101.desc_tutor:0 "In the middle of the evening's working [spn_tp_tutee.GetFirstName] says one word wrong. The candle flame turns blue and climbs toward the ceiling, and the shelf above it starts to smoke.\n\n[spn_tp_tutee.GetSheHe|U] stands frozen, the next line gone out of [spn_tp_tutee.GetHerHis] head."
 spn_order.2101.desc_tutee:0 "In the middle of the evening's working you say one word wrong. The candle flame turns blue and climbs toward the ceiling, and the shelf above it starts to smoke.\n\n[spn_tp_tutor.GetTitledFirstName] does not move. The next line is gone out of your head."
 spn_order.2101.a:0 "Steady [spn_tp_tutee.GetHerHim]"
 spn_order.2101.a.tt:0 "You talk [spn_tp_tutee.GetHerHim] through the next line. [spn_tp_tutee.GetSheHe|U] will remember who stood beside [spn_tp_tutee.GetHerHim]."
 spn_order.2101.b:0 "Let [spn_tp_tutee.GetHerHim] put it out alone"
 spn_order.2101.b.tt:0 "Fear is a teacher too. [spn_tp_tutee.GetSheHe|U] may learn more from tonight than from a month of lessons, or come away badly shaken."
 spn_order.2101.c:0 "Look to [spn_tp_tutor.GetFirstName]"
 spn_order.2101.c.tt:0 "[spn_tp_tutor.GetFirstName] steps in and finishes the working. You are grateful, and a little ashamed."
 spn_order.2101.d:0 "Finish it myself"
 spn_order.2101.d.tt:0 "You find the line again, or you do not. Either way you will not forget tonight."
 spn_order.2102.t:0 "A Question You Cannot Answer"
 spn_order.2102.desc_tutor:0 "[spn_tp_tutee.GetFirstName] asks you, in front of the chapter, why the third line must be said before the fourth and not after.\n\nYou open your mouth to answer and realise that nobody ever told you."
 spn_order.2102.desc_tutee:0 "You ask [spn_tp_tutor.GetTitledFirstName], in front of the chapter, why the third line must be said before the fourth and not after.\n\n[spn_tp_tutor.GetSheHe|U] opens [spn_tp_tutor.GetHerHis] mouth, closes it again, and the room goes quiet."
 spn_order.2102.a:0 "Work it out in front of them"
 spn_order.2102.a.success:0 "You Find the Answer"
 spn_order.2102.a.success_desc:0 "You reason it out aloud, line by line, and by the end the whole chapter understands it better than before. So do you."
 spn_order.2102.a.failure:0 "You Talk in Circles"
 spn_order.2102.a.failure_desc:0 "You talk for a long time and say nothing. [spn_tp_tutee.GetFirstName] goes away and works it out alone."
 spn_order.2102.b:0 "Admit I do not know"
 spn_order.2102.b.tt:0 "You say you do not know, and the two of you work it out together. [spn_tp_tutee.GetSheHe|U] respects you more for it."
 spn_order.2102.c:0 "Press the question"
 spn_order.2102.c.success:0 "You Find the Answer"
 spn_order.2102.c.success_desc:0 "Between the two of you, you work it out. [spn_tp_tutor.GetFirstName] says you have taught [spn_tp_tutor.GetHerHim] something today."
 spn_order.2102.c.failure:0 "You Pushed Too Hard"
 spn_order.2102.c.failure_desc:0 "Neither of you finds the answer, and [spn_tp_tutor.GetFirstName] does not thank you for asking in front of everyone."
 spn_order.2102.d:0 "Let it go"
 spn_order.2102.d.tt:0 "You change the subject. [spn_tp_tutor.GetFirstName] notices, and is grateful."
 spn_order.2103.t:0 "Where Were You Last Night?"
 spn_order.2103.desc_tutee:0 "[spn_tp_kin.GetTitledFirstName] was awake when you came home before dawn, and wants to know where you were. It is the third time this month.\n\n[spn_tp_kin.GetSheHe|U] has noticed the ink on your fingers and the smell of candle smoke, and [spn_tp_kin.GetSheHe] is not going to let it go."
 spn_order.2103.desc_tutor:0 "[spn_tp_kin.GetTitledFirstName] comes to see you. [spn_tp_tutee.GetFirstName] comes home before dawn smelling of candle smoke, and has been seen at your door.\n\n[spn_tp_kin.GetSheHe|U] wants to know why."
 spn_order.2103.a:0 "Tell [spn_tp_kin.GetHerHim] a good lie"
 spn_order.2103.a.success:0 "[spn_tp_kin.GetSheHe|U] Believes You"
 spn_order.2103.a.success_desc:0 "A friend's illness, a long game of dice. [spn_tp_kin.GetFirstName] is satisfied, and asks no more."
 spn_order.2103.a.failure:0 "[spn_tp_kin.GetSheHe|U] Does Not Believe You"
 spn_order.2103.a.failure_desc:0 "[spn_tp_kin.GetFirstName] hears you out, says nothing, and watches you more closely from now on."
 spn_order.2103.b:0 "Tell [spn_tp_kin.GetHerHim] nothing"
 spn_order.2103.b.tt:0 "You keep the Order's silence. [spn_tp_kin.GetFirstName] will not like it."
 spn_order.2103.c:0 "Cover for [spn_tp_tutee.GetFirstName]"
 spn_order.2103.c.success:0 "[spn_tp_kin.GetSheHe|U] Believes You"
 spn_order.2103.c.success_desc:0 "Lessons in letters, you say, and the hour is the only one either of you has free. [spn_tp_kin.GetFirstName] goes home satisfied."
 spn_order.2103.c.failure:0 "[spn_tp_kin.GetSheHe|U] Does Not Believe You"
 spn_order.2103.c.failure_desc:0 "[spn_tp_kin.GetFirstName] leaves without a word. You have not heard the last of this."
 spn_order.2103.d:0 "Send [spn_tp_kin.GetHerHim] away"
 spn_order.2103.d.tt:0 "You keep the Order's silence. [spn_tp_kin.GetFirstName] will not like it."
 spn_order.0170.desc_county:0 "Someone has learned that [spn_ex_who.GetTitledFirstName] wears the Blue Rose, and word is moving in [spn_ex_county.GetName]. [spn_respondeo|E] spoken there would make them forget."
 spn_order.0170.send:0 "Send [spn_rs_agent.GetFirstName] to answer it"
 spn_order.0170.send.tt:0 "[spn_rs_agent.GetTitledFirstName] will go to [spn_ex_county.GetName] and speak the words. A Powder, [spn_rs_agent.GetHerHis] temple or [spn_rs_agent.GetSheHe] pays for it, not you. [spn_rs_agent.GetSheHe|U] may refuse."
 spn_order.0170.a.tt:0 "Stand in that county and use [spn_respondeo|E]. It will make them forget [spn_ex_who.GetFirstName] too."
 spn_order.0170.c:0 "Let it lie"
 spn_order.0170.c.tt:0 "Nothing is done. Word goes on moving, and the trail stays where it is."
 spn_order.0180.a_powder:0 "Use the Obfuscation Powder"
 spn_order_respondeo_powder_tt:0 "An Obfuscation Powder is spent: your own, or else one your temple's [spn_reliquary|E] keeps, whose keeper is told."
 spn_order_respondeo_rehide_tt:0 "The member who was exposed there is forgotten too. Only the temple knows [spn_rs_rehide.GetHerHim] again."
 spn_order_toast_respondeo_sent:0 "The Masks Sent Someone"
 spn_order_toast_respondeo_sent_desc:0 "[spn_rs_exposed.GetTitledFirstName] was seen for what [spn_rs_exposed.GetSheHe] is in [spn_rs_county.GetName]. While you were busy, your temple sent [spn_rs_agent.GetTitledFirstName] to speak [spn_respondeo|E] there."
 spn_order_toast_respondeo_nobody_desc:0 "[spn_rs_exposed.GetTitledFirstName] was seen for what [spn_rs_exposed.GetSheHe] is. Nobody could be sent to answer it."
 spn_order_toast_respondeo_done:0 "[spn_rs_county.GetName] Has Forgotten"
 spn_order_toast_respondeo_done_desc:0 "[spn_rs_agent.GetTitledFirstName] spoke [spn_respondeo|E] in [spn_rs_county.GetName]. It cost you nothing."
 spn_order_toast_respondeo_unpaid:0 "No One Could Pay"
 spn_order_toast_respondeo_unpaid_desc:0 "[spn_rs_agent.GetTitledFirstName] went to [spn_rs_county.GetName], but neither [spn_rs_agent.GetSheHe] nor [spn_rs_agent.GetHerHis] temple had the power to pay for [spn_respondeo|E]."
 spn_order_toast_respondeo_refused:0 "An Order Refused"
 spn_order_toast_respondeo_refused_desc:0 "[spn_rs_refuser.GetTitledFirstName] would not go to [spn_rs_county.GetName] to speak [spn_respondeo|E] for you."
 spn_order.2120.t:0 "Word from Your Temple Magus"
 spn_order.2120.t_gm:0 "Word from the Grand Magus"
 spn_order.2120.desc:0 "[spn_rs_commander.GetTitledFirstName] has sent you to [spn_rs_county.GetName]. [spn_rs_exposed.GetTitledFirstName] was seen there for what [spn_rs_exposed.GetSheHe] is, and you are the nearest who can speak the words.\n\n[Glossary('Respondeo','spn_gloss_respondeo')] spoken there would make the county forget, [spn_rs_exposed.GetHerHim] included."
 spn_order.2120.cannot:0 "I cannot pay for it"
 spn_order.2120.cannot.tt:0 "You have no Powder, not enough power, and your temple cannot pay with you. [spn_rs_commander.GetFirstName] is told."
 spn_order.2120.refuse:0 "I will not go"
 spn_order.2120.refuse.tt:0 "You lose [spn_order_standing|E], and [spn_rs_commander.GetFirstName] will remember it."
 spn_order_refused_command_opinion:0 "Refused My Command"
 spn_council_draw_funds_decision:0 "Draw on the Council's Treasury"
 spn_council_draw_funds_decision_desc:0 "The [spn_gnostic_council|E] keeps its treasury in common, and every seat holds a key to it. In need you may take from it, and the other seats will see in the ledger that you did."
 spn_council_draw_funds_decision_tooltip:0 "Take gold from the [spn_gnostic_council|E]'s treasury."
 spn_council_draw_funds_decision_confirm:0 "Open the ledger"
 spn_council_draw_funds_decision_effect_tt:0 "You choose how much to take: 100, 500 or 1,000 gold, as far as the treasury can cover it."
 spn_council_draw_funds_offence_tt:0 "Each other seat of the council will think a little less of you for it."
 spn_council_toast_funds_drawn:0 "Gold Taken From the Treasury"
 spn_council_toast_funds_drawn_desc:0 "[spn_cdf_magus.GetTitledFirstName] took [spn_cdf_gold.GetValue|0] gold from the council's treasury."
 spn_council_drew_funds_opinion:0 "Took From the Treasury"
 spn_council_toast_funds_late:0 "Nothing Taken From the Treasury"
 spn_council_toast_funds_late_desc:0 "The ledger no longer allows it: the treasury holds less than you meant to take, or you have drawn on it in the last two years. You took nothing."
 spn_council_reveal_decision:0 "Reveal the Gnostic Council"
 spn_council_reveal_decision_desc:0 "The council has met in secret since before anyone remembers. You may end that, and let the world know it exists."
 spn_council_reveal_decision_tooltip:0 "Make the [spn_gnostic_council|E] known to the world."
 spn_council_reveal_decision_confirm:0 "Reveal it"
 spn_council_reveal_decision_effect_tt:0 "Every ruler will learn the council exists, and may fund it. Witch hunters will take an interest in its members."
 spn_council_reveal_break_tt:0 "Anyone may now try to break the [spn_order|E]."
 spn_council_reveal_recommended_tt:0 "[spn_crv_by.GetTitledFirstName] recommended it."
 spn_ev10.90.b_tt:0 "You put it to the Grand Magus. Whether the council reveals itself is the Grand Magus's decision."
 spn_ev10.91.weigh:0 "I will weigh it"
 spn_ev10.91.weigh_tt:0 "Nothing is decided tonight. You can reveal the council whenever you choose, with Reveal the Gnostic Council."
 spn_order.0101.desc_pillow_open:0 "When you go to bed there is a folded note on your pillow, sealed with blue wax, and a blue rose beside it. The shutters are barred from the inside, and nobody in the house saw anyone come in.\n\n"
 spn_order.0101.desc_market_open:0 "In the market a woman in a grey hood presses a note into your hand and is gone into the crowd before you can see her face. A blue rose is pinned to the paper.\n\n"
 spn_order.0101.desc_book_open:0 "You open the book you were reading last night. Between the pages is a note you did not put there, and a pressed blue rose. The ink is still wet.\n\n"
 spn_order.0101.desc_letter_seat:0 ""We have watched you for a long time. You see what others miss, and you want to know more than the world will teach you. We can show you. Come to the old chapel outside [spn_pl_seat.GetName] at the next new moon. Come alone, and tell no one."\n\nThere is no name at the bottom, only a small blue rose drawn in ink."
 spn_order.0101.desc_letter:0 ""We have watched you for a long time. You see what others miss, and you want to know more than the world will teach you. We can show you. Come to the old chapel at the next new moon. Come alone, and tell no one."\n\nThere is no name at the bottom, only a small blue rose drawn in ink."
 spn_order.0102.desc_open_seat:0 "The old chapel outside [spn_pl_seat.GetName] has not held a service in living memory. Half its roof is gone and the door stands open. Inside it is dark and smells of wet stone, and you wait a long time, alone, wondering if this is a joke.\n\nThen every candle lights at once. A ring of people in grey cloaks and white masks stands around you, much closer than you thought. One of them steps forward. You cannot see a face, but you know this is the one in charge.\n\n"
 spn_order.0102.desc_open_hall:0 "The note said the old chapel, but a servant is waiting at its door. Without a word he leads you back into town, to the [Glossary('Collegium','spn_gloss_collegium')] in [spn_pl_hall.GetName], through a library closed for the night, and behind a bookcase where a stair goes down.\n\nAt the bottom every candle lights at once. A ring of people in grey cloaks and white masks stands around you. One of them steps forward, and you know this is the one in charge.\n\n"
 spn_order.0110.desc_call:0 "The first test comes at dusk, with a masked figure at your door who says only where, and by when.\n\n"
 spn_order.0110.desc_tomb_place:0 "Beneath the old chapel is a tomb that was sealed before the chapel had a roof. Somewhere inside it is a coin stamped with a rose. Bring it back before dawn.\n\nThe stairs are broken, you have one candle, and you can hear that you are not the only one down there."
 spn_order.0110.desc_tower_place:0 "Before you came, one of the masks climbed the chapel's bell tower and left a coin stamped with a rose on the ledge beneath the bell. Bring it down before dawn, and do not wake the old sexton who sleeps at the tower's foot.\n\nThe door is locked and the wall is high. Nobody tells you why it has to be the tower, and you begin to suspect the climb is not the test."
 spn_order.0110.desc_mill_seat:0 "On the river below [spn_pl_seat.GetName] an old mill still turns, though no miller has worked it for years. Someone has nailed a coin stamped with a rose to its wheel. Bring it back before dawn.\n\nThe wheel never stops, the water is fast and cold, and you are not the only one looking."
 spn_order.0110.desc_mill_place:0 "On the river nearby an old mill still turns, though no miller has worked it for years. Someone has nailed a coin stamped with a rose to its wheel. Bring it back before dawn.\n\nThe wheel never stops, the water is fast and cold, and you are not the only one looking."
 spn_order.0110.desc_cage_place:0 "The masks lead you down a stair behind the chapel's altar to a cellar. At the far end stands an iron cage, and something large is breathing inside it. A coin with a rose on it lies in the straw by its feet. Bring it back before dawn.\n\nThere is dried blood on the bars. Whoever tried before you did not stop to think."
 spn_order.0120.desc_1_seat:0 "This is the second test, though no one tells you so. A week ago a mask gave you a key and an address in [spn_pl_seat.GetName], an empty house near the market, and one instruction: sweep its floors every night until you are told to stop. Tonight a man steps in out of the rain and asks what you are doing there so late.\n\nHe looks like someone who will remember your answer."
 spn_order.0120.desc_2_seat:0 "This is the second test, though no one tells you so. A week ago a mask gave you a key and an address in [spn_pl_seat.GetName], an empty house by the walls, and one instruction: light every candle in it at midnight and put them out at dawn. Tonight the watchman sees the light and comes to the door, and asks what you are doing there at this hour.\n\nHe looks like someone who will remember your answer."
 spn_order.0120.desc_3_seat:0 "This is the second test, though no one tells you so. A week ago a mask gave you a key and an address in [spn_pl_seat.GetName], an empty house down a blind alley, and one instruction: wait there in the dark each night until someone comes. Tonight a stranger finds you there and asks who you are waiting for.\n\nHe looks like someone who will remember your answer."
 spn_order.0130.desc_1_seat:0 "They come for you at midnight and blindfold you at the door. You count the steps going down: far more than the chapel's cellar could hold. When the blindfold comes off you are in the temple beneath [spn_pl_seat.GetName], a long room of candles under a painted ceiling, and every mask of the chapter is there. The [spn_temple_magus|E] steps forward and holds out a blue rose.\n\n"
 spn_order.0140.desc_tutor:0 "For years [spn_pl_tutor.GetFirstName] has made you repeat the same words every night, in the same cold room beneath the temple, until you could say them in your sleep. Tonight, when you say them, the candle in front of you goes out.\n\nThen every candle in the room goes out. When they light again, [spn_pl_tutor.GetFirstName] is smiling, and you can feel the power still in your hands."
 spn_order.0140.desc_craft_tutor:0 "You knew your own craft before you came to the Order. For years [spn_pl_tutor.GetFirstName] has made you repeat the Order's words, every night, in the same cold room beneath the temple. Tonight, when you say them, every candle in the room goes out.\n\nWhen they light again, [spn_pl_tutor.GetFirstName] is smiling, and you understand how the Order works its magic. It is not your way, but you know it now."
 spn_order.0090.desc_sought:0 "Three days after you left the rose on the library steps, it was gone. Tonight a boy you have never seen hands your steward a sprig of rosemary tied with blue thread, says it is for you, and runs before anyone can ask who sent him. Wrapped around the stem is a strip of paper with a name on it: the [Glossary('Hermetic','spn_gloss_hermetic')] Order of the Blue Rose.\n\nA rose for a rose. Someone was watching after all."
 spn_order_toast_sought_withered:0 "The Rose Withered"
 spn_order_toast_sought_withered_desc:0 "More than a year has passed since you left the rose, and no note has come. Whoever took it has forgotten you. You may leave another."
 spn_order_research_help_helper_tt:0 "[spn_rh_helper.GetTitledFirstName] will be the one who comes, and earns [spn_order_standing|E] for it."
 spn_order_toast_research_helped_desc:0 "[spn_rh_helper.GetTitledFirstName] came to your study with a lantern and no questions. By morning your notes were covered in a second hand, and the work had moved on."
 spn_council_draw_funds_has_gold_tt:0 "The council's treasury holds at least 100 gold"
 spn_council_draw_funds_recent_tt:0 "You have not drawn on the treasury in the last two years"
 spn_order.2130.t:0 "The Council's Treasury"
 spn_order.2130.desc:0 "The council's ledger is kept in a cipher only the seats can read. Tonight it shows $mc_gold$ gold in the common treasury.\n\nWhatever you take, the other seats will read in the ledger the next time they open it."
 spn_order.2130.a:0 "Take 100 gold"
 spn_order.2130.b:0 "Take 500 gold"
 spn_order.2130.c:0 "Take 1,000 gold"
 spn_order.2130.d:0 "Close the ledger"
 spn_order.2130.d.tt:0 "You take nothing, and may open it again whenever you choose."
 spn_council_ask_research_funding_interaction:0 "Ask the Grand Magus to Fund Your Research"
 spn_council_ask_research_funding_interaction_desc:0 "Write to the Grand Magus and ask for gold from the [spn_gnostic_council|E]'s treasury toward your research."
 spn_council_ask_research_funding_considers_tt:0 "The Grand Magus will read your letter and decide."
 spn_council_research_reason_tt:0 "You are a Mage, or you are taking part in a Magical Research"
 spn_council_research_fund_held_tt:0 "You do not already have a Research Fund"
