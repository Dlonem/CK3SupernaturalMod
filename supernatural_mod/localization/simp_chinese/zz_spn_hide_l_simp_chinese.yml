 spn_wound_incubation.9000.f:0 "Reach for the hide."
 spn_wound_incubation.9000.f.tt:0 "The hide pulls you through. You become a werewolf, you gain [GetTrait('strong').GetName( GetNullCharacter )], and you come out of the fever as strong as it can make you."
 spn_wound_incubation.0060.t:0 "It Lies Beside the Bed"
 spn_wound_incubation.0060.desc:0 "Someone has left a hide beside your bed. Nobody will say who. It is warm, and when the fever is worst you find your hand on it.\n\nIt does not cool you. It makes the burning feel like it is going somewhere."
 spn_wound_incubation.0060.a:0 "Keep it close."
 spn_wound_incubation.0060.a.tt:0 "The change comes on a little faster, and you rest a little easier."
 spn_wound_incubation.0060.b:0 "Have it taken away."
 spn_the_prowl_pack_tt:0 "You can Challenge any werewolf or hybrid you know, in your own [spn_pack|E] or outside it."
