 spn_pack_mentality_pack_tt:0 "Your pack's strength in numbers counts half again for you."
 spn_wolf_politics_pack_tt:0 "Leaving a pack costs you half the usual [spn_pack_standing|E], and, as an alpha, you can Lure Away wolves from other packs."
 spn_ev4.0.title:0 "The Ringing"
 spn_ev4.0.desc:0 "A thin, high note starts in your ear and does not stop. Nobody else in the room hears it.\n\nSomeone close by is working magic. The hide knows it, and now so do you."
 spn_ev4.0.ring:0 "Follow the ringing."
 spn_ev4.0.ring.tt:0 "You go after the one who cast it, and learn who they are. You can only do this once a year."
 spn_ev4b.0.go:0 "Go after them."
