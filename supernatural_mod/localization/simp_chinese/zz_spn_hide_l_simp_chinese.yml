l_simp_chinese:
 trait_spn_champion_silverback:0 "Champion of Silverback"
 trait_spn_champion_silverback_desc:0 "Chosen by Silverback, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Silverback's - grey as smoke.\n\nThe strongest of the six. It stands between the weak and what would hurt them."
 trait_spn_champion_silverback_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Silverback, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Silverback's - grey as smoke.\n\nThe strongest of the six. It stands between the weak and what would hurt them."
 trait_spn_champion_timber:0 "Champion of Timber"
 trait_spn_champion_timber_desc:0 "Chosen by Timber, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Timber's - brown as bark.\n\nThe loner. Alone in the woods it is at its strongest, and it is hard to find."
 trait_spn_champion_timber_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Timber, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Timber's - brown as bark.\n\nThe loner. Alone in the woods it is at its strongest, and it is hard to find."
 trait_spn_champion_tundra:0 "Champion of Tundra"
 trait_spn_champion_tundra_desc:0 "Chosen by Tundra, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Tundra's - white as snow.\n\nThe patient one. Its champions talk their way out of what others fight."
 trait_spn_champion_tundra_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Tundra, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Tundra's - white as snow.\n\nThe patient one. Its champions talk their way out of what others fight."
 trait_spn_champion_graybeard:0 "Champion of Graybeard"
 trait_spn_champion_graybeard_desc:0 "Chosen by Graybeard, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Graybeard's - ash-grey and scarred.\n\nThe most fearless. Its champions do not step back, and their soldiers do not either."
 trait_spn_champion_graybeard_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Graybeard, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Graybeard's - ash-grey and scarred.\n\nThe most fearless. Its champions do not step back, and their soldiers do not either."
 trait_spn_champion_midnight:0 "Champion of Midnight"
 trait_spn_champion_midnight_desc:0 "Chosen by Midnight, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Midnight's - black.\n\nThe most savage. The world can feel what its champion is."
 trait_spn_champion_midnight_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Midnight, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Midnight's - black.\n\nThe most savage. The world can feel what its champion is."
 trait_spn_champion_alpha:0 "Champion of Alpha"
 trait_spn_champion_alpha_desc:0 "Chosen by Alpha, one of the six hides. Its spirit lives in this character, and when they take the wolf's shape, the wolf is Alpha's - red-brown and huge.\n\nThe leader's hide, lost for decades. It takes only a leader, and the leader's pack grows faster for it."
 trait_spn_champion_alpha_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] was chosen by Alpha, one of the six hides, and its spirit is in [ROOT.Char.GetHerHim]. When [ROOT.Char.GetSheHe] takes the wolf's shape, the wolf is Alpha's - red-brown and huge.\n\nThe leader's hide, lost for decades. It takes only a leader, and the leader's pack grows faster for it."
 trait_spn_true_alpha:0 "True Alpha"
 trait_spn_true_alpha_desc:0 "An alpha who rose without a killing, by what they are. Every wolf in their pack is stronger for it, and their [spn_pack_standing|E] never falls below 75. It happens once in a hundred years."
 trait_spn_true_alpha_character_desc:0 "An alpha who rose without a killing, by what [ROOT.Char.GetSheHe] is. Every wolf in [ROOT.Char.GetHerHis] pack is stronger for it, and [ROOT.Char.GetHerHis] [spn_pack_standing|E] never falls below 75. It happens once in a hundred years."
 trait_track_hide_bond:0 "Hide Bond"
 spn_hide_tongue_toast_t:0 "The Hide Speaks Your Tongue"
 decision_group_type_supernatural:0 "Supernatural Decisions"
 spn_hide_tongue_toast_tt:0 "Whoever wears your hide after you will speak your language."
 trait_track_hide_bond_desc:0 "How deep the hide's spirit has gone into you. It grows a little every year you wear the hide, more if you run with a [spn_pack|E], and when you answer the hide, beat a hunter or fight; it falls when you take the hide off. At 25 the hide learns your tongue. Its voice speaks at 20, 40, 60, 80 and 100."
 spn_hide_silverback_modifier:0 "Silverback"
 spn_hide_silverback_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_silverback_modifier:0 "A Relic Kept Here: Silverback"
 spn_hide_relic_kept_silverback_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_timber_modifier:0 "Timber"
 spn_hide_timber_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_timber_modifier:0 "A Relic Kept Here: Timber"
 spn_hide_relic_kept_timber_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_tundra_modifier:0 "Tundra"
 spn_hide_tundra_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_tundra_modifier:0 "A Relic Kept Here: Tundra"
 spn_hide_relic_kept_tundra_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_graybeard_modifier:0 "Graybeard"
 spn_hide_graybeard_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_graybeard_modifier:0 "A Relic Kept Here: Graybeard"
 spn_hide_relic_kept_graybeard_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_midnight_modifier:0 "Midnight"
 spn_hide_midnight_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_midnight_modifier:0 "A Relic Kept Here: Midnight"
 spn_hide_relic_kept_midnight_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_alpha_modifier:0 "Alpha"
 spn_hide_alpha_modifier_desc:0 "The hide's power, for its own [spn_champion|E]."
 spn_hide_relic_kept_alpha_modifier:0 "A Relic Kept Here: Alpha"
 spn_hide_relic_kept_alpha_modifier_desc:0 "The faithful here keep an old skin as a holy relic and touch it on holy days. Wolves know what it really is."
 spn_hide_known_dread_modifier:0 "Wears One of the Six"
 spn_hide_known_dread_modifier_desc:0 "Everyone knows what [ROOT.Char.GetSheHe] is, and what [ROOT.Char.GetSheHe] wears."
 spn_hide_known_dread_timber_modifier:0 "Wears One of the Six"
 spn_hide_known_dread_timber_modifier_desc:0 "Everyone knows what [ROOT.Char.GetSheHe] is, and what [ROOT.Char.GetSheHe] wears. Timber's champions are hard to find, which makes them harder to forget."
 spn_pack_modifier:0 "Runs With a Pack"
 spn_pack_modifier_desc:0 "Wolves are stronger together. The bigger the [spn_pack|E], the stronger each wolf in it."
 spn_pack_modifier_scale_desc:0 "Wolves in the pack"
 spn_pack_mentality_modifier:0 "Pack Mentality"
 spn_pack_mentality_modifier_desc:0 "The pack's strength in numbers counts half again for this wolf."
 spn_two_spirits_modifier:0 "Two Spirits Run Together"
 spn_two_spirits_modifier_desc:0 "Two of the six hides run in this [spn_pack|E]."
 spn_old_ones_gather_modifier:0 "The Old Ones Gather"
 spn_old_ones_gather_modifier_desc:0 "Three or more of the six hides run in this [spn_pack|E]. The woods have not seen that in a long time."
 spn_alone_in_the_woods_modifier:0 "Alone in the Woods"
 spn_hide_ageless_modifier:0 "Ageless Wolf"
 spn_hide_ageless_modifier_desc:0 "The hide cannot give years to one who does not age, so it feeds the wolf instead."
 spn_alone_in_the_woods_modifier_desc:0 "Timber's champion runs alone, as Timber always has, and is harder to find for it."
 spn_evolved_modifier:0 "Evolved"
 spn_evolved_modifier_desc:0 "This wolf's [spn_pack|E] was joined by the Unification. It is more than it was."
 spn_hybrid_gift_modifier:0 "The Hybrid's Gift"
 spn_hybrid_gift_modifier_desc:0 "A hybrid alpha's power passed down through the Unification to every wolf in the pack."
 spn_hold_the_line_modifier:0 "Hold the Line"
 spn_hold_the_line_modifier_desc:0 "Graybeard does not step back. Neither do the men behind its champion."
 spn_let_it_take_me_modifier:0 "Let It Take Me"
 spn_let_it_take_me_modifier_desc:0 "Midnight has been let all the way out. In the next battle it will kill twice as many, and when the battle ends it will leave its champion wrung out."
 spn_hide_feud_opinion:0 "Hide Feud"
 spn_kindred_blood_opinion:0 "Kindred Blood"
 spn_lured_away_opinion:0 "Lured My Wolf Away"
 spn_left_my_pack_opinion:0 "Left My Pack"
 spn_challenge_lost_opinion:0 "Beat Me in a Challenge"
 spn_blood_pact_opinion:0 "Blood Pact"
 spn_shrine_thief_opinion:0 "Tried to Steal the Relic"
 spn_true_alpha_rose_opinion:0 "The True Alpha"
 spn_pack_truce_opinion:0 "Pack Truce"
 artifact_spn_hide:0 "Hide"
 spn_hide_silverback_name:0 "Silverback"
 spn_hide_silverback_desc:0 "An old grey wolf skin that smells of smoke and cedar. It is heavier than it looks. It is Silverback, one of the six hides. A hide does not make a wolf. It answers one.\n\nSilverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_silverback_desc_christopher:0 "An old grey wolf skin that smells of smoke and cedar. It is heavier than it looks. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nSilverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_timber_name:0 "Timber"
 spn_hide_timber_desc:0 "A brown wolf skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. It is Timber, one of the six hides. A hide does not make a wolf. It answers one.\n\nTimber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_timber_desc_christopher:0 "A brown wolf skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nTimber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_tundra_name:0 "Tundra"
 spn_hide_tundra_desc:0 "A white wolf skin, cold to the touch in any weather. It is Tundra, one of the six hides. A hide does not make a wolf. It answers one.\n\nTundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_tundra_desc_christopher:0 "A white wolf skin, cold to the touch in any weather. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nTundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_graybeard_name:0 "Graybeard"
 spn_hide_graybeard_desc:0 "An ash-grey wolf skin crossed with old scars that never closed. It is Graybeard, one of the six hides. A hide does not make a wolf. It answers one.\n\nGraybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide_graybeard_desc_christopher:0 "An ash-grey wolf skin crossed with old scars that never closed. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nGraybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide_midnight_name:0 "Midnight"
 spn_hide_midnight_desc:0 "A black wolf skin. It is warm before anyone touches it. It is Midnight, one of the six hides. A hide does not make a wolf. It answers one.\n\nMidnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide_midnight_desc_christopher:0 "A black wolf skin. It is warm before anyone touches it. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nMidnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide_alpha_name:0 "Alpha"
 spn_hide_alpha_desc:0 "A great red-brown wolf skin. Dogs lie down when it is carried past. It is Alpha, one of the six hides. A hide does not make a wolf. It answers one.\n\nAlpha looks for a champion who is [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] or [GetTrait('arrogant').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] or [GetTrait('craven').GetName( GetNullCharacter )]."
 spn_hide_alpha_desc_christopher:0 "A great red-brown wolf skin. Dogs lie down when it is carried past. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nAlpha looks for a champion who is [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] or [GetTrait('arrogant').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] or [GetTrait('craven').GetName( GetNullCharacter )]."
 story_spn_pack:0 "Pack"
 story_spn_pack_desc:0 "A [spn_pack|E] of wolves and the alpha they follow."
 story_spn_pack_membership:0 "Pack"
 story_spn_pack_membership_desc:0 "The [spn_pack|E] you run with."
 spn_pack_story_string:0 "Wolves run stronger together. Every wolf in the [spn_pack|E] gains from its size; the [spn_alpha|E] leads it and the [spn_second|E] stands next in line. A wolf who leaves loses [spn_pack_standing|E].\n\nThe pack has [Story.MakeScope.Var('spn_pack_size').GetValue|0] of a possible 25 wolves."
 SPN_PACK_ALPHA:0 "Alpha"
 SPN_PACK_SECOND:0 "Second"
 SPN_PACK_CO_ALPHA:0 "Co-Alpha"
 SPN_PACK_CHAMPIONS:0 "Champions of the Six"
 SPN_PACK_MEMBERS:0 "The Pack"
 spn_let_the_wolf_run_decision:0 "Let the Wolf Run"
 spn_let_the_wolf_run_decision_desc:0 "When you go to war, the hide goes with you - not as a man with a sword, but as what it is."
 spn_let_the_wolf_run_decision_tooltip:0 "Let the hide fight in your battles."
 spn_let_the_wolf_run_decision_confirm:0 "Let it run"
 spn_let_the_wolf_run_decision_effect_tt:0 "In battle the hide kills a few of the enemy's knights each time, and fights any other champion on the field first. Someone may see what you are."
 spn_hold_the_wolf_back_decision:0 "Hold the Wolf Back"
 spn_hold_the_wolf_back_decision_desc:0 "You fight as a man. The hide stays quiet in battle, and nobody sees anything."
 spn_hold_the_wolf_back_decision_tooltip:0 "Keep the hide out of your battles."
 spn_hold_the_wolf_back_decision_confirm:0 "Hold it back"
 spn_hold_the_wolf_back_decision_effect_tt:0 "The hide does not fight in your battles."
 spn_vanish_decision:0 "Vanish"
 spn_vanish_decision_desc:0 "Timber shows you how a trail goes cold. The trail you left here will be gone by morning."
 spn_vanish_decision_tooltip:0 "Clear the trail you left in this county."
 spn_vanish_decision_confirm:0 "Vanish"
 spn_vanish_no_trail_tt:0 "There is a trail here that names you"
 spn_vanish_hunt_running_tt:0 "No hunter is already working this county"
 spn_hold_the_line_decision:0 "Hold the Line"
 spn_hold_the_line_decision_desc:0 "Graybeard does not step back, and for a year neither will the men behind you."
 spn_hold_the_line_decision_tooltip:0 "Graybeard holds the line."
 spn_hold_the_line_decision_confirm:0 "Hold"
 spn_let_it_take_me_decision:0 "Let It Take Me"
 spn_let_it_take_me_decision_desc:0 "Let Midnight all the way out. In your next battle it will kill twice as many - and when the battle is over, it will leave you wrung out."
 spn_let_it_take_me_decision_tooltip:0 "Let Midnight out."
 spn_let_it_take_me_decision_confirm:0 "Let it take me"
 spn_let_it_take_me_decision_effect_tt:0 "In your next battle the hide kills twice as many. When the battle ends, you suffer major [stress|E]."
 spn_let_it_take_me_runs_tt:0 "You have let the wolf run"
 spn_call_the_packs_decision:0 "Call the Packs"
 spn_call_the_packs_decision_desc:0 "Alpha wants the scattered packs called together. For a year, every alpha within reach will hear you, and those who come owe you."
 spn_call_the_packs_decision_tooltip:0 "Call every pack within reach to a Werewolf Gathering."
 spn_call_the_packs_decision_confirm:0 "Call them"
 spn_call_the_packs_decision_effect_tt:0 "For a year you may invite every alpha within reach to a [werewolf_gathering|E], and each alpha who comes owes you a favor."
 spn_call_the_packs_cooldown_tt:0 "You have not held a [werewolf_gathering|E] in the last five years"
 spn_send_for_hide_decision:0 "Send for a Hide"
 spn_send_for_hide_decision_desc:0 "You know where a hide is kept. Send someone to bring it back, however far away it is."
 spn_send_for_hide_decision_tooltip:0 "Send someone to steal a hide from the shrine where it is kept."
 spn_send_for_hide_decision_confirm:0 "Send someone"
 spn_send_for_hide_busy_tt:0 "You do not already have someone on the road"
 spn_send_for_hide_caught_tt:0 "You have not been caught stealing from a shrine in the last five years"
 spn_send_for_hide_decision_effect_tt:0 "Choose which hide to send for. The farther away it is kept, the longer you wait for word."
 spn_take_hide_from_shrine_decision:0 "Take the Hide from the Shrine"
 spn_take_hide_from_shrine_decision_desc:0 "The holy relic kept in your own lands is no relic. Take it down."
 spn_take_hide_from_shrine_decision_tooltip:0 "Take the hide down from the shrine."
 spn_take_hide_from_shrine_decision_confirm:0 "Take it"
 spn_found_pack_decision:0 "Found a Pack"
 spn_found_pack_decision_desc:0 "Gather the wolves who will follow you and lead them as their alpha."
 spn_found_pack_decision_tooltip:0 "Found a [spn_pack|E] and lead it."
 spn_found_pack_decision_confirm:0 "Found it"
 spn_found_pack_standing_tt:0 "You are a [spn_champion|E], or your [spn_pack_standing|E] is 50 (40 with Pack Leader, or for a wolf born a wolf)"
 spn_leave_pack_decision:0 "Leave the Pack"
 spn_leave_pack_decision_desc:0 "Walk away from your pack. It will cost you [spn_pack_standing|E], and your alpha will not like it."
 spn_leave_pack_decision_tooltip:0 "Leave your [spn_pack|E]."
 spn_leave_pack_decision_confirm:0 "Leave"
 spn_disband_pack_decision:0 "Disband the Pack"
 spn_disband_pack_decision_desc:0 "Send every wolf in your pack its own way. No wolf loses anything by it."
 spn_disband_pack_decision_tooltip:0 "Disband your [spn_pack|E]."
 spn_disband_pack_decision_confirm:0 "Disband it"
 spn_abandon_hide_warning_tt:0 "The hide lets go of you. You keep the skin, but you are no longer its [spn_champion|E]."
 spn_stand_over_them_interaction:0 "Stand Over Them"
 spn_stand_over_them_interaction_desc:0 "Silverback guards the ones in its champion's care. For five years, a hunter who comes for them will find you in the doorway."
 spn_stand_over_them_interaction_tt:0 "If a hunter comes for [recipient.GetShortUIName] in the next five years, [recipient.GetSheHe] can call on you to fight in [recipient.GetHerHis] place."
 spn_read_them_interaction:0 "Read Them"
 spn_read_them_interaction_desc:0 "Tundra reads a face the way a scholar reads a page. Learn one thing they are hiding."
 spn_read_them_nothing_tt:0 "There is nothing left to find"
 spn_ask_to_unbind_interaction:0 "Ask to Unbind the Hide"
 spn_ask_to_unbind_interaction_desc:0 "Ask a great mage to take the hide's spirit out of you. It will hurt, and it will cost you 150 gold."
 spn_ask_to_unbind_interaction_notification:0 "[actor.GetShortUIName|U] asks you to unbind a hide's spirit from [actor.GetHerHim]."
 spn_ask_to_unbind_gold_tt:0 "You have 150 gold"
 spn_ask_to_unbind_power_tt:0 "The mage has the power to spare"
 spn_invite_to_pack_interaction:0 "Invite to the Pack"
 spn_invite_to_pack_interaction_desc:0 "Invite this wolf to run with your [spn_pack|E]."
