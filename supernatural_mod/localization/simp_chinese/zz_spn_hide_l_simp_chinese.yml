 rule_spn_hides_rule:0 "Supernatural: The Six Hides"
 setting_spn_hides_off:0 "Off"
 setting_spn_hides_off_desc:0 "No hide is ever created."
 setting_spn_hides_lost:0 "Lost"
 setting_spn_hides_lost_desc:0 "All six hides are lost when the game begins. Each wakes in its own time and goes looking for a wolf."
 setting_spn_hides_scattered:0 "Default (Scattered)"
 setting_spn_hides_scattered_desc:0 "Alpha is lost. One hide is worn by a werewolf who fits it, if one exists; the rest are kept in shrines as holy relics."
 setting_spn_hides_awakened:0 "Awakened"
 setting_spn_hides_awakened_desc:0 "Every hide but Alpha starts on a werewolf who fits it."
 rule_spn_packs_rule:0 "Supernatural: Packs"
 setting_spn_packs_on:0 "Default (On)"
 setting_spn_packs_on_desc:0 "Wolves can found and join packs, rise in Pack Standing, and feud between packs."
 setting_spn_packs_off:0 "Off"
 setting_spn_packs_off_desc:0 "No packs. The Werewolf Gathering still runs, with a smaller council."
 game_concept_spn_six_hides:0 "The Six Hides"
 game_concept_spn_six_hides_desc:0 "Six ancient wolf hides, each with a spirit and a will of its own: Silverback, Timber, Tundra, Graybeard, Midnight and Alpha. A hide chooses its [spn_champion|E] and goes into them. Put one on and it decides within days: it will take a wolf who has one of the traits it looks for and more of those than of the traits it turns from, or a wolf deep enough in the blood. The packs call them the First Six; the faithful keep them as relics; the witches say they are six souls sewn into skins.\n\nA hide does not make a wolf. It answers one."
 game_concept_spn_champion:0 "Champion"
 game_concept_spn_champion_desc:0 "A wolf a hide has chosen. The hide's spirit is in them: they are stronger, they live longer, old age cannot break them, they hear magic, and when they take the wolf's shape the wolf is the hide's. Only death, a mage's unbinding or losing the wolf's blood can take a hide from its champion."
 game_concept_spn_hide_bond:0 "Hide Bond"
 game_concept_spn_hide_bond_desc:0 "How deep a hide's spirit has gone into its [spn_champion|E]. It grows a little every year the hide is worn, and faster in a [spn_pack|E]. It also grows when the champion answers the hide, beats a hunter or fights, and it falls when the hide comes off. It makes the champion stronger in every fight between creatures."
 game_concept_spn_hide_strength:0 "Hide Strength"
 game_concept_spn_hide_strength_desc:0 "How much stronger a [spn_champion|E] is in a fight between creatures: half again at first, two and a half times at the deepest [spn_hide_bond|E]."
 game_concept_spn_leave_my_mark:0 "Leave My Mark"
 game_concept_spn_leave_my_mark_desc:0 "Once a champion's [spn_hide_bond|E] reaches 25, the hide takes their tongue, and whoever wears it after them will speak it. Much later the hide asks for more: if they leave their mark, whoever wears it next starts with half of their [spn_hide_bond|E]."
 game_concept_spn_pack:0 "Pack"
 game_concept_spn_pack_desc:0 "Wolves who run together under an alpha. Every wolf in a pack is stronger for its size, and gains [spn_pack_standing|E] each year."
 game_concept_spn_pack_standing:0 "Pack Standing"
 game_concept_spn_pack_standing_desc:0 "A wolf's place among wolves. It rises with years in a [spn_pack|E], a [werewolf_gathering|E] well kept and a Challenge won, and falls when a wolf leaves a pack, or loses or refuses a Challenge."
 game_concept_spn_alpha:0 "Alpha"
 game_concept_spn_alpha_desc:0 "The wolf who leads a [spn_pack|E]. Beat your own alpha in a Challenge and the pack is yours."
 game_concept_spn_second:0 "Second"
 game_concept_spn_second_desc:0 "The wolf who stands highest in a [spn_pack|E] after the alpha. Within the pack only the Second may challenge the alpha, and only at [spn_pack_standing|E] 50. Once the alpha beats the Second, any wolf of the pack at 50 may, for two years."
 game_concept_spn_omega:0 "Omega"
 game_concept_spn_omega_desc:0 "A wolf with no [spn_pack|E]."
 game_concept_spn_true_alpha:0 "True Alpha"
 game_concept_spn_true_alpha_desc:0 "An alpha who rose without a killing, by what they are. It happens once in a hundred years."
 game_concept_spn_unification:0 "The Unification"
 game_concept_spn_unification_desc:0 "An old rite that joins two packs whose alphas are married. It works only if there are no secrets between them. Every wolf in the joined pack is [spn_evolved|E]."
 game_concept_spn_evolved:0 "Evolved"
 game_concept_spn_evolved_desc:0 "A wolf whose [spn_pack|E] was joined by the Unification. They fight as if in the wolf's shape even when they are not."
 game_concept_spn_blood_pact:0 "Blood Pact"
 game_concept_spn_blood_pact_desc:0 "An oath between two alphas at a shared fire. Between two rulers it is a true alliance."
 game_concept_spn_hide_feud:0 "Hide Feud"
 game_concept_spn_hide_feud_desc:0 "Bad blood between two packs over a hide that passed from one to the other."
 game_concept_werewolf_gathering:0 "Werewolf Gathering"
 game_concept_werewolf_gathering_desc:0 "Wolves come together to run, and to sit in council around a fire. Hides choose there, and news travels."
 game_concept_spn_hide_silverback:0 "Silverback"
 game_concept_spn_hide_silverback_desc:0 "An old grey wolf skin that smells of smoke and cedar. It is heavier than it looks. The strongest of the six. It stands between the weak and what would hurt them. Silverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 game_concept_spn_hide_timber:0 "Timber"
 game_concept_spn_hide_timber_desc:0 "A brown wolf skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. The loner. Alone in the woods it is at its strongest, and it is hard to find. Timber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 game_concept_spn_hide_tundra:0 "Tundra"
 game_concept_spn_hide_tundra_desc:0 "A white wolf skin, cold to the touch in any weather. The patient one. Its champions talk their way out of what others fight. Tundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 game_concept_spn_hide_graybeard:0 "Graybeard"
 game_concept_spn_hide_graybeard_desc:0 "An ash-grey wolf skin crossed with old scars that never closed. The most fearless. Its champions do not step back, and their soldiers do not either. Graybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
 game_concept_spn_hide_midnight:0 "Midnight"
 game_concept_spn_hide_midnight_desc:0 "A black wolf skin. It is warm before anyone touches it. The most savage. The world can feel what its champion is. Midnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
 game_concept_spn_hide_alpha:0 "Alpha"
 game_concept_spn_hide_alpha_desc:0 "A great red-brown wolf skin. Dogs lie down when it is carried past. The leader's hide, lost for decades. It takes only a leader, and the leader's pack grows faster for it. Alpha looks for a champion who is [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] or [GetTrait('arrogant').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] or [GetTrait('craven').GetName( GetNullCharacter )]."
