l_simp_chinese:
 spn_order.0190.desc_guarded:0 "The powder burned and the room swam, but it passed. You remember all of it: the temple, the masks, the names."
 spn_order.0195.t:0 "It Comes Back"
 spn_order.0195.desc:0 "The ringing starts again, and this time something comes with it: a temple, masks, names. The night you could not remember is all there."
 spn_order.0195.desc_pull:0 "You dream of a masked room. When you wake, the names are still there."
 spn_order.0195.a:0 "I remember."
 spn_clear_mind_modifier:0 "Draught of a Clear Mind"
 spn_clear_mind_modifier_desc:0 "A bitter draught that keeps the mind its own. While it lasts, no one can compel or dominate the drinker, or make the drinker forget."
 spn_ev2.41.mind:0 "Draught of a Clear Mind."
