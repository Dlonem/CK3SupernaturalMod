l_simp_chinese:
 spn_pack.0010.t:0 "You Lead a Pack"
 spn_pack.0010.desc:0 "You have a pack now. It is small, and it is yours.\n\nWolves who run with you will be stronger for it, and they will look to you when something goes wrong. The one who stands highest after you is your Second, and the first to try your strength.\n\nKeep them fed and keep them hidden, and they will keep you."
 spn_pack.0010.a:0 "Then we run."
 spn_pack.0011.t:0 "An Invitation"
 spn_pack.0011.desc:0 "The one who made you has a pack, and [spn_inv_alpha.GetShortUIName] leads it. A message comes, plain and short: there is a place for you. The first years are the hardest, it says, and most who spend them alone do not see many more.\n\nYou are new to this. You do not have to be new to it alone."
 spn_pack.0011.a:0 "I will run with them."
 spn_pack.0011.b:0 "I will find my own way."
 spn_pack.0012.t:0 "Leaving"
 spn_pack.0012.desc:0 "[spn_rem_who.GetShortUIName] has left the pack. No fight, no word. Just gone. [spn_rem_who.GetHerHis|U] scent is already going stale on the trails you used to run together.\n\nThe others noticed. They are watching to see what you do about it."
 spn_pack.0012.a:0 "Let them go."
 spn_pack.0015.t:0 "You Wake Among Wolves"
 spn_pack.0015.desc:0 "When the fever breaks, the first thing you smell is wet fur and woodsmoke. They are all around you, the wolves from the Gathering, and by the look of them they have been there for days. Someone has kept the fire going. Someone has been bringing water.\n\nYou are one of them now."
 spn_pack.0015.a:0 "I am."
 spn_pack.0015.a.tt:0 "You run with [spn_carry_alpha.GetShortUIName]'s [spn_pack|E]."
 spn_pack.0013.t:0 "A New Alpha"
 spn_pack.0013.desc:0 "The pack has a new alpha: [spn_sa_new.GetShortUIName]. Every wolf in it felt the change the moment it happened, like a shift in the wind.\n\nSome of them are glad. Some of them are already counting the days until they can try [spn_sa_new.GetHerHim]."
 spn_pack.0013.desc_me:0 "The pack is yours now. Every wolf in it felt the change the moment it happened, and every one of them is looking at you.\n\nSome of them are glad. Some of them are already wondering how long you will last."
 spn_pack.0013.desc_joined:0 "Your pack and [spn_sa_new.GetShortUIName]'s are one pack now, joined at a Gathering by the old rite."
 spn_pack.0013.a:0 "So it goes."
 spn_pack.0020.t:0 "The Challenge"
 spn_pack.0020.desc_won:0 "You called [spn_ch_b.GetShortUIName] out and it was quick - teeth and weight and no swords. [spn_ch_b.GetSheHe|U] is on the ground. You are not.\n\nThe others saw it. By morning every wolf for miles will know, and some of them will look at you differently."
 spn_pack.0020.desc_lost:0 "You called [spn_ch_b.GetShortUIName] out and it was quick - teeth and weight and no swords. You are on the ground. [spn_ch_b.GetSheHe|U] is not.\n\nThe others saw it. By morning every wolf for miles will know, and some of them will look at you differently."
 spn_pack.0020.a:0 "It is settled."
 spn_pack.0021.t:0 "The Challenge"
 spn_pack.0021.desc_won:0 "[spn_ch_a.GetShortUIName] called you out. It was quick - teeth and weight and no swords. [spn_ch_a.GetSheHe|U] is on the ground. You are not.\n\nThe others saw it. By morning every wolf for miles will know, and some of them will look at you differently."
 spn_pack.0021.desc_lost:0 "[spn_ch_a.GetShortUIName] called you out. It was quick - teeth and weight and no swords. You are on the ground. [spn_ch_a.GetSheHe|U] is not.\n\nThe others saw it. By morning every wolf for miles will know, and some of them will look at you differently."
 spn_pack.0021.a:0 "It is settled."
 spn_pack.0100.t:0 "Another Pack's Scent"
 spn_pack.0100.desc:0 "Your wolves come back from the edge of your country uneasy. Another pack has been running there - [spn_mo_other.GetShortUIName]'s.\n\nThey did not cross anything. They did not need to. They left their scent where you would find it. Your youngest wolves want to go and answer it tonight."
 spn_pack.0100.a:0 "Let them know whose land this is."
 spn_pack.0100.a.tt:0 "You and [spn_mo_other.GetShortUIName] may become rivals."
 spn_pack.0100.b:0 "There is room enough."
 spn_pack.0100.b.tt:0 "You and [spn_mo_other.GetShortUIName] keep a truce."
 spn_pack.0101.t:0 "A Wolf Asks to Run With You"
 spn_pack.0101.desc:0 "[spn_mo_asker.GetShortUIName] runs with [spn_mo_other.GetShortUIName]'s pack. Tonight [spn_mo_asker.GetSheHe] came to yours instead and asked to stay. [spn_mo_asker.GetSheHe|U] says [spn_mo_other.GetShortUIName] runs that pack hard and gives little back. That may even be true.\n\nIf you say yes, [spn_mo_other.GetShortUIName] will not thank you."
 spn_pack.0101.a:0 "Stay."
 spn_pack.0101.a.tt:0 "[spn_mo_asker.GetShortUIName] joins your pack. [spn_mo_other.GetShortUIName] takes it badly."
 spn_pack.0101.b:0 "Go home."
 spn_pack.0102.t:0 "Young Wolves Fight"
 spn_pack.0102.desc_won:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young wolves at the edge of the woods, and they fought the way young wolves do. Yours came home first, bloody and limping a little and very pleased with [spn_mo_ours.GetHerHim]self."
 spn_pack.0102.desc_lost:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young wolves at the edge of the woods, and they fought the way young wolves do. Yours came home limping. The other one will be telling the story all over [spn_mo_other.GetShortUIName]'s pack by now."
 spn_pack.0102.desc_friends:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young wolves at the edge of the woods, and they fought the way young wolves do. Then they sat down together and licked their wounds, and now they are friends."
 spn_pack.0102.a:0 "Young wolves."
 spn_pack.0103.t:0 "Kindred"
 spn_pack.0103.desc_friends:0 "You and [spn_kin_other.GetShortUIName] run with different packs. It does not seem to matter. You found each other in the woods and something in you both said: this one. Neither of your packs knows what to make of it."
 spn_pack.0103.desc_lovers:0 "You and [spn_kin_other.GetShortUIName] run with different packs. It did not matter. You found each other in the woods one night, and in the morning neither of you wanted to go home. Both packs know by now, and neither is pleased."
 spn_pack.0103.a:0 "Kindred."
 spn_pack.0104.t:0 "A Hide Seen"
 spn_pack.0104.desc:0 "One of your wolves came back from a long run with news. It came from a traveller, a drunk, and an old woman who would not give her name, and all three told it the same way."
 spn_pack.0104.shrine:0 "\n\n[spn_waf_hide.GetName] is kept as a holy relic in [spn_waf_county.GetName], and the faithful there think it belonged to someone blessed."
 spn_pack.0104.held_mine:0 "\n\nThey are talking about the hide in your own keeping. Word of it has got out."
 spn_pack.0104.held:0 "\n\n[spn_waf_holder.GetShortUIName] has [spn_waf_hide.GetName]. Whoever wants it will have to take it."
 spn_pack.0104.lost_silverback:0 "\n\nSilverback is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.lost_timber:0 "\n\nTimber is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.lost_tundra:0 "\n\nTundra is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.lost_graybeard:0 "\n\nGraybeard is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.lost_midnight:0 "\n\nMidnight is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.lost_alpha:0 "\n\nAlpha is lost. Nobody has seen it in years. It is out there somewhere, waiting for someone."
 spn_pack.0104.true_alpha:0 "\n\nThere is a wolf with red eyes, [spn_waf_ta.GetShortUIName], who became an alpha without killing anyone for it. The old ones say that has not happened in a hundred years."
 spn_pack.0104.nothing:0 "\n\nYou hear nothing you did not already know."
 spn_pack.0104.a:0 "Remember it."
 spn_pack.0200.t:0 "A Feud Over a Hide"
 spn_pack.0200.desc:0 "A hide has passed between your pack and [spn_feud_other.GetShortUIName]'s, and it did not pass kindly. Whoever had it wants it back, and whoever has it now will not give it up.\n\nNobody has said the word feud yet. Everybody is thinking it. Nobody runs the border alone any more."
 spn_pack.0200.a:0 "They will not forget, and neither will I."
 spn_pack.0300.t:0 "The True Alpha"
 spn_pack.0300.desc:0 "Nobody fought you for it. Nobody died. You woke this morning and the pack was already looking at you, and your eyes in the water were red.\n\nIt happens without a killing, the old ones say, to a wolf who has earned it by what it is. It has not happened in a hundred years.\n\n[spn_ta_old_alpha.GetShortUIName] leads this pack. Does [spn_ta_old_alpha.GetSheHe], still?"
 spn_pack.0300.a:0 "I will lead this pack."
 spn_pack.0300.a.tt:0 "You become this pack's alpha. [spn_ta_old_alpha.GetShortUIName] keeps [spn_ta_old_alpha.GetHerHis] standing and bears you no grudge."
 spn_pack.0300.b:0 "I will found my own."
 spn_pack.0300.b.tt:0 "You leave and found a pack of your own. Some of this one may follow you."
 spn_pack.0301.t:0 "A Wolf with Red Eyes"
 spn_pack.0301.desc:0 "Every wolf for a hundred miles felt it last night. Somewhere out there an alpha rose without a fight, and [spn_ta.GetHerHis] eyes are red.\n\n[spn_ta.GetHerHis|U] name is [spn_ta.GetShortUIName]. You will hear it again. The old wolves you know have gone quiet about it, and that is how you know they are worried."
 spn_pack.0301.a:0 "A True Alpha."
