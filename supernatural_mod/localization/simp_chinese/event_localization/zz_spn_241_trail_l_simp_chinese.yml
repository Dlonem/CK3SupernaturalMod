l_simp_chinese:
 spn_hunt.0402.t:0 "The Trail Leads Home"
 spn_hunt.0402.desc_who:0 "[spn_trailsman.GetTitledFirstName] does not sit down. \"I followed the deaths in [spn_menace_county.GetName],\" [spn_trailsman.GetSheHe] says. \"They lead here. To you.\"\n\n[spn_trailsman.GetSheHe|U] has told no one else. Yet."
 spn_hunt.0402.desc_where:0 "[spn_trailsman.GetTitledFirstName] puts a finger on the map. \"[spn_menace_county.GetName]. People are dying there, and I don't know what is doing it.\"\n\nYou do. It was you. [spn_trailsman.GetSheHe|U] is good at this, and [spn_trailsman.GetSheHe] is getting closer."
 spn_hunt.0402.a:0 "Then let them know what I am"
 spn_hunt.0402.a.tt:0 "Your secret is exposed. Everyone will know what you are."
 spn_hunt.0402.b:0 "You will forget what you found"
 spn_hunt.0402.b.tt:0 "You bend [spn_trailsman.GetTitledFirstName]'s mind. [spn_trailsman.GetSheHe|U] will not remember this, and will not name you again for five years."
 spn_hunt.0402.c:0 "It was [spn_tlh_neighbour.GetFirstName]. Look again."
 spn_hunt.0402.c.tt:0 "The blame for [spn_menace_county.GetName] moves to [spn_tlh_neighbour.GetTitledFirstName]."
 spn_hunt.0402.d:0 "Ask where [spn_tlh_rival.GetFirstName] was that night"
 spn_hunt.0402.d.tt:0 "You try to turn [spn_trailsman.GetTitledFirstName] onto your rival [spn_tlh_rival.GetTitledFirstName], who is a creature too. If it works, the blame is [spn_tlh_rival.GetHerHis], and [spn_tlh_rival.GetSheHe] will hear that someone named [spn_tlh_rival.GetHerHim]."
 spn_hunt.0402.d.success:0 "[spn_trailsman.GetSheHe|U] believes you"
 spn_hunt.0402.d.failure:0 "[spn_trailsman.GetSheHe|U] does not believe you, and now [spn_trailsman.GetSheHe] watches you"
 spn_hunt.0402.e:0 "[spn_tlh_mortal.GetFirstName] has a monster's habits"
 spn_hunt.0402.e.tt:0 "You try to pin it on [spn_tlh_mortal.GetTitledFirstName], who is no creature at all. That is harder to make stick."
 spn_hunt.0402.e.success:0 "[spn_trailsman.GetSheHe|U] believes you"
 spn_hunt.0402.e.failure:0 "[spn_trailsman.GetSheHe|U] does not believe a word of it, and now [spn_trailsman.GetSheHe] watches you"
 spn_hunt.0402.f:0 "Keep it to yourself, and this purse with it"
 spn_hunt.0402.f.tt:0 "[spn_trailsman.GetTitledFirstName] is paid to stay quiet. [spn_trailsman.GetSheHe|U] knows exactly what you are now."
 spn_hunt.0402.g:0 "I will clean up after myself"
 spn_hunt.0402.g.tt:0 "Your trail in [spn_menace_county.GetName] goes cold. You lie low for a year."
 spn_hunt.0402.h:0 "You have done your job too well"
 spn_hunt.0402.h.tt:0 "[spn_trailsman.GetTitledFirstName] dies. It will look like murder, because it is."
 spn_hunt.0402.i:0 "Find someone else to follow"
 spn_hunt.0402.i.tt:0 "[spn_trailsman.GetTitledFirstName] is dismissed. [spn_trailsman.GetSheHe|U] keeps what [spn_trailsman.GetSheHe] knows."
 spn_hunt.0402.j:0 "Then I will be more careful"
 spn_hunt.0402.j.tt:0 "Nothing changes. [spn_trailsman.GetSheHe|U] keeps looking."
 spn_hunt.0700.t:0 "Not a Monster"
 spn_hunt.0700.desc:0 "The trail ends at [spn_culprit.GetTitledFirstName]'s door. No teeth, no claws, no spells. Just a knife and someone who uses it.\n\n[spn_culprit.GetSheHe|U] knows what you are. [spn_culprit.GetSheHe|U] is afraid of you."
 spn_hunt.0700.a:0 "I don't hunt people"
 spn_hunt.0700.a.tt:0 "You let [spn_culprit.GetHerHim] go. The lord of [spn_hunt_county.GetName] learns what [spn_culprit.GetSheHe] did."
 spn_hunt.0700.b:0 "A monster is a monster"
 spn_hunt.0700.b.tt:0 "You kill [spn_culprit.GetTitledFirstName]."
 spn_hunt.0700.c:0 "Let [spn_culprit.GetHerHis] lord deal with [spn_culprit.GetHerHim]"
 spn_hunt.0700.c.tt:0 "[spn_culprit.GetTitledFirstName] is thrown in [spn_hunt_county.GetHolder.GetTitledFirstName]'s dungeon."
 spn_hunt.0705.t:0 "There Is Another One"
 spn_hunt.0705.desc:0 "One is done. But there were two kinds of tracks on this trail, and [spn_ct_next.GetTitledFirstName] is still in [spn_hunt_county.GetName]."
 spn_hunt.0705.a:0 "I go after [spn_ct_next.GetHerHim] now"
 spn_hunt.0705.a.tt:0 "A fight. Win, and [spn_ct_next.GetSheHe] dies too. Lose, and you are hurt."
 spn_hunt.0705.a.success:0 "[spn_ct_next.GetSheHe|U] dies"
 spn_hunt.0705.a.failure:0 "[spn_ct_next.GetSheHe|U] gets away and leaves you bleeding"
 spn_hunt.0705.b:0 "Not today"
 spn_hunt.0710.t:0 "It Has Gone"
 spn_hunt.0710.desc:0 "Some of the signs in [spn_hunt_county.GetName] are old. [spn_ct_offer.GetTitledFirstName] killed here too, and then left. You can tell which road."
 spn_hunt.0710.desc_origin:0 "The oldest signs in [spn_hunt_county.GetName] are [spn_ct_offer.GetTitledFirstName]'s. [spn_ct_offer.GetSheHe|U] started this, and [spn_ct_offer.GetSheHe] left before you came. You can tell which road."
 spn_hunt.0710.a:0 "Then I follow [spn_ct_offer.GetHerHim]"
 spn_hunt.0710.a.tt:0 "You start a [spn_cold_trail|E]. Each county, you might lose it."
 spn_hunt.0710.b:0 "Let [spn_ct_offer.GetHerHim] go"
 spn_hunt.0711.t:0 "[spn_ct_quarry.GetFirstName] Was Here"
 spn_hunt.0711.desc_first:0 "The road out holds the signs, if you know how to read them. [spn_ct_quarry.GetTitledFirstName] went toward [spn_ct_where.GetName]."
 spn_hunt.0711.desc:0 "An innkeeper remembers [spn_ct_quarry.GetHerHim]. Paid in coin, ate nothing, left before dawn. Toward [spn_ct_where.GetName]."
 spn_hunt.0711.desc_lost:0 "You lost a season to a false trail before you found the real one again. It leads toward [spn_ct_where.GetName]."
 spn_hunt.0711.a:0 "I ride on"
 spn_hunt.0711.a.tt:0 "The trail now points to [spn_ct_where.GetName]. A [supernatural_hunt|E] there can find [spn_ct_quarry.GetHerHim]."
 spn_hunt.0711.b:0 "Enough. Let [spn_ct_quarry.GetHerHim] go."
 spn_hunt.0712.t:0 "Lost"
 spn_hunt.0712.desc:0 "The tracks stop at a river, or a crowded road, or nowhere at all. [spn_ct_quarry.GetTitledFirstName] is gone, and you do not know where."
 spn_hunt.0712.a:0 "Next time."
 spn_hunt.0715.t:0 "Someone Is Following You"
 spn_hunt.0715.desc:0 "A stranger has been asking about you at the last inn. [spn_ct_hunter.GetTitledFirstName], a hunter. Two days behind you, maybe less."
 spn_hunt.0715.desc_long:0 "[spn_ct_hunter.GetTitledFirstName] has followed you through three counties now. [spn_ct_hunter.GetSheHe|U] is not going to stop."
 spn_hunt.0715.a:0 "I lay a false trail"
 spn_hunt.0715.a.tt:0 "Next time [spn_ct_hunter.GetSheHe] reads your trail, it points the wrong way. A master hunter may see through it."
 spn_hunt.0715.b:0 "I point [spn_ct_hunter.GetHerHim] at [spn_ct_rival.GetFirstName]"
 spn_hunt.0715.b.tt:0 "[spn_ct_hunter.GetTitledFirstName] follows [spn_ct_rival.GetTitledFirstName] instead."
 spn_hunt.0715.c:0 "I make the innkeeper forget me"
 spn_hunt.0715.c.tt:0 "Nobody remembers you passing. [spn_ct_hunter.GetSheHe|U] will not find your trail next time."
 spn_hunt.0715.d:0 "I go to ground"
 spn_hunt.0715.d.tt:0 "You lie low for a year. Your trails go cold."
 spn_hunt.0715.e:0 "I double back and wait for [spn_ct_hunter.GetHerHim]"
 spn_hunt.0715.e.tt:0 "[spn_ct_hunter.GetSheHe|U] will find you, and you will be ready. [spn_ct_hunter.GetSheHe|U] fights at a disadvantage."
 spn_hunt.0715.f:0 "I keep moving"
 spn_hunt.0715.f.tt:0 "Nothing changes. [spn_ct_hunter.GetSheHe|U] may still lose you."
 spn_hunt.0715.g:0 "Let [spn_ct_hunter.GetHerHim] come"
 spn_hunt.0715.g.tt:0 "You stop hiding. [spn_ct_hunter.GetSheHe|U] will find you."
 spn_hunt.0716.t:0 "A Stranger Asks About the Dead"
 spn_hunt.0716.desc:0 "Word in the tavern: a hunter is in [spn_hunt_county.GetName], asking about the dead. [spn_hunter.GetTitledFirstName]. [spn_hunter.GetSheHe|U] hunts monsters, mostly.\n\nMostly."
 spn_hunt.0716.a:0 "I leave before [spn_hunter.GetSheHe] finds me"
 spn_hunt.0716.a.tt:0 "You lie low for a year. The trail goes cold."
 spn_hunt.0716.b:0 "I stay. Let [spn_hunter.GetHerHim] look."
 spn_hunt.0716.c:0 "I pay [spn_hunter.GetHerHim] to look somewhere else"
 spn_hunt.0716.c.tt:0 "[spn_hunter.GetSheHe|U] takes the money and goes home."
 spn_hunt.0717.t:0 "Someone Named You"
 spn_hunt.0717.desc:0 "Word reaches you that a Trailsman was given your name. Someone pointed [spn_trailsman.GetTitledFirstName] at you, and you do not know who."
 spn_hunt.0717.a:0 "Then I will be ready"
 spn_hunt.0111.b:0 "I follow it"
 spn_hunt.0111.b.tt:0 "You start a [spn_cold_trail|E] after [spn_culprit.GetTitledFirstName]. Each county, you might lose it."
 spn_hunt.0300.desc_human_slain:0 "It is done. The killer in [spn_hunt_county.GetName] is dead. It was a person, not a creature, and the county does not much care which."
 spn_hunt.0300.desc_human_jailed:0 "The killer in [spn_hunt_county.GetName] sits in the lord's dungeon. What happens next is the lord's business."
 spn_hunt.0300.desc_human_spared:0 "You let the killer go and told the lord. [spn_hunt_county.GetName] can sort out its own."
 spn_hunt_conclusion_human_slain:0 "It was a person. You killed them anyway. The county is quiet."
 spn_hunt_conclusion_human_jailed:0 "It was a person, and now that person is in a dungeon. The county is quiet."
 spn_hunt_conclusion_human_spared:0 "It was a person. You don't hunt people. The lord knows who it was."
 spn_hunt_location_your_own_trail_tt:0 "The only one to blame for this trail is you"
 spn_hunt_quarry:0 "Quarry"
 spn_hunt_quarry_lead:0 "The One They Blame"
 spn_hunt_quarry_lead_desc:0 "Hunt whoever the county blames most."
 spn_hunt_quarry_other:0 "Another One"
 spn_hunt_quarry_other_desc:0 "Hunt the next one on the trail, not the one the county blames.\n\nNeeds a master hunter."
 spn_hunt_quarry_all:0 "All of Them"
 spn_hunt_quarry_all_desc:0 "Hunt the one they blame, then anyone else on the trail who is still in the county.\n\nNeeds a master hunter."
 spn_hunt_quarry_needs_expert_tt:0 "Needs a master hunter: 75 Monster Hunting experience, or a True Monster Hunter"
 spn_hunt_tag_kind_human:0 "#positive_value + A Knife, Not Teeth#! (Sign)\n"
 spn_hunt_tag_mixed:0 "#negative_value - More Than One of Them#! (Sign)\n"
 spn_hunt_tag_mixed_origin:0 "#positive_value + You Know Which One Started It#! (Sign)\n"
 spn_hunt_tag_cold_trail:0 "#positive_value ++ The One You Are Following#! (Cold Trail)\n"
 spn_trails_row_kind_human:0 "Left by: a person"
 spn_hunt.0001.desc_human:0 "The priest of [spn_menace_county.GetName] buries a third one this season. No teeth, no claws. A knife each time, and each time someone who had a reason to be afraid. Someone in [spn_menace_county.GetName] is killing people, and getting away with it."
 spn_hunt.0100.desc_human:0 "[spn_hunt_county.GetName] has been burying people, and the gravedigger tells you how: a knife, a cord, a push down the stairs. Nothing you hunt kills like that. A person did this."
 spn_hunt.0102.desc_human:0 "The gravedigger lets you look. Clean wounds, the kind a blade makes. No beast did this, and nothing from below. Just a person, careful and not finished."
 game_concept_spn_cold_trail:0 "Cold Trail"
 game_concept_spn_cold_trails:0 "Cold Trails"
 game_concept_spn_cold_trail_desc:0 "A seasoned hunter can follow a creature that has left the county, one county at a time. Each step might lose it. The creature may hear of you, and answer: lay a false trail, point you at someone else, go to ground, or wait for you.\n\nWhile you follow, a [supernatural_hunt|E] in the county the trail points to finds your quarry."
 spn_hunt.0403.t:0 "Old Graves"
 spn_hunt.0403.desc_open:0 "[spn_trailsman.GetFirstName] found nothing new in [spn_old_trail_county.GetName]. But the old people there remember a bad time, [spn_old_trail_years.GetValue|0] years ago.\n\n"
 spn_hunt.0403.desc_vampire:0 "Bodies with no blood left in them."
 spn_hunt.0403.desc_werewolf:0 "Bodies torn open, always near the full moon."
 spn_hunt.0403.desc_witch:0 "Deaths with no mark on them, and talk of a witch."
 spn_hunt.0403.desc_demon:0 "Fires that would not go out, and men who had sold something they could not name."
 spn_hunt.0403.desc_human:0 "Murders. Nobody was ever hanged for them."
 spn_hunt.0403.desc_unknown:0 "Deaths nobody could explain."
 spn_hunt.0403.desc_blamed_alive:0 "\n\nThey still say it was [spn_old_trail_culprit.GetTitledFirstName]."
 spn_hunt.0403.desc_blamed_dead:0 "\n\nThey said it was [spn_old_trail_culprit.GetTitledFirstName], who is dead now."
 spn_hunt.0403.desc_blamed_nobody:0 "\n\nNobody agrees on who it was."
 spn_hunt.0403.a:0 "Write it down."
 spn_hunt.0403.a.tt:0 "There is nothing to hunt there now. If it starts again, you will know what to look for."
 spn_trail_census_log:0 "Supernatural trail census: live [GetGlobalVariable( 'spn_tc_live' ).GetValue|0] (human [GetGlobalVariable( 'spn_tc_live_human' ).GetValue|0], mixed [GetGlobalVariable( 'spn_tc_live_mixed' ).GetValue|0]), counties ever [GetGlobalVariable( 'spn_tc_history' ).GetValue|0], bearers [GetGlobalVariable( 'spn_tc_bearers' ).GetValue|0], running hunts [GetGlobalVariable( 'spn_hunts_running' ).GetValue|0], hunter camps [GetGlobalVariable( 'spn_tc_camps' ).GetValue|0] | since start: took to the road [GetGlobalVariable( 'spn_tc_road' ).GetValue|0], marks [GetGlobalVariable( 'spn_tc_marks' ).GetValue|0], opened [GetGlobalVariable( 'spn_tc_opened' ).GetValue|0], went cold [GetGlobalVariable( 'spn_tc_cleared' ).GetValue|0], hunts [GetGlobalVariable( 'spn_tc_hunts' ).GetValue|0] | ends: slain [GetGlobalVariable( 'spn_tc_out_slain' ).GetValue|0], hunter beaten [GetGlobalVariable( 'spn_tc_out_hunter_beaten' ).GetValue|0], fled [GetGlobalVariable( 'spn_tc_out_fled' ).GetValue|0], withdrew [GetGlobalVariable( 'spn_tc_out_withdrew' ).GetValue|0], cold [GetGlobalVariable( 'spn_tc_out_cold' ).GetValue|0], exorcised [GetGlobalVariable( 'spn_tc_out_exorcised' ).GetValue|0], bargained [GetGlobalVariable( 'spn_tc_out_bargained' ).GetValue|0], bought [GetGlobalVariable( 'spn_tc_out_bought' ).GetValue|0], compelled [GetGlobalVariable( 'spn_tc_out_compelled' ).GetValue|0], witch [GetGlobalVariable( 'spn_tc_out_witch' ).GetValue|0], proxy slain [GetGlobalVariable( 'spn_tc_out_proxy_slain' ).GetValue|0], human slain [GetGlobalVariable( 'spn_tc_out_human_slain' ).GetValue|0], spared [GetGlobalVariable( 'spn_tc_out_human_spared' ).GetValue|0], jailed [GetGlobalVariable( 'spn_tc_out_human_jailed' ).GetValue|0], called off [GetGlobalVariable( 'spn_tc_out_aborted' ).GetValue|0]"
