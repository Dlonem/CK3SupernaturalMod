l_simp_chinese:
 spn_vade.0600.t:0 "The Spell Goes Wrong"
 spn_vade.0600.desc:0 "The spell was [ROOT.Char.Custom('LastSpellCast')], one you know by heart. Halfway through, something else took hold of it.\n\n"
 spn_vade.0600.desc_kill:0 "It did not let go of [spn_mf_victim.GetFirstName] when it should have. By the time anyone thought to send for help, [spn_mf_victim.GetSheHe] was dead, and everyone who saw it knows whose spell it was."
 spn_vade.0600.desc_spared:0 "It did not let go of [spn_mf_victim.GetFirstName] when it should have. [spn_mf_victim.GetSheHe|U] came through it alive, but not unhurt."
 spn_vade.0600.desc_back:0 "It turned in your hands and came back on you."
 spn_vade.0600.desc_wide:0 "It went wide of its mark. You felt it settle on you instead, and it has not lifted."
 spn_vade.0600.desc_court:0 "It went looking for someone else, and found [spn_mf_hurt.GetFirstName], who was standing too close."
 spn_vade.0600.desc_felt:0 "It went off like a struck bell. Anyone with the gift for miles around felt it, and the people nearby will not forget the night."
 spn_vade.0600.desc_cancer:0 "The healing did not stop when the wound closed. It went on knitting [spn_mf_victim.GetFirstName] together where nothing needed it."
 spn_vade.0600.desc_reopen_other:0 "The wound you closed on [spn_mf_victim.GetFirstName] opened again within the hour, wider than before."
 spn_vade.0600.desc_reopen_self:0 "You closed the wound, and within the hour it opened again, wider than before."
 spn_vade.0600.desc_curdle:0 "The working soured on its way into the ground. [spn_mf_county.GetName] is worse for it, not better."
 spn_vade.0600.desc_mind_other:0 "It went into [spn_mf_victim.GetFirstName]'s mind and left it more crowded than it found it."
 spn_vade.0600.desc_mind_self:0 "It went into your own mind instead, and left it more crowded than it found it."
 spn_vade.0600.desc_ward:0 "The ward closed on you instead of around you."
 spn_vade.0600.desc_travel:0 "You arrived where you meant to, but not all of you arrived well."
 spn_vade.0600.desc_nosebleed:0 "Your nose began to bleed as the spell left you, and it did not stop for a day and a night."
 spn_vade.0600.desc_laugh:0 "Nothing happened at all, in front of everyone. Your court has found it very funny."
 spn_vade.0600.desc_through:0 "Something came through behind it. You did not call it, and it did not go back."
 spn_vade.0600.a:0 "It was the book."
 spn_vade_misfire_felt_tt:0 "Anyone with the gift nearby felt it, and the county will remember it."
 spn_vade_misfire_through_tt:0 "Something came through, and it will not leave you alone."
 spn_vade_toast_misfire:0 "A Spell Gone Wrong"
 spn_vade_toast_misfire_tt:0 "A spell cast on you did not end where it should have."
 spn_death_misfire:0 "died when a spell went wrong"
 spn_death_misfire_killer:0 "died when a spell cast by [TARGET_CHARACTER.GetUIName] went wrong"
 spn_vade.0690.t:0 "Debug: The Witness Misfire"
 spn_vade.0690.desc:0 "Make yourself a witness of the [spn_vade_maecum|E], then force how often a witness's spell goes wrong."
 spn_vade.0690.a:0 "Make me a witness."
 spn_vade.0690.b:0 "Every spell goes wrong (for a year)."
 spn_vade.0690.c:0 "No spell goes wrong (for a year)."
 spn_vade.0690.d:0 "Back to the book's own odds."
 spn_vade.0690.e:0 "Free me from the bond."
