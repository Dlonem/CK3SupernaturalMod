l_simp_chinese:
 spn_vade.0100.t:0 "It Wants to Be Whole"
 spn_vade.0100.desc:0 "The hide is restless tonight. It keeps turning you toward the same place, toward [spn_vade_heard_holder.GetTitledFirstName].\n\n[spn_vade_heard_holder.GetSheHe|U] has a page of the [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')], and the page is calling to the others."
 spn_vade.0100.desc_many:0 " It is not the only one."
 spn_vade.0100.a:0 "Follow it"
 spn_vade.0100.b:0 "Let it be"
 spn_vade.0110.t:0 "The Page Calls"
 spn_vade.0110.desc_silverback:0 "A page of the [spn_vade_maecum|E] has come into your hands, and Silverback goes still inside you.\n\nThe hide has guarded a page before. It knows what the book does to people. It wants you to keep this one from anyone who would use it."
 spn_vade.0110.desc_timber:0 "A page of the [spn_vade_maecum|E] has come into your hands. Timber wants to take it somewhere deep in the woods, where nobody will ever find it."
 spn_vade.0110.desc_tundra:0 "A page of the [spn_vade_maecum|E] has come into your hands. Tundra is patient. It wants you to keep it close and say nothing."
 spn_vade.0110.desc_graybeard:0 "A page of the [spn_vade_maecum|E] has come into your hands. Graybeard wants you to stand over it like a wolf over a kill, and dare anyone to come for it."
 spn_vade.0110.desc_midnight:0 "A page of the [spn_vade_maecum|E] has come into your hands. Midnight is angry. The book is the only thing the hide hates more than hunters."
 spn_vade.0110.desc_alpha:0 "A page of the [spn_vade_maecum|E] has come into your hands. Alpha wants the pack to guard it, all of them, until it is safe."
 spn_vade.0110.a:0 "I will guard it"
 spn_vade.0110.b:0 "A Mage may have it"
 spn_vade.0120.t:0 "The Pages Pull Apart"
 spn_vade.0120.desc:0 "You keep two pages of the [spn_vade_maecum|E], and the hide does not want them near each other. You wake with your arm torn open and no memory of how."
 spn_vade.0120.a:0 "It does not want them"
 spn_vade.0122.t:0 "It Pulls Toward Its Own"
 spn_vade.0122.desc:0 "The page your hide keeps can feel another part of the book nearby. In the night it pulls, and you wake bleeding."
 spn_vade.0122.a:0 "It wants to be whole"
 spn_vade.0130.t:0 "Someone Is Pulling at the Hide"
 spn_vade.0130.desc:0 "[spn_th_caster.GetTitledFirstName] is working magic on you from across the room. You can feel [spn_th_caster.GetHerHim] pulling at the hide, trying to drag the page out of it."
 spn_vade.0130.a:0 "Hold on"
 spn_vade.0130.a_tt:0 "The deeper your [spn_hide_bond|E], the likelier the hide holds. If it does not, the page is torn out of it, and you are hurt. If you were already badly hurt, you die."
 spn_vade_toast_hide_held:0 "The Hide Held"
 spn_vade_toast_hide_torn:0 "The Page Was Torn Out"
 spn_vade.0200.t:0 "The Pages Answer"
 spn_vade.0200.desc:0 "You lay out the map and ask it for the book. The pin moves on its own, and stops on the lands of [spn_named_holder.GetTitledFirstName]."
 spn_vade.0200.desc_none:0 "You lay out the map and ask it for the book. The pin does not move. Nothing you can reach is holding a page."
 spn_vade.0200.a:0 "Now I know"
 spn_vade.0211.t:0 "What the Golem Found"
 spn_vade.0211.desc:0 "[spn_golem.GetFirstName] has come back. It cannot speak, but it draws a crest in the dirt with its finger: the arms of [spn_named_holder.GetTitledFirstName]."
 spn_vade.0211.desc_none:0 "[spn_golem.GetFirstName] has come back with nothing. Wherever the pages are, it could not find them."
 spn_vade.0211.a:0 "Good"
 spn_vade.0212.t:0 "The Golem Came Back Wrong"
 spn_vade.0212.desc:0 "[spn_golem.GetFirstName] has come back, but something has been at it. One arm hangs loose, and it walks into walls."
 spn_vade.0212.a:0 "What did this?"
 spn_vade.0300.t:0 "The Book Names Your Son"
 spn_vade.0300.desc:0 "The [spn_vade_contract|E] is made. In the morning there is a new line written in the book, in red: the name of your first son, [ROOT.Char.MakeScope.Var('spn_vade_firstborn').GetCharacter.GetFirstName].\n\nThat is the price. You have three years to pay it."
 spn_vade.0300.desc_bastard:0 "The [spn_vade_contract|E] is made. In the morning there is a new line written in the book, in red: a name, [ROOT.Char.MakeScope.Var('spn_vade_firstborn').GetCharacter.GetFirstName].\n\nYou did not know [ROOT.Char.MakeScope.Var('spn_vade_firstborn').GetCharacter.GetSheHe] was yours. The book did. That is the price, and you have three years to pay it."
 spn_vade.0300.desc_none:0 "The [spn_vade_contract|E] is made. In the morning the book has written a line in red: a space for a name, and nothing in it.\n\nYou have no living son of your blood. The book cannot be paid."
 spn_vade.0300.a:0 "So be it"
 spn_vade.0310.t:0 "The Last Price"
 spn_vade.0310.desc:0 "The witness is here. The finger is gone. [spn_lp_son.GetFirstName] stands in front of you and does not know why.\n\nThe book is open on the table."
 spn_vade.0310.a:0 "Pay it"
 spn_vade.0310.b:0 "Give it someone else"
 spn_vade.0310.b_tt:0 "The book will not be fooled. The [spn_vade_contract|E] fails, and the book takes you."
 spn_vade.0310.c:0 "Not yet"
 spn_vade.0320.t:0 "The Book Takes You"
 spn_vade.0320.desc:0 "Three years are up. You did not pay.\n\nThe pages turn by themselves, faster and faster, and the room goes dark."
 spn_vade.0320.a:0 "No"
 spn_vade.0330.t:0 "A Councilor Offers"
 spn_vade.0330.desc:0 "[spn_co_councilor.GetTitledFirstName] comes to you in private. [spn_co_councilor.GetSheHe|U] knows what you are doing with the book.\n\n"You need a witness. Let it be me. Better me than someone who will sell you.""
 spn_vade.0330.a:0 "Be my witness"
 spn_vade.0330.b:0 "No"
 spn_vade.0340.t:0 "The Unmaking"
 spn_vade.0340.desc:0 "The Grand Magus, [spn_un_magus.GetTitledFirstName], stands in front of you with two members of the [spn_gnostic_council|E]. They are speaking the same words, and the book in your hands is screaming."
 spn_vade.0340.a:0 "..."
 spn_vade.0400.t:0 "Tear It Apart"
 spn_vade.0400.desc:0 "You put the [spn_vade_maecum|E] on the table and take out a knife. It took four pages to make this book. It will take four to unmake it.\n\nOne page could go to a wolf who will guard it. The rest will scatter."
 spn_vade.0400.silverback:0 "Give one to Silverback's champion"
 spn_vade.0400.timber:0 "Give one to Timber's champion"
 spn_vade.0400.tundra:0 "Give one to Tundra's champion"
 spn_vade.0400.graybeard:0 "Give one to Graybeard's champion"
 spn_vade.0400.midnight:0 "Give one to Midnight's champion"
 spn_vade.0400.alpha:0 "Give one to Alpha's champion"
 spn_vade.0400.a:0 "Scatter them all"
 spn_vade.0400.b:0 "Leave it whole"
 spn_vade.0410.t:0 "The Book Falls Apart"
 spn_vade.0410.desc:0 "The [spn_vade_maecum|E] you once held is gone, and its four pages with it. Somewhere, they are already in other hands."
 spn_vade.0410.a:0 "Good riddance"
 spn_vade.voice_named:0 "The book whispers in the voice of [spn_vade_voice.GetFirstName]."
 spn_vade.voice_old:0 "The book whispers in a voice older than its parchment."
 spn_vade.voice_blood:0 "\n\nYou know this voice. [spn_vade_voice.GetFirstName] was your blood. [spn_vade_voice.GetSheHe|U] sounds younger than you remember."
 spn_vade.0510.t:0 "What He Knew"
 spn_vade.0510.desc:0 "\n\nIt is offering to teach you something it learned when it was alive. It wants you to listen."
 spn_vade.0510.a:0 "Teach me"
 spn_vade.0510.b:0 "Close the book"
 spn_vade.0511.t:0 "A Name for a Name"
 spn_vade.0511.desc:0 "\n\nIt knows something about someone close to you. It will tell you, if you keep listening."
 spn_vade.0511.a:0 "Tell me"
 spn_vade.0511.b:0 "Keep your secrets"
 spn_vade.0512.t:0 "It Shows You Where"
 spn_vade.0512.desc_page:0 "\n\n"Another page is with [spn_vw_holder.GetTitledFirstName]. Go and get it.""
 spn_vade.0512.desc_seal:0 "\n\n"The king's ring is out there. I can tell you where.""
 spn_vade.0512.desc_relic:0 "\n\n"[spn_vw_relic.GetTitledFirstName] has something you would like. I can tell you what.""
 spn_vade.0512.desc_nothing:0 "\n\nIt tries to show you something, but there is nothing there."
 spn_vade.0512.a:0 "Show me"
 spn_vade.0512.b:0 "I do not want to know"
 spn_vade.0513.t:0 "Finish What I Could Not"
 spn_vade.0513.desc:0 "\n\n"I was so close. I had the four. Bind it, and finish what I started.""
 spn_vade.0513.a:0 "Perhaps"
 spn_vade.0513.b:0 "Never"
 spn_vade.0514.t:0 "Let Me Out"
 spn_vade.0514.desc:0 "\n\n"Let me out. Please. I have been in here so long.""
 spn_vade.0514.a:0 "I will find a way"
 spn_vade.0514.b:0 "Be silent"
 spn_vade.0515.t:0 "The Book Is Hungry"
 spn_vade.0515.desc:0 "\n\nThe book has not been fed. It wants someone to suffer, and you are the closest."
 spn_vade.0515.a:0 "Feed it"
 spn_vade.0515.b:0 "Starve it"
 spn_vade.0520.t:0 "They Know Your Name"
 spn_vade.0520.desc:0 "You have listened too often. Tonight every voice in the book is talking at once, and they are all saying your name.\n\n"Stay with us. Learn what we know.""
 spn_vade.0520.a:0 "I am not one of you"
 spn_vade.0520.b:0 "Teach me"
 spn_vade.0530.t:0 "They Are Free"
 spn_vade.0530.desc:0 "The last page of the [spn_vade_maecum|E] is ash. For a moment every candle in the room bends toward you, and then they are still.\n\nThe souls in the book are free."
 spn_vade.0530.desc_names:0 "\n\nAmong them were [GetGlobalVariable( 'spn_vade_soul_1' ).Char.GetFirstName], and many before."
 spn_vade.0530.desc_old:0 "\n\nNobody living knows their names."
 spn_vade.0530.a:0 "Rest now"
 spn_vade.0540.t:0 "The Names in the Book"
 spn_vade.0540.desc:0 "You turn to the back of the book. The names of the ones it took are written there, the newest first."
 spn_vade.0540.soul_1:0 "\n- [GetGlobalVariable( 'spn_vade_soul_1' ).Char.GetFirstName]"
 spn_vade.0540.soul_2:0 "\n- [GetGlobalVariable( 'spn_vade_soul_2' ).Char.GetFirstName]"
 spn_vade.0540.soul_3:0 "\n- [GetGlobalVariable( 'spn_vade_soul_3' ).Char.GetFirstName]"
 spn_vade.0540.soul_4:0 "\n- [GetGlobalVariable( 'spn_vade_soul_4' ).Char.GetFirstName]"
 spn_vade.0540.soul_5:0 "\n- [GetGlobalVariable( 'spn_vade_soul_5' ).Char.GetFirstName]"
 spn_vade.0540.more:0 "\n...and [ROOT.Char.MakeScope.Var('spn_vn_more').GetValue|0] more."
 spn_vade.0540.old:0 "\n\nBefore them, the ones nobody remembers: the knight who tore it into four, and the Grand Magus the first Knights of the Blue Rose took it from."
 spn_vade.0540.a:0 "Close it"
 spn_vade.0550.t:0 "The Bond Breaks"
 spn_vade.0550.desc:0 "The ritual takes all night. At dawn something lets go of you, like a hand opening.\n\nYou are not the book's witness any more."
 spn_vade.0550.a:0 "Free"
 spn_vade.0560.t:0 "The Stone Opens"
 spn_vade.0560.desc:0 "You speak the words of command, and the black stone cracks down the middle. Inside is the page, dry and whole.\n\nIt counts now."
 spn_vade.0560.a:0 "Finally"
