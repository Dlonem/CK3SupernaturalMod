l_simp_chinese:
 spn_order_favouritism_opinion:0 "Favouritism"
 spn_pack_home_opinion:0 "Ran Together"
 spn_rel_order_advance:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became lovers after a late night of study."
 spn_rel_pack_night:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] spent a night by the fire together."
 spn_rel_pack_home:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] ran together, and sat up by the fire long after the others slept."
 spn_order_talk_toast:0 "Talk in the Temple"
 spn_order_talk_toast_desc_junior:0 "[spn_fe_witness.GetTitledFirstName] knows what is between you and [spn_fe_patron.GetFirstName], and has said so. The masks will raise it at the next [spn_conclave|E]."
 spn_order_talk_toast_desc_patron:0 "[spn_fe_witness.GetTitledFirstName] knows what is between you and [spn_fe_junior.GetFirstName], and has said so. The masks will raise it at the next [spn_conclave|E]."
 spn_order.0350.t:0 "After the Others Have Gone"
 spn_order.0350.desc:0 "[spn_adv_junior.GetTitledFirstName] has found a reason to stay behind after every rite this month. Tonight the others have gone home, and [spn_adv_junior.GetSheHe] is no longer pretending to tidy the candles."
 spn_order.0350.a:0 "Let [spn_adv_junior.GetHerHim] stay"
 spn_order.0350.b:0 "Not here, and not with me"
 spn_order.0350.c:0 "Remind [spn_adv_junior.GetHerHim] whom [spn_adv_junior.GetSheHe] is speaking to"
 spn_order.0350.c.tt:0 "[spn_adv_junior.GetFirstName] loses [spn_order_standing|E]."
 spn_order.0351.t:0 "A Door Left Open"
 spn_order.0351.desc:0 "[spn_adv_senior.GetTitledFirstName] kept you late to help with the inventory. The inventory took a quarter of an hour. That was two hours ago, and neither of you has mentioned leaving."
 spn_order.0351.a:0 "Say what I have wanted to say for months"
 spn_order.0351.a.tt:0 "[spn_adv_senior.GetSheHe|U] may want the same. If not, it will be awkward between you, and the temple may hear of it."
 spn_order.0351.b:0 "Say it, and say what I want for it"
 spn_order.0351.b.tt:0 "If [spn_adv_senior.GetSheHe] agrees, you become lovers and [spn_adv_senior.GetSheHe] will speak for you at the next Rite. If not, [spn_adv_senior.GetSheHe] will remember that you asked, and an upright senior may report it."
 spn_order.0351.c:0 "Thank [spn_adv_senior.GetHerHim] for the lesson and go"
 spn_order.0351.talk:0 "Word Gets Around"
 spn_order.0351.talk_desc:0 "Someone saw your face as you left [spn_adv_senior.GetFirstName]'s study. By the next rite, the whole temple knows you were turned away."
 spn_order.0351.no:0 "Turned Away"
 spn_order.0351.no_desc:0 "[spn_adv_senior.GetFirstName] hears you out, then says, kindly enough, that it is late and you should go. Neither of you mentions it again."
 spn_order.0351.deal:0 "An Understanding"
 spn_order.0351.deal_desc:0 "[spn_adv_senior.GetFirstName] does not pretend to be surprised. At the next Rite, [spn_adv_senior.GetSheHe] will speak for you."
 spn_order.0351.reported:0 "Reported to the Masks"
 spn_order.0351.reported_desc:0 "[spn_adv_senior.GetFirstName] refused you, and then told the masks what you had asked for. They will raise it at the next [spn_conclave|E]."
 spn_order.0351.cold:0 "Refused"
 spn_order.0351.cold_desc:0 "[spn_adv_senior.GetFirstName] tells you, coldly, to leave. [spn_adv_senior.GetSheHe|U] will not forget that you asked."
 spn_order.0352.t:0 "What Is It Worth?"
 spn_order.0352.desc:0 "[spn_fv_patron.GetTitledFirstName] has been good to you, and the temple has noticed. [spn_fv_patron.GetSheHe|U] could say a word for you at the next Rite. [spn_fv_patron.GetSheHe|U] has not offered."
 spn_order.0352.a:0 "Ask [spn_fv_patron.GetHerHim] to speak for me"
 spn_order.0352.a.tt:0 "If [spn_fv_patron.GetSheHe] agrees, you gain [spn_order_standing|E]. A word can raise your standing, never your rank. Someone of your rank may notice."
 spn_order.0352.b:0 "Keep the temple out of it"
 spn_order.0352.yes:0 "A Word at the Rite"
 spn_order.0352.yes_desc:0 "[spn_fv_patron.GetFirstName] will speak for you at the next Rite."
 spn_order.0352.no:0 "Laughed Off"
 spn_order.0352.no_desc:0 "[spn_fv_patron.GetFirstName] laughed, and changed the subject."
 spn_order.0353.t:0 "Your Lover Asks a Favour"
 spn_order.0353.desc:0 "[spn_fv_junior.GetFirstName] waits until you are nearly asleep.\n\n"The Rite is next month," [spn_fv_junior.GetSheHe] says. "You could say my name.""
 spn_order.0353.a:0 "I will say it"
 spn_order.0353.a.tt:0 "[spn_fv_junior.GetFirstName] gains [spn_order_standing|E]. A word can raise standing, never rank. Someone of [spn_fv_junior.GetHerHis] rank may notice."
 spn_order.0353.b:0 "Not like that"
 spn_order.0353.c:0 "Then this is over"
 spn_order.0353.no:0 "Not Like That"
 spn_order.0353.no_desc:0 "[spn_fv_patron.GetFirstName] will not speak for you, and does not want it asked again."
 spn_order.0360.t:0 "The Masks Are Watching"
 spn_order.0360.desc:0 "At tonight's rite you counted eleven masks, and every one of them turned your way at least once. Nobody spoke to you afterwards. Nobody needed to."
 spn_order.0360.a:0 "Keep my eyes on the floor"
 spn_order.0360.a.tt:0 "You gain a little [spn_order_standing|E]."
 spn_order.0360.b:0 "Learn whose face is behind each mask"
 spn_order.0360.b.success:0 "A Face Behind a Mask"
 spn_order.0360.b.success_desc:0 "You know one of them now: [spn_mw_mask.GetTitledFirstName]."
 spn_order.0360.b.success_none_desc:0 "You learn the masks by their voices and their hands, but there is no face behind them you did not already know."
 spn_order.0360.b.failure:0 "Seen Looking"
 spn_order.0360.b.failure_desc:0 "One of the masks caught you staring and held your eye until you looked away. The temple will remember it."
 spn_order.0360.c:0 "Stare back"
 spn_order.0360.d:0 "Listen to their hearts instead"
 spn_order.0361.t:0 "Beneath Your Station"
 spn_order.0361.desc:0 "[spn_bs_senior.GetTitledFirstName] hands you a bucket and a brush. The lower hall has not been scrubbed since the last rite, and acolytes scrub floors.\n\n"What you rule outside these walls means nothing in here," [spn_bs_senior.GetSheHe] says, and seems to enjoy saying it."
 spn_order.0361.a:0 "Scrub the floor"
 spn_order.0361.a.tt:0 "You gain [spn_order_standing|E]."
 spn_order.0361.b:0 "Send for a servant"
 spn_order.0361.b.tt:0 "Whether [spn_bs_senior.GetFirstName] notices is another matter."
 spn_order.0361.noticed:0 "Noticed"
 spn_order.0361.noticed_desc:0 "[spn_bs_senior.GetFirstName] came back early and found a servant scrubbing the lower hall in your place. You lose [spn_order_standing|E]."
 spn_order.0361.unnoticed:0 "A Clean Floor"
 spn_order.0361.unnoticed_desc:0 "The floor is spotless, and nobody asks who scrubbed it."
 spn_order.0361.c:0 "Refuse"
 spn_order.0361.c.tt:0 "You lose [spn_order_standing|E], and [spn_bs_senior.GetFirstName] will not forget it."
 spn_order.0362.t:0 "The Same Night"
 spn_order.0362.desc:0 "[spn_sn_kin.GetTitledFirstName] has asked you to be there tomorrow night. You can tell from how carefully [spn_sn_kin.GetSheHe] asked that it matters.\n\nThe chapter meets tomorrow night. Those who miss a rite are remembered for it."
 spn_order.0362.a:0 "Go to the rite"
 spn_order.0362.a.tt:0 "You gain [spn_order_standing|E]."
 spn_order.0362.b:0 "Stay with [spn_sn_kin.GetHerHim]"
 spn_order.0362.b.tt:0 "You lose [spn_order_standing|E]."
 spn_order.0362.c:0 "Send word that I am ill"
 spn_order.0362.c.tt:0 "If the temple believes you, nothing is lost. If it does not, the lie will cost you more than staying away would have."
 spn_order.0362.held:0 "Excused"
 spn_order.0362.held_desc:0 "The chapter met without you, and nobody asked why. [spn_sn_kin.GetFirstName] was glad you came."
 spn_order.0362.seen:0 "Seen Through"
 spn_order.0362.seen_desc:0 "Someone saw you out that night, well enough to walk. The temple knows you lied to it."
 spn_order.0363.t:0 "One of the Seniors"
 spn_order.0363.desc:0 "[spn_ss_senior.GetTitledFirstName] has decided you are the chapter's joke. [spn_ss_senior.GetSheHe|U] corrects your Latin in front of the others, sends you back for the wrong candles, and laughs when you stumble over the third line. The others laugh too, a little, so as not to be next."
 spn_order.0363.a:0 "Endure it"
 spn_order.0363.a.tt:0 "You gain a little [spn_order_standing|E]."
 spn_order.0363.b:0 "Answer [spn_ss_senior.GetHerHim] in front of everyone"
 spn_order.0363.b.success:0 "The Last Word"
 spn_order.0363.b.success_desc:0 "Your answer is in better Latin than [spn_ss_senior.GetSheHe] used, and the laughter turns. You gain [spn_order_standing|E], [spn_ss_senior.GetFirstName] loses some, and [spn_ss_senior.GetSheHe] will not forgive it."
 spn_order.0363.b.failure:0 "Laughed At"
 spn_order.0363.b.failure_desc:0 "You stumble over the answer, and the laughter is louder this time. You lose [spn_order_standing|E]."
 spn_order.0363.c:0 "Take it to the Temple Magus"
 spn_order.0363.c.tt:0 "[spn_ss_magus.GetFirstName] will side with whichever of you [spn_ss_magus.GetSheHe] thinks more of."
 spn_order.0363.c.mine:0 "Heard Out"
 spn_order.0363.c.mine_desc:0 "[spn_ss_magus.GetFirstName] heard you out, and had a word with [spn_ss_senior.GetFirstName]. It will not happen again."
 spn_order.0363.c.his:0 "Sent Away"
 spn_order.0363.c.his_desc:0 "[spn_ss_magus.GetFirstName] heard you out, then told you that a junior who cannot take a little mockery will not last. You lose [spn_order_standing|E]."
 spn_order.0363.d:0 "Find out what [spn_ss_senior.GetSheHe] is hiding"
 spn_order.0363.d.success:0 "Something to Hold"
 spn_order.0363.d.success_desc:0 "You find out something [spn_ss_senior.GetFirstName] would rather nobody knew."
 spn_order.0363.d.success_none_desc:0 "You watch [spn_ss_senior.GetFirstName] for weeks and find nothing worse than a sharp tongue. You learn something about watching, at least."
 spn_order.0363.d.failure:0 "Caught Prying"
 spn_order.0363.d.failure_desc:0 "[spn_ss_senior.GetFirstName] noticed you following [spn_ss_senior.GetHerHim]. Now [spn_ss_senior.GetSheHe] has a real reason to dislike you."
 spn_order.0363.e:0 "Let [spn_ss_senior.GetHerHim] see the wolf in my eyes"
 spn_order.0363.e.tt:0 "[spn_ss_senior.GetSheHe|U] will leave you alone. [spn_ss_senior.GetSheHe|U] will also know what you are."
 spn_order.0370.t:0 "A Brother Asks for Help"
 spn_order.0370.t_sister:0 "A Sister Asks for Help"
 spn_order.0370.desc:0 "[spn_ba_asker.GetTitledFirstName] comes to you after the rite, white-faced. [spn_ba_asker.GetSheHe|U] broke the Order's rules, and someone saw. The masks will hear of it at the next [spn_conclave|E].\n\n"You could make it go away," [spn_ba_asker.GetSheHe] says."
 spn_order.0370.a:0 "I will see it buried"
 spn_order.0370.a.tt:0 "Nobody will raise it at the next [spn_conclave|E]."
 spn_order.0370.a.risk_tt:0 "If it comes out, it is your name the masks will speak."
 spn_order.0370.b:0 "Let the masks judge [spn_ba_asker.GetHerHim]"
 spn_order.0370.b.tt:0 "You gain [spn_order_standing|E]."
 spn_order.0370.c:0 "That is between you and the masks"
 spn_order.0371.t:0 "A Feud in the Chapter"
 spn_order.0371.t_council:0 "A Feud on the Council"
 spn_order.0371.desc:0 "[spn_fd_a.GetTitledFirstName] and [spn_fd_b.GetTitledFirstName] have not exchanged a civil word in months. Tonight it came to shouting in the middle of the rite, and the whole chapter watched to see what you would do."
 spn_order.0371.desc_council:0 "[spn_fd_a.GetTitledFirstName] and [spn_fd_b.GetTitledFirstName] sit with you on the [spn_gnostic_council|E], and they can no longer bear to be in the same room. The last meeting ended with nothing decided, and each came to you afterwards to complain about the other."
 spn_order.0371.a:0 "Side with [spn_fd_a.GetFirstName]"
 spn_order.0371.a.tt:0 "[spn_fd_b.GetFirstName] loses [spn_order_standing|E]."
 spn_order.0371.b:0 "Side with [spn_fd_b.GetFirstName]"
 spn_order.0371.b.tt:0 "[spn_fd_a.GetFirstName] loses [spn_order_standing|E]."
 spn_order.0371.c:0 "Make them lead the next rite together"
 spn_order.0371.c_council:0 "Make them carry the next motion together"
 spn_order.0371.c.success:0 "Reconciled"
 spn_order.0371.c.success_desc:0 "It was a stiff evening, but it went well, and by the end they were speaking to each other again. Both gain [spn_order_standing|E]."
 spn_order.0371.c.failure:0 "Worse Than Before"
 spn_order.0371.c.failure_desc:0 "They found a way to quarrel in front of everyone again, and both blame you for putting them there."
 spn_order.0371.d:0 "Let them settle it between themselves"
 spn_order.0371.d.tt:0 "One of them will come off worse. Nobody will be killed."
 spn_order.0371.d.done:0 "Settled"
 spn_order.0371.d.done_desc:0 "[spn_fd_winner.GetFirstName] and [spn_fd_loser.GetFirstName] settled it the old way. [spn_fd_loser.GetFirstName] came off worse, and has the wounds to show for it."
 spn_order.0372.t:0 "Where Do You Go at Night?"
 spn_order.0372.desc:0 "[spn_wg_spouse.GetTitledFirstName] is awake when you come in. [spn_wg_spouse.GetSheHe|U] has been awake every time, [spn_wg_spouse.GetSheHe] says, for months.\n\n"I have never asked where you go. I am asking now.""
 spn_order.0372.a:0 "Lie"
 spn_order.0372.a.success:0 "Believed"
 spn_order.0372.a.success_desc:0 "[spn_wg_spouse.GetFirstName] lets it go. [spn_wg_spouse.GetSheHe|U] seems to believe you."
 spn_order.0372.a.failure:0 "Not Believed"
 spn_order.0372.a.failure_desc:0 "[spn_wg_spouse.GetFirstName] says nothing more. [spn_wg_spouse.GetSheHe|U] does not believe a word of it."
 spn_order.0372.b:0 "Tell [spn_wg_spouse.GetHerHim] the truth"
 spn_order.0372.b.tt:0 "Silence is the first of the three words. Telling [spn_wg_spouse.GetHerHim] breaks the Order's rules, and you may be cast out for it."
 spn_order.0372.c:0 "Ask the temple to consider [spn_wg_spouse.GetHerHim]"
 spn_order.0372.c.tt:0 "You tell [spn_wg_spouse.GetHerHim] only that it is a learned society, and that you will ask."
 spn_order.0372.c.yes:0 "A Name Put Forward"
 spn_order.0372.c.yes_desc:0 "The masks will consider [spn_wg_spouse.GetFirstName]."
 spn_order.0372.c.no:0 "Not Considered"
 spn_order.0372.c.no_desc:0 "The masks will not consider [spn_wg_spouse.GetFirstName]. They give no reason."
 spn_order.0372.d:0 "Let [spn_wg_spouse.GetHerHim] believe it is someone else"
 spn_pack.0105.t:0 "The Pack Comes Home"
 spn_pack.0105.desc_moon:0 "The pack ran until the moon was down and came home to the fire one by one. Somebody had wine. For one night nobody was a lord or a shepherd's son. You were the pack, and you were home."
 spn_pack.0105.desc_rain:0 "It rained the whole run, and nobody minded. The pack came back soaked and laughing, crowded round the fire to dry, and somebody found the wine. Tonight there were no lords and no shepherds' sons among you, only the pack, home again."
 spn_pack.0105.desc_stag:0 "The pack brought down a stag at the edge of the forest and carried it home between them. By the time it was roasting, nobody could agree who had made the kill, and nobody cared. Tonight you were the pack, and nothing else."
 spn_pack.0105.desc_friends:0 "\n\n[spn_ph_a.GetShortUIName] and [spn_ph_b.GetShortUIName] sat together long after the others had gone quiet. They are friends now."
 spn_pack.0105.desc_quarrel:0 "\n\nNot everyone was easy. [spn_ph_a.GetShortUIName] and [spn_ph_b.GetShortUIName] had words over the last of the meat, and the others had to pull them apart."
 spn_pack.0105.a:0 "Go home to [spn_ph_spouse.GetShortUIName]."
 spn_pack.0105.b:0 "Stay by the fire with [spn_ph_other.GetShortUIName]."
 spn_pack.0105.c:0 "Sit up with [spn_ph_friend.GetShortUIName]."
 spn_pack.0105.d:0 "Speak at the fire."
 spn_pack.0105.d.tt:0 "Every wolf of your pack gains [spn_pack_standing|E]."
 spn_pack.0105.e:0 "Keep to myself tonight."
