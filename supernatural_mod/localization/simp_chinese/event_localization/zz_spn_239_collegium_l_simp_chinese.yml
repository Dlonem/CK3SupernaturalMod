l_simp_chinese:
 building_type_spn_order_collegium_01:0 "Collegium"
 building_type_spn_order_collegium_01_desc:0 "A house of learning, where scholars of law, letters and the stars teach and keep their books."
 building_spn_order_collegium_01:0 "Collegium"
 building_spn_order_collegium_01_desc:0 "A house where scholars of law, letters and the stars teach and keep their books. Its patrons are counted among the learned."
 spn_order_line_hall:0 " It meets beneath the Collegium there."
 spn_order_line_council_seat_hall:0 "$spn_order_line_hall$$spn_order_line_council_seat$"
 spn_order_toast_hall_raised:0 "The Collegium Is Raised"
 spn_order_toast_hall_raised.desc:0 "Your temple now meets beneath the Collegium in [spn_ha_county.GetName]."
 spn_order_toast_hall_lost:0 "The Collegium Is Gone"
 spn_order_toast_hall_lost.desc:0 "The Collegium your temple met beneath no longer stands. Until another is raised, the temple meets where it can."
 spn_order_toast_hall_has_one:0 "A House of Learning"
 spn_order_toast_hall_has_one.desc:0 "Your temple already meets beneath another Collegium. This one is a house of learning and nothing more."
 spn_order_toast_hall_refused:0 "The Masks Say No"
 spn_order_toast_hall_refused.desc:0 "The masks will not have [spn_hl_new.GetTitledFirstName]. They do not say why."
 spn_order_toast_hall_profaned:0 "Someone Came Through the Corridor"
 spn_order_toast_hall_profaned.desc:0 "A hunter walked the corridor beneath the Collegium and came out the other side. It will be years before the temple feels safe there again."
 spn_order_toast_hall_searched:0 "Someone Searched the Cellars"
 spn_order_toast_hall_searched.desc:0 "[spn_hs_lord.GetTitledFirstName] had the Collegium in [spn_hl_county.GetName] searched from top to bottom. Nothing was found."
 spn_order_toast_cellar_found:0 "A Stair Behind the Shelves"
 spn_order_toast_cellar_found.desc:0 "Behind a bookcase in the lower library your men found a stair going down, and at its foot a door with a blue rose carved on it. Now you know whose door it is."
 spn_order_toast_cellar_nothing:0 "Nothing Below"
 spn_order_toast_cellar_nothing.desc:0 "Your men sounded every wall and lifted every flagstone. The Collegium has no cellar."
 spn_order_toast_master_talks:0 "Law, Letters and the Stars"
 spn_order_toast_master_talks.desc:0 "The master of the Collegium talks for an hour about law, letters and the stars. You come away knowing nothing you did not know before."
 spn_order_respondeo_hall_tt:0 "Cast in your temple's own county, it does not wound you."
 spn_order_respondeo_no_wound_tt:0 "Your temple meets beneath this county's Collegium. The working does not wound you here."
 spn_order.0090.desc_collegium:0 "The students of the [Glossary('Collegium','spn_gloss_collegium')] have a story they tell every new one: that it is home to a secret society of the learned, the [Glossary('Hermetic','spn_gloss_hermetic')] Order of the Blue Rose, and that a temple lies hidden beneath it. Your steward says the Collegium has no cellar.\n\nYou are sure you have heard that name before. You cannot remember where."
 spn_order.0164.t:0 "Beneath the Collegium"
 spn_order.0164.desc:0 "Behind a bookcase in the Collegium at [spn_bc_county.GetName], one the students are told holds nothing but old sermons, a stair goes down to the temple. In the passage at its foot, words are cut into an arch. Whoever walks under them without the right to be there is shown what they fear most, and goes no further.\n\nTonight the temple's newest walk under the arch for the first time. Someone must walk with them."
 spn_order.0164.a:0 "Walk with them"
 spn_order.0164.a.tt:0 "The neophytes will remember who walked beside them. You gain [spn_order_standing|E]."
 spn_order.0164.b:0 "Renew the ward over the arch"
 spn_order.0164.b.tt:0 "For ten years, anyone who searches beneath the Collegium, or tries the corridor without the right, will find it harder. You gain [spn_order_standing|E]."
 spn_order.0164.c:0 "Let someone else walk with them"
 spn_order.0165.t:0 "A New Lord Above the Hall"
 spn_order.0165.desc:0 "[spn_hl_county.GetName] has a new lord: [spn_hl_new.GetTitledFirstName]. The Collegium is [spn_hl_new.GetHerHis] now, with its scholars, its books and its fees. The stair behind the bookcase is still the temple's, for as long as [spn_hl_new.GetSheHe] does not go looking for it.\n\nThe Magistrati want to know what you mean to do about [spn_hl_new.GetHerHim]."
 spn_order.0165.a:0 "Bring [spn_hl_new.GetHerHim] in"
 spn_order.0165.a.tt:0 "You put [spn_hl_new.GetHerHim] forward at the next Selection. If the masks will not have [spn_hl_new.GetHerHim], you will be told so, and nothing more."
 spn_order.0165.b:0 "The scholars go on as they always have"
 spn_order.0165.b.tt:0 "Nothing changes. [spn_hl_new.GetSheHe|U] may still go looking."
 spn_order.0165.c:0 "Let the hall go"
 spn_order.0165.c.tt:0 "The stair is bricked up, and your temple no longer meets beneath this Collegium. The building stays [spn_hl_new.GetHerHis]. You can raise a new Collegium in your own capital, if it is a castle, city or temple."
 spn_order.0166.t:0 "The Cellar That Isn't There"
 spn_order.0166.desc:0 "The Collegium in [spn_hl_county.GetName] came to you with the county. Your steward has been through its accounts and finds them in good order, if generous with candles.\n\n\"The students have a story they tell every new one,\" says your steward. \"A secret society of the learned, the Hermetic Order of the Blue Rose, with a temple hidden beneath the building. Never mind that the Collegium has no cellar.\""
 spn_order.0166.a:0 "Scholars keep odd hours"
 spn_order.0166.b:0 "Have the cellars searched"
 spn_order.0166.b.tt:0 "Your men will sound the walls and lift the flagstones. They may find nothing at all."
 spn_order.0166.c:0 "Ask the master of the Collegium what is taught there at night"
 spn_order.0166.c.tt:0 "If there is anything to the story, someone may take an interest in a lord who asks the right questions."
 spn_hunt.0173.t:0 "The Corridor"
 spn_hunt.0173.desc:0 "Behind the second door is a stair, and at the bottom of the stair a long passage under an arch, with words cut into it in a language you half know. A few steps in, the air turns cold. Something in this place wants you to be afraid, and it knows exactly what you are afraid of.\n\nThe ones you came for went this way."
 spn_hunt.0173.a:0 "Walk through it"
 spn_hunt.0173.a.tt:0 "Some walk through it. Some wake on the stair with the night gone."
 spn_hunt.0173.b:0 "Turn back"
 spn_hunt.0173.b.tt:0 "The sweep ends here. Nobody will call it cowardice."
 spn_hunt_toast_corridor_pass:0 "Through the Corridor"
 spn_hunt_toast_corridor_pass.desc:0 "You came out at the far end shaking, into a room full of books and candles. The temple beneath the Collegium has been entered."
 spn_hunt_toast_corridor_sigil:0 "The Sigil Opens the Way"
 spn_hunt_toast_corridor_sigil.desc:0 "The sigil you took from [spn_cor_sigil.GetFirstName] is warm in your hand, and the passage is only a passage."
 spn_hunt_toast_corridor_fail:0 "You Wake on the Stair"
 spn_hunt_toast_corridor_fail.desc:0 "You are lying on the stair with your weapon beside you. The candles have burned down and the night is gone. Whoever was below has had all the time they needed."
