l_simp_chinese:
 vampire_feeding:0 "Feeding"
 vampire_feeding_desc:0 "It has been awhile since the last time you have fed, go out into a local town and find someone to feed upon."
 vampire_feeding_host_desc:0 "$BULLET_WITH_TAB$Vampires may gain [prestige|E]\n$BULLET_WITH_TAB$Vampires may gain [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Vampires may gain [gold|E]\n$BULLET_WITH_TAB$Vampires may gain knowledge and skills\n"
 vampire_feeding_guest_desc:0 "$BULLET_WITH_TAB$Vampires may gain [prestige|E]\n$BULLET_WITH_TAB$Vampires may gain [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Vampires may gain [gold|E]\n$BULLET_WITH_TAB$Vampires may gain knowledge and skills\n"
 vampire_feeding_selection_tooltip:0 "Go and find a human to feed upon and increase your strength."
 vampire_feeding_destination_selection:0 ""
 vampire_feeding_province_desc:0 "This is a suitable place to find someone to feed upon."
 vampire_feeding_predicted_cost:0 "You will need to spend some gold in order to blend in."
 vampire_feeding_guest_help_text:0 "Feeding alone will be more satiating, but feeding with other Vampires can increase safety."
 vampire_feeding_host_an_a:0 "a Vampire"
 known_vampire_feed:0 "You will have a more difficult time feeding as a [GetTrait('spn_known_vampire').GetName( GetNullCharacter )]"
 known_hybrid_feed:0 "You will have a more difficult time feeding as a [GetTrait('spn_known_hybrid').GetName( GetNullCharacter )]"
 
 #Activity Intents
 strengthen_the_blood_intent:0 "Strengthen the Blood"
 strengthen_the_blood_intent_desc:0 "Feed with the intent of enhancing your vampiric powers, seeking to unlock greater strength and control over your abilities."
 satiate_thirst_intent:0 "Satiate Thirst"
 satiate_thirst_intent_desc:0 "Feed to maintain balance and control over your volatile state, reducing the toll of hunger on your mind and body."
 embrace_the_night_intent:0 "Embrace the Night"
 embrace_the_night_intent_desc:0 "Feed with the intent to revel in the thrill of the night. Indulge in your immortality, lose yourself in the moment, and let the night's wild energy wash away your worries."

 #Phases
 searching_phase:0 "Search"
 searching_phase_desc:0 "Hunt for the perfect prey in the shadows."
 feeding_phase:0 "Feeding"
 feeding_phase_desc:0 "Satisfy your hunger and embrace the night."
 
 #Guest Invites
 activity_invite_rule_vampires:0 "Vampires"
 activity_invite_rule_supernatural_mp:0 "Supernatural Players"
 activity_invite_rule_hybrids:0 "Hybrids"
 
 #Activity Options
 options_preparations:0 "Preparations"
 preparations_option_instinct:0 "Vampire Instincts"
 preparations_option_instinct_desc:0 "Rely on your instincts and prowl the area in search of an easy, isolated target.\n\nNo additional benefits to [feeding_success_chance_no_prefix|E], but avoids the need for preparation or spending [gold|E]."
 preparations_option_scout:0 "Scout the City"
 preparations_option_scout_desc:0 "Spend time reconnoitering to find the safest and most suitable locations for feeding.\n\nIncreases [feeding_success_chance_no_prefix|E] by reducing the risk of exposure or complications." 
 preparations_option_trap:0 "Lay a Trap"
 preparations_option_trap_desc:0 "Use subterfuge to lure prime targets to your chosen feeding ground, ensuring everything is perfectly set for your needs.\n\n#high Greatly#! increases [feeding_success_chance_no_prefix|E] by stacking multiple advantages, but costs [gold|E].
 options_spoils:0 "Spoils"
 spoils_option_dead_respect:0 "Respect the Dead"
 spoils_option_dead_respect_desc:0 "Show reverence for those who have perished by refusing to rob them of their possessions.\n\nGain [piety|E] for your restraint and honor among those who value such principles."
 spoils_option_robbing:0 "Take What You Need"
 spoils_option_robbing_desc:0 "Disguise your feeding as an unfortunate robbery. \n\nBy pilfering the pockets of your victim, you gain a little extra [gold|E] to help you endure the centuries ahead. \n\nShould things go awry, it might even appear as a simple robbery gone wrong."
 spoils_option_casing:0 "Target the Wealthy"
 spoils_option_casing_desc:0 "Carefully target your victims to identify a high-value target. Their blood promises to be flavorful, and their pockets even more full.\n\nThough there is a great increase in [gold|E] acquired, this meticulous approach carries a risk of lowering your [feeding_success_chance_no_prefix|E]."

 #Activity Conclusion
 vampire_feeding_conclusion_desc:0 "The [GetActivityType( 'vampire_feeding' ).GetName] has concluded."
