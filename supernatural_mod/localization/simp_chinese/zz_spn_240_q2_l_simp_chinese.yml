l_simp_chinese:
 spn_order_toast_rite_auto:0 "Raised by Your Temple"
 spn_order_toast_rite_auto_medicum:0 "The masks raised [spn_yr_to_medicum.GetTitledFirstName] to Medicum at the Rite of the Chapter."
 spn_order_toast_rite_auto_magistratus:0 "The masks raised [spn_yr_to_magistratus.GetTitledFirstName] to Magistratus at the Rite of the Chapter."
 spn_order_toast_rite_busy:0 "The Masks Held the Rite"
 spn_order_toast_rite_busy_desc:0 "You were occupied elsewhere, so the masks held the Rite of the Chapter without you."
 spn_order_toast_rose_masks:0 "The Masks Sent the Roses"
 spn_order_toast_rose_masks_desc:0 "Your temple had names ready, and the masks sent the notes without waiting for you."
 spn_order_toast_rose_auto:0 "Your Temple Sent a Rose"
 spn_order_toast_rose_auto_desc:0 "The masks chose [spn_sel_pick.GetTitledFirstName] for your temple. The note is on its way."
 spn_order_auto_temple_decision:0 "Leave the Temple to the Masks"
 spn_order_auto_temple_decision_desc:0 "Let the masks run your temple's business. They send the roses to those they choose and raise those who are ready at the Rite of the Chapter, and they tell you what they did."
 spn_order_auto_temple_decision_tooltip:0 "Hand the roses and the Rite to the masks."
 spn_order_auto_temple_decision_confirm:0 "Let them"
 spn_order_auto_temple_decision_effect_tt:0 "From now on the masks send your temple's roses and raise those who are ready, and tell you what they did. You can take this back with the decision Run Your Temple Yourself."
 spn_order.0108.desc_one:0 "The masks bring you a name: [spn_rose_1.GetTitledFirstName]. They have watched [spn_rose_1.GetHerHim] for a year. They think [spn_rose_1.GetSheHe] has what the [spn_order|E] looks for.\n\nThe note and the rose are ready. Only you can send them."
 spn_order.0108.desc_two:0 "The masks bring you two names: [spn_rose_1.GetTitledFirstName] and [spn_rose_2.GetTitledFirstName]. They have watched both for a year. They think each has what the [spn_order|E] looks for.\n\nThe notes and the roses are ready. Only you can send them."
 spn_order.0108.desc_three:0 "The masks bring you three names: [spn_rose_1.GetTitledFirstName], [spn_rose_2.GetTitledFirstName] and [spn_rose_3.GetTitledFirstName]. They have watched all three for a year. They think each has what the [spn_order|E] looks for.\n\nThe notes and the roses are ready. Only you can send them."
 spn_order.0108.send_one:0 "Send the rose"
 spn_order.0108.send_all:0 "Send a rose to each of them"
 spn_order.0108.send_tt:0 "The Order reaches out. Whoever answers the note begins the tests."
 spn_order.0108.only:0 "Only to [spn_rose_1.GetFirstName]"
 spn_order.0108.only_tt:0 "The others are not put forward again for a year."
 spn_order.0108.none_one:0 "Not this one"
 spn_order.0108.none_one_tt:0 "[spn_rose_1.GetFirstName] is not put forward again for a year."
 spn_order.0108.none_all:0 "None this year"
 spn_order.0108.none_all_tt:0 "None of them is put forward again for a year."
 spn_order.0108.masks:0 "Send them, and leave the temple to the masks from now on"
 spn_order.0108.masks_tt:0 "Every name here gets its note. From now on the masks send your temple's roses and raise those who are ready at the Rite of the Chapter, without asking you. You can take this back with the decision Run Your Temple Yourself."
 spn_order.0150.d.tt:0 "Nobody is raised this year. Those who are ready are put forward again at next year's Rite."
 spn_order.0150.e:0 "Leave the temple to the masks from now on"
 spn_order.0150.e.tt:0 "Those named here are raised now. From now on the masks raise those who are ready and send your temple's roses without asking you. You can take this back with the decision Run Your Temple Yourself."
 spn_order_step_down_decision:0 "Hand On Your Temple"
 spn_order_step_down_decision_desc:0 "Pass the leadership of your temple to another Magistratus. You keep your [spn_order_standing|E] and your place in the [spn_order|E]: stay on as a Magistratus of the temple, or work outside it with the [spn_order_adepti|E]."
 spn_order_step_down_decision_tooltip:0 "Step down as [spn_temple_magus|E]."
 spn_order_step_down_decision_confirm:0 "Hand it on"
 spn_order_step_down_decision_effect_tt:0 "You choose how you step down. Your named heir leads the temple after you; if you named none, its senior member does."
 spn_order_step_down_heir_tt:0 "Another Magistratus of your temple is free to lead it"
 spn_order_step_down_recent_tt:0 "You have not handed on a temple in the last ten years"
 spn_order.2050.t:0 "The Mask Passes"
 spn_order.2050.desc:0 "You have worn the mask of this temple long enough. Somebody else can keep the keys, read the names at the Rite and answer when the masks call."
 spn_order.2050.desc_next:0 "\n\n[spn_sd_next.GetTitledFirstName] will lead it after you."
 spn_order.2050.a:0 "Stay on as a Magistratus of the temple"
 spn_order.2050.a.tt:0 "You step down as [spn_temple_magus|E] and remain a Magistratus of this temple. You keep your [spn_order_standing|E]."
 spn_order.2050.b:0 "Work outside the temple, with the Adepti"
 spn_order.2050.b.tt:0 "You step down as [spn_temple_magus|E] and become one of the [spn_order_adepti|E], a Magistratus who works outside the temple. You keep your [spn_order_standing|E]. Acolytes go to other tutors while there are any."
 spn_order.2050.c:0 "Not yet"
 spn_conclave.0001.desc_chair_passed:0 "The chair of the Grand Magus is empty, and the temples will not wait for ever. The temple that should have called them together passed the call to yours.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_prerogative_passed:0 "Ten years have passed since the [spn_order|E] last decided what it works toward. The temple that should have called the masks together passed the call to yours.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_prerogative_why:0 "Ten years have passed since the [spn_order|E] last decided what it works toward. The Grand Magus has nowhere to host the temples, so the call falls to the oldest temple that has.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.b_will:0 "Not now"
 spn_conclave.0001.b_will.tt:0 "No Conclave is called. You can call one with the decision when you are ready."
 spn_conclave_need_home_tt:0 "You hold land, or have a camp or an estate where the masks can meet"
 spn_conclave_toast_passed:0 "The Call Passes On"
 spn_conclave_toast_passed_desc:0 "You were occupied elsewhere, so the masks asked another temple to call the Conclave."
 spn_conclave_toast_passed_none_desc:0 "You were occupied elsewhere, and no other temple can call the Conclave now, so it is not called."
 spn_order_toast_invite_member:0 "Already One of Us"
 spn_order_toast_invite_member_desc:0 "Your note to [recipient.GetTitledFirstName] came back with a blue rose pressed in it. [recipient.GetSheHe|U] is of the [spn_order|E] already, and now knows that you are too."
 SPN_STORY_FOCUS_ORDER:0 "Showing your chapter of the Order only."
 SPN_STORY_FOCUS_PACK:0 "Showing your pack only."
 SPN_STORY_FOCUS_COVEN:0 "Showing your coven only."
 SPN_STORY_FOCUS_SHOW_ALL:0 "Show All Situations"
 spn_order_ask_join_temple_interaction:0 "Ask to Join Their Temple"
 spn_order_ask_join_temple_interaction_desc:0 "Ask [recipient.GetTitledFirstName], Temple Magus of another temple of the [spn_order|E], to take you into [recipient.GetHerHis] temple. You keep your rank, your [spn_order_standing|E] and the relics you pledged, which go with you to the new Reliquary. An Acolyte is given a new tutor there."
 spn_order_ask_join_temple_interaction_tt:0 "You leave your temple and join [recipient.GetTitledFirstName]'s at your present rank. Anything you have borrowed from the Order goes back to its keeper. You cannot change temples again for five years."
 spn_order_join_temple_head_tt:0 "You lead a temple of your own. Hand it on first (the decision Hand On Your Temple)"
 spn_order_join_temple_moved_tt:0 "You changed temples less than five years ago"
 spn_order_join_temple_free_tt:0 "You are not imprisoned"
 spn_ai_accept_join_magistratus:0 "A Magistratus would serve my temple"
 spn_ai_accept_join_medicum:0 "A Medicum would teach in my temple"
 spn_ai_accept_join_mage:0 "A Mage"
 spn_ai_accept_join_far:0 "Far from their own temple"
 spn_ai_accept_join_standing:0 "Well thought of in the Order"
 spn_ai_accept_join_gregarious:0 "Gregarious"
 spn_ai_accept_join_ambitious:0 "Wants a larger temple"
 spn_ai_accept_join_paranoid:0 "Distrusts a member of another temple"
 spn_ai_accept_join_arrogant:0 "Arrogant"
 spn_ai_accept_join_friend_head:0 "Would not take a member from a friend"
 spn_ai_accept_join_rival:0 "Rival"
 spn_order_joined_my_temple_opinion:0 "Joined My Temple"
 spn_order_left_my_temple_opinion:0 "Left My Temple"
 spn_order_toast_left_temple:0 "A Member Has Left Your Temple"
 spn_order_toast_left_temple_desc:0 "[spn_jt_who.GetTitledFirstName] has asked to join [spn_jt_head.GetTitledFirstName]'s temple, and was taken in."
 spn_order_temples_decision:0 "Change Your Temple"
 spn_order_temples_decision_desc:0 "Move to another temple of the [spn_order|E]. This lists the temples nearest to you that have room, with the Temple Magus who leads each one. Write to one and ask to be taken in; if he agrees, you leave your temple for his. You keep your rank, your [spn_order_standing|E] and the relics you pledged. Use it when your own temple is too far away to take part in, or when you would rather serve under another Temple Magus.\n\nThe ranks, from the lowest: Neophyte (not yet sworn), Acolyte, Medicum, Magistratus, then the Temple Magus who leads a temple. An Adeptus is a Magistratus who works outside his temple for the Adeptus Major of the [spn_gnostic_council|E]."
 spn_order_temples_decision_tooltip:0 "Move to another temple of the Order: see the nearest temples with room and ask one to take you in."
 spn_order_temples_decision_effect_tt:0 "You see the nearest temples that have room for you, and may write to one of them to ask to join it."
 spn_order_temples_decision_confirm:0 "Find Another Temple"
 spn_order.2051.t:0 "Change Your Temple"
 spn_order.2051.desc:0 "You could leave your temple for another. The temples of the Order keep in touch by letter, and every sworn member knows where they meet and who leads them. These are the nearest that have room for one more. Write to one, and its Temple Magus will answer. If he takes you in, you move to his temple at your present rank."
 spn_order.2051.desc_none:0 "You could leave your temple for another. The temples of the Order keep in touch by letter, and every sworn member knows where they meet and who leads them. Just now no other temple has room for one more, so you stay where you are for now."
 spn_order.2051.desc_head:0 "\n\nYou lead a temple yourself. To join another you must first hand yours on."
 spn_order.2051.desc_moved:0 "\n\nYou changed temples not long ago. The Order will not move you again so soon."
 spn_order.2051.a:0 "Write to [spn_tj_1.GetTitledFirstName]"
 spn_order.2051.b:0 "Write to [spn_tj_2.GetTitledFirstName]"
 spn_order.2051.c:0 "Write to [spn_tj_3.GetTitledFirstName]"
 spn_order.2051.d:0 "Write to [spn_tj_4.GetTitledFirstName]"
 spn_order.2051.e:0 "I will stay in my own temple."
 spn_order.2051.write_tt:0 "Opens Ask to Join Their Temple for this Temple Magus, which shows whether the temple can take you."
 spn_order.0161.desc_named:0 "One of the things in the temple's [spn_reliquary|E], [spn_hum_relic.GetName], has started to hum at night. The acolytes will not go near it."
 spn_order.0161.desc_keeper:0 "One of the things in the temple's [spn_reliquary|E], [spn_hum_relic.GetName], has started to hum at night. The acolytes will not go near it, and [spn_hum_keeper.GetTitledFirstName], who keeps it for the temple, has asked for someone who knows what to do."
 spn_order.0161.a.tt:0 "You force it silent with your own power. The acolytes see a Mage do it: you gain 5 [spn_order_standing|E]."
 spn_order.0161.listen_tt:0 "You sit with it through the night and listen, and it goes quiet. The acolytes see who quieted it: you gain 5 [spn_order_standing|E]. In a few days you understand what it wanted."
 spn_order.0161.b.tt:0 "You leave it alone. In a few weeks you hear how it ended: it may go quiet by itself, or another member of your temple may quiet it and earn the [spn_order_standing|E] instead of you."
 spn_order.0161.a.toast:0 "The Reliquary Is Quiet"
 spn_order.0161.a.toast_desc:0 "The relic has stopped humming, and your temple saw who stopped it. You gained 5 [spn_order_standing|E]."
 spn_order.2052.t:0 "What the Relic Wanted"
 spn_order.2052.desc:0 "You sat with the relic until it went quiet, and now you understand what it wanted. It was made to be carried and used, not shut away in the dark, and it was calling for a hand. What it showed you while it hummed stays with you."
 spn_order.2052.desc_keeper:0 "You sat with [spn_hum_relic.GetName] until it went quiet, and now you understand what it wanted. It was made to be carried and used, not shut away in the dark, and it was calling for a hand. [spn_hum_keeper.GetTitledFirstName] keeps it for the temple. What it showed you while it hummed stays with you."
 spn_order.2052.desc_mine:0 "You sat with [spn_hum_relic.GetName] until it went quiet, and now you understand what it wanted. It is the one you pledged to the temple, and it wants to be carried and used, not shut away in the dark. What it showed you while it hummed stays with you."
 spn_order.2052.a:0 "Ask [spn_hum_keeper.GetFirstName] to lend it to me"
 spn_order.2052.a.tt:0 "Opens Ask to Borrow for [spn_hum_keeper.GetFirstName], which shows whether you can borrow it now."
 spn_order.2052.b:0 "I will remember what it showed me."
 spn_order.2053.t:0 "The Relic Is Quiet Again"
 spn_order.2053.desc_quiet:0 "Weeks after you left the humming relic alone, it stopped as suddenly as it began. Nobody did anything, and nothing seems to have come of it."
 spn_order.2053.desc_other:0 "You left the humming relic alone, and [spn_hum_other.GetTitledFirstName] did not. [spn_hum_other.GetSheHe|U] sat up with it for three nights until it went quiet, and the whole temple knows who did it."
 spn_order.2053.a:0 "Good for [spn_hum_other.GetHerHim]."
 spn_order.2053.a.tt:0 "[spn_hum_other.GetTitledFirstName] gains 5 [spn_order_standing|E]."
 spn_order.2053.b:0 "So it did."
 spn_order.2053.b.tt:0 "Nothing changes."
