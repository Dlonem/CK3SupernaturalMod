l_simp_chinese:

### 2.33 -- refreshed from English 27 Aug 2026 (rewritten voice + renumbered chain).
### No translation existed here yet, so nothing was overwritten.
 spn_transition.0001.t:0 "You Should Have Died"
 spn_transition.0001.desc:0 "You remember the blow landing and the sky turning over, and then nothing at all.\n\nWhen you wake you are in a tent, three days behind the battle. The surgeon has already been and gone. He left the bandages on because he did not want to argue with a lord, but there is nothing under them - the wound has closed over clean, no scab and no scar, as though it had been mending for a season instead of three days.\n\nNothing hurts. You press two fingers to your own throat and hold them there a long while, and then you take them away and do not try again."
 spn_transition.0001.desc_felled:0 "You remember [spn_the_one_who_felled_me.GetTitledFirstName] coming through the press, and the blow landing, and the sky turning over. Then nothing at all.\n\nWhen you wake you are in a tent, three days behind the battle. The surgeon has already been and gone. He left the bandages on because he did not want to argue with a lord, but there is nothing under them - the wound has closed over clean, no scab and no scar, as though it had been mending for a season instead of three days.\n\nNothing hurts. You press two fingers to your own throat and hold them there a long while, and then you take them away and do not try again."
 spn_transition.0001.a:0 "Get up - whatever this is, I will work it out standing"
 spn_transition.0002.t:0 "What the Blood Wants"
 spn_transition.0002.desc:0 "For a fortnight you have felt wrong, and today it stops being strange and becomes a problem.\n\nYou are hungry. Not for food - you have eaten, and it changed nothing. From inside your tent you can hear the whole camp: how many men are in it, which one is drunk, which one is bleeding through a bandage he has not changed. You know these things the way you know your own name.\n\nAnd you remember the cup. Someone put it in your hand months ago and made very little of it, and you drank because it would have been rude not to.\n\nYou understand now what was in it, and what it is asking for."
 spn_transition.0002.desc_donor:0 "For a fortnight you have felt wrong, and today it stops being strange and becomes a problem.\n\nYou are hungry. Not for food - you have eaten, and it changed nothing. From inside your tent you can hear the whole camp: how many men are in it, which one is drunk, which one is bleeding through a bandage he has not changed.\n\nAnd you remember the cup. [spn_the_donor.GetTitledFirstName] put it in your hand months ago and made very little of it at the time.\n\n[spn_the_donor.GetSheHe] is sitting outside your tent when you come out, and does not look surprised to see you standing. \"You have questions,\" [spn_the_donor.GetSheHe] says. \"I will answer them. But answer one of mine first - how hungry are you?\""
 spn_transition.0002.a:0 "There is a man here who will not be missed"
 spn_transition.0002.a_tt:0 "Feed, and finish what the blood started."
 spn_transition.0002.b:0 "You knew this would happen - help me through it"
 spn_transition.0002.b_tt:0 "Let them see you through it. Nobody has to die for this."
 spn_transition.0002.c:0 "I refuse it - let this finish however it finishes"
 spn_transition.0002.c_tt:0 "Refuse. The hunger will not ask politely a second time."
 spn_transition.0003.t:0 "The Last of It"
 spn_transition.0003.desc:0 "Another fortnight, and you have not fed.\n\nYou have not slept either, because whatever you do at night now is not sleeping. You lie still and listen to the camp and count the heartbeats in it, and you have learned to tell them apart.\n\nYou are cold in a way that has nothing to do with the weather, and your hands have started to shake, and this morning a servant flinched when you looked at him.\n\nThis is the end of the argument. Either you go out and take what you need, or you lie here and find out what the other thing is."
 spn_transition.0003.a:0 "Enough - I am not dying twice"
 spn_transition.0003.a_tt:0 "Feed. It has waited long enough."
 spn_transition.0003.b:0 "Let it finish properly"
 spn_transition.0003.b_tt:0 "Refuse a second time. There will not be a third."
 spn_death_transition_refused:0 "Refused the Blood"
 spn_death_transition_refused_desc:0 "[ROOT.Char.GetShortUIName] fell in battle with a vampire's blood already in [ROOT.Char.GetHerHis] veins, and woke neither living nor dead. [ROOT.Char.GetHeShe] would not feed, and so the transition was never completed."
 spn_sc_blood_took_the_blow:0 "The Blood Answered"
