l_polish:
 spn_trails:0 "$situation_type_spn_trails$"
 situation_type_spn_trails:0 "Supernatural Trails"
 situation_type_spn_trails_desc:0 "Every county where something unnatural has left a [spn_trail|E]. Each one carries #high Something Stalks Here#!, which anyone can see on the county itself; this map gathers them in one place.\n\nThe colour shows how bad the trail is: [spn_trail_faint|E], [spn_trail_strong|E] or [spn_trail_blood|E]. A trail leaves the map when it goes cold, five years after its last incident, or when it is cleared.\n\nHow a county comes to have a trail at all: [spn_trails_watch|E]."
 situation_spn_trails:0 "$situation_type_spn_trails$"
 situation_spn_trails_desc:0 "$situation_type_spn_trails_desc$"
 spn_trails_watch:0 "The Countryside Talks"
 spn_trails_watch_desc:0 "$game_concept_spn_trails_watch_desc$"
 spn_trails_spn_trails_watch_situation_phase:0 "$spn_trails_watch$"
 spn_trails_spn_trails_watch_situation_phase_desc:0 "$game_concept_spn_trails_watch_desc$"
 spn_trails_sub_region_spn_trail_faint:0 "Rumoured"
 spn_trails_sub_region_spn_trail_faint_desc:0 "$game_concept_spn_trail_faint_desc$\n\nCounties: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_sub_region_spn_trail_strong:0 "Troubled"
 spn_trails_sub_region_spn_trail_strong_desc:0 "$game_concept_spn_trail_strong_desc$\n\nCounties: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_sub_region_spn_trail_blood:0 "Bloodied"
 spn_trails_sub_region_spn_trail_blood_desc:0 "$game_concept_spn_trail_blood_desc$\n\nCounties: [SituationSubRegion.GetAffectedTitlesList]"
 spn_trails_participant_group_spn_trail_watchers:0 "Watchers"
 spn_trails_participant_group_spn_trail_watchers_desc:0 "Nobody takes part in the trails. They are a record of what the countryside has noticed."
 game_concept_spn_trail_faint:0 "Rumoured"
 game_concept_spn_trail_faint_desc:0 "A [spn_trail|E] with one or two incidents on record and no death among them. People are talking, but the county's lord is only sent word at the third incident."
 game_concept_spn_trail_strong:0 "Troubled"
 game_concept_spn_trail_strong_desc:0 "A [spn_trail|E] with three or more incidents on record and no death among them. At the third, the county's lord is sent word, unless the culprit holds the county himself. The more incidents a trail has, the harder it pulls a [spn_hunter|E] who is nearby."
 game_concept_spn_trail_blood:0 "Bloodied"
 game_concept_spn_trail_blood_desc:0 "A [spn_trail|E] with a death on record: a killing while the trail was open, or one in the year of talk that led to it. It stays on record for as long as the trail does. A killing that stays mere talk, with nothing else inside the year, never reaches the record."
 game_concept_spn_trails_watch:0 "How a Trail Begins"
 game_concept_spn_trails_watch_desc:0 "The first incident on clean ground is usually only talk that nobody can place, and it fades within a year. A second incident inside that year opens a [spn_trail|E], and now and then the first one is noticed at once. Every later incident is added to the trail and keeps it warm for another five years. A trail is cleared early when its culprit dies with nobody left to blame, or by the ways creatures and hunters have of clearing one."
 game_concept_spn_trail_watchers:0 "Those Who Watch"
 game_concept_spn_trail_watchers_desc:0 "Creatures of the night, witches, Mages, members of the Order and hunters keep count of trails, and only they have the Trails button on their screen. The trails themselves are no secret: every county listed shows #high Something Stalks Here#! to anyone who looks. What left a trail, and when it was last seen, is read by a $spn_trailsman_court_position$ in your service. Without one, you can tell only your own trails and those left by someone of your pack, coven or temple whose nature you know."
 spn_hud_trails_tt:0 "#T Supernatural Trails#!\nLists every county where something unnatural has left a [spn_trail|E]: how bad it is and how many incidents are on record. A $spn_trailsman_court_position$ in your service also tells you what left each one and when it was last seen. A [spn_hunter|E] can plan a hunt from there.\n\nShown to [spn_trail_watchers|E]."
 spn_trails_window_title:0 "Supernatural Trails"
 spn_trails_window_intro:0 "Every county where something unnatural has been noticed and now carries #high Something Stalks Here#!. A [spn_trail|E] stays open for five years after its last incident, unless it is cleared sooner."
 spn_trails_plan_hunt:0 "Plan a Supernatural Hunt"
 spn_trails_plan_hunt_tt:0 "#T [ActivityType.GetNameNoTooltip]#!\n[ActivityType.GetCanPlanActivityTooltip( GetPlayer )]\n\nOpens the hunt. When you choose where to ride, the trail counties you can hunt are the ones you can pick, and the most promising are pinned on the map."
 spn_trails_not_a_hunter:0 "Only a grown [spn_hunter|E] who holds land or leads a band of adventurers can ride after a trail."
 spn_trails_none:0 "No trail is open anywhere. When a county begins to talk of something unnatural, it is listed here."
 spn_trails_band_blood:0 "[spn_trail_blood|E]: a death is on record."
 spn_trails_band_strong:0 "[spn_trail_strong|E]: three or more incidents on record, no death."
 spn_trails_band_faint:0 "[spn_trail_faint|E]: one or two incidents on record, no death."
 spn_trails_row_name:0 "[Title.GetName], held by [Title.GetHolder.GetShortUIName]"
 spn_trails_row_kind_unknown:0 "Left by: #weak unknown#!"
 spn_trails_row_kind_self:0 "Left by: you"
 spn_trails_row_kind_vampire:0 "Left by: a vampire"
 spn_trails_row_kind_werewolf:0 "Left by: a werewolf"
 spn_trails_row_kind_demon:0 "Left by: a demon"
 spn_trails_row_kind_witch:0 "Left by: a witch"
 spn_trails_row_count:0 "Incidents: [Title.MakeScope.Var('spn_menace_count').GetValue|0]"
 spn_trails_row_seen:0 "Last seen: [Title.MakeScope.Var('spn_trail_seen_year').GetValue|0]"
 spn_trails_row_seen_unknown:0 "Last seen: #weak unknown#!"
 spn_trails_trailsman_yes:0 "Your $spn_trailsman_court_position$ reads these trails for you: what left each one and when it was last seen."
 spn_trails_trailsman_no:0 "A $spn_trailsman_court_position$ in your court or camp reads the trails: what left each one and when it was last seen. Without one, you can tell only your own trails and those left by someone of your pack, coven or temple whose nature you know."
