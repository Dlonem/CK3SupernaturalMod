l_polish:
 spn_order.0829.b.tt:0 "Every member of your temple holds the debt with you, and your house will think less of the house that answers for [spn_wk_target.GetShortUIName]."
 house_relation_reason_spn_blood_debt_desc:0 "[char.GetShortUINameNotMe|U] holds a blood debt against the wolves of [target_char.GetShortUINameNotMe]"
 spn_hold_the_unification_unified_tt:0 "Your [spn_pack|E] has not been unified before"
 spn_gathering.0305.desc_same:0 "[spn_un_elder.GetShortUIName] binds your hand to [spn_un_spouse.GetShortUIName]'s with a strip of hide and speaks the old words over you both.\n\nYou already run as one pack. If there are no secrets between you, the rite will make it more than that, and every wolf in it will be more than it was."
 spn_gathering.0305.a.tt_same:0 "[spn_un_spouse.GetShortUIName] leads your pack beside you. Every wolf in it is [spn_evolved|E]."
 SPN_PACK_KNOWN:0 "Other Packs"
 spn_pack.2000.t:0 "Red Eyes in Your Pack"
 spn_pack.2000.desc:0 "[spn_ta.GetShortUIName] came to you this morning, and [spn_ta.GetHerHis] eyes were red. The pack saw it before you did. Half of them will not look at you now, and the other half are watching to see what you do.\n\n[spn_ta.GetSheHe|U] did not ask for the pack. [spn_ta.GetSheHe|U] told you it was [spn_ta.GetHerHis]."
 spn_pack.2000.a:0 "[spn_ta.GetSheHe|U] leads now."
 spn_pack.2000.a.tt:0 "[spn_ta.GetShortUIName] becomes this pack's alpha. You keep your standing."
 spn_pack.2000.b:0 "Then [spn_ta.GetSheHe] must take it."
 spn_pack.2000.b.tt:0 "You fight [spn_ta.GetShortUIName] for the pack, wolf against wolf. If [spn_ta.GetSheHe] wins, [spn_ta.GetSheHe] leads. If you win, [spn_ta.GetSheHe] leaves to found a pack of [spn_ta.GetHerHis] own, and some of yours may follow."
 spn_pack.2000.c:0 "Go, and take who will follow."
 spn_pack.2000.c.tt:0 "[spn_ta.GetShortUIName] leaves and founds a pack of [spn_ta.GetHerHis] own. Some of your wolves may go with [spn_ta.GetHerHim]."
 spn_pack.0200.desc_force:0 "\n\n[spn_feud_taker.GetShortUIName] took it from [spn_feud_loser.GetShortUIName]'s body."
 spn_pack.0200.desc_fight:0 "\n\n[spn_feud_taker.GetShortUIName] won it from [spn_feud_loser.GetShortUIName] at the fire."
 spn_pack.0200.desc_demand:0 "\n\n[spn_feud_taker.GetShortUIName] has it now, and [spn_feud_loser.GetShortUIName] did not give it up willingly."
 spn_pack.0200.b:0 "[spn_feud_taker.GetShortUIName] will answer for it."
 spn_pack.0200.b.tt:0 "You call out [spn_feud_taker.GetShortUIName] in a Challenge. Winning settles who is stronger. It does not bring the hide back."
 spn_pack.0200.c:0 "Let it go. The hide chose."
 spn_pack.0200.c.tt:0 "You let the grudge go, and so does [spn_feud_other.GetShortUIName]. Some will call it weakness."
 spn_pack.0013.desc_terms:0 "Your pack and [spn_sa_new.GetShortUIName]'s are one pack now. The two alphas agreed it between them, and [spn_sa_new.GetShortUIName] leads."
 spn_offer_pack_terms_interaction:0 "Offer Pack Terms"
 spn_offer_pack_terms_interaction_desc:0 "Settle terms with another alpha: one of you runs under the other's lead, or the two packs swear a [spn_blood_pact|E]."
 spn_offer_pack_terms_interaction_notification:0 "[actor.GetShortUIName|U] offers terms between your packs."
 spn_offer_pack_terms_heading:0 "The Terms"
 spn_terms_my_lead:0 "Run under my lead"
 spn_terms_my_lead_desc:0 "Their pack joins yours. [recipient.GetShortUIName] runs in it at [recipient.GetHerHis] standing."
 spn_terms_your_lead:0 "I will run under yours"
 spn_terms_your_lead_desc:0 "Your pack joins theirs. You run in it at your standing."
 spn_terms_pact:0 "Swear a Blood Pact"
 spn_terms_pact_desc:0 "Both packs stay as they are, bound by a [spn_blood_pact|E]."
 spn_terms_pact_sworn_tt:0 "Your packs have not already sworn a [spn_blood_pact|E]"
 spn_pack_terms_unified_tt:0 "Neither pack was joined by the [spn_unification|E]"
 spn_terms_my_lead_tt:0 "[recipient.GetShortUIName]'s pack joins yours, and [recipient.GetSheHe] runs in it."
 spn_terms_your_lead_tt:0 "Your pack joins [recipient.GetShortUIName]'s, and you run in it."
 spn_terms_pact_tt:0 "Your packs swear a [spn_blood_pact|E]."
 spn_ai_terms_they_follow:0 "Their pack would join mine"
 spn_ai_terms_give_up_lead:0 "I would give up my pack"
 spn_ai_terms_smaller:0 "My pack is far smaller"
 spn_ai_terms_bigger:0 "My pack is the bigger one"
 spn_ai_terms_beaten:0 "[actor.GetSheHe|U] beat me in a Challenge"
 spn_ai_terms_ambitious:0 "I mean to lead, not follow"
 spn_ai_terms_pact:0 "Our packs are bound by a [spn_blood_pact|E]"
 spn_ai_terms_gregarious:0 "I like company"
 spn_ai_terms_feud:0 "There is a [spn_hide_feud|E] between us"
 spn_ai_terms_paranoid:0 "I do not trust [actor.GetHerHim]"
 spn_hide_feat_1_friendly_player:0 "You tore through the line, and [TARGET_CHARACTER.GetShortUINameNoTooltip] did not get up."
 spn_hide_feat_1_enemy_player:0 "You were dragged down by something that was not a man."
 spn_hide_feat_2_friendly_player:0 "You went into the press and came out red. [TARGET_CHARACTER.GetShortUINameNoTooltip] did not come out at all."
 spn_hide_feat_2_enemy_player:0 "You were torn apart in the press."
 spn_hide_feat_3_friendly_player:0 "You moved faster than any man should, and [TARGET_CHARACTER.GetShortUINameNoTooltip] fell."
 spn_hide_feat_3_enemy_player:0 "You fell to [CHARACTER.GetShortUINameNoTooltip], and the wounds were not from any blade."
 spn_hide_feat_hunter_friendly_player:0 "You found the beast in the enemy's ranks and drew its blood."
 spn_hide_feat_hunter_enemy_player:0 "A hunter in their ranks, [CHARACTER.GetShortUINameNoTooltip], found you and drew blood."
 spn_hide_clash_friendly_player:0 "Two beasts met on the field, and you came out of it on top."
 spn_hide_clash_enemy_player:0 "Two beasts met on the field, and you came out of it bloodied."
 spn_vade_blow_turned_aside_friendly_player:0 "A blow that should have killed you found the man beside you instead."
 spn_vade_blow_turned_aside_enemy_player:0 "A blow that should have killed [CHARACTER.GetShortUINameNoTooltip] found the man beside [CHARACTER.GetHerHim] instead."
 spn_let_it_take_me_war_tt:0 "You, or the lord you serve, are at war"
 spn_satiate_bloodhunger_maxed_tt:0 "Your vampirism or your lycanthropy is not yet at its peak"
 spn_gathering.0307.desc_held:0 "Late, when the fire is low, the oldest wolf at the circle sits down beside you. He has been watching you all night.\n\nHe tells you that [spn_tale_shrine_hide.GetName] is in [spn_tale_holder.GetShortUIName]'s keeping, and that nobody wears it."
 spn_gathering.0307.not_yet_held:0 " He looks you over once more. It would not have you yet, he says, but of the hides nobody wears it is the nearest to what you are."
 spn_gathering.0307.a.tt_held:0 "You know who holds [spn_tale_shrine_hide.GetName]. How you get it from [spn_tale_holder.GetShortUIName] is up to you."
 spn_hide.0380.desc_agent:0 "\n\n[spn_errand_agent.GetShortUIName] will go for you."
 spn_hide.0380.go_agent_tt:0 "[spn_errand_agent.GetShortUIName] sets out. When [spn_errand_agent.GetSheHe] reaches the shrine, you decide what happens next."
 spn_hide.0381.found_agent:0 "A letter comes from [spn_errand_county.GetName]. [spn_errand_agent.GetShortUIName] has found the [spn_errand_faith.HouseOfWorship], and [spn_errand_hide.GetName] hangs inside it, where anyone can see it.\n\nThe [spn_errand_faith.PriestNeuterPlural] lock the doors at night and sleep soundly. [spn_errand_agent.GetSheHe|U] is waiting for your word."
 spn_hide.0381.gone_agent:0 "A letter comes from [spn_errand_county.GetName]. [spn_errand_agent.GetShortUIName] found the shrine, but the hide you sent [spn_errand_agent.GetHerHim] for, [ROOT.Char.Custom('spn_ErrandHideName')], was gone before [spn_errand_agent.GetSheHe] got there. Nobody would say where.\n\n[spn_errand_agent.GetSheHe|U] is coming home with nothing but the story."
 spn_hide.0381.gone_named:0 "A letter comes from [spn_errand_county.GetName]. Your man found the shrine, but the hide you sent him for, [ROOT.Char.Custom('spn_ErrandHideName')], was gone before he got there. Nobody would say where.\n\nHe is coming home with nothing but the story."
 spn_hide_errand_name_unknown:0 "the hide"
 spn_hide_errand_lean_good_tt:0 "It looks likely to work."
 spn_hide_errand_lean_even_tt:0 "It could go either way."
 spn_hide_errand_lean_poor_tt:0 "It is a long chance."
 spn_hide.0381.a.tt:0 "Your man tries to walk out with it. If he is caught, they will know who sent him."
 spn_hide.0381.a.agent_tt:0 "[spn_errand_agent.GetShortUIName] tries to walk out with it. If [spn_errand_agent.GetSheHe] is caught, [spn_errand_agent.GetSheHe] will be held there, and they will know who sent [spn_errand_agent.GetHerHim]."
 spn_hide.0381.a.failure_agent:0 "[spn_errand_agent.GetShortUIName] is caught and held, and they know who sent [spn_errand_agent.GetHerHim]."
 spn_hide.0381.b.agent_tt:0 "[spn_errand_agent.GetShortUIName] comes home safe."
 spn_hide.0381.won_t:0 "The Hide Is Yours"
 spn_hide.0381.lost_t:0 "The Hide Stays Where It Is"
 spn_hide.0381.powder:0 "Throw the Powder in the shrine."
 spn_hide.0381.powder.tt:0 "Whatever happens, nobody at the shrine will remember your man. The Powder is spent."
 spn_hide.0381.powder.success:0 "Nobody at the shrine remembers a stranger, and the hide is on its way to you."
 spn_hide.0381.powder.failure:0 "Your man came back with nothing, and nobody there remembers him. The Powder is spent."
 spn_hide.0381.wolf:0 "Go yourself, by night."
 spn_hide.0381.wolf.tt:0 "You go in the wolf's shape, alone. If it goes wrong you will be hurt, and the county will talk of a wolf."
 spn_hide.0381.wolf.success:0 "You were in and out before the dogs woke. The hide is yours."
 spn_hide.0381.wolf.failure:0 "They were waiting. You got away hurt and empty-handed, and the county is talking about a wolf."
 spn_hide.0381.pack:0 "Send a wolf of the pack instead."
 spn_hide.0381.pack.tt:0 "[spn_errand_wolf.GetShortUIName] goes in your place. If it goes wrong, [spn_errand_wolf.GetSheHe] pays for it in blood, and the county will talk of a wolf."
 spn_hide.0381.pack.success:0 "[spn_errand_wolf.GetShortUIName] brought it back to you."
 spn_hide.0381.pack.failure:0 "[spn_errand_wolf.GetShortUIName] came back hurt and empty-handed, and the county is talking about a wolf."
 spn_hide.0381.compel:0 "Make the keeper bring it to you."
 spn_hide.0381.compel.tt:0 "Your voice can reach [spn_errand_keeper.GetShortUIName] across the distance. If it fails, someone will notice what you are."
 spn_hide.0381.compel.success:0 "[spn_errand_keeper.GetShortUIName] sent it to you as a gift, and does not quite know why."
 spn_hide.0381.compel.failure:0 "[spn_errand_keeper.GetShortUIName] shook you off. The county is talking about something that came in the night."
 SPN_PACK_REST:0 "The Rest of the Pack"
 spn_terms_not_alpha_tt:0 "Only your pack's alpha can offer terms for it"
 spn_terms_no_pack_tt:0 "You must lead a [spn_pack|E] to offer terms. Found one, or ask to run with theirs"
 spn_pack.0102.desc_intro:0 "[spn_mo_ours.GetShortUIName] met [spn_mo_theirs.GetShortUIName] at the edge of the woods tonight."
 spn_pack.0102.desc_pack_house:0 " [spn_mo_theirs.GetSheHe|U] runs with the House [spn_mo_other.GetHouse.GetBaseName] pack of [spn_yf_other_land.GetName], under its alpha, [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_pack_land:0 " [spn_mo_theirs.GetSheHe|U] runs with the pack of [spn_yf_other_land.GetName], under its alpha, [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_pack_alpha:0 " [spn_mo_theirs.GetSheHe|U] runs with the pack of [spn_mo_other.GetTitledFirstName]."
 spn_pack.0102.desc_ring:0 " The two of them are circling each other now, hackles up, and the wolves of both packs have made a ring around them. Every one of them is waiting to see what you do."
 spn_pack.0102.desc_odds:0 "\n\nThis is no game. There is bad blood between your pack and [spn_mo_other.GetShortUIName]'s, and if you let it run, one of them may not get up again."
 spn_pack.0102.desc_game:0 "\n\nIt is the kind of fight young wolves have. Someone will limp home, and that will likely be the end of it."
 spn_pack.0102.part:0 "Pull them apart."
 spn_pack.0102.settle:0 "Let them settle it."
 spn_pack.0102.settle.tt:0 "They fight it out. The loser will be hurt."
 spn_pack.0102.settle.tt_odds:0 "Between your packs this is a real fight. The loser will be hurt, and may be killed."
 spn_pack.0102.back:0 "I stand behind [spn_mo_ours.GetShortUIName]."
 spn_pack.0102.back.tt:0 "Your name goes with [spn_mo_ours.GetShortUIName] into the fight. If [spn_mo_ours.GetSheHe] wins, you gain [prestige|E] and [spn_mo_ours.GetSheHe] gains [spn_pack_standing|E]. If [spn_mo_ours.GetSheHe] loses, you lose [prestige|E]."
 spn_pack.0102.back.tt_house:0 "Taking a side sours relations between your [house|E] and House [spn_mo_other.GetHouse.GetBaseName] a little, and more if a wolf dies. Fight after fight, the two houses can come to a feud."
 spn_pack.0102.back.tt_odds:0 "You and [spn_mo_other.GetShortUIName] may become rivals."
 spn_pack.2001.t:0 "After the Fight"
 spn_pack.2001.desc_killed:0 "[spn_mo_ours.GetShortUIName] came home alone, and quiet. [spn_clash_loser.GetShortUIName] did not get up. [spn_mo_other.GetShortUIName]'s wolves carried [spn_clash_loser.GetHerHim] home between them, and they will not forget whose wolf did it."
 spn_pack.2001.desc_died:0 "It was over quickly. [spn_clash_winner.GetShortUIName] stood over [spn_mo_ours.GetShortUIName] at the end, and [spn_mo_ours.GetShortUIName] did not get up. Your wolves brought [spn_mo_ours.GetHerHim] home between them."
 spn_pack.2001.desc_won_odds:0 "[spn_mo_ours.GetShortUIName] and [spn_mo_theirs.GetShortUIName] fought in earnest, with the bad blood of both packs behind them. Yours came home first, torn and bleeding, and [spn_mo_theirs.GetShortUIName] was carried back to [spn_mo_other.GetShortUIName]'s wolves."
 spn_pack.2001.desc_lost_odds:0 "[spn_mo_ours.GetShortUIName] and [spn_mo_theirs.GetShortUIName] fought in earnest, with the bad blood of both packs behind them. Yours came home torn and limping, and [spn_mo_other.GetShortUIName]'s wolves are making a story of it already."
 spn_pack.2001.desc_backed_won:0 "\n\nEveryone saw you stand behind [spn_mo_ours.GetShortUIName], and everyone saw [spn_mo_ours.GetHerHim] win."
 spn_pack.2001.desc_backed_lost:0 "\n\nEveryone saw you stand behind [spn_mo_ours.GetShortUIName], and everyone saw [spn_mo_ours.GetHerHim] lose."
 spn_pack.2001.desc_seen:0 "\n\nA shepherd saw some of it from across the valley. He will not keep it to himself."
 spn_pack.2001.desc_none:0 ""
 spn_pack.2001.a:0 "Young wolves."
 spn_pack.2001.a_dead:0 "It should not have come to this."
