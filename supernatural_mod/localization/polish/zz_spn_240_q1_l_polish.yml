 spn_relic_beetle_custody_interaction:0 "Take the Beetle into Custody"
 spn_relic_beetle_custody_interaction_desc:0 "Take the Homunculus Beetle into your own keeping. It stays pledged to your temple's [spn_reliquary|E]."
 spn_relic_beetle_custody_interaction_tt:0 "The Homunculus Beetle passes to you, still pledged to your temple."
 spn_relic_custody_pledged_tt:0 "[recipient.GetFirstName] keeps it pledged to your temple's [spn_reliquary|E], and it is not on loan"
 spn_relic_toast_beetle_custody:0 "Your Temple Magus Has Taken the Beetle"
 spn_relic_minor_ps_tt:0 "You have a little power to spare"
 spn_relic_toast_powder_spent:0 "Your Powder Was Spent"
 spn_relic_toast_powder_thrown:0 "The Powder Did Its Work"
 spn_relic_toast_powder_thrown_desc:0 "Your Obfuscation Powder spilled where you stood. The people here have already forgotten what they saw, and the Powder is gone."
 spn_beetle_toast_loan_loosed:0 "The Lent Beetle Is Loose"
 spn_beetle_toast_loan_loosed_desc:0 "[spn_bs_user.GetTitledFirstName] borrowed the Homunculus Beetle from the [spn_reliquary|E] and has used it."
 spn_order_toast_reliquary_seeded:0 "Your Temple's Reliquary Has Its First Relics"
 spn_relic_fors_name:0 "The Fors Factorum"
 spn_relic_fors_desc:0 "A letter sealed in blue wax, in the hand of the Order's founders. It sets down the working of the Fors Factorum: for a few years your spells cost you no power, and then the spell takes its price from your body. The Order keeps it in a [spn_reliquary|E] and lets few read it."
 spn_relic_fors_modifier:0 "The Fors Factorum"
 spn_relic_fors_modifier_desc:0 "Whoever keeps the founders' letter reads it again and again."
 spn_relic.2090.t:0 "The Relics of the World"
 spn_relic.2090.desc:0 "Relics in the world now:\nGlove [GetGlobalVariable( 'spn_relic_n_glove' ).GetValue|0], Necrophone [GetGlobalVariable( 'spn_relic_n_necrophone' ).GetValue|0], Blade [GetGlobalVariable( 'spn_relic_n_blade' ).GetValue|0], Pendant [GetGlobalVariable( 'spn_relic_n_pendant' ).GetValue|0], Mirror [GetGlobalVariable( 'spn_relic_n_mirror' ).GetValue|0], Bell [GetGlobalVariable( 'spn_relic_n_bell' ).GetValue|0], Chains [GetGlobalVariable( 'spn_relic_n_chains' ).GetValue|0]\nPowder [GetGlobalVariable( 'spn_relic_n_powder' ).GetValue|0], Seal [GetGlobalVariable( 'spn_relic_n_seal' ).GetValue|0], Beetle [GetGlobalVariable( 'spn_relic_n_beetle' ).GetValue|0], Fors Factorum [GetGlobalVariable( 'spn_relic_n_fors' ).GetValue|0]\nPledged to a Reliquary: [GetGlobalVariable( 'spn_relic_n_pledged' ).GetValue|0]"
 spn_relic.2090.a:0 "Rebuild every Reliquary list, and give relics to any empty temple not yet given them"
 spn_relic_debug_count_log:0 "Supernatural relic count: glove [GetGlobalVariable( 'spn_relic_n_glove' ).GetValue|0], necrophone [GetGlobalVariable( 'spn_relic_n_necrophone' ).GetValue|0], blade [GetGlobalVariable( 'spn_relic_n_blade' ).GetValue|0], pendant [GetGlobalVariable( 'spn_relic_n_pendant' ).GetValue|0], mirror [GetGlobalVariable( 'spn_relic_n_mirror' ).GetValue|0], bell [GetGlobalVariable( 'spn_relic_n_bell' ).GetValue|0], chains [GetGlobalVariable( 'spn_relic_n_chains' ).GetValue|0], powder [GetGlobalVariable( 'spn_relic_n_powder' ).GetValue|0], seal [GetGlobalVariable( 'spn_relic_n_seal' ).GetValue|0], beetle [GetGlobalVariable( 'spn_relic_n_beetle' ).GetValue|0], fors [GetGlobalVariable( 'spn_relic_n_fors' ).GetValue|0], pledged [GetGlobalVariable( 'spn_relic_n_pledged' ).GetValue|0]"
