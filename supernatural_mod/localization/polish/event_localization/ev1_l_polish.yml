 ev2.55.title:0 "Plotki o magicznych artefaktach"
 ev2.55.desc:0 "Twoje źródła twierdzą, że [mmage.GetTitledFirstName] prawdopodobnie jest w posiadaniu magicznego przedmiotu. Lepiej nie ignorować takiej informacji, to może być coś więcej niż zwykła plotka."
 ev2.55.a:0 "Ten przedmiot powinien należeć do mojego sabatu."
 ev2.55.b:0 "Nie mam na to czasu."
 ev2.56.title:0 "Magiczna Transmutacja"
 ev2.56.desc:0 "Twoje ostatnie alchemiczne eksperymenty miały ciekawy efekt uboczny - udało ci się wytworzyć pewne ilości czystego złota."
 ev2.56.a:0 "To sfinansuje moje kolejne badania."
 ev2.56.b:0 "Zatrzymam złoto."
 ev2.57.title:0 "Król-Czarnoksiężnik"
 ev2.57.desc:0 "Bycie wiedźmą to wyzwanie, ale bycie władcą również. Zazwyczaj te sprawy nie kolidują ze sobą, ale czasami jedno trzeba przedłożyć ponad drugie."
 ev2.57.a:0 "Skupię się na czarnoksięstwie."
 ev2.57.b:0 "Skupię się na sprawowaniu władzy."
 ev2.59.title:0 "Kooperacja"
 ev2.59.desc:0 "Co dwie głowy to nie jedna - znajomość innego punktu widzenia może być pouczająca i przyśpieszyć twoje badania. [wwitch.GetTitledFirstName] wydaje się być osobą, z którą warto nawiązać współpracę dla obopólnej korzyści."
