 ev2.48.title:0 "Przewrót Pałacowy"
 ev2.48.desc:0 "The screams woke you up in the night. You realized that a group of armed soldiers burst into the palace.W nocy obudziły cię krzyki. Zdajesz sobie sprawę, że grupa uzbrojonych żołnierzy wtargnęła do twojego zamku - raczej nie mają dobrych zamiarów."
 ev2.48.a:0 "Straż! Intruzi...!"
 ev2.48.b:0 "Zatrzymam ich swoją mocą!"
 ev2.48.c:0 "Muszę uciekać!"
 ev2.48.a_ct1:0 "Napastnicy zostali odparci"
 ev2.48.a_ct2:0 "Przewrót się udał"
 ev2.48.c_ct:0 "Przewrót się udał, ale udało ci się uciec"
