 ev2.53.title:0 "Wywiad Nadwornego Maga"
 ev2.53.desc:0 "Twój nadworny mag, [watcher.GetTitledFirstName], przekazuje ci ważną wiadomość.\n 'Mój władco, wyczuwam przepływ magicznych mocy. Ktoś w pobliżu rzuca magiczne zaklęcie.'"
 ev2.53.a:0 "Dzięki za informacje..."
 ev2.54.desc:0 "Twój nadworny mag, [watcher.GetTitledFirstName], przekazuje ci ważną wiadomość.\n 'Mój władco, wyczuwam przepływ magicznych mocy. To magiczne zaklęcie, udało mi się ustalić jego źródło. Odpowiada za to [magic_user.GetTitledFirstName].'"
