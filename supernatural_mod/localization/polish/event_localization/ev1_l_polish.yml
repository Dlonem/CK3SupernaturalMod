 ev2.46.title:0 "Oneiromancja"
 ev2.46.desc:0 "Zdajesz sobie sprawę, że twoje sny cz.ęsto pokazują przyszłość, lub w jakiś przedziwny sposób pozwalają ci wpływać na rzeczywistość."
 ev2.46.a:0 "Muszę lepiej zbadać te zjawisko."
 ev2.46.b:0 "To może być użyteczne."
 oneiromancy_modifier:0 "Oneiromancja"
 ev2.47.title:0 "Źródło Magicznej Energii"
 ev2.47.desc:0 "Masz okazję obserwowania magicznej anomalii powiązanej z przepływem magicznych mocy. Chyba jesteś w stanie zaabsorbować część tej energii."
 ev2.47.a:0 "To może się przydać w kolejnych eksperymentach"
 ev2.47.b:0 "Znajdę do tego praktyczne zastosowanie."
 ev2.47.a_ct:0 "Otrzymasz punkt rozwoju magii"
