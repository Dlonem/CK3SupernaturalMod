 ev2.50.title:0 "Długa Noc"
 ev2.50.desc:0 "Atakujący zostali odparci po trudnych walkach, ale wygląda na to, że byli zaledwie odwróceniem uwagi. Twoje magiczne artefakty zniknęły."
 ev2.50.a:0 "Co?!"
 ev2.50.a_ct:0 "Twoje magiczne przedmioty zniknęły."
