 ev17.0.c:0 "Wezmę złoto i przedmiot."
 ev18.0.title:0 "Żegnaj Demonie"
 ev18.0.desc:0 "Światło przygasa i demon rozpływa się w powietrzu. Zniknął, a ty wciąż żyjesz."
 ev18.0.a:0 "Co za ulga."
 belial_name:0 "Belial"
 belial_nickname:0 "Instrument Gniewu"
 belial_nickname_desc:0 "Instrument Gniewu"
 ev20.0.desc:0 "'Stoisz przed lordem piekła, Belialem' - rzekł demon - 'Jestem jednym z czterech piekielnych władców. Mów czego chcesz, śmiertelniku.'"
 ev20.0.a:0 "Belial we własnej osobie... Poszukuję mocy i mądrości."
 ev20.0.b:0 "Musisz wypełnić moją wolę, demonie."
 ev20.0.c:0 "E... nieważne, znikaj!"
 ev21.0.desc:0 "Uważaj na swój ton, śmiertelniku. Dzisiaj twój ochronny krąg nas oddziela, ale nie zawsze musi tak być. Zapewniam, że kiedyś spotkamy się... w innych okolicznościach."
 ev21.0.a:0 "Wątpię, demonie. A teraz, moje życzenie..."
 ev21.0.b:0 "Spokojnie, nie chciałem cię urazić."
 ev21.0.c:0 "Jesteś żałosny. Wracaj do piekła."
 ev22.0.desc:0 "Skoro mnie przyzwałeś, muszę ci coś dać. Niepokonaną armię? Niezwykłą siłę? Szacunek innych władców?"
 ev22.0.a:0 "Potrzebuję armii."
 ev22.0.a_ct:0 "Negocjacje będą kontynuowane"
 ev22.0.b:0 "Siłę."
 ev22.0.c:0 "Szacunek."
 strength_ohm_modifier:0 "Siła stu mężczyzn"
 demonic_charm_modifier:0 "Demoniczny Czar"
 belial_blessing_modifier:0 "Błogosławieństwo Beliala"
 ev23.0.desc:0 "Hmm... tak. Twoja armia będzie niezwyciężona, jeśli uczynisz mnie generałem. Mogę ci służyć przez 10 lat w zamian za wolność. Oczywiście, uwolnisz mnie w tym świecie."
 ev23.0.a:0 "Zgoda."
 ev23.0.b:0 "Po prostu uczyń moją armię silniejszą."
 ev23.0.c:0 "Nie rób ze mnie głupca. Chcę armii i rycerzy, nie ciebie."
 ev24.0.desc:0 "'Słucham cię.'"
 ev24.0.a:0 "Zabij mojego wroga."
 ev24.0.b:0 "Daj mi wiedzę."
 ev24.0.c:0 "Oczyść moje ciało."
 ev24.0.d:0 "Wzmocnij moje ciało."
 ev24.0.d_ct:0 "Twoje pozytywne cechy fizyczne zostaną wzmocnione."
 contempt_for_belial:0 "Pogarda dla Beliala"
 study_necronomicon_decision:0 "Studiuj Nekronomikon"
 study_necronomicon_decision_desc:0 "Nekronomikon zawiera wiele sekretów, muszę poznać je wszystkie."
 study_necronomicon_decision_tooltip:0 "Nekronomikon zawiera wiele sekretów, muszę poznać je wszystkie."
 study_necronomicon_decision_confirm:0 "Czytaj Nekronomikon"
 exile_demon:0 "Wygnaj Demona"
 exile_demon_ct:0 "Zostanie wygnany z tego świata"
 infertile_modifier:0 "Bezpłodność"
 ev27.0.desc:0 "'Minęło 10 lat od naszej umowy. Obiecałeś mi wolność, ale mam dość tego świata. Wracam do piekła. Żegnaj.'"
 ev27.0.a:0 "Żegnaj, demonie."
 ev28.0.desc:0 "'Minęło 10 lat od naszej umowy. Teraz umowa dobiega końca i jestem wolny. Ten świat poczuje mój gniew, począwszy od ciebie. Możesz żyć jeśli będziesz mi służył - w przeciwnym razie, giń.'"
 ev28.0.a:0 "Oczywiście, będę ci służył..."
 ev28.0.b:0 "Żaden demon nie będzie mi rozkazywał!"
 start_duel_ct:0 "Rozpoczniesz pojedynek na śmierć i życie..."
 rival_my_master_opinion_modifier:0 "Wróg mojego mistrza"
 magic_warning_modifier:0 "Udostępnienie informacji"
 hell_dynasty:0 "Piekło"
 hell_house:0 "Piekło"
 ev16.t.a:0 "Nauki demona"
 more_knights_modifier:0 "Więcej rycerzy"
 mammon_name:0 "Mammon"
 ev30.0.title:0 "Nieznajomy"
 ev30.0.desc:0 "Humanoidalny kształt pojawił się w kręgu przywołań. Nie wygląda jak istota z innego świata - nieznajomy spogląda na ciebie w ciszy."
 ev30.0.a:0 "Hm... jesteś demonem?"
 ev31.0.desc:0 "'Nie, jestem pieprzonym Karolem Wielkim... Oczywiście, że jestem demonem. A ty? Jesteś śmiertelnikiem czy po prostu głupcem?'"
 ev31.0.a:0 "Jestem magiem."
 ev31.0.b:0 "Ja też jestem demonem."
 ev31.0.c:0 "Nie, jestem... czymś innym."
 ev31.0.d:0 "To nie twoja sprawa kim jestem."
 ev32.0.desc:0 "'Świetnie. Po co tu jestem?'"
 ev32.0.a:0 "Chcę, żebyś coś dla mnie zrobił."
 ev32.0.b:0 "W sumie nie wiem..."
 ev32.0.c:0 "Dobra, wystarczy. Znikaj."
 ev33.0.desc:0 "Nie jestem dobry w nieokreślonych przysługach. Znam się tylko i wyłącznie na liczbach."
 ev33.0.a:0 "Liczbach?"
 ev34.0.desc:0 "Arytmetyce, przyrstach, stratach, zyskach, zwrotach, odestkach, prognozach i tym podobne."
 ev34.0.a:0 "Zaraz... czyli możesz mi dać złoto, prawda?"
 ev34.0.b:0 "Prognozach? Widzisz przyszłość? Pokaż mi."
 ev35.0.desc:0 "Tak, mogę. Właściwie, to mam pełno złota, sztabek, monet i biżuterii. Lubię je zbierać. Chcesz trochę?"
 ev35.0.a:0 "Pewnie!"
 ev35.0.b:0 "A może nauczyłbyś mnie czegoś o tych liczbach?"
 ev35.0.c:0 "Chcę... więcej."
 financial_knowledge_modifier:0 "Wiedza Finansowa"
 cursed_gold_modifier:0 "Przeklęte Złoto Mammona"
 ev36.0.desc:0 "Ciekawe. Zobaczmy... Stoję w kręgu przywołań, jestem poniekąd uwięziony. Komnata wygląda jak prymitywne magiczne laboratorium, i czuję w powietrzu świeży zapach czarów. Wygląda na to, że rzuciłeś zaklęcie, które mnie przywołało.Celowo? Myślę, że tak. Zapewne poszukujesz wiedzy lub mocy. Mam zarówno jedno jak i drugie. Mogę ci je dać, jeśli tylko mnie uwolnisz."
 ev36.0.a:0 "Niech będzie. Uwalniam cię."
 ev36.0.b:0 "Dobra próba, ale nie jestem głupcem."
 ev37.0.title:0 "Nagroda Darwina"
 ev37.0.desc:0 "'Głupcze', demon opuścił krąg, 'Tak jak obiecałem, pokażę ci moją moc...'"
 ev37.0.a:0 "Nooooooo...!"
 ev38.0.desc:0 "Nie jesteś głupcem, to dobrze. Więc, czego chcesz, magu? I uważaj czego sobie życzysz..."
 ev38.0.a:0 "Uwolnij mój potencjał."
 ev38.0.b:0 "Przekaż mi trochę swojej wiedzy."
 ev38.0.c:0 "Pragnę bogactwa."
 ev38.0.d:0 "Chcę być obrzydliwe bogaty!"
 mammons_knowledge_modifier:0 "Wiedza Mammona"
 lilith_name:0 "Lilith"
 ev39.0.title:0 "Lilith"
 ev39.0.desc:0 "Na chwilę oślepia cię rozbłysk światła, a po chwili widzisz nieludzko piękną kobietę. 'Witaj, przystojniaku' - w jej głosie słyszysz coś niesamowicie uwodzicielskiego."
 ev39.1.desc:0 "Na chwilę oślepia cię rozbłysk światła, a po chwili widzisz nieludzko piękną kobietę. 'Witaj, ślicznotko' - w jej głosie słyszysz coś niesamowicie zniewalającego."
 ev39.0.a:0 "Witaj, moja pani..."
 ev40.0.desc:0 "Trochę minęło odkąd byłam tu po raz ostatni. W tym świecie. Widzisz, cieszę się, że tu jestem. Tam na dole jest dosyć nudno, a tutaj... tyle możliwości!"
 ev40.0.a:0 "Właściwie, to..."
 ev41.0.desc:0 "Właściwie to wyglądasz jakby trzeba ci było trochę rozrywki. Myślę, że mogę na to zaradzić..."
 ev41.0.a:0 "...tak?"
 ev41.0.b:0 "Cicho. Zostałaś wezwana, żeby wypełnić mój rozkaz."
 ev42.0.desc:0 "Może pokażesz mi swoją sypialnię? Tam będzie nam trochę wygodniej. Wierz mi, spełnię więcej niż jedno twoje życzenie."
 ev42.0.a_not_used:0 "Doskonały pomysł, chodźmy."
 ev42.0.a:0 "Jak sobie życzysz, moja pani."
 ev43.0.desc:0 "Jak władczo! Powiedz mi czego pragniesz. Przyjemności? Sławy? Szacunku? Mogę ci też pokazać jak odczytać ludzkie myśli. To bywa przydatne."
 ev43.0.a:0 "Przyjemności."
 ev43.0.b:0 "Sławy i szacunku."
 ev43.0.c:0 "Czytanie w myślach? Pewnie."
 ev43.0.d:0 "Chcę piękna."
 ev43.0.e:0 "Interesuje mnie długie i szczęśliwe życie."
 long_life_modifier:0 "Długie i Szczęśliwe Życie"
 joy_with_lilith_modifier:0 "Zabawa z Lilith"
 lilith_blessing:0 "Błogosławieństwo Lilith"
 mind_reader_modifier:0 "Czytanie w myślach"
 ev46.0.title:0 "Potrzeby Lilith"
 ev46.0.desc:0 "Tego poranka Lilith przyszła do ciebie z kwaśną miną. 'Jestem znudzona! Zróbmy coś fajnego, zabawmy się. Musisz zorganizować ucztę tak szybko jak to możliwe.'"
 ev46.0.a:0 "Pewnie, kochanie, wkrótce. Obiecuję."
 ev46.0.b:0 "Nie, jestem zajęty poważnymi sprawami."
 ev46.0.c:0 "Mam lepszy pomysł."
 ev48.0.title:0 "Plany Lilith"
 ev48.0.desc:0 "Dzisiaj Lilith wpadła na szalony pomysł. 'Mam plan' - powiedziała radosnym tonem - 'Odwiedzę twojego rywala, [riv.GetTitledFirstName], i dowiem się co planuje.' Widzisz, że Lilith jest podekscytowana własnym pomysłem i trudno ci będzie jej odmówić."
 ev48.0.a:0 "Ee... pewnie, skarbie, świetny pomysł."
 ev48.0.b:0 "Myślę, że to zbyt ryzykowne."
 ev48.0.c:0 "Potrzebuję cię tutaj."
 ev49.0.title:0 "Nocny Gość"
 ev49.0.desc:0 "W nocy obudziło cię pukanie do drzwi. Dziwne, to musi być coś bardzo pilnego. Po otwarciu drzwi widzisz, że w progu stoi jedna z twoich nowych dwórek. Spogląda się na ciebie ponętnie, a od tego spojrzenia czujesz, że ochota na dalszy sen już ci przeszła. Teraz masz ochotę na coś całkiem innego..."
 ev49.0.a:0 "Wejdź..."
 ev49.0.b:0 "Udam, że cię tu nie było. Znikaj."
 ev50.0.desc:0 "'Jak śmiesz, śmiertelniku?' Zanim zdążyłeś właściwie zinterpretować te słowa, kobieta skręciła ci kark jednym ruchem ręki."
 ev50.0.a:0 "Co...?"
 ev51.0.title:0 "Powrót Lilith"
 ev51.0.desc:0 "Lilith wygląda na zawstydzoną. 'Nie wszystko poszło według planu' - powiedziała - 'O nic nie pytaj, to działo się tak szybko. Tęskniłam za tobą!'"
 ev51.0.a:0 "Też tęskniłem, skarbie."
 ev52.0.desc:0 "'Wiele się dowiedziałam!' - powiedziała - 'To było prostsze niż myślałam. Muszę następnym razem poszukać większego wyzwania.'"
 ev52.0.a:0 "Dobra robota, skarbie."
 ev53.0.desc:0 "Lilith wygląda... jakoś inaczej. Czy ci się wydaje, czy ona unika twojego spojrzenia? Po chwili powiedziała:'[riv.GetTitledFirstName] jest miło i zabawną osobą. Moje miejsce jest tam gdzie [owner.GetHerHim]. Musimy się rozstać, nie mów nic więcej. Żegnaj.'"
 ev53.0.a:0 "Cholera..."
 ev54.0.title:0 "Życzenie Lilith"
 ev54.0.desc:0 "'Chciałabym być twoją królową' - stwierdziła Lilith pewnego poranka - 'Niech twoi poddani będą również moimi. Weź mnie za żonę, zgodnie z twoją głupią religią.'\n'Ale skarbie, mam już żonę!' - odpowiadasz przestraszony.\n'Nie przejmuj się nią' - powiedziała niewinnym tonem - 'Urwę jej głowię i przyniosę ci w podarunku.'"
 ev54.0.a:0 "Niech będzie."
 ev54.0.b:0 "Lepiej niech zostanie tak jak jest."
 ev54.0.c:0 "Porozmawiamy o tym później."
 ev55.0.title:0 "Natura Lilith"
 ev55.0.desc:0 "Lilith przyszła do ciebie uwalona krwią po pachy. Okazało się, że w wyniku sprzeczki lub nieporozumienia zamordowała jednego z twoich doradców.\n 'Po prostu miałam gorszy humor' - stwierdziła przepraszająco - 'Nie bądź na mnie zły.' - Lilith uśmiechnęła się jak mała dziewczynka."
 ev55.0.a:0 "Oczywiście, kochanie, wszystko w porządku."
 ev55.0.b:0 "Nie możesz zabijać moich doradców ot tak!"
 ev56.0.desc:0 "Lilith przyszła do ciebie z nietypową prośbą. \n'Potrzebuję trochę złota, na wiesz, potrzebuję kilku rzeczy. Nowej sukienki, biżuterii... myślę, że 200 monet powinno wystarczyć.'"
 ev56.0.a:0 "Pewnie, skarbie."
 ev56.0.b:0 "200 monet na... sukienkę? Nie ma mowy."
 ev2.2.title:0 "Magiczny Artefakt?"
 ev2.2.desc:0 "Natrafiłeś na ciekawą sposobność - w okolicy pojawił się wędrowiec, który rzekomo ma sprzedaż magiczny artefakt.\n'Cena nie jest wygórowana, tylko 100 monet' - zapewnia sprzedawca."
 ev2.2.a:0 "Biorę!"
 ev2.2.b:0 "Wygląda na podróbkę."
 ev2.2.c:0 "Magia nie istnieje..."
 ev2.2.d:0 "Może innym razem."
 fake_magic_artifact:0 "Fałszywy 'Magiczny Miecz'"
 fake_magic_artifact_desc:0 "Zwykły śmieć udający magiczny przedmiot."
 ev2.2.a_ct:0 "Ostrzymasz 'Magiczny Miecz'."
 NOT_WAR_AGAINST:0 "Nie podczas wojny z celem"
 ev2.3.title:0 "Nowy Wróg?"
 ev2.3.desc:0 "Wszystkie znaki na niebie i ziemi wskazują, że [enemy.GetTitledFirstName] również praktykuje magię. To może stanowić problem w przyszłości."
 ev2.3.a:0 "Poradzę sobie z tym."
 ev2.3.b:0 "Wierzę, że [enemy.GetSheHe] mnie nie zdradzi."
 ev2.3.c:0 "Nie jest zagrożeniem."
 ev2.3.d:0 "Nie ma czym się martwić."
 ev2.4.title:0 "Nowy Wróg"
 ev2.4.desc:0 "$ev2.3.desc$"
 ev2.4.a:0 "Zobaczymy."
 ev2.5.title:0 "Atak Prewencyjny"
 ev2.5.desc:0 "[enemy.GetTitledFirstName] prawdopodobnie knuje przeciw tobie już od dawna. Być może warto uprzedzić jego ruchy?"
 ev2.5.a:0 "Rozpuszczę odpowiednie plotki."
 ev2.5.b:0 "Jeszcze nie."
 ev2.5.c:0 "Wyślę mojego miniona."
 ev2.5.d:0 "Rozprawię się z [enemy.GetHerHim] raz na zawsze."
 ev2.5.f:0 "Przeklnę [enemy.GetHerHis] ziemie."
 strike_duel_mages_ct:0 "Rozpoczniesz pojedynek na śmierć i życie."
 ev2.5.e:0 "Mam inne sprawy na głowie."
 harmful_rumors_modifier:0 "Szkodliwe Plotki"
 preparation_for_strike_modifier:0 "Przygotowanie do uderzenia"
 ev2.6.title:0 "Wróg Atakuje!"
 ev2.6.desc:0 "Twój wróg zdecydował się zaatakować cię w twoim własnym zamku! Zwiódł twoje straże jakimś zaklęciem, i rzucił się na ciebie z mieczem w dłoni!"
 ev2.6.a:0 "Nareszcie!"
 game_concept_mminion:0 "Minion"
 game_concept_mmaster:0 "Mistrz"
 game_concept_mminion_desc:0 "Wierny sługa"
 game_concept_mmaster_desc:0 "Pan swoich minionów"
 ev2.7.title:0 "Magiczne Eksperymenty"
 ev2.7.desc:0 "Twój poziom wtajemniczenia umożliwia ci przeprowadzenie badań, które mogą otworzyć ci drogę do Prawdziwej Mocy. Ale czy się odważysz?"
 ev2.7.a:0 "Jestem gotowy."
 ev2.7.b:0 "To zbyt niebezpieczne."
 minion_starts_scheme_ct:0 "[minion.GetTitledFirstName] spróbuje zamordować osobę znaną jako [enemy.GetTitledFirstName]"
 masters_orders_modifier:0 "Rozkazy Mistrza"
 ev2.8.title:0 "Jeszcze Potężniejszy"
 ev2.8.desc:0 "Twoje długotrwałe praktyki magiczne uczyniły cię niesamowicie potężnym. Dochodzisz do wniosku, że dla kogoś takiego jak ty granica możliwości nie istnieje."
 ev2.8.a:0 "Jestem bogiem, i właśnie uświadomiłem to sobie."
 ev2.9.title:0 "Rozkazy Mojego Mistrza"
 ev2.9.desc:0 "Mój mistrz, [this0.GetTitledFirstName], wydał mi rozkaz zamordowania swojego wroga, którym jest [enemy.GetTitledFirstName]. Zrobię co w mojej mocy."
 ev2.9.a:0 "Twoje życzenie jest dla mnie rozkazem."
 ev2.10.title:0 "Droga Do Potęgi"
 ev2.10.desc:0 "W jednej ze swoich wizji widzisz, że [target.GetTitledFirstName] posiada przedmiot niewiarygodnej mocy. Przejęcie go stworzyłoby ci nowe możliwości."
 ev2.10.a:0 "To moja szansa!"
 ev2.10.b:0 "To zbyt ryzykowne."
 NOT_HAVE_MAGE_TOWER:0 "Już posidasz Wieże Maga"
 looked_to_the_future:0 "Wgląd w Przyszłość"
 ev2.11.title:0 "Łowca Dusz"
 ev2.11.desc:0 "Tej nocy w twojej komnacie pojawiła się istota z innego świata. Czujesz mocny zapach siarki... i przerażające zimno.\n'Dawno temu zrezygnowałeś ze swojej duszy, dzisiaj przybyłem ją odebrać. Zabieram cię do piekła, śmiertelniku' - powiedział demon."
 ev2.11.a:0 "Dobrze. Oddaję się w twoje ręce."
 ev2.11.b:0 "Poczekaj, może się jakoś dogadamy?"
 ev2.11.c:0 "Moje ostrze rozniesie cię na strzępy."
 ev2.11.d:0 "Po prostu wygnam cię zaklęciem."
 ev2.12.desc:0 "Stworzenie zastanawia się chwilę nad twoimi słowami.\n'Mogę ci dać trochę więcej czasu... ale w zamian chcę posmakować twojego ciała. Tu i teraz.'"
 ev2.12.a:0 "Wolę umrzeć."
 ev2.12.b:0 "Niech... będzie..."
 fucked_by_demon_modifier:0 "Wyruchany przez demona"
 ev2.13.title:0 "Powrót do piekła"
 ev2.13.desc:0 "Czas wrócić do piekła."
 ev2.13.a:0 "Dobra."
 ev2.14.title:0 "Mag Musi Umrzeć"
 ev2.14.desc:0 "Żaden śmiertelnik nie może być dla ciebie zagrożeniem, a samo istnienie ludzkich magów to dla ciebie obelga."
 ev2.14.a:0 "Rrrrr... magowie, jak ja nie cierpię magów."
 ev2.16.title:0 "Czas Polowania"
 ev2.16.desc:0 "Odnalazłeś swoje powołanie - każda wiedźma, demon czy potwór powinien zostać unicestwiony. Oto jest twoja misja."
 ev2.16.a:0 "Jestem gotów!"
 ev2.17.title:0 "Polowanie na czarownicę"
 ev2.17.desc:0 "Według twojego śledztwa, [witch.GetTitledFirstName] praktykuje czarną magię. Musi zostać osądzony."
 ev2.17.a:0 "Rozpocznę przygotowania."
 ev2.17.b:0 "Poczekam na właściwy moment."
 ev2.17.c:0 "Wyślę moich łowców."
 ev2.17.c_ct:0 "Jeden z łowców spróbuje dopaść wiedźmę na własną rękę."
 ev2.18.title:0 "Proces o Czary"
 ev2.18.desc:0 "'Oskarżam cię o praktykowanie czarnej magii' - powiedział [imprisoner.GetTitledFirstName] - 'Przyznaj się do winy i módl się o ocalenie własnej duszy... jeśli wciąż ją masz.'"
 ev2.18b.desc:0 "'Przyznaj się!' - krzyczy [imprisoner.GetTitledFirstName] - 'Mogę cię tu trzymać do końca twojego żałosnego życia.'"
 ev2.18.a:0 "Nie jestem wiedźmą!"
 ev2.18.a_ct:0 "Prawdopodobnie będziesz torturowany."
 ev2.18.b:0 "Jestem wiedźmą, żałosny człowieku."
 ev2.18.b_ct:0 "...to także nie skończy się niczym dobrym."
 ev2.18.c:0 "Pożałujesz tego!"
 ev2.18.d:0 "Mogę wszystko wyjaśnić!"
 ev2.18.d_ct:0 "Prawdopodobnie zostaniesz uwolniony."
 ev2.19.desc:0 "Rozpoczynasz przesłuchanie, ale oskarżony nie przyznaje się do winy."
 ev2.19.a:0 "Zmięknie na torturach!"
 ev2.19.b:0 "Może to jednak nie jest wiedźma."
 you_were_torture:0 "Łowca cię torturuje!"
 ev2.20.desc:0 "[prisoner.GetHerHim|U] przyznał się do winy, jest wiedźmą, czcicielem diabła!"
 ev2.20.a:0 "Rozpalić stos!"
 ev2.20.b:0 "Hm..."
 mages_target:0 "Łowca kontra wiedźma #P +30%#!"
 released_prison_toast:0 "Uniewinnienie"
 ev2.21.title:0 "Oczy w Ciemności"
 ev2.21.desc:0 "Podejrzewasz, że ostatnio jesteś obserwowany. Bez względu na to czyi to szpiedzy, musisz zachować najwyższą ostrożność."
 ev2.21.a:0 "Będę czujny."
 ev2.21.b:0 "Nie mogę nikomu ufać."
 ev2.22.title:0 "Koniec Łowów"
 ev2.22.desc:0 "Polowanie nie przyniosło żadnych rezultatów."
 ev2.22.a:0 "Czas się pożegnać."
 ev2.23.title:0 "Źródło Magii?"
 ev2.23.desc:0 "Ten przedmiot, magiczny katalizato, może dać ci tajemną moc. Czy jesteś gotów, by ją posiąść?"
 ev2.23.a:0 "Pewnie."
 ev2.23.b:0 "Nie, to grzech!"
 ev2.24.title:0 "Błędny Rycerz"
 ev2.24.desc:0 "Wędrowny błędny rycerz przybył do twojej siedziby by rzucić ci wyzwanie. \n'Walcz ze mną, [just_me.Custom('GetSorcererBySex')]! Nastał kres twojej niegodziwości!"
 ev2.24.a:0 "Przyjmuję twoje wyzwanie. Walczmy!"
 ev2.24.b:0 "Poddaję się, ale chcę uczciwego procesu."
 ev2.24.c:0 "Może po prostu spopielę go zaklęciem?"
 imprison_and_trial_ct:0 "Zostaniesz uwięziony w siedzibie łowców, gdzie zostaniesz osądzony."
 ev2.24.d:0 "Nie zajmuję się magią, ale wiem kto siedzi w tym po uszy."
 sent_wh_2_rival_ct:0 "[potential_target2.GetTitledFirstName] zostanie skonfrontowany z błędnym rycerzem."
 cursed_land_modifier:0 "Przeklęta Ziemia"
 ev2.25.title:0 "Plotki o... czarowniku?"
 ev2.25.desc:0 "Ostatnio słyszałeś dziwne plotki na temat [mmage.GetTitledFirstName]. Podobno zajmuje się zaawansowaną czarną magią."
 ev2.25.a:0 "Co to w ogóle znaczy?"
 ev2.25.b:0 "Wygląda na to, że [mmage.GetSheHe] wie więcej niż ja."
 ev2.26.title:0 "Dziecko?"
 ev2.26.desc:0 "W kręgu przywołania zmaterializowało się... dziecko. Chłopiec wygląda całkiem zwyczajnie, to normalne, zdrowe dziecko."
 ev2.26.a:0 "Wychowam je jak własne."
 ev2.26.b:0 "Zatrzymam je."
 ev2.26.b_ct:0 "Dziecko pozostanie na twoim dworze."
 ev2.26.c:0 "Odeślę je spowrotem."
 ev2.26.c_ct:0 "Dziecko zostanie odesłane do innego wymiaru."
 not_empty_demon_name:0 "Abaddon"
 ev2.27.title:0 "Imię dla dziecka"
 ev2.27.desc:0 "Najpierw trzeba wybrać imię."
 ev2.27.a:0 "Witaj w naszym świecie."
 ev2.28.title:0 "Ogromny, dziwny świat"
 ev2.28.desc:0 "Ale ładna pani, mogę jej dotknąć?"
 ev2.28.a:0 "Mama?"
 ev2.29.title:0 "Samobójstwo?"
 ev2.29.desc:0 "Dziwny przypadek: niania, która zajmowała się [demon_child.GetTitledFirstNamePossessive], [nanny.GetTitledFirstName], popełniła tej nocy samobójstwo. Po prostu rzuciła się z najwyższej wieży, wydając przy tym przerażające okrzyki."
 ev2.29.a:0 "Hmm..."
 ev2.310.a:0 "Dzieje się tu coś bardzo dziwnego..."
 ev2.30.title:0 "Silne Uczucia"
 ev2.30.desc:0 "[potential_vict.GetTitledFirstName] traktuje mnie z góry. Czuję wobec niego..."
 ev2.30.a:0 "...gniew."
 ev2.30.b:0 "...zniesmaczenie."
 ev2.30.c:0 "Nic nie czuję."
 ev2.31.title:0 "Głosy w mojej głowie"
 ev2.31.desc:0 "Słyszę szepty w głowie, szczególnie nocami. Opowiadają mi o różnych ciekawych rzeczach, ale czasami stawiają mi też żądania. Dzisiaj chciały, żebym zabijał..."
 ev2.31.a:0 "Zrobię czego sobie życzą."
 ev2.32.title:0 "Śmierć na Dworze"
 ev2.32.desc:0 "Wygląda na to, że jeden z twoich dworzan, [potential_vict.GetTitledFirstName], spadł ze schodów i skręcił kark."
 ev2.32.a:0 "Wypadki się zdarzają..."
 ev2.33.desc:0 "Głosy znowu pragną, żebym kogoś zabił. Dla mnie jest to proste - wystarczy, że się spojrze, kogoś dotknę, czasami jedna moja myśl może spowodować czyjąś śmierć. Ale nie jestem pewien, czy zawsze powinienem się podporządkować tym głosom..."
 ev2.33.a:0 "Zrobię to czego ode mnie oczekują."
 ev2.33.b:0 "Cisza! To ja zdecyduję czy i kogo zabiję."
 ev2.34.desc:0 "Jeden z twoich dworzan, [potential_vict.GetTitledFirstName], potknął się i wypadł przez okno. A przynajmniej na to wygląda, bo nie ma żadnych świadków tego incydentu."
 ev2.34.a:0 "Kolejny wypadek...?"
 ev2.35.title:0 "Znienawidzony Wróg"
 ev2.35.desc:0 "Jest pewna osoba, którą darzysz czystą, szczerą niienawiiścią. Wykorzystanie twoich specjalnych mocy by zniszczyć osobę znaną jako [potential_vict.GetHerHis]."
 ev2.35.a:0 "Przyda mi się trochę ćwiczeń."
 ev2.35.b:0 "To tylko pierwszy etap mojego planu."
 ev2.35.c:0 "Sprawiedliwość się dokona."
 ev2.35.d:0 "Potrzebuję tego."
 ev2.36.desc:0 "Dzisiejszego poranka służący znaleźli ciało jednego z twoich dworzan. Nie wiadomo co spowodowało śmierć."
 ev2.36.a:0 "Mamy ostatnio sporo niewyjaśnionych zgonów."
 ev2.36.b:0 "Zrobię śledztwo w tej sprawie."
 ev2.36.b1_ct:0 "Morderca Znaleziony!"
 ev2.36.b2:0 "Śledztwo nie przyniosło rezultatów"
 ev2.36.b2_ct:0 "Niczego nie znaleziono"
 ev2.37.title:0 "Źródło"
 ev2.37.desc:0 "Czuję, że coś się we mnie budzi..."
 ev2.37.a:0 "Kolejny dar otwiera kolejne możliwości."
 ev2.38.title:0 "Cała prawda o mnie"
 ev2.38.desc:0 "Czuję w sobie dziwną, mistyczną siłę. Teraz znam prawdę - nie jestem normalny. Nie jestem nawet człowiekiem."
 ev2.38.a:0 "To początek nowej ery."
 ev2.39.title:0 "Morderca Znaleziony?"
 ev2.39.desc:0 "Śledztwo wykazało, że [demon_child.GetTitledFirstName] był widziany ze wszystkimi ofiarami na którko przed ich śmiercią. Nie masz co prawda dowodów, ale jeśli to zbieg okoliczności, to bardzo podejrzany."
 ev2.39.a:0 "Będzie obserwowany."
 ev2.39.b:0 "Lepiej niech pobędzie trochę w lochach."
 ev2.39.c:0 "Zaaranżuję dyskretną egzekucję."
 ONLY_SPECIFIED_CHILD:0 "Cel musi być twoim gościem, dworzanem, uczniem lub więźniem."
 ONLY_SPECIFIED_CHILD2:0 "Nie możesz jeść swoich własnych dzieci (o ile nie jesteś sadystą)."
 ic_pure_meal:0 "Posiłem Czystej Krwi"
 consume_child:0 "Konsumuj"
 absorb_good_traits_ct:0 "Daje szansę przejęciecia pozytywnej cechy fizycznej (o ile cel ma jakieś)"
 consume_child_ct:0 "Dziecko zostanie skonsumowane."
 ev2.40.title:0 "Zaginione Dziecko"
 ev2.40.desc:0 "Na dworze władcy znanego jako [sender.GetTitledFirstName] jedno z dzieci zniknęło w tajemniczych okolicznościach, bez śladu."
 ev2.40.a:0 "Nawet dzieci nie są bezpieczne w tych czasach."
 ev2.40.b:0 "Myślę, że stoi za tym [actor.GetTitledFirstName]."
