 ev1.1.title:0 "Tajemnicza Księga"
 ev1.1.desc:0 "Po powrocie do swojej komnaty odnajdujesz starą księgę leżącą na twoim stole. Wygląda na mocno zużytą, ale jest gruba i gęsto zapisana różnymi tajemnymi symbolami i enigmatycznymi notatkami na marginesach. Kto mógł ją tutaj zostawić?"
 ev1.1.a:0 "Dziwne..."
 ev97.1.title:0 "Tajemniczy Pierścień"
 ev97.1.desc:0 "Po powrocie do komnaty odkrywasz, że na środku stołu leży kunsztownie zdobiony pierścień. Wygląda na bezcenny skarb, tylko kto mógł go tutaj zostawić?"
 ev97.1.a:0 "Dziwne..."
 ev98.1.title:0 "Tajemniczy Kamień"
 ev98.1.desc:0 "Po powrocie do komnaty odkrywasz, że na twoim stole ktoś położył kawałek dziwnego kamienia. To tajemniczy minerał, który wydaje się świecić w ciemności. Ciekawe kto i po co go tutaj zostawił..."
 ev98.1.a:0 "Dziwne..."
 
