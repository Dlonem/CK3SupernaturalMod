 ev12.0.title:0 "Przywołanie"
 ev12.0.desc:0 "Zebrałeś potrzebne komponenty, narysowałeś ochronny krąg i przygotowałeś odpowiednie zaklęcia - ale wciąż ryzyko niepowodzenia jest duże. Samo przyzwanie demona jest wyzwaniem, a musisz jeszcze go uwięzić i zmusić do wypełnienia twojej woli. Wiele rzeczy może pójść nie tak..."
 ev12.0.a:0 "Rozpoczynam."
 ev12.0.b:0 "Może jednak to nie jest dobry pomysł."
 ev12.1.a:0 "Demon został przywołany..."
 ev12.1.a_ct:0 "Możesz stawić czoła demonowi"
 ev12.2.a:0 "Przywołanie się nie udało"
 ev12.3.a:0 "Przyzwałeś demona, ale ten uciekł!"
 ev12.3.a_ct:0 "Demon jest wolny..."
 ev12.4.a:0 "Przywołałeś demona, ale ten wyrwał się spod kontroli."
 ev13.0.title:0 "Wściekły Demon"
 ev13.0.desc:0 "Demon został przywołany, widzisz kontur jego postaci otoczonej światłem i wirującymi cieniami. Niestety istota nie jest chyba zainteresowana rozmową - za to zaczyna atakować krąg ochronny, który ją od ciebie oddziela. Jeśli się przebije, to może oznaczać twoją śmierć."
 ev13.0.a:0 "Runy wytrzymają."
 ev13.1.a:0 "Runy wytrzymały atak demona"
 ev13.1.a_ct:0 "Rytuał jest kontynuowany"
 ev13.2.a:0 "Demon zniszczył krąg i rozerwał cię na strzępy"
 ev13.0.b:0 "Znam inwokację, która może pomóc..."
 ev13.1.b:0 "Został powstrzymany"
 ev13.0.c:0 "Natychmiast go odeślę!"
 ev13.0.c_ct:0 "Rytuał zakończony"
 ev15.0.title:0 "Demon"
 ev15.0.desc:0 "Demon przybrał postać podobną do człowieka i zmierzył cię spojrzeniem. 'Po prostu powiedz czego chcesz, wiedźmo. Nie mam na ciebie czasu.'"
 ev15.0.a:0 "Chcę mocy."
 ev15.0.b:0 "Chcę bogactwa."
 ev15.0.c:0 "Niczego nie chcę. Znikaj."
 ev15.0.d:0 "Zostańmy przyjaciółmi! Uwalniam cię!"
 ev15.1.d:0 "Demon zostaje twoim przyjacielem."
 ev15.2.d:0 "Demon zabija cię..."
 ev16.0.title:0 "Droga do potęgi"
 ev16.0.desc:0 "Moc... zawsze chcecie mocy. Ale co to dla ciebie znaczy, człowieku? Mogę zdradzić ci kilka sekretów, albo oddać ci do dyspozycji małą armię nieumarłych."
 ev16.0.a:0 "Naucz mnie czego przydatnego."
 ev16.0.a_ct:0 "Dostaniesz losowego perka."
 ev16.0.b:0 "Armia nieumarłych brzmi przydatnie."
