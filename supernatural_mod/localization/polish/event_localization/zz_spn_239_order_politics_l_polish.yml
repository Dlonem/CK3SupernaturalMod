l_polish:
 spn_order_invocare_decision:0 "Invocare"
 spn_order_invocare_decision_desc:0 "[Glossary('Invocare','spn_gloss_invocare')] is written into the law of the [spn_order|E], and it is rarely said aloud. Say it, and the temples must meet in masks to decide whether the Grand Magus keeps the chair.\n\nNobody forgets who said it."
 spn_order_invocare_decision_tooltip:0 "Call on the temples to judge the Grand Magus."
 spn_order_invocare_decision_confirm:0 "Say the word"
 spn_invocare_standing_tt:0 "You have at least 50 [spn_order_standing|E]"
 spn_invocare_second_tt:0 "Another [spn_temple_magus|E] will second you: one who dislikes the Grand Magus, or a friend of yours"
 spn_invocare_temples_tt:0 "At least three temples stand (with fewer, the senior [spn_temple_magus|E] simply takes the chair)"
 spn_invocare_settled_tt:0 "The Grand Magus has held the chair for at least three years"
 spn_invocare_cd_tt:0 "No Invocare has been heard in the last ten years"
 spn_invocare_pending_tt:0 "No other Invocare is waiting to be heard"
 spn_invocare_imperium_tt:0 "The Grand Magus does not hold Imperium"
 spn_invocare_host_tt:0 "You or another free [spn_temple_magus|E] can host the temples: one who holds land and has not hosted a [spn_conclave|E] in the last five years"
 spn_invocare_effect_tt:0 "The temples meet in a [spn_conclave|E]. The Grand Magus hears of it first and may prepare a defence. If more voters say Aye than Nay, the chair falls empty and the same Conclave chooses who sits in it. A tie keeps the Grand Magus in it."
 spn_invocare_effect_cost_tt:0 "When the motion is heard, you lose 20 [spn_order_standing|E], and no other Invocare can be called for ten years. If it fails, you lose 20 more, and your seat on the [spn_gnostic_council|E] if you hold one. If the Conclave never meets, nobody pays anything."
 spn_invocare_toast_no_host:0 "No Temple Can Host It"
 spn_invocare_toast_no_host_desc:0 "No [spn_temple_magus|E] who holds land is free to call the temples together. Nothing has been said."
 spn_order_invocare_opinion:0 "Questioned My Authority"
 spn_invocare_toast_lapsed:0 "The Motion Lapsed"
 spn_invocare_toast_lapsed_desc:0 "The temples met, but Invocare was not heard. Nobody pays anything for it."
 spn_conclave.0001.desc_invocare:0 "The word has been said: Invocare. The temples must meet and decide whether the Grand Magus keeps the chair, and it falls to you to call them together.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0001.desc_invocare_self:0 "You have said the word: Invocare. Now the temples must meet and decide whether the Grand Magus keeps the chair, and you are the one who calls them together.\n\nThe notes go out without names. Each one says only where and when."
 spn_conclave.0240.t:0 "The Chair Is Questioned"
 spn_conclave.0240.desc:0 "The note is unsigned, but you know the hand. [spn_iv_caller.GetTitledFirstName] has called [Glossary('Invocare','spn_gloss_invocare')].\n\nWhen the temples next meet in masks, they will vote on whether you keep the chair of the Grand Magus. If more of them say Aye than Nay, the chair is empty before the night is over. If it is even, it is still yours.\n\nThere is time before they meet. Not much."
 spn_conclave.0240.a:0 "Then they will remember what they owe me"
 spn_conclave.0240.a.tt:0 "When the temples meet, you call in what is owed by every voter in the room you hold a hook on. Each of them will vote to keep you."
 spn_conclave.0240.b:0 "Open the council's coffers"
 spn_conclave.0240.b.tt:0 "When the temples meet, 100 gold from the council's funds buys the three masks least sure of their vote. If the coffers are empty by then, nothing is paid."
 spn_conclave.0240.c:0 "Let me remind them what the Order has done under me"
 spn_conclave.0240.c.success:0 "They Listened"
 spn_conclave.0240.c.success_desc:0 "Your words are being repeated in every temple. Some of the masks will remember them when they vote."
 spn_conclave.0240.c.failure:0 "Nobody Was Moved"
 spn_conclave.0240.c.failure_desc:0 "The letters went out, and the temples read them. Nobody seems to have changed their mind."
 spn_conclave.0240.d:0 "A show of power"
 spn_conclave.0240.d.tt:0 "When the temples meet, you spend a great deal of power where every Mage in the room can feel it. If you no longer have it to spend by then, nothing happens."
 spn_conclave.0240.e:0 "Let them see who they are crossing"
 spn_conclave.0240.e.tt:0 "Those who fear you will think twice. Those who do not may resent being threatened."
 spn_conclave.0240.f:0 "I will not wait to be pushed"
 spn_conclave.0240.f.tt:0 "When the temples meet, you give up the chair before the vote is taken. You gain 10 [spn_order_standing|E], and nobody can say you were thrown out. You do not stand in the vote that follows."
 spn_conclave.0240.g:0 "Let the masks decide"
 spn_conclave.0240.g.tt:0 "You do nothing. The vote will be what it will be."
 spn_conclave.0250.t:0 "Invocare"
 spn_conclave.0250.desc:0 "[spn_iv_caller.GetTitledFirstName] stands in the middle of the circle and says the word: [Glossary('Invocare','spn_gloss_invocare')]. The room goes still.\n\nThe question is whether [spn_iv_magus.GetTitledFirstName] keeps the chair of the Grand Magus. When the bowl comes to you, you write Aye or Nay on your slip, or nothing at all. If the Ayes are more, the chair is empty. If they are fewer, or even, it is still [spn_iv_magus.GetHerHis]."
 spn_conclave.0250.desc_broke:0 "\n\nWord has gone round the room: [spn_iv_magus.GetSheHe] broke the rules of the [spn_order|E]."
 spn_conclave.0250.desc_favour:0 "\n\nThere is talk of favours given where they should not have been."
 spn_conclave.0250.desc_bound:0 "\n\n[spn_iv_magus.GetFirstName] has already reminded you what you owe [spn_iv_magus.GetHerHim]."
 spn_conclave.0250.a:0 "Aye. Let the chair be empty"
 spn_conclave.0250.b:0 "Nay. [spn_iv_magus.GetSheHe|U] keeps it"
 spn_conclave.0250.c:0 "Leave the slip blank"
 spn_conclave.0250.c.tt:0 "Your slip counts for neither side."
 spn_conclave.0250.bound_tt:0 "The Grand Magus has called in what you owe [spn_iv_magus.GetHerHim]"
 spn_conclave.0250.late_tt:0 "The slips have already been counted."
 spn_conclave.0260.t:0 "The Slips Are Counted"
 spn_conclave.0260.desc_passed_magus:0 "The slips are read out one by one. Long before the last of them, nobody needs to say it: the chair of the Grand Magus is no longer yours.\n\nThe temples will choose who sits in it before they go home. Your name will not be among the candidates this time."
 spn_conclave.0260.desc_passed_caller:0 "The slips are read out one by one, and the Ayes have it. [spn_iv_magus.GetTitledFirstName] is no longer Grand Magus.\n\nThe temples will choose who sits in the chair before they go home."
 spn_conclave.0260.desc_kept_magus:0 "The slips are read out one by one, and when the last of them is read, the chair is still yours. [spn_iv_caller.GetTitledFirstName] will not look at you.\n\nYou will remember who said the word."
 spn_conclave.0260.desc_kept_caller:0 "The slips are read out one by one, and it is not enough. [spn_iv_magus.GetTitledFirstName] keeps the chair, and [spn_iv_magus.GetSheHe] watched you the whole time.\n\nThe masks remember who calls Invocare and loses. You lose more [spn_order_standing|E], and your seat on the [spn_gnostic_council|E] if you held one."
 spn_conclave.0260.desc_yielded_magus:0 "Before the bowl went round, you stood and set the chair aside. There was no vote.\n\nWhatever the temples think of you, nobody can say you were thrown out."
 spn_conclave.0260.desc_yielded_caller:0 "Before the bowl could go round, [spn_iv_magus.GetTitledFirstName] stood and set the chair aside. There was no vote.\n\nThe temples will choose who sits in it before they go home."
 spn_conclave.0260.a:0 "It is done"
 spn_conclave_log_invocare_passed_title:0 "Invocare"
 spn_conclave_log_invocare_passed:0 "The temples voted [CHARACTER.GetTitledFirstName] out of the chair of the Grand Magus."
 spn_conclave_log_invocare_kept_title:0 "Invocare"
 spn_conclave_log_invocare_kept:0 "The temples voted, and [CHARACTER.GetTitledFirstName] kept the chair of the Grand Magus."
 spn_conclave_toast_favouritism:0 "The Masks Heard the Talk"
 spn_conclave_toast_favouritism_desc:0 "The talk about favours reached the Conclave. You lose [spn_order_standing|E], and the matter is closed."
 spn_order_break_decision:0 "Break the Order of the Blue Rose"
 spn_order_break_decision_desc:0 "Behind the quiet scholars and the locked libraries stands the [spn_order|E]: temples that meet in masks, a council that answers to no king, and a Grand Magus above them all. You have seen enough of it to know it is real.\n\nPull the masks off every temple at once, and it will be a long time before it can gather again."
 spn_order_break_decision_tooltip:0 "Tear the masks off every temple of the Order at once."
 spn_order_break_decision_confirm:0 "Break it"
 spn_order_break_road_tt:0 "You hunt witches, lead a faith that condemns witchcraft, are the Chief Inquisitor, have left the Order, or are kin to someone it wronged"
 spn_order_break_heads_tt:0 "You know the [spn_temple_magus|E] of at least half of its temples"
 spn_order_break_fallen_tt:0 "A temple has fallen to you or to a hunter at your court, or a [spn_temple_magus|E] you know for one sits in your dungeon"
 spn_order_break_chair_tt:0 "The chair of the Grand Magus stands empty, or its holder sits in your dungeon and you know who that is"
 spn_order_break_not_broken_tt:0 "The Order has not been broken in the last twenty years"
 spn_order_break_not_pending_tt:0 "Nobody is already moving against the Order"
 spn_order_break_effect_night_tt:0 "Word reaches the Order tonight, and it will answer. If its answer stops you, nothing is lost but time."
 spn_order_break_effect_secrets_tt:0 "Every member of the Order is unmasked."
 spn_order_break_effect_treasury_tt:0 "The council's treasury is yours, or whatever the Order has not hidden."
 spn_order_break_effect_council_tt:0 "The chair of the Grand Magus and every seat on the council fall empty."
 spn_order_break_effect_temples_tt:0 "Every temple is closed."
 spn_order_break_effect_rise_tt:0 "No new temple is founded for twenty years, unless a Mage who knows three others for what they are starts one again."
 spn_order_break_effect_cost_tt:0 "When it is done, you spend 1,000 prestige (1,000 piety if you lead a faith)."
 spn_order.0982.t:0 "The Rose Burns Its Letters"
 spn_order.0982.desc:0 "A rider came after dark with one name: [spn_bk_breaker.GetTitledFirstName]. By morning, [spn_bk_breaker.GetSheHe] means to tear the masks off every temple at once.\n\nIn the hearth, the letters of the [spn_order|E] are already burning. What happens before dawn is up to you."
 spn_order.0982.a:0 "Send the Adeptus Major"
 spn_order.0982.a.tt:0 "The Adeptus Major visits [spn_bk_breaker.GetFirstName] tonight. If [spn_bk_breaker.GetSheHe] can be bought or made to forget, there will be nothing left to break."
 spn_order.0982.b:0 "Hide what can be hidden"
 spn_order.0982.b.tt:0 "The papers go into the fire, and half of the council's coffers are hidden where nobody will find them. If the Break comes, there will be that much less to take."
 spn_order.0982.c:0 "Let the temples scatter"
 spn_order.0982.c.tt:0 "Every temple closes tonight. Its members walk away with their secrets and their magic, but the Order is gone, and it will be years before it can gather again."
 spn_order.0980.t:0 "The Rose Is Broken"
 spn_order.0980.desc:0 "By morning it is done. The names are out, the chair of the Grand Magus stands empty, what was left in the council's coffers is yours, and every temple is shut.\n\nThey will not gather again soon. When they do, they will remember who did this."
 spn_order.0980.a:0 "Let them remember"
 spn_order.0981.t:0 "The Masks Are Torn Away"
 spn_order.0981.desc:0 "Before dawn, [spn_bk_breaker.GetTitledFirstName] moved against every temple at once. Names that were never spoken outside the masks are being read aloud in halls and markets, and yours is among them.\n\nThe [spn_order|E] is finished. Whatever comes now, you will meet it without a mask."
 spn_order.0981.a:0 "Then let them look"
 spn_order.0981.a.tt:0 "Your place in the Order becomes known to all, and your temple is closed."
 spn_order.0983.t:0 "The Rose Remembers"
 spn_order.0983.desc:0 "The new temple is a cellar, a few chairs and a borrowed key. It is a beginning.\n\nThe older members still say one name as if it were a curse: [spn_or_breaker.GetTitledFirstName], who broke the [spn_order|E]. [spn_or_breaker.GetSheHe|U] is still alive."
 spn_order.0983.a:0 "Send the Adeptus Major after [spn_or_breaker.GetHerHim]"
 spn_order.0983.a.tt:0 "The Adeptus Major will find [spn_or_breaker.GetFirstName], and the Order will keep watching [spn_or_breaker.GetHerHim]."
 spn_order.0983.b:0 "Let the old wound close"
 spn_order.0983.b.tt:0 "The new temple has enough to do."
 spn_order.0710.desc_break:0 "A stranger in a plain coat is waiting by your horse. [spn_am_agent.GetSheHe|U] knows your name, and [spn_am_agent.GetSheHe] knows what you mean to do in the morning.\n\n"Take the gold and forget the house. Or stay, and we will make you forget it.""
 spn_order.0710.c:0 "I would rather be one of you"
 spn_order.0710.c.tt:0 "The stranger smiles. When the temples next choose who to call, your name will be near the top. You keep everything you know."
 spn_order_toast_temples_scatter:0 "The Temples Scatter"
 spn_order_toast_break_failed:0 "The Rose Slips Away"
 spn_order_toast_break_failed_desc:0 "By morning there was nothing left to strike at. Whatever you meant to do, it did not happen."
 spn_order_toast_break_unpaid_desc:0 "By morning you could no longer pay what it would cost. Nothing was done, and nothing was paid."
 spn_order_toast_order_broken:0 "The Order Is Broken"
 spn_order_toast_pledge_ends_desc:0 "Your temple has closed, and your pledge to the [spn_order|E] ends with it."
 spn_order_refound_broken_tt:0 "The Order was broken less than twenty years ago: you need to know three other Mages in your reach, not two"
 spn_order.1007.t:0 "A Sister on Trial"
 spn_order.1007.t_brother:0 "A Brother on Trial"
 spn_order.1007.desc_dead:0 "Word comes from [spn_st_accuser.GetTitledFirstName]'s court. [spn_st_sister.GetTitledFirstName] was put on trial as a witch, and [spn_st_sister.GetSheHe] did not survive it.\n\nThe temple will want to know what you mean to do about it."
 spn_order.1007.desc_cell:0 "[spn_st_accuser.GetTitledFirstName] has put [spn_st_sister.GetTitledFirstName] on trial as a witch. The questions are over, but [spn_st_sister.GetSheHe] is still in a cell, and nobody is in a hurry to let [spn_st_sister.GetHerHim] out.\n\nWhat [spn_st_sister.GetSheHe] said in there, nobody can tell you."
 spn_order.1007.desc_free:0 "[spn_st_accuser.GetTitledFirstName] put [spn_st_sister.GetTitledFirstName] on trial as a witch, and [spn_st_sister.GetSheHe] walked out of it.\n\nThat is good news, as far as it goes. What [spn_st_sister.GetSheHe] said in there, nobody can tell you."
 spn_order.1007.a:0 "[spn_st_sister.GetSheHe|U] will be answered for"
 spn_order.1007.a.tt:0 "The Adeptus Major will pay [spn_st_accuser.GetFirstName] a visit, and the Order will keep watching [spn_st_accuser.GetHerHim]."
 spn_order.1007.b:0 "Say [spn_st_sister.GetHerHis] name at the next rite, and nothing more"
 spn_order.1007.b.tt:0 "Silence is the first of the three words."
 spn_order.1007.c:0 "Buy [spn_st_sister.GetHerHis] freedom"
 spn_order.1007.c.tt:0 "Gold changes hands, and [spn_st_sister.GetFirstName] is let out of [spn_st_sister.GetHerHis] cell."
 spn_order.1007.c.ai_tt:0 "[spn_st_sister.GetHerHis|U] gaoler is not someone the temple can simply pay"
 spn_order.1007.d:0 "Throw the Powder at [spn_st_sister.GetHerHis] gaolers"
 spn_order.1007.d.tt:0 "The Powder is spent. Those who held [spn_st_sister.GetHerHim] should not remember what [spn_st_sister.GetSheHe] is."
 spn_order.1007.e:0 "[spn_st_sister.GetSheHe|U] knew the rules"
 spn_order.1007.e.tt:0 "Silence is the first of the three words. [spn_st_sister.GetFirstName] will have to get out of this alone."
 spn_order.1007.f:0 "Bring [spn_st_sister.GetHerHim] back to the temple"
 spn_order.1007.f.tt:0 "[spn_st_sister.GetFirstName] gains [spn_order_standing|E]."
 spn_order.1007.g:0 "Watch [spn_st_sister.GetHerHim]: [spn_st_sister.GetSheHe] may have talked"
 spn_order.1007.g.tt:0 "[spn_st_sister.GetFirstName] loses [spn_order_standing|E], and you will not trust [spn_st_sister.GetHerHim] for a while."
