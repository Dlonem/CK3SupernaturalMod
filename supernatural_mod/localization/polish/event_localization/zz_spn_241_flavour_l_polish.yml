l_polish:
 spn_two_natures.lean_wolf_tt:0 "The wolf in [spn_tn_child.GetFirstName] grows stronger."
 spn_two_natures.lean_demon_tt:0 "The demon in [spn_tn_child.GetFirstName] grows stronger."
 spn_two_natures.0001.t:0 "The Bitten Hand"
 spn_two_natures.0001.desc_child:0 "The other boy pushed you, so you bit him. Not hard. Hard enough. There was blood, and you liked the taste, and then you were ashamed of liking it.\n\nNow everyone is looking at you."
 spn_two_natures.0001.desc_parent:0 "[spn_tn_child.GetFirstName] bit another child today. Not hard, they say, but there was blood, and [spn_tn_child.GetSheHe] did not cry afterwards. [spn_tn_child.GetSheHe|U] smiled.\n\nYou know what is in [spn_tn_child.GetHerHim]. Both things."
 spn_two_natures.0001.a_child:0 "I said I was sorry"
 spn_two_natures.0001.b_child:0 "He deserved it"
 spn_two_natures.0001.a_parent:0 "I teach [spn_tn_child.GetHerHim] mercy"
 spn_two_natures.0001.b_parent:0 "I teach [spn_tn_child.GetHerHim] strength"
 spn_two_natures.0002.t:0 "Two Shadows"
 spn_two_natures.0002.desc_child:0 "The moon is full and you are walking home. Your shadow is wrong. There are two of them. One has a long snout and runs on four legs. The other has horns and does not move at all.\n\nBoth of them are waiting for you."
 spn_two_natures.0002.desc_parent:0 "[spn_tn_child.GetFirstName] comes home white and shaking. [spn_tn_child.GetSheHe|U] says [spn_tn_child.GetHerHis] shadow split in two under the moon: one a wolf, one a thing with horns.\n\n[spn_tn_child.GetSheHe|U] asks which one is [spn_tn_child.GetHerHim]."
 spn_two_natures.0002.a_child:0 "I follow the wolf"
 spn_two_natures.0002.b_child:0 "I go to the one with horns"
 spn_two_natures.0002.a_parent:0 "\"The wolf. It is a wolf's shadow.\""
 spn_two_natures.0002.b_parent:0 "\"Both. Do not be afraid of either.\""
 spn_two_natures.0003.t:0 "The First Change"
 spn_two_natures.0003.desc_child:0 "It starts in your spine. Every bone breaks, one after another. Then a voice, very calm, says it can make this stop. It only has to be asked.\n\nThe pain is worse than anything. The voice is very patient."
 spn_two_natures.0003.desc_parent:0 "[spn_tn_child.GetFirstName] changes for the first time tonight, and you are there. Through the screaming you hear [spn_tn_child.GetHerHim] talking to someone. Something is offering to make it stop.\n\nYou could tell [spn_tn_child.GetHerHim] to listen."
 spn_two_natures.0003.a_child:0 "I bear it"
 spn_two_natures.0003.b_child:0 "Make it stop"
 spn_two_natures.0003.a_parent:0 "\"Do not answer it. Bear it.\""
 spn_two_natures.0003.b_parent:0 "\"Let it help you.\""
 spn_two_natures.0010.t:0 "The Two Natures"
 spn_two_natures.0010.desc_wolf:0 "The demon in you has waited twenty years. Tonight it wants an answer. But the wolf has had you longer, and it knows you better.\n\nOnly one of them can stay."
 spn_two_natures.0010.desc_demon:0 "The demon in you has waited twenty years. Tonight it wants an answer, and you already know what you will say. The wolf is quieter than it used to be.\n\nOnly one of them can stay."
 spn_two_natures.0010.desc_even:0 "The demon in you has waited twenty years. Tonight it wants an answer. The wolf wants one too. Neither has ever been stronger than the other.\n\nOnly one of them can stay."
 spn_two_natures.0010.a:0 "I am a wolf"
 spn_two_natures.0010.a.tt:0 "You stay a werewolf. The demon blood stays too, but it will never make you a demon."
 spn_two_natures.0010.b:0 "I am what my blood made me"
 spn_two_natures.0010.b.tt:0 "The wolf leaves you. You become a demon."
 spn_two_natures.0011.t:0 "After"
 spn_two_natures.0011.desc_wolf:0 "A year on. Sometimes, in a quiet room, you still hear the calm voice. It does not ask anymore. It only waits.\n\nThe wolf is louder."
 spn_two_natures.0011.desc_demon:0 "A year on. Sometimes, under a full moon, you feel your bones want to move. Then the feeling passes.\n\nYou do not miss it. Mostly."
 spn_two_natures.0011.a:0 "This is who I am"
 spn_moment.0001.t:0 "The Mirror"
 spn_moment.0001.desc:0 "A new mirror in your chambers, good Venetian glass. You stop in front of it out of habit.\n\nThe face is yours. It is the same face it was a long time ago. Nobody else's face stays the same."
 spn_moment.0001.a:0 "I look away"
 spn_moment.0001.b:0 "I look until I know it again"
 spn_moment.0002.t:0 "Why Don't You Eat?"
 spn_moment.0002.desc:0 "[spn_mo_child.GetFirstName] has been watching you all through supper. Now [spn_mo_child.GetSheHe] asks, very loudly, why you never eat anything.\n\nThe table goes quiet."
 spn_moment.0002.a:0 "I tell [spn_mo_child.GetHerHim] a story instead"
 spn_moment.0002.b:0 "\"Because I am not hungry for bread.\""
 spn_moment.0002.c:0 "\"Go and play.\""
 spn_moment.0003.t:0 "The Old Song"
 spn_moment.0003.desc:0 "A singer in the tavern starts a song you know. You heard it first when it was new, and he has the words wrong.\n\nNobody alive remembers the right ones. Only you."
 spn_moment.0003.a:0 "I sing it the old way"
 spn_moment.0003.b:0 "I keep quiet and listen"
 spn_moment.0004.t:0 "A Cut Finger"
 spn_moment.0004.desc:0 "[spn_mo_carver.GetFirstName] cuts [spn_mo_carver.GetHerHis] finger carving the meat. A small cut. [spn_mo_carver.GetSheHe|U] wraps it in a napkin and laughs it off.\n\nYou can sense it from across the table: the warmth, the smell, the slow red spreading through the linen.\n\n[Glossary('#spn_thirst Tam paulum. Nemo desiderabit.#!','spn_gloss_thirst_paulum')]"
 spn_moment.0004.a:0 "I excuse myself"
 spn_moment.0004.b:0 "I stay at the table"
 spn_moment.0005.t:0 "Moon and Thirst"
 spn_moment.0005.desc:0 "The moon is full, and the thirst is on you at the same time. The wolf wants to run. The other thing wants blood.\n\nThey are both you, and they do not agree.\n\n[Glossary('#spn_wolf Hlaup.#!','spn_gloss_wolf_hlaup')] [Glossary('#spn_thirst Bibe.#!','spn_gloss_thirst_bibe')]"
 spn_moment.0005.a:0 "I let the wolf run"
 spn_moment.0005.b:0 "I let the thirst lead"
 spn_moment.0005.c:0 "I hold both and wait for dawn"
 spn_moment.0006.t:0 "A Grave You Know"
 spn_moment.0006.desc:0 "You pass the place where [spn_mo_grave.GetFirstName] is buried. The stone is old now and the name is hard to read.\n\nYou were already old when [spn_mo_grave.GetSheHe] was born. You are not old now."
 spn_moment.0006.a:0 "I stay a while"
 spn_moment.0006.b:0 "I keep walking"


### added by sync_localizations.py -- untranslated, 27 keys
 spn_moment.0001.c:0 "Still the finest face in any room"
 spn_moment.0001.d:0 "Vanity is for the short-lived"
 spn_moment.0004.c:0 "I watch the napkin go red"
 spn_moment.0004.d:0 "I pass the salt and think of nothing"
 spn_moment.0007.t:0 "The Feast"
 spn_moment.0007.desc:0 "The hall is full and loud. Course follows course, and [spn_mo_carver.GetFirstName] keeps filling your cup and asking why it is still full.\n\nEveryone here is eating. Everyone here is warm.\n\n[Glossary('#spn_thirst Omnes. Quemlibet.#!','spn_gloss_thirst_omnes')]"
 spn_moment.0007.a:0 "I push the food around until the plates are cleared"
 spn_moment.0007.b:0 "I watch the guests instead of the meat"
 spn_moment.0007.c:0 "A sip of wine is all I ever take"
 spn_moment.0007.d:0 "I keep the table laughing, and nobody looks at my plate"
 spn_moment.0007.e:0 "I leave before the second course"
 spn_moment.0008.t:0 "The Physician's Lancet"
 spn_moment.0008.desc:0 "[spn_mo_physician.GetFirstName] has decided that your humours are out of balance. [spn_mo_physician.GetSheHe|U] has the bowl ready, and the lancet, and the confident smile of someone who has bled a hundred patients.\n\nWhat comes out of your arm will not look like theirs."
 spn_moment.0008.a:0 "Not today. Not any day."
 spn_moment.0008.b:0 "Let [spn_mo_physician.GetHerHim] look, then make [spn_mo_physician.GetHerHim] forget"
 spn_moment.0008.c:0 "Nobody draws my blood"
 spn_moment.0008.d:0 "A servant is bled behind the screen. Show [spn_mo_physician.GetHerHim] that bowl."
 spn_moment.0009.t:0 "Asleep Against You"
 spn_moment.0009.desc:0 "[spn_mo_partner.GetFirstName] has fallen asleep against your shoulder, head tipped back, throat bare. The pulse is right there. You can count it without trying.\n\n[spn_mo_partner.GetSheHe|U] trusts you completely.\n\n[Glossary('#spn_thirst Haustus unus. Ne expergisceretur quidem.#!','spn_gloss_thirst_haustus')]"
 spn_moment.0009.a:0 "I lie still and listen to the heart"
 spn_moment.0009.b:0 "Only a little. [spn_mo_partner.GetSheHe|U] will never know."
 spn_moment.0009.c:0 "I get up and walk until dawn"
 spn_moment.0010.t:0 "Grace Before Meat"
 spn_moment.0010.desc:0 "[spn_mo_chaplain.GetFirstName] stands to bless the table. Every head bows. The words are old, and they are about light, and blood, and what waits for the wicked.\n\nThey sit differently on you than on everyone else here."
 spn_moment.0010.a:0 "I bow my head with the rest"
 spn_moment.0010.b:0 "The words still mean something to me"
 spn_moment.0010.c:0 "I smile through it. Words are only words."
