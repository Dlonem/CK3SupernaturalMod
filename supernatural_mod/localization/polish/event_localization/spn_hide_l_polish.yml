l_polish:
 spn_hide.0010.t:0 "The Hide Takes Hold"
 spn_hide.0010.desc_silverback:0 "The hide is heavier than it looks. You lay it across your shoulders and for a moment it is only an old grey skin that smells of smoke and cedar.\n\nThen it is not. Something goes into you at the back of the neck - cold, then warm. Your heart stumbles and finds a new rhythm. When you look down, the skin on your shoulders is just a skin again. What was in it is in you now.\n\nIt is Silverback, one of the six hides. It chose you. It will not let go."
 spn_hide.0010.desc_timber:0 "The hide is brown and stiff and smells of pine pitch. You put it on and the room goes very quiet.\n\nSomething slips into you the way a wolf slips between trees - no sound, no hurry. For a moment you can hear every breath in the hall, and you do not like any of them. Then the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Timber, one of the six hides. It chose you. It does not share."
 spn_hide.0010.desc_tundra:0 "The hide is white and colder than it should be. You put it on and your breath shows in a warm room.\n\nSomething settles into you slowly, like snow on still water. You find you are watching the faces around you, and you can tell which of them is lying. Then the cold is gone, and the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Tundra, one of the six hides. It chose you. It is patient, and now so are you."
 spn_hide.0010.desc_graybeard:0 "The hide is ash grey and scarred, old cuts that never closed. You put it on and your feet set themselves as if a shield wall were coming.\n\nSomething goes into you like iron into a mould. Your back straightens. The thought of stepping back leaves you and does not come back. Then the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Graybeard, one of the six hides. It chose you. It has never retreated."
 spn_hide.0010.desc_midnight:0 "The hide is black, and it is warm before you touch it. You put it on and your hands start to shake.\n\nSomething comes into you all at once, hungry and loud. You taste blood that is not there. You want to run, and you want something at the end of the run. Then it quiets, and the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Midnight, one of the six hides. It chose you. It will want things."
 spn_hide.0010.desc_alpha:0 "The hide is red-brown and heavy, and the dogs in the yard begin to howl. You put it on and every head in the hall turns to you.\n\nSomething goes into you and stands up straight. You know where each of your people is without looking, and what each of them is for. Then the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Alpha, the lost hide, the one that leads. It chose you. It expects to be followed."
 spn_hide.0010.a:0 "So be it."
 spn_hide.0010.a.tt:0 "You become its [spn_champion|E]. Its spirit is in you now: when you take the wolf's shape, the wolf is this hide's. You speak every tongue it took from the champions before you."
 spn_hide.0011.t:0 "It Will Not Have You"
 spn_hide.0011.desc_silverback:0 "You wear the grey hide for days and nothing happens. It is only a skin, and it smells of someone else's fire.\n\nYou dream of a wolf standing between a child and the dark. It looks at you a long time, and then it looks away."
 spn_hide.0011.desc_timber:0 "You wear the brown hide for days and nothing happens. It is stiff and smells of pine pitch, and that is all it is.\n\nYou dream of a wolf on a ridge, watching your fire. It never comes closer."
 spn_hide.0011.desc_tundra:0 "You wear the white hide for days and nothing happens. It stays cold on your shoulders, colder each morning.\n\nYou dream of a white wolf in the snow. It walks away before morning."
 spn_hide.0011.desc_graybeard:0 "You wear the grey hide for days and nothing happens. The old cuts in it never close, and it hangs off your back like a dead thing.\n\nYou dream of a grey wolf that will not look at you."
 spn_hide.0011.desc_midnight:0 "You wear the black hide for days and nothing happens. It stays warm on your shoulders, and it waits, and nothing comes.\n\nYou dream of a black wolf pacing past your fire. It does not come in."
 spn_hide.0011.desc_alpha:0 "You wear the red hide for days and nothing happens. Nobody looks at you any differently. The dogs do not even lift their heads.\n\nYou dream of a red wolf on a hill. It does not call you."
 spn_hide.0011.wants_silverback:0 "\n\nSilverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_timber:0 "\n\nTimber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_tundra:0 "\n\nTundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_graybeard:0 "\n\nGraybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_midnight:0 "\n\nMidnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
 spn_hide.0011.wants_alpha:0 "\n\nAlpha looks for a champion who is [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] or [GetTrait('arrogant').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] or [GetTrait('craven').GetName( GetNullCharacter )]."
 spn_hide.0011.why_none:0 " It found none of that in you, and the wolf in you does not yet run deep enough to make up for it."
 spn_hide.0011.why_outweighed:0 " It found some of it in you, and as much or more of what it turns from."
 spn_hide.0011.why_leader:0 " And it takes only a leader: the alpha of a pack, or a duke or higher."
 spn_hide.0011.why_leader_nopacks:0 " And it takes only a leader: a duke or higher, a True Werewolf, or a wolf whose lycanthropy is full."
 spn_hide.0011.a:0 "Then let it go."
 spn_hide.0011.a.tt:0 "The hide comes off. It will not look at you again for five years."
 spn_hide.0012.t:0 "Two Wolves"
 spn_hide.0012.desc:0 "There are two of them in you now, and they will not share.\n\n[spn_kept_hide.GetName] has been yours for years. It knows your hands and your temper, and it is angry. [spn_offered_hide.GetName] is new, and it is already pulling at you, sure of itself, asking to be let in.\n\nOne body. One wolf. You have to choose, and the one you put aside will not ask again for a long time."
 spn_hide.0012.a:0 "I keep [spn_kept_hide.GetName]."
 spn_hide.0012.a.tt:0 "The new hide comes off and stays in your keeping, unbound. Your own hide's [spn_hide_bond|E] grows."
 spn_hide.0012.b:0 "I keep [spn_offered_hide.GetName]."
 spn_hide.0012.b.tt:0 "Your old hide lets go of you and keeps what you were to it. The new one takes its place."
 spn_hide.0013.t:0 "It Knows You"
 spn_hide.0013.desc:0 "The hide has hung in your hall for years. Tonight it is on the floor, and the dogs will not go near it.\n\nWhen you pick it up, it is warm. Something that is not quite a voice tells you it has been watching you, and that it likes what it has seen. It is asking.\n\nIf you say yes, you will not be a man by morning."
 spn_hide.0013.a:0 "I heed the call."
 spn_hide.0013.a.tt:0 "You become a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], and in three days the hide takes you as its [spn_champion|E]."
 spn_hide.0013.b:0 "Not me."
 spn_hide.0013.b.tt:0 "You put it away. It will not ask you again for ten years."
 spn_hide.0014.t:0 "It Will Not Be Put Aside"
 spn_hide.0014.desc_silverback:0 "You put the hide away. It lasts a week.\n\nYou wake in the night with the hide across your knees and no memory of getting up. It is warm, as if someone had just been wearing it.\n\nSilverback does not rage. It waits. That is worse."
 spn_hide.0014.desc_timber:0 "You put the hide away. It lasts a week.\n\nOn the seventh night you find it at the foot of your bed, folded the way you would never fold it. The door is still barred.\n\nTimber says nothing. It never has. It simply will not be left behind."
 spn_hide.0014.desc_tundra:0 "You put the hide away. It lasts a week.\n\nYour hands are cold all the time now. On the seventh morning there is frost on the inside of the window, in the shape of a wolf lying down.\n\nTundra can wait longer than you can. It is letting you know."
 spn_hide.0014.desc_graybeard:0 "You put the hide away. It lasts a week.\n\nEvery day of it you feel the urge to step back from things - a door, a man, a hard word - and every day you hate it more.\n\nGraybeard does not argue. It only shows you who you are without it."
 spn_hide.0014.desc_midnight:0 "You put the hide away. It lasts a week.\n\nYou break a cup on the first day and a servant's arm on the fifth. On the seventh night you find the chest open and the hide in your hands, and you do not remember opening it.\n\nMidnight is furious. It wants to be worn."
 spn_hide.0014.desc_alpha:0 "You put the hide away. It lasts a week.\n\nYour people stop looking to you. Nobody says why. On the seventh day your own hounds walk past you to the hide in its chest and lie down beside it.\n\nAlpha does not beg. It reminds you what you are when it is not there."
 spn_hide.0014.a:0 "I put it back on."
 spn_hide.0014.a.tt:0 "The hide goes back on. Your [spn_hide_bond|E] drops a little."
 spn_hide.0014.b:0 "I needed to breathe."
 spn_hide.0014.b.tt:0 "The hide goes back on anyway. Your [spn_hide_bond|E] drops more, but the week did you good."
 spn_hide.0100.t:0 "It Speaks"
 spn_hide.0100.desc_silverback:0 "In the quiet before sleep, something speaks to you. Not in words - in a weight on your chest, steady, like a hand.\n\nIt is Silverback. It has been listening to you for a fortnight. It knows who sat beside you at supper and who you turned away at the door, and it has an opinion about both. Now it wants you to listen back."
 spn_hide.0100.desc_timber:0 "In the woods, alone, you hear it for the first time. Not a voice. A second set of footsteps that stop when yours do.\n\nIt is Timber. It has been with you for a fortnight and has not said a word, because it was deciding whether you were worth one. It does not trust you yet. It wants to know if you will listen."
 spn_hide.0100.desc_tundra:0 "At the table, between one word and the next, something cold notices a lie and points it out to you. The guest across from you goes on talking. He has no idea.\n\nIt is Tundra. It has been watching with your eyes. Now it is talking."
 spn_hide.0100.desc_graybeard:0 "On the practice ground a blade comes at you and your feet do not move. Something old and stubborn held them there. The blade stops a finger's width from your face, and the man holding it looks at you as if he has never seen you before.\n\nIt is Graybeard. It wants you to know it is here."
 spn_hide.0100.desc_midnight:0 "You wake with your teeth clenched and a name you do not know in your mouth. Something in you is pacing. Your knuckles are raw, and there is a fresh crack in the wall beside the bed.\n\nIt is Midnight. It has been quiet for two weeks. It is done being quiet."
 spn_hide.0100.desc_alpha:0 "In your hall, among your own people, something counts them for you - who is loyal, who is not, who could be more. The next morning you test it quietly on a few of them. It was right every time.\n\nIt is Alpha. It has started to speak. It expects an answer."
 spn_hide.0100.a:0 "I am listening."
 spn_hide.0100.a.tt:0 "The hide feels you answer. Your [spn_hide_bond|E] grows."
 spn_hide.0100.b:0 "Quiet."
 spn_hide.0100.b.tt:0 "It goes quiet. It does not go away."
 spn_hide.0101.t:0 "The Last One"
 spn_hide.0101.desc_silverback:0 "Silverback shows you a death. Not yours. Someone alone on a road at night, standing between a cart full of children and something with too many teeth. They did not move. The cart got away, and they never saw it go."
 spn_hide.0101.desc_timber:0 "Timber shows you a death. Someone alone in a winter forest, a long way from anyone, laughing at the hunters who came. Four of those hunters did not walk out of the trees, and nobody ever found the body."
 spn_hide.0101.desc_tundra:0 "Tundra shows you a death. Someone old in a warm room, poisoned by a friend of thirty years. They knew it before the cup was empty, and they smiled, because the friend had drunk from the other cup."
 spn_hide.0101.desc_graybeard:0 "Graybeard shows you a death. A line of shields breaking, and one shield in it that did not break. The enemy had to go around it, and by the time they were done going around, the day was lost to them."
 spn_hide.0101.desc_midnight:0 "Midnight shows you a death. A hall on fire, and someone in it still fighting, still laughing, long after they should have been dead. The roof came down before they did."
 spn_hide.0101.desc_alpha:0 "Alpha shows you a death. A grey wolf at the head of a great pack, old and slow, turning to face the young one who would replace it. It did not run. When it was over, the pack followed the young one home."
 spn_hide.0101.named:0 "\n\nIt was [spn_last_champ.GetName]. [spn_last_champ.GetSheHe|U] wore it before you."
 spn_hide.0101.unnamed:0 "\n\nYou do not know the name of the one before you. The hide does, and it does not say."
 spn_hide.0101.a:0 "I will honour them."
 spn_hide.0101.a.tt:0 "Your [spn_hide_bond|E] grows."
 spn_hide.0101.b:0 "The dead are dead."
 spn_hide.0101.b.tt:0 "The hide lets the memory go. It remembers that you did."
 spn_hide.0102.t:0 "What It Wants"
 spn_hide.0102.desc_silverback:0 "Silverback wants something of you. There are people in your care who cannot keep themselves safe, and it wants you to stand over them. It does not care whether they are kin or strangers, only that they are yours.\n\nIt shows you how. A wolf at the door. Nothing gets past."
 spn_hide.0102.desc_timber:0 "Timber wants something of you. You leave tracks. You leave stories. It wants you to learn to leave nothing at all, so that the best hunter in your lands could walk past you in the woods and never know.\n\nIt shows you how a trail goes cold."
 spn_hide.0102.desc_tundra:0 "Tundra wants something of you. Everyone around you is hiding something, and it wants to know what: the steward, the guest who smiles too much, the boy who brings the wine.\n\nIt shows you how to read a face."
 spn_hide.0102.desc_graybeard:0 "Graybeard wants something of you. When the line bends, it wants you to be the place where it does not. Men will hold if they see one man holding. It has watched that happen a hundred times.\n\nIt shows you how to hold."
 spn_hide.0102.desc_midnight:0 "Midnight wants something of you. In a battle you hold the wolf back, and it hates you for it. It wants, just once, to be let all the way out. It promises you will not remember much of it afterwards.\n\nIt shows you what that would look like."
 spn_hide.0102.desc_alpha:0 "Alpha wants something of you. There are other packs out there, scattered and small. It wants them called together. A wolf alone is hunted one at a time, and it remembers when wolves were not alone.\n\nIt shows you how to call."
 spn_hide.0102.a:0 "Show me."
 spn_hide.0102.a.tt:0 "Your [spn_hide_bond|E] grows. The hide's own action is open to you now."
 spn_hide.0102.b:0 "Not yet."
 spn_hide.0102.b.tt:0 "The hide's own action is open to you all the same. It wanted you to take it gladly."
 spn_hide.0103.t:0 "The Others"
 spn_hide.0103.desc_silverback:0 "Silverback tells you it was never alone. There are six of them. Some are worn. Some hang in holy places. One has been lost so long the others barely remember its smell. It speaks of them the way an old soldier speaks of the men he served with.\n\nIt wants you to know them."
 spn_hide.0103.desc_timber:0 "Timber tells you, grudgingly, that there are others like it. Six hides. It does not care for any of them, and there are some it has not seen in a hundred years and would happily make it two.\n\nIt wants you to know where they are anyway. A loner keeps track of the pack."
 spn_hide.0103.desc_tundra:0 "Tundra tells you there are six hides and lays them out in your mind like pieces on a board: who wears which, which hang in shrines, which are lost. It knows which of them would bargain, and which would lie about it.\n\nIt wants you to know the game."
 spn_hide.0103.desc_graybeard:0 "Graybeard tells you there are six hides, and that it has fought beside some of them and against others. It remembers which. It does not forgive easily, and it does not forget at all.\n\nIt wants you to know who stands where."
 spn_hide.0103.desc_midnight:0 "Midnight tells you there are five others, and that it has hated every one of them at some time or other. Silverback most of all. It says the name like a curse.\n\nIt wants you to find them. It does not say why."
 spn_hide.0103.desc_alpha:0 "Alpha tells you there were six, and that it was first among them. The others were its pack once. They scattered when it was lost, the way a pack does when its leader falls, and none of them has led since.\n\nIt wants them gathered again."
 spn_hide.0103.a:0 "I will seek them."
 spn_hide.0103.a.tt:0 "Your [spn_hide_bond|E] grows. The hide gives you something of what it knows."
 spn_hide.0103.b:0 "Let them be."
 spn_hide.0103.b.tt:0 "The hide gives you something of what it knows all the same."
 spn_hide.0104.t:0 "Leave My Mark"
 spn_hide.0104.desc_silverback:0 "On the longest night of the year the hide grows heavy, and you hear them.\n\nA man counting in a tongue you never learned. A woman praying to a god whose name is gone. Each of them wore Silverback to the end, and each of them left something of themselves in it. You have been speaking with their words for years without knowing it.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.desc_timber:0 "On the longest night of the year the hide grows heavy, and you hear them - a few voices, far apart, each of them alone.\n\nEach of them wore Timber to the end, and each left a little of themselves in it: a tongue, a habit, a grudge. You have been carrying them without knowing it.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.desc_tundra:0 "On the longest night of the year the hide grows cold, and you hear them - quiet voices, careful voices, each choosing its words.\n\nEach of them wore Tundra to the end, and each left something of themselves in it. You have been thinking with their thoughts for years.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.desc_graybeard:0 "On the longest night of the year the hide grows heavy, and you hear them - old soldiers, calling the line to hold in a dozen tongues.\n\nEach of them wore Graybeard to the end, and each left something in it. You have been giving their orders for years without knowing it.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.desc_midnight:0 "On the longest night of the year the hide grows hot, and you hear them - shouting, laughing, cursing, in tongues long dead.\n\nEach of them wore Midnight to the end, and each left something of their fire in it. You have been burning with it for years.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.desc_alpha:0 "On the longest night of the year the hide grows heavy, and you hear them - voices giving orders to packs long scattered.\n\nEach of them wore Alpha to the end, and each left something of themselves in it. You have been leading with their words without knowing it.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0104.a:0 "I will leave my mark."
 spn_hide.0104.a.tt:0 "Whoever wears the hide after you will start with half of your [spn_hide_bond|E]."
 spn_hide.0104.b:0 "My name is my own."
 spn_hide.0104.b.tt:0 "Nothing more of you goes into the hide."
 spn_hide.0105.t:0 "One Wolf"
 spn_hide.0105.desc_silverback:0 "One morning you cannot tell where you end and the hide begins. There is no voice any more. There is only you, and you are grey, and you are steady. The people in your care sleep better, and none of them knows why.\n\nSilverback is not in you. Silverback is you."
 spn_hide.0105.desc_timber:0 "One morning the silence in your head is not empty any more. It is yours. The hide has stopped speaking because there is nothing left to say. You walk through your own hall and nobody looks up, and you find you like it that way.\n\nTimber is not in you. Timber is you."
 spn_hide.0105.desc_tundra:0 "One morning you catch yourself smiling at a lie, and you cannot tell whose smile it is. It does not matter. You know what everyone at your table wants and what they would give for it, and none of it surprises you any more.\n\nTundra is not in you. Tundra is you."
 spn_hide.0105.desc_graybeard:0 "One morning you find you cannot remember ever having been afraid. You try. It is like trying to remember a stranger's face. When you stand your ground now, the people around you stand with you without being told.\n\nGraybeard is not in you. Graybeard is you."
 spn_hide.0105.desc_midnight:0 "One morning the fire is not something you hold down any more. It is simply how you are, the way a forge is hot. People feel it when you walk into a room, and most of them find a reason to leave.\n\nMidnight is not in you. Midnight is you."
 spn_hide.0105.desc_alpha:0 "One morning you walk into your hall and every living thing in it turns toward you, and you understand that it was always going to be this way. Wolves you have never met will know your name before the year is out.\n\nAlpha is not in you. Alpha is you."
 spn_hide.0105.a:0 "One wolf."
 spn_hide.0105.a.tt:0 "The hide gives you the last of what it has to give."
 spn_hide.0200.t:0 "The Wolf and the War"
 spn_hide.0200.desc:0 "There is a war, and you are in it. The hide knows before the messenger has finished speaking.\n\nIt can fight beside you on the field - not a man with a sword but the thing it is. Men will die who would have lived. Some of them will see what killed them, and some of the rest will talk.\n\nWhat will you let it do?"
 spn_hide.0200.a:0 "Let it run."
 spn_hide.0200.a.tt:0 "In battle the hide kills a few of the enemy's knights each time. Someone may see what you are."
 spn_hide.0200.b:0 "Hold it back."
 spn_hide.0200.b.tt:0 "You fight as a man. Nobody sees anything."
 spn_hide.0200.c:0 "Don't ask me again."
 spn_hide.0200.c.tt:0 "You will not be asked at the start of a war again. Let the Wolf Run and Hold the Wolf Back stay in your decisions."
 spn_hide.0201.t:0 "What the Men Saw"
 spn_hide.0201.open_two:0 "In the press of it you could have sworn there were two beasts on the field, not men."
 spn_hide.0201.open_one:0 "In the press of it you could have sworn there was a beast on the field, not a man."
 spn_hide.0201.kills_none:0 " Nobody fell to it that you know of, and nobody will say what it was."
 spn_hide.0201.theirs_1:0 " One of [spn_men_saw_victims.GetShortUIName]'s knights did not come back, and nobody will say what happened."
 spn_hide.0201.theirs_2:0 " Two of [spn_men_saw_victims.GetShortUIName]'s knights did not come back, and nobody will say how they died."
 spn_hide.0201.theirs_3:0 " Three of [spn_men_saw_victims.GetShortUIName]'s knights did not come back, and nobody will say how they died."
 spn_hide.0201.theirs_many:0 " More of [spn_men_saw_victims.GetShortUIName]'s knights did not come back than anyone wants to count, and nobody will say how they died."
 spn_hide.0201.ours_1:0 " One of our knights did not come back, and nobody will say what happened."
 spn_hide.0201.ours_2:0 " Two of our knights did not come back, and nobody will say how they died."
 spn_hide.0201.ours_3:0 " Three of our knights did not come back, and nobody will say how they died."
 spn_hide.0201.ours_many:0 " More of our knights did not come back than anyone wants to count, and nobody will say how they died."
 spn_hide.0201.close:0 "\n\nYour marshal says it was smoke and fear. Your soldiers say otherwise."
 spn_hide.0201.a:0 "Smoke and fear, then."
 spn_hide.0202.t:0 "Two Wolves on One Field"
 spn_hide.0202.desc:0 "Across the field you smelled it before you saw it - another hide, worn by [spn_field_foe.GetShortUIName].\n\nThe armies fought around the two of you and gave you room. Nobody watching knew what they saw. The hides knew. They have met before, a long time ago, in other skins."
 spn_hide.0202.a:0 "I will remember that one."
 spn_hide.0221.t:0 "Something Followed the Ringing"
 spn_hide.0221.desc_won:0 "You felt it before you saw it - something on your trail, quick and low, that came for you the moment your spell was done. It made no sound at all.\n\nIt was [spn_ring_champion.GetShortUIName], and [spn_ring_champion.GetSheHe] was not alone in that body. You drove it off. You will not forget its eyes."
 spn_hide.0221.desc_lost:0 "You felt it before you saw it - something on your trail, quick and low, that came for you the moment your spell was done. It made no sound at all.\n\nIt was [spn_ring_champion.GetShortUIName], and [spn_ring_champion.GetSheHe] was not alone in that body. It knocked you down, and left you there, and let you live."
 spn_hide.0221.a:0 "Whatever it is, it can hear magic."
 spn_hide.0300.t:0 "Something in Your Woods"
 spn_hide.0300.desc:0 "Your huntsmen come back pale. There is a wolf in your woods, white as bone and bigger than a pony, and it does not run from dogs. Two of the dogs did not come back.\n\nOne of the huntsmen swears it stopped on a ridge and looked straight at your hall. The others call him a fool, and none of them will go back in without you."
 spn_hide.0300.a:0 "Then we hunt it."
 spn_hide.0300.a.tt:0 "A legendary wolf has been sighted. Hold a legendary hunt to chase it down."
 spn_hide.0302.t:0 "It Is Still Out There"
 spn_hide.0302.desc:0 "The white wolf got away again. Your huntsmen found its tracks going up into the hills, unhurried. Where it had stopped to look back, the grass was pressed flat in a ring, as if it had lain there a long time waiting for you.\n\nIt will be back. It came here for a reason."
 spn_hide.0302.a:0 "Next time."
 spn_hide.0303.t:0 "It Came Out of the Trees"
 spn_hide.0303.desc:0 "A wolf walked out of the trees today, white and enormous, and lay down in front of you as if it had come a very long way.\n\nWhen you reached for it there was no wolf. There was only a hide on the ground, warm, and the feeling of being looked at. The horses will not come near it."
 spn_hide.0303.a:0 "I put it on."
 spn_hide.0303.a.tt:0 "The hide goes on. It will decide what you are to it."
 spn_hide.0303.b:0 "I leave it where it lies, for now."
 spn_hide.0304.t:0 "A Scent You Know"
 spn_hide.0304.desc:0 "In the middle of the hunt, with the dogs baying ahead, you stop. There is something on the wind that is not deer and not boar. The dogs have gone quiet, and every one of them is looking the same way.\n\nIt smells like you do when you are in the wolf's shape. Something old is out there, and it is lost."
 spn_hide.0304.a:0 "I will know it again."
 spn_hide.0305.t:0 "The Wolf That Was More Than a Wolf"
 spn_hide.0305.desc:0 "The white wolf is dead. Your huntsmen cheer, and then they stop, because the body on the ground is changing.\n\nWhen it is done there is a carcass for your hall and something else beside it: a hide, folded, warm, older than any of you. It does not belong to the wolf. The wolf belonged to it.\n\nIt has already decided about you."
 spn_hide.0305.a:0 "It came for me."
 spn_hide.0305.a.tt:0 "The hide is yours, and if you are a wolf it takes you as its [spn_champion|E]."
 spn_hide.0310.t:0 "Word Travels"
 spn_hide.0310.desc:0 "The [spn_shrine_faith.PriestNeuterPlural] of [spn_shrine_county.GetName] have a new relic, they say. An old skin, kept behind glass, that the faithful are allowed to touch on holy days. Pilgrims have started coming from three counties away, and some of them say it is warm to the touch.\n\nYou know what it is. You can almost smell it from here."
 spn_hide.0310.a:0 "Good to know."
 spn_hide.0320.t:0 "What the Beast Left"
 spn_hide.0320.desc:0 "The beast is dead, and it has a human shape again, lying where it fell.\n\nBeside the body is a hide you never saw it wearing. It is warm. It was not there a moment ago. Your men will not touch it.\n\nWhatever made the beast what it was is lying on the grass beside the body, and somebody has to decide what to do with it."
 spn_hide.0320.a:0 "I keep it."
 spn_hide.0320.a.tt:0 "A trophy no other hunter has. While you hold it, tracking wolves is easier."
 spn_hide.0320.b:0 "My lord should have it."
 spn_hide.0320.c:0 "It belongs to the [ROOT.Char.GetFaith.HouseOfWorship]."
 spn_hide.0320.c.tt:0 "It goes to the nearest holy site of your faith, to be kept as a holy relic."
 spn_hide.0320.d:0 "Burn it."
 spn_hide.0320.d.tt:0 "It will not burn. You keep it anyway, and you do not sleep well."
 spn_hide.0330.t:0 "The Unbinding"
 spn_hide.0330.desc:0 "[spn_unbinder.GetShortUIName] puts both hands on your chest and pulls, and something tears loose that was never meant to.\n\nYou are on the floor. The hide lies beside you, an old skin again. The wolf in you is still there - it was always yours - but it is smaller now, and alone."
 spn_hide.0330.a:0 "It is done."
 spn_hide.0331.t:0 "The Unbinding"
 spn_hide.0331.desc:0 "You take the hide's spirit out of [spn_unbound.GetShortUIName] the way you would draw a splinter, if the splinter fought back. It holds on to every part of [spn_unbound.GetHerHim] it can reach, and you have to take it out a piece at a time.\n\nIt is done. Your hands will not stop shaking for a week. Somewhere, something heard."
 spn_hide.0331.a:0 "Never again."
 spn_hide.0350.t:0 "A Hide in the Shrine"
 spn_hide.0350.desc:0 "[spn_siege_county.GetName] is yours. In its [spn_siege_faith.HouseOfWorship], behind a grille, the [spn_siege_faith.PriestNeuterPlural] keep an old skin they call a relic. They stand in front of it when your soldiers come in, as if that could stop anyone.\n\nIt is not a relic. It is [spn_siege_hide.GetName], and it turned its head toward you the moment you walked in."
 spn_hide.0350.a:0 "It comes with me."
 spn_hide.0350.a.tt:0 "You take the hide down and carry it away."
 spn_hide.0350.b:0 "Leave it where it hangs."
 spn_hide.0360.t:0 "The Relic at [spn_pilgrim_county.GetName]"
 spn_hide.0360.desc:0 "The pilgrims shuffle past the relic one by one and touch the glass. You know what is behind it. It is [spn_pilgrim_hide.GetName], and it knows you are here. The glass is warm where your hand rests on it.\n\nThe [spn_pilgrim_faith.PriestNeuterPlural] are tired. The crowd is thick. A careful hand could do it."
 spn_hide.0360.a:0 "Walk out with it."
 spn_hide.0360.a.success:0 "Nobody sees a thing."
 spn_hide.0360.a.failure:0 "Somebody sees."
 spn_hide.0360.b:0 "Not here. Not like this."
 spn_hide.0370.t:0 "You Answered for [spn_guarded.GetShortUIName]"
 spn_hide.0370.desc:0 "A hunter came for [spn_guarded.GetShortUIName], and found you standing in the doorway instead. The hunter had come ready for one kind of monster and found another.\n\nSilverback did not let you hesitate. It never has."
 spn_hide.0370.a:0 "Nothing gets past."
 spn_hide.0380.t:0 "Send for a Hide"
 spn_hide.0380.desc:0 "Some of the hides hang in shrines a long way from here. A shrine is only a building, and a careful man with silver in his purse can walk out of one with a relic under his cloak.\n\nChoose the hide. The farther away it is kept, the longer it will be before you hear anything."
 spn_hide.0380.silverback:0 "Silverback, at [spn_sf_county_silverback.GetName]"
 spn_hide.0380.timber:0 "Timber, at [spn_sf_county_timber.GetName]"
 spn_hide.0380.tundra:0 "Tundra, at [spn_sf_county_tundra.GetName]"
 spn_hide.0380.graybeard:0 "Graybeard, at [spn_sf_county_graybeard.GetName]"
 spn_hide.0380.midnight:0 "Midnight, at [spn_sf_county_midnight.GetName]"
 spn_hide.0380.alpha:0 "Alpha, at [spn_sf_county_alpha.GetName]"
 spn_hide.0380.go_tt:0 "Your man sets out. When he reaches the shrine, you decide whether he takes it."
 spn_hide.0380.none:0 "Not yet."
 spn_hide.0381.t:0 "Word from [spn_errand_county.GetName]"
 spn_hide.0381.found:0 "A letter comes from [spn_errand_county.GetName]. Your man has found the [spn_errand_faith.HouseOfWorship], and [spn_errand_hide.GetName] hangs inside it, where anyone can see it.\n\nThe [spn_errand_faith.PriestNeuterPlural] lock the doors at night and sleep soundly. He is waiting for your word."
 spn_hide.0381.gone:0 "A letter comes from [spn_errand_county.GetName]. Your man found the shrine, but the hide was gone before he got there. Nobody would say where.\n\nHe is coming home with nothing but the story."
 spn_hide.0381.a:0 "Take it."
 spn_hide.0381.a.success:0 "It is on its way to you."
 spn_hide.0381.a.failure:0 "He is caught, and they know who sent him."
 spn_hide.0381.b:0 "Bring him home."
 spn_hide.0381.c:0 "So be it."
