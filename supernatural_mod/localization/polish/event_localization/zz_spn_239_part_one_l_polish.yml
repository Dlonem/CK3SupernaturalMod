l_polish:
 spn_council_seats_distinct_tt:0 "No one on the Gnostic Council holds two seats"
 spn_order.0140.c:0 "Not yet. I follow another path"
 spn_order.0140.c.tt:0 "Your teaching is complete, and you can still be raised to Medicum. You do not become a Mage, so the Warlock and True Witch paths stay open to you."
 spn_council_dedupe_toast:0 "You Gave Up a Council Seat"
 spn_council_dedupe_keeper_tt:0 "No one may hold two seats on the Gnostic Council. You kept the chair and gave up the seat of Keeper of the Reliquary."
 spn_council_dedupe_adeptus_tt:0 "No one may hold two seats on the Gnostic Council. You kept the higher seat and gave up the seat of Adeptus Major."
 spn_council_dedupe_chancellor_tt:0 "No one may hold two seats on the Gnostic Council. You kept the higher seat and gave up the seat of Chancellor."
