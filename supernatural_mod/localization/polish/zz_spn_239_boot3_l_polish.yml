l_polish:
 spn_vade.0099.t:0 "The Hide Remembers"
 spn_vade.0099.desc:0 "The hide wakes you before dawn with a memory that is not yours. A book bound in something that was once alive, passed from hand to hand in the dark: a demon's handbook, the [Glossary('Vade Maecum Infernal','spn_gloss_vade_maecum')].\n\nSomeone tore it into four, long ago, and scattered the pages so that no one would ever hold it whole. The pages are still out there. The hide knows the smell of them, and now so do you."
 spn_vade.0099.a:0 "So that is what it wants."
 spn_order.0840.desc_research:0 "Your work on the deeper workings has taken you somewhere the [spn_order|E] never meant you to go. You have found the edge of a spell that nobody taught you.\n\nThe oldest member of the [spn_gnostic_council|E] finds you before you finish it. "So you found the [Glossary('Fors Factorum','spn_gloss_fors_factorum')] on your own. Then you may as well learn it properly. It lets you work magic without paying for it."\n\n"You pay later. It eats you slowly, like a cancer. Do you still want it?""
 spn_order_invite_interaction:0 "Invite into the Order"
 spn_order_invite_interaction_desc:0 "Name this person yourself. The Order's note will find them, unsigned, the way it finds everyone the temples choose."
 spn_order_invite_interaction_tt:0 "The Order's note will find [recipient.GetFirstName]. If [recipient.GetSheHe] answers it, [recipient.GetSheHe] comes to your temple as a [Glossary('Neophyte','spn_gloss_neophyte')]. If not, you will hear nothing."
 spn_order_invite_free_tt:0 "[recipient.GetFirstName] must be free to answer."
 spn_hide.0311.t:0 "A Tale on the Road"
 spn_hide.0311.desc:0 "The innkeeper tells the story to anyone who will buy him a drink. The [spn_shrine_faith.PriestNeuterPlural] of [spn_shrine_county.GetName] keep an old wolf skin behind their altar, and on holy days the faithful are let in to touch it. Some of them swear it is warm.\n\nHe laughs when he says it. You do not."
 spn_hide.0311.a:0 "Remember the place."
 spn_hide.0311.a.tt:0 "You know where the hide is kept."
 spn_zecchia_victim_tt:0 "It was taken in the night. Nobody saw who took it."
